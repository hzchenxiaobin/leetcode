<svg xmlns="http://www.w3.org/2000/svg" width="640" height="436" viewBox="0 0 640 436" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="436" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：正难则反 —— 好分区 = 2ⁿ − 两个对称的「坏尾巴」</text>
  <text x="320" y="52" text-anchor="middle" font-size="11.5" fill="#666">n 个元素各自独立进组 1 / 组 2 ⟹ 总分区 2ⁿ；分区 ↔ 组 1 的子集，只需盯住 sum₁ = 组 1 的元素和</text>

  <!-- left bad zone -->
  <g filter="url(#sk)"><rect x="60" y="84" width="140" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="130" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a">坏分区</text>
  <text x="130" y="123" text-anchor="middle" font-size="11.5" fill="#8a3a3a">组 1 和 &lt; k</text>
  <text x="130" y="137" text-anchor="middle" font-size="10.5" fill="#b85450">共 bad 种</text>

  <!-- middle good zone -->
  <g filter="url(#sk)"><rect x="200" y="84" width="240" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <text x="320" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">好分区（所求）</text>
  <text x="320" y="123" text-anchor="middle" font-size="11.5" fill="#2e5e2e">k ≤ sum₁ ≤ S−k（两个和都 ≥ k）</text>

  <!-- right bad zone -->
  <g filter="url(#sk)"><rect x="440" y="84" width="140" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="510" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a">坏分区</text>
  <text x="510" y="123" text-anchor="middle" font-size="11.5" fill="#a06a1a">组 2 和 &lt; k</text>
  <text x="510" y="137" text-anchor="middle" font-size="10.5" fill="#d6a040">共 bad 种</text>

  <!-- number line -->
  <path d="M 56 170 L 584 170" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 60 162 L 60 178" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 200 162 L 200 178" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 440 162 L 440 178" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 580 162 L 580 178" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="60" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">0</text>
  <text x="200" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">k</text>
  <text x="440" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">S−k</text>
  <text x="580" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">S</text>
  <text x="578" y="160" text-anchor="end" font-size="10" fill="#888">sum₁ 轴</text>

  <!-- annotations -->
  <text x="130" y="220" text-anchor="middle" font-size="11" fill="#b85450">sum₁ &lt; k</text>
  <text x="510" y="220" text-anchor="middle" font-size="11" fill="#d6a040">S − sum₁ &lt; k</text>
  <text x="320" y="220" text-anchor="middle" font-size="10.5" fill="#888">（组 1 的元素和 sum₁ 从 0 走到 S）</text>

  <!-- box 1: symmetry -->
  <g filter="url(#sk)"><rect x="48" y="246" width="544" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="266" text-anchor="middle" font-size="12" fill="#2b4a66">对称性：交换两组标签是全体分区上的双射 ⟹ 左右两块坏区一样大，都记作 bad</text>
  <text x="320" y="284" text-anchor="middle" font-size="10.5" fill="#66788a">「组 1 和 &lt; k」与「组 2 和 &lt; k」的分区数相等</text>

  <!-- box 2: disjoint -->
  <g filter="url(#sk)"><rect x="48" y="306" width="544" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="320" y="326" text-anchor="middle" font-size="12" fill="#8a6a2a">S ≥ 2k ⟹ S−k ≥ k：两块坏区不相交（若两组都 &lt; k，相加得 S &lt; 2k，矛盾）</text>
  <text x="320" y="344" text-anchor="middle" font-size="10.5" fill="#a08040">反面事件只有这两类 ⟹ 坏分区总数 = 2·bad（容斥，交集为空）</text>

  <!-- box 3: formula -->
  <g filter="url(#sk)"><rect x="48" y="366" width="544" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="320" y="388" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e">答案 = 2ⁿ − 2·bad (mod 10⁹+7)；若 S &lt; 2k 则无好分区，直接返回 0</text>
  <text x="320" y="408" text-anchor="middle" font-size="10.5" fill="#4a7a3a">bad = 「和 &lt; k 的子集个数」，用 0-1 背包在容量 k−1 内统计</text>
</svg>
