<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="600" height="320" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333">每条边用 0/1 次：节点只关心“被翻的奇偶性”</text>

  <circle cx="120" cy="120" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="126" text-anchor="middle" font-size="13" fill="#333">0</text>
  <circle cx="240" cy="90" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="96" text-anchor="middle" font-size="13" fill="#b85450">3</text>
  <circle cx="240" cy="180" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="186" text-anchor="middle" font-size="13" fill="#333">2</text>
  <circle cx="370" cy="120" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="126" text-anchor="middle" font-size="13" fill="#b85450">6</text>

  <path d="M144,112 L214,96" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="94" font-size="11" fill="#446688">e0</text>
  <path d="M240,116 L240,152" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="140" font-size="11" fill="#446688">e1</text>
  <path d="M300,166 L262,186" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M344,128 L266,178" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="150" font-size="11" fill="#446688">e5</text>

  <rect x="60" y="226" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="252" font-size="11" fill="#333">坏节点 B = {3, 6}：每个节点的“被翻次数 mod 2”必须等于它是否属于 B</text>

  <rect x="60" y="278" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="300" font-size="11" fill="#4a7a3a">|B| 必须为偶数，否则无解；解在树上唯一 ⇒ 即最短解</text>
</svg>
