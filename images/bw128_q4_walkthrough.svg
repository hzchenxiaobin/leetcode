<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">演算：nums = [1,4,3,3,2]，逐步累加 ans</text>

  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <rect x="40" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="100" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="160" y="44" width="190" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="350" y="44" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="430" y="44" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="61">i</text><text x="130" y="61">x</text><text x="255" y="61">处理后的栈</text>
    <text x="390" y="61">新增区间</text><text x="475" y="61">ans 累计</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="74" width="60" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="100" y="74" width="60" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="160" y="74" width="190" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="350" y="74" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="430" y="74" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="106" width="60" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="100" y="106" width="60" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="160" y="106" width="190" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="350" y="106" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="430" y="106" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="138" width="60" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="100" y="138" width="60" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="160" y="138" width="190" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="350" y="138" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="430" y="138" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="170" width="60" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="100" y="170" width="60" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="160" y="170" width="190" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="350" y="170" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="430" y="170" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="40" y="202" width="60" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="100" y="202" width="60" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="160" y="202" width="190" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="350" y="202" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="430" y="202" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="92">0</text><text x="130" y="92">1</text><text x="255" y="92">(1, 1)</text>
    <text x="390" y="92">1</text><text x="475" y="92">1</text>
    <text x="70" y="124">1</text><text x="130" y="124">4</text><text x="255" y="124">(4, 1)</text>
    <text x="390" y="124">1</text><text x="475" y="124">2</text>
    <text x="70" y="156">2</text><text x="130" y="156">3</text><text x="255" y="156">(4,1) (3,1)</text>
    <text x="390" y="156">1</text><text x="475" y="156">3</text>
    <text x="70" y="188">3</text><text x="130" y="188">3</text><text x="255" y="188">(4,1) (3,2)</text>
    <text x="390" y="188">2</text><text x="475" y="188">5</text>
    <text x="70" y="220">4</text><text x="130" y="220">2</text><text x="255" y="220">(4,1) (3,2) (2,1)</text>
    <text x="390" y="220">1</text><text x="475" y="220">6</text>
  </g>

  <rect x="40" y="244" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="265" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">最终 ans = 6，与题面一致（注意 i=3 一次新增 2 个）</text>
  <rect x="40" y="282" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">新增数 =（栈顶同值计数）+ 1（单元素），没有同值就只 +1</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个元素至多入栈、出栈各一次 ⇒ 总时间 O(n)</text>
</svg>
