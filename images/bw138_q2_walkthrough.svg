<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "mxz"，k = 3</text>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只有一块，块内三个字母的哈希值求和后取模</text>

  <g filter="url(#rough2)">
    <rect x="112" y="72" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="170" y="72" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="228" y="72" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="138" y="97" fill="#3a5a30">m</text>
    <text x="196" y="97" fill="#3a5a30">x</text>
    <text x="254" y="97" fill="#3a5a30">z</text>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#8a6a20">
    <text x="138" y="128">12</text>
    <text x="196" y="128">23</text>
    <text x="254" y="128">25</text>
  </g>

  <path d="M 196 136 L 196 160" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="92" y="162" width="208" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="106" y="182" font-size="11" fill="#3a4a66" filter="url(#rough2)">12 + 23 + 25 = 60</text>
  <text x="106" y="199" font-size="10.5" fill="#555" filter="url(#rough2)">哈希值之和（未取模）</text>

  <path d="M 196 206 L 196 230" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="92" y="232" width="208" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="106" y="252" font-size="11" fill="#8a6a20" filter="url(#rough2)">60 % 26 = 8</text>
  <text x="106" y="269" font-size="10.5" fill="#555" filter="url(#rough2)">对 26 取余，结果落在 0..25</text>

  <path d="M 196 276 L 196 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="92" y="302" width="208" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="106" y="322" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">8 → 'i'（a 往后数 8 位）</text>
  <text x="106" y="339" font-size="10.5" fill="#555" filter="url(#rough2)">于是 result = "i"</text>

  <rect x="324" y="162" width="164" height="184" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="406" y="186" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">逐步对照</text>
  <text x="338" y="212" font-size="10.5" fill="#555" filter="url(#rough2)">块数 = 3 / 3 = 1</text>
  <text x="338" y="234" font-size="10.5" fill="#555" filter="url(#rough2)">sum = 60</text>
  <text x="338" y="256" font-size="10.5" fill="#555" filter="url(#rough2)">hashedChar = 8</text>
  <text x="338" y="278" font-size="10.5" fill="#555" filter="url(#rough2)">result 长度 = 1</text>
  <text x="338" y="306" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">60 = 2 × 26 + 8</text>
  <text x="338" y="328" font-size="10" fill="#888" filter="url(#rough2)">余数 8 即 'i'</text>
</svg>
