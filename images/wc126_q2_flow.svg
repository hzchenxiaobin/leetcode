<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：push → 判栈顶 → 弹 3 个</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每个字符至多入栈、出栈各一次，O(n)</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="160" y="70" width="250" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="285.0" y="94.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">读入 ch，st.push(ch)</text>
  <path d="M 285.0 110.0 L 285.0 136.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="285,136 435,166 285,196 135,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="285.0" y="171.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">栈顶三字符 == abc ?</text>
  <path d="M 435.0 166.0 L 480.0 166.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="486.0" y="170.0" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="486" y="148" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="521.0" y="170.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">pop ×3</text>
  <path d="M 150.0 196.0 L 150.0 240.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="158.0" y="222.0" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">否（继续读）</text>
  <rect x="60" y="240" width="180" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150.0" y="263.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">还有字符？</text>
  <path d="M 240.0 259.0 L 280.0 259.0" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="286.0" y="263.0" font-size="11" fill="#d6a040" text-anchor="start" filter="url(#rough2)">是 → 回到 push</text>
  <path d="M 150.0 278.0 L 150.0 300.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="300" width="180" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150.0" y="323.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">否：返回 st.empty()</text>
  <rect x="300" y="292" width="254" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310.0" y="313.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">栈空 → 有效</text>
  <text x="310.0" y="329.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">有残留 → 无效</text>
</svg>
