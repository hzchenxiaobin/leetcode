<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="520" height="384" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">一次循环喂两个累加器：P 乘、S 加</text>
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">循环不变量：每轮结束后，P 是已取出位之积，S 是已取出位之和</text>

  <!-- 初始化 -->
  <rect x="150" y="58" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="13" fill="#2f4a66">P = 1，S = 0</text>
  <path d="M260,96 L260,110" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,112 350,145 260,178 170,145" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="12.5" fill="#8a6a20">n &gt; 0 ?</text>

  <!-- 是分支 -->
  <path d="M260,178 L260,194" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="190" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="175" y="196" width="170" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="12.5" fill="#2f4a66">d = n % 10</text>
  <path d="M260,232 L260,246" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="158" y="248" width="204" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11.5" fill="#3d6b2f">P *= d ；S += d</text>
  <path d="M260,286 L260,300" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="302" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12.5" fill="#2f4a66">n //= 10</text>

  <!-- 回边 -->
  <path d="M175,319 L96,319 L96,145 L166,145" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="76" y="240" text-anchor="middle" font-size="10" fill="#b85450" transform="rotate(-90 76 240)" filter="url(#rough2)">还有位，回去继续</text>

  <!-- 否分支 -->
  <path d="M350,145 L378,145" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="137" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="380" y="118" width="126" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="443" y="141" text-anchor="middle" font-size="11" fill="#8c3b36">返回</text>
  <text x="443" y="161" text-anchor="middle" font-size="12" fill="#8c3b36">P − S</text>

  <text x="260" y="366" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">循环结束时 n = 0，所有十进制位都恰好参与过一次累乘与累加</text>
</svg>
