<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">反向扫描 + 计数器：一趟写定，最后整体翻转</text>

  <ellipse cx="280" cy="56" rx="48" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="61" font-size="12" fill="#7a5a18" text-anchor="middle" filter="url(#rough2)">开始</text>
  <path d="M 280 73 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="186" y="94" width="228" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="116" font-size="12" fill="#2f4f6f" text-anchor="middle" filter="url(#rough2)">i 从 n−1 递减到 0，cnt = 0</text>

  <path d="M 305 128 L 305 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="305,162 412,200 305,238 198,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="305" y="204" font-size="11.5" fill="#7a5a18" text-anchor="middle" filter="url(#rough2)">s[i] == '-' ？</text>

  <path d="M 198 200 L 150 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="34" y="184" width="116" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="92" y="204" font-size="11" fill="#8a3b37" text-anchor="middle" filter="url(#rough2)">跳过该字符</text>
  <path d="M 92 184 L 92 111 L 182 111" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="176" font-size="9" fill="#b85450" text-anchor="start" filter="url(#rough2)">是（破折号一律丢弃）</text>

  <path d="M 305 238 L 305 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="305,272 405,310 305,348 205,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="305" y="314" font-size="11.5" fill="#7a5a18" text-anchor="middle" filter="url(#rough2)">cnt == k ？</text>

  <path d="M 405 310 L 452 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="454" y="292" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="502" y="308" font-size="10.5" fill="#3c6630" text-anchor="middle" filter="url(#rough2)">追加 '-'</text>
  <text x="502" y="322" font-size="10.5" fill="#3c6630" text-anchor="middle" filter="url(#rough2)">cnt ← 0</text>
  <text x="410" y="284" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">是</text>

  <path d="M 502 328 L 502 388 L 440 388" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 305 348 L 305 368" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="168" y="370" width="266" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="301" y="393" font-size="12" fill="#2f4f6f" text-anchor="middle" filter="url(#rough2)">追加 toupper(s[i])，cnt++</text>

  <path d="M 301 406 L 301 428" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="168" y="430" width="266" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="301" y="452" font-size="12" fill="#7a5a18" text-anchor="middle" filter="url(#rough2)">遍历结束后，把暂存串整体反转</text>

  <path d="M 301 464 L 301 482" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="280" cy="498" rx="96" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="503" font-size="11.5" fill="#3c6630" text-anchor="middle" filter="url(#rough2)">输出 "2-5G-3J"</text>
</svg>
