<svg xmlns="http://www.w3.org/2000/svg" width="740" height="560" viewBox="0 0 740 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="740" height="560" fill="#fdfcf7"/>
  <text x="370" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">候选闭包：层状嵌套 + 右端点互异 → 最早结束贪心</text>
  <path d="M 150 38 Q 370 46 590 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== string cells ===== -->
  <g filter="url(#sk)">
    <rect x="100" y="52" width="44" height="28" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="144" y="52" width="44" height="28" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="188" y="52" width="44" height="28" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="232" y="52" width="44" height="28" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="276" y="52" width="44" height="28" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="320" y="52" width="44" height="28" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="364" y="52" width="44" height="28" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="408" y="52" width="44" height="28" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="452" y="52" width="44" height="28" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="496" y="52" width="44" height="28" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="540" y="52" width="44" height="28" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#sk)">
    <text x="122" y="71">a</text>
    <text x="166" y="71">d</text>
    <text x="210" y="71">e</text>
    <text x="254" y="71">f</text>
    <text x="298" y="71">a</text>
    <text x="342" y="71">d</text>
    <text x="386" y="71">d</text>
    <text x="430" y="71">a</text>
    <text x="474" y="71">c</text>
    <text x="518" y="71">c</text>
    <text x="562" y="71">c</text>
  </g>
  <g font-size="8.5" text-anchor="middle" fill="#999999" filter="url(#sk)">
    <text x="122" y="92">0</text>
    <text x="166" y="92">1</text>
    <text x="210" y="92">2</text>
    <text x="254" y="92">3</text>
    <text x="298" y="92">4</text>
    <text x="342" y="92">5</text>
    <text x="386" y="92">6</text>
    <text x="430" y="92">7</text>
    <text x="474" y="92">8</text>
    <text x="518" y="92">9</text>
    <text x="562" y="92">10</text>
  </g>

  <!-- ===== candidates ===== -->
  <text x="100" y="118" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">去重后的 4 个候选闭包（按右端点排序的扫描顺序 ①→④）：</text>
  <g font-size="9.5" fill="#555" filter="url(#sk)">
    <text x="16" y="144">① e [2,2]</text>
    <text x="16" y="164">② f [3,3]</text>
    <text x="16" y="184">③ a,d [0,7]</text>
    <text x="16" y="204">④ c [8,10]</text>
  </g>
  <g filter="url(#sk)">
    <rect x="188" y="132" width="44" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="232" y="152" width="44" height="16" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="100" y="172" width="352" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="452" y="192" width="132" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="100" y="224" font-size="10.5" fill="#555" filter="url(#sk)">[2,2]、[3,3] 嵌套于 [0,7] 内部，[8,10] 相离——层状：相交必嵌套（引理 3），右端点互不相同（引理 4）</text>

  <!-- ===== greedy console ===== -->
  <g filter="url(#sk)">
    <rect x="36" y="240" width="430" height="190" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  </g>
  <text x="56" y="262" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">贪心扫描（lastEnd 初值 −1）：</text>
  <g font-size="10.5" filter="url(#sk)">
    <text x="56" y="286" fill="#333">① [2,2]&#160;&#160;st=2 &gt; −1&#160;&#160;<tspan fill="#4a7a3a" font-weight="bold">✓ 选 "e"</tspan>&#160;&#160;lastEnd→2</text>
    <text x="56" y="308" fill="#333">② [3,3]&#160;&#160;st=3 &gt; 2&#160;&#160;&#160;<tspan fill="#4a7a3a" font-weight="bold">✓ 选 "f"</tspan>&#160;&#160;lastEnd→3</text>
    <text x="56" y="330" fill="#333">③ [0,7]&#160;&#160;st=0 ≤ 3&#160;&#160;&#160;<tspan fill="#b85450" font-weight="bold">✗ 跳过</tspan>（与 e/f 重叠）</text>
    <text x="56" y="352" fill="#333">④ [8,10]&#160;st=8 &gt; 3&#160;&#160;<tspan fill="#4a7a3a" font-weight="bold">✓ 选 "ccc"</tspan>&#160;lastEnd→10</text>
  </g>
  <text x="56" y="384" font-size="10" fill="#888" filter="url(#sk)">候选至多 26 个——排序贪心部分 O(σ log σ)，</text>
  <text x="56" y="402" font-size="10" fill="#888" filter="url(#sk)">真正的开销全在闭包扩张上。</text>
  <text x="56" y="422" font-size="10" fill="#888" filter="url(#sk)">（σ = 26，字符集大小）</text>

  <!-- ===== right notes ===== -->
  <g filter="url(#sk)">
    <rect x="486" y="240" width="218" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="500" y="262" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">为什么先选小右端点？</text>
  <text x="500" y="282" font-size="10" fill="#446688" filter="url(#sk)">结束越早，给后面候选</text>
  <text x="500" y="298" font-size="10" fill="#446688" filter="url(#sk)">留的空隙越多——经典</text>
  <text x="500" y="314" font-size="10" fill="#446688" filter="url(#sk)">「最早结束」活动选择。</text>
  <g filter="url(#sk)">
    <rect x="486" y="342" width="218" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="500" y="364" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">反例：按左端点排序</text>
  <text x="500" y="384" font-size="10" fill="#b85450" filter="url(#sk)">先选 [0,7] → e、f 全被</text>
  <text x="500" y="400" font-size="10" fill="#b85450" filter="url(#sk)">压住，只剩 [8,10] 可选</text>
  <text x="500" y="416" font-size="10" fill="#b85450" filter="url(#sk)">→ 只得 2 段（错误）</text>

  <!-- ===== result ===== -->
  <g filter="url(#sk)">
    <rect x="36" y="448" width="668" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="56" y="474" font-size="12" font-weight="bold" fill="#2e5e24" filter="url(#sk)">答案 ["e","f","ccc"]——3 段，总长 1+1+3 = 5</text>
  <text x="56" y="498" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">"ef" 虽合法，却同时包含两个闭包 [2,2]、[3,3] → 拆开数目更多；闭包的「极小性」保证了它不被任何子串支配。</text>
  <text x="56" y="518" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">"adefadda"（[0,7]）结束晚、长度大，与 e、f 重叠，让位于更早结束的短候选——数目、长度双双最优。</text>
</svg>
