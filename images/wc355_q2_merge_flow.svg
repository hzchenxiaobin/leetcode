<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 545" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="800" height="545" fill="#fdfcf7"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一趟从右往左，每个元素在「吸收 / 重置」中二选一</text>
  <path d="M 160 42 Q 400 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- A: init -->
  <g filter="url(#sk)"><rect x="280" y="62" width="240" height="42" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="400" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">cur ← nums[n−1]（最右元素）</text>
  <line x1="400" y1="104" x2="400" y2="126" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>

  <!-- B: loop header -->
  <g filter="url(#sk)"><rect x="280" y="128" width="240" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="400" y="152" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">i 从 n−2 往左走到 0（步长 −1）</text>
  <line x1="400" y1="168" x2="400" y2="190" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>

  <!-- C: diamond -->
  <g filter="url(#sk)"><polygon points="400,194 505,242 400,290 295,242" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="400" y="247" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">nums[i] ≤ cur ?</text>

  <!-- C-yes -> absorb -->
  <line x1="295" y1="242" x2="234" y2="242" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>
  <text x="264" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="60" y="220" width="170" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="145" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">cur += nums[i]</text>
  <text x="145" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">（吸收：块向左长一格）</text>

  <!-- C-no -> reset -->
  <line x1="505" y1="242" x2="566" y2="242" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>
  <text x="536" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="570" y="220" width="170" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="655" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a36" filter="url(#sk)">cur = nums[i]</text>
  <text x="655" y="256" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">（重置：自立门户）</text>

  <!-- elbows down into loop tail -->
  <path d="M 145 264 L 145 349 L 272 349" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>
  <path d="M 655 264 L 655 349 L 528 349" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>

  <!-- loop tail -->
  <g filter="url(#sk)"><rect x="280" y="330" width="240" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="400" y="354" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">i 自减，继续向左</text>

  <!-- loop-back rail -->
  <path d="M 340 330 L 340 314 L 268 314 L 268 148 L 272 148" fill="none" stroke="#666" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrF)" filter="url(#sk)"/>
  <text x="256" y="140" text-anchor="end" font-size="10.5" fill="#777" filter="url(#sk)">还有元素 → 回到判断</text>

  <!-- exit to end -->
  <line x1="400" y1="368" x2="400" y2="390" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>
  <text x="418" y="382" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">i &lt; 0（扫完）</text>
  <g filter="url(#sk)"><rect x="280" y="392" width="240" height="42" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9"/></g>
  <text x="400" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">扫描结束 → 返回 cur ✓</text>

  <!-- bottom notes -->
  <g filter="url(#sk)"><rect x="40" y="450" width="350" height="78" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="58" y="472" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">为什么不用 ans = max(ans, cur)？</text>
  <text x="58" y="490" font-size="10.5" fill="#555" filter="url(#sk)">全正数 ⟹ cur 每步严格递增：</text>
  <text x="58" y="506" font-size="10.5" fill="#555" filter="url(#sk)">吸收加正数；重置必是跳到更大的值</text>
  <text x="58" y="522" font-size="10.5" fill="#555" filter="url(#sk)">→ 终值 = 途中一切 cur 的最大值</text>

  <g filter="url(#sk)"><rect x="410" y="450" width="350" height="78" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="428" y="472" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">复杂度与语言要点</text>
  <text x="428" y="490" font-size="10.5" fill="#555" filter="url(#sk)">时间 O(n)：每元素一次比较 + 一次赋值</text>
  <text x="428" y="506" font-size="10.5" fill="#555" filter="url(#sk)">空间 O(1)：只多用一个累加器 cur</text>
  <text x="428" y="522" font-size="10.5" fill="#555" filter="url(#sk)">C++ 用 long long（总和可达 10^11）</text>
</svg>
