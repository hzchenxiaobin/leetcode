<svg xmlns="http://www.w3.org/2000/svg" width="940" height="740" viewBox="0 0 940 740" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="740" fill="#fdfcf7"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：按奇点个数 k 分类处理</text>
  <path d="M 200 40 Q 470 48 740 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="110" y="44" width="260" height="54" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="240" y="66" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#sk)">统计 deg[1..n]</text>
  <text x="240" y="86" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#sk)">收集奇点 odd，k = |odd|</text>

  <path d="M 240 98 L 240 126" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D1: k > 4 ? -->
  <polygon points="240,130 335,166 240,202 145,166" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">k &gt; 4 ?</text>
  <text x="240" y="180" text-anchor="middle" font-size="10" fill="#a08040" filter="url(#sk)">奇点太多？</text>

  <text x="352" y="158" font-size="11" fill="#b85450" filter="url(#sk)">是</text>
  <path d="M 335 166 L 686 166" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="690" y="142" width="210" height="48" rx="8" fill="#fdeaea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="795" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">return false</text>
  <text x="795" y="180" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#sk)">k ≥ 6，修不完</text>

  <text x="252" y="216" font-size="11" fill="#4a8e4a" filter="url(#sk)">否</text>
  <path d="M 240 202 L 240 234" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D2: k == 0 ? -->
  <polygon points="240,238 335,274 240,310 145,274" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">k = 0 ?</text>
  <text x="240" y="288" text-anchor="middle" font-size="10" fill="#a08040" filter="url(#sk)">已全偶？</text>

  <text x="352" y="266" font-size="11" fill="#4a8e4a" filter="url(#sk)">是</text>
  <path d="M 335 274 L 686 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="690" y="250" width="210" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="795" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">return true</text>
  <text x="795" y="288" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">一条边都不加</text>

  <text x="252" y="324" font-size="11" fill="#4a8e4a" filter="url(#sk)">否</text>
  <path d="M 240 310 L 240 344" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D3: k == 2 ? -->
  <polygon points="240,348 335,386 240,424 145,386" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">k = 2 ?</text>
  <text x="240" y="398" text-anchor="middle" font-size="10" fill="#a08040" filter="url(#sk)">两奇点 u、v</text>

  <text x="356" y="378" font-size="11" fill="#4a8e4a" filter="url(#sk)">是（k=2）</text>
  <path d="M 335 386 L 451 386" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="252" y="440" font-size="11" fill="#b85450" filter="url(#sk)">否（k = 4）</text>
  <path d="M 240 424 L 240 514" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D4: (u,v) existing edge? -->
  <polygon points="565,348 675,386 565,424 455,386" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="565" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">(u,v) 是已有边？</text>
  <text x="565" y="398" text-anchor="middle" font-size="10" fill="#a08040" filter="url(#sk)">u、v 为两个奇点</text>

  <text x="577" y="332" font-size="11" fill="#4a8e4a" filter="url(#sk)">否</text>
  <path d="M 565 348 L 563 304" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="450" y="250" width="220" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="560" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">return true</text>
  <text x="560" y="292" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">直连：加 1 条边 (u,v)</text>

  <text x="577" y="440" font-size="11" fill="#b85450" filter="url(#sk)">是</text>
  <path d="M 565 424 L 565 464" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D5: middleman exists? -->
  <polygon points="565,468 690,510 565,552 440,510" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="565" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">存在 x ∉ {u,v}：</text>
  <text x="565" y="520" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">(u,x)、(x,v) 均非边？</text>

  <text x="700" y="500" font-size="11" fill="#4a8e4a" filter="url(#sk)">是</text>
  <path d="M 690 510 L 726 510" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="730" y="484" width="185" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="822" y="504" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">return true</text>
  <text x="822" y="524" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">加 (u,x)、(x,v)</text>

  <text x="577" y="570" font-size="11" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 565 552 L 565 596" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="475" y="600" width="180" height="44" rx="8" fill="#fdeaea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="565" y="618" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">return false</text>
  <text x="565" y="636" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#sk)">无可用中间点</text>

  <!-- D6: k=4 pairing -->
  <polygon points="240,518 370,560 240,602 110,560" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">k = 4：3 种配对中</text>
  <text x="240" y="570" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">存在两条都可加的？</text>

  <text x="252" y="620" font-size="11" fill="#4a8e4a" filter="url(#sk)">是</text>
  <path d="M 240 602 L 240 646" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="140" y="650" width="200" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="240" y="670" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">return true</text>
  <text x="240" y="688" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">按该配对加 2 条边</text>

  <text x="520" y="552" font-size="11" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 370 560 L 696 560" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="700" y="536" width="190" height="48" rx="8" fill="#fdeaea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="795" y="556" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">return false</text>
  <text x="795" y="574" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#sk)">3 种配对全被占用</text>
</svg>
