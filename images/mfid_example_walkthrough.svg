<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：nums=[2,3,2,1]，freq=[3,2,-3,1]</text>

  <rect x="25" y="40" width="470" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="57" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">步</text>
  <text x="112" y="57" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">操作（push）</text>
  <text x="258" y="57" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">堆内快照（顶 → 底）</text>
  <text x="400" y="57" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">对账</text>
  <text x="472" y="57" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">ans</text>

  <rect x="25" y="70" width="470" height="64" fill="#ffffff" stroke="#b0b0b0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="46" y="105" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="112" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cnt[2]=3</text>
  <text x="112" y="116" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">push (3,2)</text>
  <rect x="175" y="88" width="62" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="105" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(3,2)</text>
  <text x="400" y="105" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 = cnt[2] ✓</text>
  <text x="472" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>

  <rect x="25" y="138" width="470" height="64" fill="#ffffff" stroke="#b0b0b0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="46" y="173" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="112" y="167" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cnt[3]=2</text>
  <text x="112" y="184" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">push (2,3)</text>
  <rect x="175" y="156" width="62" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="173" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(3,2)</text>
  <rect x="243" y="156" width="62" height="26" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="173" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">(2,3)</text>
  <text x="400" y="173" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 = cnt[2] ✓</text>
  <text x="472" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>

  <rect x="25" y="206" width="470" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="46" y="241" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="112" y="235" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cnt[2]=0</text>
  <text x="112" y="252" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">push (0,2)</text>
  <rect x="175" y="224" width="62" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="206" y="241" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">(3,2)✗</text>
  <rect x="243" y="224" width="62" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="274" y="241" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(2,3)</text>
  <rect x="311" y="224" width="62" height="26" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="241" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">(0,2)</text>
  <text x="400" y="233" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">3≠cnt[2]=0</text>
  <text x="400" y="249" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">弹出后✓2=cnt[3]</text>
  <text x="472" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>

  <rect x="25" y="274" width="470" height="64" fill="#ffffff" stroke="#b0b0b0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="46" y="309" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="112" y="303" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cnt[1]=1</text>
  <text x="112" y="320" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">push (1,1)</text>
  <rect x="175" y="292" width="62" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="309" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(2,3)</text>
  <rect x="243" y="292" width="62" height="26" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="309" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">(1,1)</text>
  <rect x="311" y="292" width="62" height="26" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="309" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">(0,2)</text>
  <text x="400" y="309" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2 = cnt[3] ✓</text>
  <text x="472" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>

  <rect x="25" y="348" width="470" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 2 步：旧快照 (3,2) 挡在堆顶，对账弹出后露出真实最大频次 2</text>
  <text x="260" y="383" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans = [3, 3, 2, 2]；(0,2) 沉在堆底不挡路，懒删除只清挡路的</text>
</svg>
