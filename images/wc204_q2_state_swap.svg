<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 478" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="478" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：pos / neg 双状态在三类元素下的转移</text>
  <path d="M 140 34 Q 280 40 420 34" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Panel 1: x > 0 -->
  <rect x="14" y="42" width="532" height="130" rx="10" fill="#ffffff" stroke="#e3e3e0" filter="url(#rough2)"/>
  <rect x="24" y="90" width="72" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334" filter="url(#rough2)">x &gt; 0</text>

  <rect x="140" y="66" width="56" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">pos</text>
  <path d="M 200 81 L 244 81" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="222" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <rect x="252" y="66" width="86" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">pos + 1</text>

  <rect x="140" y="120" width="56" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7020" filter="url(#rough2)">neg</text>
  <path d="M 200 135 L 244 135" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="222" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#9a7020" filter="url(#rough2)">+1</text>
  <rect x="252" y="120" width="86" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="139" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a7020" filter="url(#rough2)">neg+1 / 0</text>

  <text x="356" y="80" font-size="11" fill="#555" filter="url(#rough2)">正数不改变乘积符号：</text>
  <text x="356" y="98" font-size="11" fill="#555" filter="url(#rough2)">pos 无条件 +1；</text>
  <text x="356" y="116" font-size="11" fill="#555" filter="url(#rough2)">neg 仅在有来源时 +1</text>
  <text x="356" y="134" font-size="11" fill="#555" filter="url(#rough2)">（neg=0 时保持 0）</text>

  <!-- Panel 2: x < 0 -->
  <rect x="14" y="178" width="532" height="130" rx="10" fill="#ffffff" stroke="#e3e3e0" filter="url(#rough2)"/>
  <rect x="24" y="226" width="72" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a7020" filter="url(#rough2)">x &lt; 0</text>

  <rect x="140" y="202" width="56" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">pos</text>
  <rect x="140" y="256" width="56" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7020" filter="url(#rough2)">neg</text>

  <rect x="252" y="202" width="86" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">pos′</text>
  <rect x="252" y="256" width="86" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7020" filter="url(#rough2)">neg′</text>

  <path d="M 196 217 L 246 267" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 196 271 L 246 221" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="221" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">×(−1)</text>

  <text x="356" y="216" font-size="11" fill="#555" filter="url(#rough2)">负数让乘积变号，</text>
  <text x="356" y="234" font-size="11" fill="#555" filter="url(#rough2)">正 / 负身份互换：</text>
  <text x="356" y="252" font-size="11" fill="#555" filter="url(#rough2)">pos′ ← neg（可无来源）</text>
  <text x="356" y="270" font-size="11" fill="#555" filter="url(#rough2)">neg′ ← pos（≥1，即 [x]）</text>

  <!-- Panel 3: x = 0 -->
  <rect x="14" y="314" width="532" height="130" rx="10" fill="#ffffff" stroke="#e3e3e0" filter="url(#rough2)"/>
  <rect x="24" y="362" width="72" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">x = 0</text>

  <rect x="140" y="338" width="56" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">pos</text>
  <path d="M 200 353 L 244 353" stroke="#3a3a3a" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="252" y="338" width="86" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>

  <rect x="140" y="392" width="56" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="411" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7020" filter="url(#rough2)">neg</text>
  <path d="M 200 407 L 244 407" stroke="#3a3a3a" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="252" y="392" width="86" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="411" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>

  <text x="356" y="352" font-size="11" fill="#555" filter="url(#rough2)">乘积归零：跨越 0 的</text>
  <text x="356" y="370" font-size="11" fill="#555" filter="url(#rough2)">子数组全部失效，</text>
  <text x="356" y="388" font-size="11" fill="#555" filter="url(#rough2)">两状态同时清零——</text>
  <text x="356" y="406" font-size="11" fill="#555" filter="url(#rough2)">0 是硬分隔符</text>

  <text x="280" y="464" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">状态 = 以当前下标 i 结尾的最长正 / 负乘积子数组长度；全局答案 = 扫描全程 pos 的峰值</text>
</svg>
