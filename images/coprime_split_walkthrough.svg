<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：[4, 7, 8, 15, 3, 5] → 答案 2</text>
  <text x="320" y="48" text-anchor="middle" font-size="11.5" fill="#7a7a7a" font-style="italic" filter="url(#sk)">分解：4→{2}，7→{7}，8→{2}，15→{3,5}，3→{3}，5→{5}</text>

  <!-- prime interval cards -->
  <text x="95" y="88" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">质数区间：</text>
  <g filter="url(#sk)">
    <rect x="190" y="68" width="100" height="32" rx="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="300" y="68" width="100" height="32" rx="7" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="410" y="68" width="100" height="32" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="520" y="68" width="100" height="32" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="240" y="89" fill="#2f5e94">2 → [0,2]</text>
    <text x="350" y="89" fill="#3a6a2f">7 → [1,1]</text>
    <text x="460" y="89" fill="#8a6a1a">3 → [3,4]</text>
    <text x="570" y="89" fill="#a04348">5 → [3,5]</text>
  </g>

  <!-- startMax row -->
  <text x="95" y="120" font-size="10.5" fill="#7a7a7a" font-style="italic" filter="url(#sk)">startMax[j] = 以 j 为起点的封锁带最远右端（−1 = 无质数从 j 出发）</text>
  <g filter="url(#sk)">
    <rect x="190" y="128" width="56" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="252" y="128" width="56" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="314" y="128" width="56" height="30" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
    <rect x="376" y="128" width="56" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="438" y="128" width="56" height="30" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
    <rect x="500" y="128" width="56" height="30" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="218" y="148" fill="#2f5e94">2</text>
    <text x="280" y="148" fill="#3a6a2f">1</text>
    <text x="342" y="148" fill="#666666">−1</text>
    <text x="404" y="148" fill="#a04348">5</text>
    <text x="466" y="148" fill="#666666">−1</text>
    <text x="528" y="148" fill="#666666">−1</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#7a7a7a" filter="url(#sk)">
    <text x="218" y="172">j=0</text>
    <text x="280" y="172">j=1</text>
    <text x="342" y="172">j=2</text>
    <text x="404" y="172">j=3</text>
    <text x="466" y="172">j=4</text>
    <text x="528" y="172">j=5</text>
  </g>
  <text x="575" y="148" font-size="10.5" fill="#a04348" filter="url(#sk)">← max(4,5)</text>

  <!-- scan table -->
  <g filter="url(#sk)">
    <rect x="70" y="190" width="60" height="28" fill="#fff8e1" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="130" y="190" width="120" height="28" fill="#fff8e1" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="250" y="190" width="140" height="28" fill="#fff8e1" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="390" y="190" width="90" height="28" fill="#fff8e1" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="480" y="190" width="100" height="28" fill="#fff8e1" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="70" y="218" width="60" height="30" fill="#ffffff" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="130" y="218" width="120" height="30" fill="#ffffff" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="250" y="218" width="140" height="30" fill="#ffffff" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="390" y="218" width="90" height="30" fill="#ffffff" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="480" y="218" width="100" height="30" fill="#ffffff" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="70" y="248" width="60" height="30" fill="#ffffff" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="130" y="248" width="120" height="30" fill="#ffffff" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="250" y="248" width="140" height="30" fill="#ffffff" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="390" y="248" width="90" height="30" fill="#ffffff" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="480" y="248" width="100" height="30" fill="#ffffff" stroke="#b0b0a0" stroke-width="1.1"/>
    <rect x="70" y="278" width="60" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="130" y="278" width="120" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="250" y="278" width="140" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="390" y="278" width="90" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="480" y="278" width="100" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#6b5a1e" filter="url(#sk)">
    <text x="100" y="209">i</text>
    <text x="190" y="209">startMax[i]</text>
    <text x="320" y="209">reach（更新后）</text>
    <text x="435" y="209">reach ≤ i ?</text>
    <text x="530" y="209">动作</text>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="100" y="238" fill="#2b2b2b">0</text>
    <text x="190" y="238" fill="#2f5e94">2</text>
    <text x="320" y="238" fill="#2b2b2b">max(−1, 2) = 2</text>
    <text x="435" y="238" fill="#b85450">2 ≤ 0 ✗</text>
    <text x="530" y="238" fill="#666666">右移</text>
    <text x="100" y="268" fill="#2b2b2b">1</text>
    <text x="190" y="268" fill="#3a6a2f">1</text>
    <text x="320" y="268" fill="#2b2b2b">max(2, 1) = 2</text>
    <text x="435" y="268" fill="#b85450">2 ≤ 1 ✗</text>
    <text x="530" y="268" fill="#666666">右移</text>
    <text x="100" y="298" fill="#2b2b2b" font-weight="bold">2</text>
    <text x="190" y="298" fill="#666666">−1</text>
    <text x="320" y="298" fill="#2b2b2b" font-weight="bold">max(2, −1) = 2</text>
    <text x="435" y="298" fill="#3a6a2f" font-weight="bold">2 ≤ 2 ✓</text>
    <text x="530" y="298" fill="#3a6a2f" font-weight="bold">返回 2</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="322" width="520" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="320" y="344" font-size="12" fill="#6b5a1e">质数 2 的封锁带 [0,2] 压住 i=0、1；扫到 i=2 时 reach 首次收敛</text>
    <text x="320" y="366" font-size="12" fill="#6b5a1e">前缀质数 {2,7} 与后缀 {3,5} 不相交 → gcd(224,225)=1，返回 2</text>
  </g>
</svg>
