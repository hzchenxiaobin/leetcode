<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">从低位对齐：num 末尾对 k 的个位，进位单独存</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">num = [2,1,5]，k = 806，逐列相加得到 1021</text>

  <text x="52" y="104" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">num</text>
  <text x="52" y="156" font-size="12" fill="#d6a040" text-anchor="start" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="46" y="236" font-size="11.5" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">结果</text>

  <rect x="120" y="82" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="148" y="108" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="184" y="82" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="212" y="108" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="248" y="82" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="276" y="108" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="120" y="134" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="148" y="160" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="184" y="134" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="212" y="160" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="248" y="134" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="276" y="160" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="120" y="212" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="148" y="238" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="184" y="212" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="212" y="238" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="248" y="212" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="276" y="238" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="312" y="212" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="340" y="238" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 276 196 L 276 210" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 340 196 L 340 210" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <path d="M 320 104 L 356 104 L 356 76 L 318 76" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="80" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">5+6=11，进位 1</text>

  <path d="M 320 156 L 372 156 L 372 128 L 320 128" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="132" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">2+8=10，进位 1</text>

  <rect x="30" y="268" width="506" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="288" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">循环条件写成「i ≥ 0 或 k &gt; 0 或 carry」：三种耗尽情形一次覆盖，无需特判。</text>
  <text x="42" y="305" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">以及最后多出一位进位（如 999+1）三种情况都被同一个循环覆盖，不需要写特判。</text>
</svg>
