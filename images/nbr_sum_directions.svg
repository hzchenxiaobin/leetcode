<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">两类邻居的方向（以查询值 v 为中心）</text>

  <!-- 5x5 grid, origin (60,56), cell 44 -->
  <!-- plain cells -->
  <g filter="url(#rough2)">
    <rect x="60" y="56" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="104" y="56" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="148" y="56" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="192" y="56" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="236" y="56" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="60" y="100" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="236" y="100" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="60" y="144" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="236" y="144" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="60" y="188" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="236" y="188" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="60" y="232" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="104" y="232" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="148" y="232" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="192" y="232" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="236" y="232" width="44" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>

  <!-- adjacent (orthogonal) neighbors, blue -->
  <g filter="url(#rough2)">
    <rect x="148" y="100" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="104" y="144" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="192" y="144" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="148" y="188" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="170" y="127" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">上</text>
  <text x="126" y="171" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">左</text>
  <text x="214" y="171" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">右</text>
  <text x="170" y="215" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">下</text>

  <!-- diagonal neighbors, orange -->
  <g filter="url(#rough2)">
    <rect x="104" y="100" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="192" y="100" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="104" y="188" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="192" y="188" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="126" y="126" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">左上</text>
  <text x="214" y="126" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">右上</text>
  <text x="126" y="214" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">左下</text>
  <text x="214" y="214" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">右下</text>

  <!-- center queried value, green -->
  <rect x="148" y="144" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="170" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">v</text>

  <!-- row / col index labels -->
  <g font-size="10" fill="#aaaaaa" filter="url(#rough2)">
    <text x="52" y="84" text-anchor="end">0</text>
    <text x="52" y="128" text-anchor="end">1</text>
    <text x="52" y="172" text-anchor="end">2</text>
    <text x="52" y="216" text-anchor="end">3</text>
    <text x="52" y="260" text-anchor="end">4</text>
    <text x="82" y="292" text-anchor="middle">0</text>
    <text x="126" y="292" text-anchor="middle">1</text>
    <text x="170" y="292" text-anchor="middle">2</text>
    <text x="214" y="292" text-anchor="middle">3</text>
    <text x="258" y="292" text-anchor="middle">4</text>
  </g>
  <text x="170" y="308" text-anchor="middle" font-size="10" fill="#aaaaaa" filter="url(#rough2)">行 i 在左侧，列 j 在下方</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="310" y="78" width="186" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="403" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">adjacentSum(value)</text>
  <text x="403" y="120" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">上、下、左、右（4 格）</text>

  <g filter="url(#rough2)">
    <rect x="310" y="148" width="186" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="403" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">diagonalSum(value)</text>
  <text x="403" y="190" text-anchor="middle" font-size="11.5" fill="#a07820" filter="url(#rough2)">左上、右上、左下、右下</text>

  <g filter="url(#rough2)">
    <rect x="310" y="218" width="186" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="403" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">越界的方向</text>
  <text x="403" y="258" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">直接跳过，不计入和</text>
  <text x="403" y="274" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">（角落的值只有 3 个邻居）</text>
</svg>
