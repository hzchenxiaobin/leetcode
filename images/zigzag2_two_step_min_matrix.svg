<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">两步一合并：峰 w → 谷 j → 峰 v，谷的位置只有 min(v,w) 种</text>

  <!-- 左半：波形推导 -->
  <text x="195" y="62" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">从峰到峰跨两步，中间必须落谷</text>

  <!-- 值网格线（值 0..4） -->
  <path d="M 78 330 L 320 330" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 78 290 L 320 290" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 78 250 L 320 250" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 78 210 L 320 210" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 78 170 L 320 170" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <!-- 纵轴 -->
  <path d="M 78 156 L 78 344" stroke="#888" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="66" y="334" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">0</text>
  <text x="66" y="294" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="66" y="254" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="66" y="214" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">3</text>
  <text x="66" y="174" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">4</text>
  <text x="60" y="140" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">值</text>

  <!-- 谷可行带：j ∈ {0,1,2}（0..min(3,4)−1） -->
  <rect x="160" y="250" width="60" height="80" fill="#e6f4ea" opacity="0.65" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="243" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">j 的可行带（3 种）</text>

  <!-- 波形 w=4 → j=1 → v=3 -->
  <path d="M 120 170 Q 155 240 190 290" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M 190 290 Q 225 240 260 210" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="120" cy="170" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="190" cy="290" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="260" cy="210" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">w=4（峰）</text>
  <text x="196" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">j（谷）</text>
  <text x="268" y="200" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">v=3（峰）</text>

  <!-- 位置标签 -->
  <text x="120" y="356" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">位置 i</text>
  <text x="190" y="356" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">i+1</text>
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">i+2</text>
  <path d="M 100 344 L 286 344" stroke="#888" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="46" y="372" width="290" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="191" y="392" text-anchor="middle" font-size="11.5" fill="#8a6a10" filter="url(#rough2)">谷须同时低于两侧：j &lt; w 且 j &lt; v</text>
  <text x="191" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a10" filter="url(#rough2)">⟹ j ≤ min(v,w) − 1，共 min(v,w) 种</text>

  <!-- 右半：min(v,w) 矩阵 -->
  <text x="470" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">两步转移矩阵 T[v][w] = min(v, w)</text>

  <!-- 列标 w -->
  <text x="394" y="122" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">w=0</text>
  <text x="428" y="122" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="462" y="122" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="496" y="122" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">3</text>
  <text x="530" y="122" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">4</text>
  <text x="566" y="122" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（w →）</text>

  <!-- 行 v=4..0（自上而下），格子 34×34 起点 (360,128) -->
  <rect x="360" y="128" width="34" height="34" rx="3" fill="#a9cbee" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="394" y="128" width="34" height="34" rx="3" fill="#c3daf5" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="428" y="128" width="34" height="34" rx="3" fill="#dbe8fa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="462" y="128" width="34" height="34" rx="3" fill="#eef4fd" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="496" y="128" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <rect x="360" y="162" width="34" height="34" rx="3" fill="#c3daf5" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="394" y="162" width="34" height="34" rx="3" fill="#dbe8fa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="428" y="162" width="34" height="34" rx="3" fill="#eef4fd" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="462" y="162" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="496" y="162" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <rect x="360" y="196" width="34" height="34" rx="3" fill="#dbe8fa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="394" y="196" width="34" height="34" rx="3" fill="#eef4fd" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="428" y="196" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="462" y="196" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="496" y="196" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <rect x="360" y="230" width="34" height="34" rx="3" fill="#eef4fd" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="394" y="230" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="428" y="230" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="462" y="230" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="496" y="230" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <rect x="360" y="264" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="394" y="264" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="428" y="264" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="462" y="264" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="496" y="264" width="34" height="34" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 高亮 (v=3, w=4) -->
  <rect x="496" y="230" width="34" height="34" rx="3" fill="#eef4fd" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>

  <!-- 数值 -->
  <text x="377" y="149" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">0</text>
  <text x="411" y="149" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">1</text>
  <text x="445" y="149" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">2</text>
  <text x="479" y="149" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">3</text>
  <text x="513" y="149" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">4</text>

  <text x="377" y="183" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">1</text>
  <text x="411" y="183" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">2</text>
  <text x="445" y="183" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">3</text>
  <text x="479" y="183" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">4</text>
  <text x="513" y="183" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">4</text>

  <text x="377" y="217" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">2</text>
  <text x="411" y="217" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">3</text>
  <text x="445" y="217" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">4</text>
  <text x="479" y="217" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="513" y="217" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">4</text>

  <text x="377" y="251" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">3</text>
  <text x="411" y="251" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">4</text>
  <text x="445" y="251" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="479" y="251" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="513" y="251" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>

  <text x="377" y="285" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">4</text>
  <text x="411" y="285" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="445" y="285" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="479" y="285" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="513" y="285" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">4</text>

  <!-- 行标 v -->
  <text x="352" y="149" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">v=4</text>
  <text x="352" y="183" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">3</text>
  <text x="352" y="217" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="352" y="251" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="352" y="285" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">0</text>

  <path d="M 536 247 L 560 247" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="564" y="240" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">对应左图：</text>
  <text x="564" y="254" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">min(3,4)=3</text>

  <text x="470" y="322" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0-indexed 值 0..m−1；第 0 行全 0（最低值当不了峰）</text>

  <!-- 底部公式框 -->
  <rect x="30" y="396" width="600" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="417" text-anchor="middle" font-size="12" fill="#8a6a10" filter="url(#rough2)">两步转移：up[i+2][v] = Σ_w min(v,w) · up[i][w]（峰到峰）</text>
  <text x="330" y="438" text-anchor="middle" font-size="12" fill="#8a6a10" filter="url(#rough2)">单步转移（n 为偶数时补尾）：up[i+1][v] = Σ_{w&gt;m−1−v} up[i][w]（后缀和）</text>
</svg>
