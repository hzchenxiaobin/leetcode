<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">陷阱：最后一人被迫拿到 4 美元</text>

  <!-- money = 12, children = 2 -->
  <text x="150" y="70" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">money = 12，children = 2</text>
  <text x="150" y="94" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">想 1 人拿 8：另一人拿 12−8 = 4 → 违规！</text>
  <g filter="url(#rough2)">
    <circle cx="100" cy="140" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="100" y="145" text-anchor="middle" font-size="15" fill="#2f5527">8</text>
    <circle cx="200" cy="140" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <text x="200" y="145" text-anchor="middle" font-size="15" fill="#8c3a36">4</text>
    <text x="200" y="180" text-anchor="middle" font-size="12" fill="#b85450">没人能拿 4 ✗</text>
  </g>
  <text x="150" y="208" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">退一档：改为 (3, 9) 等拆法 → 0 人拿 8</text>
  <rect x="80" y="222" width="140" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="244" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">distMoney(12,2)=0</text>

  <!-- money = 13, children = 2 -->
  <text x="390" y="70" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">money = 13，children = 2</text>
  <text x="390" y="94" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1 人拿 8：另一人拿 13−8 = 5 → 合法 ✓</text>
  <g filter="url(#rough2)">
    <circle cx="340" cy="140" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="340" y="145" text-anchor="middle" font-size="15" fill="#2f5527">8</text>
    <circle cx="440" cy="140" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="440" y="145" text-anchor="middle" font-size="15" fill="#7a5a10">5</text>
    <text x="440" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a">5 ≠ 4 ✓</text>
  </g>
  <text x="390" y="208" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1 人拿 8 成立</text>
  <rect x="320" y="222" width="140" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="244" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">distMoney(13,2)=1</text>

  <path d="M 230 240 L 312 240" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="70" y="280" width="380" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">每个"恰好 8"消耗 7 元剩余款；若 q 个人拿 8 后</text>
  <text x="260" y="320" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">只剩 1 人且他分到 1+3=4 元 → q 减一档</text>
</svg>
