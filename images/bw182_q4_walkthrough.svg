<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1：T = 4 时存在 0 → 1 → 4 → 3 的有效路径</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">该路径只用 1 条重边 [0,1,5]，满足 k = 1；T = 3 时无解</text>
  <ellipse cx="70" cy="130" rx="24" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <ellipse cx="190" cy="130" rx="24" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <ellipse cx="310" cy="118" rx="24" ry="24" fill="#f2f2f2" stroke="#999999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="122" text-anchor="middle" font-size="12" fill="#999999" font-weight="bold" filter="url(#rough2)">2</text>
  <ellipse cx="190" cy="250" rx="24" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="254" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <ellipse cx="320" cy="250" rx="24" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <ellipse cx="440" cy="262" rx="24" ry="24" fill="#f2f2f2" stroke="#999999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="266" text-anchor="middle" font-size="12" fill="#999999" font-weight="bold" filter="url(#rough2)">5</text>
  <path d="M 94 130 L 166 130" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="130" y="120" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">w=5 重</text>
  <path d="M 214 128 L 286 120" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="250" y="108" text-anchor="middle" font-size="9.5" fill="#888">w=3</text>
  <path d="M 190 154 L 190 226" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="178" y="194" text-anchor="middle" font-size="9.5" fill="#888">w=2</text>
  <path d="M 214 250 L 296 250" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="255" y="240" text-anchor="middle" font-size="9.5" fill="#888">w=4</text>
  <path d="M 344 252 L 416 260" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="380" y="242" text-anchor="middle" font-size="9.5" fill="#888">w=1</text>
  <rect x="30" y="300" width="500" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">T = 4：轻边 {1-2, 1-4, 3-4, 4-5}，重边 {0-1}</text>
  <text x="280" y="331" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">路径 0→1→4→3 恰含 1 条重边 ✓，T = 3 时 3-4 与 0-1 都变重（2 条）→ 无解</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">答案为 4；注意 T 只能取 0 或某条边的权重，二分只需在这些候选上做</text>
</svg>
