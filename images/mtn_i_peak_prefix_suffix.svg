<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：枚举山峰 j，两侧各自取最小</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- generic array with peak j in middle -->
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)">
      <rect x="90"  y="90" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
      <rect x="136" y="90" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
      <rect x="182" y="90" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
      <rect x="228" y="90" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
      <rect x="274" y="90" width="52" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
      <rect x="326" y="90" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <rect x="372" y="90" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <rect x="418" y="90" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    </g>
    <g fill="#555" font-size="12">
      <text x="113" y="115" filter="url(#sk)">…</text>
      <text x="159" y="115" filter="url(#sk)">…</text>
      <text x="205" y="115" filter="url(#sk)">…</text>
      <text x="251" y="115" filter="url(#sk)">…</text>
      <text x="349" y="115" filter="url(#sk)">…</text>
      <text x="395" y="115" filter="url(#sk)">…</text>
      <text x="441" y="115" filter="url(#sk)">…</text>
    </g>
    <text x="300" y="115" fill="#a06a10" font-weight="bold" font-size="15" filter="url(#sk)">nums[j]</text>
    <text x="300" y="80" fill="#b85450" font-weight="bold" font-size="14" filter="url(#sk)">j（山峰）</text>
  </g>

  <!-- left bracket: preMin -->
  <path d="M 88 84 Q 82 110 88 138" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="60" y="150" width="200" height="52" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g font-size="12" fill="#2b6e9e">
    <text x="160" y="172" text-anchor="middle" font-weight="bold" filter="url(#sk)">preMin = min(nums[0..j−1])</text>
    <text x="160" y="192" text-anchor="middle" filter="url(#sk)">滚动变量，从左往右顺手维护</text>
  </g>

  <!-- right bracket: sufMin -->
  <path d="M 466 84 Q 472 110 466 138" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="380" y="150" width="200" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g font-size="12" fill="#2e6e2e">
    <text x="480" y="172" text-anchor="middle" font-weight="bold" filter="url(#sk)">suf[j+1] = min(nums[j+1..n−1])</text>
    <text x="480" y="192" text-anchor="middle" filter="url(#sk)">从右往左递推，哨兵 suf[n] = +∞</text>
  </g>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="110" y="222" width="420" height="44" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="250" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold" filter="url(#sk)">固定 j 的最优和 = preMin + nums[j] + suf[j+1]</text>

  <!-- legality check -->
  <g filter="url(#sk)">
    <rect x="110" y="282" width="420" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="320" y="307" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#sk)">合法性免费判定：preMin &lt; nums[j] 且 suf[j+1] &lt; nums[j]，否则 j 当不成山峰</text>

  <!-- three-step flow -->
  <g font-size="12" text-anchor="middle">
    <g filter="url(#sk)">
      <rect x="52" y="340" width="160" height="30" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
      <rect x="240" y="340" width="160" height="30" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/>
      <rect x="428" y="340" width="160" height="30" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    </g>
    <text x="132" y="360" fill="#2e6e2e" filter="url(#sk)">① 从右往左建 suf</text>
    <text x="320" y="360" fill="#2b6e9e" filter="url(#sk)">② 从左往右枚举 j</text>
    <text x="508" y="360" fill="#7a5415" filter="url(#sk)">③ 合法则更新 ans</text>
    <path d="M 214 355 L 236 355" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 402 355 L 424 355" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>
</svg>
