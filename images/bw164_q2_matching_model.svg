<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">最大匹配 = 类内能凑几对 + 用 xx 去补「落单」的牌</text>
  <rect x="46" y="70" width="300" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="96" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">类内最大对数（字母计数 p_c）</text>
  <text x="196" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">g = min(⌊T/2⌋, T − 最大字母数)</text>
  <text x="196" y="152" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">把 u 张 xx 拿来补，最大字母数会变小</text>
  <rect x="364" y="70" width="290" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="509" y="96" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">用 u 张 xx 补这一类</text>
  <text x="509" y="126" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">f[u] = u + min(⌊(T−u)/2⌋, (T−u) − L(u))</text>
  <text x="509" y="152" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">L(u)：拿走 u 张后最大字母还剩多少</text>
  <rect x="46" y="182" width="608" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="208" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">两类（B 与 C）共享同一批 xx：</text>
  <text x="350" y="234" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">ans = max over u { f_B[u] + f_C[min(a − u, C)] }</text>
  <rect x="46" y="262" width="608" height="106" rx="10" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="288" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">为什么「拿走最大的字母」最优：g 只与总数 T 和最大字母数 L 有关</text>
  <text x="350" y="312" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">L 越小 g 越大；想尽办法压 L 的策略就是优先拿最大的一堆</text>
  <text x="350" y="338" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">u 只扫 0…min(a, 总数)，用堆逐张模拟即 O(T log 26)</text>
  <text x="350" y="360" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">示例 1：[aa, ab, ba, ac] → A=1, B={b,c}, C={b}，ans = 2</text>
</svg>
