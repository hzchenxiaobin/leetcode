  <rect x="220" y="56" width="48" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="244" y="82" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 292 76 L 340 76" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="344" y="48" width="118" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
