  <rect x="148" y="186" width="92" height="34" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="209" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">21:34</text>
  <rect x="256" y="186" width="92" height="34" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
