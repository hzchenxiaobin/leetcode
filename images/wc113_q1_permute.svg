  <text x="403" y="90" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">4! = 24 种</text>
  <path d="M 466 76 L 500 76" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
