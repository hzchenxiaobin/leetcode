  <text x="410" y="209" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">23:14</text>
  <rect x="472" y="186" width="92" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
