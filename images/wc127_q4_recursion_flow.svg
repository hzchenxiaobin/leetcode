<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">递归调用：bound 逐层收紧，指针只前进</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">build(bound) 返回 null 表示当前子树为空</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="150" y="64" width="280" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="86.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">build(+∞)  取 8</text>
  <path d="M 230.0 100.0 L 180.0 124.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330.0 100.0 L 380.0 124.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="124" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180.0" y="146.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">build(8)  左：取 5</text>
  <rect x="310" y="124" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400.0" y="146.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">build(+∞) 右：取 10</text>
  <path d="M 150.0 160.0 L 110.0 184.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 212.0 160.0 L 232.0 184.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="184" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="105.0" y="203.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">build(5) 取 1</text>
  <rect x="190" y="184" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="265.0" y="203.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">build(8) 取 7</text>
  <path d="M 380.0 160.0 L 340.0 184.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440.0 160.0 L 470.0 184.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="184" width="120" height="32" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="360.0" y="203.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">build(10) → 空</text>
  <rect x="440" y="184" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="505.0" y="203.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">build(+∞) 取 12</text>
  <text x="30.0" y="244.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">遇到 next &gt; bound 就返回 null，把元素留给上层</text>
  <rect x="30" y="266" width="520" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="287.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">每个元素被读一次、被比较常数次 → O(n)</text>
  <text x="40.0" y="303.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">左子树 bound = 根值；右子树 bound = 继承的 bound（不是根值）</text>
  <text x="40.0" y="319.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">最坏递归深度 = 树高，退化链状时为 n</text>
</svg>
