<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 316"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="316" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">先把 words2 压成「每个字母需要几个」</text>
  <rect x="60" y="74" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="101.76" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">lc</text>
  <rect x="170" y="74" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215.0" y="101.76" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">eo</text>
  <path d="M 140,96 L 210,96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250,96 L 300,96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="150" width="200" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="181.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">需要 {l:1, c:1, e:1, o:1}</text>
  <text x="330" y="232" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">规则：need[c] = max over words2 中字母 c 的出现次数</text>
  <rect x="70" y="254" width="220" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180.0" y="280.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">leetcode ✓ 全都有</text>
  <rect x="360" y="254" width="250" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485.0" y="280.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">amazon ✗ 缺 l 与 c</text>
</svg>
