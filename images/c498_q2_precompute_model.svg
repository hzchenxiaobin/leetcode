<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">不稳定值的两个组成部分都能递推预处理</text>

  <g filter="url(#rough2)" font-size="13">
    <rect x="100" y="52" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="190" y="52" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="280" y="52" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="370" y="52" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="140" y="72" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="230" y="72" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="320" y="72" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="410" y="72" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="60" y="72" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums</text>

  <path d="M 118 96 C 180 108, 260 108, 322 96" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="220" y="122" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">preMax[i] = max(preMax[i−1], nums[i])（从左往右）</text>

  <g filter="url(#rough2)" font-size="12">
    <rect x="100" y="136" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="190" y="136" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="280" y="136" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="370" y="136" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <text x="140" y="155" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="230" y="155" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="320" y="155" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="410" y="155" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="58" y="155" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">preMax</text>
  <text x="492" y="122" font-size="10.5" fill="#888" filter="url(#rough2)">只增不减</text>

  <path d="M 432 180 C 360 192, 280 192, 208 180" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="320" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">sufMin[i] = min(nums[i], sufMin[i+1])（从右往左）</text>

  <g filter="url(#rough2)" font-size="12">
    <rect x="100" y="220" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="190" y="220" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="280" y="220" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="370" y="220" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <text x="140" y="239" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="230" y="239" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="320" y="239" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="410" y="239" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="56" y="239" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">sufMin</text>
  <text x="492" y="286" font-size="10.5" fill="#888" filter="url(#rough2)">也只增不减</text>

  <rect x="80" y="272" width="400" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">unstable(i) = preMax[i] − sufMin[i]，O(1) 查询</text>

  <text x="280" y="348" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nums[i] 同时属于两段：preMax[i] ≥ nums[i] ≥ sufMin[i]，故不稳定值恒 ≥ 0</text>
  <text x="280" y="366" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两行数组各自单调不减，但差值无单调性 → 只能线性扫描</text>
</svg>
