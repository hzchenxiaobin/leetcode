<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="350" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：每块多余石头各走一条最短路，互不阻挡、步数直接相加</text>

  <!-- 左：示例 1 -->
  <text x="114" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：答案 3</text>

  <rect x="45" y="70" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="91" y="70" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="137" y="70" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <rect x="45" y="116" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="91" y="116" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="137" y="116" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="45" y="162" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="91" y="162" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="114" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="137" y="162" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 130 170 Q 225 150 172 112" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="140" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">3 步</text>

  <text x="114" y="234" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(2,1) 多出的第 2 块 → (0,2)</text>
  <text x="114" y="250" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">d = |2−0| + |1−2| = 3</text>

  <!-- 右：示例 2 -->
  <text x="459" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2：答案 4</text>

  <rect x="390" y="70" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="436" y="70" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="459" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="482" y="70" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="505" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <rect x="390" y="116" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="436" y="116" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="459" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="482" y="116" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="505" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <rect x="390" y="162" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="436" y="162" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="459" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="482" y="162" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="505" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>

  <path d="M 470 93 L 489 93" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <path d="M 459 109 L 459 127" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="471" y="121" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <path d="M 505 169 L 505 151" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="517" y="163" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <path d="M 490 185 L 472 185" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="481" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="459" y="234" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(0,1)、(2,2) 各发 2 块，就近填空</text>
  <text x="459" y="250" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">总步数 = 1+1+1+1 = 4</text>

  <!-- 结论框 -->
  <rect x="100" y="282" width="460" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="330" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">格子中途可堆叠 → 总步数 = 每块石头最短路长之和 = 匹配权</text>
</svg>
