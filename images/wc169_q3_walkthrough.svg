<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：arr = [4,2,3,0,3,1,2]，start = 5</text>
  <text x="360" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">入队前染色，弹出时判零；每个下标至多入队一次，队列长度不超过 n</text>

  <g filter="url(#rough2)">
    <rect x="40" y="70" width="640" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="40" y="110" width="640" height="38" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.1"/>
    <rect x="40" y="148" width="640" height="38" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.1"/>
    <rect x="40" y="186" width="640" height="38" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.1"/>
    <rect x="40" y="224" width="640" height="38" fill="#ffffff" stroke="#c8d4e0" stroke-width="1.1"/>
    <rect x="40" y="262" width="640" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <g stroke="#c8d4e0" stroke-width="1.1" filter="url(#rough2)">
    <path d="M92,70 V300" fill="none"/>
    <path d="M152,70 V300" fill="none"/>
    <path d="M208,70 V300" fill="none"/>
    <path d="M268,70 V300" fill="none"/>
    <path d="M360,70 V300" fill="none"/>
    <path d="M470,70 V300" fill="none"/>
  </g>

  <g font-size="10.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="66" y="94">层</text>
    <text x="122" y="94">步</text>
    <text x="180" y="94">弹出 i</text>
    <text x="238" y="94">a[i]</text>
    <text x="314" y="94">后继</text>
    <text x="415" y="94">新入队</text>
    <text x="575" y="94">队列（队首在左）</text>
  </g>

  <g font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="66" y="133">0</text><text x="122" y="133">1</text><text x="180" y="133">5</text>
    <text x="238" y="133">1</text><text x="314" y="133">6, 4</text><text x="415" y="133">6, 4</text><text x="575" y="133">[6, 4]</text>

    <text x="66" y="171">1</text><text x="122" y="171">2</text><text x="180" y="171">6</text>
    <text x="238" y="171">2</text><text x="314" y="171">4（已染色）</text><text x="415" y="171">—</text><text x="575" y="171">[4]</text>

    <text x="66" y="209">1</text><text x="122" y="209">3</text><text x="180" y="209">4</text>
    <text x="238" y="209">3</text><text x="314" y="209">1</text><text x="415" y="209">1</text><text x="575" y="209">[1]</text>

    <text x="66" y="247">2</text><text x="122" y="247">4</text><text x="180" y="247">1</text>
    <text x="238" y="247">2</text><text x="314" y="247">3</text><text x="415" y="247">3</text><text x="575" y="247">[3]</text>
  </g>

  <g font-size="10.5" fill="#3d6b2f" text-anchor="middle" filter="url(#rough2)">
    <text x="66" y="285">3</text><text x="122" y="285">5</text><text x="180" y="285">3</text>
    <text x="238" y="285">0</text><text x="314" y="285">—</text><text x="415" y="285">—</text><text x="575" y="285">[] 命中即返回</text>
  </g>

  <rect x="46" y="312" width="628" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="334" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">第 5 步弹出下标 3，arr[3] = 0 → true；对应路径 5 → 6 → 4 → 1 → 3</text>
  <text x="360" y="352" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">另一条路径 5 → 4 → 1 → 3 同样成立：BFS 只关心「有没有」，不关心走哪条</text>
  <text x="360" y="370" text-anchor="middle" font-size="10.5" fill="#8c3b36" filter="url(#rough2)">示例 3 对照：start = 2 的可达集只有 {0, 2, 3, 4}，值为 0 的下标 1 始终进不去 → false</text>
</svg>
