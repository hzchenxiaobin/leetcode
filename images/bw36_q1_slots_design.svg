<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心设计：三个计数器，carType 直接作下标</text>

  <!-- 类框 -->
  <g filter="url(#rough2)">
    <rect x="150" y="56" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="85" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">ParkingSystem 类</text>

  <!-- slot 数组 -->
  <text x="120" y="140" font-size="13" fill="#333" filter="url(#rough2)">成员：</text>
  <g filter="url(#rough2)">
    <rect x="170" y="118" width="80" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="4"/>
    <rect x="250" y="118" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="330" y="118" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="410" y="118" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="210" y="140" fill="#999">弃用</text>
    <text x="290" y="140" fill="#b8860b" font-weight="bold">big</text>
    <text x="370" y="140" fill="#2d5a22" font-weight="bold">medium</text>
    <text x="450" y="140" fill="#446688" font-weight="bold">small</text>
    <text x="210" y="170" font-size="11">slot[0]</text>
    <text x="290" y="170" font-size="11">slot[1]</text>
    <text x="370" y="170" font-size="11">slot[2]</text>
    <text x="450" y="170" font-size="11">slot[3]</text>
  </g>

  <!-- 三种车 -->
  <g filter="url(#rough2)">
    <rect x="40" y="220" width="120" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <rect x="220" y="220" width="120" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="400" y="220" width="120" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="100" y="242">大车 carType=1</text>
    <text x="100" y="260" font-size="11.5" fill="#888">只停大车位</text>
    <text x="280" y="242">中车 carType=2</text>
    <text x="280" y="260" font-size="11.5" fill="#888">只停中车位</text>
    <text x="460" y="242">小车 carType=3</text>
    <text x="460" y="260" font-size="11.5" fill="#888">只停小车位</text>
  </g>
  <path d="M 120 218 C 180 200, 240 190, 278 156" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 218 L 280 176" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 218 C 400 200, 330 190, 298 156" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- addCar 伪代码 -->
  <g filter="url(#rough2)">
    <rect x="80" y="292" width="400" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="313">addCar(t)：slot[t] &gt; 0 ? (slot[t]−−, true) : false</text>
    <text x="280" y="335" fill="#b8860b" font-weight="bold">判空与占用一步完成，无 switch、无分支链</text>
  </g>
</svg>
