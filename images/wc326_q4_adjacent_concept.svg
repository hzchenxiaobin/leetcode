<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">最优质数对必是相邻质数——中间夹着谁，谁就更近</text>
  <path d="M 170 40 Q 340 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 质数轴 -->
  <text x="340" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">范围 [10, 19] 内的质数依次是 11、13、17、19</text>

  <!-- 非相邻对大弧（上方，红虚线） -->
  <g filter="url(#sk)">
    <path d="M 138 100 Q 340 52 522 100" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
  </g>
  <text x="340" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">非相邻对 (11, 19)：gap = 8</text>

  <!-- 数轴 -->
  <g filter="url(#sk)">
    <path d="M 70 122 H 590" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 质数圆 -->
  <g filter="url(#sk)">
    <ellipse cx="130" cy="122" rx="24" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="250" cy="122" rx="24" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="410" cy="122" rx="24" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="530" cy="122" rx="24" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="130" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">11</text>
  <text x="250" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">13</text>
  <text x="410" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">17</text>
  <text x="530" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">19</text>

  <!-- 相邻对小弧（下方） -->
  <g filter="url(#sk)">
    <path d="M 138 146 Q 190 172 242 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <path d="M 258 146 Q 330 178 402 146" stroke="#446688" stroke-width="1.8" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <path d="M 418 146 Q 470 172 522 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>
  </g>
  <text x="190" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">gap 2</text>
  <text x="330" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e">gap 4</text>
  <text x="470" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">gap 2</text>

  <text x="340" y="205" text-anchor="middle" font-size="11.5" fill="#444">相邻对 gap：2、4、2，最小 2 —— 非相邻对 gap = 8 完败，</text>
  <text x="340" y="223" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">枚举相邻对即可，m − 1 次比较代替 C(m, 2) 次两两比较</text>

  <!-- 左：引理逻辑框 -->
  <g filter="url(#sk)">
    <rect x="40" y="243" width="312" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="196" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">引理：最优对内部没有别的质数</text>
  <text x="56" y="288" font-size="10.8" fill="#444">若 num1 &lt; p &lt; num2 且 p 也是范围内质数，</text>
  <text x="56" y="306" font-size="10.8" fill="#444">则 (num1, p) 与 (p, num2) 都是合法对，</text>
  <text x="56" y="324" font-size="10.8" fill="#444">且 p − num1、num2 − p 都严格小于 num2 − num1，</text>
  <text x="56" y="344" font-size="10.8" font-weight="bold" fill="#2b4a6e">与「gap 最小」矛盾 ⇒ 最优对必相邻 ∎</text>

  <!-- 右：并列取 num1 最小框 -->
  <g filter="url(#sk)">
    <rect x="372" y="243" width="268" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="506" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a">并列时取 num1 最小的一对</text>
  <text x="388" y="290" font-size="10.8" fill="#444">例 1 中 [11,13] 与 [17,19] 同为 gap 2：</text>
  <text x="388" y="308" font-size="10.8" fill="#444">升序扫描 + 仅当 gap &lt; best 才更新，</text>
  <text x="388" y="326" font-size="10.8" fill="#444">后出现的并列对不覆盖先出现的，</text>
  <text x="388" y="344" font-size="10.8" font-weight="bold" fill="#a06a1a">自动返回 num1 最小的 [11,13]</text>

  <!-- 底部 insight -->
  <g filter="url(#sk)">
    <rect x="40" y="378" width="600" height="72" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="58" y="402" font-size="12" font-weight="bold" fill="#2b2b2b">关键观察：答案只藏在「相邻质数对」里——筛出 [left, right] 全部质数（埃氏筛 O(R log log R)），</text>
  <text x="58" y="424" font-size="11.5" fill="#444">再对升序质数序列单趟扫描取最小间隙（O(R)），并列时严格小于更新保住 num1 最小。</text>
  <text x="58" y="442" font-size="11.5" fill="#444">R ≤ 10⁶ ⇒ 一次筛 + 一趟扫，全程不到 5×10⁶ 次基本操作。</text>
</svg>
