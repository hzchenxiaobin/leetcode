<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#r)">移除一个元素：GCD↑ 与 LCM↓ 的博弈</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">因子分数 = 所有元素的 GCD × LCM；最多移除一个元素</text>

  <!-- array [2,4,8,16] -->
  <text x="239" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">✂ 移除 2</text>
  <rect x="217" y="82" width="44" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <rect x="271" y="82" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="325" y="82" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="379" y="82" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="239" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">2</text>
  <text x="293" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">4</text>
  <text x="347" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">8</text>
  <text x="401" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">16</text>
  <line x1="221" y1="114" x2="257" y2="86" stroke="#b85450" stroke-width="1.8" filter="url(#r)"/>
  <path d="M 250 122 Q 300 145 383 156" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- left panel: no removal -->
  <rect x="42" y="160" width="268" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#r)"/>
  <text x="176" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#34507a" filter="url(#r)">不移除（保留全部）</text>
  <text x="60" y="206" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">GCD(2,4,8,16) = 2</text>
  <text x="60" y="226" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">LCM(2,4,8,16) = 16</text>
  <text x="60" y="248" font-size="12.5" font-weight="bold" fill="#34507a" font-family="monospace" filter="url(#r)">得分 = 2 × 16 = 32</text>

  <!-- right panel: remove 2 -->
  <rect x="330" y="160" width="268" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#r)"/>
  <text x="464" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">移除 2 → 剩 [4, 8, 16]</text>
  <text x="348" y="206" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">GCD = 4</text>
  <text x="424" y="206" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">↑ 变大</text>
  <text x="348" y="226" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">LCM = 16</text>
  <text x="424" y="226" font-size="12" fill="#888" filter="url(#r)">→ 不变</text>
  <text x="348" y="248" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#r)">得分 = 4 × 16 = 64 ✓</text>

  <!-- monotonicity note -->
  <rect x="42" y="286" width="556" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r)"/>
  <text x="320" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07520" filter="url(#r)">删除元素后：GCD 只会不变或变大 ↑，LCM 只会不变或变小 ↓</text>
  <text x="320" y="330" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#r)">只有当 GCD 的增益超过 LCM 的损失时，移除才划算</text>
  <text x="320" y="358" text-anchor="middle" font-size="11" fill="#999" filter="url(#r)">例 [1,2,3,4,5]：GCD 已是 1（升无可升），移除只会丢 LCM → 不移除最优（60）</text>
</svg>
