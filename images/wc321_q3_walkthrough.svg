<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="480" fill="#fafafa"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：给每个节点算「右侧最大值 R」，去留一眼可判</text>
  <path d="M 190 38 Q 430 46 670 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ========= 样例 1 ========= -->
  <text x="70" y="70" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：head = [5, 2, 13, 3, 8] → 输出 [13, 8]</text>

  <text x="86" y="100" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">节点值</text>
  <rect x="140" y="78" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="204" y="78" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="268" y="78" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="332" y="78" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="396" y="78" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="168" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e3030" filter="url(#rough2)">5</text>
  <text x="232" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e3030" filter="url(#rough2)">2</text>
  <text x="296" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">13</text>
  <text x="360" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e3030" filter="url(#rough2)">3</text>
  <text x="424" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">8</text>

  <text x="86" y="140" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">右侧最大 R</text>
  <rect x="140" y="118" width="56" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="204" y="118" width="56" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="268" y="118" width="56" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="332" y="118" width="56" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="396" y="118" width="56" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="168" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">13</text>
  <text x="232" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">13</text>
  <text x="296" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="360" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="424" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">—</text>

  <text x="86" y="180" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">判定</text>
  <text x="168" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">5&lt;13 删</text>
  <text x="232" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">2&lt;13 删</text>
  <text x="296" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">13≥8 留</text>
  <text x="360" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">3&lt;8 删</text>
  <text x="424" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">8 留</text>

  <path d="M 470 118 Q 480 130 470 142" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="488" y="128" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">R 从右往左</text>
  <text x="488" y="146" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">一趟前缀最大</text>

  <!-- 结论小框 -->
  <rect x="520" y="96" width="290" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="665" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">保留 ⟺ val ≥ R（右边没有严格更大的）</text>
  <text x="665" y="138" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">删完剩下 [13, 8]：非严格递减序列</text>

  <!-- ========= 样例 2 ========= -->
  <text x="70" y="226" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2：head = [1, 1, 1, 1] → 输出 [1, 1, 1, 1]（相等 ≠ 更大，全保留）</text>
  <rect x="140" y="238" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="204" y="238" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="268" y="238" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="332" y="238" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="168" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">1</text>
  <text x="232" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">1</text>
  <text x="296" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">1</text>
  <text x="360" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">1</text>
  <text x="430" y="260" font-size="12.5" fill="#333" filter="url(#rough2)">每个 R = 1：1 ≥ 1，一个都不删</text>

  <!-- ========= 补充样例 ========= -->
  <text x="70" y="320" font-size="14" font-weight="bold" fill="#a07830" filter="url(#rough2)">补充：head = [2, 3] → 输出 [3]（原头节点被删，返回新头！）</text>
  <rect x="140" y="332" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="204" y="332" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="168" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e3030" filter="url(#rough2)">2</text>
  <text x="232" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">3</text>
  <path d="M 168 326 Q 168 316 178 316" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="430" y="354" font-size="12.5" fill="#333" filter="url(#rough2)">2 的右侧 R = 3：删。头节点会变，别忘返回新头</text>

  <!-- 底部一句话 -->
  <rect x="50" y="392" width="760" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="416" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07830" filter="url(#rough2)">R 只依赖「右边」⇒ 从右往左一趟即可全算出：R_i = max(v_i+1, R_i+1)</text>
  <text x="430" y="440" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">从左往右看不到「右边」，于是要么用单调栈记账，要么把链表反转过来</text>
</svg>
