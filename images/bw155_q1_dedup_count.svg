<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
<text x="260" y="30" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">每天先去重，再统计“出现在多少天”</text>
<rect x="20" y="48" width="225" height="258" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="132" y="70" font-size="12" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">原始 responses（4 天）</text>
<text x="28" y="108" font-size="11" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">第 0 天</text>
<rect x="84" y="88" width="150" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="159" y="109" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">good ok good ok</text>
<text x="28" y="154" font-size="11" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">第 1 天</text>
<rect x="84" y="134" width="150" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="159" y="155" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">ok bad good ok ok</text>
<text x="28" y="200" font-size="11" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">第 2 天</text>
<rect x="84" y="180" width="150" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="159" y="201" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">good</text>
<text x="28" y="246" font-size="11" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">第 3 天</text>
<rect x="84" y="226" width="150" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="159" y="247" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">bad</text>
<path d="M250,178 L290,178" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="295" y="48" width="205" height="218" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="397" y="70" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">去重后：出现天数</text>
<rect x="312" y="88" width="62" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
<text x="343" y="109" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">good</text>
<rect x="384" y="88" width="62" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
<text x="415" y="109" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
<rect x="312" y="132" width="62" height="32" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="343" y="153" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">ok</text>
<rect x="384" y="132" width="62" height="32" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="415" y="153" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<rect x="312" y="176" width="62" height="32" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="343" y="197" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">bad</text>
<rect x="384" y="176" width="62" height="32" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="415" y="197" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<text x="397" y="243" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">good 频次最高 → 返回 &quot;good&quot;</text>
<text x="260" y="338" font-size="12" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">同一天内重复出现的词只计 1 次（本题最大的 WA 坑）</text>
</svg>
