<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">传送边的两副面孔：朴素 O(n²) vs 质数桶 ≤ 7n</text>

  <!-- Panel A: naive edges -->
  <text x="130" y="68" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 朴素建边（超时）</text>
  <text x="470" y="68" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">数组中所有 2 都是质数位置</text>

  <!-- cells: values 2,4,2,8,2,9 at x=30+i*52, y=82, 44x40 -->
  <!-- naive teleport arcs from idx0,2,4 to even idx 0..4 -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="1.1" fill="none" opacity="0.75">
    <path d="M52,82 C60,50 118,50 126,82" marker-end="url(#arr)"/>
    <path d="M52,82 C70,36 156,36 174,82" marker-end="url(#arr)"/>
    <path d="M52,82 C82,24 196,24 226,82" marker-end="url(#arr)"/>
    <path d="M52,82 C92,14 224,14 264,82" marker-end="url(#arr)"/>
    <path d="M156,82 C164,54 210,54 218,82" marker-end="url(#arr)"/>
    <path d="M156,82 C148,44 62,44 54,82" marker-end="url(#arr)"/>
    <path d="M156,82 C166,32 240,32 250,82" marker-end="url(#arr)"/>
    <path d="M156,82 C178,22 288,22 310,82" marker-end="url(#arr)"/>
    <path d="M260,82 C268,54 46,54 38,82" marker-end="url(#arr)"/>
    <path d="M260,82 C250,44 168,44 158,82" marker-end="url(#arr)"/>
    <path d="M260,82 C252,32 170,32 162,82" marker-end="url(#arr)"/>
    <path d="M260,82 C288,40 20,40 12,82" marker-end="url(#arr)"/>
  </g>

  <rect x="30" y="82" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="52" y="107" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="82" y="82" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="107" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="134" y="82" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="156" y="107" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="186" y="82" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="107" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="238" y="82" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="290" y="82" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="107" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">9</text>

  <text x="52" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="104" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="156" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="208" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=3</text>
  <text x="260" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=4</text>
  <text x="312" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=5</text>

  <rect x="352" y="86" width="272" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="108" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">每个质数位置都把「p 的倍数」重连一遍，</text>
  <text x="488" y="128" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">全是 2 时多达 n(n−1) ≈ 10¹⁰ 条边</text>

  <!-- Panel B: bucket -->
  <text x="130" y="196" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 质数桶 + 一次展开（正解）</text>

  <rect x="34" y="222" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="60" y="250" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="60" y="284" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums[i]=p</text>

  <path d="M90,244 L138,244" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="114" y="234" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">传送</text>

  <rect x="142" y="218" width="168" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="226" y="238" text-anchor="middle" font-size="13.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">bucket[2]</text>
  <text x="226" y="258" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">= { j : 2 | nums[j] }</text>
  <text x="226" y="292" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个质数值只展开这一次</text>

  <!-- fan-out arrows to member chips -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.8" fill="none">
    <path d="M310,232 C330,226 340,222 352,220" marker-end="url(#arrg)"/>
    <path d="M310,240 C330,238 340,238 352,238" marker-end="url(#arrg)"/>
    <path d="M310,248 C330,250 340,252 352,256" marker-end="url(#arrg)"/>
    <path d="M310,256 C330,262 340,268 352,274" marker-end="url(#arrg)"/>
    <path d="M310,260 C330,274 340,286 352,292" marker-end="url(#arrg)"/>
  </g>

  <rect x="354" y="208" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="230" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="406" y="226" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="429" y="248" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="354" y="244" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="266" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="406" y="262" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="429" y="284" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="354" y="280" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="302" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">2</text>

  <rect x="470" y="222" width="154" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="547" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">桶内所有 j 统一标</text>
  <text x="547" y="262" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dist = d + 1</text>
  <text x="547" y="280" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（源是谁无关紧要）</text>

  <!-- bottom note -->
  <rect x="36" y="340" width="588" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="368" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">为什么桶总大小 ≤ 7n ？</text>
  <text x="330" y="394" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2·3·5·7·11·13·17 = 510510 ≤ 10⁶，而再乘 19 已是 9699690 &gt; 10⁶</text>
  <text x="330" y="416" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">→ 每个 nums[j] 至多 7 个互异质因数（ω(v) ≤ 7）</text>
  <text x="330" y="438" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 所有桶加起来 ≤ 7n 条"传送关系"，且每个质数只展开一次</text>
</svg>
