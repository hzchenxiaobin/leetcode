<svg xmlns="http://www.w3.org/2000/svg" width="640" height="545" viewBox="0 0 640 545" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="545" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟遍历 · 三分类计数 · 区间直接生成</text>
  <path d="M 160 36 Q 320 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><ellipse cx="170" cy="58" rx="38" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="170" y="63" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">开始</text>
  <path d="M 170 73 L 170 84" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- input / init -->
  <g filter="url(#sk)"><rect x="95" y="88" width="150" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="170" y="106" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">输入 nums, target</text>
  <path d="M 170 116 L 170 126" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="95" y="130" width="150" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="170" y="148" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">less = 0, equal = 0</text>
  <path d="M 170 158 L 170 168" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1: more elements? -->
  <g filter="url(#sk)"><polygon points="170,170 254,202 170,234 86,202" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="170" y="207" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">还有元素 v ?</text>

  <path d="M 254 202 L 316 202" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="285" y="194" text-anchor="middle" font-size="11" fill="#888">否 · 扫完</text>

  <!-- generate + return -->
  <g filter="url(#sk)"><rect x="320" y="184" width="250" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="445" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">ans = [less, …, less+equal−1]</text>
  <text x="445" y="236" text-anchor="middle" font-size="11" fill="#b85450">equal = 0 时区间为空 → 返回 []</text>
  <path d="M 445 220 L 445 246" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><ellipse cx="445" cy="262" rx="76" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="445" y="267" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 ans（天然递增）</text>

  <path d="M 170 234 L 170 246" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="180" y="244" font-size="11.5" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- diamond 2: compare v with target -->
  <g filter="url(#sk)"><polygon points="170,252 240,300 170,348 100,300" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="170" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">v 与 target</text>
  <text x="170" y="313" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">比大小？</text>

  <!-- left branch: less++ -->
  <path d="M 100 300 L 86 300" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="93" y="291" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">＜</text>
  <g filter="url(#sk)"><rect x="22" y="286" width="60" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="52" y="305" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">less++</text>
  <text x="52" y="280" text-anchor="middle" font-size="10.5" fill="#446688">＜ target</text>

  <!-- right branch: skip -->
  <path d="M 240 300 L 262 300" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="251" y="291" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">＞</text>
  <g filter="url(#sk)"><rect x="266" y="286" width="130" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="331" y="305" text-anchor="middle" font-size="11.5" fill="#2e5e22">跳过（不影响）</text>

  <!-- middle branch: equal++ -->
  <path d="M 170 348 L 170 368" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="362" font-size="10.5" font-weight="bold" fill="#a06a1a">== target</text>
  <g filter="url(#sk)"><rect x="125" y="372" width="90" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="170" y="391" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">equal++</text>

  <!-- loop-back bus -->
  <path d="M 52 314 L 52 436" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 170 400 L 170 436" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 331 314 L 331 436" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 331 436 L 14 436 L 14 202 L 80 202" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="8" y="320" text-anchor="middle" font-size="10.5" fill="#888" transform="rotate(-90 8 320)">循环：取下一个 v</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="40" y="470" width="560" height="50" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="491" text-anchor="middle" font-size="12" fill="#7a5415">小于 → less（推起点）；等于 → equal（推长度）；大于 → 直接无视。</text>
  <text x="320" y="511" text-anchor="middle" font-size="12" fill="#7a5415">一趟遍历 O(n)，不排序、不改数组，输出天然递增。</text>
</svg>
