<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">排序不改答案：数对只看数值，批量计数</text>

  <!-- 原数组 -->
  <g filter="url(#rough2)">
    <text x="70" y="76" text-anchor="end" font-size="12.5" fill="#555">原数组</text>
    <rect x="90" y="56" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="116" y="77" text-anchor="middle" font-size="14" fill="#333">−6</text>
    <rect x="142" y="56" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="168" y="77" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="194" y="56" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="220" y="77" text-anchor="middle" font-size="14" fill="#333">5</text>
    <rect x="246" y="56" width="52" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="272" y="77" text-anchor="middle" font-size="14" fill="#b85450">−2</text>
    <rect x="298" y="56" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="324" y="77" text-anchor="middle" font-size="14" fill="#333">−7</text>
    <rect x="350" y="56" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="376" y="77" text-anchor="middle" font-size="14" fill="#333">−1</text>
    <rect x="402" y="56" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="428" y="77" text-anchor="middle" font-size="14" fill="#333">3</text>
  </g>

  <!-- 排序箭头 -->
  <path d="M 250 100 C 250 118, 250 126, 250 140" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="126" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">升序排序 O(n log n)</text>

  <!-- 排序后数组 -->
  <g filter="url(#rough2)">
    <text x="70" y="176" text-anchor="end" font-size="12.5" fill="#555">排序后</text>
    <rect x="90" y="156" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="116" y="177" text-anchor="middle" font-size="14" fill="#333">−7</text>
    <rect x="142" y="156" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="168" y="177" text-anchor="middle" font-size="14" fill="#333">−6</text>
    <rect x="194" y="156" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="220" y="177" text-anchor="middle" font-size="14" fill="#333">−2</text>
    <rect x="246" y="156" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="272" y="177" text-anchor="middle" font-size="14" fill="#333">−1</text>
    <rect x="298" y="156" width="52" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="324" y="177" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="350" y="156" width="52" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="376" y="177" text-anchor="middle" font-size="14" fill="#333">3</text>
    <rect x="402" y="156" width="52" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="428" y="177" text-anchor="middle" font-size="14" fill="#333">5</text>
  </g>

  <!-- 双指针 -->
  <g filter="url(#rough2)">
    <path d="M 116 196 C 116 208, 116 214, 116 224" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 428 196 C 428 208, 428 214, 428 224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)"/>
    <text x="116" y="242" text-anchor="middle" font-size="13" fill="#4a7a3a">left</text>
    <text x="428" y="242" text-anchor="middle" font-size="13" fill="#b85450">right</text>
  </g>

  <!-- 批量计数示意 -->
  <g filter="url(#rough2)">
    <rect x="90" y="258" width="364" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="272" y="284" text-anchor="middle" font-size="13.5" fill="#333">若 nums[left] + nums[right] &lt; target</text>
    <text x="272" y="306" text-anchor="middle" font-size="13.5" fill="#b85450">ans += right − left   （一次累加一批）</text>
    <text x="272" y="326" text-anchor="middle" font-size="12" fill="#555">否则 right−−：与最小值配对都超，right 报废</text>
  </g>

  <text x="500" y="292" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">排序 ⇒ 单调性</text>
  <text x="500" y="312" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">一批判定</text>
  <text x="500" y="332" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">O(n²) → O(n log n)</text>
</svg>
