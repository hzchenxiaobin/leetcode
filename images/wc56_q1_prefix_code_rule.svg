<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">前缀码：每一位的解码选择唯一</text>
  <text x="280" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">没有哪个合法字符是另一个字符的前缀，所以从左到右解码从不回头</text>

  <g filter="url(#rough2)">
    <rect x="58" y="74" width="200" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="158" y="100" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold">一比特字符</text>
    <rect x="128" y="110" width="60" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="158" y="134" text-anchor="middle" font-size="17" fill="#445566">0</text>
    <text x="158" y="166" text-anchor="middle" font-size="10" fill="#66788f">长度 1，遇 0 即收</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="302" y="74" width="200" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="402" y="100" text-anchor="middle" font-size="12.5" fill="#3a5a30" font-weight="bold">两比特字符</text>
    <rect x="318" y="110" width="30" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="333" y="134" text-anchor="middle" font-size="16" fill="#3a5a30">1</text>
    <rect x="350" y="110" width="30" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="365" y="134" text-anchor="middle" font-size="16" fill="#3a5a30">0</text>
    <rect x="396" y="110" width="30" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="411" y="134" text-anchor="middle" font-size="16" fill="#3a5a30">1</text>
    <rect x="428" y="110" width="30" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="443" y="134" text-anchor="middle" font-size="16" fill="#3a5a30">1</text>
    <text x="402" y="166" text-anchor="middle" font-size="10" fill="#4a6a40">长度 2，必以 1 开头</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="58" y="200" width="200" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="158" y="226" text-anchor="middle" font-size="13" fill="#8a5a10" font-weight="bold">bits[i] = 1</text>
    <text x="158" y="248" text-anchor="middle" font-size="11" fill="#7a6030">i += 2，吃掉 10 或 11</text>

    <rect x="302" y="200" width="200" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
    <text x="402" y="226" text-anchor="middle" font-size="13" fill="#8a3030" font-weight="bold">bits[i] = 0</text>
    <text x="402" y="248" text-anchor="middle" font-size="11" fill="#8a5050">i += 1，这一位单独成字</text>
  </g>

  <text x="280" y="296" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">指针每次只前进 1 或 2，路径唯一 —— 无需回溯、无需枚举</text>

  <g filter="url(#rough2)">
    <rect x="110" y="314" width="150" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="185" y="338" text-anchor="middle" font-size="12" fill="#3a5a30">停在 n-1 → true</text>
    <rect x="300" y="314" width="150" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="375" y="338" text-anchor="middle" font-size="12" fill="#8a3030">越过末位 → false</text>
  </g>
</svg>
