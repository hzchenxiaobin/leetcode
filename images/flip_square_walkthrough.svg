<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/></marker>
  </defs>
  <rect width="640" height="330" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 2 演算：区域贴右边界，k = 2 无中心行</text>
  <path d="M 165 42 Q 320 50 475 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 对换前网格 2x4，单元格 52x44，起点 (64,96) -->
  <g filter="url(#sk)">
    <path d="M 168 88 L 168 80 L 272 80 L 272 88" fill="none" stroke="#2b6e9e" stroke-width="1.4"/>
  </g>
  <text x="220" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">列 y..y+k−1（= 2..3）</text>
  <g filter="url(#sk)">
    <rect x="64"  y="96" width="52" height="44" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="116" y="96" width="52" height="44" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="168" y="96" width="52" height="44" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="220" y="96" width="52" height="44" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="64"  y="140" width="52" height="44" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="116" y="140" width="52" height="44" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="168" y="140" width="52" height="44" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="220" y="140" width="52" height="44" fill="#fff6df" stroke="#d6a040" rx="3"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#444">
    <text x="90"  y="123">3</text><text x="142" y="123">4</text>
    <text x="194" y="123" font-weight="bold">2</text><text x="246" y="123" font-weight="bold">3</text>
    <text x="90"  y="167">2</text><text x="142" y="167">3</text>
    <text x="194" y="167" font-weight="bold">4</text><text x="246" y="167" font-weight="bold">2</text>
  </g>
  <text x="58" y="123" text-anchor="end" font-size="11" font-weight="bold" fill="#555">行 x+0</text>
  <text x="58" y="167" text-anchor="end" font-size="11" font-weight="bold" fill="#555">行 x+1</text>
  <!-- 行间逐格对换箭头 -->
  <g filter="url(#sk)">
    <path d="M 194 132 L 194 152" stroke="#b03a3a" stroke-width="1.8" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M 246 132 L 246 152" stroke="#b03a3a" stroke-width="1.8" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text x="148" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">对换前</text>

  <!-- 中间箭头 -->
  <g filter="url(#sk)">
    <path d="M 336 142 L 386 142" stroke="#b03a3a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="361" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">i=0, j=1</text>

  <!-- 对换后网格，起点 (396,96) -->
  <g filter="url(#sk)">
    <path d="M 500 88 L 500 80 L 604 80 L 604 88" fill="none" stroke="#2b6e9e" stroke-width="1.4"/>
  </g>
  <text x="552" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">区域内片段互换后</text>
  <g filter="url(#sk)">
    <rect x="396" y="96" width="52" height="44" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="448" y="96" width="52" height="44" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="500" y="96" width="52" height="44" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="552" y="96" width="52" height="44" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="396" y="140" width="52" height="44" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="448" y="140" width="52" height="44" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="500" y="140" width="52" height="44" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="552" y="140" width="52" height="44" fill="#fff6df" stroke="#d6a040" rx="3"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#444">
    <text x="422" y="123">3</text><text x="474" y="123">4</text>
    <text x="526" y="123" fill="#a05a10" font-weight="bold">4</text><text x="578" y="123" fill="#a05a10" font-weight="bold">2</text>
    <text x="422" y="167">2</text><text x="474" y="167">3</text>
    <text x="526" y="167" fill="#a05a10" font-weight="bold">2</text><text x="578" y="167" fill="#a05a10" font-weight="bold">3</text>
  </g>
  <text x="500" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">对换后</text>

  <!-- 逐格配对 -->
  <text x="320" y="228" text-anchor="middle" font-size="12.5" fill="#2b2b2b">逐格配对：(0,2)=2 ↔ (1,2)=4，(0,3)=3 ↔ (1,3)=2（列下标不变）</text>

  <!-- 两个注释框 -->
  <g filter="url(#sk)">
    <rect x="60" y="244" width="268" height="36" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="194" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">区域外（列 0..1）：4 个格子不读不写</text>
  <g filter="url(#sk)">
    <rect x="348" y="244" width="232" height="36" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="464" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5e8e">k 为偶数：无中心行，⌊k/2⌋ = 1 轮</text>

  <text x="320" y="308" text-anchor="middle" font-size="12" fill="#555">即：行 x+0 的片段 [2,3] 与 行 x+1 的片段 [4,2] 整体互换</text>
</svg>
