<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 2：[1,2,3,4,5,6,7] 的五列</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">5 与 6 恰好落在同一格 (2,0)，靠比较结点值决定先后</text>

  <rect x="114" y="58" width="60" height="170" fill="#f3f6fc" stroke="#c3d2e6" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <rect x="182" y="58" width="60" height="170" fill="#eef4fb" stroke="#c3d2e6" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <rect x="250" y="58" width="60" height="170" fill="#fff8e1" stroke="#e0bb70" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="318" y="58" width="60" height="170" fill="#eef4fb" stroke="#c3d2e6" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <rect x="386" y="58" width="60" height="170" fill="#f3f6fc" stroke="#c3d2e6" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <text x="144" y="72" font-size="10" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">col −2</text>
  <text x="212" y="72" font-size="10" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">col −1</text>
  <text x="280" y="72" font-size="10" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">col 0</text>
  <text x="348" y="72" font-size="10" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">col 1</text>
  <text x="416" y="72" font-size="10" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">col 2</text>

  <path d="M 280 98 L 212 148" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 280 98 L 348 148" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 200 160 L 152 202" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 224 160 L 262 202" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 336 160 L 298 202" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 360 160 L 408 202" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <circle cx="280" cy="92" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="97" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="212" cy="156" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="212" y="161" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="348" cy="156" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="348" y="161" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>

  <circle cx="144" cy="212" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="144" y="217" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="268" cy="212" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="268" y="217" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="300" cy="212" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="300" y="217" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="416" cy="212" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="416" y="217" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>

  <text x="284" y="240" font-size="9.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">5、6 同在 (2,0)</text>

  <rect x="114" y="256" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="144" y="276" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[4]</text>
  <rect x="182" y="256" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="212" y="276" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[2]</text>
  <rect x="250" y="256" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="280" y="276" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[1,5,6]</text>
  <rect x="318" y="256" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="348" y="276" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[3]</text>
  <rect x="386" y="256" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="416" y="276" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[7]</text>

  <text x="30" y="308" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">列 0 拿到三个结点：键 (0,0,1)、(0,2,5)、(0,2,6)，排序后正是 1、5、6 —— 先比行号，再比值。</text>
  <text x="30" y="328" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">示例 3 交换了 5、6 在树中的位置，但两者仍落在 (2,0)，所以答案完全不变。</text>
</svg>
