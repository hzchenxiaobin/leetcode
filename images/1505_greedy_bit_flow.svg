<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="580" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">算法流程：贪心逐位提取 + BIT 维护删除标记</text>
  <text x="320" y="48" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">外循环确定第 t 位；内循环从小到大枚举数字 d = 0 … 9</text>

  <!-- start -->
  <g filter="url(#r)">
    <ellipse cx="320" cy="78" rx="52" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">开始</text>
  <path d="M 320 98 L 320 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- init -->
  <g filter="url(#r)">
    <rect x="150" y="120" width="340" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">pos[0…9] ← 各数字的原下标队列（升序）；BIT 置 0；t = 0</text>
  <path d="M 320 164 L 320 182" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- decision: t < n -->
  <g filter="url(#r)">
    <polygon points="320,188 396,222 320,256 244,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="227" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a0761e" filter="url(#r)">t &lt; n ?</text>
  <g filter="url(#r)">
    <rect x="470" y="200" width="112" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="526" y="225" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">返回 ans</text>
  <path d="M 396 222 L 466 222" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="424" y="214" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">否</text>
  <text x="320" y="272" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">是</text>
  <path d="M 320 256 L 320 276" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- enumerate d -->
  <g filter="url(#r)">
    <rect x="130" y="280" width="380" height="58" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">从小到大枚举 d ∈ [0, 9]（pos[d] 空则跳过）：</text>
  <text x="320" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">j = pos[d] 队首；cost = j − BIT.query(j)</text>
  <path d="M 320 338 L 320 356" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- decision: cost <= k -->
  <g filter="url(#r)">
    <polygon points="320,362 404,400 320,438 236,400" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#r)">cost ≤ k ?</text>
  <text x="320" y="416" text-anchor="middle" font-size="10.5" fill="#a0761e" filter="url(#r)">（当前最小的 d）</text>
  <g filter="url(#r)">
    <rect x="452" y="330" width="150" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="527" y="348" text-anchor="middle" font-size="11.5" fill="#8a4a44" filter="url(#r)">d++，</text>
  <text x="527" y="362" text-anchor="middle" font-size="11.5" fill="#8a4a44" filter="url(#r)">继续枚举更大数字</text>
  <path d="M 404 392 Q 448 384 452 362 L 452 352" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="430" y="386" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">否</text>
  <path d="M 527 330 Q 527 300 380 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="320" y="454" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">是</text>
  <path d="M 320 438 L 320 456" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- commit -->
  <g filter="url(#r)">
    <rect x="120" y="460" width="400" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">ans += d；k −= cost；BIT.add(j+1, 1)</text>
  <text x="320" y="503" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">pos[d] 出队；t++ → 回到「t &lt; n ?」</text>

  <!-- back edge -->
  <path d="M 120 488 L 88 488 L 88 222 L 236 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" stroke-dasharray="6,4" filter="url(#r)"/>

  <!-- bottom note -->
  <g filter="url(#r)">
    <rect x="56" y="528" width="528" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="553" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#r)">兜底：剩余序列首元素的 cost = 0 ≤ k 恒成立 → 枚举必有命中，不会卡死</text>
</svg>
