<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐行解析 + 栈回溯</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每行只做「计数 → 弹栈 → 算长度 → 更新答案或入栈」四件事</text>

  <rect x="180" y="64" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">按换行符切分，取下一行 line</text>

  <path d="M 320 94 L 320 106" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="106" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="126" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">d ← 行首制表符个数；name ← 其余部分</text>

  <path d="M 320 136 L 320 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="148" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="168" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">while 栈长 &gt; d：弹出栈顶（回到父目录）</text>

  <path d="M 320 178 L 320 190" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="190" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">base ← 栈空 ? 0 : 栈顶 + 1</text>

  <path d="M 320 220 L 320 232" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="232" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="252" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">cur ← base + len(name)</text>

  <path d="M 320 262 L 320 276" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,278 430,308 320,338 210,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="313" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">name 含 '.' ？</text>

  <path d="M 430 308 L 448 308" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="438" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="450" y="292" width="168" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="534" y="313" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">ans ← max(ans, cur)</text>

  <path d="M 320 338 L 320 356" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="332" y="352" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="180" y="356" width="280" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="376" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">stack.push(cur)　（目录继续作为潜在父目录）</text>

  <path d="M 534 324 L 534 424 L 500 424" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 386 L 320 424 L 348 424" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="410" width="370" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="325" y="430" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">还有下一行 → 回到第 1 步；否则返回 ans</text>

  <text x="320" y="460" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">虚线为循环回边：文件行不入栈，因此下一个兄弟目录不会被当成它的子目录</text>
</svg>
