<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：建大顶堆 → k 轮「弹-加-压」→ 返回</text>
  <path d="M 110 40 Q 320 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="270" y="52" width="100" height="30" rx="15" fill="#f0eeE6" stroke="#8899aa" stroke-width="1.3"/>
    <rect x="215" y="104" width="210" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <path d="M 320 84 L 320 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 320 148 L 320 162" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 320 165 L 410 205 L 320 245 L 230 205 Z" fill="#eef4fb" stroke="#4a8edb" stroke-width="1.5"/>
    <path d="M 412 205 L 468 205" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 320 247 L 320 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="472" y="186" width="140" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="40" y="278" width="160" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <path d="M 202 300 L 238 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="242" y="278" width="150" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M 394 300 L 430 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="434" y="278" width="170" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <path d="M 519 324 Q 519 352 320 352 Q 121 352 121 240 Q 121 205 226 205" stroke="#3a3a3a" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>
    <rect x="40" y="378" width="560" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555">开始</text>
  <text x="320" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">大顶堆装入全部 nums</text>
  <text x="320" y="139" text-anchor="middle" font-size="10.5" fill="#2b6e9e">Floyd 建堆 O(n)；Python 存 −x 后 heapify</text>
  <text x="320" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">剩余次数 &gt; 0 ?</text>
  <text x="438" y="197" text-anchor="middle" font-size="11.5" fill="#2e6e2e">否</text>
  <text x="542" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 score</text>
  <text x="542" y="219" text-anchor="middle" font-size="10.5" fill="#2e6e2e">类型 long long</text>
  <text x="332" y="264" text-anchor="middle" font-size="11.5" fill="#b85450">是</text>
  <text x="120" y="297" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">v = pop 堆顶</text>
  <text x="120" y="314" text-anchor="middle" font-size="10.5" fill="#2b6e9e">当前最大</text>
  <text x="317" y="297" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">score += v</text>
  <text x="317" y="314" text-anchor="middle" font-size="10.5" fill="#8a6415">long long 累加！</text>
  <text x="519" y="297" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">push (v+2)/3</text>
  <text x="519" y="314" text-anchor="middle" font-size="10.5" fill="#2e6e2e">= ⌈v/3⌉ 回堆</text>
  <text x="320" y="344" text-anchor="middle" font-size="11" fill="#555555">重复 k 次</text>
  <text x="320" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">⚠ score 最坏 k × 10⁹ ≈ 10¹⁴，远超 32 位 int（≈ 2.1×10⁹）→ C++ 累加必须 long long</text>
  <text x="320" y="420" text-anchor="middle" font-size="11" fill="#b85450">⌈v/3⌉ 的整数写法是 (v+2)/3（整除）；v = 1 时回写 1，堆永不空，k 轮循环安全</text>
</svg>
