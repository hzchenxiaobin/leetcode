<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [2,7,1,19,18,3]，n = 6</text>
  <path d="M 150 42 Q 280 50 410 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- header row: y=58, h=34 -->
  <g filter="url(#rough2)">
    <rect x="50" y="58" width="55" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="105" y="58" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="205" y="58" width="95" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="300" y="58" width="95" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="395" y="58" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#33506e" text-anchor="middle">
    <text x="77" y="80" filter="url(#rough2)">i</text>
    <text x="155" y="80" filter="url(#rough2)">nums[i−1]</text>
    <text x="252" y="80" filter="url(#rough2)">n % i</text>
    <text x="347" y="80" filter="url(#rough2)">特殊?</text>
    <text x="450" y="80" filter="url(#rough2)">贡献</text>
  </g>

  <!-- row 1: i=1 special -->
  <g filter="url(#rough2)">
    <rect x="50" y="92" width="55" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="105" y="92" width="100" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="205" y="92" width="95" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="300" y="92" width="95" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="395" y="92" width="110" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="77" y="113" fill="#333" filter="url(#rough2)">1</text>
    <text x="155" y="113" fill="#333" filter="url(#rough2)">2</text>
    <text x="252" y="113" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="347" y="113" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="450" y="113" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">2² = 4</text>
  </g>

  <!-- row 2: i=2 special -->
  <g filter="url(#rough2)">
    <rect x="50" y="124" width="55" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="105" y="124" width="100" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="205" y="124" width="95" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="300" y="124" width="95" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="395" y="124" width="110" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="77" y="145" fill="#333" filter="url(#rough2)">2</text>
    <text x="155" y="145" fill="#333" filter="url(#rough2)">7</text>
    <text x="252" y="145" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="347" y="145" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="450" y="145" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">7² = 49</text>
  </g>

  <!-- row 3: i=3 special -->
  <g filter="url(#rough2)">
    <rect x="50" y="156" width="55" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="105" y="156" width="100" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="205" y="156" width="95" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="300" y="156" width="95" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="395" y="156" width="110" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="77" y="177" fill="#333" filter="url(#rough2)">3</text>
    <text x="155" y="177" fill="#333" filter="url(#rough2)">1</text>
    <text x="252" y="177" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="347" y="177" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="450" y="177" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">1² = 1</text>
  </g>

  <!-- row 4: i=4 not special -->
  <g filter="url(#rough2)">
    <rect x="50" y="188" width="55" height="32" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="105" y="188" width="100" height="32" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="205" y="188" width="95" height="32" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="300" y="188" width="95" height="32" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="395" y="188" width="110" height="32" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="77" y="209" fill="#999" filter="url(#rough2)">4</text>
    <text x="155" y="209" fill="#999" filter="url(#rough2)">19</text>
    <text x="252" y="209" fill="#b85450" filter="url(#rough2)">2</text>
    <text x="347" y="209" fill="#b85450" filter="url(#rough2)">✗</text>
    <text x="450" y="209" fill="#999" filter="url(#rough2)">—</text>
  </g>

  <!-- row 5: i=5 not special -->
  <g filter="url(#rough2)">
    <rect x="50" y="220" width="55" height="32" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="105" y="220" width="100" height="32" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="205" y="220" width="95" height="32" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="300" y="220" width="95" height="32" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="395" y="220" width="110" height="32" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="77" y="241" fill="#999" filter="url(#rough2)">5</text>
    <text x="155" y="241" fill="#999" filter="url(#rough2)">18</text>
    <text x="252" y="241" fill="#b85450" filter="url(#rough2)">1</text>
    <text x="347" y="241" fill="#b85450" filter="url(#rough2)">✗</text>
    <text x="450" y="241" fill="#999" filter="url(#rough2)">—</text>
  </g>

  <!-- row 6: i=6 special -->
  <g filter="url(#rough2)">
    <rect x="50" y="252" width="55" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="105" y="252" width="100" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="205" y="252" width="95" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="300" y="252" width="95" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
    <rect x="395" y="252" width="110" height="32" fill="#e6f4ea" stroke="#9cc49a" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="77" y="273" fill="#333" filter="url(#rough2)">6</text>
    <text x="155" y="273" fill="#333" filter="url(#rough2)">3</text>
    <text x="252" y="273" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="347" y="273" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="450" y="273" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">3² = 9</text>
  </g>

  <!-- total row -->
  <g filter="url(#rough2)">
    <rect x="50" y="292" width="455" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="277" y="319" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">平方和 = 4 + 49 + 1 + 9 = 63</text>

  <!-- footnote -->
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">特殊下标 {1, 2, 3, 6} 恰为 6 的全部因子</text>
</svg>
