<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">相邻交换：满意度高的菜应排得更靠后</text>

  <!-- 交换前 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="80" y="66" width="86" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="176" y="66" width="86" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="123" y="86" fill="#333">p = 5</text>
    <text x="123" y="103" fill="#888" font-size="11">第 t 位</text>
    <text x="219" y="86" fill="#333">q = 2</text>
    <text x="219" y="103" fill="#888" font-size="11">第 t+1 位</text>
  </g>
  <text x="196" y="140" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">p &gt; q 却排前面：5·t + 2·(t+1)</text>

  <!-- 交换后 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="300" y="66" width="86" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="396" y="66" width="86" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="343" y="86" fill="#333">q = 2</text>
    <text x="343" y="103" fill="#888" font-size="11">第 t 位</text>
    <text x="439" y="86" fill="#333">p = 5</text>
    <text x="439" y="103" fill="#888" font-size="11">第 t+1 位</text>
  </g>
  <text x="396" y="140" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">交换后：2·t + 5·(t+1)</text>

  <path d="M 268 88 L 292 88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">交换</text>

  <!-- 差值推导 -->
  <g filter="url(#rough2)">
    <rect x="120" y="166" width="320" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="13.5" filter="url(#rough2)">
    <text x="280" y="192" fill="#4a7a3a">交换收益 = [2t + 5(t+1)] − [5t + 2(t+1)]</text>
    <text x="280" y="214" fill="#4a7a3a">= p − q = 5 − 2 = 3 &gt; 0（升序更优）</text>
  </g>
  <text x="280" y="254" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">结论：固定菜谱时按满意度升序做最优（排序不等式）</text>
  <text x="280" y="280" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">大的系数 t 配大的满意度：逆序对逐一消去，总和单调不减</text>
</svg>
