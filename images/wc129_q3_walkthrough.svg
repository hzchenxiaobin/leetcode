  <text x="30.0" y="244.0" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">更新后 best：8, 8, 8, 8, 10（A(4) = 6+4 = 10）</text>
  <text x="30.0" y="272.0" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">最高分 11：i = 0、j = 2（8 + 5 + 0 − 2）</text>
  <rect x="30" y="292" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="313.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">若先更新 best，j = 4 时会出现 best = 10 被自己使用（i = j）的非法情况</text>
