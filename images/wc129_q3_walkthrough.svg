  <rect x="90" y="212" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145.0" y="229.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
