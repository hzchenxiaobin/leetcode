  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：values = [8,1,5,2,6]</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">best 始终是「j 之前」的 A 最大值</text>
  <rect width="580" height="384" fill="#fafafa"/>
  <text x="40.0" y="62.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="100.0" y="62.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">values[j]</text>
  <text x="230.0" y="62.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">best</text>
  <text x="310.0" y="62.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">best+v[j]−j</text>
  <text x="470.0" y="62.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">ans</text>
