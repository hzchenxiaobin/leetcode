<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="780" height="480" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：需求是一个向量，买礼包就是一次「向量减法」</text>
  <text x="390" y="49" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">之后还能怎么买，只由「还剩多少」决定，与「已经买过什么、什么顺序」完全无关</text>

  <!-- 状态节点 -->
  <g filter="url(#rough2)">
    <rect x="40" y="72" width="300" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="190" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#335577" filter="url(#rough2)">状态 r = (3, 2)</text>
  <text x="190" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">还需 3 个 A、2 个 B</text>

  <!-- 两条边 -->
  <line x1="112" y1="138" x2="112" y2="176" stroke="#888888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="268" y1="138" x2="268" y2="176" stroke="#888888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="160" font-size="10" fill="#666666" filter="url(#rough2)">− [3,0]，付 ¥5</text>
  <text x="276" y="160" font-size="10" fill="#666666" filter="url(#rough2)">− [1,2]，付 ¥10</text>

  <!-- 两个后继状态 -->
  <g filter="url(#rough2)">
    <rect x="42" y="180" width="144" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="114" y="204" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">买礼包 1</text>
  <text x="114" y="224" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">r′ = (0, 2)</text>
  <text x="114" y="242" text-anchor="middle" font-size="10" fill="#7a8a7a" filter="url(#rough2)">只剩 2 个 B</text>

  <g filter="url(#rough2)">
    <rect x="196" y="180" width="144" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="268" y="204" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">买礼包 2</text>
  <text x="268" y="224" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">r′ = (2, 0)</text>
  <text x="268" y="242" text-anchor="middle" font-size="10" fill="#a08a60" filter="url(#rough2)">只剩 2 个 A</text>

  <!-- memo 表 -->
  <text x="42" y="288" font-size="11.5" font-weight="bold" fill="#555555" filter="url(#rough2)">记忆化表：同一个向量只算一次</text>
  <g filter="url(#rough2)">
    <rect x="42" y="298" width="298" height="94" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
  </g>
  <line x1="42" y1="329" x2="340" y2="329" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="42" y1="359" x2="340" y2="359" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="196" y1="298" x2="196" y2="392" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="118" y="320" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">剩余需求 r</text>
  <text x="268" y="320" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">最低花费 f(r)</text>
  <text x="118" y="350" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">(0, 2)</text>
  <text x="268" y="350" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">10</text>
  <text x="118" y="380" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">(2, 0)</text>
  <text x="268" y="380" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">4</text>

  <!-- 右侧要点 -->
  <g filter="url(#rough2)">
    <rect x="400" y="72" width="340" height="320" rx="10" fill="#f7f7f2" stroke="#999999" stroke-width="1.3"/>
  </g>
  <text x="420" y="98" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">为什么可以记忆化</text>
  <text x="420" y="126" font-size="11" fill="#444444" filter="url(#rough2)">1. 状态只有 n 维剩余量，与路径无关</text>
  <text x="420" y="150" font-size="11" fill="#444444" filter="url(#rough2)">2. 「全部单买」永远是合法兜底方案</text>
  <text x="420" y="174" font-size="11" fill="#444444" filter="url(#rough2)">3. 同一个 r 会被多条路径到达</text>
  <text x="432" y="196" font-size="11" fill="#b85450" filter="url(#rough2)">→ 重复子问题，记忆化合并</text>
  <text x="420" y="226" font-size="11" fill="#444444" filter="url(#rough2)">4. 状态上界 ∏(needsᵢ+1)，n ≤ 6、</text>
  <text x="432" y="248" font-size="11" fill="#444444" filter="url(#rough2)">needsᵢ ≤ 10，即至多 11⁶ ≈ 1.8×10⁶</text>
  <text x="420" y="278" font-size="11" fill="#444444" filter="url(#rough2)">5. 每个礼包至少含 1 件物品</text>
  <text x="432" y="300" font-size="11" fill="#444444" filter="url(#rough2)">→ 剩余总量严格递减，图无环</text>
  <text x="420" y="330" font-size="11" fill="#444444" filter="url(#rough2)">6. 价格 ≥ 单买总价的礼包删掉</text>
  <text x="432" y="352" font-size="11" fill="#444444" filter="url(#rough2)">→ 不改变答案，m 大幅变小</text>
  <text x="420" y="382" font-size="10.5" fill="#777777" filter="url(#rough2)">（坐标用 r′ 而非 r，才能命中缓存）</text>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="40" y="406" width="700" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="60" y="428" font-size="11" fill="#b85450" filter="url(#rough2)">不允许超量：必须逐维检查 r − s_k ≥ 0，只要有一维为负，这个礼包就不能买（哪怕它很便宜）</text>
  <text x="60" y="452" font-size="11" fill="#8a4a48" filter="url(#rough2)">状态是「完整向量」而不是「总件数」：两个不同向量可能件数相同，价格却完全不同</text>
</svg>
