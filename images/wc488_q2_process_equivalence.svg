<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 465"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="465" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">「最左侧」逐步合并 与 栈级联：同一过程的两种视角</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Band 1: step-by-step simulation -->
  <rect x="70" y="48" width="500" height="142" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="68" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">按题意模拟：每轮合并「最左侧」的相邻相等对</text>

  <!-- A = [3,1,1,2] -->
  <rect x="96" y="84" width="38" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="139" y="84" width="38" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="84" width="38" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="225" y="84" width="38" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="244" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <ellipse cx="180" cy="126" rx="45" ry="9" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <path d="M272,101 L298,101" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">1+1=2</text>

  <!-- B = [3,2,2] -->
  <rect x="310" y="84" width="38" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="329" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="353" y="84" width="38" height="34" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="372" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="396" y="84" width="38" height="34" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <ellipse cx="393" cy="126" rx="45" ry="9" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <path d="M443,101 L469,101" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="456" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">2+2=4</text>

  <!-- C = [3,4] terminal -->
  <rect x="481" y="84" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="524" y="84" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="543" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="521" y="78" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">终态 ✓</text>

  <text x="320" y="166" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">新的相等对（若还有）只会紧贴合并点或在更右边——左侧远处永远干净</text>

  <!-- Band 2: stack algorithm -->
  <rect x="70" y="202" width="500" height="148" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="222" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">栈算法：读入 x，与栈顶相等则弹出相加（翻倍），继续向左比</text>

  <!-- S1 -->
  <text x="132" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">读 x=3</text>
  <rect x="115" y="256" width="34" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <path d="M158,271 L216,271" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="302" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">栈空，直接入栈</text>

  <!-- S2 -->
  <text x="257" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">读 x=1</text>
  <rect x="223" y="256" width="34" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="261" y="256" width="34" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <path d="M303,271 L341,271" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="257" y="302" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">3 ≠ 1，直接入栈</text>

  <!-- S3 -->
  <text x="382" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">读 x=1</text>
  <rect x="348" y="256" width="34" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="386" y="256" width="34" height="30" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="403" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <path d="M428,271 L466,271" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="302" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">1+1=2，再比 3≠2 停</text>

  <!-- S4 -->
  <text x="507" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">读 x=2</text>
  <rect x="473" y="256" width="34" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="511" y="256" width="34" height="30" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="528" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="507" y="302" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">2+2=4，再比 3≠4 停</text>

  <text x="320" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">四步后栈 = [3,4]，与逐步合并完全一致 ✓</text>

  <!-- Bottom warning: order matters -->
  <rect x="70" y="362" width="500" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="86" y="382" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠️ 合并顺序影响结果——必须严格「最左」</text>

  <rect x="100" y="396" width="34" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="417" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="138" y="396" width="34" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="417" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="176" y="396" width="34" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="193" y="417" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <ellipse cx="136" cy="436" rx="42" ry="8" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <path d="M220,412 L246,412" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="254" y="396" width="34" height="32" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="271" y="417" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <rect x="292" y="396" width="34" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="309" y="417" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="350" y="408" text-anchor="start" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 最左规则 → [4,2]</text>
  <text x="350" y="430" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">若先合并右边一对 → [2,4] ✗</text>
  <text x="350" y="450" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">任选一对合并，结果不唯一</text>
</svg>
