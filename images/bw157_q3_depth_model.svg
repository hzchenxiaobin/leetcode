<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">路径长度决定答案：最大深度 d -&gt; 2^(d-1)</text>
  <text x="280" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">edges = [[1,2],[1,3],[3,4],[3,5]]，最大深度 2</text>
  <path d="M 270 80 L 150 160" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 270 80 L 380 160" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 380 160 L 320 250" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 380 160 L 450 250" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="270" cy="80" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="85" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="150" cy="160" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="165" font-size="12" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="380" cy="160" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="165" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="320" cy="250" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="255" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="450" cy="250" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="255" font-size="12" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="40" y="78" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">根 1</text>
  <text x="300" y="300" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">红/绿：到最深节点 4 的路径（2 条边）</text>
  <rect x="40" y="150" width="78" height="60" fill="#f1f3f4" stroke="#888" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="79.0" y="176.0" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">深度 0</text>
  <text x="79.0" y="192.0" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="40" y="220" width="78" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="79.0" y="246.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">深度 2</text>
  <text x="79.0" y="262.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">4, 5</text>
</svg>
