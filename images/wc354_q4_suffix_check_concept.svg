<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：禁串长度 ≤ 10，只需检查以 r 结尾的至多 10 个后缀</text>

  <!-- forbidden 面板 -->
  <rect x="428" y="44" width="118" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="487" y="64" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">forbidden 集</text>
  <text x="487" y="82" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">{"aaa","cb"}</text>
  <text x="487" y="98" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">每个长度 ≤ 10</text>

  <!-- word 字符格 -->
  <rect x="42" y="88" width="40" height="42" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="86" y="88" width="40" height="42" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="130" y="88" width="40" height="42" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="174" y="88" width="40" height="42" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="218" y="88" width="40" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="262" y="88" width="40" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="306" y="88" width="40" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="88" width="40" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="106" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="150" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="194" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="238" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="282" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="326" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="370" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>

  <!-- left / r 指针 -->
  <path d="M238,58 L238,84" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">left</text>
  <path d="M370,58 L370,84" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="50" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">r</text>

  <!-- 下标 -->
  <text x="62" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="106" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="150" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="194" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="238" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="282" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="326" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="370" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>

  <text x="304" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">当前窗口 word[left..r] = "aabc"（恒合法）</text>

  <!-- 后缀括线 L=1..4 -->
  <path d="M350,180 v6 h40 v-6" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="398" y="192" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">L=1 → "c" ∉ bad</text>
  <path d="M306,198 v6 h84 v-6" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="398" y="210" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">L=2 → "bc" ∉ bad</text>
  <path d="M262,216 v6 h128 v-6" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="398" y="228" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">L=3 → "abc" ∉ bad</text>
  <path d="M218,234 v6 h172 v-6" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="398" y="246" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">L=4 → "aabc" ∉ bad</text>

  <!-- 说明框 1 -->
  <rect x="36" y="274" width="488" height="44" rx="10" fill="#fafafa" stroke="#888" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">禁串起点必 ≥ r−9；起点 &lt; left 的禁串，其出现的当年已被踢出窗外</text>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">且约束 left ≥ 起点+1 ≤ left 自动满足 → 只查窗口内的 min(10, 窗口长) 个后缀</text>

  <!-- 说明框 2 -->
  <rect x="36" y="330" width="488" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">命中 word[i..r] ∈ forbidden 时：left = i+1（窗口起点跳过整个禁串）</text>
  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">例如 r=4 时后缀 "aaa" 命中（起点 i=2）→ left 一步跳到 3</text>
</svg>
