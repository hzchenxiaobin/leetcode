<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="530" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：root = [1,2,3,4,5,6,7]，distance = 3</text>
  <path d="M 140 34 Q 320 42 500 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#666">输出 2。数组是每个结点向上返回的距离直方图（下标 0 … distance）</text>

  <text x="320" y="76" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">④ 根 1：跨侧 (1+1) + (1+1) = 4 &gt; 3 ⇒ 不计数</text>

  <g filter="url(#sk)">
    <line x1="320" y1="112" x2="190" y2="184" stroke="#8899aa" stroke-width="1.6"/>
    <line x1="320" y1="112" x2="450" y2="184" stroke="#8899aa" stroke-width="1.6"/>
    <line x1="190" y1="184" x2="120" y2="268" stroke="#8899aa" stroke-width="1.6"/>
    <line x1="190" y1="184" x2="260" y2="268" stroke="#8899aa" stroke-width="1.6"/>
    <line x1="450" y1="184" x2="380" y2="268" stroke="#8899aa" stroke-width="1.6"/>
    <line x1="450" y1="184" x2="520" y2="268" stroke="#8899aa" stroke-width="1.6"/>
  </g>

  <g filter="url(#sk)">
    <ellipse cx="190" cy="268" rx="96" ry="30" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
    <ellipse cx="450" cy="268" rx="96" ry="30" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>

  <g filter="url(#sk)">
    <circle cx="320" cy="112" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="190" cy="184" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="450" cy="184" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="120" cy="268" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="260" cy="268" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="380" cy="268" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="520" cy="268" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="320" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="190" y="189" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="450" y="189" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="120" y="273" text-anchor="middle" font-size="14" fill="#2e5a24" font-weight="bold">4</text>
  <text x="260" y="273" text-anchor="middle" font-size="14" fill="#2e5a24" font-weight="bold">5</text>
  <text x="380" y="273" text-anchor="middle" font-size="14" fill="#2e5a24" font-weight="bold">6</text>
  <text x="520" y="273" text-anchor="middle" font-size="14" fill="#2e5a24" font-weight="bold">7</text>

  <text x="190" y="236" text-anchor="middle" font-size="11" fill="#34506e" font-weight="bold"
        stroke="#fafafa" stroke-width="4" paint-order="stroke" filter="url(#sk)">② +1 对 (4,5)，上移 [0,2,0,0]</text>
  <text x="450" y="236" text-anchor="middle" font-size="11" fill="#34506e" font-weight="bold"
        stroke="#fafafa" stroke-width="4" paint-order="stroke" filter="url(#sk)">③ +1 对 (6,7)，上移 [0,2,0,0]</text>

  <text x="120" y="324" text-anchor="middle" font-size="11" fill="#2e5a24" filter="url(#sk)">[1,0,0,0]</text>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#2e5a24" filter="url(#sk)">[1,0,0,0]</text>
  <text x="380" y="324" text-anchor="middle" font-size="11" fill="#2e5a24" filter="url(#sk)">[1,0,0,0]</text>
  <text x="520" y="324" text-anchor="middle" font-size="11" fill="#2e5a24" filter="url(#sk)">[1,0,0,0]</text>

  <text x="190" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#sk)">路径 2 ≤ 3 ✓</text>
  <text x="450" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#sk)">路径 2 ≤ 3 ✓</text>

  <g filter="url(#sk)">
    <rect x="24" y="338" width="280" height="58" rx="10" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4"/>
    <rect x="336" y="338" width="280" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="24" y="406" width="280" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="336" y="406" width="280" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="164" y="361" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">① 四个叶子各自返回 [1, 0, 0, 0]</text>
  <text x="164" y="381" text-anchor="middle" font-size="10.5" fill="#777">下标 0 的格子是 1：自己距自己为 0</text>

  <text x="476" y="359" text-anchor="middle" font-size="11" fill="#8a6415" font-weight="bold">② 结点 2：L = [1,0,0,0] × R = [1,0,0,0]</text>
  <text x="476" y="377" text-anchor="middle" font-size="11" fill="#8a6415">(0+1) + (0+1) = 2 ≤ 3 ⇒ ans +1</text>
  <text x="476" y="391" text-anchor="middle" font-size="10" fill="#a8863f">合并 +1 上移成 [0, 2, 0, 0]</text>

  <text x="164" y="427" text-anchor="middle" font-size="11.5" fill="#8a6415" font-weight="bold">③ 结点 3：与 ② 完全对称 ⇒ ans +1</text>
  <text x="164" y="447" text-anchor="middle" font-size="10.5" fill="#a8863f">叶 6、叶 7 也各返回 [1,0,0,0]，</text>
  <text x="164" y="460" text-anchor="middle" font-size="10.5" fill="#a8863f">合并 +1 上移成 [0, 2, 0, 0]</text>

  <text x="476" y="425" text-anchor="middle" font-size="11" fill="#34506e" font-weight="bold">④ 根 1：L = [0,2,0,0] × R = [0,2,0,0]</text>
  <text x="476" y="443" text-anchor="middle" font-size="11" fill="#34506e">(1+1) + (1+1) = 4 &gt; 3 ⇒ 不计数</text>
  <text x="476" y="459" text-anchor="middle" font-size="11" fill="#34506e" font-weight="bold">ans = 1 + 1 + 0 = 2 ✓</text>

  <g filter="url(#sk)">
    <rect x="24" y="474" width="592" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="491" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">好对 = {(4,5), (6,7)}，ans = 2</text>
  <text x="320" y="507" text-anchor="middle" font-size="10.5" fill="#8f3830">叶 4 与叶 6 的 LCA 是根，路径 = 2 + 2 = 4 &gt; 3，不是好对</text>
</svg>
