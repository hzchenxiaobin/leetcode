<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">失配处只有两种删法：删 s[i] 或删 s[j]</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两侧已配对的字符不必再动，冲突只发生在夹逼到的那一对上</text>

  <text x="280" y="76" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">第 2 轮：s[1] = 'b' 与 s[2] = 'c' 失配</text>

  <g filter="url(#rough2)" font-size="17" text-anchor="middle">
    <rect x="173" y="86" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="196" y="116" fill="#3a4a66">a</text>
    <rect x="229" y="86" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
    <text x="252" y="116" fill="#8a3a36">b</text>
    <rect x="285" y="86" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
    <text x="308" y="116" fill="#8a3a36">c</text>
    <rect x="341" y="86" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="364" y="116" fill="#3a4a66">a</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#999" text-anchor="middle">
    <text x="196" y="148">0</text>
    <text x="252" y="148">1</text>
    <text x="308" y="148">2</text>
    <text x="364" y="148">3</text>
  </g>

  <text x="150" y="178" font-size="12" fill="#d6a040" font-weight="bold" text-anchor="middle" filter="url(#rough2)">i ↑</text>
  <text x="410" y="178" font-size="12" fill="#d6a040" font-weight="bold" text-anchor="middle" filter="url(#rough2)">j ↑</text>
  <path d="M 196 188 L 196 136" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 364 188 L 364 136" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="204" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">左指针</text>
  <text x="364" y="204" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">右指针</text>

  <rect x="34" y="216" width="238" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="50" y="236" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">分支 A：删掉 s[i] = 'b'</text>
  <text x="50" y="256" font-size="10" fill="#555" filter="url(#rough2)">检查区间 s[i+1..j] = “c” → 回文 ✓</text>

  <rect x="288" y="216" width="238" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="304" y="236" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">分支 B：删掉 s[j] = 'c'</text>
  <text x="304" y="256" font-size="10" fill="#555" filter="url(#rough2)">检查区间 s[i..j−1] = “b” → 回文 ✓</text>

  <path d="M 252 196 L 152 214" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 196 L 408 214" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="64" y="288" width="432" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">两条分支任一成立即为 true；若夹逼全程无失配，本身就是回文</text>
</svg>
