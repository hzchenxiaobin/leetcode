<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：首串频次表当初值，后续串逐位取 min</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">26 个计数器一次合并，最后一次性展开</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="170" y="72" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="97.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cnt[26] ← words[0] 的字符频次</text>
  <path d="M 290.0 114.0 L 290.0 140.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="140" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="165.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">freq[26] ← words[i] 的字符频次</text>
  <path d="M 290.0 182.0 L 290.0 208.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="208" width="240" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="233.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cnt[c] = min(cnt[c], freq[c])</text>
  <path d="M 410.0 229.0 L 452.0 229.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 452.0 229.0 L 452.0 161.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 452.0 161.0 L 412.0 161.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="424.0" y="250.0" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i = 1 .. n-1</text>
  <path d="M 290.0 250.0 L 290.0 276.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="276" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="300.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">按 a..z 展开：追加 cnt[c] 个字符</text>
  <text x="30.0" y="300.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">输出 ≤ 26·L 个字符</text>
  <rect x="30" y="330" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="351.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">复杂度 O(Σ|words[i]| + 26n)，空间 O(26)，只用一张频次表</text>
</svg>
