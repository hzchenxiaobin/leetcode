<svg xmlns="http://www.w3.org/2000/svg" width="640" height="508" viewBox="0 0 640 508" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="508" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">长度为 3 的回文 = x·y·x：两端夹出最宽中间窗口</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部：xyx 结构 -->
  <text x="130" y="84" text-anchor="end" font-size="12" font-weight="bold" fill="#446688">回文结构</text>
  <g filter="url(#sk)"><rect x="140" y="60" width="44" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="162" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">x</text>
  <g filter="url(#sk)"><rect x="192" y="60" width="44" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="214" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">y</text>
  <g filter="url(#sk)"><rect x="244" y="60" width="44" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="266" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">x</text>
  <text x="214" y="112" text-anchor="middle" font-size="9.5" fill="#888">首尾相同，y 可 = x（如 "aaa"）</text>
  <text x="310" y="74" font-size="12" font-weight="bold" fill="#2b2b2b">长度 3 的回文只有 xyx 一种：首尾同、中间任意</text>
  <text x="310" y="94" font-size="11" fill="#444">不同回文 ⇔ 不同有序对 (x, y)，至多 26×26 = 676 个</text>

  <!-- 图例 -->
  <g filter="url(#sk)"><rect x="300" y="116" width="14" height="11" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="318" y="126" font-size="10" fill="#444">两端 x</text>
  <g filter="url(#sk)"><rect x="374" y="116" width="14" height="11" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="392" y="126" font-size="10" fill="#444">中间开区间</text>
  <g filter="url(#sk)"><rect x="472" y="116" width="14" height="11" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.6"/></g>
  <text x="490" y="126" font-size="10" fill="#444">窗口外</text>

  <!-- 轨道 b -->
  <text x="62" y="184" text-anchor="middle" font-size="9.5" fill="#888">外层</text>
  <text x="62" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">x = 'b'</text>
  <text x="240" y="161" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a">中间开区间</text>
  <g filter="url(#sk)"><rect x="150" y="166" width="180" height="44" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 5"/></g>
  <g filter="url(#sk)"><rect x="110" y="170" width="38" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="129" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">b</text>
  <g filter="url(#sk)"><rect x="154" y="170" width="38" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="173" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">b</text>
  <g filter="url(#sk)"><rect x="198" y="170" width="38" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="217" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">c</text>
  <g filter="url(#sk)"><rect x="242" y="170" width="38" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="261" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">b</text>
  <g filter="url(#sk)"><rect x="286" y="170" width="38" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="305" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">a</text>
  <g filter="url(#sk)"><rect x="330" y="170" width="38" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="349" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">b</text>
  <g filter="url(#sk)"><rect x="374" y="170" width="38" height="34" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <text x="393" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">a</text>
  <text x="129" y="222" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="173" y="222" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="217" y="222" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="261" y="222" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="305" y="222" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="349" y="222" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="393" y="222" text-anchor="middle" font-size="9" fill="#888">6</text>
  <path d="M 129 236 L 349 236" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="129" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688">first[b] = 0</text>
  <text x="349" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688">last[b] = 5</text>
  <text x="436" y="184" font-size="11" font-weight="bold" fill="#2e6e2e">窗口内不同字符 {a, b, c}</text>
  <text x="436" y="202" font-size="11" fill="#444">→ bbb · bcb · bab</text>
  <text x="436" y="220" font-size="11" font-weight="bold" fill="#7a5415">贡献 3 个</text>

  <!-- 轨道 a -->
  <text x="62" y="284" text-anchor="middle" font-size="9.5" fill="#888">外层</text>
  <text x="62" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">x = 'a'</text>
  <text x="350" y="261" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a">中间</text>
  <g filter="url(#sk)"><rect x="326" y="266" width="48" height="44" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 5"/></g>
  <g filter="url(#sk)"><rect x="110" y="270" width="38" height="34" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <text x="129" y="293" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">b</text>
  <g filter="url(#sk)"><rect x="154" y="270" width="38" height="34" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <text x="173" y="293" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">b</text>
  <g filter="url(#sk)"><rect x="198" y="270" width="38" height="34" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <text x="217" y="293" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">c</text>
  <g filter="url(#sk)"><rect x="242" y="270" width="38" height="34" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <text x="261" y="293" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">b</text>
  <g filter="url(#sk)"><rect x="286" y="270" width="38" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="305" y="293" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">a</text>
  <g filter="url(#sk)"><rect x="330" y="270" width="38" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="349" y="293" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">b</text>
  <g filter="url(#sk)"><rect x="374" y="270" width="38" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="393" y="293" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">a</text>
  <text x="129" y="322" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="173" y="322" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="217" y="322" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="261" y="322" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="305" y="322" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="349" y="322" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="393" y="322" text-anchor="middle" font-size="9" fill="#888">6</text>
  <path d="M 305 336 L 393 336" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="296" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688">first[a] = 4</text>
  <text x="402" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688">last[a] = 6</text>
  <text x="436" y="284" font-size="11" font-weight="bold" fill="#2e6e2e">窗口内不同字符 {b}</text>
  <text x="436" y="302" font-size="11" fill="#444">→ aba</text>
  <text x="436" y="320" font-size="11" font-weight="bold" fill="#7a5415">贡献 1 个</text>

  <!-- 轨道 c -->
  <text x="62" y="384" text-anchor="middle" font-size="9.5" fill="#888">外层</text>
  <text x="62" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">x = 'c'</text>
  <g filter="url(#sk)"><rect x="110" y="370" width="38" height="34" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <text x="129" y="393" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">b</text>
  <g filter="url(#sk)"><rect x="154" y="370" width="38" height="34" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <text x="173" y="393" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">b</text>
  <g filter="url(#sk)"><rect x="198" y="370" width="38" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="217" y="393" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450">c</text>
  <g filter="url(#sk)"><rect x="242" y="370" width="38" height="34" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <text x="261" y="393" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">b</text>
  <g filter="url(#sk)"><rect x="286" y="370" width="38" height="34" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <text x="305" y="393" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">a</text>
  <g filter="url(#sk)"><rect x="330" y="370" width="38" height="34" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <text x="349" y="393" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">b</text>
  <g filter="url(#sk)"><rect x="374" y="370" width="38" height="34" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <text x="393" y="393" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">a</text>
  <text x="217" y="420" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">first[c] = last[c] = 2</text>
  <text x="436" y="384" font-size="11" font-weight="bold" fill="#b85450">只出现一次 → 窗口为空</text>
  <text x="436" y="402" font-size="11" fill="#888">跳过，贡献 0 个</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="40" y="436" width="560" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">ans = Σ 各外层字符窗口内不同字符数 = 3 + 1 + 0 = 4</text>
  <text x="320" y="478" text-anchor="middle" font-size="11" fill="#444">xyx 是子序列 ⇔ y 出现在开区间 (first[x], last[x]) 内</text>
</svg>
