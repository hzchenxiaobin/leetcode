<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">「不交叉」保证 ⇒ 两条查询边要么嵌套、要么不相交</text>

  <!-- ===== Panel A: disjoint ===== -->
  <g filter="url(#rough2)" fill="#e8f0fe" stroke="#446688" stroke-width="1.6">
    <circle cx="55" cy="92" r="15"/><circle cx="125" cy="92" r="15"/><circle cx="195" cy="92" r="15"/>
    <circle cx="265" cy="92" r="15"/><circle cx="335" cy="92" r="15"/><circle cx="405" cy="92" r="15"/>
    <circle cx="475" cy="92" r="15"/>
  </g>
  <g font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="55" y="96">0</text><text x="125" y="96">1</text><text x="195" y="96">2</text>
    <text x="265" y="96">3</text><text x="335" y="96">4</text><text x="405" y="96">5</text>
    <text x="475" y="96">6</text>
  </g>
  <g stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)">
    <line x1="74" y1="92" x2="107" y2="92"/><line x1="144" y1="92" x2="177" y2="92"/>
    <line x1="214" y1="92" x2="247" y2="92"/><line x1="284" y1="92" x2="317" y2="92"/>
    <line x1="354" y1="92" x2="387" y2="92"/><line x1="424" y1="92" x2="457" y2="92"/>
  </g>
  <path d="M 55 74 C 90 36, 160 36, 195 74" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="125" y="42" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(0,2)</text>
  <path d="M 265 74 C 330 36, 415 36, 475 74" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="370" y="42" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(3,6)</text>
  <text x="260" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">① 不相交：一左一右互不干扰 —— 可以在同一条路径里全用</text>

  <!-- ===== Panel B: nested ===== -->
  <g filter="url(#rough2)" fill="#e8f0fe" stroke="#446688" stroke-width="1.6">
    <circle cx="55" cy="200" r="15"/><circle cx="125" cy="200" r="15"/><circle cx="195" cy="200" r="15"/>
    <circle cx="265" cy="200" r="15"/><circle cx="335" cy="200" r="15"/><circle cx="405" cy="200" r="15"/>
    <circle cx="475" cy="200" r="15"/>
  </g>
  <g font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="55" y="204">0</text><text x="125" y="204">1</text><text x="195" y="204">2</text>
    <text x="265" y="204">3</text><text x="335" y="204">4</text><text x="405" y="204">5</text>
    <text x="475" y="204">6</text>
  </g>
  <g stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)">
    <line x1="74" y1="200" x2="107" y2="200"/><line x1="144" y1="200" x2="177" y2="200"/>
    <line x1="214" y1="200" x2="247" y2="200"/><line x1="284" y1="200" x2="317" y2="200"/>
    <line x1="354" y1="200" x2="387" y2="200"/><line x1="424" y1="200" x2="457" y2="200"/>
  </g>
  <path d="M 125 182 C 175 112, 355 112, 405 182" fill="none" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="265" y="116" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">(1,5) 外层</text>
  <path d="M 195 182 C 228 148, 302 148, 335 182" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="265" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">(2,4) 内层</text>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">② 嵌套：外层一跳跨过整个内部 —— 内层再无出头之日</text>

  <!-- ===== Panel C: crossing (forbidden) ===== -->
  <g filter="url(#rough2)" fill="#e8f0fe" stroke="#446688" stroke-width="1.6">
    <circle cx="55" cy="308" r="15"/><circle cx="125" cy="308" r="15"/><circle cx="195" cy="308" r="15"/>
    <circle cx="265" cy="308" r="15"/><circle cx="335" cy="308" r="15"/><circle cx="405" cy="308" r="15"/>
    <circle cx="475" cy="308" r="15"/>
  </g>
  <g font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="55" y="312">0</text><text x="125" y="312">1</text><text x="195" y="312">2</text>
    <text x="265" y="312">3</text><text x="335" y="312">4</text><text x="405" y="312">5</text>
    <text x="475" y="312">6</text>
  </g>
  <g stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)">
    <line x1="74" y1="308" x2="107" y2="308"/><line x1="144" y1="308" x2="177" y2="308"/>
    <line x1="214" y1="308" x2="247" y2="308"/><line x1="284" y1="308" x2="317" y2="308"/>
    <line x1="354" y1="308" x2="387" y2="308"/><line x1="424" y1="308" x2="457" y2="308"/>
  </g>
  <path d="M 55 290 C 100 250, 215 250, 265 290" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">(0,3)</text>
  <path d="M 195 290 C 245 228, 355 228, 405 290" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="310" y="224" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">(2,5)</text>
  <g stroke="#b85450" stroke-width="2.2" filter="url(#rough2)">
    <line x1="225" y1="261" x2="239" y2="275"/><line x1="239" y1="261" x2="225" y2="275"/>
  </g>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">③ 交叉：题面保证不出现 —— 它是本解法的生命线</text>

  <!-- insight box -->
  <g filter="url(#rough2)">
    <rect x="30" y="368" width="460" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="388" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">每条查询边 (u,v) 都是一个区间：不交叉 ⇒ 区间族「要么嵌套、要么不相交」（laminar 层叠族）</text>
  <text x="260" y="406" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">嵌套时「大的吃掉小的」，相离时互不干扰 —— 最优化就此坍缩成计数</text>
</svg>
