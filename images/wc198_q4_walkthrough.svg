<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="600" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：arr = [9, 12, 3, 7, 15]，target = 5</text>
  <path d="M 280 44 Q 470 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array -->
  <text x="175" y="99" font-size="11" fill="#888" font-weight="bold">arr:</text>
  <g font-size="14">
    <g filter="url(#sk)"><rect x="230" y="76" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="262" y="99" text-anchor="middle" fill="#2b6e9e" font-weight="bold">9</text>
    <g filter="url(#sk)"><rect x="294" y="76" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="326" y="99" text-anchor="middle" fill="#2b6e9e" font-weight="bold">12</text>
    <g filter="url(#sk)"><rect x="358" y="76" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="390" y="99" text-anchor="middle" fill="#2b6e9e" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="422" y="76" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="454" y="99" text-anchor="middle" fill="#2b6e9e" font-weight="bold">7</text>
    <g filter="url(#sk)"><rect x="486" y="76" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="518" y="99" text-anchor="middle" fill="#2b6e9e" font-weight="bold">15</text>
  </g>
  <text x="262" y="134" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="326" y="134" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="390" y="134" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="454" y="134" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="518" y="134" text-anchor="middle" font-size="10" fill="#999">4</text>
  <g filter="url(#sk)"><rect x="560" y="76" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.6"/></g>
  <text x="620" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">target = 5</text>

  <!-- table header -->
  <path d="M 88 168 L 872 168" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <text x="130" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">r</text>
  <text x="245" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">x = arr[r]</text>
  <text x="480" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">链 dp（降序，去重后）</text>
  <text x="700" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">检查的 |v − 5|</text>
  <text x="824" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">ans</text>
  <path d="M 190 176 L 190 498" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 300 176 L 300 498" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 650 176 L 650 498" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 762 176 L 762 498" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>

  <!-- row 0: r=0 -->
  <text x="130" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">0</text>
  <text x="245" y="234" text-anchor="middle" font-size="12" fill="#444">9</text>
  <g filter="url(#sk)"><rect x="350" y="212" width="36" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="368" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">9</text>
  <text x="700" y="234" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">4</text>
  <text x="824" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">4</text>
  <path d="M 88 258 L 872 258" stroke="#e5e0d5" stroke-width="1.2" filter="url(#sk)"/>

  <!-- row 1: r=1 -->
  <text x="130" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">1</text>
  <text x="245" y="294" text-anchor="middle" font-size="12" fill="#444">12</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="350" y="272" width="36" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="368" y="292" text-anchor="middle" fill="#2e6e2e" font-weight="bold">12</text>
    <g filter="url(#sk)"><rect x="392" y="272" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="410" y="292" text-anchor="middle" fill="#2b6e9e" font-weight="bold">8</text>
  </g>
  <text x="446" y="292" font-size="9.5" fill="#999">（9&amp;12=8）</text>
  <text x="700" y="294" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">7, 3</text>
  <text x="824" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">3</text>
  <path d="M 88 318 L 872 318" stroke="#e5e0d5" stroke-width="1.2" filter="url(#sk)"/>

  <!-- row 2: r=2 (highlight) -->
  <g filter="url(#sk)">
    <rect x="88" y="322" width="784" height="52" rx="6" fill="#eaf6ee" opacity="0.85"/>
  </g>
  <text x="130" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="245" y="354" text-anchor="middle" font-size="12" fill="#444">3</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="350" y="332" width="36" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="368" y="352" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="392" y="332" width="36" height="30" rx="4" fill="#fce4ec" stroke="#b03a3a" stroke-width="2"/></g>
    <text x="410" y="352" text-anchor="middle" fill="#b03a3a" font-weight="bold">0</text>
  </g>
  <text x="446" y="352" font-size="9.5" fill="#b03a3a" font-weight="bold">12&amp;3 = 8&amp;3 = 0 碰撞！</text>
  <text x="700" y="348" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">2（3 &lt; 5：首个低于 target）</text>
  <text x="700" y="366" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">break，0 跳过</text>
  <g filter="url(#sk)"><ellipse cx="824" cy="349" rx="20" ry="16" fill="none" stroke="#b03a3a" stroke-width="1.8"/></g>
  <text x="824" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">2</text>
  <path d="M 88 378 L 872 378" stroke="#e5e0d5" stroke-width="1.2" filter="url(#sk)"/>

  <!-- row 3: r=3 -->
  <text x="130" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">3</text>
  <text x="245" y="414" text-anchor="middle" font-size="12" fill="#444">7</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="350" y="392" width="36" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="368" y="412" text-anchor="middle" fill="#2e6e2e" font-weight="bold">7</text>
    <g filter="url(#sk)"><rect x="392" y="392" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="410" y="412" text-anchor="middle" fill="#2b6e9e" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="434" y="392" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="452" y="412" text-anchor="middle" fill="#2b6e9e" font-weight="bold">0</text>
  </g>
  <text x="486" y="412" font-size="9.5" fill="#999">（3&amp;7、0&amp;7 原地踏步）</text>
  <text x="700" y="414" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">2, 2（断）</text>
  <text x="824" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">2</text>
  <path d="M 88 438 L 872 438" stroke="#e5e0d5" stroke-width="1.2" filter="url(#sk)"/>

  <!-- row 4: r=4 -->
  <text x="130" y="474" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">4</text>
  <text x="245" y="474" text-anchor="middle" font-size="12" fill="#444">15</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="350" y="452" width="36" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="368" y="472" text-anchor="middle" fill="#2e6e2e" font-weight="bold">15</text>
    <g filter="url(#sk)"><rect x="392" y="452" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="410" y="472" text-anchor="middle" fill="#2b6e9e" font-weight="bold">7</text>
    <g filter="url(#sk)"><rect x="434" y="452" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="452" y="472" text-anchor="middle" fill="#2b6e9e" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="476" y="452" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="494" y="472" text-anchor="middle" fill="#2b6e9e" font-weight="bold">0</text>
  </g>
  <text x="700" y="474" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">10, 2, 2（断）</text>
  <text x="824" y="474" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">2</text>
  <path d="M 88 498 L 872 498" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>

  <!-- ===== conclusion box ===== -->
  <g filter="url(#sk)">
    <rect x="80" y="518" width="800" height="72" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="100" y="542" font-size="12.5" font-weight="bold" fill="#2e6e2e">结论</text>
  <text x="100" y="564" font-size="11" fill="#333">第 3 步（r = 2）是关键一跳：12 &amp; 3 = 8 &amp; 3 = 0 殊途同归，两条链值碰撞成一个 —— 去重正是链长 ≤ 21 的保证。</text>
  <text x="100" y="584" font-size="11.5" font-weight="bold" fill="#2e6e2e">最终答案 ans = 2（7 和 3 都距 5 差 2）。（断）= 首个 v &lt; target，检查后 break，其后更小的值不再扫。</text>
</svg>
