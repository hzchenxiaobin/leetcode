<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="700" height="450" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：高半（前缀）唯一确定二进制回文数</text>
  <path d="M 180 40 Q 350 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- even row L=6 : 45 = 101101 -->
  <text x="168" y="128" text-anchor="end" font-size="13.5" fill="#555">L = 6（偶）</text>
  <g filter="url(#sk)">
    <rect x="180" y="100" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="233" y="100" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="286" y="100" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="339" y="100" width="50" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="392" y="100" width="50" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="445" y="100" width="50" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="205" y="130" text-anchor="middle" font-size="17" fill="#333">1</text>
  <text x="258" y="130" text-anchor="middle" font-size="17" fill="#333">0</text>
  <text x="311" y="130" text-anchor="middle" font-size="17" fill="#333">1</text>
  <text x="364" y="130" text-anchor="middle" font-size="17" fill="#333">1</text>
  <text x="417" y="130" text-anchor="middle" font-size="17" fill="#333">0</text>
  <text x="470" y="130" text-anchor="middle" font-size="17" fill="#333">1</text>
  <path d="M 205 96 Q 337 40 468 96" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 258 96 Q 337 52 415 96" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 311 96 Q 337 66 362 96" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="562" y="120" font-size="12.5" fill="#555">45 =</text>
  <text x="562" y="138" font-size="12.5" fill="#555">101101</text>
  <text x="258" y="170" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">高 H=⌈L/2⌉=3 位（前缀 h=101，首位必须 1）</text>
  <text x="417" y="170" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-weight="bold">低 W=⌊L/2⌋=3 位（镜像）</text>

  <!-- odd row L=7 : 73 = 1001001 -->
  <text x="168" y="248" text-anchor="end" font-size="13.5" fill="#555">L = 7（奇）</text>
  <g filter="url(#sk)">
    <rect x="180" y="220" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="233" y="220" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="286" y="220" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="339" y="220" width="50" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="392" y="220" width="50" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="445" y="220" width="50" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="498" y="220" width="50" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="205" y="250" text-anchor="middle" font-size="17" fill="#333">1</text>
  <text x="258" y="250" text-anchor="middle" font-size="17" fill="#333">0</text>
  <text x="311" y="250" text-anchor="middle" font-size="17" fill="#333">0</text>
  <text x="364" y="250" text-anchor="middle" font-size="17" fill="#7a5416" font-weight="bold">1</text>
  <text x="417" y="250" text-anchor="middle" font-size="17" fill="#333">0</text>
  <text x="470" y="250" text-anchor="middle" font-size="17" fill="#333">0</text>
  <text x="523" y="250" text-anchor="middle" font-size="17" fill="#333">1</text>
  <path d="M 205 216 Q 364 160 521 216" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 258 216 Q 364 172 468 216" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 311 216 Q 364 186 415 216" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="562" y="240" font-size="12.5" fill="#555">73 =</text>
  <text x="562" y="258" font-size="12.5" fill="#555">1001001</text>
  <text x="258" y="290" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">高 H=4 位</text>
  <text x="486" y="290" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-weight="bold">低 W=3 位 = 高 3 位反转</text>
  <text x="364" y="314" text-anchor="middle" font-size="12" fill="#7a5416">中间位：属于高半、只出现一次（不被复制）</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="70" y="336" width="560" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="350" y="364" text-anchor="middle" font-size="13.5" fill="#8e3a34" font-weight="bold">① 长度 L 的回文数 ⟷ 前缀 h ∈ [2^(H−1), 2^H)，共 2^(H−1) 个</text>
  <text x="350" y="390" text-anchor="middle" font-size="13.5" fill="#8e3a34" font-weight="bold">② 同长度下前缀越大，回文数越大（单调性）</text>
  <text x="350" y="414" text-anchor="middle" font-size="12" fill="#8e3a34">③ 构造：pal(h) 的低 W 位 = h 的前 W 位（奇数长先去掉中间位）反转</text>
</svg>
