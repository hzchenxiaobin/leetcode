<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一趟预计算，再逐格双判</text>

  <!-- 开始 -->
  <rect x="270" y="42" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="61" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M320,70 L320,86" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 预计算 -->
  <rect x="170" y="90" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="108" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">一趟预计算（同一个 (i,j) 双循环）</text>
  <text x="320" y="128" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">minRow[i] ← min(第 i 行)，maxCol[j] ← max(第 j 列)</text>
  <path d="M320,136 L320,150" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环 pill -->
  <rect x="232" y="154" width="176" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="171" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">遍历每个格子 (i, j)</text>
  <path d="M320,180 L320,192" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="320,194 462,230 320,266 178,230" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="225" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">a[i][j] == minRow[i]</text>
  <text x="320" y="242" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">且 a[i][j] == maxCol[j] ？</text>

  <!-- 是分支 -->
  <text x="166" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M178,230 L152,230" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="212" width="132" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="86" y="234" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">收入 ans</text>

  <!-- 否分支 -->
  <text x="474" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M462,230 L488,230" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="492" y="212" width="126" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="555" y="234" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">跳过（非幸运）</text>

  <!-- 汇合 -->
  <path d="M86,248 L86,286" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M555,248 L555,286" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M86,286 L555,286" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M320,286 L320,300" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 下一格圆 -->
  <circle cx="320" cy="318" r="16" fill="#fafafa" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">下一格</text>

  <!-- 回边 -->
  <path d="M336,318 L628,318 L628,167 L412,167" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="600" y="310" font-size="10.5" fill="#888" filter="url(#rough2)">继续</text>

  <!-- 循环结束 -->
  <text x="333" y="354" font-size="10.5" fill="#888" filter="url(#rough2)">格子取尽</text>
  <path d="M320,334 L320,350" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="354" width="160" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="374" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">返回 ans（可为空）</text>

  <!-- 底部要点 -->
  <rect x="60" y="398" width="520" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="417" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">minRow 与 maxCol 在同一趟双循环里同时更新——预计算只扫一遍</text>
  <text x="320" y="436" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">元素互异 ⇒ 答案至多一个；ans 为空即无幸运数</text>
</svg>
