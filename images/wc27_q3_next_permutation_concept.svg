<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">数位上的「下一个排列」：找最靠右的升序对</text>
  <text x="290" y="50" text-anchor="middle" font-size="10.5" fill="#888">要得到「刚好多一点」的数，必须让尽可能靠右的高位变大，并让它右边的低位最小</text>

  <!-- 索引标号 -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="154" y="70">0</text>
    <text x="222" y="70">1</text>
    <text x="290" y="70">2</text>
    <text x="358" y="70">3</text>
    <text x="426" y="70">4</text>
  </g>

  <!-- 数位盒子：1 2 4 3 1 -->
  <g filter="url(#rough2)">
    <rect x="124" y="78" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="192" y="78" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6"/>
    <rect x="260" y="78" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <rect x="328" y="78" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <rect x="396" y="78" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="22" text-anchor="middle" fill="#333">
    <text x="154" y="107">1</text>
    <text x="222" y="107">2</text>
    <text x="290" y="107">4</text>
    <text x="358" y="107">3</text>
    <text x="426" y="107">1</text>
  </g>

  <!-- 后缀括号 -->
  <path d="M 260 128 L 260 138 L 456 138 L 456 128" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="358" y="156" text-anchor="middle" font-size="10" fill="#3a5a30">后缀 4,3,1 非递增 ⇒ 已是它能排出的最大值</text>

  <!-- 枢纽箭头 -->
  <path d="M 222 202 L 222 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="222" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">枢纽 i = 1（最靠右的升序对）</text>
  <text x="222" y="238" text-anchor="middle" font-size="10" fill="#555">d[1] = 2 &lt; d[2] = 4：只有从这里「进位」才能让数变大</text>

  <!-- 两步操作 -->
  <rect x="40" y="258" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="278" font-size="10.5" fill="#8a6a20" font-weight="bold">① 交换：把 d[i] 与「右侧第一个大于 d[i]」的数对调</text>
  <text x="56" y="296" font-size="10" fill="#555">使第 i 位变大「最少的一格」；第 i 位右侧全是非递增，故 j 从最右端往左找即可</text>

  <rect x="40" y="316" width="500" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="336" font-size="10.5" fill="#3a5a30" font-weight="bold">② 反转：把 i 之后的后缀整体反转</text>
  <text x="56" y="354" font-size="10" fill="#555">后缀原为非递增，反转后成为升序 —— 即该后缀能排出的最小值，低位被压到最小</text>

  <text x="290" y="392" text-anchor="middle" font-size="10" fill="#999">若整串本身就是非递增（不存在升序对），说明它已是最大排列 ⇒ 返回 −1</text>
  <text x="290" y="410" text-anchor="middle" font-size="10" fill="#b85450">两步都取「最小的一步」⇒ 拼出的数恰是「大于 n 的最小排列」</text>
</svg>
