<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">算法流程：O(n·m) 逐对判定</text>

  <rect x="185" y="42" width="90" height="28" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M230,70 L230,84" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="88" width="180" height="46" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="108" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取下一个数对 (i, j)</text>
  <text x="230" y="126" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">x = nums1[i]，y = nums2[j]</text>

  <path d="M320,111 L444,111 L444,154" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="103" font-size="10.5" fill="#999" filter="url(#rough2)">n·m 对全部枚举完 →</text>
  <rect x="390" y="158" width="108" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="444" y="180" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M230,134 L230,148" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="152" width="180" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="171" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">r = x mod (y · k)</text>
  <text x="230" y="189" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">k 乘在 y 上，括号必须加！</text>

  <path d="M230,196 L230,210" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M230,212 L318,242 L230,272 L142,242 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="246" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">r == 0 ?</text>

  <text x="240" y="288" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M230,272 L230,296" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="165" y="300" width="130" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="321" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">ans ← ans + 1</text>

  <text x="118" y="236" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M142,242 L58,242" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M230,334 L230,364" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M230,364 L58,364" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M58,364 L58,111 L134,111" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <circle cx="58" cy="242" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="144" y="358" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">汇合后继续下一对</text>

  <text x="280" y="410" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">判定次数 = n·m ≤ 2500，每对一次乘法 + 一次取模 → O(n·m) 就是正解</text>
</svg>
