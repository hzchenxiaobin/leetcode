<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">left / right 连续段长：谷底日的两侧视野</text>

  <!-- security 数组 -->
  <text x="36" y="72" font-size="12" fill="#666" filter="url(#rough2)">security</text>
  <g filter="url(#rough2)">
    <rect x="105" y="52" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="153" y="52" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="201" y="52" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="249" y="52" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="297" y="52" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="345" y="52" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="393" y="52" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="128" y="73">5</text><text x="176" y="73">3</text><text x="224" y="73">3</text>
    <text x="272" y="73">3</text><text x="320" y="73">5</text><text x="368" y="73">6</text><text x="416" y="73">2</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="128" y="97">0</text><text x="176" y="97">1</text><text x="224" y="97">2</text>
    <text x="272" y="97">3</text><text x="320" y="97">4</text><text x="368" y="97">5</text><text x="416" y="97">6</text>
  </g>

  <!-- left 数组 -->
  <text x="36" y="140" font-size="12" fill="#446688" filter="url(#rough2)">left</text>
  <g font-size="13" text-anchor="middle" fill="#2b3d52" filter="url(#rough2)">
    <rect x="105" y="120" width="46" height="30" fill="#e8f0fe" stroke="#7c9ec4" stroke-width="1.2" rx="4"/>
    <rect x="153" y="120" width="46" height="30" fill="#e8f0fe" stroke="#7c9ec4" stroke-width="1.2" rx="4"/>
    <rect x="201" y="120" width="46" height="30" fill="#e8f0fe" stroke="#7c9ec4" stroke-width="1.2" rx="4"/>
    <rect x="249" y="120" width="46" height="30" fill="#e8f0fe" stroke="#7c9ec4" stroke-width="1.2" rx="4"/>
    <rect x="297" y="120" width="46" height="30" fill="#e8f0fe" stroke="#7c9ec4" stroke-width="1.2" rx="4"/>
    <rect x="345" y="120" width="46" height="30" fill="#e8f0fe" stroke="#7c9ec4" stroke-width="1.2" rx="4"/>
    <rect x="393" y="120" width="46" height="30" fill="#e8f0fe" stroke="#7c9ec4" stroke-width="1.2" rx="4"/>
    <text x="128" y="140">1</text><text x="176" y="140">2</text><text x="224" y="140">3</text>
    <text x="272" y="140">4</text><text x="320" y="140">1</text><text x="368" y="140">1</text><text x="416" y="140">2</text>
  </g>
  <path d="M 108 168 L 200 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="182" font-size="11" fill="#446688" filter="url(#rough2)">正序递推：以 i 结尾的非递增段</text>

  <!-- right 数组 -->
  <text x="36" y="216" font-size="12" fill="#4a7a3a" filter="url(#rough2)">right</text>
  <g font-size="13" text-anchor="middle" fill="#2e4d24" filter="url(#rough2)">
    <rect x="105" y="196" width="46" height="30" fill="#e6f4ea" stroke="#8ab87c" stroke-width="1.2" rx="4"/>
    <rect x="153" y="196" width="46" height="30" fill="#e6f4ea" stroke="#8ab87c" stroke-width="1.2" rx="4"/>
    <rect x="201" y="196" width="46" height="30" fill="#e6f4ea" stroke="#8ab87c" stroke-width="1.2" rx="4"/>
    <rect x="249" y="196" width="46" height="30" fill="#e6f4ea" stroke="#8ab87c" stroke-width="1.2" rx="4"/>
    <rect x="297" y="196" width="46" height="30" fill="#e6f4ea" stroke="#8ab87c" stroke-width="1.2" rx="4"/>
    <rect x="345" y="196" width="46" height="30" fill="#e6f4ea" stroke="#8ab87c" stroke-width="1.2" rx="4"/>
    <rect x="393" y="196" width="46" height="30" fill="#e6f4ea" stroke="#8ab87c" stroke-width="1.2" rx="4"/>
    <text x="128" y="216">1</text><text x="176" y="216">5</text><text x="224" y="216">4</text>
    <text x="272" y="216">3</text><text x="320" y="216">2</text><text x="368" y="216">1</text><text x="416" y="216">1</text>
  </g>
  <path d="M 436 244 L 344 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="348" y="258" font-size="11" fill="#4a7a3a" filter="url(#rough2)">逆序递推：以 i 开头的非递减段</text>

  <!-- 谷底标注 -->
  <path d="M 224 232 C 224 252, 230 260, 240 266" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="120" y="270" width="290" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="265" y="292" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">谷底日 i=2：left[2] = 3 ≥ time+1 = 3 ✓</text>
  <text x="265" y="310" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">且 right[2] = 4 ≥ 3 ✓ → 适合野炊</text>
  <text x="265" y="328" text-anchor="middle" font-size="11.5" fill="#a3766f" filter="url(#rough2)">段长含自身，越界条件被段长上界吸收</text>
</svg>
