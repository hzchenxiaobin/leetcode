<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="440" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：i 步进 2，只在错位时回看 j</text>
  <rect x="240" y="50" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="71.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 0, j = 1</text>
  <polygon points="330 93.0 410.0 118 330 143.0 250.0 118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="122.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <rect x="240" y="156" width="180" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="177.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 nums</text>
  <polygon points="330 197.0 420.0 222 330 247.0 240.0 222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="226.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[i] 为偶数？</text>
  <rect x="30" y="282" width="150" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="306.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i += 2</text>
  <polygon points="370 277.0 465.0 302 370 327.0 275.0 302" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="306.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[j] 为奇数？</text>
  <rect x="560" y="282" width="90" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="605.0" y="306.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j += 2</text>
  <rect x="370" y="356" width="190" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465.0" y="379.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">swap 后 i, j 各 +2</text>
  <path d="M 330 84 L 330 92" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 144 L 330 154" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="352" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 330 172 L 330 196" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="352" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 255 240 L 110 280" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 415 240 L 405 276" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="200" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="440" y="262" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">否</text>
  <path d="M 465 302 L 555 302" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 405 328 L 405 354" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="440" y="344" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="330" y="420" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">两条「前进」分支互不干扰；只有确认 nums[i]、nums[j] 都错位时才交换</text>
</svg>
