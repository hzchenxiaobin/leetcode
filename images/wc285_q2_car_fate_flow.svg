<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">逐车命运判定：L 看左侧有没有障碍，R 看右侧，S 不计分</text>
  <path d="M 240 46 Q 470 54 700 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start box -->
  <g filter="url(#sk)">
    <rect x="320" y="56" width="300" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="470" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">对每辆车 i 问一句话：你会撞上谁？</text>
  <path d="M 470 96 L 470 130 L 170 130 L 170 202" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <!-- root diamond -->
  <g filter="url(#sk)">
    <path d="M 100 240 L 170 206 L 240 240 L 170 274 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="170" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">d[i] = ?</text>

  <!-- S branch -->
  <path d="M 240 226 L 300 226 L 300 128 L 318 128" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="264" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0782a" filter="url(#sk)">S</text>
  <g filter="url(#sk)">
    <rect x="322" y="100" width="288" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="466" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0782a" filter="url(#sk)">静止车：被撞不计数</text>
  <text x="466" y="144" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">计分只数「当时还在移动」的车 → 贡献 0</text>

  <!-- L branch -->
  <path d="M 240 240 L 346 240" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="295" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">L</text>
  <g filter="url(#sk)">
    <path d="M 350 240 L 430 208 L 510 240 L 430 272 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="430" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038" filter="url(#sk)">左侧存在 R / S ?</text>

  <!-- R branch -->
  <path d="M 240 254 L 300 254 L 300 352 L 346 352" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="312" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">R</text>
  <g filter="url(#sk)">
    <path d="M 350 352 L 430 320 L 510 352 L 430 384 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="430" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038" filter="url(#sk)">右侧存在 L / S ?</text>

  <!-- L: yes -->
  <path d="M 510 240 L 545 240 L 545 170 L 576 170" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="560" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="580" y="142" width="310" height="56" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="735" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">贡献 1 —— 必撞</text>
  <text x="735" y="186" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">左侧最近的非 L：S 挡路 / R 迎面，总有一堵墙</text>

  <!-- L: no -->
  <path d="M 510 240 L 545 240 L 545 290 L 576 290" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="560" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="580" y="262" width="310" height="56" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="735" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#777" filter="url(#sk)">逃逸 0 —— 永不碰撞</text>
  <text x="735" y="306" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">左侧全是同向同速的 L，间距恒定 → i 属于前缀 L 段</text>

  <!-- R: yes -->
  <path d="M 510 352 L 545 352 L 545 430 L 576 430" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="560" y="396" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="580" y="402" width="310" height="56" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="735" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">贡献 1 —— 必撞</text>
  <text x="735" y="446" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">右侧最近的非 R：S 挡路 / L 迎面，总有一堵墙</text>

  <!-- R: no -->
  <path d="M 510 352 L 545 352 L 545 550 L 576 550" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="560" y="512" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="580" y="522" width="310" height="56" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="735" y="545" text-anchor="middle" font-size="12" font-weight="bold" fill="#777" filter="url(#sk)">逃逸 0 —— 永不碰撞</text>
  <text x="735" y="566" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">右侧全是同向同速的 R，间距恒定 → i 属于后缀 R 段</text>

  <!-- shortcut card -->
  <g filter="url(#sk)">
    <rect x="52" y="432" width="284" height="146" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="194" y="458" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a0782a" filter="url(#sk)">等价速算（免回看）</text>
  <text x="194" y="482" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">「i 左侧存在非 L」⟺ i ≥ l</text>
  <text x="194" y="504" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">「i 右侧存在非 R」⟺ i ≤ r</text>
  <text x="194" y="526" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">l = 前缀 L 段长，r = n − 1 − 后缀 R 段长</text>
  <text x="194" y="554" text-anchor="middle" font-size="11" font-weight="bold" fill="#a0782a" filter="url(#sk)">→ 剥掉两侧逃逸车，一次扫描搞定</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="140" y="596" width="660" height="38" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="470" y="620" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">答案 = Σ 各车贡献 = 剥掉前缀 L、后缀 R 后中间段内 L / R 的个数</text>
</svg>
