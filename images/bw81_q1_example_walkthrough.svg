<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "yo|uar|e**|b|e***au|tifu|l"（答案 5）</text>

  <!-- 按竖线切段 -->
  <text x="280" y="58" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="middle">按竖线 split 后的 9 段（偶数下标段在门外，奇数下标段在门内）：</text>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <!-- 段: yo | uar | e** | b | e***au | tifu | l -->
    <rect x="52" y="74" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="75" y="96">yo</text>
    <text x="106" y="96" fill="#d6a040" font-weight="bold">|</text>
    <rect x="116" y="74" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="142" y="96">uar</text>
    <text x="174" y="96" fill="#d6a040" font-weight="bold">|</text>
    <rect x="184" y="74" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="207" y="96">e**</text>
    <text x="234" y="96" fill="#d6a040" font-weight="bold">|</text>
    <rect x="244" y="74" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="261" y="96">b</text>
    <text x="282" y="96" fill="#d6a040" font-weight="bold">|</text>
    <rect x="292" y="74" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="327" y="96">e***au</text>
    <text x="366" y="96" fill="#d6a040" font-weight="bold">|</text>
    <rect x="376" y="74" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="402" y="96">tifu</text>
    <text x="432" y="96" fill="#d6a040" font-weight="bold">|</text>
    <rect x="442" y="74" width="26" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="455" y="96">l</text>
  </g>
  <text x="500" y="96" font-size="12" fill="#888" filter="url(#rough2)">下标 0..8</text>

  <!-- 每段计数表 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="52" y="126" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="75" y="146">0</text>
    <rect x="116" y="126" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="142" y="146">—</text>
    <rect x="184" y="126" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="207" y="146">2</text>
    <rect x="244" y="126" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="261" y="146">—</text>
    <rect x="292" y="126" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="327" y="146">3</text>
    <rect x="376" y="126" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="402" y="146">—</text>
    <rect x="442" y="126" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="455" y="146">0</text>
  </g>
  <text x="36" y="146" font-size="12.5" fill="#446688" filter="url(#rough2)" text-anchor="end">星号数</text>

  <!-- 求和 -->
  <path d="M 468 141 L 492 141" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="494" y="124" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="516" y="146" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0+2+3</text>
  <text x="516" y="172" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 5 ✓</text>

  <!-- 两种视角 -->
  <g filter="url(#rough2)">
    <rect x="40" y="200" width="230" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="155" y="224" text-anchor="middle" font-weight="bold" fill="#446688">视角一：split 计数（左图）</text>
    <text x="155" y="248" text-anchor="middle">s.split('|') 得到 2k+1 段</text>
    <text x="155" y="268" text-anchor="middle">偶数下标段（0、2、4、6、8）在门外</text>
    <text x="155" y="288" text-anchor="middle">sum(段.count('*'))</text>
    <text x="155" y="304" text-anchor="middle" font-size="12" fill="#888">适合 Python 一行；需 O(n) 额外串</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="290" y="200" width="230" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="405" y="224" text-anchor="middle" font-weight="bold" fill="#4a7a3a">视角二：单趟开关（推荐）</text>
    <text x="405" y="248" text-anchor="middle">bool inPair = false</text>
    <text x="405" y="268" text-anchor="middle">遇 '|' 翻转；遇 '*' 且门外 → 计数</text>
    <text x="405" y="288" text-anchor="middle">O(1) 额外空间</text>
    <text x="405" y="304" text-anchor="middle" font-size="12" fill="#888">两种视角结果恒相等</text>
  </g>

  <text x="280" y="344" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">示例 1（"l|*e*et|c**o|*de|"）同理：门外段 l / c**o / *de → 0 + 2 + 0 = 2</text>
  <text x="280" y="362" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">示例 2（"iamprogrammer"）没有竖线也没有星号 → 0</text>
</svg>
