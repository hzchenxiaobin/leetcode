<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">每个深度 d 只需回答一件事：别的 d 长前缀够不够 k 个</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">把「删掉 w_i」的影响拆成「自己的路径」和「同层其它前缀」两部分</text>
  <rect x="24" y="62" width="512" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① d ≤ |w_i|：d 长前缀里可能只有 w_i 这一个前缀受影响</text>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">w_i 的前缀：cnt − 1 ≥ k ？</text>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">同层其它前缀：maxOther ≥ k ？</text>
  <text x="280" y="151" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">maxOther = （cnt 是该层唯一最大）? 次大值 H2 : 最大值 H1</text>
  <rect x="24" y="176" width="512" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② d &gt; |w_i|：w_i 根本不存在 d 长前缀</text>
  <text x="280" y="222" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">此时只看「整棵 Trie 里深度 d 有没有计数 ≥ k 的节点」</text>
  <text x="280" y="244" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">预处理 bestFree[d] = 深度 ≥ d 的最大可行深度，O(1) 查询</text>
  <rect x="24" y="272" width="512" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">answer_i = max（① 中可行的最大 d，② 中的 bestFree[|w_i|+1]）</text>
  <text x="280" y="314" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">为什么 ② 必须存在：删掉最短串后，答案可能比它更长</text>
  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#333333" font-weight="bold" filter="url(#rough2)">每层的 H1、m1、H2 只统计一次，总复杂度 O(总字符数)</text>
  <text x="280.0" y="388" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">例：words = ["a","aaa"]，删 "a" 后答案 3 &gt; |"a"| = 1</text>
</svg>
