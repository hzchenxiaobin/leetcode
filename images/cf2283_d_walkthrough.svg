<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 448" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="700" height="448" fill="#fafafa"/>

  <text x="350" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">样例 1 走查：n = 5，树为路径 2−1−3−4−5，取 k = 6</text>

  <!-- panel 1 -->
  <rect x="18" y="38" width="216" height="134" rx="10" fill="#ffffff" stroke="#8a9bb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="58" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① 初始：全白</text>
  <line x1="46" y1="106" x2="86" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="86" y1="106" x2="126" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="126" y1="106" x2="166" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="166" y1="106" x2="206" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="46" cy="106" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="111" text-anchor="middle" font-size="11" fill="#2c4a66" filter="url(#rough2)">2</text>
  <circle cx="86" cy="106" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="111" text-anchor="middle" font-size="11" fill="#2c4a66" filter="url(#rough2)">1</text>
  <circle cx="126" cy="106" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="126" y="111" text-anchor="middle" font-size="11" fill="#2c4a66" filter="url(#rough2)">3</text>
  <circle cx="166" cy="106" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="111" text-anchor="middle" font-size="11" fill="#2c4a66" filter="url(#rough2)">4</text>
  <circle cx="206" cy="106" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="206" y="111" text-anchor="middle" font-size="11" fill="#2c4a66" filter="url(#rough2)">5</text>
  <text x="126" y="156" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">黑 0 / 灰 0</text>

  <!-- panel 2 -->
  <rect x="242" y="38" width="216" height="134" rx="10" fill="#ffffff" stroke="#8a9bb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="58" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">② 处理 (1,5)：1、5 黑</text>
  <line x1="270" y1="106" x2="310" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="310" y1="106" x2="350" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="350" y1="106" x2="390" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="390" y1="106" x2="430" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="270" cy="106" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="111" text-anchor="middle" font-size="11" fill="#2c4a66" filter="url(#rough2)">2</text>
  <circle cx="310" cy="106" r="14" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="111" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">1</text>
  <circle cx="350" cy="106" r="14" fill="#c9ccd1" stroke="#6b7280" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="390" cy="106" r="14" fill="#c9ccd1" stroke="#6b7280" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="430" cy="106" r="14" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="111" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">5</text>
  <text x="350" y="156" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">黑 2 / 灰 2（3、4 是路径内部白点）</text>

  <!-- panel 3 -->
  <rect x="466" y="38" width="216" height="134" rx="10" fill="#ffffff" stroke="#8a9bb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="574" y="58" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">③ 处理 (2,4) = 终态</text>
  <line x1="494" y1="106" x2="534" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="534" y1="106" x2="574" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="574" y1="106" x2="614" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="614" y1="106" x2="654" y2="106" stroke="#8a9bb0" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="494" cy="106" r="14" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="494" y="111" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">2</text>
  <circle cx="534" cy="106" r="14" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="534" y="111" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">1</text>
  <circle cx="574" cy="106" r="14" fill="#c9ccd1" stroke="#6b7280" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="574" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="614" cy="106" r="14" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="614" y="111" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">4</text>
  <circle cx="654" cy="106" r="14" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="654" y="111" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">5</text>
  <text x="574" y="156" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">黑 4 / 灰 1（只剩 3 号灰）</text>

  <!-- explanation bar -->
  <rect x="18" y="184" width="664" height="40" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="209" text-anchor="middle" font-size="11" fill="#2c4a66" filter="url(#rough2)">k = 6 的两对是 (1,5)、(2,4)：第 2 步路径上 1 已黑、3 已灰 ⇒ 没有新的白点被染灰</text>

  <!-- part B table -->
  <text x="350" y="250" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">样例 3（n = 5，树为路径 5−1−3−2−4）：三个候选都只有 4 个黑点，比灰点</text>

  <rect x="40" y="262" width="620" height="140" rx="10" fill="#ffffff" stroke="#8a9bb0" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="40" y1="292" x2="660" y2="292" stroke="#8a9bb0" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="40" y1="320" x2="660" y2="320" stroke="#c9d2dd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="348" x2="660" y2="348" stroke="#c9d2dd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="376" x2="660" y2="376" stroke="#c9d2dd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="130" y1="262" x2="130" y2="402" stroke="#c9d2dd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="230" y1="262" x2="230" y2="402" stroke="#c9d2dd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="262" x2="470" y2="402" stroke="#c9d2dd" stroke-width="1" filter="url(#rough2)"/>

  <text x="85" y="283" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k</text>
  <text x="180" y="283" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">不黑的 m</text>
  <text x="350" y="283" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">m 落在某个配对路径内部？</text>
  <text x="565" y="283" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">灰点数</text>

  <text x="85" y="311" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="180" y="311" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="350" y="311" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(1,4) 与 (2,3) 都不含 5</text>
  <text x="565" y="311" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="85" y="339" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="180" y="339" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="350" y="339" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(1,5) 与 (2,4) 都不含 3</text>
  <text x="565" y="339" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="85" y="367" text-anchor="middle" font-size="11" fill="#8a3b37" filter="url(#rough2)">7</text>
  <text x="180" y="367" text-anchor="middle" font-size="11" fill="#8a3b37" filter="url(#rough2)">1</text>
  <text x="350" y="367" text-anchor="middle" font-size="11" fill="#8a3b37" filter="url(#rough2)">(2,5) 穿过 1：2 与 5 分居两侧</text>
  <text x="565" y="367" text-anchor="middle" font-size="11" fill="#8a3b37" filter="url(#rough2)">1</text>

  <text x="350" y="393" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">只有 k = 7 拿到 1 个灰点，因此输出 7（与官方答案一致）</text>
</svg>
