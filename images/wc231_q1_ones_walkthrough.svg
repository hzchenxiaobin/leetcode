<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 425"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="425" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：逐对扫描相邻字符对</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">"1001" 在 (2,3) 命中 "01" 返回 false；"110" 未命中返回 true</text>

  <!-- Panel A: s = "1001" -->
  <text x="84" y="58" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">① s = "1001"</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="84" y="66" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="108" y="87" fill="#333" font-weight="bold">1</text>
    <rect x="132" y="66" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="156" y="87" fill="#333">0</text>
    <rect x="180" y="66" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="204" y="87" fill="#333">0</text>
    <rect x="228" y="66" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="252" y="87" fill="#333" font-weight="bold">1</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="108" y="112">0</text>
    <text x="156" y="112">1</text>
    <text x="204" y="112">2</text>
    <text x="252" y="112">3</text>
  </g>
  <!-- pair chips -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="109" y="120" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="132" y="135" fill="#888" font-weight="bold">10</text>
    <rect x="157" y="120" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="180" y="135" fill="#888" font-weight="bold">00</text>
    <rect x="205" y="120" width="46" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="228" y="135" fill="#b85450" font-weight="bold">01</text>
  </g>
  <text x="132" y="158" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">继续</text>
  <text x="180" y="158" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">继续</text>
  <text x="228" y="158" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0→1 开启第二段 ✗</text>
  <path d="M 228 162 L 228 178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="98" y="180" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="228" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">命中 "01" ⇒ 段数 = 2 ⇒ 返回 false</text>

  <!-- Panel B: s = "110" -->
  <text x="84" y="234" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② s = "110"</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="84" y="242" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="108" y="263" fill="#333" font-weight="bold">1</text>
    <rect x="132" y="242" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="156" y="263" fill="#333" font-weight="bold">1</text>
    <rect x="180" y="242" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="204" y="263" fill="#333">0</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="108" y="288">0</text>
    <text x="156" y="288">1</text>
    <text x="204" y="288">2</text>
  </g>
  <!-- pair chips -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="109" y="296" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="132" y="311" fill="#888" font-weight="bold">11</text>
    <rect x="157" y="296" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="180" y="311" fill="#888" font-weight="bold">10</text>
  </g>
  <text x="156" y="334" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">未命中任何 "01"（"10" 只关段不开新段）</text>
  <path d="M 180 338 L 180 354" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="98" y="356" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="228" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">未命中 "01" ⇒ 段数 = 1 ⇒ 返回 true</text>

  <!-- footer -->
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">"10"（1→0）只是关闭当前段；"01"（0→1）才开启新段——方向别记反</text>
</svg>
