<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">n = 20：15 个合法数 − 6 个不变数 = 9 个好数</text>

  <rect x="60" y="54" width="600" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="78" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">集合 S</text>
  <text x="200" y="78" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">位 i</text>
  <text x="365" y="78" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">本位的选择（d = n 的第 i 位）</text>
  <text x="570" y="78" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">本位的贡献</text>

  <rect x="60" y="90" width="600" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="114" text-anchor="middle" font-size="12.5" fill="#33604a" filter="url(#rough2)">R</text>
  <text x="200" y="114" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="365" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = 2，更小的合法数字 {0,1}</text>
  <text x="570" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 × 7^1 = 14</text>

  <rect x="60" y="126" width="600" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="150" text-anchor="middle" font-size="12.5" fill="#33604a" filter="url(#rough2)">R</text>
  <text x="200" y="150" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="365" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = 0，比 0 小的数字不存在</text>
  <text x="570" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <rect x="60" y="162" width="600" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="186" text-anchor="middle" font-size="12.5" fill="#33604a" filter="url(#rough2)">R</text>
  <text x="200" y="186" text-anchor="middle" font-size="12.5" fill="#33604a" filter="url(#rough2)">走完</text>
  <text x="365" y="186" text-anchor="middle" font-size="12" fill="#33604a" filter="url(#rough2)">前缀 2 0 每一位都合法</text>
  <text x="570" y="186" text-anchor="middle" font-size="12" fill="#33604a" filter="url(#rough2)">+1 → 合计 15</text>

  <rect x="60" y="198" width="600" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="222" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">A</text>
  <text x="200" y="222" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="365" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = 2，更小的合法数字 {0,1}</text>
  <text x="570" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 × 3^1 = 6</text>

  <rect x="60" y="234" width="600" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="258" text-anchor="middle" font-size="12.5" fill="#8f3b38" filter="url(#rough2)">A</text>
  <text x="200" y="258" text-anchor="middle" font-size="12.5" fill="#8f3b38" filter="url(#rough2)">0</text>
  <text x="365" y="258" text-anchor="middle" font-size="12" fill="#8f3b38" filter="url(#rough2)">d = 2 ∉ A，前缀塌陷</text>
  <text x="570" y="258" text-anchor="middle" font-size="12" fill="#8f3b38" filter="url(#rough2)">停止 → 合计 6</text>

  <text x="360" y="304" text-anchor="middle" font-size="14.5" fill="#b85450" filter="url(#rough2)">count(20, R) − count(20, A) = 15 − 6 = 9</text>

  <text x="360" y="332" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">在 [1, 20] 中恰好是这 9 个数：</text>

  <rect x="88" y="344" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="114" y="371" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">2</text>
  <rect x="148" y="344" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="174" y="371" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">5</text>
  <rect x="208" y="344" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="234" y="371" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">6</text>
  <rect x="268" y="344" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="294" y="371" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">9</text>
  <rect x="328" y="344" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="354" y="371" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">12</text>
  <rect x="388" y="344" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="414" y="371" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">15</text>
  <rect x="448" y="344" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="474" y="371" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">16</text>
  <rect x="508" y="344" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="534" y="371" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">19</text>
  <rect x="568" y="344" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="594" y="371" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">20</text>

  <text x="360" y="420" text-anchor="middle" font-size="11.5" fill="#667" filter="url(#rough2)">R = {0,1,2,5,6,8,9}、A = {0,1,8}；数字 0 在两次计数里都被算到，相减时自然抵消</text>
</svg>
