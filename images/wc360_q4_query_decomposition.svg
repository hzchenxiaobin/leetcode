<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">查询 f(x)：按 k 的二进制位跳</text>

  <!-- 起点 -->
  <rect x="170" y="46" width="180" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">cur = x，ans = 0，j = 0</text>

  <path d="M 260,78 L 260,94" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形：第 j 位 -->
  <polygon points="260,96 352,134 260,172 168,134" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">k 的第 j 位 = 1 ？</text>
  <text x="260" y="147" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">（该不该跳 2^j 步）</text>

  <text x="368" y="126" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 352,134 L 382,134" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 是：累加并跳跃 -->
  <rect x="386" y="104" width="126" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="449" y="127" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">ans += sum[j][cur]</text>
  <text x="449" y="145" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">cur = nxt[j][cur]</text>

  <path d="M 449,164 L 449,206 L 352,206" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="262" y="182" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">否</text>
  <path d="M 260,172 L 260,192" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 右移 -->
  <rect x="175" y="196" width="170" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">k 右移一位，j += 1</text>

  <path d="M 260,226 L 260,240" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形：k = 0 -->
  <polygon points="260,242 336,272 260,302 184,272" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="277" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">k = 0 ？</text>

  <text x="166" y="252" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">否</text>
  <path d="M 184,272 L 96,272 L 96,134 L 164,134" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="96" y="204" text-anchor="middle" font-size="10.5" fill="#d6a040" transform="rotate(-90 96 204)" filter="url(#rough2)">继续处理下一位</text>

  <text x="260" y="320" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260,302 L 260,318" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 补落点 -->
  <rect x="150" y="322" width="220" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">ans += cur（第 k 次传完的落点）</text>

  <path d="M 260,354 L 260,366" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="128" y="368" width="264" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="387" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ans 即 f(x)，更新全局最大值后换下一个 x</text>

  <!-- 侧注 -->
  <rect x="382" y="228" width="130" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="447" y="250" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">各位置 1 时拼上</text>
  <text x="447" y="267" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">一段 [0, 2^j) 的和，</text>
  <text x="447" y="284" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">恰好不重不漏地</text>
  <text x="447" y="301" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">铺满 [0, k)</text>
</svg>
