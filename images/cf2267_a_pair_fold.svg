<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a6015"/>
    </marker>
  </defs>

  <rect width="780" height="460" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：把字符串对折，每个镜像对各自独立结算</text>
  <path d="M 118 42 Q 390 50 662 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="62" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">以 s = adbccbad、c = d 为例（官方样例 4）：上下同一列就是一对 sᵢ 与 sⱼ</text>

  <!-- 上半：s1..s4 -->
  <text x="142" y="98" text-anchor="end" font-size="12.5" fill="#446688" filter="url(#rough2)">上半</text>
  <rect x="154" y="80" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="106" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">a</text>
  <rect x="214" y="80" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="106" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">d</text>
  <rect x="274" y="80" width="52" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="106" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">b</text>
  <rect x="334" y="80" width="52" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="106" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">c</text>
  <rect x="394" y="80" width="52" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="106" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">c</text>
  <rect x="454" y="80" width="52" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="106" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">b</text>
  <rect x="514" y="80" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="106" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">a</text>
  <rect x="574" y="80" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="600" y="106" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">d</text>

  <!-- 对折箭头 -->
  <path d="M 180 122 L 180 146" stroke="#8a6015" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 122 L 240 146" stroke="#8a6015" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 122 L 300 146" stroke="#8a6015" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 122 L 360 146" stroke="#8a6015" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 122 L 420 146" stroke="#8a6015" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 480 122 L 480 146" stroke="#8a6015" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 540 122 L 540 146" stroke="#8a6015" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 600 122 L 600 146" stroke="#8a6015" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 下半：s8..s5（倒序） -->
  <text x="142" y="174" text-anchor="end" font-size="12.5" fill="#8a6015" filter="url(#rough2)">下半</text>
  <rect x="154" y="148" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="174" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">d</text>
  <rect x="214" y="148" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="174" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">a</text>
  <rect x="274" y="148" width="52" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="174" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">b</text>
  <rect x="334" y="148" width="52" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="174" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">c</text>
  <rect x="394" y="148" width="52" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="174" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">c</text>
  <rect x="454" y="148" width="52" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="174" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">b</text>
  <rect x="514" y="148" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="174" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">a</text>
  <rect x="574" y="148" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="600" y="174" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">d</text>

  <!-- 下标与代价 -->
  <text x="180" y="206" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">1 · 8</text>
  <text x="240" y="206" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">2 · 7</text>
  <text x="300" y="206" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">3 · 6</text>
  <text x="360" y="206" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">4 · 5</text>
  <text x="420" y="206" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">5 · 4</text>
  <text x="480" y="206" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">6 · 3</text>
  <text x="540" y="206" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">7 · 2</text>
  <text x="600" y="206" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">8 · 1</text>

  <text x="122" y="238" text-anchor="end" font-size="12" fill="#8a6015" filter="url(#rough2)">该对代价</text>
  <text x="180" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="240" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="300" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="360" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="420" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="480" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="540" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="600" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <!-- 三类规则 -->
  <text x="48" y="272" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三类镜像对的代价（c 固定，只能用 c 覆盖字符）</text>

  <rect x="48" y="284" width="222" height="108" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="159" y="308" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">① 两侧本来就相同</text>
  <text x="159" y="330" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">sᵢ = sⱼ，已经对称</text>
  <text x="159" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">代价 0</text>
  <text x="159" y="376" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">… b … b …</text>

  <rect x="279" y="284" width="222" height="108" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="308" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">② 一侧正好是 c</text>
  <text x="390" y="330" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">把另一侧也覆盖成 c</text>
  <text x="390" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">代价 1</text>
  <text x="390" y="376" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">d … a  →  d … d</text>

  <rect x="510" y="284" width="222" height="108" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="621" y="308" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8c3b38" filter="url(#rough2)">③ 两侧都不是 c</text>
  <text x="621" y="330" text-anchor="middle" font-size="12" fill="#8c3b38" filter="url(#rough2)">两侧都必须覆盖成 c</text>
  <text x="621" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">代价 2</text>
  <text x="621" y="376" text-anchor="middle" font-size="12" fill="#8c3b38" filter="url(#rough2)">b … c  →  d … d</text>

  <text x="390" y="422" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">总花费 = 各对代价之和；n 为奇数时正中间那个字符永远不必改</text>
  <text x="390" y="444" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">本图各对代价 1 + 1 + 0 + 0 = 2，与样例 4 的输出 2 吻合</text>
</svg>
