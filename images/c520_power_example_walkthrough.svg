<svg xmlns="http://www.w3.org/2000/svg" width="940" height="715" viewBox="0 0 940 715" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="940" height="715" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough)">示例演算：nums = [7, 6, 2, 1]，从 bit 2 到 bit 0（高 12 位 power 恒 0）</text>
  <path d="M 190 42 Q 470 50 750 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- legend -->
  <g filter="url(#rough)">
    <rect x="222" y="56" width="20" height="13" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="250" y="67" font-size="10.5" fill="#555">含 b，进前缀</text>
    <rect x="352" y="56" width="20" height="13" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="380" y="67" font-size="10.5" fill="#555">不含 b，截停</text>
    <rect x="482" y="56" width="20" height="13" rx="3" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
    <text x="510" y="67" font-size="10.5" fill="#555">前缀之外，暂无约束</text>
    <text x="700" y="67" font-size="10" fill="#999">格子下的小字 = 低 3 位二进制</text>
  </g>

  <!-- ================= Band 1: b = 2 ================= -->
  <text x="100" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough)">位 b = 2</text>
  <text x="100" y="148" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough)">mask = 100₂</text>

  <g filter="url(#rough)">
    <rect x="220" y="118" width="62" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="288" y="118" width="62" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="356" y="118" width="62" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="424" y="118" width="62" height="50" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" filter="url(#rough)">
    <text x="251" y="140" font-size="15" font-weight="bold" fill="#2e6e2e">7</text>
    <text x="251" y="158" font-size="9" fill="#888">111</text>
    <text x="276" y="131" font-size="10" fill="#4a7a3a" text-anchor="end">✓</text>
    <text x="319" y="140" font-size="15" font-weight="bold" fill="#2e6e2e">6</text>
    <text x="319" y="158" font-size="9" fill="#888">110</text>
    <text x="344" y="131" font-size="10" fill="#4a7a3a" text-anchor="end">✓</text>
    <text x="387" y="140" font-size="15" font-weight="bold" fill="#b85450">2</text>
    <text x="387" y="158" font-size="9" fill="#888">010</text>
    <text x="412" y="131" font-size="10" fill="#b85450" text-anchor="end">✗</text>
    <text x="455" y="140" font-size="15" font-weight="bold" fill="#666">1</text>
    <text x="455" y="158" font-size="9" fill="#888">001</text>
  </g>
  <path d="M 220 176 L 220 182 L 486 182 L 486 176" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough)"/>
  <text x="353" y="198" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough)">G₁ = {7, 6, 2, 1}</text>
  <path d="M 220 212 L 350 212" stroke="#4a7a3a" stroke-width="4" stroke-linecap="round" filter="url(#rough)"/>
  <text x="285" y="230" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough)">前缀长 p₂ = 2</text>

  <g filter="url(#rough)">
    <rect x="560" y="126" width="150" height="32" rx="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="635" y="147" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a20">p₂ = 2</text>
  </g>
  <text x="735" y="134" font-size="10.5" fill="#444" filter="url(#rough)">含 bit2 的 {7,6} 居段首</text>
  <text x="735" y="154" font-size="10.5" fill="#444" filter="url(#rough)">2 截停 ⟹ 段分裂为两段</text>

  <path d="M 505 236 L 505 262" stroke="#999" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrK)" filter="url(#rough)"/>
  <text x="515" y="253" font-size="9.5" fill="#999" filter="url(#rough)">分裂后</text>

  <!-- ================= Band 2: b = 1 ================= -->
  <text x="100" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough)">位 b = 1</text>
  <text x="100" y="293" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough)">mask = 010₂</text>

  <g filter="url(#rough)">
    <rect x="232" y="249" width="106" height="18" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="285" y="262" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">满段 ✓ 整段通过</text>
  </g>

  <g filter="url(#rough)">
    <rect x="220" y="271" width="62" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="288" y="271" width="62" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="356" y="271" width="62" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="424" y="271" width="62" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g text-anchor="middle" filter="url(#rough)">
    <text x="251" y="293" font-size="15" font-weight="bold" fill="#2e6e2e">7</text>
    <text x="251" y="311" font-size="9" fill="#888">111</text>
    <text x="276" y="284" font-size="10" fill="#4a7a3a" text-anchor="end">✓</text>
    <text x="319" y="293" font-size="15" font-weight="bold" fill="#2e6e2e">6</text>
    <text x="319" y="311" font-size="9" fill="#888">110</text>
    <text x="344" y="284" font-size="10" fill="#4a7a3a" text-anchor="end">✓</text>
    <text x="387" y="293" font-size="15" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="387" y="311" font-size="9" fill="#888">010</text>
    <text x="412" y="284" font-size="10" fill="#4a7a3a" text-anchor="end">✓</text>
    <text x="455" y="293" font-size="15" font-weight="bold" fill="#b85450">1</text>
    <text x="455" y="311" font-size="9" fill="#888">001</text>
    <text x="480" y="284" font-size="10" fill="#b85450" text-anchor="end">✗</text>
  </g>
  <path d="M 220 329 L 220 335 L 350 335 L 350 329" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough)"/>
  <text x="285" y="351" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough)">G₁ = {7,6}</text>
  <path d="M 356 329 L 356 335 L 486 335 L 486 329" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough)"/>
  <text x="421" y="351" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough)">G₂ = {2,1}</text>
  <path d="M 220 365 L 418 365" stroke="#4a7a3a" stroke-width="4" stroke-linecap="round" filter="url(#rough)"/>
  <text x="319" y="383" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough)">前缀长 p₁ = 3（acc = 2，段内再 +1）</text>

  <g filter="url(#rough)">
    <rect x="560" y="279" width="150" height="32" rx="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="635" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a20">p₁ = 3</text>
  </g>
  <text x="735" y="287" font-size="10.5" fill="#444" filter="url(#rough)">G₁ 满段整段通过，acc = 2</text>
  <text x="735" y="307" font-size="10.5" fill="#444" filter="url(#rough)">G₂ 内 2 居首、1 截停</text>

  <path d="M 505 388 L 505 414" stroke="#999" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrK)" filter="url(#rough)"/>

  <!-- ================= Band 3: b = 0 ================= -->
  <text x="100" y="418" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough)">位 b = 0</text>
  <text x="100" y="438" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough)">mask = 001₂</text>

  <g filter="url(#rough)">
    <rect x="220" y="416" width="62" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="288" y="416" width="62" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="356" y="416" width="62" height="50" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="424" y="416" width="62" height="50" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" filter="url(#rough)">
    <text x="251" y="438" font-size="15" font-weight="bold" fill="#2e6e2e">7</text>
    <text x="251" y="456" font-size="9" fill="#888">111</text>
    <text x="276" y="429" font-size="10" fill="#4a7a3a" text-anchor="end">✓</text>
    <text x="319" y="438" font-size="15" font-weight="bold" fill="#b85450">6</text>
    <text x="319" y="456" font-size="9" fill="#888">110</text>
    <text x="344" y="429" font-size="10" fill="#b85450" text-anchor="end">✗</text>
    <text x="387" y="438" font-size="15" font-weight="bold" fill="#666">2</text>
    <text x="387" y="456" font-size="9" fill="#888">010</text>
    <text x="455" y="438" font-size="15" font-weight="bold" fill="#666">1</text>
    <text x="455" y="456" font-size="9" fill="#888">001</text>
  </g>
  <path d="M 220 474 L 220 480 L 350 480 L 350 474" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough)"/>
  <text x="285" y="496" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough)">G₁ = {7,6}</text>
  <path d="M 356 474 L 356 480 L 418 480 L 418 474" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough)"/>
  <text x="387" y="496" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough)">{2}</text>
  <path d="M 424 474 L 424 480 L 486 480 L 486 474" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough)"/>
  <text x="455" y="496" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough)">{1}</text>
  <path d="M 220 510 L 282 510" stroke="#4a7a3a" stroke-width="4" stroke-linecap="round" filter="url(#rough)"/>
  <text x="251" y="528" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough)">前缀长 p₀ = 1</text>

  <g filter="url(#rough)">
    <rect x="560" y="424" width="150" height="32" rx="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="635" y="445" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a20">p₀ = 1</text>
  </g>
  <text x="735" y="432" font-size="10.5" fill="#444" filter="url(#rough)">首段内 7 含 bit0、6 不含</text>
  <text x="735" y="452" font-size="10.5" fill="#444" filter="url(#rough)">{7} 居首，6 截停 ⟹ 再分裂</text>

  <path d="M 505 533 L 505 559" stroke="#999" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrK)" filter="url(#rough)"/>

  <!-- ================= Band 4: final ================= -->
  <text x="100" y="563" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough)">最终结果</text>
  <text x="100" y="583" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough)">段结构全部确定</text>

  <g filter="url(#rough)">
    <rect x="220" y="561" width="62" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="288" y="561" width="62" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="356" y="561" width="62" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="424" y="561" width="62" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" filter="url(#rough)">
    <text x="251" y="583" font-size="15" font-weight="bold" fill="#34507a">7</text>
    <text x="251" y="601" font-size="9" fill="#888">111</text>
    <text x="319" y="583" font-size="15" font-weight="bold" fill="#34507a">6</text>
    <text x="319" y="601" font-size="9" fill="#888">110</text>
    <text x="387" y="583" font-size="15" font-weight="bold" fill="#34507a">2</text>
    <text x="387" y="601" font-size="9" fill="#888">010</text>
    <text x="455" y="583" font-size="15" font-weight="bold" fill="#34507a">1</text>
    <text x="455" y="601" font-size="9" fill="#888">001</text>
  </g>
  <g stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough)">
    <path d="M 220 619 L 220 625 L 282 625 L 282 619"/>
    <path d="M 288 619 L 288 625 L 350 625 L 350 619"/>
    <path d="M 356 619 L 356 625 L 418 625 L 418 619"/>
    <path d="M 424 619 L 424 625 L 486 625 L 486 619"/>
  </g>
  <g text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough)">
    <text x="251" y="641">G₁</text>
    <text x="319" y="641">G₂</text>
    <text x="387" y="641">G₃</text>
    <text x="455" y="641">G₄</text>
  </g>

  <g filter="url(#rough)">
    <rect x="545" y="565" width="185" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="637" y="586" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">power = (2, 3, 1)</text>
  </g>
  <text x="735" y="573" font-size="10.5" fill="#444" filter="url(#rough)">段内任意排列均合法</text>
  <text x="735" y="593" font-size="10.5" fill="#444" filter="url(#rough)">如 perm = [7, 6, 2, 1]</text>

  <!-- conclusion -->
  <g filter="url(#rough)">
    <rect x="60" y="657" width="820" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="470" y="684" text-anchor="middle" font-size="12.5" fill="#b07a20" font-weight="bold">对照：若把 6 排在 7 前，bit0 前缀为空 → power = (2, 3, 0) 字典序更小 —— 低位必须给高位让路</text>
  </g>
</svg>
