<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">run[i]：以 i 结尾的最长连续递增段长度</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">接续则加一，断点则重置为 1，一次扫描全部求出</text>

  <text x="52" y="78" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)">
    <rect x="108" y="64" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="4"/>
    <rect x="158" y="64" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="4"/>
    <rect x="208" y="64" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="4"/>
    <rect x="258" y="64" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="4"/>
    <rect x="308" y="64" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="4"/>
    <rect x="358" y="64" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="4"/>
    <rect x="408" y="64" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="131" y="87" fill="#3a4a66">1</text>
    <text x="181" y="87" fill="#3a4a66">2</text>
    <text x="231" y="87" fill="#3a5a30">3</text>
    <text x="281" y="87" fill="#3a5a30">4</text>
    <text x="331" y="87" fill="#8a3a36">3</text>
    <text x="381" y="87" fill="#8a3a36">2</text>
    <text x="431" y="87" fill="#8a3a36">5</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="131" y="112">0</text>
    <text x="181" y="112">1</text>
    <text x="231" y="112">2</text>
    <text x="281" y="112">3</text>
    <text x="331" y="112">4</text>
    <text x="381" y="112">5</text>
    <text x="431" y="112">6</text>
  </g>

  <path d="M 280 118 L 280 136" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 118 L 330 136" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 118 L 380 136" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="52" y="160" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">run</text>
  <g filter="url(#rough2)">
    <rect x="108" y="140" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="158" y="140" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="208" y="140" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="4"/>
    <rect x="258" y="140" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="4"/>
    <rect x="308" y="140" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="358" y="140" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="408" y="140" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="131" y="161" fill="#8a6a20">1</text>
    <text x="181" y="161" fill="#8a6a20">2</text>
    <text x="231" y="161" fill="#3a5a30">3</text>
    <text x="281" y="161" fill="#3a5a30">4</text>
    <text x="331" y="161" fill="#8a6a20">1</text>
    <text x="381" y="161" fill="#8a6a20">1</text>
    <text x="431" y="161" fill="#8a6a20">1</text>
  </g>

  <rect x="44" y="188" width="472" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="58" y="210" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">转移：run[i] = (nums[i] == nums[i-1] + 1) ? run[i-1] + 1 : 1</text>
  <text x="58" y="230" font-size="10.5" fill="#555" filter="url(#rough2)">每一段连续 +1 的区间就是一个独立的"递增段"，断点处重新计数</text>

  <rect x="44" y="252" width="472" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="58" y="272" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">k = 3 时，以下标 3 结尾的窗口合法，因为 run[3] = 4 ≥ 3</text>
  <text x="58" y="291" font-size="10.5" fill="#555" filter="url(#rough2)">窗口 [1..3] = [2,3,4] 的 run 值 4 覆盖了整段窗口，能量值就是 4</text>

  <rect x="44" y="312" width="472" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="58" y="332" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">判定：以 i 结尾、长度 k 的窗口合法 ⟺ run[i] ≥ k</text>
  <text x="58" y="352" font-size="10.5" fill="#555" filter="url(#rough2)">合法能量值为 nums[i]，非法为 -1；i 从 k-1 开始输出，共 n-k+1 个</text>

  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">红色箭头表示断点：4→3、3→2、2→5 都不是 +1，run 重置为 1</text>
</svg>
