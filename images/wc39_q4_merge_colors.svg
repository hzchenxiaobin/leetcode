<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">归并成一条有序带颜色的数组</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">区间覆盖 k 个列表 ⇔ 窗口里出现全部 k 种颜色</text>

  <g filter="url(#rough2)">
    <text x="40" y="82" font-size="10.5" fill="#446688">列表 0</text>
    <rect x="96" y="66" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="116" y="82" text-anchor="middle" font-size="10" fill="#334">4</text>
    <rect x="142" y="66" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="162" y="82" text-anchor="middle" font-size="10" fill="#334">10</text>
    <rect x="188" y="66" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="208" y="82" text-anchor="middle" font-size="10" fill="#334">15</text>
    <rect x="234" y="66" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="254" y="82" text-anchor="middle" font-size="10" fill="#334">24</text>
    <rect x="280" y="66" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="300" y="82" text-anchor="middle" font-size="10" fill="#334">26</text>
  </g>

  <g filter="url(#rough2)">
    <text x="40" y="118" font-size="10.5" fill="#4a7a3a">列表 1</text>
    <rect x="96" y="102" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="116" y="118" text-anchor="middle" font-size="10" fill="#334">0</text>
    <rect x="142" y="102" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="162" y="118" text-anchor="middle" font-size="10" fill="#334">9</text>
    <rect x="188" y="102" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="208" y="118" text-anchor="middle" font-size="10" fill="#334">12</text>
    <rect x="234" y="102" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="254" y="118" text-anchor="middle" font-size="10" fill="#334">20</text>
  </g>

  <g filter="url(#rough2)">
    <text x="40" y="154" font-size="10.5" fill="#a0741f">列表 2</text>
    <rect x="96" y="138" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="116" y="154" text-anchor="middle" font-size="10" fill="#334">5</text>
    <rect x="142" y="138" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="162" y="154" text-anchor="middle" font-size="10" fill="#334">18</text>
    <rect x="188" y="138" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="208" y="154" text-anchor="middle" font-size="10" fill="#334">22</text>
    <rect x="234" y="138" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="254" y="154" text-anchor="middle" font-size="10" fill="#334">30</text>
  </g>

  <path d="M 300 168 L 300 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="182" font-size="9.5" fill="#777">按 (值, 列表下标) 排序</text>

  <g filter="url(#rough2)">
    <rect x="36" y="196" width="35" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="53" y="213" text-anchor="middle" font-size="10" fill="#334">0</text>
    <rect x="73" y="196" width="35" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="90" y="213" text-anchor="middle" font-size="10" fill="#334">4</text>
    <rect x="110" y="196" width="35" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="127" y="213" text-anchor="middle" font-size="10" fill="#334">5</text>
    <rect x="147" y="196" width="35" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="164" y="213" text-anchor="middle" font-size="10" fill="#334">9</text>
    <rect x="184" y="196" width="35" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="201" y="213" text-anchor="middle" font-size="10" fill="#334">10</text>
    <rect x="221" y="196" width="35" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="238" y="213" text-anchor="middle" font-size="10" fill="#334">12</text>
    <rect x="258" y="196" width="35" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="275" y="213" text-anchor="middle" font-size="10" fill="#334">15</text>
    <rect x="295" y="196" width="35" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="312" y="213" text-anchor="middle" font-size="10" fill="#334">18</text>
    <rect x="332" y="196" width="35" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="349" y="213" text-anchor="middle" font-size="10" fill="#334">20</text>
    <rect x="369" y="196" width="35" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="386" y="213" text-anchor="middle" font-size="10" fill="#334">22</text>
    <rect x="406" y="196" width="35" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="423" y="213" text-anchor="middle" font-size="10" fill="#334">24</text>
    <rect x="443" y="196" width="35" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="460" y="213" text-anchor="middle" font-size="10" fill="#334">26</text>
    <rect x="480" y="196" width="35" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="497" y="213" text-anchor="middle" font-size="10" fill="#334">30</text>
  </g>

  <path d="M 332 232 L 406 232" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 332 232 L 332 226" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 406 232 L 406 226" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="369" y="252" text-anchor="middle" font-size="10.5" fill="#b85450">最短覆盖窗口 [20, 24]</text>

  <g filter="url(#rough2)" font-size="10">
    <rect x="60" y="270" width="18" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="86" y="281" fill="#446688">来自列表 0</text>
    <rect x="200" y="270" width="18" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="226" y="281" fill="#4a7a3a">来自列表 1</text>
    <rect x="340" y="270" width="18" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="366" y="281" fill="#a0741f">来自列表 2</text>
  </g>

  <rect x="46" y="300" width="468" height="72" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="320" font-size="10.5" fill="#8a6a20" font-weight="bold">为什么这样转化是对的</text>
  <text x="62" y="338" font-size="10" fill="#555">① 最优区间的两个端点一定等于某个元素值，可把端点收缩到元素上；</text>
  <text x="62" y="354" font-size="10" fill="#555">② 「区间包含某列表的一个数」⇔ 窗口内有该颜色的元素，于是只需在有序数组上滑窗。</text>

  <text x="280" y="390" text-anchor="middle" font-size="9.5" fill="#999">元素总数 N ≤ 3500 × 50 = 175000，排序 O(N log N) 即可</text>
</svg>
