<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">逐区间处理：两个独立判断，互不依赖</text>

  <!-- 开始 -->
  <rect x="210" y="52" width="180" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">取下一个区间 [s, e)</text>

  <line x1="300" y1="94" x2="300" y2="120" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1 -->
  <polygon points="300,122 420,168 300,214 180,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">s &lt; rs ?</text>
  <text x="300" y="182" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">被挖区间的左端在右侧</text>

  <line x1="420" y1="168" x2="452" y2="168" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="158" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="454" y="140" width="130" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="519" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输出左段</text>
  <text x="519" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[s, min(e,rs))</text>

  <line x1="300" y1="214" x2="300" y2="240" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="232" font-size="12" fill="#888" filter="url(#rough2)">否</text>

  <!-- 判定 2 -->
  <polygon points="300,242 420,288 300,334 180,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="283" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">re &lt; e ?</text>
  <text x="300" y="302" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">被挖区间的右端在左侧</text>

  <line x1="420" y1="288" x2="452" y2="288" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="278" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="454" y="260" width="130" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="519" y="282" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输出右段</text>
  <text x="519" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[max(s,re), e)</text>

  <line x1="300" y1="334" x2="300" y2="360" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="352" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="180" y="362" width="240" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="382" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">两段皆空 → 区间整段消失</text>

  <text x="40" y="132" font-size="12" fill="#666" filter="url(#rough2)">两个判断互相独立：</text>
  <text x="40" y="150" font-size="12" fill="#666" filter="url(#rough2)">严格内部时两段都输出</text>
</svg>
