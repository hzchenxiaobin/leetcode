  <text x="340" y="130" text-anchor="middle" font-size="10.5" fill="#555">前 2 回合取 (a,c)、后 4 回合取 (b,c)：两个小堆共 6 颗石子全部与 c 配对消耗</text>

  <path d="M 40 144 Q 340 152 640 144" stroke="#ccc" stroke-width="1.5" fill="none" filter="url(#sk)"/>

