  <text x="360" y="238" font-size="10.5" fill="#2e6e2e">得 2 分 = ⌊4/2⌋，一颗不剩</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)">
    <rect x="34" y="254" width="612" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="50" y="276" font-size="12.5" font-weight="bold" fill="#2b2b2b">贪心正确姿势：每回合取「最大的两堆」各 1 颗</text>
  <text x="50" y="296" font-size="10.5" fill="#555">直觉：最大堆每回合必被消耗，不会越攒越多，三堆始终保持势均力敌，谁也吃不掉谁</text>
  <text x="50" y="314" font-size="10.5" fill="#555">O(1) 公式 min(⌊sum/2⌋, sum−max) 则完全绕开模拟，一次比较直接出答案</text>
