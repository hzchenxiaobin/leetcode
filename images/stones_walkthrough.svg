  <text x="475.5" y="205" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="496.5" y="205" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="517.5" y="205" text-anchor="middle" font-size="11" fill="#333">1</text>
