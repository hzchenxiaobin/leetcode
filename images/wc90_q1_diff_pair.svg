<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="372" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">情形 ③：两个失配位必须「交叉相等」</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = "ab"、goal = "ba"：i = 0 处 a≠b，j = 1 处 b≠a，交换 i、j 恰好对齐</text>
  <rect x="120" y="130" width="74" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="157" y="158.8" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="120" y="204" width="74" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="157" y="229" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <rect x="194" y="130" width="74" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="231" y="158.8" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">b</text>
  <rect x="194" y="204" width="74" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="231" y="229" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="108" y="160" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="108" y="230" text-anchor="end" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">goal</text>
  <text x="157" y="118" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i = 0</text>
  <text x="231" y="118" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">j = 1</text>
  <path d="M 167 126 L 221 200" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 221 126 L 167 200" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="300" y="292" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">交换后 s 变成 "ba"，与 goal 完全一致</text>
  <rect x="40" y="306" width="540" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="324" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">判定条件可直接写成 s[i] == goal[j] &amp;&amp; s[j] == goal[i]；</text>
  <text x="50" y="338.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">失配位超过 2 个时，一次交换最多修好 2 个位置 → 一定 false。</text>
</svg>
