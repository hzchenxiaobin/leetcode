<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双指针判回文 → 一步分派答案</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888">i 从 0 向右、j 从 n−1 向左，边走边比，失配即停</text>

  <rect x="30" y="88" width="122" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="108" font-size="10.5" fill="#3a4a66" font-weight="bold">初始化</text>
  <text x="44" y="126" font-size="10" fill="#555">i = 0, j = n−1</text>

  <path d="M 152 114 L 194 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,74 366,114 280,154 194,114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="111" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">s[i] == s[j] ?</text>
  <text x="280" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（循环条件 i &lt; j）</text>

  <path d="M 366 114 L 410 114" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="106" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="414" y="90" width="120" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="474" y="110" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 2</text>
  <text x="474" y="127" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">不可能只用 1 步</text>

  <path d="M 280 154 L 280 196" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="180" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="186" y="200" width="190" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="200" y="220" font-size="10.5" fill="#3a5a30" font-weight="bold">指针向中间收缩</text>
  <text x="200" y="238" font-size="10" fill="#555">i++, j−− 后回到判定框</text>

  <path d="M 186 226 L 96 226 L 96 146" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="220" font-size="9" fill="#888" filter="url(#rough2)">继续比较</text>

  <path d="M 376 226 L 410 226" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="218" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">i ≥ j</text>

  <rect x="414" y="202" width="120" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="474" y="222" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 1</text>
  <text x="474" y="239" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">整串一次删光</text>

  <rect x="40" y="280" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="300" font-size="10.5" fill="#3a4a66" font-weight="bold">两条出口的解释</text>
  <text x="56" y="319" font-size="10" fill="#555">走到 i ≥ j：所有对称位置都相等 ⇒ s 是回文 ⇒ 答案为 1</text>
  <text x="56" y="334" font-size="10" fill="#555">中途失配：s 不是回文 ⇒ 1 步做不到，而 2 步总够 ⇒ 答案为 2</text>

  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(n)，最多比较 ⌊n/2⌋ 次；空间 O(1)，不构造反转串</text>
</svg>
