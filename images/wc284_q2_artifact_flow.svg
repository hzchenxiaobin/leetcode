<svg xmlns="http://www.w3.org/2000/svg" width="620" height="450" viewBox="0 0 620 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#556" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="620" height="450" fill="#fdfcf7"/>
  <text x="310" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：标记 + 逐工件检查</text>
  <path d="M 150 44 Q 310 54 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 步骤 1 -->
  <g filter="url(#sk)">
    <rect x="185" y="70" width="250" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="310" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">① 把 dig 打成标记</text>
  <text x="310" y="110" text-anchor="middle" font-size="12" fill="#556" filter="url(#sk)">dug[r][c] = true，查询变 O(1)</text>

  <path d="M 310 122 L 310 148" stroke="#556" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- 步骤 2 -->
  <g filter="url(#sk)">
    <rect x="185" y="152" width="250" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="310" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">② 取下一工件 [r1, c1, r2, c2]</text>
  <text x="310" y="192" text-anchor="middle" font-size="12" fill="#556" filter="url(#sk)">遍历 artifacts，逐个判定</text>

  <path d="M 310 204 L 310 232" stroke="#556" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- 菱形判定 -->
  <g filter="url(#sk)">
    <polygon points="310,236 400,278 310,320 220,278" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="310" y="273" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">矩形内每格</text>
  <text x="310" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">dug[r][c] 都为真？</text>

  <!-- 是 → 绿框 -->
  <path d="M 400 278 L 480 278" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="440" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="484" y="254" width="96" height="48" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="532" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans++</text>
  <text x="532" y="292" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">可提取</text>

  <!-- 否 → 灰框 -->
  <path d="M 220 278 L 140 278" stroke="#8a8a8a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="180" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#888" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="44" y="254" width="96" height="48" rx="10" fill="#f4f4ee" stroke="#8a8a8a" stroke-width="1.6"/>
  </g>
  <text x="92" y="274" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">跳过</text>
  <text x="92" y="292" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">有格子漏挖</text>

  <!-- 回到步骤2 的循环箭头 -->
  <path d="M 532 302 Q 532 340 430 340 L 250 340 Q 200 340 200 320 L 200 178 L 183 178" stroke="#556" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="360" y="332" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">工件未处理完则回到 ②</text>

  <path d="M 310 320 L 310 352" stroke="#556" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="330" y="342" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">处理完</text>

  <!-- 步骤 3 -->
  <g filter="url(#sk)">
    <rect x="185" y="356" width="250" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="310" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">③ 返回 ans</text>
  <text x="310" y="395" text-anchor="middle" font-size="12" fill="#556" filter="url(#sk)">即可提取的工件总数</text>

  <!-- 侧注 -->
  <g filter="url(#sk)">
    <rect x="44" y="70" width="118" height="120" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="103" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">为什么快？</text>
  <text x="103" y="116" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">标记：O(d)</text>
  <text x="103" y="136" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">每工件查 ≤ 4 格</text>
  <text x="103" y="156" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">工件互不重叠</text>
  <text x="103" y="176" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">⇒ 判定互相独立</text>

  <text x="310" y="432" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">总时间 O(n² + d + m)，n ≤ 1000、d, m ≤ 10⁵，轻松通过</text>
</svg>
