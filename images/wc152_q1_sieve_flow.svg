<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：筛法数质数 → 两个阶乘相乘</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">总代价 O(n log log n)，n ≤ 100 时几乎瞬时</text>

  <rect x="40" y="64" width="230" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="86" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">① 埃氏筛 [2, n]</text>
  <text x="56" y="105" font-size="10.5" fill="#555" filter="url(#rough2)">从 2 起，把 i 的倍数全部标记为合数</text>
  <text x="56" y="120" font-size="10.5" fill="#555" filter="url(#rough2)">剩余未被标记的即质数，计数得 p</text>

  <path d="M 155 126 L 155 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="152" width="230" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="172" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 非质数个数 c = n − p</text>
  <text x="56" y="190" font-size="10.5" fill="#555" filter="url(#rough2)">注意 1 不算质数，被算进 c</text>

  <path d="M 155 198 L 155 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="224" width="230" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="246" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">③ 分别求两个阶乘（模 M）</text>
  <text x="56" y="265" font-size="10.5" fill="#555" filter="url(#rough2)">M = 10⁹ + 7，f_p = p! mod M</text>
  <text x="56" y="280" font-size="10.5" fill="#555" filter="url(#rough2)">f_c = c! mod M，边乘边取模</text>

  <path d="M 155 286 L 155 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="312" width="230" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="56" y="334" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">④ 返回 f_p × f_c mod M</text>
  <text x="56" y="352" font-size="10.5" fill="#666" filter="url(#rough2)">乘法原理：两类摆放互相独立</text>

  <rect x="300" y="64" width="232" height="298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="12" filter="url(#rough2)"/>
  <text x="416" y="88" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">埃氏筛：n = 16</text>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="316" y="100" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5"/>
    <text x="338" y="120" fill="#8a3a36">1</text>
    <rect x="368" y="100" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="390" y="120" fill="#2c4a6b">2</text>
    <rect x="420" y="100" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="442" y="120" fill="#2c4a6b">3</text>
    <rect x="472" y="100" width="44" height="30" fill="#eeeeee" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="494" y="120" fill="#777">4</text>

    <rect x="316" y="136" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="338" y="156" fill="#2c4a6b">5</text>
    <rect x="368" y="136" width="44" height="30" fill="#eeeeee" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="390" y="156" fill="#777">6</text>
    <rect x="420" y="136" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="442" y="156" fill="#2c4a6b">7</text>
    <rect x="472" y="136" width="44" height="30" fill="#eeeeee" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="494" y="156" fill="#777">8</text>

    <rect x="316" y="172" width="44" height="30" fill="#eeeeee" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="338" y="192" fill="#777">9</text>
    <rect x="368" y="172" width="44" height="30" fill="#eeeeee" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="390" y="192" fill="#777">10</text>
    <rect x="420" y="172" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="442" y="192" fill="#2c4a6b">11</text>
    <rect x="472" y="172" width="44" height="30" fill="#eeeeee" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="494" y="192" fill="#777">12</text>

    <rect x="316" y="208" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="338" y="228" fill="#2c4a6b">13</text>
    <rect x="368" y="208" width="44" height="30" fill="#eeeeee" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="390" y="228" fill="#777">14</text>
    <rect x="420" y="208" width="44" height="30" fill="#eeeeee" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="442" y="228" fill="#777">15</text>
    <rect x="472" y="208" width="44" height="30" fill="#eeeeee" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="494" y="228" fill="#777">16</text>
  </g>

  <text x="316" y="262" font-size="10.5" fill="#555" filter="url(#rough2)">蓝格 = 质数，共 p = 6 个</text>
  <text x="316" y="282" font-size="10.5" fill="#555" filter="url(#rough2)">灰格 = 非质数，共 c = 10 个</text>
  <text x="316" y="302" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">红格 = 1，既不是质数也不参与</text>
  <text x="316" y="322" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案 = 6! × 10! = 612735986</text>
  <text x="316" y="344" font-size="10" fill="#888" filter="url(#rough2)">（已对 10⁹+7 取模）</text>

  <text x="280" y="404" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">质数个数被筛法定死，剩下的事只是乘法原理与取模</text>
</svg>
