<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="81"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">状态设计：dp[i][j] = 以 i 结尾、相邻不等次数不超过 j 的最长长度</text>

  <!-- 两种接法 -->
  <text x="40" y="72" font-size="12" fill="#2d5a22" filter="url(#rough2)">情形 1：接到同值后面</text>
  <text x="330" y="72" font-size="12" fill="#b85450" filter="url(#rough2)">情形 2：接到异值后面</text>

  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="60" y="88" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="200" y="88" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="350" y="88" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="490" y="88" width="60" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="90" y="116" fill="#2d5a22">1</text>
    <text x="230" y="116" fill="#2d5a22">1</text>
    <text x="380" y="116" fill="#333">2</text>
    <text x="520" y="116" fill="#8a2f2c">1</text>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.8" fill="none">
    <path d="M 124 109 L 196 109" marker-end="url(#arr)"/>
    <path d="M 414 109 L 486 109" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="160" y="152" fill="#2d5a22">不消耗次数，j 不变</text>
    <text x="450" y="152" fill="#b85450">消耗 1 次变化</text>
    <text x="160" y="176" fill="#333">dp[i][j] = dp[p][j] + 1</text>
    <text x="450" y="176" fill="#333">dp[i][j] = dp[p][j−1] + 1</text>
  </g>

  <g filter="url(#rough2)" stroke="#ccc" stroke-width="1.4" fill="none">
    <path d="M 310 62 L 310 190"/>
  </g>

  <rect x="40" y="206" width="540" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#a06c10">
    <text x="56" y="230">dp[i][j]：以 i 结尾的子序列中，相邻不等次数 ≤ j 的最大长度</text>
    <text x="56" y="254">初值 dp[i][j] = 1：至少可以只选 nums[i] 自己（零次变化）</text>
  </g>

  <rect x="40" y="282" width="540" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="312" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">答案 = 所有 dp[i][j] 的最大值（i ∈ [0, n)，j ≤ k）</text>

  <text x="310" y="360" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">n ≤ 500、k ≤ min(n, 25) ⇒ O(n²k) ≈ 6×10⁶ 次转移，三重循环即可</text>
  <text x="310" y="386" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">枚举 p &lt; i 作为前驱，按 nums[p] 与 nums[i] 是否相等选择 j 或 j − 1</text>
</svg>
