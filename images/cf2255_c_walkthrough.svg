  <text x="258" y="200" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">Σ=(4,1)  A=3·(4,1)=(2,3)=x</text>
  <text x="258" y="214" font-size="9.5" fill="#8a4a2a" text-anchor="middle" filter="url(#rough2)">锚点与目标重合 ✓</text>
  <text x="440" y="186" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">最终图：黑格 (3,5) (4,3)</text>
  <text x="440" y="200" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">Σ′=(0,1)  w′=2</text>
  <text x="440" y="214" font-size="9.5" fill="#8a4a2a" text-anchor="middle" filter="url(#rough2)">A(Q)=3·(0,1)=(0,3) → (1,4) ✓</text>
  <rect x="26" y="230" width="508" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="40" y="250" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">δ = w·x − Σ 的来历：要让 (Σ + δ)·w⁻¹ = x，两边乘 w 得 Σ + δ = w·x。</text>
  <text x="40" y="270" font-size="10" fill="#7a6020" filter="url(#rough2)">a 与 b = a + δ 一个黑一个白，交换只挪动一格，w 不变，所以 A 的公式系数也不变。</text>
  <text x="280" y="308" font-size="10" fill="#8a8a92" text-anchor="middle" filter="url(#rough2)">红虚线圈 = 目标 x，橙点 = 锚点 A；第 3 幅图的 (0,3) 转成 1-indexed 正是 (1,4)</text>
  <text x="280" y="326" font-size="9.5" fill="#a0a0a8" text-anchor="middle" filter="url(#rough2)">题面第五段给出了同一组数据的官方变换链，最终黑格恰为 (3,5)(4,3)，与上图一致</text>
