  <text x="76" y="186" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">原图：黑格 (1,1) (2,2)</text>
  <text x="76" y="200" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">Σ=(1,1)  w=2  A=(3,3)</text>
