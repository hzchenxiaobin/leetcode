<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [1,0,1,1,0,1] 的逐元素扩张 / 收缩</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888">zeros = 窗口内 0 的个数；ans 记录历史最长合法窗口，只增不减</text>

  <rect x="24" y="64" width="512" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="56" y="84" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">right</text>
  <text x="118" y="84" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="182" y="84" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">zeros</text>
  <text x="244" y="84" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">left</text>
  <text x="322" y="84" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">窗口</text>
  <text x="424" y="84" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">长度</text>
  <text x="490" y="84" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="26" y="198" width="508" height="34" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="26" y="232" width="508" height="34" fill="#e6f4ea" filter="url(#rough2)"/>

  <path d="M 28 130 L 532 130" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 28 164 L 532 164" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 28 198 L 532 198" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 28 232 L 532 232" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 28 266 L 532 266" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 28 300 L 532 300" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="56" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="118" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="182" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="244" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="322" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,0]</text>
  <text x="424" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="490" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="56" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="118" y="152" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="182" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="244" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="322" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,1]</text>
  <text x="424" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="490" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="56" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="118" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="182" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="244" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="322" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,2]</text>
  <text x="424" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="490" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="56" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="118" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="182" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="244" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="322" y="220" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">[0,3]</text>
  <text x="424" y="220" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="490" y="220" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="56" y="254" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="118" y="254" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="182" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2 → 1</text>
  <text x="244" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">0 → 2</text>
  <text x="322" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[2,4]</text>
  <text x="424" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="490" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="56" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="118" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="182" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="244" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="322" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,5]</text>
  <text x="424" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="490" y="288" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#8a6a20">right = 3 时窗口 [0,3] 长度 4，ans 首次到达 4（翻下标 1 的 0）</text>
  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#4a7a3a">right = 4 时 zeros 变 2，left 连走两步 0 → 2 才重新合法，长度回落 3</text>
  <text x="280" y="366" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">right = 5 时窗口 [2,5] 长度 4 与 ans 打平，返回 4</text>
</svg>
