<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    和三角形：固定左端点的子数组和单调递增
  </text>

  <!-- 三角形 -->
  <text x="150" y="72" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nums = [1, 2, 3, 4]</text>

  <g filter="url(#rough2)" font-size="14">
    <!-- 行 0 -->
    <rect x="80" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="136" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="192" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="248" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="108" y="111" text-anchor="middle" fill="#446688">1</text>
    <text x="164" y="111" text-anchor="middle" fill="#446688">3</text>
    <text x="220" y="111" text-anchor="middle" fill="#446688">6</text>
    <text x="276" y="111" text-anchor="middle" fill="#446688">10</text>
    <!-- 行 1 -->
    <rect x="136" y="128" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <rect x="192" y="128" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <rect x="248" y="128" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="164" y="151" text-anchor="middle" fill="#2f5a24">2</text>
    <text x="220" y="151" text-anchor="middle" fill="#2f5a24">5</text>
    <text x="276" y="151" text-anchor="middle" fill="#2f5a24">9</text>
    <!-- 行 2 -->
    <rect x="192" y="168" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <rect x="248" y="168" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="220" y="191" text-anchor="middle" fill="#8a6a1a">3</text>
    <text x="276" y="191" text-anchor="middle" fill="#8a6a1a">7</text>
    <!-- 行 3 -->
    <rect x="248" y="208" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="276" y="231" text-anchor="middle" fill="#b85450">4</text>
  </g>

  <!-- 行标签 -->
  <g filter="url(#rough2)" font-size="12">
    <text x="60" y="111" text-anchor="end" fill="#666">i=0</text>
    <text x="116" y="151" text-anchor="end" fill="#666">i=1</text>
    <text x="172" y="191" text-anchor="end" fill="#666">i=2</text>
    <text x="228" y="231" text-anchor="end" fill="#666">i=3</text>
  </g>

  <!-- 右侧说明 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="352" y="96" width="144" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="424" y="118" text-anchor="middle" fill="#446688">每行向右递增</text>
    <rect x="352" y="146" width="144" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="424" y="168" text-anchor="middle" fill="#2f5a24">n(n+1)/2 = 10 个</text>
    <rect x="352" y="196" width="144" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="424" y="218" text-anchor="middle" fill="#8a6a1a">滚动累加：</text>
    <text x="424" y="240" text-anchor="middle" fill="#8a6a1a">内层 O(1) 生成</text>
  </g>

  <!-- 底部排序结果 -->
  <text x="150" y="278" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">排序后</text>
  <g filter="url(#rough2)" font-size="13">
    <rect x="40" y="290" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <rect x="82" y="290" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <rect x="124" y="290" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <rect x="166" y="290" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <rect x="208" y="290" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <rect x="250" y="290" width="42" height="30" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <rect x="292" y="290" width="42" height="30" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="61" y="310" text-anchor="middle" fill="#b85450">1</text>
    <text x="103" y="310" text-anchor="middle" fill="#b85450">2</text>
    <text x="145" y="310" text-anchor="middle" fill="#b85450">3</text>
    <text x="187" y="310" text-anchor="middle" fill="#b85450">3</text>
    <text x="229" y="310" text-anchor="middle" fill="#b85450">4</text>
    <text x="271" y="310" text-anchor="middle" fill="#666">5</text>
    <text x="313" y="310" text-anchor="middle" fill="#666">…</text>
  </g>
  <text x="452" y="310" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">← 前 5 个之和 = 13</text>
</svg>
