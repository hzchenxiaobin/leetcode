<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums2 = [1, 3, 4, 2]</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每一行是处理完 nums2[i] 之后的栈状态与已经写好的 nxt 表</text>
  <text x="64" y="80" text-anchor="middle" font-size="9" fill="#666" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="128" y="80" text-anchor="middle" font-size="9" fill="#666" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="268" y="80" text-anchor="middle" font-size="9" fill="#666" font-weight="bold" filter="url(#rough2)">出栈 / 记账</text>
  <text x="410" y="80" text-anchor="middle" font-size="9" fill="#666" font-weight="bold" filter="url(#rough2)">栈（底→顶）</text>
  <text x="496" y="80" text-anchor="middle" font-size="9" fill="#666" font-weight="bold" filter="url(#rough2)">nxt 表</text>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="44" y="90" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="64" y="110" font-size="10" fill="#444">0</text>
    <rect x="96" y="90" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="128" y="110" font-size="10" fill="#444">1</text>
    <rect x="172" y="90" width="192" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="268" y="110" font-size="9.5" fill="#444">无（栈空）</text>
    <rect x="376" y="90" width="68" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="410" y="110" font-size="10" fill="#444">[1]</text>
    <rect x="456" y="90" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="496" y="110" font-size="9" fill="#444">{}</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="44" y="124" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="64" y="144" font-size="10" fill="#444">1</text>
    <rect x="96" y="124" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="128" y="144" font-size="10" fill="#444">3</text>
    <rect x="172" y="124" width="192" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="268" y="144" font-size="9.5" fill="#444">弹出 1 → nxt[1] = 3</text>
    <rect x="376" y="124" width="68" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="410" y="144" font-size="10" fill="#444">[3]</text>
    <rect x="456" y="124" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="496" y="144" font-size="9" fill="#444">{1:3}</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="44" y="158" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="64" y="178" font-size="10" fill="#444">2</text>
    <rect x="96" y="158" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="128" y="178" font-size="10" fill="#444">4</text>
    <rect x="172" y="158" width="192" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="268" y="178" font-size="9.5" fill="#444">弹出 3 → nxt[3] = 4</text>
    <rect x="376" y="158" width="68" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="410" y="178" font-size="10" fill="#444">[4]</text>
    <rect x="456" y="158" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="496" y="178" font-size="9" fill="#444">{1:3, 3:4}</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="44" y="192" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="64" y="212" font-size="10" fill="#444">3</text>
    <rect x="96" y="192" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="128" y="212" font-size="10" fill="#444">2</text>
    <rect x="172" y="192" width="192" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="268" y="212" font-size="9.5" fill="#444">无（2 &lt; 栈顶 4）</text>
    <rect x="376" y="192" width="68" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="410" y="212" font-size="10" fill="#444">[4, 2]</text>
    <rect x="456" y="192" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="496" y="212" font-size="9" fill="#444">{1:3, 3:4}</text>
  </g>

  <rect x="44" y="262" width="492" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="10" filter="url(#rough2)"/>
  <text x="290" y="282" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">收尾：栈中 4、2 右侧都没有更大值，nxt 里查不到它们，直接落空</text>
  <text x="290" y="300" text-anchor="middle" font-size="9.8" fill="#3a5a30" filter="url(#rough2)">按 nums1 = [4,1,2] 查表：nxt[4] 缺 → −1，nxt[1] = 3，nxt[2] 缺 → −1</text>

  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">答案 = [−1, 3, −1]；栈里遗留的元素恰好就是「没有下一个更大值」的元素</text>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">整趟扫描中 1、3 各入栈出栈一次，2、4 只入栈 —— 总操作数 O(n)</text>
</svg>
