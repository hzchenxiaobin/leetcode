<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,2,1]，n = 3</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 图例 -->
  <g filter="url(#sk)"><rect x="462" y="50" width="14" height="11" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="482" y="60" font-size="10" fill="#444">本轮写入</text>
  <g filter="url(#sk)"><rect x="546" y="50" width="14" height="11" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="566" y="60" font-size="10" fill="#444">已写入</text>

  <!-- 第 1 轮 -->
  <text x="190" y="80" font-size="12" font-weight="bold" fill="#2b2b2b">第 1 轮（i = 0）：ans[0] ← nums[0] = 1，ans[3] ← nums[0] = 1</text>
  <g filter="url(#sk)"><rect x="190" y="88" width="46" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="213" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">1</text>
  <g filter="url(#sk)"><rect x="242" y="88" width="46" height="38" rx="5" fill="none" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk)"><rect x="294" y="88" width="46" height="38" rx="5" fill="none" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk)"><rect x="346" y="88" width="46" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="369" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">1</text>
  <g filter="url(#sk)"><rect x="398" y="88" width="46" height="38" rx="5" fill="none" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk)"><rect x="450" y="88" width="46" height="38" rx="5" fill="none" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3"/></g>

  <!-- 第 2 轮 -->
  <text x="190" y="160" font-size="12" font-weight="bold" fill="#2b2b2b">第 2 轮（i = 1）：ans[1] ← nums[1] = 2，ans[4] ← nums[1] = 2</text>
  <g filter="url(#sk)"><rect x="190" y="168" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="213" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="242" y="168" width="46" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="265" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">2</text>
  <g filter="url(#sk)"><rect x="294" y="168" width="46" height="38" rx="5" fill="none" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk)"><rect x="346" y="168" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="369" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="398" y="168" width="46" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="421" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">2</text>
  <g filter="url(#sk)"><rect x="450" y="168" width="46" height="38" rx="5" fill="none" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3"/></g>

  <!-- 第 3 轮 -->
  <text x="190" y="240" font-size="12" font-weight="bold" fill="#2b2b2b">第 3 轮（i = 2）：ans[2] ← nums[2] = 1，ans[5] ← nums[2] = 1</text>
  <g filter="url(#sk)"><rect x="190" y="248" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="213" y="273" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="242" y="248" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="265" y="273" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="294" y="248" width="46" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="317" y="273" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">1</text>
  <g filter="url(#sk)"><rect x="346" y="248" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="369" y="273" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="398" y="248" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="421" y="273" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="450" y="248" width="46" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="473" y="273" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">1</text>

  <!-- 最终状态 -->
  <text x="190" y="320" font-size="12" font-weight="bold" fill="#2e6e2e">3 轮后：2n 个格子全部填满，ans = [1,2,1,1,2,1]</text>
  <g filter="url(#sk)"><rect x="190" y="328" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="213" y="353" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="242" y="328" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="265" y="353" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="294" y="328" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="317" y="353" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="346" y="328" width="46" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="369" y="353" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">1</text>
  <g filter="url(#sk)"><rect x="398" y="328" width="46" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="421" y="353" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="450" y="328" width="46" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="473" y="353" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="516" y="352" font-size="18" font-weight="bold" fill="#2e6e2e">✓</text>

  <!-- 下标 -->
  <text x="213" y="378" text-anchor="middle" font-size="9.5" fill="#888">ans[0]</text>
  <text x="265" y="378" text-anchor="middle" font-size="9.5" fill="#888">ans[1]</text>
  <text x="317" y="378" text-anchor="middle" font-size="9.5" fill="#888">ans[2]</text>
  <text x="369" y="378" text-anchor="middle" font-size="9.5" fill="#888">ans[3]</text>
  <text x="421" y="378" text-anchor="middle" font-size="9.5" fill="#888">ans[4]</text>
  <text x="473" y="378" text-anchor="middle" font-size="9.5" fill="#888">ans[5]</text>

  <!-- 中缝 -->
  <path d="M 343 84 L 343 370" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 5" fill="none" filter="url(#sk)"/>
  <text x="343" y="393" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">中缝</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="90" y="404" width="460" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">每轮两个赋值，n 轮恰好填满 2n 格——无重无漏</text>
  <text x="320" y="440" text-anchor="middle" font-size="11" fill="#444">后半 = 前半的完整拷贝：自检断言 ans[i] == ans[i+n]</text>
</svg>
