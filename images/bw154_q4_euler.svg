<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 376" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="376" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Euler 序：把每棵子树压成一段连续区间</text>
  <text x="290" y="47" text-anchor="middle" font-size="11" fill="#888">以节点 1 为根做一次 DFS，进入时记 tin、离开时记 tout</text>

  <circle cx="110" cy="76" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">1</text>
  <circle cx="110" cy="152" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="158" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold">2</text>
  <circle cx="110" cy="228" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="234" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold">3</text>
  <circle cx="110" cy="304" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="310" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">4</text>

  <path d="M 110 96 L 110 132" stroke="#666" stroke-width="1.9" fill="none" filter="url(#rough2)"/>
  <path d="M 110 172 L 110 208" stroke="#666" stroke-width="1.9" fill="none" filter="url(#rough2)"/>
  <path d="M 110 248 L 110 284" stroke="#666" stroke-width="1.9" fill="none" filter="url(#rough2)"/>
  <text x="128" y="120" font-size="10" fill="#b85450">w=2</text>
  <text x="128" y="196" font-size="10" fill="#b85450">w=1</text>
  <text x="128" y="272" font-size="10" fill="#b85450">w=5</text>
  <text x="110" y="344" text-anchor="middle" font-size="10" fill="#999">树（根 = 1）</text>

  <path d="M 146 190 L 186 190" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="182" text-anchor="middle" font-size="9.5" fill="#666">DFS</text>

  <rect x="196" y="82" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="226" y="109" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">1</text>
  <rect x="256" y="82" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="286" y="109" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold">2</text>
  <rect x="316" y="82" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="346" y="109" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold">3</text>
  <rect x="376" y="82" width="60" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="406" y="109" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">4</text>

  <text x="226" y="140" text-anchor="middle" font-size="9.5" fill="#999">tin=1</text>
  <text x="286" y="140" text-anchor="middle" font-size="9.5" fill="#999">tin=2</text>
  <text x="346" y="140" text-anchor="middle" font-size="9.5" fill="#999">tin=3</text>
  <text x="406" y="140" text-anchor="middle" font-size="9.5" fill="#999">tin=4</text>

  <path d="M 196 152 L 196 164 L 436 164 L 436 152" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="316" y="182" text-anchor="middle" font-size="10" fill="#446688">子树 1：[1, 4]</text>

  <path d="M 256 192 L 256 204 L 436 204 L 436 192" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="346" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">子树 2：[2, 4]</text>

  <path d="M 316 232 L 316 244 L 436 244 L 436 232" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="376" y="262" text-anchor="middle" font-size="10" fill="#8a6a20">子树 3：[3, 4]</text>

  <path d="M 376 272 L 376 284 L 436 284 L 436 272" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="416" y="302" text-anchor="middle" font-size="10" fill="#b85450">子树 4：[4, 4]</text>

  <rect x="250" y="314" width="300" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="334" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">tout[u] = 离开时的计数器</text>
  <text x="400" y="353" text-anchor="middle" font-size="10" fill="#777">子树 u 恰好占 [tin[u], tout[u]]</text>

  <text x="290" y="368" text-anchor="middle" font-size="9.5" fill="#999">结论：任何「作用于整棵子树」的修改，都变成对一段下标区间的修改</text>
</svg>
