<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：按行数个数，按列取一轮</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 1：nums = [3,1,3,2,1,3] → 计数 cnt = {1: 2, 2: 1, 3: 3}</text>

  <!-- 柱状图：行 = 值（升序），列 = 轮次 -->
  <text x="122" y="78" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">轮 1</text>
  <text x="172" y="78" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">轮 2</text>
  <text x="222" y="78" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">轮 3</text>

  <text x="92" y="115" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">值 1 ×2</text>
  <rect x="100" y="92" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="116" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="150" y="92" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="116" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>

  <text x="92" y="159" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">值 2 ×1</text>
  <rect x="100" y="136" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="160" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="92" y="203" text-anchor="end" font-size="12" fill="#d6a040" filter="url(#rough2)">值 3 ×3</text>
  <rect x="100" y="180" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="204" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="150" y="180" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="204" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="200" y="180" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="204" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">3</text>

  <text x="172" y="242" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">第 r 列 = 第 r 轮取走的值（自上而下升序）</text>

  <!-- 按列读取箭头 -->
  <path d="M250,134 L302,110" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="100" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">按列读取</text>

  <!-- 右侧：每轮输出 -->
  <rect x="310" y="88" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="109" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">轮 1 → 1, 2, 3</text>
  <rect x="310" y="128" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">轮 2 → 1, 3</text>
  <rect x="310" y="168" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="189" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">轮 3 → 3</text>
  <path d="M385,200 L385,218" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="290" y="222" width="190" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="385" y="249" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = [1,2,3,1,3,3]</text>

  <!-- 底部结论框 -->
  <rect x="60" y="292" width="440" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">值 v 出现 c 次 ⇒ 恰在第 1..c 轮各被取走一个</text>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">第 r 轮取走 { v : cnt[v] ≥ r } 并升序 ⇒ 按列读取</text>
</svg>
