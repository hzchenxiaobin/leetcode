<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="370" fill="#fdfcf7"/>

  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心思路：按 order 的顺序筛出朋友</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- order 数组 -->
  <text x="64" y="88" font-size="13" font-weight="bold" fill="#2b2b2b">order（完成顺序）</text>
  <g filter="url(#sk)"><rect x="64" y="98" width="52" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="126" y="98" width="52" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="188" y="98" width="52" height="44" rx="5" fill="#f1f1ef" stroke="#b0b0ac" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="250" y="98" width="52" height="44" rx="5" fill="#f1f1ef" stroke="#b0b0ac" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="312" y="98" width="52" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="90" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="152" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="214" y="126" text-anchor="middle" font-size="15" fill="#8a8a86">2</text>
  <text x="276" y="126" text-anchor="middle" font-size="15" fill="#8a8a86">5</text>
  <text x="338" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="90" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="152" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="214" y="162" text-anchor="middle" font-size="12" fill="#b85450">✗</text>
  <text x="276" y="162" text-anchor="middle" font-size="12" fill="#b85450">✗</text>
  <text x="338" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>

  <!-- friends 集合 -->
  <g filter="url(#sk)"><rect x="418" y="80" width="196" height="86" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="516" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">friends（按 ID 递增）</text>
  <text x="516" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e" font-family="monospace">{1, 3, 4}</text>
  <text x="516" y="150" text-anchor="middle" font-size="11" fill="#555">排序依据是 ID，不是完成顺序</text>

  <!-- 过滤箭头 -->
  <path d="M 180 176 Q 186 200 182 222" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="196" y="205" font-size="12.5" fill="#4a4a4a">逐个检查：x ∈ friends ?</text>

  <!-- 答案 -->
  <text x="64" y="258" font-size="13" font-weight="bold" fill="#7a5415">答案（完成顺序）</text>
  <g filter="url(#sk)"><rect x="64" y="268" width="52" height="44" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="126" y="268" width="52" height="44" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="188" y="268" width="52" height="44" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="90" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">3</text>
  <text x="152" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">1</text>
  <text x="214" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">4</text>

  <!-- 易错提醒 -->
  <g filter="url(#sk)"><rect x="418" y="250" width="196" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="516" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">⚠ 易错点</text>
  <text x="516" y="292" text-anchor="middle" font-size="11.5" fill="#8c4a46">直接返回 friends</text>
  <text x="516" y="308" text-anchor="middle" font-size="11.5" fill="#8c4a46">得到 [1,3,4]，是错的！</text>

  <!-- 底注 -->
  <text x="320" y="352" text-anchor="middle" font-size="11.5" fill="#888">答案 = order 中属于 friends 的元素组成的子序列，相对顺序自然就是完成顺序</text>
</svg>
