<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="370" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">总损失随第一轮损失 p 的变化（A=1429, B=7143）</text>

  <!-- region shading -->
  <rect x="72" y="82" width="212" height="216" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <rect x="286" y="82" width="214" height="216" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>

  <!-- axes -->
  <path d="M70,300 L524,300" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M70,300 L70,58" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="524" y="322" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">第一轮损失 p</text>
  <text x="24" y="60" font-size="12" fill="#446688" filter="url(#rough2)">总损失</text>

  <!-- threshold line y = 2857 -->
  <path d="M70,81 L524,81" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="80" y="74" font-size="12" fill="#b85450" filter="url(#rough2)">2857 = m</text>

  <!-- 4-candidate branch: 2p+1 -->
  <path d="M70,300 L285,81" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <!-- 3-candidate plateau -->
  <path d="M285,81 L500,81" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>

  <!-- key points -->
  <circle cx="285" cy="81" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="500" cy="81" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- x ticks -->
  <path d="M70,296 L70,304" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M285,296 L285,304" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M500,296 L500,304" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="320" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <text x="285" y="320" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1428</text>
  <text x="500" y="320" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2857</text>
  <path d="M285,304 L285,336" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- annotations -->
  <text x="80" y="108" font-size="12" fill="#446688" filter="url(#rough2)">4 个候选：p + (p+1)</text>
  <text x="330" y="130" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3 个候选：p + (2857 − p) = 2857</text>
  <text x="230" y="356" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">p = 2857 时只剩 2 个候选，总损失恰为 2857</text>

  <!-- peak callout -->
  <path d="M285,81 L208,152" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="164" font-size="12" fill="#b85450" filter="url(#rough2)">2·1428+1 = 2857</text>
</svg>
