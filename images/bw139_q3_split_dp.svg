<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心解耦：用分割点把「前 k 个」和「后 k 个」切开</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">长度 2k 的子序列 ⟺ 存在分割点 i：前 k 个取自 nums[0..i−1]，后 k 个取自 nums[i..n−1]</text>

  <rect x="60" y="66" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="130" y="66" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="200" y="66" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="280" y="66" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="350" y="66" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="420" y="66" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>

  <text x="90" y="94" text-anchor="middle" font-size="14" fill="#3a5a30">4</text>
  <text x="160" y="94" text-anchor="middle" font-size="14" fill="#3a5a30">2</text>
  <text x="230" y="94" text-anchor="middle" font-size="14" fill="#3a5a30">5</text>
  <text x="310" y="94" text-anchor="middle" font-size="14" fill="#3a4a66">6</text>
  <text x="380" y="94" text-anchor="middle" font-size="14" fill="#3a4a66">7</text>
  <text x="450" y="94" text-anchor="middle" font-size="14" fill="#3a4a66">3</text>

  <path d="M 270 58 L 270 124" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="10" fill="#b85450">分割点 i</text>

  <text x="155" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a">下半段：选 k 个</text>
  <text x="380" y="58" text-anchor="middle" font-size="10" fill="#446688">上半段：选 k 个</text>

  <path d="M 200 124 L 160 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 124 L 370 158" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="158" width="240" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="180" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">pre[i][k]</text>
  <text x="160" y="199" text-anchor="middle" font-size="10" fill="#555">前 i 个元素里选 k 个的全部 OR 值</text>
  <text x="160" y="217" text-anchor="middle" font-size="10" fill="#555">只依赖 nums[0..i−1]</text>

  <rect x="300" y="158" width="240" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="180" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">suf[i][k]</text>
  <text x="420" y="199" text-anchor="middle" font-size="10" fill="#555">从 i 开始选 k 个的全部 OR 值</text>
  <text x="420" y="217" text-anchor="middle" font-size="10" fill="#555">只依赖 nums[i..n−1]</text>

  <rect x="40" y="248" width="490" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="285" y="270" text-anchor="middle" font-size="11" fill="#8a6a20">答案 = max over i ∈ [k, n−k], a ∈ pre[i][k], b ∈ suf[i][k] of (a XOR b)</text>

  <text x="280" y="306" text-anchor="middle" font-size="10.5" fill="#555">两侧独立：前段下标全 &lt; i，后段下标全 ≥ i，拼起来仍是递增子序列</text>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#555">于是「按分割点枚举」不重不漏，且每侧只要保留 OR 值集合就够了</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#999">值域 &lt; 2⁷ ⟹ 每个集合最多 128 个值</text>
</svg>
