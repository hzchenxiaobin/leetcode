<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 545"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="545" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：读入 → 与栈顶比较 → 级联翻倍 → 入栈</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Panel A: example 1 -->
  <rect x="70" y="48" width="500" height="238" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="68" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：nums = [3,1,1,2]</text>

  <!-- header -->
  <rect x="82" y="76" width="88" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">读入 x</text>
  <rect x="174" y="76" width="118" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="233" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">与栈顶比较</text>
  <rect x="296" y="76" width="148" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">级联合并（值翻倍）</text>
  <rect x="448" y="76" width="110" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="503" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">入栈后的栈</text>

  <!-- row 1 -->
  <rect x="82" y="108" width="88" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="174" y="108" width="118" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="233" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">栈空</text>
  <rect x="296" y="108" width="148" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="131" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">——</text>
  <rect x="448" y="108" width="110" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="489" y="115" width="28" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="503" y="132" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 2 -->
  <rect x="82" y="148" width="88" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="174" y="148" width="118" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="233" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 <tspan fill="#4a7a3a" font-weight="bold">≠</tspan> 1</text>
  <rect x="296" y="148" width="148" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="171" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">——</text>
  <rect x="448" y="148" width="110" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="474" y="155" width="28" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="505" y="155" width="28" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="519" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 3 -->
  <rect x="82" y="188" width="88" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="174" y="188" width="118" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="233" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 <tspan fill="#b85450" font-weight="bold">=</tspan> 1</text>
  <rect x="296" y="188" width="148" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="211" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1+1=2；再看 3≠2 停</text>
  <rect x="448" y="188" width="110" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="474" y="195" width="28" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="212" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="505" y="195" width="28" height="24" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="519" y="212" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 4 -->
  <rect x="82" y="228" width="88" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="174" y="228" width="118" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="233" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 <tspan fill="#b85450" font-weight="bold">=</tspan> 2</text>
  <rect x="296" y="228" width="148" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="251" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2+2=4；再看 3≠4 停</text>
  <rect x="448" y="228" width="110" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="474" y="235" width="28" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="252" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="505" y="235" width="28" height="24" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="519" y="252" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>

  <text x="320" y="278" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案：[3,4] ✓</text>

  <!-- Panel B: example 2 -->
  <rect x="70" y="298" width="500" height="186" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="318" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2：nums = [2,2,4]（一路级联到 8）</text>

  <!-- header -->
  <rect x="82" y="326" width="88" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">读入 x</text>
  <rect x="174" y="326" width="118" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="233" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">与栈顶比较</text>
  <rect x="296" y="326" width="148" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">级联合并（值翻倍）</text>
  <rect x="448" y="326" width="110" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="503" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">入栈后的栈</text>

  <!-- row 1 -->
  <rect x="82" y="356" width="88" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="174" y="356" width="118" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="233" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">栈空</text>
  <rect x="296" y="356" width="148" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="378" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">——</text>
  <rect x="448" y="356" width="110" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="489" y="362" width="28" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="503" y="379" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 2 -->
  <rect x="82" y="394" width="88" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="416" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="174" y="394" width="118" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="233" y="416" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 <tspan fill="#b85450" font-weight="bold">=</tspan> 2</text>
  <rect x="296" y="394" width="148" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="416" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2+2=4；栈已空，停</text>
  <rect x="448" y="394" width="110" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="489" y="400" width="28" height="24" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="503" y="417" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>

  <!-- row 3 -->
  <rect x="82" y="432" width="88" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="454" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="174" y="432" width="118" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="233" y="454" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 <tspan fill="#b85450" font-weight="bold">=</tspan> 4</text>
  <rect x="296" y="432" width="148" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="454" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4+4=8；栈已空，停</text>
  <rect x="448" y="432" width="110" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="489" y="438" width="28" height="24" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="503" y="455" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>

  <text x="320" y="478" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案：[8] ✓</text>

  <!-- Bottom note -->
  <rect x="70" y="494" width="500" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="512" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">每个元素至多入栈一次、出栈一次 ⇒ 时间 O(n)，空间 O(n)</text>
  <text x="320" y="528" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">级联只发生在入栈瞬间——右侧元素入栈时自然会与栈顶比较</text>
</svg>
