<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">排序后：非相邻对的距离 = 跨过的相邻间隔之和</text>
  <text x="300" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 arr = [1, 3, 6, 10, 15]（已升序）为例，相邻间隔为 2、3、4、5</text>

  <!-- 数轴 -->
  <line x1="40" y1="160" x2="565" y2="160" stroke="#cccccc" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 非相邻对 (1, 10) 的红色粗线段，直接压在数轴上 -->
  <line x1="60" y1="160" x2="362" y2="160" stroke="#b85450" stroke-width="4.5" filter="url(#rough2)"/>

  <!-- 相邻间隔的弧，向上鼓出 -->
  <path d="M 60 160 Q 93 118 127 160" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 127 160 Q 178 118 228 160" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 228 160 Q 295 118 362 160" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 362 160 Q 446 118 530 160" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <text x="93" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="178" y="106" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="295" y="106" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">4</text>
  <text x="446" y="106" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">5</text>

  <!-- 端点与数值 -->
  <circle cx="60" cy="160" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="127" cy="160" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="228" cy="160" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="362" cy="160" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="530" cy="160" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="60" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="127" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="228" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="362" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="530" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>

  <text x="211" y="216" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">非相邻对（1, 10）：2 + 3 + 4 = 9，远大于最小间隔 2</text>

  <!-- 底部说明面板 -->
  <rect x="40" y="236" width="520" height="146" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="58" y="262" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">核心引理</text>

  <text x="58" y="288" font-size="11.5" fill="#333" filter="url(#rough2)">升序排列后，下标 j 与 i 之间隔着若干相邻间隔，</text>
  <text x="58" y="310" font-size="11.5" fill="#333" filter="url(#rough2)">它们的和正好就是从 i 到 j 的距离，且每一项都为正。</text>

  <rect x="58" y="324" width="484" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="342" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">于是「最小绝对差」=「最小相邻间隔」：best = min(gap[0..n−2])</text>
  <text x="70" y="359" font-size="10" fill="#5a6a50" filter="url(#rough2)">只需看 n−1 个相邻间隔，而不是 C(n,2) 个元素对</text>
</svg>
