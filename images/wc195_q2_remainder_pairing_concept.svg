<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrRev" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="376" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：a + b ≡ 0 (mod k) ⟺ 两数余数互补</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">整除性只看 mod k —— n 个具体数字的匹配坍缩成 k 个计数的检查</text>

  <g filter="url(#rough2)">
    <text x="170" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">k = 5：余数配对表</text>

    <rect x="36" y="80" width="66" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="69" y="99" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a3a">余 0</text>
    <line x1="104" y1="95" x2="166" y2="95" stroke="#3a3a3a" stroke-width="1.6" marker-start="url(#arrRev)" marker-end="url(#arr)"/>
    <rect x="168" y="80" width="66" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="201" y="99" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a3a">余 0</text>
    <text x="246" y="99" font-size="11" fill="#4a7a3a">0 + 0 = 0 ✓</text>

    <rect x="36" y="122" width="66" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="69" y="141" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">余 1</text>
    <line x1="104" y1="137" x2="166" y2="137" stroke="#3a3a3a" stroke-width="1.6" marker-start="url(#arrRev)" marker-end="url(#arr)"/>
    <rect x="168" y="122" width="66" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="201" y="141" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">余 4</text>
    <text x="246" y="141" font-size="11" fill="#446688">1 + 4 = 5 ✓</text>

    <rect x="36" y="164" width="66" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="69" y="183" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">余 2</text>
    <line x1="104" y1="179" x2="166" y2="179" stroke="#3a3a3a" stroke-width="1.6" marker-start="url(#arrRev)" marker-end="url(#arr)"/>
    <rect x="168" y="164" width="66" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="201" y="183" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">余 3</text>
    <text x="246" y="183" font-size="11" fill="#d6a040">2 + 3 = 5 ✓</text>

    <text x="170" y="220" text-anchor="middle" font-size="10.5" fill="#888">余 r ⟷ 余 k−r —— 数值多大、正负都不重要</text>
  </g>

  <g filter="url(#rough2)">
    <text x="480" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">代入具体数字（k = 5）</text>

    <rect x="340" y="80" width="280" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="352" y="98" font-size="11" fill="#333">7 → 余 2，13 → 余 3（互补）</text>
    <text x="352" y="115" font-size="11" font-weight="bold" fill="#4a7a3a">7 + 13 = 20 = 4 × 5 ✓</text>

    <rect x="340" y="132" width="280" height="44" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.3"/>
    <text x="352" y="150" font-size="11" fill="#333">−1 → 余 4（负数归一化），6 → 余 1</text>
    <text x="352" y="167" font-size="11" font-weight="bold" fill="#b07818">−1 + 6 = 5 ✓（余 4 配余 1）</text>

    <rect x="340" y="184" width="280" height="58" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="352" y="204" font-size="11.5" font-weight="bold" fill="#8a3a36">k = 10（偶数）特例：余 5 只能配余 5</text>
    <text x="352" y="221" font-size="11" fill="#8a3a36">5 + 5 = 10 ✓，但 5 + 其他余数都不行</text>
    <text x="352" y="237" font-size="11" font-weight="bold" fill="#b85450">→ cnt[5] 必须是偶数</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="20" y="258" width="600" height="102" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="36" y="280" font-size="12.5" font-weight="bold" fill="#3a5a3a">判定条件（充要）：统计 cnt[r] = 余数为 r 的元素个数</text>
    <text x="40" y="302" font-size="11.5" fill="#3a4a66">① 余 0 只能自配 → cnt[0] 必须为偶数</text>
    <text x="40" y="322" font-size="11.5" fill="#3a4a66">② k 为偶数时，余 k/2 也只能自配 → cnt[k/2] 必须为偶数</text>
    <text x="40" y="342" font-size="11.5" fill="#3a4a66">③ 其余 1 ≤ r &lt; k/2：余 r 与余 k−r 互相消耗 → cnt[r] = cnt[k−r]</text>
  </g>
</svg>
