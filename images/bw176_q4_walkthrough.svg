<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="580" height="320" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333">演算：树 0—1—2，s = "aac"</text>

  <circle cx="110" cy="70" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="76" text-anchor="middle" font-size="11">0 a</text>
  <circle cx="210" cy="70" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="76" text-anchor="middle" font-size="11">1 a</text>
  <circle cx="310" cy="70" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="76" text-anchor="middle" font-size="11">2 c</text>
  <path d="M130,70 L190,70" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M230,70 L290,70" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="40" y="110" width="500" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="136" font-size="11" fill="#333">初始：W0 = [a, 0, c]　（W[1] = a⊕a = 0，W[2] = a⊕a⊕c = c）</text>

  <rect x="40" y="160" width="500" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="186" font-size="11" fill="#333">query 0 2：lca=0，掩码 = a ⊕ c ⊕ a = c，popcount 1 → true</text>

  <rect x="40" y="210" width="500" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="236" font-size="11" fill="#333">update 1 b：δ = a ⊕ b，区间 [tin[1], tout[1]) 上全部异或 δ</text>

  <rect x="40" y="260" width="500" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="54" y="286" font-size="11" fill="#333">query 0 2：掩码 = a ⊕ (a⊕b⊕c) ⊕ a = a⊕b⊕c，popcount 3 → false</text>
</svg>
