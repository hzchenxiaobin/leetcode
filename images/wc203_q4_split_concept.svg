<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="450" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：切一刀，丢大留小 —— 得分只来自被保留的一边</text>
  <path d="M 130 36 Q 340 44 550 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 石子行 -->
  <text x="261" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">左行，和 = 11</text>
  <text x="397" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818" filter="url(#rough2)">右行，和 = 14</text>

  <g filter="url(#rough2)">
    <rect x="187" y="60" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="237" y="60" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="287" y="60" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="345" y="60" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="395" y="60" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="445" y="60" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="209" y="84" fill="#2b4a66">6</text>
    <text x="259" y="84" fill="#2b4a66">2</text>
    <text x="309" y="84" fill="#2b4a66">3</text>
    <text x="367" y="84" fill="#8a6d1f">4</text>
    <text x="417" y="84" fill="#8a6d1f">5</text>
    <text x="467" y="84" fill="#8a6d1f">5</text>
  </g>
  <path d="M 338 54 L 338 106" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="338" y="122" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">Alice 选切分点 k</text>

  <!-- 三条箭头 -->
  <path d="M 338 130 Q 200 148 120 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#rough2)"/>
  <path d="M 338 130 Q 340 148 340 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#rough2)"/>
  <path d="M 338 130 Q 480 148 560 168" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#rough2)"/>

  <!-- 面板 1：左 < 右 -->
  <g filter="url(#rough2)">
    <rect x="20" y="172" width="200" height="180" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="120" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">情况一：左和 &lt; 右和</text>
  <g filter="url(#rough2)">
    <rect x="48" y="204" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="140" y="204" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <path d="M 152 208 L 180 230" stroke="#b85450" stroke-width="2"/>
    <path d="M 180 208 L 152 230" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="74" y="250" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">留下</text>
  <text x="166" y="250" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">丢弃（大）</text>
  <text x="120" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Bob 丢较大的右行</text>
  <text x="120" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Alice 得左和，在左行继续</text>
  <g filter="url(#rough2)">
    <rect x="34" y="302" width="172" height="36" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="120" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">贡献 = 左和 + f(l, k)</text>

  <!-- 面板 2：左 > 右 -->
  <g filter="url(#rough2)">
    <rect x="240" y="172" width="200" height="180" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">情况二：左和 &gt; 右和</text>
  <g filter="url(#rough2)">
    <rect x="268" y="204" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="360" y="204" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <path d="M 272 208 L 300 230" stroke="#b85450" stroke-width="2"/>
    <path d="M 300 208 L 272 230" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="294" y="250" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">丢弃（大）</text>
  <text x="386" y="250" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">留下</text>
  <text x="340" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Bob 丢较大的左行</text>
  <text x="340" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Alice 得右和，在右行继续</text>
  <g filter="url(#rough2)">
    <rect x="254" y="302" width="172" height="36" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="340" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">贡献 = 右和 + f(k+1, r)</text>

  <!-- 面板 3：左 = 右 -->
  <g filter="url(#rough2)">
    <rect x="460" y="172" width="200" height="180" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="560" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">情况三：左和 = 右和</text>
  <g filter="url(#rough2)">
    <rect x="488" y="204" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="580" y="204" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="560" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">?</text>
  </g>
  <text x="514" y="250" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">任一边</text>
  <text x="606" y="250" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">都可能留</text>
  <text x="560" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Bob 让 Alice 决定丢哪行</text>
  <text x="560" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">两种保留方案取较优</text>
  <g filter="url(#rough2)">
    <rect x="470" y="302" width="180" height="36" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="560" y="319" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">贡献 = 左和</text>
  <text x="560" y="332" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">+ max(f(l,k), f(k+1,r))</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="20" y="368" width="640" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="340" y="390" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">f(l, r) = 所有可能切分点 k 上三种贡献的最大值</text>
  <text x="340" y="412" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">Bob 的规则是确定的，丢掉的分直接消失（不进任何人口袋）—— 这不是零和博弈，</text>
  <text x="340" y="426" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">没有对手在对抗你，只有「选切分点」的单人最优化，天然具备最优子结构</text>
</svg>
