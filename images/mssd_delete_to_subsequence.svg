<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="38" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">删除是自由的：子数组问题退化为子序列问题</text>
  <text x="70" y="62" font-size="12" fill="#888" filter="url(#rough2)">原数组 nums：</text>

  <!-- 原数组 7 格 -->
  <rect x="70" y="72" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="95" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="138" y="72" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="95" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="206" y="72" width="54" height="36" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="95" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">−1</text>
  <path d="M218,79 L248,101 M248,79 L218,101" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <rect x="274" y="72" width="54" height="36" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="95" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">−2</text>
  <path d="M286,79 L316,101 M316,79 L286,101" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <rect x="342" y="72" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="95" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="410" y="72" width="54" height="36" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="437" y="95" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <path d="M422,79 L452,101 M452,79 L422,101" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <rect x="478" y="72" width="54" height="36" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="505" y="95" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">−1</text>
  <path d="M490,79 L520,101 M520,79 L490,101" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- 中间箭头 -->
  <path d="M290,120 L290,182" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="145" font-size="12" fill="#888" filter="url(#rough2)">删除任意个元素</text>
  <text x="305" y="163" font-size="12" fill="#888" filter="url(#rough2)">（这里删掉 4 个灰格）</text>

  <!-- 删除后 3 格 -->
  <rect x="190" y="186" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="209" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="258" y="186" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="209" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="326" y="186" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="353" y="209" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <path d="M256,230 v 6 h 126 v -6" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="319" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">选中的子数组 [2, 1]：在删除后的数组里连续</text>

  <!-- 底部说明框 -->
  <rect x="55" y="262" width="530" height="132" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="288" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">为什么能一步到位？</text>
  <text x="320" y="314" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">① 删除任意个元素 + 选连续子数组 ⇔ 选一个非空子序列（保序）</text>
  <text x="320" y="340" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">② 元素互不相同 ⇒ 每个值 v 至多取一次，贡献与位置无关</text>
  <text x="320" y="366" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">③ v &gt; 0 必取，v ≤ 0 不取 ⇒ 答案 = 不同正数之和（全非正时取 max）</text>
</svg>
