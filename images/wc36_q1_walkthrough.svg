<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 386" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="386" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：按「位置」逐格相加</text>
  <text x="310" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">合并结果的位置集合 = 两棵树的路径集合之并；每个位置取「存在的值之和」</text>

  <g filter="url(#rough2)">
    <rect x="58" y="70" width="504" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="112" y="88" text-anchor="middle" font-size="10.5" fill="#2f3f5c">位置（路径）</text>
    <text x="212" y="88" text-anchor="middle" font-size="10.5" fill="#2f3f5c">root1</text>
    <text x="308" y="88" text-anchor="middle" font-size="10.5" fill="#2f3f5c">root2</text>
    <text x="404" y="88" text-anchor="middle" font-size="10.5" fill="#2f3f5c">合并后</text>
    <text x="518" y="88" text-anchor="middle" font-size="10.5" fill="#2f3f5c">判定</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="58" y="96" width="504" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="112" y="114" text-anchor="middle" font-size="10.5" fill="#8a6a20">ε（根）</text>
    <text x="212" y="114" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="308" y="114" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="404" y="114" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
    <text x="518" y="114" text-anchor="middle" font-size="9.5" fill="#555">两侧都有 → 1+2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="58" y="122" width="504" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="112" y="140" text-anchor="middle" font-size="10.5" fill="#8a6a20">L</text>
    <text x="212" y="140" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="308" y="140" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="404" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
    <text x="518" y="140" text-anchor="middle" font-size="9.5" fill="#555">两侧都有 → 3+1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="58" y="148" width="504" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="112" y="166" text-anchor="middle" font-size="10.5" fill="#8a6a20">R</text>
    <text x="212" y="166" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="308" y="166" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="404" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
    <text x="518" y="166" text-anchor="middle" font-size="9.5" fill="#555">两侧都有 → 2+3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="58" y="174" width="504" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="112" y="192" text-anchor="middle" font-size="10.5" fill="#3a5a30">LL</text>
    <text x="212" y="192" text-anchor="middle" font-size="11" fill="#333">5</text>
    <text x="308" y="192" text-anchor="middle" font-size="11" fill="#999">—</text>
    <text x="404" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
    <text x="518" y="192" text-anchor="middle" font-size="9.5" fill="#555">仅 root1 → 搬运</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="58" y="200" width="504" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="112" y="218" text-anchor="middle" font-size="10.5" fill="#3a5a30">LR</text>
    <text x="212" y="218" text-anchor="middle" font-size="11" fill="#999">—</text>
    <text x="308" y="218" text-anchor="middle" font-size="11" fill="#333">4</text>
    <text x="404" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
    <text x="518" y="218" text-anchor="middle" font-size="9.5" fill="#555">仅 root2 → 搬运</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="58" y="226" width="504" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="112" y="244" text-anchor="middle" font-size="10.5" fill="#3a5a30">RR</text>
    <text x="212" y="244" text-anchor="middle" font-size="11" fill="#999">—</text>
    <text x="308" y="244" text-anchor="middle" font-size="11" fill="#333">7</text>
    <text x="404" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
    <text x="518" y="244" text-anchor="middle" font-size="9.5" fill="#555">仅 root2 → 搬运</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="58" y="252" width="504" height="26" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <text x="112" y="270" text-anchor="middle" font-size="10.5" fill="#777">RL</text>
    <text x="212" y="270" text-anchor="middle" font-size="11" fill="#999">—</text>
    <text x="308" y="270" text-anchor="middle" font-size="11" fill="#999">—</text>
    <text x="404" y="270" text-anchor="middle" font-size="11" fill="#999">—</text>
    <text x="518" y="270" text-anchor="middle" font-size="9.5" fill="#777">两侧都空 → 不建</text>
  </g>

  <text x="310" y="302" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">层序读回：根 3 → L 4、R 5 → 再下一层 5、4、null、7</text>
  <text x="310" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">输出 [3,4,5,5,4,null,7] ✔</text>
  <text x="310" y="348" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">只需真正「重叠」的位置才消耗一次递归：本图 3 次相加，其余 3 个位置 O(1) 挂接</text>
  <text x="310" y="368" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">空位一律不产生节点，因此合并结果不会凭空多出子树</text>
</svg>
