<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="640" height="510" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：完善集是排序后的「后缀」</text>
  <path d="M 160 40 Q 320 50 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">示例 2 的最优形态（k=1）：封顶排序后 flowers = [2, 3, 4, 5]，target = 5</text>

  <!-- legend -->
  <g filter="url(#sk2)">
    <rect x="40" y="70" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="60" y="82" font-size="11" fill="#7a5415">橙色 = 新种的花（共 5 ≤ newFlowers = 10 朵）</text>

  <!-- unit rulers -->
  <g stroke="#ccc" stroke-width="1" stroke-dasharray="3 4">
    <path d="M 100 294 L 470 294" filter="url(#sk)"/>
    <path d="M 100 258 L 470 258" filter="url(#sk)"/>
    <path d="M 100 222 L 470 222" filter="url(#sk)"/>
  </g>
  <path d="M 100 330 L 470 330" stroke="#666" stroke-width="1.6" filter="url(#sk)"/>
  <text x="42" y="352" font-size="10" fill="#888">1 格 = 1 朵花</text>

  <!-- bars: baseline 330, unit 36 -->
  <!-- bar1: value 2 (blue) + raise to m=4 (orange) -->
  <g filter="url(#sk2)">
    <rect x="140" y="258" width="56" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="186" width="56" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <!-- bar2: value 3 (green) + complete to 5 (orange) -->
  <g filter="url(#sk2)">
    <rect x="220" y="222" width="56" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="220" y="150" width="56" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <!-- bar3: value 4 (green) + complete to 5 (orange) -->
  <g filter="url(#sk2)">
    <rect x="300" y="186" width="56" height="144" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="300" y="150" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <!-- bar4: value 5 = target, already complete -->
  <g filter="url(#sk2)">
    <rect x="380" y="150" width="56" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="168" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">＋2</text>
  <text x="248" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">＋2</text>
  <text x="328" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">＋1</text>

  <!-- target / m lines -->
  <path d="M 100 150 L 470 150" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="480" y="146" font-size="12" font-weight="bold" fill="#b85450">target = 5</text>
  <path d="M 110 186 L 196 186" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="136" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">m = 4</text>
  <text x="408" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">原值即 target，成本 0</text>

  <!-- value labels -->
  <text x="168" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">2</text>
  <text x="248" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5e2e">3</text>
  <text x="328" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5e2e">4</text>
  <text x="408" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5e2e">5</text>

  <!-- prefix / suffix brackets -->
  <path d="M 140 358 L 140 366 L 196 366 L 196 358" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="168" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e">前缀 k = 1</text>
  <text x="168" y="397" text-anchor="middle" font-size="10.5" fill="#2b4a6e">不完善 · 抬最小值到 m</text>
  <path d="M 220 358 L 220 366 L 436 366 L 436 358" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="328" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5e2e">后缀 n−k = 3</text>
  <text x="328" y="397" text-anchor="middle" font-size="10.5" fill="#3a5e2e">完善 · 各补到 target，每个计 full</text>

  <!-- value box -->
  <g filter="url(#sk2)">
    <rect x="455" y="170" width="175" height="130" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="542" y="196" text-anchor="middle" font-size="12" fill="#7a5415">3 × full = 3×2 = 6</text>
  <text x="542" y="220" text-anchor="middle" font-size="12" fill="#7a5415">m × partial = 4×6 = 24</text>
  <path d="M 470 234 L 615 234" stroke="#c98a2b" stroke-width="1" filter="url(#sk)"/>
  <text x="542" y="262" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">总美丽值 = 30 ✓</text>
  <text x="542" y="286" text-anchor="middle" font-size="10.5" fill="#8a8a8a">共种 5 朵，预算未必要花完</text>

  <!-- note box -->
  <g filter="url(#sk2)">
    <rect x="40" y="412" width="560" height="88" rx="8" fill="#f4f7fb" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="58" y="434" font-size="11.5" fill="#2b4a6e">1. 封顶：flowers[i] ← min(flowers[i], target)，已完善花园补齐成本记 0，自动沉入后缀。</text>
  <text x="58" y="455" font-size="11.5" fill="#2b4a6e">2. 交换论证（引理 2）：「完善小值」换成「完善大值」预算不增、美丽不降 ⇒ 完善集总可取后缀。</text>
  <text x="58" y="476" font-size="11.5" fill="#2b4a6e">3. newFlowers 拆成两股：completeCost 补后缀 ＋ cost(m) 抬前缀，二者争夺预算。</text>
  <text x="58" y="497" font-size="11.5" fill="#2b4a6e">4. 枚举 k = 前缀长度（不完善花园数），n+1 个候选覆盖全部后缀结构。</text>
</svg>
