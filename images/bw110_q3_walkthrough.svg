<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">两例走查：逐值算最大间隔，再取最小</text>

  <!-- 示例 1 -->
  <g filter="url(#rough2)">
    <rect x="36" y="48" width="448" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="60" y="74" font-size="13" fill="#446688">示例 1：nums = [1, 2, 1, 2]，n = 4</text>
    <text x="72" y="100" font-size="12.5" fill="#555">值 1 出现于 {0, 2}：间隔 = 2−0=2 与环绕 0+4−2=2 → time(1) = ⌊2/2⌋ = 1</text>
    <text x="72" y="124" font-size="12.5" fill="#555">值 2 出现于 {1, 3}：间隔 = 2 与环绕 2 → time(2) = ⌊2/2⌋ = 1</text>
    <text x="72" y="150" font-size="13" fill="#4a7a3a">答案 = min(1, 1) = 1</text>
    <text x="72" y="174" font-size="11.5" fill="#888">1 秒内：位置 0 拿右邻的 2，位置 2 拿右邻的 2 → [2,2,2,2] ✓</text>
  </g>

  <!-- 示例 2 -->
  <g filter="url(#rough2)">
    <rect x="36" y="202" width="448" height="140" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="60" y="228" font-size="13" fill="#4a7a3a">示例 2：nums = [2, 1, 3, 3, 2]，n = 5</text>
    <text x="72" y="254" font-size="12.5" fill="#555">值 2 出现于 {0, 4}：间隔 4−0=4 与环绕 0+5−4=1 → time(2) = ⌊4/2⌋ = 2</text>
    <text x="72" y="278" font-size="12.5" fill="#555">值 1 出现于 {1}：只有环绕间隔 5 → time(1) = ⌊5/2⌋ = 2</text>
    <text x="72" y="302" font-size="12.5" fill="#555">值 3 出现于 {2, 3}：间隔 1 与环绕 2+5−3=4 → time(3) = ⌊4/2⌋ = 2</text>
    <text x="72" y="330" font-size="13" fill="#4a7a3a">答案 = min(2, 2, 2) = 2</text>
  </g>
</svg>
