<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a8fa6"/>
    </marker>
  </defs>

  <rect width="720" height="580" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">预处理 O(√S + k log k)，每个查询 O(log k)</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">k = τ(S) 是 S 的因子个数；答案的每一列都落在某一段里</text>

  <g filter="url(#rough2)">
    <rect x="110" y="80" width="500" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="9"/>
    <text x="126" y="103" font-size="11.5" font-weight="bold" fill="#333">① 试除枚举全部因子</text>
    <text x="126" y="123" font-size="9.4" fill="#555">i = 1 … ⌊√S⌋，若 i | S 就收下 i 与 S/i —— 共 τ(S) 个，代价 O(√S)</text>
  </g>
  <path d="M 360 138 L 360 162" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="110" y="164" width="500" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9"/>
    <text x="126" y="187" font-size="11.5" font-weight="bold" fill="#333">② 升序排序</text>
    <text x="126" y="207" font-size="9.4" fill="#555">d₁ &lt; d₂ &lt; … &lt; d_k，k = τ(S) ≤ 17280（S ≤ 1e14 时的最大因子个数）</text>
  </g>
  <path d="M 360 222 L 360 246" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="110" y="248" width="500" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="9"/>
    <text x="126" y="271" font-size="11.5" font-weight="bold" fill="#333">③ 切段：把 1e14 列压缩成 k 段</text>
    <text x="126" y="291" font-size="9.4" fill="#555">第 j 段 = 列 i ∈ (d_{j−1}, d_j]，段长 L_j = d_j − d_{j−1}，段高 v_j = S/d_j</text>
  </g>
  <path d="M 360 306 L 360 330" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="110" y="332" width="500" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="9"/>
    <text x="126" y="355" font-size="11.5" font-weight="bold" fill="#333">④ 一次前缀和，之后 O(1) 取区间</text>
    <text x="126" y="375" font-size="9.4" fill="#555">B[j] = B[j−1] + L_j · (S/d_j)，O(k) 算完；注意 Σ_{l≤j} L_l = d_j 可 telescope</text>
  </g>
  <path d="M 360 390 L 360 414" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="110" y="416" width="500" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9"/>
    <text x="126" y="439" font-size="11.5" font-weight="bold" fill="#333">⑤ 每个查询：两次二分 + 若干次四则运算</text>
    <text x="126" y="459" font-size="9.4" fill="#555">m = #d ≤ x，m0 = #d ≤ ⌊S/y⌋，fm = min(m, m0) —— 都只要 bisect 一次</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="492" width="600" height="52" fill="#fffdf5" stroke="#b85450" stroke-width="2" rx="10"/>
    <text x="360" y="514" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36">ans = y · d_fm + ( B[m] − B[fm] ) + ( x − d_m ) · min( y, S/d_{m+1} )</text>
    <text x="360" y="533" text-anchor="middle" font-size="9.2" fill="#a8696a">前 fm 段每列都取满 y；fm..m 段取 S/d_l；最后一段只剩 (x − d_m) 列</text>
  </g>
  <text x="360" y="562" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">fm = 0 或 m = k 时，对应项自然消失（空区间 / 残段长度为 0）</text>
</svg>
