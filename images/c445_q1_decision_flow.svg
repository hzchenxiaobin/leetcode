<svg xmlns="http://www.w3.org/2000/svg" width="660" height="450" viewBox="0 0 660 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="450" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：两次绝对值 + 一次三分支比较</text>
  <path d="M 200 40 Q 330 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="255" y="58" width="150" height="34" rx="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="330" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">读入 x, y, z</text>

  <path d="M 330 92 L 330 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="215" y="120" width="230" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="330" y="145" text-anchor="middle" font-size="13" fill="#2b6e9e">d1 = |x−z|，d2 = |y−z|</text>

  <path d="M 330 160 L 330 182" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="330,186 452,216 330,246 208,216" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="330" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">d1 &lt; d2 ?</text>

  <path d="M 452 216 L 504 216" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="478" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="508" y="198" width="112" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="564" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 1</text>

  <path d="M 330 246 L 330 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="342" y="266" font-size="11" font-weight="bold" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <polygon points="330,278 452,308 330,338 208,308" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="330" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">d2 &lt; d1 ?</text>

  <path d="M 452 308 L 504 308" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="478" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="508" y="290" width="112" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="564" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 2</text>

  <path d="M 330 338 L 330 362" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="342" y="356" font-size="11" font-weight="bold" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="245" y="366" width="170" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="330" y="389" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">返回 0（同时到达）</text>

  <g filter="url(#sk)">
    <rect x="30" y="200" width="150" height="122" rx="10" fill="#f7f9f2" stroke="#4a8edb" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="105" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">O(1) 常数时间</text>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="105" y="244">两次减法</text>
    <text x="105" y="264">两次绝对值</text>
    <text x="105" y="284">至多两次比较</text>
    <text x="105" y="304">与范围无关</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="416" width="580" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="433" text-anchor="middle" font-size="11" fill="#888">即使 x, y, z 大到 10^18 仍是常数次运算——逐轮模拟在 10^9 时就跑不动了</text>
</svg>
