<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：只问「和 ≤ q 的最大长度」→ 顺序无关 + 全正数 → 排序取最小</text>

  <!-- ===== ① subsequence order is irrelevant ===== -->
  <text x="40" y="56" font-size="12" fill="#4a7a3a" font-weight="bold">① 「子序列」的顺序是烟雾弹：和与长度都不含顺序信息</text>

  <g filter="url(#rough2)">
    <rect x="70" y="68" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <text x="93" y="98" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">4</text>
    <text x="93" y="128" text-anchor="middle" font-size="11" fill="#446688">下标 0</text>

    <rect x="116" y="68" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <text x="139" y="98" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">5</text>
    <text x="139" y="128" text-anchor="middle" font-size="11" fill="#446688">下标 1</text>

    <rect x="162" y="68" width="46" height="46" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5,3" rx="6"/>
    <text x="185" y="98" text-anchor="middle" font-size="20" fill="#999" font-weight="bold">2</text>
    <text x="185" y="128" text-anchor="middle" font-size="11" fill="#999">删掉它</text>

    <rect x="208" y="68" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <text x="231" y="98" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">1</text>
    <text x="231" y="128" text-anchor="middle" font-size="11" fill="#446688">下标 3</text>
  </g>

  <text x="40" y="152" font-size="11.5" fill="#666">子序列 [4,5,1]：删 2、保序 → 和 10、长 3。判定只看这两个数 → 等价于「从 nums 里挑一个子集」。</text>

  <g filter="url(#rough2)">
    <rect x="330" y="66" width="200" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="430" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">问题重述：选最多的数，</text>
    <text x="430" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">使总和 ≤ queries[i]</text>
  </g>
  <path d="M 262 90 Q 296 90 326 90" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <line x1="40" y1="170" x2="520" y2="170" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ===== ② fixed k: min sum = k smallest ===== -->
  <text x="40" y="192" font-size="12" fill="#d6a040" font-weight="bold">② 固定长度 k：最小可能和 = 排序后前 k 个数之和（nums[i] ≥ 1 全正）</text>

  <g filter="url(#rough2)">
    <rect x="70" y="204" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="93" y="234" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">1</text>
    <rect x="116" y="204" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="139" y="234" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">2</text>
    <rect x="162" y="204" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="185" y="234" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">4</text>
    <rect x="208" y="204" width="46" height="46" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="231" y="234" text-anchor="middle" font-size="20" fill="#999" font-weight="bold">5</text>
    <text x="139" y="266" text-anchor="middle" font-size="10" fill="#888">排序后取前 3 个</text>
    <text x="231" y="266" text-anchor="middle" font-size="10" fill="#888">第 4 小</text>
  </g>

  <path d="M 70 258 Q 139 282 208 258" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="139" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1+2+4 = 7 = 长度 3 的最小和</text>

  <g filter="url(#rough2)">
    <rect x="300" y="200" width="232" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="416" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">同样是 3 个数，任选都不更省：</text>
    <text x="416" y="244" text-anchor="middle" font-size="12" fill="#666">{4,5,1} = 10　{5,2,1} = 8</text>
    <text x="416" y="266" text-anchor="middle" font-size="12" fill="#666">{1,2,4} = 7 ← 最小</text>
    <text x="416" y="286" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">「长度 k 行不行」只需看 7 这一个数</text>
  </g>
  <path d="M 258 227 Q 278 227 296 227" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <text x="40" y="306" font-size="11.5" fill="#666">交换论证：方案含大数 x、漏掉小数 y（y &lt; x）→ 用 y 换 x：长度不变、和不增 → 最小 k 个数不会更差。</text>

  <line x1="40" y1="322" x2="520" y2="322" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ===== ③ conclusion formula ===== -->
  <text x="40" y="344" font-size="12" fill="#b85450" font-weight="bold">③ 排序 + 前缀和 pre[k]，pre 严格递增（每步至少 +1）→ 每个 query 二分</text>

  <g filter="url(#rough2)">
    <rect x="60" y="356" width="440" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="280" y="380" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">answer[i] = max{ k : pre[k] ≤ queries[i] }</text>
    <text x="280" y="402" text-anchor="middle" font-size="11" fill="#666">pre[0] = 0 对应空子序列（永远合法）；pre 单调 → 「≤ q」的 k 连成一段，二分找右端点</text>
  </g>
</svg>
