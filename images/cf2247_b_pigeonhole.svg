<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="#fafafa" filter="url(#rough2)"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    必要性：连续 k 个前缀余数必须两两不同（窗口内任意两点距离 &lt; k）
  </text>

  <rect x="24" y="52" width="286" height="196" rx="10" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="167" y="78" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    k = 4 &gt; m = 3：放不下
  </text>

  <rect x="46" y="96" width="48" height="38" rx="4" fill="#ffffff" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="104" y="96" width="48" height="38" rx="4" fill="#ffffff" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="162" y="96" width="48" height="38" rx="4" fill="#ffffff" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="96" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>

  <text x="70" y="121" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="128" y="121" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="186" y="121" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="244" y="121" text-anchor="middle" font-size="17" fill="#b85450" filter="url(#rough2)">?</text>

  <text x="70" y="154" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">pi</text>
  <text x="128" y="154" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">pi+1</text>
  <text x="186" y="154" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">pi+2</text>
  <text x="244" y="154" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">pi+3</text>

  <path d="M244,140 L244,168" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>
  <text x="167" y="190" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    只剩 3 个余数可填，第 4 个必然重复
  </text>
  <text x="167" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    重复点距离 ≤ 3 &lt; k ⇒ 出现更短子段
  </text>
  <text x="167" y="236" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    矛盾 ⇒ k ≤ m 必须成立
  </text>

  <rect x="330" y="52" width="286" height="196" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="473" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">
    k = 3 ≤ m = 3：可行
  </text>

  <rect x="366" y="96" width="48" height="38" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="424" y="96" width="48" height="38" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="482" y="96" width="48" height="38" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>

  <text x="390" y="121" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="448" y="121" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="506" y="121" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <text x="473" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    每个窗口内互不相同 ✓
  </text>
  <text x="473" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    让序列以 k 为周期循环即满足
  </text>
  <text x="473" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    pi = i mod k（只要 k ≤ m）
  </text>
  <text x="473" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    最小相等距离恰为 k ✓
  </text>

  <text x="320" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    n = 6, k = 4, m = 3 就卡在这里：只有 3 个余数，却要求 4 个互不相同 → 无解
  </text>
</svg>
