<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="27" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">伤害模型：拆掉 (i, j) 只伤到第 1..i 层，倒塌只有两条路</text>

  <!-- 4 层网格 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="11">
    <text x="88" y="92" fill="#666" text-anchor="end">第 1 层</text>
    <text x="88" y="128" fill="#666" text-anchor="end">第 2 层</text>
    <text x="88" y="164" fill="#666" text-anchor="end">第 3 层 i</text>
    <text x="88" y="200" fill="#666" text-anchor="end">第 4 层</text>
  </g>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="100" y="74" width="198" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="100" y="110" width="198" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="100" y="146" width="66" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="166" y="146" width="66" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="232" y="146" width="66" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="100" y="182" width="198" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>

    <text x="149" y="97" fill="#3a4a66">2</text>
    <text x="215" y="97" fill="#3a4a66">2</text>
    <text x="281" y="97" fill="#3a4a66">2</text>
    <text x="149" y="133" fill="#3a4a66">5</text>
    <text x="215" y="133" fill="#3a4a66">5</text>
    <text x="281" y="133" fill="#3a4a66">5</text>
    <text x="133" y="169" fill="#3a4a66">1</text>
    <text x="199" y="169" fill="#8a3a3a" font-weight="bold">拆</text>
    <text x="265" y="169" fill="#3a4a66">1</text>
    <text x="199" y="205" fill="#3a5a30">不受影响</text>
  </g>

  <!-- 伤害上传箭头 -->
  <path d="M 312 164 L 312 92" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="112" font-size="11" fill="#8a3a3a" filter="url(#rough2)">伤害只往上</text>
  <text x="322" y="128" font-size="11" fill="#8a3a3a" filter="url(#rough2)">（k ≤ i）</text>
  <text x="322" y="158" font-size="10.5" fill="#888" filter="url(#rough2)">向下的层</text>
  <text x="322" y="173" font-size="10.5" fill="#888" filter="url(#rough2)">一点不掉</text>

  <text x="199" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 i 行以下的层：完全不受影响</text>

  <!-- 右栏三条结论 -->
  <g filter="url(#rough2)">
    <rect x="400" y="62" width="234" height="98" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9"/>
    <text x="517" y="82" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">第 k 层收到的总伤害</text>
    <text x="517" y="104" text-anchor="middle" font-size="13" fill="#3a4a66">D_k = Σ a(i,j)</text>
    <text x="517" y="124" text-anchor="middle" font-size="10.5" fill="#7a8aa6">求和范围：被拆掉、且行号 i ≥ k 的格子</text>
    <text x="517" y="144" text-anchor="middle" font-size="10.5" fill="#7a8aa6">于是 D_1 ≥ D_2 ≥ … ≥ D_n</text>

    <rect x="400" y="174" width="234" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9"/>
    <text x="517" y="195" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">条件 ①（稳定度归零）</text>
    <text x="517" y="216" text-anchor="middle" font-size="12" fill="#8a6a20">∃ k：D_k ≥ v_k</text>
    <text x="517" y="236" text-anchor="middle" font-size="10.5" fill="#a08030">v_k 是第 k 层的初始稳定度</text>

    <rect x="400" y="260" width="234" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9"/>
    <text x="517" y="281" text-anchor="middle" font-size="11.5" fill="#8a3a3a" font-weight="bold">条件 ②（某层被拆空）</text>
    <text x="517" y="302" text-anchor="middle" font-size="12" fill="#8a3a3a">某一行 m 个格子全拆</text>
    <text x="517" y="322" text-anchor="middle" font-size="10.5" fill="#b07a7a">所以答案天然 ≤ m</text>
  </g>

  <text x="330" y="368" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">答案 = min( m , min_k g(k) )，其中 g(k) = 让 D_k ≥ v_k 的最少拆除数</text>
  <text x="330" y="390" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">对固定的 k，只有第 k..n 行的格子能贡献伤害，第 1..k−1 行的格子纯属浪费</text>
</svg>
