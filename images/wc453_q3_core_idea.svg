<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：合法左端点连成一段，左指针只前进</text>

  <!-- 数组行 -->
  <rect x="96" y="56" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="158" y="56" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="220" y="56" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="282" y="56" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="344" y="56" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <text x="122" y="104" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="184" y="104" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="246" y="104" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="308" y="104" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="370" y="104" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>

  <!-- 窗口上方括号 -->
  <path d="M 156 50 Q 158 38 170 37 L 318 37 Q 330 38 332 50" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="342" y="45" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j ∈ [L, i] 全部合法</text>

  <!-- L 与 i 指针 -->
  <path d="M 184 120 L 184 100" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="134" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">L</text>
  <text x="184" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">合法左端点下限</text>

  <path d="M 308 120 L 308 100" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="321" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="308" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">当前右端点</text>

  <!-- 左：转移公式 -->
  <rect x="40" y="162" width="310" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="184" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">DP 转移 = 一段连续区间和</text>
  <text x="195" y="206" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">f[i+1] = Σ f[L…i] = S[i] − S[L−1]</text>

  <!-- 左：为什么连续 -->
  <rect x="40" y="236" width="310" height="84" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="52" y="256" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么合法的 j 连成一段？</text>
  <text x="52" y="275" font-size="10.5" fill="#333" filter="url(#rough2)">j 变大 ⇒ [j, i] 是更短的子区间</text>
  <text x="52" y="293" font-size="10.5" fill="#333" filter="url(#rough2)">max 不增、min 不减 ⇒ 极差不增</text>
  <text x="52" y="311" font-size="10.5" fill="#b85450" filter="url(#rough2)">⇒ 一旦非法，更左全非法；合法段连续</text>

  <!-- 右：单调队列 -->
  <rect x="384" y="162" width="152" height="158" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="460" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">单调队列 O(1) 最值</text>

  <text x="460" y="203" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">maxQ（递减）</text>
  <rect x="408" y="210" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="478" y="210" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <text x="460" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">minQ（递增）</text>
  <rect x="408" y="258" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="478" y="258" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="460" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">极差 = 4 − 1 = 3 ≤ k</text>
  <text x="460" y="314" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">队首即窗口 max / min</text>

  <!-- 底部总结 -->
  <rect x="40" y="336" width="496" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="288" y="356" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">L 随 i 单调不减 ⇒ 双指针不回退；单元素极差 0 ≤ k ⇒ 窗口永不缩空（f 恒 ≥ 1）</text>
  <text x="288" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">滑动窗口 + 前缀和区间和 ⇒ 总复杂度 O(n)</text>
</svg>
