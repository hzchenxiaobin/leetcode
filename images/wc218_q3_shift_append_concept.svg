<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：拼接 = 左移腾位 + 加数</text>
  <text x="280" y="56" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">示例 2 收尾的一步：串 "110"（值 6）后面拼接 i = 3（串 "11"，L = 2 位）</text>

  <!-- 行 A：两个待拼接的串 -->
  <text x="280" y="70" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">拼接</text>
  <rect x="96" y="76" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="76" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="180" y="76" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="280" y="98" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">＋</text>
  <rect x="380" y="76" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="398" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="422" y="76" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="156" y="124" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">ans = 串 "110" = 6</text>
  <text x="419" y="124" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">i = 串 "11" = 3</text>

  <path d="M 280,134 L 280,152" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="148" font-size="10" fill="#999" filter="url(#rough2)">数值上等价于什么？</text>

  <!-- 行 B：左移腾位 -->
  <rect x="96" y="158" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="158" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="180" y="158" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="222" y="158" width="36" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="240" y="179" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空</text>
  <rect x="264" y="158" width="36" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="282" y="179" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空</text>
  <text x="330" y="172" font-size="11" fill="#333" filter="url(#rough2)">6 × 2² = 24</text>
  <text x="330" y="190" font-size="10" fill="#d6a040" filter="url(#rough2)">左移 L 位，腾出的低位先空着</text>

  <path d="M 280,196 L 280,218" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="212" font-size="10" fill="#999" filter="url(#rough2)">把 i 放进空位</text>

  <!-- 行 C：填入 i -->
  <rect x="96" y="224" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="224" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="180" y="224" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="222" y="224" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="264" y="224" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="282" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="330" y="238" font-size="11" fill="#333" filter="url(#rough2)">24 + 3 = 27</text>
  <text x="330" y="256" font-size="10.5" fill="#d6a040" filter="url(#rough2)">串 "11011" = 27 ✓（正是示例 2）</text>

  <!-- 转移式 -->
  <rect x="90" y="290" width="380" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">通用转移式：ans ← ans × 2^L + i（L = i 的二进制位数）</text>
  <text x="280" y="328" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">i &lt; 2^L，加法不产生进位——等价于「移位腾位 + 按位或」</text>

  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">只维护数值（其余数），串永远不必真的存在——每步 O(1)</text>
  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">C++ 没有大数类型，这个「数值化」正是唯一可行的路径</text>
</svg>
