<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：所有元素都是 2 的幂 → 按层级记账，低位优先「借位」</text>
  <path d="M 250 46 Q 470 56 690 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: level shelves ===== -->
  <text x="230" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 层级货架：cnt[b] = 值为 2^b 的元素个数（示例 nums = [1, 32, 1, 2]）</text>
  <g font-size="12">
    <!-- shelf lines, level 5..0 -->
    <g filter="url(#sk)"><path d="M 60 118 Q 330 122 600 118" stroke="#8aa" stroke-width="1.6" fill="none"/></g>
    <g filter="url(#sk)"><path d="M 60 158 Q 330 162 600 158" stroke="#bb9" stroke-width="1.2" stroke-dasharray="6 4" fill="none"/></g>
    <g filter="url(#sk)"><path d="M 60 198 Q 330 202 600 198" stroke="#bb9" stroke-width="1.2" stroke-dasharray="6 4" fill="none"/></g>
    <g filter="url(#sk)"><path d="M 60 238 Q 330 242 600 238" stroke="#bb9" stroke-width="1.2" stroke-dasharray="6 4" fill="none"/></g>
    <g filter="url(#sk)"><path d="M 60 278 Q 330 282 600 278" stroke="#8aa" stroke-width="1.6" fill="none"/></g>
    <g filter="url(#sk)"><path d="M 60 318 Q 330 322 600 318" stroke="#8aa" stroke-width="1.6" fill="none"/></g>
    <g fill="#777" text-anchor="end">
      <text x="52" y="122">层5</text>
      <text x="52" y="162">层4</text>
      <text x="52" y="202">层3</text>
      <text x="52" y="242">层2</text>
      <text x="52" y="282">层1</text>
      <text x="52" y="322">层0</text>
    </g>
    <!-- piece on shelf level5: 32 -->
    <g filter="url(#sk)"><rect x="150" y="96" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
    <text x="178" y="113" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">32</text>
    <text x="220" y="113" font-size="11" fill="#446688" font-family="monospace">cnt[5] = 1</text>
    <g fill="#bbb" text-anchor="start">
      <text x="390" y="157" font-size="11" font-family="monospace">cnt[4] = 0</text>
      <text x="390" y="197" font-size="11" font-family="monospace">cnt[3] = 0</text>
      <text x="390" y="237" font-size="11" font-family="monospace">cnt[2] = 0</text>
    </g>
    <!-- pieces level1 -->
    <g filter="url(#sk)"><rect x="150" y="256" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
    <text x="171" y="273" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">2</text>
    <text x="220" y="273" font-size="11" fill="#446688" font-family="monospace">cnt[1] = 1</text>
    <!-- pieces level0 -->
    <g filter="url(#sk)"><rect x="150" y="296" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
    <text x="167" y="313" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="188" y="296" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
    <text x="205" y="313" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">1</text>
    <text x="240" y="313" font-size="11" fill="#446688" font-family="monospace">cnt[0] = 2</text>
    <text x="180" y="344" text-anchor="middle" font-size="10.5" fill="#888">空层画成虚线：这一位「没有现成片」</text>
  </g>

  <!-- ===== Panel 2: target bits ===== -->
  <g filter="url(#sk)">
    <rect x="650" y="88" width="248" height="234" rx="10" fill="#fff" stroke="#aaa" stroke-width="1.3"/>
  </g>
  <text x="774" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 需求：target = 12 = 1100₂</text>
  <g font-size="11.5">
    <!-- bit boxes level3..0: 8 4 2 1 -> 1 1 0 0 -->
    <g filter="url(#sk)"><rect x="678" y="132" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/></g>
    <text x="700" y="154" text-anchor="middle" font-weight="bold" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="726" y="132" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/></g>
    <text x="748" y="154" text-anchor="middle" font-weight="bold" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="774" y="132" width="44" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4"/></g>
    <text x="796" y="154" text-anchor="middle" fill="#999">0</text>
    <g filter="url(#sk)"><rect x="822" y="132" width="44" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4"/></g>
    <text x="844" y="154" text-anchor="middle" fill="#999">0</text>
    <g fill="#888" text-anchor="middle">
      <text x="700" y="180">层3(8)</text>
      <text x="748" y="180">层2(4)</text>
      <text x="796" y="180">层1(2)</text>
      <text x="844" y="180">层0(1)</text>
    </g>
  </g>
  <text x="774" y="212" text-anchor="middle" font-size="11" fill="#444">置位的位 = 需要凑出的「槽位」</text>
  <text x="774" y="232" text-anchor="middle" font-size="11" fill="#444">每个槽位恰是一片 2^b：</text>
  <text x="774" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">要么白嫖现成片，要么从高层拆</text>
  <text x="774" y="280" text-anchor="middle" font-size="10.5" fill="#888">判定 -1：Σnums &lt; target ⟺ 不可行</text>
  <text x="774" y="300" text-anchor="middle" font-size="10.5" fill="#888">（拆分不改变总和，子序列和 ≤ 总和）</text>

  <!-- ===== Panel 3: chain split ===== -->
  <text x="470" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">③ 借位 = 链式拆分：从 2^j 拆出 2^b 只花 j − b 次，副产物每层白送一片</text>
  <!-- chain: 32 -> 16 + 16 -> 8 + 8 -->
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="120" y="412" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/></g>
    <text x="146" y="430" text-anchor="middle" fill="#2b4a6e" font-weight="bold">32</text>
    <text x="186" y="428" font-size="10.5" fill="#888">层5</text>

    <path d="M 176 430 Q 210 452 240 470" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <text x="196" y="452" font-size="10.5" fill="#666">拆第1次</text>
    <g filter="url(#sk)"><rect x="244" y="458" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="270" y="476" text-anchor="middle" fill="#8a6a1a" font-weight="bold">16</text>
    <text x="306" y="476" font-size="10.5" fill="#d6a040">副产物入账</text>

    <path d="M 150 438 Q 170 470 190 498" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <text x="146" y="486" font-size="10.5" fill="#666">拆第2次</text>
    <g filter="url(#sk)"><rect x="196" y="490" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/></g>
    <text x="222" y="508" text-anchor="middle" fill="#2e6e2e" font-weight="bold">8</text>
    <text x="258" y="508" font-size="10.5" fill="#4a7a3a">拿去填层3的槽位</text>
    <g filter="url(#sk)"><rect x="196" y="528" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="222" y="546" text-anchor="middle" fill="#8a6a1a" font-weight="bold">8</text>
    <text x="258" y="546" font-size="10.5" fill="#d6a040">副产物入账</text>
  </g>
  <g filter="url(#sk)">
    <rect x="420" y="412" width="460" height="140" rx="10" fill="#f3ecf7" stroke="#7a5a9a" stroke-width="1.3"/>
  </g>
  <text x="650" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">代价 = 层级差 j − b（每拆一次只降一层）</text>
  <text x="650" y="466" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">例：从层5的 32 借给层3 → 花 5 − 3 = 2 次</text>
  <text x="650" y="494" text-anchor="middle" font-size="11.5" fill="#444">沿途每层各留下一片副产物（16、8）</text>
  <text x="650" y="520" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">副产物回账本，之后还能被更高位白嫖</text>
  <text x="650" y="544" text-anchor="middle" font-size="10.5" fill="#888">（关键：只沿「一条链」往下拆，绝不整棵拆光）</text>

  <!-- ===== Panel 4: free pairing ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="576" width="820" height="66" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="470" y="600" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">④ 免费配对（虚拟进位）：两片同级剩余 2^b 无偿顶替一片 2^(b+1)</text>
  <text x="470" y="624" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">示例：剩下的 1+1 配成「虚拟 2」，再与真 2 配成「虚拟 4」→ 层2 的槽位白嫖成功，0 次操作</text>
</svg>
