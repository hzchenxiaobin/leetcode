<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：每格的值 = 覆盖它的操作条数</text>
  <text x="330" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">m = n = 4，ops = [[4,4], [3,3], [2,2]]，三张「左上角子矩阵」层层嵌套</text>
  <g filter="url(#rough2)">
    <rect x="96" y="92" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="136" y="92" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="176" y="92" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="216" y="92" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="96" y="132" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="136" y="132" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="176" y="132" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="216" y="132" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="96" y="172" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="136" y="172" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="176" y="172" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="216" y="172" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="96" y="212" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="136" y="212" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="176" y="212" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="216" y="212" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g filter="url(#rough2)">
    <text x="116.0" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">3</text>
    <text x="156.0" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">3</text>
    <text x="196.0" y="118" text-anchor="middle" font-size="16" fill="#555">2</text>
    <text x="236.0" y="118" text-anchor="middle" font-size="16" fill="#555">1</text>
    <text x="116.0" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">3</text>
    <text x="156.0" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">3</text>
    <text x="196.0" y="158" text-anchor="middle" font-size="16" fill="#555">2</text>
    <text x="236.0" y="158" text-anchor="middle" font-size="16" fill="#555">1</text>
    <text x="116.0" y="198" text-anchor="middle" font-size="16" fill="#555">2</text>
    <text x="156.0" y="198" text-anchor="middle" font-size="16" fill="#555">2</text>
    <text x="196.0" y="198" text-anchor="middle" font-size="16" fill="#555">2</text>
    <text x="236.0" y="198" text-anchor="middle" font-size="16" fill="#555">1</text>
    <text x="116.0" y="238" text-anchor="middle" font-size="16" fill="#555">1</text>
    <text x="156.0" y="238" text-anchor="middle" font-size="16" fill="#555">1</text>
    <text x="196.0" y="238" text-anchor="middle" font-size="16" fill="#555">1</text>
    <text x="236.0" y="238" text-anchor="middle" font-size="16" fill="#555">1</text>
  </g>
  <rect x="91" y="87" width="90" height="90" rx="4" fill="none" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="92" y="80" font-size="10.5" fill="#b85450" filter="url(#rough2)">交集 2×2</text>
  <text x="246" y="78" font-size="10.5" fill="#666" filter="url(#rough2)">→ b（列）</text>
  <text x="66" y="242" font-size="10.5" fill="#666" filter="url(#rough2)">↓ a</text>
  <text x="176" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">最大值 3，共出现 4 次</text>
  <rect x="300" y="93" width="13" height="13" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="322" y="104" font-size="10.5" fill="#333" filter="url(#rough2)">3 条操作全盖住 → 值 3（最大）</text>
  <rect x="300" y="123" width="13" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="322" y="134" font-size="10.5" fill="#333" filter="url(#rough2)">2 条覆盖 → 值 2</text>
  <rect x="300" y="153" width="13" height="13" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="322" y="164" font-size="10.5" fill="#333" filter="url(#rough2)">1 条覆盖 → 值 1</text>
  <rect x="292" y="192" width="334" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="308" y="216" font-size="11.5" fill="#2f5a24" filter="url(#rough2)">min a = 2，min b = 2</text>
  <text x="308" y="240" font-size="13" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">答案 = 2 × 2 = 4</text>
  <text x="308" y="258" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">与 op 的条数、顺序、其余取值都无关</text>
  <text x="292" y="308" font-size="10" fill="#666" filter="url(#rough2)">· 一个格子被所有操作覆盖的充要条件是 x &lt; min a 且 y &lt; min b</text>
  <text x="292" y="328" font-size="10" fill="#666" filter="url(#rough2)">· 满足它的格子恰好是左上角 A×B 的矩形，共 A·B 个</text>
  <text x="292" y="348" font-size="10" fill="#b85450" filter="url(#rough2)">· 不需要真的把 m×n 的矩阵建出来（最大 1.6e9 格！）</text>
</svg>
