<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">八方向判定：连续异色 ≥ 1 后遇到同色端点即合法</text>

  <!-- 选中格与 8 条射线 -->
  <g filter="url(#rough2)">
    <rect x="240" y="160" width="80" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6"/>
  </g>
  <text x="280" y="206" text-anchor="middle" font-size="15" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">落子</text>

  <!-- 8 条射线（从中心向外） -->
  <g stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M 280 156 L 280 96" marker-end="url(#arr)"/>
    <path d="M 284 164 L 340 108" marker-end="url(#arr)"/>
    <path d="M 324 200 L 392 200" marker-end="url(#arr)"/>
    <path d="M 324 216 L 384 262" marker-end="url(#arr)"/>
    <path d="M 280 244 L 280 304" marker-end="url(#arr)"/>
    <path d="M 276 236 L 220 292" marker-end="url(#arr)"/>
    <path d="M 236 200 L 168 200" marker-end="url(#arr)"/>
    <path d="M 236 184 L 178 138" marker-end="url(#arr)"/>
  </g>

  <!-- 射线终点示意（上方向的成功案例） -->
  <g filter="url(#rough2)">
    <rect x="258" y="72" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
  </g>
  <text x="280" y="92" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">己方</text>

  <g filter="url(#rough2)">
    <rect x="260" y="112" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5"/>
    <rect x="260" y="116" width="40" height="0" fill="none"/>
  </g>
  <text x="300" y="130" font-size="11" fill="#b85450" filter="url(#rough2)">连续异色 ×≥1</text>

  <!-- 说明框：判定规则 -->
  <rect x="40" y="316" width="230" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="155" y="337" text-anchor="middle" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">成功方向：异色串（≥1）+ 己方收尾</text>
  <text x="155" y="356" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">线段长 = 异色数 + 2 ≥ 3 ✓</text>

  <rect x="290" y="316" width="230" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="337" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">失败：首格己方（长度 2）/ 空格 / 越界</text>
  <text x="405" y="356" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">cnt = 0 或中途断链 → 该方向放弃</text>

  <!-- 右侧补充 -->
  <text x="470" y="120" font-size="11" fill="#888" filter="url(#rough2)">8 方向 =</text>
  <text x="470" y="136" font-size="11" fill="#888" filter="url(#rough2)">水平 ±、竖直 ±、</text>
  <text x="470" y="152" font-size="11" fill="#888" filter="url(#rough2)">两条对角线 ±</text>
  <text x="470" y="176" font-size="11" fill="#888" filter="url(#rough2)">每方向 ≤ 7 步</text>
  <text x="470" y="192" font-size="11" fill="#888" filter="url(#rough2)">总计 O(1)</text>
</svg>
