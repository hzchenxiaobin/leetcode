<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：最优圆心可由两枚飞镖确定</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">半径固定为 r，过 A、B 的圆心都落在中垂线上，至多两个</text>

  <!-- 中垂线 -->
  <line x1="275" y1="66" x2="275" y2="448" stroke="#999" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 两个候选圆 -->
  <circle cx="275" cy="189.5" r="110" fill="#e8f0fe" fill-opacity="0.45" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <circle cx="275" cy="350.5" r="110" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.75" filter="url(#rough2)"/>

  <!-- 直角三角形 M-A-C1 -->
  <line x1="200" y1="270" x2="275" y2="189.5" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="275" y1="270" x2="275" y2="189.5" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="200" y1="270" x2="275" y2="270" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <path d="M 275 270 L 261 270 L 261 256" fill="none" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 点 -->
  <circle cx="200" cy="270" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="350" cy="270" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="275" cy="270" r="3.5" fill="#888" filter="url(#rough2)"/>
  <circle cx="275" cy="189.5" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="275" cy="350.5" r="5" fill="#b85450" filter="url(#rough2)"/>

  <text x="188" y="262" text-anchor="end" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="358" y="262" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="281" y="291" font-size="10" fill="#888" filter="url(#rough2)">M</text>
  <text x="284" y="185" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">C₁</text>
  <text x="284" y="356" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">C₂</text>

  <text x="218" y="222" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="281" y="236" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">h</text>
  <text x="237" y="287" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">d/2</text>

  <!-- 右侧公式框 -->
  <rect x="392" y="110" width="152" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="404" y="132" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">两个候选圆心</text>
  <text x="404" y="154" font-size="10" fill="#555" filter="url(#rough2)">A=(x₁,y₁)，B=(x₂,y₂)</text>
  <text x="404" y="176" font-size="10.5" fill="#555" filter="url(#rough2)">C₁ = M + h · u</text>
  <text x="404" y="196" font-size="10.5" fill="#555" filter="url(#rough2)">C₂ = M − h · u</text>
  <text x="404" y="218" font-size="10.5" fill="#555" filter="url(#rough2)">u = (−Δy, Δx) / d</text>
  <text x="404" y="240" font-size="10" fill="#555" filter="url(#rough2)">h = √(r² − (d/2)²)</text>
  <text x="404" y="262" font-size="10" fill="#8a3a36" filter="url(#rough2)">d &gt; 2r 时无解，跳过</text>

  <text x="280" y="486" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">枚举 C(n,2) 个点对、每对至多 2 个圆心，就覆盖了全部候选</text>
</svg>
