<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">为什么 k ≠ 0 一定被困住：四轮的位移互相抵消</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">设一轮位移为 d，则第 t 轮的位移是 d 旋转 t·k·90° 的结果</text>

  <circle cx="200" cy="180" r="6" fill="#333" filter="url(#rough2)"/>
  <text x="186" y="204" font-size="10" fill="#888">起点</text>

  <path d="M 206 180 L 330 180" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="172" font-size="10.5" fill="#4a7a3a">第 1 轮：d</text>

  <path d="M 330 180 L 330 296" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="246" font-size="10.5" fill="#446688">第 2 轮：旋转 90°</text>

  <path d="M 330 296 L 206 296" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="316" font-size="10.5" fill="#8a6a20">第 3 轮：旋转 180°</text>

  <path d="M 206 296 L 206 180" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="246" font-size="10.5" fill="#8a3a36">第 4 轮：旋转 270°</text>

  <rect x="360" y="66" width="176" height="94" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="374" y="86" font-size="11" fill="#3a4a66" font-weight="bold">k = 1 或 3</text>
  <text x="374" y="108" font-size="10" fill="#555">转 90° / 270°</text>
  <text x="374" y="128" font-size="10" fill="#555">4 轮后 d + dR + dR² + dR³ = 0</text>
  <text x="374" y="148" font-size="10" fill="#4a7a3a">回到原点 → 环</text>

  <rect x="360" y="176" width="176" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="374" y="196" font-size="11" fill="#8a6a20" font-weight="bold">k = 2</text>
  <text x="374" y="218" font-size="10" fill="#555">转 180°</text>
  <text x="374" y="238" font-size="10" fill="#555">两轮后 d + (−d) = 0</text>
  <text x="374" y="258" font-size="10" fill="#8a6a20">2 轮回到原点 → 环</text>

  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#999">k = 0 时朝向不变，位移逐轮叠加 → 除非 d = 0，否则一定跑到无穷远</text>
</svg>
