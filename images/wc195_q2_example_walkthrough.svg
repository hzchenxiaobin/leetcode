<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="396" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：同一个数组，k = 5 可分对 · k = 10 不可分对</text>

  <g filter="url(#rough2)">
    <rect x="20" y="44" width="292" height="262" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
    <text x="166" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">示例 1 · k = 5 → true</text>
    <text x="32" y="90" font-size="10.5" fill="#555">arr = [1,2,3,4,5,10,6,7,8,9]</text>
    <text x="32" y="107" font-size="10.5" fill="#446688">mod 5 → 1 2 3 4 0 0 1 2 3 4</text>

    <text x="32" y="129" font-size="10.5" font-weight="bold" fill="#888">r</text>
    <rect x="48" y="114" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="94" y="114" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="140" y="114" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="186" y="114" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="232" y="114" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="69" y="129" text-anchor="middle" font-size="10.5" fill="#2b4a66">0</text>
    <text x="115" y="129" text-anchor="middle" font-size="10.5" fill="#2b4a66">1</text>
    <text x="161" y="129" text-anchor="middle" font-size="10.5" fill="#2b4a66">2</text>
    <text x="207" y="129" text-anchor="middle" font-size="10.5" fill="#2b4a66">3</text>
    <text x="253" y="129" text-anchor="middle" font-size="10.5" fill="#2b4a66">4</text>

    <text x="32" y="151" font-size="10.5" font-weight="bold" fill="#888">cnt</text>
    <rect x="48" y="136" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="94" y="136" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="140" y="136" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="186" y="136" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="232" y="136" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="69" y="151" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">2</text>
    <text x="115" y="151" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">2</text>
    <text x="161" y="151" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">2</text>
    <text x="207" y="151" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">2</text>
    <text x="253" y="151" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">2</text>

    <text x="32" y="182" font-size="11" fill="#3a4a66">cnt[0] = 2 → 偶 ✓</text>
    <text x="32" y="200" font-size="11" fill="#3a4a66">cnt[1] = cnt[4] = 2 ✓</text>
    <text x="32" y="218" font-size="11" fill="#3a4a66">cnt[2] = cnt[3] = 2 ✓</text>

    <rect x="36" y="234" width="260" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="166" y="254" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a3a">三类条件全过</text>
    <text x="166" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a3a">→ true ✓ 恰好分成 5 对</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="328" y="44" width="292" height="262" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
    <text x="474" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">示例 3 · k = 10 → false</text>
    <text x="340" y="90" font-size="10.5" fill="#555">arr = [1,2,3,4,5,6]</text>
    <text x="340" y="107" font-size="10.5" fill="#446688">mod 10 → 1 2 3 4 5 6</text>

    <text x="340" y="129" font-size="10.5" font-weight="bold" fill="#888">r</text>
    <rect x="356" y="114" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="402" y="114" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="448" y="114" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="494" y="114" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="540" y="114" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="377" y="129" text-anchor="middle" font-size="10.5" fill="#2b4a66">0</text>
    <text x="423" y="129" text-anchor="middle" font-size="10.5" fill="#2b4a66">1</text>
    <text x="469" y="129" text-anchor="middle" font-size="10.5" fill="#2b4a66">2</text>
    <text x="515" y="129" text-anchor="middle" font-size="10.5" fill="#2b4a66">3</text>
    <text x="561" y="129" text-anchor="middle" font-size="10.5" fill="#2b4a66">4</text>

    <text x="340" y="151" font-size="10.5" font-weight="bold" fill="#888">cnt</text>
    <rect x="356" y="136" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="402" y="136" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="448" y="136" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="494" y="136" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="540" y="136" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="377" y="151" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">0</text>
    <text x="423" y="151" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">1</text>
    <text x="469" y="151" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">1</text>
    <text x="515" y="151" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">1</text>
    <text x="561" y="151" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">1</text>

    <text x="340" y="175" font-size="10.5" font-weight="bold" fill="#888">r</text>
    <rect x="356" y="160" width="42" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="402" y="160" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="448" y="160" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="494" y="160" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="540" y="160" width="42" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="377" y="175" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a36">5</text>
    <text x="423" y="175" text-anchor="middle" font-size="10.5" fill="#2b4a66">6</text>
    <text x="469" y="175" text-anchor="middle" font-size="10.5" fill="#2b4a66">7</text>
    <text x="515" y="175" text-anchor="middle" font-size="10.5" fill="#2b4a66">8</text>
    <text x="561" y="175" text-anchor="middle" font-size="10.5" fill="#2b4a66">9</text>

    <text x="340" y="197" font-size="10.5" font-weight="bold" fill="#888">cnt</text>
    <rect x="356" y="182" width="42" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="402" y="182" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="448" y="182" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="494" y="182" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="540" y="182" width="42" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="377" y="197" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a36">1</text>
    <text x="423" y="197" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">1</text>
    <text x="469" y="197" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">0</text>
    <text x="515" y="197" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">0</text>
    <text x="561" y="197" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">0</text>

    <text x="340" y="222" font-size="11" fill="#3a4a66">k = 10 为偶数 → 余 5 = k/2 只能自配</text>
    <text x="340" y="240" font-size="11" font-weight="bold" fill="#b85450">cnt[5] = 1 是奇数 ✗ 卡在第二步！</text>

    <rect x="344" y="252" width="260" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="474" y="270" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36">余 5 类只有数字 5 自己</text>
    <text x="474" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36">→ false ✗ 永远凑不成对</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="20" y="320" width="600" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="36" y="342" font-size="11" fill="#2b4a66">k = 5：余 0 恰有 2 个（偶），余 1↔4、余 2↔3 数量相等 → true</text>
    <text x="36" y="362" font-size="11" fill="#2b4a66">k = 10：余 5（= k/2）只剩 1 个无法自配 → false；k/2 自配特判是最易漏的检查</text>
  </g>
</svg>
