<svg xmlns="http://www.w3.org/2000/svg" width="620" height="560" viewBox="0 0 620 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="69" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="560" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：points = [[1,2,3],[1,5,1],[3,1,1]]，答案 9</text>
  <path d="M 140 40 Q 310 50 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="34" y="78" font-size="12" fill="#2b5d8e" font-weight="bold">r = 0：</text>
  <text x="88" y="78" font-size="11" fill="#888">dp ← points[0]，第 0 行无扣分</text>
  <g filter="url(#sk)">
    <rect x="130" y="84" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="210" y="84" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="290" y="84" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="165" y="106" text-anchor="middle" font-size="13.5" fill="#2b5d8e" font-weight="bold">1</text>
  <text x="245" y="106" text-anchor="middle" font-size="13.5" fill="#2b5d8e" font-weight="bold">2</text>
  <text x="325" y="106" text-anchor="middle" font-size="13.5" fill="#2b5d8e" font-weight="bold">3</text>
  <text x="380" y="106" font-size="11" fill="#888" font-family="monospace">dp₀ = [1, 2, 3]</text>

  <text x="34" y="142" font-size="12" fill="#2b5d8e" font-weight="bold">r = 1：</text>
  <text x="88" y="142" font-size="11" fill="#888">扩散后 g = [1, 2, 3] —— 相邻差恰为 1，传递值处处「追平而不超过」</text>
  <g filter="url(#sk)">
    <rect x="130" y="150" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="210" y="150" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="290" y="150" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="165" y="167" text-anchor="middle" font-size="10.5" fill="#888" font-family="monospace">1+1</text>
  <text x="245" y="167" text-anchor="middle" font-size="10.5" fill="#888" font-family="monospace">5+2</text>
  <text x="325" y="167" text-anchor="middle" font-size="10.5" fill="#888" font-family="monospace">1+3</text>
  <text x="165" y="186" text-anchor="middle" font-size="13.5" fill="#2b5d8e" font-weight="bold">2</text>
  <text x="245" y="186" text-anchor="middle" font-size="13.5" fill="#2b5d8e" font-weight="bold">7</text>
  <text x="325" y="186" text-anchor="middle" font-size="13.5" fill="#2b5d8e" font-weight="bold">4</text>
  <text x="380" y="186" font-size="11" fill="#888" font-family="monospace">dp₁ = [2, 7, 4]</text>

  <text x="34" y="224" font-size="12" fill="#2b5d8e" font-weight="bold">r = 2：</text>
  <text x="88" y="224" font-size="11" fill="#888">扩散后 g = [6, 7, 6] —— 7 向左右各传一步（7−1 = 6 同时改写两端）</text>
  <g filter="url(#sk)">
    <rect x="130" y="232" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="210" y="232" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="290" y="232" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="165" y="249" text-anchor="middle" font-size="10.5" fill="#888" font-family="monospace">3+6</text>
  <text x="245" y="249" text-anchor="middle" font-size="10.5" fill="#888" font-family="monospace">1+7</text>
  <text x="325" y="249" text-anchor="middle" font-size="10.5" fill="#888" font-family="monospace">1+6</text>
  <text x="165" y="268" text-anchor="middle" font-size="13.5" fill="#2f5d2f" font-weight="bold">9</text>
  <text x="245" y="268" text-anchor="middle" font-size="13.5" fill="#2b5d8e" font-weight="bold">8</text>
  <text x="325" y="268" text-anchor="middle" font-size="13.5" fill="#2b5d8e" font-weight="bold">7</text>
  <text x="380" y="278" font-size="11" fill="#888" font-family="monospace">dp₂ = [9, 8, 7]</text>

  <g filter="url(#sk)">
    <rect x="130" y="296" width="260" height="30" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#2f5d2f" font-weight="bold">最终 dp₂ = [9, 8, 7]，max = 9 ✓</text>

  <text x="34" y="352" font-size="12" fill="#b85450" font-weight="bold">最优路径回看：(0,2) → (1,1) → (2,0)</text>

  <g filter="url(#sk)">
    <rect x="180" y="360" width="52" height="30" rx="4" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="240" y="360" width="52" height="30" rx="4" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="300" y="360" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="180" y="394" width="52" height="30" rx="4" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="240" y="394" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="300" y="394" width="52" height="30" rx="4" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="180" y="428" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="240" y="428" width="52" height="30" rx="4" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="300" y="428" width="52" height="30" rx="4" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
  </g>
  <text x="206" y="380" text-anchor="middle" font-size="12" fill="#999">1</text>
  <text x="266" y="380" text-anchor="middle" font-size="12" fill="#999">2</text>
  <text x="326" y="380" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="206" y="414" text-anchor="middle" font-size="12" fill="#999">1</text>
  <text x="266" y="414" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <text x="326" y="414" text-anchor="middle" font-size="12" fill="#999">1</text>
  <text x="206" y="448" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="266" y="448" text-anchor="middle" font-size="12" fill="#999">1</text>
  <text x="326" y="448" text-anchor="middle" font-size="12" fill="#999">1</text>

  <g filter="url(#sk)" fill="none" stroke="#b85450" stroke-width="1.6">
    <path d="M 320 384 Q 300 400 276 402" marker-end="url(#ar)"/>
    <path d="M 256 418 Q 232 432 214 436" marker-end="url(#ar)"/>
  </g>
  <text x="336" y="402" font-size="10.5" fill="#b85450" font-weight="bold" font-family="monospace">|2−1| = 1</text>
  <text x="128" y="428" font-size="10.5" fill="#b85450" font-weight="bold" font-family="monospace">|1−0| = 1</text>

  <text x="400" y="382" font-size="11.5" fill="#555">增分：3 + 5 + 3 = 11</text>
  <text x="400" y="406" font-size="11.5" fill="#555">扣分：1 + 1 = 2</text>
  <text x="400" y="434" font-size="13" fill="#2f5d2f" font-weight="bold">11 − 2 = 9 ✓</text>

  <g filter="url(#sk)">
    <rect x="30" y="478" width="560" height="58" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="310" y="500" text-anchor="middle" font-size="11" fill="#b85450">r=1 轮 g 未变化：dp₀=[1,2,3] 相邻差恰为 1，邻居传来的值处处追平而不超过；</text>
  <text x="310" y="522" text-anchor="middle" font-size="11" fill="#b85450">r=2 轮 dp₁=[2,7,4] 里 7 一家独大，向两侧各传一步（−1）把 2 与 4 都改写成 6 ——见 §3.3 两趟扩散</text>
</svg>
