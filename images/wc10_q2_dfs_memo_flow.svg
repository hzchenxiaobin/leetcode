<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：三个特判 → 按 mask 深搜 → 记忆化回填</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888">同一个 mask 的胜负是唯一的，算过就存，永不算第二遍</text>

  <rect x="130" y="62" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#3a4a66">n = maxChoosableInteger，T = desiredTotal</text>

  <path d="M 280 92 L 280 106" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="110" width="380" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="106" y="129" font-size="10" fill="#8a6a20">① T ≤ 0 → true：目标已达成，先手开局即胜</text>
  <text x="106" y="146" font-size="10" fill="#8a6a20">② n(n+1)/2 &lt; T → false：全部取完也凑不到</text>
  <text x="106" y="163" font-size="10" fill="#8a6a20">③ n ≥ T → true：一手取 T 直接达标</text>

  <path d="M 280 168 L 280 184" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="188" width="460" height="126" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="66" y="209" font-size="10.5" fill="#3a4a66" font-weight="bold">dfs(mask)：used = Σ 所有置位数字之和</text>
  <text x="66" y="229" font-size="10" fill="#555">枚举 i = 1..n 中尚未被取走的数：</text>
  <text x="80" y="248" font-size="10" fill="#4a7a3a">· used + i ≥ T　　　 → 立刻返回 true（本手直接达标）</text>
  <text x="80" y="267" font-size="10" fill="#4a7a3a">· dfs(mask | bit_i) = false → 返回 true（对手必败）</text>
  <text x="80" y="286" font-size="10" fill="#b85450">· 所有手都失败　　　 → 返回 false（本局面必败）</text>
  <text x="66" y="305" font-size="9.5" fill="#7a8aa6">注意：先判「直接达标」，再递归，顺序决定剪枝效率</text>

  <path d="M 280 314 L 280 330" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="334" width="460" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="66" y="354" font-size="10.5" fill="#3a5a30" font-weight="bold">memo[mask] = 胜 / 负（三态：0 未算、1 胜、−1 负）</text>
  <text x="66" y="373" font-size="10" fill="#555">再次进入同一 mask 直接返回；空间 2^n 字节（n=20 约 1 MB）</text>

  <text x="280" y="408" text-anchor="middle" font-size="10.5" fill="#444">最后返回 dfs(∅)：true 表示先手必胜</text>
</svg>
