<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">前缀和同余：和是 k 的倍数 ⟺ 余数相同</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">以 nums = [23, 2, 4, 6, 7]、k = 6 为例，P[t] 表示前 t 个元素之和</text>

  <rect x="34" y="58" width="492" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#8a6a20">sum(a[i..j]) = P[j+1] − P[i]，被 k 整除 ⟺ P[j+1] ≡ P[i] (mod k)</text>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="121" y="108">t = 0</text>
    <text x="191" y="108">t = 1</text>
    <text x="261" y="108">t = 2</text>
    <text x="331" y="108">t = 3</text>
    <text x="401" y="108">t = 4</text>
    <text x="471" y="108">t = 5</text>
  </g>

  <text x="58" y="134" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">P(t)</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="90" y="114" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="160" y="114" width="62" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="230" y="114" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="300" y="114" width="62" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="370" y="114" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="440" y="114" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="121" y="140" fill="#3a4a66">0</text>
    <text x="191" y="140" fill="#8a6a20">23</text>
    <text x="261" y="140" fill="#3a4a66">25</text>
    <text x="331" y="140" fill="#8a6a20">29</text>
    <text x="401" y="140" fill="#3a4a66">35</text>
    <text x="471" y="140" fill="#3a4a66">42</text>
  </g>

  <text x="58" y="184" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">mod 6</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="90" y="164" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="164" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="230" y="164" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="164" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="370" y="164" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="440" y="164" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="121" y="187" fill="#3a4a66">0</text>
    <text x="191" y="187" fill="#3a5a30">5</text>
    <text x="261" y="187" fill="#3a4a66">1</text>
    <text x="331" y="187" fill="#3a5a30">5</text>
    <text x="401" y="187" fill="#3a4a66">5</text>
    <text x="471" y="187" fill="#3a4a66">0</text>
  </g>

  <path d="M 191 202 L 191 216 M 331 202 L 331 216 M 191 216 L 331 216 M 261 216 L 261 236"
        stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="244" width="420" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#3a5a30">P[1] = 23 ≡ 5，P[3] = 29 ≡ 5（mod 6）</text>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#3a5a30">⇒ a[1..2] = 29 − 23 = 6 = 1 × 6，长度 2 ≥ 2 ✓</text>

  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#999">抽屉原理：k 种余数、n + 1 个前缀和，n + 1 &gt; k 时必有同余，但还必须检查下标差 ≥ 2</text>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#999">同一余数只保留「最早」出现的下标：后到的下标与之配对，得到的子数组最长，最不容易漏判</text>
</svg>
