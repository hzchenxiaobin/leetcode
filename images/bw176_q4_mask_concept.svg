<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="310" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">可重排成回文 ⟺ 出现奇数次的字符 ≤ 1 个</text>

  <circle cx="100" cy="90" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="96" text-anchor="middle" font-size="12">a</text>
  <circle cx="180" cy="90" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="96" text-anchor="middle" font-size="12">a</text>
  <circle cx="260" cy="90" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="12">c</text>
  <path d="M120,90 L160,90" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M200,90 L240,90" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="130" text-anchor="middle" font-size="11" fill="#666">路径上的字符序列 "aac"</text>

  <rect x="330" y="62" width="190" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="344" y="84" font-size="11" fill="#333">计数：a→2, c→1</text>
  <text x="344" y="104" font-size="11" fill="#4a7a3a">奇偶：a=0, c=1</text>
  <text x="344" y="122" font-size="11" fill="#4a7a3a">popcount = 1 ≤ 1 → 回文</text>

  <rect x="60" y="156" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="180" font-size="11" fill="#333">掩码：每个节点贡献 1 &lt;&lt; (c − 'a')，路径掩码 = 全部异或（= 逐位模 2 相加）</text>
  <text x="76" y="194" font-size="10" fill="#666">'a' → 0b001，'c' → 0b100；aac 的掩码 = 001 ^ 001 ^ 100 = 100</text>

  <rect x="60" y="216" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="241" font-size="11" fill="#333">判定：popcount(掩码) ≤ 1。掩码 100 只有 1 位 → true</text>

  <rect x="60" y="268" width="440" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="290" font-size="11" fill="#333">"abc" 的掩码 = 111，popcount 3 → 无法排成回文</text>
</svg>
