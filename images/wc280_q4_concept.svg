<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：每篮至多 2 个数 → 占用情况天然是一位三进制</text>
  <path d="M 90 38 Q 320 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">numSlots = 3，已按序放入 [1,2,3,4]（演算第 4 步）：占用 (d₁,d₂,d₃) = (2,1,1)，下一个待放 nums[4] = 5</text>

  <!-- basket 1: two numbers -->
  <rect x="36" y="84" width="170" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="106" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">篮 1</text>
  <text x="50" y="142" font-size="10" fill="#888" filter="url(#rough2)">容量 2</text>
  <circle cx="105" cy="128" r="16" fill="#446688" stroke="#2b4a66" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="133" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="150" cy="128" r="16" fill="#446688" stroke="#2b4a66" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="133" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- basket 2: one number -->
  <rect x="36" y="168" width="170" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="190" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">篮 2</text>
  <text x="50" y="226" font-size="10" fill="#888" filter="url(#rough2)">容量 2</text>
  <circle cx="105" cy="212" r="16" fill="#446688" stroke="#2b4a66" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="217" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="150" cy="212" r="16" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- basket 3: empty -->
  <rect x="36" y="252" width="170" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="274" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">篮 3</text>
  <text x="50" y="310" font-size="10" fill="#888" filter="url(#rough2)">容量 2</text>
  <circle cx="105" cy="296" r="16" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <circle cx="150" cy="296" r="16" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- arrows to ternary digits -->
  <path d="M 208 119 L 246 119" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 208 203 L 246 203" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 208 287 L 246 287" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ternary digit boxes -->
  <rect x="252" y="97" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="278" y="126" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="252" y="181" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="278" y="210" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="252" y="265" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="278" y="294" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="318" y="124" font-size="12" fill="#888" filter="url(#rough2)">× 3⁰</text>
  <text x="318" y="208" font-size="12" fill="#888" filter="url(#rough2)">× 3¹</text>
  <text x="318" y="292" font-size="12" fill="#888" filter="url(#rough2)">× 3²</text>
  <text x="278" y="330" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每位取 0 / 1 / 2</text>

  <!-- state count comparison box -->
  <rect x="430" y="84" width="180" height="130" rx="10" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="108" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">状态总数对比</text>
  <text x="520" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">三进制编码：3^S 个状态</text>
  <text x="520" y="150" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">S = 9 时仅 19 683</text>
  <text x="520" y="174" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">二进制拆 2 槽：2^2S 个</text>
  <text x="520" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2¹⁸ = 262 144</text>
  <text x="520" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">≈ 13 倍差距</text>

  <!-- markov note box -->
  <rect x="430" y="228" width="180" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="250" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">状态是充分统计量</text>
  <text x="520" y="270" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">只记每篮个数，不记谁在哪</text>
  <text x="520" y="288" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">cnt(s) 定下一个待放数</text>
  <text x="520" y="306" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">空位集合定后续选择</text>

  <!-- bottom formula box -->
  <rect x="30" y="344" width="580" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="368" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">s = 2×3⁰ + 1×3¹ + 1×3² = 14（三进制写法 112₃）</text>
  <text x="320" y="392" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[s] = 以占用 s 结束、已放完前 cnt(s) 个数的最大与和；cnt(s) = 三进制数位和</text>
  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">例如上图：cnt = 2+1+1 = 4 个数已放，下一个必放 nums[4] = 5</text>
</svg>
