<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">大根堆流程：弹顶 → 减半 → 回推 → 累计</text>

  <!-- 步骤 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="56" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
  </g>
  <text x="115" y="81" font-size="13" fill="#33465e" filter="url(#rough2)" text-anchor="middle">1. 全部入堆，求 sum</text>

  <g filter="url(#rough2)">
    <path d="M 190 76 C 206 76, 212 76, 224 76" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- 循环判断 -->
  <g filter="url(#rough2)">
    <rect x="228" y="52" width="180" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#5a4a20" text-anchor="middle">
    <text x="318" y="72">2. reduced &lt; sum / 2 ?</text>
    <text x="318" y="90">（严格小于才继续）</text>
  </g>

  <!-- 循环体 -->
  <g filter="url(#rough2)">
    <path d="M 318 100 C 318 116, 240 116, 210 130" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="290" y="118" font-size="12.5" fill="#446688" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="60" y="134" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="135" y="159" font-size="13" fill="#6a3a36" filter="url(#rough2)" text-anchor="middle">3. 弹出堆顶 M</text>

  <g filter="url(#rough2)">
    <path d="M 135 174 C 135 188, 135 192, 135 202" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="204" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="135" y="229" font-size="13" fill="#6a3a36" filter="url(#rough2)" text-anchor="middle">4. M ← M / 2，压回堆</text>

  <g filter="url(#rough2)">
    <path d="M 210 224 C 240 224, 260 224, 276 224" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="280" y="204" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="395" y="222" font-size="13" fill="#2a4a22" filter="url(#rough2)" text-anchor="middle">5. reduced += M / 2；ans += 1</text>
  <text x="395" y="238" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">回到第 2 步继续判断</text>

  <!-- 出口 -->
  <g filter="url(#rough2)">
    <path d="M 408 100 C 420 120, 448 136, 462 148" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="440" y="124" font-size="12.5" fill="#446688" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="440" y="150" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="490" y="175" font-size="13.5" fill="#2a4a22" filter="url(#rough2)" text-anchor="middle">返回 ans</text>

  <text x="280" y="286" font-size="13" fill="#999" filter="url(#rough2)" text-anchor="middle">每步 O(log n)：弹顶与回推各一次堆调整</text>
  <text x="280" y="306" font-size="12.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">浮点提示：减半在二进制下精确，和 ≤ 10^12 仍在 double 整数精度内</text>
</svg>
