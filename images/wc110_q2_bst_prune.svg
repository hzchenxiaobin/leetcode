<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="540" height="360" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">BST 范围求和：只往可能落在 [low, high] 的子树走</text>
  <path d="M 270 78 L 150 158" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 270 78 L 390 158" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 150 158 L 92 238" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 150 158 L 208 238" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 390 158 L 452 238" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 390 158 L 390 300" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="270" cy="78" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <circle cx="150" cy="158" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="390" cy="158" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">15</text>
  <circle cx="92" cy="238" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="243" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="208" cy="238" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="208" y="243" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <circle cx="452" cy="238" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="452" y="243" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">18</text>
  <circle cx="390" cy="300" r="22" fill="#f0f0f0" stroke="#888888" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="305" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">13</text>
  <rect x="20" y="264" width="240" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="286" text-anchor="middle" font-size="12.5" fill="#a9761f" font-weight="bold" filter="url(#rough2)">low = 7, high = 15</text>
  <text x="140" y="308" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">绿=计入；红=val<low；橙=val>high</text>
  <text x="500" y="60" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">val < low</text>
  <text x="500" y="78" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">→ 只走右子树</text>
  <path d="M 474 92 L 300 84" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="500" y="152" text-anchor="middle" font-size="12" fill="#a9761f" font-weight="bold" filter="url(#rough2)">val > high</text>
  <text x="500" y="170" text-anchor="middle" font-size="11.5" fill="#a9761f" filter="url(#rough2)">→ 只走左子树</text>
  <path d="M 474 184 L 414 176" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 10 + 15 + 7 = 32</text>
</svg>
