<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">第一步：用差分数组标记「已有灯泡」的可见区间</text>
  <rect x="60" y="92" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="83.0" y="118.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="110" y="92" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133.0" y="118.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="92" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183.0" y="118.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="210" y="92" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233.0" y="118.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="260" y="92" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283.0" y="118.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="310" y="92" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333.0" y="118.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="360" y="92" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="383.0" y="118.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="410" y="92" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="433.0" y="118.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="233.0" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">灯泡@3, v=2</text>
  <path d="M108,70 358,70" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="233.0" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">照亮 [1,5]</text>
  <text x="42" y="196" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">diff</text>
  <text x="133.0" y="196" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="383.0" y="196" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="50" y="232" width="420" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="250" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">差分技巧</text>
  <text x="62" y="266" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">前缀和 cur 累加 diff，cur > 0 的位置即可见；</text>
  <text x="62" y="281" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">示例：可见 = {1,2,3,4,5}，不可见 = {0,6,7}</text>
  <text x="62" y="296" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">一次 O(n) 扫描完成，避免每盏灯暴力涂色 O(n²)。</text>
</svg>
