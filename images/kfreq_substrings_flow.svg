<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="630" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：固定右端点的计数滑窗</text>
  <path d="M 200 44 Q 380 52 560 44" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="90" y="70" width="320" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="250" y="100" text-anchor="middle" font-size="13" fill="#2b4a6e">初始化：freq[26] = 0，over = 0，lo = 0，ans = 0</text>
  </g>
  <path d="M 250 120 L 250 144" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for r -->
  <g filter="url(#rough2)">
    <rect x="90" y="148" width="320" height="44" rx="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="250" y="175" text-anchor="middle" font-size="13" fill="#2b4a6e">for r = 0 … n−1（枚举右端点）</text>
  </g>
  <path d="M 250 192 L 250 214" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- push in -->
  <g filter="url(#rough2)">
    <rect x="90" y="218" width="320" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="250" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">s[r] 入窗</text>
    <text x="250" y="260" text-anchor="middle" font-size="12" fill="#2b4a6e">++freq[c]；若恰达 k ⇒ over++</text>
  </g>
  <path d="M 250 274 L 250 308" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <g filter="url(#rough2)">
    <polygon points="250,314 420,356 250,398 80,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6215">over &gt; 0 ？</text>
    <text x="250" y="370" text-anchor="middle" font-size="10.5" fill="#8a6215">（窗口含达标字符）</text>
  </g>

  <!-- yes branch: shrink -->
  <path d="M 420 356 L 496 356" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a46" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="500" y="326" width="235" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="617" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3b37">移出 s[lo]</text>
    <text x="617" y="370" text-anchor="middle" font-size="11.5" fill="#8e3b37">freq 恰为 k ⇒ over−−；lo++</text>
  </g>
  <path d="M 690 326 C 690 286 520 278 352 339" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="556" y="292" font-size="11" fill="#a04a46" filter="url(#rough2)">重判 over</text>

  <!-- no branch -->
  <path d="M 250 398 L 250 436" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="422" font-size="12" font-weight="bold" fill="#3a6e3a" filter="url(#rough2)">否</text>

  <!-- count -->
  <g filter="url(#rough2)">
    <rect x="90" y="440" width="320" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="250" y="464" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">ans += lo</text>
    <text x="250" y="484" text-anchor="middle" font-size="11.5" fill="#2e6e2e">起点 ∈ [0, lo−1]、终点为 r 的子串全部合法</text>
  </g>

  <!-- next r loop back -->
  <path d="M 410 473 L 748 473 L 748 170 L 416 170" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="6 5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="700" y="466" font-size="11" fill="#446688" filter="url(#rough2)">下一个 r</text>

  <!-- exit -->
  <path d="M 250 506 L 250 528" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="522" font-size="11" fill="#777" filter="url(#rough2)">r = n，循环结束</text>
  <g filter="url(#rough2)">
    <rect x="150" y="532" width="200" height="52" rx="10" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.6"/>
    <text x="250" y="564" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">返回 ans</text>
  </g>

  <text x="380" y="614" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">收缩循环结束时 [lo, r] 恰为以 r 结尾的最长坏窗口（所有字符频次 ≤ k−1）</text>
</svg>
