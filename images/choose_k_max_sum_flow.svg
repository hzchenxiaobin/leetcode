<svg xmlns="http://www.w3.org/2000/svg" width="640" height="412" viewBox="0 0 640 412" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="412" fill="#fdfcf7"/>
  <text x="290" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：按值分组，整组「先作答、后入堆」</text>
  <path d="M 110 44 Q 290 52 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="110" y="60" width="310" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="265" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">① 下标数组按 nums1 值升序排序</text>
  <path d="M 265 98 L 265 114" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="110" y="118" width="310" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="265" y="142" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">② 值相同的连续下标切成一组</text>
  <path d="M 265 156 L 265 170" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="60" y="168" font-size="11" fill="#666">对每一组（组值 v）：</text>

  <!-- group loop container -->
  <g filter="url(#sk)">
    <rect x="48" y="174" width="448" height="118" rx="10" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="6 5"/>
  </g>

  <!-- box A: answer first -->
  <g filter="url(#sk)">
    <rect x="64" y="192" width="194" height="82" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="161" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a2b">先：整组作答</text>
  <text x="161" y="234" text-anchor="middle" font-size="11" fill="#444">answer[i] = sum</text>
  <text x="161" y="252" text-anchor="middle" font-size="10.5" fill="#666">堆里恰是候选集的前 k 大</text>
  <text x="161" y="268" text-anchor="middle" font-size="10.5" fill="#666">sum 是它们的总和</text>
  <path d="M 260 233 L 284 233" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box B: push after -->
  <g filter="url(#sk)">
    <rect x="290" y="192" width="190" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="385" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">后：整组入堆</text>
  <text x="385" y="234" text-anchor="middle" font-size="11" fill="#444">push(nums2[i])，sum += x</text>
  <text x="385" y="252" text-anchor="middle" font-size="11" fill="#444">若堆大小 &gt; k：</text>
  <text x="385" y="268" text-anchor="middle" font-size="11" fill="#444">sum -= 堆顶，pop</text>

  <!-- decision -->
  <path d="M 272 292 L 272 304" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <polygon points="272,310 352,334 272,358 192,334" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="272" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">还有下一组？</text>

  <!-- yes: loop back -->
  <path d="M 192 334 L 42 334 Q 28 334 28 320 L 28 242 Q 28 234 36 234 L 58 234" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="108" y="326" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- no: return -->
  <path d="M 272 358 L 272 370" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="284" y="370" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="202" y="374" width="140" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="272" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a2b">返回 answer</text>

  <!-- warning panel -->
  <g filter="url(#sk)">
    <rect x="452" y="56" width="168" height="100" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="536" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">⚠ 最容易写错</text>
  <text x="462" y="98" font-size="10.5" fill="#444">排序后逐个处理、处理完</text>
  <text x="462" y="113" font-size="10.5" fill="#444">立即入堆 → 相等元素互相</text>
  <text x="462" y="128" font-size="10.5" fill="#444">看见（例 2 会全错）！</text>
  <text x="462" y="147" font-size="10.5" font-weight="bold" fill="#b85450">必须按值整组处理。</text>
</svg>
