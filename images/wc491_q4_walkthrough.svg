<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="500" fill="#fafafa"/>
  <text x="380" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 全程演算</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [1,2,1,2,2]，k = 2，m = 2 · 蓝框 ＝ 查询范围 [A, B]，绿底 ＝ cover 为 0</text>

  <!-- header -->
  <text x="70" y="88" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="140" y="88" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">v</text>
  <text x="205" y="88" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="265" y="88" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="424" y="88" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">cover(l) · l = 1 … 5</text>
  <text x="585" y="88" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">查询 [A, B]</text>
  <text x="705" y="88" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- r=1 -->
  <rect x="36" y="96" width="688" height="54" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="128" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="205" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="265" y="128" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <rect x="320" y="108" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="128" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="364" y="108" width="40" height="30" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="384" y="128" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <rect x="408" y="108" width="40" height="30" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="428" y="128" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <rect x="452" y="108" width="40" height="30" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="472" y="128" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <rect x="496" y="108" width="40" height="30" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="516" y="128" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <text x="585" y="128" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（B 未激活）</text>
  <text x="705" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- r=2 -->
  <rect x="36" y="154" width="688" height="54" rx="8" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="140" y="186" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="205" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="265" y="186" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="320" y="166" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="186" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="364" y="166" width="40" height="30" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="384" y="186" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <rect x="408" y="166" width="40" height="30" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="428" y="186" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <rect x="452" y="166" width="40" height="30" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="472" y="186" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <rect x="496" y="166" width="40" height="30" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="516" y="186" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <text x="585" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">[1,1] min=2 → 无</text>
  <text x="705" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- r=3 -->
  <rect x="36" y="212" width="688" height="54" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="244" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="140" y="244" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="205" y="244" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="265" y="244" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="320" y="224" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="364" y="224" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="408" y="224" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="452" y="224" width="40" height="30" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="472" y="244" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <rect x="496" y="224" width="40" height="30" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="516" y="244" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <text x="585" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">[1,2] min=1 → 无</text>
  <text x="705" y="244" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- r=4 -->
  <rect x="36" y="270" width="688" height="54" rx="8" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="140" y="302" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="205" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="265" y="302" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="320" y="282" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="340" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="364" y="282" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="302" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="408" y="282" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="302" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="452" y="282" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="472" y="302" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="496" y="282" width="40" height="30" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="516" y="302" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>
  <text x="585" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C ＝ 1 → +1</text>
  <text x="705" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- r=5 -->
  <rect x="36" y="328" width="688" height="54" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="140" y="360" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="205" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="265" y="360" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="320" y="340" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="340" y="360" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="364" y="340" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="360" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="408" y="340" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="360" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="452" y="340" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="472" y="360" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="496" y="340" width="40" height="30" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="516" y="360" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="585" y="360" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C ＝ 1 → +1</text>
  <text x="705" y="360" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- conclusion -->
  <rect x="36" y="396" width="688" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="418" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans ＝ 2：子数组 [1,2,1,2] 与 [1,2,1,2,2] ✓</text>
  <text x="380" y="440" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">⚠ r=5 时 cover(4)＝0（虚线绿格），但 4 ∉ [A,B]＝[1,3]：窗口 [2,2] 只有 1 个不同数</text>
  <text x="380" y="458" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">→ 查询必须限定在 [A,B] 内，不能查到 [A, r]；</text>
  <text x="380" y="476" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">⚠ cover 的增量更新从 r=1 就要做（激活前的历史出现同样贡献禁止区间）</text>
</svg>
