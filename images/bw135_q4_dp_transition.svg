<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">DP 转移：把 max 拆成两种情形，用前缀 / 后缀最大值加速</text>

  <g filter="url(#rough2)" font-size="12">
    <rect x="150" y="46" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="290" y="66" text-anchor="middle" fill="#446688">状态 dp[h[j−1]][h[j]]</text>
    <text x="290" y="84" text-anchor="middle" fill="#666">= 前 j 列（已定稿到 j−1 列）的最大得分</text>

    <path d="M 290 94 L 290 112" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="290" y="130" text-anchor="middle" fill="#446688">枚举 h[j+1] 定稿第 j 列：加 g[j](max(h[j−1], h[j+1]))</text>

    <rect x="50" y="142" width="228" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="66" y="164" fill="#a06c10">情形 A：h[j+1] ≤ h[j−1]</text>
    <text x="66" y="186" fill="#333">增量 = g[j](h[j−1])，与 h[j+1] 无关</text>
    <text x="66" y="208" fill="#333">⇒ 后缀最大 suf[h[j+1]]</text>

    <rect x="302" y="142" width="228" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="318" y="164" fill="#2d5a22">情形 B：h[j+1] &gt; h[j−1]</text>
    <text x="318" y="186" fill="#333">增量 = g[j](h[j+1])，与 h[j−1] 无关</text>
    <text x="318" y="208" fill="#333">⇒ 前缀最大 pre[h[j+1]−1] 再加它</text>

    <path d="M 164 228 L 164 246" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 416 228 L 416 246" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr2)"/>

    <rect x="60" y="250" width="460" height="58" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="290" y="274" text-anchor="middle" fill="#333">new[h[j]][h[j+1]] = max( suf[h[j+1]],</text>
    <text x="290" y="296" text-anchor="middle" fill="#333">pre[h[j+1]−1] + g[j](h[j+1]) )</text>

    <rect x="60" y="322" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="290" y="347" text-anchor="middle" fill="#b85450">朴素 O(n⁴) ≈ 10⁸ 次；拆 max 后每列 O(n²)，总计 O(n³) ≈ 10⁶</text>

    <rect x="60" y="376" width="460" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="76" y="398" fill="#446688">边界：h[−1] = h[n] = 0（网格外没有黑格），dp[0][h[0]] = 0</text>
    <text x="76" y="418" fill="#666">收尾：加上最后一列的 g[n−1](h[n−2]) 后取全局最大</text>
  </g>
</svg>
