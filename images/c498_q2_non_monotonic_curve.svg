<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">反例：不稳定值没有单调性，不能二分</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">nums = [1, 9, 2, 9]，k = 1</text>

  <g filter="url(#rough2)" font-size="13">
    <rect x="100" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="190" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="280" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="370" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="140" y="82" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="230" y="82" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="320" y="82" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="410" y="82" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="140" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="230" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="320" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="410" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=3</text>

  <g filter="url(#rough2)">
    <line x1="110" y1="300" x2="470" y2="300" stroke="#999" stroke-width="1.4"/>
    <line x1="110" y1="300" x2="110" y2="140" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="100" y="304" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="100" y="172" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)">
    <line x1="110" y1="170" x2="470" y2="170" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4"/>
  </g>
  <text x="478" y="174" font-size="10.5" fill="#b85450" filter="url(#rough2)">k=1 阈值线（示意）</text>

  <path d="M 140 300 L 230 170 L 320 170 L 410 300" fill="none" stroke="#446688" stroke-width="2.2" stroke-linejoin="round" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="140" cy="300" r="6" fill="#4a7a3a" stroke="#2f5a24" stroke-width="1.5"/>
    <circle cx="230" cy="170" r="5" fill="#b85450" stroke="#8a3a36" stroke-width="1.5"/>
    <circle cx="320" cy="170" r="5" fill="#b85450" stroke="#8a3a36" stroke-width="1.5"/>
    <circle cx="410" cy="300" r="5" fill="#4a7a3a" stroke="#2f5a24" stroke-width="1.5"/>
  </g>
  <text x="140" y="322" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 ✓</text>
  <text x="230" y="156" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">7 ✗</text>
  <text x="320" y="156" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">7 ✗</text>
  <text x="410" y="322" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 ✓</text>

  <rect x="88" y="336" width="404" height="16" fill="none" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">不稳定值 0 → 7 → 7 → 0：先升后降（山谷形），答案竟是 i = 0</text>
</svg>
