<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：切两位年龄 → 严格大于 60 → 计数</text>

  <!-- 输入 -->
  <rect x="50" y="130" width="130" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="150" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">details[i]</text>
  <text x="115" y="167" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">15 位编码串</text>

  <path d="M 180 154 L 215 154" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 切片 -->
  <rect x="220" y="130" width="120" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">age = 切片数值</text>
  <text x="280" y="167" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">s[11] 与 s[12] 两位</text>

  <path d="M 340 154 L 375 154" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断 -->
  <polygon points="440,120 492,154 440,188 388,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="159" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">age 大于 60 ?</text>

  <path d="M 492 154 L 492 218" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)" fill="none"/>
  <text x="448" y="212" font-size="11" fill="#8c3a36" filter="url(#rough2)">是 → cnt += 1</text>

  <path d="M 388 154 L 360 154 L 360 222" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)" fill="none"/>
  <text x="300" y="212" font-size="11" fill="#888" filter="url(#rough2)">否 → 跳过</text>

  <!-- 判定演算 -->
  <g filter="url(#rough2)" font-size="12.5">
    <text x="50" y="66" fill="#555">三条记录判定：</text>
    <rect x="50" y="76" width="80" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="90" y="96" text-anchor="middle" fill="#8c3a36">75 计入</text>
    <rect x="140" y="76" width="80" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="180" y="96" text-anchor="middle" fill="#8c3a36">92 计入</text>
    <rect x="230" y="76" width="80" height="30" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="270" y="96" text-anchor="middle" fill="#666">40 跳过</text>
    <rect x="320" y="76" width="86" height="30" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="363" y="96" text-anchor="middle" fill="#666">60 跳过!</text>
  </g>

  <rect x="50" y="244" width="420" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12.5" fill="#2f5527" filter="url(#rough2)">“严格大于 60”：年龄恰为 60 不计入（对照条件写错成“大于等于”）</text>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">官方示例一：75、92、40 → cnt = 2</text>
</svg>
