<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：含左上角的子矩阵 ⇔ 右下角 (i, j) 唯一确定</text>
  <path d="M 140 44 Q 320 52 500 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 1：grid = [[7,6,3],[6,6,1]]，k = 18 —— 含 (0,0) 的候选只有 6 个</text>

  <!-- 左：原矩阵 grid -->
  <text x="145" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">grid（2×3）</text>
  <text x="97" y="86" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=0</text>
  <text x="149" y="86" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=1</text>
  <text x="201" y="86" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=2</text>
  <text x="56" y="122" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="56" y="166" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>

  <!-- 子矩阵高亮框 [0..1]x[0..1] -->
  <g filter="url(#rough2)">
    <rect x="67" y="93" width="110" height="96" rx="6" fill="none" stroke="#4a7a3a" stroke-width="2.5"/>
  </g>

  <!-- 单元格 -->
  <g filter="url(#rough2)">
    <rect x="70" y="100" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="96" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="96" y="92" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">锚点 (0,0)</text>
  <g filter="url(#rough2)">
    <rect x="122" y="100" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="148" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)">
    <rect x="174" y="100" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="200" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)">
    <rect x="70" y="144" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="96" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)">
    <rect x="122" y="144" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="148" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)">
    <rect x="174" y="144" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="200" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="168" cy="182" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="196" y="202" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">右下角 (i,j)</text>
  <text x="148" y="222" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">行、列区间都必须从 0 开始</text>

  <!-- 中：箭头 -->
  <path d="M 240 146 Q 284 146 322 143" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="281" y="132" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">逐格求和</text>
  <text x="281" y="170" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">= 前缀和 P</text>

  <!-- 右：P 矩阵 -->
  <text x="440" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">P[i][j] ≤ k ?（每个右下角一个和）</text>
  <g filter="url(#rough2)">
    <rect x="350" y="98" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="380" y="121" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">7 ✓</text>
  <g filter="url(#rough2)">
    <rect x="410" y="98" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="440" y="121" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">13 ✓</text>
  <g filter="url(#rough2)">
    <rect x="470" y="98" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="500" y="121" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">16 ✓</text>
  <g filter="url(#rough2)">
    <rect x="350" y="134" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="380" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">13 ✓</text>
  <g filter="url(#rough2)">
    <rect x="410" y="134" width="60" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="440" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">25 ✗</text>
  <g filter="url(#rough2)">
    <rect x="470" y="134" width="60" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="500" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">29 ✗</text>
  <text x="440" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 = 绿格数 = 4 ✓</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="50" y="250" width="540" height="120" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">连续矩形包含 (0,0) ⇒ 上、左边界被钉死在 0，四个自由度只剩「右下角」</text>
  <text x="320" y="304" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">候选从 O(m²n²) 骤减为 O(mn)：每个候选的和恰是二维前缀和 P[i][j]</text>
  <text x="320" y="328" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">答案 = 满足 P[i][j] ≤ k 的格子数，一趟逐行扫描即可统计</text>
  <text x="320" y="352" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">再配合非负性（P 行内单调不减）⇒ 每行合格段是前缀，可提前 break（见下图）</text>
</svg>
