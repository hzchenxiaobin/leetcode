<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="352" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">为什么「能弹就弹」不丢解</text>
  <rect x="40" y="52" width="440" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">popped 的首个元素 p，必须由「压到它」的那一刻弹出</text>
  <rect x="40" y="116" width="440" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">若栈顶 == popped[j]，此刻不弹就要压入后续元素，</text>
  <text x="260" y="158" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">而后续元素会把它压在下面，永远弹不出来 —— 必须立刻弹</text>
  <rect x="40" y="194" width="440" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">若栈顶 ≠ popped[j]，只能继续压入，别无选择</text>
  <text x="260" y="236" text-anchor="middle" font-size="11.5" fill="#a9761f" filter="url(#rough2)">因此每一步的动作是被「唯一确定」的，模拟即判定</text>
  <rect x="40" y="272" width="440" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">结束时 j < len(popped) ⇒ 有元素没按顺序弹出 ⇒ false</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">复杂度 O(n)：每个元素恰好入栈、出栈一次</text>
</svg>
