<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：按最短木棍（高度 1）的位置分类</text>
  <path d="M 120 36 Q 320 44 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#555">高度 1 比谁都矮 —— 不挡任何棍；不在最左就必被挡，结论不依赖左侧具体排列</text>

  <g filter="url(#sk)">
    <rect x="28" y="74" width="292" height="252" rx="10" fill="#f7fbf7" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="174" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">情况 A：高度 1 在最左 → 必可见</text>

  <g filter="url(#sk)">
    <rect x="48" y="155" width="22" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="2"/>
    <rect x="78" y="125" width="22" height="45" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
    <rect x="108" y="140" width="22" height="30" fill="#f2f0e9" stroke="#b0a894" stroke-width="1.2" rx="2"/>
    <rect x="138" y="110" width="22" height="60" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
  </g>
  <text x="59" y="149" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">1</text>
  <text x="89" y="119" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="119" y="134" text-anchor="middle" font-size="10.5" fill="#999">2</text>
  <text x="149" y="104" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="246" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">可见 {1,3,4}</text>
  <text x="246" y="150" text-anchor="middle" font-size="11" fill="#2e6e2e">共 3 根（含高度 1）</text>

  <path d="M 104 176 L 104 208" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="185" y="196" text-anchor="middle" font-size="10" fill="#555">删去高度 1，把 2..4 重标号为 1..3</text>

  <g filter="url(#sk)">
    <rect x="70" y="232" width="22" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
    <rect x="100" y="247" width="22" height="15" fill="#f2f0e9" stroke="#b0a894" stroke-width="1.2" rx="2"/>
    <rect x="130" y="217" width="22" height="45" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
  </g>
  <text x="81" y="226" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="111" y="241" text-anchor="middle" font-size="10.5" fill="#999">1</text>
  <text x="141" y="211" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="246" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">可见 {2,3}</text>
  <text x="246" y="250" text-anchor="middle" font-size="11" fill="#2e6e2e">共 2 根（少 1 根）</text>

  <g filter="url(#sk)">
    <rect x="44" y="288" width="260" height="30" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="174" y="307" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">剩余 n−1 根需 k−1 可见 → dp[n−1][k−1]</text>

  <g filter="url(#sk)">
    <rect x="336" y="74" width="276" height="252" rx="10" fill="#fffdf5" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="474" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">情况 B：高度 1 在其余 n−1 个位置 → 必被挡</text>

  <g filter="url(#sk)">
    <rect x="356" y="125" width="22" height="45" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
    <rect x="386" y="155" width="22" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="2"/>
    <rect x="416" y="140" width="22" height="30" fill="#f2f0e9" stroke="#b0a894" stroke-width="1.2" rx="2"/>
    <rect x="446" y="110" width="22" height="60" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
  </g>
  <text x="367" y="119" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="397" y="149" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">1</text>
  <text x="427" y="134" text-anchor="middle" font-size="10.5" fill="#999">2</text>
  <text x="457" y="104" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="540" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">可见 {3,4}</text>
  <text x="540" y="150" text-anchor="middle" font-size="11" fill="#8a6415">共 2 根（高度 1 被挡）</text>

  <path d="M 405 176 L 405 208" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="485" y="196" text-anchor="middle" font-size="10" fill="#555">删去高度 1，重标号</text>

  <g filter="url(#sk)">
    <rect x="378" y="232" width="22" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
    <rect x="408" y="247" width="22" height="15" fill="#f2f0e9" stroke="#b0a894" stroke-width="1.2" rx="2"/>
    <rect x="438" y="217" width="22" height="45" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
  </g>
  <text x="389" y="226" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="419" y="241" text-anchor="middle" font-size="10.5" fill="#999">1</text>
  <text x="449" y="211" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="540" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">可见 {2,3}</text>
  <text x="540" y="250" text-anchor="middle" font-size="11" fill="#8a6415">共 2 根（不变）</text>

  <g filter="url(#sk)">
    <rect x="352" y="288" width="244" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="474" y="307" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">剩余 n−1 根需 k 可见 → (n−1)·dp[n−1][k]</text>

  <g filter="url(#sk)">
    <rect x="28" y="342" width="584" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">⚠ 为什么不考察最长的木棍？它放在任何位置都可见，还会遮挡其右侧全部木棍</text>
  <text x="320" y="378" text-anchor="middle" font-size="11" fill="#b85450">右侧子问题结构被破坏 —— 最短木棍的分类才干净利落</text>

  <text x="320" y="406" text-anchor="middle" font-size="11.5" fill="#555">两个面板删去高度 1 后得到同一个剩余排列 [2,1,3] —— A 的可见数 +1，B 的不变</text>
  <text x="320" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">两类按「高度 1 的位置」划分，不重不漏 ⇒ dp[n][k] = dp[n−1][k−1] + (n−1)·dp[n−1][k]</text>
</svg>
