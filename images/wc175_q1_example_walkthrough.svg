<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="390" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：arr = [10, 2, 5, 3]</text>
  <text x="310" y="52" text-anchor="middle" font-size="10.5" fill="#888">每轮只做两次 O(1) 查询，再插入当前元素；第 3 轮命中 10 = 2 × 5</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="40" y="72" width="52" height="34" fill="#eceff1" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="92" y="72" width="60" height="34" fill="#eceff1" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="152" y="72" width="70" height="34" fill="#eceff1" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="222" y="72" width="90" height="34" fill="#eceff1" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="312" y="72" width="70" height="34" fill="#eceff1" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="382" y="72" width="90" height="34" fill="#eceff1" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="472" y="72" width="108" height="34" fill="#eceff1" stroke="#999" stroke-width="1.2" rx="3"/>
    <text x="66" y="94" fill="#444">i</text>
    <text x="122" y="94" fill="#444">x</text>
    <text x="187" y="94" fill="#444">2x</text>
    <text x="267" y="94" fill="#444">2x ∈ S ?</text>
    <text x="347" y="94" fill="#444">x/2</text>
    <text x="427" y="94" fill="#444">x/2 ∈ S ?</text>
    <text x="526" y="94" fill="#444">S（插入后）</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="40" y="106" width="52" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="92" y="106" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="152" y="106" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="222" y="106" width="90" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="312" y="106" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="382" y="106" width="90" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="472" y="106" width="108" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="66" y="128" fill="#555">0</text>
    <text x="122" y="128" fill="#5a4a20">10</text>
    <text x="187" y="128" fill="#555">20</text>
    <text x="267" y="128" fill="#666">否（S=∅）</text>
    <text x="347" y="128" fill="#555">5</text>
    <text x="427" y="128" fill="#666">否</text>
    <text x="526" y="128" fill="#555">{10}</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="40" y="140" width="52" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="92" y="140" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="152" y="140" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="222" y="140" width="90" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="312" y="140" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="382" y="140" width="90" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="472" y="140" width="108" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="66" y="162" fill="#555">1</text>
    <text x="122" y="162" fill="#3a4a66">2</text>
    <text x="187" y="162" fill="#555">4</text>
    <text x="267" y="162" fill="#666">否</text>
    <text x="347" y="162" fill="#555">1</text>
    <text x="427" y="162" fill="#666">否</text>
    <text x="526" y="162" fill="#555">{10, 2}</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="40" y="174" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="92" y="174" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="152" y="174" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="222" y="174" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="312" y="174" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="382" y="174" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="472" y="174" width="108" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="66" y="196" fill="#31592a">2</text>
    <text x="122" y="196" fill="#31592a">5</text>
    <text x="187" y="196" fill="#31592a">10</text>
    <text x="267" y="196" fill="#31592a">是 ✓</text>
    <text x="347" y="196" fill="#31592a">—</text>
    <text x="427" y="196" fill="#31592a">—</text>
    <text x="526" y="196" fill="#31592a">返回 true</text>
  </g>

  <path d="M 520 216 L 520 236" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">命中即结束：10 = 2 × 5，两次命中的下标分别是 0 和 2，互不相同</text>

  <rect x="40" y="252" width="540" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="274" font-size="11" fill="#8a6a20" font-weight="bold">边界：[0, 0] 与 [0, 1]</text>
  <text x="58" y="296" font-size="10" fill="#555">[0, 0]：i=0 时 2×0=0 不在空集、0/2=0 也不在 → 插入 0；i=1 时 2×0=0 ∈ S → true。</text>
  <text x="58" y="316" font-size="10" fill="#555">[0, 1]：0 只在集合里出现一次，查 2×0 时集合里只有它自己（且查的是「已扫描」部分）→ false。</text>
  <text x="58" y="336" font-size="10" fill="#555">若改成「先建全量集合、再逐个查 2x」，[0, 1] 会被 0 配自己误判成 true —— 这是本题最大的坑。</text>
  <text x="58" y="354" font-size="10" fill="#555">同理 [10, 2, 5, 3] 里 5 出现在 10 之后，只查 2x 的写法会漏掉它，必须补查 x/2。</text>
</svg>
