<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 446" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="446" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：行优先扫描 + 栈式 DFS 求连通块大小</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">入栈的同时就把格子改成 0，等价于「已访问」标记，不需要额外的 visited 数组</text>

  <rect x="140" y="58" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="79" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">按行优先取下一个格子 (i, j)</text>

  <polygon points="250,106 345,132 250,158 155,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="137" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">grid[i][j] == 1？</text>

  <rect x="140" y="182" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="203" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">area = 0；该格置 0 并入栈</text>

  <polygon points="250,236 345,262 250,288 155,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="267" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">栈非空？</text>

  <rect x="130" y="308" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="327" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">弹出栈顶 (r, c)：area++</text>
  <text x="250" y="345" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">四邻域中的 1 置 0 并入栈</text>

  <rect x="430" y="302" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="510" y="327" text-anchor="middle" font-size="10.5" fill="#8a3a38" filter="url(#rough2)">best = max(best, area)</text>

  <rect x="430" y="376" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="510" y="397" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">扫描结束：返回 best</text>

  <path d="M 250 90 L 250 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 158 L 250 180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 214 L 250 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 288 L 250 306" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 331 L 100 331 L 100 262 L 152 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 345 262 L 405 262 L 405 322 L 427 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 345 132 L 400 132 L 400 74 L 363 74" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 342 L 510 374" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="173" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="260" y="302" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="372" y="124" font-size="10" fill="#b85450" filter="url(#rough2)">否：跳过</text>
  <text x="352" y="254" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="106" y="296" font-size="9.5" fill="#999" filter="url(#rough2)">继续弹栈</text>

  <text x="310" y="430" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每格最多入栈一次、每格只做 4 次邻居检查，所以总工作量是 O(mn)</text>
</svg>
