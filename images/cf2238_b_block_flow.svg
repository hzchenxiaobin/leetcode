<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="520" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：数论分块，一次跳一整段
  </text>
  <text x="330" y="54" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    每轮锁定 ⌊n/b⌋ 恒为 q 的区间 [l, r]，整块结算 (r − l + 1)·q²
  </text>

  <rect x="210" y="76" width="240" height="46" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="105" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">l = 1，ans = 0</text>

  <path d="M 330 122 L 330 146" fill="none" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="148" width="240" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="179" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">q = ⌊n / l⌋</text>

  <path d="M 330 198 L 330 226" fill="none" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="228" width="320" height="54" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="251" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">r = ⌊n / q⌋</text>
  <text x="330" y="271" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">
    b = l … r 的 ⌊n/b⌋ 都等于 q
  </text>

  <path d="M 330 282 L 330 310" fill="none" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="312" width="240" height="50" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="343" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans += (r − l + 1)·q²</text>

  <path d="M 330 362 L 330 378" fill="none" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="330,380 460,424 330,468 200,424" fill="#e8f0fe" stroke="#446688"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="429" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    l = r + 1 &gt; n ?
  </text>

  <path d="M 200 424 L 120 424 L 120 173 L 206 173" fill="none" stroke="#4a7a3a"
        stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="152" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="152" y="446" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">继续分块</text>

  <path d="M 460 424 L 490 424" fill="none" stroke="#b85450" stroke-width="1.6"
        marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="474" y="412" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="492" y="398" width="148" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="566" y="429" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输出 ans</text>

  <text x="330" y="498" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    每轮至少吃掉一个 b，块数 ≤ 2√n，单组 O(√n)
  </text>
</svg>
