<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7a5415"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">下界证明链：AM-GM 把"任意形态"压到构造值</text>
  <path d="M 210 46 Q 450 54 690 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- ① 总和不变 -->
  <rect x="80" y="64" width="740" height="60" rx="9" fill="#eef4fb" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="88" font-size="12.5" font-weight="bold" fill="#2b4e6e" filter="url(#rough2)">① 总和是定值（由每列 2^(p−1) 个 1 推出）</text>
  <text x="100" y="110" font-size="12" fill="#333" filter="url(#rough2)">Σ vᵢ = Σⱼ 2^(p−1) · 2ʲ = 2^(p−1) (2^p − 1) = T · M，其中 T = 2^(p−1)，M = 2^p − 1</text>

  <path d="M 450 126 L 450 142" stroke="#7a5415" stroke-width="1.6" fill="none"
        marker-end="url(#arr4)" filter="url(#rough2)"/>

  <!-- ② 最大值 -->
  <rect x="80" y="146" width="740" height="60" rx="9" fill="#f4f8fc" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="170" font-size="12.5" font-weight="bold" fill="#2b4e6e" filter="url(#rough2)">② 取最大元素 v*：它不低于平均值</text>
  <text x="100" y="192" font-size="12" fill="#333" filter="url(#rough2)">v* ≥ T · M / (2T − 1)（一共有 2^p − 1 = 2T − 1 个元素）</text>

  <path d="M 450 208 L 450 224" stroke="#7a5415" stroke-width="1.6" fill="none"
        marker-end="url(#arr4)" filter="url(#rough2)"/>

  <!-- ③ AM-GM -->
  <rect x="80" y="228" width="740" height="60" rx="9" fill="#f4f9f5" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="252" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">③ 其余 2T − 2 个元素用 AM-GM（算术平均 ≥ 几何平均）</text>
  <text x="100" y="274" font-size="12" fill="#333" filter="url(#rough2)">∏_其余 ≥ ( (T · M − v*) / (2T − 2) )^(2T − 2)</text>

  <path d="M 450 290 L 450 306" stroke="#7a5415" stroke-width="1.6" fill="none"
        marker-end="url(#arr4)" filter="url(#rough2)"/>

  <!-- ④ 合并成 h -->
  <rect x="80" y="310" width="740" height="60" rx="9" fill="#fdf8ec" stroke="#d6a040"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="334" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">④ 合并：P ≥ h(v*)，而 h 在 [T M/(2T−1), M] 上单调递减</text>
  <text x="100" y="356" font-size="12" fill="#333" filter="url(#rough2)">h(v) = v · ( (T M − v) / (2(T − 1)) )^(2(T − 1)) ⟹ h(v*) ≥ h(M)</text>

  <path d="M 450 372 L 450 388" stroke="#7a5415" stroke-width="1.6" fill="none"
        marker-end="url(#arr4)" filter="url(#rough2)"/>

  <!-- ⑤ 代入 M -->
  <rect x="80" y="392" width="740" height="60" rx="9" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="416" font-size="12.5" font-weight="bold" fill="#8e3b3b" filter="url(#rough2)">⑤ 代回 v = M：得到与构造完全一致的下界</text>
  <text x="100" y="438" font-size="12" fill="#333" filter="url(#rough2)">h(M) = M · (M/2)^(2(T−1)) = M · ((M/2)²)^(T−1) ≥ M · (M − 1)^(T−1)</text>

  <!-- 关键不等式 -->
  <rect x="80" y="470" width="740" height="74" rx="10" fill="#eef8f0" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="494" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">关键不等式：(M/2)² ≥ M − 1 ⟺ (M − 2)² ≥ 0，恒成立</text>
  <text x="100" y="516" font-size="11.5" fill="#444" filter="url(#rough2)">构造给出可达值 M(M − 1)^(T−1)，证明给出任意形态都不低于它 ⟹ 这就是最小值。</text>
  <text x="100" y="534" font-size="11" fill="#888" filter="url(#rough2)">AM-GM 的等号只在各项相等时成立，所以下界通常偏松——但足够贴住构造值。</text>
</svg>
