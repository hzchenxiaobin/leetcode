<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="336" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [1,3,2,6,4,2]，k = 3，dist = 3（need = 1）</text>
  <text x="80" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s = i₁</text>
  <text x="240" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">窗口 [s+1, s+3]</text>
  <text x="350" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">窗口内值</text>
  <text x="450" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">最小 1 个</text>
  <text x="520" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">总代价</text>
  <rect x="40" y="76" width="490" height="30" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="96" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="96" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2, 4]</text>
  <text x="350" y="96" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2, 6, 4</text>
  <text x="450" y="96" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="520" y="96" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1+3+2 = 6</text>
  <rect x="40" y="110" width="490" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="130" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="240" y="130" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[3, 5]</text>
  <text x="350" y="130" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6, 4, 2</text>
  <text x="450" y="130" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="520" y="130" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1+2+2 = 5</text>
  <rect x="40" y="144" width="490" height="30" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="164" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="240" y="164" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4, 5]</text>
  <text x="350" y="164" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4, 2</text>
  <text x="450" y="164" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="520" y="164" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1+6+2 = 9</text>
  <rect x="40" y="178" width="490" height="30" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="240" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[5, 5]</text>
  <text x="350" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="450" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="520" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1+4+2 = 7</text>
  <rect x="40" y="212" width="490" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="232" text-anchor="middle" font-size="10.5" fill="#7a3030" filter="url(#rough2)">5</text>
  <text x="240" y="232" text-anchor="middle" font-size="10.5" fill="#7a3030" filter="url(#rough2)">空</text>
  <text x="350" y="232" text-anchor="middle" font-size="10.5" fill="#7a3030" filter="url(#rough2)">—</text>
  <text x="450" y="232" text-anchor="middle" font-size="10.5" fill="#7a3030" filter="url(#rough2)">—</text>
  <text x="520" y="232" text-anchor="middle" font-size="10.5" fill="#7a3030" filter="url(#rough2)">不可行</text>
  <rect x="120" y="258" width="320" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">最小值 = 5（s = 2 时取得）</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s = 5 时右侧已无元素，凑不出 k−2 = 1 个切点 → 该 s 非法</text>
</svg>
