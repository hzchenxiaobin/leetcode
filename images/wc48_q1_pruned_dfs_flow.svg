<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="580" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：先序遍历 + 上界剪枝</text>

  <!-- 主函数 -->
  <rect x="280" y="36" width="80" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="53" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">开始</text>
  <path d="M320,62 L320,74" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="76" width="340" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="96" text-anchor="middle" font-size="12" fill="#2b4a6b" font-family="monospace" filter="url(#rough2)">minVal ← root.val ;  ans ← +∞</text>
  <path d="M320,108 L320,122" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="124" width="240" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="143" text-anchor="middle" font-size="12" fill="#2b4a6b" font-family="monospace" filter="url(#rough2)">dfs(root)</text>
  <path d="M320,154 L320,168" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="170" width="320" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="189" text-anchor="middle" font-size="12" fill="#2b4a6b" font-family="monospace" filter="url(#rough2)">return ans == +∞ ? -1 : ans</text>
  <path d="M320,200 L320,214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="280" y="216" width="80" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="233" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">结束</text>

  <!-- 递归体面板 -->
  <rect x="18" y="256" width="604" height="310" rx="10" fill="#fdfdff" stroke="#aaa" stroke-width="1.3" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="40" y="278" text-anchor="start" font-size="11" font-weight="bold" fill="#666" filter="url(#rough2)">dfs(u) 递归体：每个节点调用一次</text>

  <path d="M320,282 L320,296" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1 -->
  <polygon points="320,298 438,338 320,378 202,338" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="332" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">u 为空，或</text>
  <text x="320" y="349" text-anchor="middle" font-size="11" fill="#8a6d1f" font-family="monospace" filter="url(#rough2)">u.val ≥ ans ?</text>

  <!-- 是分支 1 -->
  <text x="450" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M438,338 L462,338" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="466" y="320" width="148" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="343" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">返回（不更新 ans）</text>

  <!-- 否分支 1 -->
  <text x="334" y="392" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M320,378 L320,400" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 2 -->
  <polygon points="320,400 432,434 320,468 208,434" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="439" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-family="monospace" filter="url(#rough2)">u.val &gt; minVal ?</text>

  <!-- 是分支 2 -->
  <text x="444" y="426" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M432,434 L456,434" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="456" y="414" width="158" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="535" y="431" text-anchor="middle" font-size="10.5" fill="#8b3a36" font-family="monospace" filter="url(#rough2)">ans ← min(ans, u.val)</text>
  <text x="535" y="447" text-anchor="middle" font-size="10" fill="#8b3a36" filter="url(#rough2)">剪掉整棵子树，返回</text>

  <!-- 否分支 2 -->
  <text x="334" y="484" text-anchor="start" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M320,468 L320,492" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="214" y="494" width="212" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="516" text-anchor="middle" font-size="11" fill="#2b4a6b" font-family="monospace" filter="url(#rough2)">dfs(u.left) ; dfs(u.right)</text>

  <!-- 回溯边 -->
  <path d="M320,528 L320,544 L108,544 L108,338 L196,338" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="558" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每个孩子递归进入本流程（节点值一定等于 minVal）</text>
</svg>
