<svg xmlns="http://www.w3.org/2000/svg" width="640" height="465" viewBox="0 0 640 465" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="465" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：升序扫 c = 1..10，五组输入覆盖全部出口</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表格底色（逐行淡色） -->
  <g filter="url(#sk)"><rect x="36" y="56" width="568" height="30" fill="#e8f0fa"/></g>
  <rect x="37" y="86" width="566" height="58" fill="#eef6ee"/>
  <rect x="37" y="144" width="566" height="58" fill="#fdf0f0"/>
  <rect x="37" y="202" width="566" height="58" fill="#f4f4f4"/>
  <rect x="37" y="260" width="566" height="58" fill="#eef6ee"/>
  <rect x="37" y="318" width="566" height="58" fill="#fdf0f0"/>

  <!-- 表格外框与格线 -->
  <g filter="url(#sk)"><rect x="36" y="56" width="568" height="320" fill="none" stroke="#555" stroke-width="1.6"/></g>
  <path d="M 36 86 Q 320 90 604 86" stroke="#555" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 36 144 Q 320 148 604 144" stroke="#999" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <path d="M 36 202 Q 320 206 604 202" stroke="#999" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <path d="M 36 260 Q 320 264 604 260" stroke="#999" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <path d="M 36 318 Q 320 322 604 318" stroke="#999" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <path d="M 150 56 Q 147 216 150 376" stroke="#999" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <path d="M 410 56 Q 413 216 410 376" stroke="#999" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <path d="M 478 56 Q 475 216 478 376" stroke="#999" stroke-width="1.1" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <text x="93" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">输入</text>
  <text x="280" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">逐 c 扫描：(c·k) mod 10 对 num mod 10</text>
  <text x="444" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">判定</text>
  <text x="541" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">输出 / 构造</text>

  <!-- 行 1：58, 9 -->
  <text x="93" y="107" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">num=58, k=9</text>
  <text x="93" y="127" text-anchor="middle" font-size="10.5" fill="#888">目标个位 8</text>
  <text x="280" y="107" text-anchor="middle" font-size="11" fill="#444">c=1：9 ≠ 8 ✗</text>
  <text x="280" y="127" text-anchor="middle" font-size="11" fill="#2e5e2e">c=2：18 → 8 ✓ 首个对齐</text>
  <text x="444" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">c=2</text>
  <text x="444" y="127" text-anchor="middle" font-size="10.5" fill="#2e5e2e">18≤58 ✓</text>
  <text x="541" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">输出 2</text>
  <text x="541" y="127" text-anchor="middle" font-size="11" fill="#444">{9, 49}</text>

  <!-- 行 2：37, 2 -->
  <text x="93" y="165" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">num=37, k=2</text>
  <text x="93" y="185" text-anchor="middle" font-size="10.5" fill="#888">目标个位 7</text>
  <text x="280" y="165" text-anchor="middle" font-size="11" fill="#444">2c mod 10 只取 {2,4,6,8,0}</text>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#a04a48">永不等于 7 —— 奇偶错配</text>
  <text x="444" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04a48">无匹配</text>
  <text x="541" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a48">−1</text>

  <!-- 行 3：0, 7 -->
  <text x="93" y="223" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">num=0, k=7</text>
  <text x="93" y="243" text-anchor="middle" font-size="10.5" fill="#888">空集和为 0</text>
  <text x="280" y="233" text-anchor="middle" font-size="11" fill="#888">特判挡在循环外，不入扫描</text>
  <text x="444" y="233" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="541" y="233" text-anchor="middle" font-size="11.5" fill="#444">0（空多重集）</text>

  <!-- 行 4：20, 0 -->
  <text x="93" y="281" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">num=20, k=0</text>
  <text x="93" y="301" text-anchor="middle" font-size="10.5" fill="#888">目标个位 0</text>
  <text x="280" y="281" text-anchor="middle" font-size="11" fill="#2e5e2e">c=1：0 = 0 ✓（k=0 时与 c 无关）</text>
  <text x="280" y="301" text-anchor="middle" font-size="11" fill="#444">0 ≤ 20 ✓</text>
  <text x="444" y="281" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">c=1</text>
  <text x="444" y="301" text-anchor="middle" font-size="10.5" fill="#2e5e2e">0≤20 ✓</text>
  <text x="541" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">输出 1</text>
  <text x="541" y="301" text-anchor="middle" font-size="11" fill="#444">{20}（单元素）</text>

  <!-- 行 5：4, 3 -->
  <text x="93" y="339" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">num=4, k=3</text>
  <text x="93" y="359" text-anchor="middle" font-size="10.5" fill="#888">目标个位 4</text>
  <text x="280" y="339" text-anchor="middle" font-size="11" fill="#444">c=8：24 → 4 ✓ 个位对齐</text>
  <text x="280" y="359" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04a48">但 24 &gt; 4 —— 透支！</text>
  <text x="444" y="349" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04a48">透支</text>
  <text x="541" y="349" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a48">−1</text>

  <!-- 底注 -->
  <g filter="url(#sk)"><rect x="60" y="392" width="520" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="320" y="412" text-anchor="middle" font-size="11.5" fill="#2b6e9e">三种出口：① 命中且不透支 → 返回 c（行1、行4）；② 不可达 / 透支 → −1（行2、行5）；③ num=0 → 0（行3）</text>
  <text x="320" y="432" text-anchor="middle" font-size="11" fill="#666">两种 −1 机理不同：行 2 凑不出个位（条件 ①），行 5 凑得出但余量不够（条件 ②）</text>
</svg>
