<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">三个示例走查：相接算、重叠算、相离不算</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 示例 1：端点相接 ===== -->
  <text x="55" y="96" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1</text>

  <g filter="url(#sk)">
    <rect x="180" y="78" width="80" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="220" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">01:15–02:00</text>
  <text x="220" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">事件 1</text>

  <g filter="url(#sk)">
    <rect x="260" y="118" width="80" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="300" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e22" filter="url(#sk)">02:00–03:00</text>
  <text x="300" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">事件 2</text>

  <path d="M 260 72 L 260 152" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <text x="262" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">02:00 相接也算！</text>

  <text x="440" y="96" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#sk)">s₁ ≤ e₂ : 01:15 ≤ 03:00 ✓</text>
  <text x="440" y="118" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">s₂ ≤ e₁ : 02:00 ≤ 02:00 ✓（等号！）</text>
  <g filter="url(#sk)">
    <rect x="560" y="90" width="56" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="588" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#sk)">true</text>

  <!-- ===== 示例 2：部分重叠 ===== -->
  <text x="55" y="246" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2</text>

  <g filter="url(#sk)">
    <rect x="202" y="222" width="80" height="30" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5,4"/>
  </g>
  <g filter="url(#sk)">
    <rect x="180" y="228" width="80" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="220" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">01:00–02:00</text>
  <text x="220" y="220" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">事件 1</text>

  <g filter="url(#sk)">
    <rect x="205" y="268" width="140" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="275" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e22" filter="url(#sk)">01:20–03:00</text>
  <text x="275" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">事件 2</text>

  <text x="222" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415" filter="url(#sk)">重叠 [01:20, 02:00]</text>

  <text x="440" y="246" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#sk)">s₁ ≤ e₂ : 01:00 ≤ 03:00 ✓</text>
  <text x="440" y="268" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#sk)">s₂ ≤ e₁ : 01:20 ≤ 02:00 ✓</text>
  <g filter="url(#sk)">
    <rect x="560" y="240" width="56" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="588" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#sk)">true</text>

  <!-- ===== 示例 3：相离 ===== -->
  <text x="55" y="396" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 3</text>

  <g filter="url(#sk)">
    <rect x="180" y="378" width="80" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="220" y="397" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">10:00–11:00</text>
  <text x="220" y="370" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">事件 1</text>

  <g filter="url(#sk)">
    <rect x="330" y="418" width="80" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="370" y="437" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e22" filter="url(#sk)">14:00–15:00</text>
  <text x="370" y="464" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">事件 2</text>

  <path d="M 266 432 Q 298 418 322 432" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="295" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">e₁ &lt; s₂ 相离</text>

  <text x="440" y="396" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#sk)">s₁ ≤ e₂ : 10:00 ≤ 15:00 ✓</text>
  <text x="440" y="418" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">s₂ ≤ e₁ : 14:00 ≤ 11:00 ✗</text>
  <g filter="url(#sk)">
    <rect x="560" y="390" width="56" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="588" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">false</text>
</svg>
