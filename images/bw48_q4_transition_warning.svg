<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">易错点警示：只枚举「最低空闲位」的配对在本题是错的！</text>

  <!-- 错误做法 -->
  <rect x="40" y="52" width="230" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="155" y="76" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">错误：固定最低空闲位 i</text>
  <text x="56" y="100" font-size="11" fill="#555" filter="url(#rough2)">每轮强制「下标最小的空闲数」</text>
  <text x="56" y="120" font-size="11" fill="#555" filter="url(#rough2)">必须参与本轮配对，只枚举</text>
  <text x="56" y="140" font-size="11" fill="#555" filter="url(#rough2)">它的搭档 j。</text>
  <text x="56" y="166" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">乘数依赖轮次，顺序不可规范化：</text>
  <text x="56" y="186" font-size="11" fill="#b85450" filter="url(#rough2)">把大 gcd 的对子留到后轮高乘数</text>
  <text x="56" y="206" font-size="11" fill="#b85450" filter="url(#rough2)">可能要求「低位的数」晚点删。</text>

  <!-- 正确做法 -->
  <rect x="290" y="52" width="230" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="405" y="76" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">正确：枚举全部空闲点对</text>
  <text x="306" y="100" font-size="11" fill="#555" filter="url(#rough2)">对每个 mask 枚举所有空闲的</text>
  <text x="306" y="120" font-size="11" fill="#555" filter="url(#rough2)">(i &lt; j)，谁先删都允许，</text>
  <text x="306" y="140" font-size="11" fill="#555" filter="url(#rough2)">自然覆盖全部「配对 × 顺序」。</text>
  <text x="306" y="166" font-size="11" fill="#2f5226" font-weight="bold" filter="url(#rough2)">状态数不变 2^(2n)，转移数</text>
  <text x="306" y="186" font-size="11" fill="#2f5226" font-weight="bold" filter="url(#rough2)">增加常数倍（≤ C(14,2)），</text>
  <text x="306" y="206" font-size="11" fill="#2f5226" font-weight="bold" filter="url(#rough2)">2n ≤ 14 规模下毫无压力。</text>

  <!-- 反例 -->
  <rect x="40" y="244" width="480" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="268" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">实测反例：nums = [26, 7, 4, 16, 1, 29, 27, 13]（8 个数，4 轮）</text>
  <text x="56" y="292" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">最优方案：第 1 轮删 (7,1) 得 1×1；第 2 轮删 (29,27) 得 1×2；</text>
  <text x="56" y="312" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">第 3 轮删 (4,16) 得 4×3；第 4 轮删 (26,13) 得 13×4 = 52</text>
  <text x="56" y="334" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">真值 = 1 + 2 + 12 + 52 = 67（大 gcd 的 (26,13) 留到第 4 轮吃 4 倍乘数）</text>
  <text x="56" y="354" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">错误 DP 只得 55：下标 0 的 26 被迫第 1 轮配对，52 的高分拿不到。</text>
  <text x="56" y="356" font-size="11" fill="#8a6a20" filter="url(#rough2)">（三个官方示例恰好都「最低位早删」不触发 bug，对拍才抓得出来！）</text>

  <!-- 底部 -->
  <rect x="40" y="378" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">结论：配对型状压 DP 的「最低空闲位」剪枝只对「不计顺序」的问题合法，本题必须全枚举</text>
</svg>
