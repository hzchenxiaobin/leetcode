<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="396" fill="#fafafa"/>

  <text filter="url(#rough2)" x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：arr = [−7,9,5]，brr = [7,−2,−5]，k = 2</text>

  <text filter="url(#rough2)" x="28" y="58" font-size="11.2" fill="#3a4a66" font-weight="bold">方案 A：不重排，逐位硬调</text>
  <g filter="url(#rough2)">
    <rect x="28" y="68" width="500" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="28" y="96" width="500" height="26" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="28" y="124" width="500" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.4" fill="#333">
    <text x="40" y="86">i = 0：arr −7 → brr 7</text>
    <text x="260" y="86">|−7 − 7| = 14</text>
    <text x="400" y="86" fill="#888">调 14</text>
    <text x="40" y="114">i = 1：arr 9 → brr −2</text>
    <text x="260" y="114">|9 + 2| = 11</text>
    <text x="400" y="114" fill="#888">调 11</text>
    <text x="40" y="142">i = 2：arr 5 → brr −5</text>
    <text x="260" y="142">|5 + 5| = 10</text>
    <text x="400" y="142" fill="#888">调 10</text>
  </g>
  <text filter="url(#rough2)" x="40" y="168" font-size="10.8" fill="#8a3a36">cost₀ = 14 + 11 + 10 = 35</text>

  <text filter="url(#rough2)" x="28" y="196" font-size="11.2" fill="#3a5a30" font-weight="bold">方案 B：花 k 重排成升序，再按同位置配对</text>
  <g filter="url(#rough2)">
    <rect x="28" y="206" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="28" y="234" width="500" height="26" fill="#f2f9f2" stroke="#cfe3cf" stroke-width="1" rx="4"/>
    <rect x="28" y="262" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.4" fill="#333">
    <text x="40" y="224">排序后 a′ = [−7, 5, 9]</text>
    <text x="230" y="224">排序后 b′ = [−5, −2, 7]</text>
    <text x="430" y="224" fill="#888">（升序一一对应）</text>
    <text x="40" y="252">第 0 位：|−7 − (−5)| = 2</text>
    <text x="40" y="280">第 1 位：|5 − (−2)| = 7 　第 2 位：|9 − 7| = 2</text>
    <text x="400" y="280" fill="#888">合计 11</text>
  </g>
  <text filter="url(#rough2)" x="40" y="306" font-size="10.8" fill="#3a5a30">cost₁ = k + 11 = 2 + 11 = 13</text>

  <path d="M 200 318 L 200 336" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="28" y="340" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="280" y="360" text-anchor="middle" font-size="12.2" fill="#8a6a20" font-weight="bold">答案 = min(35, 13) = 13</text>
  <text filter="url(#rough2)" x="280" y="376" text-anchor="middle" font-size="10.2" fill="#666">示例 2：[2,1] 与 [2,1]，k = 0 ⇒ cost₀ = 0，cost₁ = 0 + 0 = 0，答案 0</text>
</svg>
