<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="540" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：每一步都抬最矮的柱子</text>
  <path d="M 170 40 Q 350 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="350" y="60" text-anchor="middle" font-size="11.5" fill="#666">上排：示例 1 [0, 4], k = 5（0 最先被消除）· 下排：补充示例 [10, 4, 4], k = 3（贪心 300 vs 全砸一个 280）</text>

  <!-- ===== Panel A: example 1, nums=[0,4], k=5 ===== -->
  <text x="350" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">示例 1：nums = [0, 4]，k = 5 —— 0 最先被消除，再逐次抬平</text>

  <!-- baseline A -->
  <path d="M 70 224 Q 350 231 600 224" stroke="#999" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- s0: [0,4] -->
  <g filter="url(#sk2)">
    <rect x="80" y="216" width="16" height="8" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="104" y="192" width="16" height="32" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="88" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">0</text>
  <text x="112" y="187" text-anchor="middle" font-size="11" fill="#2b4a6e">4</text>
  <text x="100" y="240" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">[0,4]</text>
  <text x="100" y="256" text-anchor="middle" font-size="10" fill="#d6a040">剩5</text>
  <path d="M 126 210 L 158 210" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- s1: [1,4] -->
  <g filter="url(#sk2)">
    <rect x="170" y="216" width="16" height="8" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="194" y="192" width="16" height="32" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="178" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a15">1</text>
  <text x="202" y="187" text-anchor="middle" font-size="11" fill="#2b4a6e">4</text>
  <text x="190" y="240" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">[1,4]</text>
  <text x="190" y="256" text-anchor="middle" font-size="10" fill="#d6a040">剩4</text>
  <path d="M 216 210 L 248 210" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- s2: [2,4] -->
  <g filter="url(#sk2)">
    <rect x="260" y="208" width="16" height="16" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="284" y="192" width="16" height="32" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="268" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a15">2</text>
  <text x="292" y="187" text-anchor="middle" font-size="11" fill="#2b4a6e">4</text>
  <text x="280" y="240" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">[2,4]</text>
  <text x="280" y="256" text-anchor="middle" font-size="10" fill="#d6a040">剩3</text>
  <path d="M 306 210 L 338 210" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- s3: [3,4] -->
  <g filter="url(#sk2)">
    <rect x="350" y="200" width="16" height="24" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="374" y="192" width="16" height="32" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="358" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a15">3</text>
  <text x="382" y="187" text-anchor="middle" font-size="11" fill="#2b4a6e">4</text>
  <text x="370" y="240" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">[3,4]</text>
  <text x="370" y="256" text-anchor="middle" font-size="10" fill="#d6a040">剩2</text>
  <path d="M 396 210 L 428 210" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- s4: [4,4] -->
  <g filter="url(#sk2)">
    <rect x="440" y="192" width="16" height="32" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="464" y="192" width="16" height="32" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="448" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a15">4</text>
  <text x="472" y="187" text-anchor="middle" font-size="11" fill="#2b4a6e">4</text>
  <text x="460" y="240" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">[4,4]</text>
  <text x="460" y="256" text-anchor="middle" font-size="10" fill="#d6a040">剩1</text>
  <path d="M 486 210 L 518 210" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- s5: [5,4] -->
  <g filter="url(#sk2)">
    <rect x="530" y="184" width="16" height="40" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="554" y="192" width="16" height="32" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="538" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a15">5</text>
  <text x="562" y="187" text-anchor="middle" font-size="11" fill="#2b4a6e">4</text>
  <text x="550" y="240" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">[5,4]</text>
  <text x="550" y="256" text-anchor="middle" font-size="10" fill="#d6a040">剩0</text>

  <!-- result A -->
  <text x="350" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">先消 0（乘积从 0 变正），随后每次抬当前最小 → 最终 [5, 4]，乘积 5 × 4 = 20</text>

  <!-- ===== Panel B: [10,4,4], k=3 ===== -->
  <text x="350" y="310" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">补充示例：nums = [10, 4, 4]，k = 3 —— 逐次给当前最小 vs 一股脑全给一个</text>

  <!-- baseline B -->
  <path d="M 40 424 Q 350 430 665 424" stroke="#999" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- greedy s0: [4,4,10] -->
  <g filter="url(#sk2)">
    <rect x="56" y="404" width="15" height="20" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="76" y="404" width="15" height="20" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="96" y="374" width="15" height="50" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="63" y="400" text-anchor="middle" font-size="10.5" fill="#2b4a6e">4</text>
  <text x="83" y="400" text-anchor="middle" font-size="10.5" fill="#2b4a6e">4</text>
  <text x="103" y="370" text-anchor="middle" font-size="10.5" fill="#2b4a6e">10</text>
  <text x="85" y="440" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">[4,4,10]</text>
  <text x="85" y="456" text-anchor="middle" font-size="10" fill="#d6a040">剩3</text>
  <path d="M 118 400 L 147 400" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- greedy s1: [4,5,10] -->
  <g filter="url(#sk2)">
    <rect x="151" y="404" width="15" height="20" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="171" y="399" width="15" height="25" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="191" y="374" width="15" height="50" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="158" y="400" text-anchor="middle" font-size="10.5" fill="#2b4a6e">4</text>
  <text x="178" y="395" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a6a15">5</text>
  <text x="198" y="370" text-anchor="middle" font-size="10.5" fill="#2b4a6e">10</text>
  <text x="180" y="440" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">[4,5,10]</text>
  <text x="180" y="456" text-anchor="middle" font-size="10" fill="#d6a040">剩2</text>
  <path d="M 213 400 L 242 400" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- greedy s2: [5,5,10] -->
  <g filter="url(#sk2)">
    <rect x="246" y="399" width="15" height="25" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="266" y="399" width="15" height="25" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="286" y="374" width="15" height="50" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="253" y="395" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a6a15">5</text>
  <text x="273" y="395" text-anchor="middle" font-size="10.5" fill="#2b4a6e">5</text>
  <text x="293" y="370" text-anchor="middle" font-size="10.5" fill="#2b4a6e">10</text>
  <text x="275" y="440" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">[5,5,10]</text>
  <text x="275" y="456" text-anchor="middle" font-size="10" fill="#d6a040">剩1</text>
  <path d="M 308 400 L 337 400" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- greedy s3: [5,6,10] -->
  <g filter="url(#sk2)">
    <rect x="341" y="399" width="15" height="25" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="361" y="394" width="15" height="30" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="381" y="374" width="15" height="50" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="348" y="395" text-anchor="middle" font-size="10.5" fill="#2b4a6e">5</text>
  <text x="368" y="390" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a6a15">6</text>
  <text x="388" y="370" text-anchor="middle" font-size="10.5" fill="#2b4a6e">10</text>
  <text x="370" y="440" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">[5,6,10]</text>
  <text x="370" y="456" text-anchor="middle" font-size="10" fill="#d6a040">剩0</text>

  <!-- divider -->
  <path d="M 433 322 Q 437 370 433 412" stroke="#bbb" stroke-width="1.3" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <text x="433" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">vs</text>

  <!-- counter s0: [4,4,10] -->
  <g filter="url(#sk2)">
    <rect x="471" y="404" width="15" height="20" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="491" y="404" width="15" height="20" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="511" y="374" width="15" height="50" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="478" y="400" text-anchor="middle" font-size="10.5" fill="#2b4a6e">4</text>
  <text x="498" y="400" text-anchor="middle" font-size="10.5" fill="#2b4a6e">4</text>
  <text x="518" y="370" text-anchor="middle" font-size="10.5" fill="#2b4a6e">10</text>
  <text x="500" y="440" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">[4,4,10]</text>
  <text x="500" y="456" text-anchor="middle" font-size="10" fill="#d6a040">剩3</text>

  <!-- counter arrow -->
  <path d="M 530 400 L 568 400" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="549" y="388" text-anchor="middle" font-size="9.5" fill="#b85450">+3 全给同一个</text>

  <!-- counter s1: [4,7,10] -->
  <g filter="url(#sk2)">
    <rect x="576" y="404" width="15" height="20" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="596" y="389" width="15" height="35" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="616" y="374" width="15" height="50" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="583" y="400" text-anchor="middle" font-size="10.5" fill="#2b4a6e">4</text>
  <text x="603" y="385" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">7</text>
  <text x="623" y="370" text-anchor="middle" font-size="10.5" fill="#2b4a6e">10</text>
  <text x="605" y="440" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">[4,7,10]</text>
  <text x="605" y="456" text-anchor="middle" font-size="10" fill="#d6a040">剩0</text>

  <!-- results B -->
  <text x="227" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">贪心：5 × 6 × 10 = 300 ✓</text>
  <text x="545" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">全砸一个：4 × 7 × 10 = 280 ✗</text>

  <!-- bottom note -->
  <g filter="url(#sk2)">
    <rect x="70" y="494" width="560" height="36" rx="8" fill="#f4f7fb" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="350" y="509" text-anchor="middle" font-size="11.5" fill="#2b4a6e">贪心的「最小」是动态的：每压回一个 x+1，堆顶可能易主——增量像水位把矮柱逐层抬平。</text>
  <text x="350" y="525" text-anchor="middle" font-size="11.5" fill="#8a3a36">一次性把 k 全砸给初始最小值会错过均衡（280 &lt; 300）——这是本题最高频的错误贪心。</text>
</svg>
