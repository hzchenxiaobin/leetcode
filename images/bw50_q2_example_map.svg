<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 复盘：三个点几乎全在圆周上（边界必须计入）</text>

  <!-- 网格 -->
  <g filter="url(#rough2)" stroke="#d8d8d8" stroke-width="1">
    <line x1="80" y1="320" x2="350" y2="320"/>
    <line x1="80" y1="275" x2="350" y2="275"/>
    <line x1="80" y1="230" x2="350" y2="230"/>
    <line x1="80" y1="185" x2="350" y2="185"/>
    <line x1="80" y1="140" x2="350" y2="140"/>
    <line x1="80" y1="95"  x2="350" y2="95"/>
    <line x1="80"  y1="95" x2="80"  y2="320"/>
    <line x1="125" y1="95" x2="125" y2="320"/>
    <line x1="170" y1="95" x2="170" y2="320"/>
    <line x1="215" y1="95" x2="215" y2="320"/>
    <line x1="260" y1="95" x2="260" y2="320"/>
    <line x1="305" y1="95" x2="305" y2="320"/>
    <line x1="350" y1="95" x2="350" y2="320"/>
  </g>
  <line x1="80" y1="320" x2="360" y2="320" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
  <line x1="80" y1="320" x2="80" y2="88" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="80" y="336">0</text><text x="125" y="336">1</text><text x="170" y="336">2</text>
    <text x="215" y="336">3</text><text x="260" y="336">4</text><text x="305" y="336">5</text>
    <text x="68" y="324">0</text><text x="68" y="279">1</text><text x="68" y="234">2</text>
    <text x="68" y="189">3</text><text x="68" y="144">4</text><text x="68" y="99">5</text>
  </g>

  <!-- 三个圆 -->
  <circle cx="170" cy="185" r="45" fill="#4a7a3a" fill-opacity="0.12" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="260" cy="185" r="45" fill="#b85450" fill-opacity="0.10" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="125" cy="275" r="90" fill="#446688" fill-opacity="0.08" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 四个点 -->
  <g filter="url(#rough2)">
    <circle cx="125" cy="185" r="7" fill="#333"/>
    <circle cx="215" cy="185" r="7" fill="#333"/>
    <circle cx="305" cy="185" r="7" fill="#333"/>
    <circle cx="170" cy="230" r="7" fill="#333"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="125" y="172">(1,3)</text>
    <text x="215" y="172">(3,3)</text>
    <text x="305" y="172">(5,3)</text>
    <text x="196" y="243">(2,2)</text>
  </g>

  <!-- 圆标注 -->
  <g filter="url(#rough2)" font-size="12" font-weight="bold">
    <text x="170" y="128" fill="#2d5a22" text-anchor="middle">绿圆 (2,3,1) → 3 个点</text>
    <text x="262" y="128" fill="#8a3a34" text-anchor="middle">红圆 (4,3,1) → 2 个点</text>
    <text x="150" y="350" fill="#2b4a66" text-anchor="middle">蓝圆 (1,1,2) → 2 个点</text>
  </g>

  <!-- 要点 -->
  <rect x="400" y="160" width="140" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#7a5c1e" text-anchor="middle">
    <text x="470" y="184">绿圆覆盖的 3 点</text>
    <text x="470" y="202">距离平方都 = 1 = r²</text>
    <text x="470" y="226" fill="#b85450" font-weight="bold">全部恰在圆周上！</text>
    <text x="470" y="250">所以必须用 ≤</text>
  </g>

  <rect x="400" y="286" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="470" y="305" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">answer = [3, 2, 2]</text>
  <text x="470" y="322" text-anchor="middle" font-size="11" fill="#2d5a22" filter="url(#rough2)">与官方输出一致 ✓</text>
</svg>
