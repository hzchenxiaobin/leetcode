<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="560" fill="#fdfcf7"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：命中即返回 vs 全程无解</text>
  <path d="M 170 42 Q 360 50 550 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel 1: example 1, hit -->
  <text x="70" y="74" font-size="12.5" font-weight="bold" fill="#2b2b2b">示例 1：nums = [5, 1, 4, 1]，D = 2，V = 4 —— 按字典序检查数对</text>
  <g filter="url(#sk)">
    <rect x="120" y="90" width="64" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="184" y="90" width="64" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="248" y="90" width="64" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="312" y="90" width="64" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="152" y="118" text-anchor="middle" font-size="15" fill="#333">5</text>
  <text x="216" y="118" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="280" y="118" text-anchor="middle" font-size="15" fill="#333">4</text>
  <text x="344" y="118" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="152" y="150" text-anchor="middle" font-size="11" fill="#888">i = 0</text>
  <text x="216" y="150" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="344" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">j = 3</text>

  <path d="M 148 140 Q 212 182 276 140" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="212" y="180" text-anchor="middle" font-size="11" fill="#b85450">(0,2)：|5−4| = 1 &lt; 4 ✗</text>
  <path d="M 156 148 Q 250 222 340 144" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">(0,3)：|5−1| = 4 ≥ 4 ✓</text>

  <g filter="url(#sk)">
    <rect x="470" y="86" width="220" height="84" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="486" y="110" font-size="11" fill="#444">第 1 检查 (0,2)：✗ → 继续</text>
  <text x="486" y="132" font-size="11" fill="#444">第 2 检查 (0,3)：✓ 命中</text>
  <text x="486" y="156" font-size="12" font-weight="bold" fill="#2e6e2e">→ 返回 [0, 3]</text>

  <!-- Panel 2: example 3, no solution -->
  <text x="70" y="238" font-size="12.5" font-weight="bold" fill="#2b2b2b">示例 3：nums = [1, 2, 3]，D = 2，V = 4 —— 唯一数对不达标</text>
  <g filter="url(#sk)">
    <rect x="120" y="254" width="64" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="184" y="254" width="64" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="248" y="254" width="64" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="152" y="282" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="216" y="282" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="280" y="282" text-anchor="middle" font-size="15" fill="#333">3</text>
  <text x="152" y="314" text-anchor="middle" font-size="11" fill="#888">i = 0</text>
  <text x="216" y="314" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">j = 2</text>

  <path d="M 148 304 Q 216 346 276 304" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="216" y="344" text-anchor="middle" font-size="11" fill="#b85450">(0,2)：|1−3| = 2 &lt; 4 ✗</text>
  <text x="70" y="372" font-size="10.5" fill="#666">此后 i = 1、2 时 i + D ≥ n，内层区间为空 → 扫描全程结束</text>

  <g filter="url(#sk)">
    <rect x="470" y="250" width="220" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="486" y="274" font-size="11" fill="#444">唯一检查 (0,2)：✗</text>
  <text x="486" y="296" font-size="11" fill="#444">内层空转，无对可查</text>
  <text x="486" y="320" font-size="12" font-weight="bold" fill="#b85450">→ 返回 [−1, −1]</text>

  <!-- Panel 3: example 2, i = j -->
  <text x="70" y="410" font-size="12.5" font-weight="bold" fill="#2b2b2b">示例 2：nums = [2, 1]，D = 0，V = 0 —— i = j 的边界</text>
  <g filter="url(#sk)">
    <rect x="120" y="426" width="64" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="184" y="426" width="64" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="152" y="454" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="216" y="454" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="152" y="486" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8edb">i = j = 0</text>
  <text x="216" y="486" text-anchor="middle" font-size="11" fill="#888">1</text>

  <path d="M 134 472 C 110 510, 194 510, 170 472" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="152" y="524" text-anchor="middle" font-size="11" fill="#2e6e2e">(0,0)：|2−2| = 0 ≥ 0 ✓ → 返回 [0, 0]</text>

  <g filter="url(#sk)">
    <rect x="470" y="420" width="220" height="94" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="486" y="444" font-size="10.8" fill="#444">D = 0 时 j 从 i + 0 = i 起步，</text>
  <text x="486" y="464" font-size="10.8" fill="#444">i = j 的合法情形被天然覆盖；</text>
  <text x="486" y="484" font-size="10.8" fill="#444">V = 0 时首个检查 (0,0) 即命中。</text>
  <text x="486" y="506" font-size="10.8" font-weight="bold" fill="#2e6e2e">→ 返回 [0, 0]，无需任何特判</text>

  <text x="360" y="548" text-anchor="middle" font-size="10.5" fill="#888">检查按字典序 (i, j) 进行，命中即返回 —— 题目只要任意一组解。</text>
</svg>
