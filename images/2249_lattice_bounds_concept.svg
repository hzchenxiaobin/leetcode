<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：值域封顶 + 整数判定</text>
  <path d="M 185 42 Q 330 50 475 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: grid + circle (2,2,2) -->
  <text x="170" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">圆 (x, y, r) = (2, 2, 2) 的格点覆盖</text>
  <text x="74" y="104" text-anchor="start" font-size="10" fill="#8a6415" filter="url(#sk)">← 圆最左 x−r = 0，刚好贴住 y 轴</text>
  <g filter="url(#sk)" stroke="#b9b9b9" stroke-width="1">
    <line x1="70" y1="110" x2="70" y2="310"/>
    <line x1="110" y1="110" x2="110" y2="310"/>
    <line x1="150" y1="110" x2="150" y2="310"/>
    <line x1="190" y1="110" x2="190" y2="310"/>
    <line x1="230" y1="110" x2="230" y2="310"/>
    <line x1="270" y1="110" x2="270" y2="310"/>
    <line x1="70" y1="110" x2="270" y2="110"/>
    <line x1="70" y1="150" x2="270" y2="150"/>
    <line x1="70" y1="190" x2="270" y2="190"/>
    <line x1="70" y1="230" x2="270" y2="230"/>
    <line x1="70" y1="270" x2="270" y2="270"/>
    <line x1="70" y1="310" x2="270" y2="310"/>
  </g>
  <g font-size="10" fill="#999999">
    <text x="70" y="326" text-anchor="middle">0</text>
    <text x="110" y="326" text-anchor="middle">1</text>
    <text x="150" y="326" text-anchor="middle">2</text>
    <text x="190" y="326" text-anchor="middle">3</text>
    <text x="230" y="326" text-anchor="middle">4</text>
    <text x="270" y="326" text-anchor="middle">5</text>
    <text x="60" y="114" text-anchor="middle">5</text>
    <text x="60" y="154" text-anchor="middle">4</text>
    <text x="60" y="194" text-anchor="middle">3</text>
    <text x="60" y="234" text-anchor="middle">2</text>
    <text x="60" y="274" text-anchor="middle">1</text>
    <text x="60" y="314" text-anchor="middle">0</text>
  </g>
  <path d="M 150,150 C 195,150 230,190 230,230 C 230,270 195,310 150,310 C 105,310 70,270 70,230 C 70,190 105,150 150,150 Z"
        fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="2.2" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <path d="M 105,305 L 115,315 M 115,305 L 105,315" stroke="#b85450" stroke-width="2"/>
    <path d="M 65,265 L 75,275 M 75,265 L 65,275" stroke="#b85450" stroke-width="2"/>
    <path d="M 225,265 L 235,275 M 235,265 L 225,275" stroke="#b85450" stroke-width="2"/>
    <path d="M 225,185 L 235,195 M 235,185 L 225,195" stroke="#b85450" stroke-width="2"/>
    <path d="M 185,145 L 195,155 M 195,145 L 185,155" stroke="#b85450" stroke-width="2"/>
    <path d="M 105,145 L 115,155 M 115,145 L 105,155" stroke="#b85450" stroke-width="2"/>
    <path d="M 65,185 L 75,195 M 75,185 L 65,195" stroke="#b85450" stroke-width="2"/>
  </g>
  <g filter="url(#sk)" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8">
    <circle cx="150" cy="310" r="4.5"/>
    <circle cx="110" cy="270" r="4.5"/>
    <circle cx="150" cy="270" r="4.5"/>
    <circle cx="190" cy="270" r="4.5"/>
    <circle cx="70" cy="230" r="4.5"/>
    <circle cx="110" cy="230" r="4.5"/>
    <circle cx="150" cy="230" r="4.5"/>
    <circle cx="190" cy="230" r="4.5"/>
    <circle cx="230" cy="230" r="4.5"/>
    <circle cx="110" cy="190" r="4.5"/>
    <circle cx="150" cy="190" r="4.5"/>
    <circle cx="190" cy="190" r="4.5"/>
    <circle cx="150" cy="150" r="4.5"/>
  </g>
  <text x="170" y="350" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">绿点 = 圆内格点（13 个），红 × = 圆外近邻</text>
  <path d="M 280 235 Q 312 208 316 172" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- right panel: observation boxes -->
  <g filter="url(#sk)">
    <rect x="320" y="62" width="318" height="122" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="337" y="86" text-anchor="start" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk)">观察 A：候选空间封顶</text>
  <g font-size="12" fill="#333">
    <text x="337" y="110" filter="url(#sk)">r ≤ min(x, y) ⇒ 圆最左端 x−r ≥ 0</text>
    <text x="337" y="130" filter="url(#sk)">且 x + r ≤ 100 + 100 = 200（y 同理）</text>
    <text x="337" y="150" filter="url(#sk)">⇒ 覆盖格点全在 [0, 200]² 内</text>
    <text x="337" y="172" font-weight="bold" fill="#446688" filter="url(#sk)">候选仅 201×201 = 40401 个</text>
  </g>
  <g filter="url(#sk)">
    <rect x="320" y="200" width="318" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="337" y="224" text-anchor="start" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">观察 B：整数平方判定</text>
  <g font-size="12" fill="#333">
    <text x="337" y="248" filter="url(#sk)">在圆内（含周界）⇔ (px−x)² + (py−y)² ≤ r²</text>
    <text x="337" y="268" filter="url(#sk)">三项都是 ≤ 4×10⁴ 的整数，无浮点误差</text>
    <text x="337" y="290" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">题目说周界也算 ⇒ 用 ≤，不是 &lt;</text>
  </g>

  <!-- bottom strip -->
  <g filter="url(#sk)">
    <rect x="40" y="366" width="610" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="345" y="386" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">几何计数第一件事：算值域 —— 坐标 ≤ 100、半径 ≤ 100 ⇒ 201×201 布尔矩阵装下全部答案</text>
  <text x="345" y="406" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#sk)">哈希集合去重可以换成矩阵置位；r ≤ min(x, y) 还保证了矩阵下标不为负</text>
</svg>
