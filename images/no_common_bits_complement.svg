<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="470" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：没有公共位 = 搭档的全部 1 落在 ~x 的自由位上</text>
  <path d="M 200 42 Q 470 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- bit 列头 -->
  <text x="287" y="66" text-anchor="middle" font-size="11" fill="#999">bit7</text>
  <text x="353" y="66" text-anchor="middle" font-size="11" fill="#999">bit6</text>
  <text x="419" y="66" text-anchor="middle" font-size="11" fill="#999">bit5</text>
  <text x="485" y="66" text-anchor="middle" font-size="11" fill="#999">bit4</text>
  <text x="551" y="66" text-anchor="middle" font-size="11" fill="#999">bit3</text>
  <text x="617" y="66" text-anchor="middle" font-size="11" fill="#999">bit2</text>
  <text x="683" y="66" text-anchor="middle" font-size="11" fill="#999">bit1</text>
  <text x="749" y="66" text-anchor="middle" font-size="11" fill="#999">bit0</text>

  <!-- 行 1：x = 102 = 01100110 -->
  <text x="60" y="98" font-size="14" font-weight="bold" fill="#2b6e9e">x = 102</text>
  <text x="60" y="116" font-size="10" fill="#999">选定的数</text>
  <g filter="url(#sk)">
    <rect x="258" y="80" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="324" y="80" width="58" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="390" y="80" width="58" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="456" y="80" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="522" y="80" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="588" y="80" width="58" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="654" y="80" width="58" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="720" y="80" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
  </g>
  <text x="287" y="105" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="353" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="419" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="485" y="105" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="551" y="105" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="617" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="683" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="749" y="105" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="800" y="104" font-size="12" fill="#888">值 = 掩码</text>

  <!-- 行 2：~x = 153 = 10011001 -->
  <text x="60" y="166" font-size="14" font-weight="bold" fill="#7a5415">~x = 153</text>
  <text x="60" y="184" font-size="10" fill="#999">8 位内取反</text>
  <g filter="url(#sk)">
    <rect x="258" y="148" width="58" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="324" y="148" width="58" height="40" rx="4" fill="#f2f2f2" stroke="#d5d5d5" stroke-width="1.3"/>
    <rect x="390" y="148" width="58" height="40" rx="4" fill="#f2f2f2" stroke="#d5d5d5" stroke-width="1.3"/>
    <rect x="456" y="148" width="58" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="522" y="148" width="58" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="588" y="148" width="58" height="40" rx="4" fill="#f2f2f2" stroke="#d5d5d5" stroke-width="1.3"/>
    <rect x="654" y="148" width="58" height="40" rx="4" fill="#f2f2f2" stroke="#d5d5d5" stroke-width="1.3"/>
    <rect x="720" y="148" width="58" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="287" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">1</text>
  <text x="353" y="173" text-anchor="middle" font-size="15" fill="#c8c8c8">0</text>
  <text x="419" y="173" text-anchor="middle" font-size="15" fill="#c8c8c8">0</text>
  <text x="485" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">1</text>
  <text x="551" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">1</text>
  <text x="617" y="173" text-anchor="middle" font-size="15" fill="#c8c8c8">0</text>
  <text x="683" y="173" text-anchor="middle" font-size="15" fill="#c8c8c8">0</text>
  <text x="749" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">1</text>
  <text x="800" y="172" font-size="12" fill="#7a5415">橙色 = 自由位</text>

  <!-- 绿色小箭头：y 的 1 对准自由位 -->
  <path d="M 485 213 L 485 193" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 551 213 L 551 193" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 749 213 L 749 193" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- 行 3：y = 25 = 00011001 -->
  <text x="60" y="234" font-size="14" font-weight="bold" fill="#2e6e2e">y = 25</text>
  <text x="60" y="252" font-size="10" fill="#999">合法搭档</text>
  <g filter="url(#sk)">
    <rect x="258" y="216" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="324" y="216" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="390" y="216" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="456" y="216" width="58" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="522" y="216" width="58" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="588" y="216" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="654" y="216" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="720" y="216" width="58" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="287" y="241" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="353" y="241" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="419" y="241" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="485" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="551" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="617" y="241" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="683" y="241" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="749" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="800" y="240" font-size="12" font-weight="bold" fill="#2e6e2e">1 全在自由位 ✓</text>

  <!-- 红色车道线：bit6 冲突 -->
  <path d="M 320 282 L 320 124" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" fill="none" opacity="0.65" filter="url(#sk)"/>

  <!-- 行 4：y' = 89 = 01011001 -->
  <text x="60" y="302" font-size="14" font-weight="bold" fill="#8c3a36">y′ = 89</text>
  <text x="60" y="320" font-size="10" fill="#999">非法搭档</text>
  <g filter="url(#sk)">
    <rect x="258" y="284" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="324" y="284" width="58" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="390" y="284" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="456" y="284" width="58" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="522" y="284" width="58" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="588" y="284" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="654" y="284" width="58" height="40" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="720" y="284" width="58" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="287" y="309" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="353" y="309" text-anchor="middle" font-size="15" font-weight="bold" fill="#8c3a36">1</text>
  <text x="419" y="309" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="485" y="309" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="551" y="309" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="617" y="309" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="683" y="309" text-anchor="middle" font-size="15" fill="#b0b8c2">0</text>
  <text x="749" y="309" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="800" y="308" font-size="12" font-weight="bold" fill="#b85450">bit6 撞上 x 的 1 ✗</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="60" y="352" width="820" height="94" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="80" y="380" font-size="14" font-weight="bold" fill="#2e6e2e">结论：y &amp; x = 0 ⟺ y ⊆ ~x（图中以 8 位演示，题目实际 20 位）</text>
  <text x="80" y="406" font-size="13" fill="#333">预处理 f[m] := 掩码 ⊆ m 的最大元素，则 x 的最优搭档 = f[~x]，每次查询 O(1)</text>
  <text x="80" y="430" font-size="13" fill="#333">nums[i] ≤ 10⁶ &lt; 2²⁰，状态仅 2²⁰ ≈ 1.05×10⁶ 个 —— 与 n 同阶，可整体预处理</text>
</svg>
