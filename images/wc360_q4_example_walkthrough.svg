<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1：receiver = [2,0,1]，k = 4，从 x = 2 出发</text>

  <!-- 左上：三环图 -->
  <circle cx="70" cy="76" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="81" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>

  <circle cx="150" cy="62" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="150" cy="62" r="21" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="150" y="67" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">2</text>

  <circle cx="108" cy="128" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="133" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>

  <path d="M 85,71 Q 112,60 134,59" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 143,74 Q 130,96 120,113" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 97,117 Q 84,104 79,94" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="106" y="164" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">环：0 → 2 → 1 → 0</text>
  <text x="176" y="94" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">起点 x=2</text>

  <!-- 右上：落脚点序列 -->
  <text x="383" y="48" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">k+1 = 5 个落脚点（重复计次）</text>

  <rect x="205" y="56" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="233" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <rect x="268" y="56" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="296" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="331" y="56" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="359" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <rect x="394" y="56" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <rect x="457" y="56" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <text x="233" y="104" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">t=0</text>
  <text x="296" y="104" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">t=1</text>
  <text x="359" y="104" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">t=2</text>
  <text x="422" y="104" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">t=3</text>
  <text x="485" y="104" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">t=4</text>

  <text x="233" y="122" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="296" y="122" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="359" y="122" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="422" y="122" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">5</text>
  <text x="485" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="380" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f(2) = 2+1+0+2+1 = 6</text>

  <!-- 左中：倍增表（sum 与 nxt 并排） -->
  <text x="196" y="172" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">倍增表（n = 3）</text>

  <text x="138" y="190" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">sum[j]（和）</text>
  <text x="294" y="190" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">nxt[j]（落点）</text>

  <text x="90" y="205" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="138" y="205" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="186" y="205" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="246" y="205" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="294" y="205" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="342" y="205" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>

  <!-- j=0 -->
  <rect x="66" y="212" width="48" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="114" y="212" width="48" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="138" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="162" y="212" width="48" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="186" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="222" y="212" width="48" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="246" y="228" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="270" y="212" width="48" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="294" y="228" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="318" y="212" width="48" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="342" y="228" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="48" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">j=0</text>

  <!-- j=1 -->
  <rect x="66" y="248" width="48" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="264" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="114" y="248" width="48" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="138" y="264" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="162" y="248" width="48" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="186" y="264" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="222" y="248" width="48" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="246" y="264" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="270" y="248" width="48" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="294" y="264" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="318" y="248" width="48" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="342" y="264" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0</text>
  <text x="48" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">j=1</text>

  <!-- j=2（含高亮） -->
  <rect x="66" y="284" width="48" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="300" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="114" y="284" width="48" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="138" y="300" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <rect x="162" y="284" width="48" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="186" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="222" y="284" width="48" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="246" y="300" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="270" y="284" width="48" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="294" y="300" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="318" y="284" width="48" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="342" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="48" y="300" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">j=2</text>

  <!-- 右侧：查询步骤 -->
  <rect x="402" y="176" width="150" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="477" y="195" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k = 4 = 100₂</text>
  <path d="M 477,204 L 477,214" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="402" y="218" width="150" height="26" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="477" y="236" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">bit 0 = 0：跳过</text>
  <path d="M 477,244 L 477,254" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="402" y="258" width="150" height="26" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="477" y="276" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">bit 1 = 0：跳过</text>
  <path d="M 477,284 L 477,294" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="398" y="298" width="158" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="477" y="315" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">bit 2 = 1：ans += sum[2][2] = 5</text>
  <text x="477" y="332" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">cur = nxt[2][2] = 1</text>
  <path d="M 477,342 L 477,352" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="398" y="356" width="158" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="477" y="375" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">k 归零：ans += cur → 6</text>

  <!-- 底部：各起点对比 -->
  <rect x="40" y="382" width="110" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="402" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">f(0) = 5</text>

  <rect x="170" y="382" width="110" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="402" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">f(1) = 4</text>

  <rect x="300" y="382" width="110" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="355" y="402" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">f(2) = 6 ✓</text>
</svg>
