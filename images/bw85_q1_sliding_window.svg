<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">定长滑窗：窗口右移一格，白色数只差“一进一出”</text>

  <!-- 窗口 t：[0,7) -->
  <text x="70" y="72" font-size="13.5" fill="#333" filter="url(#rough2)">窗口 A = [0, 7)：</text>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <rect x="196" y="52" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="236" y="52" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="276" y="52" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="316" y="52" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="356" y="52" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="396" y="52" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="436" y="52" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="216" y="74" fill="#b85450" font-weight="bold">W</text>
    <text x="256" y="74" fill="#1a2b45">B</text>
    <text x="296" y="74" fill="#1a2b45">B</text>
    <text x="336" y="74" fill="#b85450" font-weight="bold">W</text>
    <text x="376" y="74" fill="#b85450" font-weight="bold">W</text>
    <text x="416" y="74" fill="#1a2b45">B</text>
    <text x="456" y="74" fill="#1a2b45">B</text>
  </g>
  <text x="490" y="74" font-size="13" fill="#b85450" filter="url(#rough2)">3 白</text>

  <!-- 转移箭头 -->
  <path d="M 280 96 L 280 124" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="300" y="114" font-size="12" fill="#446688" filter="url(#rough2)">右移一格：i 离开、i+k 进入</text>

  <!-- 窗口 t+1：[1,8) -->
  <text x="70" y="160" font-size="13.5" fill="#333" filter="url(#rough2)">窗口 B = [1, 8)：</text>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <rect x="196" y="140" width="40" height="34" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="236" y="140" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="276" y="140" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="316" y="140" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="356" y="140" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="396" y="140" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="436" y="140" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="216" y="162" fill="#999">✕</text>
    <text x="256" y="162" fill="#1a2b45">B</text>
    <text x="296" y="162" fill="#1a2b45">B</text>
    <text x="336" y="162" fill="#b85450" font-weight="bold">W</text>
    <text x="376" y="162" fill="#b85450" font-weight="bold">W</text>
    <text x="416" y="162" fill="#1a2b45">B</text>
    <text x="456" y="162" fill="#1a2b45">B</text>
  </g>
  <text x="490" y="162" font-size="13" fill="#b85450" filter="url(#rough2)">2 白</text>

  <!-- 进出标注 -->
  <path d="M 214 100 L 214 134" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="122" font-size="11.5" fill="#b85450" filter="url(#rough2)">离开的 W：−1</text>
  <text x="470" y="132" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">进入的是 B：+0</text>

  <!-- 增量公式框 -->
  <g filter="url(#rough2)">
    <rect x="90" y="200" width="380" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="224" text-anchor="middle" font-size="14.5" fill="#1a2b45" filter="url(#rough2)">whites ← whites + (新字符是 W) − (旧字符是 W)</text>
  <text x="280" y="246" text-anchor="middle" font-size="14.5" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">每次滑动 O(1)，与 k 无关</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="70" y="284" width="420" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="310" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">答案 = 所有长度为 k 的窗口中白色个数的最小值</text>
  <text x="280" y="334" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">涂黑一个窗口恰需“窗口内白色数”次操作（不多不少）</text>
</svg>
