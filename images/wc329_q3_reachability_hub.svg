<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">可达性地图：全 0 是孤岛，所有含 1 的串连成一片</text>
  <path d="M 150 44 Q 340 52 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left island -->
  <g filter="url(#sk)">
    <rect x="36" y="86" width="176" height="150" rx="10" fill="#f4f4f4" stroke="#aab4bd" stroke-width="1.3" stroke-dasharray="5 4"/>
  </g>
  <text x="48" y="106" font-size="11" font-weight="bold" fill="#77828b">孤岛</text>
  <g filter="url(#sk)">
    <path d="M 86 120 C 78 96, 150 92, 142 118" stroke="#98a4ae" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="114" y="92" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#8a959e">(0,0)→(0,0)</text>
  <g filter="url(#sk)">
    <rect x="60" y="122" width="128" height="50" rx="6" fill="#ffffff" stroke="#98a4ae" stroke-width="1.8"/>
  </g>
  <text x="124" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#555" font-family="monospace">00 … 0</text>
  <text x="124" y="163" text-anchor="middle" font-size="10" fill="#888">全 0 串（冻结）</text>
  <text x="124" y="252" text-anchor="middle" font-size="10.5" fill="#8a959e">任何操作都无效果</text>

  <!-- gap: unreachable both ways -->
  <g filter="url(#sk)">
    <path d="M 216 140 L 256 140" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 256 164 L 216 164" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 230 146 L 242 158 M 242 146 L 230 158" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="236" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">造不出 1</text>
  <text x="236" y="182" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">清不掉 1</text>

  <!-- right continent -->
  <g filter="url(#sk)">
    <rect x="262" y="78" width="394" height="176" rx="12" fill="#eef4fb" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="7 5"/>
  </g>
  <text x="459" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a8edb">大陆 · 所有含 1 的串两两可达</text>
  <g filter="url(#sk)">
    <rect x="282" y="112" width="108" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="336" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">s = 1010</text>
  <g filter="url(#sk)">
    <rect x="398" y="150" width="134" height="48" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="465" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a15" font-family="monospace">11 … 1</text>
  <text x="465" y="188" text-anchor="middle" font-size="10" fill="#a97f33">全 1 · 枢纽中转站</text>
  <g filter="url(#sk)">
    <rect x="526" y="112" width="118" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="585" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">target = 0110</text>
  <g filter="url(#sk)">
    <path d="M 342 150 Q 380 162 412 158" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="300" y="180" font-size="10" font-weight="bold" fill="#4a7a3a" paint-order="stroke" stroke="#eef4fb" stroke-width="3">① 扩散：1 感染 0</text>
  <g filter="url(#sk)">
    <path d="M 532 172 Q 562 170 582 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="646" y="180" text-anchor="end" font-size="10" font-weight="bold" fill="#4a7a3a" paint-order="stroke" stroke="#eef4fb" stroke-width="3">② 收缩：保 1 删 0</text>
  <g filter="url(#sk)">
    <rect x="302" y="198" width="62" height="24" rx="4" fill="#ffffff" stroke="#9db8d6" stroke-width="1" opacity="0.6"/>
    <rect x="578" y="198" width="62" height="24" rx="4" fill="#ffffff" stroke="#9db8d6" stroke-width="1" opacity="0.6"/>
    <path d="M 410 196 L 345 202" stroke="#9db8d6" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
    <path d="M 520 196 L 575 202" stroke="#9db8d6" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  </g>
  <text x="333" y="214" text-anchor="middle" font-size="11" fill="#7a94b5" font-family="monospace" opacity="0.8">0010</text>
  <text x="609" y="214" text-anchor="middle" font-size="11" fill="#7a94b5" font-family="monospace" opacity="0.8">1101</text>
  <text x="459" y="246" text-anchor="middle" font-size="9.5" fill="#7a94b5">… 更多含 1 的串，都能经枢纽中转 …</text>

  <!-- decision flow -->
  <text x="340" y="280" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b">判定：一次线性扫描，O(n)</text>
  <g filter="url(#sk)">
    <rect x="36" y="294" width="140" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="106" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">s 含 '1' 吗</text>
  <g filter="url(#sk)">
    <path d="M 176 315 L 204 315" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="206" y="294" width="152" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="282" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">target 含 '1' 吗</text>
  <g filter="url(#sk)">
    <path d="M 358 315 L 386 315" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <polygon points="418,290 460,315 418,340 376,315" fill="#fff3d6" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="418" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07a15">一致？</text>
  <g filter="url(#sk)">
    <path d="M 460 315 L 494 315" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="477" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="496" y="297" width="76" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="534" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">true</text>
  <g filter="url(#sk)">
    <path d="M 418 340 L 418 364" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="428" y="358" font-size="10" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="384" y="366" width="68" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="418" y="387" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">false</text>
  <text x="340" y="418" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#555">return ('1' in s) == ('1' in target)</text>
</svg>
