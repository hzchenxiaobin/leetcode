<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="356" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">④ 样例走查：a = [6, 8, 2, 4, 1]，n = 5</text>
  <text x="320" y="50" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">对每个 M 把元素向上取整到 2^M 的倍数，F(M) = Σδ + Σf −（n − 1）·M，取最小</text>

  <g filter="url(#rough2)">
    <rect x="28" y="72" width="584" height="32" rx="6" fill="#eceff4" stroke="#8899aa" stroke-width="1.4"/>
    <rect x="28" y="104" width="584" height="32" rx="4" fill="#f5f5f0" stroke="#c8c8b8" stroke-width="1"/>
    <rect x="28" y="136" width="584" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="28" y="168" width="584" height="32" rx="4" fill="#f5f5f0" stroke="#c8c8b8" stroke-width="1"/>
    <rect x="28" y="200" width="584" height="32" rx="4" fill="#f5f5f0" stroke="#c8c8b8" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" stroke="#c8c8b8" stroke-width="1">
    <path d="M 84 72 L 84 232"/>
    <path d="M 320 72 L 320 232"/>
    <path d="M 386 72 L 386 232"/>
    <path d="M 452 72 L 452 232"/>
    <path d="M 542 72 L 542 232"/>
  </g>

  <g font-size="11.5" fill="#556" text-anchor="middle" filter="url(#rough2)">
    <text x="56" y="93" font-weight="bold">M</text>
    <text x="202" y="93" font-weight="bold">取整到 2^M 的倍数</text>
    <text x="353" y="93" font-weight="bold">Σδ</text>
    <text x="419" y="93" font-weight="bold">Σf</text>
    <text x="497" y="93" font-weight="bold">共享节省 (n−1)M</text>
    <text x="577" y="93" font-weight="bold">F(M)</text>
  </g>

  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="56" y="125">0</text>
    <text x="202" y="125">6　8　2　4　1</text>
    <text x="353" y="125">0</text>
    <text x="419" y="125">14</text>
    <text x="497" y="125">0</text>
    <text x="577" y="125">14</text>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="56" y="157" fill="#7a5a10" font-weight="bold">1</text>
    <text x="202" y="157" fill="#7a5a10">6　8　2　4　2</text>
    <text x="353" y="157" fill="#7a5a10">1</text>
    <text x="419" y="157" fill="#7a5a10">15</text>
    <text x="497" y="157" fill="#7a5a10">4</text>
    <text x="577" y="157" fill="#3a5a30" font-weight="bold">12 ★</text>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="56" y="189">2</text>
    <text x="202" y="189">8　8　4　4　4</text>
    <text x="353" y="189">7</text>
    <text x="419" y="189">17</text>
    <text x="497" y="189">8</text>
    <text x="577" y="189">16</text>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="56" y="221">3</text>
    <text x="202" y="221">8　8　8　8　8</text>
    <text x="353" y="221">19</text>
    <text x="419" y="221">20</text>
    <text x="497" y="221">12</text>
    <text x="577" y="221">27</text>
  </g>

  <g font-size="11.5" fill="#555" filter="url(#rough2)">
    <text x="32" y="256">M = 1：把 1 加成 2（花 1 步），全数组变偶，开局共享一次减半，节省 n − 1 = 4 步 —— F = 1 + 15 − 4 = 12。</text>
    <text x="32" y="276" fill="#3a5a30">这正是样例输出 12，也是所有 M 中的最小值（所以答案为 12）。</text>
    <text x="32" y="296" fill="#8a3a36">M 增大时节省按 (n − 1) 线性涨，但取整代价按 2^M 级膨胀，所以最优 M 一定很小。</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="32" y="308" width="576" height="36" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="332" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">对照：M = 0 时不许「全偶共享」，F = 14；本组数据的最优选择是 M = 1</text>
</svg>
