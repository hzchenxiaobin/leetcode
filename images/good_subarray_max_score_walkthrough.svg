  <text x="782" y="558" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">ans = 15</text>
  <g filter="url(#sk)"><rect x="40" y="622" width="860" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="60" y="644" text-anchor="start" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">最优 15 = W(3) = [1,5] 的 3×5 —— 恰在窗口首次铺满 W(3) 的第 ④ 步被记录（§5 定理）</text>
  <text x="60" y="662" text-anchor="start" font-size="10" fill="#666" filter="url(#sk)">第 ⑤ 步 mn 暴跌后分数回落，但贪心无需回头：ans 已锁定历史峰值</text>
</svg>
