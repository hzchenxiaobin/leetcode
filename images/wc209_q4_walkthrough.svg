<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="47"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：n = 6 = 110₂ 沿链 4 步归零</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">橙色 = 本步刚翻转的位；操作 2 的每一步都必须先凑出低位 10…0₂ 的前提</text>

  <!-- 状态 1：110 -->
  <g filter="url(#r)">
    <rect x="40" y="76" width="24" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="64" y="76" width="24" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="88" y="76" width="24" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#r)">
    <text x="52" y="97">1</text><text x="76" y="97">1</text><text x="100" y="97">0</text>
  </g>
  <text x="76" y="140" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">n = 110₂</text>

  <!-- 箭头 1 -->
  <g filter="url(#r)"><line x1="114" y1="91" x2="151" y2="91" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="133" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#r)">① 操作2·翻bit2</text>
  <text x="133" y="124" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#r)">低位=10₂ ✓</text>

  <!-- 状态 2：010（bit2 刚翻转） -->
  <g filter="url(#r)">
    <rect x="155" y="76" width="24" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="179" y="76" width="24" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="203" y="76" width="24" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#r)">
    <text x="167" y="97">0</text><text x="191" y="97">1</text><text x="215" y="97">0</text>
  </g>

  <!-- 箭头 2 -->
  <g filter="url(#r)"><line x1="229" y1="91" x2="266" y2="91" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="248" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#r)">② 操作1·翻bit0</text>
  <text x="248" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">恒可用</text>

  <!-- 状态 3：011（bit0 刚翻转） -->
  <g filter="url(#r)">
    <rect x="270" y="76" width="24" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="294" y="76" width="24" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="318" y="76" width="24" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#r)">
    <text x="282" y="97">0</text><text x="306" y="97">1</text><text x="330" y="97">1</text>
  </g>

  <!-- 箭头 3 -->
  <g filter="url(#r)"><line x1="344" y1="91" x2="381" y2="91" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="363" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#r)">③ 操作2·翻bit1</text>
  <text x="363" y="124" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#r)">低位=1₂ ✓</text>

  <!-- 状态 4：001（bit1 刚翻转） -->
  <g filter="url(#r)">
    <rect x="385" y="76" width="24" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="409" y="76" width="24" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="433" y="76" width="24" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#r)">
    <text x="397" y="97">0</text><text x="421" y="97">0</text><text x="445" y="97">1</text>
  </g>

  <!-- 箭头 4 -->
  <g filter="url(#r)"><line x1="459" y1="91" x2="496" y2="91" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="478" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#r)">④ 操作1·翻bit0</text>
  <text x="478" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">恒可用</text>

  <!-- 状态 5：000（bit0 刚翻转，目标） -->
  <g filter="url(#r)">
    <rect x="500" y="76" width="24" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="524" y="76" width="24" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="548" y="76" width="24" height="30" rx="3" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#r)">
    <text x="512" y="97">0</text><text x="536" y="97">0</text><text x="560" y="97">0</text>
  </g>
  <text x="536" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">目标 0 ✓</text>

  <!-- 左下：镜像递归验证 -->
  <g filter="url(#r)"><rect x="42" y="152" width="280" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="182" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#r)">镜像递归验证</text>
  <g filter="url(#r)">
    <text x="56" y="192" font-size="10" fill="#555">f(6)：k=2，r=2 → f(6) = 2³−1 − f(2)</text>
    <text x="56" y="210" font-size="10" fill="#555">f(2)：k=1，r=0 → f(2) = 2²−1 − f(0) = 3</text>
    <text x="56" y="228" font-size="10.5" font-weight="bold" fill="#446688">∴ f(6) = 7 − 3 = 4 ✓</text>
    <text x="56" y="250" font-size="9.5" fill="#777">每剥一层最高位，答案与低位部分互补</text>
  </g>

  <!-- 右下：为什么不能再少 -->
  <g filter="url(#r)"><rect x="338" y="152" width="242" height="118" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="459" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a67c1b" filter="url(#r)">为什么不能再少？</text>
  <g filter="url(#r)">
    <text x="352" y="192" font-size="9.5" fill="#555">状态图就是 Gray 链，没有捷径</text>
    <text x="352" y="210" font-size="9.5" fill="#555">110₂ 与 000₂ 恰好相距 4 条边</text>
    <text x="352" y="228" font-size="9.5" fill="#555">每步翻哪一位由前提唯一锁定</text>
    <text x="352" y="250" font-size="9.5" font-weight="bold" fill="#a67c1b">沿链走 = 唯一最短路</text>
  </g>

  <!-- 底部横条 -->
  <g filter="url(#r)"><rect x="42" y="284" width="536" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="310" y="304" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#r)">推广：任意两态 a、b 的最少操作数 = |gray⁻¹(a) − gray⁻¹(b)|；取 b = 0 即本题答案 gray⁻¹(n)</text>
</svg>
