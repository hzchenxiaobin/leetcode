<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：words = ["abbb", "ba", "aa"]（示例 1）</text>

  <!-- 步骤 1 / 2 -->
  <rect x="36" y="54" width="230" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="151" y="76" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 全局计数：a×4，b×4</text>
  <text x="151" y="98" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">预算 Q = 2 + 2 = 4</text>

  <rect x="294" y="54" width="230" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="409" y="76" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② 词长升序：[2, 2, 4]</text>
  <text x="409" y="98" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">造价 [1, 1, 2]</text>

  <path d="M 151 110 L 151 134" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 409 110 L 409 134" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 演算表：表头 -->
  <rect x="50" y="140" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="140" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="140" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="140" width="84" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="161" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">取词（造价）</text>
  <text x="285" y="161" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">购买前 Q</text>
  <text x="385" y="161" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">购买后 Q</text>
  <text x="472" y="161" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">回文数 ans</text>

  <!-- 行 1 -->
  <rect x="50" y="172" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="172" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="172" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="172" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">L=2（造价 1）</text>
  <text x="285" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="385" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="472" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="50" y="206" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="206" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="206" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="206" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="228" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">L=2（造价 1）</text>
  <text x="285" y="228" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="385" y="228" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="472" y="228" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行 3 -->
  <rect x="50" y="240" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="240" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="240" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="240" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="262" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">L=4（造价 2）</text>
  <text x="285" y="262" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="385" y="262" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="472" y="262" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- 结论 -->
  <text x="280" y="312" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">总造价 1 + 1 + 2 = 4 = Q，预算恰好用完，三个词全部买下</text>
  <text x="280" y="338" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">一种具体分配：["aa", "aa", "bbbb"]，三个词全为回文</text>
  <text x="280" y="376" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 3 ✓ 与示例 1 一致</text>
</svg>
