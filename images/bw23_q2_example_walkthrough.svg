<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：annabelle，k = 2</text>

  <!-- 计数表 -->
  <g filter="url(#rough2)">
    <rect x="40" y="48" width="480" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <text x="280" y="74" fill="#333">a×2　n×2　b×1　e×2　l×2</text>
    <text x="280" y="100" fill="#b85450">奇计数字符只有 b → m = 1；n = 9；判定 1 ≤ 2 ≤ 9 ✓</text>
  </g>

  <!-- 构造过程：中心 + 挂对 -->
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="40"  y="140" width="98" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="158" y="140" width="98" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="276" y="140" width="98" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="394" y="140" width="98" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <text x="89"  y="158" fill="#b85450">中心 b</text>
    <text x="89"  y="176" fill="#b85450">(第 1 串)</text>
    <text x="207" y="166" fill="#8a6d1a">挂上 (a,a)</text>
    <text x="325" y="166" fill="#8a6d1a">挂上 (n,n)</text>
    <text x="443" y="158" fill="#4a7a3a">(l,l) 打底</text>
    <text x="443" y="176" fill="#4a7a3a">再挂 (e,e)</text>
  </g>
  <path d="M 138 162 L 156 162" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 256 162 L 274 162" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 374 162 L 392 162" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 结果 -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="120" y="212" width="150" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="290" y="212" width="150" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="15" filter="url(#rough2)">
    <text x="195" y="242" fill="#4a7a3a">"anbna"</text>
    <text x="365" y="242" fill="#4a7a3a">"elle"</text>
  </g>
  <text x="280" y="288" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">两个非空回文串恰好用光全部 9 个字符 → 输出 true</text>
  <text x="280" y="312" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">对照：leetcode，k=3 时 m=6 &gt; 3 → false；true，k=4 时 m=4=k=n → 四个单字符</text>
</svg>
