<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">先查询、后插入：天然保证 i &lt; j</text>

  <!-- 时间线上的四个点 -->
  <ellipse cx="80" cy="80" rx="34" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="190" cy="80" rx="34" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="300" cy="80" rx="34" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="410" cy="80" rx="34" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="80" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,2)</text>
  <text x="190" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="190" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(4,2)</text>
  <text x="300" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="300" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,3)</text>
  <text x="410" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=3</text>
  <text x="410" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(5,2)</text>

  <!-- 每步的哈希表内容 -->
  <rect x="46" y="132" width="68" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="152" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">插入后</text>
  <text x="80" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,2):1</text>
  <text x="80" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">+0</text>

  <rect x="156" y="132" width="68" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="152" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">查到 (1,2)</text>
  <text x="190" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dx=5</text>
  <text x="190" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <rect x="266" y="132" width="68" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="152" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(5,2) 未入</text>
  <text x="300" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">表 → 落空</text>
  <text x="300" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">+0</text>

  <rect x="376" y="132" width="68" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="152" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">dx=4 命中</text>
  <text x="410" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,3):1</text>
  <text x="410" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+1</text>

  <path d="M 190 128 L 190 108" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 410 128 L 410 108" stroke="#d6a040" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <rect x="36" y="226" width="448" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="252" font-size="13" fill="#333" filter="url(#rough2)">处理点 i 时，表里只有 0..i−1 的点 ⇒ 统计的是 j &lt; i 的对</text>
  <text x="56" y="274" font-size="13" fill="#333" filter="url(#rough2)">每对 (j, i) 只在处理 i 时被数一次，k=0 也不会数到自己</text>
  <text x="56" y="298" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">本例合计 0+1+0+1 = 2，与官方输出一致</text>
</svg>
