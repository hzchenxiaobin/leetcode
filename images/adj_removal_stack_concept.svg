<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="920" height="580" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">核心观察：最左可消对 = 「栈顶 × 新读入的字符」</text>
  <path d="M 280 44 Q 460 52 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <rect x="36" y="60" width="340" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="206" y="81" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#sk)">观察 ①：字母表是环，z 与 a 也相邻</text>
  <circle cx="206" cy="330" r="128" fill="none" stroke="#b8c4d4" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 206.0 202.0 A 128 128 0 0 1 236.6 205.7" stroke="#b85450" stroke-width="3.5" fill="none" filter="url(#sk)"/>
  <path d="M 146.5 216.7 A 128 128 0 0 1 175.4 205.7" stroke="#b85450" stroke-width="3.5" fill="none" filter="url(#sk)"/>
  <path d="M 175.4 205.7 A 128 128 0 0 1 206.0 202.0" stroke="#b85450" stroke-width="3.5" fill="none" filter="url(#sk)"/>
  <text x="206.0" y="206.5" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#sk)">a</text>
  <text x="236.6324050288074" y="210.21944736946534" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#sk)">b</text>
  <text x="265.4845660216024" y="221.16162871638915" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">c</text>
  <text x="290.8797002548218" y="238.69062423409906" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">d</text>
  <text x="311.34193483438804" y="261.78771241841207" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">e</text>
  <text x="325.6820790637331" y="289.11057445855545" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">f</text>
  <text x="333.0667358845509" y="319.07130492731864" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">g</text>
  <text x="333.0667358845509" y="349.9286950726813" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">h</text>
  <text x="325.6820790637331" y="379.88942554144455" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">i</text>
  <text x="311.34193483438804" y="407.21228758158793" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">j</text>
  <text x="290.87970025482184" y="430.3093757659009" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">k</text>
  <text x="265.48456602160235" y="447.83837128361085" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">l</text>
  <text x="236.6324050288074" y="458.78055263053466" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">m</text>
  <text x="206.00000000000003" y="462.5" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">n</text>
  <text x="175.36759497119266" y="458.78055263053466" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">o</text>
  <text x="146.51543397839765" y="447.83837128361085" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">p</text>
  <text x="121.1202997451782" y="430.30937576590094" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">q</text>
  <text x="100.65806516561199" y="407.21228758158793" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">r</text>
  <text x="86.31792093626692" y="379.8894255414446" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">s</text>
  <text x="78.93326411544908" y="349.9286950726813" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">t</text>
  <text x="78.93326411544908" y="319.07130492731875" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">u</text>
  <text x="86.3179209362669" y="289.11057445855545" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">v</text>
  <text x="100.65806516561203" y="261.787712418412" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">w</text>
  <text x="121.12029974517817" y="238.69062423409912" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">x</text>
  <text x="146.51543397839765" y="221.16162871638912" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#sk)">y</text>
  <text x="175.3675949711925" y="210.21944736946537" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#sk)">z</text>
  <path d="M 149.4 182.5 A 158 158 0 0 1 270.3 185.7" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arrO)" filter="url(#sk)"/>
  <text x="206" y="163" text-anchor="middle" font-size="12" fill="#c98a2b" font-weight="bold" filter="url(#sk)">z→a 环回也算相邻</text>
  <rect x="36" y="498" width="340" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="206" y="522" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#sk)">可消判定：d = |x − y|</text>
  <text x="206" y="544" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#sk)">d = 1（相邻）或 d = 25（z↔a 环回）</text>
  <rect x="408" y="60" width="470" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="643" y="81" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">观察 ②：栈内相邻对，入栈时都检查过「不可消」</text>
  <rect x="470" y="194" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="496" y="216" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#sk)">a</text>
  <rect x="470" y="160" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="496" y="182" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#sk)">d</text>
  <path d="M 452 232 L 540 232" stroke="#666" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="446" y="202" text-anchor="end" font-size="13" fill="#666" filter="url(#sk)">栈</text>
  <path d="M 524 194 Q 536 194 536 183" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="544" y="178" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#sk)">✓ |a−d| = 3，入栈时已查：不可消</text>
  <text x="722" y="150" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">新读入</text>
  <rect x="700" y="160" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="722" y="182" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#sk)">c</text>
  <path d="M 700 177 L 530 177" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="612" y="224" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#sk)">|d − c| = 1 → 可消！</text>
  <text x="612" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">弹出 d，c 不入栈（这对一起消失）</text>
  <rect x="408" y="282" width="470" height="118" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="428" y="306" text-anchor="start" font-size="11.5" fill="#444" filter="url(#sk)">· 栈只能从顶端弹出，已检查过的相邻对不会变成可消对；</text>
  <text x="428" y="330" text-anchor="start" font-size="11.5" fill="#444" filter="url(#sk)">· 栈（底→顶）= 已扫描部分的幸存字符，内部无任何可消对；</text>
  <text x="428" y="354" text-anchor="start" font-size="11.5" fill="#444" filter="url(#sk)">· 于是当前串的最左可消对若存在，只能是（栈顶，新读入的 c）</text>
  <text x="428" y="380" text-anchor="start" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#sk)">栈顶配新字符，恰是题目要删的「最左边的一对」！</text>
  <rect x="408" y="420" width="470" height="92" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="428" y="444" text-anchor="start" font-size="11.5" fill="#555" font-weight="bold" filter="url(#sk)">对照题目过程（s = "adcb"）：</text>
  <text x="428" y="466" text-anchor="start" font-size="11" fill="#666" filter="url(#sk)">题目：删最左可消对 (d,c) → "ab" → 删 (a,b) → ""</text>
  <text x="428" y="488" text-anchor="start" font-size="11" fill="#666" filter="url(#sk)">栈模拟：读 a、d 入栈 → 读 c 弹 d → 读 b 弹 a → 答案 ""</text>
</svg>
