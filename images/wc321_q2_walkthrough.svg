<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="860" height="600" fill="#fafafa"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：三个样例的双指针走查</text>
  <path d="M 280 40 Q 430 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ============ 示例 1 ============ -->
  <text x="150" y="70" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1：s = coaching，t = coding</text>

  <rect x="150" y="82" width="34" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="188" y="82" width="34" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="226" y="82" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="82" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="302" y="82" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="340" y="82" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="378" y="82" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="416" y="82" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">c</text>
  <text x="205" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">o</text>
  <text x="243" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <text x="281" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <text x="319" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">h</text>
  <text x="357" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">i</text>
  <text x="395" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">n</text>
  <text x="433" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">g</text>

  <path d="M 167 142 L 167 120" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 205 142 L 205 120" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 243 142 Q 330 122 452 104" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="460" y="102" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="150" y="144" width="34" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="188" y="144" width="34" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="226" y="144" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="264" y="144" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="302" y="144" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="340" y="144" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="167" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">c</text>
  <text x="205" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">o</text>
  <text x="243" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">d</text>
  <text x="281" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">i</text>
  <text x="319" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">n</text>
  <text x="357" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">g</text>

  <text x="300" y="202" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ t[2] = 'd'：i 从 2 扫到 7 都找不到 d ⇒ 匹配终止</text>

  <rect x="580" y="88" width="200" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="680" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">匹配 k* = 2</text>
  <text x="680" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07830" filter="url(#rough2)">追加 6 − 2 = 4 个</text>

  <!-- ============ 示例 2 ============ -->
  <text x="150" y="230" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 2：s = abcde，t = a</text>

  <rect x="150" y="242" width="34" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="188" y="242" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="226" y="242" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="242" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="302" y="242" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">a</text>
  <text x="205" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <text x="243" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <text x="281" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>
  <text x="319" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">e</text>

  <path d="M 167 302 L 167 280" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="150" y="304" width="34" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="167" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">a</text>

  <text x="250" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ t 已整体是 s 的子序列，无需追加</text>

  <rect x="580" y="272" width="200" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="680" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">匹配 k* = 1</text>
  <text x="680" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07830" filter="url(#rough2)">追加 1 − 1 = 0 个</text>

  <!-- ============ 示例 3 ============ -->
  <text x="150" y="390" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 3：s = z，t = abcde</text>

  <rect x="150" y="402" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">z</text>

  <path d="M 167 462 L 167 442" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="150" y="464" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="188" y="464" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="226" y="464" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="264" y="464" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="302" y="464" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="167" y="487" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">a</text>
  <text x="205" y="487" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">b</text>
  <text x="243" y="487" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">c</text>
  <text x="281" y="487" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">d</text>
  <text x="319" y="487" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">e</text>

  <text x="300" y="522" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ s 里只有 'z'：a、b、c、d、e 全部落空</text>

  <rect x="580" y="446" width="200" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="680" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">匹配 k* = 0</text>
  <text x="680" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07830" filter="url(#rough2)">追加 5 − 0 = 5 个</text>

  <!-- 底部说明 -->
  <rect x="100" y="540" width="660" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="566" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">贪心「能匹配就立刻匹配」永不吃亏 —— 任何推迟匹配的方案都可交换为尽早匹配（§5 引理 1）</text>
</svg>
