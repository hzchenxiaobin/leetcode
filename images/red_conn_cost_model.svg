<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：翻色「记账」—— 红点记 −sz，蓝点记 +sz</text>
  <path d="M 90 38 Q 320 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#666">翻转 u 的代价 ＝ sz(u)（以 u 为根的子树大小）。先把所有红点全部翻蓝，再逐点「记账」回来</text>

  <!-- edges of the tree -->
  <g filter="url(#sk)" stroke="#8a8a8a" stroke-width="1.6">
    <path d="M 320 100 L 218 148" fill="none"/>
    <path d="M 320 100 L 422 148" fill="none"/>
    <path d="M 218 148 L 152 206" fill="none"/>
    <path d="M 218 148 L 282 206" fill="none"/>
    <path d="M 422 148 L 362 206" fill="none"/>
    <path d="M 422 148 L 492 206" fill="none"/>
  </g>

  <!-- node 0: blue root -->
  <g filter="url(#sk)">
    <circle cx="320" cy="88" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="93" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">0</text>
  <text x="344" y="82" font-size="11" fill="#446688">sz=7</text>
  <text x="344" y="96" font-size="11.5" fill="#2b6e9e" font-weight="bold">val=+7</text>

  <!-- node 1: red -->
  <g filter="url(#sk)">
    <circle cx="218" cy="158" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="218" y="163" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="150" y="146" font-size="11" fill="#7a4040">sz=3</text>
  <text x="132" y="160" font-size="11.5" fill="#b85450" font-weight="bold">val=−3</text>

  <!-- node 2: blue -->
  <g filter="url(#sk)">
    <circle cx="422" cy="158" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="422" y="163" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="448" y="146" font-size="11" fill="#446688">sz=3</text>
  <text x="448" y="160" font-size="11.5" fill="#2b6e9e" font-weight="bold">val=+3</text>

  <!-- node 3: red leaf -->
  <g filter="url(#sk)">
    <circle cx="152" cy="216" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="152" y="221" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="86" y="212" font-size="11" fill="#7a4040">sz=1</text>
  <text x="78" y="226" font-size="11.5" fill="#b85450" font-weight="bold">val=−1</text>

  <!-- node 4: blue leaf -->
  <g filter="url(#sk)">
    <circle cx="282" cy="216" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="282" y="221" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">4</text>
  <text x="286" y="212" font-size="11" fill="#446688">sz=1</text>
  <text x="286" y="246" font-size="11.5" fill="#2b6e9e" font-weight="bold">val=+1</text>

  <!-- node 5: red leaf -->
  <g filter="url(#sk)">
    <circle cx="362" cy="216" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="362" y="221" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <text x="330" y="212" font-size="11" fill="#7a4040">sz=1</text>
  <text x="322" y="246" font-size="11.5" fill="#b85450" font-weight="bold">val=−1</text>

  <!-- node 6: red leaf -->
  <g filter="url(#sk)">
    <circle cx="492" cy="216" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="492" y="221" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <text x="516" y="212" font-size="11" fill="#7a4040">sz=1</text>
  <text x="516" y="226" font-size="11.5" fill="#b85450" font-weight="bold">val=−1</text>

  <text x="320" y="262" text-anchor="middle" font-size="11.5" fill="#888">colors ＝ BRBRBRR，根为 0（红点 {1,3,5,6}）</text>

  <!-- left info box -->
  <g filter="url(#sk)">
    <rect x="30" y="278" width="300" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="180" y="300" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">总代价 ＝ base ＋ Σ (u∈S) val(u)</text>
  <text x="180" y="322" text-anchor="middle" font-size="11.5" fill="#2b6e9e">base ＝ Σ (红点) sz(u) ＝ 3+1+1+1 ＝ 6（全翻蓝的「账底」）</text>
  <text x="180" y="342" text-anchor="middle" font-size="11.5" fill="#2b6e9e">val(u) ＝ −sz(u)，若 u 原本是红（保留 ＝ 免付）</text>
  <text x="180" y="362" text-anchor="middle" font-size="11.5" fill="#2b6e9e">val(u) ＝ +sz(u)，若 u 原本是蓝（翻红 ＝ 再付）</text>
  <text x="180" y="382" text-anchor="middle" font-size="11" fill="#446688">S ＝ 最终红色集合（要翻的恰是 R₀ 与 S 的对称差）</text>

  <!-- right info box -->
  <g filter="url(#sk)">
    <rect x="346" y="278" width="264" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="478" y="300" text-anchor="middle" font-size="12.5" fill="#8a6415" font-weight="bold">记账直觉</text>
  <text x="478" y="322" text-anchor="middle" font-size="11.5" fill="#8a6415">多保留一个红点 → 从账底里减回 sz(u)</text>
  <text x="478" y="342" text-anchor="middle" font-size="11.5" fill="#8a6415">多染一个蓝点 → 在账底上再付 sz(u)</text>
  <text x="478" y="366" text-anchor="middle" font-size="11.5" fill="#8a6415">子树越大（越靠近根）翻起来越贵；</text>
  <text x="478" y="384" text-anchor="middle" font-size="11.5" fill="#8a6415">叶子最便宜（代价恰为 1）</text>

  <g filter="url(#sk)">
    <rect x="30" y="398" width="580" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="320" y="415" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">于是问题变成：在树上选一个（可为空的）连通块 S，最小化 base ＋ Σ val(u)</text>
</svg>
