<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="452" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：cards = [3,4,2,3,4,7] 逐张扫描算跨度</text>
  <path d="M 140 40 Q 340 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- cards strip -->
  <g filter="url(#sk)">
    <rect x="148" y="50" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="216" y="50" width="44" height="32" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="284" y="50" width="44" height="32" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="352" y="50" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="420" y="50" width="44" height="32" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="488" y="50" width="44" height="32" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="170" y="71">3</text>
    <text x="238" y="71">4</text>
    <text x="306" y="71">2</text>
    <text x="374" y="71">3</text>
    <text x="442" y="71">4</text>
    <text x="510" y="71">7</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="170" y="96">下标 0</text>
    <text x="238" y="96">下标 1</text>
    <text x="306" y="96">下标 2</text>
    <text x="374" y="96">下标 3</text>
    <text x="442" y="96">下标 4</text>
    <text x="510" y="96">下标 5</text>
  </g>
  <path d="M 148 102 L 148 114 L 396 114 L 396 102" stroke="#4a8edb" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="272" y="132" text-anchor="middle" font-size="11.5" fill="#2b6e9e">两个 3 的相邻对（下标 0, 3）→ 命中那一步见高亮行</text>

  <!-- walkthrough table -->
  <g filter="url(#sk)">
    <rect x="25" y="146" width="50" height="28" fill="#e8f0fa" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="75" y="146" width="45" height="28" fill="#e8f0fa" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="120" y="146" width="70" height="28" fill="#e8f0fa" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="190" y="146" width="115" height="28" fill="#e8f0fa" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="305" y="146" width="120" height="28" fill="#e8f0fa" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="425" y="146" width="140" height="28" fill="#e8f0fa" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="565" y="146" width="90" height="28" fill="#e8f0fa" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="50" y="164">步</text>
    <text x="97" y="164">i</text>
    <text x="155" y="164">cards[i]</text>
    <text x="247" y="164">last 同值下标</text>
    <text x="365" y="164">dist = i−last+1</text>
    <text x="495" y="164">动作（写 last）</text>
    <text x="610" y="164">ans</text>
  </g>

  <!-- rows 1-3 -->
  <g filter="url(#sk)">
    <rect x="25" y="176" width="630" height="34" fill="#fff" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="50" y="197">1</text>
    <text x="97" y="197">0</text>
    <text x="155" y="197">3</text>
    <text x="247" y="197">—（首现）</text>
    <text x="365" y="197">—</text>
    <text x="495" y="197">last[3] = 0</text>
    <text x="610" y="197">∞</text>
  </g>
  <g filter="url(#sk)">
    <rect x="25" y="210" width="630" height="34" fill="#fff" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="50" y="231">2</text>
    <text x="97" y="231">1</text>
    <text x="155" y="231">4</text>
    <text x="247" y="231">—（首现）</text>
    <text x="365" y="231">—</text>
    <text x="495" y="231">last[4] = 1</text>
    <text x="610" y="231">∞</text>
  </g>
  <g filter="url(#sk)">
    <rect x="25" y="244" width="630" height="34" fill="#fff" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="50" y="265">3</text>
    <text x="97" y="265">2</text>
    <text x="155" y="265">2</text>
    <text x="247" y="265">—（首现）</text>
    <text x="365" y="265">—</text>
    <text x="495" y="265">last[2] = 2</text>
    <text x="610" y="265">∞</text>
  </g>

  <!-- row 4: hit (highlighted) -->
  <g filter="url(#sk)">
    <rect x="25" y="278" width="630" height="34" fill="#fff8e1" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="50" y="299">4</text>
    <text x="97" y="299">3</text>
    <text x="155" y="299">3</text>
    <text x="247" y="299">0</text>
    <text x="365" y="299" fill="#a04038">3−0+1 = 4</text>
    <text x="495" y="299">last[3] = 3（覆盖）</text>
    <text x="610" y="299" fill="#a04038">4</text>
  </g>

  <!-- row 5: hit, no improvement -->
  <g filter="url(#sk)">
    <rect x="25" y="312" width="630" height="34" fill="#fdf6e6" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="50" y="333">5</text>
    <text x="97" y="333">4</text>
    <text x="155" y="333">4</text>
    <text x="247" y="333">1</text>
    <text x="365" y="333">4−1+1 = 4</text>
    <text x="495" y="333">last[4] = 4（覆盖）</text>
    <text x="610" y="333">4（不变）</text>
  </g>

  <!-- row 6 -->
  <g filter="url(#sk)">
    <rect x="25" y="346" width="630" height="34" fill="#fff" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="50" y="367">6</text>
    <text x="97" y="367">5</text>
    <text x="155" y="367">7</text>
    <text x="247" y="367">—（首现）</text>
    <text x="365" y="367">—</text>
    <text x="495" y="367">last[7] = 5</text>
    <text x="610" y="367">4</text>
  </g>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="120" y="398" width="440" height="40" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="340" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ans = 4 → 拿起 [3,4,2,3]（或 [4,2,3,4]）✓</text>
  <text x="340" y="434" text-anchor="middle" font-size="10.5" fill="#666">覆盖后若再出现 3（如 [3,4,2,3,3]），用新的 last[3]=3 算得 4−3+1=2，更近更优</text>
</svg>
