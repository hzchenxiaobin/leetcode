<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：node1 = 4，路径 4 → 3 → 0，j 一路只进不退</text>
  <path d="M 110 36 Q 320 44 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="53" text-anchor="middle" font-size="10.5" fill="#777">parents = [-1,0,1,0,3,3]，nums = [5,4,6,2,1,3]</text>

  <!-- timeline cells: tin 0..5 -->
  <g font-size="9.5" fill="#999" text-anchor="middle">
    <text x="178" y="70">tin=0</text>
    <text x="234" y="70">tin=1</text>
    <text x="290" y="70">tin=2</text>
    <text x="346" y="70">tin=3</text>
    <text x="402" y="70">tin=4</text>
    <text x="458" y="70">tin=5</text>
  </g>
  <g filter="url(#sk)">
    <rect x="150" y="76" width="56" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="206" y="76" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
    <rect x="262" y="76" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
    <rect x="318" y="76" width="56" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="374" y="76" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="430" y="76" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle">
    <text x="178" y="94" font-size="13" font-weight="bold" fill="#2b5b8a">0</text>
    <text x="178" y="110" font-size="10" fill="#666">值5</text>
    <text x="234" y="94" font-size="13" font-weight="bold" fill="#777">1</text>
    <text x="234" y="110" font-size="10" fill="#999">值4</text>
    <text x="290" y="94" font-size="13" font-weight="bold" fill="#777">2</text>
    <text x="290" y="110" font-size="10" fill="#999">值6</text>
    <text x="346" y="94" font-size="13" font-weight="bold" fill="#2b5b8a">3</text>
    <text x="346" y="110" font-size="10" fill="#666">值2</text>
    <text x="402" y="94" font-size="13" font-weight="bold" fill="#a03a36">4</text>
    <text x="402" y="110" font-size="10" font-weight="bold" fill="#b85450">值1</text>
    <text x="458" y="94" font-size="13" font-weight="bold" fill="#777">5</text>
    <text x="458" y="110" font-size="10" fill="#999">值3</text>
  </g>
  <text x="118" y="102" text-anchor="end" font-size="10.5" fill="#777">时间轴</text>

  <!-- nested subtree brackets -->
  <path d="M 374 134 L 374 128 L 430 128 L 430 134" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="402" y="147" text-anchor="middle" font-size="10" fill="#b85450">subtree(4) = [4,4]</text>
  <path d="M 318 158 L 318 152 L 486 152 L 486 158" stroke="#4a8edb" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="402" y="171" text-anchor="middle" font-size="10" fill="#4a8edb">subtree(3) = [3,5]</text>
  <path d="M 150 182 L 150 176 L 486 176 L 486 182" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="318" y="195" text-anchor="middle" font-size="10" fill="#4a7a3a">subtree(0) = [0,5]</text>

  <!-- j never resets arrow -->
  <path d="M 34 246 L 34 400" stroke="#8a5a10" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text transform="rotate(-90 24 323)" x="24" y="323" text-anchor="middle" font-size="10.5" fill="#8a5a10">j 只进不退：2 → 4 → 7</text>

  <!-- step rows -->
  <g filter="url(#sk)">
    <rect x="56" y="212" width="554" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="72" y="232" font-size="11.5" font-weight="bold" fill="#a03a36">① u = 4（node1），区间 [4,4]</text>
  <text x="72" y="250" font-size="10.5" fill="#8a4a46">j=2：值 2 在节点 3，tin[3]=3 ∉ [4,4] → 停下，ans[4] = 2</text>

  <g filter="url(#sk)">
    <rect x="56" y="274" width="554" height="70" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="72" y="294" font-size="11.5" font-weight="bold" fill="#2b5b8a">② u = 3，区间 [3,5]</text>
  <text x="72" y="312" font-size="10.5" fill="#4a6a8a">j=2：tin[3]=3 ∈ → j=3：值 3 在节点 5，tin[5]=5 ∈</text>
  <text x="72" y="330" font-size="10.5" fill="#4a6a8a">j=4：值 4 在节点 1，tin[1]=1 ∉ [3,5] → 停下，ans[3] = 4</text>

  <g filter="url(#sk)">
    <rect x="56" y="354" width="554" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="72" y="374" font-size="11.5" font-weight="bold" fill="#2e6e2e">③ u = 0（根），区间 [0,5]</text>
  <text x="72" y="392" font-size="10.5" fill="#4a7a3a">j=4：值 4 → tin[1]=1 ∈；j=5：值 5 → tin[0]=0 ∈；j=6：值 6 → tin[2]=2 ∈</text>
  <text x="72" y="410" font-size="10.5" fill="#4a7a3a">j=7：值 7 全树不存在 → 停下，ans[0] = 7</text>

  <!-- final banner -->
  <g filter="url(#sk)">
    <rect x="56" y="440" width="554" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="333" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">ans = [7, 1, 1, 4, 2, 1] ✓</text>
  <text x="333" y="480" text-anchor="middle" font-size="10.5" fill="#87663a">路径外节点 1、2、5 的子树不含 1，保持默认值 1</text>
</svg>
