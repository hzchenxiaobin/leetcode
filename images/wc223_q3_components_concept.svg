<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 425"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="425" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：交换边连成连通分量，分量内的值可任意重排</text>
  <path d="M 90 38 Q 280 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- target row (fixed reference) -->
  <text x="38" y="85" font-size="11" fill="#4a7a3a" filter="url(#rough2)">target</text>
  <text x="38" y="99" font-size="9" fill="#8a8a8a" filter="url(#rough2)">（固定）</text>
  <g filter="url(#rough2)">
    <rect x="96" y="66" width="48" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="206" y="66" width="48" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="316" y="66" width="48" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="426" y="66" width="48" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="120" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2</text>
  <text x="230" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="340" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">4</text>
  <text x="450" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">5</text>

  <!-- index labels -->
  <text x="120" y="111" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="230" y="111" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="340" y="111" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="450" y="111" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=3</text>

  <!-- source nodes -->
  <text x="38" y="155" font-size="11" fill="#446688" filter="url(#rough2)">source</text>
  <text x="38" y="169" font-size="9" fill="#8a8a8a" filter="url(#rough2)">（可交换）</text>
  <g filter="url(#rough2)">
    <circle cx="120" cy="150" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="230" cy="150" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="340" cy="150" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="450" cy="150" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="120" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="230" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="340" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="450" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>

  <!-- swap edges -->
  <path d="M 142 150 Q 175 136 208 150" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 362 150 Q 395 136 428 150" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="175" y="167" text-anchor="middle" font-size="10" fill="#b85450" stroke="#fafafa" stroke-width="3" paint-order="stroke" filter="url(#rough2)">swap[0,1]</text>
  <text x="395" y="167" text-anchor="middle" font-size="10" fill="#b85450" stroke="#fafafa" stroke-width="3" paint-order="stroke" filter="url(#rough2)">swap[2,3]</text>

  <!-- component dashed ellipses -->
  <ellipse cx="175" cy="150" rx="100" ry="52" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <ellipse cx="395" cy="150" rx="100" ry="52" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="175" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">分量 C₁ = {0,1}</text>
  <text x="395" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">分量 C₂ = {2,3}</text>

  <!-- arrows to cards -->
  <path d="M 168 222 Q 155 232 151 240" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 402 222 Q 415 232 419 240" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- card 1: component C1 -->
  <g filter="url(#rough2)">
    <rect x="25" y="244" width="250" height="108" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="150" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">分量 C₁={0,1}：频率匹配</text>
  <text x="150" y="290" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">src {1,2}　tgt {2,1}</text>
  <text x="150" y="309" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">v=1: min(1,1)=1　v=2: min(1,1)=1</text>
  <text x="150" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">match=2 → d = 2−2 = 0 ✓</text>

  <!-- card 2: component C2 -->
  <g filter="url(#rough2)">
    <rect x="285" y="244" width="250" height="108" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="410" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">分量 C₂={2,3}：频率匹配</text>
  <text x="410" y="290" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">src {3,4}　tgt {4,5}</text>
  <text x="410" y="309" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">v=3: min(1,0)=0　v=4: min(1,1)=1</text>
  <text x="410" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">match=1 → d = 2−1 = 1（失配）</text>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="70" y="366" width="420" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="280" y="388" text-anchor="middle" font-size="12.5" fill="#7a2828" filter="url(#rough2)">d(C) = |C| − Σv min(src_cnt[v], tgt_cnt[v])</text>
  <text x="280" y="407" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = n − Σ match(C) = 4 − (2+1) = 1</text>
</svg>
