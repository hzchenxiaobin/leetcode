<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把 a、b 首尾接起来，与 c 比长短</text>

  <!-- 情形 1：3,4,5 -->
  <text x="20" y="76" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">情形 1</text>
  <text x="20" y="92" font-size="11" fill="#888" filter="url(#rough2)">3, 4, 5</text>
  <rect x="140" y="62" width="78" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="218" y="62" width="104" height="20" rx="3" fill="#dfe9fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="179" y="76" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">a=3</text>
  <text x="270" y="76" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">b=4</text>
  <rect x="140" y="90" width="130" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="205" y="104" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">c = 5</text>
  <path d="M 322 58 L 322 114" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="330" y="80" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a+b = 7 &gt; 5 ✓</text>
  <text x="330" y="98" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">能围成三角形</text>

  <!-- 情形 2：1,2,3 -->
  <text x="20" y="166" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">情形 2</text>
  <text x="20" y="182" font-size="11" fill="#888" filter="url(#rough2)">1, 2, 3</text>
  <rect x="140" y="152" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="166" y="152" width="52" height="20" rx="3" fill="#dfe9fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="192" y="166" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">b=2</text>
  <rect x="140" y="180" width="78" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="179" y="194" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">c=3</text>
  <path d="M 218 148 L 218 204" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="330" y="170" font-size="11" fill="#b85450" filter="url(#rough2)">a+b = 3 = 3 ✗</text>
  <text x="330" y="188" font-size="10.5" fill="#b85450" filter="url(#rough2)">三点共线，退化</text>

  <!-- 情形 3：1,1,3 -->
  <text x="20" y="256" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">情形 3</text>
  <text x="20" y="272" font-size="11" fill="#888" filter="url(#rough2)">1, 1, 3</text>
  <rect x="140" y="242" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="166" y="242" width="26" height="20" rx="3" fill="#dfe9fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="140" y="270" width="78" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="179" y="284" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">c=3</text>
  <path d="M 192 238 L 192 294" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 192 260 L 218 260" stroke="#b85450" stroke-width="1.4" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <text x="330" y="260" font-size="11" fill="#b85450" filter="url(#rough2)">a+b = 2 &lt; 3 ✗</text>
  <text x="330" y="278" font-size="10.5" fill="#b85450" filter="url(#rough2)">差一截，围不起来</text>

  <rect x="40" y="318" width="480" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="340" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">a ≤ b ≤ c 时，a + b &gt; c 一旦成立，另两组不等式自动成立</text>
  <text x="58" y="357" font-size="11" fill="#2f5226" filter="url(#rough2)">因为 c 最大：a + c &gt; b、b + c &gt; a 都由 a + b &gt; c ≥ b ≥ a 推出。</text>
</svg>
