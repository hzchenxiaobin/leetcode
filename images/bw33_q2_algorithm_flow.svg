<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    流程：两遍扫描，无需建图
  </text>

  <g filter="url(#rough2)">
    <rect x="150" y="56" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="81" text-anchor="middle" font-size="13" fill="#446688">hasIn[v] = 0（v = 0..n−1）</text>
  </g>
  <path d="M 260 98 L 260 118" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="120" y="122" width="280" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="260" y="144" text-anchor="middle" font-size="13" fill="#8a6a1a">扫每条边 (from, to)：</text>
    <text x="260" y="164" text-anchor="middle" font-size="13" fill="#8a6a1a">hasIn[to] = 1（只做标记）</text>
  </g>
  <path d="M 260 176 L 260 196" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="120" y="200" width="280" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="222" text-anchor="middle" font-size="13" fill="#2f5a24">扫 v = 0..n−1：</text>
    <text x="260" y="242" text-anchor="middle" font-size="13" fill="#2f5a24">hasIn[v] == 0 ？ → 收集 v 进答案</text>
  </g>
  <path d="M 260 254 L 260 274" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="278" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="260" y="303" text-anchor="middle" font-size="13" fill="#b85450">返回答案列表（升序）</text>
  </g>

  <text x="66" y="146" font-size="12" fill="#666" filter="url(#rough2)">O(m)</text>
  <text x="66" y="226" font-size="12" fill="#666" filter="url(#rough2)">O(n)</text>
  <text x="430" y="146" font-size="12" fill="#666" filter="url(#rough2)">一次流式扫边</text>
  <text x="430" y="226" font-size="12" fill="#666" filter="url(#rough2)">不建邻接表</text>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">时间 O(n+m)，空间 O(n)</text>
</svg>
