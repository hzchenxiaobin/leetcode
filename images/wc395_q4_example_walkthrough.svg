<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [4,3,5,4]，m = 10，k = 5</text>

  <!-- 二分表 -->
  <text x="40" y="58" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 二分值域 [1,4]：</text>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.2" fill="none">
    <path d="M40,68 L510,67"/>
    <path d="M40,86 L510,85"/>
    <path d="M40,104 L510,103"/>
    <path d="M40,122 L510,121"/>
    <path d="M40,68 L41,122"/>
    <path d="M110,68 L111,122"/>
    <path d="M170,68 L171,122"/>
    <path d="M230,68 L231,122"/>
    <path d="M330,68 L331,122"/>
    <path d="M509,68 L510,122"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#446688" text-anchor="middle" font-weight="bold">
    <text x="75" y="81">轮次</text>
    <text x="140" y="81">lo</text>
    <text x="200" y="81">hi</text>
    <text x="260" y="81">mid</text>
    <text x="300" y="81">count(mid)</text>
    <text x="420" y="81">判定与动作</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="75" y="99">1</text><text x="140" y="99">1</text>
    <text x="200" y="99">4</text><text x="260" y="99">2</text>
    <text x="300" y="99">7</text>
    <text x="420" y="99" fill="#4a7a3a">7 ≥ 5 ✓ → hi ← 2</text>
    <text x="75" y="117">2</text><text x="140" y="117">1</text>
    <text x="200" y="117">2</text><text x="260" y="117">1</text>
    <text x="300" y="117">4</text>
    <text x="420" y="117" fill="#b85450">4 &lt; 5 ✗ → lo ← 2</text>
  </g>
  <text x="40" y="140" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">lo = hi = 2 → 返回 2</text>

  <!-- count(2) 走查 -->
  <text x="40" y="170" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② count(2) 的滑窗走查（t = 2）：</text>

  <!-- 四个步骤面板 -->
  <!-- r=0 -->
  <g filter="url(#rough2)">
    <rect x="40" y="182" width="112" height="96" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="8"/>
    <rect x="68" y="196" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="85" y="216" font-size="13" fill="#333" text-anchor="middle">4</text>
    <text x="96" y="196" font-size="11" fill="#b85450" text-anchor="middle" font-weight="bold">r=0</text>
    <text x="96" y="248" font-size="11.5" fill="#333" text-anchor="middle">窗口 [4]</text>
    <text x="96" y="266" font-size="11.5" fill="#4a7a3a" text-anchor="middle" font-weight="bold">+1 → 1</text>
  </g>
  <!-- r=1 -->
  <g filter="url(#rough2)">
    <rect x="166" y="182" width="112" height="96" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="8"/>
    <rect x="182" y="196" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="196" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="199" y="216" font-size="13" fill="#333" text-anchor="middle">4</text>
    <text x="237" y="216" font-size="13" fill="#333" text-anchor="middle">3</text>
    <text x="222" y="190" font-size="11" fill="#b85450" text-anchor="middle" font-weight="bold">r=1</text>
    <text x="222" y="248" font-size="11.5" fill="#333" text-anchor="middle">窗口 [4,3]</text>
    <text x="222" y="266" font-size="11.5" fill="#4a7a3a" text-anchor="middle" font-weight="bold">+2 → 3</text>
  </g>
  <!-- r=2 -->
  <g filter="url(#rough2)">
    <rect x="292" y="182" width="112" height="96" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="8"/>
    <rect x="308" y="196" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="346" y="196" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="325" y="216" font-size="13" fill="#333" text-anchor="middle">3</text>
    <text x="363" y="216" font-size="13" fill="#333" text-anchor="middle">5</text>
    <text x="348" y="190" font-size="11" fill="#b85450" text-anchor="middle" font-weight="bold">r=2</text>
    <text x="348" y="248" font-size="11.5" fill="#333" text-anchor="middle">移出 4 → [3,5]</text>
    <text x="348" y="266" font-size="11.5" fill="#4a7a3a" text-anchor="middle" font-weight="bold">+2 → 5</text>
  </g>
  <!-- r=3 -->
  <g filter="url(#rough2)">
    <rect x="418" y="182" width="112" height="96" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="8"/>
    <rect x="434" y="196" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="472" y="196" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="451" y="216" font-size="13" fill="#333" text-anchor="middle">5</text>
    <text x="489" y="216" font-size="13" fill="#333" text-anchor="middle">4</text>
    <text x="474" y="190" font-size="11" fill="#b85450" text-anchor="middle" font-weight="bold">r=3</text>
    <text x="474" y="248" font-size="11.5" fill="#333" text-anchor="middle">移出 3 → [5,4]</text>
    <text x="474" y="266" font-size="11.5" fill="#4a7a3a" text-anchor="middle" font-weight="bold">+2 → 7</text>
  </g>

  <!-- 橙色高亮说明 -->
  <text x="348" y="292" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">橙色 = 收缩后新进入窗口的格子</text>

  <!-- 结论框 -->
  <rect x="60" y="306" width="440" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">count(2) = 7 ≥ k = 5，而 count(1) = 4 &lt; 5</text>
  <text x="280" y="356" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">夹逼得第 5 小 = 2，与唯一性数组</text>
  <text x="280" y="374" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1,1,1,1,2,2,2,3,3,3] 的第 5 个元素吻合 ✓</text>

  <!-- 底部小注 -->
  <text x="280" y="416" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">（count(1) 同法走查：四个窗口 [4],[3],[5],[4]，各贡献 1，共 4）</text>
  <text x="280" y="444" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">二分 O(log n) 轮 × 滑窗 O(n) = 总时间 O(n log n)</text>
</svg>
