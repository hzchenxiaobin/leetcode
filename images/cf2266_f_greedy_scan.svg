<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="600" fill="#fafafa" filter="url(#rough2)"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">check(u)：从 u 往 2 扫，S = 更高层里被展开的结点数</text>

  <rect x="170" y="50" width="420" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="70" text-anchor="middle" font-size="13.5" fill="#2c4a66" filter="url(#rough2)">第 j 层的需求 d = 1 + S</text>
  <text x="380" y="88" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">想留 1 份 j，且每个上层展开结点也要 1 份 j</text>

  <path d="M380,96 L380,114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M380,118 L500,152 L380,186 L260,152 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="148" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">初值里有 j 吗？</text>
  <text x="380" y="166" text-anchor="middle" font-size="11.5" fill="#a08020" filter="url(#rough2)">c_j ≥ 1 ?</text>

  <path d="M262,152 L130,152 L130,198" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M498,152 L630,152 L630,198" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="144" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">有</text>
  <text x="560" y="144" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">没有</text>

  <rect x="28" y="202" width="304" height="82" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="224" font-size="12.5" fill="#3a5a2a" filter="url(#rough2)">m = min(d, c_j)：先拿副本当叶子</text>
  <text x="44" y="244" font-size="12.5" fill="#3a5a2a" filter="url(#rough2)">多出来的 e = d − m 个才展开</text>
  <text x="44" y="264" font-size="12.5" fill="#3a5a2a" filter="url(#rough2)">（展开 1 个至少要多花 2 个元素）</text>

  <rect x="428" y="202" width="304" height="82" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="444" y="224" font-size="12.5" fill="#8a2f2b" filter="url(#rough2)">m = 0，e = d 个全部展开</text>
  <text x="444" y="244" font-size="12.5" fill="#8a2f2b" filter="url(#rough2)">展开的每个结点都要 0..j−1</text>
  <text x="444" y="264" font-size="12.5" fill="#8a2f2b" filter="url(#rough2)">于是下层需求被放大</text>

  <path d="M180,284 L180,306 L380,306 L380,318" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M580,284 L580,306 L380,306" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="170" y="322" width="420" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="342" text-anchor="middle" font-size="13.5" fill="#2c4a66" filter="url(#rough2)">S ← S + e　，　Σm ← Σm + m</text>
  <text x="380" y="360" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">继续处理 j − 1</text>

  <path d="M380,368 L380,382" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="386" width="520" height="64" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="408" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">整段缺席值不用逐层算：L 个连续缺席 ⇒ S ← 2^L·S + (2^L − 1)</text>
  <text x="380" y="432" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">剪枝：一旦 S &gt; N 或 L ≥ 50，直接判 u 不可行</text>

  <path d="M380,450 L380,466" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="470" width="460" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="490" text-anchor="middle" font-size="13.5" fill="#3a5a2a" filter="url(#rough2)">收尾：叶子总数 = 2·(1 + S) + Σm ≤ N ？</text>
  <text x="380" y="508" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">0 类和 1 类叶子各 (1 + S) 个</text>

  <path d="M380,516 L380,530" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="534" width="540" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="556" text-anchor="middle" font-size="13.5" fill="#8a2f2b" filter="url(#rough2)">可行性关于 u 单调（能凑出 0..u 就能凑出 0..u−1）⇒ 二分</text>
  <text x="380" y="576" text-anchor="middle" font-size="13.5" fill="#8a2f2b" filter="url(#rough2)">最大可行 L 求出后：答案 = max(初值最大值, L + 1)</text>
</svg>
