<svg xmlns="http://www.w3.org/2000/svg" width="660" height="370" viewBox="0 0 660 370" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="660" height="370" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [6, 1, 2, 1, 2]</text>
  <path d="M 175 40 Q 330 48 485 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="60" text-anchor="middle" font-size="12" fill="#666">倒序填 dp；s mod 3 ＝ 0 用减号，否则用加号</text>

  <g filter="url(#sk)">
    <rect x="30" y="74" width="600" height="32" fill="#eceff1" stroke="#78909c" stroke-width="1.5" rx="6"/>
  </g>
  <text x="52" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i</text>
  <text x="160" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">后缀 nums[i..]</text>
  <text x="330" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取 1 个的候选</text>
  <text x="485" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取 2 个的候选</text>
  <text x="600" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i]</text>

  <g filter="url(#sk)">
    <rect x="30" y="106" width="600" height="40" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2" rx="4"/>
    <rect x="30" y="146" width="600" height="40" fill="#e8f0fe" stroke="#cfd8dc" stroke-width="1.2" rx="4"/>
    <rect x="30" y="186" width="600" height="40" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2" rx="4"/>
    <rect x="30" y="226" width="600" height="40" fill="#e8f0fe" stroke="#cfd8dc" stroke-width="1.2" rx="4"/>
    <rect x="30" y="266" width="600" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>

  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="52" y="131">4</text>
    <text x="160" y="131">[2]</text>
    <text x="330" y="131">s=2 → 2+dp[5]=2</text>
    <text x="485" y="131" fill="#999">越界，不合法</text>
    <text x="600" y="131" font-weight="bold" fill="#2f4f6f">2</text>

    <text x="52" y="171">3</text>
    <text x="160" y="171">[1, 2]</text>
    <text x="330" y="171">s=1 → 1+dp[4]=3</text>
    <text x="485" y="171">s=3 → 3−dp[5]=3</text>
    <text x="600" y="171" font-weight="bold" fill="#2f4f6f">3</text>

    <text x="52" y="211">2</text>
    <text x="160" y="211">[2, 1, 2]</text>
    <text x="330" y="211">s=2 → 2+dp[3]=5</text>
    <text x="485" y="211">s=3 → 3−dp[4]=1</text>
    <text x="600" y="211" font-weight="bold" fill="#2f4f6f">5</text>

    <text x="52" y="251">1</text>
    <text x="160" y="251">[1, 2, 1, 2]</text>
    <text x="330" y="251">s=1 → 1+dp[2]=6</text>
    <text x="485" y="251">s=3 → 3−dp[3]=0</text>
    <text x="600" y="251" font-weight="bold" fill="#2f4f6f">6</text>

    <text x="52" y="293">0</text>
    <text x="160" y="293">[6, 1, 2, 1, 2]</text>
    <text x="330" y="293">s=6 → 6−dp[1]=0</text>
    <text x="485" y="293">s=7 → 7+dp[2]=12</text>
    <text x="600" y="293" font-weight="bold" fill="#2e5a24">12</text>
  </g>

  <g filter="url(#sk)">
    <rect x="30" y="322" width="600" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="346" text-anchor="middle" font-size="12" fill="#8a6415">答案 dp[0] ＝ 12：Alice 取 7（不整除 3，继续）→ 2 → 1+2，Bob 为 0</text>
</svg>
