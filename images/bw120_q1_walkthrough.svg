<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：nums = [6,5,7,8]，10 个区间中 7 个合法</text>

  <!-- 数组 -->
  <g filter="url(#rough2)">
    <rect x="150" y="46" width="60" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="210" y="46" width="60" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="270" y="46" width="60" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="330" y="46" width="60" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="76" text-anchor="middle" font-size="16" fill="#333">6</text>
    <text x="240" y="76" text-anchor="middle" font-size="16" fill="#333">5</text>
    <text x="300" y="76" text-anchor="middle" font-size="16" fill="#333">7</text>
    <text x="360" y="76" text-anchor="middle" font-size="16" fill="#333">8</text>
    <text x="180" y="112" text-anchor="middle" font-size="11" fill="#888">0</text>
    <text x="240" y="112" text-anchor="middle" font-size="11" fill="#888">1</text>
    <text x="300" y="112" text-anchor="middle" font-size="11" fill="#888">2</text>
    <text x="360" y="112" text-anchor="middle" font-size="11" fill="#888">3</text>
  </g>

  <!-- 合法区间列表 -->
  <rect x="40" y="136" width="240" height="200" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="160" text-anchor="middle" font-size="13" fill="#1c3a1c" filter="url(#rough2)">7 个合法（✓）</text>
  <g font-size="12.5" filter="url(#rough2)">
    <text x="60" y="185" fill="#333">删 [6]     → [5,7,8] ✓</text>
    <text x="60" y="207" fill="#333">删 [5]     → [6,7,8] ✓</text>
    <text x="60" y="229" fill="#333">删 [6,5]   → [7,8] ✓</text>
    <text x="60" y="251" fill="#333">删 [5,7]   → [6,8] ✓</text>
    <text x="60" y="273" fill="#333">删 [5,7,8] → [6] ✓</text>
    <text x="60" y="295" fill="#333">删 [6,5,7] → [8] ✓</text>
    <text x="60" y="317" fill="#333">删 [6,5,7,8] → [] ✓（空也算）</text>
  </g>

  <!-- 非法区间列表 -->
  <rect x="300" y="136" width="240" height="200" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="160" text-anchor="middle" font-size="13" fill="#7a3030" filter="url(#rough2)">3 个非法（✗）</text>
  <g font-size="12.5" filter="url(#rough2)">
    <text x="320" y="195" fill="#333">删 [7]     → [6,5,8]</text>
    <text x="520" y="195" text-anchor="middle" fill="#b85450">✗ 5&lt;6</text>
    <text x="320" y="225" fill="#333">删 [8]     → [6,5,7]</text>
    <text x="520" y="225" text-anchor="middle" fill="#b85450">✗ 5&lt;6</text>
    <text x="320" y="255" fill="#333">删 [7,8]   → [6,5]</text>
    <text x="520" y="255" text-anchor="middle" fill="#b85450">✗ 5&lt;6</text>
    <text x="320" y="295" fill="#888" font-size="11.5">非法的共同点：6 和 5 同时留下，</text>
    <text x="320" y="313" fill="#888" font-size="11.5">前段拼接处破坏严格递增</text>
  </g>
</svg>
