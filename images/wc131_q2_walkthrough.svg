<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="600" height="300" fill="#fafafa"/>

  <text x="300.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：root = [1,0,1,0,1,0,1]</text>
  <text x="300.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">四条根到叶路径，路径值分别是 4、5、6、7</text>
  <rect x="40.0" y="76.0" width="180.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130.0" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">根到叶路径</text>
  <rect x="220.0" y="76.0" width="210.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="325.0" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cur 轨迹</text>
  <rect x="430.0" y="76.0" width="110.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="485.0" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">路径值</text>
  <rect x="40.0" y="110.0" width="180.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130.0" y="130.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1 → 0 → 0</text>
  <rect x="220.0" y="110.0" width="210.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="325.0" y="130.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0 → 1 → 2 → 4</text>
  <rect x="430.0" y="110.0" width="110.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="485.0" y="130.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="40.0" y="144.0" width="180.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130.0" y="164.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1 → 0 → 1</text>
  <rect x="220.0" y="144.0" width="210.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="325.0" y="164.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0 → 1 → 2 → 5</text>
  <rect x="430.0" y="144.0" width="110.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="485.0" y="164.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="40.0" y="178.0" width="180.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130.0" y="198.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1 → 1 → 0</text>
  <rect x="220.0" y="178.0" width="210.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="325.0" y="198.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0 → 1 → 3 → 6</text>
  <rect x="430.0" y="178.0" width="110.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="485.0" y="198.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="40.0" y="212.0" width="180.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130.0" y="232.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1 → 1 → 1</text>
  <rect x="220.0" y="212.0" width="210.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="325.0" y="232.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0 → 1 → 3 → 7</text>
  <rect x="430.0" y="212.0" width="110.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="485.0" y="232.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="40.0" y="250.0" width="300.0" height="38.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190.0" y="273.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">总和 = 4 + 5 + 6 + 7 = 22</text>
</svg>
