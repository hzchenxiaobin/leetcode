<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">一遍过滤：逐个字符过"元音闸门"</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">元音集合 V = {a, e, i, o, u}，共 5 个小写字母；辅音直接放行</text>

  <g filter="url(#rough2)">
    <rect x="24" y="64" width="34" height="34" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="58" y="64" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="92" y="64" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="126" y="64" width="34" height="34" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="160" y="64" width="34" height="34" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="194" y="64" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="41"  y="86" fill="#333">l</text>
    <text x="75"  y="86" fill="#b85450">e</text>
    <text x="109" y="86" fill="#b85450">e</text>
    <text x="143" y="86" fill="#333">t</text>
    <text x="177" y="86" fill="#333">c</text>
    <text x="211" y="86" fill="#b85450">o</text>
  </g>

  <text x="24" y="120" font-size="10" fill="#999" filter="url(#rough2)">前 6 个字符示意（"leetco"）</text>
  <text x="92" y="58" font-size="10" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">元音</text>
  <text x="211" y="58" font-size="10" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">元音</text>

  <g filter="url(#rough2)">
    <rect x="250" y="60" width="120" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
    <text x="310" y="79" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold">c ∈ V ?</text>
    <text x="310" y="95" text-anchor="middle" font-size="9.5" fill="#555">5 次比较（或 set 查询）</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 228 81 L 246 81" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 372 68 L 430 68" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
    <text x="398" y="60" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
    <path d="M 372 94 L 430 94" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
    <text x="398" y="112" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="432" y="50" width="112" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="488" y="72" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">追加到 t 尾部</text>
    <rect x="432" y="100" width="112" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="488" y="122" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">丢弃，继续下一个</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="160" width="488" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="76" y="184" font-size="12" fill="#8a6a20" font-weight="bold">生成器一行为之</text>
    <text x="76" y="208" font-size="11" fill="#555">''.join(c for c in s if c not in "aeiou")</text>
    <text x="196" y="208" font-size="9.5" fill="#999">← 语义即解法，一遍扫过，O(n) / O(n)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="238" width="230" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="151" y="262" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">保留相对顺序</text>
    <text x="151" y="281" text-anchor="middle" font-size="10" fill="#555">只"挑出"辅音，不重排</text>
    <text x="151" y="296" text-anchor="middle" font-size="10" fill="#555">t 的长度 = n − 元音个数</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="294" y="238" width="230" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="409" y="262" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">判定 O(1) 的三种写法</text>
    <text x="409" y="281" text-anchor="middle" font-size="10" fill="#555">5 个 != 连写 / set("aeiou") / 位掩码</text>
    <text x="409" y="296" text-anchor="middle" font-size="10" fill="#555">任何一种都只与字符集大小有关</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="320" width="488" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10"/>
    <text x="280" y="342" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">⚠ 题面保证只有小写字母：大写元音、空格、数字都不存在，无需考虑</text>
    <text x="280" y="362" text-anchor="middle" font-size="10" fill="#555">若字符集扩大到含大小写，把判定改为 tolower(c) ∈ V 即可，思路不变</text>
  </g>
</svg>
