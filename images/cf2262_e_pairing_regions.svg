<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">配对 = 匹配弧：两个括号序列就是两条非交叉完美匹配</text>

  <!-- 左：s = (()()) -->
  <path d="M 55 110 C 55 58 230 58 230 110" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 90 110 C 90 94 125 94 125 110" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 160 110 C 160 94 195 94 195 110" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="55" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="90" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="125" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="160" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="195" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="230" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="55" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">(</text>
  <text x="90" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">(</text>
  <text x="125" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">)</text>
  <text x="160" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">(</text>
  <text x="195" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">)</text>
  <text x="230" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">)</text>
  <text x="142" y="156" text-anchor="middle" font-size="12.5" fill="#33582a" filter="url(#rough2)">s = ( ( ) ( ) )   弧: (1,6)(2,3)(4,5)</text>

  <!-- 右：t = ((())) -->
  <path d="M 350 110 C 350 52 525 52 525 110" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 385 110 C 385 80 490 80 490 110" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 420 110 C 420 94 455 94 455 110" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="350" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="385" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="420" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="455" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="490" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="525" cy="110" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">(</text>
  <text x="385" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">(</text>
  <text x="420" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">(</text>
  <text x="455" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">)</text>
  <text x="490" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">)</text>
  <text x="525" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">)</text>
  <text x="437" y="156" text-anchor="middle" font-size="12.5" fill="#33582a" filter="url(#rough2)">t = ( ( ( ) ) )   弧: (1,6)(2,5)(3,4)</text>

  <text x="300" y="186" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">公共弧只有外层 (1,6) ⇒ 这一对的公共配对数 k = 1</text>

  <path d="M 30 202 L 570 202" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>

  <!-- 下：区域分解 -->
  <text x="160" y="224" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">取 S = {(1,6)}（j = 1）</text>
  <path d="M 60 268 C 60 214 260 214 260 268" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <circle cx="60" cy="268" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="100" cy="268" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="140" cy="268" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="180" cy="268" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="220" cy="268" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="260" cy="268" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="160" y="292" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">内侧 4 个自由点 ⇒ m = 2 ⇒ C_2^2 = 4</text>
  <text x="160" y="312" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">外侧 0 个自由点 ⇒ m = 0 ⇒ C_0^2 = 1</text>

  <!-- 公式盒 -->
  <rect x="330" y="236" width="240" height="104" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">A_j = Σ_S  Π_区域  C(m_r)^2</text>
  <text x="450" y="282" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">S ⊆ M1 ∩ M2, |S| = j</text>
  <text x="450" y="304" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">M1、M2 在每个区域内各自独立匹配</text>
  <text x="450" y="326" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">⇒ 权重 = 各区域 C(m_r)^2 之积</text>
</svg>
