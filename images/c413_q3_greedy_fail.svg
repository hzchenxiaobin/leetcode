<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="660" height="350" fill="#fdfcf7"/>

  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">贪心反例：grid = [[10,9],[10,1]]</text>

  <!-- 左面板：贪心 -->
  <text x="165" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">贪心「从大到小，能拿就拿」</text>

  <text x="70" y="101" text-anchor="end" font-size="10.5" fill="#666">r0</text>
  <text x="70" y="149" text-anchor="end" font-size="10.5" fill="#666">r1</text>

  <!-- r0: 10 picked / 9 rejected -->
  <rect x="80" y="80" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="104" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">10</text>
  <text x="126" y="82" font-size="11" fill="#4a7a3a">✓</text>

  <rect x="136" y="80" width="48" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="160" y="101" text-anchor="middle" font-size="13" fill="#8a3a34">9</text>
  <text x="184" y="82" font-size="11" fill="#b85450">✗</text>
  <text x="160" y="124" text-anchor="middle" font-size="9.5" fill="#b85450">行 0 已占</text>

  <!-- r1: 10 rejected / 1 picked -->
  <rect x="80" y="128" width="48" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="104" y="149" text-anchor="middle" font-size="13" fill="#8a3a34">10</text>
  <text x="126" y="130" font-size="11" fill="#b85450">✗</text>
  <text x="104" y="172" text-anchor="middle" font-size="9.5" fill="#b85450">值 10 已用</text>

  <rect x="136" y="128" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="160" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">1</text>
  <text x="184" y="130" font-size="11" fill="#4a7a3a">✓</text>

  <rect x="48" y="196" width="180" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="138" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a34">得分 = 10 + 1 = 11</text>

  <!-- 中间对比箭头 -->
  <path d="M 288 110 C 300 110, 312 110, 326 110" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="307" y="98" text-anchor="middle" font-size="10.5" fill="#555">换安置</text>

  <!-- 右面板：最优 -->
  <text x="495" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">最优：10 挪去 r1，行 0 留给 9</text>

  <text x="400" y="101" text-anchor="end" font-size="10.5" fill="#666">r0</text>
  <text x="400" y="149" text-anchor="end" font-size="10.5" fill="#666">r1</text>

  <rect x="410" y="80" width="48" height="32" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="434" y="101" text-anchor="middle" font-size="13" fill="#777">10</text>

  <rect x="466" y="80" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="490" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">9</text>
  <text x="514" y="82" font-size="11" fill="#4a7a3a">✓</text>

  <rect x="410" y="128" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="434" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">10</text>
  <text x="456" y="130" font-size="11" fill="#4a7a3a">✓</text>

  <rect x="466" y="128" width="48" height="32" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="490" y="149" text-anchor="middle" font-size="13" fill="#777">1</text>

  <rect x="378" y="196" width="180" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="468" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">得分 = 9 + 10 = 19</text>

  <!-- 底部结论 -->
  <rect x="48" y="252" width="564" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="330" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">行是共享资源：拿走一个值时，你并不知道它该住哪一行</text>
  <text x="330" y="300" text-anchor="middle" font-size="11.5" fill="#555">占错行会把后面的大值整个堵死——「值 → 行」的安置必须全局统筹，这正是匹配 / 状压 DP 的地盘</text>

  <text x="330" y="340" text-anchor="middle" font-size="10.5" fill="#666">值降序逐格尝试：10@r0 拿走 → 9 被堵（同行）、10@r1 被禁（同值），只能补个 1</text>
</svg>
