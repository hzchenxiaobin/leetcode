<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="630" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一次扫描，遇到 1 就累乘下标差</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="50" y="52" width="240" height="36" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
  </g>
  <text x="170" y="74" text-anchor="middle" font-size="12.5" fill="#333333">prev ← −1，ans ← 1，i ← 0</text>
  <path d="M 170 88 L 170 104" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="170,106 276,136 170,166 64,136" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="170" y="141" text-anchor="middle" font-size="12.5" fill="#333333">nums[i] == 1 ?</text>
  <path d="M 170 166 L 170 180" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="181" y="178" text-anchor="middle" font-size="11" fill="#2e6e2e">是</text>

  <path d="M 276 136 L 330 136 L 330 354" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="298" y="127" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <text x="324" y="250" text-anchor="middle" font-size="10.5" fill="#555555" transform="rotate(-90 324 250)">是 0：跳过</text>

  <g filter="url(#sk)">
    <polygon points="170,182 276,212 170,242 64,212" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="170" y="217" text-anchor="middle" font-size="12.5" fill="#333333">prev == −1 ?</text>
  <path d="M 276 212 L 376 212" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="204" text-anchor="middle" font-size="11" fill="#2e6e2e">是</text>

  <g filter="url(#sk)">
    <rect x="380" y="196" width="170" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="465" y="216" text-anchor="middle" font-size="11.5" fill="#2b6e9e">prev ← i（首个 1）</text>

  <path d="M 170 242 L 170 250" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="183" y="252" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="50" y="252" width="240" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="170" y="273" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">ans ← ans × (i − prev) mod 10⁹+7</text>
  <text x="170" y="291" text-anchor="middle" font-size="10.5" fill="#8a6415">然后 prev ← i</text>
  <path d="M 170 300 L 170 336" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="70" y="340" width="200" height="30" rx="8" fill="#f0f0f0" stroke="#888888" stroke-width="1.3"/>
  </g>
  <text x="170" y="359" text-anchor="middle" font-size="12.5" fill="#333333">i ← i + 1</text>

  <path d="M 465 228 L 465 354 L 272 354" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 170 370 L 170 376" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="170,378 276,406 170,434 64,406" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="170" y="411" text-anchor="middle" font-size="12.5" fill="#333333">i &lt; n ?</text>
  <path d="M 64 406 L 26 406 L 26 136 L 58 136" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="17" y="270" text-anchor="middle" font-size="10.5" fill="#555555" transform="rotate(-90 17 270)">是：处理下一个元素</text>
  <path d="M 170 434 L 170 448" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="446" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <polygon points="170,452 276,480 170,508 64,480" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="170" y="477" text-anchor="middle" font-size="12" fill="#333333">prev == −1 ?</text>
  <text x="170" y="494" text-anchor="middle" font-size="10" fill="#777777">（没见过任何 1）</text>

  <path d="M 64 480 Q 64 526 124 522" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="96" y="512" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <g filter="url(#sk)">
    <rect x="44" y="526" width="176" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="132" y="546" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">返回 0</text>
  <text x="132" y="562" text-anchor="middle" font-size="10.5" fill="#b85450">（数组里没有 1）</text>

  <path d="M 276 480 L 503 480 L 503 520" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="386" y="472" text-anchor="middle" font-size="11" fill="#2e6e2e">否</text>
  <g filter="url(#sk)">
    <rect x="408" y="526" width="190" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="503" y="546" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">返回 ans</text>
  <text x="503" y="562" text-anchor="middle" font-size="10.5" fill="#2e6e2e">（k = 1 时空乘积 = 1）</text>

  <g filter="url(#sk)">
    <rect x="40" y="586" width="272" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="176" y="605" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">每对相邻 1 恰乘一次：ans = 空隙宽度连乘</text>

  <g filter="url(#sk)">
    <rect x="328" y="586" width="272" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="464" y="605" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">O(n) 时间 / O(1) 空间：两个变量扫一遍</text>
</svg>
