<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：时间线段树 + 可撤销并查集</text>
  <path d="M 170 42 Q 380 49 590 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左列四步 -->
  <rect x="40" y="58" width="356" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="90" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">① 每个位置 p 维护「当前区间」版本，初始 t = 0</text>

  <path d="M 218 112 L 218 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="130" width="356" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="162" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">② 第 t 次修改：旧版本有效到 t−1，新版本从 t 开始</text>

  <path d="M 218 184 L 218 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="202" width="356" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="56" y="234" font-size="12.5" fill="#8a6015" filter="url(#rough2)">③ 边 (l, r+1) 挂到时间线段树 O(log q) 个结点</text>

  <path d="M 218 256 L 218 272" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="274" width="356" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">④ DFS：进入结点 union，离开结点按栈回滚</text>

  <!-- 右侧时间线段树 -->
  <rect x="532" y="66" width="96" height="32" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="580" y="88" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">[0, q]</text>

  <rect x="448" y="140" width="86" height="30" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="491" y="161" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">[0, 1]</text>
  <rect x="628" y="140" width="86" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="671" y="161" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">[2, 3]</text>

  <path d="M 560 98 L 500 138" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 600 98 L 662 138" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="428" y="216" width="46" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="451" y="236" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">0</text>
  <rect x="508" y="216" width="46" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="531" y="236" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="618" y="216" width="46" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="641" y="236" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="698" y="216" width="46" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="721" y="236" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">3</text>

  <path d="M 480 172 L 456 214" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 502 172 L 528 214" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 656 172 L 640 214" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 686 172 L 716 214" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="586" y="272" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">叶子 = 时刻 t，根到叶的路径 = 该时刻的边集</text>
  <text x="586" y="296" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">橙色路径示例：时刻 1 会带上 [0,1] 与 [0,q] 上的边</text>

  <!-- 底部结论框 -->
  <rect x="40" y="330" width="680" height="112" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="358" font-size="13" fill="#a14340" filter="url(#rough2)">· 走到叶子 t：答案 = (n+1) − 当前连通块数，直接写进 ans[t]</text>
  <text x="58" y="386" font-size="13" fill="#a14340" filter="url(#rough2)">· 回滚只撤销本结点新加的边：按 size 合并、不做路径压缩，历史压栈</text>
  <text x="58" y="414" font-size="13" fill="#a14340" filter="url(#rough2)">· 两端已连通的重复边不压栈，否则回滚会多恢复一次</text>
</svg>
