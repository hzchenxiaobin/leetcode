<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="450" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察一：删除集合总可以补全成一个连续区间</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888">得分只看被删下标的跨度 ⇒ 把跨度内没删的也删掉：得分不变、保留串更短</text>

  <!-- ===== Row 1: scattered deletion set ===== -->
  <text x="140" y="74" font-size="12" fill="#b85450" font-weight="bold">原方案：删除集合 D = {2, 4}</text>
  <text x="66" y="122" font-size="12" fill="#555" font-weight="bold">t =</text>

  <text x="270" y="93" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删</text>
  <text x="374" y="93" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删</text>

  <rect x="140" y="98" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="123" text-anchor="middle" font-size="15" fill="#333">a</text>
  <rect x="192" y="98" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="218" y="123" text-anchor="middle" font-size="15" fill="#333">b</text>
  <rect x="244" y="98" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="123" text-anchor="middle" font-size="15" fill="#333">c</text>
  <rect x="296" y="98" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="123" text-anchor="middle" font-size="15" fill="#333">d</text>
  <rect x="348" y="98" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="374" y="123" text-anchor="middle" font-size="15" fill="#333">e</text>
  <rect x="400" y="98" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="426" y="123" text-anchor="middle" font-size="15" fill="#333">f</text>

  <text x="166" y="152" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="218" y="152" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="270" y="152" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="322" y="152" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="374" y="152" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="426" y="152" text-anchor="middle" font-size="10" fill="#888">5</text>

  <path d="M 244 158 L 244 168 L 452 168 L 452 158" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="348" y="186" text-anchor="middle" font-size="11" fill="#b85450">跨度 [2, 4]，得分 = 4 − 2 + 1 = 3，保留 "abdf"</text>

  <!-- ===== arrow down ===== -->
  <path d="M 330 202 L 330 230" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="220" font-size="11" fill="#666">把 [2,4] 内未删的 d 也删掉</text>

  <!-- ===== Row 2: full interval ===== -->
  <text x="140" y="258" font-size="12" fill="#b85450" font-weight="bold">补全后：删除连续段 [2, 4]</text>
  <text x="66" y="306" font-size="12" fill="#555" font-weight="bold">t =</text>

  <text x="270" y="277" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删</text>
  <text x="322" y="277" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删</text>
  <text x="374" y="277" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删</text>

  <rect x="140" y="282" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="307" text-anchor="middle" font-size="15" fill="#333">a</text>
  <rect x="192" y="282" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="218" y="307" text-anchor="middle" font-size="15" fill="#333">b</text>
  <rect x="244" y="282" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="307" text-anchor="middle" font-size="15" fill="#333">c</text>
  <rect x="296" y="282" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="307" text-anchor="middle" font-size="15" fill="#333">d</text>
  <rect x="348" y="282" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="374" y="307" text-anchor="middle" font-size="15" fill="#333">e</text>
  <rect x="400" y="282" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="426" y="307" text-anchor="middle" font-size="15" fill="#333">f</text>

  <text x="166" y="336" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="218" y="336" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="270" y="336" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="322" y="336" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="374" y="336" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="426" y="336" text-anchor="middle" font-size="10" fill="#888">5</text>

  <path d="M 244 342 L 244 352 L 452 352 L 452 342" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="348" y="370" text-anchor="middle" font-size="11" fill="#b85450">得分仍是 3（依旧由 (2, 4) 决定），保留 "abf" —— 更短！</text>

  <!-- ===== conclusion ===== -->
  <rect x="70" y="390" width="520" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="410" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">结论：存在最优解删除的是一整段 t[l..r]，只需枚举连续区间</text>
  <text x="330" y="428" text-anchor="middle" font-size="11" fill="#666">（"abf" ⊆ "abdf" ⊆ s：保留更短，由子序列传递性只会更可行）</text>
</svg>
