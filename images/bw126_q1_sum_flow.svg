<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 366" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="560" height="366" fill="#fafafa"/>
<text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="normal" filter="url(#roughs)">每个数独立加密，最后累加</text>
<ellipse cx="280" cy="62" rx="96" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="280" y="68" text-anchor="middle" font-size="13" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">total ← 0</text>
<path d="M280,86 L280,106" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="170" y="108" width="220" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="135" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">对每个 x ∈ nums</text>
<path d="M280,152 L280,172" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="150" y="174" width="260" height="48" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="196" text-anchor="middle" font-size="11" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">逐位取模：mx ← max(mx, t % 10)</text>
<text x="280" y="214" text-anchor="middle" font-size="11" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">digits ← digits + 1</text>
<path d="M280,222 L280,242" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="150" y="244" width="260" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="271" text-anchor="middle" font-size="11" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">enc ← 重复 digits 次 enc*10 + mx</text>
<path d="M280,288 L280,308" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="170" y="310" width="220" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="336" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">total ← total + enc</text>
<path d="M390,331 L448,331 L448,130 L392,130" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
<text x="460" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" transform="rotate(90 460 232)" filter="url(#roughs)">下一个</text>
</svg>
