<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="380" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="16" fill="#3d3d3d" font-weight="bold" filter="url(#rough2)">把「两段均值相等」化成一次子集和判定</text>
  <text x="340" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">A、B 是 nums 的划分，所以两段的均值都必须等于总均值 S / n</text>

  <rect x="24" y="70" width="302" height="154" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="92" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">输入 nums = [1,2,3,4,5,6,7,8]</text>

  <rect x="42" y="104" width="122" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="103" y="122" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">A = 1,4,5,8</text>
  <text x="103" y="142" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">和 18，4 个 → 4.5</text>

  <rect x="178" y="104" width="132" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="244" y="122" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">B = 2,3,6,7</text>
  <text x="244" y="142" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">和 18，4 个 → 4.5</text>

  <text x="42" y="182" font-size="10" fill="#555" filter="url(#rough2)">每个元素恰好进 A 或 B，且两者都非空</text>
  <text x="42" y="204" font-size="10" fill="#888" filter="url(#rough2)">⟹ avg(A) = avg(B) = 18 / 4 = 4.5</text>

  <path d="M 332 148 L 370 148" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="378" y="70" width="278" height="154" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="394" y="92" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">等价改写（k = |A|）</text>
  <text x="394" y="118" font-size="12" fill="#3d3d3d" filter="url(#rough2)">avg(A) = avg(B) = S / n</text>
  <text x="394" y="142" font-size="12" fill="#3d3d3d" filter="url(#rough2)">⟺ sum(A)·n = S·k</text>
  <text x="394" y="166" font-size="12" fill="#3d3d3d" filter="url(#rough2)">⟺ sum(A) = S·k / n</text>
  <text x="394" y="192" font-size="10" fill="#8a3a36" filter="url(#rough2)">只查 k ≤ n/2 就够：B 与 A 完全对称</text>
  <text x="394" y="212" font-size="10" fill="#888" filter="url(#rough2)">（k = 0 或 k = n 不合题意，剔除）</text>

  <rect x="24" y="240" width="312" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="264" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">① 先过整数关：S·k mod n = 0</text>
  <text x="40" y="286" font-size="10" fill="#666" filter="url(#rough2)">目标 S·k/n 必须落在整数格点上，否则这个 k 直接跳过</text>

  <rect x="350" y="240" width="306" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="366" y="264" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 再查 1 ≤ k ≤ n/2</text>
  <text x="366" y="286" font-size="10" fill="#666" filter="url(#rough2)">看是否存在大小 k、和恰为 S·k/n 的子集（0/1 背包）</text>

  <text x="340" y="332" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">n ≤ 30、S ≤ 3×10⁵，直接开 dp[16][300001] 的布尔表即可，不需要复杂的剪枝</text>
  <text x="340" y="354" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">再进一步：把每一行 dp[k] 压成一个二进制整数，整行一次位移就完成「加一个数」</text>
</svg>
