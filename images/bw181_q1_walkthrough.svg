<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：两个条件互为「与」关系</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">任一条件不满足即为 false，判定全程 O(log n)</text>
  <rect x="15" y="74" width="86" height="36" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58.0" y="97" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">用例</text>
  <rect x="101" y="74" width="96" height="36" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="149.0" y="97" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">s</text>
  <rect x="197" y="74" width="130" height="36" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="262.0" y="97" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">首位 == x？</text>
  <rect x="327" y="74" width="122" height="36" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="388.0" y="97" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">出现过 x？</text>
  <rect x="449" y="74" width="96" height="36" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="497.0" y="97" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">结论</text>
  <rect x="15" y="110" width="86" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58.0" y="135" text-anchor="middle" font-size="10.5" fill="#446688">101, x=0</text>
  <rect x="101" y="110" width="96" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="149.0" y="135" text-anchor="middle" font-size="10.5" fill="#446688">101</text>
  <rect x="197" y="110" width="130" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="262.0" y="135" text-anchor="middle" font-size="10.5" fill="#d6a040">'1' != '0' ✓</text>
  <rect x="327" y="110" width="122" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="388.0" y="135" text-anchor="middle" font-size="10.5" fill="#d6a040">下标 1 命中 ✓</text>
  <rect x="449" y="110" width="96" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="497.0" y="135" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">true</text>
  <rect x="15" y="156" width="86" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58.0" y="181" text-anchor="middle" font-size="10.5" fill="#446688">232, x=2</text>
  <rect x="101" y="156" width="96" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="149.0" y="181" text-anchor="middle" font-size="10.5" fill="#446688">232</text>
  <rect x="197" y="156" width="130" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="262.0" y="181" text-anchor="middle" font-size="10.5" fill="#d6a040">'2' == '2' ✗</text>
  <rect x="327" y="156" width="122" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="388.0" y="181" text-anchor="middle" font-size="10.5" fill="#d6a040">下标 0 命中</text>
  <rect x="449" y="156" width="96" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="497.0" y="181" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">false</text>
  <rect x="15" y="202" width="86" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58.0" y="227" text-anchor="middle" font-size="10.5" fill="#446688">5, x=1</text>
  <rect x="101" y="202" width="96" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="149.0" y="227" text-anchor="middle" font-size="10.5" fill="#446688">5</text>
  <rect x="197" y="202" width="130" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="262.0" y="227" text-anchor="middle" font-size="10.5" fill="#d6a040">'5' != '1' ✓</text>
  <rect x="327" y="202" width="122" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="388.0" y="227" text-anchor="middle" font-size="10.5" fill="#d6a040">未出现 ✗</text>
  <rect x="449" y="202" width="96" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="497.0" y="227" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">false</text>
  <rect x="15" y="248" width="86" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58.0" y="273" text-anchor="middle" font-size="10.5" fill="#446688">0, x=0</text>
  <rect x="101" y="248" width="96" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="149.0" y="273" text-anchor="middle" font-size="10.5" fill="#446688">0</text>
  <rect x="197" y="248" width="130" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="262.0" y="273" text-anchor="middle" font-size="10.5" fill="#d6a040">'0' == '0' ✗</text>
  <rect x="327" y="248" width="122" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="388.0" y="273" text-anchor="middle" font-size="10.5" fill="#d6a040">命中，但拦在前</text>
  <rect x="449" y="248" width="96" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="497.0" y="273" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">false</text>
  <text x="280.0" y="324" text-anchor="middle" font-size="10" fill="#999">前三条即官方示例；第四条演示 n = 0 的退化情形（"0" 以 0 开头）</text>
</svg>
