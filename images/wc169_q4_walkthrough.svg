<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 376" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="376" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：SEND + MORE = MONEY 逐列走查</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">找到的映射：S9 E5 N6 D7 M1 O0 R8 Y2</text>
  <rect x="46" y="62" width="466" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78.0" y="81" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">列</text>
  <text x="195.0" y="81" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">本列字母与数字</text>
  <text x="308.0" y="81" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">S(c)</text>
  <text x="380.0" y="81" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">result</text>
  <text x="468.0" y="81" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">新进位</text>
  <rect x="46" y="90" width="466" height="29" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="78.0" y="110" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">0 个位</text>
  <text x="195.0" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">D7 + E5</text>
  <text x="308.0" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="380.0" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Y=2</text>
  <text x="468.0" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="46" y="119" width="466" height="29" fill="#ffffff" stroke="#c8cdd6" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="78.0" y="139" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">1 十位</text>
  <text x="195.0" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">N6 + R8 + 1</text>
  <text x="308.0" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="380.0" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">E=5</text>
  <text x="468.0" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="46" y="148" width="466" height="29" fill="#f4f8fd" stroke="#c8cdd6" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="78.0" y="168" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">2 百位</text>
  <text x="195.0" y="168" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">E5 + O0 + 1</text>
  <text x="308.0" y="168" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="380.0" y="168" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">N=6</text>
  <text x="468.0" y="168" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="46" y="177" width="466" height="29" fill="#ffffff" stroke="#c8cdd6" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="78.0" y="197" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">3 千位</text>
  <text x="195.0" y="197" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S9 + M1 + 0</text>
  <text x="308.0" y="197" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="380.0" y="197" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">O=0</text>
  <text x="468.0" y="197" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="46" y="206" width="466" height="29" fill="#f4f8fd" stroke="#c8cdd6" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="78.0" y="226" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">4 万位</text>
  <text x="195.0" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">只有进位 1</text>
  <text x="308.0" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="380.0" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">M=1</text>
  <text x="468.0" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="40" y="270" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="291" text-anchor="start" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">五列全部对齐、末列进位归零 → 9567 + 1085 = 10652 合法</text>
  <rect x="40" y="310" width="480" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="331" text-anchor="start" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">示例 3 只推进到十位就全部矛盾，191 个节点判定 false</text>
  <text x="280" y="362" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每次只确定「一个新的字母 → 一个新的数字」，数字占用靠 used 数组回溯恢复</text>
</svg>
