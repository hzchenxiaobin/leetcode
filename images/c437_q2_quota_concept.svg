<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="540" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：奇偶天的「名额」模型</text>
  <path d="M 90 42 Q 340 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ① 降序格子排（m=3, n=12, odd=2, even=1） -->
  <text x="30" y="72" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① 降序排序后按名额分配（设 m = 3：奇数天 ×2，偶数天 ×1）</text>

  <g filter="url(#rough2)">
    <rect x="59"  y="88" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="101" y="88" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="143" y="88" width="40" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="185" y="88" width="40" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="227" y="88" width="40" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="269" y="88" width="40" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="311" y="88" width="40" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="353" y="88" width="40" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="395" y="88" width="40" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="437" y="88" width="40" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="479" y="88" width="40" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="521" y="88" width="40" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="79"  y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">12</text>
  <text x="121" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">11</text>
  <text x="163" y="113" text-anchor="middle" font-size="14" fill="#a06a1a" filter="url(#rough2)">10</text>
  <text x="205" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">9</text>
  <text x="247" y="113" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">8</text>
  <text x="289" y="113" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">7</text>
  <text x="331" y="113" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">6</text>
  <text x="373" y="113" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">5</text>
  <text x="415" y="113" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">4</text>
  <text x="457" y="113" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3</text>
  <text x="499" y="113" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">2</text>
  <text x="541" y="113" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">1</text>

  <text x="79"  y="146" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">a₁</text>
  <text x="121" y="146" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">a₂</text>
  <text x="163" y="146" text-anchor="middle" font-size="9" fill="#a06a1a" filter="url(#rough2)">a₃</text>
  <text x="205" y="146" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">a₄</text>
  <text x="394" y="146" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">a₅ ⋯ a₁₂（垫脚，不进头部名额）</text>

  <text x="79"  y="82" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">天1 Z</text>
  <text x="121" y="82" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">天3 Z</text>
  <text x="163" y="82" text-anchor="middle" font-size="9.5" fill="#a06a1a" filter="url(#rough2)">搭档</text>
  <text x="205" y="82" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">天2 Y</text>

  <g filter="url(#rough2)">
    <path d="M 60 156 v 5 h 160 v -5" stroke="#446688" stroke-width="1.6" fill="none"/>
    <path d="M 226 156 v 5 h 77 v -5" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <path d="M 311 156 v 5 h 249 v -5" stroke="#999" stroke-width="1.4" fill="none"/>
  </g>
  <text x="140" y="174" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">奇数天 Z：各占 1 名额</text>
  <text x="264" y="174" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">偶数天：占 2 名额</text>
  <text x="436" y="174" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">垫脚池 ×8（3·odd + 2·even）</text>

  <!-- ② 两种天的规则 -->
  <g filter="url(#rough2)">
    <rect x="30" y="196" width="300" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="350" y="196" width="300" height="118" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="180" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">奇数天（odd = ⌈m/2⌉ 个）</text>
  <text x="180" y="248" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">计重 = 当天最大 Z（一家独大）</text>
  <text x="180" y="270" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">只占 1 个头部名额</text>
  <text x="180" y="292" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">另外 3 个披萨全部垫脚</text>
  <text x="500" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">偶数天（even = ⌊m/2⌋ 个）</text>
  <text x="500" y="248" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">计重 = 当天第二大 Y（老二当家）</text>
  <text x="500" y="270" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">必须配 1 个更大的搭档抬轿（不计重）</text>
  <text x="500" y="292" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">成对消耗头部名额 → 取数步长 2</text>

  <!-- ③ 名额公式 -->
  <g filter="url(#rough2)">
    <rect x="30" y="336" width="620" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="360" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">名额序列：1, 2, …, odd → 奇数天的 Z；odd+1 → 搭档，odd+2 → Y；之后每 2 格一组</text>
  <text x="340" y="386" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">贪心值 G = (a₁ + ⋯ + a_odd) + (a(odd+2) + a(odd+4) + ⋯ + a(odd+2·even))</text>

  <!-- ④ 结论 -->
  <g filter="url(#rough2)">
    <rect x="30" y="424" width="620" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="340" y="445" text-anchor="middle" font-size="11.5" fill="#b03a3a" filter="url(#rough2)">⚠ 陷阱：偶数天不能直接取剩余最大的 even 个（忘了搭档）</text>
  <text x="340" y="462" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">示例 1 会错算 8 + 7 = 15，正确是 8 + 6 = 14</text>

  <text x="340" y="502" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（本图以 m = 3、odd = 2、even = 1 为例；一般情形名额规则相同）</text>
</svg>
