<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,4,2,7]，low = 2，high = 6 → ans = f(7) − f(2)</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">f(L) = 已插入元素中与 x 异或值 &lt; L 的个数；处理 j 时 Trie 恰含前 j 个元素（先查后插）</text>

  <!-- Row 3 highlight -->
  <rect x="40" y="198" width="480" height="36" fill="#e8f0fe" filter="url(#rough2)"/>

  <!-- Header -->
  <rect x="40" y="56" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#7a5a10" font-weight="bold" text-anchor="middle">
    <text x="63" y="78">j</text>
    <text x="125" y="78">nums[j]</text>
    <text x="218" y="78">Trie 已有</text>
    <text x="328" y="78">f(7)：xor&lt;7</text>
    <text x="421" y="78">f(2)：xor&lt;2</text>
    <text x="489" y="78">贡献</text>
  </g>

  <!-- Grid lines -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1.1" fill="none">
    <path d="M 40 56 L 520 56"/>
    <path d="M 40 90 L 520 90"/>
    <path d="M 40 126 L 520 126"/>
    <path d="M 40 162 L 520 162"/>
    <path d="M 40 198 L 520 198"/>
    <path d="M 40 234 L 520 234"/>
    <path d="M 40 56 L 40 234"/>
    <path d="M 86 56 L 86 234"/>
    <path d="M 164 56 L 164 234"/>
    <path d="M 272 56 L 272 234"/>
    <path d="M 384 56 L 384 234"/>
    <path d="M 458 56 L 458 234"/>
    <path d="M 520 56 L 520 234"/>
  </g>

  <!-- Row 0 -->
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="63" y="112">0</text>
    <text x="125" y="112">1</text>
    <text x="218" y="112">∅</text>
    <text x="328" y="112">0</text>
    <text x="421" y="112">0</text>
    <text x="489" y="112">0</text>
  </g>
  <!-- Row 1 -->
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="63" y="148">1</text>
    <text x="125" y="148">4</text>
    <text x="218" y="148">{1}</text>
    <text x="328" y="148">1（5）</text>
    <text x="421" y="148">0（5≥2）</text>
    <text x="489" y="148" fill="#446688" font-weight="bold">+1</text>
  </g>
  <!-- Row 2 -->
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="63" y="184">2</text>
    <text x="125" y="184">2</text>
    <text x="218" y="184">{1,4}</text>
    <text x="328" y="184">2（3,6）</text>
    <text x="421" y="184">0（均≥2）</text>
    <text x="489" y="184" fill="#446688" font-weight="bold">+2</text>
  </g>
  <!-- Row 3 (highlighted) -->
  <g filter="url(#rough2)" font-size="11" fill="#22344c" font-weight="bold" text-anchor="middle">
    <text x="63" y="220">3</text>
    <text x="125" y="220">7</text>
    <text x="218" y="220">{1,2,4}</text>
    <text x="328" y="220">3（6,5,3）</text>
    <text x="421" y="220">0（均≥2）</text>
    <text x="489" y="220" fill="#b85450">+3</text>
  </g>

  <text x="520" y="251" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">↑ j=3 的 f(7) 正是上图 Trie 的逐位演算</text>

  <!-- Answer box -->
  <rect x="40" y="262" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="285" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 0 + 1 + 2 + 3 = 6 ✓</text>

  <text x="280" y="318" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">f(2) 每步都是 0：本例所有异或值（3, 5, 6）都 ≥ low = 2</text>

  <!-- Verify box -->
  <rect x="40" y="332" width="480" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">六个数对逐一验证（全部命中 [2,6]）：</text>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="280" y="376">(1,4):5 ✓　　(1,2):3 ✓　　(1,7):6 ✓</text>
    <text x="280" y="396">(4,2):6 ✓　　(4,7):3 ✓　　(2,7):5 ✓</text>
  </g>
  <text x="280" y="418" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">换个视角：若 low = 6，则 f(6) = 4（异或 3,3,5,5），ans = 6 − 4 = 2，恰剩 xor = 6 的两对</text>
</svg>
