<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">从 13! 的排列森林，到 (mask, r) 的状态折叠</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="11.5" fill="#555">朴素 DFS 的浪费：不同的拼放顺序，落在同一个 (已用集合, 余数) 上</text>

  <g filter="url(#sk)"><rect x="118" y="76" width="66" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="151" y="93" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">∅, r=0</text>

  <g filter="url(#sk)"><path d="M 128 102 Q 96 112 82 122" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/></g>
  <g filter="url(#sk)"><path d="M 151 102 L 158 122" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/></g>
  <g filter="url(#sk)"><path d="M 176 102 Q 244 112 262 122" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/></g>

  <g filter="url(#sk)"><rect x="54" y="124" width="76" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="92" y="141" text-anchor="middle" font-size="11" fill="#2b5b84">拼 3 · {3}</text>
  <g filter="url(#sk)"><rect x="144" y="124" width="84" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="186" y="141" text-anchor="middle" font-size="11" fill="#2b5b84">拼 12 · {12}</text>
  <g filter="url(#sk)"><rect x="242" y="124" width="84" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="284" y="141" text-anchor="middle" font-size="11" fill="#2b5b84">拼 45 · {45}</text>

  <g filter="url(#sk)"><path d="M 74 150 Q 60 160 56 170" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrb)"/></g>
  <g filter="url(#sk)"><path d="M 180 150 Q 200 160 208 170" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrb)"/></g>

  <g filter="url(#sk)"><rect x="28" y="172" width="88" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="72" y="188" text-anchor="middle" font-size="10.5" fill="#7a5415">12 · {3,12}</text>
  <g filter="url(#sk)"><rect x="204" y="172" width="88" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="248" y="188" text-anchor="middle" font-size="10.5" fill="#7a5415">3 · {3,12}</text>

  <g filter="url(#sk)"><ellipse cx="72" cy="184" rx="52" ry="19" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/></g>
  <g filter="url(#sk)"><ellipse cx="248" cy="184" rx="52" ry="19" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/></g>
  <g filter="url(#sk)"><path d="M 118 198 Q 160 214 202 200" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/></g>
  <text x="160" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">已用集合相同 ⇒ 同一个 mask，可合并！</text>
  <text x="160" y="254" text-anchor="middle" font-size="11" fill="#b03a3a">排列树：13! ≈ 6.2×10^9 条根到叶路径</text>

  <g filter="url(#sk)"><path d="M 268 156 L 340 156" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrb)"/></g>
  <text x="304" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">按 (mask, r)</text>
  <text x="304" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">折叠</text>

  <g filter="url(#sk)"><rect x="366" y="76" width="110" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="421" y="93" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">|mask| = 0</text>
  <text x="490" y="93" font-size="10.5" fill="#555">1 个状态</text>

  <g filter="url(#sk)"><path d="M 421 102 L 421 120" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/></g>

  <g filter="url(#sk)"><rect x="366" y="122" width="110" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="421" y="139" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">|mask| = 1</text>
  <text x="490" y="139" font-size="10.5" fill="#555">C(13,1)·k = 1300</text>

  <g filter="url(#sk)"><path d="M 421 148 L 421 166" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/></g>

  <g filter="url(#sk)"><rect x="366" y="168" width="110" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="421" y="185" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">|mask| = 2</text>
  <text x="490" y="185" font-size="10.5" fill="#555">C(13,2)·k = 7800</text>

  <g filter="url(#sk)"><path d="M 421 194 L 421 212" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/></g>
  <text x="421" y="216" text-anchor="middle" font-size="12" fill="#446688">⋮</text>
  <g filter="url(#sk)"><path d="M 421 222 L 421 240" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/></g>

  <g filter="url(#sk)"><rect x="356" y="242" width="250" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="481" y="260" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">|mask| = 13：f[full][0] = true</text>
  <text x="481" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a">其余 f[full][r] = false（余数没归零不算成）</text>
  <text x="556" y="160" text-anchor="middle" font-size="9.5" fill="#888">层间转移 = 拼下一个数</text>

  <g filter="url(#sk)">
    <rect x="40" y="300" width="566" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="323" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">转移：f(mask, r) = ∨ f(mask ∪ {i}, (r·10^L + xᵢ) mod k)，i 取遍未用下标</text>
  <text x="323" y="346" text-anchor="middle" font-size="10.5" fill="#444">边界：f(full, r) = (r == 0) —— 全部数字拼完、余数恰好归零，才是可整除连接</text>
  <text x="323" y="368" text-anchor="middle" font-size="10.5" fill="#444">状态 2^13 × 100 ≈ 8.2×10^5 个 × 每个至多 13 次转移 ⇒ 千万级操作，稳过</text>
</svg>
