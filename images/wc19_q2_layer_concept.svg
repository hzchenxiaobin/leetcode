<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：层序遍历把「层」显式暴露出来</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">最底层最左 = 最深那一层里第一个出队的节点（L0~L2 三层）</text>

  <rect x="74" y="70" width="430" height="48" fill="none" stroke="#c8c8c8" stroke-width="1.1" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <rect x="74" y="142" width="430" height="48" fill="none" stroke="#c8c8c8" stroke-width="1.1" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <rect x="74" y="214" width="430" height="48" fill="none" stroke="#c8c8c8" stroke-width="1.1" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>

  <text x="66" y="99" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">L0</text>
  <text x="66" y="171" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">L1</text>
  <text x="66" y="243" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">L2</text>

  <g stroke="#8a9bb8" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 280 114 L 170 150"/>
    <path d="M 280 114 L 390 150"/>
    <path d="M 170 186 L 110 222"/>
    <path d="M 170 186 L 230 222"/>
    <path d="M 390 186 L 330 222"/>
    <path d="M 390 186 L 450 222"/>
  </g>

  <circle cx="280" cy="96" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="101" text-anchor="middle" font-size="13" fill="#33455f" filter="url(#rough2)">1</text>

  <circle cx="170" cy="168" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="173" text-anchor="middle" font-size="13" fill="#33455f" filter="url(#rough2)">2</text>
  <circle cx="390" cy="168" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="173" text-anchor="middle" font-size="13" fill="#33455f" filter="url(#rough2)">3</text>

  <circle cx="230" cy="240" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="245" text-anchor="middle" font-size="13" fill="#33455f" filter="url(#rough2)">5</text>
  <circle cx="330" cy="240" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="245" text-anchor="middle" font-size="13" fill="#33455f" filter="url(#rough2)">6</text>
  <circle cx="450" cy="240" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="245" text-anchor="middle" font-size="13" fill="#33455f" filter="url(#rough2)">7</text>

  <circle cx="110" cy="240" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="110" y="245" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="110" cy="240" r="26" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <path d="M 158 276 L 128 262" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="284" font-size="10.5" fill="#b85450" filter="url(#rough2)">最深层的第一个 → 答案</text>

  <rect x="60" y="302" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="322" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">最后一层节点依次是 4, 5, 6, 7，从左到右第一个是 4</text>
  <text x="76" y="340" font-size="10.5" fill="#555" filter="url(#rough2)">「最左」是位置概念：与节点值的大小、正负完全无关，比较值会出错</text>

  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">层号 L0/L1/L2 只是深度；答案是深度最大那一层的队首</text>
</svg>
