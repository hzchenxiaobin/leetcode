<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="590" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：计数 → 降序拼左半 → 选中心 → 前导零判定</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="180" y="58" width="280" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="82" text-anchor="middle" font-size="12.5" fill="#2b4a66">① 扫描 num，统计 cnt[0..9]</text>
  <path d="M 320 96 L 320 120" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="180" y="124" width="280" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="148" text-anchor="middle" font-size="12.5" fill="#2b4a66">② d = 9 → 0：left += ⌊cnt[d]/2⌋ 个 d</text>
  <path d="M 320 162 L 320 186" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="180" y="190" width="280" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="214" text-anchor="middle" font-size="12.5" fill="#2b4a66">③ d = 9 → 0：首个奇计数 → center</text>
  <path d="M 320 228 L 320 248" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 1 -->
  <g filter="url(#sk)">
    <polygon points="320,252 455,300 320,348 185,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="296" text-anchor="middle" font-size="12" fill="#7a5415">left 非空且</text>
  <text x="320" y="314" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace" fill="#7a5415">left[0] == '0' ?</text>
  <text x="176" y="296" text-anchor="end" font-size="10.5" fill="#888">（⟺ 无非零配对）</text>

  <path d="M 455 300 L 508 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="480" y="291" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="512" y="274" width="112" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="568" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">left 清空</text>
  <text x="568" y="315" text-anchor="middle" font-size="10.5" fill="#b85450">（弃全部 0 对）</text>
  <path d="M 568 328 L 568 397 L 486 397" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 320 348 L 320 372" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="333" y="364" font-size="12" fill="#4a8e4a" font-weight="bold">否</text>

  <!-- step 4 -->
  <g filter="url(#sk)">
    <rect x="180" y="378" width="300" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="330" y="402" text-anchor="middle" font-size="12.5" fill="#2b4a66">④ res = left + center + left 的逆序</text>
  <path d="M 320 416 L 320 438" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 2 -->
  <g filter="url(#sk)">
    <polygon points="320,442 445,486 320,530 195,486" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="491" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">res 为空？</text>

  <path d="M 195 486 L 144 486" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="170" y="477" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="48" y="464" width="96" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="96" y="491" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 "0"</text>

  <path d="M 320 530 L 320 548" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="333" y="546" font-size="12" fill="#4a8e4a" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="245" y="552" width="150" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="574" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">⑤ 返回 res</text>
</svg>
