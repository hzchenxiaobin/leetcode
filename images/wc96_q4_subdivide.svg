<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="680" height="350" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">把边 [u,v,cnt] 细分：cnt 个新点、cnt+1 条单位边 ⇒ 从 u 走到 v 要 cnt+1 步</text>

  <!-- 原始边 -->
  <circle cx="70" cy="100" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="106" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">u</text>
  <circle cx="480" cy="100" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="106" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">v</text>
  <path d="M92 100 L458 100" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="275" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">原始边（cnt = 4）</text>

  <!-- 细分后 -->
  <circle cx="70" cy="220" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">u</text>
  <circle cx="480" cy="220" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="226" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">v</text>

  <circle cx="152" cy="220" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="152" y="225" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">x₁</text>
  <circle cx="234" cy="220" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="234" y="225" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">x₂</text>
  <circle cx="316" cy="220" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="316" y="225" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">x₃</text>
  <circle cx="398" cy="220" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="225" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">x₄</text>

  <path d="M92 220 L136 220 M168 220 L218 220 M250 220 L300 220 M332 220 L382 220 M414 220 L458 220"
        stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="275" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">5 条单位边，4 个新节点</text>

  <!-- 结论框 -->
  <rect x="24" y="278" width="632" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="340" y="302" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">所以「原图上 u→v 的距离」 = cnt + 1（把细分点全部压缩掉后，这条边就是权重 cnt+1 的边）</text>
  <text x="340" y="326" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">n ≤ 3000、边数 ≤ 1e4，无法真的建出上限 1e4 个细分点/边的图（最坏 1e8 个点）⇒ 必须压缩</text>
</svg>
