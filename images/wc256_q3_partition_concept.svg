<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：一个工作时段 = 一个「时长和 ≤ sessionTime」的任务子集</text>
  <path d="M 230 42 Q 440 52 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: restatement as packing -->
  <g filter="url(#sk)">
    <rect x="30" y="64" width="410" height="272" rx="10" fill="#f5f9fd" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="50" y="90" font-size="14" fill="#2b6e9e" font-weight="bold">① 换个说法：把任务「装箱」进时段</text>
  <g filter="url(#sk)">
    <rect x="111" y="106" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/>
    <rect x="163" y="106" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/>
    <rect x="215" y="106" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/>
    <rect x="267" y="106" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/>
    <rect x="319" y="106" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="131" y="128" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="183" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="235" y="128" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="287" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="339" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="235" y="160" text-anchor="middle" font-size="11.5" fill="#667" font-family="monospace">tasks = [3,1,3,1,1]，sessionTime = 8（示例 2）</text>
  <g filter="url(#sk)">
    <rect x="60" y="176" width="350" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="235" y="197" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace">时段①：3+1+3+1 = 8 ≤ 8 ✓（装满）</text>
  <g filter="url(#sk)">
    <rect x="60" y="216" width="350" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="235" y="237" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace">时段②：1 ≤ 8 ✓ → 共 2 段（最优）</text>
  <g filter="url(#sk)">
    <rect x="60" y="256" width="350" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="235" y="277" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-family="monospace">时段✗：3+1+3+1+1 = 9 &gt; 8 → 不合法</text>
  <text x="235" y="315" text-anchor="middle" font-size="11" fill="#888">时段内不能并行：装进同一段的任务时长「相加」</text>

  <!-- right panel: bitmask -->
  <g filter="url(#sk)">
    <rect x="460" y="64" width="390" height="272" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="480" y="90" font-size="14" fill="#a06a1a" font-weight="bold">② n ≤ 14 → 「子集」可以全部枚举</text>
  <g filter="url(#sk)">
    <rect x="486" y="108" width="34" height="30" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
    <rect x="526" y="108" width="34" height="30" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="566" y="108" width="34" height="30" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
    <rect x="606" y="108" width="34" height="30" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="646" y="108" width="34" height="30" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="503" y="128" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="543" y="128" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="583" y="128" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="623" y="128" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="663" y="128" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="480" y="158" font-size="11.5" fill="#667" font-family="monospace">选中 {0,2,4} 号任务 ⇔ mask = 1 0 1 0 1</text>
  <g filter="url(#sk)">
    <rect x="486" y="172" width="340" height="46" rx="8" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="656" y="192" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold" font-family="monospace">2^14 = 16384 个子集，全部在射程内</text>
  <text x="656" y="210" text-anchor="middle" font-size="11" fill="#a08040">每个子集的「时长和 sum(s)」可预处理成一张表</text>
  <text x="480" y="248" font-size="12" fill="#556" font-weight="bold">「时段装了哪些任务」= 选一个子集；</text>
  <text x="480" y="268" font-size="12" fill="#556" font-weight="bold">「这个子集是否装得下」只取决于 sum(s)。</text>
  <text x="480" y="296" font-size="11" fill="#888">—— 集合自身属性 → 查表，不必逐任务重算</text>
  <text x="480" y="316" font-size="11" fill="#888">—— 同一子集在枚举中被反复用到，缓存一次全局复用</text>

  <!-- conclusion banner -->
  <g filter="url(#sk)">
    <rect x="30" y="352" width="820" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="440" y="379" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">结论：合法方案 = 把全集划分成 k 个两两不交、每个时长和 ≤ sessionTime 的子集 → 最小化 k，划分型状压 DP</text>

  <!-- warning strip -->
  <g filter="url(#sk)">
    <rect x="30" y="410" width="820" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="440" y="430" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">⚠ 这本质是 NP-hard 的装箱问题——但 n ≤ 14 允许指数级枚举精确求解，正落在状压 DP 的甜区</text>
  <text x="440" y="448" text-anchor="middle" font-size="11" fill="#a05a5a">题目保证 max(tasks) ≤ sessionTime：任何任务至少能单独占一段，答案必然存在</text>
</svg>
