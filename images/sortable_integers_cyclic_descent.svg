<svg xmlns="http://www.w3.org/2000/svg" width="680" height="472" viewBox="0 0 680 472" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="472" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">环形下降点：块能旋转成非递减 ⟺ 环形下降数 ≤ 1</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="60" text-anchor="middle" font-size="11.5" fill="#444">把块首尾相接看成环：环形相邻对 (b_j, b_(j+1) mod k) 中出现 b_j &gt; b_(j+1) 的对数，记为环形下降数</text>

  <!-- 面板 A：一个下降点，可旋转 -->
  <g filter="url(#sk)">
    <rect x="40" y="78" width="300" height="168" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="56" y="100" font-size="12.5" font-weight="bold" fill="#2e6e2e">块 [5, 4, 4]：环形下降数 = 1 ✓</text>
  <g filter="url(#sk)">
    <rect x="60" y="110" width="44" height="34" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="108" y="110" width="44" height="34" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="156" y="110" width="44" height="34" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="82" y="131" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="130" y="131" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="178" y="131" text-anchor="middle" font-size="13" fill="#333">4</text>
  <g filter="url(#sk)">
    <path d="M 104 148 Q 106 158 104 166" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="120" y="162" font-size="10" fill="#b03a3a">5 &gt; 4 ↓</text>
  <text x="220" y="120" font-size="10.5" fill="#444">(5, 4) ↓ 下降</text>
  <text x="220" y="136" font-size="10.5" fill="#444">(4, 4) 平</text>
  <text x="220" y="152" font-size="10.5" fill="#444">(4, 5) 首尾，升</text>
  <text x="56" y="196" font-size="11" fill="#2e6e2e">在唯一下降点之后断开、旋转到此开头：</text>
  <g filter="url(#sk)">
    <rect x="60" y="206" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="108" y="206" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="156" y="206" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="82" y="225" text-anchor="middle" font-size="13" fill="#2e6e2e">4</text>
  <text x="130" y="225" text-anchor="middle" font-size="13" fill="#2e6e2e">4</text>
  <text x="178" y="225" text-anchor="middle" font-size="13" fill="#2e6e2e">5</text>
  <text x="220" y="225" font-size="11" fill="#2e6e2e">非递减 ✓</text>

  <!-- 面板 B：多个下降点，不可旋转 -->
  <g filter="url(#sk)">
    <rect x="364" y="78" width="276" height="168" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="380" y="100" font-size="12.5" font-weight="bold" fill="#b03a3a">块 [7, 6, 5]：环形下降数 = 3 ✗</text>
  <g filter="url(#sk)">
    <rect x="384" y="110" width="44" height="34" rx="4" fill="#fffdf3" stroke="#b85450" stroke-width="1.5"/>
    <rect x="432" y="110" width="44" height="34" rx="4" fill="#fffdf3" stroke="#b85450" stroke-width="1.5"/>
    <rect x="480" y="110" width="44" height="34" rx="4" fill="#fffdf3" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="406" y="131" text-anchor="middle" font-size="13" fill="#333">7</text>
  <text x="454" y="131" text-anchor="middle" font-size="13" fill="#333">6</text>
  <text x="502" y="131" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="544" y="120" font-size="10.5" fill="#444">(7, 6) ↓</text>
  <text x="544" y="136" font-size="10.5" fill="#444">(6, 5) ↓</text>
  <text x="544" y="152" font-size="10.5" fill="#444">(5, 7) 首尾 ↓</text>
  <text x="380" y="184" font-size="11" fill="#b03a3a">环上有 3 处「下坡」：无论从哪里断开旋转，</text>
  <text x="380" y="202" font-size="11" fill="#b03a3a">序列里总留有下降对，无法变成非递减 ✗</text>
  <text x="380" y="228" font-size="10.5" fill="#888">（严格递减的块是最坏情况：k 个下降点）</text>

  <!-- 面板 C：反例 -->
  <g filter="url(#sk)">
    <rect x="40" y="262" width="600" height="86" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="58" y="284" font-size="12.5" font-weight="bold" fill="#7a5415">只查下降点不够 —— 还要查多重集</text>
  <text x="58" y="304" font-size="11.5" fill="#444">块 [1, 3]：环形下降数 = 1 ✓（本身已非递减），但目标块是 [2, 2]，多重集 {1, 3} ≠ {2, 2} ✗</text>
  <text x="58" y="324" font-size="11.5" fill="#444">反过来多重集相同、下降点过多也不行 —— 两个条件同时满足，旋转出的非递减块才恰好等于 s 的对应块</text>

  <!-- 公式框 -->
  <g filter="url(#sk)">
    <rect x="40" y="364" width="600" height="90" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="58" y="386" font-size="12.5" font-weight="bold" fill="#2b6e9e">两个量都能 O(1) 读出（块 [l, r)，r = l + k）</text>
  <text x="58" y="406" font-size="11.5" fill="#333">环形下降数 = D[r−1] − D[l] + [ nums[r−1] &gt; nums[l] ]，其中 D[i] = 前 i 个位置中相邻下降对 nums[j] &gt; nums[j+1] 的个数</text>
  <text x="58" y="426" font-size="11.5" fill="#333">多重集哈希 = px[r] − px[l] 对比 ps[r] − ps[l]（Zobrist 前缀和之差）</text>
  <text x="58" y="444" font-size="10.5" fill="#888">注意「首尾对」容易被漏掉：块内相邻下降对只统计 j ∈ [l, r−1)，环的闭合对 (r−1, l) 要单独补上</text>
</svg>
