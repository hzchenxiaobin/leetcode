<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="396" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">找到第一个唯一偶数：频次表 + 从左到右第一命中</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [3,4,2,5,4,6]；下标越早越优先，所以必须「边扫边判」而不是先排序</text>
  <rect x="96" y="66" width="54" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123.0" y="90.68" text-anchor="middle" font-size="13" fill="#666666" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="123" y="122" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="123" y="138" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">奇·1次</text>
  <rect x="158" y="66" width="54" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185.0" y="90.68" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="185" y="122" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="185" y="138" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">偶·2次</text>
  <rect x="220" y="66" width="54" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247.0" y="90.68" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="247" y="122" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="247" y="138" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">偶·1次</text>
  <rect x="282" y="66" width="54" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309.0" y="90.68" text-anchor="middle" font-size="13" fill="#666666" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="309" y="122" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="309" y="138" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">奇·1次</text>
  <rect x="344" y="66" width="54" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371.0" y="90.68" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="371" y="122" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=4</text>
  <text x="371" y="138" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">偶·2次</text>
  <rect x="406" y="66" width="54" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="433.0" y="90.68" text-anchor="middle" font-size="13" fill="#666666" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="433" y="122" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=5</text>
  <text x="433" y="138" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">偶·1次</text>
  <text x="96" y="158" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">扫描顺序 →</text>
  <rect x="36" y="172" width="488" height="42" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="52" y="198" text-anchor="start" font-size="10.5" fill="#666666" font-weight="bold" filter="url(#rough2)">i=0  v=3</text>
  <text x="150" y="198" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">奇数 → 跳过</text>
  <rect x="36" y="226" width="488" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="52" y="252" text-anchor="start" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">i=1  v=4</text>
  <text x="150" y="252" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">偶数但 4 出现 2 次（i=1,4）→ 跳过</text>
  <rect x="36" y="280" width="488" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="52" y="306" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">i=2  v=2</text>
  <text x="150" y="306" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">偶数且 2 只出现 1 次 → 返回 2</text>
  <rect x="36" y="330" width="488" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="350" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">频次表只需一次统计；判定顺序「先偶数、再频次」两句都满足才返回</text>
  <text x="280" y="386" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">示例 2 [4,4]：4 出现两次 → 没有唯一偶数 → 返回 -1</text>
</svg>
