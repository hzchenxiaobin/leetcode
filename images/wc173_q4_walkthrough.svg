<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="392" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：a = [6,5,4,3,2,1]，d = 2</text>
  <text x="320" y="52" text-anchor="middle" font-size="10.5" fill="#888">逐天滚动数组，dp[j][i] 只依赖上一行 dp[j-1][·]</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="78" y="66" width="462" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="168" y="66" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="199" y="91" fill="#334">1</text>
    <rect x="230" y="66" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="261" y="91" fill="#334">2</text>
    <rect x="292" y="66" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="323" y="91" fill="#334">3</text>
    <rect x="354" y="66" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="385" y="91" fill="#334">4</text>
    <rect x="416" y="66" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="447" y="91" fill="#334">5</text>
    <rect x="478" y="66" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="509" y="91" fill="#334">6</text>
    <text x="162" y="91" fill="#444" font-weight="bold">i</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="168" y="106" width="62" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="199" y="130" fill="#444">6</text>
    <rect x="230" y="106" width="62" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="261" y="130" fill="#444">5</text>
    <rect x="292" y="106" width="62" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="323" y="130" fill="#444">4</text>
    <rect x="354" y="106" width="62" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="385" y="130" fill="#444">3</text>
    <rect x="416" y="106" width="62" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="447" y="130" fill="#444">2</text>
    <rect x="478" y="106" width="62" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="509" y="130" fill="#444">1</text>
    <text x="162" y="130" fill="#444">a[i]</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="168" y="144" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="199" y="168" fill="#444">6</text>
    <rect x="230" y="144" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="261" y="168" fill="#444">6</text>
    <rect x="292" y="144" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="323" y="168" fill="#444">6</text>
    <rect x="354" y="144" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="385" y="168" fill="#444">6</text>
    <rect x="416" y="144" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="447" y="168" fill="#444">6</text>
    <rect x="478" y="144" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="509" y="168" fill="#444">6</text>
    <text x="162" y="168" fill="#3a5a30">dp[1][i]</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="168" y="182" width="62" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="199" y="206" fill="#b85450">∞</text>
    <rect x="230" y="182" width="62" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="261" y="206" fill="#444">11</text>
    <rect x="292" y="182" width="62" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="323" y="206" fill="#444">10</text>
    <rect x="354" y="182" width="62" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="385" y="206" fill="#444">9</text>
    <rect x="416" y="182" width="62" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="447" y="206" fill="#444">8</text>
    <rect x="478" y="182" width="62" height="38" fill="#ffe9c7" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="509" y="206" fill="#8a3a36" font-weight="bold">7</text>
    <text x="162" y="206" fill="#8a3a36">dp[2][i]</text>
  </g>

  <text x="90" y="246" font-size="11" fill="#444" font-weight="bold">当 i = 6：k 从 5 递减到 1，边扫边取 max(a[k..5])</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="100" y="258" width="84" height="58" fill="#ffe9c7" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="142" y="280" fill="#8a3a36" font-weight="bold">k = 5</text>
    <text x="142" y="302" fill="#8a3a36" font-weight="bold">6 + 1 = 7</text>

    <rect x="192" y="258" width="84" height="58" fill="#f7f7f7" stroke="#999" stroke-width="1.3" rx="8"/>
    <text x="234" y="280" fill="#555">k = 4</text>
    <text x="234" y="302" fill="#555">6 + 2 = 8</text>

    <rect x="284" y="258" width="84" height="58" fill="#f7f7f7" stroke="#999" stroke-width="1.3" rx="8"/>
    <text x="326" y="280" fill="#555">k = 3</text>
    <text x="326" y="302" fill="#555">6 + 3 = 9</text>

    <rect x="376" y="258" width="84" height="58" fill="#f7f7f7" stroke="#999" stroke-width="1.3" rx="8"/>
    <text x="418" y="280" fill="#555">k = 2</text>
    <text x="418" y="302" fill="#555">6 + 4 = 10</text>

    <rect x="468" y="258" width="84" height="58" fill="#f7f7f7" stroke="#999" stroke-width="1.3" rx="8"/>
    <text x="510" y="280" fill="#555">k = 1</text>
    <text x="510" y="302" fill="#555">6 + 5 = 11</text>
  </g>

  <rect x="100" y="332" width="452" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="326" y="357" text-anchor="middle" font-size="11.5" fill="#3a4a66">dp[2][6] = min{11, 10, 9, 8, 7} = 7 → 答案为 7</text>
</svg>
