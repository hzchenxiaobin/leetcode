<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">下降时把字母「拼在前面」，栈里天然就是叶到根</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">题目要的方向是 leaf → root，与遍历方向相反，先想清楚在哪一步拼串</text>

  <circle cx="70" cy="90" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="96" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <circle cx="170" cy="90" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="96" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <circle cx="270" cy="90" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="96" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">d</text>

  <path d="M 92 90 L 146 90" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 192 90 L 246 90" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="70" y="132" font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">"a"</text>
  <text x="170" y="132" font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">"b" + "a"</text>
  <text x="270" y="132" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">"d" + "ba" = "dba"</text>

  <text x="320" y="86" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">叶子处直接得到答案，</text>
  <text x="320" y="102" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">不需要再反转。</text>

  <rect x="30" y="160" width="500" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="181" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">若反过来按 root → leaf 累积，则每个叶子还要再 reverse 一次</text>
  <text x="42" y="201" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">两种写法等价，但「下降时前插」让「比较」和「构造」同时正确，少一个坑。</text>

  <rect x="30" y="224" width="500" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="245" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">字典序比较要点</text>
  <text x="42" y="264" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">C++ 与 Python 的字符串比较都是「逐字符比较、短前缀更小」，正合本题的字典序。</text>
</svg>
