<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">有效单词计数：先极大切分，再完整匹配</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#888">拼接后 s = "a--b a--c"（示例 2）</text>

  <!-- 断开原因（红，格子上方） -->
  <text x="94" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">右邻是-</text>
  <text x="302" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">空格</text>
  <text x="406" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">右邻是-</text>

  <!-- 字符格子行 -->
  <g filter="url(#sk)"><rect x="68" y="80" width="52" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="94" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">a</text>
  <text x="94" y="122" text-anchor="middle" font-size="8" fill="#999">i=0</text>

  <g filter="url(#sk)"><rect x="120" y="80" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="146" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450">-</text>
  <text x="146" y="122" text-anchor="middle" font-size="8" fill="#999">1</text>

  <g filter="url(#sk)"><rect x="172" y="80" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="198" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450">-</text>
  <text x="198" y="122" text-anchor="middle" font-size="8" fill="#999">2</text>

  <g filter="url(#sk)"><rect x="224" y="80" width="52" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="250" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="250" y="122" text-anchor="middle" font-size="8" fill="#999">3</text>

  <g filter="url(#sk)"><rect x="276" y="80" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="302" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450">␣</text>
  <text x="302" y="122" text-anchor="middle" font-size="8" fill="#999">4</text>

  <g filter="url(#sk)"><rect x="328" y="80" width="52" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="354" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">a</text>
  <text x="354" y="122" text-anchor="middle" font-size="8" fill="#999">5</text>

  <g filter="url(#sk)"><rect x="380" y="80" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="406" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450">-</text>
  <text x="406" y="122" text-anchor="middle" font-size="8" fill="#999">6</text>

  <g filter="url(#sk)"><rect x="432" y="80" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="458" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450">-</text>
  <text x="458" y="122" text-anchor="middle" font-size="8" fill="#999">7</text>

  <g filter="url(#sk)"><rect x="484" y="80" width="52" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="510" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">c</text>
  <text x="510" y="122" text-anchor="middle" font-size="8" fill="#999">8</text>

  <!-- 分隔虚线 -->
  <path d="M 120 78 L 120 160" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <path d="M 224 78 L 224 160" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <path d="M 276 78 L 276 160" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <path d="M 328 78 L 328 160" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <path d="M 484 78 L 484 160" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>

  <!-- token 标注 -->
  <text x="94" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">T1 "a"</text>
  <text x="250" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">T2 "b"</text>
  <text x="354" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">T3 "a"</text>
  <text x="510" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">T4 "c"</text>

  <!-- 中央箭头 -->
  <path d="M 320 168 L 320 196" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="338" y="186" font-size="10.5" fill="#666">切出 4 个 token，逐一入表</text>

  <!-- 哈希表 -->
  <g filter="url(#sk)"><rect x="120" y="202" width="400" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="320" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">cnt（哈希表计数）</text>
  <g filter="url(#sk)"><rect x="142" y="232" width="104" height="38" rx="6" fill="#fdfcf7" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="194" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">"a" → 2</text>
  <g filter="url(#sk)"><rect x="268" y="232" width="104" height="38" rx="6" fill="#fdfcf7" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="320" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">"b" → 1</text>
  <g filter="url(#sk)"><rect x="394" y="232" width="104" height="38" rx="6" fill="#fdfcf7" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="446" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">"c" → 1</text>

  <!-- 查询 -->
  <g filter="url(#sk)"><rect x="70" y="306" width="180" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="160" y="333" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">queries = [a, b, c]</text>
  <path d="M 254 328 L 326 328" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="290" y="318" text-anchor="middle" font-size="10.5" fill="#666">查表</text>
  <g filter="url(#sk)"><rect x="330" y="306" width="190" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="425" y="333" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">ans = [2, 1, 1]</text>
  <text x="425" y="366" text-anchor="middle" font-size="10.5" fill="#888">"a" 计 2：T1 与 T3 两次命中</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="382" width="520" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">单词 = 极大合法段：相邻字母必同词，空格与非法连字符是分隔符</text>
  <text x="320" y="420" text-anchor="middle" font-size="11" fill="#444">query 必须与完整 token 相等——子串 "wor" 不算单词 "world" 的一次出现</text>
</svg>
