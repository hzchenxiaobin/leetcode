<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：见小就换，换得起才换</text>
  <path d="M 160 34 Q 320 42 480 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="56" y="58" text-anchor="start" font-size="13.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">① 为什么「栈顶 &gt; 来者」必须换？</text>

  <g filter="url(#sk)">
    <rect x="70" y="72" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="70" y="106" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="92" y="91" font-size="13" font-weight="bold" fill="#2b4a66">4</text>
    <text x="92" y="125" font-size="13" font-weight="bold" fill="#2b4a66">2</text>
    <text x="92" y="150" font-size="10.5" fill="#555">当前栈（底→顶）</text>
  </g>

  <g filter="url(#sk)">
    <rect x="150" y="72" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="172" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818" filter="url(#sk)">3</text>
  <text x="172" y="64" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#sk)">到来 x = 3</text>
  <g filter="url(#sk)">
    <path d="M 194 86 L 122 86" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>

  <text x="232" y="84" text-anchor="start" font-size="12.5" fill="#333" filter="url(#sk)">栈顶 4 &gt; 3：把前缀里的 4 换成 3</text>
  <text x="232" y="103" text-anchor="start" font-size="11.5" fill="#555" filter="url(#sk)">栈内其余元素与相对顺序原样保留</text>

  <text x="56" y="166" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">保留 4</text>
  <g filter="url(#sk)">
    <rect x="56" y="172" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="98" y="172" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="140" y="172" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="76" y="190" font-size="12.5" fill="#333">2</text>
    <text x="118" y="190" font-size="12.5" font-weight="bold" fill="#b85450">4</text>
    <text x="160" y="190" font-size="12.5" fill="#888">…</text>
  </g>
  <text x="208" y="190" text-anchor="start" font-size="11.5" fill="#555" filter="url(#sk)">任何以 [2,4] 开头的长 k 子序列</text>

  <text x="56" y="222" text-anchor="start" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">换入 3</text>
  <g filter="url(#sk)">
    <rect x="56" y="228" width="40" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="98" y="228" width="40" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="140" y="228" width="40" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="76" y="246" font-size="12.5" fill="#333">2</text>
    <text x="118" y="246" font-size="12.5" font-weight="bold" fill="#3a5a3a">3</text>
    <text x="160" y="246" font-size="12.5" fill="#888">…</text>
  </g>
  <text x="208" y="246" text-anchor="start" font-size="11.5" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">第 2 位 3 &lt; 4 → 严格更具竞争力 ✓</text>

  <g filter="url(#sk)">
    <path d="M 122 200 C 168 206, 168 212, 124 226" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="178" y="216" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">交换</text>

  <text x="56" y="278" text-anchor="start" font-size="13.5" font-weight="bold" fill="#b07818" filter="url(#sk)">② 换得起才换：守门条件 (栈长−1) + (n−i) ≥ k</text>

  <g filter="url(#sk)">
    <rect x="50" y="290" width="540" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="320" y="314" font-size="12" fill="#333">反例：nums = [3,2,1]，k = 2 —— 扫描到末尾的 1 时，栈 = [2]，2 &gt; 1，很想换</text>
    <text x="320" y="338" font-size="12" font-weight="bold" fill="#b85450">但 (1−1) + (3−2) = 1 &lt; 2：弹掉 2 后凑不满 k = 2 个</text>
    <text x="320" y="362" font-size="12" fill="#3a5a3a">忍住不弹，1 入栈（栈长 1 &lt; k）→ 答案 [2,1] ✓</text>
    <text x="320" y="388" font-size="11" fill="#888">弹栈 = 「交换严格更优」 ∧ 「弹后仍可凑满」；守门条件管住第二件事</text>
  </g>
</svg>
