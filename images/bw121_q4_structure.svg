<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="336" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">强大整数的结构：自由前缀 + 固定后缀 s</text>
  <text x="280" y="58" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">x 的十进制表示（总位数 L = p + m，m = |s|）</text>
  <rect x="56" y="72" width="76" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="94" y="102" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">1..limit</text>
  <rect x="132" y="72" width="76" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="102" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0..limit</text>
  <rect x="208" y="72" width="76" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="246" y="102" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0..limit</text>
  <rect x="284" y="72" width="40" height="48" rx="6" fill="none" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="304" y="102" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">…</text>
  <rect x="324" y="72" width="180" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="414" y="102" text-anchor="middle" font-size="11" fill="#1c3a1c" filter="url(#rough2)">后缀 s（m 位，逐位固定）</text>
  <path d="M52,130 L508,130" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="132" y="148" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">自由前缀 p 位</text>
  <text x="414" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">固定后缀 m 位</text>
  <rect x="56" y="168" width="220" height="82" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="166" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">p ≥ 1：x 比 s 长</text>
  <text x="70" y="212" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 首位 1..limit：limit 种</text>
  <text x="70" y="234" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 其余 p−1 位 0..limit</text>
  <rect x="296" y="168" width="224" height="82" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="408" y="190" text-anchor="middle" font-size="12" fill="#1c3a1c" font-weight="bold" filter="url(#rough2)">p = 0：x 就是 s</text>
  <text x="310" y="212" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 只有一个候选：s 本身</text>
  <text x="310" y="234" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 需满足 s ≤ N 才计数</text>
  <rect x="56" y="262" width="464" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="288" y="284" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">统计 [1, N]：按总位数 L 分类（L &lt; len(N) 时自由计数，L = len(N) 时卡字典序上界）</text>
  <text x="288" y="304" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">最终答案 = count(finish) − count(start − 1)</text>
</svg>
