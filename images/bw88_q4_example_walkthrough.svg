<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="179"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums1 = [3,2,5]，nums2 = [2,2,1]，diff = 1</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="54">c[k] = nums1[k] − nums2[k] → c = [1, 0, 4]，统计 i &lt; j 且 c[i] ≤ c[j] + 1</text>
  </g>

  <!-- 表 -->
  <g filter="url(#rough2)">
    <rect x="66" y="74" width="430" height="216" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="130" y="98">j</text>
    <text x="210" y="98">阈值 c[j]+diff</text>
    <text x="330" y="98">query（BIT 中 ≤ 阈值）</text>
    <text x="452" y="98">累加答案</text>
  </g>
  <path d="M 76 108 L 486 108" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="130" y="136">0</text><text x="210" y="136">1 + 1 = 2</text>
    <text x="330" y="136">空 BIT → 0</text><text x="452" y="136">0</text>
    <text x="130" y="178">1</text><text x="210" y="178">0 + 1 = 1</text>
    <text x="330" y="178">已插入 {1}：1 ≤ 1 ✓ → 1</text><text x="452" y="178">1</text>
    <text x="130" y="220">2</text><text x="210" y="220">4 + 1 = 5</text>
    <text x="330" y="220">已插入 {1, 0}：两个都 ≤ 5 → 2</text><text x="452" y="220">2</text>
  </g>
  <path d="M 76 236 L 486 236" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13.5" fill="#b85450" font-weight="bold" text-anchor="middle">
    <text x="280" y="266">合计 0 + 1 + 2 = 3 ✓（对应数对 (0,1)、(0,2)、(1,2)）</text>
  </g>

  <!-- 插入轨迹 -->
  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
    <text x="280" y="316">BIT 插入轨迹：处理 j=0 后放 1；j=1 后放 0；j=2 后放 4（本例已无后续查询）</text>
  </g>

  <!-- 示例2 -->
  <g filter="url(#rough2)">
    <rect x="66" y="334" width="430" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a2f2b" text-anchor="middle">
    <text x="281" y="358">示例 2：c = [5, −3]，diff = −1 → c[0] ≤ c[1] − 1 要 5 ≤ −4 ✗</text>
    <text x="281" y="384">j=1 查询阈值为 −4，BIT 中 5 不满足 → 0，答案 0 ✓</text>
  </g>
</svg>
