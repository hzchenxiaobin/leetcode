<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="121" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：11 + 4 = 15</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 第 0 列面板 -->
  <g filter="url(#sk)">
    <rect x="30" y="70" width="280" height="252" rx="10" fill="#fdfdf9" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="170" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">第 0 列：[3, 1, 3, 0]</text>

  <g filter="url(#sk)">
    <rect x="54" y="104" width="42" height="28" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="54" y="142" width="42" height="28" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="54" y="180" width="42" height="28" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="54" y="218" width="42" height="28" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="126" y="104" width="42" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="126" y="142" width="42" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="126" y="180" width="42" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="126" y="218" width="42" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="180" y="107" width="44" height="22" rx="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="180" y="145" width="44" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="180" y="183" width="44" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="180" y="221" width="44" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace">
    <text x="75" y="123" fill="#555">3</text>
    <text x="75" y="161" fill="#555">1</text>
    <text x="75" y="199" fill="#555">3</text>
    <text x="75" y="237" fill="#555">0</text>
    <text x="147" y="123" fill="#2b6e9e" font-weight="bold">3</text>
    <text x="147" y="161" fill="#2b6e9e" font-weight="bold">4</text>
    <text x="147" y="199" fill="#2b6e9e" font-weight="bold">5</text>
    <text x="147" y="237" fill="#2b6e9e" font-weight="bold">6</text>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="202" y="123" fill="#2e6e2e">+0</text>
    <text x="202" y="161" fill="#b85450">+3</text>
    <text x="202" y="199" fill="#b85450">+2</text>
    <text x="202" y="237" fill="#b85450">+6</text>
  </g>
  <g font-size="10" fill="#999">
    <text x="232" y="123">首行，免动</text>
    <text x="232" y="161">1 ≤ 3，抬</text>
    <text x="232" y="199">3 ≤ 4，抬</text>
    <text x="232" y="237">0 ≤ 5，抬</text>
  </g>
  <g stroke="#3a3a3a" stroke-width="1.4" fill="none">
    <path d="M 100 118 L 121 118" marker-end="url(#ar)"/>
    <path d="M 100 156 L 121 156" marker-end="url(#ar)"/>
    <path d="M 100 194 L 121 194" marker-end="url(#ar)"/>
    <path d="M 100 232 L 121 232" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="54" y="256" width="232" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="170" y="275" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">小计 0 + 3 + 2 + 6 = 11</text>

  <!-- 加号 -->
  <text x="320" y="212" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3a3a">+</text>

  <!-- 第 1 列面板 -->
  <g filter="url(#sk)">
    <rect x="330" y="70" width="280" height="252" rx="10" fill="#fdfdf9" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="470" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">第 1 列：[2, 3, 4, 1]</text>

  <g filter="url(#sk)">
    <rect x="354" y="104" width="42" height="28" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="354" y="142" width="42" height="28" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="354" y="180" width="42" height="28" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="354" y="218" width="42" height="28" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="426" y="104" width="42" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="426" y="142" width="42" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="426" y="180" width="42" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="426" y="218" width="42" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="480" y="107" width="44" height="22" rx="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="480" y="145" width="44" height="22" rx="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="480" y="183" width="44" height="22" rx="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="480" y="221" width="44" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace">
    <text x="375" y="123" fill="#555">2</text>
    <text x="375" y="161" fill="#555">3</text>
    <text x="375" y="199" fill="#555">4</text>
    <text x="375" y="237" fill="#555">1</text>
    <text x="447" y="123" fill="#2b6e9e" font-weight="bold">2</text>
    <text x="447" y="161" fill="#2b6e9e" font-weight="bold">3</text>
    <text x="447" y="199" fill="#2b6e9e" font-weight="bold">4</text>
    <text x="447" y="237" fill="#2b6e9e" font-weight="bold">5</text>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="502" y="123" fill="#2e6e2e">+0</text>
    <text x="502" y="161" fill="#2e6e2e">+0</text>
    <text x="502" y="199" fill="#2e6e2e">+0</text>
    <text x="502" y="237" fill="#b85450">+4</text>
  </g>
  <g font-size="10" fill="#999">
    <text x="532" y="123">首行，免动</text>
    <text x="532" y="161">3 &gt; 2 ✓</text>
    <text x="532" y="199">4 &gt; 3 ✓</text>
    <text x="532" y="237">1 ≤ 4，抬</text>
  </g>
  <g stroke="#3a3a3a" stroke-width="1.4" fill="none">
    <path d="M 400 118 L 421 118" marker-end="url(#ar)"/>
    <path d="M 400 156 L 421 156" marker-end="url(#ar)"/>
    <path d="M 400 194 L 421 194" marker-end="url(#ar)"/>
    <path d="M 400 232 L 421 232" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="354" y="256" width="232" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="470" y="275" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">小计 0 + 0 + 0 + 4 = 4</text>

  <!-- 总计 -->
  <g filter="url(#sk)">
    <rect x="140" y="344" width="360" height="40" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="370" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">总操作数 = 11 + 4 = 15 ✓</text>
</svg>
