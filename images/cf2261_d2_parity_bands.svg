<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">σ 为偶数时：两端极点带都拿到空签名（∅），共类就必须多花一个探测器</text>
  <text x="60" y="84" text-anchor="start" font-size="12.5" font-weight="bold" fill="#66788c" filter="url(#rough2)">阶梯（层 0 … σ 共 σ+1 段）</text>
  <rect x="46" y="104" width="88" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="90" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">层 0 = ∅</text>
  <rect x="164" y="104" width="88" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="208" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">层 1</text>
  <rect x="282" y="104" width="88" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="326" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">层 2</text>
  <rect x="400" y="104" width="88" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="444" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">…</text>
  <rect x="518" y="104" width="88" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="562" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">层 σ−1</text>
  <rect x="636" y="104" width="88" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="680" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">层 σ = ∅</text>
  <path d="M 90 150 Q 387.0 144.0 680 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="176" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">位置沿直线单调向右 ⇒ 层号只增不减 ⇒ 每个新探测器的作用区间自动连续</text>
  <rect x="70" y="220" width="360" height="74" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="250" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c3b38" filter="url(#rough2)">层 0 与层 σ 的状态都是 ∅</text>
  <text x="250" y="270" text-anchor="middle" font-size="12" fill="#8c3b38" filter="url(#rough2)">⇒ [1,p₁] 与 [q_σ,n] 里的点两两不同类</text>
  <rect x="470" y="220" width="360" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="650" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33602a" filter="url(#rough2)">阶梯总共只有 2K 个不同状态</text>
  <text x="650" y="270" text-anchor="middle" font-size="12" fill="#33602a" filter="url(#rough2)">⇒ σ ≤ 2K−1，唯 σ=2K 时被迫重号</text>
  <rect x="120" y="318" width="660" height="76" rx="10" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450" y="342" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">σ = S−1 为偶数且第一段 Q₁ 与最后一段 Q_S 共类：2k = σ 次翻转只能全落在 σ 条切缝上，</text>
  <text x="450" y="364" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">每个探测器恰好两端、u ≥ p₁+1、v ≤ q_σ−1，两端带都成 ∅ ⇒ 同类撞车，k 必须 ⌈σ/2⌉+1。</text>
</svg>
