<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">一遍扫描：读入 '1' 时的六计数器接力（读 '0' 对称）</text>

  <!-- 流程 -->
  <rect x="180" y="52" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="14" fill="#33507a" font-weight="bold" filter="url(#rough2)">扫描到字符 s[i] = '1'</text>

  <path d="M 280 92 C 280 100, 280 104, 280 112" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="116" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="135" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">① 新的 "101"：以 '1' 结尾拼上旧 "10"</text>
  <text x="280" y="153" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">c101 += c10（必须最先，用的是旧值）</text>

  <path d="M 280 160 C 280 168, 280 172, 280 180" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="184" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="203" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">② 新的 "01"：以 '1' 结尾拼上旧 "0"</text>
  <text x="280" y="221" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">c01 += c0</text>

  <path d="M 280 228 C 280 236, 280 240, 280 248" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="252" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">③ 新的 "1"：单个字符自己</text>
  <text x="280" y="289" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">c1 += 1</text>

  <!-- 右侧提示框 -->
  <path d="M 424 134 C 452 134, 460 150, 462 166" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="440" y="172" width="104" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="492" y="194" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">顺序不能反！</text>
  <text x="492" y="212" text-anchor="middle" font-size="11" fill="#2d5a22" filter="url(#rough2)">先加长串再</text>
  <text x="492" y="228" text-anchor="middle" font-size="11" fill="#2d5a22" filter="url(#rough2)">加短串，否则</text>
  <text x="492" y="243" text-anchor="middle" font-size="11" fill="#2d5a22" filter="url(#rough2)">同一字符被用两次</text>

  <!-- 结尾 -->
  <rect x="100" y="316" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">扫完返回 c010 + c101，读 '0' 时三步完全对称</text>
</svg>
