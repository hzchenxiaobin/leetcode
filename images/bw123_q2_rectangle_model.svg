<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">A 必须左上、B 必须右下，且闭矩形内不能再有人</text>

  <!-- 左：不合法 -->
  <path d="M 60 250 L 210 250" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 250 L 60 100" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="254" font-size="10" fill="#888" filter="url(#rough2)">x</text>
  <text x="50" y="96" font-size="10" fill="#888" filter="url(#rough2)">y</text>

  <rect x="88" y="133" width="84" height="84" fill="#fce4ec" fill-opacity="0.75" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <circle cx="88" cy="133" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="172" cy="217" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="116" cy="161" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="80" y="126" text-anchor="end" font-size="11" fill="#8c3a3a" filter="url(#rough2)">A(1,4)</text>
  <text x="180" y="228" font-size="11" fill="#8c3a3a" filter="url(#rough2)">B(4,1)</text>
  <text x="122" y="158" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">C(2,3)</text>
  <text x="130" y="278" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">C 落在矩形内 → 不合法</text>
  <text x="130" y="300" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">只要内部或边界上还有人，这一对就不计数</text>

  <!-- 右：合法 -->
  <path d="M 340 250 L 490 250" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 250 L 340 100" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="494" y="254" font-size="10" fill="#888" filter="url(#rough2)">x</text>
  <text x="330" y="96" font-size="10" fill="#888" filter="url(#rough2)">y</text>

  <rect x="368" y="133" width="84" height="84" fill="#e6f4ea" fill-opacity="0.8" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="368" cy="133" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="452" cy="217" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="340" cy="105" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="480" cy="250" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="360" y="126" text-anchor="end" font-size="11" fill="#2f5226" filter="url(#rough2)">A(1,4)</text>
  <text x="460" y="228" font-size="11" fill="#2f5226" filter="url(#rough2)">B(4,1)</text>
  <text x="350" y="101" font-size="10" fill="#3a4a66" filter="url(#rough2)">P(0,5)</text>
  <text x="452" y="266" font-size="10" fill="#3a4a66" filter="url(#rough2)">Q(5,0)</text>
  <text x="410" y="278" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">矩形内空无一人 → 合法</text>
  <text x="410" y="300" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">P、Q 在矩形之外，不遮挡视线</text>

  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">判定时用闭区间：x ∈ [x_A, x_B] 且 y ∈ [y_B, y_A]，边界上的点也算「有人」</text>
</svg>
