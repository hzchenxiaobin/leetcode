<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例走查：s = "aababbb"，最优对 (a,b) = (b,a)</text>

  <!-- 字符行 -->
  <g filter="url(#rough2)">
    <rect x="80" y="52" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="142" y="52" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="204" y="52" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="266" y="52" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="328" y="52" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="390" y="52" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="452" y="52" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <text x="108" y="77">a</text><text x="170" y="77">a</text><text x="232" y="77">b</text>
    <text x="294" y="77">a</text><text x="356" y="77">b</text><text x="418" y="77">b</text><text x="480" y="77">b</text>
  </g>

  <!-- v 行 -->
  <g filter="url(#rough2)" font-size="13" fill="#666" text-anchor="middle">
    <text x="108" y="112">−1</text><text x="170" y="112">−1</text><text x="232" y="112">+1</text>
    <text x="294" y="112">−1</text><text x="356" y="112">+1</text><text x="418" y="112">+1</text><text x="480" y="112">+1</text>
  </g>
  <text x="60" y="112" font-size="11.5" fill="#888" text-anchor="end" filter="url(#rough2)">v =</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="80" y="128" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="142" y="128" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="204" y="128" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="266" y="128" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="328" y="128" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="390" y="128" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="452" y="128" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="108" y="147">dp0</text><text x="170" y="147">dp0</text><text x="232" y="147">dp0</text>
    <text x="294" y="147">dp0</text><text x="356" y="147">dp0</text><text x="418" y="147">dp0</text><text x="480" y="147">dp0</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="108" y="174">0</text><text x="170" y="174">0</text><text x="232" y="174">1</text>
    <text x="294" y="174">0</text><text x="356" y="174" font-weight="bold" fill="#2d5a22">1</text>
    <text x="418" y="174" font-weight="bold" fill="#2d5a22">2</text><text x="480" y="174" font-weight="bold" fill="#2d5a22">3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="80" y="188" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="142" y="188" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="204" y="188" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="266" y="188" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="328" y="188" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="390" y="188" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="452" y="188" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="108" y="207">dp1</text><text x="170" y="207">dp1</text><text x="232" y="207">dp1</text>
    <text x="294" y="207">dp1</text><text x="356" y="207">dp1</text><text x="418" y="207">dp1</text><text x="480" y="207">dp1</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="108" y="234">−1</text><text x="170" y="234">−1</text><text x="232" y="234">0</text>
    <text x="294" y="234">0</text>
    <text x="356" y="234" font-weight="bold" fill="#2d5a22">1</text>
    <text x="418" y="234" font-weight="bold" fill="#2d5a22">2</text>
    <text x="480" y="234" font-weight="bold" fill="#2d5a22">3 ★</text>
  </g>

  <!-- 注解 -->
  <g filter="url(#rough2)" font-size="11.5" fill="#555">
    <text x="80" y="258">位置 3（遇 a）：dp1 = max(−1−1, 1−1) = 0 —— 旧受限段拖累更大，选择从自由段重新接入</text>
  </g>
  <rect x="80" y="270" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="288" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">dp1 末位 = 3，对应子串 "babbb"（1 个 a、4 个 b）</text>
  <text x="290" y="304" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">区间和 = 4×(+1) + 1×(−1) = 3</text>

  <!-- 结论 -->
  <rect x="140" y="326" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">波动 = 3 ✓（与官方输出一致）</text>

  <text x="280" y="382" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">注意 (a,b)=(a,b) 方向只能得 1：有序对两个方向都要枚举</text>
</svg>
