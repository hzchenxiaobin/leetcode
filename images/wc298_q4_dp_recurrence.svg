<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/></marker>
  </defs>
  <rect width="880" height="600" fill="#fdfcf7"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">状态设计：dp[i][j] = 高 i × 宽 j 的木块最多能卖多少钱</text>
  <path d="M 170 40 Q 440 48 710 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部：i×j 木块 -->
  <g filter="url(#sk)"><rect x="368" y="58" width="144" height="78" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="440" y="94" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6e9e">i × j</text>
  <text x="440" y="118" text-anchor="middle" font-size="10.5" fill="#888">一块待决策的木块</text>
  <text x="540" y="100" font-size="11.5" fill="#888">价值只依赖尺寸，</text>
  <text x="540" y="116" font-size="11.5" fill="#888">与位置无关 → 状态唯一</text>

  <!-- 三条分叉箭头 -->
  <path d="M 400 136 Q 250 160 165 186" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 440 136 L 440 186" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 480 136 Q 630 160 715 186" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- 决策①：整块出售 -->
  <g filter="url(#sk)"><rect x="40" y="190" width="250" height="158" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="165" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">决策 ①：整块出售</text>
  <g filter="url(#sk)"><rect x="120" y="228" width="90" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="165" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">卖！¥</text>
  <text x="165" y="296" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">dp[i][j] ← price[i][j]</text>
  <text x="165" y="318" text-anchor="middle" font-size="10.5" fill="#888">（价格表无此尺寸则为 0）</text>
  <text x="165" y="338" text-anchor="middle" font-size="10.5" fill="#888">一刀不切，直接整块卖掉</text>

  <!-- 决策②：横切 -->
  <g filter="url(#sk)"><rect x="315" y="190" width="250" height="158" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="440" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a20">决策 ②：横切一刀（分裂高度）</text>
  <g filter="url(#sk)"><rect x="385" y="228" width="110" height="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="385" y="250" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <line x1="380" y1="250" x2="500" y2="250" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="510" y="245" font-size="10.5" fill="#a04a48" font-weight="bold">贯穿整宽</text>
  <text x="440" y="243" text-anchor="middle" font-size="10" fill="#2b6e9e">k × j</text>
  <text x="440" y="267" text-anchor="middle" font-size="10" fill="#2e6e2e">(i−k) × j</text>
  <text x="440" y="298" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">dp[k][j] + dp[i−k][j]</text>
  <text x="440" y="320" text-anchor="middle" font-size="10.5" fill="#888">切点 k ∈ [1, i−1]，两块独立卖</text>
  <text x="440" y="340" text-anchor="middle" font-size="10.5" fill="#888">（子问题互不影响！）</text>

  <!-- 决策③：竖切 -->
  <g filter="url(#sk)"><rect x="590" y="190" width="250" height="158" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="715" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04a48">决策 ③：竖切一刀（分裂宽度）</text>
  <g filter="url(#sk)"><rect x="650" y="228" width="42" height="48" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="692" y="228" width="68" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <line x1="692" y1="222" x2="692" y2="282" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="671" y="257" text-anchor="middle" font-size="9.5" fill="#2b6e9e">i×k</text>
  <text x="726" y="257" text-anchor="middle" font-size="9.5" fill="#2e6e2e">i×(j−k)</text>
  <text x="715" y="298" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">dp[i][k] + dp[i][j−k]</text>
  <text x="715" y="320" text-anchor="middle" font-size="10.5" fill="#888">切点 k ∈ [1, j−1]，两块独立卖</text>
  <text x="715" y="340" text-anchor="middle" font-size="10.5" fill="#888">（不能旋转，高宽方向固定）</text>

  <!-- 转移公式 -->
  <g filter="url(#sk)"><rect x="40" y="366" width="800" height="50" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g>
  <text x="440" y="397" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">dp[i][j] = max( price[i][j] , max_k ( dp[k][j] + dp[i−k][j] ) , max_k ( dp[i][k] + dp[i][j−k] ) )</text>

  <!-- 底部：切割树模型 -->
  <g filter="url(#sk)"><rect x="40" y="436" width="800" height="142" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="60" y="462" font-size="12.5" font-weight="bold" fill="#7a5415">切割树模型：任意合法切法 = 一棵二叉树</text>
  <!-- 树：根 -->
  <g filter="url(#sk)"><ellipse cx="150" cy="498" rx="38" ry="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="150" y="503" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">m×n</text>
  <!-- 内部节点 -->
  <g filter="url(#sk)"><circle cx="95" cy="545" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><circle cx="205" cy="545" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)" stroke="#8a8a8a" stroke-width="1.3" fill="none">
    <line x1="128" y1="512" x2="102" y2="534"/><line x1="172" y1="512" x2="198" y2="534"/>
  </g>
  <!-- 叶子 -->
  <g filter="url(#sk)"><rect x="58" y="562" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="108" y="562" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="168" y="562" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="218" y="562" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#sk)" stroke="#8a8a8a" stroke-width="1.2" fill="none">
    <line x1="90" y1="555" x2="74" y2="562"/><line x1="100" y1="557" x2="118" y2="562"/>
    <line x1="200" y1="555" x2="182" y2="562"/><line x1="210" y1="555" x2="228" y2="562"/>
  </g>
  <text x="70" y="576" text-anchor="middle" font-size="10" fill="#2e6e2e">¥</text>
  <text x="120" y="576" text-anchor="middle" font-size="10" fill="#2e6e2e">¥</text>
  <text x="180" y="576" text-anchor="middle" font-size="10" fill="#2e6e2e">¥</text>
  <text x="230" y="576" text-anchor="middle" font-size="10" fill="#2e6e2e">扔</text>
  <!-- 右侧说明 -->
  <text x="300" y="490" font-size="11.5" fill="#444">· 内部节点 = 对某块矩形切一刀；叶子 = 最终小木块（整块卖 ¥ 或丢弃）</text>
  <text x="300" y="514" font-size="11.5" fill="#444">· 总收益 = 各叶子价格之和（丢弃 = 0，报价恒 ≥ 0，故「不必全卖」自动被覆盖）</text>
  <text x="300" y="538" font-size="11.5" fill="#444">· 每刀都让子块面积严格变小 → 按 i、j 升序填表，被依赖状态必然先算好</text>
  <text x="300" y="562" font-size="11.5" fill="#a06a20" font-weight="bold">· 只允许「完全贯穿」的切法（每刀必得两个矩形），非贯穿分块不可达</text>
</svg>
