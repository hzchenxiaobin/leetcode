<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="390" fill="#fdfcf7"/>

  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">第 k 近障碍物 = 最小 k 个距离中的最大值</text>
  <path d="M 190 44 Q 320 52 450 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- coordinate plane -->
  <path d="M 150 315 L 150 80" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 52 225 L 278 225" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="286" y="230" font-size="12" fill="#666">x</text>
  <text x="160" y="90" font-size="12" fill="#666">y</text>
  <text x="137" y="243" font-size="12" fill="#666">O</text>

  <!-- manhattan L path to (2,3) -->
  <path d="M 150 225 L 204 225 L 204 144" stroke="#b85450" stroke-width="1.6" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="88" y="284" font-size="11" fill="#b85450">d = |x| + |y|（曼哈顿距离）</text>

  <!-- obstacles -->
  <ellipse cx="177" cy="171" rx="6" ry="6" fill="#d6a040" stroke="#8a6a20" stroke-width="1.2" filter="url(#sk)"/>
  <text x="189" y="166" font-size="11" font-weight="bold" fill="#b07818">(1,2) d=3</text>
  <ellipse cx="204" cy="144" rx="6" ry="6" fill="#8aa0b8" stroke="#5a7290" stroke-width="1.2" filter="url(#sk)"/>
  <text x="216" y="139" font-size="11" fill="#5a7290">(2,3) d=5</text>
  <ellipse cx="231" cy="117" rx="6" ry="6" fill="#8aa0b8" stroke="#5a7290" stroke-width="1.2" filter="url(#sk)"/>
  <text x="243" y="112" font-size="11" fill="#5a7290">(3,4) d=7</text>
  <ellipse cx="69" cy="225" rx="6" ry="6" fill="#d6a040" stroke="#8a6a20" stroke-width="1.2" filter="url(#sk)"/>
  <text x="69" y="251" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">(−3,0) d=3</text>

  <text x="160" y="342" text-anchor="middle" font-size="11.5" fill="#666">示例 1 的 4 个障碍物（k = 2）</text>
  <rect x="55" y="356" width="13" height="13" fill="#d6a040" stroke="#8a6a20" stroke-width="1" rx="3" filter="url(#sk)"/>
  <text x="74" y="367" font-size="11" fill="#444">堆内：最小 k=2 个</text>
  <rect x="205" y="356" width="13" height="13" fill="#8aa0b8" stroke="#5a7290" stroke-width="1" rx="3" filter="url(#sk)"/>
  <text x="224" y="367" font-size="11" fill="#444">堆外</text>

  <!-- right column: heap -->
  <text x="468" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">堆顶 = 第 2 近 ★</text>
  <path d="M 468 70 L 468 84" stroke="#b07818" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <ellipse cx="468" cy="112" rx="24" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#sk)"/>
  <text x="468" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <path d="M 468 136 L 468 162" stroke="#7a7a7a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <ellipse cx="468" cy="184" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="468" y="189" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="468" y="224" text-anchor="middle" font-size="11.5" fill="#555">容量 k=2 的大根堆：只装最小 2 个距离 {3, 3}</text>

  <rect x="335" y="240" width="266" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="468" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">5 与 7 挡在堆外</text>
  <text x="468" y="284" text-anchor="middle" font-size="11.5" fill="#333">d ≥ 堆顶的距离永远进不了「最小 k 个」</text>

  <rect x="335" y="310" width="266" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="468" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">第 k 近 = 最小 k 个的最大值</text>
  <text x="468" y="354" text-anchor="middle" font-size="11.5" fill="#333">堆顶即答案，每次更新 O(log k)</text>
</svg>
