<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">排序后：平衡子数组 = 一个满足 a[r] ≤ a[l]·k 的连续区间</text>
  <text x="110" y="124" text-anchor="end" font-size="12.5" fill="#666" filter="url(#rough2)">排序后</text>
  <rect x="150" y="92" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="177.0" y="124.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="177.0" y="164" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="212" y="92" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="239.0" y="124.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <text x="239.0" y="164" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <rect x="274" y="92" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="301.0" y="124.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">6</text>
  <text x="301.0" y="164" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <rect x="336" y="92" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="363.0" y="124.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">9</text>
  <text x="363.0" y="164" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <rect x="144" y="84" width="126" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="208" y="190" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">窗口 [0,1]：max 2 ≤ 1×3 ✓</text>
  <text x="150" y="236" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">窗口 [0,3]：max 9 &gt; 1×3 ✗</text>
  <text x="210" y="262" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">⇒ l 右移，直到条件重新成立</text>
  <rect x="40" y="286" width="300" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="312" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">右端点 r 每次加 1，</text>
  <text x="190" y="336" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">左端点 l 只增不减 ⇒ 双指针</text>
  <rect x="360" y="286" width="300" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="312" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">最长平衡子数组长 best，</text>
  <text x="510" y="336" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">答案 = n − best</text>
  <text x="40" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)"></text>
  <text x="360" y="60" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">（排序不改变「能否同时保留」的判定，只改变相邻关系）</text>
</svg>
