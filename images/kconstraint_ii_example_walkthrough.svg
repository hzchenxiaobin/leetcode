<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="410" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：s = "010101"，k = 1</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)" fill="#f4f6f8" stroke="#8a97a5" stroke-width="1.2">
    <rect x="56" y="58" width="90" height="28"/>
    <rect x="150" y="58" width="58" height="28"/>
    <rect x="208" y="58" width="58" height="28"/>
    <rect x="266" y="58" width="58" height="28"/>
    <rect x="324" y="58" width="58" height="28"/>
    <rect x="382" y="58" width="58" height="28"/>
    <rect x="440" y="58" width="58" height="28"/>
  </g>
  <text x="101" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#sk)">b</text>
  <g filter="url(#sk)" font-size="12.5" font-weight="bold" fill="#33506b" text-anchor="middle">
    <text x="179" y="77">0</text>
    <text x="237" y="77">1</text>
    <text x="295" y="77">2</text>
    <text x="353" y="77">3</text>
    <text x="411" y="77">4</text>
    <text x="469" y="77">5</text>
  </g>

  <g filter="url(#sk)" fill="#ffffff" stroke="#8a97a5" stroke-width="1.2">
    <rect x="56" y="86" width="90" height="28"/>
    <rect x="150" y="86" width="58" height="28"/><rect x="208" y="86" width="58" height="28"/>
    <rect x="266" y="86" width="58" height="28"/><rect x="324" y="86" width="58" height="28"/>
    <rect x="382" y="86" width="58" height="28"/><rect x="440" y="86" width="58" height="28"/>
  </g>
  <text x="101" y="105" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#sk)">s[b]</text>
  <g filter="url(#sk)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="179" y="105">0</text><text x="237" y="105">1</text><text x="295" y="105">0</text>
    <text x="353" y="105">1</text><text x="411" y="105">0</text><text x="469" y="105">1</text>
  </g>

  <g filter="url(#sk)" fill="#ffffff" stroke="#8a97a5" stroke-width="1.2">
    <rect x="56" y="114" width="90" height="28"/>
    <rect x="150" y="114" width="58" height="28"/><rect x="440" y="114" width="58" height="28"/>
  </g>
  <g filter="url(#sk)" fill="#fce4ec" stroke="#b85450" stroke-width="1.2">
    <rect x="208" y="114" width="58" height="28"/><rect x="266" y="114" width="58" height="28"/>
  </g>
  <g filter="url(#sk)" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2">
    <rect x="324" y="114" width="58" height="28"/><rect x="382" y="114" width="58" height="28"/>
  </g>
  <text x="101" y="133" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#sk)">L[b]</text>
  <g filter="url(#sk)" font-size="12.5" font-weight="bold" text-anchor="middle">
    <text x="179" y="133" fill="#333">0</text>
    <text x="237" y="133" fill="#b03a3a">0</text><text x="295" y="133" fill="#b03a3a">0</text>
    <text x="353" y="133" fill="#2e6e2e">1</text><text x="411" y="133" fill="#2e6e2e">2</text>
    <text x="469" y="133" fill="#333">3</text>
  </g>

  <g filter="url(#sk)" fill="#ffffff" stroke="#8a97a5" stroke-width="1.2">
    <rect x="56" y="142" width="90" height="28"/>
    <rect x="150" y="142" width="58" height="28"/><rect x="208" y="142" width="58" height="28"/>
    <rect x="266" y="142" width="58" height="28"/><rect x="324" y="142" width="58" height="28"/>
    <rect x="382" y="142" width="58" height="28"/><rect x="440" y="142" width="58" height="28"/>
  </g>
  <text x="101" y="161" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#sk)">p[b]</text>
  <g filter="url(#sk)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="179" y="161">1</text><text x="237" y="161">2</text><text x="295" y="161">3</text>
    <text x="353" y="161">3</text><text x="411" y="161">3</text><text x="469" y="161">3</text>
  </g>

  <g filter="url(#sk)" fill="#ffffff" stroke="#8a97a5" stroke-width="1.2">
    <rect x="56" y="170" width="90" height="28"/>
    <rect x="150" y="170" width="58" height="28"/><rect x="208" y="170" width="58" height="28"/>
    <rect x="266" y="170" width="58" height="28"/><rect x="324" y="170" width="58" height="28"/>
    <rect x="382" y="170" width="58" height="28"/><rect x="440" y="170" width="58" height="28"/>
  </g>
  <text x="101" y="189" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#sk)">S[b]</text>
  <g filter="url(#sk)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="179" y="189">1</text><text x="237" y="189">3</text><text x="295" y="189">6</text>
    <text x="353" y="189">9</text><text x="411" y="189">12</text><text x="469" y="189">15</text>
  </g>

  <g filter="url(#sk)" font-size="10.5" fill="#444">
    <text x="516" y="72">L：每个右端点的</text>
    <text x="516" y="88">最小合法左端点，</text>
    <text x="516" y="104">单调不降 → 可二分</text>
    <text x="516" y="140">p[b]：以 b 结尾的</text>
    <text x="516" y="156">好子串个数</text>
    <text x="516" y="192">S：p 的前缀和</text>
  </g>

  <g filter="url(#sk)"><rect x="208" y="114" width="58" height="28" rx="4" fill="none" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="70" y="218" font-size="10.5" fill="#b03a3a" filter="url(#sk)">■ 红：L[b] &lt; l（查询 [1,4] 的 l=1 视角）</text>
  <text x="330" y="218" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">■ 绿：L[b] ≥ l → 属右区</text>

  <g filter="url(#sk)"><rect x="40" y="238" width="196" height="118" rx="8" fill="#f4f6f8" stroke="#8a97a5" stroke-width="1.3"/></g>
  <text x="138" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#sk)">查询 [0, 5]</text>
  <text x="138" y="286" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">l = 0：所有 L[b] ≥ 0</text>
  <text x="138" y="306" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">m = 0，左区为空</text>
  <text x="138" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b" filter="url(#sk)">ans = S[5] = 15 ✓</text>

  <g filter="url(#sk)"><rect x="242" y="238" width="196" height="118" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="340" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">查询 [1, 4]</text>
  <text x="340" y="286" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">首个 L[b] ≥ 1 → m = 3</text>
  <text x="340" y="306" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">T(2) = 3，S[4]−S[2] = 6</text>
  <text x="340" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 3 + 6 = 9 ✓</text>

  <g filter="url(#sk)"><rect x="444" y="238" width="196" height="118" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="542" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">查询 [2, 3]</text>
  <text x="542" y="286" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">[2,3] 内无 L[b] ≥ 2</text>
  <text x="542" y="306" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">→ m = 4 = r+1，右区空</text>
  <text x="542" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">ans = T(2) = 3 ✓</text>

  <text x="340" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">三查询输出 [15, 9, 3]，与示例 2 一致 ✓</text>
</svg>
