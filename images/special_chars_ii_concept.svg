<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：末个小写 vs 首个大写，一次比较代表全体</text>

  <text x="60" y="48" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">word = "aaAbcBC"</text>

  <!-- word boxes -->
  <rect x="90" y="56" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="86" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="142" y="56" width="44" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="164" y="86" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="194" y="56" width="44" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="216" y="86" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">A</text>

  <rect x="246" y="56" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="86" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>

  <rect x="298" y="56" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="86" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>

  <rect x="350" y="56" width="44" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="372" y="86" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">B</text>

  <rect x="402" y="56" width="44" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="424" y="86" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>

  <!-- indices -->
  <text x="112" y="114" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="164" y="114" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="216" y="114" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="268" y="114" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="320" y="114" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="372" y="114" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="424" y="114" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>

  <!-- annotations for extreme positions of letter a -->
  <path d="M 164 104 L 150 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="58" y="132" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="113" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">末个小写 a（i=1）</text>

  <path d="M 216 104 L 240 130" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="188" y="132" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="243" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">首个大写 A（i=2）</text>

  <rect x="312" y="132" width="146" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="385" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">字母 a：末小 1 &lt; 首大 2 ✓</text>

  <!-- number line -->
  <rect x="90" y="196" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150" y="209" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">小写在场 ✓</text>
  <rect x="210" y="196" width="120" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="209" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">次序达标 ✓</text>
  <rect x="330" y="196" width="120" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="390" y="209" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">大写在场 ✓</text>

  <path d="M 70 232 L 475 232" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="90" y1="225" x2="90" y2="239" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="210" y1="225" x2="210" y2="239" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="330" y1="225" x2="330" y2="239" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="450" y1="225" x2="450" y2="239" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="90" y="254" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">lastLower = −1</text>
  <text x="210" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">lastLower = 1</text>
  <text x="330" y="254" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">firstUpper = 2</text>
  <text x="450" y="254" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">firstUpper = n</text>

  <rect x="70" y="266" width="380" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−1 &lt; lastLower &lt; firstUpper &lt; n（一行编码三个条件）</text>

  <rect x="70" y="308" width="380" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">充分性：全体小写 ≤ lastLower，末小写没越过首大写 ⇒ 全体都安全</text>

  <rect x="70" y="344" width="380" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">必要性：只要有一个小写越界，末小写必然也在越界者之列 ⇒ 判定必败</text>

  <rect x="58" y="380" width="404" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="398" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Q1 出勤表只记「来没来过」；本题追问「先来还是后到」→ 存在性升级为位置</text>
</svg>
