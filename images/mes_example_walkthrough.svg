<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">示例演算：一次求交，一次判空</text>

  <!-- ============ panel 1: example 1 ============ -->
  <rect x="18" y="44" width="524" height="196" rx="10" fill="#fcfcfc" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="36" y="70" font-size="13.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">示例 1：nums1 = [3,2,0,1,0]，nums2 = [6,5,0] → 12</text>
  <text x="36" y="92" font-size="11.5" fill="#33507a" filter="url(#rough2)">s₁=6, z₁=2 ⟹ min₁=8　｜　s₂=11, z₂=1 ⟹ min₂=12</text>

  <!-- ticks above: 8 at x=70, 11 at x=214, 12 at x=262 -->
  <text x="70" y="118" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="214" y="118" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">11（s₂）</text>
  <text x="262" y="118" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">12</text>

  <!-- blue band: nums1 [8, +∞) -->
  <rect x="70" y="126" width="440" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="140" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">nums₁ 可达 [8, +∞)</text>

  <!-- axis -->
  <path d="M 40 150 L 520 150" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 70 144 L 70 156" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 214 144 L 214 156" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 262 144 L 262 156" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- green band: nums2 [12, +∞) -->
  <rect x="262" y="160" width="248" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="386" y="174" text-anchor="middle" font-size="10.5" fill="#2d5a20" filter="url(#rough2)">nums₂ 可达 [12, +∞)</text>

  <!-- intersection marker -->
  <path d="M 262 116 L 262 184" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="262" cy="150" r="5.5" fill="#b85450" filter="url(#rough2)"/>

  <!-- verdict -->
  <rect x="36" y="196" width="488" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="12" fill="#2d5a20" filter="url(#rough2)">lo = max(8, 12) = 12；下界小的 nums₁ 有零可拉高 ⟹ 答案 12 ✓</text>

  <!-- ============ panel 2: example 2 ============ -->
  <rect x="18" y="252" width="524" height="196" rx="10" fill="#fcfcfc" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="36" y="278" font-size="13.5" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">示例 2：nums1 = [2,0,2,0]，nums2 = [1,4] → -1</text>
  <text x="36" y="300" font-size="11.5" fill="#33507a" filter="url(#rough2)">s₁=4, z₁=2 ⟹ min₁=6　｜　s₂=5, z₂=0 ⟹ 定值 {5}</text>

  <!-- nums2 fixed point: 5 at x=130 -->
  <text x="130" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">nums₂ = {5}（无零）</text>

  <!-- blue band: nums1 [6, +∞), 6 at x=190 -->
  <rect x="190" y="332" width="320" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="350" y="346" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">nums₁ 可达 [6, +∞)</text>

  <!-- axis -->
  <path d="M 40 356 L 520 356" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 70 350 L 70 362" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 130 350 L 130 362" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 190 350 L 190 362" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="378" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="130" y="378" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="190" y="378" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- fixed point dot + unreachable arrow -->
  <circle cx="130" cy="356" r="6" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 140 356 L 182 356" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="161" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">够不到</text>

  <!-- verdict -->
  <rect x="36" y="392" width="488" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">lo = max(6, 5) = 6 &gt; 5 = s₂，而 z₂ = 0：nums₂ 被钉死在 5</text>
  <text x="280" y="428" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">交为空 ⟹ 返回 -1 ✗</text>
</svg>
