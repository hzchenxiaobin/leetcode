<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="920" height="580" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">升序贪心：小组先行，组 L 拿走 value 最大的 min(组大小, L) 个</text>
  <path d="M 200 44 Q 460 54 720 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左面板：升序 -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="520" height="330" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="300" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">✓ 按 limit 升序处理</text>

  <g filter="url(#sk)">
    <rect x="66" y="108" width="118" height="174" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="125" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">组 1 · 大小 3</text>
  <g filter="url(#sk)">
    <circle cx="125" cy="160" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <circle cx="125" cy="194" r="13" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5"/>
    <circle cx="125" cy="228" r="13" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5"/>
  </g>
  <text x="125" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">7</text>
  <text x="125" y="199" text-anchor="middle" font-size="12.5" fill="#999">4</text>
  <text x="125" y="233" text-anchor="middle" font-size="12.5" fill="#999">2</text>
  <text x="125" y="304" text-anchor="middle" font-size="11.5" fill="#444">配额 min(3,1)=1</text>
  <text x="125" y="322" text-anchor="middle" font-size="11.5" fill="#888">救 value 最大 1 个</text>

  <g filter="url(#sk)">
    <rect x="216" y="108" width="118" height="174" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="275" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">组 2 · 大小 2</text>
  <g filter="url(#sk)">
    <circle cx="275" cy="165" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <circle cx="275" cy="205" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="275" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">8</text>
  <text x="275" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">5</text>
  <text x="275" y="304" text-anchor="middle" font-size="11.5" fill="#444">配额 min(2,2)=2</text>
  <text x="275" y="322" text-anchor="middle" font-size="11.5" fill="#888">全部救走</text>

  <g filter="url(#sk)">
    <rect x="366" y="108" width="118" height="174" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="425" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">组 3 · 大小 5</text>
  <g filter="url(#sk)">
    <circle cx="425" cy="152" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <circle cx="425" cy="180" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <circle cx="425" cy="208" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <circle cx="425" cy="236" r="12" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5"/>
    <circle cx="425" cy="264" r="12" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5"/>
  </g>
  <text x="425" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">9</text>
  <text x="425" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">6</text>
  <text x="425" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">4</text>
  <text x="425" y="241" text-anchor="middle" font-size="12" fill="#999">3</text>
  <text x="425" y="269" text-anchor="middle" font-size="12" fill="#999">1</text>
  <text x="425" y="304" text-anchor="middle" font-size="11.5" fill="#444">配额 min(5,3)=3</text>
  <text x="425" y="322" text-anchor="middle" font-size="11.5" fill="#888">救 top-3</text>

  <g filter="url(#sk)">
    <path d="M 188 195 L 212 195" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)"/>
    <path d="M 338 195 L 362 195" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)"/>
    <path d="M 488 195 L 526 195" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)"/>
  </g>
  <text x="200" y="180" text-anchor="middle" font-size="10.5" fill="#446688">顶到 1</text>
  <text x="350" y="180" text-anchor="middle" font-size="10.5" fill="#446688">顶到 2</text>
  <text x="507" y="180" text-anchor="middle" font-size="10.5" fill="#446688">顶到 3</text>

  <text x="300" y="348" text-anchor="middle" font-size="11.5" fill="#444">处理组 L 时水位从未越过 L，后面的大组毫发无损；</text>
  <text x="300" y="368" text-anchor="middle" font-size="11.5" fill="#444">小组残留还会在爬升途中失活，名额即刻返还。</text>

  <!-- 右面板：反例 -->
  <g filter="url(#sk)">
    <rect x="588" y="62" width="300" height="330" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="738" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">✗ 先激活大 limit 的会翻车</text>
  <text x="738" y="116" text-anchor="middle" font-size="12.5" fill="#444">value = [1, 100]，limit = [1, 2]</text>

  <text x="612" y="150" font-size="12" font-weight="bold" fill="#b85450">乱序</text>
  <g filter="url(#sk)">
    <circle cx="660" cy="172" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="762" cy="172" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="660" y="177" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">100</text>
  <text x="660" y="206" text-anchor="middle" font-size="10.5" fill="#666">L=2</text>
  <text x="762" y="177" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1</text>
  <text x="762" y="206" text-anchor="middle" font-size="10.5" fill="#666">L=1</text>
  <g filter="url(#sk)">
    <path d="M 682 172 L 730 172" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)"/>
    <path d="M 750 160 L 774 184" stroke="#b85450" stroke-width="2" fill="none"/>
    <path d="M 774 160 L 750 184" stroke="#b85450" stroke-width="2" fill="none"/>
  </g>
  <text x="706" y="162" text-anchor="middle" font-size="11" fill="#444">x=1</text>
  <text x="738" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">总和 = 100（1 号被淹没）</text>

  <text x="612" y="262" font-size="12" font-weight="bold" fill="#2e6e2e">升序</text>
  <g filter="url(#sk)">
    <circle cx="660" cy="284" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="762" cy="284" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="660" y="289" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="660" y="318" text-anchor="middle" font-size="10.5" fill="#666">L=1</text>
  <text x="762" y="289" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">100</text>
  <text x="762" y="318" text-anchor="middle" font-size="10.5" fill="#666">L=2</text>
  <g filter="url(#sk)">
    <path d="M 682 284 L 730 284" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)"/>
  </g>
  <text x="706" y="274" text-anchor="middle" font-size="11" fill="#444">x=1</text>
  <text x="738" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">总和 = 101 ✓</text>
  <text x="738" y="374" text-anchor="middle" font-size="11" fill="#888">顶高水位 + 永久占坑，双重伤害</text>

  <!-- 底部：配额精细化 -->
  <g filter="url(#sk)">
    <rect x="40" y="412" width="848" height="148" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="464" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">配额的精细化（引理 2 预告）</text>
  <text x="70" y="470" font-size="12" fill="#444">· 设水位首次达到 L 时，此前已激活 P 个 limit &gt; L 的元素 —— 它们永不失活、永久占坑；</text>
  <text x="70" y="496" font-size="12" fill="#444">· 组 L 实际至多激活 L − P 个（L − 1 个坑被占了，最后一个坑留给自己）；</text>
  <text x="70" y="522" font-size="12" fill="#444">· 升序处理保证每组进场时 P = 0，于是组组都能拿满 min(组大小, L)。</text>
</svg>
