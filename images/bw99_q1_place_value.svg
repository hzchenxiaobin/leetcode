<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">位权视角：均衡拆分 + 重排不等式</text>

  <!-- 左侧：均衡 vs 不均衡 -->
  <text x="130" y="66" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">4 个数位拆成两个数</text>
  <text x="130" y="92" font-size="12" fill="#4a7a3a" filter="url(#rough2)">均衡 (2+2)：位权 10,10,1,1</text>
  <rect x="70" y="102" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="104" y="102" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="138" y="102" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="172" y="102" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="119" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">10</text>
  <text x="119" y="119" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">10</text>
  <text x="153" y="119" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="187" y="119" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">1</text>

  <text x="130" y="152" font-size="12" fill="#b85450" filter="url(#rough2)">不均衡 (3+1)：位权 100,10,1,1</text>
  <rect x="70" y="162" width="34" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="108" y="162" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="142" y="162" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="162" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="179" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">100</text>
  <text x="123" y="179" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">10</text>
  <text x="157" y="179" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">1</text>
  <text x="191" y="179" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">1</text>
  <text x="130" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">把数位挪去拼长数</text>
  <text x="130" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">= 用大位权替换小位权</text>
  <text x="130" y="248" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">→ 和只会变大！</text>

  <!-- 右侧：交换论证 -->
  <text x="380" y="66" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">交换论证（反序对）</text>
  <text x="380" y="96" font-size="12" fill="#333" filter="url(#rough2)">高位放 5、低位放 2：</text>
  <rect x="322" y="106" width="34" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="339" y="124" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">5</text>
  <text x="310" y="124" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">×10</text>
  <rect x="404" y="106" width="34" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="421" y="124" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">2</text>
  <text x="448" y="124" font-size="11" fill="#888" filter="url(#rough2)">×1</text>
  <text x="380" y="156" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">50 + 2 = 52</text>

  <path d="M 339 138 C 350 162 398 162 412 140" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 421 138 C 410 162 362 162 348 140" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="380" y="176" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">交换两者</text>

  <text x="380" y="204" font-size="12" fill="#333" filter="url(#rough2)">高位放 2、低位放 5：</text>
  <rect x="322" y="214" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="339" y="232" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">2</text>
  <text x="310" y="232" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">×10</text>
  <rect x="404" y="214" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="421" y="232" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">5</text>
  <text x="448" y="232" font-size="11" fill="#888" filter="url(#rough2)">×1</text>
  <text x="380" y="264" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">20 + 5 = 25 &lt; 52 ✓</text>

  <rect x="120" y="292" width="290" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="265" y="317" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">最优 = 升序数位 × 降序位权 逐一配对</text>
</svg>
