<svg xmlns="http://www.w3.org/2000/svg" width="640" height="415" viewBox="0 0 640 415" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="77" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="415" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [5, 4, 8, 7, 10, 2]</text>
  <path d="M 170 42 Q 320 52 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array cells -->
  <g text-anchor="middle" font-size="14">
    <g filter="url(#sk)">
      <rect x="176" y="64" width="48" height="42" rx="5" fill="#f4f4f4" stroke="#aaa" stroke-width="1.3"/>
      <rect x="224" y="64" width="48" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
      <rect x="272" y="64" width="48" height="42" rx="5" fill="#f4f4f4" stroke="#aaa" stroke-width="1.3"/>
      <rect x="320" y="64" width="48" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
      <rect x="368" y="64" width="48" height="42" rx="5" fill="#f4f4f4" stroke="#aaa" stroke-width="1.3"/>
      <rect x="416" y="64" width="48" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    </g>
    <text x="200" y="90" fill="#555" filter="url(#sk)">5</text>
    <text x="248" y="90" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">4</text>
    <text x="296" y="90" fill="#555" filter="url(#sk)">8</text>
    <text x="344" y="90" fill="#a06a10" font-weight="bold" font-size="15" filter="url(#sk)">7</text>
    <text x="392" y="90" fill="#555" filter="url(#sk)">10</text>
    <text x="440" y="90" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#888">
    <text x="200" y="122" filter="url(#sk)">0</text>
    <text x="248" y="122" filter="url(#sk)">1</text>
    <text x="296" y="122" filter="url(#sk)">2</text>
    <text x="344" y="122" filter="url(#sk)">3</text>
    <text x="392" y="122" filter="url(#sk)">4</text>
    <text x="440" y="122" filter="url(#sk)">5</text>
  </g>
  <text x="248" y="57" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">左腿</text>
  <text x="344" y="57" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">山峰</text>
  <text x="440" y="57" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">右腿</text>

  <text x="320" y="144" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">预处理：从右→左递推 suf，尾部 2 一路锁死 ⇒ suf[j+1] 恒为 2</text>

  <!-- walkthrough table -->
  <g font-size="12.5" text-anchor="middle">
    <g filter="url(#sk)">
      <rect x="60" y="158" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
      <rect x="106" y="158" width="66" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
      <rect x="172" y="158" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
      <rect x="258" y="158" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
      <rect x="344" y="158" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
      <rect x="432" y="158" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
      <rect x="520" y="158" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    </g>
    <g fill="#2b4a6e" font-weight="bold" font-size="12">
      <text x="83"  y="177" filter="url(#sk)">j</text>
      <text x="139" y="177" filter="url(#sk)">nums[j]</text>
      <text x="215" y="177" filter="url(#sk)">preMin</text>
      <text x="301" y="177" filter="url(#sk)">suf[j+1]</text>
      <text x="388" y="177" filter="url(#sk)">山峰成立？</text>
      <text x="476" y="177" filter="url(#sk)">候选和</text>
      <text x="550" y="177" filter="url(#sk)">ans</text>
    </g>

    <!-- row j=1 invalid -->
    <g filter="url(#sk)">
      <rect x="60" y="188" width="46" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
      <rect x="106" y="188" width="66" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
      <rect x="172" y="188" width="86" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
      <rect x="258" y="188" width="86" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
      <rect x="344" y="188" width="88" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
      <rect x="432" y="188" width="88" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
      <rect x="520" y="188" width="60" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
    </g>
    <g fill="#777">
      <text x="83"  y="208" filter="url(#sk)">1</text>
      <text x="139" y="208" filter="url(#sk)">4</text>
      <text x="215" y="208" filter="url(#sk)">5</text>
      <text x="301" y="208" filter="url(#sk)">2</text>
      <text x="388" y="208" fill="#b85450" filter="url(#sk)">✗（5 ≥ 4）</text>
      <text x="476" y="208" filter="url(#sk)">—</text>
      <text x="550" y="208" filter="url(#sk)">∞</text>
    </g>

    <!-- row j=2 valid -->
    <g filter="url(#sk)">
      <rect x="60" y="220" width="46" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="106" y="220" width="66" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="172" y="220" width="86" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="258" y="220" width="86" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="344" y="220" width="88" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="432" y="220" width="88" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="520" y="220" width="60" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
    </g>
    <g fill="#3e5a3a">
      <text x="83"  y="240" filter="url(#sk)">2</text>
      <text x="139" y="240" filter="url(#sk)">8</text>
      <text x="215" y="240" filter="url(#sk)">4</text>
      <text x="301" y="240" filter="url(#sk)">2</text>
      <text x="388" y="240" fill="#2e6e2e" filter="url(#sk)">✓</text>
      <text x="476" y="240" filter="url(#sk)">4+8+2 = 14</text>
      <text x="550" y="240" filter="url(#sk)">14</text>
    </g>

    <!-- row j=3 winner -->
    <g filter="url(#sk)">
      <rect x="60" y="252" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <rect x="106" y="252" width="66" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <rect x="172" y="252" width="86" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <rect x="258" y="252" width="86" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <rect x="344" y="252" width="88" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <rect x="432" y="252" width="88" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <rect x="520" y="252" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    </g>
    <g fill="#7a5415" font-weight="bold">
      <text x="83"  y="272" filter="url(#sk)">3</text>
      <text x="139" y="272" filter="url(#sk)">7</text>
      <text x="215" y="272" filter="url(#sk)">4</text>
      <text x="301" y="272" filter="url(#sk)">2</text>
      <text x="388" y="272" fill="#2e6e2e" filter="url(#sk)">✓</text>
      <text x="476" y="272" filter="url(#sk)">4+7+2 = 13 ★</text>
      <text x="550" y="272" filter="url(#sk)">13</text>
    </g>

    <!-- row j=4 valid -->
    <g filter="url(#sk)">
      <rect x="60" y="284" width="46" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="106" y="284" width="66" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="172" y="284" width="86" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="258" y="284" width="86" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="344" y="284" width="88" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="432" y="284" width="88" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
      <rect x="520" y="284" width="60" height="32" fill="#e6f4ea" stroke="#8ab87a" stroke-width="1"/>
    </g>
    <g fill="#3e5a3a">
      <text x="83"  y="304" filter="url(#sk)">4</text>
      <text x="139" y="304" filter="url(#sk)">10</text>
      <text x="215" y="304" filter="url(#sk)">4</text>
      <text x="301" y="304" filter="url(#sk)">2</text>
      <text x="388" y="304" fill="#2e6e2e" filter="url(#sk)">✓</text>
      <text x="476" y="304" filter="url(#sk)">4+10+2 = 16</text>
      <text x="550" y="304" filter="url(#sk)">13</text>
    </g>
  </g>

  <!-- takeaway -->
  <g filter="url(#sk)">
    <rect x="60" y="338" width="520" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="12.5" fill="#a03a36" filter="url(#sk)">山峰 10（j=4）全场最高，却被左腿 4 拖到 16 落选 ——</text>
  <text x="320" y="382" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a36" filter="url(#sk)">最小和常藏在「矮胖山」里：必须枚举每个 j，不能只盯最高峰</text>
</svg>
