<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="424" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：并查集分组 → 分量内降序取前 E 大</text>
  <rect x="36" y="68" width="488" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">并查集合并所有 swaps 里的下标对</text>
  <path d="M 280 110 L 280 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="122" width="488" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">按根分组：每个分量的下标、元素、偶位个数 E、总和</text>
  <path d="M 280 164 L 280 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="176" width="488" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">元素降序排序，前 E 个求和 = topE</text>
  <path d="M 280 218 L 280 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="230" width="488" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans += 2 * topE - sumAll</text>
  <path d="M 280 272 L 280 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="284" width="488" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 ans（long long）</text>
  <rect x="36" y="344" width="488" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54" y="368" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">时间 O((n+m)α(n) + n log n)，空间 O(n + m)</text>
  <text x="54" y="390" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">交替和绝对值可达 1e14：C++ 必须用 long long</text>
</svg>
