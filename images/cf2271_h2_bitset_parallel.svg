<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一层状态 = 一个 bit 向量，一次位运算算 64 个格子</text>
  <text x="390" y="52" text-anchor="middle" font-size="11.4" fill="#5a6a7a" filter="url(#rough2)">位 i 存 f(i, i+g)（或 g(i, i+g)）；两条状态各用一条向量 F1、F2</text>

  <!-- 位向量 -->
  <g filter="url(#rough2)">
    <rect x="40" y="78" width="150" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="196" y="78" width="150" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="352" y="78" width="150" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="508" y="78" width="150" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="115" y="100" fill="#2f4a66" filter="url(#rough2)">W0（位 0..63）</text>
    <text x="271" y="100" fill="#2f4a66" filter="url(#rough2)">W1（位 64..127）</text>
    <text x="427" y="100" fill="#8a6015" filter="url(#rough2)">W[w]（位 64w ..）</text>
    <text x="583" y="100" fill="#2f4a66" filter="url(#rough2)">W[w+1]</text>
  </g>
  <!-- 位格 -->
  <g filter="url(#rough2)">
    <rect x="356" y="118" width="18" height="18" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="376" y="118" width="18" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="396" y="118" width="18" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="416" y="118" width="18" height="18" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="512" y="118" width="18" height="18" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="385" y="152" text-anchor="middle" font-size="10.6" fill="#8c3a37" filter="url(#rough2)">位 i</text>
  <text x="405" y="152" text-anchor="middle" font-size="10.6" fill="#8c3a37" filter="url(#rough2)">位 i+1</text>
  <text x="521" y="152" text-anchor="middle" font-size="10.6" fill="#8c3a37" filter="url(#rough2)">W[w+1] 的位 0</text>
  <text x="540" y="166" text-anchor="middle" font-size="10.6" fill="#8c3a37" filter="url(#rough2)">（字内右移时被借走）</text>

  <!-- 三个公式框 -->
  <rect x="40" y="182" width="352" height="86" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="54" y="206" font-size="12.2" font-weight="bold" fill="#33582a" filter="url(#rough2)">① 主干两种走法 + 「缺口缩短」</text>
  <text x="54" y="230" font-size="11.6" fill="#33582a" filter="url(#rough2)">a = ¬( (F1 右移 1 位) ∧ F1 )，逐位即 1 − f(i+1,j)</text>
  <text x="54" y="252" font-size="11.6" fill="#33582a" filter="url(#rough2)">b = ¬( (F2 右移 1 位) ∧ F2 )</text>

  <rect x="404" y="182" width="336" height="96" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="418" y="206" font-size="12.2" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② 「吃池」的奇偶掩码</text>
  <text x="418" y="230" font-size="11.6" fill="#8a6015" filter="url(#rough2)">c = P ⊕ (Q 右移 g−1 位)</text>
  <text x="418" y="250" font-size="11" fill="#8a6015" filter="url(#rough2)">P[i]=(n−L−pre[i]) mod 2，Q[t]=pre[t] mod 2</text>
  <text x="418" y="268" font-size="11" fill="#8a6015" filter="url(#rough2)">两者都只与位置有关，所以能整层并行</text>

  <rect x="40" y="282" width="700" height="72" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="54" y="306" font-size="12.2" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">③ 合并（对应 max 的逐位形式）</text>
  <text x="54" y="330" font-size="12" fill="#2f4a66" filter="url(#rough2)">F1 ← a ∨ (c ∧ ¬b)　　F2 ← b ∨ (¬c ∧ ¬a)　　最后把末字里超出 L−g 的高位用掩码清掉</text>
  <text x="54" y="348" font-size="10.8" fill="#66788c" filter="url(#rough2)">（注意：算 b 时用的是旧的 F2，算 ¬c ∧ ¬a 时用的也是旧的 a，与 O(L²) 版本逐格顺序完全一致）</text>

  <path d="M 420 168 C 400 176 380 176 370 180" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="390" y="378" text-anchor="middle" font-size="11.4" fill="#66788c" filter="url(#rough2)">字内右移还要拼上「下一个字的最低位」：(W[w]&gt;&gt;1) | (W[w+1]&lt;&lt;63)，这两条 c + 三组逻辑式就是全部运算</text>
  <text x="390" y="400" text-anchor="middle" font-size="11.4" fill="#66788c" filter="url(#rough2)">每层约 15 条 64 位指令 / 字；总字运算量 Σ⌈(L−g)/64⌉ ≈ L²/128，L = 2·10^5 时约 3·10^8</text>
</svg>
