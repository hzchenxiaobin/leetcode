<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：s = "111000"，两个形态各数一遍错位</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="13" fill="#555">n = 6 为偶数，c1 = 3 = n/2 ⇒ 两个形态都可行；红色格 = 错位</text>

  <text x="68" y="84" text-anchor="middle" font-size="12" fill="#777">下标 i</text>
  <text x="165" y="84" text-anchor="middle" font-size="12" fill="#777">0</text>
  <text x="225" y="84" text-anchor="middle" font-size="12" fill="#777">1</text>
  <text x="285" y="84" text-anchor="middle" font-size="12" fill="#777">2</text>
  <text x="345" y="84" text-anchor="middle" font-size="12" fill="#777">3</text>
  <text x="405" y="84" text-anchor="middle" font-size="12" fill="#777">4</text>
  <text x="465" y="84" text-anchor="middle" font-size="12" fill="#777">5</text>

  <text x="68" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">目标 A</text>
  <text x="68" y="116" text-anchor="middle" font-size="11" fill="#2b6e9e">010101…</text>
  <g filter="url(#sk)">
    <rect x="140" y="90" width="50" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="200" y="90" width="50" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="260" y="90" width="50" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="320" y="90" width="50" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="380" y="90" width="50" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="440" y="90" width="50" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="165" y="118" text-anchor="middle" font-size="16" fill="#333">0</text>
  <text x="225" y="118" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="285" y="118" text-anchor="middle" font-size="16" fill="#333">0</text>
  <text x="345" y="118" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="405" y="118" text-anchor="middle" font-size="16" fill="#333">0</text>
  <text x="465" y="118" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="179" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>
  <text x="299" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>
  <text x="359" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>
  <text x="499" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>
  <text x="505" y="106" font-size="12" font-weight="bold" fill="#8a6415">misA = 4</text>
  <text x="505" y="124" font-size="12" fill="#8a6415">→ 4/2 = 2 次</text>

  <text x="68" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">当前 s</text>
  <g filter="url(#sk)">
    <rect x="140" y="144" width="50" height="44" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <rect x="200" y="144" width="50" height="44" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <rect x="260" y="144" width="50" height="44" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <rect x="320" y="144" width="50" height="44" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <rect x="380" y="144" width="50" height="44" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <rect x="440" y="144" width="50" height="44" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
  </g>
  <text x="165" y="172" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="225" y="172" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="285" y="172" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="345" y="172" text-anchor="middle" font-size="16" fill="#333">0</text>
  <text x="405" y="172" text-anchor="middle" font-size="16" fill="#333">0</text>
  <text x="465" y="172" text-anchor="middle" font-size="16" fill="#333">0</text>

  <text x="68" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">目标 B</text>
  <text x="68" y="220" text-anchor="middle" font-size="11" fill="#2e6e2e">101010…</text>
  <g filter="url(#sk)">
    <rect x="140" y="198" width="50" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="200" y="198" width="50" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="260" y="198" width="50" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="320" y="198" width="50" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="380" y="198" width="50" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="440" y="198" width="50" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="165" y="226" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="225" y="226" text-anchor="middle" font-size="16" fill="#333">0</text>
  <text x="285" y="226" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="345" y="226" text-anchor="middle" font-size="16" fill="#333">0</text>
  <text x="405" y="226" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="465" y="226" text-anchor="middle" font-size="16" fill="#333">0</text>
  <text x="239" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>
  <text x="419" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>
  <text x="505" y="214" font-size="12" font-weight="bold" fill="#b85450">misB = 2</text>
  <text x="505" y="232" font-size="12" font-weight="bold" fill="#b85450">→ 2/2 = 1 次 ✓</text>

  <g filter="url(#sk)">
    <rect x="40" y="256" width="560" height="84" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="280" text-anchor="middle" font-size="12" fill="#2e6e2e">A 的 4 个错位 = 2 个 A 类（i=0,2 的 '1'）+ 2 个 B 类（i=3,5 的 '0'）——两类相等</text>
  <text x="320" y="300" text-anchor="middle" font-size="12" fill="#2e6e2e">B 的 2 个错位 = 1 个 A 类（i=1 的 '1'）+ 1 个 B 类（i=4 的 '0'）——恰好配成一对</text>
  <text x="320" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ans = min(2, 1) = 1：交换 s[1] ↔ s[4] ⇒ "101010"</text>

  <g filter="url(#sk)">
    <rect x="40" y="352" width="560" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="380" text-anchor="middle" font-size="12" fill="#8a6415">⚠ 奇数长度时只有一个形态可行——不判可行就对两个形态取 min，"110" 会被错算成 0（mis=1 整除出 0）</text>
</svg>
