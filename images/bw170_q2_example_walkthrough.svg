<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="310" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：区间 [198, 202] 的逐数判定</text>

  <!-- 表头 -->
  <text x="52" y="56" font-size="11" fill="#999" filter="url(#rough2)">数字</text>
  <text x="132" y="56" font-size="11" fill="#999" filter="url(#rough2)">内部位</text>
  <text x="218" y="56" font-size="11" fill="#999" filter="url(#rough2)">判定</text>
  <text x="432" y="56" font-size="11" fill="#999" filter="url(#rough2)">值</text>
  <path d="M40,64 L480,64" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="56" y="92" font-size="13" fill="#333" filter="url(#rough2)">198</text>
  <text x="140" y="92" font-size="12" fill="#333" filter="url(#rough2)">9 (1,8)</text>
  <text x="220" y="92" font-size="11" fill="#4a7a3a" filter="url(#rough2)">9&gt;1 且 9&gt;8 → 峰</text>
  <text x="440" y="92" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <text x="56" y="120" font-size="13" fill="#333" filter="url(#rough2)">199</text>
  <text x="140" y="120" font-size="12" fill="#333" filter="url(#rough2)">9 (1,9)</text>
  <text x="220" y="120" font-size="11" fill="#b85450" filter="url(#rough2)">9≯9 → 不是峰</text>
  <text x="440" y="120" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="56" y="148" font-size="13" fill="#333" filter="url(#rough2)">200</text>
  <text x="140" y="148" font-size="12" fill="#333" filter="url(#rough2)">0 (2,0)</text>
  <text x="220" y="148" font-size="11" fill="#b85450" filter="url(#rough2)">0≮0 → 不是谷</text>
  <text x="440" y="148" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="56" y="176" font-size="13" fill="#333" filter="url(#rough2)">201</text>
  <text x="140" y="176" font-size="12" fill="#333" filter="url(#rough2)">0 (2,1)</text>
  <text x="220" y="176" font-size="11" fill="#d6a040" filter="url(#rough2)">0&lt;2 且 0&lt;1 → 谷</text>
  <text x="440" y="176" font-size="13" fill="#d6a040" filter="url(#rough2)">1</text>

  <text x="56" y="204" font-size="13" fill="#333" filter="url(#rough2)">202</text>
  <text x="140" y="204" font-size="12" fill="#333" filter="url(#rough2)">0 (2,2)</text>
  <text x="220" y="204" font-size="11" fill="#d6a040" filter="url(#rough2)">0&lt;2 且 0&lt;2 → 谷</text>
  <text x="440" y="204" font-size="13" fill="#d6a040" filter="url(#rough2)">1</text>

  <path d="M40,216 L480,216" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="150" y="232" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="257" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">总波动值 = 1 + 0 + 0 + 1 + 1 = 3</text>

  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">199 / 200 两个反例说明「严格不等」不可放松</text>
</svg>
