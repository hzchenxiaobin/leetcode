<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="560" fill="#fafafa"/>
  <text x="310" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">暴力双重循环：枚举所有 i &lt; j</text>
  <path d="M 160 42 Q 310 50 460 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- outer loop -->
  <g filter="url(#rough2)">
    <rect x="60" y="62" width="500" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">外层：j = 1 … n−1（作为"被判断"的 str2）</text>
  <text x="310" y="104" text-anchor="middle" font-size="11" fill="#557">j 之前的位置 i 都可能配上 j</text>

  <path d="M 310 116 L 310 132" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner loop -->
  <g filter="url(#rough2)">
    <rect x="60" y="136" width="500" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="310" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5b22">内层：i = 0 … j−1（作为"候选"的 str1）</text>
  <text x="310" y="178" text-anchor="middle" font-size="11" fill="#456">严格 i &lt; j，保证每对只数一次</text>

  <path d="M 310 190 L 310 206" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check 1: length -->
  <g filter="url(#rough2)">
    <polygon points="310,210 440,248 310,286 180,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="310" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">|words[i]| ≤ |words[j]| ?</text>
  <text x="310" y="262" text-anchor="middle" font-size="10.5" fill="#8a6a2a">长串不能是短串的前后缀</text>

  <!-- no branch -->
  <path d="M 440 248 L 508 248" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="240" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#rough2)">
    <rect x="510" y="234" width="58" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="539" y="253" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">跳过</text>

  <path d="M 310 286 L 310 302" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="298" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- check 2: prefix -->
  <g filter="url(#rough2)">
    <polygon points="310,306 440,344 310,382 180,344" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="310" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">words[j] 开头 |words[i]| 格</text>
  <text x="310" y="358" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">== words[i] ?（前缀）</text>

  <path d="M 440 344 L 508 344" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="336" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#rough2)">
    <rect x="510" y="330" width="58" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="539" y="349" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">跳过</text>

  <path d="M 310 382 L 310 398" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="394" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- check 3: suffix -->
  <g filter="url(#rough2)">
    <polygon points="310,402 440,440 310,478 180,440" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="310" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5b22">words[j] 末尾 |words[i]| 格</text>
  <text x="310" y="454" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5b22">== words[i] ?（后缀）</text>

  <path d="M 440 440 L 508 440" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="432" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#rough2)">
    <rect x="510" y="426" width="58" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="539" y="445" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">跳过</text>

  <path d="M 310 478 L 310 494" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="490" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- count -->
  <g filter="url(#rough2)">
    <rect x="200" y="498" width="220" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="310" y="522" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">ans += 1 ✓</text>
  <text x="460" y="522" font-size="11" fill="#888">→ 返回 ans</text>
</svg>
