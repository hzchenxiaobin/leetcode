<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">由「前半」构造回文：奇偶两种折叠</text>
  <path d="M 150 40 Q 320 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: odd length -->
  <text x="239" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">① 奇数长 L = 9：跳过中心位再镜像</text>
  <g filter="url(#sk2)">
    <rect x="70" y="76" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="108" y="76" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="146" y="76" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="76" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="222" y="76" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="14" fill="#2f4f6f" text-anchor="middle" font-weight="bold">
    <text x="87" y="99">9</text>
    <text x="125" y="99">3</text>
    <text x="163" y="99">9</text>
    <text x="201" y="99">4</text>
    <text x="239" y="99">7</text>
  </g>
  <text x="293" y="99" text-anchor="start" font-size="11" fill="#888">← 前半 s（5 位）</text>

  <!-- folding arrows -->
  <path d="M 87 114 C 87 140, 391 140, 391 150" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>
  <path d="M 125 114 C 125 140, 353 140, 353 150" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>
  <path d="M 163 114 C 163 140, 315 140, 315 150" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>
  <path d="M 201 114 C 201 140, 277 140, 277 150" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>
  <path d="M 239 114 L 239 150" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)" stroke-dasharray="5,4" marker-end="url(#arR)"/>
  <text x="256" y="136" text-anchor="start" font-size="10.5" fill="#b85450">中心位</text>

  <!-- palindrome row -->
  <g filter="url(#sk2)">
    <rect x="70" y="152" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="108" y="152" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="146" y="152" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="152" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="222" y="152" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="260" y="152" width="34" height="36" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="298" y="152" width="34" height="36" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="336" y="152" width="34" height="36" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="374" y="152" width="34" height="36" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="87" y="175">9</text>
    <text x="125" y="175">3</text>
    <text x="163" y="175">9</text>
    <text x="201" y="175">4</text>
    <text x="239" y="175" fill="#8f3a36">7</text>
    <text x="277" y="175" fill="#8a6414">4</text>
    <text x="315" y="175" fill="#8a6414">9</text>
    <text x="353" y="175" fill="#8a6414">3</text>
    <text x="391" y="175" fill="#8a6414">9</text>
  </g>
  <text x="239" y="206" text-anchor="middle" font-size="10.5" fill="#888">完整回文（9 位）</text>

  <!-- formula panel A -->
  <g filter="url(#sk)">
    <rect x="435" y="72" width="185" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="527" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4f6f">p = s + s[:-1][::-1]</text>
  <text x="527" y="122" text-anchor="middle" font-size="12.5" fill="#555">93947 → 939474939</text>
  <text x="527" y="147" text-anchor="middle" font-size="11" fill="#b85450">中心位 7 只保留一次</text>
  <text x="527" y="170" text-anchor="middle" font-size="10.5" fill="#888">镜像跳过 s 的最后一位</text>

  <!-- divider -->
  <path d="M 60 228 L 620 228" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,5" fill="none" filter="url(#sk)"/>

  <!-- Panel B: even length -->
  <text x="239" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">② 偶数长 L = 8：整体镜像</text>
  <g filter="url(#sk2)">
    <rect x="70" y="264" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="108" y="264" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="146" y="264" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="264" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="14" fill="#2f4f6f" text-anchor="middle" font-weight="bold">
    <text x="87" y="287">1</text>
    <text x="125" y="287">2</text>
    <text x="163" y="287">3</text>
    <text x="201" y="287">4</text>
  </g>
  <text x="248" y="287" text-anchor="start" font-size="11" fill="#888">← 前半 s（4 位）</text>

  <path d="M 87 302 C 87 328, 353 328, 353 338" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>
  <path d="M 125 302 C 125 328, 315 328, 315 338" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>
  <path d="M 163 302 C 163 328, 277 328, 277 338" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>
  <path d="M 201 302 C 201 328, 239 328, 239 338" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>

  <g filter="url(#sk2)">
    <rect x="70" y="340" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="108" y="340" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="146" y="340" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="340" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="222" y="340" width="34" height="36" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="260" y="340" width="34" height="36" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="298" y="340" width="34" height="36" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="336" y="340" width="34" height="36" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="87" y="363">1</text>
    <text x="125" y="363">2</text>
    <text x="163" y="363">3</text>
    <text x="201" y="363">4</text>
    <text x="239" y="363" fill="#8a6414">4</text>
    <text x="277" y="363" fill="#8a6414">3</text>
    <text x="315" y="363" fill="#8a6414">2</text>
    <text x="353" y="363" fill="#8a6414">1</text>
  </g>
  <text x="211" y="394" text-anchor="middle" font-size="10.5" fill="#888">完整回文（8 位）</text>

  <!-- formula panel B -->
  <g filter="url(#sk)">
    <rect x="435" y="260" width="185" height="110" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="527" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4f6f">p = s + s[::-1]</text>
  <text x="527" y="310" text-anchor="middle" font-size="12.5" fill="#555">1234 → 12344321</text>
  <text x="527" y="335" text-anchor="middle" font-size="11" fill="#666">无中心位，整体对折</text>
  <text x="527" y="357" text-anchor="middle" font-size="10.5" fill="#888">L = 2 × len(s)</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="45" y="408" width="550" height="50" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">前半 h ∈ [10^(half−1), 10^half)，首位非零 ⇒ 回文无前导零</text>
  <text x="320" y="447" text-anchor="middle" font-size="11.5" fill="#7a5415">同长回文共 9·10^(half−1) 个；前半递增 ⇒ 同层回文递增</text>
</svg>
