<svg xmlns="http://www.w3.org/2000/svg" width="740" height="580" viewBox="0 0 740 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="740" height="580" fill="#fafafa"/>
  <text x="370" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：受限用「隔板填槽」，临界用「降序发牌」</text>
  <path d="M 190 40 Q 370 50 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: [5,2,1] restricted -->
  <g filter="url(#sk)"><rect x="20" y="48" width="700" height="198" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="370" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">[5,2,1]：M = 5 &gt; rest+1 = 4 → 受限 —— A 占偶数位，其余任务填奇数位</text>

  <g filter="url(#sk)"><rect x="116" y="94" width="64" height="42" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="148" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>
  <g filter="url(#sk)"><rect x="190" y="94" width="64" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="222" y="121" text-anchor="middle" font-size="14" fill="#2c4a6e">B</text>
  <g filter="url(#sk)"><rect x="264" y="94" width="64" height="42" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="296" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>
  <g filter="url(#sk)"><rect x="338" y="94" width="64" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="370" y="121" text-anchor="middle" font-size="14" fill="#2c4a6e">B</text>
  <g filter="url(#sk)"><rect x="412" y="94" width="64" height="42" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="444" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>
  <g filter="url(#sk)"><rect x="486" y="94" width="64" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="518" y="121" text-anchor="middle" font-size="14" fill="#2f5d25">C</text>
  <g filter="url(#sk)"><rect x="560" y="94" width="64" height="42" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="592" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>

  <text x="148" y="154" text-anchor="middle" font-size="10" fill="#666">W1</text>
  <text x="222" y="154" text-anchor="middle" font-size="10" fill="#666">W2</text>
  <text x="296" y="154" text-anchor="middle" font-size="10" fill="#666">W3</text>
  <text x="370" y="154" text-anchor="middle" font-size="10" fill="#666">W4</text>
  <text x="444" y="154" text-anchor="middle" font-size="10" fill="#666">W5</text>
  <text x="518" y="154" text-anchor="middle" font-size="10" fill="#666">W6</text>
  <text x="592" y="154" text-anchor="middle" font-size="10" fill="#666">W7</text>

  <!-- leftover crossed A -->
  <g filter="url(#sk)"><rect x="640" y="94" width="44" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4"/></g>
  <text x="662" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">A</text>
  <path d="M 644 98 L 680 132" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 680 98 L 644 132" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="662" y="154" text-anchor="middle" font-size="10" fill="#b85450">余 1 个</text>

  <text x="370" y="180" text-anchor="middle" font-size="11" fill="#7a5415">偶数位 0,2,4,6 → A（rest+1 = 4 个）· 奇数位 1,3,5 → B、B、C（rest = 3 个全用完）</text>
  <text x="370" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">逐周 A B A B A C A，共 2·rest+1 = 7 周；隔板耗尽后只剩 A，被迫停止 → 答案 7</text>

  <!-- Panel B: [1,2,3] deal construction -->
  <g filter="url(#sk)"><rect x="20" y="258" width="700" height="300" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="370" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">[1,2,3]：M = 3 ≤ rest+1 = 4 → 全部完成 —— 按数量降序排队，先发偶数槽、再发奇数槽</text>

  <text x="176" y="331" text-anchor="end" font-size="11" fill="#4a7a3a">按数量降序排队</text>

  <!-- queue blocks with group outlines -->
  <g filter="url(#sk)"><rect x="182" y="300" width="190" height="54" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="6,4"/></g>
  <g filter="url(#sk)"><rect x="368" y="300" width="128" height="54" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="6,4"/></g>
  <g filter="url(#sk)"><rect x="492" y="300" width="66" height="54" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="6,4"/></g>

  <g filter="url(#sk)"><rect x="188" y="306" width="54" height="42" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="215" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">C</text>
  <g filter="url(#sk)"><rect x="250" y="306" width="54" height="42" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="277" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">C</text>
  <g filter="url(#sk)"><rect x="312" y="306" width="54" height="42" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="339" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">C</text>
  <g filter="url(#sk)"><rect x="374" y="306" width="54" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="401" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c4a6e">B</text>
  <g filter="url(#sk)"><rect x="436" y="306" width="54" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="463" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c4a6e">B</text>
  <g filter="url(#sk)"><rect x="498" y="306" width="54" height="42" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="525" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>

  <!-- dealing arrows -->
  <path d="M 215 357 L 215 422" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 277 357 C 277 386, 339 386, 339 422" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 339 357 C 339 380, 463 380, 463 422" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 401 357 C 401 398, 277 398, 277 422" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 463 357 C 463 392, 401 392, 401 422" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 525 357 L 525 422" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- slot boxes -->
  <g filter="url(#sk)"><rect x="188" y="426" width="54" height="42" rx="5" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/></g>
  <text x="215" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">C</text>
  <g filter="url(#sk)"><rect x="250" y="426" width="54" height="42" rx="5" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/></g>
  <text x="277" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c4a6e">B</text>
  <g filter="url(#sk)"><rect x="312" y="426" width="54" height="42" rx="5" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/></g>
  <text x="339" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">C</text>
  <g filter="url(#sk)"><rect x="374" y="426" width="54" height="42" rx="5" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/></g>
  <text x="401" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c4a6e">B</text>
  <g filter="url(#sk)"><rect x="436" y="426" width="54" height="42" rx="5" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/></g>
  <text x="463" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">C</text>
  <g filter="url(#sk)"><rect x="498" y="426" width="54" height="42" rx="5" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/></g>
  <text x="525" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>

  <text x="215" y="486" text-anchor="middle" font-size="10" fill="#666">槽0</text>
  <text x="277" y="486" text-anchor="middle" font-size="10" fill="#666">槽1</text>
  <text x="339" y="486" text-anchor="middle" font-size="10" fill="#666">槽2</text>
  <text x="401" y="486" text-anchor="middle" font-size="10" fill="#666">槽3</text>
  <text x="463" y="486" text-anchor="middle" font-size="10" fill="#666">槽4</text>
  <text x="525" y="486" text-anchor="middle" font-size="10" fill="#666">槽5</text>

  <text x="370" y="510" text-anchor="middle" font-size="11.5" fill="#2f5d25">逐周展开：C B C B C A（项目 2,1,2,1,2,0）—— 相邻两周项目互不相同，6 = S 周全部完成</text>
  <text x="370" y="534" text-anchor="middle" font-size="10.5" fill="#4a7a3a">发牌规则：前 ⌈S/2⌉ = 3 个进偶数槽 0,2,4，其余进奇数槽 1,3,5 —— 同项目在队中连续成块，跨段必不相邻（见引理 3）</text>
</svg>
