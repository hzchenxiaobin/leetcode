<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：可行性剪枝 → 定 r → 组合数取模</text>

  <!-- B1 -->
  <g filter="url(#rough2)">
    <rect x="170" y="46" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">计算 d = |endPos − startPos|</text>
  </g>

  <path d="M 280 88 L 280 116" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- decision diamond -->
  <g filter="url(#rough2)">
    <polygon points="280,118 400,160 280,202 160,160" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="280" y="154" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">(k − d) 为偶数</text>
    <text x="280" y="172" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">且 d ≤ k ？</text>
  </g>

  <!-- No branch -->
  <path d="M 160 160 L 118 160" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="139" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#rough2)">
    <rect x="30" y="138" width="88" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="74" y="156" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return 0</text>
    <text x="74" y="172" text-anchor="middle" font-size="10" fill="#888">不可达</text>
  </g>

  <!-- Yes branch -->
  <path d="M 280 202 L 280 228" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="292" y="220" font-size="12" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- B2 -->
  <g filter="url(#rough2)">
    <rect x="170" y="230" width="220" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="280" y="256" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r = (k + d) / 2（朝目标步数）</text>
  </g>

  <path d="M 280 272 L 280 298" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- B3 -->
  <g filter="url(#rough2)">
    <rect x="150" y="300" width="260" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="324" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">计算 C(k, r) mod (10⁹+7)</text>
    <text x="280" y="344" text-anchor="middle" font-size="11" fill="#666">杨辉三角递推（免逆元）或 阶乘＋费马小定理</text>
  </g>

  <path d="M 280 360 L 280 386" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- B4 -->
  <g filter="url(#rough2)">
    <rect x="170" y="388" width="220" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8"/>
    <text x="280" y="414" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return C(k, r) mod (10⁹+7)</text>
  </g>

  <!-- side notes -->
  <g filter="url(#rough2)">
    <rect x="430" y="126" width="118" height="70" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="8"/>
    <text x="489" y="148" text-anchor="middle" font-size="10.5" fill="#666">示例 2：d=3, k=10</text>
    <text x="489" y="164" text-anchor="middle" font-size="10.5" fill="#666">k−d=7 为奇</text>
    <text x="489" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 输出 0</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="430" y="300" width="118" height="76" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="8"/>
    <text x="489" y="322" text-anchor="middle" font-size="10.5" fill="#666">示例 1：d=1, k=3</text>
    <text x="489" y="338" text-anchor="middle" font-size="10.5" fill="#666">r=(3+1)/2=2</text>
    <text x="489" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ C(3,2)=3</text>
  </g>
</svg>
