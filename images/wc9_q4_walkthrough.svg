<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">演算：words = [area, lead, wall, lady, ball]</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">首行取 wall 后，后续三行的前缀被逐列「锁死」</text>

  <g font-size="10" text-anchor="middle">
    <text x="76" y="82" fill="#666" filter="url(#rough2)">c0</text>
    <text x="112" y="82" fill="#666" filter="url(#rough2)">c1</text>
    <text x="148" y="82" fill="#666" filter="url(#rough2)">c2</text>
    <text x="184" y="82" fill="#666" filter="url(#rough2)">c3</text>
    <text x="48" y="118" fill="#666" filter="url(#rough2)">r0</text>
    <text x="48" y="154" fill="#666" filter="url(#rough2)">r1</text>
    <text x="48" y="190" fill="#666" filter="url(#rough2)">r2</text>
    <text x="48" y="226" fill="#666" filter="url(#rough2)">r3</text>
  </g>

  <g font-size="13" text-anchor="middle">
    <rect x="58" y="94" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="76" y="118" fill="#8a3a36" filter="url(#rough2)">w</text>
    <rect x="94" y="94" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="112" y="118" fill="#8a6a20" filter="url(#rough2)">a</text>
    <rect x="130" y="94" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="148" y="118" fill="#8a6a20" filter="url(#rough2)">l</text>
    <rect x="166" y="94" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="184" y="118" fill="#8a6a20" filter="url(#rough2)">l</text>

    <rect x="58" y="130" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="76" y="154" fill="#3a5a30" filter="url(#rough2)">a</text>
    <rect x="94" y="130" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="112" y="154" fill="#8a3a36" filter="url(#rough2)">r</text>
    <rect x="130" y="130" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="148" y="154" fill="#8a6a20" filter="url(#rough2)">e</text>
    <rect x="166" y="130" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="184" y="154" fill="#8a6a20" filter="url(#rough2)">a</text>

    <rect x="58" y="166" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="76" y="190" fill="#3a5a30" filter="url(#rough2)">l</text>
    <rect x="94" y="166" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="112" y="190" fill="#3a5a30" filter="url(#rough2)">e</text>
    <rect x="130" y="166" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="148" y="190" fill="#8a3a36" filter="url(#rough2)">a</text>
    <rect x="166" y="166" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="184" y="190" fill="#8a6a20" filter="url(#rough2)">d</text>

    <rect x="58" y="202" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="76" y="226" fill="#3a5a30" filter="url(#rough2)">l</text>
    <rect x="94" y="202" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="112" y="226" fill="#3a5a30" filter="url(#rough2)">a</text>
    <rect x="130" y="202" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="148" y="226" fill="#3a5a30" filter="url(#rough2)">d</text>
    <rect x="166" y="202" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="184" y="226" fill="#8a3a36" filter="url(#rough2)">y</text>
  </g>

  <text x="60" y="256" font-size="9.5" fill="#888" filter="url(#rough2)">黄 = 上三角，绿 = 下三角，两者成对相等：sq[i][j] = sq[j][i]</text>
  <text x="60" y="272" font-size="9.5" fill="#888" filter="url(#rough2)">粉红 = 对角线，其字符不参与跨行约束</text>

  <g font-size="10">
    <rect x="272" y="76" width="264" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="284" y="97" fill="#3a4a66" filter="url(#rough2)">k = 0　need = ""　→ 5 个单词全是候选</text>

    <path d="M 404 110 L 404 122" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="272" y="122" width="264" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="284" y="143" fill="#3a5a30" filter="url(#rough2)">k = 1　need = "a"　→ 只剩 area</text>

    <path d="M 404 156 L 404 168" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="272" y="168" width="264" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="284" y="189" fill="#8a6a20" filter="url(#rough2)">k = 2　need = "l" + "e" = "le"　→ lead</text>

    <path d="M 404 202 L 404 214" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="272" y="214" width="264" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="284" y="235" fill="#8a6a20" filter="url(#rough2)">k = 3　need = "l"+"a"+"d" = "lad"　→ lady</text>

    <path d="M 404 248 L 404 260" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="272" y="260" width="264" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="284" y="281" fill="#8a3a36" filter="url(#rough2)">k = 4 = L　→ 输出 [wall, area, lead, lady]</text>
  </g>

  <rect x="60" y="292" width="476" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="76" y="312" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">首行换成 ball 的分支</text>
  <text x="76" y="331" font-size="10" fill="#555" filter="url(#rough2)">k = 1 need = "a"，k = 2 need = "l"+"e" = "le"，k = 3 need = "lad"：与 wall 分支完全重合，</text>
  <text x="76" y="349" font-size="10" fill="#555" filter="url(#rough2)">于是示例 1 的两个答案只差首行；示例 2 里 baba 出现两次，说明单词可以被重复使用。</text>
</svg>
