<svg xmlns="http://www.w3.org/2000/svg" width="660" height="410" viewBox="0 0 660 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="410" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">条带内求 y 区间并：排序后一次线性合并</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="120" y="100" width="266" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="110" y="117" text-anchor="end" font-size="10.5" fill="#2b2b2b">A  [0, 2]</text>
  <g filter="url(#sk2)"><rect x="120" y="150" width="400" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="110" y="167" text-anchor="end" font-size="10.5" fill="#2b2b2b">B  [0, 3]</text>
  <g filter="url(#sk2)"><rect x="120" y="200" width="133" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/></g>
  <text x="110" y="217" text-anchor="end" font-size="10.5" fill="#2b2b2b">C  [0, 1]</text>
  <path d="M 112 240 L 530 240" stroke="#9aa3ad" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 120 236 L 120 244" stroke="#9aa3ad" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="120" y="258" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <path d="M 253 236 L 253 244" stroke="#9aa3ad" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="253" y="258" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <path d="M 386 236 L 386 244" stroke="#9aa3ad" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="386" y="258" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <path d="M 520 236 L 520 244" stroke="#9aa3ad" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="520" y="258" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <g filter="url(#sk2)"><rect x="120" y="276" width="400" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="320" y="293" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36">并 = [0, 3]，长度 3</text>
  <g filter="url(#sk2)"><rect x="50.0" y="313.0" width="560" height="34" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="330" y="333.8" text-anchor="middle" font-size="10.5" fill="#2b4a6e">排序后 [0,1], [0,2], [0,3]：起点不递增就结算，否则右端取 max</text>
  <g filter="url(#sk2)"><rect x="50.0" y="361.0" width="560" height="34" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="330" y="381.8" text-anchor="middle" font-size="10.5" fill="#2b4a6e">cur=[0,1] → [0,2] 相交，cur.r=2 → [0,3] 相交，cur.r=3 → 长度 3</text>
</svg>
