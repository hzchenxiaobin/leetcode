<svg xmlns="http://www.w3.org/2000/svg" width="660" height="445" viewBox="0 0 660 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="445" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">空位只有三种处境：最左段、两人之间、最右段</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="45" y="78" width="46" height="44" rx="7" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.7"/></g>
  <text x="68.0" y="104.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk2)"><rect x="99" y="78" width="46" height="44" rx="7" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.7"/></g>
  <text x="122.0" y="104.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk2)"><rect x="153" y="78" width="46" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="176.0" y="104.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk2)"><rect x="390.0" y="69.0" width="250" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="515" y="96.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">① 最左段：左边没人</text>
  <text x="515" y="111.0" text-anchor="middle" font-size="10.5" fill="#7a5415">距离 = 首个 1 的下标 = 2</text>
  <g filter="url(#sk2)"><rect x="45" y="174" width="46" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="68.0" y="200.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk2)"><rect x="99" y="174" width="46" height="44" rx="7" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.7"/></g>
  <text x="122.0" y="200.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk2)"><rect x="153" y="174" width="46" height="44" rx="7" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.7"/></g>
  <text x="176.0" y="200.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk2)"><rect x="207" y="174" width="46" height="44" rx="7" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.7"/></g>
  <text x="230.0" y="200.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk2)"><rect x="261" y="174" width="46" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="284.0" y="200.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk2)"><rect x="390.0" y="165.0" width="250" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="515" y="192.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">② 中间段：两人之间空 L 格</text>
  <text x="515" y="207.0" text-anchor="middle" font-size="10.5" fill="#7a5415">ans = (右 - 左) / 2 = 2</text>
  <g filter="url(#sk2)"><rect x="45" y="270" width="46" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="68.0" y="296.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk2)"><rect x="99" y="270" width="46" height="44" rx="7" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.7"/></g>
  <text x="122.0" y="296.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk2)"><rect x="153" y="270" width="46" height="44" rx="7" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.7"/></g>
  <text x="176.0" y="296.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk2)"><rect x="390.0" y="261.0" width="250" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="515" y="288.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">③ 最右段：右边没人</text>
  <text x="515" y="303.0" text-anchor="middle" font-size="10.5" fill="#7a5415">距离 = n-1-最后一个人 = 2</text>
  <g filter="url(#sk2)"><rect x="50.0" y="358.0" width="560" height="54" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="330" y="381.4" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22">三类空位互不重叠，且各自最优解如右所示</text>
  <text x="330" y="396.9" text-anchor="middle" font-size="11.5" fill="#2e5e22">答案 = 三者的最大值</text>
</svg>
