<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="310" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">示例 1：n = 3, k = 7 的生成过程</text>
  <rect x="24" y="48" width="86" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="67" y="70.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">长度 1</text>
  <rect x="110" y="48" width="110" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="70.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">可接位</text>
  <rect x="220" y="48" width="86" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="263" y="70.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">长度 2</text>
  <rect x="306" y="48" width="110" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="361" y="70.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">可接位</text>
  <rect x="416" y="48" width="86" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="459" y="70.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">长度 3</text>
  <rect x="24" y="84" width="86" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="67" y="106.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="110" y="84" width="110" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="106.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">1+7=8</text>
  <rect x="220" y="84" width="86" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="263" y="106.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">18</text>
  <rect x="306" y="84" width="110" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="361" y="106.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">8−7=1</text>
  <rect x="416" y="84" width="86" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="459" y="106.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">181</text>
  <rect x="24" y="120" width="86" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="67" y="142.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="110" y="120" width="110" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="142.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">2+7=9</text>
  <rect x="220" y="120" width="86" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="263" y="142.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">29</text>
  <rect x="306" y="120" width="110" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="361" y="142.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">9−7=2</text>
  <rect x="416" y="120" width="86" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="459" y="142.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">292</text>
  <rect x="24" y="156" width="86" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="67" y="178.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">7</text>
  <rect x="110" y="156" width="110" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="178.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">7−7=0</text>
  <rect x="220" y="156" width="86" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="263" y="178.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">70</text>
  <rect x="306" y="156" width="110" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="361" y="178.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0+7=7</text>
  <rect x="416" y="156" width="86" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="459" y="178.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">707</text>
  <rect x="24" y="192" width="86" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="67" y="214.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">8</text>
  <rect x="110" y="192" width="110" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="214.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">8−7=1</text>
  <rect x="220" y="192" width="86" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="263" y="214.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">81</text>
  <rect x="306" y="192" width="110" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="361" y="214.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">1+7=8</text>
  <rect x="416" y="192" width="86" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="459" y="214.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">818</text>
  <rect x="24" y="228" width="86" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="67" y="250.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">9</text>
  <rect x="110" y="228" width="110" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="250.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">9−7=2</text>
  <rect x="220" y="228" width="86" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="263" y="250.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">92</text>
  <rect x="306" y="228" width="110" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="361" y="250.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">2+7=9</text>
  <rect x="416" y="228" width="86" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="459" y="250.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">929</text>
  <text x="280" y="284" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">0 可以出现在中间（707），但绝不能作首位（070 非法）</text>
</svg>
