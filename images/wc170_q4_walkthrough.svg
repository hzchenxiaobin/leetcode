  <text x="330" y="356" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">① 对角线 len = 1：单个字符本身就是回文，dp = 0</text>
  <text x="330" y="378" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">② 两端不同（如 dp[0][1]：m 与 b）→ 1 + min(去掉左端, 去掉右端) = 1</text>
  <text x="330" y="400" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">③ 两端相同（s[0] = s[4] = m）→ dp[0][4] = dp[1][3] = 2，与 n − LPS = 5 − 3 一致</text>
