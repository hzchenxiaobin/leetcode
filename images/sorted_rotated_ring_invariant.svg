<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="680" height="410" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">轮转不改变环绕断点数</text>
  <path d="M 210 40 Q 340 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左环：有序数组 [1,2,3,4,5] -->
  <g filter="url(#sk)">
    <path d="M 199.1,135.1 A 85 85 0 0 1 236.9,162.7" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 254.9,218.0 A 85 85 0 0 1 240.4,262.5" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 193.4,296.7 A 85 85 0 0 1 146.6,296.7" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 99.6,262.5 A 85 85 0 0 1 85.1,218.0" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 103.1,162.7 A 85 85 0 0 1 140.9,135.1" stroke="#b85450" stroke-width="3" fill="none" marker-end="url(#arR)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="150" y="115" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="230.8" y="173.7" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="268.8" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="100" y="268.8" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="69.2" y="173.7" width="40" height="30" rx="5" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="170" y="134" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="250.8" y="192.7" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="220" y="287.8" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="120" y="287.8" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="89.2" y="192.7" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">5</text>
  <text x="72" y="142" font-size="11" fill="#b03a3a" font-weight="bold">5 &gt; 1 断点</text>
  <text x="170" y="334" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">有序源数组 [1,2,3,4,5]</text>
  <text x="170" y="351" text-anchor="middle" font-size="11" fill="#555">断点数 = 1</text>

  <!-- 中间：轮转箭头 -->
  <g filter="url(#sk)">
    <path d="M 322 215 Q 370 205 418 215" stroke="#4a8edb" stroke-width="2.5" fill="none" marker-end="url(#arB)"/>
  </g>
  <text x="370" y="196" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">轮转 x=2</text>
  <text x="370" y="238" text-anchor="middle" font-size="10" fill="#888">相邻关系全部保留</text>

  <!-- 右环：轮转后 [3,4,5,1,2] -->
  <g filter="url(#sk)">
    <path d="M 539.1,135.1 A 85 85 0 0 1 576.9,162.7" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 594.9,218.0 A 85 85 0 0 1 580.4,262.5" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 533.4,296.7 A 85 85 0 0 1 486.6,296.7" stroke="#b85450" stroke-width="3" fill="none" marker-end="url(#arR)"/>
    <path d="M 439.6,262.5 A 85 85 0 0 1 425.1,218.0" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 443.1,162.7 A 85 85 0 0 1 480.9,135.1" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="490" y="115" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="570.8" y="173.7" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="540" y="268.8" width="40" height="30" rx="5" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
    <rect x="440" y="268.8" width="40" height="30" rx="5" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
    <rect x="409.2" y="173.7" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="510" y="134" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="590.8" y="192.7" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="560" y="287.8" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">5</text>
  <text x="460" y="287.8" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">1</text>
  <text x="429.2" y="192.7" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="510" y="316" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">5 &gt; 1 断点</text>
  <text x="510" y="334" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">轮转后 [3,4,5,1,2]</text>
  <text x="510" y="351" text-anchor="middle" font-size="11" fill="#555">断点数仍 = 1</text>

  <!-- 底部关键框 -->
  <g filter="url(#sk)">
    <rect x="40" y="362" width="600" height="42" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="60" y="380" font-size="12" font-weight="bold" fill="#2b2b2b">断点定义：</text>
  <text x="140" y="380" font-size="11" fill="#444" font-family="monospace">满足 nums[i] &gt; nums[(i+1) mod n] 的位置 i（含首尾环绕对）</text>
  <text x="60" y="397" font-size="11" fill="#444">轮转只是把环上元素整体挪动，所有环绕相邻对原样保留 → 断点数是轮转不变量</text>
</svg>
