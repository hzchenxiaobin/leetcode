<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="460" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">断点 ⇔ 组边界：word[i] ≤ word[i−1] 处必须开新组</text>
  <path d="M 240 42 Q 470 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: 组内严格递增 ===== -->
  <g filter="url(#sk)"><rect x="40" y="64" width="440" height="268" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="60" y="90" font-size="13" font-weight="bold" fill="#2b6e9e">① 一组 "abc" 内相邻两字符必须严格递增</text>
  <g filter="url(#sk)"><rect x="60" y="104" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="78" y="127" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="116" y="104" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="134" y="127" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="172" y="104" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="190" y="127" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">c</text>
  <path d="M 98 122 L 112 122" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 154 122 L 168 122" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="106" y="114" text-anchor="middle" font-size="11" fill="#888">&lt;</text>
  <text x="162" y="114" text-anchor="middle" font-size="11" fill="#888">&lt;</text>
  <text x="232" y="118" font-size="11" fill="#444">组内字符互异，</text>
  <text x="232" y="136" font-size="11" fill="#444">且 a &lt; b &lt; c 依次排布</text>

  <text x="60" y="176" font-size="11.5" fill="#2e6e2e" font-weight="bold">✓ 可同组（严格递增）：</text>
  <g filter="url(#sk)"><rect x="220" y="158" width="74" height="24" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="257" y="174" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">a → b</text>
  <g filter="url(#sk)"><rect x="302" y="158" width="74" height="24" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="339" y="174" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">b → c</text>
  <g filter="url(#sk)"><rect x="384" y="158" width="74" height="24" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="421" y="174" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">a → c</text>

  <text x="60" y="216" font-size="11.5" fill="#b03a3a" font-weight="bold">✗ 不能同组：</text>
  <g filter="url(#sk)"><rect x="190" y="198" width="90" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="235" y="214" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold">c → a（降）</text>
  <g filter="url(#sk)"><rect x="290" y="198" width="90" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="335" y="214" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold">a → a（等）</text>
  <g filter="url(#sk)"><rect x="390" y="198" width="82" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="431" y="214" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold">b → a（降）</text>

  <text x="60" y="256" font-size="12" fill="#7a2828" font-weight="bold">逆否：word[i] ≤ word[i−1] ⇒ 两字符分属不同组</text>
  <text x="60" y="282" font-size="11" fill="#444">断点 = 相邻对中「下降或相等」的位置，每个断点都强制</text>
  <text x="60" y="300" font-size="11" fill="#444">消耗一个组边界（不同断点的边界互不相同）；</text>
  <text x="60" y="322" font-size="12" fill="#7a2828" font-weight="bold">⇒ G ≥ 断点数 D + 1（下界）</text>

  <!-- ===== Panel 2: 分段装组 ===== -->
  <g filter="url(#sk)"><rect x="520" y="64" width="380" height="268" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="540" y="90" font-size="13" font-weight="bold" fill="#2e6e2e">② 在断点处切段：每段恰好装进一个组（上界）</text>
  <g filter="url(#sk)"><rect x="540" y="100" width="30" height="32" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="555" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="574" y="100" width="30" height="32" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="589" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="608" y="100" width="30" height="32" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="623" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">c</text>
  <g filter="url(#sk)"><rect x="642" y="100" width="30" height="32" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="657" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="676" y="100" width="30" height="32" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="691" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">c</text>
  <g filter="url(#sk)"><rect x="710" y="100" width="30" height="32" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="725" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">b</text>
  <text x="640" y="94" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">✂</text>
  <text x="708" y="94" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">✂</text>
  <path d="M 540 144 L 638 144" stroke="#4a8e4a" stroke-width="3" fill="none" filter="url(#sk)"/>
  <path d="M 642 144 L 706 144" stroke="#4a8e4a" stroke-width="3" fill="none" filter="url(#sk)"/>
  <path d="M 710 144 L 740 144" stroke="#4a8e4a" stroke-width="3" fill="none" filter="url(#sk)"/>
  <text x="589" y="164" text-anchor="middle" font-size="10.5" fill="#2e6e2e">段 1：abc</text>
  <text x="674" y="164" text-anchor="middle" font-size="10.5" fill="#2e6e2e">段 2：ac</text>
  <text x="725" y="164" text-anchor="middle" font-size="10.5" fill="#2e6e2e">段 3：b</text>

  <text x="540" y="210" font-size="11.5" fill="#444">段 1 → 组 1：</text>
  <g filter="url(#sk)"><rect x="648" y="190" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="663" y="210" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="684" y="190" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="699" y="210" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="720" y="190" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="735" y="210" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">c</text>
  <text x="772" y="210" font-size="11" fill="#2e6e2e" font-weight="bold">插 0</text>

  <text x="540" y="252" font-size="11.5" fill="#444">段 2 → 组 2：</text>
  <g filter="url(#sk)"><rect x="648" y="232" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="663" y="252" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="684" y="232" width="30" height="30" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="699" y="252" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="720" y="232" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="735" y="252" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">c</text>
  <text x="772" y="252" font-size="11" fill="#7a5415" font-weight="bold">插 1</text>

  <text x="540" y="294" font-size="11.5" fill="#444">段 3 → 组 3：</text>
  <g filter="url(#sk)"><rect x="648" y="274" width="30" height="30" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="663" y="294" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="684" y="274" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="699" y="294" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="720" y="274" width="30" height="30" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="735" y="294" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">c</text>
  <text x="772" y="294" font-size="11" fill="#7a5415" font-weight="bold">插 2</text>
  <text x="540" y="324" font-size="10.5" fill="#2e6e2e">每段严格递增 ⇒ 都是 "abc" 的子序列 ⇒ 一段一组刚好装下 ✓</text>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#sk)"><rect x="40" y="352" width="860" height="76" rx="8" fill="#fdf2f3" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="62" y="382" font-size="13.5" fill="#7a2828" font-weight="bold">下界 G ≥ D+1 与上界 G ≤ D+1 同时成立 ⇒ G* = D + 1</text>
  <text x="62" y="410" font-size="11.5" fill="#444">其中 D = 相邻对里 word[i] ≤ word[i−1] 的个数（相等也算断点）</text>
</svg>
