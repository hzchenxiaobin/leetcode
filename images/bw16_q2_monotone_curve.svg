<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="350" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">sum(value) 随 value 单调不减：二分的底气</text>

  <!-- 坐标系 -->
  <line x1="80" y1="80" x2="80" y2="300" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="80" y1="300" x2="560" y2="300" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="90" font-size="13" fill="#446688" filter="url(#rough2)">sum</text>
  <text x="556" y="322" font-size="13" fill="#446688" filter="url(#rough2)">value</text>

  <!-- target 水平线 -->
  <line x1="80" y1="160" x2="540" y2="160" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="108" y="152" font-size="12.5" fill="#b85450" filter="url(#rough2)">target</text>

  <!-- 阶梯曲线 -->
  <path d="M 80 300 L 150 300 L 150 246 L 230 246 L 230 202 L 330 202 L 330 168 L 450 168 L 450 128 L 540 128"
        fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <!-- 平台标号 -->
  <text x="112" y="290" font-size="11" fill="#888" filter="url(#rough2)">小 v：原数组和</text>
  <text x="360" y="160" font-size="11" fill="#4a7a3a" filter="url(#rough2)">压顶平台</text>

  <!-- 二分命中点 -->
  <circle cx="330" cy="202" r="5" fill="#d6a040" stroke="#8a6a20" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="228" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">v*：sum 首次 ≥ target</text>

  <!-- v*-1 与 v* 两格 -->
  <line x1="230" y1="246" x2="230" y2="310" stroke="#888" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="330" y1="202" x2="330" y2="310" stroke="#888" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="252" y="330" font-size="12" fill="#888" filter="url(#rough2)">v*−1（sum &lt; target）</text>
  <text x="342" y="330" font-size="12" fill="#888" filter="url(#rough2)">v*（sum ≥ target）</text>

  <!-- 右侧规则框 -->
  <rect x="452" y="52" width="168" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="536" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">候选只看两处</text>
  <text x="536" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">比较 |sum(v*−1)−target|</text>
  <text x="536" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">与 |sum(v*)−target|</text>
  <text x="536" y="140" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">打平时取较小的 v*−1</text>

  <text x="90" y="344" font-size="12.5" fill="#666" filter="url(#rough2)">直觉：曲线是一层层台阶，最优解只会落在「跨过 target 的那一级台阶」的左右两端。</text>
</svg>
