<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666666"/>
    </marker>
    <marker id="arP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8e5db8"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fdfcf7"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察二：去重排序后，最小差只取相邻对</text>
  <path d="M 190 40 Q 350 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="350" y="66" text-anchor="middle" font-size="11.5" fill="#555">以示例 2 的全数组查询 [0,5] 为例：区间内出现的值 = {2, 4, 5, 7, 10}</text>

  <!-- number line -->
  <g filter="url(#sk)">
    <path d="M 60 150 L 646 150" stroke="#888" stroke-width="1.5" marker-end="url(#arD)"/>
  </g>
  <g filter="url(#sk)">
    <line x1="60" y1="144" x2="60" y2="156" stroke="#999" stroke-width="1.2"/>
    <line x1="119" y1="144" x2="119" y2="156" stroke="#999" stroke-width="1.2"/>
    <line x1="178" y1="144" x2="178" y2="156" stroke="#999" stroke-width="1.2"/>
    <line x1="237" y1="144" x2="237" y2="156" stroke="#999" stroke-width="1.2"/>
    <line x1="296" y1="144" x2="296" y2="156" stroke="#999" stroke-width="1.2"/>
    <line x1="355" y1="144" x2="355" y2="156" stroke="#999" stroke-width="1.2"/>
    <line x1="414" y1="144" x2="414" y2="156" stroke="#999" stroke-width="1.2"/>
    <line x1="473" y1="144" x2="473" y2="156" stroke="#999" stroke-width="1.2"/>
    <line x1="532" y1="144" x2="532" y2="156" stroke="#999" stroke-width="1.2"/>
    <line x1="591" y1="144" x2="591" y2="156" stroke="#999" stroke-width="1.2"/>
    <line x1="644" y1="144" x2="644" y2="156" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#555" font-family="monospace" text-anchor="middle">
    <text x="60" y="172">1</text><text x="119" y="172">2</text><text x="178" y="172">3</text>
    <text x="237" y="172">4</text><text x="296" y="172">5</text><text x="355" y="172">6</text>
    <text x="414" y="172">7</text><text x="473" y="172">8</text><text x="532" y="172">9</text>
    <text x="591" y="172">10</text><text x="644" y="172">11</text>
  </g>

  <!-- points -->
  <g filter="url(#sk)">
    <circle cx="119" cy="150" r="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="237" cy="150" r="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="296" cy="150" r="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="414" cy="150" r="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="591" cy="150" r="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="119" y="126">2</text><text x="237" y="126">4</text><text x="296" y="126">5</text>
    <text x="414" y="126">7</text><text x="591" y="126">10</text>
  </g>

  <!-- gap double arrows -->
  <g filter="url(#sk)">
    <path d="M 178 102 L 135 102" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arD)"/>
    <path d="M 178 102 L 221 102" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arD)"/>
    <path d="M 266 102 L 249 102" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arD)"/>
    <path d="M 266 102 L 283 102" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arD)"/>
    <path d="M 355 102 L 308 102" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arD)"/>
    <path d="M 355 102 L 402 102" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arD)"/>
    <path d="M 502 102 L 428 102" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arD)"/>
    <path d="M 502 102 L 576 102" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arD)"/>
  </g>
  <g font-size="11.5" fill="#555" font-family="monospace" text-anchor="middle">
    <text x="178" y="94">2</text>
    <text x="355" y="94">2</text>
    <text x="502" y="94">3</text>
  </g>
  <g filter="url(#sk)">
    <rect x="252" y="80" width="28" height="19" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="266" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" font-family="monospace">1</text>
  <text x="266" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a">最小相邻差 = 答案</text>

  <!-- non-adjacent arc -->
  <g filter="url(#sk)">
    <path d="M 237 162 Q 325 212 410 161" stroke="#8e5db8" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arP)"/>
  </g>
  <text x="325" y="224" text-anchor="middle" font-size="11.5" fill="#5a3a7a">非相邻对：7 − 4 = 3 = 1 + 2 ≥ 最小相邻差</text>
  <text x="325" y="241" text-anchor="middle" font-size="10" fill="#888">（任何大跨度都能拆成相邻段之和，不会比最小段更小）</text>

  <!-- wrong box -->
  <g filter="url(#sk)">
    <rect x="50" y="256" width="300" height="100" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="200" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">✗ 忘记 a[i] ≠ a[j]</text>
  <text x="66" y="302" font-size="10.5" fill="#444">含重复的子数组排序后直接扫相邻差：</text>
  <text x="66" y="322" font-size="11" fill="#444" font-family="monospace">[2,2,7,10] → 相邻差 0, 5, 3 → 误答 0</text>
  <text x="66" y="342" font-size="11" font-weight="bold" fill="#b03a3a">同值对的 0 不是合法答案！</text>

  <!-- right box -->
  <g filter="url(#sk)">
    <rect x="360" y="256" width="300" height="100" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="510" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">✓ 值域桶天然去重</text>
  <text x="376" y="302" font-size="10.5" fill="#444">只保留区间内出现过的值，升序枚举：</text>
  <text x="376" y="322" font-size="11" fill="#444" font-family="monospace">{2,4,5,7,10} → 相邻差 2, 1, 2, 3</text>
  <text x="376" y="342" font-size="11" font-weight="bold" fill="#2e6e2e">答案 = 最小相邻差 = 1</text>

  <!-- formula -->
  <text x="350" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">min{|a[i]−a[j]| : a[i] ≠ a[j]} = min 相邻 distinct 值之差</text>
</svg>
