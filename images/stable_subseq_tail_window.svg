<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：追加 x 时，只需检查最后两位的奇偶性</text>

  <text x="52" y="118" font-size="16" fill="#999" filter="url(#rough2)">…</text>
  <rect x="70" y="92" width="46" height="36" fill="#eef3fa" stroke="#99aabb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="115" text-anchor="middle" font-size="13" fill="#8899aa" filter="url(#rough2)">0</text>
  <rect x="128" y="92" width="46" height="36" fill="#eef3fa" stroke="#99aabb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="151" y="115" text-anchor="middle" font-size="13" fill="#8899aa" filter="url(#rough2)">1</text>

  <rect x="206" y="92" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="229" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="262" y="92" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <path d="M316 110 L348 110" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="354" y="92" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">p</text>

  <rect x="200" y="80" width="206" height="60" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="303" y="70" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">唯一新增的相邻三元组 (a, b, p)</text>

  <text x="229" y="154" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">倒数第二</text>
  <text x="285" y="154" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">倒数第一</text>
  <text x="377" y="154" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">新元素 x 的奇偶</text>

  <text x="125" y="182" font-size="12" fill="#666" filter="url(#rough2)">更前面的部分早已稳定：</text>
  <text x="125" y="199" font-size="12" fill="#666" filter="url(#rough2)">追加 x 不改变任何历史三元组</text>

  <rect x="70" y="215" width="190" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="237" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">✗ 违规：a = b = p</text>
  <text x="165" y="256" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">连续三个同奇偶，禁止</text>

  <rect x="300" y="215" width="190" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="395" y="237" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">✓ 其余情况全合法</text>
  <text x="395" y="256" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">含长度 1（没有 a，恒合法）</text>

  <rect x="60" y="288" width="440" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">于是所有稳定子序列只需按「末两位奇偶」分成 6 类聚合计数</text>
</svg>
