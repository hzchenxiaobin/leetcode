<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="292" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">结构：n 个值各出现一次 + 1 个值出现 n 次</text>
  <rect x="40" y="72" width="56" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="68" y="101" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="68" y="132" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 0</text>
  <text x="68" y="62" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">答案 x</text>
  <rect x="102" y="72" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="101" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="130" y="132" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 1</text>
  <rect x="164" y="72" width="56" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="101" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="192" y="132" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 2</text>
  <text x="192" y="62" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">答案 x</text>
  <rect x="226" y="72" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="254" y="101" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="254" y="132" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 3</text>
  <rect x="288" y="72" width="56" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="316" y="101" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="316" y="132" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 4</text>
  <text x="316" y="62" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">答案 x</text>
  <rect x="350" y="72" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="378" y="101" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="378" y="132" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 5</text>
  <rect x="412" y="72" width="56" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="101" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="440" y="132" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 6</text>
  <text x="440" y="62" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">答案 x</text>
  <rect x="474" y="72" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="502" y="101" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="502" y="132" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 7</text>
  <text x="280" y="158" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">绿色 = 出现 4 次（= n）的答案；其余每个值只出现一次</text>
  <rect x="60" y="176" width="440" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="197" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">⇒ 除答案外任何值都不会被第二次遇到</text>
  <text x="280" y="215" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第一次「撞车」的元素必然是答案</text>
  <rect x="60" y="238" width="440" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="11.5" fill="#33475b" filter="url(#rough2)">时间 O(nums.length)，空间 O(不同值个数)</text>
</svg>
