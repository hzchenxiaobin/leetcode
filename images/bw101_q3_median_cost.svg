<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">每组内：Σ|x − t| 是 V 形凸函数，最小值在中位数</text>

  <!-- 数轴上的组元素 [2,5,5,7]，中位数 5 -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="92" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="120" y="97" text-anchor="middle" font-size="12" fill="#333">2</text>
    <circle cx="260" cy="92" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="97" text-anchor="middle" font-size="12" fill="#333">5</text>
    <circle cx="320" cy="92" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="320" y="97" text-anchor="middle" font-size="12" fill="#333">5</text>
    <circle cx="440" cy="92" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="440" y="97" text-anchor="middle" font-size="12" fill="#333">7</text>
    <path d="M 96 92 L 468 92" stroke="#c8c8c8" stroke-width="1.4" filter="url(#rough2)"/>
  </g>
  <!-- 中位数标记 -->
  <path d="M 290 66 L 290 82" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="56" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">中位数 t = 5</text>

  <!-- V 形凸函数 -->
  <g filter="url(#rough2)">
    <path d="M 120 130 C 200 220, 260 240, 290 240 C 330 240, 390 220, 460 140" stroke="#4a7a3a" stroke-width="2.2" fill="none"/>
    <ellipse cx="290" cy="240" rx="16" ry="9" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <path d="M 80 130 L 80 266" stroke="#c8c8c8" stroke-width="1.3"/>
    <path d="M 80 266 L 500 266" stroke="#c8c8c8" stroke-width="1.3"/>
  </g>
  <text x="290" y="296" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">代价 Σ|x − t| 随目标 t 变化：先降后升（左右点数不平衡）</text>

  <!-- 示例 2 演算 -->
  <text x="280" y="326" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">示例 2：g = 1，全表一组 [2,5,5,7] → 中位数 5</text>
  <text x="280" y="348" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">代价 = |2−5| + 0 + 0 + |7−5| = 3 + 2 = 5 ✓</text>
</svg>
