<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="310" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">示例 2：A = [9,8,1,0,1,9,4,0,4,1]，ans 最终为 7</text>
  <rect x="24" y="48" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="69.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="74" y="48" width="70" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="109" y="69.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">A[j]</text>
  <rect x="144" y="48" width="70" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="179" y="69.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">栈顶</text>
  <rect x="214" y="48" width="260" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="344" y="69.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">可配对？</text>
  <rect x="474" y="48" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="504" y="69.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">ans</text>
  <rect x="24" y="84" width="50" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="105.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">9</text>
  <rect x="74" y="84" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="109" y="105.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="144" y="84" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="179" y="105.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">3</text>
  <rect x="214" y="84" width="260" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="344" y="105.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">0 ≤ 1 ✓ 弹出 3；1 ≤ 1 ✓ 弹出 2</text>
  <rect x="474" y="84" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="504" y="105.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">7</text>
  <rect x="24" y="120" width="50" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="141.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">8</text>
  <rect x="74" y="120" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="109" y="141.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="144" y="120" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="179" y="141.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="214" y="120" width="260" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="344" y="141.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">8 ≤ 4 ✗</text>
  <rect x="474" y="120" width="60" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="504" y="141.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">7</text>
  <rect x="24" y="156" width="50" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="177.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">7</text>
  <rect x="74" y="156" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="109" y="177.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">0</text>
  <rect x="144" y="156" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="179" y="177.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="214" y="156" width="260" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="344" y="177.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">8 ≤ 0 ✗</text>
  <rect x="474" y="156" width="60" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="504" y="177.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">7</text>
  <rect x="24" y="192" width="50" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="213.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">6</text>
  <rect x="74" y="192" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="109" y="213.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="144" y="192" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="179" y="213.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="214" y="192" width="260" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="344" y="213.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">8 ≤ 4 ✗</text>
  <rect x="474" y="192" width="60" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="504" y="213.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">7</text>
  <rect x="24" y="228" width="50" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="249.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">5</text>
  <rect x="74" y="228" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="109" y="249.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">9</text>
  <rect x="144" y="228" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="179" y="249.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="214" y="228" width="260" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="344" y="249.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">8 ≤ 9 ✓ 弹出 1；9 ≤ 9 ✓ 弹出 0，栈空</text>
  <rect x="474" y="228" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="504" y="249.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">7</text>
  <text x="280" y="284" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">栈空即提前结束；最长坡为 (2, 9)，宽度 7</text>
</svg>
