<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="960" height="720" fill="#fdfcf7"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [8, 4]，target = [10, 5]</text>
  <path d="M 290 42 Q 480 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend strip -->
  <g filter="url(#sk)">
    <rect x="140" y="58" width="680" height="58" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="480" y="82" text-anchor="middle" font-size="12" fill="#444">第 0 位 ↔ 10，第 1 位 ↔ 5；<tspan fill="#2b6e9e" font-weight="bold" font-family="monospace">L(11) = lcm(10,5) = 10</tspan></text>
  <text x="480" y="104" text-anchor="middle" font-size="12" fill="#444">状态：<tspan font-family="monospace">00 = ∅，01 = {10}，10 = {5}，11 = {10,5}</tspan></text>

  <!-- ===== Table A: initial ===== -->
  <text x="180" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 初始</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="70" y="156" width="110" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="125" y="176" text-anchor="middle" fill="#2b6e9e" font-weight="bold">mask</text>
    <g filter="url(#sk)"><rect x="180" y="156" width="110" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="235" y="176" text-anchor="middle" fill="#2b6e9e" font-weight="bold">dp 值</text>

    <g filter="url(#sk)"><rect x="70" y="186" width="110" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="125" y="211" text-anchor="middle" fill="#2e6e2e" font-weight="bold">00</text>
    <g filter="url(#sk)"><rect x="180" y="186" width="110" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="235" y="211" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>

    <g filter="url(#sk)"><rect x="70" y="226" width="110" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="125" y="251" text-anchor="middle" fill="#888">01</text>
    <g filter="url(#sk)"><rect x="180" y="226" width="110" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="235" y="251" text-anchor="middle" fill="#aaa">∞</text>

    <g filter="url(#sk)"><rect x="70" y="266" width="110" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="125" y="291" text-anchor="middle" fill="#888">10</text>
    <g filter="url(#sk)"><rect x="180" y="266" width="110" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="235" y="291" text-anchor="middle" fill="#aaa">∞</text>

    <g filter="url(#sk)"><rect x="70" y="306" width="110" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="125" y="331" text-anchor="middle" fill="#888">11</text>
    <g filter="url(#sk)"><rect x="180" y="306" width="110" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="235" y="331" text-anchor="middle" fill="#aaa">∞</text>
  </g>
  <text x="180" y="368" text-anchor="middle" font-size="10" fill="#888">只有空集免费</text>

  <!-- arrow A -> B -->
  <path d="M 296 252 L 352 252" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="324" y="238" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">x=8</text>

  <!-- ===== Table B: after x=8 ===== -->
  <text x="475" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 处理 x = 8 后</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="365" y="156" width="110" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="420" y="176" text-anchor="middle" fill="#2b6e9e" font-weight="bold">mask</text>
    <g filter="url(#sk)"><rect x="475" y="156" width="110" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="530" y="176" text-anchor="middle" fill="#2b6e9e" font-weight="bold">dp 值</text>

    <g filter="url(#sk)"><rect x="365" y="186" width="110" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="420" y="211" text-anchor="middle" fill="#2e6e2e" font-weight="bold">00</text>
    <g filter="url(#sk)"><rect x="475" y="186" width="110" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="530" y="211" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>

    <g filter="url(#sk)"><rect x="365" y="226" width="110" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="420" y="251" text-anchor="middle" fill="#2b6e9e">01</text>
    <g filter="url(#sk)"><rect x="475" y="226" width="110" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="530" y="251" text-anchor="middle" fill="#2b6e9e" font-weight="bold">2</text>

    <g filter="url(#sk)"><rect x="365" y="266" width="110" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="420" y="291" text-anchor="middle" fill="#2b6e9e">10</text>
    <g filter="url(#sk)"><rect x="475" y="266" width="110" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="530" y="291" text-anchor="middle" fill="#2b6e9e" font-weight="bold">2</text>

    <g filter="url(#sk)"><rect x="365" y="306" width="110" height="40" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="420" y="331" text-anchor="middle" fill="#7a5415" font-weight="bold">11</text>
    <g filter="url(#sk)"><rect x="475" y="306" width="110" height="40" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="530" y="331" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
  </g>
  <text x="475" y="368" text-anchor="middle" font-size="10" fill="#7a5415">cost{10}={5}={10,5}=2：8→10 一跳双覆盖</text>

  <!-- arrow B -> C -->
  <path d="M 591 252 L 647 252" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="619" y="238" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">x=4</text>

  <!-- ===== Table C: after x=4 ===== -->
  <text x="770" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">③ 处理 x = 4 后</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="660" y="156" width="110" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="715" y="176" text-anchor="middle" fill="#2b6e9e" font-weight="bold">mask</text>
    <g filter="url(#sk)"><rect x="770" y="156" width="110" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="825" y="176" text-anchor="middle" fill="#2b6e9e" font-weight="bold">dp 值</text>

    <g filter="url(#sk)"><rect x="660" y="186" width="110" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="715" y="211" text-anchor="middle" fill="#2e6e2e" font-weight="bold">00</text>
    <g filter="url(#sk)"><rect x="770" y="186" width="110" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="825" y="211" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>

    <g filter="url(#sk)"><rect x="660" y="226" width="110" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="715" y="251" text-anchor="middle" fill="#2b6e9e">01</text>
    <g filter="url(#sk)"><rect x="770" y="226" width="110" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="825" y="251" text-anchor="middle" fill="#2b6e9e" font-weight="bold">2</text>

    <g filter="url(#sk)"><rect x="660" y="266" width="110" height="40" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
    <text x="715" y="291" text-anchor="middle" fill="#5a3a7a">10</text>
    <g filter="url(#sk)"><rect x="770" y="266" width="110" height="40" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
    <text x="825" y="291" text-anchor="middle" fill="#5a3a7a" font-weight="bold">1</text>

    <g filter="url(#sk)"><rect x="660" y="306" width="110" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g>
    <text x="715" y="331" text-anchor="middle" fill="#2e6e2e" font-weight="bold">11</text>
    <g filter="url(#sk)"><rect x="770" y="306" width="110" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g>
    <text x="825" y="331" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2</text>
  </g>
  <text x="770" y="368" text-anchor="middle" font-size="10" fill="#5a3a7a">cost{5}=1（4→5）但补不进更优组合</text>

  <!-- ===== transition detail ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="396" width="820" height="86" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="480" y="422" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">x = 4 的全部转移候选（只读旧 dp）：</text>
  <text x="480" y="446" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">00→01 : +6　　00→10 : +1　　00→11 : +6　　01→11 : 2+1 = 3　　10→11 : 2+6 = 8</text>
  <text x="480" y="470" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">没有任何一条刷新 dp[11] = 2 ——「一个 8 顶两个」仍然最优</text>

  <!-- ===== conclusion ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="506" width="820" height="150" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="480" y="538" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">答案 dp[11] = 2 ✓</text>
  <text x="480" y="568" text-anchor="middle" font-size="12" fill="#444">方案：把 8 增加到 10（2 次操作）</text>
  <g filter="url(#sk)">
    <rect x="205" y="584" width="120" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="265" y="610" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">8</text>
  <path d="M 330 605 Q 390 605 448 605" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="390" y="592" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">+2</text>
  <g filter="url(#sk)">
    <rect x="452" y="584" width="120" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="512" y="610" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">10</text>
  <path d="M 578 598 Q 630 588 668 588" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 578 616 Q 630 634 668 634" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="672" y="572" width="110" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="727" y="594" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">10 的倍数 ✓</text>
  <g filter="url(#sk)">
    <rect x="672" y="620" width="110" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="727" y="642" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">5 的倍数 ✓</text>
</svg>
