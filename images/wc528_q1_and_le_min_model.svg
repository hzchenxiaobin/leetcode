<svg xmlns="http://www.w3.org/2000/svg" width="660" height="350" viewBox="0 0 660 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="660" height="350" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：AND ≤ min，相等还能「失而复得」</text>
  <path d="M 110 40 Q 330 48 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="182" y="74" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">① AND 只会清比特 ⇒ AND ≤ 每个元素</text>
  <text x="492" y="74" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">② 相等可以失而复得</text>

  <text x="170" y="110" text-anchor="middle" font-size="11.5" fill="#7a8899" filter="url(#rough2)">4</text>
  <text x="214" y="110" text-anchor="middle" font-size="11.5" fill="#7a8899" filter="url(#rough2)">2</text>
  <text x="258" y="110" text-anchor="middle" font-size="11.5" fill="#7a8899" filter="url(#rough2)">1</text>
  <text x="106" y="110" text-anchor="middle" font-size="10.5" fill="#7a8899" filter="url(#rough2)">位权</text>

  <g filter="url(#rough2)">
    <rect x="152" y="122" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="196" y="122" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="240" y="122" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="152" y="158" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="196" y="158" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="240" y="158" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="152" y="194" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="196" y="194" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="240" y="194" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="170" y="143" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <text x="214" y="143" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <text x="258" y="143" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">0</text>
  <text x="170" y="179" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">0</text>
  <text x="214" y="179" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <text x="258" y="179" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <text x="170" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">0</text>
  <text x="214" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">1</text>
  <text x="258" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">0</text>

  <text x="132" y="143" text-anchor="end" font-size="13" fill="#2b4a6e" filter="url(#rough2)">6</text>
  <text x="132" y="179" text-anchor="end" font-size="13" fill="#2b4a6e" filter="url(#rough2)">3</text>
  <text x="132" y="215" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">6 AND 3</text>

  <text x="182" y="250" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">2 是 6 与 3 的公共子掩码，故 2 ≤ min(6, 3) = 3</text>

  <g filter="url(#rough2)">
    <rect x="352" y="94" width="278" height="38" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="352" y="148" width="278" height="38" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="352" y="202" width="278" height="38" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="491" y="118" text-anchor="middle" font-size="12.5" fill="#2e5a24" filter="url(#rough2)">[6] 　AND 6 ＝ min 6 　✓</text>
  <text x="491" y="172" text-anchor="middle" font-size="12.5" fill="#8f3830" filter="url(#rough2)">[6, 3] 　AND 2 ＜ min 3 　✗</text>
  <text x="491" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">[6, 3, 2] 　AND 2 ＝ min 2 　✓ 重新相等</text>

  <path d="M 491 132 L 491 146" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 491 186 L 491 200" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="558" y="145" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">加入 3</text>
  <text x="558" y="199" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">加入 2</text>

  <rect x="46" y="264" width="568" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="288" text-anchor="middle" font-size="13" fill="#8a6415" filter="url(#rough2)">AND 是每个元素的子掩码 ⇒ 一致 ⟺ AND ＝ min，绝不会出现 AND ＞ min</text>
  <text x="330" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3830" filter="url(#rough2)">但 AND ＜ min 之后仍可能重新取等 ⇒ 枚举右端点时不能提前 break</text>
</svg>
