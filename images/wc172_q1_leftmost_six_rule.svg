<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">贪心定位：只改「最左边的 6」</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">改一位的收益 = 3 × 10^k，k 是这一位的位权；位权越大，收益越大</text>

  <g font-size="22" text-anchor="middle">
    <rect x="161" y="70" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="187" y="102" fill="#3a4a66" filter="url(#rough2)">9</text>
    <rect x="223" y="70" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="6" filter="url(#rough2)"/>
    <text x="249" y="102" fill="#8a3a36" filter="url(#rough2)">6</text>
    <rect x="285" y="70" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="311" y="102" fill="#3a4a66" filter="url(#rough2)">6</text>
    <rect x="347" y="70" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="373" y="102" fill="#3a4a66" filter="url(#rough2)">9</text>
  </g>

  <g font-size="10.5" text-anchor="middle" fill="#777">
    <text x="187" y="132" filter="url(#rough2)">10^3</text>
    <text x="249" y="132" filter="url(#rough2)">10^2</text>
    <text x="311" y="132" filter="url(#rough2)">10^1</text>
    <text x="373" y="132" filter="url(#rough2)">10^0</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#999">
    <text x="187" y="148" filter="url(#rough2)">第 0 位</text>
    <text x="249" y="148" filter="url(#rough2)">第 1 位</text>
    <text x="311" y="148" filter="url(#rough2)">第 2 位</text>
    <text x="373" y="148" filter="url(#rough2)">第 3 位</text>
  </g>

  <path d="M 249 150 L 249 168" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="174" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="58" y="196" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">最左边的 6 在第 1 位（位权 100），改它增 +300</text>
  <text x="58" y="216" font-size="10.5" fill="#666" filter="url(#rough2)">9669 → 9969；另外两个 6 的位权只有 10 与 1，收益仅 +30、+3，必然更小</text>
  <text x="58" y="234" font-size="10.5" fill="#666" filter="url(#rough2)">而把任意一位 9 改成 6 是 −3 × 10^k &lt; 0，只会让数变小，永远不选</text>

  <rect x="40" y="262" width="230" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="284" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">9 → 6：一律不做</text>
  <text x="56" y="303" font-size="10" fill="#666" filter="url(#rough2)">增量 −3 × 10^k 严格为负，</text>
  <text x="56" y="319" font-size="10" fill="#666" filter="url(#rough2)">「最多改一位」允许一次都不改</text>

  <rect x="290" y="262" width="230" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="306" y="284" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">没有 6（如 9999）</text>
  <text x="306" y="303" font-size="10" fill="#666" filter="url(#rough2)">已经全是 9，任何改动都变小，</text>
  <text x="306" y="319" font-size="10" fill="#666" filter="url(#rough2)">直接返回原数 num</text>

  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">答案 = num + 3 × 10^(n−1−i)，i 为最左边 '6' 的下标；不存在这样的 i 则返回 num</text>
</svg>
