  <text x="541" y="188" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2 ✓</text>
  <rect x="30" y="320" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="340" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">两组大小都是 2 时，选择 k 更大的那一组 → 输出 {p, f}</text>
