<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="404" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每组只用两个计数器，一遍扫完</text>
  <path d="M 232 42 Q 360 49 488 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 读入 -->
  <rect x="246" y="56" width="228" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="83" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 k 与 c₁ … cₖ</text>

  <path d="M 360 100 L 360 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 统计 -->
  <rect x="196" y="130" width="328" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="152" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">ge2 ← 张数 ≥ 2 的字母个数　（初值 0）</text>
  <text x="360" y="172" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">ge3 ← 是否存在张数 ≥ 3 的字母　（初值 false）</text>

  <path d="M 360 182 L 360 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="360,208 500,258 360,308 220,258" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">ge3 或 ge2 ≥ 2 ?</text>
  <text x="360" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（两种局面任取其一）</text>

  <!-- 分支箭头 -->
  <path d="M 220 258 L 166 258 L 166 320" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 258 L 554 258 L 554 320" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <text x="528" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">否</text>

  <!-- 输出 -->
  <rect x="66" y="328" width="200" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="166" y="358" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 YES</text>
  <rect x="454" y="328" width="200" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="554" y="358" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 NO</text>

  <text x="360" y="392" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">每组 O(k)；不需要排序，也不需要真的拼出字符串</text>
</svg>
