<svg xmlns="http://www.w3.org/2000/svg" width="660" height="570" viewBox="0 0 660 570" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="570" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一趟扫描 + prev 哨兵</text>
  <path d="M 140 40 Q 330 48 520 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- ① 初始化 -->
  <g>
    <rect x="80" y="58" width="280" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  </g>
  <text x="100" y="80" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">① prev ← −1（哨兵：还没遇到 1）</text>
  <text x="100" y="100" font-size="11" fill="#444" filter="url(#rough2)">i ← 0</text>
  <path d="M 220 110 L 220 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 遍历 -->
  <g>
    <rect x="80" y="130" width="280" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  </g>
  <text x="100" y="152" font-size="11.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">② 遍历 i = 0 … n−1</text>
  <text x="100" y="172" font-size="11" fill="#444" filter="url(#rough2)">仅当 nums[i] == 1 时进入判定</text>
  <path d="M 220 182 L 220 198" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 判定菱形 -->
  <g>
    <polygon points="220,202 338,244 220,286 102,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  </g>
  <text x="220" y="238" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#rough2)">prev ≠ −1 且</text>
  <text x="220" y="258" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#rough2)">i − prev − 1 &lt; k ？</text>

  <!-- 是：违规 -->
  <path d="M 340 244 L 400 244" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="236" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <g>
    <rect x="402" y="212" width="222" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  </g>
  <text x="513" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3830" filter="url(#rough2)">③ 违规 → return false ✗</text>
  <text x="513" y="260" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">提前退出，不必扫完</text>

  <!-- 否：更新 prev -->
  <path d="M 220 286 L 220 304" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="300" font-size="10.5" fill="#446688" filter="url(#rough2)">否（通过）</text>
  <g>
    <rect x="80" y="308" width="280" height="44" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  </g>
  <text x="100" y="336" font-size="11.5" fill="#333" filter="url(#rough2)">④ prev ← i（首个 1 也走这一步）</text>
  <path d="M 220 352 L 220 366" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ i++ -->
  <g>
    <rect x="80" y="370" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  </g>
  <text x="100" y="398" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">⑤ i ← i + 1</text>
  <path d="M 220 414 L 220 430" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑥ 结束 -->
  <g>
    <rect x="80" y="434" width="280" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  </g>
  <text x="100" y="464" font-size="11.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">⑥ 循环正常结束 → return true ✓</text>

  <!-- 循环回边 -->
  <path d="M 80 392 L 48 392 L 48 156 L 78 156" stroke="#446688" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="26" y="290" font-size="10.5" fill="#446688" transform="rotate(-90 26 290)" filter="url(#rough2)">循环：直到 i = n</text>

  <!-- 右侧要点 -->
  <g>
    <rect x="402" y="300" width="222" height="182" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  </g>
  <text x="513" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">哨兵与边界</text>
  <text x="418" y="348" font-size="10.5" fill="#444" filter="url(#rough2)">prev = −1：首个 1 无前驱，</text>
  <text x="418" y="366" font-size="10.5" fill="#444" filter="url(#rough2)">跳过判定、直接通过</text>
  <text x="418" y="390" font-size="10.5" fill="#444" filter="url(#rough2)">k = 0：任意排布都 true</text>
  <text x="418" y="414" font-size="10.5" fill="#444" filter="url(#rough2)">无 1 / 只有 1 个 1：true</text>
  <text x="418" y="438" font-size="10.5" fill="#444" filter="url(#rough2)">全 1 且 k ≥ 1：第 2 个 1</text>
  <text x="418" y="456" font-size="10.5" fill="#444" filter="url(#rough2)">就触发 false，O(1) 退出</text>
  <text x="418" y="474" font-size="10" fill="#888" filter="url(#rough2)">全程只用 prev 与 i 两个变量</text>

  <text x="330" y="524" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">时间 O(n)（最坏扫完一趟）　空间 O(1)</text>
  <text x="330" y="548" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">注意：判定不通过才更新 prev；更新必须发生在判定之后</text>
</svg>
