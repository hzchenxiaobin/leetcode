<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="233" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">优化：同余类上的定长窗口和，前缀和一次到位</text>
  <path d="M 120 36 Q 320 44 520 36" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic">以题型 (count=3, marks=2)、余数 r=0 的同余类为例</text>

  <!-- transfer formula -->
  <g filter="url(#sk)">
    <rect x="110" y="66" width="420" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk)">dp′[j] = Σ dp[j − k·m]，k = 0 … min(c, ⌊j/m⌋)</text>

  <!-- residue class row -->
  <text x="60" y="140" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">同余类 j ≡ 0 (mod 2)：</text>
  <g filter="url(#sk)">
    <rect x="200" y="124" width="58" height="40" rx="5" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="262" y="124" width="58" height="40" rx="5" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="324" y="124" width="58" height="40" rx="5" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="386" y="124" width="58" height="40" rx="5" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="448" y="124" width="58" height="40" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="510" y="124" width="58" height="40" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.1" stroke-dasharray="4 3"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#sk)">
    <text x="229" y="140" fill="#4a8e4a">j = 0</text><text x="291" y="140" fill="#4a8e4a">2</text>
    <text x="353" y="140" fill="#4a8e4a">4</text><text x="415" y="140" fill="#4a8e4a">6</text>
    <text x="477" y="140" fill="#888888">8</text><text x="539" y="140" fill="#888888">10</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#7a7a7a" filter="url(#sk)">
    <text x="229" y="157">a₀</text><text x="291" y="157">a₁</text><text x="353" y="157">a₂</text>
    <text x="415" y="157">a₃</text><text x="477" y="157">a₄</text><text x="539" y="157">a₅</text>
  </g>

  <!-- window box -->
  <g filter="url(#sk)">
    <rect x="196" y="118" width="182" height="52" rx="7" fill="none" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="287" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">窗口 [t−c, t]：至多 c+1 个旧值</text>
  <path d="M 400 176 Q 430 190 452 200" stroke="#7a7a7a" stroke-width="1.3" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- prefix sums -->
  <text x="60" y="216" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">前缀和 pre：</text>
  <g filter="url(#sk)">
    <rect x="200" y="200" width="58" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="262" y="200" width="58" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="324" y="200" width="58" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="386" y="200" width="58" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#d6a040" filter="url(#sk)">
    <text x="229" y="222">pre₀=0</text><text x="291" y="222">pre₁</text>
    <text x="353" y="222">pre₂</text><text x="415" y="222">pre₃</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#7a7a7a" filter="url(#sk)">
    <text x="229" y="233">空和</text><text x="291" y="233">a₀</text><text x="353" y="233">a₀+a₁</text><text x="415" y="233">+a₂</text>
  </g>

  <!-- diff formula -->
  <g filter="url(#sk)">
    <rect x="92" y="252" width="456" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">ndp[r + t·m] = pre[t+1] − pre[max(0, t−c)]　O(1) 差分</text>

  <!-- flow steps -->
  <g filter="url(#sk)">
    <rect x="40" y="318" width="128" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="194" y="318" width="128" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="348" y="318" width="128" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="502" y="318" width="112" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="104" y="341" fill="#4a8edb">① 按 j mod m</text>
    <text x="258" y="341" fill="#4a8e4a">② 收旧值 a[]</text>
    <text x="412" y="341" fill="#d6a040">③ 前缀和 pre[]</text>
    <text x="558" y="341" fill="#b85450">④ 差分回写</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#7a7a7a" filter="url(#sk)">
    <text x="104" y="358">分组（m 组）</text>
    <text x="258" y="358">dp 原值不动</text>
    <text x="412" y="358">一遍线性扫</text>
    <text x="558" y="358">写进 ndp</text>
  </g>
  <g filter="url(#sk)" stroke="#7a7a7a" stroke-width="1.4" fill="none">
    <path d="M 168 347 L 190 347" marker-end="url(#ar)"/>
    <path d="M 322 347 L 344 347" marker-end="url(#ar)"/>
    <path d="M 476 347 L 498 347" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="62" y="396" width="516" height="64" rx="9" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
  </g>
  <text x="320" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">每个容量 j 恰被读一次、写一次 ⇒ 单题型转移 O(target)</text>
  <text x="320" y="438" text-anchor="middle" font-size="11" fill="#7a7a7a" font-style="italic" filter="url(#sk)">注意：后续窗口还要读旧值，必须写进独立数组 ndp（或倒序处理），不能边读边原地覆盖</text>
</svg>
