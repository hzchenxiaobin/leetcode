<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">双指针扫过每个空档，按两端填一次</text>

  <g filter="url(#rough2)">
    <rect x="130" y="44" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="66" text-anchor="middle" font-size="12" fill="#2f4a66">s = "L" + dominoes + "R"（加哨兵）</text>
    <path d="M260,78 L260,98" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="130" y="98" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="120" text-anchor="middle" font-size="12" fill="#2f4a66">i = 当前位置；j 向右找下一个非 '.' 位置</text>
    <path d="M260,132 L260,152" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <polygon points="260,152 350,188 260,224 170,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="184" text-anchor="middle" font-size="11" fill="#7a5a10">s[i] 与 s[j]</text>
    <text x="260" y="200" text-anchor="middle" font-size="11" fill="#7a5a10">是否相等？</text>
    <path d="M260,224 L260,244" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="130" y="244" width="120" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="190" y="266" text-anchor="middle" font-size="11" fill="#2f5527">相等</text>
    <text x="190" y="284" text-anchor="middle" font-size="11" fill="#2f5527">空档全填 s[i]</text>

    <rect x="270" y="244" width="120" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="330" y="262" text-anchor="middle" font-size="11" fill="#8a3020">R 与 L：对推</text>
    <text x="330" y="280" text-anchor="middle" font-size="11" fill="#8a3020">L 与 R：保持</text>

    <path d="M190,296 L190,316" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M330,296 L330,316" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="130" y="316" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="338" text-anchor="middle" font-size="12" fill="#2f4a66">i = j，继续下一个空档；i 越界即结束</text>

    <rect x="130" y="360" width="260" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="380" text-anchor="middle" font-size="12" fill="#7a5a10">返回 s[1..n]，去掉两个哨兵</text>
  </g>
</svg>
