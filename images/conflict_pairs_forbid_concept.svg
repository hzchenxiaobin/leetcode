<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：固定右端点 R，合法左端点是一段后缀</text>
  <path d="M 110 42 Q 300 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="20" y="58" width="286" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="163" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506e">nums = [1..n]，值 v 就在下标 v 处</text>
  <text x="163" y="98" text-anchor="middle" font-size="11" fill="#444">数对归一化：(lo, hi) = (min(a,b), max(a,b))</text>

  <g filter="url(#sk)">
    <rect x="330" y="58" width="290" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="475" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">[L, R] 同时含 a、b</text>
  <text x="475" y="98" text-anchor="middle" font-size="11" fill="#555">⟺ L ≤ lo 且 R ≥ hi（两值夹住区间）</text>

  <!-- pair arc above nums -->
  <path d="M 202 122 Q 316 74 430 122" stroke="#d6a040" stroke-width="1.8" fill="none" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="316" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a1a">冲突对 (2, 5)</text>

  <!-- nums row -->
  <g filter="url(#sk)"><rect x="90" y="122" width="72" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="126" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">1</text>
  <g filter="url(#sk)"><rect x="166" y="122" width="72" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="202" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34">2</text>
  <g filter="url(#sk)"><rect x="242" y="122" width="72" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="278" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e">3</text>
  <g filter="url(#sk)"><rect x="318" y="122" width="72" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="354" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e">4</text>
  <g filter="url(#sk)"><rect x="394" y="122" width="72" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="430" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34">5</text>
  <g filter="url(#sk)"><rect x="470" y="122" width="72" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="506" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e">6</text>
  <text x="614" y="146" font-size="10.5" fill="#666">n=6</text>

  <!-- R = 3 row -->
  <text x="66" y="192" font-size="11.5" font-weight="bold" fill="#2b5a2b">R = 3</text>
  <text x="66" y="208" font-size="10" fill="#888">hi ≤ 3 的对：无</text>
  <g filter="url(#sk)"><rect x="90" y="186" width="72" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="166" y="186" width="72" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="242" y="186" width="72" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="202" y="205" text-anchor="middle" font-size="10.5" fill="#2b5a2b">L = 1..3 全合法</text>
  <text x="558" y="205" font-size="11" font-weight="bold" fill="#2b5a2b">贡献 = 3</text>

  <!-- R = 5 row -->
  <text x="66" y="250" font-size="11.5" font-weight="bold" fill="#8a3a34">R = 5</text>
  <text x="66" y="266" font-size="10" fill="#888">激活 (2,5)：M₁=2</text>
  <g filter="url(#sk)"><rect x="90" y="244" width="72" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="166" y="244" width="72" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="202" y="263" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a34">L ≤ 2 被禁 ✗</text>
  <g filter="url(#sk)"><rect x="242" y="244" width="72" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="318" y="244" width="72" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="394" y="244" width="72" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="354" y="263" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b5a2b">L = 3..5 合法 ✓</text>
  <text x="558" y="263" font-size="11" font-weight="bold" fill="#2b5a2b">贡献 = 5−2</text>
  <path d="M 186 236 Q 316 224 452 236" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 4" filter="url(#sk)"/>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="60" y="300" width="520" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a2b">每个右端点 R 的合法子数组个数</text>
  <text x="320" y="348" text-anchor="middle" font-size="12.5" fill="#333">count(R) = R − M₁(R)，其中 M₁(R) = max{ lo(p) : hi(p) ≤ R }</text>
  <text x="320" y="372" text-anchor="middle" font-size="12.5" fill="#333">（无激活对时 M₁ = 0，count(R) = R）</text>
  <text x="320" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a2b">总数 base = Σ (R − M₁(R))，一个对都不删的答案</text>
</svg>
