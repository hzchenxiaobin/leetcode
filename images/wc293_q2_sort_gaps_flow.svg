<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">算法流程：排序 + 哨兵一趟扫描</text>

  <rect x="212" y="44" width="96" height="26" rx="13" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 70 L 260 84" stroke="#4a7a3a" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="88" width="220" height="30" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">special 升序排序</text>

  <path d="M 260 118 L 260 128" stroke="#4a7a3a" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="132" y="132" width="256" height="28" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="151" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">prev = bottom − 1（左哨兵）</text>

  <path d="M 260 160 L 260 168" stroke="#4a7a3a" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,172 352,206 260,240 168,206" fill="#fff8e1"
           stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有未处理</text>
  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">的 s ?</text>

  <path d="M 352 206 L 384 206" stroke="#4a7a3a" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="386" y="184" width="124" height="44" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="448" y="202" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ans = max(ans,</text>
  <text x="448" y="218" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">s − prev − 1); prev = s</text>

  <path d="M 448 184 L 448 163 L 260 163 L 260 167" stroke="#b85450" stroke-width="2"
        fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 240 L 260 252" stroke="#4a7a3a" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="140" y="256" width="240" height="28" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = max(ans, top − prev)</text>

  <path d="M 260 284 L 260 294" stroke="#4a7a3a" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="206" y="298" width="108" height="28" rx="14" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>

  <text x="260" y="344" text-anchor="middle" font-size="11"
        fill="#4a7a3a" filter="url(#rough2)">尾段 top − prev 等价于 (top+1) − prev − 1：右哨兵隐式统一</text>
</svg>
