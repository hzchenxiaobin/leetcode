<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">字母表是环：双向取近，预算从左往右花</text>

  <!-- ring -->
  <circle cx="165" cy="215" r="112" fill="none" stroke="#c8c8c8" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- plain letters -->
  <g filter="url(#rough2)" font-size="11" fill="#999" text-anchor="middle">
    <text x="192" y="110">b</text>
    <text x="217" y="120">c</text>
    <text x="239" y="135">d</text>
    <text x="257" y="155">e</text>
    <text x="270" y="179">f</text>
    <text x="276" y="206">g</text>
    <text x="276" y="233">h</text>
    <text x="270" y="259">i</text>
    <text x="257" y="283">j</text>
    <text x="239" y="303">k</text>
    <text x="217" y="318">l</text>
    <text x="192" y="328">m</text>
    <text x="165" y="331">n</text>
    <text x="138" y="328">o</text>
    <text x="113" y="318">p</text>
    <text x="91" y="303">q</text>
    <text x="73" y="283">r</text>
    <text x="60" y="259">s</text>
    <text x="54" y="233">t</text>
    <text x="54" y="206">u</text>
    <text x="60" y="179">v</text>
    <text x="73" y="155">w</text>
  </g>

  <!-- highlighted letters: y, z on the short path -->
  <g filter="url(#rough2)">
    <rect x="103" y="106" width="21" height="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="113.5" y="121" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5e24">y</text>
    <rect x="127" y="95" width="21" height="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="137.5" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5e24">z</text>
  </g>

  <!-- highlighted a -->
  <g filter="url(#rough2)">
    <rect x="152" y="90" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
    <text x="165" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">a</text>
  </g>

  <!-- highlighted x -->
  <g filter="url(#rough2)">
    <rect x="79" y="118" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <text x="92" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">x</text>
  </g>

  <!-- short arc arrow x -> a (through y, z, crossing the seam) -->
  <path d="M 81 121 A 126 126 0 0 1 148 90" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="108" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">跨接缝走近路：3 步 ✓</text>

  <!-- long arc arrow x -> a the other way -->
  <path d="M 100 142 A 98 98 0 1 0 165 117" stroke="#999999" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="165" y="290" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">另一方向要 23 步 ✗</text>

  <!-- center formula box -->
  <g filter="url(#rough2)">
    <rect x="90" y="193" width="150" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="165" y="211" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a">cost(x → a)</text>
    <text x="165" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">= min(23, 3) = 3</text>
  </g>

  <!-- right panel: rule boxes -->
  <g filter="url(#rough2)">
    <rect x="312" y="56" width="216" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="420" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">变 'a' 的代价</text>
    <text x="420" y="100" text-anchor="middle" font-size="13" fill="#333">cost = min(o, 26 − o)</text>
    <text x="420" y="122" text-anchor="middle" font-size="11.5" fill="#666">顺 / 逆时针取短，z → a 仅 1 步</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="312" y="156" width="216" height="122" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="420" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5e24">贪心规则：逐位从左到右</text>
    <text x="420" y="200" text-anchor="middle" font-size="11.5" fill="#2f5e24">① cost ≤ rem ⇒ 变 'a'，rem −= cost</text>
    <text x="420" y="220" text-anchor="middle" font-size="11.5" fill="#2f5e24">② cost &gt; rem ⇒ 朝 'a' 退 rem 步</text>
    <text x="420" y="238" text-anchor="middle" font-size="11.5" fill="#2f5e24">得 'a' + (o − rem)，rem = 0</text>
    <text x="420" y="260" text-anchor="middle" font-size="11.5" fill="#666">预算花光后，后面原样保留</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="312" y="294" width="216" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="420" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a1a">预算 k 全串共享一份</text>
    <text x="420" y="338" text-anchor="middle" font-size="11.5" fill="#8a6a1a">字典序靠前的位置绝对优先</text>
    <text x="420" y="356" text-anchor="middle" font-size="11.5" fill="#8a6a1a">预算花在前面永不亏</text>
  </g>

  <text x="270" y="386" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">distance = 各位最小环形距离之和 ⇒ 各位仅通过共享预算耦合，可逐位独立贪心</text>
</svg>
