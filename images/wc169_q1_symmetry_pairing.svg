<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：相反数成对出现，天然互不相同且和为零</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">对任意整数 k ≥ 1 ：(−k) + (+k) = 0，且 −k ≠ +k</text>

  <rect x="58" y="74" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="76" y="96" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">−1</text>
  <text x="110" y="96" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">+</text>
  <rect x="124" y="74" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="142" y="96" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">+1</text>
  <text x="176" y="96" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">= 0</text>

  <rect x="58" y="122" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="76" y="144" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">−2</text>
  <text x="110" y="144" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">+</text>
  <rect x="124" y="122" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="142" y="144" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">+2</text>
  <text x="176" y="144" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">= 0</text>

  <rect x="58" y="170" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="76" y="192" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">−3</text>
  <text x="110" y="192" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">+</text>
  <rect x="124" y="170" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="142" y="192" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">+3</text>
  <text x="176" y="192" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">= 0</text>

  <text x="92" y="228" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每一对贡献 0，且两两不相等</text>

  <rect x="214" y="222" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="226" y="239" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">⋮</text>

  <rect x="300" y="66" width="238" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="316" y="86" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">偶数 n = 2m</text>
  <text x="316" y="106" font-size="10" fill="#555" filter="url(#rough2)">取 m 对：(−1,1) … (−m,m)</text>
  <text x="316" y="124" font-size="10" fill="#555" filter="url(#rough2)">个数 2m = n，互不相同</text>
  <text x="316" y="142" font-size="10" fill="#4a7a3a" filter="url(#rough2)">和 = m 个 0 = 0 ✓</text>
  <text x="316" y="158" font-size="10" fill="#999" filter="url(#rough2)">无需补任何数</text>

  <rect x="300" y="182" width="238" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="316" y="202" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">奇数 n = 2m+1</text>
  <text x="316" y="222" font-size="10" fill="#555" filter="url(#rough2)">同样取 m 对，再补一个 0</text>
  <text x="316" y="240" font-size="10" fill="#555" filter="url(#rough2)">0 与任何 ±k 都不同</text>
  <text x="316" y="258" font-size="10" fill="#b85450" filter="url(#rough2)">0 是唯一「加了不改和」的数</text>
  <text x="316" y="274" font-size="10" fill="#8a3a36" filter="url(#rough2)">个数 2m+1 = n ✓</text>

  <rect x="60" y="296" width="440" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="76" y="316" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">统一写法</text>
  <text x="76" y="336" font-size="10" fill="#555" filter="url(#rough2)">循环 floor(n/2) 次做配对，循环外只用一次 n % 2 判断是否补 0</text>

  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">答案不唯一：本例返回 [−1,1,−2,2,0]（n=5），官方示例给出 [−7,−1,1,3,4]，两者都合法</text>
</svg>
