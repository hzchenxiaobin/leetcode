<svg xmlns="http://www.w3.org/2000/svg" width="520" height="470" viewBox="0 0 520 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="7.5" markerHeight="7.5" refX="5.5" refY="3.75" orient="auto">
      <path d="M0,0 L7.5,3.75 L0,7.5 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ao" markerWidth="7.5" markerHeight="7.5" refX="5.5" refY="3.75" orient="auto">
      <path d="M0,0 L7.5,3.75 L0,7.5 z" fill="#d6a040"/>
    </marker>
    <marker id="arr" markerWidth="7.5" markerHeight="7.5" refX="5.5" refY="3.75" orient="auto">
      <path d="M0,0 L7.5,3.75 L0,7.5 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="470" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">状态 (i, mask, changed) 的五条转移</text>
  <path d="M 150 40 Q 260 47 370 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <rect x="170" y="50" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#sk)"/>
  <text x="260" y="72" text-anchor="middle" font-size="13" fill="#33506e" font-weight="bold" filter="url(#sk)">( i, mask, changed )</text>

  <rect x="46" y="112" width="100" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="96" y="130" text-anchor="middle" font-size="12" fill="#2f5a25" font-weight="bold" filter="url(#sk)">① 不修改</text>
  <rect x="318" y="112" width="160" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="398" y="130" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">② 使用修改（未用时）</text>
  <path d="M 215 84 C 150 94 110 100 96 112" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <path d="M 305 84 C 350 94 380 100 395 112" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>

  <polygon points="96,150 170,182 96,214 22,182" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="96" y="177" text-anchor="middle" font-size="10.5" fill="#2f5a25" filter="url(#sk)">s_i ∈ mask 或</text>
  <text x="96" y="192" text-anchor="middle" font-size="10.5" fill="#2f5a25" filter="url(#sk)">|mask| &lt; k ?</text>
  <path d="M 96 214 C 80 232 68 244 60 256" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <path d="M 96 214 C 108 236 116 248 120 256" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="64" y="240" font-size="11" fill="#2f5a25" font-weight="bold" filter="url(#sk)">是</text>
  <text x="118" y="242" font-size="11" fill="#2f5a25" font-weight="bold" filter="url(#sk)">否</text>

  <rect x="14" y="258" width="168" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="98" y="280" text-anchor="middle" font-size="11.5" fill="#2f5a25" font-weight="bold" filter="url(#sk)">分支 1：并入</text>
  <text x="98" y="297" text-anchor="middle" font-size="10" fill="#2f5a25" filter="url(#sk)">(i+1, mask∪{s_i}, changed)</text>

  <rect x="14" y="352" width="168" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="98" y="374" text-anchor="middle" font-size="11.5" fill="#2f5a25" font-weight="bold" filter="url(#sk)">分支 2：开新段</text>
  <text x="98" y="391" text-anchor="middle" font-size="10" fill="#2f5a25" filter="url(#sk)">1 + (i+1, {s_i}, changed)</text>

  <rect x="252" y="148" width="240" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="372" y="168" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">分支 3：改成段内已有字符</text>
  <text x="372" y="186" text-anchor="middle" font-size="10" fill="#8a6a1f" filter="url(#sk)">c ∈ mask, c ≠ s_i → (i+1, mask, 1)</text>
  <text x="372" y="204" text-anchor="middle" font-size="9.5" fill="#b07818" filter="url(#sk)">mask 不变：26 种选择塌缩成 1 条边</text>
  <path d="M 398 138 C 390 140 385 142 380 148" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>

  <text x="372" y="240" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">改成段外新字符 c ∉ mask（c ≠ s_i）</text>
  <path d="M 372 246 L 322 262" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 372 246 L 424 262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <rect x="228" y="264" width="122" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="289" y="285" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">分支 4：|mask| &lt; k</text>
  <text x="289" y="302" text-anchor="middle" font-size="10" fill="#8a6a1f" filter="url(#sk)">并入</text>
  <text x="289" y="318" text-anchor="middle" font-size="9.5" fill="#8a6a1f" filter="url(#sk)">(i+1, mask∪{c}, 1)</text>

  <rect x="368" y="264" width="132" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="434" y="285" text-anchor="middle" font-size="11" fill="#a04340" font-weight="bold" filter="url(#sk)">分支 5：|mask| = k</text>
  <text x="434" y="302" text-anchor="middle" font-size="10" fill="#a04340" filter="url(#sk)">开新段</text>
  <text x="434" y="318" text-anchor="middle" font-size="9.5" fill="#a04340" filter="url(#sk)">1 + (i+1, {c}, 1)</text>

  <rect x="228" y="356" width="272" height="54" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="364" y="378" text-anchor="middle" font-size="11.5" fill="#a04340" font-weight="bold" filter="url(#sk)">分支 5 是题眼：新段的首字符完全可控</text>
  <text x="364" y="396" text-anchor="middle" font-size="10.5" fill="#a04340" filter="url(#sk)">示例 3 靠它把 "xx" 粘连劈成 x | x</text>

  <rect x="55" y="428" width="410" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="260" y="448" text-anchor="middle" font-size="11.5" fill="#2f5a25" font-weight="bold" filter="url(#sk)">changed = 1 之后只剩确定转移，每状态 O(1)</text>
</svg>
