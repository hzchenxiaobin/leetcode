<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="396" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描维护 cur 与 best</text>
  <rect x="30" y="66" width="500" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">若 n &lt;= 2：返回 n</text>
  <path d="M 280 104 L 280 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="112" width="500" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">best = cur = 2</text>
  <path d="M 280 150 L 280 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="158" width="500" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for i = 2 .. n-1：检查 nums[i] == nums[i-1] + nums[i-2]</text>
  <path d="M 280 196 L 280 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="204" width="500" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">成立：cur++    不成立：cur = 2</text>
  <path d="M 280 242 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="250" width="500" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">best = max(best, cur)</text>
  <path d="M 280 288 L 280 294" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="296" width="500" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 best</text>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">时间 O(n)，空间 O(1)</text>
</svg>
