<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/></marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">单调栈（值, 计数）在 nums = [1,4,3,3,2] 上的演化</text>

  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="85" y="56">i=0, x=1</text><text x="185" y="56">i=1, x=4</text><text x="285" y="56">i=2, x=3</text>
    <text x="385" y="56">i=3, x=3</text><text x="485" y="56">i=4, x=2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="50" y="220" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="86" y="238" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(1, 1)</text>

  <g filter="url(#rough2)">
    <rect x="150" y="220" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="186" y="238" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(4, 1)</text>
  <text x="186" y="266" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">弹出 (1,1)</text>

  <g filter="url(#rough2)">
    <rect x="250" y="220" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="250" y="190" width="72" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <text x="286" y="238" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(4, 1)</text>
  <text x="286" y="208" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(3, 1)</text>

  <g filter="url(#rough2)">
    <rect x="350" y="220" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="350" y="190" width="72" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <text x="386" y="238" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(4, 1)</text>
  <text x="386" y="208" font-size="11" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">(3, 2)</text>

  <g filter="url(#rough2)">
    <rect x="450" y="220" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="450" y="190" width="72" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="450" y="160" width="72" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
  </g>
  <text x="486" y="238" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(4, 1)</text>
  <text x="486" y="208" font-size="11" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">(3, 2)</text>
  <text x="486" y="178" font-size="11" fill="#8a2b26" text-anchor="middle" filter="url(#rough2)">(2, 1)</text>

  <path d="M 470 300 L 470 292" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="300" font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">栈底在下方，越靠栈顶的值越小（严格递减）</text>

  <rect x="50" y="312" width="460" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">i=1 的 4 把 1 弹出；i=3 遇到相等的 3，计数从 1 加到 2</text>
  <rect x="50" y="350" width="460" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">被弹出 = 这些值已被更大的元素「隔断」，不可能再当左端点</text>
</svg>
