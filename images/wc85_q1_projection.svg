<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">二维相交 = 两个一维投影同时相交</text>

  <!-- 坐标轴 -->
  <g filter="url(#rough2)">
    <path d="M60,290 L470,290" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
    <path d="M60,290 L60,60" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="474" y="305" font-size="12" fill="#666">x</text>
    <text x="42" y="58" font-size="12" fill="#666">y</text>
  </g>

  <!-- 矩形 A -->
  <rect x="110" y="110" width="120" height="110" rx="3" fill="#e8f0fe" fill-opacity="0.85"
        stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">rec1</text>

  <!-- 矩形 B -->
  <rect x="180" y="160" width="130" height="110" rx="3" fill="#e6f4ea" fill-opacity="0.85"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="288" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">rec2</text>

  <!-- 交集 -->
  <rect x="180" y="160" width="50" height="60" rx="2" fill="#fff8e1"
        stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="205" y="196" text-anchor="middle" font-size="11" fill="#8a3020" filter="url(#rough2)">交集</text>

  <!-- x 投影 -->
  <g filter="url(#rough2)">
    <path d="M110,296 L110,312 M220,296 L220,312" stroke="#446688" stroke-width="1.6"/>
    <path d="M180,304 L310,304" stroke="#4a7a3a" stroke-width="3"/>
    <path d="M180,300 L180,308 M310,300 L310,308" stroke="#4a7a3a" stroke-width="1.6"/>
    <path d="M180,320 L230,320" stroke="#b85450" stroke-width="4"/>
    <path d="M180,316 L180,324 M230,316 L230,324" stroke="#b85450" stroke-width="1.6"/>
    <text x="330" y="309" font-size="12" fill="#2f5527">x: [180, 310]</text>
    <text x="240" y="336" font-size="12" fill="#8a3020">交叠 (180, 230) 非空 ✓</text>
  </g>

  <!-- y 投影 -->
  <g filter="url(#rough2)">
    <path d="M56,110 L40,110" stroke="#446688" stroke-width="3"/>
    <path d="M56,220 L40,220" stroke="#446688" stroke-width="3"/>
    <path d="M50,160 L50,270" stroke="#4a7a3a" stroke-width="3"/>
    <path d="M46,160 L54,160 M46,270 L54,270" stroke="#4a7a3a" stroke-width="1.6"/>
    <path d="M34,160 L34,220" stroke="#b85450" stroke-width="4"/>
    <text x="14" y="196" font-size="11" fill="#8a3020">交叠 ✓</text>
  </g>
</svg>
