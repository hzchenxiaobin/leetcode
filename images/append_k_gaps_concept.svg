<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：挡板与缺口 —— nums 把正整数轴切成连续可用段</text>
  <path d="M 100 42 Q 280 52 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- blockers label -->
  <text x="394" y="70" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#sk)">挡板 = 排序去重后的 nums 值</text>
  <text x="394" y="86" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">（示意：nums = {4, 8}；重复值只挡一个位置）</text>

  <!-- number line -->
  <g filter="url(#sk)">
    <path d="M 52 196 H 508" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ag)"/>
  </g>
  <text x="522" y="201" font-size="12" fill="#3a3a3a" filter="url(#sk)">+∞</text>

  <!-- ticks 1..12 -->
  <g filter="url(#sk)" font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="220">1</text>
    <text x="106" y="220">2</text>
    <text x="142" y="220">3</text>
    <text x="178" y="220">4</text>
    <text x="214" y="220">5</text>
    <text x="250" y="220">6</text>
    <text x="286" y="220">7</text>
    <text x="322" y="220">8</text>
    <text x="358" y="220">9</text>
    <text x="394" y="220">10</text>
    <text x="430" y="220">11</text>
    <text x="466" y="220">12</text>
  </g>

  <!-- gap 1: [1,3] blue -->
  <g filter="url(#sk)">
    <rect x="54" y="142" width="118" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="113" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">第一个缺口</text>
  <text x="113" y="176" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">[1, v₁−1]</text>

  <!-- gap 2: [5,7] blue -->
  <g filter="url(#sk)">
    <rect x="198" y="142" width="118" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="257" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">中间缺口</text>
  <text x="257" y="176" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">[vᵢ+1, vᵢ₊₁−1]</text>

  <!-- tail gap: [9, inf) green -->
  <g filter="url(#sk)">
    <rect x="342" y="142" width="160" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 3"/>
  </g>
  <text x="422" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">末尾缺口（无限长）</text>
  <text x="422" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">[v_last+1, +∞)</text>

  <!-- blockers on the line: at 4 and 8 -->
  <g filter="url(#sk)">
    <rect x="163" y="184" width="30" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <rect x="307" y="184" width="30" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="178" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">4</text>
  <text x="322" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">8</text>

  <!-- greedy arrow under the line -->
  <g filter="url(#sk)">
    <path d="M 60 258 H 470" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  </g>
  <text x="265" y="246" text-anchor="middle" font-size="12.5" fill="#b03a3a" filter="url(#sk)">贪心：从左往右，先吃小数（见 §5 引理 1）</text>

  <!-- formula note -->
  <g filter="url(#sk)">
    <rect x="60" y="286" width="440" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="280" y="310" text-anchor="middle" font-size="13.5" fill="#7a5415" filter="url(#sk)">每个缺口都是公差为 1 的等差数列，O(1) 求和：</text>
  <text x="280" y="336" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">Σ(i=a..b) i = (a+b)(b−a+1) / 2</text>
  <text x="280" y="355" text-anchor="middle" font-size="11" fill="#9a7530" filter="url(#sk)">吃掉一个缺口要么整段、要么只吃前 need 个 —— 与 k 无关</text>
</svg>
