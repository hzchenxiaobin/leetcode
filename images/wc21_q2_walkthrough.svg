<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [23, 2, 4, 6, 7]，k = 6</text>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#888">s 为当前前缀和，first 表记录每个余数最早出现的元素下标（空前缀记为 −1）</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <rect x="16" y="92" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="70" y="92" width="80" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="92" width="84" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="234" y="92" width="82" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="316" y="92" width="146" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="462" y="92" width="168" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="43" y="116">i</text>
    <text x="110" y="116">nums[i]</text>
    <text x="192" y="116">s = 前缀和</text>
    <text x="275" y="116">s mod 6</text>
    <text x="389" y="116">first 表</text>
    <text x="546" y="116">判定</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#444">
    <rect x="16" y="130" width="54" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="70" y="130" width="80" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="150" y="130" width="84" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="234" y="130" width="82" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="316" y="130" width="146" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="462" y="130" width="168" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="43" y="158">0</text>
    <text x="110" y="158">23</text>
    <text x="192" y="158">23</text>
    <text x="275" y="158">5</text>
    <text x="389" y="158">{0: −1, 5: 0}</text>
    <text x="546" y="152">首次出现</text>
    <text x="546" y="167" font-size="9" fill="#888">记下标 0</text>

    <rect x="16" y="176" width="54" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="70" y="176" width="80" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="150" y="176" width="84" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="234" y="176" width="82" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="316" y="176" width="146" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="462" y="176" width="168" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="43" y="204">1</text>
    <text x="110" y="204">2</text>
    <text x="192" y="204">25</text>
    <text x="275" y="204">1</text>
    <text x="389" y="204">{0: −1, 5: 0, 1: 1}</text>
    <text x="546" y="198">首次出现</text>
    <text x="546" y="213" font-size="9" fill="#888">记下标 1</text>

    <rect x="16" y="222" width="54" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="70" y="222" width="80" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="150" y="222" width="84" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="234" y="222" width="82" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="316" y="222" width="146" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="462" y="222" width="168" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="43" y="252" fill="#3a5a30" font-weight="bold">2</text>
    <text x="110" y="252" fill="#3a5a30" font-weight="bold">4</text>
    <text x="192" y="252" fill="#3a5a30" font-weight="bold">29</text>
    <text x="275" y="252" fill="#3a5a30" font-weight="bold">5</text>
    <text x="389" y="252" fill="#3a5a30">命中 5，下标 0</text>
    <text x="546" y="246" fill="#3a5a30" font-weight="bold">2 − 0 = 2 ≥ 2</text>
    <text x="546" y="261" font-size="9" fill="#3a5a30">返回 true</text>
  </g>

  <path d="M 275 272 L 275 292" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="86" y="298" width="468" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="323" text-anchor="middle" font-size="11" fill="#3a5a30">子数组 nums[1..2] = [2, 4]，和 = 6 = 1 × 6，长度 2 ✓</text>

  <text x="320" y="360" text-anchor="middle" font-size="10" fill="#999">若下标差只有 1（如示例 2 中 i = 2 与 first[1] = 1），长度不足 2，必须继续扫描而不能立即返回</text>
</svg>
