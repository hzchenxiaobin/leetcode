<svg xmlns="http://www.w3.org/2000/svg" width="660" height="480" viewBox="0 0 660 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="27" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">连锁传递：下降量被缝余量 s 一步步「吃掉」</text>
  <text x="330" y="48" text-anchor="middle" font-size="11.5" fill="#888"
        filter="url(#rough2)">a = [1, 4, 6, 8, 10]，k = 3，删掉 a₂ = 4 后 e = 6 − 1 − 3 = 2</text>

  <!-- 删除后的数组 -->
  <text x="88" y="92" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">k = 3</text>
  <rect x="90" y="68" width="64" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="180" y="68" width="64" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="270" y="68" width="64" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="360" y="68" width="64" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="122" y="95" fill="#2b2b2b" filter="url(#rough2)">1</text>
    <text x="212" y="95" fill="#d6a040" filter="url(#rough2)">6</text>
    <text x="302" y="95" fill="#4a7a3a" filter="url(#rough2)">8</text>
    <text x="392" y="95" fill="#4a7a3a" filter="url(#rough2)">10</text>
  </g>
  <text x="257" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">s = 1</text>
  <text x="347" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">s = 1</text>

  <!-- 每步下降量 -->
  <rect x="192" y="206" width="40" height="60" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="282" y="236" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="372" y="263" width="40" height="3" rx="1.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M170,266 L430,266" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="212" y="200" filter="url(#rough2)">y = 2</text>
    <text x="302" y="230" filter="url(#rough2)">y = 1</text>
    <text x="392" y="257" filter="url(#rough2)">y = 0</text>
  </g>
  <text x="300" y="288" text-anchor="middle" font-size="12" fill="#b85450"
        filter="url(#rough2)">代价 = Σ yₜ = 2 + 1 + 0 = 3</text>

  <!-- 公式框 -->
  <rect x="446" y="64" width="202" height="132" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11" fill="#33517a">
    <text x="456" y="88" filter="url(#rough2)">yᵢ₊₁ = e</text>
    <text x="456" y="112" filter="url(#rough2)">yₜ = max(0, yₜ₋₁ − sₜ₋₁)</text>
    <text x="456" y="136" filter="url(#rough2)">  = max(0, V − S[t])</text>
    <text x="456" y="160" filter="url(#rough2)">V = e + S[i+1]</text>
    <text x="456" y="184" fill="#4a7a3a" filter="url(#rough2)">e = 2，s = 1 → y = 2, 1, 0</text>
  </g>

  <!-- 单调前缀和 + 二分 -->
  <rect x="80" y="320" width="240" height="120" fill="#fff8e1" opacity="0.65" filter="url(#rough2)"/>
  <path d="M80,440 L620,440" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M80,440 L80,320" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M80,430 L200,430 L200,382 L320,382 L320,358 L440,358 L440,334 L560,334"
        fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M80,374 L612,374" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <path d="M320,440 L320,330" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="608" y="368" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">V = 7</text>
  <text x="328" y="344" font-size="11" fill="#4a7a3a" filter="url(#rough2)">R</text>
  <text x="64" y="326" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">S[t]</text>
  <text x="628" y="444" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">t</text>
  <text x="88" y="350" font-size="10.5" fill="#b8860b" filter="url(#rough2)">S[t] &lt; V 的 t 全计入</text>
  <text x="330" y="466" text-anchor="middle" font-size="11" fill="#444"
        filter="url(#rough2)">S 单调不减 ⇒ 满足 S[t] &lt; V 的 t 是连续一段 ⇒ 二分右端点 R，答案 = (R−i)·V − Σ S[t]</text>
</svg>
