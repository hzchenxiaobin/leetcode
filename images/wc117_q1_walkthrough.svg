<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 326"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="326" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">示例 2：[2,2,2,5,2]，v₀ = 2</text>
  <circle cx="280" cy="70" r="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="14" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="170" cy="140" r="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="146" text-anchor="middle" font-size="14" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="390" cy="140" r="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="146" text-anchor="middle" font-size="14" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="110" cy="210" r="25" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="216" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="230" cy="210" r="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="216" text-anchor="middle" font-size="14" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <line x1="280" y1="95" x2="178" y2="120" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="280" y1="95" x2="382" y2="120" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="158" y1="165" x2="120" y2="186" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="182" y1="165" x2="220" y2="186" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="110" y="252" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">节点 5 ≠ 2 → false</text>
  <rect x="60" y="268" width="440" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="295" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">访问到 5 时立即返回 false，右子树被短路不再访问</text>
</svg>
