<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="450" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把数组看成「桶的大小分布」</text>
  <text x="340" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">袋子编号本身无关紧要，只有「装了 i 个橙子的袋子有几个」影响代价</text>

  <text x="128" y="63" font-size="11" fill="#999" filter="url(#rough2)">a =（n = 8，编号即袋子）</text>

  <g filter="url(#rough2)">
    <rect x="128" y="68" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="182" y="68" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="236" y="68" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="290" y="68" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="344" y="68" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="398" y="68" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="452" y="68" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="506" y="68" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="151" y="92" fill="#33517a" filter="url(#rough2)">1</text>
    <text x="205" y="92" fill="#33517a" filter="url(#rough2)">1</text>
    <text x="259" y="92" fill="#33517a" filter="url(#rough2)">1</text>
    <text x="313" y="92" fill="#2e6e2e" filter="url(#rough2)">2</text>
    <text x="367" y="92" fill="#2e6e2e" filter="url(#rough2)">2</text>
    <text x="421" y="92" fill="#a0761e" filter="url(#rough2)">3</text>
    <text x="475" y="92" fill="#8e3b36" filter="url(#rough2)">4</text>
    <text x="529" y="92" fill="#a0761e" filter="url(#rough2)">5</text>
  </g>

  <path d="M 340 108 L 340 132" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="124" font-size="11" fill="#777" filter="url(#rough2)">按编号聚成桶</text>

  <g filter="url(#rough2)">
    <rect x="60" y="140" width="104" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="174" y="140" width="104" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="288" y="140" width="104" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="402" y="140" width="104" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="516" y="140" width="104" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#444">
    <text x="112" y="163" filter="url(#rough2)">袋 1：3 个</text>
    <text x="226" y="163" filter="url(#rough2)">袋 2：2 个</text>
    <text x="340" y="163" filter="url(#rough2)">袋 3：1 个</text>
    <text x="454" y="163" filter="url(#rough2)">袋 4：1 个</text>
    <text x="568" y="163" filter="url(#rough2)">袋 5：1 个</text>
  </g>

  <g font-size="12.5" text-anchor="middle" fill="#333">
    <text x="240" y="206" font-weight="bold" filter="url(#rough2)">桶大小 i</text>
    <text x="350" y="206" font-weight="bold" filter="url(#rough2)">桶个数 c_i</text>
    <text x="470" y="206" font-weight="bold" filter="url(#rough2)">i · c_i</text>
  </g>
  <g filter="url(#rough2)" stroke="#c9c9c0" stroke-width="1.1" fill="none">
    <path d="M 180 214 L 530 214"/>
    <path d="M 180 240 L 530 240"/>
    <path d="M 180 266 L 530 266"/>
    <path d="M 180 292 L 530 292"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#333">
    <text x="240" y="233" filter="url(#rough2)">1</text>
    <text x="350" y="233" filter="url(#rough2)">3</text>
    <text x="470" y="233" filter="url(#rough2)">3</text>
    <text x="240" y="259" filter="url(#rough2)">2</text>
    <text x="350" y="259" filter="url(#rough2)">1</text>
    <text x="470" y="259" filter="url(#rough2)">2</text>
    <text x="240" y="285" filter="url(#rough2)">3</text>
    <text x="350" y="285" filter="url(#rough2)">1</text>
    <text x="470" y="285" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  </g>
  <text x="545" y="233" font-size="10.5" fill="#999" filter="url(#rough2)">← 空袋 i=0 时 0·c_0 = 0</text>

  <g filter="url(#rough2)">
    <rect x="120" y="300" width="440" height="42" rx="8" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <text x="340" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e3b36" filter="url(#rough2)">cost = max(1·3, 2·1, 3·1) = 3</text>

  <g filter="url(#rough2)">
    <rect x="56" y="368" width="568" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="340" y="390" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">① 只有多重集 {3, 2, 1, 1, 1} 影响代价，编号 1..n 随便换 → 问题 = 把 n 拆成若干正整数</text>
  <text x="340" y="412" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">② 代价 = max_i i·c_i，于是可以「固定阈值 K，反推最多能装多少橘子」</text>
</svg>
