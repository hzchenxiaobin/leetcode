<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">二维前缀异或：容斥原理不需要减号</text>
  <path d="M 190 42 Q 340 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="185" y="74" text-anchor="middle" font-size="12" fill="#666">把 R(a,b) 划成四块，数一数每个格子被覆盖几次</text>
  <text x="40" y="160" text-anchor="middle" font-size="11" fill="#888">i ↓</text>
  <text x="150" y="90" text-anchor="middle" font-size="11" fill="#888">j →</text>

  <!-- region A: top-left inner block -->
  <g filter="url(#sk)">
    <rect x="60" y="95" width="200" height="152" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="160" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#4a8edb">A</text>
  <text x="160" y="172" text-anchor="middle" font-size="10.5" fill="#3a5a7a">内部：i &lt; a 且 j &lt; b</text>
  <g filter="url(#sk)">
    <circle cx="160" cy="203" r="15" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="160" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">×3</text>
  <text x="160" y="236" text-anchor="middle" font-size="10.5" fill="#3a5a7a">3 次 = 奇数次 → 净剩 1 份</text>

  <!-- region C: new column -->
  <g filter="url(#sk)">
    <rect x="260" y="95" width="50" height="152" rx="4" fill="#fff1d6" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="285" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#a06a20">C</text>
  <g filter="url(#sk)">
    <circle cx="285" cy="183" r="13" fill="#ffffff" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="285" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a20">×1</text>
  <text x="285" y="222" text-anchor="middle" font-size="10" fill="#a06a20">新列</text>

  <!-- region B: new row -->
  <g filter="url(#sk)">
    <rect x="60" y="247" width="200" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="95" y="271" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2e6e2e">B：新行（不含角）</text>
  <g filter="url(#sk)">
    <circle cx="235" cy="266" r="13" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="235" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">×1</text>

  <!-- corner cell -->
  <g filter="url(#sk)">
    <rect x="260" y="247" width="50" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="285" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">(a,b)</text>
  <text x="285" y="279" text-anchor="middle" font-size="9.5" fill="#b03a3a">新格 ×1</text>

  <!-- right panel: coverage list -->
  <g filter="url(#sk)">
    <rect x="345" y="95" width="315" height="196" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="502" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6220">三个前缀各覆盖了哪些格子？</text>
  <g filter="url(#sk)">
    <rect x="358" y="137" width="12" height="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="373" y="137" width="12" height="12" fill="#fff1d6" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="392" y="147" text-anchor="start" font-size="11.5" fill="#444">P[a−1][b]：上方整块（A + C）</text>
  <g filter="url(#sk)">
    <rect x="358" y="165" width="12" height="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="373" y="165" width="12" height="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="392" y="175" text-anchor="start" font-size="11.5" fill="#444">P[a][b−1]：左侧整块（A + B）</text>
  <g filter="url(#sk)">
    <rect x="358" y="193" width="12" height="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="392" y="203" text-anchor="start" font-size="11.5" fill="#444">P[a−1][b−1]：左上块（A）</text>
  <g filter="url(#sk)">
    <rect x="358" y="221" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="392" y="231" text-anchor="start" font-size="11.5" fill="#444">matrix[a][b]：右下角新格</text>
  <path d="M 358 246 L 648 244" stroke="#e0d0a0" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="358" y="266" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b">A 被覆盖 3 次（奇）→ 净剩 1 份 ✓</text>
  <text x="358" y="284" text-anchor="start" font-size="11" fill="#444">B / C / 角各 1 次 ✓，R(a,b) 外部 0 次 ✓</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="40" y="312" width="610" height="52" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="345" y="344" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e">P[a][b] = P[a−1][b] ⊕ P[a][b−1] ⊕ P[a−1][b−1] ⊕ matrix[a][b]</text>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="40" y="376" width="610" height="52" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="345" y="398" text-anchor="middle" font-size="11.5" fill="#444">对比二维前缀和：加法必须减去 P[a−1][b−1] 抵消多加的部分；</text>
  <text x="345" y="418" text-anchor="middle" font-size="11.5" fill="#444">异或的逆运算是自己 → 不需要减号，奇数次覆盖恰好净剩一次</text>
</svg>
