<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">每列的黑色格子必是「顶部前缀」，用一个高度 h 描述</text>

  <!-- 网格 4 列 5 行，高度 [2,5,1,3] -->
  <g filter="url(#rough2)">
    <rect x="86" y="56" width="46" height="34" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="86" y="90" width="46" height="34" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="86" y="124" width="46" height="34" fill="#f4f7fb" stroke="#446688" stroke-width="1.3"/>
    <rect x="86" y="158" width="46" height="34" fill="#f4f7fb" stroke="#446688" stroke-width="1.3"/>
    <rect x="86" y="192" width="46" height="34" fill="#f4f7fb" stroke="#446688" stroke-width="1.3"/>

    <rect x="132" y="56" width="46" height="34" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="132" y="90" width="46" height="34" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="132" y="124" width="46" height="34" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="132" y="158" width="46" height="34" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="132" y="192" width="46" height="34" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>

    <rect x="178" y="56" width="46" height="34" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="178" y="90" width="46" height="34" fill="#f4f7fb" stroke="#446688" stroke-width="1.3"/>
    <rect x="178" y="124" width="46" height="34" fill="#f4f7fb" stroke="#446688" stroke-width="1.3"/>
    <rect x="178" y="158" width="46" height="34" fill="#f4f7fb" stroke="#446688" stroke-width="1.3"/>
    <rect x="178" y="192" width="46" height="34" fill="#f4f7fb" stroke="#446688" stroke-width="1.3"/>

    <rect x="224" y="56" width="46" height="34" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="224" y="90" width="46" height="34" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="224" y="124" width="46" height="34" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="224" y="158" width="46" height="34" fill="#f4f7fb" stroke="#446688" stroke-width="1.3"/>
    <rect x="224" y="192" width="46" height="34" fill="#f4f7fb" stroke="#446688" stroke-width="1.3"/>

    <text x="109" y="248" text-anchor="middle" font-size="12" fill="#446688">h = 2</text>
    <text x="155" y="248" text-anchor="middle" font-size="12" fill="#446688">h = 5</text>
    <text x="201" y="248" text-anchor="middle" font-size="12" fill="#446688">h = 1</text>
    <text x="247" y="248" text-anchor="middle" font-size="12" fill="#446688">h = 3</text>
    <text x="109" y="268" text-anchor="middle" font-size="11" fill="#777">列 0</text>
    <text x="155" y="268" text-anchor="middle" font-size="11" fill="#777">列 1</text>
    <text x="201" y="268" text-anchor="middle" font-size="11" fill="#777">列 2</text>
    <text x="247" y="268" text-anchor="middle" font-size="11" fill="#777">列 3</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="300" y="56" width="250" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="316" y="80" fill="#446688">黑色 = 已染色，白色 = 未染色</text>
    <text x="316" y="104" fill="#333">每列的黑格是一段顶部前缀</text>
    <text x="316" y="126" fill="#333">⇒ 状态只需一个高度 h ∈ [0, n]</text>
    <text x="316" y="148" fill="#666">同列重复操作等价于取最大 i</text>

    <rect x="300" y="176" width="250" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="316" y="200" fill="#a06c10">反例：h = [2, 5, 1, 3]</text>
    <text x="316" y="222" fill="#a06c10">列 1 全黑（5 格），列 2 只染 1 格</text>
    <text x="316" y="244" fill="#666">任意高度向量都可达：逐列按 h 执行一次操作</text>
    <text x="316" y="262" fill="#666">（h = 0 时不操作）</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="52" y="292" width="498" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="68" y="316" fill="#2d5a22">操作 (i, j) 把第 j 列第 0..i 行染黑，所以每列形态被一个数 h[j] 完全决定</text>
    <text x="68" y="340" fill="#2d5a22">枚举目标从操作序列降为 (n + 1)ⁿ 种高度向量，再交给 DP 处理</text>
  </g>
</svg>
