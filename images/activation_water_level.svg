<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">「水位模型」：激活把水位顶到 a+1，历史最高水位 X 决定生死</text>
  <path d="M 180 44 Q 450 54 720 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 水槽 -->
  <g filter="url(#sk)">
    <rect x="70" y="78" width="560" height="292" rx="6" fill="#ffffff" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 72 88 L 336 88 Q 346 152 336 218 Q 326 284 336 362 L 72 362 Z" fill="#e8f0fe" stroke="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 336 88 Q 346 152 336 218 Q 326 284 336 362" fill="none" stroke="#446688" stroke-width="2.5"/>
  </g>
  <text x="336" y="70" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">水位 X = 2</text>
  <text x="76" y="70" font-size="11.5" fill="#666">全部元素按 limit 列队</text>

  <!-- limit=1 组（淹没） -->
  <g filter="url(#sk)">
    <circle cx="190" cy="138" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="190" cy="188" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="190" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">7</text>
  <text x="190" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">3</text>
  <g filter="url(#sk)" stroke="#b85450" stroke-width="2">
    <path d="M 178 126 L 202 150" fill="none"/>
    <path d="M 202 126 L 178 150" fill="none"/>
    <path d="M 178 176 L 202 200" fill="none"/>
    <path d="M 202 176 L 178 200" fill="none"/>
  </g>

  <!-- limit=2 组（淹没） -->
  <g filter="url(#sk)">
    <circle cx="322" cy="138" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="322" cy="188" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="322" cy="238" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="322" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">5</text>
  <text x="322" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2</text>
  <text x="322" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">8</text>
  <g filter="url(#sk)" stroke="#b85450" stroke-width="2">
    <path d="M 310 126 L 334 150" fill="none"/>
    <path d="M 334 126 L 310 150" fill="none"/>
    <path d="M 310 176 L 334 200" fill="none"/>
    <path d="M 334 176 L 310 200" fill="none"/>
    <path d="M 310 226 L 334 250" fill="none"/>
    <path d="M 334 226 L 310 250" fill="none"/>
  </g>

  <!-- limit=3 组（安全） -->
  <g filter="url(#sk)">
    <circle cx="454" cy="138" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="454" cy="188" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="454" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">9</text>
  <text x="454" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>

  <!-- limit=4 组（安全） -->
  <g filter="url(#sk)">
    <circle cx="572" cy="138" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="572" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">6</text>

  <!-- 组内标注 -->
  <text x="200" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✗ limit ≤ X：已被淹没</text>
  <text x="510" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓ limit &gt; X：安全</text>

  <!-- 引导虚线与组标签 -->
  <g filter="url(#sk)" stroke="#b0b0b0" stroke-width="1" stroke-dasharray="4 4">
    <path d="M 190 208 L 190 382" fill="none"/>
    <path d="M 322 258 L 322 382" fill="none"/>
    <path d="M 454 208 L 454 382" fill="none"/>
    <path d="M 572 158 L 572 382" fill="none"/>
  </g>
  <text x="190" y="398" text-anchor="middle" font-size="12" fill="#666">limit = 1</text>
  <text x="322" y="398" text-anchor="middle" font-size="12" fill="#666">limit = 2</text>
  <text x="454" y="398" text-anchor="middle" font-size="12" fill="#666">limit = 3</text>
  <text x="572" y="398" text-anchor="middle" font-size="12" fill="#666">limit = 4</text>

  <!-- 右侧命运规则 -->
  <g filter="url(#sk)">
    <rect x="660" y="78" width="220" height="250" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="770" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7a5415">命运规则</text>
  <text x="676" y="132" font-size="11.5" fill="#444">① 每次激活，水位 x 跳到</text>
  <text x="688" y="150" font-size="11.5" fill="#444">当前活跃数 + 1</text>
  <text x="676" y="178" font-size="11.5" fill="#444">② X = 历史最高水位，只增</text>
  <text x="688" y="196" font-size="11.5" fill="#444">不减，且活跃数 a ≤ X</text>
  <text x="676" y="224" font-size="11.5" fill="#444">③ limit ≤ X ⟹ 永久出局</text>
  <text x="688" y="242" font-size="11.5" fill="#444">（图中打 ✗ 的元素）</text>
  <text x="676" y="270" font-size="11.5" fill="#444">④ limit &gt; X ⟹ 随时可激活</text>
  <text x="688" y="288" font-size="11.5" fill="#444">（因 a ≤ X &lt; limit）</text>

  <!-- 底部生死线 -->
  <g filter="url(#sk)">
    <rect x="70" y="415" width="810" height="90" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="475" y="441" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">组 L 的生死线</text>
  <text x="475" y="466" text-anchor="middle" font-size="12" fill="#444">水位一旦达到 L，整组永久出局 —— 组员必须赶在 X 首次达到 L 之前激活；</text>
  <text x="475" y="488" text-anchor="middle" font-size="12" fill="#444">水位未达 L 时组员随叫随到。于是问题只剩：每组救几个、救哪几个？</text>
</svg>
