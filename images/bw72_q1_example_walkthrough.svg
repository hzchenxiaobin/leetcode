<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">命中对速查：4 对都来自值 2 和值 3</text>

  <!-- hits table -->
  <g filter="url(#rough2)">
    <rect x="50" y="52" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="50" y="88" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="50" y="124" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="50" y="160" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="50" y="196" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="66" y="74" font-weight="bold" fill="#446688">候选数对 (i, j)</text>
    <text x="300" y="74" font-weight="bold" fill="#446688">i×j</text>
    <text x="400" y="74" font-weight="bold" fill="#446688">判定</text>
    <text x="66" y="110">(0, 6) 值 3</text><text x="300" y="110">0</text><text x="400" y="110" fill="#2d5a22">0 % 2 == 0 ✓</text>
    <text x="66" y="146">(2, 3) 值 2</text><text x="300" y="146">6</text><text x="400" y="146" fill="#2d5a22">6 % 2 == 0 ✓</text>
    <text x="66" y="182">(2, 4) 值 2</text><text x="300" y="182">8</text><text x="400" y="182" fill="#2d5a22">8 % 2 == 0 ✓</text>
    <text x="66" y="218">(3, 4) 值 2</text><text x="300" y="218">12</text><text x="400" y="218" fill="#2d5a22">12 % 2 == 0 ✓</text>
  </g>

  <!-- misses note -->
  <g filter="url(#rough2)">
    <rect x="50" y="246" width="460" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#8c3a36">
    <text x="280" y="270" text-anchor="middle" font-weight="bold">被排除的同值对（值相等但乘积不整除）：</text>
    <text x="280" y="292" text-anchor="middle">(1, 5) 值 1：1×5 = 5，5 % 2 = 1 ✗</text>
    <text x="280" y="312" text-anchor="middle">注意 i=0 时 i×j = 0，0 能被任何 k 整除</text>
  </g>
</svg>
