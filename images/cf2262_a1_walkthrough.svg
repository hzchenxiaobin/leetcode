<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 486" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="486" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 6，a = [0, 3, 2, 2, 2, 1]</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个 k 只禁止一段区间；剪到 [0, n−1] 后只有 k = 1 真正禁掉了元素</text>

  <rect x="46" y="70" width="568" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="92" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="150" y="92" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">a_k</text>
  <text x="330" y="92" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">禁用区间 [a_k·k, a_k·k + k − 1]</text>
  <text x="540" y="92" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">与 [0,5] 相交</text>
  <rect x="46" y="104" width="568" height="32" fill="#ffffff" stroke="#d8dde4" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="125" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="150" y="125" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">0</text>
  <text x="330" y="125" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[0, 0]</text>
  <text x="540" y="125" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">{0}</text>
  <rect x="46" y="138" width="568" height="32" fill="#f2f4f7" stroke="#d8dde4" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="159" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">2</text>
  <text x="150" y="159" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="330" y="159" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[6, 7]</text>
  <text x="540" y="159" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">空（6 &gt; n−1）</text>
  <rect x="46" y="172" width="568" height="32" fill="#ffffff" stroke="#d8dde4" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="193" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">3</text>
  <text x="150" y="193" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="330" y="193" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[6, 8]</text>
  <text x="540" y="193" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">空</text>
  <rect x="46" y="206" width="568" height="32" fill="#f2f4f7" stroke="#d8dde4" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="227" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">4</text>
  <text x="150" y="227" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="330" y="227" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[8, 11]</text>
  <text x="540" y="227" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">空</text>
  <rect x="46" y="240" width="568" height="32" fill="#ffffff" stroke="#d8dde4" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="261" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">5</text>
  <text x="150" y="261" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="330" y="261" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[10, 14]</text>
  <text x="540" y="261" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">空</text>
  <rect x="46" y="274" width="568" height="32" fill="#f2f4f7" stroke="#d8dde4" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="295" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">6</text>
  <text x="150" y="295" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="330" y="295" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[6, 11]</text>
  <text x="540" y="295" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">空</text>
  <text x="330" y="330" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">区间并集 = {0}  ⇒  B = {1, 2, 3, 4, 5}</text>

  <rect x="46" y="346" width="568" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="62" y="368" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">回代验证（⌊y/k⌋ 的取值集合 → mex）：</text>
  <text x="62" y="388" font-size="10.5" fill="#555" filter="url(#rough2)">k=1: {1,2,3,4,5} → 0 ✓   k=2: {0,1,2} → 3 ✓   k=3: {0,1} → 2 ✓</text>
  <text x="62" y="404" font-size="10.5" fill="#555" filter="url(#rough2)">k=4: {0,1} → 2 ✓   k=5: {0,1} → 2 ✓   k=6: {0} → 1 ✓</text>

  <rect x="46" y="422" width="568" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="62" y="442" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">注意 a_1 = 0：k=1 的禁用区间就是单点 [a_1, a_1] = [0,0]，它正是「mex(B) = a_1」</text>
  <text x="62" y="460" font-size="10.5" fill="#555" filter="url(#rough2)">的直接体现 —— 0 ∉ B 且 1..a_1−1 ∈ B 在这里退化为「0 不能进 B」</text>
</svg>
