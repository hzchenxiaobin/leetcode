<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="344" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查样例 3：a = [2, 7, 1]，算得 p = 2 − 7 + 1 = −4</text>
  <path d="M 110 42 Q 380 49 650 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 四个箭头上的反射点标签 -->
  <text x="155" y="78" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">关于 p = −4</text>
  <text x="305" y="78" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">关于 a₁ = 2</text>
  <text x="455" y="78" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">关于 a₂ = 7</text>
  <text x="605" y="78" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">关于 a₃ = 1</text>

  <!-- 箭头 -->
  <path d="M 118 112 L 190 112" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 268 112 L 340 112" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 418 112 L 490 112" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 568 112 L 640 112" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 节点 -->
  <rect x="44" y="126" width="72" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="80" y="153" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="80" y="186" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">起点</text>

  <rect x="194" y="126" width="72" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="230" y="153" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">−8</text>

  <rect x="344" y="126" width="72" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="153" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">12</text>

  <rect x="494" y="126" width="72" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="530" y="153" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>

  <rect x="644" y="126" width="72" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="680" y="153" text-anchor="middle" font-size="17" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="680" y="186" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">终点</text>

  <!-- 每次更新的算式 -->
  <text x="155" y="212" text-anchor="middle" font-size="11.5" fill="#6f6f6f" filter="url(#rough2)">2·(−4) − 0 = −8</text>
  <text x="305" y="212" text-anchor="middle" font-size="11.5" fill="#6f6f6f" filter="url(#rough2)">2·2 − (−8) = 12</text>
  <text x="455" y="212" text-anchor="middle" font-size="11.5" fill="#6f6f6f" filter="url(#rough2)">2·7 − 12 = 2</text>
  <text x="605" y="212" text-anchor="middle" font-size="11.5" fill="#6f6f6f" filter="url(#rough2)">2·1 − 2 = 0</text>

  <!-- 说明框 -->
  <rect x="46" y="230" width="668" height="46" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="258" font-size="12.5" fill="#a14340" filter="url(#rough2)">无论 p 取什么，四次反射的复合都是「斜率 +1 的平移」：终值 = 2(a₃ − a₂ + a₁) + (−1)³·2p = −8 − 2p。</text>

  <rect x="46" y="286" width="668" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="313" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">令 −8 − 2p = 0 解得 p = −4 ✔，与公式 a₁ − a₂ + a₃ = 2 − 7 + 1 = −4 完全一致。</text>
</svg>
