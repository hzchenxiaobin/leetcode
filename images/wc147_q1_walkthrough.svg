<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="344" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：从 T(0..2) 滚到 T(8)</text>
  <text x="280" y="43" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">表格里 a、b、c 是「进入本轮时」三个变量的值，d 为本轮新算出的 T(i)</text>

  <!-- 表头 -->
  <rect x="40" y="58" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="79" text-anchor="middle" font-size="11" fill="#30436b" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="100" y="58" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="79" text-anchor="middle" font-size="11" fill="#30436b" font-weight="bold" filter="url(#rough2)">a = T(i−3)</text>
  <rect x="210" y="58" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="265" y="79" text-anchor="middle" font-size="11" fill="#30436b" font-weight="bold" filter="url(#rough2)">b = T(i−2)</text>
  <rect x="320" y="58" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="375" y="79" text-anchor="middle" font-size="11" fill="#30436b" font-weight="bold" filter="url(#rough2)">c = T(i−1)</text>
  <rect x="430" y="58" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="475" y="79" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">d = T(i)</text>

  <!-- 数据行 -->
  <rect x="40" y="90" width="60" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="100" y="90" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="210" y="90" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="320" y="90" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="430" y="90" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="110" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">0+1+1 = 2</text>

  <rect x="40" y="120" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="70" y="140" text-anchor="middle" font-size="11" fill="#2f5228" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="100" y="120" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="210" y="120" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="265" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="320" y="120" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="430" y="120" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="475" y="140" text-anchor="middle" font-size="11" fill="#2f5228" font-weight="bold" filter="url(#rough2)">1+1+2 = 4</text>

  <rect x="40" y="150" width="60" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="100" y="150" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="210" y="150" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="320" y="150" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="430" y="150" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="170" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1+2+4 = 7</text>

  <rect x="40" y="180" width="60" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="100" y="180" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="210" y="180" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="320" y="180" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="430" y="180" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="200" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">2+4+7 = 13</text>

  <rect x="40" y="210" width="60" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="100" y="210" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="210" y="210" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="320" y="210" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13</text>
  <rect x="430" y="210" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="230" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">4+7+13 = 24</text>

  <rect x="40" y="240" width="60" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="100" y="240" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="210" y="240" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13</text>
  <rect x="320" y="240" width="110" height="30" fill="#fff" stroke="#c9ced6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">24</text>
  <rect x="430" y="240" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="260" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">7+13+24 = 44</text>

  <rect x="40" y="286" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#30436b" filter="url(#rough2)">绿色行是示例 n = 4 的答案：i = 4 时 a=1, b=1, c=2，得 d = 4，与官方输出一致。</text>
  <text x="280" y="321" text-anchor="middle" font-size="10.5" fill="#30436b" filter="url(#rough2)">拿到 n = 25 时同样滚 22 轮，最终 T(25) = 1389537。</text>
</svg>
