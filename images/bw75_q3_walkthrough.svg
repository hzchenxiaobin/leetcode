<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "001101" 的计数器全程</text>

  <!-- 表格 -->
  <g filter="url(#rough2)">
    <rect x="90" y="48" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="340" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="400" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#33507a" text-anchor="middle" font-weight="bold">
    <text x="125" y="68">读入字符</text><text x="190" y="68">c0</text><text x="250" y="68">c1</text>
    <text x="310" y="68">c01</text><text x="370" y="68">c10</text><text x="430" y="68">c010+c101</text>
  </g>

  <!-- 行数据：初始 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="82" width="70" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="160" y="82" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="82" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="280" y="82" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="340" y="82" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="82" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="125" y="101">初始</text><text x="190" y="101">0</text><text x="250" y="101">0</text>
    <text x="310" y="101">0</text><text x="370" y="101">0</text><text x="430" y="101">0</text>
  </g>

  <!-- 逐行：字符 0,0,1,1,0,1 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="114" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="160" y="114" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="114" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="280" y="114" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="340" y="114" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="114" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="125" y="133">'0'</text><text x="190" y="133" fill="#2d5a22" font-weight="bold">1</text><text x="250" y="133">0</text>
    <text x="310" y="133">0</text><text x="370" y="133">0</text><text x="430" y="133">0</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="146" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="160" y="146" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="146" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="280" y="146" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="340" y="146" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="146" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="125" y="165">'0'</text><text x="190" y="165" fill="#2d5a22" font-weight="bold">2</text><text x="250" y="165">0</text>
    <text x="310" y="165">0</text><text x="370" y="165">0</text><text x="430" y="165">0</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="178" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="160" y="178" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="178" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="280" y="178" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="340" y="178" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="178" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="125" y="197">'1'</text><text x="190" y="197">2</text><text x="250" y="197" fill="#7a5c1e" font-weight="bold">1</text>
    <text x="310" y="197" fill="#7a5c1e" font-weight="bold">2</text><text x="370" y="197">0</text><text x="430" y="197">0</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="210" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="160" y="210" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="210" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="280" y="210" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="340" y="210" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="210" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="125" y="229">'1'</text><text x="190" y="229">2</text><text x="250" y="229" fill="#7a5c1e" font-weight="bold">2</text>
    <text x="310" y="229" fill="#7a5c1e" font-weight="bold">4</text><text x="370" y="229" fill="#7a5c1e" font-weight="bold">2</text><text x="430" y="229">0</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="242" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="160" y="242" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="242" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="280" y="242" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="340" y="242" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="242" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="125" y="261">'0'</text><text x="190" y="261" fill="#2d5a22" font-weight="bold">3</text><text x="250" y="261">2</text>
    <text x="310" y="261">4</text><text x="370" y="261" fill="#2d5a22" font-weight="bold">6</text><text x="430" y="261" fill="#2d5a22" font-weight="bold">4</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="274" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="160" y="274" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="274" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="280" y="274" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="340" y="274" width="60" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="274" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="125" y="293">'1'</text><text x="190" y="293">3</text><text x="250" y="293" fill="#7a5c1e" font-weight="bold">3</text>
    <text x="310" y="293" fill="#7a5c1e" font-weight="bold">7</text><text x="370" y="293">6</text><text x="430" y="293" fill="#b85450" font-weight="bold">6</text>
  </g>

  <!-- 结论 -->
  <rect x="90" y="318" width="370" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="275" y="345" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">最终 c010 + c101 = 4 + 2 = 6 ✓（与官方示例一致）</text>
</svg>
