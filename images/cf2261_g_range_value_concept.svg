<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单区间：从高位往下找第一个「b 为 0、S 为 1」的位</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">更高的位被锁死（任何操作改不动），t 位及其下方可以全部清成 0</text>

  <!-- t tag -->
  <rect x="336" y="66" width="52" height="20" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="362" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">t = 1</text>

  <!-- row labels -->
  <text x="148" y="112" text-anchor="end" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">b 的位</text>
  <text x="148" y="164" text-anchor="end" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">S 的位</text>
  <text x="148" y="236" text-anchor="end" font-size="13" font-weight="bold" fill="#8a4a44" filter="url(#rough2)">结果 f</text>

  <!-- b row: 1 0 1 1 0 0 -->
  <rect x="160" y="90" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="208" y="90" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="256" y="90" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="90" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="352" y="90" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="400" y="90" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="180" y="113" fill="#33517a" filter="url(#rough2)">1</text>
    <text x="228" y="113" fill="#33517a" filter="url(#rough2)">0</text>
    <text x="276" y="113" fill="#33517a" filter="url(#rough2)">1</text>
    <text x="324" y="113" fill="#33517a" filter="url(#rough2)">1</text>
    <text x="372" y="113" fill="#b85450" filter="url(#rough2)">0</text>
    <text x="420" y="113" fill="#33517a" filter="url(#rough2)">0</text>
  </g>

  <!-- S row: 1 0 1 0 1 1 -->
  <rect x="160" y="142" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="208" y="142" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="256" y="142" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="142" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="352" y="142" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="400" y="142" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="180" y="165" fill="#2e6e2e" filter="url(#rough2)">1</text>
    <text x="228" y="165" fill="#2e6e2e" filter="url(#rough2)">0</text>
    <text x="276" y="165" fill="#2e6e2e" filter="url(#rough2)">1</text>
    <text x="324" y="165" fill="#2e6e2e" filter="url(#rough2)">0</text>
    <text x="372" y="165" fill="#b85450" filter="url(#rough2)">1</text>
    <text x="420" y="165" fill="#2e6e2e" filter="url(#rough2)">1</text>
  </g>

  <!-- bit index -->
  <g font-size="10.5" text-anchor="middle" fill="#999">
    <text x="180" y="134" filter="url(#rough2)">5</text>
    <text x="228" y="134" filter="url(#rough2)">4</text>
    <text x="276" y="134" filter="url(#rough2)">3</text>
    <text x="324" y="134" filter="url(#rough2)">2</text>
    <text x="372" y="134" filter="url(#rough2)">1</text>
    <text x="420" y="134" filter="url(#rough2)">0</text>
  </g>

  <!-- arrow to result -->
  <path d="M360,180 L360,206" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- f row: 1 0 1 0 0 0 -->
  <rect x="160" y="212" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="208" y="212" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="256" y="212" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="304" y="212" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="352" y="212" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <rect x="400" y="212" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="180" y="235" fill="#a0761e" filter="url(#rough2)">1</text>
    <text x="228" y="235" fill="#a0761e" filter="url(#rough2)">0</text>
    <text x="276" y="235" fill="#a0761e" filter="url(#rough2)">1</text>
    <text x="324" y="235" fill="#a0761e" filter="url(#rough2)">0</text>
    <text x="372" y="235" fill="#bbb" filter="url(#rough2)">0</text>
    <text x="420" y="235" fill="#bbb" filter="url(#rough2)">0</text>
  </g>
  <text x="466" y="234" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a4a44" filter="url(#rough2)">= 40</text>

  <!-- explanation -->
  <rect x="56" y="266" width="568" height="146" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="290" text-anchor="start" font-size="12.5" fill="#33517a" filter="url(#rough2)">① 高于 t 的位：任何一次操作都改不动，结果继续沿用 S 的取值。</text>
  <text x="76" y="312" text-anchor="start" font-size="12.5" fill="#b85450" filter="url(#rough2)">② 到了 t：b 该位是 0、S 该位是 1，于是把 c 的这一位设成 1（保证 c 大于 b），</text>
  <text x="90" y="332" text-anchor="start" font-size="12.5" fill="#b85450" filter="url(#rough2)">更低的位让 c 与 u = S 异或 b 对齐，异或结果全部变成 0。</text>
  <text x="76" y="356" text-anchor="start" font-size="12.5" fill="#2e6e2e" filter="url(#rough2)">③ 对所有下标 i 取最优，t 就变成「S 该位为 1 且 AND 该位为 0」的最高位。</text>
  <text x="76" y="380" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">④ 若这样的位不存在，则一个 bit 也清不掉，f 就是整个 S。</text>
  <text x="76" y="402" text-anchor="start" font-size="12" font-weight="bold" fill="#8a4a44" filter="url(#rough2)">一句话：f = S 抹掉「不高于 t 的所有位」，t = MSB(S 与 (非 AND) 的按位与)。</text>
</svg>
