<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444" filter="url(#rough2)">把「难度 → 收益」折叠成「能力上限 → 最高收益」</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">难度高不等于收益高：一个工人要的是他能做的所有工作里的最大值</text>

  <rect x="22" y="64" width="238" height="256" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="141" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">① 按难度升序排序</text>

  <rect x="40" y="98" width="202" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="141" y="118" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">难度 2 → 收益 10</text>

  <rect x="40" y="134" width="202" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="141" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">难度 4 → 收益 20</text>

  <rect x="40" y="170" width="202" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="141" y="190" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">难度 6 → 收益 30</text>

  <rect x="40" y="206" width="202" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="141" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">难度 8 → 收益 40</text>

  <rect x="40" y="242" width="202" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="141" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">难度 10 → 收益 50</text>

  <text x="141" y="294" text-anchor="middle" font-size="9.5" fill="#7a8aa0" filter="url(#rough2)">若收益不单调，低的会被高的覆盖</text>
  <text x="141" y="310" text-anchor="middle" font-size="9.5" fill="#7a8aa0" filter="url(#rough2)">例如 (6, 20) 被 (4, 30) 压平</text>

  <path d="M 266 192 L 292 192" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="64" width="238" height="256" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="419" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">② 前缀最大收益 best</text>

  <rect x="316" y="98" width="206" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="419" y="118" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">能力 2 ~ 3 → 10</text>

  <rect x="316" y="134" width="206" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="419" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">能力 4 ~ 5 → 20</text>

  <rect x="316" y="170" width="206" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="419" y="190" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">能力 6 ~ 7 → 30</text>

  <rect x="316" y="206" width="206" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="419" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">能力 8 ~ 9 → 40</text>

  <rect x="316" y="242" width="206" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="419" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">能力 ≥ 10 → 50</text>

  <text x="419" y="294" text-anchor="middle" font-size="9.5" fill="#5a7a50" filter="url(#rough2)">台阶只升不降</text>
  <text x="419" y="310" text-anchor="middle" font-size="9.5" fill="#5a7a50" filter="url(#rough2)">能力落在平台上就不再涨</text>

  <rect x="22" y="336" width="516" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="357" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">工人只需在这张台阶表上查一次：二分 O(log n)，或排序后双指针均摊 O(1)</text>
  <text x="42" y="375" font-size="10.5" fill="#555" filter="url(#rough2)">不必为每个工人重扫全部工作，这正是 O(n·m) 降到 O((n+m) log(n+m)) 的关键</text>
</svg>
