<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">拼接 = 左移腾位 + 按位或</text>
  <path d="M 200 42 Q 340 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="190" y="68" text-anchor="middle" font-size="12" fill="#666">以 (2, 8) 为例：2 = "10"，8 = "1000"，L₈ = 4</text>

  <!-- Row 1: v = 2 -->
  <text x="60" y="110" font-size="12" fill="#3a6a2a" font-weight="bold">v = 2</text>
  <g filter="url(#sk)">
    <rect x="150" y="92" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="178" y="92" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="164" y="111" text-anchor="middle" font-size="13" fill="#3a6a2a" font-family="monospace">1</text>
  <text x="192" y="111" text-anchor="middle" font-size="13" fill="#3a6a2a" font-family="monospace">0</text>

  <!-- shift annotation -->
  <g filter="url(#sk)">
    <path d="M 250 106 Q 290 106 320 106" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="285" y="98" text-anchor="middle" font-size="11" fill="#666">v &lt;&lt; 4</text>

  <!-- Row 2: v << 4 -->
  <text x="60" y="160" font-size="12" fill="#2b4e6e" font-weight="bold">v &lt;&lt; 4</text>
  <g filter="url(#sk)">
    <rect x="150" y="142" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="178" y="142" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="206" y="142" width="28" height="28" rx="4" fill="#f4f8ff" stroke="#8899bb" stroke-width="1.2" stroke-dasharray="4 2"/>
    <rect x="234" y="142" width="28" height="28" rx="4" fill="#f4f8ff" stroke="#8899bb" stroke-width="1.2" stroke-dasharray="4 2"/>
    <rect x="262" y="142" width="28" height="28" rx="4" fill="#f4f8ff" stroke="#8899bb" stroke-width="1.2" stroke-dasharray="4 2"/>
    <rect x="290" y="142" width="28" height="28" rx="4" fill="#f4f8ff" stroke="#8899bb" stroke-width="1.2" stroke-dasharray="4 2"/>
  </g>
  <text x="164" y="161" text-anchor="middle" font-size="13" fill="#2b4e6e" font-family="monospace">1</text>
  <text x="192" y="161" text-anchor="middle" font-size="13" fill="#2b4e6e" font-family="monospace">0</text>
  <text x="248" y="136" text-anchor="middle" font-size="10" fill="#8899bb">腾出 4 个低位 0</text>
  <g filter="url(#sk)">
    <path d="M 206 128 Q 250 120 294 128" stroke="#8899bb" stroke-width="1" fill="none" stroke-dasharray="3 2"/>
  </g>

  <!-- OR annotation -->
  <g filter="url(#sk)">
    <path d="M 440 106 Q 470 106 495 106" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="466" y="98" text-anchor="middle" font-size="11" fill="#666">| 8</text>

  <!-- Row 3: result 40 = 101000 -->
  <text x="60" y="212" font-size="12" fill="#8a6a1a" font-weight="bold">结果 40</text>
  <g filter="url(#sk)">
    <rect x="150" y="192" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="178" y="192" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="206" y="192" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="234" y="192" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="262" y="192" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="290" y="192" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="164" y="211" text-anchor="middle" font-size="13" fill="#8a6a1a" font-family="monospace">1</text>
  <text x="192" y="211" text-anchor="middle" font-size="13" fill="#8a6a1a" font-family="monospace">0</text>
  <text x="220" y="211" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold" font-family="monospace">1</text>
  <text x="248" y="211" text-anchor="middle" font-size="13" fill="#8a6a1a" font-family="monospace">0</text>
  <text x="276" y="211" text-anchor="middle" font-size="13" fill="#8a6a1a" font-family="monospace">0</text>
  <text x="304" y="211" text-anchor="middle" font-size="13" fill="#8a6a1a" font-family="monospace">0</text>
  <g filter="url(#sk)">
    <path d="M 206 230 Q 250 238 294 230" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 2"/>
  </g>
  <text x="250" y="248" text-anchor="middle" font-size="10" fill="#b03a3a">红色 1 正是 8 落进的低位</text>

  <!-- Formula box -->
  <g filter="url(#sk)">
    <rect x="60" y="268" width="560" height="64" rx="10" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4e6e" font-family="monospace">V(a,b,c) = ((a &lt;&lt; L_b) | b) &lt;&lt; L_c | c</text>
  <text x="340" y="318" text-anchor="middle" font-size="11" fill="#555">低 L 位全 0 → 与后续数无重叠 1 位 → 或 = 加，无进位</text>

  <!-- Full example strip -->
  <g filter="url(#sk)">
    <rect x="60" y="348" width="560" height="54" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="340" y="372" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">完整走一遍 [2, 8, 16]：</text>
  <text x="340" y="392" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">2 → (2&lt;&lt;4)|8 = 40 → (40&lt;&lt;5)|16 = 1296 ✓</text>
</svg>
