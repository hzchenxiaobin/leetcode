<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例走查：nums = [1, 2, 3, 4]，答案 3</text>

  <text x="60" y="82" font-size="12" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="82" y="58" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="192" y="58" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="82" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="302" y="58" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="82" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="412" y="58" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="82" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>

  <text x="110" y="116" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">r = 1</text>
  <text x="220" y="116" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">r = 2</text>
  <text x="330" y="116" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">r = 0</text>
  <text x="440" y="116" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">r = 1</text>

  <path d="M 110 122 L 110 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 220 122 L 220 150" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 330 122 L 330 150" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 440 122 L 440 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="116" y="142" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="226" y="142" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="336" y="142" font-size="11" fill="#4a7a3a" filter="url(#rough2)">不动</text>
  <text x="446" y="142" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>

  <rect x="82" y="154" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="177" text-anchor="middle" font-size="15" fill="#2f5527" filter="url(#rough2)">0</text>
  <rect x="192" y="154" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="177" text-anchor="middle" font-size="15" fill="#2f5527" filter="url(#rough2)">3</text>
  <rect x="302" y="154" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="177" text-anchor="middle" font-size="15" fill="#2f5527" filter="url(#rough2)">3</text>
  <rect x="412" y="154" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="177" text-anchor="middle" font-size="15" fill="#2f5527" filter="url(#rough2)">3</text>

  <text x="110" y="212" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 次</text>
  <text x="220" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1 次</text>
  <text x="330" y="212" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0 次</text>
  <text x="440" y="212" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 次</text>

  <rect x="110" y="234" width="300" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="16" fill="#8c3a36" filter="url(#rough2)">1 + 1 + 0 + 1 = 3</text>

  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">已验证整除的元素不必再动：动它反而多花操作</text>
</svg>
