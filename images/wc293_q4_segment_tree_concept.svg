<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">核心观察：值域 10⁹ 太大 ⇒ 节点按需创建</text>
  <text x="260" y="50" text-anchor="middle" font-size="12"
        fill="#888" filter="url(#rough2)">并集染色只增不清 ⇒ 懒标记永久化，无需 pushdown</text>

  <text x="132" y="76" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">满建线段树 ✗</text>
  <text x="387" y="76" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">动态开点 ✓</text>

  <rect x="118" y="86" width="26" height="20" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 131 106 Q 96 116 62 124" stroke="#999" stroke-width="1.2" fill="none"
        stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 131 106 Q 120 116 110 124" stroke="#999" stroke-width="1.2" fill="none"
        stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 131 106 Q 152 116 160 124" stroke="#999" stroke-width="1.2" fill="none"
        stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 131 106 Q 178 116 208 124" stroke="#999" stroke-width="1.2" fill="none"
        stroke-dasharray="3 3" filter="url(#rough2)"/>

  <rect x="52" y="124" width="20" height="16" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="100" y="124" width="20" height="16" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="148" y="124" width="20" height="16" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="196" y="124" width="20" height="16" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <path d="M 62 140 Q 50 152 44 160" stroke="#bbb" stroke-width="1" fill="none"
        stroke-dasharray="2 2" filter="url(#rough2)"/>
  <path d="M 110 140 Q 98 152 92 160" stroke="#bbb" stroke-width="1" fill="none"
        stroke-dasharray="2 2" filter="url(#rough2)"/>
  <path d="M 158 140 Q 168 152 172 160" stroke="#bbb" stroke-width="1" fill="none"
        stroke-dasharray="2 2" filter="url(#rough2)"/>
  <path d="M 206 140 Q 212 152 218 160" stroke="#bbb" stroke-width="1" fill="none"
        stroke-dasharray="2 2" filter="url(#rough2)"/>

  <rect x="37" y="160" width="14" height="11" rx="2" fill="#f0f0f0"
        stroke="#999" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="65" y="160" width="14" height="11" rx="2" fill="#f0f0f0"
        stroke="#999" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="93" y="160" width="14" height="11" rx="2" fill="#f0f0f0"
        stroke="#999" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="121" y="160" width="14" height="11" rx="2" fill="#f0f0f0"
        stroke="#999" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="149" y="160" width="14" height="11" rx="2" fill="#f0f0f0"
        stroke="#999" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="177" y="160" width="14" height="11" rx="2" fill="#f0f0f0"
        stroke="#999" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="205" y="160" width="14" height="11" rx="2" fill="#f0f0f0"
        stroke="#999" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="233" y="160" width="14" height="11" rx="2" fill="#f0f0f0"
        stroke="#999" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <text x="132" y="188" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">⋮ 30 层，全部要建 ⋮</text>

  <rect x="28" y="202" width="208" height="50" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="222" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">值域 [1, 10⁹] 满建 ≈ 4·2³⁰</text>
  <text x="132" y="241" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">≈ 43 亿节点，内存爆炸 ✗</text>

  <rect x="373" y="86" width="26" height="20" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 386 106 Q 356 116 326 124" stroke="#4a7a3a" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 386 106 Q 428 116 452 124" stroke="#999" stroke-width="1.2" fill="none"
        stroke-dasharray="3 3" filter="url(#rough2)"/>

  <rect x="315" y="124" width="20" height="16" rx="3" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="443" y="124" width="20" height="16" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <path d="M 325 140 Q 308 152 296 160" stroke="#4a7a3a" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 325 140 Q 336 152 342 160" stroke="#d6a040" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>

  <rect x="286" y="160" width="17" height="13" rx="2" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="336" y="160" width="16" height="13" rx="2" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>

  <path d="M 294 173 Q 284 184 278 192" stroke="#4a7a3a" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <rect x="270" y="192" width="15" height="12" rx="2" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <path d="M 344 173 Q 350 184 354 192" stroke="#d6a040" stroke-width="2"
        fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="200" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">整段命中：full = true</text>
  <text x="382" y="214" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">covered = 段长，直接返回</text>

  <text x="300" y="236" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">实线 = 递归经过才创建</text>
  <text x="460" y="236" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">虚灰 = 永不占内存</text>

  <rect x="285" y="244" width="218" height="40" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="394" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">只建被 add 触碰的路径</text>
  <text x="394" y="278" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">节点数 O(Q·log V)，实测仅数十万 ✓</text>

  <rect x="50" y="300" width="420" height="42" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">节点仅 2 个字段：covered（本段已覆盖数，实时 pushup 累加）</text>
  <text x="260" y="335" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">full（整段标记，只 false→true）⇒ count() = 根.covered，O(1)</text>

  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">V = 10⁹，⌈log₂V⌉ = 30 —— 每次 add 至多走 2 条边界路径</text>
</svg>
