<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="640" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">交叉对偶：「能否从 S 走到 E」⟺「圆墙是否把 左上弧 与 右下弧 接通」</text>
  <path d="M 120 42 Q 380 52 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ============ Panel A: reachable ============ -->
  <text x="190" y="76" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 可达：圆是「孤岛」，不成墙</text>

  <!-- rectangle -->
  <g filter="url(#rough2)">
    <line x1="40" y1="110" x2="320" y2="110" stroke="#d6a040" stroke-width="4"/>
    <line x1="40" y1="110" x2="40" y2="390" stroke="#d6a040" stroke-width="4"/>
    <line x1="40" y1="390" x2="320" y2="390" stroke="#446688" stroke-width="4"/>
    <line x1="320" y1="110" x2="320" y2="390" stroke="#446688" stroke-width="4"/>
    <rect x="40" y="110" width="280" height="280" fill="none" stroke="#999999" stroke-width="1"/>
  </g>
  <text x="52" y="102" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">W_A（左边+上边）</text>
  <text x="196" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">W_B（下边+右边）</text>

  <!-- floating circles -->
  <g filter="url(#rough2)">
    <circle cx="150" cy="220" r="48" fill="#e8f0fe" fill-opacity="0.8" stroke="#446688" stroke-width="1.6"/>
    <circle cx="245" cy="300" r="40" fill="#e8f0fe" fill-opacity="0.8" stroke="#446688" stroke-width="1.6"/>
    <circle cx="230" cy="160" r="36" fill="#e8f0fe" fill-opacity="0.8" stroke="#446688" stroke-width="1.6"/>
  </g>

  <!-- free path S -> E -->
  <path d="M 40 390 C 90 340, 118 306, 150 302 C 190 297, 208 268, 230 250 C 258 226, 282 160, 320 110"
        stroke="#4a7a3a" stroke-width="2.6" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>

  <!-- S / E dots -->
  <circle cx="40" cy="390" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="30" y="384" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">S=(0,0)</text>
  <circle cx="320" cy="110" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="316" y="96" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">E=(X,Y)</text>

  <text x="190" y="446" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">圆既不贴墙、彼此也不相接，</text>
  <text x="190" y="466" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">虚线绕开「孤岛」即可到达 ⇒ 返回 true</text>

  <!-- ============ Panel B: blocked ============ -->
  <text x="570" y="76" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">② 不可达：圆连成一堵「墙」</text>

  <g filter="url(#rough2)">
    <line x1="420" y1="110" x2="700" y2="110" stroke="#d6a040" stroke-width="4"/>
    <line x1="420" y1="110" x2="420" y2="390" stroke="#d6a040" stroke-width="4"/>
    <line x1="420" y1="390" x2="700" y2="390" stroke="#446688" stroke-width="4"/>
    <line x1="700" y1="110" x2="700" y2="390" stroke="#446688" stroke-width="4"/>
    <rect x="420" y="110" width="280" height="280" fill="none" stroke="#999999" stroke-width="1"/>
  </g>
  <text x="432" y="102" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">W_A</text>
  <text x="576" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">W_B</text>

  <!-- barrier chain circles -->
  <g filter="url(#rough2)">
    <circle cx="452" cy="185" r="55" fill="#fce4ec" fill-opacity="0.75" stroke="#b85450" stroke-width="2"/>
    <circle cx="540" cy="250" r="62" fill="#fce4ec" fill-opacity="0.75" stroke="#b85450" stroke-width="2"/>
    <circle cx="612" cy="338" r="55" fill="#fce4ec" fill-opacity="0.75" stroke="#b85450" stroke-width="2"/>
  </g>
  <!-- barrier continuum -->
  <path d="M 420 185 L 452 185 L 496 218 L 540 250 L 576 294 L 612 338 L 612 390"
        stroke="#b85450" stroke-width="3" stroke-dasharray="8 4" fill="none" filter="url(#rough2)"/>
  <text x="466" y="152" font-size="11.5" fill="#7a2828" filter="url(#rough2)">贴左墙</text>
  <text x="630" y="372" font-size="11.5" fill="#7a2828" filter="url(#rough2)">贴下墙</text>

  <!-- failed attempts -->
  <path d="M 420 390 C 470 340, 500 330, 540 300" stroke="#888888" stroke-width="1.6" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="522" y="300" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <path d="M 420 390 C 460 370, 482 332, 500 292" stroke="#888888" stroke-width="1.6" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="492" y="306" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <circle cx="420" cy="390" r="6" fill="#7a2828" filter="url(#rough2)"/>
  <text x="410" y="384" font-size="13" font-weight="bold" fill="#7a2828" filter="url(#rough2)">S</text>
  <circle cx="700" cy="110" r="6" fill="#7a2828" filter="url(#rough2)"/>
  <text x="696" y="96" font-size="13" font-weight="bold" fill="#7a2828" filter="url(#rough2)">E</text>

  <text x="570" y="446" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">首圆贴左墙、末圆贴下墙、中间彼此相接，</text>
  <text x="570" y="466" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">W_A 与 W_B 被焊死 ⇒ 任何 S→E 曲线必撞墙，返回 false</text>

  <!-- ============ takeaway ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="496" width="700" height="118" rx="10" fill="#fffdf3" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="380" y="522" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">交叉引理（若尔当曲线定理的推论）</text>
  <text x="380" y="548" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">矩形内，一条 S→E 的连续曲线 与 一条 W_A→W_B 的连续曲线（障碍链）必然相交；</text>
  <text x="380" y="570" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">加上「路径不得触碰矩形边界（除 S、E）与任何圆（含边界）」，二者恰居其一。</text>
  <text x="380" y="596" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">于是「找路径」这个连续问题，被转化为「判连通」这个离散问题——并查集登场</text>
</svg>
