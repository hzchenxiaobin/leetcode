<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>

  <text x="350" y="36" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">n 个点 n 条边 ⇒ 恰好一个环：环上「最后加入」的边就是答案</text>
  <text x="350" y="60" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">删掉环上任意一条边都能得到树，题目要求返回输入中最靠后的那条</text>

  <!-- 环的三条边（橙色） -->
  <line x1="250" y1="150" x2="140" y2="250" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="140" y1="250" x2="250" y2="330" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="250" y1="330" x2="360" y2="250" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>

  <!-- 冗余边 ④：1-4（红色加粗） -->
  <line x1="250" y1="150" x2="360" y2="250" stroke="#b85450" stroke-width="3.4" filter="url(#rough2)"/>

  <!-- 树上的枝 ⑤：1-5（绿色） -->
  <line x1="250" y1="150" x2="430" y2="150" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="250" cy="150" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="156" text-anchor="middle" font-size="15" fill="#334" filter="url(#rough2)">1</text>

  <circle cx="140" cy="250" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="256" text-anchor="middle" font-size="15" fill="#334" filter="url(#rough2)">2</text>

  <circle cx="250" cy="330" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="336" text-anchor="middle" font-size="15" fill="#334" filter="url(#rough2)">3</text>

  <circle cx="360" cy="250" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="256" text-anchor="middle" font-size="15" fill="#334" filter="url(#rough2)">4</text>

  <circle cx="430" cy="150" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="156" text-anchor="middle" font-size="15" fill="#334" filter="url(#rough2)">5</text>

  <!-- 边的顺序标注 -->
  <text x="183" y="192" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">① [1,2]</text>
  <text x="150" y="305" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">② [2,3]</text>
  <text x="300" y="308" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">③ [3,4]</text>
  <text x="262" y="200" font-size="12.5" fill="#b85450" filter="url(#rough2)">④ [1,4] 冗余</text>
  <text x="330" y="140" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">⑤ [1,5]</text>

  <!-- 说明框 -->
  <rect x="440" y="236" width="236" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="456" y="260" font-size="12.5" fill="#6b5316" filter="url(#rough2)">橙线 = 唯一的环 1-2-3-4-1</text>
  <text x="456" y="284" font-size="12.5" fill="#6b5316" filter="url(#rough2)">④ 是环上输入最靠后的一条</text>
  <text x="456" y="308" font-size="12.5" fill="#6b5316" filter="url(#rough2)">⑤ 挂在环外，删它图就不连通</text>
  <text x="456" y="332" font-size="12.5" fill="#b85450" filter="url(#rough2)">答案 = [1,4]</text>
</svg>
