<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="940" height="430" fill="#fafafa"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">示例演算：4×4 矩阵的 4 个沙漏</text>
  <path d="M 280 44 Q 470 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>
  <text x="470" y="70" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk2)">grid = [[6,2,1,3],[4,2,1,5],[9,2,8,7],[4,1,2,9]]，左上角 (i,j) 共 2×2 = 4 个</text>

