    <rect x="820" y="120" width="40" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="860" y="120" width="40" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="740" y="150" width="40" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
