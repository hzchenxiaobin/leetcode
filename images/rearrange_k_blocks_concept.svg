<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">核心观察：切法唯一，重排的原子是「块」</text>

  <!-- s row -->
  <text x="86" y="104" text-anchor="end" font-size="14" fill="#888" filter="url(#rough2)">s =</text>
  <rect x="100" y="78" width="72" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="78" width="72" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="78" width="72" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">aa</text>
  <text x="216" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">bb</text>
  <text x="296" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">cc</text>

  <text x="425" y="98" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">k = 3</text>
  <text x="425" y="114" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">m = n/k = 2</text>

  <!-- cut positions -->
  <path d="M 100 122 L 100 130" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 172 122 L 172 130" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 244 122 L 244 130" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 316 122 L 316 130" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="144" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="172" y="144" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m</text>
  <text x="244" y="144" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2m</text>
  <text x="316" y="144" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n</text>

  <!-- permutation arrows -->
  <path d="M 136 128 C 136 162, 216 158, 216 192" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 216 128 C 216 162, 136 158, 136 192" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 296 128 C 296 162, 296 158, 296 192" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="432" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">重排 = 调整块顺序</text>
  <text x="432" y="174" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">块内字符纹丝不动</text>

  <!-- t row -->
  <text x="86" y="224" text-anchor="end" font-size="14" fill="#888" filter="url(#rough2)">t =</text>
  <rect x="100" y="198" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="198" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="198" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="223" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">bb</text>
  <text x="216" y="223" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">aa</text>
  <text x="296" y="223" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">cc</text>

  <!-- note box 1 -->
  <rect x="50" y="252" width="420" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">切点只能落在 0, m, 2m, …, n —— 块的内容唯一确定</text>
  <text x="260" y="287" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">不存在「怎么切」的选择，只有「怎么排」的选择</text>

  <!-- note box 2 -->
  <rect x="50" y="306" width="420" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">互为字母异位词 ⇒ 字符多重集相同（题面已保证）</text>
  <text x="260" y="341" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">但块是原子、内部不可重排 —— 示例 3 恰在块级失配</text>
</svg>
