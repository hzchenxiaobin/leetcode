<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：word = "igigee"，k = 2</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">整串相邻差全 ≤ 2，只有一段；按 m = 1, 2, 3 逐档枚举窗口</text>

  <g filter="url(#sk)"><rect x="48" y="76" width="84" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="90" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10">m = 1</text>
  <text x="90" y="110" text-anchor="middle" font-size="12" fill="#a06a10">L = 2</text>
  <g filter="url(#sk)"><rect x="160" y="80" width="58" height="36" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.3"/></g>
  <text x="189" y="103" text-anchor="middle" font-size="13" fill="#888">ig <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <g filter="url(#sk)"><rect x="228" y="80" width="58" height="36" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.3"/></g>
  <text x="257" y="103" text-anchor="middle" font-size="13" fill="#888">gi <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <g filter="url(#sk)"><rect x="296" y="80" width="58" height="36" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.3"/></g>
  <text x="325" y="103" text-anchor="middle" font-size="13" fill="#888">ig <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <g filter="url(#sk)"><rect x="364" y="80" width="58" height="36" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.3"/></g>
  <text x="393" y="103" text-anchor="middle" font-size="13" fill="#888">ge <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <g filter="url(#sk)"><rect x="432" y="80" width="58" height="36" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="461" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ee ✓</text>
  <text x="461" y="132" text-anchor="middle" font-size="10" fill="#2e6e2e">e×2</text>
  <g filter="url(#sk)"><rect x="528" y="80" width="60" height="36" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="558" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">计 1</text>

  <g filter="url(#sk)"><rect x="48" y="158" width="84" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="90" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10">m = 2</text>
  <text x="90" y="192" text-anchor="middle" font-size="12" fill="#a06a10">L = 4</text>
  <g filter="url(#sk)"><rect x="160" y="162" width="84" height="36" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="202" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">igig ✓</text>
  <text x="202" y="214" text-anchor="middle" font-size="10" fill="#2e6e2e">i×2 g×2</text>
  <g filter="url(#sk)"><rect x="256" y="162" width="84" height="36" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.3"/></g>
  <text x="298" y="185" text-anchor="middle" font-size="13" fill="#888">gige <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <g filter="url(#sk)"><rect x="352" y="162" width="84" height="36" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.3"/></g>
  <text x="394" y="185" text-anchor="middle" font-size="13" fill="#888">igee <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <g filter="url(#sk)"><rect x="528" y="162" width="60" height="36" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="558" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">计 1</text>

  <g filter="url(#sk)"><rect x="48" y="240" width="84" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="90" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10">m = 3</text>
  <text x="90" y="274" text-anchor="middle" font-size="12" fill="#a06a10">L = 6</text>
  <g filter="url(#sk)"><rect x="160" y="244" width="118" height="36" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="219" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">igigee ✓</text>
  <text x="219" y="296" text-anchor="middle" font-size="10" fill="#2e6e2e">i×2 g×2 e×2</text>
  <g filter="url(#sk)"><rect x="528" y="244" width="60" height="36" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="558" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">计 1</text>

  <g filter="url(#sk)"><rect x="55" y="316" width="530" height="68" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="320" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">合计 3 = 1 + 1 + 1 ✓（与示例一致）</text>
  <text x="320" y="364" text-anchor="middle" font-size="11" fill="#555">每对（m, 起点）恰对应一个窗口：不同 m 窗长不同 → 不重不漏</text>
</svg>
