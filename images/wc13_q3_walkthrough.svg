<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="350" fill="#fafafa"/>
  <text x="320" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1 走查：[1,1,2,2,2] → 降序 [2,2,2,1,1]，target = 2</text>
  <text x="320" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每根火柴放进第一条还装得下的边；四条边都放不下才回溯</text>

  <text x="60" y="82" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">步骤</text>
  <text x="165" y="82" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">火柴 a[i]</text>
  <text x="275" y="82" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">放入</text>
  <text x="390" y="82" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">side[0..3]</text>

  <rect x="40" y="90" width="560" height="26" fill="#e8f0fe" stroke="#b9c9e2" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="107.5" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">第 1 根</text>
  <text x="165" y="107.5" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">2</text>
  <text x="275" y="107.5" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">边 1</text>
  <text x="390" y="107.5" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">[2, 0, 0, 0]</text>

  <rect x="40" y="116" width="560" height="26" fill="#fdfdfd" stroke="#dddddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="133.5" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">第 2 根</text>
  <text x="165" y="133.5" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">2</text>
  <text x="275" y="133.5" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">边 2</text>
  <text x="390" y="133.5" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">[2, 2, 0, 0]</text>

  <rect x="40" y="142" width="560" height="26" fill="#e8f0fe" stroke="#b9c9e2" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="159.5" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">第 3 根</text>
  <text x="165" y="159.5" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">2</text>
  <text x="275" y="159.5" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">边 3</text>
  <text x="390" y="159.5" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">[2, 2, 2, 0]</text>

  <rect x="40" y="168" width="560" height="26" fill="#fdfdfd" stroke="#dddddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="185.5" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">第 4 根</text>
  <text x="165" y="185.5" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">1</text>
  <text x="275" y="185.5" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">边 4（边 1~3 已满）</text>
  <text x="390" y="185.5" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">[2, 2, 2, 1]</text>

  <rect x="40" y="194" width="560" height="26" fill="#e6f4ea" stroke="#9cc08c" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="211.5" font-size="11" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">第 5 根</text>
  <text x="165" y="211.5" font-size="11" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">1</text>
  <text x="275" y="211.5" font-size="11" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">边 4（恰好补满）</text>
  <text x="390" y="211.5" font-size="11" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">[2, 2, 2, 2]</text>
  <text x="520" y="211.5" font-size="13" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">✓</text>

  <text x="40" y="246" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">反例 [3,3,3,3,4]：sum = 16，target = 4 → 降序 [4,3,3,3,3]</text>
  <rect x="40" y="258" width="560" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="280" font-size="10.5" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">边 1 放 4 变满，边 2、3、4 各放一个 3（剩余容量都是 1）</text>
  <text x="58" y="300" font-size="10.5" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">最后一根 3 四条边都装不下 → 回溯也没有别的选择 → 返回 false</text>
  <text x="58" y="320" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">剪枝②只会让「相同剩余容量的边」不被重复尝试，不会漏掉真正的解</text>
</svg>
