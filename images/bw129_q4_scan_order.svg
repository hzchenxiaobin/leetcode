<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 356"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="20"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="600" height="356" fill="#fafafa"/>
  <text x="300.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">填表顺序：i 从小到大，j 在行内从小到大</text>
  <text x="179.0" y="92.0" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j →</text>
  <text x="84.0" y="173.0" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i</text>
  <text x="90.0" y="187.0" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">↓</text>
  <rect x="110.1" y="103.5" width="42.8" height="42.7" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="131.5" y="132.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">00</text>
  <rect x="110.2" y="150.2" width="43.4" height="42.6" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="131.5" y="178.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">10</text>
  <rect x="109.9" y="195.5" width="42.7" height="43.0" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="131.5" y="224.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">20</text>
  <rect x="155.5" y="103.7" width="43.1" height="43.0" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="177.5" y="132.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">01</text>
  <rect x="155.7" y="150.1" width="43.3" height="42.5" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="177.5" y="178.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">11</text>
  <rect x="156.3" y="196.2" width="42.8" height="42.7" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="177.5" y="224.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">21</text>
  <rect x="202.5" y="103.8" width="42.6" height="42.6" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="223.5" y="132.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">02</text>
  <rect x="202.3" y="150.1" width="43.3" height="43.2" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="223.5" y="178.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">12</text>
  <rect x="202.0" y="196.5" width="42.9" height="43.1" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="223.5" y="224.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">22</text>
  <path d="M 179.0 144.0 L 179.0 102.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 225.0 190.0 L 225.0 102.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 150.0 173.0 L 108.0 173.0" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 150.0 219.0 L 108.0 219.0" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="300.3" y="104.1" width="270.4" height="96.1" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="435.0" y="129.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">绿色：S1[a][j] 沿 i 累加，</text>
  <text x="435.0" y="147.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">只依赖上一行，随时可用</text>
  <text x="435.0" y="165.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">橙色：S0[i][b] 沿 j 累加，</text>
  <text x="435.0" y="183.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">算完当前格就能更新</text>
  <rect x="300.2" y="207.5" width="269.7" height="77.8" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="435.0" y="233.0" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">两个方向互不等待，</text>
  <text x="435.0" y="251.0" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">一趟双重循环填完</text>
  <text x="435.0" y="269.0" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">空间：S1 全表 + 每行三个一维数组</text>
  <text x="300.0" y="316.0" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">因为 dp0[i][j] 只读 dp1[&lt;i][j]，dp1[i][j] 只读 dp0[i][&lt;j]，顺序天然成立</text>
  <text x="300.0" y="338.0" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">不需要滚动数组以外的任何技巧</text>
</svg>
