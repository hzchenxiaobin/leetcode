<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="490" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：两遍预处理 + 一遍从高档到低档判定</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- preprocess A -->
  <g filter="url(#sk)"><rect x="36" y="58" width="296" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="184" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">① 预处理 left_max（从左向右）</text>
  <text x="184" y="104" text-anchor="middle" font-size="11" fill="#446688">left_max[i] = max(left_max[i−1], nums[i−1])</text>
  <text x="184" y="124" text-anchor="middle" font-size="11" fill="#557799">哨兵：left_max[0] = −∞</text>
  <text x="184" y="146" text-anchor="middle" font-size="11" fill="#557799">含义：left_max[i] = max(nums[0..i−1])</text>

  <!-- preprocess B -->
  <g filter="url(#sk)"><rect x="348" y="58" width="296" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="496" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">② 预处理 right_min（从右向左）</text>
  <text x="496" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a">right_min[i] = min(right_min[i+1], nums[i+1])</text>
  <text x="496" y="124" text-anchor="middle" font-size="11" fill="#5c7a52">哨兵：right_min[n−1] = +∞</text>
  <text x="496" y="146" text-anchor="middle" font-size="11" fill="#5c7a52">含义：right_min[i] = min(nums[i+1..n−1])</text>

  <!-- converge arrows -->
  <path d="M 184 162 L 285 186" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 496 162 L 395 186" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- judge bar -->
  <g filter="url(#sk)"><rect x="200" y="188" width="260" height="30" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="330" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">③ 判定每个 i = 1 … n−2</text>
  <path d="M 330 218 L 330 236" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)"><path d="M 330 242 L 434 274 L 330 306 L 226 274 z" fill="#ffffff" stroke="#b85450" stroke-width="2"/></g>
  <text x="330" y="271" text-anchor="middle" font-size="11.5" fill="#2b2b2b">left_max[i] &lt; x &lt; right_min[i] ?</text>
  <text x="330" y="289" text-anchor="middle" font-size="9.5" fill="#999">（2 档：全局夹住）</text>
  <path d="M 434 274 L 470 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="452" y="264" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d25">是</text>
  <path d="M 330 306 L 330 344" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="343" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">否</text>

  <!-- +2 box -->
  <g filter="url(#sk)"><rect x="476" y="254" width="100" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="526" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">ans += 2</text>
  <text x="526" y="288" text-anchor="middle" font-size="9" fill="#a08030">命中即跳过 1 档</text>

  <!-- diamond 2 -->
  <g filter="url(#sk)"><path d="M 330 350 L 426 380 L 330 410 L 234 380 z" fill="#ffffff" stroke="#446688" stroke-width="2"/></g>
  <text x="330" y="377" text-anchor="middle" font-size="11.5" fill="#2b2b2b">nums[i−1] &lt; x &lt; nums[i+1] ?</text>
  <text x="330" y="394" text-anchor="middle" font-size="9.5" fill="#999">（1 档：相邻递增）</text>
  <path d="M 426 380 L 470 380" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="448" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d25">是</text>
  <path d="M 330 410 L 330 442 L 470 442" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="346" y="430" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888">否</text>

  <!-- +1 box -->
  <g filter="url(#sk)"><rect x="476" y="360" width="100" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="526" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">ans += 1</text>
  <text x="526" y="394" text-anchor="middle" font-size="9" fill="#6b7f99">相邻三连递增</text>

  <!-- +0 box -->
  <g filter="url(#sk)"><rect x="476" y="424" width="100" height="36" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.5"/></g>
  <text x="526" y="440" text-anchor="middle" font-size="12" fill="#888">ans += 0</text>
  <text x="526" y="455" text-anchor="middle" font-size="9" fill="#aaa">跳过</text>

  <!-- loop rail -->
  <g filter="url(#sk)"><rect x="600" y="254" width="64" height="206" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="632" y="300" text-anchor="middle" font-size="10.5" fill="#7a5415">i = i + 1</text>
  <text x="632" y="320" text-anchor="middle" font-size="10.5" fill="#7a5415">回到 ③</text>
  <path d="M 612 340 Q 632 348 652 340" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="632" y="366" text-anchor="middle" font-size="10" fill="#7a5415">i &gt; n−2 时</text>
  <text x="632" y="384" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">return ans</text>
  <path d="M 576 274 L 594 274" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 576 380 L 594 380" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 576 442 L 594 442" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="340" y="474" text-anchor="middle" font-size="11" fill="#888">三遍线性扫描 O(n)；left_max 可滚动成单变量，right_min 必须预存（判定方向与后缀信息相反）</text>
</svg>
