<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="450" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">官方示例走查：P 随 add 增长，遇 0 归零</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = len(P) − 1 是「0 之后的元素个数」，k &gt; n 意味着窗口跨过了 0</text>

  <rect x="24" y="58" width="612" height="336" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle" font-weight="bold">
    <text x="54" y="78">步骤</text>
    <text x="149" y="78">操作</text>
    <text x="309" y="78">P（0 之后的前缀积）</text>
    <text x="425" y="78">n</text>
    <text x="501" y="78">k &gt; n ?</text>
    <text x="606" y="78">返回</text>
  </g>
  <line x1="32" y1="86" x2="628" y2="86" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#666">
    <text x="54" y="110">1</text>
    <text x="149" y="110">add(3)</text>
    <text x="309" y="110">[1, 3]</text>
    <text x="425" y="110">1</text>
    <text x="501" y="110">—</text>
    <text x="606" y="110">—</text>

    <text x="54" y="140">2</text>
    <text x="149" y="140">add(0)</text>
    <text x="309" y="140">[1]</text>
    <text x="425" y="140">0</text>
    <text x="501" y="140">—</text>
    <text x="606" y="140">—</text>

    <text x="54" y="170">3</text>
    <text x="149" y="170">add(2)</text>
    <text x="309" y="170">[1, 2]</text>
    <text x="425" y="170">1</text>
    <text x="501" y="170">—</text>
    <text x="606" y="170">—</text>

    <text x="54" y="200">4</text>
    <text x="149" y="200">add(5)</text>
    <text x="309" y="200">[1, 2, 10]</text>
    <text x="425" y="200">2</text>
    <text x="501" y="200">—</text>
    <text x="606" y="200">—</text>

    <text x="54" y="230">5</text>
    <text x="149" y="230">add(4)</text>
    <text x="309" y="230">[1, 2, 10, 40]</text>
    <text x="425" y="230">3</text>
    <text x="501" y="230">—</text>
    <text x="606" y="230">—</text>
  </g>

  <rect x="30" y="238" width="600" height="30" fill="#e6f4ea" stroke="none" opacity="0.55" filter="url(#rough2)"/>
  <rect x="30" y="268" width="600" height="30" fill="#e6f4ea" stroke="none" opacity="0.55" filter="url(#rough2)"/>
  <rect x="30" y="298" width="600" height="30" fill="#fce4ec" stroke="none" opacity="0.55" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="54" y="258">6</text>
    <text x="149" y="258">getProduct(2)</text>
    <text x="309" y="258">[1, 2, 10, 40]</text>
    <text x="425" y="258">3</text>
    <text x="501" y="258">否（2 ≤ 3）</text>
    <text x="606" y="258">40 / 2 = 20</text>

    <text x="54" y="288">7</text>
    <text x="149" y="288">getProduct(3)</text>
    <text x="309" y="288">[1, 2, 10, 40]</text>
    <text x="425" y="288">3</text>
    <text x="501" y="288">否（3 ≤ 3）</text>
    <text x="606" y="288">40 / 1 = 40</text>

    <text x="54" y="318">8</text>
    <text x="149" y="318">getProduct(4)</text>
    <text x="309" y="318">—</text>
    <text x="425" y="318">3</text>
    <text x="501" y="318">是（4 &gt; 3）</text>
    <text x="606" y="318">0</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#666">
    <text x="54" y="348">9</text>
    <text x="149" y="348">add(8)</text>
    <text x="309" y="348">[1, 2, 10, 40, 320]</text>
    <text x="425" y="348">4</text>
    <text x="501" y="348">—</text>
    <text x="606" y="348">—</text>
  </g>

  <rect x="30" y="358" width="600" height="30" fill="#e6f4ea" stroke="none" opacity="0.55" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="54" y="378">10</text>
    <text x="149" y="378">getProduct(2)</text>
    <text x="309" y="378">[1, 2, 10, 40, 320]</text>
    <text x="425" y="378">4</text>
    <text x="501" y="378">否（2 ≤ 4）</text>
    <text x="606" y="378">320 / 10 = 32</text>
  </g>

  <text x="330" y="414" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">步骤 2 把 P 从 [1, 3] 清成 [1]：数字 3 从此不可能再被任何查询用到，直接丢弃即可</text>
  <text x="330" y="432" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">步骤 8 的 k = 4 &gt; n = 3，说明末 4 个数里必然含有那个 0，答案直接是 0</text>
</svg>
