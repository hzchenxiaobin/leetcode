<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums1 = [1,4,2]，nums2 = [1,2,4]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">填表顺序：逐行从左到右，答案在右下角 = 2</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#888">
    <text x="120" y="76">j=0</text><text x="176" y="76">j=1</text><text x="232" y="76">j=2</text><text x="288" y="76">j=3</text>
    <text x="330" y="76">nums2 →</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <rect x="96" y="84" width="48" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="152" y="84" width="48" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="208" y="84" width="48" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="264" y="84" width="48" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="120" y="109" fill="#666">0</text><text x="176" y="109" fill="#666">0</text>
    <text x="232" y="109" fill="#666">0</text><text x="288" y="109" fill="#666">0</text>

    <rect x="96" y="132" width="48" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="152" y="132" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="208" y="132" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="264" y="132" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="120" y="157" fill="#666">0</text><text x="176" y="157" fill="#4a7a3a">1</text>
    <text x="232" y="157" fill="#4a7a3a">1</text><text x="288" y="157" fill="#4a7a3a">1</text>

    <rect x="96" y="180" width="48" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="152" y="180" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="208" y="180" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="264" y="180" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="120" y="205" fill="#666">0</text><text x="176" y="205" fill="#446688">1</text>
    <text x="232" y="205" fill="#446688">1</text><text x="288" y="205" fill="#446688">2</text>

    <rect x="96" y="228" width="48" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="152" y="228" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="208" y="228" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="264" y="228" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" rx="4"/>
    <text x="120" y="253" fill="#666">0</text><text x="176" y="253" fill="#8a6a20">1</text>
    <text x="232" y="253" fill="#8a6a20">2</text><text x="288" y="253" fill="#8a3a36">2</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="60" y="109" text-anchor="end">i=0</text>
    <text x="60" y="157" text-anchor="end">i=1 (1)</text>
    <text x="60" y="205" text-anchor="end">i=2 (4)</text>
    <text x="60" y="253" text-anchor="end">i=3 (2)</text>
  </g>

  <rect x="340" y="84" width="190" height="122" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="354" y="104" font-size="11" fill="#3a5a30" font-weight="bold">两处“相等”转移</text>
  <text x="354" y="126" font-size="10" fill="#555">(i=1,j=1)：1 与 1 相等</text>
  <text x="354" y="144" font-size="10" fill="#555">→ dp = 0 + 1 = 1</text>
  <text x="354" y="168" font-size="10" fill="#555">(i=2,j=3)：4 与 4 相等</text>
  <text x="354" y="186" font-size="10" fill="#555">→ dp = 1 + 1 = 2</text>

  <rect x="340" y="218" width="190" height="108" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="354" y="238" font-size="11" fill="#8a3a36" font-weight="bold">右下角即答案</text>
  <text x="354" y="262" font-size="11" fill="#555">dp[3][3] = 2</text>
  <text x="354" y="286" font-size="10" fill="#555">对应连线 1–1、2–2</text>
  <text x="354" y="306" font-size="10" fill="#555">（示例 2、3 分别得 3、2）</text>

  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#999">注意 i=0 / j=0 这一圈是哨兵边界，统一取 0，避免下标 −1 的特判</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#999">空间可压到一维：dp[j] 从右往左更新时需暂存左上角旧值</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999">n, m ≤ 500 → 25 万状态，二维表约 1 MB，足够</text>
</svg>
