<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：6 条单调路径中 3 条异或值为 11</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">grid 值 2 1 5 / 7 10 0 / 12 6 4，k = 11</text>

  <rect x="66" y="72" width="54" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="98" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="122" y="72" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="98" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="178" y="72" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="98" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">5</text>

  <rect x="66" y="114" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="140" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">7</text>
  <rect x="122" y="114" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="140" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">10</text>
  <rect x="178" y="114" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="140" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">0</text>

  <rect x="66" y="156" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="182" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">12</text>
  <rect x="122" y="156" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="182" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">6</text>
  <rect x="178" y="156" width="54" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="182" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="93" y="212" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">起点</text>
  <text x="205" y="212" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">终点</text>

  <rect x="258" y="72" width="278" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="397" y="93" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2 ⊕ 7 ⊕ 12 ⊕ 6 ⊕ 4 = 11</text>
  <text x="397" y="112" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">下 下 右 右 ✓</text>

  <rect x="258" y="132" width="278" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="397" y="153" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2 ⊕ 7 ⊕ 10 ⊕ 0 ⊕ 4 = 11</text>
  <text x="397" y="172" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">下 右 右 下 ✓</text>

  <rect x="258" y="192" width="278" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="397" y="213" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2 ⊕ 1 ⊕ 10 ⊕ 6 ⊕ 4 = 11</text>
  <text x="397" y="232" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">右 下 下 右 ✓</text>

  <rect x="258" y="252" width="278" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="397" y="270" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">另外 3 条分别为 13、13、6</text>
  <text x="397" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">所以 dp[2][2][11] = 3</text>

  <text x="140" y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3 x 3 共有</text>
  <text x="140" y="270" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">C(4,2) = 6 条路径</text>
</svg>
