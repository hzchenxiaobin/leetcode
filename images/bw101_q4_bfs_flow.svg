<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <rect x="170" y="22" width="180" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">建双向邻接表，ans = +∞</text>
  <path d="M 260 62 L 260 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="90" width="200" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取下一条未枚举的边 (u, v)</text>
  <path d="M 260 128 L 260 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="128" y="154" width="264" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">双向删边：adj[u] 去 v，adj[v] 去 u</text>
  <path d="M 260 192 L 260 216" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="218" width="240" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d = BFS(u → v)，可达则 ans = min(ans, d+1)</text>
  <path d="M 260 256 L 260 280" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="128" y="282" width="264" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">双向恢复边，回到"取下一条边"</text>

  <path d="M 392 301 C 470 300, 470 109, 366 109" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="47" y="230" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">全部枚举完</text>
  <path d="M 128 313 C 60 313, 55 230, 62 230" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="236" width="76" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = +∞ ?</text>
  <text x="52" y="270" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">-1 : ans</text>
</svg>
