<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">k 对总和取余：整轮消耗是「复读机」，余数定终止点</text>

  <!-- 循环示意 -->
  <text x="170" y="60" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">chalk = [5,1,5]，total = 11</text>
  <g filter="url(#rough2)">
    <circle cx="80" cy="130" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="170" cy="130" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="260" cy="130" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="80" y="128">学 0</text><text x="80" y="143">用 5</text>
    <text x="170" y="128">学 1</text><text x="170" y="143">用 1</text>
    <text x="260" y="128">学 2</text><text x="260" y="143">用 5</text>
  </g>
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="2">
    <path d="M 104 122 Q 137 106, 146 122" fill="none" marker-end="url(#arr)"/>
    <path d="M 194 122 Q 227 106, 236 122" fill="none" marker-end="url(#arr)"/>
    <path d="M 278 142 Q 200 190, 92 158" fill="none" marker-end="url(#arr)" stroke-dasharray="6 4"/>
  </g>
  <text x="185" y="196" font-size="12.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">一轮共消耗 total = 11 支，队形回到原样</text>

  <!-- 取模 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <rect x="60" y="222" width="230" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="175" y="248" text-anchor="middle">k = 22：</text>
    <text x="175" y="272" text-anchor="middle" font-weight="bold">22 = 1 × 11 + 11</text>
    <text x="175" y="296" text-anchor="middle">跳过 1 整轮后剩 k = 11 支</text>
    <text x="175" y="313" text-anchor="middle" fill="#666" font-size="12">从学生 0 重新走一遍即出答案</text>
  </g>

  <!-- 右：为什么取模安全 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="320" y="222" width="216" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="428" y="246" text-anchor="middle" font-weight="bold" fill="#2d5a22">为什么可以取模？</text>
    <text x="428" y="270" text-anchor="middle" font-size="12">k ≥ total 时，走完一整轮后</text>
    <text x="428" y="288" text-anchor="middle" font-size="12">k′ = k − total，问题规模变小、答案不变；</text>
    <text x="428" y="306" text-anchor="middle" font-size="12">反复减 = 取余：k mod total。</text>
  </g>
  <text x="280" y="344" font-size="13" fill="#2d5a22" text-anchor="middle" font-weight="bold" filter="url(#rough2)">余下 11 支：5→剩 6，1→剩 5，再 5→剩 0，学生 0 补充粉笔（答案 0）✓</text>
</svg>
