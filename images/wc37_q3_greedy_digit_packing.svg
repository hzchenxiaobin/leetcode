<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="344" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">质因子打包：数位只能由 2、3、5、7 组成</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">位数越少 ⇒ b 越小；位数相同时数位升序排列 ⇒ b 最小</text>

  <g filter="url(#rough2)">
    <rect x="28" y="72" width="200" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="128" y="94" text-anchor="middle" font-size="11.5" fill="#3a4a66">a = 48 = 2⁴ × 3</text>
    <text x="128" y="112" text-anchor="middle" font-size="10" fill="#5a6a86">五个质因子，最多装进两个数位</text>

    <rect x="51" y="122" width="26" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="64" y="139" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="83" y="122" width="26" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="96" y="139" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="115" y="122" width="26" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="128" y="139" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="147" y="122" width="26" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="160" y="139" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="179" y="122" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="192" y="139" text-anchor="middle" font-size="11" fill="#8a6a20">3</text>

    <text x="128" y="166" text-anchor="middle" font-size="9.5" fill="#7a8aa6">质因子 2,3,5,7 各有一个「专属数位」</text>
  </g>

  <path d="M 232 112 L 292 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 232 140 L 292 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="298" y="66" width="232" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="414" y="86" text-anchor="middle" font-size="11" fill="#3a5a30">8 = 2 × 2 × 2</text>
    <text x="414" y="104" text-anchor="middle" font-size="9.5" fill="#5a7a4a">2³ → 一个数位吃掉三个 2</text>

    <rect x="298" y="124" width="232" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="414" y="144" text-anchor="middle" font-size="11" fill="#3a5a30">6 = 2 × 3</text>
    <text x="414" y="162" text-anchor="middle" font-size="9.5" fill="#5a7a4a">一个 2 配一个 3，不浪费</text>
  </g>

  <path d="M 414 180 L 414 212" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="132" y="216" width="296" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="12"/>
    <text x="280" y="238" text-anchor="middle" font-size="12" fill="#8a6a20">升序拼接 6 | 8  →  b = 68</text>
    <text x="280" y="257" text-anchor="middle" font-size="9.5" fill="#8a6a20">校验 6 × 8 = 48 ✓，且两位数是最少位数</text>
  </g>

  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#666">对照：48 = 2 × 4 × 6 → 246（三位，更大）；48 = 3 × 16 无解（16 不是数位）</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#666">因此「从 9 到 2 依次除尽」等价于「把质因子尽量多地塞进一个数位」</text>
</svg>
