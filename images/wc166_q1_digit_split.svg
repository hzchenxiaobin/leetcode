<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">对 10 取模抽出最低位，整除 10 丢掉它，直到 n 变成 0</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 n = 234 为例：每轮只取一位，乘积 P 与数字和 S 同时更新</text>

  <!-- 第一行：n 的收缩链 -->
  <g filter="url(#rough2)">
    <rect x="48" y="78" width="100" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="98" y="105" text-anchor="middle" font-size="15" fill="#2f4a66">n = 234</text>

    <rect x="196" y="78" width="96" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="244" y="105" text-anchor="middle" font-size="15" fill="#2f4a66">n = 23</text>

    <rect x="340" y="78" width="84" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="382" y="105" text-anchor="middle" font-size="15" fill="#2f4a66">n = 2</text>

    <rect x="468" y="78" width="64" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="500" y="105" text-anchor="middle" font-size="15" fill="#8c3b36">0</text>
  </g>

  <path d="M150,99 L192,99" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M294,99 L336,99" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M426,99 L464,99" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取出的位 -->
  <path d="M98,120 L98,138" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M244,120 L244,138" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M382,120 L382,138" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="78" y="140" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="98" y="163" text-anchor="middle" font-size="16" fill="#8a6a20">4</text>

    <rect x="224" y="140" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="244" y="163" text-anchor="middle" font-size="16" fill="#8a6a20">3</text>

    <rect x="362" y="140" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="382" y="163" text-anchor="middle" font-size="16" fill="#8a6a20">2</text>
  </g>

  <text x="280" y="70" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每轮三件事：d = n % 10、累乘、累加，然后 n //= 10 丢掉这一位</text>
  <text x="280" y="196" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">取出的位依次是 4、3、2：从最低位到最高位，恰好各一次</text>

  <!-- 累加结果 -->
  <g filter="url(#rough2)">
    <rect x="36" y="212" width="230" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="151" y="234" text-anchor="middle" font-size="11" fill="#2f4a66">乘积 P：初值 1，逐位相乘</text>
    <text x="151" y="254" text-anchor="middle" font-size="13" fill="#2f4a66">1 × 4 × 3 × 2 = 24</text>

    <rect x="294" y="212" width="230" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="409" y="234" text-anchor="middle" font-size="11" fill="#3d6b2f">数字和 S：初值 0，逐位相加</text>
    <text x="409" y="254" text-anchor="middle" font-size="13" fill="#3d6b2f">0 + 4 + 3 + 2 = 9</text>

    <rect x="120" y="284" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="280" y="316" text-anchor="middle" font-size="15" fill="#8a6a20">P − S = 24 − 9 = 15</text>
  </g>

  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">乘法与加法都可交换，故 P、S 只由数字的多重集合决定，与出现顺序无关</text>
</svg>
