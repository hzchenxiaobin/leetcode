<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">分割得分 = 前缀和 − 后缀最小值</text>
  <path d="M 200 42 Q 340 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array boxes, split between index 2 and 3 -->
  <g filter="url(#sk)">
    <rect x="80" y="70" width="70" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="150" y="70" width="70" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="220" y="70" width="70" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="290" y="70" width="70" height="46" rx="4" fill="#fff3e0" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="360" y="70" width="70" height="46" rx="4" fill="#fff3e0" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="15" fill="#333" text-anchor="middle">
    <text x="115" y="99">10</text>
    <text x="185" y="99">−1</text>
    <text x="255" y="99">3</text>
    <text x="325" y="99">−4</text>
    <text x="395" y="99">−5</text>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#888" text-anchor="middle">
    <text x="115" y="128">0</text>
    <text x="185" y="128">1</text>
    <text x="255" y="128">2</text>
    <text x="325" y="128">3</text>
    <text x="395" y="128">4</text>
  </g>

  <!-- split marker -->
  <g filter="url(#sk)">
    <path d="M 288 62 L 288 132" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 3"/>
  </g>
  <text x="288" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">分割点 i = 2</text>

  <!-- prefix brace -->
  <g filter="url(#sk)">
    <path d="M 80 150 Q 80 160 92 160 L 248 160 Q 260 160 260 150" stroke="#4a8edb" stroke-width="1.6" fill="none"/>
  </g>
  <text x="170" y="180" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">前缀和 prefixSum(2) = 10+(−1)+3 = 12</text>

  <!-- suffix brace -->
  <g filter="url(#sk)">
    <path d="M 290 150 Q 290 160 302 160 L 388 160 Q 400 160 400 150" stroke="#c98a2b" stroke-width="1.6" fill="none"/>
  </g>
  <text x="345" y="180" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">后缀最小值</text>
  <text x="345" y="196" text-anchor="middle" font-size="12.5" fill="#7a5415">suffixMin(2) = min(−4,−5) = −5</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="120" y="215" width="440" height="74" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="340" y="243" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">score(i) = prefixSum(i) − suffixMin(i)</text>
  <text x="340" y="270" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">score(2) = 12 − (−5) = 17</text>

  <!-- two-track note -->
  <g filter="url(#sk)">
    <rect x="60" y="305" width="270" height="72" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="195" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">前缀：从左往右「边扫边加」</text>
  <text x="195" y="350" text-anchor="middle" font-size="11" fill="#555">pre += nums[i]，O(1) 维护</text>
  <text x="195" y="367" text-anchor="middle" font-size="11" fill="#888">前缀和不需要数组</text>

  <g filter="url(#sk)">
    <rect x="350" y="305" width="270" height="72" rx="8" fill="#fff3e0" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="485" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">后缀：从右往左递推最小值</text>
  <text x="485" y="350" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">sufMin[j] = min(nums[j], sufMin[j+1])</text>
  <text x="485" y="367" text-anchor="middle" font-size="11" fill="#888">查询 suffixMin(i) 即 sufMin[i+1]</text>
</svg>
