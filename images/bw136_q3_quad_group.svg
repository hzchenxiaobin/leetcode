<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">四元组约束：四个对称位置必须相等</text>

  <!-- 5x5 网格，四个角点高亮 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="60" y="52" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
    <rect x="104" y="52" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="148" y="52" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="192" y="52" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="236" y="52" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>

    <rect x="60" y="96" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="104" y="96" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="148" y="96" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="192" y="96" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="236" y="96" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>

    <rect x="60" y="140" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="104" y="140" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="148" y="140" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="192" y="140" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="236" y="140" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>

    <rect x="60" y="184" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="104" y="184" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="148" y="184" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="192" y="184" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="236" y="184" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>

    <rect x="60" y="228" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
    <rect x="104" y="228" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="148" y="228" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="192" y="228" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="236" y="228" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>

    <text x="82" y="80" fill="#b85450">a</text>
    <text x="258" y="80" fill="#b85450">b</text>
    <text x="82" y="256" fill="#b85450">c</text>
    <text x="258" y="256" fill="#b85450">d</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <text x="314" y="60" fill="#333">a、b、c、d 必须相等</text>
    <text x="314" y="82" fill="#666">否则某行或某列不对称</text>
    <text x="314" y="106" fill="#333">设其中 1 的个数为 s</text>
    <text x="314" y="128" fill="#666">全 0 代价 s，全 1 代价 4 − s</text>
    <text x="314" y="152" fill="#a06c10">⇒ 该组代价 min(s, 4 − s)</text>
    <text x="314" y="176" fill="#333">最终 1 的个数为 0 或 4</text>
    <text x="314" y="198" fill="#666">⇒ 对 mod 4 无影响</text>

    <rect x="60" y="292" width="460" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="76" y="316" fill="#2d5a22">每个格子恰好属于一个「四元组」（j &lt; n/2、i &lt; m/2 的小格决定四角）</text>
    <text x="76" y="340" fill="#2d5a22">组与组之间互不相交 ⇒ 代价可独立相加，且与 1 的总数 mod 4 无关</text>
    <text x="76" y="358" fill="#666">中心的四元组在 m、n 均为奇数时才退化成 1 格（见下一张图）</text>
  </g>
</svg>
