<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：保留值 v 的一段出现，代价只取决于两端</text>
  <path d="M 120 34 Q 280 42 440 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- span bracket -->
  <g filter="url(#sk)">
    <path d="M 160 66 L 160 54 L 480 54 L 480 66" stroke="#b85450" stroke-width="1.8" fill="none"/>
  </g>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#b85450">跨度 = p[j] − p[i] + 1 = 5（下标 1 → 5）</text>

  <!-- array boxes -->
  <g filter="url(#sk)">
    <rect x="54" y="66" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="134" y="66" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <rect x="214" y="66" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="294" y="66" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <rect x="374" y="66" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="454" y="66" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
  </g>
  <text x="80" y="90" text-anchor="middle" font-size="14" fill="#2b2b2b">1</text>
  <text x="160" y="90" text-anchor="middle" font-size="14" fill="#2b2b2b">3</text>
  <text x="240" y="90" text-anchor="middle" font-size="14" fill="#2b2b2b">2</text>
  <text x="320" y="90" text-anchor="middle" font-size="14" fill="#2b2b2b">3</text>
  <text x="400" y="90" text-anchor="middle" font-size="14" fill="#2b2b2b">1</text>
  <text x="480" y="90" text-anchor="middle" font-size="14" fill="#2b2b2b">3</text>
  <text x="80" y="120" text-anchor="middle" font-size="11" fill="#7a7a7a">0</text>
  <text x="160" y="120" text-anchor="middle" font-size="11" fill="#7a7a7a">1</text>
  <text x="240" y="120" text-anchor="middle" font-size="11" fill="#7a7a7a">2</text>
  <text x="320" y="120" text-anchor="middle" font-size="11" fill="#7a7a7a">3</text>
  <text x="400" y="120" text-anchor="middle" font-size="11" fill="#7a7a7a">4</text>
  <text x="480" y="120" text-anchor="middle" font-size="11" fill="#7a7a7a">5</text>

  <!-- delete crosses on boxes 2 and 4 -->
  <path d="M 232 62 L 248 48 M 248 62 L 232 48" stroke="#b85450" stroke-width="2.4" fill="none"/>
  <path d="M 392 62 L 408 48 M 408 62 L 392 48" stroke="#b85450" stroke-width="2.4" fill="none"/>
  <text x="240" y="140" text-anchor="middle" font-size="10" fill="#b85450">删</text>
  <text x="400" y="140" text-anchor="middle" font-size="10" fill="#b85450">删</text>

  <!-- occurrence list of value 3 -->
  <text x="96" y="160" text-anchor="middle" font-size="12" fill="#2b2b2b">值 3 的出现列表</text>
  <g filter="url(#sk)">
    <rect x="212" y="140" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="262" y="140" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="312" y="140" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="232" y="159" text-anchor="middle" font-size="13" fill="#2b2b2b">p[0]=1</text>
  <text x="282" y="159" text-anchor="middle" font-size="13" fill="#2b2b2b">p[1]=3</text>
  <text x="332" y="159" text-anchor="middle" font-size="13" fill="#2b2b2b">p[2]=5</text>
  <g filter="url(#sk)">
    <path d="M 212 174 L 212 182 L 352 182 L 352 174" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
  </g>
  <text x="282" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a">保留 j − i + 1 = 3 个</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="40" y="212" width="480" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="280" y="234" text-anchor="middle" font-size="12.5" fill="#7a5415">cost = (p[j] − p[i] + 1) − (j − i + 1) = 跨度 − 保留数 = 5 − 3 = 2 ≤ k = 3</text>
  <text x="280" y="256" text-anchor="middle" font-size="12.5" fill="#7a5415">删除段内 2 个杂元素 → [1, 3, 3, 3] 中三个 3 连续 → 等值子数组长度 3</text>

  <!-- bottom notes -->
  <g filter="url(#sk)">
    <rect x="40" y="282" width="480" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="280" y="304" text-anchor="middle" font-size="11.5" fill="#2f4f25">① 只需删除保留段 [p[i], p[j]] 内的非 v 元素，段外元素与该子数组无关，一个都不用删；</text>
  <text x="280" y="324" text-anchor="middle" font-size="11.5" fill="#2f4f25">② 保留段内的 v 出现一个不删——多保留一个，答案 +1 且代价 −1，只会更优；</text>
  <text x="280" y="344" text-anchor="middle" font-size="11.5" fill="#2f4f25">③ 所以枚举 (v, i, j) 就覆盖了所有最优方案，无需考虑任意子集。</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#7a7a7a">对每个值的出现列表做双指针扫描 → 整体 O(n)</text>
</svg>
