<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="560" height="372" fill="#fafafa"/>
<text x="280" y="30" text-anchor="middle" font-size="16" fill="#333333" font-weight="normal" filter="url(#roughs)">nums = [2,11,10,1,3]，k = 10</text>
<text x="280" y="52" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" filter="url(#roughs)">值永远不会被修改：小于 k 的只能被删除，其余一个都不用删</text>
<rect x="93" y="78" width="62" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
<text x="124.0" y="108" text-anchor="middle" font-size="19" fill="#333333" font-weight="normal" filter="url(#roughs)">2</text>
<text x="124.0" y="146" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#roughs)">删</text>
<text x="124.0" y="166" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">2 &amp;lt; 10</text>
<rect x="171" y="78" width="62" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="202.0" y="108" text-anchor="middle" font-size="19" fill="#333333" font-weight="normal" filter="url(#roughs)">11</text>
<text x="202.0" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#roughs)">留</text>
<text x="202.0" y="166" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">11 &amp;gt;= 10</text>
<rect x="249" y="78" width="62" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280.0" y="108" text-anchor="middle" font-size="19" fill="#333333" font-weight="normal" filter="url(#roughs)">10</text>
<text x="280.0" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#roughs)">留</text>
<text x="280.0" y="166" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">10 &amp;gt;= 10</text>
<rect x="327" y="78" width="62" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
<text x="358.0" y="108" text-anchor="middle" font-size="19" fill="#333333" font-weight="normal" filter="url(#roughs)">1</text>
<text x="358.0" y="146" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#roughs)">删</text>
<text x="358.0" y="166" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">1 &amp;lt; 10</text>
<rect x="405" y="78" width="62" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
<text x="436.0" y="108" text-anchor="middle" font-size="19" fill="#333333" font-weight="normal" filter="url(#roughs)">3</text>
<text x="436.0" y="146" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#roughs)">删</text>
<text x="436.0" y="166" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">3 &amp;lt; 10</text>
<path d="M250,190 L250,212" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="180" y="214" width="140" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="250" y="245" text-anchor="middle" font-size="18" fill="#8a5a10" font-weight="bold" filter="url(#roughs)">cnt = 3</text>
<rect x="40" y="292" width="225" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="152" y="314" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">必要性：值 &lt; k 的元素</text>
<text x="152" y="334" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">无论怎么操作都不会变大</text>
<rect x="295" y="292" width="225" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="407" y="314" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">充分性：删除总是从最小开始</text>
<text x="407" y="334" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">所以前 cnt 次恰好删完它们</text>
<path d="M255,292 L250,268" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
</svg>
