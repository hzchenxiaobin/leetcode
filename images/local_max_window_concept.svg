<svg xmlns="http://www.w3.org/2000/svg" width="660" height="460" viewBox="0 0 660 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="660" height="460" fill="#fdfcf7"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">3×3 窗口 ⇄ maxLocal 格：一一对应</text>
  <path d="M 165 42 Q 330 50 495 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">输出格 (i,j) ↔ 中心 (i+1, j+1) 的 3×3 窗口（图示 i = j = 0）</text>

  <!-- ===== Left: 4x4 grid ===== -->
  <g font-size="9.5" fill="#888">
    <text x="74" y="105" filter="url(#sk)">列:</text>
    <text x="123" y="105" text-anchor="middle" filter="url(#sk)">0</text>
    <text x="169" y="105" text-anchor="middle" filter="url(#sk)">1</text>
    <text x="215" y="105" text-anchor="middle" filter="url(#sk)">2</text>
    <text x="261" y="105" text-anchor="middle" filter="url(#sk)">3</text>
    <text x="92" y="142" text-anchor="end" filter="url(#sk)">行0:</text>
    <text x="92" y="188" text-anchor="end" filter="url(#sk)">行1:</text>
    <text x="92" y="234" text-anchor="end" filter="url(#sk)">行2:</text>
    <text x="92" y="280" text-anchor="end" filter="url(#sk)">行3:</text>
  </g>

  <!-- row 0 -->
  <g filter="url(#sk)"><rect x="100" y="112" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/></g>
  <text x="123" y="139" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">9</text>
  <g filter="url(#sk)"><rect x="146" y="112" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/></g>
  <text x="169" y="139" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">9</text>
  <g filter="url(#sk)"><rect x="192" y="112" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/></g>
  <text x="215" y="139" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">8</text>
  <g filter="url(#sk)"><rect x="238" y="112" width="46" height="46" fill="#f2f0e8" stroke="#ccc" stroke-width="1" rx="3" opacity="0.85"/></g>
  <text x="261" y="139" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#sk)">1</text>

  <!-- row 1 -->
  <g filter="url(#sk)"><rect x="100" y="158" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/></g>
  <text x="123" y="185" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="146" y="158" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3"/></g>
  <text x="169" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8860b" filter="url(#sk)">6</text>
  <text x="185" y="172" font-size="10" fill="#d6a040" filter="url(#sk)">★</text>
  <g filter="url(#sk)"><rect x="192" y="158" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/></g>
  <text x="215" y="185" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="238" y="158" width="46" height="46" fill="#f2f0e8" stroke="#ccc" stroke-width="1" rx="3" opacity="0.85"/></g>
  <text x="261" y="185" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#sk)">6</text>

  <!-- row 2 -->
  <g filter="url(#sk)"><rect x="100" y="204" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/></g>
  <text x="123" y="231" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">8</text>
  <g filter="url(#sk)"><rect x="146" y="204" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/></g>
  <text x="169" y="231" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="192" y="204" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/></g>
  <text x="215" y="231" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="238" y="204" width="46" height="46" fill="#f2f0e8" stroke="#ccc" stroke-width="1" rx="3" opacity="0.85"/></g>
  <text x="261" y="231" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#sk)">4</text>

  <!-- row 3 (outside) -->
  <g filter="url(#sk)"><rect x="100" y="250" width="46" height="46" fill="#f2f0e8" stroke="#ccc" stroke-width="1" rx="3" opacity="0.85"/></g>
  <text x="123" y="277" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="146" y="250" width="46" height="46" fill="#f2f0e8" stroke="#ccc" stroke-width="1" rx="3" opacity="0.85"/></g>
  <text x="169" y="277" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="192" y="250" width="46" height="46" fill="#f2f0e8" stroke="#ccc" stroke-width="1" rx="3" opacity="0.85"/></g>
  <text x="215" y="277" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="238" y="250" width="46" height="46" fill="#f2f0e8" stroke="#ccc" stroke-width="1" rx="3" opacity="0.85"/></g>
  <text x="261" y="277" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#sk)">2</text>

  <!-- window outline -->
  <g filter="url(#sk)"><rect x="97.5" y="109.5" width="141" height="141" rx="7" fill="none" stroke="#446688" stroke-width="2.5"/></g>

  <text x="192" y="316" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">grid：n×n（示例 4×4）</text>
  <text x="192" y="335" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b8860b" filter="url(#sk)">★ 橙格 = 中心 (i+1, j+1)，蓝框 = 3×3 窗口</text>

  <!-- ===== arrow between ===== -->
  <path d="M 246 172 Q 340 146 430 168" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="338" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">窗口内 9 个数取 max</text>
  <text x="338" y="196" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#b03a3a" filter="url(#sk)">max{9,9,8,5,6,2,8,2,6}</text>
  <text x="338" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a" filter="url(#sk)">= 9</text>

  <!-- ===== Right: 2x2 maxLocal ===== -->
  <text x="492" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">maxLocal[0][0]</text>
  <g font-size="10" fill="#888">
    <text x="464" y="157" text-anchor="middle" filter="url(#sk)">j=0</text>
    <text x="520" y="157" text-anchor="middle" filter="url(#sk)">j=1</text>
    <text x="428" y="197" text-anchor="end" filter="url(#sk)">i=0</text>
    <text x="428" y="253" text-anchor="end" filter="url(#sk)">i=1</text>
  </g>
  <g filter="url(#sk)"><rect x="436" y="164" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/></g>
  <text x="464" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#b03a3a" filter="url(#sk)">9</text>
  <g filter="url(#sk)"><rect x="492" y="164" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
  <text x="520" y="198" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">9</text>
  <g filter="url(#sk)"><rect x="436" y="220" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
  <text x="464" y="254" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">8</text>
  <g filter="url(#sk)"><rect x="492" y="220" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
  <text x="520" y="254" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">6</text>
  <text x="492" y="296" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">maxLocal：(n−2)×(n−2)</text>

  <!-- ===== Bottom: index mapping box ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="356" width="524" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="90" y="380" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">索引映射（Q1 唯一考点）</text>
  <text x="90" y="403" font-size="12" font-family="monospace" fill="#444" filter="url(#sk)">maxLocal[i][j] = max{ grid[i+di][j+dj] : di, dj ∈ {0,1,2} }</text>
  <text x="90" y="423" font-size="11" fill="#555" filter="url(#sk)">窗口 = 行 [i, i+2] × 列 [j, j+2]，中心 (i+1, j+1)，i, j ∈ [0, n−3]</text>
  <text x="90" y="441" font-size="10.5" fill="#888" filter="url(#sk)">n×n → (n−2)×(n−2)：合法中心 [1, n−2]² 与输出下标 [0, n−3]² 构成双射</text>
</svg>
