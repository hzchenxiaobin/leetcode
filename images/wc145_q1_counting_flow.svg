<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次计数 + 两趟输出</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888">计数表被两趟共享，第一趟用完即清零，避免尾部重复输出</text>

  <rect x="90" y="64" width="380" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="106" y="86" font-size="12" fill="#3a4a66" font-weight="bold">① 计数：cnt[arr1[i]] += 1</text>
  <text x="106" y="106" font-size="10" fill="#555">值域 0..1000，用长度 1001 的数组当哈希表，O(n)</text>

  <path d="M 280 120 L 280 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="146" width="380" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="106" y="168" font-size="12" fill="#3a5a30" font-weight="bold">② 按 arr2 输出：对每个 x 追加 cnt[x] 个 x</text>
  <text x="106" y="188" font-size="10" fill="#555">输出后必须 cnt[x] = 0，否则第 ③ 步会把它们再输出一次</text>

  <path d="M 280 202 L 280 224" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="228" width="380" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="106" y="250" font-size="12" fill="#8a6a20" font-weight="bold">③ 补尾部：v 从 0 扫到 1000，追加剩余 cnt[v] 个 v</text>
  <text x="106" y="270" font-size="10" fill="#555">下标自然递增 ⇒ 未出现在 arr2 中的元素天然升序</text>

  <path d="M 280 284 L 280 306" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="310" width="260" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">返回 res（长度恰为 len(arr1)）</text>

  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#999">时间 O(n + m + 1001)，空间 O(1001)：与 arr1 长度无关的常数级桶</text>
</svg>
