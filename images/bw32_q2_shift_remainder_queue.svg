<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">同余移位排队：余数 d 的第 c 个用第 d + 26(c−1) 次操作</text>

  <!-- 字母环 -->
  <g filter="url(#rough2)">
    <circle cx="170" cy="200" r="88" fill="none" stroke="#e8f0fe" stroke-width="20"/>
    <circle cx="170" cy="200" r="88" fill="none" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="170" y="98">a</text><text x="226" y="112">b</text><text x="262" y="152">c</text>
    <text x="262" y="252">…</text><text x="226" y="292">z</text><text x="170" y="308">a</text>
    <text x="114" y="292">z</text><text x="78" y="252">…</text><text x="78" y="152">b</text><text x="114" y="112">c</text>
  </g>
  <path d="M 176 112 A 88 88 0 0 1 254 172" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="140" font-size="12" fill="#b85450" filter="url(#rough2)">i→o 差 6</text>

  <!-- 右：频次分配 -->
  <text x="430" y="70" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">aab → bbb：差值都 = 1</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="330" y="84" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="430" y="104">第 1 个 1：用第 1 次操作</text>
    <rect x="330" y="120" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="430" y="140">第 2 个 1：用第 27 次操作</text>
    <rect x="330" y="156" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="430" y="176">第 3 个 1：用第 53 次操作</text>
  </g>
  <text x="430" y="212" font-size="13" fill="#333" filter="url(#rough2)" text-anchor="middle">cnt[1] 个待移位 ⟹ 需 k ≥ 1 + 26(cnt[1]−1)</text>

  <g filter="url(#rough2)" font-size="12" fill="#7a7a7a" text-anchor="middle">
    <text x="430" y="240">“切换 i 次”中 i 各不相同（每个下标只用一次操作）</text>
    <text x="430" y="258">⟹ 同余 d 的多个位移只能取 d, d+26, d+52, …</text>
  </g>

  <rect x="70" y="290" width="420" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="313" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)" font-weight="bold">判定：max over d of (d + 26·(cnt[d]−1)) ≤ k</text>

  <text x="280" y="352" font-size="12" fill="#7a7a7a" text-anchor="middle" filter="url(#rough2)">不同余数互不抢操作次数：各余数独立判定即可</text>
</svg>
