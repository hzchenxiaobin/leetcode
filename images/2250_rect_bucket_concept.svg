<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="411" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="660" height="440" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：h ≤ 100 是钥匙，l ≤ 10⁹ 交给二分</text>
  <path d="M 170 40 Q 330 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: coordinate system with flat rectangles -->
  <line x1="60" y1="310" x2="345" y2="310" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#sk)"/>
  <line x1="60" y1="310" x2="60" y2="125" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#sk)"/>
  <rect x="60" y="150" width="190" height="160" rx="3" fill="#fff8e1" fill-opacity="0.42" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <rect x="60" y="214" width="190" height="96" rx="3" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <rect x="60" y="246" width="95" height="64" rx="3" fill="#e8f0fe" fill-opacity="0.6" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="258" y="170" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">R3 (2,5)</text>
  <text x="258" y="238" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">R2 (2,3)</text>
  <text x="108" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">R1 (1,2)</text>
  <circle cx="250" cy="278" r="5" fill="#b85450" filter="url(#sk)"/>
  <text x="250" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">P1 (2,1)</text>
  <circle cx="155" cy="182" r="5" fill="#b85450" filter="url(#sk)"/>
  <text x="172" y="180" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">P2 (1,4)</text>
  <text x="316" y="330" font-size="11.5" fill="#555" filter="url(#sk)">l → 10⁹</text>
  <text x="72" y="138" font-size="11.5" fill="#555" filter="url(#sk)">h ≤ 100</text>
  <text x="55" y="358" font-size="12" fill="#333" filter="url(#sk)">✗ l、x ∈ [1, 10⁹]：值域数组开不下</text>
  <text x="55" y="380" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">✓ h、y ∈ [1, 100]：只有 100 种取值！</text>

  <!-- right: buckets with suffix containment -->
  <g filter="url(#sk)" fill="none">
    <rect x="385" y="62" width="200" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="385" y="94" width="200" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="385" y="126" width="200" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="385" y="166" width="200" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="385" y="228" width="200" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="378" y="78" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#sk)">h = 5</text>
  <text x="378" y="110" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#sk)">h = 4</text>
  <text x="378" y="145" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#sk)">h = 3</text>
  <text x="378" y="189" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#sk)">h = 2</text>
  <text x="378" y="223" text-anchor="middle" font-size="14" fill="#446688" filter="url(#sk)">⋮</text>
  <text x="378" y="252" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#sk)">h = 1</text>
  <g filter="url(#sk)">
    <rect x="395" y="68" width="16" height="12" rx="3" fill="#446688"/>
    <rect x="395" y="100" width="16" height="12" rx="3" fill="#446688"/>
    <rect x="395" y="135" width="16" height="12" rx="3" fill="#446688"/>
    <rect x="417" y="135" width="16" height="12" rx="3" fill="#4a7a3a"/>
    <rect x="395" y="178" width="16" height="12" rx="3" fill="#446688"/>
    <rect x="417" y="178" width="16" height="12" rx="3" fill="#4a7a3a"/>
    <rect x="439" y="178" width="16" height="12" rx="3" fill="#d6a040"/>
    <rect x="395" y="240" width="16" height="12" rx="3" fill="#446688"/>
    <rect x="417" y="240" width="16" height="12" rx="3" fill="#4a7a3a"/>
    <rect x="439" y="240" width="16" height="12" rx="3" fill="#d6a040"/>
  </g>
  <path d="M 598 250 C 606 210 606 120 596 76" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="626" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">h 越</text>
  <text x="626" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">小桶</text>
  <text x="626" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">越大</text>

  <g filter="url(#sk)">
    <rect x="370" y="284" width="272" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="506" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">buckets[h] = { lᵢ : hᵢ ≥ h }，桶内有序</text>

  <g filter="url(#sk)">
    <rect x="370" y="336" width="272" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="506" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">查询 (x, y)：在 buckets[y] 里数 ≥ x 的个数</text>

  <g filter="url(#sk)">
    <rect x="20" y="396" width="620" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="330" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a35" filter="url(#sk)">套路：小维度 h（≤ 100）当桶下标；大维度 l（≤ 10⁹）桶内排序 + 二分</text>
</svg>
