<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">核心观察：方向锁定 ⇒ (起点, 方向) 唯一确定一条有向射线</text>
  <path d="M 200 42 Q 360 50 520 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== left: matrix & rays ===== -->
  <text x="118" y="80" text-anchor="middle" font-size="12" fill="#a05a20" font-weight="bold">起点 (0,0)</text>

  <g filter="url(#rough2)">
    <rect x="90" y="90" width="56" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="146" y="90" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="90" y="136" width="56" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="146" y="136" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="90" y="182" width="56" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="146" y="182" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="118" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">1</text>
  <text x="174" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">1</text>
  <text x="118" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5b22">9</text>
  <text x="174" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">9</text>
  <text x="118" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5b22">1</text>
  <text x="174" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">1</text>

  <g filter="url(#rough2)">
    <path d="M 78 100 L 78 220" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  </g>
  <text x="68" y="160" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">南</text>

  <text x="84" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">南向：1→9→1 ⇒ 1, 19, 191</text>
  <text x="84" y="266" font-size="11" fill="#446688">东向：1→1 ⇒ 11</text>
  <text x="84" y="284" font-size="11" fill="#446688">东南：1→9 ⇒ 19</text>

  <!-- ===== right: prefix chain ===== -->
  <text x="480" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">一条射线 = 一串前缀数</text>

  <g filter="url(#rough2)">
    <rect x="355" y="84" width="250" height="50" rx="6" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="480" y="104" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">步 1：num = 0×10 + 1 = 1</text>
  <text x="480" y="124" text-anchor="middle" font-size="11" fill="#999">一位数 ≤ 10，出局</text>

  <g filter="url(#rough2)">
    <path d="M 480 134 L 480 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="355" y="146" width="250" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="480" y="166" text-anchor="middle" font-size="13" fill="#2e5b22" font-weight="bold">步 2：num = 1×10 + 9 = 19</text>
  <text x="480" y="186" text-anchor="middle" font-size="11" fill="#2e5b22">质数 ✓ → 计入 cnt</text>

  <g filter="url(#rough2)">
    <path d="M 480 196 L 480 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="355" y="208" width="250" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="480" y="228" text-anchor="middle" font-size="13" fill="#2e5b22" font-weight="bold">步 3：num = 19×10 + 1 = 191</text>
  <text x="480" y="248" text-anchor="middle" font-size="11" fill="#2e5b22">质数 ✓ → 计入 cnt</text>

  <g filter="url(#rough2)">
    <path d="M 206 113 L 348 113" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="276" y="103" text-anchor="middle" font-size="11" fill="#446688">每走一步拼一位</text>

  <!-- ===== summary ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="306" width="600" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="360" y="330" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">总账：起点 ≤ 36 × 方向 8 × 步数 ≤ 6 ⇒ 生成数 ≤ 1728 个，数值 ≤ 999999</text>
  <text x="360" y="352" text-anchor="middle" font-size="12" fill="#7a5415">m, n ≤ 6 是『明示暴力』的数据范围——枚举躲不掉也无需省，胜负手在判素</text>

  <g filter="url(#rough2)">
    <rect x="60" y="378" width="600" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="360" y="400" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">频次的真正含义：v 的频次 = 拼出 v 的 (起点, 方向, 步数) 三元组个数</text>
  <text x="360" y="422" text-anchor="middle" font-size="11" fill="#2b4a66">示例 1 中 19 恰好 8 次 = 8 个『先 1 后 9』的有向相邻对（反向 91 = 7×13 不计）</text>
</svg>
