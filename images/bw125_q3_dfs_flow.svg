<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 382" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="560" height="382" fill="#fafafa"/>
<text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="normal" filter="url(#roughs)">对每个中心各做一次「按分支计数 + 组合」</text>
<ellipse cx="280" cy="64" rx="86" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="280" y="70" text-anchor="middle" font-size="13" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">对每个中心 c</text>
<path d="M280,88 L280,110" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="160" y="112" width="240" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="139" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">对 c 的每个邻居 v（一个分支）</text>
<path d="M280,156 L280,178" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="140" y="180" width="280" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="202" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">DFS 统计分支内 dist(c,x) % s == 0</text>
<text x="280" y="222" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">的节点个数 cnt</text>
<path d="M280,232 L280,256" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="150" y="258" width="260" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="279" text-anchor="middle" font-size="12" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">pairs += total · cnt</text>
<text x="280" y="297" text-anchor="middle" font-size="12" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">total += cnt</text>
<path d="M410,281 L440,281 L440,134 L402,134" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
<text x="452" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" transform="rotate(90 452 210)" filter="url(#roughs)">分支</text>
<path d="M280,304 L280,326" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<ellipse cx="280" cy="348" rx="96" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="280" y="354" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">count[c] ← pairs</text>
</svg>
