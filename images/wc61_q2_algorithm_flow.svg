<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="490" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次向右扫描 + 一次向左收缩</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">位数 m ≤ 10，整体线性时间；分支只有「没有下降」与「有下降」两条</text>

  <rect x="200" y="58" width="200" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">把 n 拆成数位数组 d[0..m−1]</text>

  <path d="M 300 96 L 300 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="112" width="320" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="132" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">向右扫描，找第一处下降 d[i−1] &gt; d[i]</text>
  <text x="300" y="149" text-anchor="middle" font-size="10" fill="#7788aa" filter="url(#rough2)">i 是下降区间的右端下标</text>

  <path d="M 300 156 L 300 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,170 392,206 300,242 208,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="211" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">有下降吗？</text>

  <path d="M 392 206 L 450 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="198" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="454" y="186" width="120" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="514" y="211" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">原样返回 n</text>

  <path d="M 300 242 L 300 256" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="308" y="253" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="120" y="258" width="360" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="278" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">p ← i − 1，向左跨过所有 d[p−1] == d[p]</text>
  <text x="300" y="297" text-anchor="middle" font-size="10" fill="#a06060" filter="url(#rough2)">与 d[p] 相同的数字块要整体借位，否则借位后仍不单调</text>

  <path d="M 300 308 L 300 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="324" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="349" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">d[p] ← d[p] − 1（向高位借 1）</text>

  <path d="M 300 364 L 300 378" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="380" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="405" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">d[p+1 .. m−1] ← 9</text>

  <path d="M 300 420 L 300 436" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="438" width="240" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="462" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">拼回整数返回（O(m)）</text>
</svg>
