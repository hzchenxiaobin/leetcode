<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：pref = [5,2,0,3,1] → arr = [5,7,2,3,2]</text>

  <!-- header row -->
  <g filter="url(#sk)"><rect x="40" y="52" width="90" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="85" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">i</text>
  <g filter="url(#sk)"><rect x="130" y="52" width="130" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="195" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">pref[i−1]</text>
  <g filter="url(#sk)"><rect x="260" y="52" width="130" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="325" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">pref[i]</text>
  <g filter="url(#sk)"><rect x="390" y="52" width="210" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="495" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a" filter="url(#sk)">arr[i] = 两式按位 ⊕</text>

  <!-- row 0 -->
  <g filter="url(#sk)"><rect x="40" y="86" width="90" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="85" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="130" y="86" width="130" height="40" rx="5" fill="#f4f4f4" stroke="#d0d0d0" stroke-width="1"/></g>
  <text x="195" y="111" text-anchor="middle" font-size="12" fill="#999" filter="url(#sk)">（无）</text>
  <g filter="url(#sk)"><rect x="260" y="86" width="130" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="325" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="390" y="86" width="210" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="495" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">arr[0] = 5</text>
  <text x="495" y="120" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">首元素直接抄</text>

  <!-- row 1 -->
  <g filter="url(#sk)"><rect x="40" y="126" width="90" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="85" y="151" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="130" y="126" width="130" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="195" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">5</text>
  <text x="195" y="161" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">101</text>
  <g filter="url(#sk)"><rect x="260" y="126" width="130" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="325" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <text x="325" y="161" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">010</text>
  <g filter="url(#sk)"><rect x="390" y="126" width="210" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="495" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#sk)">7 = 101⊕010 = 111</text>
  <text x="495" y="161" text-anchor="middle" font-size="10.5" fill="#8a6a2a" filter="url(#sk)">5 ⊕ 2 = 7</text>

  <!-- row 2 -->
  <g filter="url(#sk)"><rect x="40" y="166" width="90" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="85" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="130" y="166" width="130" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="195" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <text x="195" y="201" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">010</text>
  <g filter="url(#sk)"><rect x="260" y="166" width="130" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="325" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">0</text>
  <text x="325" y="201" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">000</text>
  <g filter="url(#sk)"><rect x="390" y="166" width="210" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="495" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#sk)">2 = 010⊕000 = 010</text>
  <text x="495" y="201" text-anchor="middle" font-size="10.5" fill="#8a6a2a" filter="url(#sk)">2 ⊕ 0 = 2</text>

  <!-- row 3 -->
  <g filter="url(#sk)"><rect x="40" y="206" width="90" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="85" y="231" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="130" y="206" width="130" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="195" y="225" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">0</text>
  <text x="195" y="241" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">000</text>
  <g filter="url(#sk)"><rect x="260" y="206" width="130" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="325" y="225" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <text x="325" y="241" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">011</text>
  <g filter="url(#sk)"><rect x="390" y="206" width="210" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="495" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#sk)">3 = 000⊕011 = 011</text>
  <text x="495" y="241" text-anchor="middle" font-size="10.5" fill="#8a6a2a" filter="url(#sk)">0 ⊕ 3 = 3</text>

  <!-- row 4 -->
  <g filter="url(#sk)"><rect x="40" y="246" width="90" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="85" y="271" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="130" y="246" width="130" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="195" y="265" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <text x="195" y="281" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">011</text>
  <g filter="url(#sk)"><rect x="260" y="246" width="130" height="40" rx="5" fill="#ffffff" stroke="#b0b8bf" stroke-width="1.2"/></g>
  <text x="325" y="265" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">1</text>
  <text x="325" y="281" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">001</text>
  <g filter="url(#sk)"><rect x="390" y="246" width="210" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="495" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#sk)">2 = 011⊕001 = 010</text>
  <text x="495" y="281" text-anchor="middle" font-size="10.5" fill="#8a6a2a" filter="url(#sk)">3 ⊕ 1 = 2</text>

  <!-- result strip -->
  <g filter="url(#sk)"><rect x="40" y="306" width="560" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="334" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">arr = [5, 7, 2, 3, 2]</text>

  <!-- verification -->
  <path d="M 320 350 L 320 376" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="40" y="378" width="560" height="102" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="320" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">回代验证：把 arr 重新累积成前缀异或</text>
  <text x="320" y="428" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">5 → 5⊕7=2 → ⊕2=0 → ⊕3=3 → ⊕2=1</text>
  <text x="320" y="452" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">逐项等于 pref = [5,2,0,3,1]　✓</text>
  <text x="320" y="472" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">（二进制列括号内为 3 位补齐表示）</text>
</svg>
