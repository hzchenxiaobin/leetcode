<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr_orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#78909c"/>
    </marker>
    <marker id="arr_purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="650" height="330" fill="#fafafa"/>

  <text x="325.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 逐位置演算（trips = [[2,1,5],[3,3,7]]）</text>
  <text x="325.0" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">diff[1] += 2，diff[5] -= 2，diff[3] += 3，diff[7] -= 3</text>

  <rect x="30" y="96" width="574" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">位置 p</text>
  <text x="169.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="227.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="285.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="343.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="401.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="459.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="517.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="575.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="85.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">本点上客</text>
  <text x="169.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="227.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="285.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="343.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="401.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="459.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="517.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="575.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <path d="M 30 152 L 604 152" stroke="#78909c" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <text x="85.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">本点下客</text>
  <text x="169.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="227.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="285.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="343.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="401.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="459.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="517.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="575.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <path d="M 30 180 L 604 180" stroke="#78909c" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <text x="85.0" y="198.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cur</text>
  <text x="169.0" y="198.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="227.0" y="198.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="285.0" y="198.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="343.0" y="198.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="401.0" y="198.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
