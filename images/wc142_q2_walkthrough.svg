  <text x="575.0" y="198.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <path d="M 30 208 L 604 208" stroke="#78909c" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <text x="85.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">≤ 4 ?</text>
  <text x="169.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">✓</text>
  <text x="227.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">✓</text>
  <text x="285.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">✓</text>
  <text x="343.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">✗</text>
  <text x="401.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">✗</text>
  <text x="459.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">✓</text>
  <text x="517.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">✓</text>
  <text x="575.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">✓</text>
  <path d="M 30 236 L 604 236" stroke="#78909c" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="96" width="574" height="140" fill="none" stroke="#78909c" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="30" y="250" width="588" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="42" y="270" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">cap = 4：p = 3, 4 处 cur = 5 超载 → false；cap = 5：全程 ≤ 5 → true。</text>
  <text x="24" y="314" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">注意 p = 3 同时发生「3 人上车」，而 p = 5 是「2 人下车」，两者不冲突。</text>
</svg>
