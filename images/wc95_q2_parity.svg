<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="380" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">奇偶分组：偶数下标一堆、奇数下标一堆，Alice 能「锁定」其中一整组</text>

  <!-- 两阶段：先取左端 -->
  <text x="30" y="62" font-size="12" fill="#446688" filter="url(#rough2)">第一步：Alice 取走左端（下标 0，偶数位）</text>
  <g>
    <rect x="30" y="74" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="54" y="98" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">0</text>
    <rect x="84" y="74" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="108" y="98" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">1</text>
    <rect x="138" y="74" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="162" y="98" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">2</text>
    <rect x="192" y="74" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="216" y="98" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">3</text>
    <rect x="246" y="74" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="270" y="98" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">4</text>
    <rect x="300" y="74" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="324" y="98" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">5</text>
  </g>
  <text x="372" y="98" font-size="11" fill="#4a7a3a" filter="url(#rough2)">绿 = 偶数位，蓝 = 奇数位</text>

  <!-- 剩余区间两端奇偶相反 -->
  <text x="30" y="152" font-size="12" fill="#b07d20" filter="url(#rough2)">取走 0 后，剩余区间两端是 1 与 n−1：n 为偶数 ⇒ 两者都是奇数位</text>
  <text x="30" y="174" font-size="11" fill="#666" filter="url(#rough2)">⇒ Bob 无论取哪端都只能拿奇数位；他取完后两端变成「一奇一偶」，Alice 取偶端，局面复原</text>

  <!-- 示意：两端一奇一偶 -->
  <g>
    <rect x="30" y="192" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="54" y="216" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">1</text>
    <rect x="84" y="192" width="48" height="36" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="108" y="216" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">…</text>
    <rect x="138" y="192" width="48" height="36" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="162" y="216" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">…</text>
    <rect x="192" y="192" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="216" y="216" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">k</text>
  </g>
  <text x="54" y="244" text-anchor="middle" font-size="10" fill="#2c4a63" filter="url(#rough2)">Bob 取完后的左端</text>
  <text x="216" y="244" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">Alice 要的偶端</text>
  <path d="M60 256 C120 276 170 276 210 256" stroke="#446688" stroke-width="1.5" fill="none"
        stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="136" y="290" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">一奇一偶 ⇒ Alice 总能抓到同奇偶的那端</text>

  <!-- 结论 -->
  <rect x="360" y="150" width="276" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="498" y="176" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">两组总和必不相等</text>
  <text x="498" y="200" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">sum(偶) + sum(奇) = 总数，且总数为奇数</text>
  <text x="498" y="222" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">⇒ 一组严格更大</text>
  <text x="498" y="242" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">⇒ Alice 锁定较大组，必胜</text>

  <rect x="360" y="268" width="276" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="498" y="294" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">于是本题答案恒为 true</text>
  <text x="498" y="318" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">DP 是「通用博弈解法」，</text>
  <text x="498" y="338" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">奇偶策略是本题的特化解</text>

  <text x="30" y="368" font-size="11" fill="#666" filter="url(#rough2)">前提：堆数为偶数、每堆为正、总数为奇数 —— 题目三条约束正好凑齐</text>
</svg>
