<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 5，mines = [[4,2]]，答案 2</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">左侧是输入网格（X 为雷），右侧是逐格取最小值后的阶数表</text>

  <text x="119" y="72" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">输入 grid</text>
  <text x="339" y="72" text-anchor="middle" font-size="10.5" fill="#3a6a40" font-weight="bold" filter="url(#rough2)">min 表（每格的阶数）</text>

  <!-- 左表列号 -->
  <text x="59" y="90" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="89" y="90" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="119" y="90" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="149" y="90" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="179" y="90" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="279" y="90" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="309" y="90" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="339" y="90" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="369" y="90" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="399" y="90" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <!-- 左表行号 -->
  <text x="38" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="38" y="142" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="38" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="38" y="202" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="38" y="232" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="258" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="258" y="142" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="258" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="258" y="202" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="258" y="232" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <!-- 左表：输入 grid，30px 格，x0=44 y0=96 -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="44" y="96" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="59" y="116" fill="#777">1</text>
    <rect x="74" y="96" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="89" y="116" fill="#777">1</text>
    <rect x="104" y="96" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="119" y="116" fill="#777">1</text>
    <rect x="134" y="96" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="149" y="116" fill="#777">1</text>
    <rect x="164" y="96" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="179" y="116" fill="#777">1</text>

    <rect x="44" y="126" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="59" y="146" fill="#777">1</text>
    <rect x="74" y="126" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="89" y="146" fill="#777">1</text>
    <rect x="104" y="126" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/><text x="119" y="146" fill="#3a5a30">1</text>
    <rect x="134" y="126" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="149" y="146" fill="#777">1</text>
    <rect x="164" y="126" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="179" y="146" fill="#777">1</text>

    <rect x="44" y="156" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="59" y="176" fill="#777">1</text>
    <rect x="74" y="156" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/><text x="89" y="176" fill="#3a5a30">1</text>
    <rect x="104" y="156" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="3"/><text x="119" y="176" fill="#8a6a20">1</text>
    <rect x="134" y="156" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/><text x="149" y="176" fill="#3a5a30">1</text>
    <rect x="164" y="156" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="179" y="176" fill="#777">1</text>

    <rect x="44" y="186" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="59" y="206" fill="#777">1</text>
    <rect x="74" y="186" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="89" y="206" fill="#777">1</text>
    <rect x="104" y="186" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/><text x="119" y="206" fill="#3a5a30">1</text>
    <rect x="134" y="186" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="149" y="206" fill="#777">1</text>
    <rect x="164" y="186" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="179" y="206" fill="#777">1</text>

    <rect x="44" y="216" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="59" y="236" fill="#777">1</text>
    <rect x="74" y="216" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="89" y="236" fill="#777">1</text>
    <rect x="104" y="216" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3"/><text x="119" y="236" fill="#b85450" font-weight="bold">X</text>
    <rect x="134" y="216" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="149" y="236" fill="#777">1</text>
    <rect x="164" y="216" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="179" y="236" fill="#777">1</text>
  </g>

  <!-- 右表：min 值，x0=264 y0=96 -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="264" y="96" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="279" y="116" fill="#777">1</text>
    <rect x="294" y="96" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="309" y="116" fill="#777">1</text>
    <rect x="324" y="96" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="339" y="116" fill="#777">1</text>
    <rect x="354" y="96" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="369" y="116" fill="#777">1</text>
    <rect x="384" y="96" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="399" y="116" fill="#777">1</text>

    <rect x="264" y="126" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="279" y="146" fill="#777">1</text>
    <rect x="294" y="126" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="309" y="146" fill="#3a5a30">2</text>
    <rect x="324" y="126" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="339" y="146" fill="#3a5a30">2</text>
    <rect x="354" y="126" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="369" y="146" fill="#3a5a30">2</text>
    <rect x="384" y="126" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="399" y="146" fill="#777">1</text>

    <rect x="264" y="156" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="279" y="176" fill="#777">1</text>
    <rect x="294" y="156" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="309" y="176" fill="#3a5a30">2</text>
    <rect x="324" y="156" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="3"/><text x="339" y="176" fill="#8a6a20" font-weight="bold">2</text>
    <rect x="354" y="156" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="369" y="176" fill="#3a5a30">2</text>
    <rect x="384" y="156" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="399" y="176" fill="#777">1</text>

    <rect x="264" y="186" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="279" y="206" fill="#777">1</text>
    <rect x="294" y="186" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="309" y="206" fill="#3a5a30">2</text>
    <rect x="324" y="186" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="339" y="206" fill="#b85450">1</text>
    <rect x="354" y="186" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="369" y="206" fill="#3a5a30">2</text>
    <rect x="384" y="186" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="399" y="206" fill="#777">1</text>

    <rect x="264" y="216" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="279" y="236" fill="#777">1</text>
    <rect x="294" y="216" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="309" y="236" fill="#777">1</text>
    <rect x="324" y="216" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3"/><text x="339" y="236" fill="#b85450" font-weight="bold">0</text>
    <rect x="354" y="216" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="369" y="236" fill="#777">1</text>
    <rect x="384" y="216" width="30" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3"/><text x="399" y="236" fill="#777">1</text>
  </g>

  <!-- 中心格四臂数值 -->
  <text x="440" y="112" font-size="10" fill="#3a4a66" filter="url(#rough2)">中心 (2,2)：</text>
  <text x="440" y="132" font-size="10" fill="#555" filter="url(#rough2)">up = 3</text>
  <text x="440" y="152" font-size="10" fill="#555" filter="url(#rough2)">down = 2</text>
  <text x="440" y="172" font-size="10" fill="#555" filter="url(#rough2)">left = 3</text>
  <text x="440" y="192" font-size="10" fill="#555" filter="url(#rough2)">right = 3</text>
  <text x="440" y="212" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">min = 2</text>

  <path d="M 119 266 L 119 250" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="119" y="278" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">雷把向下臂截断</text>

  <text x="339" y="278" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">共 8 格取到 2，没有格子能到 3</text>

  <rect x="30" y="292" width="500" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="314" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">down[2][2] 只有 2：从 (2,2) 向下是 (3,2)=1、(4,2)=雷，第三步就断</text>
  <text x="44" y="334" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">若 (4,2) 不是雷，四臂都为 3，答案升到 3 —— 正好等于上界 ⌈n/2⌉</text>

  <text x="280" y="368" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">min 表的最大值 2 就是答案；每格只需看自己的四张表，互不干扰</text>
</svg>
