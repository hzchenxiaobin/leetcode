<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="452" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n = 8，p = 1，banned = [4]，k = 4 ⇒ ans = [3, 0, 1, 2, −1, 2, 3, −1]</text>

  <!-- final answer array -->
  <rect x="44" y="36" width="52" height="32" rx="4" fill="#ede7f6" stroke="#7a5c9e" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="57" text-anchor="middle" font-size="13" fill="#4a3f6e" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="96" y="36" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="122" y="57" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="148" y="36" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174" y="57" text-anchor="middle" font-size="13" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="200" y="36" width="52" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="57" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="252" y="36" width="52" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="57" text-anchor="middle" font-size="13" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="304" y="36" width="52" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="57" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="356" y="36" width="52" height="32" rx="4" fill="#ede7f6" stroke="#7a5c9e" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="57" text-anchor="middle" font-size="13" fill="#4a3f6e" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="408" y="36" width="52" height="32" rx="4" fill="#eeeeee" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="434" y="57" text-anchor="middle" font-size="13" fill="#777777" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- indices -->
  <text x="70" y="82" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="122" y="82" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="174" y="82" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="226" y="82" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="278" y="82" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="330" y="82" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="382" y="82" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <text x="434" y="82" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>

  <!-- tags -->
  <text x="122" y="96" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">起点 p</text>
  <text x="278" y="96" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">banned</text>
  <text x="434" y="96" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">不可达</text>

  <!-- legend -->
  <rect x="472" y="40" width="12" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="490" y="50" font-size="9.5" fill="#555" filter="url(#rough2)">0 步</text>
  <rect x="472" y="58" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="490" y="68" font-size="9.5" fill="#555" filter="url(#rough2)">1 步</text>
  <rect x="472" y="76" width="12" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="490" y="86" font-size="9.5" fill="#555" filter="url(#rough2)">2 步</text>
  <rect x="472" y="94" width="12" height="12" rx="3" fill="#ede7f6" stroke="#7a5c9e" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="490" y="104" font-size="9.5" fill="#555" filter="url(#rough2)">3 步</text>
  <rect x="472" y="112" width="12" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="490" y="122" font-size="9.5" fill="#555" filter="url(#rough2)">banned</text>
  <rect x="472" y="130" width="12" height="12" rx="3" fill="#eeeeee" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="490" y="140" font-size="9.5" fill="#555" filter="url(#rough2)">−1 不可达</text>

  <!-- BFS tree section -->
  <text x="252" y="116" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">BFS 逐层扩展（k 偶 ⇒ 每层翻转奇偶）</text>

  <text x="40" y="138" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">d=0</text>
  <text x="40" y="166" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">d=1</text>
  <text x="40" y="194" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">d=2</text>
  <text x="40" y="222" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">d=3</text>

  <path d="M 252 144 L 252 152" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 244 172 L 192 180" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 260 172 L 312 180" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 176 200 L 122 208" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 196 200 L 248 208" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="234" y="124" width="36" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="252" y="138" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="234" y="152" width="36" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="252" y="166" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="168" y="180" width="36" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="194" text-anchor="middle" font-size="11.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="300" y="180" width="36" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="194" text-anchor="middle" font-size="11.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="102" y="208" width="36" height="20" rx="4" fill="#ede7f6" stroke="#7a5c9e" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="222" text-anchor="middle" font-size="11.5" fill="#4a3f6e" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="234" y="208" width="36" height="20" rx="4" fill="#ede7f6" stroke="#7a5c9e" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="252" y="222" text-anchor="middle" font-size="11.5" fill="#4a3f6e" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- right note box -->
  <rect x="352" y="144" width="104" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="404" y="162" text-anchor="middle" font-size="10" fill="#7a5c1e" filter="url(#rough2)">k = 4（偶数）</text>
  <text x="404" y="178" text-anchor="middle" font-size="10" fill="#7a5c1e" filter="url(#rough2)">每层翻转奇偶：</text>
  <text x="404" y="194" text-anchor="middle" font-size="10" fill="#7a5c1e" filter="url(#rough2)">奇→偶→奇→偶</text>
  <text x="404" y="210" text-anchor="middle" font-size="10" fill="#7a5c1e" filter="url(#rough2)">4 被 banned，</text>
  <text x="404" y="226" text-anchor="middle" font-size="10" fill="#7a5c1e" filter="url(#rough2)">开局即删出候选</text>

  <!-- step table -->
  <rect x="36" y="244" width="506" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="260" text-anchor="middle" font-size="11" fill="#33475e" font-weight="bold" filter="url(#rough2)">出队 i</text>
  <text x="170" y="260" text-anchor="middle" font-size="11" fill="#33475e" font-weight="bold" filter="url(#rough2)">s ∈ [s_lo, s_hi]</text>
  <text x="300" y="260" text-anchor="middle" font-size="11" fill="#33475e" font-weight="bold" filter="url(#rough2)">一步落点集</text>
  <text x="460" y="260" text-anchor="middle" font-size="11" fill="#33475e" font-weight="bold" filter="url(#rough2)">新入队</text>

  <path d="M 36 296 L 542 296" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="286" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="170" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 1]</text>
  <text x="300" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2, 4}</text>
  <text x="460" y="286" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">2（4 是 banned）</text>

  <path d="M 36 324 L 542 324" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="170" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 2]</text>
  <text x="300" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1, 3, 5}</text>
  <text x="460" y="314" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">3, 5</text>

  <path d="M 36 352 L 542 352" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="170" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 3]</text>
  <text x="300" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0, 2, 4, 6}</text>
  <text x="460" y="342" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">0, 6（2 已访问）</text>

  <path d="M 36 380 L 542 380" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="370" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="170" y="370" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2, 4]</text>
  <text x="300" y="370" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2, 4, 6}</text>
  <text x="460" y="370" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—（均已处理）</text>

  <path d="M 36 408 L 542 408" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="398" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="170" y="398" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 0]</text>
  <text x="300" y="398" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3}</text>
  <text x="460" y="398" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <text x="76" y="426" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="170" y="426" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3, 4]</text>
  <text x="300" y="426" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3, 5}</text>
  <text x="460" y="426" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <text x="280" y="446" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">位置 7 不可达：偶数源点 0/2 的窗口够不着，4 被 banned，6 的窗口越界 ⇒ ans[7] = −1</text>
</svg>
