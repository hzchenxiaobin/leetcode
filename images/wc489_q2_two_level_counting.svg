<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 415"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="415" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：两级计数——先数「值出现几次」，再数「频率被几个值共用」</text>
  <path d="M 90 38 Q 320 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 原数组 -->
  <text x="208" y="73" text-anchor="end" font-size="11.5" fill="#888" filter="url(#rough2)">nums =</text>
  <rect x="224" y="52" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="274" y="52" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="324" y="52" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="374" y="52" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="73" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">20</text>
  <text x="295" y="73" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="345" y="73" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">30</text>
  <text x="395" y="73" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">30</text>

  <path d="M320,88 L320,102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="100" font-size="10" fill="#888" filter="url(#rough2)">数一遍</text>

  <!-- 第一级：cnt -->
  <rect x="110" y="108" width="420" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">第一遍计数 cnt：值 → 出现次数</text>
  <rect x="145" y="138" width="110" height="28" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="265" y="138" width="110" height="28" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="385" y="138" width="110" height="28" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="157" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" filter="url(#rough2)">20 → 1</text>
  <text x="320" y="157" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" filter="url(#rough2)">10 → 1</text>
  <text x="440" y="157" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" filter="url(#rough2)">30 → 2</text>

  <path d="M320,180 L320,194" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="192" font-size="10" fill="#888" filter="url(#rough2)">再数一遍</text>

  <!-- 第二级：freqCnt -->
  <rect x="110" y="200" width="420" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">第二遍计数 freqCnt：频率 → 有几个不同的值</text>
  <rect x="128" y="230" width="186" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="249" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">f=1 → 2 个值 {20,10} ✗</text>
  <rect x="326" y="230" width="186" height="28" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="419" y="249" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">f=2 → 1 个值 {30} ✓</text>

  <path d="M320,272 L320,286" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="284" font-size="10" fill="#888" filter="url(#rough2)">查表判定</text>

  <!-- 判定准则 -->
  <rect x="90" y="290" width="460" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">判定：freqCnt[ cnt[x] ] == 1 ⟺ x 的频率被「独占」</text>
  <text x="320" y="328" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">f = 1 被两个值共用 ✗ ； f = 2 仅属于 30 ✓</text>

  <!-- 红色警示 -->
  <rect x="90" y="344" width="460" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="361" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ freqCnt 数的是「不同的值」的个数，不是元素出现次数</text>

  <!-- 蓝色提示 -->
  <rect x="90" y="378" width="460" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="395" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">同值元素判定相同 → 从左到右扫 nums，第一个命中即答案</text>
</svg>
