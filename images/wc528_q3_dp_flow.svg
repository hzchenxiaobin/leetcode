<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="620" height="430" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：从右往左递推</text>
  <path d="M 150 40 Q 310 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="310" y="60" text-anchor="middle" font-size="12" fill="#666">j 取 i+1 或 i+2；加减号由 s mod 3 决定</text>

  <g filter="url(#sk)">
    <rect x="70" y="76" width="300" height="44" rx="9" fill="#eceff1" stroke="#78909c" stroke-width="1.6"/>
    <rect x="70" y="146" width="300" height="50" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="70" y="216" width="300" height="54" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="70" y="290" width="300" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="70" y="354" width="300" height="44" rx="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="430" y="354" width="160" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <text x="220" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">初始化 dp[n] ＝ 0，i ＝ n − 1</text>
  <path d="M 220 120 L 220 144" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>

  <text x="220" y="168" text-anchor="middle" font-size="12" fill="#2f4f6f">s₁ ＝ nums[i]</text>
  <text x="220" y="186" text-anchor="middle" font-size="12" fill="#2f4f6f">s₂ ＝ nums[i] + nums[i+1]</text>
  <path d="M 220 196 L 220 214" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>

  <text x="220" y="238" text-anchor="middle" font-size="12" fill="#2f4f6f">c₁ ＝ s₁ ± dp[i+1]</text>
  <text x="220" y="256" text-anchor="middle" font-size="12" fill="#2f4f6f">c₂ ＝ s₂ ± dp[i+2]（仅 i+1 &lt; n）</text>
  <path d="M 220 270 L 220 288" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>

  <text x="220" y="310" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">dp[i] ＝ max(c₁, c₂)</text>
  <path d="M 220 334 L 220 352" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>

  <text x="220" y="381" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">i == 0 ?</text>
  <path d="M 370 376 L 426 376" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="398" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <text x="510" y="381" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">返回 dp[0]</text>

  <path d="M 70 376 L 34 376 L 34 171 L 66 171" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="45" y="349" text-anchor="start" font-size="11" fill="#b85450">否：i −= 1，回到取和</text>

  <g filter="url(#sk)">
    <rect x="426" y="272" width="168" height="62" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="510" y="293" text-anchor="middle" font-size="11" fill="#8f3830">s 被 3 整除取「−」</text>
  <text x="510" y="311" text-anchor="middle" font-size="11" fill="#8f3830">否则取「＋」</text>
  <path d="M 510 334 L 510 350" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#sk)"/>
</svg>
