<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 376"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="376" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">归一化：本地名去点、截断加号，域名原样保留</text>
  <rect x="60" y="60" width="300" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210.0" y="86.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">local 部分</text>
  <rect x="380" y="60" width="220" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490.0" y="86.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">domain 部分</text>
  <path d="M 200 108 L 200 138" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="132" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">两条规则</text>
  <rect x="60" y="140" width="300" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210.0" y="164.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">规则 1：删除所有 "."</text>
  <rect x="60" y="190" width="300" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210.0" y="214.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">规则 2：遇到 '+' 后全部丢弃</text>
  <text x="510" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">不适用任何规则</text>
  <text x="510" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（保留大小写与点）</text>
  <rect x="60" y="250" width="300" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210.0" y="274.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">归一化本地名</text>
  <rect x="380" y="250" width="220" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490.0" y="274.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">归一化域名</text>
  <text x="330" y="320" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">local + "@" + domain  →  放进集合去重</text>
  <text x="330" y="356" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">两个规则只作用于 @ 之前的部分；域名里的 "." 与 "+" 一律保留</text>
</svg>
