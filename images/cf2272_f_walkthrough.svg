<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="400" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：链 1−2−3−4−5（样例 4，Bob 可选 {2, 4}）</text>
  <path d="M 150 42 Q 390 49 630 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="390" y="64" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">L = 轮到的人必败，W = 必胜；tot[v] 就是 c[v]：v 的邻居里「冷点」的个数</text>

  <!-- 表头 -->
  <rect x="60" y="78" width="660" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="99" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">v</text>
  <text x="150" y="99" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">deg</text>
  <text x="215" y="99" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">down</text>
  <text x="285" y="99" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">cold</text>
  <text x="355" y="99" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">up</text>
  <text x="435" y="99" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">tot = c</text>
  <text x="600" y="99" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">deg 偶 且 tot = 0</text>

  <!-- 行底色 -->
  <rect x="60" y="146" width="660" height="36" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <rect x="60" y="218" width="660" height="36" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>

  <!-- 表格线 -->
  <rect x="60" y="78" width="660" height="212" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 60 110 L 720 110" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 60 146 L 720 146" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 60 182 L 720 182" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 60 218 L 720 218" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 60 254 L 720 254" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 120 78 L 120 290" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 180 78 L 180 290" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 250 78 L 250 290" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 320 78 L 320 290" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 390 78 L 390 290" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 480 78 L 480 290" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 第 1 行 -->
  <text x="90" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="215" y="132" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">W</text>
  <text x="285" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="355" y="132" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="435" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="600" y="132" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 第 2 行：Bob 根 -->
  <text x="90" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="150" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="215" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">L</text>
  <text x="285" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="355" y="168" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">W</text>
  <text x="435" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="600" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">✓ Bob</text>

  <!-- 第 3 行 -->
  <text x="90" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="150" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="215" y="204" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">W</text>
  <text x="285" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="355" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">L</text>
  <text x="435" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="600" y="204" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 第 4 行：Bob 根 -->
  <text x="90" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="150" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="215" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">L</text>
  <text x="285" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="355" y="240" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">W</text>
  <text x="435" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="600" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">✓ Bob</text>

  <!-- 第 5 行 -->
  <text x="90" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="150" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="215" y="276" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">W</text>
  <text x="285" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="355" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">L</text>
  <text x="435" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="600" y="276" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 结论 -->
  <rect x="40" y="304" width="700" height="84" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="330" font-size="12" fill="#8a6015" filter="url(#rough2)">r = 2：两侧都不是冷孩子（m 偶、tot = 0）→ Alice 只能删一侧，Bob 立刻删另一侧 → Alice 输。</text>
  <text x="60" y="356" font-size="12" fill="#8a6015" filter="url(#rough2)">r = 3：两侧都是冷孩子（tot = 2）→ Alice 换根进 2，Bob 删袋子或删 1 都输 → Alice 赢。</text>
  <text x="60" y="380" font-size="12" fill="#b85450" filter="url(#rough2)">于是答案恰为 2 与 4，与官方样例输出一致。</text>
</svg>
