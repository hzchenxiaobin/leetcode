<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一轮线性扫描，命中 k 场连胜立即返回</text>

  <rect x="210" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">champion = 0, wins = 0</text>

  <polygon points="310,104 400,128 310,152 220,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="133" text-anchor="middle" font-size="12" fill="#a06c10" filter="url(#rough2)">i &lt; n ?</text>

  <rect x="432" y="108" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="517" y="133" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">返回 champion</text>

  <polygon points="310,196 405,232 310,268 215,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="224" text-anchor="middle" font-size="12" fill="#a06c10" filter="url(#rough2)">skills[i] &gt;</text>
  <text x="310" y="242" text-anchor="middle" font-size="12" fill="#a06c10" filter="url(#rough2)">skills[champion] ?</text>

  <rect x="20" y="208" width="180" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="228" text-anchor="middle" font-size="12" fill="#8a2f2c" filter="url(#rough2)">champion = i</text>
  <text x="110" y="246" text-anchor="middle" font-size="12" fill="#8a2f2c" filter="url(#rough2)">wins = 1</text>

  <rect x="420" y="208" width="180" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="510" y="237" text-anchor="middle" font-size="12" fill="#2f4c6b" filter="url(#rough2)">wins += 1</text>

  <polygon points="310,300 390,330 310,360 230,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="335" text-anchor="middle" font-size="12" fill="#a06c10" filter="url(#rough2)">wins ≥ k ?</text>

  <rect x="420" y="310" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="335" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">返回 champion</text>

  <rect x="240" y="386" width="140" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="411" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">i += 1</text>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.8" fill="none">
    <path d="M 310 86 L 310 102" marker-end="url(#arr)"/>
    <path d="M 310 154 L 310 194" marker-end="url(#arr)"/>
    <path d="M 402 128 L 430 128" marker-end="url(#arr)"/>
    <path d="M 213 232 L 202 232" marker-end="url(#arrR)"/>
    <path d="M 407 232 L 418 232" marker-end="url(#arr)"/>
    <path d="M 110 258 L 110 330 L 226 330" marker-end="url(#arr)"/>
    <path d="M 510 258 L 510 330 L 392 330" marker-end="url(#arr)"/>
    <path d="M 392 330 L 418 330" marker-end="url(#arr)"/>
    <path d="M 310 362 L 310 384" marker-end="url(#arr)"/>
    <path d="M 238 406 L 140 406 L 140 128 L 216 128" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="320" y="178">是</text>
    <text x="410" y="120">否</text>
    <text x="186" y="222" fill="#b85450">是</text>
    <text x="402" y="224">否</text>
    <text x="400" y="322" fill="#2d5a22">是</text>
    <text x="320" y="378">否</text>
    <text x="150" y="396" fill="#666">下一轮</text>
  </g>
</svg>
