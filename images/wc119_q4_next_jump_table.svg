  <text x="30" y="222" font-size="11.5" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">nxtOdd（值升序 + 栈）</text>
  <rect x="30" y="232" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="56.0" y="255.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="82" y="232" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="108.0" y="255.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="134" y="232" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="160.0" y="255.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
