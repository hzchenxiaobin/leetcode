  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">按值排序后，第一个「下标更大」的元素就是题目要的最近落点</text>
  <text x="30" y="72" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">arr</text>
