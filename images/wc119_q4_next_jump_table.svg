  <text x="30" y="300" font-size="11.5" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">nxtEven（值降序 + 栈）</text>
  <rect x="30" y="310" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="56.0" y="333.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-1</text>
  <rect x="82" y="310" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="108.0" y="333.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="134" y="310" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="160.0" y="333.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-1</text>
  <rect x="186" y="310" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="212.0" y="333.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-1</text>
  <rect x="238" y="310" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="264.0" y="333.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-1</text>
  <rect x="330" y="82" width="200" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="340" y="103" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">排序键</text><text x="340" y="118.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">奇数跳: (值↑, 下标↑)</text><text x="340" y="134.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">偶数跳: (值↓, 下标↑)</text><text x="340" y="150.85" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">第一个右侧元素即落点</text>
  <rect x="330" y="208" width="200" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="340" y="229" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">栈顶是最小下标</text><text x="340" y="244.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">k &gt; 栈顶 ⇒ 弹出即定案</text>
  <rect x="330" y="300" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="340" y="321" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">每个下标只进出栈一次</text>
