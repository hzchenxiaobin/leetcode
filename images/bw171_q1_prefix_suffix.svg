<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">同一个串的两个方向切片：num = 23</text>

  <!-- 数字格 -->
  <rect x="96" y="56" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="85" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">2</text>
  <rect x="160" y="56" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="85" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">3</text>
  <text x="126" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">s[0]</text>
  <text x="190" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">s[1]</text>

  <!-- 前缀 -->
  <path d="M96,132 L96,142 L156,142 L156,132" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="126" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k=1 前缀 2 ✓</text>

  <path d="M96,176 L96,186 L220,186 L220,176" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="158" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k=2 前缀 23 ✓</text>

  <!-- 后缀 -->
  <path d="M164,218 L164,228 L220,228 L220,218" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="290" y="228" font-size="11" fill="#d6a040" filter="url(#rough2)">k=1 后缀 3 ✓</text>

  <path d="M96,242 L96,252 L220,252 L220,242" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="290" y="252" font-size="11" fill="#d6a040" filter="url(#rough2)">k=2 后缀 23 ✓</text>

  <!-- 结论 -->
  <rect x="330" y="56" width="150" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="405" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2L 个候选数</text>
  <text x="405" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">全部要是质数</text>
  <text x="405" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">k=L 时前后缀重合</text>

  <rect x="330" y="140" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">num = 39：后缀 9</text>
  <text x="405" y="182" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">= 3²，k=1 就失败</text>

  <rect x="330" y="212" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">提前退出省时间</text>
  <text x="405" y="248" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">任一失败即 false</text>
</svg>
