<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="45"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 走查：nums = [1, 2, −1, −1, −1] → ans = [2, 1, −1]</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="36" y="52" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="66" y="72" text-anchor="middle" font-size="12" fill="#333">步</text>
    <rect x="96" y="52" width="58" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="125" y="72" text-anchor="middle" font-size="12" fill="#333">x</text>
    <rect x="154" y="52" width="110" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="209" y="72" text-anchor="middle" font-size="12" fill="#333">seen（顶在前）</text>
    <rect x="264" y="52" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="290" y="72" text-anchor="middle" font-size="12" fill="#333">k</text>
    <rect x="316" y="52" width="80" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="356" y="72" text-anchor="middle" font-size="12" fill="#333">取 seen[k−1]</text>
    <rect x="396" y="52" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="440" y="72" text-anchor="middle" font-size="12" fill="#333">ans</text>
  </g>

  <!-- 行 1 -->
  <g filter="url(#rough2)">
    <rect x="36" y="86" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="66" y="105" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="96" y="86" width="58" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="125" y="105" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="154" y="86" width="110" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="209" y="105" text-anchor="middle" font-size="12" fill="#333">[1]</text>
    <rect x="264" y="86" width="52" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="290" y="105" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="316" y="86" width="80" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="356" y="105" text-anchor="middle" font-size="12" fill="#888">—</text>
    <rect x="396" y="86" width="88" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="440" y="105" text-anchor="middle" font-size="12" fill="#333">[]</text>
  </g>

  <!-- 行 2 -->
  <g filter="url(#rough2)">
    <rect x="36" y="118" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="66" y="137" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="96" y="118" width="58" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="125" y="137" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="154" y="118" width="110" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="209" y="137" text-anchor="middle" font-size="12" fill="#333">[2, 1]</text>
    <rect x="264" y="118" width="52" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="290" y="137" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="316" y="118" width="80" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="356" y="137" text-anchor="middle" font-size="12" fill="#888">—</text>
    <rect x="396" y="118" width="88" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="440" y="137" text-anchor="middle" font-size="12" fill="#333">[]</text>
  </g>

  <!-- 行 3：第一个 -1 -->
  <g filter="url(#rough2)">
    <rect x="36" y="150" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="66" y="169" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="96" y="150" width="58" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="125" y="169" text-anchor="middle" font-size="12" fill="#333">−1</text>
    <rect x="154" y="150" width="110" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="209" y="169" text-anchor="middle" font-size="12" fill="#333">[2, 1]</text>
    <rect x="264" y="150" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="290" y="169" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="316" y="150" width="80" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="356" y="169" text-anchor="middle" font-size="12" fill="#333">2 ✓</text>
    <rect x="396" y="150" width="88" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="440" y="169" text-anchor="middle" font-size="12" fill="#333">[2]</text>
  </g>

  <!-- 行 4 -->
  <g filter="url(#rough2)">
    <rect x="36" y="182" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="66" y="201" text-anchor="middle" font-size="12" fill="#333">4</text>
    <rect x="96" y="182" width="58" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="125" y="201" text-anchor="middle" font-size="12" fill="#333">−1</text>
    <rect x="154" y="182" width="110" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="209" y="201" text-anchor="middle" font-size="12" fill="#333">[2, 1]</text>
    <rect x="264" y="182" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="290" y="201" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="316" y="182" width="80" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="356" y="201" text-anchor="middle" font-size="12" fill="#333">1 ✓</text>
    <rect x="396" y="182" width="88" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="440" y="201" text-anchor="middle" font-size="12" fill="#333">[2, 1]</text>
  </g>

  <!-- 行 5：越界 -->
  <g filter="url(#rough2)">
    <rect x="36" y="214" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="66" y="233" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="96" y="214" width="58" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="125" y="233" text-anchor="middle" font-size="12" fill="#333">−1</text>
    <rect x="154" y="214" width="110" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="209" y="233" text-anchor="middle" font-size="12" fill="#333">[2, 1]</text>
    <rect x="264" y="214" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="290" y="233" text-anchor="middle" font-size="12" fill="#b85450">3</text>
    <rect x="316" y="214" width="80" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="356" y="233" text-anchor="middle" font-size="12" fill="#b85450">越界!</text>
    <rect x="396" y="214" width="88" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="440" y="233" text-anchor="middle" font-size="12" fill="#333">[2,1,−1]</text>
  </g>

  <!-- 示例 2 -->
  <g filter="url(#rough2)">
    <rect x="36" y="262" width="448" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="56" y="288" font-size="13" fill="#4a7a3a">示例 2：nums = [1, −1, 2, −1, −1] → ans = [1, 2, 1]</text>
    <text x="68" y="310" font-size="12.5" fill="#555">中间夹了正整数 2，k 被清零重数：第 4 步 k=1 取栈顶 2，第 5 步 k=2 取次顶 1</text>
    <text x="68" y="330" font-size="12" fill="#888">对比示例 1：连续三个 −1 把栈「问穿」，第 5 步只能补 −1</text>
  </g>
</svg>
