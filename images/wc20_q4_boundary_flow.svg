<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每条「缝隙」的净流量是唯一确定的</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">令 avg = 总件数 / n，d_i = a_i − avg，前缀 S_i = d_0 + d_1 + … + d_i</text>

  <g filter="url(#rough2)">
    <rect x="105" y="80" width="90" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="150" y="98" text-anchor="middle" font-size="9.5" fill="#556" >机器 0</text>
    <text x="150" y="124" text-anchor="middle" font-size="18" fill="#22334a">1</text>
    <text x="150" y="139" text-anchor="middle" font-size="9.5" fill="#b85450">d₀ = −1</text>

    <rect x="265" y="80" width="90" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="310" y="98" text-anchor="middle" font-size="9.5" fill="#556">机器 1</text>
    <text x="310" y="124" text-anchor="middle" font-size="18" fill="#22334a">0</text>
    <text x="310" y="139" text-anchor="middle" font-size="9.5" fill="#b85450">d₁ = −2</text>

    <rect x="425" y="80" width="90" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="470" y="98" text-anchor="middle" font-size="9.5" fill="#556">机器 2</text>
    <text x="470" y="124" text-anchor="middle" font-size="18" fill="#22334a">5</text>
    <text x="470" y="139" text-anchor="middle" font-size="9.5" fill="#4a7a3a">d₂ = +3</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 258 112 L 203 112" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="230" y="105" text-anchor="middle" font-size="10" fill="#b85450">S₀ = −1</text>
    <path d="M 418 112 L 363 112" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="390" y="105" text-anchor="middle" font-size="10" fill="#b85450">S₁ = −3</text>
  </g>

  <g filter="url(#rough2)" font-size="9.8" fill="#555">
    <text x="230" y="163" text-anchor="middle">缝隙 0</text>
    <text x="390" y="163" text-anchor="middle">缝隙 1</text>
    <text x="310" y="186" text-anchor="middle">S_i &gt; 0：左边净多，要向右搬 ｜ S_i &lt; 0：右边净多，要向左搬</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="202" width="500" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="310" y="224" text-anchor="middle" font-size="12" fill="#2f5426" font-weight="bold">答案 = max( max_i |S_i| , max_i d_i )</text>
    <text x="310" y="243" text-anchor="middle" font-size="9.8" fill="#3f5a36">缝隙决定「搬多少趟」，机器决定「每趟最多送几件」，两者取最大</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="272" width="225" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="182" y="292" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">下界 ①：缝隙吞吐</text>
    <text x="182" y="310" text-anchor="middle" font-size="9.5" fill="#555">每步每件衣服最多跨 1 条缝隙</text>
    <text x="182" y="326" text-anchor="middle" font-size="9.5" fill="#555">⇒ 缝隙 i 至少要 |S_i| 步</text>

    <rect x="325" y="272" width="225" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
    <text x="437" y="292" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">下界 ②：机器出件</text>
    <text x="437" y="310" text-anchor="middle" font-size="9.5" fill="#555">每台机器每步最多送出 1 件</text>
    <text x="437" y="326" text-anchor="middle" font-size="9.5" fill="#555">⇒ 盈余 d_i &gt; 0 的机器至少要 d_i 步</text>
  </g>

  <text x="310" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">例：machines = [1,0,5]，avg = 2 ⇒ d = [−1,−2,3]，S = [−1,−3] ⇒ 答案 = max(3, 3) = 3</text>
</svg>
