<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：nums = [3,1,9,6]，m = 3，k = 0</text>
  <text x="40" y="52" font-size="11.5" fill="#555">好元素（%3==0）：3、9、6 → 0/1 序列 [1,0,1,1]，前缀和 s = [0,1,1,2,3]</text>

  <!-- 表头 -->
  <rect x="40" y="72" width="468" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">j</text>
  <text x="112" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s[j]</text>
  <text x="174" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">target</text>
  <text x="288" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">查询前哈希表 {余数:次数}</text>
  <text x="414" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">累加</text>
  <text x="484" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans</text>

  <!-- 行 1 -->
  <rect x="40" y="100" width="468" height="36" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="123" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="112" y="123" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="174" y="123" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="288" y="123" text-anchor="middle" font-size="11.5" fill="#333">{0:1}</text>
  <text x="414" y="123" text-anchor="middle" font-size="12" fill="#888">+0</text>
  <text x="484" y="123" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- 行 2（命中，绿色高亮） -->
  <rect x="40" y="136" width="468" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="159" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="112" y="159" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="174" y="159" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="288" y="159" text-anchor="middle" font-size="11.5" fill="#333">{0:1, 1:1}</text>
  <text x="414" y="159" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1（i=1）</text>
  <text x="484" y="159" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- 行 3 -->
  <rect x="40" y="172" width="468" height="36" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="195" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="112" y="195" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="174" y="195" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="288" y="195" text-anchor="middle" font-size="11.5" fill="#333">{0:1, 1:2}</text>
  <text x="414" y="195" text-anchor="middle" font-size="12" fill="#888">+0</text>
  <text x="484" y="195" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- 行 4（命中，绿色高亮） -->
  <rect x="40" y="208" width="468" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="231" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="112" y="231" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="174" y="231" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="288" y="231" text-anchor="middle" font-size="11.5" fill="#333">{0:1, 1:2, 2:1}</text>
  <text x="414" y="231" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1（i=0）</text>
  <text x="484" y="231" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- 列分隔线 -->
  <line x1="84" y1="100" x2="84" y2="244" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="140" y1="100" x2="140" y2="244" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="208" y1="100" x2="208" y2="244" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="368" y1="100" x2="368" y2="244" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="100" x2="460" y2="244" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 命中子数组 -->
  <text x="40" y="272" font-size="12" fill="#555" font-weight="bold">两个 +1 对应的命中子数组：</text>
  <rect x="40" y="284" width="232" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="156" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i=1, j=2 → nums[1..1] = [1]</text>
  <text x="156" y="330" text-anchor="middle" font-size="11" fill="#333">cnt = s[2]−s[1] = 0，0 % 3 == 0 ✓</text>
  <rect x="292" y="284" width="232" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="408" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i=0, j=4 → nums[0..3] = [3,1,9,6]</text>
  <text x="408" y="330" text-anchor="middle" font-size="11" fill="#333">cnt = s[4]−s[0] = 3，3 % 3 == 0 ✓</text>

  <text x="40" y="366" font-size="11" fill="#888">查询时表中恰好只含 i &lt; j 的前缀余数 → 每对 (i, j) 不重不漏地统计一次</text>
  <text x="40" y="386" font-size="11" fill="#888">最终 ans = 2，与示例输出一致</text>
</svg>
