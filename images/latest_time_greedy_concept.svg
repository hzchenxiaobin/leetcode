<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">逐位贪心：从高位到低位，每位取「合法最大」</text>
  <path d="M 180 42 Q 340 52 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- coupling arcs above boxes -->
  <g filter="url(#sk)">
    <path d="M 104 90 Q 158 56 212 90" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" fill="none"/>
  </g>
  <text x="158" y="50" text-anchor="middle" font-size="11" fill="#b03a3a">小时 ≤ 23 ⇒ h₁ 与 h₂ 耦合</text>
  <g filter="url(#sk)">
    <path d="M 286 90 Q 343 58 400 90" stroke="#4a8e4a" stroke-width="1.8" stroke-dasharray="5 3" fill="none"/>
  </g>
  <text x="343" y="54" text-anchor="middle" font-size="11" fill="#2e6e2e">分钟 ≤ 59 ⇒ 两位独立</text>

  <!-- position boxes -->
  <g filter="url(#sk)">
    <rect x="90" y="98" width="56" height="56" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="118" y="134" text-anchor="middle" font-size="28" font-weight="bold" fill="#2b6e9e">?</text>
  <g filter="url(#sk)">
    <rect x="156" y="98" width="56" height="56" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="184" y="134" text-anchor="middle" font-size="28" font-weight="bold" fill="#2b6e9e">?</text>
  <g filter="url(#sk)">
    <rect x="222" y="98" width="40" height="56" rx="6" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4"/>
  </g>
  <text x="242" y="135" text-anchor="middle" font-size="28" font-weight="bold" fill="#999999">:</text>
  <g filter="url(#sk)">
    <rect x="272" y="98" width="56" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="300" y="134" text-anchor="middle" font-size="28" font-weight="bold" fill="#2e6e2e">?</text>
  <g filter="url(#sk)">
    <rect x="338" y="98" width="56" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="366" y="134" text-anchor="middle" font-size="28" font-weight="bold" fill="#2e6e2e">?</text>

  <!-- per-position max labels -->
  <text x="118" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">最大 2*</text>
  <text x="184" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">最大 9*</text>
  <text x="242" y="176" text-anchor="middle" font-size="10" fill="#888888">':' 不动</text>
  <text x="300" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">最大 5</text>
  <text x="366" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">最大 9</text>
  <text x="90" y="198" text-anchor="start" font-size="10" fill="#888888">* 带星号：上限受相邻位影响，见右侧规则</text>
  <text x="240" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">填写顺序：h₁ → h₂ → m₁ → m₂（高位优先）</text>
  <g filter="url(#sk)">
    <path d="M 150 244 Q 240 252 330 244" stroke="#888888" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- hour rules box -->
  <g filter="url(#sk)">
    <rect x="455" y="80" width="205" height="130" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="557" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">小时规则（看相邻位）</text>
  <text x="468" y="126" text-anchor="start" font-size="11" fill="#444444">h₁='?'：h₂ 固定且 &gt;3 → 填 1</text>
  <text x="480" y="145" text-anchor="start" font-size="11" fill="#444444">否则 → 填 2</text>
  <text x="468" y="168" text-anchor="start" font-size="11" fill="#444444">h₂='?'：h₁=2 → 填 3</text>
  <text x="480" y="187" text-anchor="start" font-size="11" fill="#444444">否则 → 填 9</text>

  <!-- minute rules box -->
  <g filter="url(#sk)">
    <rect x="455" y="222" width="205" height="70" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="557" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">分钟规则（独立）</text>
  <text x="468" y="266" text-anchor="start" font-size="11" fill="#444444">m₁='?' → 5</text>
  <text x="468" y="284" text-anchor="start" font-size="11" fill="#444444">m₂='?' → 9</text>

  <!-- warning box -->
  <g filter="url(#sk)">
    <rect x="455" y="302" width="205" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="557" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">⚠ 最大的坑</text>
  <text x="557" y="346" text-anchor="middle" font-size="11" fill="#444444">"?4:?? 不能填 24:59"</text>
  <text x="557" y="364" text-anchor="middle" font-size="11" fill="#444444">h₂=4&gt;3 ⇒ h₁ 只能 1 → 14:59</text>

  <!-- key insight strip -->
  <g filter="url(#sk)">
    <rect x="40" y="272" width="400" height="102" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="60" y="296" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b">为什么逐位贪心是对的？</text>
  <text x="60" y="318" text-anchor="start" font-size="11" fill="#444444">时间先后 ⇔ (h₁, h₂, m₁, m₂) 的字典序，</text>
  <text x="60" y="336" text-anchor="start" font-size="11" fill="#444444">高位严格支配低位（1 小时 = 60 分 &gt; 59 分）。</text>
  <text x="60" y="358" text-anchor="start" font-size="11" fill="#444444">约束只耦合小时两位 → 每位取合法最大即可。</text>
</svg>
