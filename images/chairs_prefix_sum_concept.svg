<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="580" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：E=+1、L=−1，答案 = 在场人数曲线的峰值</text>
  <path d="M 220 40 Q 470 48 720 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="52" width="820" height="60" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="76" font-size="12.5" fill="#444">把每个事件看作在场人数的增减：'E' 进入 → 人数 +1（占用一把椅子）；'L' 离开 → 人数 −1（释放椅子）</text>
  <text x="80" y="100" font-size="12.5" fill="#444">同一时刻在场的顾客必须一人一把椅子 → 最少椅子数 = 整个过程的最大同时在场人数</text>

  <path d="M 90 175 L 882 175" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="876" y="162" text-anchor="end" font-size="13.5" font-weight="bold" fill="#b85450">峰值 3 = 答案（虚线高度 = 椅子数下界）</text>

  <g filter="url(#sk)">
    <path d="M 90 150 L 90 400 L 882 400" stroke="#555" stroke-width="1.8" fill="none"/>
  </g>
  <text x="79" y="404" text-anchor="end" font-size="12" fill="#555">0</text>
  <text x="79" y="329" text-anchor="end" font-size="12" fill="#555">1</text>
  <text x="79" y="254" text-anchor="end" font-size="12" fill="#555">2</text>
  <text x="79" y="179" text-anchor="end" font-size="12" fill="#555">3</text>
  <text x="36" y="278" font-size="13" fill="#555" text-anchor="middle" transform="rotate(-90 36 278)">在场人数</text>
  <text x="486" y="458" text-anchor="middle" font-size="13" fill="#555">时间（秒）</text>

  <g filter="url(#sk)">
    <rect x="106" y="325" width="46" height="75" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="266" y="325" width="46" height="75" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="346" y="250" width="46" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="426" y="325" width="46" height="75" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="506" y="250" width="46" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="586" y="175" width="46" height="225" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="666" y="250" width="46" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="746" y="325" width="46" height="75" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>

  <text x="129" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">1</text>
  <text x="209" y="392" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="289" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">1</text>
  <text x="369" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">2</text>
  <text x="449" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">1</text>
  <text x="529" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">2</text>
  <text x="609" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">3</text>
  <text x="689" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">2</text>
  <text x="769" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">1</text>
  <text x="849" y="392" text-anchor="middle" font-size="12" fill="#888">0</text>

  <text x="129" y="421" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="209" y="421" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="289" y="421" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="369" y="421" text-anchor="middle" font-size="11" fill="#666">3</text>
  <text x="449" y="421" text-anchor="middle" font-size="11" fill="#666">4</text>
  <text x="529" y="421" text-anchor="middle" font-size="11" fill="#666">5</text>
  <text x="609" y="421" text-anchor="middle" font-size="11" fill="#666">6</text>
  <text x="689" y="421" text-anchor="middle" font-size="11" fill="#666">7</text>
  <text x="769" y="421" text-anchor="middle" font-size="11" fill="#666">8</text>
  <text x="849" y="421" text-anchor="middle" font-size="11" fill="#666">9</text>

  <text x="129" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">E</text>
  <text x="209" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="289" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">E</text>
  <text x="369" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">E</text>
  <text x="449" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="529" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">E</text>
  <text x="609" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">E</text>
  <text x="689" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="769" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="849" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">L</text>

  <g filter="url(#sk)">
    <rect x="60" y="470" width="820" height="94" rx="8" fill="#f4f9f4" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="80" y="494" font-size="12.5" fill="#444">s = "ELEELEELLL"（示例 3）：秒 6 时 3 人同时在场的时刻 → 至少 3 把椅子；随后 3 个 'L' 让人数归零，但峰值已被记录</text>
  <text x="80" y="520" font-size="12" fill="#555">每根柱 = 处理完第 i 秒事件后的 cur；蓝 = E（+1），绿 = L（−1），红 = 峰值柱</text>
  <text x="80" y="546" font-size="12" fill="#555">一次遍历维护 ans = max(ans, cur) → 时间 O(n)，空间 O(1)</text>
</svg>
