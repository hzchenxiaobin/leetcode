<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：k 次后继排列 + 贪心冒泡计数</text>

  <!-- B1 -->
  <rect x="120" y="40" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="60" text-anchor="middle" font-size="11.5" fill="#2b4b6b" filter="url(#rough2)">target ← num 的副本</text>
  <path d="M 230 72 L 230 84" stroke="#888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- B2 阶段① 循环 -->
  <rect x="110" y="88" width="240" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b27a10" filter="url(#rough2)">重复 k 次：nextPermutation(target)</text>
  <text x="230" y="126" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">即「下一个排列」四步法，见右侧 →</text>
  <!-- 四步法注释 -->
  <rect x="366" y="76" width="146" height="72" rx="6" fill="#fdfdfd" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="439" y="92" text-anchor="middle" font-size="9" font-weight="bold" fill="#666" filter="url(#rough2)">四步法（31 题）</text>
  <text x="439" y="106" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">① 从右找首个 s[i] &lt; s[i+1]</text>
  <text x="439" y="119" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">② 从右找首个 s[j] &gt; s[i]</text>
  <text x="439" y="132" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">③ 交换 s[i] 与 s[j]</text>
  <text x="439" y="145" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">④ 反转后缀 s[i+1..]</text>
  <path d="M 350 112 L 364 112" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 230 136 L 230 148" stroke="#888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- B3 -->
  <rect x="120" y="150" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="170" text-anchor="middle" font-size="11.5" fill="#2b4b6b" filter="url(#rough2)">s ← num 的副本，ans ← 0</text>
  <path d="M 230 182 L 230 194" stroke="#888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 阶段② 循环框 -->
  <rect x="52" y="196" width="376" height="256" rx="12" fill="#f7fbf7" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="240" y="216" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">循环：i = 0 … n−1，每轮让 target[i] 就位</text>

  <!-- D1 判断 -->
  <polygon points="230,224 320,252 230,280 140,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="256" text-anchor="middle" font-size="11" font-family="monospace" fill="#b27a10" filter="url(#rough2)">s[i] == target[i] ?</text>
  <!-- 是 -->
  <path d="M 320 252 L 334 252" stroke="#888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="327" y="244" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <rect x="336" y="236" width="86" height="32" rx="6" fill="#fdfdfd" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="379" y="250" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">已就位，跳过</text>
  <text x="379" y="263" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">ans 不变</text>
  <path d="M 336 240 C 320 222, 285 216, 250 221" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i+1</text>
  <!-- 否 -->
  <path d="M 230 280 L 230 292" stroke="#888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="241" y="289" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- B4 找 j -->
  <rect x="110" y="294" width="240" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="312" text-anchor="middle" font-size="10" font-family="monospace" fill="#2b4b6b" filter="url(#rough2)">j ← 从 i+1 起找 s[j] == target[i]</text>
  <text x="230" y="328" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">最左侧同值位 = 保序匹配指定的一位</text>
  <path d="M 230 338 L 230 348" stroke="#888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- B5 冒泡 -->
  <rect x="110" y="350" width="240" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="368" text-anchor="middle" font-size="10.5" fill="#2b4b6b" filter="url(#rough2)">把 s[j] 冒泡左移到 i</text>
  <text x="230" y="386" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#555" filter="url(#rough2)">每步 swap(s[j], s[j−1])，ans += j − i</text>
  <!-- 回环 -->
  <path d="M 110 374 L 66 374 L 66 252 L 132 252" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="90" y="366" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">i+1：进入下一轮</text>

  <!-- 循环出口 -->
  <path d="M 230 452 L 230 464" stroke="#888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="252" y="462" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i 扫完</text>

  <!-- B6 -->
  <rect x="140" y="468" width="180" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="491" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return ans</text>

  <text x="260" y="536" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">阶段① O(nk) + 阶段② O(n²)，n, k ≤ 1000 → 约 2×10⁶ 次操作轻松通过</text>
</svg>
