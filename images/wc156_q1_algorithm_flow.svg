<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">流程图：边插入边判重，撞车即刻返回</text>
  <text x="300" y="47" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">两次线性扫描：一次建频次表，一次把频次塞进集合</text>

  <!-- ① -->
  <rect x="120" y="64" width="330" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="136" y="83" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 建频次表：值为键，出现次数为值</text>
  <text x="136" y="102" font-size="10" fill="#555555" filter="url(#rough2)">for x in arr: cnt[x] += 1，共 n 次操作</text>

  <path d="M 285 116 L 285 130" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② -->
  <rect x="120" y="132" width="330" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="136" y="151" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 对每个频次 c（共 d 项）执行插入</text>
  <text x="136" y="170" font-size="10" fill="#555555" filter="url(#rough2)">seen.insert(c)：插入失败说明 c 已存在</text>
  <text x="136" y="188" font-size="10" fill="#555555" filter="url(#rough2)">失败 = 有两个取值频次相同 = 答案已确定为 false</text>

  <!-- ② → 提前返回 -->
  <rect x="462" y="139" width="118" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="521" y="160" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">return false</text>
  <text x="521" y="178" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">频次撞车</text>
  <path d="M 450 165 L 460 165" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 285 198 L 285 212" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ -->
  <rect x="120" y="214" width="330" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="136" y="233" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 全部插入成功 → return true</text>
  <text x="136" y="252" font-size="10" fill="#555555" filter="url(#rough2)">d 项频次进了 d 个不同的格子，两两不同</text>

  <!-- 左侧标注 -->
  <path d="M 96 92 L 96 158" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="88" y="130" text-anchor="end" font-size="9.5" fill="#999999" filter="url(#rough2)">统计</text>
  <path d="M 96 240 L 96 176" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="88" y="212" text-anchor="end" font-size="9.5" fill="#999999" filter="url(#rough2)">判重</text>

  <!-- 底部说明 -->
  <rect x="120" y="288" width="330" height="54" fill="#ffffff" stroke="#cccccc" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="136" y="308" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">不用先数出全部频次再统一比较</text>
  <text x="136" y="327" font-size="9.5" fill="#555555" filter="url(#rough2)">发现重复即可短路返回，最坏也只扫 d 项</text>

  <text x="300" y="366" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">两种写法等价：也可以把频次收集进列表，最后判断 len(set(频次)) 是否等于 d</text>
</svg>
