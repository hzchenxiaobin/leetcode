<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">出边唯一 ⇒ 路径唯一：两条 ρ 形路径与共享尾巴</text>

  <text x="185" y="58" text-anchor="middle" font-size="11" fill="#3a5a7a" font-weight="bold" filter="url(#rough2)">node1 独走段（距离逐格 +1）</text>
  <text x="185" y="272" text-anchor="middle" font-size="11" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">node2 独走段</text>

  <g filter="url(#rough2)">
    <ellipse cx="95" cy="95" rx="26" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <ellipse cx="185" cy="95" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="272" cy="95" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="95" cy="225" rx="26" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <ellipse cx="185" cy="225" rx="21" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <ellipse cx="365" cy="160" rx="27" ry="25" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <ellipse cx="470" cy="105" rx="21" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <ellipse cx="470" cy="215" rx="21" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="95" y="99" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">node1</text>
  <text x="185" y="99" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">u₁</text>
  <text x="272" y="99" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">u₂</text>
  <text x="95" y="229" text-anchor="middle" font-size="11" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">node2</text>
  <text x="185" y="229" text-anchor="middle" font-size="13" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">v₁</text>
  <text x="365" y="165" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">w</text>
  <text x="470" y="109" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">w₁</text>
  <text x="470" y="219" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">w₂</text>

  <text x="365" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">合流点</text>
  <text x="365" y="205" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">（答案在此取得 max 最小）</text>
  <text x="472" y="255" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">共享尾巴（此处成环）</text>

  <path d="M 121 95 L 160 95" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 206 95 L 247 95" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 292 101 L 337 143" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 121 225 L 160 225" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 206 219 L 337 172" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 388 146 L 446 116" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 470 124 L 470 192" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 449 203 L 392 175" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="52" y="284" width="15" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="185" y="284" width="15" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="318" y="284" width="15" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <rect x="451" y="284" width="15" height="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
  </g>
  <text x="73" y="296" font-size="11" fill="#555" filter="url(#rough2)">node1 路径</text>
  <text x="206" y="296" font-size="11" fill="#555" filter="url(#rough2)">node2 路径</text>
  <text x="339" y="296" font-size="11" fill="#555" filter="url(#rough2)">合流点</text>
  <text x="472" y="296" font-size="11" fill="#555" filter="url(#rough2)">共享尾巴</text>

  <rect x="40" y="312" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">出边至多一条 ⇒ 从起点出发的路径唯一 ⇒ 首次走到 x 的步数就是最短距离</text>

  <rect x="40" y="356" width="480" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">两条路径一旦相交即合流，max(dist₁, dist₂) 沿尾巴逐格 +1 ⇒ 在合流点取最小</text>
</svg>
