<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：每行原值 → 上界目标，逐行汇总增量</text>
  <text x="340" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">R = [8, 7, 9, 3]，C = [9, 4, 8, 7]，目标值 = min(R[r], C[c])</text>
  <rect x="16" y="70" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#33517a" filter="url(#rough2)">r</text>
  <rect x="68" y="70" width="226" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#33517a" filter="url(#rough2)">原值 grid[r]</text>
  <rect x="294" y="70" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#33517a" filter="url(#rough2)">R[r]</text>
  <rect x="350" y="70" width="214" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="457" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#33517a" filter="url(#rough2)">目标 min(R, C)</text>
  <rect x="564" y="70" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="612" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#33517a" filter="url(#rough2)">本行增量</text>
  <rect x="16" y="104" width="52" height="52" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <rect x="68" y="104" width="226" height="52" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="181" y="136" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">[3, 0, 8, 4]</text>
  <rect x="294" y="104" width="56" height="52" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="322" y="136" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">8</text>
  <rect x="350" y="104" width="214" height="52" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="457" y="136" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">[8, 4, 8, 7]</text>
  <rect x="564" y="104" width="96" height="52" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="612" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+5+4+0+3 = 12</text>
  <rect x="16" y="156" width="52" height="52" fill="#f6f8fc" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="68" y="156" width="226" height="52" fill="#f6f8fc" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="181" y="188" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">[2, 4, 5, 7]</text>
  <rect x="294" y="156" width="56" height="52" fill="#f6f8fc" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="322" y="188" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">7</text>
  <rect x="350" y="156" width="214" height="52" fill="#f6f8fc" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="457" y="188" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">[7, 4, 7, 7]</text>
  <rect x="564" y="156" width="96" height="52" fill="#f6f8fc" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="612" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+5+0+2+0 = 7</text>
  <rect x="16" y="208" width="52" height="52" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="240" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="68" y="208" width="226" height="52" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="181" y="240" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">[9, 2, 6, 3]</text>
  <rect x="294" y="208" width="56" height="52" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="322" y="240" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">9</text>
  <rect x="350" y="208" width="214" height="52" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="457" y="240" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">[9, 4, 8, 7]</text>
  <rect x="564" y="208" width="96" height="52" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="612" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+0+2+2+4 = 8</text>
  <rect x="16" y="260" width="52" height="52" fill="#f6f8fc" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="68" y="260" width="226" height="52" fill="#f6f8fc" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="181" y="292" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">[0, 3, 1, 0]</text>
  <rect x="294" y="260" width="56" height="52" fill="#f6f8fc" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="322" y="292" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">3</text>
  <rect x="350" y="260" width="214" height="52" fill="#f6f8fc" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="457" y="292" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">[3, 3, 3, 3]</text>
  <rect x="564" y="260" width="96" height="52" fill="#f6f8fc" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="612" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+3+0+2+3 = 8</text>
  <rect x="16" y="312" width="644" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="340" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a3a" filter="url(#rough2)">总增量 = 12 + 7 + 8 + 8 = 35　（取反验算：Σ目标 92 − Σ原值 57 = 35）</text>
  <text x="340" y="386" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">校验天际线：新矩阵各行最大仍为 8 / 7 / 9 / 3，各列最大仍为 9 / 4 / 8 / 7，与原来完全一致</text>
  <text x="340" y="408" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">注意第 0 行第 1 列原本是 0，也能抬到 4：上界只看 min(R, C)，与自身原值无关</text>
</svg>
