<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">贡献法：先问「这个元音被多少个子串覆盖」</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#666666">交换求和顺序：Σ 子串的元音数 → Σ 元音位置的覆盖子串数</text>

  <text x="60" y="72" font-size="12.5" font-weight="bold" fill="#2b6e9e">word = "taoi"（n = 4），关注位置 i = 2 的元音 o</text>

  <g filter="url(#sk)">
    <rect x="60" y="80" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="106" y="80" width="46" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="152" y="80" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="198" y="80" width="46" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="83" y="107" text-anchor="middle" font-size="15" fill="#b85450">t</text>
  <text x="129" y="107" text-anchor="middle" font-size="15" fill="#2b6e9e">a</text>
  <text x="175" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415">o</text>
  <text x="221" y="107" text-anchor="middle" font-size="15" fill="#2b6e9e">i</text>
  <text x="83" y="141" text-anchor="middle" font-size="10" fill="#999999">0</text>
  <text x="129" y="141" text-anchor="middle" font-size="10" fill="#999999">1</text>
  <text x="175" y="141" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6415">2</text>
  <text x="221" y="141" text-anchor="middle" font-size="10" fill="#999999">3</text>

  <path d="M60,150 L60,158 M198,150 L198,158 M60,154 L198,154" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="129" y="172" text-anchor="middle" font-size="10.5" fill="#2e6e2e">左端点 l ∈ {0, 1, 2}：共 i+1 = 3 种</text>

  <path d="M152,182 L152,190 M244,182 L244,190 M152,186 L244,186" stroke="#4a8edb" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="198" y="204" text-anchor="middle" font-size="10.5" fill="#2b6e9e">右端点 r ∈ {2, 3}：共 n−i = 2 种</text>

  <text x="60" y="228" font-size="11" fill="#444444">覆盖位置 2 的 6 个子串（每个都把 o 数一次）：</text>

  <g filter="url(#sk)">
    <rect x="60" y="238" width="58" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="124" y="238" width="58" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="188" y="238" width="58" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="252" y="238" width="58" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="316" y="238" width="58" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="380" y="238" width="58" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="89" y="255" text-anchor="middle" font-size="11" fill="#2b6e9e">tao</text>
  <text x="153" y="255" text-anchor="middle" font-size="11" fill="#2b6e9e">taoi</text>
  <text x="217" y="255" text-anchor="middle" font-size="11" fill="#2b6e9e">ao</text>
  <text x="281" y="255" text-anchor="middle" font-size="11" fill="#2b6e9e">aoi</text>
  <text x="345" y="255" text-anchor="middle" font-size="11" fill="#2b6e9e">o</text>
  <text x="409" y="255" text-anchor="middle" font-size="11" fill="#2b6e9e">oi</text>

  <path d="M250,103 L332,103" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="340" y="78" width="262" height="136" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="471" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">位置 i 的元音，贡献 =</text>
  <text x="471" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#b8860b">(i + 1) × (n − i)</text>
  <text x="471" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">= 3 × 2 = 6</text>
  <text x="471" y="184" text-anchor="middle" font-size="9.5" fill="#888888">每个 (l, r) 组合恰对应一个覆盖 i 的子串，两维独立相乘</text>

  <g filter="url(#sk)">
    <rect x="40" y="300" width="560" height="100" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">要点：子串有 O(n²) 个躲不掉；但每个字符的贡献只依赖 i 与 n，可 O(1) 算出</text>
  <text x="320" y="350" text-anchor="middle" font-size="11" fill="#555555">ans = Σ (i+1)(n−i)，只对元音位置求和——一趟扫描 O(n)</text>
  <text x="320" y="372" text-anchor="middle" font-size="10.5" fill="#555555">重复元音各计各的：子串 "aba" 的两个 a 各贡献一次，正是「元音总数」的含义</text>
</svg>
