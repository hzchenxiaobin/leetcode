<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="500" fill="#fdfcf7"/>
  <text x="360" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟快慢指针，定位即删除</text>

  <!-- init box -->
  <g filter="url(#sk)">
    <rect x="30" y="175" width="200" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="130" y="199" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">dummy.next = head</text>
  <text x="130" y="220" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">slow = fast = dummy</text>
  <path d="M 232 205 L 262 205" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond -->
  <g filter="url(#sk)">
    <polygon points="270,205 400,130 530,205 400,280" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="400" y="193" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">fast->next 与</text>
  <text x="400" y="211" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">fast->next->next</text>
  <text x="400" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">都存在？</text>

  <!-- yes branch -->
  <path d="M 532 205 L 564 205" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="548" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="568" y="177" width="140" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="638" y="199" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">slow 走 1 步</text>
  <text x="638" y="219" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">fast 走 2 步</text>
  <path d="M 638 175 L 638 92 L 400 92 L 400 126" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="520" y="84" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">回到条件判断</text>

  <!-- no branch -->
  <path d="M 400 282 L 400 310" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="412" y="302" font-size="11" font-weight="bold" fill="#a04038" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="285" y="314" width="230" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="400" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04038" filter="url(#sk)">删除中间节点</text>
  <text x="400" y="358" text-anchor="middle" font-size="10.5" fill="#a04038" filter="url(#sk)">slow->next = slow->next->next</text>
  <path d="M 400 374 L 400 400" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="285" y="402" width="230" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="400" y="426" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 dummy.next</text>
  <text x="400" y="446" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">n = 1 时为 nullptr</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="30" y="314" width="225" height="146" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="142" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">不变量（第 m 轮后）</text>
  <text x="142" y="362" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">slow 停在下标 m−1</text>
  <text x="142" y="382" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">fast 停在下标 2m−1</text>
  <text x="142" y="408" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">终止时 m = ⌊n/2⌋</text>
  <text x="142" y="428" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">slow 恰停在前驱上</text>

  <text x="360" y="486" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">一趟遍历同时完成「数长度」与「定位前驱」，速度差就是尺子 · 时间 O(n) · 空间 O(1)</text>
</svg>
