<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="306" fill="#fafafa"/>

  <text x="320" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：一次线性扫描，每个 i 只做两次异或</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">无搜索、无回溯、无去重，边生成边判断合法性所需的性质已由公式保证</text>

  <!-- 四个步骤框 -->
  <rect x="20" y="72" width="122" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="81" y="98" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">遍历 i</text>
  <text x="81" y="118" text-anchor="middle" font-size="9.5" fill="#6a7a96" filter="url(#rough2)">i = 0 … 2^n - 1</text>

  <rect x="176" y="72" width="126" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="239" y="98" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">g = i ^ (i &gt;&gt; 1)</text>
  <text x="239" y="118" text-anchor="middle" font-size="9.5" fill="#a8842f" filter="url(#rough2)">反射格雷码</text>

  <rect x="336" y="72" width="140" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="406" y="98" text-anchor="middle" font-size="11" fill="#2f4a26" filter="url(#rough2)">ans[i] = g ^ start</text>
  <text x="406" y="118" text-anchor="middle" font-size="9.5" fill="#5a7a50" filter="url(#rough2)">异或平移起点</text>

  <rect x="510" y="72" width="112" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="566" y="98" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">返回 ans</text>
  <text x="566" y="118" text-anchor="middle" font-size="9.5" fill="#a86a66" filter="url(#rough2)">长度 2^n</text>

  <!-- 箭头 -->
  <g filter="url(#rough2)" stroke="#666" stroke-width="1.5" fill="none">
    <path d="M 146 104 L 170 104" marker-end="url(#arr)"/>
    <path d="M 306 104 L 330 104" marker-end="url(#arr)"/>
    <path d="M 480 104 L 504 104" marker-end="url(#arr)"/>
  </g>

  <!-- 下方推导说明 -->
  <rect x="20" y="156" width="602" height="132" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="38" y="178" font-size="10.5" font-weight="bold" fill="#444" filter="url(#rough2)">相邻性（相邻两项只差一位）</text>
  <text x="38" y="197" font-size="10" fill="#555" filter="url(#rough2)">设 i 末尾有 k 个连续 1：i ^ (i + 1) = 2^(k+1) - 1，且 (i&gt;&gt;1) ^ ((i+1)&gt;&gt;1) = 2^k - 1，</text>
  <text x="38" y="215" font-size="10" fill="#3a5a30" filter="url(#rough2)">两者相消得 g(i) ^ g(i + 1) = 2^k —— 恰好翻转第 k 位，别的位不动。</text>
  <text x="38" y="240" font-size="10.5" font-weight="bold" fill="#444" filter="url(#rough2)">首尾性（最后一项与第一项也只差一位）</text>
  <text x="38" y="259" font-size="10" fill="#555" filter="url(#rough2)">g(0) = 0，g(2^n - 1) = 2^(n-1)，异或起来等于 2^(n-1)，是单个最高位。</text>
  <text x="38" y="277" font-size="10" fill="#8a6a20" filter="url(#rough2)">再同时异或同一个 start，两个性质都保持 ⇒ 三条要求一次满足。</text>
</svg>
