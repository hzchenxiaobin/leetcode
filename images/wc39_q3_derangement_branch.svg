<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">错位排列：按元素 1 的落点分类</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">D(n) 表示 n 个元素全错排的方案数；元素 1 只能去位置 j，j ≠ 1</text>

  <rect x="160" y="62" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="310" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">数组 [1..n]，元素 i 不许待在位置 i</text>

  <path d="M 310 94 L 310 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="310" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">选定 j（共 n−1 种），把元素 1 放到位置 j</text>

  <path d="M 300 138 C 240 146, 200 150, 165 158" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 138 C 380 146, 420 150, 455 158" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="160" width="255" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="180" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">情形 A：元素 j 也去位置 1</text>
  <text x="46" y="199" font-size="10" fill="#555" filter="url(#rough2)">1 与 j 互换，二者都离开原位</text>
  <text x="46" y="216" font-size="10" fill="#555" filter="url(#rough2)">剩下 n−2 个元素各自错排</text>

  <rect x="335" y="160" width="255" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="351" y="180" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">情形 B：元素 j 不去位置 1</text>
  <text x="351" y="199" font-size="10" fill="#555" filter="url(#rough2)">把位置 1 与位置 j 看成一个槽位</text>
  <text x="351" y="216" font-size="10" fill="#555" filter="url(#rough2)">约束等价于 n−1 个元素全错排</text>

  <path d="M 157 232 L 157 242" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 462 232 L 462 242" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="244" width="255" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="157" y="266" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">方案数 = D(n−2)</text>

  <rect x="335" y="244" width="255" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="462" y="266" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">方案数 = D(n−1)</text>

  <rect x="90" y="300" width="440" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="332" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">D(n) = (n−1) · [ D(n−1) + D(n−2) ]</text>

  <text x="310" y="376" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">基数：D(0) = 1（空排列算 1 种），D(1) = 0（唯一元素无处可去）</text>
  <text x="310" y="396" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">校验 n = 3：2 · (D(2) + D(1)) = 2 · (1 + 0) = 2，与官方示例一致</text>
</svg>
