<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="540" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1,2,3,6]，扫一遍得 ans = 1</text>
  <path d="M 150 38 Q 340 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array cells -->
  <g filter="url(#sk)">
    <rect x="204" y="54" width="56" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)">
    <rect x="260" y="54" width="56" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)">
    <rect x="316" y="54" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="372" y="54" width="56" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="232" y="82" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="288" y="82" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="344" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10" filter="url(#sk)">3</text>
  <text x="400" y="82" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#sk)">6</text>
  <text x="232" y="114" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0</text>
  <text x="288" y="114" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">1</text>
  <text x="344" y="114" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">2</text>
  <text x="400" y="114" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">3</text>

  <!-- table -->
  <g filter="url(#sk)">
    <rect x="36" y="146" width="608" height="244" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <rect x="36" y="146" width="608" height="28" fill="#e8f0fa" stroke="#8a8a8a" stroke-width="1"/>
  </g>
  <g filter="url(#sk)">
    <rect x="36" y="282" width="608" height="54" fill="#fff8e1"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 74 146 L 74 390" stroke="#8a8a8a" stroke-width="1"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 248 146 L 248 390" stroke="#8a8a8a" stroke-width="1"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 430 146 L 430 390" stroke="#8a8a8a" stroke-width="1"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 560 146 L 560 390" stroke="#8a8a8a" stroke-width="1"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 36 228 L 644 228" stroke="#8a8a8a" stroke-width="1"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 36 282 L 644 282" stroke="#8a8a8a" stroke-width="1"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 36 336 L 644 336" stroke="#8a8a8a" stroke-width="1"/>
  </g>

  <text x="55" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">c</text>
  <text x="161" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">查：枚举 d &gt; c</text>
  <text x="339" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">建：以 c 结尾的对</text>
  <text x="495" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">cnt（和→次数）</text>
  <text x="588" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">ans</text>

  <!-- row c=0 -->
  <text x="55" y="203" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">0</text>
  <text x="161" y="196" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">d=1,2,3：cnt 为空</text>
  <text x="161" y="214" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">→ +0</text>
  <text x="339" y="203" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">a &lt; 0：无对可加</text>
  <text x="495" y="203" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">{ }</text>
  <text x="588" y="203" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">0</text>

  <!-- row c=1 -->
  <text x="55" y="257" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="161" y="250" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">d=2,3：cnt 为空</text>
  <text x="161" y="268" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">→ +0</text>
  <text x="339" y="250" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">(0,1)：和 1+2=3</text>
  <text x="339" y="268" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">cnt[3] += 1</text>
  <text x="495" y="257" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">{3: 1}</text>
  <text x="588" y="257" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">0</text>

  <!-- row c=2 highlighted -->
  <text x="55" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">2</text>
  <text x="161" y="304" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">d=3：cnt[6−3] = cnt[3] = 1</text>
  <text x="161" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">→ +1 ✓ 命中！</text>
  <text x="339" y="304" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">(0,2)：cnt[4] += 1</text>
  <text x="339" y="322" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">(1,2)：cnt[5] += 1</text>
  <text x="495" y="311" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">{3:1, 4:1, 5:1}</text>
  <text x="588" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>

  <!-- row c=3 -->
  <text x="55" y="365" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">3</text>
  <text x="161" y="358" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">无 d &gt; 3</text>
  <text x="161" y="376" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">→ +0</text>
  <text x="339" y="358" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">(0,3)→cnt[7]，(1,3)→cnt[8]</text>
  <text x="339" y="376" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">(2,3)：cnt[9] += 1</text>
  <text x="495" y="365" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">{ … }</text>
  <text x="588" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">1</text>

  <!-- hit explanation -->
  <g filter="url(#sk)">
    <rect x="76" y="406" width="528" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="340" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">唯一命中：c = 2，d = 3</text>
  <text x="340" y="452" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">四元组 (0,1,2,3)：nums[0]+nums[1] = 1+2 = 3 = 6−3 = nums[3]−nums[2]</text>

  <text x="340" y="508" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">示例 3（[1,1,1,3,5]）中 c=3 时 cnt[2]=3，一次查询直接 +3 —— 重复值靠「存次数」一次吃进，最终 ans=4</text>
</svg>
