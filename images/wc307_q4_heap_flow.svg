<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="780" height="560" fill="#fafafa"/>
  <text x="390" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：最小堆 add / replace 双分支生成前 k 小子集和</text>
  <path d="M 200 42 Q 390 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: generation tree for a = [2,2,4] ===== -->
  <text x="230" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">生成树（a = [2,2,4]，状态 (s, i)，子集以 a 的下标表示）</text>

  <!-- edges -->
  <g stroke="#4a7a3a" stroke-width="1.6" fill="none">
    <path d="M 270 112 L 172 162" marker-end="url(#arG)" filter="url(#sk)"/>
  </g>
  <g stroke="#4a7a3a" stroke-width="1.6" fill="none">
    <path d="M 152 192 L 112 240" marker-end="url(#arG)" filter="url(#sk)"/>
  </g>
  <g stroke="#d6a040" stroke-width="1.6" fill="none">
    <path d="M 180 192 L 228 240" marker-end="url(#arO)" filter="url(#sk)"/>
  </g>
  <g stroke="#4a7a3a" stroke-width="1.6" fill="none">
    <path d="M 92 272 L 78 318" marker-end="url(#arG)" filter="url(#sk)"/>
    <path d="M 120 272 L 152 318" marker-end="url(#arG)" filter="url(#sk)"/>
    <path d="M 252 272 L 282 318" marker-end="url(#arG)" filter="url(#sk)"/>
  </g>
  <g stroke="#d6a040" stroke-width="1.6" fill="none">
    <path d="M 232 272 L 172 318" marker-end="url(#arO)" filter="url(#sk)"/>
    <path d="M 272 272 L 362 318" marker-end="url(#arO)" filter="url(#sk)"/>
  </g>
  <g font-size="10" font-weight="bold">
    <text x="196" y="128" fill="#4a7a3a">add +2</text>
    <text x="100" y="208" fill="#4a7a3a">add +2</text>
    <text x="216" y="208" fill="#d6a040">repl +0</text>
    <text x="62" y="290" fill="#4a7a3a">add +4</text>
    <text x="132" y="296" fill="#d6a040">repl +2</text>
    <text x="252" y="290" fill="#4a7a3a">add +4</text>
    <text x="330" y="290" fill="#d6a040">repl +2</text>
  </g>

  <!-- nodes -->
  <g filter="url(#sk)">
    <rect x="226" y="84" width="88" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="270" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">(0,0) ∅</text>

  <g filter="url(#sk)">
    <rect x="122" y="164" width="88" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="166" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">(2,1) {a₀}</text>

  <g filter="url(#sk)">
    <rect x="52" y="244" width="88" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="200" y="244" width="88" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="96" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">(4,2) {a₀a₁}</text>
  <text x="244" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(2,2) {a₁}</text>

  <g filter="url(#sk)">
    <rect x="32" y="322" width="88" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="124" y="322" width="88" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="248" y="322" width="88" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="340" y="322" width="88" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="76" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">(8,3) 全选</text>
  <text x="168" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8860b">(6,3) {a₀a₂}</text>
  <text x="292" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8860b">(6,3) {a₁a₂}</text>
  <text x="384" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">(4,3) {a₂}</text>

  <text x="230" y="374" text-anchor="middle" font-size="11" fill="#888">i = 3 = n → 叶子，不再分裂；每个子集恰出现一次（引理 3：父辈唯一）</text>

  <g filter="url(#sk)">
    <rect x="36" y="392" width="400" height="150" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="56" y="416" font-size="12" font-weight="bold" fill="#2b2b2b">为什么弹出即升序？</text>
  <text x="56" y="438" font-size="11" fill="#444">add 增量 +a[i] ≥ 0（绝对值非负）</text>
  <text x="56" y="458" font-size="11" fill="#444">replace 增量 +a[i]−a[i−1] ≥ 0（升序保证）</text>
  <text x="56" y="478" font-size="11" fill="#444">→ 生成树上沿路径「父到子和不减」</text>
  <text x="56" y="498" font-size="11" fill="#2e6e2e" font-weight="bold">→ 最小堆每次弹出全局最小（引理 4）</text>
  <text x="56" y="524" font-size="11" fill="#888">add：末尾追加 a[i]；replace：末尾 a[i−1] 换成 a[i]</text>

  <!-- ===== Right: flowchart ===== -->
  <g filter="url(#sk)">
    <rect x="466" y="60" width="290" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="611" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">① 预处理</text>
  <text x="611" y="98" text-anchor="middle" font-size="11" fill="#444">total ← 正数和；a ← |nums| 升序排序</text>
  <path d="M 611 106 L 611 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="466" y="128" width="290" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="611" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">② 堆初始化</text>
  <text x="611" y="166" text-anchor="middle" font-size="11" fill="#444">push (0, 0) —— 空子集，即第 1 小子集和 0</text>
  <path d="M 611 174 L 611 192" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="466" y="196" width="290" height="222" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 4"/>
  </g>
  <text x="611" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">③ 重复 k − 1 次</text>

  <g filter="url(#sk)">
    <rect x="496" y="232" width="230" height="34" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="611" y="254" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">弹出堆顶 (s, i)</text>

  <path d="M 611 266 L 571 288" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 611 266 L 651 288" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M 496 318 L 571 288 L 646 318 L 571 348 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <path d="M 566 318 L 651 318 L 716 348 L 631 348 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="571" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">i &lt; n ?</text>
  <text x="646" y="337" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">i &gt; 0 ?</text>
  <text x="548" y="340" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">是</text>
  <text x="668" y="310" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">是</text>
  <text x="520" y="306" text-anchor="middle" font-size="10" fill="#999">否→跳过</text>
  <text x="700" y="322" text-anchor="middle" font-size="10" fill="#999">否→跳过</text>

  <g filter="url(#sk)">
    <rect x="478" y="360" width="182" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="576" y="360" width="172" height="44" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="569" y="378" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">add：压入</text>
  <text x="569" y="396" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-family="monospace">(s+a[i], i+1)</text>
  <text x="662" y="378" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b8860b">replace：压入</text>
  <text x="662" y="396" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-family="monospace">(s+a[i]−a[i−1], i+1)</text>

  <path d="M 571 348 L 571 356" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 646 348 L 650 356" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 478 382 Q 456 382 456 320 Q 456 249 492 249" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="447" y="318" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold" transform="rotate(-90 447 318)">回到 ③</text>

  <path d="M 611 418 L 611 436" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="466" y="440" width="290" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="611" y="461" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">④ 输出：答案 = total − 堆顶.s</text>
  <text x="611" y="481" text-anchor="middle" font-size="11" fill="#444">堆顶即第 k 小子集和（引理 4）</text>

  <g filter="url(#sk)">
    <rect x="466" y="506" width="290" height="36" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="611" y="529" text-anchor="middle" font-size="11" fill="#888">堆大小 O(k) ≤ 2(k−1)，k ≤ 2000 轻松容纳</text>
</svg>
