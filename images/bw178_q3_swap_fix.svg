<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="384" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一次跨数组交换如何让 diff 减少 4</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把 nums1 里「多的」那个值、和 nums2 里「多的」那个值，换到对面去</text>
  <rect x="60" y="66" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="94" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">nums1 多出 a</text>
  <rect x="320" y="66" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="94" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">nums2 多出 b</text>
  <path d="M 240 88 L 320 88" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 108 L 240 108" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">a →</text>
  <text x="280" y="124" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">← b</text>
  <rect x="60" y="140" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="168" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">nums1：a −1、b +1</text>
  <rect x="320" y="140" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="168" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">nums2：b −1、a +1</text>
  <rect x="36" y="202" width="488" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="222" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">差额的变化</text>
  <text x="48" y="240" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">a 的 |a − b| 减少 1，b 的 |a − b| 也减少 1</text>
  <text x="48" y="258" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">所以 Σ|a−b| 恰好减少 4，而每次交换的成本是 1</text>
  <rect x="36" y="282" width="236" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="302" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">最少交换次数</text>
  <text x="48" y="319" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">= diff / 4</text>
  <text x="48" y="336" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">（diff 为 Σ|a−b|，必为 4 的倍数）</text>
  <rect x="288" y="282" width="236" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="302" text-anchor="start" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么必是 4 的倍数</text>
  <text x="300" y="318" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">每个 |a−b| 为偶数（a、b 同奇偶）</text>
  <text x="300" y="334" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">且 Σ(a−b) = 0，正负相抵 → 总和 ≡ 0 (mod 4)</text>
  <text x="280" y="364" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">若某个值 a + b 为奇数，diff 里会出现奇数项，此时直接判 -1，不进入除法</text>
</svg>
