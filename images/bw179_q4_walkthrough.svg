<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：digitSum = [25, 1] → 答案 6</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">首位置 6 个候选各 1 种；次位置只有 1000 能接在所有 799…997 之后</text>
  <text x="36" y="80" text-anchor="start" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">第 1 位（数位和 25）</text>
  <rect x="36" y="92" width="66" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69.0" y="112.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">799</text>
  <text x="69" y="144" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">dp = 1</text>
  <rect x="114" y="92" width="66" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147.0" y="112.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">889</text>
  <text x="147" y="144" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">dp = 1</text>
  <rect x="192" y="92" width="66" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225.0" y="112.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">898</text>
  <text x="225" y="144" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">dp = 1</text>
  <rect x="270" y="92" width="66" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="303.0" y="112.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">979</text>
  <text x="303" y="144" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">dp = 1</text>
  <rect x="348" y="92" width="66" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="381.0" y="112.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">988</text>
  <text x="381" y="144" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">dp = 1</text>
  <rect x="426" y="92" width="66" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="459.0" y="112.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">997</text>
  <text x="459" y="144" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">dp = 1</text>
  <path d="M 280 156 L 280 178" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="36" y="204" text-anchor="start" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">第 2 位（数位和 1）</text>
  <rect x="36" y="216" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="86" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="86" y="252" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">dp = 0</text>
  <rect x="156" y="216" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="206" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="206" y="252" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">dp = 0</text>
  <rect x="276" y="216" width="100" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="326" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">100</text>
  <text x="326" y="252" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">dp = 0</text>
  <rect x="396" y="216" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="446" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1000</text>
  <text x="446" y="252" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">dp = 6</text>
  <rect x="36" y="276" width="488" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="296" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">逐项看 cnt</text>
  <text x="48" y="313" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">cur = 1 / 10 / 100：prev 里没有 ≤ 它们的元素 → cnt = 0 → dp = 0</text>
  <text x="48" y="330" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">cur = 1000：prev 的 6 个元素全部 ≤ 1000 → cnt = 6 → dp = pre[6] = 6</text>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">总和 = 0 + 0 + 0 + 6 = 6 ✓</text>
  <text x="280" y="368" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6 个方案：[799,1000]、[889,1000]、[898,1000]、[979,1000]、[988,1000]、[997,1000]</text>
</svg>
