<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">二维差分：一个可行邮票 = 差分数组四角打标记</text>

  <!-- 左：网格与邮票矩形 -->
  <text x="150" y="58" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">可行邮票：左上 (r, c)，高 h 宽 w 的全零矩形</text>
  <g filter="url(#rough2)">
    <!-- 6 x 7 格子，格宽 34 -->
    <rect x="40" y="72" width="238" height="204" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <!-- 邮票区域 -->
    <rect x="142" y="106" width="102" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="middle">
    <text x="276" y="66">→ c 方向</text>
    <text x="30" y="180" transform="rotate(-90 30 180)">→ r 方向</text>
  </g>
  <!-- 四角标记 -->
  <g filter="url(#rough2)">
    <circle cx="142" cy="106" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="244" cy="106" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="142" cy="208" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="244" cy="208" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="142" y="110" fill="#4a7a3a" font-weight="bold">+1</text>
    <text x="244" y="110" fill="#b85450" font-weight="bold">−1</text>
    <text x="142" y="212" fill="#b85450" font-weight="bold">−1</text>
    <text x="244" y="212" fill="#4a7a3a" font-weight="bold">+1</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="142" y="94">(r, c)</text>
    <text x="262" y="94">(r, c+w)</text>
    <text x="122" y="230">(r+h, c)</text>
    <text x="268" y="230">(r+h, c+w)</text>
  </g>
  <text x="160" y="300" font-size="12.5" fill="#333" filter="url(#rough2)" text-anchor="middle">绿色区域 = 该邮票能覆盖的格子</text>

  <!-- 右：差分操作 -->
  <text x="430" y="58" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">差分数组上的四个操作</text>
  <g filter="url(#rough2)">
    <rect x="320" y="72" width="220" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="338" y="98">diff[r][c]     += 1</text>
    <text x="338" y="122">diff[r][c+w]   −= 1</text>
    <text x="338" y="146">diff[r+h][c]   −= 1</text>
    <text x="338" y="170">diff[r+h][c+w] += 1</text>
  </g>
  <path d="M 282 120 C 300 120, 305 120, 316 120" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部：还原公式 -->
  <g filter="url(#rough2)">
    <rect x="40" y="316" width="480" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="340" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">还原：对 diff 做二维前缀和</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="364">cover[i][j] = Σ diff[0..i][0..j]，恰好等于覆盖格子 (i,j) 的可行邮票数</text>
  </g>
</svg>
