<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 412"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="412" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：两段异或相等 ⇔ 整段异或为 0</text>
  <text x="260" y="54" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">arr = [2, 3, 1, 6, 7]，P[0] = 0，P[m] = arr[0] ^ … ^ arr[m−1]</text>

  <rect x="90" y="66" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="94" text-anchor="middle" font-size="13.5" fill="#8a6a20" filter="url(#rough2)">a = b　（左段异或 = 右段异或）</text>

  <path d="M260,112 V132" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="126" font-size="11" fill="#888" filter="url(#rough2)">两边同时异或 a</text>

  <rect x="90" y="134" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="13.5" fill="#2a4660" filter="url(#rough2)">a ^ b = 0　（相等即异或为 0）</text>

  <path d="M260,180 V200" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="194" font-size="11" fill="#888" filter="url(#rough2)">a ^ b 就是整段异或</text>

  <rect x="90" y="202" width="340" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="13.5" fill="#8f3a37" filter="url(#rough2)">arr[i] ^ arr[i+1] ^ … ^ arr[k] = 0</text>

  <path d="M260,248 V268" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="262" font-size="11" fill="#888" filter="url(#rough2)">异或前缀相消</text>

  <rect x="90" y="270" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="13.5" fill="#2f5424" filter="url(#rough2)">P[i] = P[k + 1]　（前缀异或相等）</text>

  <rect x="56" y="330" width="408" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">固定一对相等的前缀下标 i &lt; m = k + 1：中间的 j 任取都合法</text>
  <text x="260" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = Σ (m − i − 1)，对 P[i] = P[m] 且 i &lt; m</text>
</svg>
