<svg xmlns="http://www.w3.org/2000/svg" width="680" height="684" viewBox="0 0 680 684" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="680" height="684" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b">算法流程：逐链扫描 → 贪心 + 二分求 LNIS → 累加 (链长 − LNIS)</text>
  <path d="M 110 40 Q 340 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== side note: invariant ===== -->
  <rect x="12" y="60" width="164" height="102" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="94" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">不变量 I</text>
  <text x="94" y="101" text-anchor="middle" font-size="10.5" fill="#333">tail 非递减，tail[c] =</text>
  <text x="94" y="117" text-anchor="middle" font-size="10.5" fill="#333">长度 c+1 的非递减子序</text>
  <text x="94" y="133" text-anchor="middle" font-size="10.5" fill="#333">列的最小结尾</text>
  <text x="94" y="151" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">⇒ len(tail) = LNIS</text>

  <!-- ===== start ===== -->
  <rect x="190" y="60" width="200" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="80" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">开始：arr[0..n−1], k</text>
  <path d="M 290 92 L 290 104" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- ===== box A: outer loop ===== -->
  <rect x="185" y="108" width="210" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="126" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">外层：枚举链 r = 0 … k−1</text>
  <text x="290" y="140" text-anchor="middle" font-size="9.5" fill="#667">（下标 ≡ r (mod k) 的所有元素）</text>
  <path d="M 290 146 L 290 158" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- ===== box B: inner loop ===== -->
  <rect x="185" y="162" width="210" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="180" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">内层：i = r, r+k, r+2k, …</text>
  <text x="290" y="194" text-anchor="middle" font-size="9.5" fill="#667">取 x = arr[i]，链长 m ← m+1</text>
  <path d="M 290 200 L 290 212" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- ===== box C: binary search ===== -->
  <rect x="160" y="216" width="260" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="236" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">p ← upper_bound(tail, x)</text>
  <text x="290" y="252" text-anchor="middle" font-size="9.5" fill="#667">tail 中第一个 &gt; x 的下标（非递减的关键）</text>
  <path d="M 290 258 L 290 272" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- ===== diamond D ===== -->
  <polygon points="290,274 400,318 290,362 180,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="314" text-anchor="middle" font-size="11.5" fill="#a97b26" font-weight="bold">p == len(tail)？</text>
  <text x="290" y="332" text-anchor="middle" font-size="9.5" fill="#998">（tail 全部 ≤ x）</text>

  <path d="M 400 310 Q 424 306 442 305" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="422" y="299" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 400 326 Q 424 334 442 338" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="422" y="352" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== box E: append (green) ===== -->
  <rect x="448" y="288" width="190" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="543" y="306" text-anchor="middle" font-size="11.5" fill="#2e5e2e" font-weight="bold">tail.push_back(x)</text>
  <text x="543" y="320" text-anchor="middle" font-size="9.5" fill="#6a8a5a">延长子序列，LNIS +1</text>

  <!-- ===== box F: replace (orange) ===== -->
  <rect x="448" y="348" width="190" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="543" y="366" text-anchor="middle" font-size="11.5" fill="#a97b26" font-weight="bold">tail[p] ← x</text>
  <text x="543" y="380" text-anchor="middle" font-size="9.5" fill="#a9853a">换更小结尾，tail 仍非递减</text>

  <!-- merge arrows E,F -> G -->
  <path d="M 543 324 Q 543 396 406 440" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <path d="M 543 384 Q 543 442 406 452" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- ===== diamond G: inner loop end? ===== -->
  <polygon points="290,402 400,446 290,490 180,446" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="442" text-anchor="middle" font-size="11.5" fill="#a97b26" font-weight="bold">链内还有元素？</text>
  <text x="290" y="460" text-anchor="middle" font-size="9.5" fill="#998">（i + k &lt; n）</text>

  <!-- 是: loop back to B -->
  <path d="M 180 446 L 60 446 L 60 181 L 179 181" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="160" y="436" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="50" y="196" font-size="9.5" fill="#6a8a5a" transform="rotate(-90 50 196)">i += k，取下一个 x</text>

  <!-- 否: fall through -->
  <path d="M 290 490 L 290 504" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="306" y="502" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== box H: chain contribution ===== -->
  <rect x="160" y="508" width="260" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="526" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">该链完成：ans += m − len(tail)</text>
  <text x="290" y="540" text-anchor="middle" font-size="9.5" fill="#667">m = 链长 |Sᵣ|，len(tail) = LNIS(Sᵣ)</text>
  <path d="M 290 546 L 290 558" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- ===== diamond I: more chains? ===== -->
  <polygon points="290,560 380,594 290,628 200,594" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="591" text-anchor="middle" font-size="11.5" fill="#a97b26" font-weight="bold">还有下一条链？</text>
  <text x="290" y="607" text-anchor="middle" font-size="9.5" fill="#998">（r + 1 &lt; k）</text>

  <!-- 是: loop back to A -->
  <path d="M 380 594 L 655 594 L 655 127 L 401 127" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="398" y="584" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="646" y="380" font-size="9.5" fill="#6a8a5a" transform="rotate(90 646 380)">r + 1，下一条链</text>

  <!-- 否: to end -->
  <path d="M 290 628 L 290 640" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="306" y="638" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== end ===== -->
  <rect x="170" y="644" width="240" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="664" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">返回 ans = Σ (mᵣ − LNISᵣ)</text>

  <text x="14" y="678" font-size="10" fill="#888">时间 O(n log n)（k=1 最坏）；空间 O(⌈n/k⌉)——tail 逐链复用</text>
</svg>
