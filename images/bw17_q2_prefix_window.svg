<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="111"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="350" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">二维前缀和：容斥一块矩形</text>

  <!-- 3x3 网格 pre 示意（4x4 含 0 边） -->
  <g filter="url(#rough2)">
    <!-- 0 边 -->
    <rect x="150" y="56" width="46" height="40" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="196" y="56" width="46" height="40" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="242" y="56" width="46" height="40" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="288" y="56" width="46" height="40" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="150" y="96" width="46" height="40" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <!-- 内部四块 A B C D -->
    <rect x="196" y="96" width="46" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="242" y="96" width="46" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="288" y="96" width="46" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="196" y="136" width="46" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="242" y="136" width="46" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="288" y="136" width="46" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="150" y="136" width="46" height="40" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="196" y="176" width="46" height="40" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="242" y="176" width="46" height="40" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="288" y="176" width="46" height="40" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="150" y="176" width="46" height="40" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
  </g>
  <text x="219" y="121" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">A</text>
  <text x="265" y="121" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">B</text>
  <text x="311" y="121" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">B</text>
  <text x="265" y="161" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">C</text>
  <text x="311" y="161" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">D</text>
  <text x="173" y="121" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="173" y="161" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="173" y="201" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="219" y="201" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="265" y="201" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="311" y="201" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="173" y="81" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="219" y="81" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="265" y="81" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="311" y="81" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="120" y="234" font-size="13" fill="#666" filter="url(#rough2)">灰边 = 多补的一行/列 0</text>

  <!-- 公式 -->
  <rect x="420" y="70" width="190" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="96" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">矩形和 D：</text>
  <text x="515" y="122" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">S(右下) − S(上) − S(左)</text>
  <text x="515" y="144" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">+ S(左上)</text>
  <text x="515" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">（A 被减了两次，加回来）</text>

  <!-- 裁剪说明 -->
  <rect x="80" y="262" width="250" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="288" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">窗口越界要裁剪：</text>
  <text x="205" y="310" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">r1=max(i−k,0), r2=min(i+k,m−1)</text>

  <rect x="350" y="262" width="250" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="288" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">查询时下标整体 +1：</text>
  <text x="475" y="310" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">pre[r2+1][c2+1] − pre[r1][c2+1] …</text>

  <text x="320" y="348" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">角上的格子（如 (0,0)）窗口被裁到只剩 1×1，公式依然成立</text>
</svg>
