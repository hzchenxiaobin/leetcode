<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="390" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">交换后总和相等 ⇒ 解一个一次方程</text>
  <rect x="40" y="56" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190.0" y="85.9" text-anchor="middle" font-size="14" fill="#2c4a63" filter="url(#rough2)">sumA − x + y = sumB − y + x</text>
  <path d="M190 106 L190 132" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="40" y="134" width="300" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190.0" y="159.55" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">移项：2(x − y) = sumA − sumB</text>
  <text x="190.0" y="179.55" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">记 diff = (sumA − sumB) / 2</text>
  <path d="M190 196 L190 222" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="40" y="224" width="300" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190.0" y="249.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">y = x − diff</text>
  <text x="190.0" y="269.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">x 遍历 aliceSizes，查 y 是否在 bobSizes 中</text>
  <rect x="378" y="56" width="250" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="503.0" y="110.2" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">x 从 A 里取一盒</text>
  <text x="503.0" y="130.2" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">y = x − diff 必须恰好是 B 里的一盒</text>
  <text x="503.0" y="150.2" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">用哈希集合做 O(1) 查询</text>
  <rect x="378" y="214" width="250" height="72" fill="#f7f9fc" stroke="#9aa7b4" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="503.0" y="244.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案保证存在</text>
  <text x="503.0" y="264.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">所以枚举 x 一定能命中</text>
  <text x="330" y="300" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">只有 sumA、sumB 与 x 决定 y，不需要尝试所有 (x, y) 组合</text>
  <text x="24" y="348" text-anchor="start" font-size="12" fill="#33562a" filter="url(#rough2)">示例 1：sumA = 2，sumB = 4，diff = −1；x = 1 ⇒ y = 1 − (−1) = 2 ∈ B ✓</text>
</svg>
