<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">环形数组 → 展开成两倍长度</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">把「绕圈搜索」变成「线性后缀搜索」，再用单调栈一次扫完</text>

  <!-- 原数组 -->
  <text x="40" y="96" font-size="11" fill="#555">原数组 nums（n = 5）</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="100" y="104" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="152" y="104" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="204" y="104" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="256" y="104" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="308" y="104" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="126" fill="#3a4a66">1</text>
    <text x="178" y="126" fill="#3a4a66">2</text>
    <text x="230" y="126" fill="#3a4a66">3</text>
    <text x="282" y="126" fill="#3a4a66">4</text>
    <text x="334" y="126" fill="#3a4a66">3</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#999" text-anchor="middle">
    <text x="126" y="152">0</text>
    <text x="178" y="152">1</text>
    <text x="230" y="152">2</text>
    <text x="282" y="152">3</text>
    <text x="334" y="152">4</text>
  </g>
  <path d="M 350 100 Q 230 62 112 100" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="70" text-anchor="middle" font-size="10" fill="#8a3a36">循环：nums[n−1] 的下一个是 nums[0]</text>

  <!-- 展开数组 -->
  <text x="40" y="190" font-size="11" fill="#555">展开后只看前 2n−1 = 9 个位置</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="55" y="198" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="105" y="198" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="155" y="198" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="205" y="198" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="255" y="198" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="305" y="198" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="355" y="198" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="405" y="198" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="455" y="198" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="80" y="220" fill="#3a4a66">1</text>
    <text x="130" y="220" fill="#3a4a66">2</text>
    <text x="180" y="220" fill="#3a4a66">3</text>
    <text x="230" y="220" fill="#3a4a66">4</text>
    <text x="280" y="220" fill="#3a4a66">3</text>
    <text x="330" y="220" fill="#8a6a20">1</text>
    <text x="380" y="220" fill="#8a6a20">2</text>
    <text x="430" y="220" fill="#8a6a20">3</text>
    <text x="480" y="220" fill="#8a6a20">4</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#999" text-anchor="middle">
    <text x="80" y="246">0</text>
    <text x="130" y="246">1</text>
    <text x="180" y="246">2</text>
    <text x="230" y="246">3</text>
    <text x="280" y="246">4</text>
    <text x="330" y="246">5</text>
    <text x="380" y="246">6</text>
    <text x="430" y="246">7</text>
    <text x="480" y="246">8</text>
  </g>
  <text x="512" y="292" font-size="9" fill="#aaa">→ 位置</text>

  <rect x="55" y="262" width="450" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="71" y="282" font-size="9.5" fill="#3a5a30">① 下标 i 的答案若存在，位置 ≤ i+n−1 ≤ 2n−2，扫 2n−1 个就够</text>
  <text x="71" y="302" font-size="9.5" fill="#3a5a30">② 第二圈（i ≥ n）只用来回填答案，不入栈，避免同一下标压两次</text>
  <text x="71" y="318" font-size="9.5" fill="#6a8a5a">③ 原数组部分（蓝）是第一圈的「主场」，橙色部分只是影子</text>

  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#555">nums = [1,2,3,4,3] → [2,3,4,−1,4]，只有最大值 4 在整圈里都找不到更大的</text>
  <text x="280" y="376" text-anchor="middle" font-size="9.5" fill="#999">单调栈的合法性来自：更早出现的更大值会先把同一个下标弹掉，所以「弹出时遇到的一定是最近的更大值」</text>
</svg>
