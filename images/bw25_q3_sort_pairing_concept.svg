<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    排序后逐位对齐：「上等马压上等马」
  </text>

  <!-- 上排：x 排序 -->
  <text x="120" y="80" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">x 升序排列</text>
  <g filter="url(#rough2)" font-size="17">
    <rect x="76" y="92" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="120" y="92" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="164" y="92" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="98" y="120" text-anchor="middle" fill="#446688">a</text>
    <text x="142" y="120" text-anchor="middle" fill="#446688">b</text>
    <text x="186" y="120" text-anchor="middle" fill="#446688">c</text>
  </g>
  <text x="142" y="162" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">小 → 大</text>

  <!-- 下排：y 排序 -->
  <text x="380" y="80" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">y 升序排列</text>
  <g filter="url(#rough2)" font-size="17">
    <rect x="316" y="92" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="360" y="92" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="404" y="92" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="338" y="120" text-anchor="middle" fill="#2f5a24">a</text>
    <text x="382" y="120" text-anchor="middle" fill="#2f5a24">x</text>
    <text x="426" y="120" text-anchor="middle" fill="#2f5a24">y</text>
  </g>
  <text x="382" y="162" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">小 → 大</text>

  <!-- 三支配对箭头 -->
  <g filter="url(#rough2)">
    <path d="M 120 144 C 150 175, 260 190, 310 214" stroke="#4a7a3a" stroke-width="2.2" fill="none"
          marker-end="url(#arr)"/>
    <path d="M 164 146 C 220 195, 320 210, 354 214" stroke="#d6a040" stroke-width="2.2" fill="none"
          marker-end="url(#arr)"/>
    <path d="M 208 146 C 300 205, 380 212, 398 214" stroke="#b85450" stroke-width="2.2" fill="none"
          marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="13">
    <text x="212" y="196" fill="#4a7a3a">a ≥ a ✓</text>
    <text x="252" y="220" fill="#8a6a1a">b &lt; x ✗</text>
    <text x="316" y="244" fill="#b85450">c &lt; y ✗</text>
  </g>

  <!-- 结论框 -->
  <rect x="90" y="268" width="340" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    x 打破 y ⇔ 排序后逐位 x(i) ≥ y(i)
  </text>
  <text x="260" y="318" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    最大字符必须压住对方最大字符，否则永远差一口气
  </text>
</svg>
