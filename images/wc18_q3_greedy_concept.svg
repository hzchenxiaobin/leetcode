<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">IPO 核心观察：每轮在「已解锁」项目里挑利润最大</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">按启动资本排序 + 大顶堆，解锁集合单调不减，故可贪心</text>

  <text x="60" y="78" font-size="11" fill="#446688" filter="url(#rough2)">① 先按 capital 升序排序，指针 i 单向前进（永不回退）</text>

  <g>
    <rect x="60" y="88" width="90" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="105" y="106" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">cap = 0</text>
    <text x="105" y="124" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">profit = 1</text>

    <rect x="160" y="88" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="205" y="106" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">cap = 1</text>
    <text x="205" y="124" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">profit = 3</text>

    <rect x="260" y="88" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="305" y="106" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">cap = 1</text>
    <text x="305" y="124" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">profit = 2</text>

    <rect x="360" y="88" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="405" y="106" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">cap = 2</text>
    <text x="405" y="124" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">profit = 4</text>

    <rect x="460" y="88" width="70" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="495" y="118" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">…</text>
  </g>

  <text x="60" y="154" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">绿：capital ≤ w，已解锁并已入堆</text>
  <text x="250" y="154" font-size="9.5" fill="#446688" filter="url(#rough2)">蓝：capital &gt; w，暂时做不了</text>

  <path d="M 302 166 C 330 170, 344 172, 356 180" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="60" y="200" font-size="10.5" fill="#444" filter="url(#rough2)">② 把 capital ≤ w 的项目全部压入堆</text>
  <text x="60" y="222" font-size="10.5" fill="#444" filter="url(#rough2)">③ 弹出堆顶，w += 利润，共做 k 轮</text>
  <text x="60" y="244" font-size="10.5" fill="#444" filter="url(#rough2)">④ 堆空 ⇒ 没有能做的项目，提前返回</text>

  <text x="452" y="186" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">大顶堆（只存已解锁项目的利润）</text>

  <g>
    <path d="M 452 228 L 418 244" stroke="#8a6a20" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
    <path d="M 452 228 L 486 244" stroke="#8a6a20" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
    <rect x="422" y="200" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="452" y="220" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="392" y="246" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
    <text x="418" y="264" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">2</text>
    <rect x="460" y="246" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
    <text x="486" y="264" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">1</text>
    <text x="452" y="290" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">堆顶 = 眼下最大利润</text>
  </g>

  <rect x="60" y="300" width="480" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="320" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么贪心就最优？</text>
  <text x="76" y="340" font-size="9.8" fill="#555" filter="url(#rough2)">项目一旦解锁（capital ≤ w）就不再有额外代价，做它只会让 w 变大，</text>
  <text x="76" y="356" font-size="9.8" fill="#555" filter="url(#rough2)">所以「可做集合」只会变大、不会变小；每轮候选集合相同，取利润最大的那个即可。</text>

  <text x="300" y="402" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">示例：k=2, w=0 → 取 1（w=1）→ 解锁 cap=1 的两个项目 → 取 3 → 终值 4</text>
</svg>
