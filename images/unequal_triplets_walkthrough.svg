<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="55" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：[4,4,2,4,3] 的全部 C(5,3)=10 个三元组</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums row -->
  <text x="188" y="82" text-anchor="end" font-size="13" fill="#555" font-family="monospace">nums =</text>
  <g font-size="14">
    <g filter="url(#sk)"><rect x="200" y="60" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="222" y="81" text-anchor="middle" fill="#2b2b2b" font-family="monospace">4</text>
    <g filter="url(#sk)"><rect x="248" y="60" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="270" y="81" text-anchor="middle" fill="#2b2b2b" font-family="monospace">4</text>
    <g filter="url(#sk)"><rect x="296" y="60" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
    <text x="318" y="81" text-anchor="middle" fill="#2b2b2b" font-family="monospace">2</text>
    <g filter="url(#sk)"><rect x="344" y="60" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="366" y="81" text-anchor="middle" fill="#2b2b2b" font-family="monospace">4</text>
    <g filter="url(#sk)"><rect x="392" y="60" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
    <text x="414" y="81" text-anchor="middle" fill="#2b2b2b" font-family="monospace">3</text>
  </g>
  <text x="222" y="106" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="270" y="106" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="318" y="106" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="366" y="106" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="414" y="106" text-anchor="middle" font-size="10" fill="#999">4</text>

  <!-- two columns of triplets -->
  <g font-size="12" font-family="monospace">
    <g filter="url(#sk)"><rect x="90" y="122" width="215" height="24" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="0.9" opacity="0.75"/></g>
    <text x="197" y="138" text-anchor="middle" fill="#b03a3a">(0,1,2) → (4,4,2) ✗</text>
    <g filter="url(#sk)"><rect x="90" y="152" width="215" height="24" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="0.9" opacity="0.75"/></g>
    <text x="197" y="168" text-anchor="middle" fill="#b03a3a">(0,1,3) → (4,4,4) ✗</text>
    <g filter="url(#sk)"><rect x="90" y="182" width="215" height="24" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="0.9" opacity="0.75"/></g>
    <text x="197" y="198" text-anchor="middle" fill="#b03a3a">(0,1,4) → (4,4,3) ✗</text>
    <g filter="url(#sk)"><rect x="90" y="212" width="215" height="24" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="0.9" opacity="0.75"/></g>
    <text x="197" y="228" text-anchor="middle" fill="#b03a3a">(0,2,3) → (4,2,4) ✗</text>
    <g filter="url(#sk)"><rect x="90" y="242" width="215" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="197" y="258" text-anchor="middle" fill="#2e6e2e" font-weight="bold">(0,2,4) → (4,2,3) ✓</text>

    <g filter="url(#sk)"><rect x="335" y="122" width="215" height="24" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="0.9" opacity="0.75"/></g>
    <text x="442" y="138" text-anchor="middle" fill="#b03a3a">(0,3,4) → (4,4,3) ✗</text>
    <g filter="url(#sk)"><rect x="335" y="152" width="215" height="24" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="0.9" opacity="0.75"/></g>
    <text x="442" y="168" text-anchor="middle" fill="#b03a3a">(1,2,3) → (4,2,4) ✗</text>
    <g filter="url(#sk)"><rect x="335" y="182" width="215" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="442" y="198" text-anchor="middle" fill="#2e6e2e" font-weight="bold">(1,2,4) → (4,2,3) ✓</text>
    <g filter="url(#sk)"><rect x="335" y="212" width="215" height="24" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="0.9" opacity="0.75"/></g>
    <text x="442" y="228" text-anchor="middle" fill="#b03a3a">(1,3,4) → (4,4,3) ✗</text>
    <g filter="url(#sk)"><rect x="335" y="242" width="215" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="442" y="258" text-anchor="middle" fill="#2e6e2e" font-weight="bold">(2,3,4) → (2,4,3) ✓</text>
  </g>

  <!-- complement note -->
  <g filter="url(#sk)"><rect x="90" y="288" width="460" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="320" y="310" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">补集：10 − [C(3,2)·2 + C(3,3)] = 10 − 7 = 3</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#556">坏三元组 = 含「至少两个 4」的 7 个（按值 4 分类互斥）</text>

  <!-- summary -->
  <g filter="url(#sk)"><rect x="90" y="352" width="460" height="36" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">✗ 7 个 + ✓ 3 个 = 10 个 → ans = 3</text>
</svg>
