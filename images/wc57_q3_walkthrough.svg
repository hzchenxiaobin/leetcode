<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：跨行块注释吞掉换行，前后代码并成一行</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">source = ["a/*comment", "line", "more_comment*/b"]</text>

  <text x="34" y="78" font-size="9" fill="#999" filter="url(#rough2)">第 0 行</text>
  <g filter="url(#rough2)">
    <rect x="86" y="62" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="101" y="80" text-anchor="middle" font-size="11" fill="#3a4a66">a</text>
    <rect x="120" y="62" width="106" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5"/>
    <text x="173" y="80" text-anchor="middle" font-size="10" fill="#8a3a36">/*comment</text>
  </g>

  <text x="34" y="114" font-size="9" fill="#999" filter="url(#rough2)">第 1 行</text>
  <g filter="url(#rough2)">
    <rect x="120" y="98" width="106" height="26" fill="#fdeef1" stroke="#b85450" stroke-width="1.3" rx="5" stroke-dasharray="5 3"/>
    <text x="173" y="116" text-anchor="middle" font-size="10" fill="#b85450">line（整行被吞）</text>
  </g>

  <text x="34" y="150" font-size="9" fill="#999" filter="url(#rough2)">第 2 行</text>
  <g filter="url(#rough2)">
    <rect x="86" y="134" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5"/>
    <text x="151" y="152" text-anchor="middle" font-size="10" fill="#8a3a36">more_comment*/</text>
    <rect x="220" y="134" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="235" y="152" text-anchor="middle" font-size="11" fill="#3a4a66">b</text>
  </g>

  <path d="M 116 74 Q 250 52 344 96" stroke="#4a7a3a" stroke-width="1.5" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 252 158 Q 302 168 344 138" stroke="#4a7a3a" stroke-width="1.5" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="350" y="90" width="180" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="440" y="112" text-anchor="middle" font-size="10" fill="#3a5a30">两段代码被拼到同一行</text>
    <text x="440" y="134" text-anchor="middle" font-size="14" fill="#3a5a30">输出 "ab"</text>
  </g>

  <text x="86" y="176" font-size="9" fill="#b85450" filter="url(#rough2)">红 = 被删除的块注释（含中间的换行）</text>
  <text x="86" y="190" font-size="9" fill="#446688" filter="url(#rough2)">蓝 = 保留的代码字符</text>

  <g filter="url(#rough2)">
    <rect x="24" y="204" width="246" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="38" y="222" font-size="10" fill="#8a6a20" font-weight="bold">行注释：只砍掉 // 及其右侧</text>
    <text x="38" y="242" font-size="9.5" fill="#555">原：  // variable declaration</text>
    <text x="38" y="258" font-size="9.5" fill="#555">输出：  （两个空格，行非空 → 保留）</text>
    <text x="38" y="272" font-size="9" fill="#b85450">空格不算空行，不能顺手 trim</text>

    <rect x="290" y="204" width="246" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="304" y="222" font-size="10" fill="#8a3a36" font-weight="bold">整行被注释：删完为空则不输出</text>
    <text x="304" y="242" font-size="9.5" fill="#555">原：/* only */   →   输出：什么都不产生</text>
    <text x="304" y="258" font-size="9.5" fill="#555">原：// abc        →   输出：什么都不产生</text>
    <text x="304" y="272" font-size="9" fill="#8a3a36">只有长度 0 的输出行才被丢弃</text>
  </g>

  <text x="280" y="298" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">buffer 的跨行演化（示例 2 逐行结算）</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="24" y="310" width="112" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="80" y="331" font-size="9.5" fill="#3a4a66">第0行末 buffer="a"</text>
    <rect x="160" y="310" width="112" height="34" fill="#fdeef1" stroke="#b85450" stroke-width="1.4" rx="6"/>
    <text x="216" y="331" font-size="9.5" fill="#8a3a36">第1行末 保留 "a"</text>
    <rect x="296" y="310" width="112" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="352" y="331" font-size="9.5" fill="#3a4a66">第2行末 buffer="ab"</text>
    <rect x="432" y="310" width="106" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="485" y="331" font-size="9.5" fill="#3a5a30">输出一行 "ab"</text>
  </g>

  <g stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)">
    <path d="M 138 327 L 156 327"/>
    <path d="M 274 327 L 292 327"/>
    <path d="M 410 327 L 428 327"/>
  </g>

  <text x="280" y="372" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">关键：进块时不清空 buffer，出块后接着往里写；否则 "ab" 会被拆成两行</text>
  <text x="280" y="390" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">整块注释可覆盖 0 行、1 行或多行；每行扫完都做一次「行末结算」</text>
</svg>
