<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="337" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <rect width="640" height="330" fill="#fdfcf7"/>

  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">第二层 DP：g[l][r] —— 区间 [l, r] 内任意子数组的最大分数</text>

  <!-- 元素条 -->
  <rect x="74"  y="58" width="52" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <rect x="150" y="58" width="52" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <rect x="226" y="58" width="52" height="36" rx="6" fill="#f0f0ee" stroke="#999" stroke-width="1.3" filter="url(#sk)"/>
  <rect x="302" y="58" width="52" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <rect x="378" y="58" width="52" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="100" y="80" text-anchor="middle" font-size="13" fill="#2b4a6e">l</text>
  <text x="176" y="80" text-anchor="middle" font-size="13" fill="#2b4a6e">l+1</text>
  <text x="252" y="80" text-anchor="middle" font-size="13" fill="#777">⋯</text>
  <text x="328" y="80" text-anchor="middle" font-size="13" fill="#2b4a6e">r−1</text>
  <text x="404" y="80" text-anchor="middle" font-size="13" fill="#2b4a6e">r</text>

  <!-- 查询 O(1) 徽标 -->
  <rect x="498" y="62" width="132" height="28" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="564" y="80" text-anchor="middle" font-size="10.5" fill="#8a4440">查询 [l,r] → O(1) 读表</text>

  <!-- 跨度虚线引导 -->
  <path d="M 74 98 L 74 196" stroke="#bbb" stroke-width="1" stroke-dasharray="3 4" fill="none" filter="url(#sk)"/>
  <path d="M 150 98 L 150 196" stroke="#bbb" stroke-width="1" stroke-dasharray="3 4" fill="none" filter="url(#sk)"/>
  <path d="M 354 98 L 354 196" stroke="#bbb" stroke-width="1" stroke-dasharray="3 4" fill="none" filter="url(#sk)"/>
  <path d="M 430 98 L 430 196" stroke="#bbb" stroke-width="1" stroke-dasharray="3 4" fill="none" filter="url(#sk)"/>

  <!-- 类别①：[l, r−1] -->
  <rect x="74" y="118" width="280" height="22" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="214" y="133" text-anchor="middle" font-size="11" fill="#2b4a6e">① 子数组 ⊆ [l, r−1] → g[l][r−1]</text>

  <!-- 类别②：[l+1, r] -->
  <rect x="150" y="148" width="280" height="22" rx="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="163" text-anchor="middle" font-size="11" fill="#2e5e2e">② 子数组 ⊆ [l+1, r] → g[l+1][r]</text>

  <!-- 类别③：整段 [l, r] -->
  <rect x="74" y="178" width="356" height="22" rx="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="252" y="193" text-anchor="middle" font-size="11" fill="#7a5415">③ 子数组 = 整段 [l, r] → f[l][r]（第一层 DP 已算好）</text>

  <!-- 转移式 -->
  <rect x="90" y="214" width="460" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4440">g[l][r] = max{ g[l][r−1],  g[l+1][r],  f[l][r] }</text>
  <text x="320" y="258" text-anchor="middle" font-size="10.5" fill="#8a4440">边界：g[l][l] = nums[l]；三类不重不漏，覆盖 [l, r] 的全部子数组</text>

  <text x="320" y="300" text-anchor="middle" font-size="11" fill="#666">先花 O(n²) 把 g 表整个递推出来，10⁵ 个查询逐一 O(1) 取数</text>
</svg>
