<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历 + 「首次出现」表</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="170" y="44" width="280" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="310" y="67" font-size="11.5" fill="#3a4a66">s = 0，ans = 0，first[0] = 0</text>
  </g>

  <g stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M310,80 L310,100" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="115" y="104" width="390" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="310" y="125" font-size="11.5" fill="#8a6a20">对 i = 0 … n − 1 依次处理：</text>
    <text x="310" y="145" font-size="11" fill="#8a6a20">s += (hours[i] &gt; 8 ? +1 : −1)</text>
  </g>

  <g stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M310,156 L310,166" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <polygon points="310,168 405,204 310,240 215,204" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="310" y="209" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">s &gt; 0 ?</text>
  </g>

  <g stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M258,224 Q215,240 178,256" marker-end="url(#arr)"/>
    <path d="M362,224 Q405,240 442,256" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="28" y="258" width="250" height="64" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="153" y="280" font-size="11.5" fill="#3a5a30" font-weight="bold">是：ans = i + 1</text>
    <text x="153" y="302" font-size="10.5" fill="#3a5a30">从 0 开始整段都合法，必然最长</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="342" y="258" width="250" height="64" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="467" y="280" font-size="11.5" fill="#8a3a36" font-weight="bold">否：若 first[s − 1] 存在</text>
    <text x="467" y="302" font-size="10" fill="#8a3a36">ans = max(ans, i + 1 − first[s − 1])</text>
  </g>

  <g stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M153,322 Q180,338 216,346" marker-end="url(#arr)"/>
    <path d="M467,322 Q440,338 404,346" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="146" y="348" width="328" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="310" y="374" font-size="11" fill="#3a4a66">若 first[s] 未记录 → first[s] = i + 1</text>
  </g>

  <g stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M310,390 L310,406" marker-end="url(#arr)"/>
  </g>

  <text x="310" y="424" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">返回 ans（没有合法区间时保持 0）</text>
</svg>
