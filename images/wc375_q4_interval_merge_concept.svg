<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">好分割的本质：同值锁区间 → 相交合并成块 → 块间自由切</text>
  <path d="M 230 40 Q 470 49 710 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: array cells, same values must stay together ===== -->
  <text x="470" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 同值必须同段：每个值锁定区间 [first(v), last(v)]（示例 nums = [2,1,2,3,3,4,5,4]）</text>

  <g font-size="10" fill="#999">
    <text x="184" y="94" text-anchor="middle" filter="url(#sk)">0</text>
    <text x="256" y="94" text-anchor="middle" filter="url(#sk)">1</text>
    <text x="328" y="94" text-anchor="middle" filter="url(#sk)">2</text>
    <text x="400" y="94" text-anchor="middle" filter="url(#sk)">3</text>
    <text x="472" y="94" text-anchor="middle" filter="url(#sk)">4</text>
    <text x="544" y="94" text-anchor="middle" filter="url(#sk)">5</text>
    <text x="616" y="94" text-anchor="middle" filter="url(#sk)">6</text>
    <text x="688" y="94" text-anchor="middle" filter="url(#sk)">7</text>
  </g>

  <g filter="url(#sk)"><rect x="150" y="100" width="68" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="184" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="222" y="100" width="68" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="256" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="294" y="100" width="68" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="328" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="366" y="100" width="68" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="400" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="438" y="100" width="68" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="472" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="510" y="100" width="68" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="544" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="582" y="100" width="68" height="32" rx="4" fill="#f0ede4" stroke="#999999" stroke-width="1.5"/></g>
  <text x="616" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#777" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="654" y="100" width="68" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="688" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">4</text>

  <path d="M 184 138 Q 256 168 328 138" stroke="#4a8edb" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="256" y="182" text-anchor="middle" font-size="10" fill="#2b6e9e" filter="url(#sk)">值2 → [0,2]</text>
  <path d="M 400 138 Q 436 160 472 138" stroke="#c98a2b" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="436" y="176" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">值3 → [3,4]</text>
  <path d="M 544 138 Q 616 172 688 138" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="616" y="184" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">值4 → [5,7]</text>
  <text x="470" y="202" text-anchor="middle" font-size="11.5" font-style="italic" fill="#666" filter="url(#sk)">区间 [first(v), last(v)] 内部的任何切割都会把 v 劈进两个子数组 → 禁止</text>

  <!-- ===== Panel 2: value -> interval bars ===== -->
  <text x="470" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a" filter="url(#sk)">② 值 → 区间；相交的区间互相锁死，必须挤进同一段</text>

  <g stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)">
    <path d="M 150 238 L 150 402"/><path d="M 222 238 L 222 402"/><path d="M 294 238 L 294 402"/>
    <path d="M 366 238 L 366 402"/><path d="M 438 238 L 438 402"/><path d="M 510 238 L 510 402"/>
    <path d="M 582 238 L 582 402"/><path d="M 654 238 L 654 402"/><path d="M 726 238 L 726 402"/>
  </g>

  <text x="142" y="254" text-anchor="end" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">值 2</text>
  <g filter="url(#sk)"><rect x="150" y="240" width="216" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="374" y="254" font-size="10" fill="#888" filter="url(#sk)">[0,2]</text>

  <text x="142" y="280" text-anchor="end" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">值 1</text>
  <g filter="url(#sk)"><rect x="222" y="266" width="72" height="20" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="302" y="280" font-size="10" fill="#888" filter="url(#sk)">[1,1] ⊂ 值2</text>

  <text x="142" y="306" text-anchor="end" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">值 3</text>
  <g filter="url(#sk)"><rect x="366" y="292" width="144" height="20" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="518" y="306" font-size="10" fill="#888" filter="url(#sk)">[3,4]</text>

  <text x="142" y="332" text-anchor="end" font-size="11" font-weight="bold" fill="#777" filter="url(#sk)">值 5</text>
  <g filter="url(#sk)"><rect x="582" y="318" width="72" height="20" rx="4" fill="#f0ede4" stroke="#999999" stroke-width="1.4"/></g>
  <text x="662" y="332" font-size="10" fill="#888" filter="url(#sk)">[6,6] ⊂ 值4</text>

  <text x="142" y="358" text-anchor="end" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">值 4</text>
  <g filter="url(#sk)"><rect x="510" y="344" width="216" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="734" y="358" font-size="10" fill="#888" filter="url(#sk)">[5,7]</text>

  <g font-size="9.5" fill="#aaa" text-anchor="middle">
    <g filter="url(#sk)"><rect x="143" y="378" width="14" height="12" fill="#fdfcf7"/></g><text x="150" y="388" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="215" y="378" width="14" height="12" fill="#fdfcf7"/></g><text x="222" y="388" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="287" y="378" width="14" height="12" fill="#fdfcf7"/></g><text x="294" y="388" filter="url(#sk)">2</text>
    <g filter="url(#sk)"><rect x="359" y="378" width="14" height="12" fill="#fdfcf7"/></g><text x="366" y="388" filter="url(#sk)">3</text>
    <g filter="url(#sk)"><rect x="431" y="378" width="14" height="12" fill="#fdfcf7"/></g><text x="438" y="388" filter="url(#sk)">4</text>
    <g filter="url(#sk)"><rect x="503" y="378" width="14" height="12" fill="#fdfcf7"/></g><text x="510" y="388" filter="url(#sk)">5</text>
    <g filter="url(#sk)"><rect x="575" y="378" width="14" height="12" fill="#fdfcf7"/></g><text x="582" y="388" filter="url(#sk)">6</text>
    <g filter="url(#sk)"><rect x="647" y="378" width="14" height="12" fill="#fdfcf7"/></g><text x="654" y="388" filter="url(#sk)">7</text>
    <g filter="url(#sk)"><rect x="719" y="378" width="14" height="12" fill="#fdfcf7"/></g><text x="726" y="388" filter="url(#sk)">8</text>
  </g>

  <!-- ===== Panel 3: merged blocks ===== -->
  <text x="470" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">③ 合并得 m = 3 个块；块内禁切 ✗，块间自由 ✓</text>

  <g filter="url(#sk)"><rect x="150" y="430" width="212" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="256" y="449" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">块₁ [0,2]</text>
  <text x="256" y="466" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">值{1,2}</text>

  <g filter="url(#sk)"><rect x="370" y="430" width="132" height="44" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="436" y="449" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">块₂ [3,4]</text>
  <text x="436" y="466" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">值{3}</text>

  <g filter="url(#sk)"><rect x="510" y="430" width="212" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="616" y="449" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">块₃ [5,7]</text>
  <text x="616" y="466" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">值{4,5}</text>

  <g font-size="10" fill="#b85450" opacity="0.75" text-anchor="middle">
    <text x="222" y="457" filter="url(#sk)">✗</text><text x="294" y="457" filter="url(#sk)">✗</text>
    <text x="438" y="457" filter="url(#sk)">✗</text>
    <text x="582" y="457" filter="url(#sk)">✗</text><text x="654" y="457" filter="url(#sk)">✗</text>
  </g>

  <g filter="url(#sk)"><circle cx="366" cy="452" r="12" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="366" y="457" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="366" y="492" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">间隙A</text>
  <g filter="url(#sk)"><circle cx="506" cy="452" r="12" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="506" y="457" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="506" y="492" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">间隙B</text>

  <text x="756" y="446" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">m = 3 个块</text>
  <text x="756" y="468" font-size="11" fill="#666" filter="url(#sk)">自由间隙 = m−1 = 2</text>

  <!-- ===== Panel 4: counting formula ===== -->
  <g filter="url(#sk)"><rect x="150" y="512" width="380" height="80" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="340" y="544" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">好分割数 = 2<tspan dy="-7" font-size="10">m−1</tspan><tspan dy="7">（m 为块数）</tspan></text>
  <text x="340" y="574" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">本例：m = 3 ⇒ 2² = 4</text>

  <g filter="url(#sk)"><rect x="550" y="512" width="172" height="80" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="636" y="540" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">自由间隙 {A,B} 的子集</text>
  <text x="636" y="566" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">∅、{A}、{B}、{A,B}</text>

  <!-- ===== key insight ===== -->
  <g filter="url(#sk)"><rect x="60" y="618" width="860" height="72" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="490" y="644" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">关键洞察：切割约束逐间隙独立——只需数出「可切间隙」的个数 c，答案 = 2<tspan dy="-6" font-size="9">c</tspan></text>
  <text x="490" y="668" text-anchor="middle" font-size="11.5" fill="#7a2828" filter="url(#sk)">reach 一次扫描 = 「划分字母区间」（LC 763）的贪心骨架 + 一步组合计数</text>
</svg>
