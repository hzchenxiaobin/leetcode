<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：三个代表情形</text>
  <text x="320" y="48" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">排序 → 取 d = arr[1] − arr[0] → 逐对验证相邻差，首个不等立即失败</text>

  <!-- Panel A: [3,5,1] true -->
  <g filter="url(#r)">
    <rect x="56" y="62" width="528" height="126" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="76" y="86" text-anchor="start" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">情形 A｜arr = [3, 5, 1]</text>
  <text x="568" y="86" text-anchor="end" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">true ✓</text>
  <g filter="url(#r)">
    <rect x="84" y="96" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="140" y="96" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="196" y="96" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="300" y="96" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="356" y="96" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="412" y="96" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <path d="M 254 113 L 286 113" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="270" y="106" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#r)">排序</text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="108" y="118" fill="#33517a" filter="url(#r)">3</text>
    <text x="164" y="118" fill="#a0761e" filter="url(#r)">5</text>
    <text x="220" y="118" fill="#2e6e2e" filter="url(#r)">1</text>
    <text x="324" y="118" fill="#2e6e2e" filter="url(#r)">1</text>
    <text x="380" y="118" fill="#2e6e2e" filter="url(#r)">3</text>
    <text x="436" y="118" fill="#2e6e2e" filter="url(#r)">5</text>
  </g>
  <g stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#r)">
    <path d="M 324 132 Q 352 146 380 132"/>
    <path d="M 380 132 Q 408 146 436 132"/>
  </g>
  <text x="352" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">+2 ✓</text>
  <text x="408" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">+2 ✓</text>
  <text x="320" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">d = 2，相邻差 2, 2 全部相等 → true ✓</text>

  <!-- Panel B: [1,2,4] false -->
  <g filter="url(#r)">
    <rect x="56" y="196" width="528" height="126" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="76" y="220" text-anchor="start" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">情形 B｜arr = [1, 2, 4]</text>
  <text x="568" y="220" text-anchor="end" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">false ✗</text>
  <g filter="url(#r)">
    <rect x="84" y="230" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="140" y="230" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="196" y="230" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="300" y="230" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="356" y="230" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="412" y="230" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M 254 247 L 286 247" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="270" y="240" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#r)">排序</text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="108" y="252" fill="#33517a" filter="url(#r)">1</text>
    <text x="164" y="252" fill="#a0761e" filter="url(#r)">2</text>
    <text x="220" y="252" fill="#2e6e2e" filter="url(#r)">4</text>
    <text x="324" y="252" fill="#33517a" filter="url(#r)">1</text>
    <text x="380" y="252" fill="#33517a" filter="url(#r)">2</text>
    <text x="436" y="252" fill="#33517a" filter="url(#r)">4</text>
  </g>
  <g fill="none" filter="url(#r)">
    <path d="M 324 266 Q 352 280 380 266" stroke="#4a7a3a" stroke-width="1.5"/>
    <path d="M 380 266 Q 408 280 436 266" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="352" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">+1 ✓</text>
  <text x="408" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">+2 ✗</text>
  <text x="320" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">d = 1，但 4 − 2 = 2 ≠ 1 → 在 i = 2 处失败 → false ✗</text>

  <!-- Panel C: [7,7,7] d = 0 -->
  <g filter="url(#r)">
    <rect x="56" y="330" width="528" height="126" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="76" y="354" text-anchor="start" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">情形 C｜arr = [7, 7, 7]</text>
  <text x="568" y="354" text-anchor="end" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">true ✓</text>
  <g filter="url(#r)">
    <rect x="84" y="364" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="140" y="364" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="196" y="364" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="300" y="364" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="356" y="364" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="412" y="364" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M 254 381 L 286 381" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="270" y="374" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#r)">排序（不变）</text>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#a0761e">
    <text x="108" y="386" filter="url(#r)">7</text>
    <text x="164" y="386" filter="url(#r)">7</text>
    <text x="220" y="386" filter="url(#r)">7</text>
    <text x="324" y="386" filter="url(#r)">7</text>
    <text x="380" y="386" filter="url(#r)">7</text>
    <text x="436" y="386" filter="url(#r)">7</text>
  </g>
  <g stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#r)">
    <path d="M 324 400 Q 352 414 380 400"/>
    <path d="M 380 400 Q 408 414 436 400"/>
  </g>
  <text x="352" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#r)">+0 ✓</text>
  <text x="408" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#r)">+0 ✓</text>
  <text x="320" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#r)">d = 0：公差为零也是合法等差数列 → true ✓</text>

  <!-- boundary note -->
  <g filter="url(#r)">
    <rect x="56" y="470" width="528" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="495" text-anchor="middle" font-size="11.5" fill="#8a4a44" filter="url(#r)">边界：n = 2 时循环体不执行 → 任意两个数必成等差数列，直接返回 true（无需特判）</text>
</svg>
