<svg xmlns="http://www.w3.org/2000/svg" width="700" height="524" viewBox="0 0 700 524"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="700" height="524" fill="#fafafa"/>

  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：两种情形 + O(n) 个候选值</text>
  <path d="M 118 43 Q 350 49 582 43" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="196" y="54" width="308" height="46" rx="23" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="82" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n, ℓ 与数组 a（多测循环）</text>
  <path d="M 350 100 L 350 120" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="196" y="122" width="308" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="145" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">升序排序 a，做前缀和</text>
  <text x="350" y="167" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">r = ⌊√(ℓ-1)⌋</text>

  <path d="M 350 178 L 350 194" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 174 194 L 526 194" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 174 194 L 174 202" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 526 194 L 526 202" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 情形 A -->
  <rect x="36" y="204" width="276" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="174" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a33b36" filter="url(#rough2)">情形 A：a_n 保持不动</text>
  <text x="174" y="248" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">x = min(a_{n-1}, ⌊(ℓ-1)/a_n⌋)</text>
  <text x="174" y="270" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">y = a_n</text>
  <text x="174" y="292" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">只有 1 个候选</text>

  <!-- 情形 B -->
  <rect x="388" y="204" width="276" height="118" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="526" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">情形 B：a_n 也要降低</text>
  <text x="526" y="248" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">x ∈ [lo, hi]</text>
  <text x="526" y="270" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">lo = ⌊(ℓ-1)/a_n⌋ + 1</text>
  <text x="526" y="292" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">hi = min(a_{n-1}, r)</text>
  <text x="526" y="314" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">候选 {lo, hi, a_i, a_i - 1}</text>

  <path d="M 174 300 L 174 338" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 526 322 L 526 338" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 174 338 L 526 338" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 350 338 L 350 358" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="182" y="360" width="336" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="382" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">eval(x)：y = min(a_n, ⌊(ℓ-1)/x⌋)</text>
  <text x="350" y="404" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">f = S(x) + x + y，S(x) 用前缀和 + 二分</text>
  <text x="350" y="426" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">y &lt; x 的候选直接跳过</text>

  <path d="M 350 436 L 350 456" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="182" y="458" width="336" height="50" rx="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="480" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">取所有候选的最大 f</text>
  <text x="350" y="500" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">输出 Σa_i - max f（每组一行）</text>
</svg>
