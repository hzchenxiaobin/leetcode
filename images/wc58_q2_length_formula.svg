<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：每段长度由 n 与 k 唯一确定</text>
  <text x="300" y="54" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">数出总长 n 之后，长度向量就被题面条件锁死，不需要任何试错</text>

  <g filter="url(#rough2)">
    <rect x="30" y="76" width="250" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="155" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20">长度公式</text>
    <text x="48" y="132" font-size="13" fill="#6a5220">base = n / k 向下取整</text>
    <text x="48" y="160" font-size="13" fill="#6a5220">extra = n mod k</text>
    <text x="48" y="188" font-size="12.5" fill="#6a5220">前 extra 段：base + 1</text>
    <text x="48" y="214" font-size="12.5" fill="#6a5220">其余 k − extra 段：base</text>
    <text x="48" y="238" font-size="11" fill="#9a7a30">长度差 ≤ 1 ⇒ 只可能是这种排布</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="310" y="76" width="260" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="440" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a4a66">n = 10，k = 3 → 4, 3, 3</text>
    <text x="326" y="141" font-size="11" fill="#3a4a66">段 0</text>
    <rect x="362" y="122" width="88" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="406" y="139" text-anchor="middle" font-size="10.5" fill="#3a4a66">1 2 3 4</text>
    <text x="326" y="175" font-size="11" fill="#3a4a66">段 1</text>
    <rect x="362" y="156" width="66" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="395" y="173" text-anchor="middle" font-size="10.5" fill="#3a4a66">5 6 7</text>
    <text x="326" y="209" font-size="11" fill="#3a4a66">段 2</text>
    <rect x="362" y="190" width="66" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="395" y="207" text-anchor="middle" font-size="10.5" fill="#3a4a66">8 9 10</text>
    <text x="440" y="235" text-anchor="middle" font-size="10.5" fill="#5a6a86">只有前 extra = 1 段多 1 个结点</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="262" width="540" height="110" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.6" rx="10"/>
    <text x="300" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a4a66">n = 3，k = 5 → base = 0，extra = 3 → 1, 1, 1, 0, 0</text>
    <rect x="66" y="306" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="98" y="328" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
    <rect x="152" y="306" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="184" y="328" text-anchor="middle" font-size="12" fill="#3a4a66">2</text>
    <rect x="238" y="306" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="270" y="328" text-anchor="middle" font-size="12" fill="#3a4a66">3</text>
    <rect x="324" y="306" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" stroke-dasharray="5 4" filter="url(#rough2)"/>
    <text x="356" y="328" text-anchor="middle" font-size="10" fill="#8a3a36">null</text>
    <rect x="410" y="306" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" stroke-dasharray="5 4" filter="url(#rough2)"/>
    <text x="442" y="328" text-anchor="middle" font-size="10" fill="#8a3a36">null</text>
    <text x="300" y="360" text-anchor="middle" font-size="10.5" fill="#777">段数为 k = 5，结点只有 3 个：后两段是空段，返回数组长度仍是 5</text>
  </g>
</svg>
