<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：建逆序 Trie，再数叶子</text>

  <rect x="170" y="52" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">读入 words</text>
  <path d="M 260 86 L 260 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="106" width="240" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">逆序插入 Trie</text>
  <text x="260" y="141" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">for ch in reversed(w)：缺边就新建节点</text>
  <path d="M 260 152 L 260 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="172" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">DFS(node, depth)，全树只走一遍</text>
  <path d="M 260 208 L 260 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,222 370,262 260,302 150,262" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">node 无子节点？</text>

  <path d="M 150 262 L 120 262 L 120 320" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 370 262 L 396 262 L 396 320" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="252" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="24" y="324" width="192" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="343" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">叶子 = 不是别人后缀</text>
  <text x="120" y="362" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">ans += depth + 1</text>

  <rect x="304" y="324" width="192" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="343" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">内部节点 = 被人覆盖</text>
  <text x="400" y="362" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">对每个 child 递归 depth+1</text>

  <path d="M 120 376 L 120 392 L 200 392 L 200 402" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 376 L 400 392 L 320 392 L 320 402" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="404" width="240" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="428" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">返回 ans（各叶子深度 + 1 之和）</text>

  <text x="260" y="462" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(Σ|w|)，空间 O(Σ|w|)，n ≤ 2000、|w| ≤ 7</text>
</svg>
