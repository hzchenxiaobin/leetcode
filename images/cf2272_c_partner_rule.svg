<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="436" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">涂黑不可逆 ⟹ 每个黑格都要有距离 ≤ k 的伙伴</text>
  <path d="M 120 42 Q 380 49 636 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 数轴示例 -->
  <rect x="24" y="54" width="712" height="182" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="78" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">例：a = {0, 2, 3, 6, 8}，取 k = 1、x = 2，此时答案就是 1</text>

  <path d="M 56 146 L 660 146" stroke="#8a97a6" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 80 139 L 80 153" stroke="#8a97a6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 148 139 L 148 153" stroke="#8a97a6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 216 139 L 216 153" stroke="#8a97a6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 284 139 L 284 153" stroke="#8a97a6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 352 139 L 352 153" stroke="#8a97a6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 420 139 L 420 153" stroke="#8a97a6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 488 139 L 488 153" stroke="#8a97a6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 556 139 L 556 153" stroke="#8a97a6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 624 139 L 624 153" stroke="#8a97a6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 救活连线：补点 → 被救的 a 点 -->
  <path d="M 148 135 L 148 114 L 80 114 L 80 128" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 556 135 L 556 114 L 488 114 L 488 128" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 556 135 L 556 114 L 624 114 L 624 128" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="106" y="104" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">补 1 救 0</text>
  <text x="556" y="104" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">补 7 一次救 6 与 8（相距 2 = 2k）</text>

  <!-- a 中的点（实心） -->
  <circle cx="80" cy="146" r="8.5" fill="#446688" stroke="#2f4a66" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="216" cy="146" r="8.5" fill="#446688" stroke="#2f4a66" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="284" cy="146" r="8.5" fill="#446688" stroke="#2f4a66" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="488" cy="146" r="8.5" fill="#446688" stroke="#2f4a66" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="624" cy="146" r="8.5" fill="#446688" stroke="#2f4a66" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 补充点（空心） -->
  <circle cx="148" cy="146" r="8.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="556" cy="146" r="8.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 孤立点红圈 -->
  <circle cx="80" cy="146" r="15" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="488" cy="146" r="15" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="624" cy="146" r="15" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- 刻度数字 -->
  <text x="80" y="180" text-anchor="middle" font-size="11.5" fill="#5b6675" filter="url(#rough2)">0</text>
  <text x="148" y="180" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="216" y="180" text-anchor="middle" font-size="11.5" fill="#5b6675" filter="url(#rough2)">2</text>
  <text x="284" y="180" text-anchor="middle" font-size="11.5" fill="#5b6675" filter="url(#rough2)">3</text>
  <text x="352" y="180" text-anchor="middle" font-size="11.5" fill="#a9b3bf" filter="url(#rough2)">4</text>
  <text x="420" y="180" text-anchor="middle" font-size="11.5" fill="#a9b3bf" filter="url(#rough2)">5</text>
  <text x="488" y="180" text-anchor="middle" font-size="11.5" fill="#5b6675" filter="url(#rough2)">6</text>
  <text x="556" y="180" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">7</text>
  <text x="624" y="180" text-anchor="middle" font-size="11.5" fill="#5b6675" filter="url(#rough2)">8</text>

  <text x="42" y="212" font-size="11.5" fill="#66788c" filter="url(#rough2)">实心 = a 中的点；橙色空心 = 补充点（至多 x 个）；红圈 = k = 1 时左右间隔都 &gt; 1 的孤立点</text>

  <rect x="24" y="250" width="348" height="112" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="274" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">只需要给孤立点补点</text>
  <text x="44" y="298" font-size="12" fill="#3c5e2e" filter="url(#rough2)">孤立点 = 左右相邻的 a 间隔都 &gt; k</text>
  <text x="44" y="320" font-size="12" fill="#3c5e2e" filter="url(#rough2)">补点紧贴某个 a，天然有伙伴</text>
  <text x="44" y="342" font-size="12" fill="#3c5e2e" filter="url(#rough2)">已有 ≤ k 的 a 伙伴的点不用管</text>

  <rect x="388" y="250" width="348" height="112" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="274" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">一个补点最多救 2 个</text>
  <text x="408" y="298" font-size="12" fill="#8a6015" filter="url(#rough2)">孤立点两两间隔都 &gt; k</text>
  <text x="408" y="320" font-size="12" fill="#8a6015" filter="url(#rough2)">3 点跨度 &gt; 2k，一个点救不全</text>
  <text x="408" y="342" font-size="12" fill="#8a6015" filter="url(#rough2)">可共救 ⟺ 两者相距 ≤ 2k</text>

  <text x="24" y="390" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">最少补点数 add = 孤立点数 − 最大配对数（沿坐标贪心配对）</text>
  <text x="24" y="416" font-size="12" fill="#66788c" filter="url(#rough2)">这就是 check(k)：O(n) 算出 add 并判定 add ≤ x，外层对 k 二分即得答案</text>
</svg>
