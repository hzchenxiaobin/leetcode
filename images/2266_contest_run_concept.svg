<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="520" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：按极大同字符段切开，段内计数就是爬楼梯</text>
  <path d="M 110 42 Q 350 52 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- pressedKeys cells -->
  <g filter="url(#sk)">
    <rect x="230" y="62" width="44" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="274" y="62" width="44" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="318" y="62" width="44" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="406" y="62" width="44" height="44" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="450" y="62" width="44" height="44" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="252" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="296" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="340" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="428" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="472" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">3</text>
  <!-- scissors cut between runs -->
  <path d="M 384 56 L 384 112" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="384" y="50" text-anchor="middle" font-size="13" fill="#b85450">✂ 字符不同</text>
  <text x="296" y="128" text-anchor="middle" font-size="12" fill="#2b6e9e">run₁ = "222"，k = 3 个字母</text>
  <text x="450" y="128" text-anchor="middle" font-size="12" fill="#2e6e2e">run₂ = "33"，k = 3</text>

  <!-- left panel: 4 splittings of "222" -->
  <g filter="url(#sk)">
    <rect x="26" y="148" width="316" height="238" rx="10" fill="#f2f7fc" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="184" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">run "222"：4 种切分 ↔ 4 种文字</text>
  <!-- row 1: [1,1,1] aaa -->
  <g filter="url(#sk)">
    <rect x="56" y="188" width="22" height="22" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="80" y="188" width="22" height="22" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="104" y="188" width="22" height="22" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="150" y="204" font-size="12" fill="#555" font-family="monospace">[1,1,1]</text>
  <path d="M 212 199 L 246 199" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="256" y="204" font-size="13" font-weight="bold" fill="#c98a2b">aaa</text>
  <!-- row 2: [1,2] ab -->
  <g filter="url(#sk)">
    <rect x="56" y="226" width="22" height="22" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="80" y="226" width="46" height="22" rx="3" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="150" y="242" font-size="12" fill="#555" font-family="monospace">[1,2]</text>
  <path d="M 212 237 L 246 237" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="256" y="242" font-size="13" font-weight="bold" fill="#c98a2b">ab</text>
  <!-- row 3: [2,1] ba -->
  <g filter="url(#sk)">
    <rect x="56" y="264" width="46" height="22" rx="3" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="104" y="264" width="22" height="22" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="150" y="280" font-size="12" fill="#555" font-family="monospace">[2,1]</text>
  <path d="M 212 275 L 246 275" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="256" y="280" font-size="13" font-weight="bold" fill="#c98a2b">ba</text>
  <!-- row 4: [3] c -->
  <g filter="url(#sk)">
    <rect x="56" y="302" width="70" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="150" y="318" font-size="12" fill="#555" font-family="monospace">[3]</text>
  <path d="M 212 313 L 246 313" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="256" y="318" font-size="13" font-weight="bold" fill="#c98a2b">c</text>
  <text x="184" y="360" text-anchor="middle" font-size="11.5" fill="#666">块长 1..k，每块按 2 次得到该位置字母</text>
  <text x="184" y="378" text-anchor="middle" font-size="11.5" fill="#666">切分 ↔ 文字 是双射</text>

  <!-- right panel: 2 splittings of "33" -->
  <g filter="url(#sk)">
    <rect x="366" y="148" width="308" height="112" rx="10" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="520" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">run "33"：2 种切分</text>
  <g filter="url(#sk)">
    <rect x="396" y="188" width="22" height="22" rx="3" fill="#fff" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="420" y="188" width="22" height="22" rx="3" fill="#fff" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="466" y="204" font-size="12" fill="#555" font-family="monospace">[1,1]</text>
  <path d="M 512 199 L 546 199" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="556" y="204" font-size="13" font-weight="bold" fill="#c98a2b">dd</text>
  <g filter="url(#sk)">
    <rect x="396" y="226" width="46" height="22" rx="3" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="466" y="242" font-size="12" fill="#555" font-family="monospace">[2]</text>
  <path d="M 512 237 L 546 237" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="556" y="242" font-size="13" font-weight="bold" fill="#c98a2b">e</text>

  <!-- right panel: k=4 note -->
  <g filter="url(#sk)">
    <rect x="366" y="274" width="308" height="60" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="520" y="298" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a15">字符是 7 或 9 时 k = 4</text>
  <text x="520" y="320" text-anchor="middle" font-size="11.5" fill="#666">7 → pqrs，9 → wxyz，块长可到 4</text>

  <!-- recurrence box -->
  <g filter="url(#sk)">
    <rect x="366" y="344" width="308" height="42" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="520" y="370" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">f(0)=1, f(i)=f(i−1)+…+f(i−k)</text>

  <!-- bottom bar -->
  <g filter="url(#sk)">
    <rect x="26" y="436" width="648" height="50" rx="8" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="50" y="466" font-size="13" fill="#333">段与段之间独立（乘法原理）：</text>
  <text x="278" y="466" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans = 4 × 2 = 8</text>
  <text x="470" y="466" font-size="12" fill="#666">与示例 1 一致 ✓</text>
</svg>
