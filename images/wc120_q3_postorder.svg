<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="348" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1：root = [3,0,0] 的后序演算</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">ans 累加两条子边的 |盈余|，返回值把差额上报给父节点</text>
  <text x="30" y="74" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">后序遍历：先算左右子树，再汇总到当前节点</text>
  <rect x="30" y="92" width="150" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="105.0" y="114.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">① 左孩子 3</text>
  <text x="196" y="116" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">返回 3 − 1 = 2</text>
  <text x="400" y="116" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">ans += 0</text>
  <rect x="30" y="146" width="150" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="105.0" y="168.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">② 右孩子 0</text>
  <text x="196" y="170" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">返回 0 − 1 = −1</text>
  <text x="400" y="170" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">ans += 0</text>
  <rect x="30" y="200" width="150" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="105.0" y="222.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">③ 根 0</text>
  <text x="196" y="224" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">返回 0 + 2 + (−1) − 1 = 0</text>
  <text x="400" y="224" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">ans += |2| + |−1| = 3</text>
  <rect x="30" y="262" width="500" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="283" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">为什么答案等于 Σ|盈余|</text><text x="40" y="298.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每条边的净流量被迫等于子树差额，移动次数 ≥ 净流量</text><text x="40" y="314.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">自底向上按差额搬运恰好达到下界 → 最小</text>
</svg>
