<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="410" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把 s 看成一条「余额折线」：回到 0 处就是合法切点</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">记 b(i) = 前缀里 L 的个数 − R 的个数；子串 (j, i] 平衡 ⟺ b(i) = b(j)</text>

  <g font-size="10.5" text-anchor="middle">
    <rect x="404" y="58" width="94" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="451" y="74" fill="#3a5a30" filter="url(#rough2)">读到 L → b+1</text>
    <rect x="508" y="58" width="94" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="555" y="74" fill="#8a3a36" filter="url(#rough2)">读到 R → b−1</text>
  </g>

  <text x="70" y="174" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="70" y="204" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">−1</text>
  <text x="70" y="234" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">−2</text>

  <path d="M 76 170 L 612 170" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="616" y="166" font-size="10" fill="#999" filter="url(#rough2)">b = 0</text>

  <path d="M 78 170 L 129 200 L 180 170 L 231 200 L 282 230 L 333 200 L 384 170 L 435 200 L 486 170 L 537 200 L 588 170"
        stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <g fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8">
    <circle cx="78" cy="170" r="5.5" filter="url(#rough2)"/>
    <circle cx="180" cy="170" r="5.5" filter="url(#rough2)"/>
    <circle cx="384" cy="170" r="5.5" filter="url(#rough2)"/>
    <circle cx="486" cy="170" r="5.5" filter="url(#rough2)"/>
    <circle cx="588" cy="170" r="5.5" filter="url(#rough2)"/>
  </g>

  <g stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4 4" fill="none">
    <path d="M 180 176 L 180 294" filter="url(#rough2)"/>
    <path d="M 384 176 L 384 294" filter="url(#rough2)"/>
    <path d="M 486 176 L 486 294" filter="url(#rough2)"/>
  </g>

  <text x="90" y="252" font-size="10" fill="#8a3a36" filter="url(#rough2)">b 可以为负，</text>
  <text x="90" y="268" font-size="10" fill="#8a3a36" filter="url(#rough2)">回到 0 才算一段</text>
    <path d="M 200 264 L 276 236" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g font-size="14" text-anchor="middle">
    <rect x="78" y="296" width="51" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="103" y="317" fill="#3a4a66" filter="url(#rough2)">R</text>
    <rect x="129" y="296" width="51" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="154" y="317" fill="#8a6a20" filter="url(#rough2)">L</text>
    <rect x="180" y="296" width="51" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="205" y="317" fill="#3a4a66" filter="url(#rough2)">R</text>
    <rect x="231" y="296" width="51" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="256" y="317" fill="#3a4a66" filter="url(#rough2)">R</text>
    <rect x="282" y="296" width="51" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="307" y="317" fill="#8a6a20" filter="url(#rough2)">L</text>
    <rect x="333" y="296" width="51" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="358" y="317" fill="#8a6a20" filter="url(#rough2)">L</text>
    <rect x="384" y="296" width="51" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="409" y="317" fill="#3a4a66" filter="url(#rough2)">R</text>
    <rect x="435" y="296" width="51" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="460" y="317" fill="#8a6a20" filter="url(#rough2)">L</text>
    <rect x="486" y="296" width="51" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="511" y="317" fill="#3a4a66" filter="url(#rough2)">R</text>
    <rect x="537" y="296" width="51" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="562" y="317" fill="#8a6a20" filter="url(#rough2)">L</text>
  </g>

  <g font-size="11" text-anchor="middle">
    <rect x="78" y="338" width="102" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
    <text x="129" y="355" fill="#3a5a30" filter="url(#rough2)">① RL</text>
    <rect x="180" y="338" width="204" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
    <text x="282" y="355" fill="#3a5a30" filter="url(#rough2)">② RRLL</text>
    <rect x="384" y="338" width="102" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
    <text x="435" y="355" fill="#3a5a30" filter="url(#rough2)">③ RL</text>
    <rect x="486" y="338" width="102" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
    <text x="537" y="355" fill="#3a5a30" filter="url(#rough2)">④ RL</text>
  </g>

  <text x="330" y="392" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">s = "RLRRLLRLRL"：b 在第 2、6、8、10 个字符后回到 0，一共切出 4 段，答案 4</text>
</svg>
