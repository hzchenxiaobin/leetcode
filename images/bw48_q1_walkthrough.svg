<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "dfa12321afd"，second 最终为 2</text>

  <!-- 字符格子 -->
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <rect x="60" y="52" width="36" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/><text x="78" y="74" fill="#999">d</text>
    <rect x="96" y="52" width="36" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/><text x="114" y="74" fill="#999">f</text>
    <rect x="132" y="52" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="150" y="74" fill="#3a4a66" font-weight="bold">1</text>
    <rect x="168" y="52" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/><text x="186" y="74" fill="#2f5226" font-weight="bold">2</text>
    <rect x="204" y="52" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/><text x="222" y="74" fill="#8a6a20" font-weight="bold">3</text>
    <rect x="240" y="52" width="36" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/><text x="258" y="74" fill="#555">2</text>
    <rect x="276" y="52" width="36" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/><text x="294" y="74" fill="#555">1</text>
    <rect x="312" y="52" width="36" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/><text x="330" y="74" fill="#999">a</text>
    <rect x="348" y="52" width="36" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/><text x="366" y="74" fill="#999">f</text>
    <rect x="384" y="52" width="36" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/><text x="402" y="74" fill="#999">d</text>
  </g>

  <!-- 状态表头 -->
  <g filter="url(#rough2)">
    <rect x="100" y="112" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="280" y="112" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="190" y="133" fill="#3a4a66">first（最大）</text>
    <text x="370" y="133" fill="#2f5226">second（第二大）</text>
  </g>

  <!-- 状态行 -->
  <g filter="url(#rough2)">
    <rect x="100" y="148" width="180" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="280" y="148" width="180" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="100" y="182" width="180" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="280" y="182" width="180" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="100" y="216" width="180" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="280" y="216" width="180" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="100" y="250" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="280" y="250" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="190" y="168">扫到 '1'：−1 → 1</text><text x="370" y="168">−1（还没出现第二个）</text>
    <text x="190" y="202">扫到 '2'：1 → 2</text><text x="370" y="202">旧 first=1 落下来 → 1</text>
    <text x="190" y="236">扫到 '3'：2 → 3</text><text x="370" y="236">旧 first=2 落下来 → 2</text>
    <text x="190" y="266" font-weight="bold" fill="#3a4a66">后面的 2、1 均不大于 3</text><text x="370" y="266" font-weight="bold" fill="#2f5226">保持 (3, 2) → 返回 2</text>
  </g>

  <!-- 侧注 -->
  <rect x="30" y="148" width="60" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="184" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">d f a 1</text>
  <text x="60" y="206" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="60" y="228" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="60" y="254" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">2 1</text>
  <text x="60" y="274" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">a f d</text>

  <!-- 结论 -->
  <rect x="100" y="290" width="360" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">出现的数字集合 {1, 2, 3}，第二大为 2；若 s = "abc1111" 则 second 保持 −1</text>
</svg>
