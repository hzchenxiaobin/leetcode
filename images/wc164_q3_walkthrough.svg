<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：searchWord = "mouse" 的 5 个前缀</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888">排序后 products = mobile, moneypot, monitor, mouse, mousepad</text>

  <g filter="url(#rough2)">
    <rect x="24" y="64" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="104" y="64" width="320" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="424" y="64" width="172" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="24" y="90" width="80" height="40" fill="#fafafa" stroke="#999" stroke-width="1.1" rx="3"/>
    <rect x="104" y="90" width="320" height="40" fill="#fafafa" stroke="#999" stroke-width="1.1" rx="3"/>
    <rect x="424" y="90" width="172" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="24" y="130" width="80" height="40" fill="#fafafa" stroke="#999" stroke-width="1.1" rx="3"/>
    <rect x="104" y="130" width="320" height="40" fill="#fafafa" stroke="#999" stroke-width="1.1" rx="3"/>
    <rect x="424" y="130" width="172" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="24" y="170" width="80" height="40" fill="#fafafa" stroke="#999" stroke-width="1.1" rx="3"/>
    <rect x="104" y="170" width="320" height="40" fill="#fafafa" stroke="#999" stroke-width="1.1" rx="3"/>
    <rect x="424" y="170" width="172" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="24" y="210" width="80" height="40" fill="#fafafa" stroke="#999" stroke-width="1.1" rx="3"/>
    <rect x="104" y="210" width="320" height="40" fill="#fafafa" stroke="#999" stroke-width="1.1" rx="3"/>
    <rect x="424" y="210" width="172" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="24" y="250" width="80" height="40" fill="#fafafa" stroke="#999" stroke-width="1.1" rx="3"/>
    <rect x="104" y="250" width="320" height="40" fill="#fafafa" stroke="#999" stroke-width="1.1" rx="3"/>
    <rect x="424" y="250" width="172" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="64" y="82">前缀</text>
    <text x="264" y="82">命中的产品（有序）</text>
    <text x="510" y="82">推荐结果</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold" fill="#444">
    <text x="64" y="115">m</text>
    <text x="64" y="155">mo</text>
    <text x="64" y="195">mou</text>
    <text x="64" y="235">mous</text>
    <text x="64" y="275">mouse</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#555">
    <text x="112" y="115">mobile, moneypot, monitor, mouse, mousepad</text>
    <text x="112" y="155">mobile, moneypot, monitor, mouse, mousepad</text>
    <text x="112" y="195">mouse, mousepad</text>
    <text x="112" y="235">mouse, mousepad</text>
    <text x="112" y="275">mouse, mousepad</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#8a6a20">
    <text x="432" y="115">mobile, moneypot, monitor</text>
    <text x="432" y="155">mobile, moneypot, monitor</text>
    <text x="432" y="195" fill="#3a5a30">mouse, mousepad</text>
    <text x="432" y="235">mouse, mousepad</text>
    <text x="432" y="275">mouse, mousepad</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#666">
    <text x="24" y="318">第 3 个字符定胜负：mobile / moneypot / monitor 的该位是 b、n，被 mou 节点剪掉</text>
    <text x="24" y="342">之后再输入 s、e，集合只会在 {mouse, mousepad} 内收缩，前 3 个保持稳定</text>
    <text x="24" y="366">mouse 与 mous 结果相同：mousepad 以 mouse 为前缀，仍在节点缓存里</text>
  </g>
</svg>
