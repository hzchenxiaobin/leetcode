  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2：dist 表算出最小代价 3，health 只有 3</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">浅红 = 1（扣血），浅蓝 = 0；格内数字是到达该格的最小代价</text>

