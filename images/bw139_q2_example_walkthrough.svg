  <text x="46" y="252" font-size="10" fill="#999">↑ 起点在左上，终点在右下</text>

  <rect x="430" y="66" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="80" text-anchor="middle" font-size="9.5" fill="#3a5a30">最小代价</text>
  <text x="480" y="94" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">3</text>

  <rect x="430" y="112" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="126" text-anchor="middle" font-size="9.5" fill="#8a6a20">health − 1</text>
  <text x="480" y="140" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">2</text>

  <rect x="430" y="158" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="180" text-anchor="middle" font-size="10.5" fill="#8a3a36">3 &gt; 2 → false</text>

  <rect x="400" y="204" width="140" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="470" y="222" text-anchor="middle" font-size="9.5" fill="#3a4a66">题面「至少 4 点血」</text>
  <text x="470" y="238" text-anchor="middle" font-size="9.5" fill="#3a4a66">= 最小代价 3 + 1</text>
  <text x="470" y="254" text-anchor="middle" font-size="9.5" fill="#3a4a66">终点必须留下 1 点血</text>

  <rect x="40" y="286" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#8a6a20">示例 1：最小代价 0（全走 0 格），health − 1 = 0 → true</text>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#8a6a20">示例 3：最小代价 4（必须穿过 (1,1)），health − 1 = 4 → true</text>
