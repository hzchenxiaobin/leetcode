  <text x="76" y="92" text-anchor="middle" font-size="13" fill="#3a4a66">0</text>
  <text x="136" y="92" text-anchor="middle" font-size="13" fill="#8a3a36">1</text>
  <text x="196" y="92" text-anchor="middle" font-size="13" fill="#8a3a36">2</text>
