  <text x="196" y="134" text-anchor="middle" font-size="13" fill="#3a4a66">2</text>
  <text x="256" y="134" text-anchor="middle" font-size="13" fill="#3a4a66">2</text>
  <text x="316" y="134" text-anchor="middle" font-size="13" fill="#3a4a66">2</text>
  <text x="376" y="134" text-anchor="middle" font-size="13" fill="#3a4a66">2</text>
  <text x="76" y="176" text-anchor="middle" font-size="13" fill="#3a4a66">1</text>
  <text x="136" y="176" text-anchor="middle" font-size="13" fill="#3a4a66">2</text>
  <text x="196" y="176" text-anchor="middle" font-size="13" fill="#3a4a66">3</text>
