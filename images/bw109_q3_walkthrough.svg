<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [2, 3, 6, 1, 9, 2]，x = 5</text>

  <g filter="url(#rough2)">
    <!-- 表头 -->
    <rect x="36" y="52" width="448" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="86" y="74" text-anchor="middle" font-size="12.5" fill="#446688">i</text>
    <text x="150" y="74" text-anchor="middle" font-size="12.5" fill="#446688">nums[i]（奇偶）</text>
    <text x="278" y="74" text-anchor="middle" font-size="12.5" fill="#446688">best[0]（偶）</text>
    <text x="410" y="74" text-anchor="middle" font-size="12.5" fill="#446688">best[1]（奇）</text>

    <!-- 行 0 -->
    <rect x="36" y="86" width="448" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" fill-opacity="0.5"/>
    <text x="86" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>
    <text x="150" y="108" text-anchor="middle" font-size="13" fill="#333">2（偶）起点</text>
    <text x="278" y="108" text-anchor="middle" font-size="13" fill="#1d5c1a">2</text>
    <text x="410" y="108" text-anchor="middle" font-size="13" fill="#888">−∞</text>

    <!-- 行 1 -->
    <rect x="36" y="120" width="448" height="34" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="86" y="142" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="150" y="142" text-anchor="middle" font-size="13" fill="#b85450">3（奇）</text>
    <text x="278" y="142" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="410" y="142" text-anchor="middle" font-size="13" fill="#1d5c1a">0</text>
    <text x="446" y="142" font-size="10" fill="#888">2−5+3</text>

    <!-- 行 2 -->
    <rect x="36" y="154" width="448" height="34" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="86" y="176" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="150" y="176" text-anchor="middle" font-size="13" fill="#333">6（偶）</text>
    <text x="278" y="176" text-anchor="middle" font-size="13" fill="#1d5c1a">8</text>
    <text x="410" y="176" text-anchor="middle" font-size="13" fill="#333">0</text>
    <text x="446" y="176" font-size="10" fill="#888">2+6</text>

    <!-- 行 3 -->
    <rect x="36" y="188" width="448" height="34" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="86" y="210" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="150" y="210" text-anchor="middle" font-size="13" fill="#b85450">1（奇）</text>
    <text x="278" y="210" text-anchor="middle" font-size="13" fill="#333">8</text>
    <text x="410" y="210" text-anchor="middle" font-size="13" fill="#1d5c1a">4</text>
    <text x="446" y="210" font-size="10" fill="#888">8−5+1</text>

    <!-- 行 4 -->
    <rect x="36" y="222" width="448" height="34" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="86" y="244" text-anchor="middle" font-size="13" fill="#333">4</text>
    <text x="150" y="244" text-anchor="middle" font-size="13" fill="#b85450">9（奇）</text>
    <text x="278" y="244" text-anchor="middle" font-size="13" fill="#333">8</text>
    <text x="410" y="244" text-anchor="middle" font-size="13" fill="#1d5c1a">13</text>
    <text x="446" y="244" font-size="10" fill="#888">4+9</text>

    <!-- 行 5 -->
    <rect x="36" y="256" width="448" height="34" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="86" y="278" text-anchor="middle" font-size="13" fill="#333">5</text>
    <text x="150" y="278" text-anchor="middle" font-size="13" fill="#333">2（偶）</text>
    <text x="278" y="278" text-anchor="middle" font-size="13" fill="#1d5c1a">10</text>
    <text x="410" y="278" text-anchor="middle" font-size="13" fill="#333">13</text>
    <text x="446" y="278" font-size="10" fill="#888">max(8,13−5)+2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="300" width="448" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="260" y="320" text-anchor="middle" font-size="13.5" fill="#4a7a3a">答案 = max(10, 13) = 13</text>
    <text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#555">对应访问 0→2→3→4：2+6+1+9−5 = 13（6→1 换奇偶扣 5）</text>
  </g>
</svg>
