<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 385"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="385" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描相邻字符对，命中 "01" 立即返回 false</text>

  <!-- input box -->
  <rect x="150" y="44" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 s（s[0]='1'），i = 0</text>

  <path d="M 260 82 L 260 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: loop condition -->
  <polygon points="260,102 322,133 260,164 198,133" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i ≤ n-2 ?</text>

  <!-- no -> return true -->
  <path d="M 322 133 L 388 133" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="125" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>
  <rect x="392" y="113" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="442" y="138" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 true</text>

  <!-- yes -> diamond 2 -->
  <path d="M 260 164 L 260 186" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="180" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>

  <!-- diamond 2: pair check -->
  <polygon points="260,188 352,223 260,258 168,223" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">s[i]=='0' 且</text>
  <text x="260" y="237" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">s[i+1]=='1' ?</text>

  <!-- yes -> return false -->
  <path d="M 352 223 L 385 223" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="365" y="214" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="389" y="203" width="104" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="441" y="228" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <!-- no -> i += 1 -->
  <path d="M 260 258 L 260 280" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="273" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>
  <rect x="222" y="282" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i += 1</text>

  <!-- loop back -->
  <path d="M 222 296 L 96 296 L 96 133 L 194 133" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- footers -->
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每步只做一次两字符比较；n = 1 时循环不执行，直接返回 true</text>
  <text x="260" y="366" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">一行等价版：Python "01" not in s / C++ s.find("01") == string::npos</text>
</svg>
