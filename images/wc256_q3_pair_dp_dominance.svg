<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#fdfcf7"/>
  <text x="440" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">优化：二元组 (k, t) 把 O(3ⁿ) 压到 O(n·2ⁿ) —— 每个子集只留一个「最好代表」</text>
  <path d="M 120 40 Q 440 50 760 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: state and transitions -->
  <g filter="url(#sk)">
    <rect x="30" y="64" width="400" height="276" rx="10" fill="#f5f9fd" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="50" y="90" font-size="14" fill="#2b6e9e" font-weight="bold">① 换一套状态：跟着「最后一个任务」走</text>
  <text x="50" y="114" font-size="12" fill="#445" font-family="monospace">dp[mask] = (k, t)：k = 最少段数（含当前段）</text>
  <text x="50" y="134" font-size="12" fill="#445" font-family="monospace">t = 当前段已用时长（k 最小时再让 t 最小）</text>
  <text x="50" y="154" font-size="12" fill="#445" font-family="monospace">dp[0] = (1, 0)：预先打开一个「空时段」</text>
  <g filter="url(#sk)">
    <rect x="60" y="172" width="100" height="40" rx="8" fill="#e8f0fa" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="110" y="197" text-anchor="middle" font-size="13" fill="#335" font-family="monospace">(k, t)</text>
  <path d="M 160 184 L 330 160" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 160 200 L 330 232" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="334" y="146" width="80" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="374" y="166" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">(k, t+x)</text>
  <g filter="url(#sk)">
    <rect x="334" y="218" width="80" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="374" y="238" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-family="monospace">(k+1, x)</text>
  <text x="236" y="172" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-family="monospace">t+x ≤ sessionTime</text>
  <text x="248" y="182" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-family="monospace">塞进当前段</text>
  <text x="248" y="228" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-family="monospace">塞不下 →</text>
  <text x="248" y="240" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-family="monospace">新开一段装 x</text>
  <text x="50" y="278" font-size="11.5" fill="#556">每步枚举「最后加入的任务 j」（n 个候选），</text>
  <text x="50" y="296" font-size="11.5" fill="#556">候选按 (k, t) 字典序取最小 → 每个状态只剩一个值</text>
  <text x="50" y="320" font-size="11.5" fill="#556">正确性靠「支配关系」（右图 + 正文引理 4/5）</text>

  <!-- right panel: dominance example -->
  <g filter="url(#sk)">
    <rect x="450" y="64" width="400" height="276" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="470" y="90" font-size="14" fill="#a06a1a" font-weight="bold">② 支配关系：k 更小，一票定胜负</text>
  <text x="470" y="114" font-size="11.5" fill="#667" font-family="monospace">同 mask = {12, 2}（sessionTime = 15）的两个状态：</text>
  <g filter="url(#sk)">
    <rect x="470" y="126" width="180" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="560" y="146" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">A = (1, 14)</text>
  <text x="560" y="163" text-anchor="middle" font-size="10.5" fill="#5a8a5a">1 段：[12+2]，已用 14h</text>
  <g filter="url(#sk)">
    <rect x="660" y="126" width="180" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="750" y="146" text-anchor="middle" font-size="12" fill="#b03a3a" font-family="monospace" font-weight="bold">B = (2, 2)</text>
  <text x="750" y="163" text-anchor="middle" font-size="10.5" fill="#a05a5a">2 段：[12][2]，当前段才用 2h</text>
  <text x="470" y="192" font-size="11.5" fill="#888">看似 B 更「宽裕」（剩余 13h vs 1h）？再装 [13, 2]：</text>
  <g filter="url(#sk)">
    <rect x="470" y="204" width="180" height="74" rx="8" fill="#f4faf5" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="560" y="226" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">A: +13 → 超时 → (2,13)</text>
  <text x="560" y="244" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">A: +2 → (2,15)</text>
  <text x="560" y="266" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">共 2 段 ✓</text>
  <g filter="url(#sk)">
    <rect x="660" y="204" width="180" height="74" rx="8" fill="#fdf4f6" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="750" y="226" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">B: +13 → 塞下 → (2,15)</text>
  <text x="750" y="244" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">B: +2 → 超时 → (3,2)</text>
  <text x="750" y="266" text-anchor="middle" font-size="12" fill="#b03a3a" font-family="monospace" font-weight="bold">共 3 段 ✗</text>
  <g filter="url(#sk)">
    <rect x="470" y="290" width="360" height="34" rx="8" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="650" y="312" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">k 更小 ⟹ 支配（哪怕 t 更大）；k 相等且 t 更小 ⟹ 支配</text>

  <!-- bottom banner -->
  <g filter="url(#sk)">
    <rect x="30" y="356" width="820" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="440" y="382" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">转移总量：子集枚举 3ⁿ ≈ 4.8×10⁶ 步 → 二元组 n·2ⁿ ≈ 2.3×10⁵ 步（约快 20 倍，Python 尤其受益）</text>
  <g filter="url(#sk)">
    <rect x="30" y="412" width="820" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="440" y="432" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">⚠ k 相同时 t 必须取最小：[9,1,9,5]@14 若在 mask {9,9,1} 留 (2,10)，恰好装满的 9+5=14 就塞不下，答案 2 错成 3</text>
  <text x="440" y="448" text-anchor="middle" font-size="11" fill="#a05a5a">字典序是证明覆盖的唯一比较序（引理 3–5）；姊妹篇每日题解以「剩余容量」视角讲同一 DP</text>
</svg>
