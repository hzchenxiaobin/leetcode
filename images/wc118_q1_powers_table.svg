<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">强整数：幂序列只有 O(log bound) 项</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">把指数枚举范围从 bound 压到 log bound，问题就可做了</text>
  <text x="30" y="80" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">x = 2 的幂（≤ 10^6）</text>
  <rect x="40" y="90" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="65.0" y="111.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="96" y="90" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="121.0" y="111.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="152" y="90" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="177.0" y="111.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="208" y="90" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="233.0" y="111.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="264" y="90" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="289.0" y="111.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="320" y="90" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="345.0" y="111.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">32</text>
  <text x="382" y="113" font-size="18" fill="#666" text-anchor="middle" font-weight="bold" filter="url(#rough2)">…</text>
  <rect x="408" y="90" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="460.0" y="110.78" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2^19=524288</text>
  <text x="30" y="152" font-size="11.5" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">正好 20 项：2^20 = 1048576 &gt; 10^6，循环自己停下</text>
  <text x="30" y="196" font-size="12" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">x = 1 的幂</text>
  <rect x="40" y="206" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="65.0" y="227.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="106" y="228" font-size="11.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">1^i ≡ 1 —— 序列退化成一个元素，不 break 就是死循环</text>
  <rect x="30" y="268" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="289" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">错误上界：i, j 都枚举到 bound</text><text x="40" y="304.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">最坏 10^6 × 10^6 次；x = y = 1 时指数根本不增长，循环永不结束</text><text x="40" y="320.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">正确上界：每边 ≤ 20 项 → 至多 20 × 20 = 400 次求和</text>
</svg>
