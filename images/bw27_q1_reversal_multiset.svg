<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：任意子数组翻转都不改变元素的可重集</text>

  <!-- 翻转前 -->
  <text x="60" y="72" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">翻转前 arr</text>
  <rect x="60" y="82" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text y="107" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="100">2</tspan><tspan x="140">4</tspan><tspan x="180">1</tspan><tspan x="220">3</tspan></text>

  <!-- 子数组括线 -->
  <path d="M 120 132 Q 160 148 200 132" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="158" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">翻转 [4,1]</text>
  <path d="M 280 102 Q 330 102 330 60" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 翻转后 -->
  <text x="360" y="72" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">翻转后 arr</text>
  <rect x="360" y="82" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text y="107" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="400">2</tspan><tspan x="440">1</tspan><tspan x="480">4</tspan><tspan x="520">3</tspan></text>

  <!-- 可重集 -->
  <rect x="105" y="185" width="350" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">两个数组的可重集都是 {1, 2, 3, 4}</text>
  <text x="280" y="228" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">翻转只是把元素重新排列，谁也没多、谁也没少</text>

  <!-- 结论框 -->
  <rect x="55" y="262" width="230" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="70" y="284" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">必要性：能变 ⇒ 可重集相等</text>
  <text x="70" y="304" font-size="11" fill="#555" filter="url(#rough2)">翻转是位置的重排，</text>
  <text x="70" y="316" font-size="11" fill="#555" filter="url(#rough2)">元素的多重集合保持不变。</text>

  <rect x="305" y="262" width="230" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="284" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">充分性：可重集相等 ⇒ 能变</text>
  <text x="320" y="304" font-size="11" fill="#555" filter="url(#rough2)">相邻交换就是长度 2 的翻转，</text>
  <text x="320" y="316" font-size="11" fill="#555" filter="url(#rough2)">冒泡排序可以把 arr 换成 target。</text>
</svg>
