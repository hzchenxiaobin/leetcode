<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：加号吃大的，减号吃小的</text>
  <path d="M 175 44 Q 320 52 465 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- expression slots -->
  <g filter="url(#sk)">
    <rect x="120" y="62" width="76" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="252" y="62" width="76" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="384" y="62" width="76" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="158" y="91" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a6a2a">a</text>
  <text x="290" y="91" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a6a2a">b</text>
  <text x="422" y="91" text-anchor="middle" font-size="18" font-weight="bold" fill="#a04a48">c</text>
  <text x="232" y="92" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a3a3a">+</text>
  <text x="364" y="92" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a3a3a">−</text>
  <text x="158" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">取最大</text>
  <text x="290" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">取次大</text>
  <text x="422" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">取最小</text>
  <text x="545" y="80" text-anchor="middle" font-size="11" fill="#666">a、b 对称（都是 +）</text>
  <text x="545" y="96" text-anchor="middle" font-size="11" fill="#666">合取最大的两个数</text>

  <!-- sorted cells -->
  <text x="320" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">排序（从大到小）—— 以 nums = [1, 4, 2, 5] 为例</text>
  <g filter="url(#sk)">
    <rect x="153" y="182" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="243" y="182" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="333" y="182" width="64" height="40" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1.2"/>
    <rect x="423" y="182" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="185" y="208" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a6a2a">5</text>
  <text x="275" y="208" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a6a2a">4</text>
  <text x="365" y="208" text-anchor="middle" font-size="16" fill="#777">2</text>
  <text x="455" y="208" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04a48">1</text>
  <text x="185" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">最大 → a</text>
  <text x="275" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">次大 → b</text>
  <text x="365" y="244" text-anchor="middle" font-size="11" fill="#999">不选</text>
  <text x="455" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">最小 → c</text>

  <!-- arrows from cells to slots -->
  <path d="M 185 176 Q 175 145 161 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 275 176 Q 283 145 290 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 455 176 Q 440 145 424 112" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- why legal -->
  <g filter="url(#sk)">
    <rect x="70" y="268" width="500" height="74" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520">为什么一定合法？</text>
  <text x="320" y="312" text-anchor="middle" font-size="12" fill="#6a5530">n ≥ 3：最小值与最大的两个数，落在排序后三个互不相同的位置</text>
  <text x="320" y="330" text-anchor="middle" font-size="12" fill="#6a5530">⇒ "下标互不相同"自动满足，直接贪心</text>

  <!-- answer -->
  <g filter="url(#sk)">
    <rect x="180" y="354" width="280" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">答案 = 最大 + 次大 − 最小</text>
</svg>
