<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">m = 1 陷阱：长 2 的段没有「内部」刀位，公式只是下界</text>

  <!-- A. 原串与游程 -->
  <text x="52" y="62" font-size="12.5" fill="#333" filter="url(#rough2)">s =</text>
  <rect x="120" y="44" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="44" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="44" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="228" y="44" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="44" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="44" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="336" y="44" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="372" y="44" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="408" y="44" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="174" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="210" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="246" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="282" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="318" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="354" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="390" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="426" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <path d="M120,80 L120,86 L188,86 L188,80" fill="none" stroke="#7a7a7a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M196,80 L196,86 L224,86 L224,80" fill="none" stroke="#7a7a7a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M232,80 L232,86 L296,86 L296,80" fill="none" stroke="#7a7a7a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M304,80 L304,86 L332,86 L332,80" fill="none" stroke="#7a7a7a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M340,80 L340,86 L404,86 L404,80" fill="none" stroke="#7a7a7a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M412,80 L412,86 L440,86 L440,80" fill="none" stroke="#7a7a7a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">游程 [2,1,2,1,2,1]，numOps = 3：公式 Σ⌊L/2⌋ = 3 ≤ 3 → 说「m = 1 可行」？</text>

  <!-- B. 翻端点必粘连 -->
  <text x="52" y="140" font-size="12" fill="#333" filter="url(#rough2)">试翻 s[4]（长 2 段的两个位置都是端点，别无选择）：</text>
  <rect x="120" y="150" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="150" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="150" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="228" y="150" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="150" width="36" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="300" y="150" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="336" y="150" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="372" y="150" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="408" y="150" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="174" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="210" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="246" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="282" y="170" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="318" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="354" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="390" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="426" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <path d="M268,186 L268,192 L332,192 L332,186" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="208" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">并入右邻 → "11" ✗</text>
  <text x="470" y="162" font-size="10.5" fill="#666" filter="url(#rough2)">翻 s[3] 同理</text>
  <text x="470" y="178" font-size="10.5" fill="#666" filter="url(#rough2)">并入左邻；</text>
  <text x="470" y="194" font-size="10.5" fill="#666" filter="url(#rough2)">翻别处也拆</text>
  <text x="470" y="210" font-size="10.5" fill="#666" filter="url(#rough2)">不完所有 "00"</text>
  <text x="280" y="232" text-anchor="middle" font-size="11.5" fill="#7a3a34" filter="url(#rough2)">隔离用的「孤立反色字符」自身长 1 = m，也违规 → ⌊L/2⌋ 在 m = 1 只是下界，达不到</text>

  <!-- C. 交替特判 -->
  <text x="52" y="264" font-size="12" fill="#333" filter="url(#rough2)">正解：m = 1 ⟺ 整串严格交替 ∈ {0101…, 1010…}</text>
  <rect x="70" y="278" width="420" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="302" font-size="11.5" fill="#333" filter="url(#rough2)">目标 010101010：失配 d = 5 处（下标 1,2,3,7,8）</text>
  <text x="90" y="324" font-size="11.5" fill="#333" filter="url(#rough2)">目标 101010101：失配 n − d = 4 处（两模式逐位互补）</text>
  <text x="90" y="346" font-size="11.5" fill="#446688" filter="url(#rough2)">最少代价 = min(d, n−d) = 4 &gt; 3 → m = 1 不可行</text>
  <text x="52" y="380" font-size="12" fill="#333" filter="url(#rough2)">而 m = 2：Σ⌊L/3⌋ = 0 ≤ 3 ✓ → numOps = 3 时答案是 2（公式解 1 是假可行）</text>

  <rect x="70" y="394" width="420" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#2d4d24" filter="url(#rough2)">check(1)：min(d, n−d) ≤ numOps，d 为与 0101… 的失配数</text>
</svg>
