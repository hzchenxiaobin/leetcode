<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">之字形编号：奇数层从左到右，偶数层从右到左</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第 h 层恰有 2^(h−1) 个节点，标签正好占满区间 [2^(h−1), 2^h − 1]</text>

  <!-- 普通树边 -->
  <line x1="307" y1="114" x2="167" y2="158" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="307" y1="114" x2="447" y2="158" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="167" y1="186" x2="97" y2="230" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="167" y1="186" x2="237" y2="230" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="447" y1="186" x2="377" y2="230" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="447" y1="186" x2="517" y2="230" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="97" y1="258" x2="62" y2="302" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="97" y1="258" x2="132" y2="302" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="237" y1="258" x2="202" y2="302" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="237" y1="258" x2="272" y2="302" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="377" y1="258" x2="342" y2="302" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="377" y1="258" x2="412" y2="302" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="517" y1="258" x2="482" y2="302" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="517" y1="258" x2="552" y2="302" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 路径 1 → 3 → 4 → 14 高亮 -->
  <line x1="307" y1="114" x2="167" y2="158" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="167" y1="186" x2="97" y2="230" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="97" y1="258" x2="132" y2="302" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>

  <rect x="284" y="86" width="46" height="28" fill="#c9dcf7" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="307" y="104" text-anchor="middle" font-size="11" fill="#33475f" filter="url(#rough2)">1</text>
  <rect x="144" y="158" width="46" height="28" fill="#c9dcf7" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
