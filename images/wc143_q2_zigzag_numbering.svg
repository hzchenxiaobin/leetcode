  <rect x="389" y="302" width="46" height="28" fill="#e8f0fe" stroke="#8fa8c8" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="412" y="320" text-anchor="middle" font-size="11" fill="#33475f" filter="url(#rough2)">10</text>
  <rect x="459" y="302" width="46" height="28" fill="#e8f0fe" stroke="#8fa8c8" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="482" y="320" text-anchor="middle" font-size="11" fill="#33475f" filter="url(#rough2)">9</text>
  <rect x="529" y="302" width="46" height="28" fill="#e8f0fe" stroke="#8fa8c8" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="552" y="320" text-anchor="middle" font-size="11" fill="#33475f" filter="url(#rough2)">8</text>

  <text x="22" y="105" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">→</text>
  <text x="22" y="177" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">←</text>
  <text x="22" y="249" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">→</text>
  <text x="22" y="321" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">←</text>

  <path d="M 132 332 V 346" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 482 332 V 346" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 138 346 H 476" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">行内镜像对 14 ↔ 9：mirror(x,h) = 3·2^(h−1) − 1 − x，关于行中心对称</text>

  <text x="300" y="394" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">实测路径：1 → 3 → 4 → 14（蓝框）；偶数层标签随位置递减，正是「之」字的来源</text>

</svg>
