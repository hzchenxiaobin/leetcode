  <rect x="354" y="230" width="46" height="28" fill="#e8f0fe" stroke="#8fa8c8" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="377" y="248" text-anchor="middle" font-size="11" fill="#33475f" filter="url(#rough2)">6</text>
  <rect x="494" y="230" width="46" height="28" fill="#e8f0fe" stroke="#8fa8c8" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
