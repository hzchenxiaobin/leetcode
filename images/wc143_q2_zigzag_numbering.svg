  <rect x="109" y="302" width="46" height="28" fill="#c9dcf7" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="132" y="320" text-anchor="middle" font-size="11" fill="#33475f" filter="url(#rough2)">14</text>
  <rect x="179" y="302" width="46" height="28" fill="#e8f0fe" stroke="#8fa8c8" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="202" y="320" text-anchor="middle" font-size="11" fill="#33475f" filter="url(#rough2)">13</text>
  <rect x="249" y="302" width="46" height="28" fill="#e8f0fe" stroke="#8fa8c8" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
