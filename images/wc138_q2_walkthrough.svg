<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：枚举所有长度 3 的窗口</text>
  <text x="280" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">base = 10，取窗口加成最大的 6</text>
  <text x="60" y="74" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">起点</text>
  <text x="150" y="74" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">窗口内下标</text>
  <text x="320" y="74" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">grumpy=1 的顾客</text>
  <text x="470" y="74" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">加成</text>
  <rect x="50" y="86" width="470" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="66" y="105" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">0</text>
  <text x="150" y="105" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">0,1,2</text>
  <text x="320" y="105" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">0 + 0 + 0</text>
  <text x="474" y="105" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">0</text>
  <rect x="50" y="120" width="470" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="66" y="139" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">1</text>
  <text x="150" y="139" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">1,2,3</text>
  <text x="320" y="139" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">0 + 0 + 2</text>
  <text x="474" y="139" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">2</text>
  <rect x="50" y="154" width="470" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="66" y="173" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">2</text>
  <text x="150" y="173" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">2,3,4</text>
  <text x="320" y="173" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">0 + 2 + 0</text>
  <text x="474" y="173" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">2</text>
  <rect x="50" y="188" width="470" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="66" y="207" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">3</text>
  <text x="150" y="207" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">3,4,5</text>
  <text x="320" y="207" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">2 + 0 + 1</text>
  <text x="474" y="207" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">3</text>
  <rect x="50" y="222" width="470" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="66" y="241" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">4</text>
  <text x="150" y="241" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">4,5,6</text>
  <text x="320" y="241" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">0 + 1 + 0</text>
  <text x="474" y="241" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">1</text>
  <rect x="50" y="256" width="470" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="66" y="275" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">5</text>
  <text x="150" y="275" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">5,6,7</text>
  <text x="320" y="275" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">1 + 0 + 5</text>
  <text x="474" y="275" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="280" y="322" font-size="11.5" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">base = 10  →  10 + max(0,2,2,3,1,6) = 16</text>
</svg>
