<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">链上的极大交替段：长 L 的段贡献 L − k + 1 个组</text>

  <rect x="90" y="66" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="66" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="66" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="258" y="66" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="314" y="66" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="66" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="426" y="66" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="116" y="90" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="172" y="90" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="228" y="90" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="284" y="90" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="340" y="90" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="396" y="90" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="452" y="90" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>

  <path d="M 311 52 L 311 116" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="311" y="44" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">断点：相邻同色</text>

  <path d="M 90 118 L 90 128 L 308 128 L 308 118" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="199" y="150" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#rough2)">交替段 1：L = 4</text>

  <path d="M 316 118 L 316 128 L 478 128 L 478 118" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="397" y="150" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">交替段 2：L = 3</text>

  <rect x="94" y="168" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="194" y="194" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">4 − 3 + 1 = 2 个</text>

  <rect x="314" y="168" width="180" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="404" y="194" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">3 − 3 + 1 = 1 个</text>

  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k = 3：每个极大交替段内部可以放下 L − k + 1 个长度为 k 的窗口</text>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">图示是破环后的「链」（不是环）：窗口不会跨过断点，各段贡献直接相加</text>

  <rect x="120" y="284" width="280" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">链上总数 = 2 + 1 = 3</text>
</svg>
