<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程:沿对角线逐位取反</text>

  <!-- 右上说明框 -->
  <rect x="352" y="44" width="188" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="446" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">只碰对角线</text>
  <text x="446" y="84" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">全程只读 n 个字符</text>
  <text x="446" y="102" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">时间 O(n),空间 O(n)</text>

  <!-- 步骤1 -->
  <rect x="170" y="120" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 输入:nums,n 个长度 n 的串</text>
  <path d="M 280 160 L 280 184" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="292" y="178" font-size="9.5" fill="#888" filter="url(#rough2)">i = 0</text>

  <!-- 步骤2 -->
  <rect x="160" y="188" width="240" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 取对角字符 c = nums[i][i]</text>
  <path d="M 280 228 L 280 252" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="246" font-size="9.5" fill="#888" filter="url(#rough2)">看第 i 行第 i 列</text>

  <!-- 步骤3 -->
  <rect x="160" y="256" width="240" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">③ 取反:'0' ↔ '1'</text>
  <path d="M 280 296 L 280 320" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 步骤4 -->
  <rect x="160" y="324" width="240" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 拼接:ans += c</text>
  <text x="280" y="359" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">随后 i = i + 1</text>

  <!-- 回到步骤2 -->
  <path d="M 160 346 C 96 346, 96 208, 156 208" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="66" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">i &lt; n</text>
  <text x="66" y="288" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">继续循环</text>

  <!-- 结束 → 返回 -->
  <path d="M 400 208 C 482 214, 484 332, 468 350" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="492" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">i = n</text>
  <rect x="390" y="354" width="150" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="465" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⑤ 返回 ans</text>
  <text x="465" y="391" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">与每行第 i 位都不同</text>
</svg>
