<svg xmlns="http://www.w3.org/2000/svg" width="940" height="730" viewBox="0 0 940 730" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="730" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">代价跨两层：状态必须携带「左缺口长度 s」</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: three consecutive survivors ===== -->
  <text x="60" y="76" font-size="13" font-weight="bold" fill="#2b6e9e">① 相邻保留路标 q &lt; a &lt; b：speed(a) 来自左缺口，管辖右路段</text>

  <line x1="90" y1="170" x2="880" y2="170" stroke="#ddd" stroke-width="3" filter="url(#sk)"/>
  <g stroke="#bbb" stroke-width="2" filter="url(#sk)">
    <path d="M 235 165 L 245 175 M 245 165 L 235 175"/>
    <path d="M 305 165 L 315 175 M 315 165 L 305 175"/>
    <path d="M 500 165 L 510 175 M 510 165 L 500 175"/>
    <path d="M 575 165 L 585 175 M 585 165 L 575 175"/>
    <path d="M 650 165 L 660 175 M 660 165 L 650 175"/>
  </g>
  <line x1="430" y1="170" x2="730" y2="170" stroke="#4a8edb" stroke-width="8" stroke-linecap="round" filter="url(#sk)"/>
  <circle cx="170" cy="170" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2" filter="url(#sk)"/>
  <circle cx="430" cy="170" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2" filter="url(#sk)"/>
  <circle cx="730" cy="170" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2" filter="url(#sk)"/>
  <g font-size="12" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <text x="170" y="198">路标 q</text>
    <text x="430" y="198">路标 a</text>
    <text x="730" y="198">路标 b</text>
  </g>

  <g filter="url(#sk)">
    <rect x="384" y="100" width="92" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="430" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">speed(a)</text>
  <g filter="url(#sk)">
    <rect x="684" y="100" width="92" height="26" rx="4" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/>
  </g>
  <text x="730" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">speed(b)</text>
  <path d="M 448 130 Q 505 148 558 160" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="505" y="138" font-size="9.5" fill="#7a5415">管辖右边的整段路</text>
  <g filter="url(#sk)">
    <rect x="500" y="159" width="160" height="22" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="580" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">(pos[b]−pos[a]) × speed(a)</text>

  <path d="M 170 190 L 170 208 L 430 208 L 430 190" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="300" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">缺口 (q, a] 的 time 全部累积进 speed(a)</text>
  <path d="M 430 190 L 430 208 L 730 208 L 730 190" stroke="#999" stroke-width="1.6" stroke-dasharray="5 3" fill="none" filter="url(#sk)"/>
  <text x="580" y="228" text-anchor="middle" font-size="11" fill="#777">缺口 (a, b] → 累积进 speed(b)（决策代价向后传播一层）</text>
  <path d="M 745 170 L 862 170" stroke="#bbb" stroke-width="1.6" stroke-dasharray="4 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="806" y="188" font-size="10" fill="#999">下一段</text>

  <text x="470" y="258" text-anchor="middle" font-size="11.5" fill="#444">「保留 a」的代价要到选定下一个保留路标 b 时才结算，且大小取决于 a 左边的缺口 —— 决策代价跨两层</text>

  <!-- ===== Panel 2: why (i,j) is not enough ===== -->
  <text x="60" y="300" font-size="13" font-weight="bold" fill="#5a3a7a">② 为什么 (i, j) 不够：同样的 (i, j)，不同的 s，速度不同</text>

  <text x="122" y="340" text-anchor="end" font-size="11" font-weight="bold" fill="#777">j = 2</text>
  <g text-anchor="middle" font-size="12" font-weight="bold">
    <rect x="130" y="322" width="40" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="150" y="341" fill="#444">t₀</text>
    <rect x="184" y="322" width="40" height="28" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="204" y="341" fill="#bbb">t₁</text>
    <rect x="238" y="322" width="40" height="28" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="258" y="341" fill="#bbb">t₂</text>
    <rect x="292" y="322" width="40" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="312" y="341" fill="#444">t₃</text>
    <rect x="346" y="322" width="40" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="366" y="341" fill="#444">t₄</text>
    <rect x="400" y="322" width="40" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" rx="4" filter="url(#sk)"/>
    <text x="420" y="341" fill="#2b4a6e">t₅</text>
  </g>
  <path d="M 198 326 L 210 346 M 210 326 L 198 346" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 252 326 L 264 346 M 264 326 L 252 346" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="420" y="380" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b6e9e">i = 5（保留）</text>
  <text x="470" y="334" font-size="11.5" fill="#444">s = 0：删的是 1、2（不紧邻 5）</text>
  <text x="470" y="352" font-size="11.5" font-weight="bold" fill="#2b4a6e">speed(5) = time[5]</text>

  <text x="122" y="404" text-anchor="end" font-size="11" font-weight="bold" fill="#777">j = 2</text>
  <g text-anchor="middle" font-size="12" font-weight="bold">
    <rect x="130" y="386" width="40" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="150" y="405" fill="#444">t₀</text>
    <rect x="184" y="386" width="40" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="204" y="405" fill="#444">t₁</text>
    <rect x="238" y="386" width="40" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="258" y="405" fill="#444">t₂</text>
    <rect x="292" y="386" width="40" height="28" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="312" y="405" fill="#bbb">t₃</text>
    <rect x="346" y="386" width="40" height="28" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="366" y="405" fill="#bbb">t₄</text>
    <rect x="400" y="386" width="40" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" rx="4" filter="url(#sk)"/>
    <text x="420" y="405" fill="#2b4a6e">t₅</text>
  </g>
  <path d="M 306 390 L 318 410 M 318 390 L 306 410" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 360 390 L 372 410 M 372 390 L 360 410" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="420" y="444" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b6e9e">i = 5（保留）</text>
  <text x="470" y="398" font-size="11.5" fill="#444">s = 2：删的是 3、4（紧邻 5）</text>
  <text x="470" y="416" font-size="11.5" font-weight="bold" fill="#b03a3a">speed(5) = time[3]+time[4]+time[5]</text>

  <text x="470" y="466" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">同一 (i, j)、不同 s ⟹ speed 不同 ⟹ 后续代价 (pos[m]−pos[i]) × speed 不同 ⟹ s 必须写进状态</text>

  <!-- ===== Panel 3: state and transition ===== -->
  <text x="60" y="496" font-size="13" font-weight="bold" fill="#2b6e9e">③ 状态设计与转移</text>

  <g filter="url(#sk)">
    <rect x="70" y="520" width="250" height="128" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="195" y="544" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">状态 dp[i][j][s]</text>
  <g font-size="11" fill="#444">
    <text x="90" y="568">i：当前保留的路标（路段左端点）</text>
    <text x="90" y="588">j：已删除路标总数（0 ≤ j ≤ k）</text>
    <text x="90" y="608">s：i 左侧紧邻删除的个数（s ≤ j）</text>
    <text x="90" y="628">值：0 → pos[i] 的最小耗时</text>
  </g>

  <g filter="url(#sk)">
    <rect x="350" y="520" width="240" height="52" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="470" y="542" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" font-family="monospace">speed = time[i] + pre[i−1] − pre[i−s−1]</text>
  <text x="470" y="560" text-anchor="middle" font-size="9.5" fill="#888">由 s 用前缀和 O(1) 还原 i 的吸收后时速</text>

  <path d="M 330 600 L 608 600" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="469" y="588" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">+= (pos[m] − pos[i]) × speed</text>
  <text x="469" y="620" text-anchor="middle" font-size="9.5" fill="#666">枚举下一个保留路标 m ∈ (i, n−1]</text>

  <g filter="url(#sk)">
    <rect x="620" y="520" width="252" height="128" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="746" y="544" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">转移到 dp[m][j′][s′]</text>
  <g font-size="11" fill="#444">
    <text x="640" y="568">j′ = j + (m − i − 1)（累计总数）</text>
    <text x="640" y="588">s′ = m − i − 1（新缺口长度）</text>
    <text x="640" y="608">(i, m) 内的路标全部删除</text>
  </g>
  <text x="640" y="628" font-size="11" font-weight="bold" fill="#b03a3a">j′ 与 s′ 同源不同义，别写混！</text>

  <g filter="url(#sk)">
    <rect x="70" y="666" width="802" height="48" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="90" y="686" font-size="12" font-weight="bold" fill="#2b2b2b">s 的上界 —— 数据范围的暗示</text>
  <text x="90" y="706" font-size="11.5" fill="#444">紧邻删除也计入总数：s ≤ j ≤ k ≤ 10 ⟹ 第三维至多 11；n ≤ 50、k ≤ min(n−2, 10) 正是为这一状态设计</text>
</svg>
