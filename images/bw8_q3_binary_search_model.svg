<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：三种颜色各记下标，二分找前驱 / 后继</text>

  <text x="36" y="62" font-size="11.5" fill="#666" font-weight="bold" filter="url(#rough2)">colors =</text>

  <g filter="url(#rough2)">
    <rect x="106" y="48" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="146" y="48" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="186" y="48" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="226" y="48" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="266" y="48" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="306" y="48" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="346" y="48" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="386" y="48" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="426" y="48" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="125" y="68">1</text><text x="165" y="68">1</text><text x="205" y="68">2</text>
    <text x="245" y="68">1</text><text x="285" y="68">3</text><text x="325" y="68">2</text>
    <text x="365" y="68">2</text><text x="405" y="68">3</text><text x="445" y="68">3</text>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="125" y="92">0</text><text x="165" y="92">1</text><text x="205" y="92">2</text>
    <text x="245" y="92">3</text><text x="285" y="92">4</text><text x="325" y="92">5</text>
    <text x="365" y="92">6</text><text x="405" y="92">7</text><text x="445" y="92">8</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#333" font-weight="bold">
    <text x="36" y="128">pos[1] =</text>
    <text x="36" y="164">pos[2] =</text>
    <text x="36" y="200">pos[3] =</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="106" y="112" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="146" y="112" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="186" y="112" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="125" y="131">0</text><text x="165" y="131">1</text><text x="205" y="131">3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="106" y="148" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="146" y="148" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="186" y="148" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#3a5a30" font-weight="bold">
    <text x="125" y="167">2</text><text x="165" y="167">5</text><text x="205" y="167">6</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="106" y="184" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="146" y="184" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="186" y="184" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#8a6a20" font-weight="bold">
    <text x="125" y="203">4</text><text x="165" y="203">7</text><text x="205" y="203">8</text>
  </g>

  <path d="M 348 40 L 348 226" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="348" y="34" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">查询 (i=6, c=1)</text>

  <path d="M 226 126 L 300 126 L 300 174 L 344 174" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="150" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">前驱 3：距离 3</text>
  <text x="296" y="120" font-size="10" fill="#888" filter="url(#rough2)">后继不存在（6 之后无颜色 1）</text>

  <rect x="48" y="244" width="470" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="283" y="268" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">best = min( i − 前驱, 后继 − i )</text>
  <text x="283" y="288" text-anchor="middle" font-size="10.5" fill="#555">pos[c] 天然升序，lower_bound 定位 i 的插入点，左右各看一眼即可</text>
  <text x="283" y="306" text-anchor="middle" font-size="10.5" fill="#555">i 自身就是颜色 c 时命中（距离 0），公式自然覆盖</text>

  <rect x="48" y="336" width="470" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="283" y="356" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">⚠ pos[c] 为空（数组中没有颜色 c）→ 返回 −1</text>
  <text x="283" y="374" text-anchor="middle" font-size="10.5" fill="#555">示例 2：colors = [1,2]，查询 (0,3) → −1</text>
</svg>
