<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="700" height="450" fill="#fafafa"/>

  <text x="350" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：每个 b 都被「组内最小值与最大值」夹住</text>
  <text x="350" y="54" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">一次合并把 x、y 换成一个落在 [x, y] 里的 z —— 值域的区间只会缩小，绝不会跑到外面</text>

  <!-- 列标题 -->
  <text x="150" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">组里较小的 a</text>
  <text x="350" y="80" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">目标 b</text>
  <text x="550" y="80" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">组里较大的 a</text>

  <!-- 第 1 组 -->
  <rect x="110" y="92" width="80" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <rect x="510" y="92" width="80" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="550" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#33517a" filter="url(#rough2)">3</text>
  <rect x="310" y="92" width="80" height="44" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="350" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5410" filter="url(#rough2)">2</text>
  <path d="M196 114 L304 114" stroke="#d6a040" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M504 114 L396 114" stroke="#d6a040" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="120" font-size="12" fill="#888" filter="url(#rough2)">组 1</text>
  <text x="350" y="152" text-anchor="middle" font-size="11" fill="#7a5410" filter="url(#rough2)">2 ∈ [1, 3] ✓</text>

  <!-- 第 2 组 -->
  <rect x="110" y="168" width="80" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">8</text>
  <rect x="510" y="168" width="80" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="550" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#33517a" filter="url(#rough2)">18</text>
  <rect x="310" y="168" width="80" height="44" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="350" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5410" filter="url(#rough2)">15</text>
  <path d="M196 190 L304 190" stroke="#d6a040" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M504 190 L396 190" stroke="#d6a040" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="196" font-size="12" fill="#888" filter="url(#rough2)">组 2</text>
  <text x="350" y="228" text-anchor="middle" font-size="11" fill="#7a5410" filter="url(#rough2)">15 ∈ [8, 18] ✓</text>

  <!-- 第 3 组 -->
  <rect x="110" y="244" width="80" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">25</text>
  <rect x="510" y="244" width="80" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="550" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#33517a" filter="url(#rough2)">30</text>
  <rect x="310" y="244" width="80" height="44" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="350" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5410" filter="url(#rough2)">28</text>
  <path d="M196 266 L304 266" stroke="#d6a040" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M504 266 L396 266" stroke="#d6a040" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="272" font-size="12" fill="#888" filter="url(#rough2)">组 3</text>
  <text x="350" y="304" text-anchor="middle" font-size="11" fill="#7a5410" filter="url(#rough2)">28 ∈ [25, 30] ✓</text>

  <!-- 结论 -->
  <rect x="36" y="320" width="628" height="114" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="346" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">一句话：把 a 分成 m 个非空组，组 g 产出 b[g] 可行 ⟺ min(组) &lt; b[g] &lt; max(组)。</text>
  <text x="56" y="370" font-size="12" fill="#33517a" filter="url(#rough2)">必要性：组内任意次合并后得到的值 v 恒有 min(组) ≤ v ≤ max(组)，对合并次数归纳即得。</text>
  <text x="56" y="392" font-size="12" fill="#33517a" filter="url(#rough2)">充分性：先用 min 与 max 合并成 b[g]，再拿 b[g] 与组内其余元素逐个合并，每次令 z = b[g] 即可保持。</text>
  <text x="56" y="416" font-size="12" fill="#7a5410" filter="url(#rough2)">因 b 不在 a 中，每组至少 2 个元素 ⇒ n ≥ 2m；多余的 n − 2m 个塞进任意组只会把区间拉宽。</text>
</svg>
