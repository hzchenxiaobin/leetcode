<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">核心观察：按深度奇偶二染色，同色 ⇔ 偶数距离</text>

  <text x="26" y="97" font-size="11" fill="#446688" filter="url(#rough2)">d=0</text>
  <text x="26" y="170" font-size="11" fill="#d6a040" filter="url(#rough2)">d=1</text>
  <text x="26" y="243" font-size="11" fill="#446688" filter="url(#rough2)">d=2</text>

  <line x1="115" y1="92" x2="65" y2="165" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="115" y1="92" x2="175" y2="165" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="65" y1="165" x2="40" y2="238" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="65" y1="165" x2="90" y2="238" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="175" y1="165" x2="140" y2="238" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="175" y1="165" x2="195" y2="238" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>

  <line x1="40" y1="238" x2="65" y2="165" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="65" y1="165" x2="115" y2="92" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="115" y1="92" x2="175" y2="165" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="175" y1="165" x2="140" y2="238" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>

  <circle cx="115" cy="92" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b" filter="url(#rough2)">r</text>
  <circle cx="65" cy="165" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="65" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">a</text>
  <circle cx="175" cy="165" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">b</text>
  <circle cx="40" cy="238" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="40" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b" filter="url(#rough2)">c</text>
  <circle cx="90" cy="238" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b" filter="url(#rough2)">d</text>
  <circle cx="140" cy="238" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="140" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b" filter="url(#rough2)">e</text>
  <circle cx="195" cy="238" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="195" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b" filter="url(#rough2)">f</text>

  <text x="118" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">c → e：同色，路径 4 条边（偶）✓</text>
  <text x="118" y="308" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">偶层（蓝）：r,c,d,e,f = 5 个</text>
  <text x="118" y="330" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">奇层（橙）：a,b = 2 个</text>

  <rect x="292" y="78" width="210" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="397" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">任取根，路径长度拆解</text>
  <text x="397" y="122" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">dist(u,v) = dep(u)+dep(v) − 2·dep(lca)</text>

  <path d="M 397 142 L 397 156" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <rect x="292" y="160" width="210" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="397" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">模 2 消去 2 倍项</text>
  <text x="397" y="202" text-anchor="middle" font-size="11.5" fill="#99741c" filter="url(#rough2)">dist(u,v) ≡ dep(u)+dep(v) (mod 2)</text>

  <path d="M 397 214 L 397 228" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <rect x="292" y="232" width="210" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="256" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">同色 ⇔ 偶距</text>
  <text x="397" y="280" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">异色 ⇔ 奇距</text>

  <path d="M 397 298 L 397 312" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <rect x="292" y="316" width="210" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">树 = 天然二分图</text>
  <text x="397" y="362" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">每条边两端必异色</text>
</svg>
