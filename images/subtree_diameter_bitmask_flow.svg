<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="640" height="620" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一次预处理 + 位掩码枚举 + 连通检查 + 逐对取 max</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11.5" fill="#777777">n ≤ 15 ⇒ 最多 2¹⁵ = 32768 个子集，mask 与子树一一对应、不重不漏</text>

  <!-- A: build graph -->
  <g filter="url(#sk)">
    <rect x="90" y="80" width="300" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="240" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">建树：城市编号减一，得邻接表 g</text>
  <path d="M 240 118 L 240 144" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- B: all-source BFS -->
  <g filter="url(#sk)">
    <rect x="90" y="144" width="300" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="240" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">n 次 BFS → 全源距离矩阵 dist（O(n²)）</text>
  <path d="M 240 182 L 240 208" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- C: enumerate masks (loop head) -->
  <g filter="url(#sk)">
    <rect x="90" y="208" width="300" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="240" y="232" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">枚举 mask = 1 … 2ⁿ − 1（第 i 位 = 城市 i+1）</text>
  <path d="M 240 246 L 240 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D: popcount >= 2 ? -->
  <g filter="url(#sk)">
    <polygon points="240,274 357,314 240,354 123,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="240" y="319" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">popcount(mask) ≥ 2 ?</text>
  <path d="M 357 314 L 440 314" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="388" y="306" text-anchor="middle" font-size="11.5" fill="#777777">否</text>
  <g filter="url(#sk)">
    <rect x="440" y="296" width="170" height="36" rx="8" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.3"/>
  </g>
  <text x="525" y="318" text-anchor="middle" font-size="11.5" fill="#777777">跳过：单点子树，直径 0</text>
  <path d="M 240 354 L 240 382" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="252" y="373" font-size="11.5" fill="#777777">是</text>

  <!-- E0: BFS inside mask -->
  <g filter="url(#sk)">
    <rect x="90" y="382" width="300" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="240" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">从 mask 最低位顶点出发、只在 mask 内 BFS</text>
  <path d="M 240 420 L 240 448" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- E: connected ? -->
  <g filter="url(#sk)">
    <polygon points="240,448 365,492 240,536 115,492" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="240" y="489" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">访问数 = popcount ?</text>
  <text x="240" y="509" text-anchor="middle" font-size="11.5" fill="#8a6415">⟺ 诱导子图连通</text>
  <path d="M 365 492 L 440 492" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="398" y="484" text-anchor="middle" font-size="11.5" fill="#777777">否</text>
  <g filter="url(#sk)">
    <rect x="440" y="474" width="170" height="36" rx="8" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.3"/>
  </g>
  <text x="525" y="496" text-anchor="middle" font-size="11.5" fill="#777777">跳过：不连通，不是子树</text>
  <path d="M 240 536 L 240 564" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="252" y="555" font-size="11.5" fill="#777777">是</text>

  <!-- F: diameter lookup + count -->
  <g filter="url(#sk)">
    <rect x="80" y="564" width="320" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="240" y="584" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">d = max{ dist[i][j] : i &lt; j ∈ mask }</text>
  <text x="240" y="602" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">ans[d − 1] += 1</text>

  <!-- loop back to C -->
  <path d="M 80 587 L 34 587 L 34 227 L 90 227" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="46" y="406" text-anchor="middle" font-size="11.5" fill="#888888" transform="rotate(-90 46 406)">下一个 mask</text>

  <!-- return -->
  <path d="M 390 227 L 452 227" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="421" y="218" text-anchor="middle" font-size="11" fill="#777777">枚举完毕</text>
  <g filter="url(#sk)">
    <rect x="452" y="205" width="168" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="536" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">✓ 返回 ans</text>
  <text x="536" y="242" text-anchor="middle" font-size="11" fill="#2e6e2e">（长度 n − 1）</text>
</svg>
