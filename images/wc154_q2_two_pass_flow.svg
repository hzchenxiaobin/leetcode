<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两遍扫描：先配对，再按方向游走</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第一遍只负责「谁和谁配对」，第二遍才真正产出答案</text>

  <rect x="190" y="64" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">输入 s（括号保证配对）</text>

  <path d="M 280 98 L 280 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="120" width="420" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66">
    <text x="86" y="142" font-size="11" font-weight="bold">第一遍 · 栈配对</text>
    <text x="86" y="164">遇 ( 把下标压栈；遇 ) 弹出 j，令 match[i] = j、match[j] = i</text>
    <text x="86" y="184">括号合法配对 ⇒ 一遍扫完每个括号都有唯一配对位置</text>
  </g>

  <path d="M 280 198 L 280 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="212" font-size="9.5" fill="#888" filter="url(#rough2)">match[] 就绪</text>

  <rect x="70" y="220" width="420" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a5a30">
    <text x="86" y="242" font-size="11" font-weight="bold">第二遍 · 循环体（重复到 i 越界）</text>
    <text x="86" y="264">起点 i = 0，方向 dir = +1，答案串 ans 为空</text>
    <text x="86" y="284">括号 → i = match[i]，dir = −dir（跳过去并换向）</text>
    <text x="86" y="304">字母 → ans += s[i]（按当前方向顺序追加）</text>
  </g>

  <path d="M 490 300 C 534 300, 534 240, 490 240" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280 320 L 280 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="342" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">返回 ans（不含括号）</text>

  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两遍都是线性扫描：时间 O(n)，空间 O(n)（match 数组 + 栈）</text>
</svg>
