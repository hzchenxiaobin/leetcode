<svg xmlns="http://www.w3.org/2000/svg" width="660" height="410" viewBox="0 0 660 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="410" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">从后往前看：字符去留由「它身后的退格」决定</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="52" y="72" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b">s = "ab#c"</text>
  <g filter="url(#sk2)"><rect x="52" y="86" width="40" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="72.0" y="111.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">a</text>
  <g filter="url(#sk2)"><rect x="98" y="86" width="40" height="42" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/></g>
  <text x="118.0" y="111.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">b</text>
  <g filter="url(#sk2)"><rect x="144" y="86" width="40" height="42" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/></g>
  <text x="164.0" y="111.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">#</text>
  <g filter="url(#sk2)"><rect x="190" y="86" width="40" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="210.0" y="111.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">c</text>
  <text x="72" y="146" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="118" y="146" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="164" y="146" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <text x="210" y="146" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <path d="M 164 152 Q 141.0 180.0 118 152" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="141" y="202" text-anchor="middle" font-size="10.5" fill="#b85450">「#」删掉左边最近的 b</text>
  <g filter="url(#sk2)"><rect x="34.0" y="229.0" width="232" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="150" y="254.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22">最终文本 = "ac"</text>
  <text x="150" y="270.3" text-anchor="middle" font-size="12" fill="#2e5e22">b 被删除，a、c 保留</text>
  <g filter="url(#sk2)"><rect x="380.0" y="76.0" width="250" height="58" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="505" y="101.3" text-anchor="middle" font-size="12" fill="#2b4a6e">① 从右往左扫描：遇 #</text>
  <text x="505" y="117.3" text-anchor="middle" font-size="12" fill="#2b4a6e">待删计数 skip += 1</text>
  <g filter="url(#sk2)"><rect x="380.0" y="152.0" width="250" height="76" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="505" y="178.3" text-anchor="middle" font-size="12" fill="#2b4a6e">② 遇普通字符：skip &gt; 0 则它</text>
  <text x="505" y="194.3" text-anchor="middle" font-size="12" fill="#2b4a6e">被删除（skip -= 1）；否则它</text>
  <text x="505" y="210.3" text-anchor="middle" font-size="12" fill="#2b4a6e">属于最终文本</text>
  <g filter="url(#sk2)"><rect x="380.0" y="242.0" width="250" height="76" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="505" y="268.3" text-anchor="middle" font-size="12" fill="#2b4a6e">③ 两个串各自从右往左产出最终</text>
  <text x="505" y="284.3" text-anchor="middle" font-size="12" fill="#2b4a6e">文本的逆序，逐字符比较即可</text>
  <text x="505" y="300.3" text-anchor="middle" font-size="12" fill="#2b4a6e">判断是否相等</text>
  <g filter="url(#sk2)"><rect x="70.0" y="351.0" width="520" height="42" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="330" y="376.3" text-anchor="middle" font-size="12" fill="#2b4a6e">空间 O(1)：只维护两个指针与两个 skip 计数</text>
</svg>
