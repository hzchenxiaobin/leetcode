<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">数位和分桶：1 ~ 13 各自流入自己的桶</text>

  <!-- 上方：示例数字与数位和 -->
  <rect x="40" y="52" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="63" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">14</text>
  <rect x="104" y="52" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="127" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="95" y="102" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1+4 = 5</text>
  <rect x="330" y="52" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="353" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">13</text>
  <rect x="394" y="52" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="417" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="385" y="102" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">1+3 = 4 ≠ 3</text>

  <!-- 桶：数位和 1..9 -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="34"  y="130" width="52" height="86" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="94"  y="130" width="52" height="86" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="154" y="130" width="52" height="86" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="214" y="130" width="52" height="86" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="274" y="130" width="52" height="86" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="334" y="130" width="52" height="86" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="394" y="130" width="52" height="86" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="454" y="130" width="52" height="86" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="514" y="130" width="0"  height="86" rx="6" fill="none" stroke="none"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="60"  y="150">s = 1</text><text x="60"  y="168">1</text><text x="60"  y="184">10</text><text x="60"  y="204" fill="#b85450">大小 2</text>
    <text x="120" y="150">s = 2</text><text x="120" y="168">2</text><text x="120" y="184">11</text><text x="120" y="204" fill="#b85450">大小 2</text>
    <text x="180" y="150">s = 3</text><text x="180" y="168">3</text><text x="180" y="184">12</text><text x="180" y="204" fill="#b85450">大小 2</text>
    <text x="240" y="150">s = 4</text><text x="240" y="168">4</text><text x="240" y="184">13</text><text x="240" y="204" fill="#b85450">大小 2</text>
    <text x="300" y="150">s = 5</text><text x="300" y="168">5</text><text x="300" y="204" fill="#b85450">大小 1</text>
    <text x="360" y="150">s = 6</text><text x="360" y="168">6</text><text x="360" y="204" fill="#b85450">大小 1</text>
    <text x="420" y="150">s = 7</text><text x="420" y="168">7</text><text x="420" y="204" fill="#b85450">大小 1</text>
    <text x="480" y="150">s = 8</text><text x="480" y="168">8</text><text x="480" y="204" fill="#b85450">大小 1</text>
  </g>
  <!-- 第八个桶 s=9 放不下则省略，用省略号提示 -->
  <text x="520" y="168" font-size="14" fill="#888" filter="url(#rough2)">…</text>
  <text x="520" y="204" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">s=9</text>

  <!-- 箭头：数字流入桶 -->
  <path d="M 63 88 C 70 112, 200 112, 294 126" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 127 88 C 170 110, 250 110, 296 126" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 353 88 C 340 106, 280 108, 246 126" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 417 88 C 400 106, 220 108, 184 126" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="120" y="244" width="320" height="74" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">桶大小数组：2 2 2 2 1 1 1 1 1</text>
  <text x="280" y="296" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">最大值 best = 2，并列个数 = 4 → 答案 4</text>
</svg>
