<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">从低位到高位循环 4 次，逐步累加</text>

  <rect x="140" y="46" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">ans = 0，权重 p = 1</text>

  <path d="M 260 84 L 260 104" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="106" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">执行 4 次：d = min(num1 % 10, num2 % 10, num3 % 10)</text>
  <text x="260" y="143" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans += d × p，然后 p ×= 10</text>

  <path d="M 260 150 L 260 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="172" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">三个数各自整除 10：num1 /= 10，num2 /= 10</text>
  <text x="260" y="209" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">num3 /= 10，丢掉已经处理过的这一位</text>

  <path d="M 260 216 L 260 236" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="238" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">循环结束，返回 ans（十进制位权已就位）</text>

  <rect x="52" y="296" width="416" height="60" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="66" y="318" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">为什么循环 4 次就够？</text>
  <text x="66" y="338" font-size="10.5" fill="#555" filter="url(#rough2)">三个数都不超过 9999，高位补 0 后一律视为四位数，逐位取 min 后仍是四位数</text>
  <text x="66" y="353" font-size="10" fill="#888" filter="url(#rough2)">时间 O(1)（固定 4 轮），空间 O(1)</text>
</svg>
