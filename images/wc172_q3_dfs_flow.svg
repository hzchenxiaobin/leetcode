<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <text x="280.0" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">后序 DFS 流程：先归约左右子树，再判断自己是否成了叶子</text>
  <text x="280.0" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">返回值是「归约后的子树根」，null 表示整棵子树被删空</text>
  <rect x="170" y="66" width="220" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">dfs(node)：进入子树</text>
  <text x="280" y="104" text-anchor="middle" font-size="10" fill="#66788f" filter="url(#rough2)">目标是返回归约后的根</text>
  <path d="M280,112 L280,148" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,150 390,192 280,234 170,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="197" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">node == null ?</text>
  <path d="M390,192 L416,192" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="418" y="170" width="120" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="197" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">返回 null</text>
  <path d="M280,234 L280,258" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="252" text-anchor="start" font-size="10" fill="#8a98a8" filter="url(#rough2)">否</text>
  <rect x="150" y="260" width="260" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">node.left ← dfs(node.left)</text>
  <path d="M280,302 L280,324" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="326" width="260" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">node.right ← dfs(node.right)</text>
  <path d="M280,368 L280,390" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="250,392 388,440 250,488 112,440" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="434" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">两个孩子都为空</text>
  <text x="250" y="452" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">且 node.val == target ?</text>
  <path d="M388,440 L414,440" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="401" y="432" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="416" y="410" width="130" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="481" y="434" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">返回 null</text>
  <text x="481" y="452" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">（删掉本节点）</text>
  <path d="M250,488 L250,512" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="508" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="150" y="516" width="200" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="544" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 node（保留）</text>
  <text x="280" y="586" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个节点进出各一次：时间 O(n)，递归栈 O(h)，h 为树高</text>
</svg>
