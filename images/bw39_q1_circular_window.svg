<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="330" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：循环数组 = 把 code 首尾相接摊平两遍</text>
  <text x="340" y="54" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">code = [5, 7, 1, 4]，k = 3：res[i] 就是「从 i+1 开始向右 k 个」的窗口和</text>

  <!-- doubled array -->
  <g font-size="12" text-anchor="middle" filter="url(#r)">
    <text x="150" y="92" fill="#999">下标 →</text>
    <text x="205" y="92" fill="#999">0</text>
    <text x="265" y="92" fill="#999">1</text>
    <text x="325" y="92" fill="#999">2</text>
    <text x="385" y="92" fill="#999">3</text>
    <text x="445" y="92" fill="#bbb">0</text>
    <text x="505" y="92" fill="#bbb">1</text>
    <text x="565" y="92" fill="#bbb">2</text>
    <text x="625" y="92" fill="#bbb">3</text>
  </g>
  <g filter="url(#r)">
    <rect x="178" y="100" width="54" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="238" y="100" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="298" y="100" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="358" y="100" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="418" y="100" width="54" height="46" rx="4" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="478" y="100" width="54" height="46" rx="4" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="538" y="100" width="54" height="46" rx="4" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="598" y="100" width="54" height="46" rx="4" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="205" y="129" fill="#446688">5</text>
    <text x="265" y="129" fill="#4a7a3a">7</text>
    <text x="325" y="129" fill="#4a7a3a">1</text>
    <text x="385" y="129" fill="#4a7a3a">4</text>
    <text x="445" y="129" fill="#aaa">5</text>
    <text x="505" y="129" fill="#aaa">7</text>
    <text x="565" y="129" fill="#aaa">1</text>
    <text x="625" y="129" fill="#aaa">4</text>
  </g>

  <!-- window bracket -->
  <path d="M 240 162 L 240 172 L 410 172 L 410 162" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="325" y="192" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#r)">i = 0 的窗口：7 + 1 + 4 = 12（跨过队尾绕回无需特判）</text>

  <!-- slide arrow -->
  <path d="M 235 216 L 295 216" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="330" y="221" font-size="13" fill="#3a3a3a" filter="url(#r)">窗口右移一位：加上进来的，减去出去的 → O(1) 滚动</text>

  <!-- k sign box -->
  <g filter="url(#r)">
    <rect x="120" y="248" width="440" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="272" text-anchor="middle" font-size="13.5" fill="#7a5b1e" filter="url(#r)">k &gt; 0：取右侧 k 个（窗口 [i+1, i+k]）</text>
  <text x="340" y="292" text-anchor="middle" font-size="13.5" fill="#7a5b1e" filter="url(#r)">k &lt; 0：取左侧 |k| 个（窗口 [i−|k|, i−1]）；k = 0：直接全填 0</text>
</svg>
