<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="510" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：x = 1 是最省的「探针」</text>
  <path d="M 186 42 Q 360 50 534 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="64" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">最低位钉成 1：AND 时只暴露 bit0，OR 时把 bit0 锁死、其余 29 位全暴露</text>

  <rect x="228" y="78" width="264" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">发送 x = 1　(…0000 0001)</text>

  <path d="M 300 118 C 220 138 160 142 124 160" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 118 L 360 160" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 118 C 500 138 560 142 596 160" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 1 列 -->
  <rect x="18" y="160" width="204" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="185" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">o = 0　⇒　ty = &amp;</text>
  <rect x="18" y="206" width="204" height="52" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="30" y="226" font-size="12" fill="#3a5a30" filter="url(#rough2)">bit0(v) = 0</text>
  <text x="30" y="246" font-size="12" fill="#3a5a30" filter="url(#rough2)">bit1..29 完全未知</text>
  <rect x="18" y="266" width="204" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="291" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">m = (0, 1)</text>
  <rect x="18" y="314" width="204" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="334" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">r 的 bit0 = b</text>
  <text x="120" y="352" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">确定解出</text>

  <!-- 第 2 列 -->
  <rect x="258" y="160" width="204" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="185" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">o &gt; 1　⇒　ty = |</text>
  <rect x="258" y="206" width="204" height="52" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="226" font-size="12" fill="#2f4a66" filter="url(#rough2)">bit1..29 = o 的对应位</text>
  <text x="270" y="246" font-size="12" fill="#2f4a66" filter="url(#rough2)">只剩 bit0 未知</text>
  <rect x="258" y="266" width="204" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="291" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">q = msb(o)，m = (0, 2^q)</text>
  <rect x="258" y="314" width="204" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="334" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">bit_q(v) = 1</text>
  <text x="360" y="352" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">确定解出</text>

  <!-- 第 3 列 -->
  <rect x="498" y="160" width="204" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="600" y="185" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">o = 1　⇒　ty 不确定</text>
  <rect x="498" y="206" width="204" height="52" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="510" y="226" font-size="12" fill="#8a3a36" filter="url(#rough2)">一致集 V = {0} ∪ {奇数}</text>
  <text x="510" y="246" font-size="12" fill="#8a3a36" filter="url(#rough2)">两种 ty 都解释得通</text>
  <rect x="498" y="266" width="204" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="600" y="291" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">m0 取偶、m1 取奇（随机）</text>
  <rect x="498" y="314" width="204" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="600" y="334" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">先比 r = m0 / m1</text>
  <text x="600" y="352" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">再按 r 的奇偶 → 概率正确</text>

  <rect x="36" y="382" width="648" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="54" y="406" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">只有 o = 1 这一列有歧义：若交互器恰好猜中 d = m0 ⊕ m1 = 那个奇数 v，解码就会翻车</text>
  <text x="54" y="430" font-size="12.5" fill="#6b5a30" filter="url(#rough2)">把 m0、m1 在「看到 o 之后」随机取，交互器在看到 r 之前无法预知 d　⇒　单次失败概率 2⁻²⁹</text>
  <text x="54" y="450" font-size="12.5" fill="#6b5a30" filter="url(#rough2)">x = 1 只「牺牲」1 个比特，却换来 ty 的可判定性 + 其余 29 位的完整信息</text>

  <text x="360" y="492" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">o 是交互器返回的第一个数；r 是第二个数；b 是最后要输出的隐藏位</text>
</svg>
