<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="620" fill="#fafafa"/>
  <text x="390" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：真相源与候选集分离——哈希定真相，有序结构定最值</text>
  <path d="M 150 44 Q 390 54 630 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- band 1: stream -->
  <text x="50" y="72" font-size="13.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">① 数据流乱序到达：同一时间戳，后到的记录「更正」先到的</text>

  <g filter="url(#rough2)">
    <rect x="70" y="86" width="78" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="162" y="86" width="78" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="254" y="86" width="78" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="346" y="86" width="78" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="109" y="107" text-anchor="middle" font-size="12" fill="#8a6414" filter="url(#rough2)">(1,10)</text>
  <text x="201" y="107" text-anchor="middle" font-size="12" fill="#8a6414" filter="url(#rough2)">(2,5)</text>
  <text x="293" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">(1,3)</text>
  <text x="385" y="107" text-anchor="middle" font-size="12" fill="#8a6414" filter="url(#rough2)">(4,2)</text>
  <path d="M 109 124 Q 247 160 293 124" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="201" y="152" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">同时间戳 1：价格 10 被更正为 3</text>
  <text x="109" y="140" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">作废 ✗</text>
  <text x="293" y="140" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">生效 ✓</text>

  <g filter="url(#rough2)">
    <rect x="470" y="86" width="255" height="46" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="597" y="105" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每次 update 到达一条 (t, p) 记录</text>
  <text x="597" y="123" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">current / maximum / minimum 任意时刻穿插</text>

  <!-- band 2: truth source -->
  <text x="50" y="182" font-size="13.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">② 真相源：哈希表 ts2price（update 直接覆盖）+ maxTs 标量</text>

  <g filter="url(#rough2)">
    <rect x="70" y="196" width="200" height="86" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
    <rect x="80" y="226" width="180" height="22" rx="3" fill="#e8f0fe"/>
  </g>
  <text x="170" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">ts2price</text>
  <path d="M 82 222 L 258 222" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="170" y="241" text-anchor="middle" font-size="11.5" fill="#2b4666" filter="url(#rough2)">1 → 3（10 被覆盖）</text>
  <text x="170" y="262" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2 → 5</text>
  <text x="170" y="278" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4 → 2</text>

  <path d="M 270 236 L 316 236" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="320" y="216" width="110" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="375" y="241" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">maxTs = 4</text>
  <path d="M 430 236 L 476 236" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="480" y="216" width="250" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="605" y="241" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">current() = ts2price[4] = 2，O(1)</text>
  <text x="70" y="304" font-size="10.5" fill="#555" filter="url(#rough2)">更正 = 覆盖一行哈希——真相永远只有一份，其余结构都听它的</text>

  <!-- band 3: candidate set -->
  <text x="50" y="330" font-size="13.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">③ 最值候选集：有序结构维护当前有效价，两套等价实现</text>

  <!-- left panel: multiset -->
  <g filter="url(#rough2)">
    <rect x="50" y="344" width="345" height="246" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="222" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4666" filter="url(#rough2)">方案 A：multiset 有序多重集（C++）</text>
  <text x="222" y="388" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#rough2)">更正 = 删旧价 + 插新价，候选集零残留</text>
  <text x="222" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">update(1,3)：erase(find(10)) → insert(3)</text>
  <g filter="url(#rough2)">
    <rect x="146" y="424" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="424" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="254" y="424" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="168" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4666" filter="url(#rough2)">2</text>
  <text x="222" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4666" filter="url(#rough2)">3</text>
  <text x="276" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4666" filter="url(#rough2)">5</text>
  <path d="M 168 458 L 168 472" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 276 458 L 276 472" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="487" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">begin() → 2</text>
  <text x="276" y="487" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">rbegin() → 5</text>
  <text x="222" y="510" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">maximum() = 5，minimum() = 2，取顶 O(1)</text>
  <g filter="url(#rough2)">
    <rect x="80" y="522" width="285" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="222" y="541" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">update O(log n)，查询 O(1)，严格无均摊</text>
  <text x="222" y="574" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">坑：erase 必须传 find(old)，传值会把同价全部删光！</text>

  <!-- right panel: dual heap lazy -->
  <g filter="url(#rough2)">
    <rect x="435" y="344" width="345" height="246" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="607" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">方案 B：双堆 + 延迟删除（Python）</text>
  <text x="607" y="388" text-anchor="middle" font-size="10.5" fill="#566" filter="url(#rough2)">只 push 不删——堆删不掉指定条目，那就先留着</text>
  <text x="607" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">update(1,3) 后 maxHeap 内容（大顶）：</text>
  <g filter="url(#rough2)">
    <rect x="455" y="424" width="72" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="537" y="424" width="72" height="32" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
    <rect x="619" y="424" width="72" height="32" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="491" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">10,1</text>
  <text x="573" y="445" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5,2</text>
  <text x="655" y="445" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3,1</text>
  <path d="M 462 429 L 520 451" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 520 429 L 462 451" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="491" y="471" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">过时 ✗</text>
  <text x="573" y="471" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">有效 ✓</text>
  <text x="655" y="471" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">有效 ✓</text>
  <text x="607" y="494" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#rough2)">maximum()：堆顶 (10,1)，ts2price[1] = 3 ≠ 10 → pop</text>
  <text x="607" y="513" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">新堆顶 (5,2)，ts2price[2] = 5 ✓ → 返回 5</text>
  <g filter="url(#rough2)">
    <rect x="465" y="526" width="285" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="607" y="545" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">均摊 O(log n)：每条目至多 push 一次、pop 一次</text>
  <text x="607" y="578" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">旧条目从不主动删，只在挡住堆顶时被当场识破</text>

  <text x="390" y="608" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">两套殊途同归：一切以 ts2price 为准——multiset 据此增删，堆顶据此校验</text>
</svg>
