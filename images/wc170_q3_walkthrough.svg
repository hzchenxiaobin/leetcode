<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：从 id = 0 出发，4 个点构成一个环</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">BFS 得到 dist = [0, 1, 1, 2]；level = 1 取 {1, 2}，level = 2 取 {3}</text>

  <rect x="56" y="60" width="524" height="30" fill="#eef1f5" stroke="#8899aa" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="105" y="80" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">人 u</text>
  <text x="190" y="80" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">dist</text>
  <text x="295" y="80" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">第 1 层？</text>
  <text x="425" y="80" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">watchedVideos[u]</text>
  <text x="540" y="80" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">计入 cnt</text>

  <rect x="56" y="90" width="524" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="295" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否（是我自己）</text>
  <text x="425" y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">["A","B"]</text>
  <text x="540" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>

  <rect x="56" y="128" width="524" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="295" y="150" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">是</text>
  <text x="425" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">["C"]</text>
  <text x="540" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">C + 1</text>

  <rect x="56" y="166" width="524" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="188" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="190" y="188" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="295" y="188" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">是</text>
  <text x="425" y="188" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">["B","C"]</text>
  <text x="540" y="188" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">B + 1, C + 1</text>

  <rect x="56" y="204" width="524" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="190" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="295" y="226" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">否（差 2 层）</text>
  <text x="425" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">["D"]</text>
  <text x="540" y="226" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>

  <rect x="56" y="254" width="250" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="274" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">level = 1：{1, 2}</text>
  <text x="70" y="292" font-size="10" fill="#555" filter="url(#rough2)">cnt = {B:1, C:2}</text>
  <text x="70" y="308" font-size="10.5" fill="#b85450" filter="url(#rough2)">答案 ["B","C"]</text>

  <rect x="330" y="254" width="250" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="344" y="274" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">level = 2：{3}</text>
  <text x="344" y="292" font-size="10" fill="#555" filter="url(#rough2)">cnt = {D:1}</text>
  <text x="344" y="308" font-size="10.5" fill="#b85450" filter="url(#rough2)">答案 ["D"]</text>

  <text x="310" y="340" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">B + 1 与 C + 1 来自不同的人，频次统计的是「本层所有人的观看次数之和」</text>
  <text x="310" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">排序只作用于视频名，不会因为频次相同就把名字顺序打乱</text>
</svg>
