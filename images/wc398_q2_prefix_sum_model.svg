<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">违规间隙 0/1 化 → 前缀和，区间查询变两数相减</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">以示例 1 演算：nums = [3,4,1,2,6]，di = 1 表示间隙 i 两侧同奇偶（违规）</text>

  <!-- 元素行 -->
  <rect x="48" y="58" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="80" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">3</text>
  <text x="80" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">奇</text>
  <rect x="152" y="58" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="184" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">4</text>
  <text x="184" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>
  <rect x="256" y="58" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="288" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">1</text>
  <text x="288" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">奇</text>
  <rect x="360" y="58" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="392" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">2</text>
  <text x="392" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>
  <rect x="464" y="58" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="496" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">6</text>
  <text x="496" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>

  <!-- 间隙违规位 -->
  <text x="132" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">d1=0 ✓</text>
  <text x="236" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">d2=0 ✓</text>
  <text x="340" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">d3=0 ✓</text>
  <text x="444" y="122" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">d4=1 ✗</text>

  <!-- 前缀和行 -->
  <rect x="48" y="142" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="80" y="165" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#r)">0</text>
  <rect x="152" y="142" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="184" y="165" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#r)">0</text>
  <rect x="256" y="142" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="288" y="165" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#r)">0</text>
  <rect x="360" y="142" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="392" y="165" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#r)">0</text>
  <rect x="464" y="142" width="64" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <text x="496" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">1</text>

  <text x="80" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">pre0</text>
  <text x="184" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">pre1</text>
  <text x="288" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">pre2</text>
  <text x="392" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">pre3</text>
  <text x="496" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">pre4</text>

  <!-- +1 跳变箭头 -->
  <path d="M 450 126 C 472 132, 486 134, 493 140" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#r)"/>
  <text x="444" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">+1</text>

  <!-- 查询示例 -->
  <rect x="40" y="212" width="480" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="60" y="236" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#r)">查询 [0,4]：pre[4] - pre[0] = 1 - 0 = 1 ≠ 0 → false</text>
  <text x="60" y="258" font-size="11" fill="#888" filter="url(#r)">区间 (0,4] 恰好含有唯一的违规间隙 d4（2 与 6 同为偶数），跨过跳变即 false</text>

  <!-- 一般结论 -->
  <rect x="40" y="288" width="480" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="60" y="312" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">一般地：[l, r] 特殊 ⇔ pre[r] - pre[l] = 0 ⇔ pre[r] = pre[l]</text>
  <text x="60" y="334" font-size="11" fill="#888" filter="url(#r)">单元素查询 l = r 时差自动为 0 → true，无需特判；pre 只在违规间隙处抬升 1</text>

  <text x="280" y="382" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">每个查询只剩两次下标访问 + 一次比较，总量 O(n + q)</text>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#999" filter="url(#r)">违规位挂在间隙上，pre[r] - pre[l] 恰好截取 (l, r] 内的间隙</text>
</svg>
