<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">骨牌只取决于「无序对」：旋转 180° 是等价的</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把每张骨牌规范化成 min ≤ max，等价 ⟺ 规范化结果相同</text>

  <text x="78" y="72" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">dominoes[i] = [1, 2]</text>
  <rect x="56" y="82" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="82" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="78" y="110" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <text x="122" y="110" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 156 104 L 204 104" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="94" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">旋转 180°</text>

  <text x="240" y="72" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">dominoes[j] = [2, 1]</text>
  <rect x="218" y="82" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="262" y="82" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="110" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">2</text>
  <text x="284" y="110" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 78 128 C 96 156, 120 152, 132 148" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 240 128 C 236 142, 232 146, 228 148" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="150" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="172" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">规范化：(min, max) —— (1, 2) 与 (2, 1) 都写成 (1, 2)</text>
  <text x="56" y="193" font-size="11" fill="#333" filter="url(#rough2)">编码 key = 1 × 10 + 2 = 12：两张骨牌落进同一个桶</text>
  <text x="356" y="193" font-size="10" fill="#888" filter="url(#rough2)">（a ≤ b 时编码唯一）</text>

  <rect x="40" y="226" width="232" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="246" font-size="11" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">键的空间极小</text>
  <text x="54" y="266" font-size="10" fill="#444" filter="url(#rough2)">1 ≤ a ≤ b ≤ 9 → 45 个等价类</text>
  <text x="54" y="284" font-size="10" fill="#444" filter="url(#rough2)">cnt[100] 直接当桶，无需哈希</text>
  <text x="54" y="302" font-size="10" fill="#446688" filter="url(#rough2)">key ∈ [11, 99]，无冲突</text>

  <rect x="288" y="226" width="232" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="302" y="246" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">这些「键」都是错的</text>
  <text x="302" y="266" font-size="10" fill="#444" filter="url(#rough2)">a + b：(1, 4) 与 (2, 3) 都是 5</text>
  <text x="302" y="284" font-size="10" fill="#444" filter="url(#rough2)">a × b：(1, 6) 与 (2, 3) 都是 6</text>
  <text x="302" y="302" font-size="10" fill="#8a3a36" filter="url(#rough2)">只有有序对 (min, max) 不撞键</text>

  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">于是答案 = Σ_k C(c_k, 2)：按规范化键把骨牌分组后两两配对</text>
</svg>
