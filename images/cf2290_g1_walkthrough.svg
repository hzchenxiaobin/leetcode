<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">样例 1 走查：n = 4，k = 3，h = (1, 5, 2, 8)</text>
  <text x="310" y="46" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">列为段 j = 1..4；A 只覆盖直线弧，C−S·n 补上绕环那侧，x = max(A, C−S·n)，土 = x − h</text>

  <line x1="40" y1="62" x2="596" y2="62" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="80" font-size="9.5" fill="#888" filter="url(#rough2)">项</text>
  <text x="242" y="80" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="326" y="80" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="410" y="80" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="494" y="80" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="574" y="80" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">Σ / k=3</text>
  <line x1="40" y1="86" x2="596" y2="86" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <line x1="200" y1="62" x2="200" y2="360" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="284" y1="62" x2="284" y2="360" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="368" y1="62" x2="368" y2="360" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="452" y1="62" x2="452" y2="360" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="536" y1="62" x2="536" y2="360" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <text x="46" y="110" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">h</text>
  <text x="242" y="110" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="326" y="110" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">5</text>
  <text x="410" y="110" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="494" y="110" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">8</text>

  <text x="46" y="140" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">S=5 · A</text>
  <text x="242" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="326" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">5</text>
  <text x="410" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="494" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">8</text>

  <text x="46" y="170" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">S=5 · C−5n</text>
  <text x="242" y="170" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="326" y="170" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">−2</text>
  <text x="410" y="170" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">−7</text>
  <text x="494" y="170" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">−4</text>

  <rect x="201" y="180" width="396" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="46" y="200" font-size="9.5" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">S=5 · x</text>
  <text x="242" y="200" text-anchor="middle" font-size="11" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="326" y="200" text-anchor="middle" font-size="11" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="410" y="200" text-anchor="middle" font-size="11" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="494" y="200" text-anchor="middle" font-size="11" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">8</text>

  <text x="46" y="230" font-size="9.5" fill="#2f5a28" filter="url(#rough2)">S=5 · 土 → 可行</text>
  <text x="242" y="230" text-anchor="middle" font-size="11" fill="#2f5a28" filter="url(#rough2)">2</text>
  <text x="326" y="230" text-anchor="middle" font-size="11" fill="#2f5a28" filter="url(#rough2)">0</text>
  <text x="410" y="230" text-anchor="middle" font-size="11" fill="#2f5a28" filter="url(#rough2)">1</text>
  <text x="494" y="230" text-anchor="middle" font-size="11" fill="#2f5a28" filter="url(#rough2)">0</text>
  <text x="574" y="230" text-anchor="middle" font-size="11" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">3</text>

  <line x1="40" y1="244" x2="596" y2="244" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="46" y="262" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">S=4 · A</text>
  <text x="242" y="262" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="326" y="262" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">5</text>
  <text x="410" y="262" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="494" y="262" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">8</text>

  <text x="46" y="292" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">S=4 · C−4n</text>
  <text x="242" y="292" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="326" y="292" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">0</text>
  <text x="410" y="292" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">−4</text>
  <text x="494" y="292" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">−3</text>

  <rect x="201" y="302" width="396" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="46" y="322" font-size="9.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">S=4 · x</text>
  <text x="242" y="322" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="326" y="322" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="410" y="322" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="494" y="322" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">8</text>

  <text x="46" y="352" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">S=4 · 土 → 不可行</text>
  <text x="242" y="352" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="326" y="352" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">0</text>
  <text x="410" y="352" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="494" y="352" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">0</text>
  <text x="574" y="352" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="310" y="384" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">答案 = 5：S = 4 要 3+0+2+0 = 5 &gt; 3；S = 5 只要 2+0+1+0 = 3 ≤ 3，二分最终落在 5</text>
</svg>
