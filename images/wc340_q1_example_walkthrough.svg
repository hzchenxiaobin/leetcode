<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：nums = [[1,2,3],[5,6,7],[9,10,11]]，候选依次为 1, 3, 6, 6, 11, 9</text>

  <!-- header row -->
  <rect x="40" y="48" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">候选 v</text>
  <rect x="110" y="48" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">来源</text>
  <rect x="200" y="48" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">v &gt; ans?</text>
  <rect x="280" y="48" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">判定过程</text>
  <rect x="450" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">质数?</text>
  <rect x="510" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="530" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 1: v=1 -->
  <rect x="40" y="82" width="70" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="104" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="82" width="90" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="155" y="104" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">i=0 主</text>
  <rect x="200" y="82" width="80" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="104" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 1&gt;0</text>
  <rect x="280" y="82" width="170" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="104" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">v ≤ 1 → 直接判否</text>
  <rect x="450" y="82" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="104" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="510" y="82" width="40" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="530" y="104" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 2: v=3 (prime, green) -->
  <rect x="40" y="120" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="142" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="110" y="120" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="142" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">i=0 副</text>
  <rect x="200" y="120" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="142" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 3&gt;0</text>
  <rect x="280" y="120" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="142" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">d=3：3²=9 &gt; 3 停，无因子</text>
  <rect x="450" y="120" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="142" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <rect x="510" y="120" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="142" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 3: v=6 main -->
  <rect x="40" y="158" width="70" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="180" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="110" y="158" width="90" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="155" y="180" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">i=1 主</text>
  <rect x="200" y="158" width="80" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="180" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 6&gt;3</text>
  <rect x="280" y="158" width="170" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="180" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">6 % 2 = 0 → 有因子</text>
  <rect x="450" y="158" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="180" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="510" y="158" width="40" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="530" y="180" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 4: v=6 anti (short-circuit, pink) -->
  <rect x="40" y="196" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="218" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="110" y="196" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="218" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">i=1 副(中心)</text>
  <rect x="200" y="196" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="218" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 6≯3</text>
  <rect x="280" y="196" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="218" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">短路跳过，不判质数</text>
  <rect x="450" y="196" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="218" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="510" y="196" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="530" y="218" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 5: v=11 (prime, green) -->
  <rect x="40" y="234" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="256" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">11</text>
  <rect x="110" y="234" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="256" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">i=2 主</text>
  <rect x="200" y="234" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="256" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 11&gt;3</text>
  <rect x="280" y="234" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="256" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">d=3 不整除；d=5：25&gt;11 停</text>
  <rect x="450" y="234" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="256" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <rect x="510" y="234" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="530" y="256" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">11</text>

  <!-- row 6: v=9 (short-circuit, pink) -->
  <rect x="40" y="272" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="294" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="110" y="272" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="294" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">i=2 副</text>
  <rect x="200" y="272" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="294" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 9≯11</text>
  <rect x="280" y="272" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="294" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">短路跳过，不判质数</text>
  <rect x="450" y="272" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="294" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="510" y="272" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="530" y="294" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">11</text>

  <!-- legend -->
  <rect x="40" y="322" width="480" height="28" fill="none" stroke="none"/>
  <rect x="52" y="330" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="74" y="342" font-size="11.5" fill="#555" filter="url(#rough2)">刷新答案</text>
  <rect x="150" y="330" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="342" font-size="11.5" fill="#555" filter="url(#rough2)">被 v &gt; ans 短路跳过</text>
  <text x="300" y="342" font-size="11.5" fill="#7a5a9a" filter="url(#rough2)">中心点 6 的第二次出现被短路自然吞掉</text>

  <!-- result box -->
  <rect x="40" y="364" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">候选中质数：3 与 11，最大质数 = 11</text>
  <text x="280" y="418" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">返回 11 ⭐</text>
</svg>
