<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#555"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">一次扫描：维护已见符号，冲突即返回</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">时间 O(n)，空间 O(1)</text>

  <rect x="180" y="56" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="11" fill="#3a4a66">开始：i = 0，sign = 0</text>

  <path d="M 280 88 L 280 100" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="102" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="123" text-anchor="middle" font-size="11" fill="#3a5a30">取 p_i, p_{i+1}, p_{i+2}（下标模 n），算 cross</text>

  <path d="M 280 136 L 280 148" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,152 390,180 280,208 170,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#8a6a20">cross == 0 ?</text>

  <path d="M 390 180 L 428 180" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="408" y="172" font-size="10" fill="#4a7a3a">是</text>
  <rect x="430" y="162" width="116" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="488" y="178" text-anchor="middle" font-size="9.5" fill="#3a5a30">共线：跳过</text>
  <text x="488" y="191" text-anchor="middle" font-size="9" fill="#666">不改变转向</text>

  <path d="M 280 208 L 280 222" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="220" font-size="10" fill="#666">否</text>

  <polygon points="280,226 420,256 280,286 140,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="10.5" fill="#8a6a20">sign ≠ 0 且 sign ≠ s ?</text>
  <text x="280" y="268" text-anchor="middle" font-size="9" fill="#999">（s = cross 的符号）</text>

  <path d="M 420 256 L 440 256" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="426" y="248" font-size="10" fill="#b85450">是</text>
  <rect x="442" y="238" width="104" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="494" y="260" text-anchor="middle" font-size="10" fill="#8a3a36">return false</text>

  <path d="M 280 286 L 280 300" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="298" font-size="10" fill="#666">否</text>

  <rect x="170" y="302" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="323" text-anchor="middle" font-size="11" fill="#3a4a66">sign ← s；i ← i + 1</text>

  <path d="M 280 334 L 280 348" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,352 356,376 280,400 204,376" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#8a6a20">i &lt; n ?</text>

  <path d="M 204 376 L 130 376 L 130 120 L 128 120" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="300" font-size="10" fill="#446688" transform="rotate(-90 118 300)">是：继续扫描</text>

  <path d="M 280 400 L 280 414" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="412" font-size="10" fill="#4a7a3a">否</text>

  <rect x="196" y="416" width="168" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="437" text-anchor="middle" font-size="10.5" fill="#3a5a30">return true（凸）</text>
</svg>
