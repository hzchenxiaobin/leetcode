<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="540" height="300" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333">示例 2：q 并列时取坐标字典序最小</text>

  <rect x="40" y="50" width="460" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="76" font-size="11" fill="#333">[1,3,4]　距离 4　键 (−4, 1, 3)　→　成为当前最优</text>

  <rect x="40" y="102" width="460" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="128" font-size="11" fill="#333">[2,2,4]　距离 4　键 (−4, 2, 2)　→　1 &lt; 2，不替换</text>

  <rect x="40" y="154" width="460" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="180" font-size="11" fill="#333">[4,4,7]　距离 8 &gt; 5　→　不可到达，直接跳过</text>

  <rect x="40" y="212" width="460" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="54" y="234" font-size="12" fill="#333">返回 [1, 3]</text>
  <text x="54" y="252" font-size="10" fill="#666">若只写 “q 更大才更新”，并列分支会被漏掉，返回 [1,3] 靠运气</text>
</svg>
