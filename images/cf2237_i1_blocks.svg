<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    段 = 只走 0 边的连通块；段的顺序 = 段树的 BFS
  </text>

  <line x1="360" y1="80" x2="250" y2="150" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="360" y1="80" x2="470" y2="150" stroke="#b85450" stroke-width="2.2"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <line x1="250" y1="150" x2="250" y2="220" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="470" y1="150" x2="410" y2="220" stroke="#b85450" stroke-width="2.2"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <line x1="470" y1="150" x2="520" y2="220" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <circle cx="360" cy="80" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="86" text-anchor="middle" font-size="14" fill="#2b3f55" filter="url(#rough2)">1</text>
  <circle cx="250" cy="150" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="156" text-anchor="middle" font-size="14" fill="#2b3f55" filter="url(#rough2)">2</text>
  <circle cx="470" cy="150" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="156" text-anchor="middle" font-size="14" fill="#2f4a26" filter="url(#rough2)">3</text>
  <circle cx="250" cy="220" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="226" text-anchor="middle" font-size="14" fill="#2b3f55" filter="url(#rough2)">4</text>
  <circle cx="410" cy="220" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="226" text-anchor="middle" font-size="14" fill="#7a5a1e" filter="url(#rough2)">5</text>
  <circle cx="520" cy="220" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="226" text-anchor="middle" font-size="14" fill="#2f4a26" filter="url(#rough2)">6</text>

  <text x="300" y="118" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <text x="418" y="114" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="258" y="192" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <text x="438" y="190" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="494" y="192" font-size="12" fill="#446688" filter="url(#rough2)">0</text>

  <rect x="52" y="262" width="192" height="70" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="148" y="290" text-anchor="middle" font-size="14" fill="#2b3f55" filter="url(#rough2)">S₁ = [1, 2, 4]</text>
  <text x="148" y="314" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">段根 1</text>

  <path d="M244,297 L276,297" fill="none" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="278" y="262" width="170" height="70" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="363" y="290" text-anchor="middle" font-size="14" fill="#2f4a26" filter="url(#rough2)">S₂ = [3, 6]</text>
  <text x="363" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">段根 3</text>

  <path d="M448,297 L480,297" fill="none" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="482" y="262" width="152" height="70" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="558" y="290" text-anchor="middle" font-size="14" fill="#7a5a1e" filter="url(#rough2)">S₃ = [5]</text>
  <text x="558" y="314" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">段根 5</text>

  <rect x="52" y="352" width="582" height="40" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="343" y="378" text-anchor="middle" font-size="15" fill="#7a2a26" filter="url(#rough2)">
    p = 1 2 4 | 3 6 | 5
  </text>

  <text x="360" y="422" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    红色虚线 = 颜色 1：把树切成若干 0 段，段根按 BFS 顺序入队
  </text>
</svg>
