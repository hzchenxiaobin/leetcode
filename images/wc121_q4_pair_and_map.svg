<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 354" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="354" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">把 O(n³) 拆成「枚举对 + 子集计数」</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">同一与值 m 的配对共享同一个「谁能和它清零」的答案</text>
  <text x="30" y="72" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">先枚举所有有序对，把与值按「值」聚合</text>
  <text x="30" y="100" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">nums</text>
  <rect x="30" y="110" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="55.0" y="132.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="80" y="110" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="105.0" y="132.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="130" y="110" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="155.0" y="132.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="30" y="178" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">pairCnt</text>
  <rect x="30" y="188" width="74" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="67.0" y="210.78" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">m=0 → 2</text>
  <rect x="114" y="188" width="74" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="151.0" y="210.78" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">m=1 → 3</text>
  <rect x="198" y="188" width="74" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="235.0" y="210.78" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">m=2 → 3</text>
  <rect x="282" y="188" width="74" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="319.0" y="210.78" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">m=3 → 1</text>
  <text x="30" y="258" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">9 个有序对 → 4 个不同与值（m = 0,1,2,3）</text>
  <rect x="30" y="280" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="301" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">每个 m 需要一个数：有多少 nums[k] 满足 nums[k] &amp; m == 0</text><text x="40" y="316.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">等价于 nums[k] 是「m 的 16 位补集」的子集 → 子集和 DP</text><text x="40" y="332.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">于是 O(n²) 枚举 + O(16·2^16) 预处理即可</text>
</svg>
