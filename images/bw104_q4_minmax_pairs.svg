<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：固定最小 i 与最大 j，中间元素自由选择</text>

  <!-- 排序数组 -->
  <g filter="url(#rough2)" font-size="13">
    <text x="60" y="72" fill="#666" font-size="12">排序后</text>
    <rect x="120" y="52" width="70" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="155" y="79" text-anchor="middle" fill="#2f5527">a_i = 1</text>
    <text x="155" y="112" text-anchor="middle" fill="#2f5527" font-size="11">最小（必选）</text>

    <rect x="200" y="52" width="70" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="235" y="79" text-anchor="middle" fill="#7a5a10">a = 2</text>
    <text x="235" y="112" text-anchor="middle" fill="#7a5a10" font-size="11">中间：任选</text>

    <rect x="280" y="52" width="70" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="315" y="79" text-anchor="middle" fill="#8c3a36">a_j = 4</text>
    <text x="315" y="112" text-anchor="middle" fill="#8c3a36" font-size="11">最大（必选）</text>
  </g>

  <!-- 中间选择开关 -->
  <g filter="url(#rough2)" font-size="11.5">
    <text x="120" y="150" fill="#555">这组的力量只看两端：</text>
    <rect x="120" y="160" width="230" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="235" y="182" text-anchor="middle" fill="#7a5a10">power = a_j² · a_i = 16 × 1 = 16</text>
  </g>

  <!-- 子集展开 -->
  <g filter="url(#rough2)" font-size="12.5">
    <text x="60" y="228" fill="#333">下标对 (i, j) 的组数 = 中间的幂次：</text>
    <rect x="60" y="240" width="200" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="258" text-anchor="middle" fill="#2f4a66">i 小于 j：2^(j−i−1) 个组</text>
    <text x="160" y="276" text-anchor="middle" fill="#2f4a66" font-size="11">本例 (0,2) → 2^1 = 2 组：{1,4} 与 {1,2,4}</text>
    <rect x="280" y="240" width="200" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="380" y="258" text-anchor="middle" fill="#2f5527">i = j：恰 1 组（单元素）</text>
    <text x="380" y="276" text-anchor="middle" fill="#2f5527" font-size="11">力量 = a_j² · a_j = 立方</text>
  </g>

  <rect x="60" y="302" width="420" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="325" text-anchor="middle" font-size="12.5" fill="#8c3a36" filter="url(#rough2)">同一类组的力量全部相同 → 按 j 分桶，桶内乘 2 的幂计数</text>
</svg>
