<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">栈模型：匹配只可能发生在栈顶</text>

  <!-- 输入流 -->
  <text x="80" y="80" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">待读入的 s：</text>
  <g filter="url(#rough2)">
    <rect x="60" y="92" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="92" y="92" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="124" y="92" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="156" y="92" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="75" y="112">…</text><text x="107" y="112">a</text>
    <text x="139" y="112">b</text><text x="171" y="112">c</text>
  </g>
  <path d="M 171 128 C 200 156 220 178 245 208" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="158" font-size="11" fill="#446688" filter="url(#rough2)">当前字符 c 入栈</text>

  <!-- 纵向栈：自底向上 d,a,a,b -->
  <text x="300" y="80" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">栈（已处理前缀的最终形态）</text>
  <g filter="url(#rough2)">
    <rect x="262" y="308" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="276" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="244" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="212" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="168" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="285" y="329">d</text>
    <text x="285" y="297">a</text>
    <text x="285" y="265">a</text>
    <text x="285" y="233">b</text>
    <text x="285" y="190">c</text>
  </g>
  <text x="330" y="322" font-size="10.5" fill="#888" filter="url(#rough2)">← 栈底</text>
  <text x="330" y="186" font-size="10.5" fill="#d6a040" filter="url(#rough2)">← 栈顶</text>

  <!-- 顶部 m 位括住 -->
  <rect x="248" y="236" width="120" height="92" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="392" y="272" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">栈顶 m 位 =</text>
  <text x="392" y="288" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">"a b c"</text>
  <path d="M 372 280 L 372 280" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- part 对照 -->
  <g filter="url(#rough2)">
    <rect x="420" y="90" width="110" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="475" y="114" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">part = "abc"</text>
  <text x="475" y="132" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">m = 3</text>
  <path d="M 420 122 C 380 150 350 200 330 236" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 相等则弹出 -->
  <path d="M 285 164 L 285 128" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="285" y="118" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">相等 → 弹出这 m 个</text>
  <text x="285" y="100" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">（本例弹出后剩 "daa"）</text>

  <!-- 不变说明 -->
  <g filter="url(#rough2)">
    <rect x="50" y="350" width="470" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
  </g>
  <text x="285" y="368" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">不变量：栈中从不含 part；入栈后若有出现，必以新字符结尾（唯一）→ 只查栈顶。</text>
  <text x="285" y="384" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">弹出后剩余是旧栈的前缀，仍无 part，因此不会级联匹配。</text>
</svg>
