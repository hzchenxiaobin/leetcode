<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：按字母逐个约分，分子只剩 s、i、x</text>
  <path d="M 118 41 Q 360 48 602 41" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="96" y="88" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">分子 p = fixtures（n = 8）</text>

  <!-- 分子 p 的 8 个字符 -->
  <rect x="96" y="96" width="56" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="122" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">f</text>
  <rect x="162" y="96" width="56" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="190" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">i</text>
  <rect x="228" y="96" width="56" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="256" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">x</text>
  <rect x="294" y="96" width="56" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="122" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">t</text>
  <rect x="360" y="96" width="56" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="122" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">u</text>
  <rect x="426" y="96" width="56" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="122" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">r</text>
  <rect x="492" y="96" width="56" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="122" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">e</text>
  <rect x="558" y="96" width="56" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="586" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">s</text>

  <text x="96" y="192" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">分母 q = frute（m = 5）</text>

  <!-- 分母 q 的 5 个字符 -->
  <rect x="96" y="200" width="56" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="226" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">f</text>
  <rect x="162" y="200" width="56" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="226" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">r</text>
  <rect x="228" y="200" width="56" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="226" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">u</text>
  <rect x="294" y="200" width="56" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="226" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">t</text>
  <rect x="360" y="200" width="56" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="226" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">e</text>

  <!-- 约分配对线 -->
  <path d="M 124 140 L 124 196" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <path d="M 322 140 L 322 196" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <path d="M 388 140 L 256 196" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <path d="M 454 140 L 190 196" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <path d="M 520 140 L 388 196" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>

  <!-- 图例 -->
  <rect x="96" y="254" width="20" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="124" y="267" font-size="12" fill="#3c5e2e" filter="url(#rough2)">粗框 = 留下来（i、x、s，可重排成 six）</text>
  <rect x="418" y="254" width="20" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="446" y="267" font-size="12" fill="#a14340" filter="url(#rough2)">虚线 = 与分母同名字母约掉</text>

  <rect x="52" y="288" width="616" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">判据：每个字母「分子出现次数 − 分母出现次数」必须正好等于目标向量 want</text>
  <text x="360" y="332" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">want[s] = want[i] = want[x] = 1，其余 23 个字母都为 0</text>

  <rect x="52" y="356" width="616" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="379" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">只要某个字母的差为负（分母比分子多），分母就永远消不干净 → 直接 NO</text>
  <text x="360" y="400" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">差为正却不属于 {s,i,x}，分子就会多出无用变量 → 同样 NO：多不得也少不得</text>
</svg>
