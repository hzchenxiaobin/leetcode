<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 前缀和 → 枚举起点 → 二分右界</text>

  <!-- 四步 -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="112" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <rect x="164" y="52" width="112" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <rect x="288" y="52" width="112" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <rect x="412" y="52" width="112" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="96" y="76" font-weight="bold">① 排序</text>
    <text x="96" y="96" font-size="11">按左端点升序</text>
    <text x="96" y="112" font-size="11">右端随不重叠</text>
    <text x="96" y="126" font-size="11">性质同步升序</text>
    <text x="220" y="76" font-weight="bold">② 前缀和</text>
    <text x="220" y="96" font-size="11">pre[i+1] = pre[i]</text>
    <text x="220" y="112" font-size="11">+ 第 i 段长度</text>
    <text x="220" y="126" font-size="11">O(1) 取段和</text>
    <text x="344" y="76" font-weight="bold">③ 枚举起点</text>
    <text x="344" y="96" font-size="11">L = tiles[i][0]</text>
    <text x="344" y="112" font-size="11">R = L+len−1</text>
    <text x="344" y="126" font-size="11">T 个候选位置</text>
    <text x="468" y="76" font-weight="bold">④ 二分右界</text>
    <text x="468" y="96" font-size="11">最大 j 使 l_j ≤ R</text>
    <text x="468" y="112" font-size="11">i..j−1 整段 +</text>
    <text x="468" y="126" font-size="11">第 j 段 min 截断</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 152 90 L 160 90" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 276 90 L 284 90" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 400 90 L 408 90" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- 覆盖公式大框 -->
  <rect x="50" y="150" width="460" height="76" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">每个候选位置的覆盖数：</text>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <text x="280" y="198">j = i：cover = min(R, r_i) − L + 1</text>
    <text x="280" y="218">j &gt; i：cover = pre[j] − pre[i] + min(R, r_j) − l_j + 1</text>
  </g>

  <!-- 两态说明 -->
  <g filter="url(#rough2)">
    <rect x="50" y="244" width="224" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <rect x="286" y="244" width="224" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="162" y="266">第 j 段整段在毯内（r_j ≤ R）</text>
    <text x="162" y="284">min(R, r_j) = r_j → 得整段长</text>
    <text x="162" y="298" font-size="11" fill="#2d5a22">例：[12,18] 全在 [10,19] 内</text>
    <text x="398" y="266">第 j 段部分在毯内（r_j &gt; R）</text>
    <text x="398" y="284">min(R, r_j) = R → 截断在毯右端</text>
    <text x="398" y="298" font-size="11" fill="#7a5c1e">例：[20,25] 在 [12,21] 内只算 2 块</text>
  </g>

  <text x="280" y="334" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">复杂度：O(T log T)（排序主导；双指针可省二分但排序不变）</text>
  <text x="280" y="352" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⚠ 写成 pre[j+1] − pre[i] 会把第 j 段毯外部分也计入（经典 WA）</text>
</svg>
