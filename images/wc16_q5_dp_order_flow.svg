<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：按区间长度递增填表，再把二维压成一维</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">长度 L 的区间只依赖长度 L−1 的子区间，子问题顺序天然确定</text>

  <!-- 填表顺序网格 -->
  <text x="82" y="78" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i \ j</text>
  <g font-size="10" text-anchor="middle" fill="#888">
    <text x="118" y="78" filter="url(#rough2)">0</text>
    <text x="176" y="78" filter="url(#rough2)">1</text>
    <text x="234" y="78" filter="url(#rough2)">2</text>
    <text x="292" y="78" filter="url(#rough2)">3</text>
  </g>
  <g font-size="10" text-anchor="end" fill="#888">
    <text x="82" y="108" filter="url(#rough2)">0</text>
    <text x="82" y="148" filter="url(#rough2)">1</text>
    <text x="82" y="188" filter="url(#rough2)">2</text>
    <text x="82" y="228" filter="url(#rough2)">3</text>
  </g>

  <!-- 长度 1 -->
  <g font-size="12" text-anchor="middle">
    <rect x="92" y="86" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="118" y="108" fill="#3a4a66" filter="url(#rough2)">1</text>
    <rect x="150" y="126" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="176" y="148" fill="#3a4a66" filter="url(#rough2)">2</text>
    <rect x="208" y="166" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="234" y="188" fill="#3a4a66" filter="url(#rough2)">3</text>
    <rect x="266" y="206" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="292" y="228" fill="#3a4a66" filter="url(#rough2)">4</text>

    <!-- 长度 2 -->
    <rect x="150" y="86" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="176" y="108" fill="#3a5a30" filter="url(#rough2)">5</text>
    <rect x="208" y="126" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="234" y="148" fill="#3a5a30" filter="url(#rough2)">6</text>
    <rect x="266" y="166" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="292" y="188" fill="#3a5a30" filter="url(#rough2)">7</text>

    <!-- 长度 3 -->
    <rect x="208" y="86" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="234" y="108" fill="#8a6a20" filter="url(#rough2)">8</text>
    <rect x="266" y="126" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="292" y="148" fill="#8a6a20" filter="url(#rough2)">9</text>

    <!-- 长度 4 -->
    <rect x="266" y="86" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="292" y="108" fill="#8a3a36" filter="url(#rough2)">10</text>

    <!-- 下三角 -->
    <g fill="#f2f2f2" stroke="#ddd" stroke-width="1">
      <rect x="92" y="126" width="52" height="34" rx="4" filter="url(#rough2)"/>
      <rect x="92" y="166" width="52" height="34" rx="4" filter="url(#rough2)"/>
      <rect x="92" y="206" width="52" height="34" rx="4" filter="url(#rough2)"/>
      <rect x="150" y="166" width="52" height="34" rx="4" filter="url(#rough2)"/>
      <rect x="150" y="206" width="52" height="34" rx="4" filter="url(#rough2)"/>
      <rect x="208" y="206" width="52" height="34" rx="4" filter="url(#rough2)"/>
    </g>
  </g>
  <g font-size="11" text-anchor="middle" fill="#bbb">
    <text x="118" y="148" filter="url(#rough2)">·</text>
    <text x="118" y="188" filter="url(#rough2)">·</text>
    <text x="118" y="228" filter="url(#rough2)">·</text>
    <text x="176" y="188" filter="url(#rough2)">·</text>
    <text x="176" y="228" filter="url(#rough2)">·</text>
    <text x="234" y="228" filter="url(#rough2)">·</text>
  </g>

  <text x="92" y="262" font-size="10" fill="#888" filter="url(#rough2)">格子里的数字是填写顺序：同色 = 同一区间长度</text>
  <text x="92" y="278" font-size="10" fill="#888" filter="url(#rough2)">先对角线（L=1），再一条条往右上推</text>

  <!-- 右侧流程 -->
  <rect x="344" y="80" width="184" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="102" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 枚举长度 L = 2 … n</text>
  <text x="360" y="120" font-size="10" fill="#666" filter="url(#rough2)">（L = 1 是基线 dp[i][i]）</text>

  <path d="M 436 136 L 436 144" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="344" y="146" width="184" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="168" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">② 枚举起点 i = 0 … n−L</text>
  <text x="360" y="186" font-size="10" fill="#666" filter="url(#rough2)">令 j = i + L − 1</text>

  <path d="M 436 202 L 436 210" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="344" y="212" width="184" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="234" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">③ 用两条子区间转移</text>
  <text x="360" y="252" font-size="10" fill="#666" filter="url(#rough2)">取 max(左端, 右端)</text>

  <!-- 一维滚动 -->
  <rect x="40" y="290" width="480" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="312" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">一维滚动：只保留一行 f[0..n−1]</text>
  <text x="58" y="332" font-size="10" fill="#555" filter="url(#rough2)">固定 i 倒序、j 从 i+1 正序递增：旧 f[j] 恰为 dp[i+1][j]，</text>
  <text x="58" y="348" font-size="10" fill="#555" filter="url(#rough2)">f[j−1] 刚被更新成 dp[i][j−1]，于是可原地覆盖；</text>
  <text x="58" y="364" font-size="10" fill="#b85450" filter="url(#rough2)">f[j] = max(nums[i] − f[j], nums[j] − f[j−1])，空间 O(n)</text>
</svg>
