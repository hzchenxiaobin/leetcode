<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次升序扫描，没有回溯</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">cnt 记录剩余个数，tail 记录以每个值结尾的「长链」条数</text>

  <g filter="url(#rough2)">
    <rect x="100" y="60" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="280" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66">1. 统计 cnt[v]（每个值出现次数），tail 全置 0</text>
    <text x="280" y="96" text-anchor="middle" font-size="9" fill="#66788a">数组已非递减 ⇒ 天然按值升序处理</text>
  </g>

  <path d="M 280 104 L 280 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="118" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="280" y="138" text-anchor="middle" font-size="10.5" fill="#3a4a66">2. 取当前值 x（cnt[x] = 0 直接跳过）</text>
    <text x="280" y="154" text-anchor="middle" font-size="9" fill="#66788a">只要 cnt[x] &gt; 0 就反复执行 ①②③</text>
  </g>

  <path d="M 280 162 L 280 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="176" width="480" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="56" y="198" font-size="10.5" fill="#3a5a30" font-weight="bold">① 若 tail[x−1] &gt; 0：延长这条链，回到 ①</text>
    <text x="56" y="218" font-size="9.5" fill="#4a5a44">tail[x−1]−− ; tail[x]++ ; cnt[x]−−</text>
  </g>

  <text x="252" y="248" font-size="9.5" fill="#b85450" filter="url(#rough2)">否则 ↓</text>
  <path d="M 280 230 L 280 252" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="256" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="56" y="278" font-size="10.5" fill="#8a6a20" font-weight="bold">② 否则若 cnt[x+1] &gt; 0 且 cnt[x+2] &gt; 0：新建一条链</text>
    <text x="56" y="298" font-size="9.5" fill="#6a5a30">cnt[x]−− ; cnt[x+1]−− ; cnt[x+2]−− ; tail[x+2]++</text>
    <text x="56" y="312" font-size="9" fill="#8a7a50">新链已经是长度 3，之后再延长也不会变短</text>
  </g>

  <text x="252" y="334" font-size="9.5" fill="#b85450" filter="url(#rough2)">否则 ↓</text>
  <path d="M 280 316 L 280 338" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="342" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
    <text x="56" y="362" font-size="10.5" fill="#8a3a36" font-weight="bold">③ 否则：x 接不上、又凑不出 x+1 与 x+2 → return false</text>
    <text x="56" y="378" font-size="9" fill="#6a4a46">这是唯一的失败出口，且失败时不可能再靠「换个分法」救回来</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="100" y="404" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="280" y="424" text-anchor="middle" font-size="10.5" fill="#3a5a30">所有值处理完仍未失败 → return true</text>
    <text x="280" y="440" text-anchor="middle" font-size="9" fill="#4a5a44">O(n + U log U)，U 为不同值个数</text>
  </g>

  <text x="280" y="468" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每个值处理完回到 ①；cnt[x] 归零后换下一个值</text>
</svg>
