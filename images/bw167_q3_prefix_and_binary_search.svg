<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="380" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">前缀和：区间和 = 两次下标前缀和相减</text>
  <text x="310" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">times = [1, 5]   pref = [0, 98, 197]</text>
  <rect x="120" y="92" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="120" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">time = 1</text>
  <rect x="250" y="92" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="120" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">time = 5</text>
  <text x="310" y="156" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pref[i] = 前 i 场考试的总分</text>
  <rect x="90" y="174" width="120" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="192" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">pref[0]</text>
  <text x="150" y="208" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="240" y="174" width="120" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">pref[1]</text>
  <text x="300" y="208" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">98</text>
  <rect x="390" y="174" width="120" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="192" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">pref[2]</text>
  <text x="450" y="208" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">197</text>
  <rect x="90" y="232" width="490" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="108" y="256" text-anchor="start" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">totalScore(1, 5)：l = lower_bound(times, 1) = 0，r = upper_bound(times, 5) = 2</text>
  <text x="108" y="272" text-anchor="start" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">答案 = pref[2] - pref[0] = 197 - 0 = 197</text>
  <rect x="90" y="290" width="490" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="108" y="314" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">闭区间 → 左端点用 lower_bound（&gt;=），右端点用 upper_bound（&gt;）</text>
  <text x="108" y="336" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">两者都是 first index，所以区间恰为 [l, r)，空区间时 l = r → 0</text>
</svg>
