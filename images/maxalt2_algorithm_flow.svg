<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：平方 → 降序排序 → 前 ⌈n/2⌉ 大进 ＋ 组</text>
  <path d="M 130 42 Q 320 52 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="44" y="72" width="306" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="197" y="103" text-anchor="middle" font-size="13.5" fill="#2b4a6e">① 全部平方：b[i] ＝ x[i]²（符号消失）</text>
  <path d="M 197 124 L 197 144" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="44" y="150" width="306" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="197" y="181" text-anchor="middle" font-size="13.5" fill="#2b4a6e">② 降序排序：b[0] ≥ b[1] ≥ … ≥ b[n−1]</text>
  <path d="M 197 202 L 197 222" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="44" y="228" width="149" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="201" y="228" width="149" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="118" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22">③ 前 p ＝ ⌈n/2⌉ 个</text>
  <text x="118" y="276" text-anchor="middle" font-size="12" fill="#2e5e22">→ ＋组（偶数位）</text>
  <text x="275" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8e3a34">其余 n − p 个</text>
  <text x="275" y="276" text-anchor="middle" font-size="12" fill="#8e3a34">→ －组（奇数位）</text>
  <path d="M 197 296 L 197 316" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="44" y="322" width="306" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="197" y="353" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">④ ans ＝ Σ(＋组) − Σ(－组)</text>

  <g filter="url(#sk)">
    <rect x="384" y="72" width="216" height="160" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6,4"/>
  </g>
  <text x="492" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">为什么对？（交换论证）</text>
  <g font-size="11.5" fill="#7a5415" text-anchor="middle">
    <text x="492" y="122">若 ＋ 组混进较小者 b，</text>
    <text x="492" y="142">而更大者 a 留在 － 组，</text>
    <text x="492" y="162">交换二者，得分变化</text>
    <text x="492" y="184" font-weight="bold">2 · (a − b) ≥ 0</text>
    <text x="492" y="212">⇒ 最优解中 ＋ 组</text>
    <text x="492" y="228">必为平方前 p 大</text>
  </g>

  <g filter="url(#sk)">
    <rect x="384" y="252" width="216" height="122" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="492" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">复杂度</text>
  <g font-size="11.5" fill="#2e5e22" text-anchor="middle">
    <text x="492" y="302">排序：O(n log n)</text>
    <text x="492" y="324">nth_element：平均 O(n)</text>
    <text x="492" y="346">额外空间：O(n) 存平方</text>
  </g>
</svg>
