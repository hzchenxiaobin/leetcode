<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">陷阱：便宜地"按值取前几个"会被同一列的高值堵死</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一列最多放一个车，堆在列 0 的候选彼此冲突，一个都配不上</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="120" y="72" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="120" y="114" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="120" y="156" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="120" y="198" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="120" y="240" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="222" y="72" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="222" y="114" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="222" y="156" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="155" y="96" fill="#8a3a36">200</text>
    <text x="155" y="138" fill="#8a3a36">190</text>
    <text x="155" y="180" fill="#8a3a36">180</text>
    <text x="155" y="222" fill="#8a3a36">170</text>
    <text x="155" y="264" fill="#8a3a36">160</text>
    <text x="257" y="96" fill="#3a4a66">100</text>
    <text x="257" y="138" fill="#3a4a66">3</text>
    <text x="257" y="180" fill="#3a4a66">2</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="155" y="294">列 0（全部互相冲突）</text>
    <text x="257" y="294">列 1</text>
  </g>

  <rect x="330" y="72" width="196" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="344" y="94" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">若按值取前 4 个</text>
  <text x="344" y="116" font-size="10.5" fill="#555" filter="url(#rough2)">200, 190, 180, 170</text>
  <text x="344" y="136" font-size="10.5" fill="#b85450" filter="url(#rough2)">全在列 0 → 两两冲突</text>
  <text x="344" y="158" font-size="10.5" fill="#b85450" filter="url(#rough2)">一个合法组合都配不出来</text>
  <text x="344" y="180" font-size="10" fill="#888" filter="url(#rough2)">但真正的最优是 200 + 100 + 2</text>

  <rect x="44" y="312" width="472" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="58" y="334" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">正确做法：按"列"聚合，每列只贡献它自己的前几大</text>
  <text x="58" y="354" font-size="10.5" fill="#555" filter="url(#rough2)">先按列首值挑出前 5 列，再在这 5 列各自的前 3 大里两两配对 ——</text>
  <text x="58" y="370" font-size="10.5" fill="#555" filter="url(#rough2)">同列的高值只会各出现一次，不会再挤掉别的列的名额</text>

  <text x="280" y="394" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">红色格子：同一列的高值候选；蓝色格子：别的列</text>
</svg>
