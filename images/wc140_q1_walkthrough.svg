<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold"
        filter="url(#rough2)">示例演算：逐窗口走查</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888"
        filter="url(#rough2)">text = "we will we will rock you"，first = "we"，second = "will"，n = 6</text>

  <rect x="40" y="62" width="480" height="26" rx="5" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#3a4a66" font-weight="bold">
    <text x="56" y="80" filter="url(#rough2)">i</text>
    <text x="96" y="80" filter="url(#rough2)">w[i] | w[i+1] | w[i+2]</text>
    <text x="352" y="80" filter="url(#rough2)">命中</text>
    <text x="398" y="80" filter="url(#rough2)">ans</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="90" width="480" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="40" y="118" width="480" height="26" rx="4" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/>
    <rect x="40" y="146" width="480" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="40" y="174" width="480" height="26" rx="4" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/>
  </g>

  <g font-size="10.5" text-anchor="start">
    <text x="60" y="108" fill="#555" filter="url(#rough2)">0</text>
    <text x="96" y="108" fill="#3a5a30" filter="url(#rough2)">we | will | we</text>
    <text x="352" y="108" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="398" y="108" fill="#3a5a30" filter="url(#rough2)">["we"]</text>

    <text x="60" y="136" fill="#555" filter="url(#rough2)">1</text>
    <text x="96" y="136" fill="#777" filter="url(#rough2)">will | we | will</text>
    <text x="352" y="136" fill="#b85450" filter="url(#rough2)">✗</text>
    <text x="398" y="136" fill="#999" filter="url(#rough2)">["we"]</text>

    <text x="60" y="164" fill="#555" filter="url(#rough2)">2</text>
    <text x="96" y="164" fill="#3a5a30" filter="url(#rough2)">we | will | rock</text>
    <text x="352" y="164" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="398" y="164" fill="#3a5a30" filter="url(#rough2)">["we","rock"]</text>

    <text x="60" y="192" fill="#555" filter="url(#rough2)">3</text>
    <text x="96" y="192" fill="#777" filter="url(#rough2)">will | rock | you</text>
    <text x="352" y="192" fill="#b85450" filter="url(#rough2)">✗</text>
    <text x="398" y="192" fill="#999" filter="url(#rough2)">["we","rock"]</text>
  </g>

  <path d="M 280 202 L 280 220" stroke="#b85450" stroke-width="1.5" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="130" y="222" width="300" height="36" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="245" text-anchor="middle" font-size="11" fill="#8a6a20"
        filter="url(#rough2)">返回 ["we", "rock"]</text>

  <text x="280" y="284" text-anchor="middle" font-size="10.5" fill="#555"
        filter="url(#rough2)">i 只取到 n−3 = 3：再往后凑不出第三个词，循环自动停止</text>
  <text x="280" y="306" text-anchor="middle" font-size="10.5" fill="#999"
        filter="url(#rough2)">i=0 的第三词 "we" 又是 i=2 的首词 —— 重叠窗口各自独立计数</text>
</svg>
