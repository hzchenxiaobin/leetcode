<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa" filter="url(#rough2)"/>
  <text x="310" y="36" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">关键连接 = 删掉后会让图断开的边（桥）</text>

  <!-- 左侧小图：三角形环 + 一条尾巴 -->
  <line x1="110" y1="105" x2="55" y2="190" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="55" y1="190" x2="175" y2="195" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="175" y1="195" x2="110" y2="105" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="55" y1="190" x2="55" y2="285" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>

  <circle cx="110" cy="105" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="55" cy="190" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="175" cy="195" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="55" cy="285" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="111" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="55" y="196" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="175" y="201" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="55" y="291" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="100" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">环 0-1-2</text>
  <text x="90" y="250" font-size="12" fill="#b85450" filter="url(#rough2)">关键连接</text>
  <text x="140" y="322" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">环上每条边都能绕行，只有 (1,3) 不行</text>

  <!-- 右侧两个结论框 -->
  <rect x="300" y="78" width="292" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="106" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">删掉环上的边 (1,2)</text>
  <text x="446" y="130" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">0,1,2,3 仍互相可达 ✓</text>
  <text x="446" y="153" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⇒ 不是关键连接</text>

  <rect x="300" y="196" width="292" height="94" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="224" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">删掉 (1,3)</text>
  <text x="446" y="248" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">节点 3 与其余节点断开 ✗</text>
  <text x="446" y="271" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⇒ (1,3) 是关键连接</text>

  <path d="M240,160 L292,140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M240,250 L292,244" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
