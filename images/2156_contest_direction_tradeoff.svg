<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="460" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：位权方向决定「乘」还是「除」</text>
  <path d="M 170 40 Q 340 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- hash definition -->
  <g filter="url(#sk)">
    <rect x="55" y="50" width="570" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="340" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">H(i) = val(s[i])·p⁰ + val(s[i+1])·p¹ + ⋯ + val(s[i+k−1])·pᵏ⁻¹  (mod m)</text>
  <text x="340" y="87" text-anchor="middle" font-size="10.5" fill="#555">最左字符坐在最低位 p⁰ —— 位权方向决定了滑窗的「方向经济学」</text>

  <!-- left panel: slide right -->
  <g filter="url(#sk)">
    <rect x="25" y="106" width="310" height="240" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <text x="180" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">窗口右滑 i → i+1（位权降一位）</text>
  <text x="180" y="144" text-anchor="middle" font-size="10.5" fill="#8a4a48">f 脱落 p⁰；b、x 各降位（÷p）；z 顶入 p²</text>
  <g filter="url(#sk)">
    <rect x="62" y="154" width="40" height="28" fill="#fff" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="106" y="154" width="40" height="28" fill="#fff" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="150" y="154" width="40" height="28" fill="#fff" stroke="#b85450" stroke-width="1.4" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333">
    <text x="82" y="173">f</text>
    <text x="126" y="173">b</text>
    <text x="170" y="173">x</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#999">
    <text x="82" y="196">p⁰</text>
    <text x="126" y="196">p¹</text>
    <text x="170" y="196">p²</text>
  </g>
  <path d="M 180 204 L 180 226" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="62" y="232" width="40" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" stroke-dasharray="4,3"/>
    <rect x="106" y="232" width="40" height="28" fill="#fff" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="150" y="232" width="40" height="28" fill="#fff" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="194" y="232" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333">
    <text x="82" y="251" fill="#bbb" text-decoration="line-through">f</text>
    <text x="126" y="251">b</text>
    <text x="170" y="251">x</text>
    <text x="214" y="251" fill="#a07020" font-weight="bold">z</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#999">
    <text x="82" y="274" fill="#bbb">脱落</text>
    <text x="126" y="274">p⁰</text>
    <text x="170" y="274">p¹</text>
    <text x="214" y="274" fill="#a07020">p²</text>
  </g>
  <g filter="url(#sk)">
    <rect x="42" y="286" width="276" height="38" fill="#fff" stroke="#b85450" stroke-width="1.6" rx="6"/>
  </g>
  <text x="180" y="303" text-anchor="middle" font-size="10.5" fill="#333">H(i+1) = (H(i) − val(s[i]))·p⁻¹ + val(s[i+k])·pᵏ⁻¹</text>
  <text x="180" y="319" text-anchor="middle" font-size="9.5" fill="#888">整体降位 = 除以 p</text>
  <text x="180" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✗ 出现模逆元 p⁻¹：仅 gcd(p, m)=1 才存在</text>

  <!-- right panel: slide left -->
  <g filter="url(#sk)">
    <rect x="345" y="106" width="310" height="240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="500" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">窗口左移 i+1 → i（位权升一位）</text>
  <text x="500" y="144" text-anchor="middle" font-size="10.5" fill="#3e6a34">f 压入 p⁰；b、x 各升位（×p）；z 溢出到 p³ 被减</text>
  <g filter="url(#sk)">
    <rect x="382" y="154" width="40" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="426" y="154" width="40" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="470" y="154" width="40" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333">
    <text x="402" y="173">b</text>
    <text x="446" y="173">x</text>
    <text x="490" y="173">z</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#999">
    <text x="402" y="196">p⁰</text>
    <text x="446" y="196">p¹</text>
    <text x="490" y="196">p²</text>
  </g>
  <path d="M 500 204 L 500 226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="382" y="232" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="426" y="232" width="40" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="470" y="232" width="40" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="514" y="232" width="40" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" stroke-dasharray="4,3"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333">
    <text x="402" y="251" fill="#a07020" font-weight="bold">f</text>
    <text x="446" y="251">b</text>
    <text x="490" y="251">x</text>
    <text x="534" y="251" fill="#bbb" text-decoration="line-through">z</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#999">
    <text x="402" y="274" fill="#a07020">p⁰</text>
    <text x="446" y="274">p¹</text>
    <text x="490" y="274">p²</text>
    <text x="534" y="274" fill="#bbb">p³ 溢出</text>
  </g>
  <g filter="url(#sk)">
    <rect x="362" y="286" width="276" height="38" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
  </g>
  <text x="500" y="303" text-anchor="middle" font-size="10.5" fill="#333">H(i) = val(s[i]) + p·H(i+1) − val(s[i+k])·pᵏ</text>
  <text x="500" y="319" text-anchor="middle" font-size="9.5" fill="#888">整体升位 = 乘以 p，越界项单独减掉</text>
  <text x="500" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">✓ 只有乘、加、减 —— 对任意 p, m 普适</text>

  <!-- bottom callout -->
  <g filter="url(#sk)">
    <rect x="60" y="362" width="560" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
  </g>
  <text x="340" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">结论：沿位权升高方向滚动（右 → 左），预计算 pk = pᵏ mod m，每个窗口 O(1) 递推</text>
  <text x="340" y="401" text-anchor="middle" font-size="11" fill="#555">逆序扫描附带红利：越靠后命中的 i 越小，「最后赋值」恰为最左下标</text>
  <text x="340" y="436" text-anchor="middle" font-size="10.5" fill="#888">反例数据：p = 2, m = 4 时 gcd(p, m) = 2，p⁻¹ 不存在 —— 正向滑窗在此直接失效</text>
</svg>
