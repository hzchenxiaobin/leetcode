<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">官方示例回放：tag 与 base 的全程演化</text>

  <!-- 表格 -->
  <g filter="url(#rough2)">
    <rect x="40" y="48" width="480" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="8"/>
    <line x1="40" y1="80" x2="520" y2="80" stroke="#bbb" stroke-width="1.3"/>
    <line x1="40" y1="107" x2="520" y2="107" stroke="#ddd" stroke-width="1"/>
    <line x1="40" y1="134" x2="520" y2="134" stroke="#ddd" stroke-width="1"/>
    <line x1="40" y1="161" x2="520" y2="161" stroke="#ddd" stroke-width="1"/>
    <line x1="40" y1="188" x2="520" y2="188" stroke="#ddd" stroke-width="1"/>
    <line x1="40" y1="215" x2="520" y2="215" stroke="#ddd" stroke-width="1"/>
    <line x1="40" y1="242" x2="520" y2="242" stroke="#ddd" stroke-width="1"/>
    <line x1="40" y1="269" x2="520" y2="269" stroke="#ddd" stroke-width="1"/>
    <line x1="40" y1="296" x2="520" y2="296" stroke="#ddd" stroke-width="1"/>
    <line x1="150" y1="48" x2="150" y2="348" stroke="#ddd" stroke-width="1"/>
    <line x1="290" y1="48" x2="290" y2="348" stroke="#ddd" stroke-width="1"/>
    <line x1="400" y1="48" x2="400" y2="348" stroke="#ddd" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" font-size="12.5" fill="#555" text-anchor="middle">
    <text x="95" y="68" font-weight="bold" fill="#333">操作</text>
    <text x="220" y="68" font-weight="bold" fill="#333">tag (add, mul)</text>
    <text x="345" y="68" font-weight="bold" fill="#333">数组 base</text>
    <text x="460" y="68" font-weight="bold" fill="#333">真实序列</text>

    <text x="95" y="96">append(2)</text><text x="220" y="96">(0, 1)</text><text x="345" y="96">[2]</text><text x="460" y="96">[2]</text>
    <text x="95" y="123">addAll(3)</text><text x="220" y="123">(3, 1)</text><text x="345" y="123">[2]</text><text x="460" y="123">[5]</text>
    <text x="95" y="150">append(7)</text><text x="220" y="150">(3, 1)</text><text x="345" y="150">[2, 4]</text><text x="460" y="150">[5, 7]</text>
    <text x="95" y="177">multAll(2)</text><text x="220" y="177">(6, 2)</text><text x="345" y="177">[2, 4]</text><text x="460" y="177">[10, 14]</text>
    <text x="95" y="204" fill="#b85450" font-weight="bold">getIndex(0)</text><text x="220" y="204">(6, 2)</text><text x="345" y="204">[2, 4]</text><text x="460" y="204" fill="#b85450">→ 10 ✓</text>
    <text x="95" y="231">addAll(3)</text><text x="220" y="231">(9, 2)</text><text x="345" y="231">[2, 4]</text><text x="460" y="231">[13, 17]</text>
    <text x="95" y="258">append(10)</text><text x="220" y="258">(9, 2)</text><text x="345" y="258">[2, 4, 1/2]</text><text x="460" y="258">[13, 17, 10]</text>
    <text x="95" y="285">multAll(2)</text><text x="220" y="285">(18, 4)</text><text x="345" y="285">[2, 4, 1/2]</text><text x="460" y="285">[26, 34, 20]</text>
    <text x="95" y="312" fill="#b85450" font-weight="bold">getIndex(0/1/2)</text><text x="220" y="312">(18, 4)</text><text x="345" y="312">[2, 4, 1/2]</text><text x="460" y="312" fill="#b85450">→ 26/34/20 ✓</text>
  </g>

  <!-- 重点标注 -->
  <g filter="url(#rough2)">
    <rect x="200" y="246" width="110" height="20" fill="none" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="300" y="246" width="96" height="20" fill="none" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">append(10) 折算：base = (10−9) × 2⁻¹ = ½（模 p 意义 = 500000004）</text>
  <text x="280" y="388" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">getIndex 时正变换：½×4+18 = 20 ✓ —— 折回过去、再放回现在，闭环成立</text>
</svg>
