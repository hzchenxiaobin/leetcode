<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arBl" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fdfcf7"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察一：值域只有 1~100 —— 逐值建出现次数前缀和</text>
  <path d="M 200 40 Q 360 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums row -->
  <text x="78" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">nums</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="100" y="56" width="46" height="34" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1.4"/></g><text x="123" y="78" fill="#333">4</text>
    <g filter="url(#sk)"><rect x="146" y="56" width="46" height="34" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1.4"/></g><text x="169" y="78" fill="#333">5</text>
    <g filter="url(#sk)"><rect x="192" y="56" width="46" height="34" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1.4"/></g><text x="215" y="78" fill="#333">2</text>
    <g filter="url(#sk)"><rect x="238" y="56" width="46" height="34" rx="4" fill="#fff8e6" stroke="#c98a2b" stroke-width="1.8"/></g><text x="261" y="78" fill="#7a5415">2</text>
    <g filter="url(#sk)"><rect x="284" y="56" width="46" height="34" rx="4" fill="#fff8e6" stroke="#c98a2b" stroke-width="1.8"/></g><text x="307" y="78" fill="#7a5415">7</text>
    <g filter="url(#sk)"><rect x="330" y="56" width="46" height="34" rx="4" fill="#fff8e6" stroke="#c98a2b" stroke-width="1.8"/></g><text x="353" y="78" fill="#7a5415">10</text>
  </g>
  <g font-size="10" fill="#888" font-family="monospace" text-anchor="middle">
    <text x="123" y="106">0</text><text x="169" y="106">1</text><text x="215" y="106">2</text>
    <text x="261" y="106">3</text><text x="307" y="106">4</text><text x="353" y="106">5</text>
  </g>
  <g filter="url(#sk)">
    <line x1="236" y1="48" x2="236" y2="96" stroke="#b85450" stroke-width="2.2"/>
    <line x1="378" y1="48" x2="378" y2="96" stroke="#4a8edb" stroke-width="2.2"/>
  </g>
  <text x="222" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">l = 3</text>
  <text x="392" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">r = 5</text>

  <text x="60" y="128" font-size="10.5" fill="#555">对每个值 v 建一行前缀计数：pre[v][i] = 前 i 个元素中 v 的个数（下表只画出现过的 5 个值）</text>

  <!-- prefix table -->
  <text x="180" y="140" font-size="9.5" fill="#888">i（前 i 个元素）→</text>
  <text x="292" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a">l</text>
  <text x="412" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b6e9e">r+1</text>

  <g filter="url(#sk)">
    <rect x="96" y="142" width="56" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="124" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" font-family="monospace">v</text>
  <g font-size="11" font-weight="bold" fill="#2b6e9e" font-family="monospace" text-anchor="middle">
    <g filter="url(#sk)"><rect x="152" y="142" width="40" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g><text x="172" y="158">0</text>
    <g filter="url(#sk)"><rect x="192" y="142" width="40" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g><text x="212" y="158">1</text>
    <g filter="url(#sk)"><rect x="232" y="142" width="40" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g><text x="252" y="158">2</text>
    <g filter="url(#sk)"><rect x="272" y="142" width="40" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g><text x="292" y="158">3</text>
    <g filter="url(#sk)"><rect x="312" y="142" width="40" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g><text x="332" y="158">4</text>
    <g filter="url(#sk)"><rect x="352" y="142" width="40" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g><text x="372" y="158">5</text>
    <g filter="url(#sk)"><rect x="392" y="142" width="40" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g><text x="412" y="158">6</text>
  </g>

  <!-- value rows -->
  <g font-size="11" font-family="monospace" text-anchor="middle">
    <!-- v=2: 0 0 1 2 2 2 2 ; increments at i=3,4 -->
    <text x="124" y="182" font-weight="bold" fill="#444">2</text>
    <g filter="url(#sk)"><rect x="152" y="166" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="172" y="182" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="192" y="166" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="212" y="182" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="232" y="166" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="252" y="182" fill="#333">1</text>
    <g filter="url(#sk)"><rect x="272" y="166" width="40" height="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g><text x="292" y="182" fill="#2e6e2e" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="312" y="166" width="40" height="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g><text x="332" y="182" fill="#2e6e2e" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="352" y="166" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="372" y="182" fill="#333">2</text>
    <g filter="url(#sk)"><rect x="392" y="166" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="412" y="182" fill="#333">2</text>
    <!-- v=4: 0 1 1 1 1 1 1 ; increment at i=1 -->
    <text x="124" y="206" font-weight="bold" fill="#444">4</text>
    <g filter="url(#sk)"><rect x="152" y="190" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="172" y="206" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="192" y="190" width="40" height="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g><text x="212" y="206" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="232" y="190" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="252" y="206" fill="#333">1</text>
    <g filter="url(#sk)"><rect x="272" y="190" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="292" y="206" fill="#333">1</text>
    <g filter="url(#sk)"><rect x="312" y="190" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="332" y="206" fill="#333">1</text>
    <g filter="url(#sk)"><rect x="352" y="190" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="372" y="206" fill="#333">1</text>
    <g filter="url(#sk)"><rect x="392" y="190" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="412" y="206" fill="#333">1</text>
    <!-- v=5: 0 0 1 1 1 1 1 ; increment at i=2 -->
    <text x="124" y="230" font-weight="bold" fill="#444">5</text>
    <g filter="url(#sk)"><rect x="152" y="214" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="172" y="230" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="192" y="214" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="212" y="230" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="232" y="214" width="40" height="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g><text x="252" y="230" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="272" y="214" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="292" y="230" fill="#333">1</text>
    <g filter="url(#sk)"><rect x="312" y="214" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="332" y="230" fill="#333">1</text>
    <g filter="url(#sk)"><rect x="352" y="214" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="372" y="230" fill="#333">1</text>
    <g filter="url(#sk)"><rect x="392" y="214" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="412" y="230" fill="#333">1</text>
    <!-- v=7: 0 0 0 0 1 1 1 ; increment at i=5 -->
    <text x="124" y="254" font-weight="bold" fill="#444">7</text>
    <g filter="url(#sk)"><rect x="152" y="238" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="172" y="254" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="192" y="238" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="212" y="254" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="232" y="238" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="252" y="254" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="272" y="238" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="292" y="254" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="312" y="238" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="332" y="254" fill="#333">1</text>
    <g filter="url(#sk)"><rect x="352" y="238" width="40" height="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g><text x="372" y="254" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="392" y="238" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="412" y="254" fill="#333">1</text>
    <!-- v=10: 0 0 0 0 0 1 1 ; increment at i=6 -->
    <text x="124" y="278" font-weight="bold" fill="#444">10</text>
    <g filter="url(#sk)"><rect x="152" y="262" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="172" y="278" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="192" y="262" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="212" y="278" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="232" y="262" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="252" y="278" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="272" y="262" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="292" y="278" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="312" y="262" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="332" y="278" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="352" y="262" width="40" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g><text x="372" y="278" fill="#333">1</text>
    <g filter="url(#sk)"><rect x="392" y="262" width="40" height="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g><text x="412" y="278" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <text x="264" y="303" text-anchor="middle" font-size="10.5" fill="#999">⋯ 其余 95 个值同理各占一行 ⋯</text>

  <!-- highlighted columns l and r+1 -->
  <g filter="url(#sk)">
    <rect x="272" y="142" width="40" height="150" fill="#c98a2b" fill-opacity="0.14"/>
    <rect x="272" y="142" width="40" height="150" fill="none" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="392" y="142" width="40" height="150" fill="#4a8edb" fill-opacity="0.12"/>
    <rect x="392" y="142" width="40" height="150" fill="none" stroke="#4a8edb" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>

  <!-- connectors from nums markers down to table columns -->
  <g filter="url(#sk)">
    <path d="M 236 100 Q 240 125 264 138" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arR)"/>
    <path d="M 378 100 Q 384 122 390 136" stroke="#4a8edb" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arBl)"/>
  </g>

  <!-- right subtraction box -->
  <g filter="url(#sk)">
    <rect x="460" y="142" width="240" height="176" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="580" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">区间 [3,5]：i=6 列 − i=3 列</text>
  <g font-size="11.5" font-family="monospace">
    <text x="478" y="192" fill="#2e6e2e">v=2 : 2 − 1 = 1 → 出现 ✓</text>
    <text x="478" y="214" fill="#999">v=4 : 1 − 1 = 0 → 不在 ✗</text>
    <text x="478" y="236" fill="#999">v=5 : 1 − 1 = 0 → 不在 ✗</text>
    <text x="478" y="258" fill="#2e6e2e">v=7 : 1 − 0 = 1 → 出现 ✓</text>
    <text x="478" y="280" fill="#2e6e2e">v=10: 1 − 0 = 1 → 出现 ✓</text>
  </g>
  <text x="580" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">出现的值 = {2, 7, 10}（升序、无重复）</text>

  <!-- bottom formula box -->
  <g filter="url(#sk)">
    <rect x="60" y="340" width="600" height="76" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="360" y="366" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">cnt(l, r, v) = pre[v][r+1] − pre[v][l]</text>
  <text x="360" y="388" text-anchor="middle" font-size="11.5" fill="#444">一次查询扫 v = 1…100：cnt &gt; 0 的值即区间内的 distinct 值（升序、无重复）</text>
  <text x="360" y="406" text-anchor="middle" font-size="11" fill="#888">预处理 O(nV)，单次查询 O(V)，本题 V = 100</text>
</svg>
