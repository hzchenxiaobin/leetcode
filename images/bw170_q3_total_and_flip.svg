<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="310" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">全取正号得 S，把一个数取负 ⇒ 总和减少 2x</text>

  <!-- 全正 -->
  <text x="26" y="76" font-size="12" fill="#4a7a3a" filter="url(#rough2)">全正</text>
  <rect x="80" y="56" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="56" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="188" y="56" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="242" y="56" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="296" y="56" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="372" y="79" font-size="12" fill="#4a7a3a" filter="url(#rough2)">S = 15</text>

  <!-- 取负一个 -->
  <text x="22" y="146" font-size="12" fill="#b85450" filter="url(#rough2)">4 取负</text>
  <rect x="80" y="126" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="149" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="126" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="149" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="188" y="126" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="149" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="242" y="126" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="149" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">−4</text>
  <rect x="296" y="126" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="149" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="372" y="149" font-size="12" fill="#b85450" filter="url(#rough2)">S − 2·4 = 7</text>

  <!-- 公式 -->
  <rect x="60" y="180" width="400" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">target = S − 2·Σ(N)  ⇒  Σ(N) = (S − target) / 2 = D</text>
  <text x="260" y="219" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">N 为取负的元素集合</text>

  <!-- 可行性 -->
  <rect x="60" y="240" width="400" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">三步判可行：|target| ≤ S 、(S − target) 为偶数 、D ∈ [0, S]</text>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1..n 连续整数能凑出 [0,S] 中任意和 → 这三条也是充分条件</text>
</svg>
