<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：「枚举起点」与「向下匹配」是两个正交维度</text>

  <text x="52" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">head</text>
  <rect x="30" y="70" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="90" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>
  <path d="M77,85 L91,85" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="94" y="70" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="116" y="90" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">2</text>
  <path d="M141,85 L155,85" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="158" y="70" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="90" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">8</text>

  <text x="300" y="68" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">在树中找出这条序列（起点任意）</text>
  <path d="M208,82 C300,70 390,98 402,162" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <path d="M330,130 L250,185" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M330,130 L410,185" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M250,185 L275,240" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M410,185 L385,240" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M275,240 L245,295" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M385,240 L345,295" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M385,240 L425,295" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M425,295 L395,348" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M425,295 L455,348" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <ellipse cx="330" cy="130" rx="25" ry="22" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <ellipse cx="250" cy="185" rx="25" ry="22" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <ellipse cx="345" cy="295" rx="24" ry="20" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <ellipse cx="330" cy="130" rx="16" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="134" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">1</text>
  <ellipse cx="250" cy="185" rx="16" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="189" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>
  <ellipse cx="410" cy="185" rx="16" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="410" y="189" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">4</text>
  <ellipse cx="275" cy="240" rx="16" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="244" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">2</text>
  <ellipse cx="385" cy="240" rx="16" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="385" y="244" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">2</text>
  <ellipse cx="245" cy="295" rx="16" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="299" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">1</text>
  <ellipse cx="345" cy="295" rx="16" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="299" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">6</text>
  <ellipse cx="425" cy="295" rx="16" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="425" y="299" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">8</text>
  <ellipse cx="395" cy="348" rx="16" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="352" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">1</text>
  <ellipse cx="455" cy="348" rx="16" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="352" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">3</text>

  <text x="438" y="186" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">匹配中只能一路向下</text>

  <rect x="22" y="145" width="172" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="108" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">主 DFS：isSubPath(v)</text>
  <text x="108" y="188" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">枚举起点：每个节点试一遍</text>
  <path d="M196,174 L219,182" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="22" y="222" width="172" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="108" y="245" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">匹配 DFS：match(t, l)</text>
  <text x="108" y="265" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">从起点向下：两指针同步走</text>
  <path d="M196,251 C240,263 310,258 361,246" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="28" y="372" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">虚线圈：候选起点可以是任何节点；绿色：示例 1 命中的匹配路径 4→2→8</text>

  <rect x="30" y="385" width="500" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">起点维度 × 匹配维度正交 → 两个简单递归互相调用</text>
  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">每对（树节点，链表位置）至多算一次 ⇒ O(n·m) ≤ 25 万步，稳稳通过</text>
</svg>
