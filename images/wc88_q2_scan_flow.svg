<svg xmlns="http://www.w3.org/2000/svg" width="660" height="472" viewBox="0 0 660 472" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="472" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">一次扫描：遇人就算间距，最后补上最右段</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="77.0" y="47.0" width="346" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="74.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">ans = 0，prev = -1</text>
  <g filter="url(#sk2)"><rect x="77.0" y="105.0" width="346" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="132.1" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">for i = 0 .. n-1</text>
  <g filter="url(#sk2)"><rect x="77.0" y="163.0" width="346" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="182.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">seats[i] == 1 ？</text>
  <text x="250" y="197.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">否（空位）→ 继续下一个 i</text>
  <g filter="url(#sk2)"><rect x="77.0" y="227.0" width="346" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="246.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">prev == -1 ？</text>
  <text x="250" y="261.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">是 → ans = max(ans, i)（首段）</text>
  <g filter="url(#sk2)"><rect x="77.0" y="291.0" width="346" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="318.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">否 → ans = max(ans, (i-prev)/2)（中段）</text>
  <g filter="url(#sk2)"><rect x="77.0" y="351.0" width="346" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="378.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">prev = i</text>
  <path d="M 250 94 L 250 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 152 L 250 162" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 210 L 250 226" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 274 L 250 290" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 338 L 250 350" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 77 374 L 56 374 L 56 128 L 75 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="50" y="260" text-anchor="end" font-size="10" fill="#446688">下一个 i</text>
  <path d="M 250 398 L 250 420" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="268" y="414" text-anchor="start" font-size="10" fill="#4a7a3a">循环结束</text>
  <g filter="url(#sk2)"><rect x="40.0" y="420.0" width="420" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="250" y="444.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e22">ans = max(ans, n-1-prev) → 返回 ans</text>
</svg>
