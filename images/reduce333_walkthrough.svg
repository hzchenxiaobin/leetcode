<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="700" height="550" fill="#fafafa"/>

  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：n = 54 = 110110₂（进位桥接两段 1）</text>
  <path d="M 180 42 Q 350 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 演算表 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="46" y="84" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="82" y="84" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="134" y="84" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="244" y="84" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="308" y="84" width="278" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="586" y="84" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="64" y="103" font-weight="bold" fill="#2c4d70">步</text>
    <text x="108" y="103" font-weight="bold" fill="#2c4d70">n</text>
    <text x="189" y="103" font-weight="bold" fill="#2c4d70">二进制</text>
    <text x="276" y="103" font-weight="bold" fill="#2c4d70">末两位</text>
    <text x="447" y="103" font-weight="bold" fill="#2c4d70">动作</text>
    <text x="610" y="103" font-weight="bold" fill="#2c4d70">ans</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="46" y="114" width="36" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="82" y="114" width="52" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="134" y="114" width="110" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="244" y="114" width="64" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="308" y="114" width="278" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="586" y="114" width="48" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <text x="64" y="134">1</text><text x="108" y="134">54</text><text x="189" y="134">110110</text>
    <text x="276" y="134">10</text><text x="447" y="134">n &gt;&gt;= 1 → 27</text><text x="610" y="134" font-weight="bold">0</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="46" y="146" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="82" y="146" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="134" y="146" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="244" y="146" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="308" y="146" width="278" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="586" y="146" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="64" y="166">2</text><text x="108" y="166">27</text><text x="189" y="166">11011</text>
    <text x="276" y="166" font-weight="bold" fill="#b07310">11</text><text x="447" y="166">＋1 进位 → 28，再 &gt;&gt;= 1 → 14</text>
    <text x="610" y="166" font-weight="bold" fill="#b07310">1</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="46" y="178" width="36" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="82" y="178" width="52" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="134" y="178" width="110" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="244" y="178" width="64" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="308" y="178" width="278" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="586" y="178" width="48" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <text x="64" y="198">3</text><text x="108" y="198">14</text><text x="189" y="198">1110</text>
    <text x="276" y="198">10</text><text x="447" y="198">n &gt;&gt;= 1 → 7</text><text x="610" y="198" font-weight="bold">1</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="46" y="210" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="82" y="210" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="134" y="210" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="244" y="210" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="308" y="210" width="278" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="586" y="210" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="64" y="230">4</text><text x="108" y="230">7</text><text x="189" y="230">111</text>
    <text x="276" y="230" font-weight="bold" fill="#b07310">11</text><text x="447" y="230">＋1 进位 → 8，再 &gt;&gt;= 1 → 4</text>
    <text x="610" y="230" font-weight="bold" fill="#b07310">2</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="46" y="242" width="36" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="82" y="242" width="52" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="134" y="242" width="110" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="244" y="242" width="64" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="308" y="242" width="278" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="586" y="242" width="48" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <text x="64" y="262">5</text><text x="108" y="262">4</text><text x="189" y="262">100</text>
    <text x="276" y="262">00</text><text x="447" y="262">n &gt;&gt;= 1 → 2</text><text x="610" y="262" font-weight="bold">2</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="46" y="274" width="36" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="82" y="274" width="52" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="134" y="274" width="110" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="244" y="274" width="64" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="308" y="274" width="278" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="586" y="274" width="48" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <text x="64" y="294">6</text><text x="108" y="294">2</text><text x="189" y="294">10</text>
    <text x="276" y="294">10</text><text x="447" y="294">n &gt;&gt;= 1 → 1</text><text x="610" y="294" font-weight="bold">2</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="46" y="306" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="82" y="306" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="134" y="306" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="244" y="306" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="308" y="306" width="278" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="586" y="306" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="64" y="326">7</text><text x="108" y="326">1</text><text x="189" y="326">1</text>
    <text x="276" y="326">01</text><text x="447" y="326">−1 消位 → 0，再 &gt;&gt;= 1 → 0</text>
    <text x="610" y="326" font-weight="bold" fill="#2e5a24">3</text>
  </g>

  <!-- 映射回原数 -->
  <text x="350" y="372" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">折半会把进位「放大」回原数的尺度——三次操作分别是 ＋2¹、＋2³、−2⁶：</text>

  <g filter="url(#rough2)">
    <rect x="56" y="388" width="112" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="112" y="409" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">110110</text>
  <path d="M 170 404 L 220 404" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="397" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07310" filter="url(#rough2)">＋2¹</text>
  <text x="112" y="438" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">54</text>

  <g filter="url(#rough2)">
    <rect x="224" y="388" width="112" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="409" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">111000</text>
  <path d="M 338 404 L 388 404" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="363" y="397" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07310" filter="url(#rough2)">＋2³</text>
  <text x="280" y="438" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">56</text>

  <g filter="url(#rough2)">
    <rect x="392" y="388" width="126" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="455" y="409" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1000000</text>
  <path d="M 520 404 L 570 404" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="545" y="397" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">−2⁶</text>
  <text x="455" y="438" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">64</text>

  <g filter="url(#rough2)">
    <rect x="574" y="388" width="44" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="596" y="409" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">0</text>

  <text x="350" y="466" text-anchor="middle" font-size="11.5" fill="#8a6210" filter="url(#rough2)">＋2¹ 让低位段「11」塌缩，进位恰好落在两段之间唯一的 0 上，两段焊成「111」，再用 ＋2³ 整体塌缩</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="46" y="484" width="596" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="344" y="505" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">ans = 3：54 ＋ 2 ＋ 8 = 64，再 − 64 归零</text>
  <text x="344" y="524" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">两段连续 1 只花 3 次（桥接后进位、再进位、最后消位），而非 2 + 2 次 —— 与官方示例 2 一致</text>
</svg>
