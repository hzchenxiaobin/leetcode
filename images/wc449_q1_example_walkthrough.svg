<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>
  <text x="290" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：三个分支各走一遍</text>
  <path d="M 130 42 Q 290 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- ===== 栏1：示例1 abc, k=2 ===== -->
  <g filter="url(#rough2)">
    <rect x="25" y="56" width="160" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="105" y="77" text-anchor="middle" font-size="12" fill="#3a5a7a" font-weight="bold">示例1  s="abc", k=2</text>

  <g filter="url(#rough2)"><rect x="54" y="96" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="71" y="116" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">a</text>
  <g filter="url(#rough2)"><rect x="88" y="96" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="105" y="116" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">b</text>
  <g filter="url(#rough2)"><rect x="122" y="96" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="139" y="116" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">c</text>

  <g filter="url(#rough2)"><rect x="54" y="188" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="94" y="188" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="134" y="188" width="26" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <path d="M 138 191 L 156 212" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough)"/>
  <path d="M 156 191 L 138 212" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough)"/>
  <path d="M 45 210 L 168 210" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="67" y="226" text-anchor="middle" font-size="10" fill="#555">a:1</text>
  <text x="107" y="226" text-anchor="middle" font-size="10" fill="#555">b:1</text>
  <text x="147" y="226" text-anchor="middle" font-size="10" fill="#a03a36">c:1</text>

  <text x="105" y="252" text-anchor="middle" font-size="11" fill="#555">m = 3 &gt; 2，删 3−2 = 1 个</text>
  <text x="105" y="270" text-anchor="middle" font-size="11" fill="#555">最小频率并列，任选删光</text>

  <g filter="url(#rough2)">
    <rect x="35" y="284" width="140" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="105" y="310" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">答案 = 1</text>

  <!-- ===== 栏2：示例2 aabb, k=2 ===== -->
  <g filter="url(#rough2)">
    <rect x="210" y="56" width="160" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="290" y="77" text-anchor="middle" font-size="12" fill="#3a5a7a" font-weight="bold">示例2  s="aabb", k=2</text>

  <g filter="url(#rough2)"><rect x="226" y="96" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="242" y="116" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">a</text>
  <g filter="url(#rough2)"><rect x="258" y="96" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="274" y="116" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">a</text>
  <g filter="url(#rough2)"><rect x="290" y="96" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="306" y="116" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">b</text>
  <g filter="url(#rough2)"><rect x="322" y="96" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="338" y="116" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">b</text>

  <g filter="url(#rough2)"><rect x="240" y="166" width="26" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="290" y="166" width="26" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <path d="M 230 210 L 330 210" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="253" y="226" text-anchor="middle" font-size="10" fill="#555">a:2</text>
  <text x="303" y="226" text-anchor="middle" font-size="10" fill="#555">b:2</text>

  <text x="290" y="252" text-anchor="middle" font-size="11" fill="#2e5e2e" font-weight="bold">m = 2 ≤ k = 2</text>
  <text x="290" y="270" text-anchor="middle" font-size="11" fill="#555">无需删除，走特判分支</text>

  <g filter="url(#rough2)">
    <rect x="220" y="284" width="140" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="290" y="310" text-anchor="middle" font-size="14" fill="#3a5a7a" font-weight="bold">答案 = 0</text>

  <!-- ===== 栏3：示例3 yyyzz, k=1 ===== -->
  <g filter="url(#rough2)">
    <rect x="395" y="56" width="160" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="475" y="77" text-anchor="middle" font-size="12" fill="#3a5a7a" font-weight="bold">示例3  s="yyyzz", k=1</text>

  <g filter="url(#rough2)"><rect x="405" y="96" width="28" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="419" y="116" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">y</text>
  <g filter="url(#rough2)"><rect x="433" y="96" width="28" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="447" y="116" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">y</text>
  <g filter="url(#rough2)"><rect x="461" y="96" width="28" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="475" y="116" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">y</text>
  <g filter="url(#rough2)"><rect x="489" y="96" width="28" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="503" y="116" text-anchor="middle" font-size="14" fill="#8a6415" font-weight="bold">z</text>
  <g filter="url(#rough2)"><rect x="517" y="96" width="28" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="531" y="116" text-anchor="middle" font-size="14" fill="#8a6415" font-weight="bold">z</text>

  <g filter="url(#rough2)"><rect x="428" y="144" width="26" height="66" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="478" y="166" width="26" height="44" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <path d="M 482 170 L 500 208" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough)"/>
  <path d="M 500 170 L 482 208" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough)"/>
  <path d="M 418 210 L 520 210" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="441" y="226" text-anchor="middle" font-size="10" fill="#555">y:3</text>
  <text x="491" y="226" text-anchor="middle" font-size="10" fill="#a03a36">z:2</text>

  <text x="475" y="252" text-anchor="middle" font-size="11" fill="#555">m = 2 &gt; 1，删频率最小的 'z'</text>
  <text x="475" y="270" text-anchor="middle" font-size="11" fill="#555">删光 2 个 'z'</text>

  <g filter="url(#rough2)">
    <rect x="405" y="284" width="140" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="475" y="310" text-anchor="middle" font-size="14" fill="#8a6415" font-weight="bold">答案 = 2</text>

  <!-- 底部总结 -->
  <g filter="url(#rough2)">
    <rect x="40" y="348" width="500" height="60" rx="8" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="290" y="372" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">统一视角</text>
  <text x="290" y="394" text-anchor="middle" font-size="12" fill="#555">答案 = 频率最小的 m−k 个字符的出现次数之和（m ≤ k 时为 0）</text>
</svg>
