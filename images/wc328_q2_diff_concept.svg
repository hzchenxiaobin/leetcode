<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：子矩阵 +1 ⇒ 差分数组四角打标记</text>
  <path d="M 160 44 Q 340 52 520 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left grid: mat with query submatrix -->
  <text x="155" y="86" text-anchor="middle" font-size="13" fill="#666">mat 上的查询子矩阵（n×n）</text>
  <g filter="url(#sk)"><rect x="75" y="105" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="115" y="105" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="155" y="105" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="195" y="105" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="75" y="145" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="115" y="145" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="155" y="145" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="195" y="145" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="75" y="185" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="115" y="185" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="155" y="185" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="195" y="185" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="75" y="225" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="115" y="225" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="155" y="225" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="195" y="225" width="40" height="40" rx="4" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1"/></g>
  <text x="111" y="139" text-anchor="end" font-size="10" fill="#4a7a3a">(r₁,c₁)</text>
  <text x="199" y="240" text-anchor="start" font-size="10" fill="#4a7a3a">(r₂,c₂)</text>

  <!-- arrow between grids -->
  <g filter="url(#sk)"><path d="M 243 185 Q 296 185 336 176" stroke="#7a5415" stroke-width="2" fill="none" marker-end="url(#ar)"/></g>
  <text x="290" y="162" text-anchor="middle" font-size="11" fill="#7a5415">O(1) 打标记</text>

  <!-- right grid: diff array d (5x5) -->
  <text x="460" y="70" text-anchor="middle" font-size="13" fill="#666">差分数组 d（(n+1)×(n+1)）</text>
  <text x="384" y="98" text-anchor="middle" font-size="10" fill="#999">c0</text>
  <text x="422" y="98" text-anchor="middle" font-size="10" fill="#999">c1</text>
  <text x="460" y="98" text-anchor="middle" font-size="10" fill="#999">c2</text>
  <text x="498" y="98" text-anchor="middle" font-size="10" fill="#b85450">c3=c2+1</text>
  <text x="536" y="98" text-anchor="middle" font-size="10" fill="#999">c4</text>
  <text x="357" y="129" text-anchor="end" font-size="10" fill="#999">r0</text>
  <text x="357" y="167" text-anchor="end" font-size="10" fill="#999">r1</text>
  <text x="357" y="205" text-anchor="end" font-size="10" fill="#999">r2</text>
  <text x="357" y="243" text-anchor="end" font-size="10" fill="#b85450">r3=r2+1</text>
  <text x="357" y="281" text-anchor="end" font-size="10" fill="#999">r4</text>

  <!-- plain cells of d -->
  <g filter="url(#sk)"><rect x="365" y="105" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="403" y="105" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="441" y="105" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="479" y="105" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="517" y="105" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="365" y="143" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="441" y="143" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="479" y="143" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="517" y="143" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="365" y="181" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="403" y="181" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="441" y="181" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="479" y="181" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="517" y="181" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="365" y="219" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="441" y="219" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="479" y="219" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="517" y="219" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="365" y="257" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="403" y="257" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="441" y="257" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="479" y="257" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="517" y="257" width="38" height="38" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>

  <!-- four corner marks -->
  <g filter="url(#sk)"><rect x="403" y="143" width="38" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="422" y="167" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" font-family="monospace">+1</text>
  <g filter="url(#sk)"><rect x="403" y="219" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="422" y="243" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" font-family="monospace">−1</text>
  <g filter="url(#sk)"><rect x="479" y="143" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="498" y="167" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" font-family="monospace">−1</text>
  <g filter="url(#sk)"><rect x="479" y="219" width="38" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="498" y="243" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" font-family="monospace">+1</text>

  <!-- dashed restored rectangle -->
  <g filter="url(#sk)"><rect x="403" y="143" width="76" height="76" rx="3" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5"/></g>
  <text x="563" y="180" text-anchor="start" font-size="9.5" fill="#4a7a3a">前缀和后 = 1</text>
  <text x="563" y="196" text-anchor="start" font-size="9.5" fill="#4a7a3a">的矩形区域</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="60" y="318" width="560" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="80" y="344" font-size="12" font-weight="bold" fill="#2b2b2b">四角标记 {+1, −1, −1, +1} 经二维前缀和，贡献恰好填满 [r1,r2]×[c1,c2]，矩形外全部相消</text>
  <text x="80" y="368" font-size="11" fill="#444">r2+1、c2+1 处的标记落在多出的一行一列 —— 所以 d 必须开 (n+1)×(n+1)，贴边查询才不越界</text>
  <text x="80" y="390" font-size="11" fill="#444">一次「子矩阵 +1」从 O(面积) 压缩为 4 次单点修改</text>
</svg>
