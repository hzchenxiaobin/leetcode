<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：192 通过，100 失败</text>

  <!-- 192 -->
  <rect x="24" y="48" width="232" height="226" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="72" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">n = 192</text>
  <g filter="url(#rough2)" font-size="12" fill="#2f5527">
    <text x="42" y="100">192 ‖ 384 ‖ 576 = "192384576"</text>
    <text x="42" y="128">长度 = 9 ✓（192、384、576 各三位）</text>
    <text x="42" y="156">排序 → "123456789" ✓</text>
    <text x="42" y="184">9 个字符恰是 1~9 各一个、无 0</text>
    <text x="42" y="222" font-size="14" fill="#4a7a3a">返回 true</text>
    <text x="42" y="252" font-size="11" fill="#5a7a4a">百位数 ≥ 2 时 3n 才可能仍是三位数：</text>
    <text x="42" y="268" font-size="11" fill="#5a7a4a">192·3 = 576 没进位，是关键巧合之一</text>
  </g>

  <!-- 100 -->
  <rect x="272" y="48" width="232" height="226" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="72" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">n = 100</text>
  <g filter="url(#rough2)" font-size="12" fill="#8c3a36">
    <text x="290" y="100">100 ‖ 200 ‖ 300 = "100200300"</text>
    <text x="290" y="128">长度 = 9 ✓（这一关是过的）</text>
    <text x="290" y="156">含 0 ✗（六个 0 重复出现）</text>
    <text x="290" y="184">排序 → "000000123"</text>
    <text x="290" y="206">≠ "123456789" ✗</text>
    <text x="290" y="244" font-size="14" fill="#b85450">返回 false</text>
    <text x="290" y="268" font-size="11" fill="#a06660">别漏了长度检查：3n=2997 时拼接 10 位</text>
  </g>
</svg>
