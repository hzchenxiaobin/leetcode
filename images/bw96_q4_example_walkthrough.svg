<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2（4,7）反向归约 ⟺ 正向路径</text>

  <!-- 反向链 -->
  <text x="80" y="62" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">反向（从目标回 (1,1)）：</text>
  <g filter="url(#rough2)">
    <rect x="60" y="76" width="78" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="168" y="76" width="78" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="276" y="76" width="78" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="384" y="76" width="78" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="470" y="76" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#8a4a47" text-anchor="middle">
    <text x="99" y="99">(4,7)</text><text x="207" y="99">(2,7)</text>
    <text x="315" y="99">(1,7)</text><text x="423" y="99">(1,8)</text><text x="500" y="99">(1,4)…</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#999" text-anchor="middle">
    <text x="134" y="66">x 偶减半</text><text x="242" y="66">x 偶减半</text>
    <text x="350" y="66">双奇 1&lt;7</text><text x="458" y="66">y 偶减半</text>
  </g>
  <text x="80" y="140" font-size="12.5" fill="#8a4a47" filter="url(#rough2)">继续减半：(1,4)→(1,2)→(1,1)，完成 ✓（每步都把最大坐标压小）</text>

  <!-- 分隔 -->
  <path d="M 100 168 C 240 176, 320 176, 460 168" fill="none" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">倒过来读 = 正向路径</text>

  <!-- 正向链 -->
  <text x="80" y="200" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">正向（从 (1,1) 到目标）：</text>
  <g filter="url(#rough2)">
    <rect x="60" y="212" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="136" y="212" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="212" y="212" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="288" y="212" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="364" y="212" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="440" y="212" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22" text-anchor="middle">
    <text x="93" y="235">(1,1)</text><text x="169" y="235">(1,2)</text>
    <text x="245" y="235">(1,4)</text><text x="321" y="235">(1,8)</text>
    <text x="397" y="235">(1,7)</text><text x="473" y="235">(2,7)</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#999" text-anchor="middle">
    <text x="131" y="258">y×2</text><text x="207" y="258">y×2</text>
    <text x="283" y="258">y×2</text><text x="359" y="258">y−x</text><text x="435" y="258">x×2</text>
  </g>
  <text x="80" y="276" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">再补一步 x×2：(2,7)→(4,7) ✓ 与官方路径完全一致</text>

  <!-- 反例 -->
  <text x="80" y="316" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">反例（6,9）：gcd = 3，含奇素因子</text>
  <g filter="url(#rough2)">
    <rect x="60" y="330" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#8a4a47">
    <text x="76" y="348">反向走：6 是偶数 → (3,9)；双奇 3&lt;9 → (3,12) → (3,6) → (3,3)</text>
    <text x="76" y="366">(3,3) 双奇相等，但 gcd=3≠1 → 卡死，归约不到 (1,1) → false</text>
  </g>
  <text x="280" y="400" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">gcd 是 2 的幂 ⟺ 双奇归约必然一路收敛到 (1,1)（见题解 §5 定理）</text>
</svg>
