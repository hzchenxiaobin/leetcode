<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算:mat = [[1,2,3],[4,5,6],[7,8,9]],target = 13</text>

  <!-- 阶段 1 -->
  <rect x="12" y="42" width="160" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">第 0 行 [1,2,3] 后</text>
  <rect x="43" y="84" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="77" y="84" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="92" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="111" y="84" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="126" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="92" y="128" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">dp = {1,2,3}</text>
  <text x="92" y="168" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">over = ∞(无超额)</text>

  <!-- 阶段间箭头 1 -->
  <path d="M 174 120 L 193 120" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 阶段 2 -->
  <rect x="195" y="42" width="160" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="275" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">第 1 行 [4,5,6] 后</text>
  <rect x="204" y="84" width="27" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="217.5" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="233" y="84" width="27" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="246.5" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="262" y="84" width="27" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="275.5" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="291" y="84" width="27" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="304.5" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="320" y="84" width="27" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="333.5" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="275" y="128" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">dp = {5,6,7,8,9}(9 组合并成 5 个)</text>
  <text x="275" y="168" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">over = ∞(无超额)</text>

  <!-- 阶段间箭头 2 -->
  <path d="M 357 120 L 376 120" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 阶段 3 -->
  <rect x="378" y="42" width="170" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="463" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">第 2 行 [7,8,9] 后 ← 截断!</text>
  <rect x="384" y="84" width="22" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="395" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <rect x="408" y="84" width="22" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="419" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13</text>
  <rect x="434" y="84" width="22" height="26" rx="4" fill="#efefef" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="445" y="102" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">14</text>
  <rect x="458" y="84" width="22" height="26" rx="4" fill="#efefef" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="469" y="102" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">15</text>
  <rect x="482" y="84" width="22" height="26" rx="4" fill="#efefef" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="493" y="102" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">16</text>
  <rect x="506" y="84" width="22" height="26" rx="4" fill="#efefef" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="517" y="102" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">17</text>
  <rect x="530" y="84" width="22" height="26" rx="4" fill="#efefef" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="541" y="102" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">18</text>
  <text x="430" y="128" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">dp = {12,13}</text>
  <text x="510" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">超额{14..18}丢弃</text>

  <!-- 折叠箭头 -->
  <path d="M 445 112 C 448 126, 452 134, 456 140" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 469 112 C 468 126, 466 134, 463 140" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 493 112 C 488 128, 478 136, 470 141" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 517 112 C 506 130, 486 138, 473 142" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 541 112 C 524 132, 492 140, 476 143" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- over 框 -->
  <rect x="412" y="146" width="102" height="32" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="463" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6420" filter="url(#rough2)">over = 14</text>
  <text x="463" y="196" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">min{14,15,16,17,18} = 14</text>

  <!-- 结论框 -->
  <rect x="60" y="218" width="440" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">处理完全部 3 行:dp = {12, 13},over = 14</text>
  <text x="280" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = min(|12−13|, |13−13|, 14−13) = 0 ✓</text>

  <!-- 底注 -->
  <text x="280" y="310" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 2 行:15 组部分和 → 只留 ≤ 13 的 {12,13},超额 {14,…,18} 折叠成 over = 14</text>
  <text x="280" y="330" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">若不折叠,dp 会一路涨到 18 甚至 4900;折叠保证状态数 ≤ target + 2,与行数无关</text>
</svg>
