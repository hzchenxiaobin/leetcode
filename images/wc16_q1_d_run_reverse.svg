<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：基准 1..n + 每一段连续的 D 整体翻转</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">I 处天然递增；连续 k 个 D 要求 k+1 个数严格递减，只能用一段连续整数倒着放</text>

  <!-- 签名：字母写在两个格子之间的缝隙上 -->
  <text x="112" y="80" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">签名 s</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <circle cx="176" cy="76" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="176" y="80" fill="#8a6a20">D</text>
    <circle cx="228" cy="76" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="228" y="80" fill="#8a6a20">D</text>
    <circle cx="280" cy="76" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="280" y="80" fill="#3a4a66">I</text>
    <circle cx="332" cy="76" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="332" y="80" fill="#8a6a20">D</text>
    <circle cx="384" cy="76" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="384" y="80" fill="#3a4a66">I</text>
  </g>

  <!-- 基准排列 1..n -->
  <text x="112" y="122" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">基准</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="127" y="104" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="150" y="125" fill="#3a4a66">1</text>
    <rect x="179" y="104" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="202" y="125" fill="#3a4a66">2</text>
    <rect x="231" y="104" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="254" y="125" fill="#3a4a66">3</text>
    <rect x="283" y="104" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="306" y="125" fill="#3a4a66">4</text>
    <rect x="335" y="104" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="358" y="125" fill="#3a4a66">5</text>
    <rect x="387" y="104" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="410" y="125" fill="#3a4a66">6</text>
  </g>

  <!-- D 段括注 -->
  <g filter="url(#rough2)" fill="none" stroke-width="1.5">
    <path d="M 127 142 L 127 152 L 277 152 L 277 142" stroke="#d6a040"/>
    <path d="M 283 142 L 283 152 L 381 152 L 381 142" stroke="#4a7a3a"/>
  </g>
  <text x="202" y="168" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">D 段①：位置 0~2 共 3 个数</text>
  <text x="332" y="168" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">D 段②：位置 3~4 共 2 个数</text>

  <path d="M 60 176 L 60 196 L 500 196 L 500 176" stroke="#bbb" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把每段覆盖的格子各自倒序（长度 1 的段倒序后不变）</text>

  <!-- 结果 -->
  <text x="112" y="248" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">结果</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="127" y="230" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="150" y="251" fill="#8a6a20">3</text>
    <rect x="179" y="230" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="202" y="251" fill="#8a6a20">2</text>
    <rect x="231" y="230" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="254" y="251" fill="#8a6a20">1</text>
    <rect x="283" y="230" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="306" y="251" fill="#3a5a30">5</text>
    <rect x="335" y="230" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="358" y="251" fill="#3a5a30">4</text>
    <rect x="387" y="230" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="410" y="251" fill="#3a4a66">6</text>
  </g>

  <text x="280" y="284" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">校验：3 &gt; 2 &gt; 1 &lt; 5 &gt; 4 &lt; 6 对应签名 D D I D I ✓</text>

  <rect x="70" y="300" width="420" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="320" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">为什么这是字典序最小</text>
  <text x="86" y="338" font-size="10" fill="#555" filter="url(#rough2)">位置 0 能取的最小值就是 1；若 s[0] = 'D'，则 p[0] &gt; p[1] &gt; … &gt; p[k]，</text>
  <text x="86" y="352" font-size="10" fill="#555" filter="url(#rough2)">p[0] 至少是 k+1，而 k+1, k, …, 1 恰好取到它 → 局部最优且可延续。</text>
</svg>
