<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">稳定排序：键 = (映射值, 原下标)</text>

  <!-- 左：构造键 -->
  <text x="140" y="70" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">构造键</text>
  <g filter="url(#rough2)">
    <rect x="40" y="84" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="40" y="126" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="40" y="168" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="140" y="107">991 → (669, 下标0)</text>
    <text x="140" y="149">338 → (7, 下标1)</text>
    <text x="140" y="191">38  → (7, 下标2)</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 244 150 C 268 150, 276 150, 296 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="270" y="140" font-size="12" fill="#446688" filter="url(#rough2)" text-anchor="middle">排序</text>

  <!-- 中：排序后的键 -->
  <text x="400" y="70" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">按 (映射值, 下标) 非降</text>
  <g filter="url(#rough2)">
    <rect x="300" y="84" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="300" y="126" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="300" y="168" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="400" y="107">(7, 1) → 338</text>
    <text x="400" y="149">(7, 2) → 38</text>
    <text x="400" y="191">(669, 0) → 991</text>
  </g>

  <!-- 平局说明 -->
  <g filter="url(#rough2)">
    <path d="M 400 166 C 400 210, 400 210, 400 218" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  </g>
  <text x="400" y="238" font-size="12.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">映射值同为 7：下标 1 &lt; 2，保持 338 在 38 前</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="256" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#6a3a36" text-anchor="middle">
    <text x="280" y="278">返回原数本身：输出 [338, 38, 991]</text>
    <text x="280" y="299">C++ 用 pair(映射值, 下标) 排序；Python 的 sorted 自带稳定</text>
  </g>
</svg>
