<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">孪生节点：把链表"对折"，下标 i 配 n−1−i</text>

  <!-- 链表节点：8 个节点 n=8 -->
  <g filter="url(#rough2)">
    <rect x="50" y="80" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="116" y="80" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="182" y="80" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="248" y="80" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="314" y="80" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="380" y="80" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="446" y="80" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="76" y="102">4</text>
    <text x="142" y="102">9</text>
    <text x="208" y="102">3</text>
    <text x="274" y="102">5</text>
    <text x="340" y="102">7</text>
    <text x="406" y="102">2</text>
    <text x="472" y="102">8</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 102 98 L 112 98" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 168 98 L 178 98" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 234 98 L 244 98" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 300 98 L 310 98" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 366 98 L 376 98" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 432 98 L 442 98" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="76" y="130">i=0</text>
    <text x="142" y="130">i=1</text>
    <text x="208" y="130">i=2</text>
    <text x="274" y="130">i=3</text>
    <text x="340" y="130">i=4</text>
    <text x="406" y="130">i=5</text>
    <text x="472" y="130">i=6</text>
  </g>

  <!-- 对折弧线 -->
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="2">
    <path d="M 76 78 C 76 20, 472 20, 472 78" marker-end="url(#arr)"/>
    <path d="M 142 78 C 142 38, 406 38, 406 78" marker-end="url(#arr)"/>
    <path d="M 208 78 C 208 52, 340 52, 340 78" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#b85450" text-anchor="middle">
    <text x="274" y="24">0 ↔ 6：4+8 = 12</text>
    <text x="274" y="44">1 ↔ 5：9+2 = 11</text>
    <text x="274" y="62">2 ↔ 4：3+7 = 10</text>
  </g>

  <!-- 中线说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="170" width="440" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="196" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)" text-anchor="middle">只需枚举前一半下标 i = 0 .. n/2 − 1</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="222">孪生对共有 n/2 对，每对 (i, n−1−i) 恰好一个在前半、一个在后半</text>
    <text x="280" y="246">答案 = max over 前半每个节点 与 对折位置节点 的值之和</text>
    <text x="280" y="270">n 为偶数 ⇒ 无正中间落单节点，对折完全配对</text>
  </g>

  <text x="280" y="315" font-size="12.5" fill="#666" text-anchor="middle" filter="url(#rough2)">本例最大孪生和 = max(12, 11, 10) = 12</text>
</svg>
