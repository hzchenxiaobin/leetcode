<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    改值 = 删除：只动两端，四种分配
  </text>

  <!-- 排序数组 -->
  <text x="258" y="68" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">排序后 [0, 1, 5, 10, 14]（n = 5）</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="78" y="82" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="130" y="82" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="182" y="82" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="234" y="82" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="286" y="82" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="104" y="109" text-anchor="middle" fill="#446688">0</text>
    <text x="156" y="109" text-anchor="middle" fill="#446688">1</text>
    <text x="208" y="109" text-anchor="middle" fill="#2f5a24">5</text>
    <text x="260" y="109" text-anchor="middle" fill="#446688">10</text>
    <text x="312" y="109" text-anchor="middle" fill="#446688">14</text>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="104" y="142" text-anchor="middle" fill="#666">a₀</text>
    <text x="156" y="142" text-anchor="middle" fill="#666">a₁</text>
    <text x="208" y="142" text-anchor="middle" fill="#666">a₂</text>
    <text x="260" y="142" text-anchor="middle" fill="#666">a₃</text>
    <text x="312" y="142" text-anchor="middle" fill="#666">a₄</text>
  </g>

  <!-- 四种方案 -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="366" y="76" width="132" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="432" y="98" text-anchor="middle" fill="#8a6a1a">i=0：删最大 3 个</text>
    <rect x="366" y="118" width="132" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="432" y="140" text-anchor="middle" fill="#8a6a1a">i=1：删 1 小 2 大</text>
    <rect x="366" y="160" width="132" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="432" y="182" text-anchor="middle" fill="#8a6a1a">i=2：删 2 小 1 大</text>
    <rect x="366" y="202" width="132" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="432" y="224" text-anchor="middle" fill="#8a6a1a">i=3：删最小 3 个</text>
  </g>

  <!-- 各方案的剩余区间画在排序数组下方 -->
  <g filter="url(#rough2)" font-size="12">
    <!-- i=0: 保留 [a0,a1] -->
    <rect x="78" y="160" width="104" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="130" y="180" text-anchor="middle" fill="#446688">[0, 1] 差 1</text>
    <!-- i=1: 保留 [a1,a2] -->
    <rect x="130" y="198" width="104" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="182" y="218" text-anchor="middle" fill="#446688">[1, 5] 差 4</text>
    <!-- i=2: 保留 [a2,a3] -->
    <rect x="182" y="236" width="104" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="234" y="256" text-anchor="middle" fill="#446688">[5, 10] 差 5</text>
    <!-- i=3: 保留 [a3,a4] -->
    <rect x="234" y="274" width="104" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="286" y="294" text-anchor="middle" fill="#446688">[10, 14] 差 4</text>
  </g>

  <!-- 最优标注 -->
  <g filter="url(#rough2)">
    <path d="M 182 158 C 200 148, 220 142, 240 136" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="200" y="132" font-size="12" fill="#b85450" filter="url(#rough2)">min = 1 ✓</text>

  <!-- 公式框 -->
  <rect x="60" y="316" width="300" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="210" y="340" text-anchor="middle" font-size="14" fill="#2f5a24" filter="url(#rough2)">min nums[n−4+i] − nums[i], i=0..3</text>
</svg>
