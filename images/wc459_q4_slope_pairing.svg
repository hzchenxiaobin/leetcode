<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：梯形 ⟺ 一对「同斜率、不同直线」的线段</text>

  <!-- ============ 左：几何图 ============ -->
  <text x="180" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">两条平行线段 = 梯形的上下底</text>

  <!-- 直线 L1 延长线（虚线淡色） -->
  <path d="M 52,146 L 312,59" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.45" filter="url(#rough2)"/>
  <!-- 直线 L2 延长线 -->
  <path d="M 66,318 L 318,234" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.45" filter="url(#rough2)"/>
  <text x="322" y="55" font-size="11" fill="#446688" opacity="0.8" filter="url(#rough2)">直线 L₁</text>
  <text x="326" y="230" font-size="11" fill="#446688" opacity="0.8" filter="url(#rough2)">直线 L₂</text>

  <!-- 梯形内部填充: A(70,140) B(259,77) D(270,250) C(90,310) -->
  <polygon points="70,140 259,77 270,250 90,310" fill="#e8f0fe" opacity="0.55" filter="url(#rough2)"/>

  <!-- 腰（虚线红） -->
  <path d="M 259,77 L 270,250" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <path d="M 90,310 L 70,140" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="284" y="170" font-size="11" fill="#b85450" filter="url(#rough2)">腰</text>
  <text x="52" y="228" font-size="11" fill="#b85450" filter="url(#rough2)">腰</text>

  <!-- 底边（粗蓝） -->
  <path d="M 70,140 L 259,77" stroke="#446688" stroke-width="3.2" filter="url(#rough2)"/>
  <path d="M 90,310 L 270,250" stroke="#446688" stroke-width="3.2" filter="url(#rough2)"/>
  <text x="150" y="92" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">上底 AB</text>
  <text x="158" y="300" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">下底 CD</text>

  <!-- 平行记号（双箭头 chevron） -->
  <path d="M 158,108 l 7,-2.3 l 0,4.6 z" fill="#446688" filter="url(#rough2)"/>
  <path d="M 170,104 l 7,-2.3 l 0,4.6 z" fill="#446688" filter="url(#rough2)"/>
  <path d="M 172,284 l 7,-2.3 l 0,4.6 z" fill="#446688" filter="url(#rough2)"/>
  <path d="M 184,280 l 7,-2.3 l 0,4.6 z" fill="#446688" filter="url(#rough2)"/>

  <!-- 四个端点 -->
  <circle cx="70" cy="140" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="259" cy="77" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="90" cy="310" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="270" cy="250" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="134" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="264" y="68" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="74" y="328" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="278" y="264" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>

  <!-- 斜率标注 -->
  <rect x="228" y="178" width="94" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="275" y="195" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">斜率相同 → 平行</text>

  <!-- 凸性白送说明 -->
  <rect x="36" y="348" width="290" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="181" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 点在 L₁、2 点在 L₂ ⟹ 自动是凸四边形</text>
  <text x="181" y="390" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">凸性白送：无需凸包 / 叉积判定（与 Q2 引理同源）</text>

  <!-- ============ 右：斜率分桶 ============ -->
  <text x="486" y="56" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C(n,2) 条线段按本原方向 (dx,dy) 分桶</text>

  <!-- 桶1 -->
  <rect x="360" y="72" width="252" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="94" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(3,−1)</text>
  <text x="446" y="94" font-size="11.5" fill="#333" filter="url(#rough2)">桶内：AB, CD, EF …（m 条）</text>
  <text x="382" y="118" font-size="11" fill="#666" filter="url(#rough2)">任取两条 → C(m,2) 个「同斜率对」</text>

  <!-- 桶2 -->
  <rect x="360" y="138" width="252" height="58" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="160" font-size="12.5" fill="#888" font-weight="bold" filter="url(#rough2)">(1,0)</text>
  <text x="446" y="160" font-size="11.5" fill="#888" filter="url(#rough2)">水平方向的桶 …</text>
  <text x="382" y="184" font-size="11" fill="#888" filter="url(#rough2)">垂直线 (0,1) 也统一处理，无特判</text>

  <!-- 筛选流程 -->
  <rect x="360" y="210" width="252" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="486" y="228" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">同斜率对 − 同一直线对</text>
  <text x="486" y="246" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（共线的对不能当上下底！）</text>

  <path d="M 486,262 L 486,282" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- T 框 -->
  <rect x="360" y="288" width="252" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="486" y="312" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T = 平行且不共线的线段对</text>
  <text x="486" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= 梯形「上下底」候选对总数</text>

  <!-- 底部总结 -->
  <rect x="30" y="414" width="582" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="434" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">枚举对象从「四点组合 C(n,4)」换成「线段对 C(n,2) 再配对」</text>
  <text x="320" y="451" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">非凸、三点共线等坏组合天然产生不出平行异直线对，自动被排除</text>
</svg>
