<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "abccccdd"（n = 8）</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">逐字符统计 → 取偶数部分 → 还有落单就 +1</text>

  <g filter="url(#rough2)">
    <rect x="60" y="70" width="440" height="204" fill="#e8f0fe" opacity="0.55"/>
    <rect x="60" y="70" width="440" height="34" fill="#e8f0fe"/>
    <rect x="60" y="104" width="440" height="34" fill="#ffffff"/>
    <rect x="60" y="138" width="440" height="34" fill="#f7fbff"/>
    <rect x="60" y="172" width="440" height="34" fill="#ffffff"/>
    <rect x="60" y="206" width="440" height="34" fill="#f7fbff"/>
    <rect x="60" y="240" width="440" height="34" fill="#fff8e1"/>
  </g>

  <g filter="url(#rough2)" stroke="#9aa7b8" stroke-width="1.2" fill="none">
    <path d="M 60 70 L 500 70"/>
    <path d="M 60 104 L 500 104"/>
    <path d="M 60 138 L 500 138"/>
    <path d="M 60 172 L 500 172"/>
    <path d="M 60 206 L 500 206"/>
    <path d="M 60 240 L 500 240"/>
    <path d="M 60 274 L 500 274"/>
    <path d="M 60 70 L 60 274"/>
    <path d="M 150 70 L 150 274"/>
    <path d="M 240 70 L 240 274"/>
    <path d="M 330 70 L 330 274"/>
    <path d="M 420 70 L 420 274"/>
    <path d="M 500 70 L 500 274"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#445" font-weight="bold" text-anchor="middle">
    <text x="105" y="92">字符</text>
    <text x="195" y="92">出现次数</text>
    <text x="285" y="92">cnt ÷ 2 取整</text>
    <text x="375" y="92">贡献 2×</text>
    <text x="460" y="92">落单?</text>
  </g>

  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="105" y="126" font-size="15" font-weight="bold" fill="#3a5a30">a</text>
    <text x="195" y="126">1</text><text x="285" y="126">0</text><text x="375" y="126">0</text>
    <text x="460" y="126" fill="#b85450" font-weight="bold">是</text>

    <text x="105" y="160" font-size="15" font-weight="bold" fill="#3a5a30">b</text>
    <text x="195" y="160">1</text><text x="285" y="160">0</text><text x="375" y="160">0</text>
    <text x="460" y="160" fill="#b85450" font-weight="bold">是</text>

    <text x="105" y="194" font-size="15" font-weight="bold" fill="#3a4a66">c</text>
    <text x="195" y="194">4</text><text x="285" y="194">2</text><text x="375" y="194" font-weight="bold">4</text>
    <text x="460" y="194" fill="#4a7a3a">否</text>

    <text x="105" y="228" font-size="15" font-weight="bold" fill="#8a6a20">d</text>
    <text x="195" y="228">2</text><text x="285" y="228">1</text><text x="375" y="228" font-weight="bold">2</text>
    <text x="460" y="228" fill="#4a7a3a">否</text>

    <text x="105" y="262" font-weight="bold" fill="#8a6a20">合计</text>
    <text x="195" y="262">8</text><text x="285" y="262">3</text>
    <text x="375" y="262" font-weight="bold" fill="#8a6a20">6</text>
    <text x="460" y="262" fill="#b85450" font-weight="bold">2 个</text>
  </g>

  <rect x="60" y="288" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="76" y="310" font-size="11" fill="#8a6a20" filter="url(#rough2)">偶数部分 0 + 0 + 4 + 2 = 6；落单字符有 a、b 两个，但中心只坐得下 1 个 → 6 + 1 = 7</text>
  <text x="76" y="332" font-size="11" fill="#8a6a20" filter="url(#rough2)">一种构造：d c c a c c d（左半 dcc + 中心 a + 右半 cc d 的镜像），长度 7</text>

  <text x="280" y="368" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">注意 c 是 4 个：4 ÷ 2 = 2 对，用满 4 个；d 是 2 个正好 1 对；a、b 各剩 1 个只能留作中心候选</text>
</svg>
