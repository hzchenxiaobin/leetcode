<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="38" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：val 始终 = 2<tspan dy="-6" font-size="11">a</tspan><tspan dy="6"> · 3</tspan><tspan dy="-6" font-size="11">b</tspan><tspan dy="6"> · 5</tspan><tspan dy="-6" font-size="11">c</tspan></text>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（示例 2 的序列 1：nums = [4, 6, 3]，k = 2）</text>

  <rect x="32" y="88" width="92" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">val = 1</text>
  <rect x="164" y="88" width="92" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">val = 4</text>
  <rect x="296" y="88" width="92" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">val = 2/3</text>
  <rect x="428" y="88" width="92" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="474" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">val = 2</text>

  <path d="M126,109 L158,109" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="101" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">×4</text>
  <path d="M258,109 L290,109" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="101" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">÷6</text>
  <path d="M390,109 L422,109" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="101" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">×3</text>

  <path d="M78,132 L78,192" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M210,132 L210,192" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M342,132 L342,192" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M474,132 L474,192" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <rect x="32" y="196" width="92" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(0,0,0)</text>
  <rect x="164" y="196" width="92" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(2,0,0)</text>
  <rect x="296" y="196" width="92" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(1,−1,0)</text>
  <rect x="428" y="196" width="92" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="474" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(1,0,0)</text>
  <text x="474" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">恰为 k = 2 的指数 ✓</text>

  <text x="78" y="184" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">指数</text>
  <text x="210" y="184" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">指数</text>
  <text x="342" y="184" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">指数</text>
  <text x="474" y="184" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">指数</text>

  <rect x="40" y="282" width="440" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums[i] ∈ [1,6] ⇒ 质因子只有 2、3、5</text>
  <text x="260" y="338" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">乘法 = 指数 +d，除法 = 指数 −d（有理数精确除法）</text>
</svg>
