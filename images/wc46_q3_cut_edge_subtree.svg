<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">删一条边 = 切出一棵非根子树</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两半和相等 ⇔ 某棵非根子树的和恰好是总和的一半 S/2</text>

  <line x1="150" y1="100" x2="95" y2="168" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="150" y1="100" x2="205" y2="168" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <line x1="205" y1="168" x2="172" y2="240" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="205" y1="168" x2="240" y2="240" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="150" cy="100" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="105" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">5</text>
  <circle cx="95" cy="168" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="173" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">10</text>
  <circle cx="205" cy="168" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="205" y="173" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">10</text>
  <circle cx="172" cy="240" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="245" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">2</text>
  <circle cx="240" cy="240" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="245" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">3</text>

  <text x="252" y="204" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">被割的边</text>
  <text x="150" y="286" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（红色虚线为删掉的边）</text>

  <rect x="300" y="66" width="232" height="214" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="316" y="88" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">割边后的两块</text>
  <text x="316" y="114" font-size="10.5" fill="#444" filter="url(#rough2)">上：{5, 10} → 和 15</text>
  <text x="316" y="138" font-size="10.5" fill="#444" filter="url(#rough2)">下：{10, 2, 3} → 和 15</text>
  <text x="316" y="166" font-size="10" fill="#555" filter="url(#rough2)">S = 5+10+10+2+3 = 30</text>
  <text x="316" y="188" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">S / 2 = 15</text>
  <text x="316" y="214" font-size="10" fill="#555" filter="url(#rough2)">非根子树和集合</text>
  <text x="316" y="234" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">{10, 15, 2, 3} ∋ 15</text>
  <text x="316" y="260" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 返回 true</text>

  <rect x="40" y="296" width="480" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="320" font-size="10.5" fill="#555" filter="url(#rough2)">关键对应：每条边 e = (parent(v), v) ⇔ 一个非根节点 v</text>
  <text x="58" y="342" font-size="10.5" fill="#555" filter="url(#rough2)">删掉 e 后两半分别是 subtree(v) 与 T − subtree(v)</text>
  <text x="58" y="364" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">要求 sum(v) = S − sum(v)，即 sum(v) = S / 2</text>
  <text x="58" y="380" font-size="9.5" fill="#777" filter="url(#rough2)">于是只需枚举非根节点的子树和，看有没有 S/2</text>
</svg>
