<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：平方关系把值集合织成「链森林」</text>
  <path d="M 190 44 Q 340 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left panel: dedup value set -->
  <text x="60" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">① 去重后的值集合 S</text>
  <g filter="url(#sk)">
    <rect x="70" y="92" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="132" y="92" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="194" y="92" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="70" y="142" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="132" y="142" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="194" y="142" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="94" y="114" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="156" y="114" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="218" y="114" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="94" y="164" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="156" y="164" text-anchor="middle" font-size="14" fill="#333">8</text>
  <text x="218" y="164" text-anchor="middle" font-size="14" fill="#333">16</text>

  <g filter="url(#sk)">
    <path d="M 256 134 L 322 134" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <text x="289" y="124" text-anchor="middle" font-size="11" fill="#555">v 连向 v²</text>
  <text x="289" y="152" text-anchor="middle" font-size="10" fill="#888">（若 v² ∈ S）</text>

  <!-- Right panel: chain forest -->
  <text x="360" y="78" font-size="13" font-weight="bold" fill="#2e6e2e">② 平方链森林</text>
  <g filter="url(#sk)">
    <rect x="366" y="92" width="54" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="452" y="92" width="54" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="538" y="92" width="54" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <path d="M 420 110 L 448 110" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M 506 110 L 534 110" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M 592 110 L 612 110" stroke="#999" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#ar)"/>
    <rect x="616" y="92" width="54" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3"/>
  </g>
  <text x="393" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="479" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="565" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">16</text>
  <text x="643" y="114" text-anchor="middle" font-size="13" fill="#999">256</text>
  <text x="434" y="102" text-anchor="middle" font-size="10" fill="#2e6e2e">平方</text>
  <text x="520" y="102" text-anchor="middle" font-size="10" fill="#2e6e2e">平方</text>
  <text x="393" y="148" text-anchor="middle" font-size="10.5" fill="#2e6e2e">链头</text>
  <text x="643" y="150" text-anchor="middle" font-size="9.5" fill="#999">不在 S，链断</text>

  <g filter="url(#sk)">
    <rect x="380" y="178" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="470" y="178" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="560" y="178" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="404" y="200" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="494" y="200" text-anchor="middle" font-size="13" fill="#333">6</text>
  <text x="584" y="200" text-anchor="middle" font-size="13" fill="#333">8</text>
  <text x="404" y="232" text-anchor="middle" font-size="10" fill="#888">3²=9 ∉ S</text>
  <text x="494" y="232" text-anchor="middle" font-size="10" fill="#888">6²=36 ∉ S</text>
  <text x="584" y="232" text-anchor="middle" font-size="10" fill="#888">8²=64 ∉ S</text>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="40" y="262" width="612" height="84" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="60" y="290" font-size="12" font-weight="bold" fill="#2b2b2b">v ≥ 2 ⟹ v² > v：边只指向更大的值——无环，后继唯一（v²）、前驱唯一（√v），</text>
  <text x="60" y="312" font-size="12" font-weight="bold" fill="#2b2b2b">整个 S 被织成若干条互不相交的链。</text>
  <text x="60" y="336" font-size="12" fill="#444">最长方波 = 最长链：2 → 4 → 16，长度 3；链长上界 5（2→4→16→256→65536）。</text>
</svg>
