<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：向右扩展，gcd 只减不增</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#666666" filter="url(#sk)">以 nums = [9,3,1,2,6,3]，k = 3 为例：固定左端点 i = 0，窗口向右吞并元素</text>

  <!-- 数组格子 -->
  <g filter="url(#sk)">
    <rect x="142" y="70" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="202" y="70" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="262" y="70" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="322" y="70" width="56" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="382" y="70" width="56" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="442" y="70" width="56" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="170" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333" filter="url(#sk)">9</text>
  <text x="230" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333" filter="url(#sk)">3</text>
  <text x="290" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333" filter="url(#sk)">1</text>
  <text x="350" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333" filter="url(#sk)">2</text>
  <text x="410" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333" filter="url(#sk)">6</text>
  <text x="470" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333" filter="url(#sk)">3</text>
  <text x="170" y="120" text-anchor="middle" font-size="10" fill="#999999" filter="url(#sk)">j=0</text>
  <text x="230" y="120" text-anchor="middle" font-size="10" fill="#999999" filter="url(#sk)">j=1</text>
  <text x="290" y="120" text-anchor="middle" font-size="10" fill="#999999" filter="url(#sk)">j=2</text>
  <text x="350" y="120" text-anchor="middle" font-size="10" fill="#999999" filter="url(#sk)">j=3</text>
  <text x="410" y="120" text-anchor="middle" font-size="10" fill="#999999" filter="url(#sk)">j=4</text>
  <text x="470" y="120" text-anchor="middle" font-size="10" fill="#999999" filter="url(#sk)">j=5</text>

  <!-- 对齐虚线 -->
  <g stroke="#cccccc" stroke-width="1" stroke-dasharray="3,4" filter="url(#sk)">
    <path d="M 170 126 V 204"/>
    <path d="M 230 126 V 244"/>
    <path d="M 290 126 V 280"/>
    <path d="M 350 126 V 304"/>
    <path d="M 410 126 V 304"/>
    <path d="M 470 126 V 304"/>
  </g>

  <!-- 坐标轴 -->
  <path d="M 120 310 L 515 310" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 120 310 V 196" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="110" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#777777" filter="url(#sk)">g</text>
  <g stroke="#777777" stroke-width="1.2" filter="url(#sk)">
    <path d="M 170 305 V 315"/>
    <path d="M 230 305 V 315"/>
    <path d="M 290 305 V 315"/>
    <path d="M 350 305 V 315"/>
    <path d="M 410 305 V 315"/>
    <path d="M 470 305 V 315"/>
  </g>

  <!-- 阶梯折线 -->
  <path d="M 170 212 L 207 212 L 230 252 L 267 252 L 290 288" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <circle cx="170" cy="212" r="5" fill="#446688" filter="url(#sk)"/>
  <text x="170" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">9</text>
  <circle cx="230" cy="252" r="12" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#sk)"/>
  <circle cx="230" cy="252" r="6" fill="#4a7a3a" filter="url(#sk)"/>
  <text x="230" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#sk)">3 = k ✓</text>
  <circle cx="290" cy="288" r="5" fill="#b85450" filter="url(#sk)"/>
  <text x="296" y="302" text-anchor="start" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <text x="233" y="234" text-anchor="start" font-size="10" fill="#446688" filter="url(#sk)">gcd(9,3)=3</text>
  <text x="296" y="272" text-anchor="start" font-size="10" fill="#446688" filter="url(#sk)">gcd(3,1)=1</text>

  <!-- break 部分 -->
  <path d="M 290 288 H 338" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <path d="M 338 282 L 350 294 M 338 294 L 350 282" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="358" y="284" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">k ∤ 1 → break</text>
  <text x="358" y="301" text-anchor="start" font-size="10" fill="#b85450" filter="url(#sk)">后续 gcd 全是 1 的因子，永不可能 = 3</text>

  <!-- 整除链说明框 -->
  <g filter="url(#sk)">
    <rect x="90" y="344" width="460" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="363" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">整除链：g₂ ∣ g₁ ∣ g₀（本例 1 ∣ 3 ∣ 9）—— 未来每步 gcd 都整除当前 g</text>
  <text x="320" y="380" text-anchor="middle" font-size="11" fill="#8a6415" filter="url(#sk)">「还能否等于 k」由 k ∣ g 一票判定：整除则有机会，不整除则断念</text>

  <!-- 底部两个结论框 -->
  <g filter="url(#sk)">
    <rect x="58" y="398" width="252" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="184" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">k ∣ g → 继续扩展</text>
  <text x="184" y="438" text-anchor="middle" font-size="10" fill="#2e5e22" filter="url(#sk)">g == k：计数但不停——续吞 k 的倍数 g 不变</text>

  <g filter="url(#sk)">
    <rect x="340" y="398" width="252" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="466" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">k ∤ g → 立即 break</text>
  <text x="466" y="438" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">未来 gcd 都是 g 的因子，永不含 k</text>
</svg>
