<svg xmlns="http://www.w3.org/2000/svg" width="780" height="550" viewBox="0 0 780 550" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="780" height="550" fill="#fdfcf7"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：labels = "abaedcd"，逆 BFS 序逐节点处理</text>
  <path d="M 110 42 Q 390 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="100" y="54" width="250" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="225" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">BFS 序：0, 1, 2, 4, 5, 3, 6</text>
  <g filter="url(#sk)">
    <rect x="430" y="54" width="250" height="28" rx="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="555" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">逆序处理：6, 3, 5, 4, 2, 1, 0</text>
  <text x="390" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#sk)">「此刻 cnt[u]」= 处理 u 时子女贡献已全部并入（只列非零位）</text>

  <!-- ===== header ===== -->
  <text x="65" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#777777" filter="url(#sk)">步</text>
  <text x="167" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#777777" filter="url(#sk)">节点 u（标签）</text>
  <text x="309" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#777777" filter="url(#sk)">此刻 cnt[u]</text>
  <text x="451" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#777777" filter="url(#sk)">取答案</text>
  <text x="635" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#777777" filter="url(#sk)">上交合并 → 父节点</text>

  <!-- ===== row 1: u=6 ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="120" width="70" height="44" rx="18" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  </g>
  <text x="65" y="147" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" filter="url(#sk)">第 1 步</text>
  <g filter="url(#sk)">
    <rect x="112" y="120" width="110" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="167" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">u = 6（d）</text>
  <g filter="url(#sk)">
    <rect x="234" y="120" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="309" y="147" text-anchor="middle" font-size="10.5" fill="#2e5e24" filter="url(#sk)">d:1</text>
  <g filter="url(#sk)">
    <rect x="396" y="120" width="110" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="451" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">ans[6] = 1</text>
  <path d="M 509 142 L 515 142" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="520" y="120" width="230" height="44" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="635" y="147" text-anchor="middle" font-size="11" fill="#666666" filter="url(#sk)">cnt[2] += {d:1}</text>

  <!-- ===== row 2: u=3 ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="170" width="70" height="44" rx="18" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  </g>
  <text x="65" y="197" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" filter="url(#sk)">第 2 步</text>
  <g filter="url(#sk)">
    <rect x="112" y="170" width="110" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="167" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">u = 3（e）</text>
  <g filter="url(#sk)">
    <rect x="234" y="170" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="309" y="197" text-anchor="middle" font-size="10.5" fill="#2e5e24" filter="url(#sk)">e:1</text>
  <g filter="url(#sk)">
    <rect x="396" y="170" width="110" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="451" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">ans[3] = 1</text>
  <path d="M 509 192 L 515 192" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="520" y="170" width="230" height="44" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="635" y="197" text-anchor="middle" font-size="11" fill="#666666" filter="url(#sk)">cnt[2] += {e:1}</text>

  <!-- ===== row 3: u=5 ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="220" width="70" height="44" rx="18" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  </g>
  <text x="65" y="247" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" filter="url(#sk)">第 3 步</text>
  <g filter="url(#sk)">
    <rect x="112" y="220" width="110" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="167" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">u = 5（c）</text>
  <g filter="url(#sk)">
    <rect x="234" y="220" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="309" y="247" text-anchor="middle" font-size="10.5" fill="#2e5e24" filter="url(#sk)">c:1</text>
  <g filter="url(#sk)">
    <rect x="396" y="220" width="110" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="451" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">ans[5] = 1</text>
  <path d="M 509 242 L 515 242" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="520" y="220" width="230" height="44" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="635" y="247" text-anchor="middle" font-size="11" fill="#666666" filter="url(#sk)">cnt[1] += {c:1}</text>

  <!-- ===== row 4: u=4 ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="270" width="70" height="44" rx="18" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  </g>
  <text x="65" y="297" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" filter="url(#sk)">第 4 步</text>
  <g filter="url(#sk)">
    <rect x="112" y="270" width="110" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="167" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">u = 4（d）</text>
  <g filter="url(#sk)">
    <rect x="234" y="270" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="309" y="297" text-anchor="middle" font-size="10.5" fill="#2e5e24" filter="url(#sk)">d:1</text>
  <g filter="url(#sk)">
    <rect x="396" y="270" width="110" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="451" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">ans[4] = 1</text>
  <path d="M 509 292 L 515 292" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="520" y="270" width="230" height="44" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="635" y="297" text-anchor="middle" font-size="11" fill="#666666" filter="url(#sk)">cnt[1] += {d:1}</text>

  <!-- ===== row 5: u=2 ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="320" width="70" height="44" rx="18" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  </g>
  <text x="65" y="347" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" filter="url(#sk)">第 5 步</text>
  <g filter="url(#sk)">
    <rect x="112" y="320" width="110" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="167" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">u = 2（a）</text>
  <g filter="url(#sk)">
    <rect x="234" y="320" width="150" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="309" y="347" text-anchor="middle" font-size="10.5" fill="#2b4a6e" filter="url(#sk)">a:1, d:1, e:1</text>
  <g filter="url(#sk)">
    <rect x="396" y="320" width="110" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="451" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">ans[2] = 1</text>
  <path d="M 509 342 L 515 342" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="520" y="320" width="230" height="44" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="635" y="347" text-anchor="middle" font-size="11" fill="#666666" filter="url(#sk)">cnt[0] += {a:1, d:1, e:1}</text>

  <!-- ===== row 6: u=1 ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="370" width="70" height="44" rx="18" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  </g>
  <text x="65" y="397" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" filter="url(#sk)">第 6 步</text>
  <g filter="url(#sk)">
    <rect x="112" y="370" width="110" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="167" y="397" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">u = 1（b）</text>
  <g filter="url(#sk)">
    <rect x="234" y="370" width="150" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="309" y="397" text-anchor="middle" font-size="10.5" fill="#2b4a6e" filter="url(#sk)">b:1, c:1, d:1</text>
  <g filter="url(#sk)">
    <rect x="396" y="370" width="110" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="451" y="397" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">ans[1] = 1</text>
  <path d="M 509 392 L 515 392" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="520" y="370" width="230" height="44" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="635" y="397" text-anchor="middle" font-size="11" fill="#666666" filter="url(#sk)">cnt[0] += {b:1, c:1, d:1}</text>

  <!-- ===== row 7: u=0 (root, highlight) ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="420" width="70" height="44" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="65" y="447" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">第 7 步</text>
  <g filter="url(#sk)">
    <rect x="112" y="420" width="110" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="167" y="447" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">u = 0（a）</text>
  <g filter="url(#sk)">
    <rect x="234" y="420" width="150" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="309" y="437" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">a:2, b:1, c:1</text>
  <text x="309" y="453" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">d:2, e:1</text>
  <g filter="url(#sk)">
    <rect x="396" y="420" width="110" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="451" y="447" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#sk)">ans[0] = 2</text>
  <g filter="url(#sk)">
    <rect x="520" y="420" width="230" height="44" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="635" y="447" text-anchor="middle" font-size="11" fill="#666666" filter="url(#sk)">根节点，无需上交 → 结束</text>

  <!-- ===== result ===== -->
  <g filter="url(#sk)">
    <rect x="140" y="480" width="500" height="56" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="390" y="504" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e24" filter="url(#sk)">输出 ans = [2, 1, 1, 1, 1, 1, 1] ✓</text>
  <text x="390" y="525" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">节点 0 的子树里 'a' 出现 2 次（节点 0 与 2）；其余节点子树内自身标签仅 1 次</text>
</svg>
