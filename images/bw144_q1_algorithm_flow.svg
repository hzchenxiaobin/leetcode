<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：能移就移，移不动的人输</text>

  <rect x="138" y="48" width="292" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="284" y="75" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">stones = n　take = 10　alice = true</text>

  <path d="M 284 90 L 284 118" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="284,120 400,152 284,184 168,152" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="284" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">stones ≥ take ?</text>

  <!-- 是：消耗并换手，回到判断 -->
  <path d="M 400 152 C 448 152, 456 100, 434 74" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="140" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="380" y="188" width="164" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="462" y="210" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">stones −= take</text>
  <text x="462" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">take −= 1；alice = !alice</text>
  <path d="M 400 152 C 380 170, 382 186, 392 188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否：返回 -->
  <path d="M 284 184 L 284 232" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="214" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">否（当前玩家移不动）</text>

  <rect x="150" y="234" width="268" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="284" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">return !alice（卡住的是 Bob 才赢）</text>

  <text x="280" y="308" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">注意：判定用 stones ≥ take（相等也能移），返回时要取反</text>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">循环最多 7 轮，时间与空间都是 O(1)</text>
</svg>
