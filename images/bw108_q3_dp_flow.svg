<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">s = "1011" 的划分 DP：dp[j] = min(dp[i] + 1)</text>

  <!-- dp 数组 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="80" y="66" width="80" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="120" y="86" text-anchor="middle">dp[0]</text>
    <text x="120" y="104" text-anchor="middle">0</text>

    <rect x="180" y="66" width="80" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="220" y="86" text-anchor="middle">dp[1]</text>
    <text x="220" y="104" text-anchor="middle">1</text>

    <rect x="280" y="66" width="80" height="44" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
    <text x="320" y="86" text-anchor="middle">dp[2]</text>
    <text x="320" y="104" text-anchor="middle">∞</text>

    <rect x="380" y="66" width="80" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="420" y="86" text-anchor="middle">dp[3]</text>
    <text x="420" y="104" text-anchor="middle">1</text>

    <rect x="480" y="66" width="80" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="520" y="86" text-anchor="middle">dp[4]</text>
    <text x="520" y="104" text-anchor="middle" fill="#b85450">2</text>
  </g>

  <!-- 字符位置 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#555">
    <text x="120" y="134" text-anchor="middle">s[0..0]="1" ✓</text>
    <text x="220" y="134" text-anchor="middle">s[1]="0" 起跳 ✗</text>
    <text x="320" y="134" text-anchor="middle">"10" 非幂</text>
    <text x="420" y="134" text-anchor="middle">s[0..2]="101" ✓</text>
    <text x="520" y="134" text-anchor="middle">答案 = dp[4] = 2</text>
  </g>

  <!-- 转移箭头 -->
  <path d="M 140 156 C 180 172, 196 176, 216 180" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="170" font-size="11.5" fill="#446688" filter="url(#rough2)">段 "1"</text>

  <path d="M 140 190 C 270 216, 350 220, 416 224" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="212" font-size="11.5" fill="#446688" filter="url(#rough2)">段 "101"（跳过 dp[2]）</text>

  <path d="M 420 118 C 462 146, 486 152, 508 158" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="470" y="142" font-size="11.5" fill="#d6a040" filter="url(#rough2)">段 "1"</text>

  <!-- 转移式框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="240" width="520" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="320" y="264" text-anchor="middle" font-size="13.5" fill="#333">枚举最后一段 s[i..j)：若 s[i] ≠ '0' 且 s[i..j) ∈ pows</text>
    <text x="320" y="286" text-anchor="middle" font-size="13.5" fill="#4a7a3a">则 dp[j] = min(dp[j], dp[i] + 1)；dp[0] = 0</text>
  </g>

  <text x="320" y="326" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">s[i]='0' 的起点直接跳过 → s 以 '0' 开头时整题无解（dp[4] 保持 ∞ → 返回 −1）</text>
</svg>
