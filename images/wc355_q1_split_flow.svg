<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="800" height="470" fill="#fdfcf7"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：线性扫描——遇分隔符或串尾即「判空冲刷」</text>
  <path d="M 215 42 Q 400 50 585 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- A: init -->
  <g filter="url(#sk)"><rect x="300" y="50" width="160" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="380" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">ans = [ ],  cur = ε</text>
  <line x1="380" y1="88" x2="380" y2="106" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>

  <!-- B: read next char -->
  <g filter="url(#sk)"><rect x="235" y="110" width="290" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="380" y="129" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">取下一个字符 c</text>
  <text x="380" y="147" text-anchor="middle" font-size="11.5" fill="#5a7391" filter="url(#sk)">（word 扫完时，视作串尾记号 ⊥ 并切换下一 word）</text>

  <!-- B -> return -->
  <line x1="525" y1="132" x2="598" y2="132" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>
  <text x="560" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">全扫完</text>
  <g filter="url(#sk)"><rect x="604" y="110" width="176" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="692" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 ans ✓</text>

  <line x1="380" y1="154" x2="380" y2="174" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>

  <!-- C: diamond separator? -->
  <g filter="url(#sk)"><polygon points="380,178 556,224 380,270 204,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="219" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">c = separator</text>
  <text x="380" y="237" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">或 串尾 ⊥ ？</text>

  <!-- C-no -> accumulate -->
  <line x1="556" y1="224" x2="588" y2="224" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>
  <text x="570" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="590" y="202" width="180" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="680" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">cur ← cur + c</text>

  <!-- C-yes -> flush -->
  <line x1="380" y1="270" x2="380" y2="288" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>
  <text x="395" y="282" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>

  <g filter="url(#sk)"><rect x="222" y="292" width="316" height="56" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="380" y="313" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">判空冲刷：cur ≠ ε ? ans ← ans ∪ { cur }</text>
  <text x="380" y="331" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">无论是否收入，随后 cur ← ε</text>

  <!-- rails back to B -->
  <path d="M 680 246 L 680 372 L 120 372 L 120 132 L 231 132" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#sk)"/>
  <path d="M 380 348 L 380 372" fill="none" stroke="#666" stroke-width="1.4" filter="url(#sk)"/>
  <circle cx="380" cy="372" r="3" fill="#666" filter="url(#sk)"/>
  <text x="420" y="364" font-size="11" fill="#777" filter="url(#sk)">回到「取字符」——继续扫描 / 切换下一个 word</text>

  <!-- bottom notes -->
  <g filter="url(#sk)"><rect x="40" y="396" width="350" height="58" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="58" y="418" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">空段三来源（首 / 尾 / 连续分隔符）</text>
  <text x="58" y="436" font-size="10.5" fill="#555" filter="url(#sk)">到来时 cur = ε，冲刷被「判空」拦截——</text>
  <text x="58" y="450" font-size="10.5" fill="#555" filter="url(#sk)">三种来源统一处理，无需任何特判</text>

  <g filter="url(#sk)"><rect x="410" y="396" width="350" height="58" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="428" y="418" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">⊥ 串尾：每个 word 扫完做一次「尾冲刷」</text>
  <text x="428" y="436" font-size="10.5" fill="#555" filter="url(#sk)">无分隔符的 word（如 "six"）整段</text>
  <text x="428" y="450" font-size="10.5" fill="#555" filter="url(#sk)">只能靠尾冲刷入结果——这一步不能漏</text>
</svg>
