<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">转移：三个邻居取 min 再加 1</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两侧与左上同时撑住 k−1，才拼得出 k × k 的全 1 方块</text>

  <rect x="50" y="90" width="166" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="133" y="110" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">左上 dp[i−1][j−1] = 2</text>
  <text x="133" y="125" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(i−1, j−1)</text>

  <rect x="50" y="152" width="166" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="133" y="172" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">上 dp[i−1][j] = 2</text>
  <text x="133" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(i−1, j)</text>

  <rect x="50" y="214" width="166" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="133" y="234" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">左 dp[i][j−1] = 2</text>
  <text x="133" y="249" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(i, j−1)</text>

  <path d="M 218 111 L 254 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 173 L 252 173" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 235 L 254 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="284" cy="173" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="284" y="178" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">min</text>

  <path d="M 316 173 L 344 173" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="350" y="146" width="228" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="364" y="168" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">dp[i][j] = min(2, 2, 2) + 1 = 3</text>
  <text x="364" y="188" font-size="9.5" fill="#555" filter="url(#rough2)">matrix[i][j] = 1 时才做这一步</text>

  <rect x="50" y="278" width="528" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="66" y="297" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">matrix[i][j] = 0 ⇒ dp[i][j] = 0（不贡献任何正方形）</text>
  <text x="66" y="313" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">首行 i = 0 或首列 j = 0 ⇒ 没有三个邻居，dp[i][j] = matrix[i][j]</text>
</svg>
