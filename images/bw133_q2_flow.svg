<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">翻转长度 3 的算法流程</text>

  <rect x="120" y="44" width="160" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="66" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">i 从 0 扫到 n−3</text>

  <path d="M 200 78 L 200 94" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="200,96 276,124 200,152 124,124" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="129" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">nums[i] == 0 ?</text>

  <path d="M 276 124 L 318 124" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="116" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="322" y="106" width="152" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="398" y="121" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">翻转 [i, i+2]</text>
  <text x="398" y="135" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">ans += 1</text>

  <path d="M 398 142 L 398 178 L 320 178" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 200 152 L 200 176" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="206" y="170" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="120" y="180" width="160" height="34" rx="8" fill="#eeeeee" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="202" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">i += 1，回到判断</text>

  <path d="M 120 197 L 74 197 L 74 61 L 116 61" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="34" y="132" font-size="10" fill="#888" filter="url(#rough2)">继续</text>

  <path d="M 200 214 L 200 236" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="206" y="230" font-size="10" fill="#446688" filter="url(#rough2)">扫完</text>

  <rect x="82" y="240" width="236" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="262" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#rough2)">数组里还有 0 吗？</text>

  <path d="M 150 274 L 140 296" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 250 274 L 372 296" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="60" y="300" width="170" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="145" y="323" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">末尾残留 0 → −1</text>

  <rect x="286" y="300" width="186" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="379" y="323" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">全为 1 → 返回 ans</text>

  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">末尾两格没有长度 3 的窗口，只能寄希望于前面几次翻转顺带处理</text>
</svg>
