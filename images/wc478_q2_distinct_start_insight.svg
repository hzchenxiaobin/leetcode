<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：答案 = s 中不同字符的个数</text>

  <!-- 以 abab 为例：字符格子 -->
  <text x="130" y="69" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">以 "abab" 为例</text>
  <rect x="190" y="48" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="212" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="252" y="48" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="274" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="314" y="48" width="44" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="70" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">a</text>
  <rect x="376" y="48" width="44" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="70" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">b</text>

  <!-- 下标 -->
  <text x="212" y="97" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="274" y="97" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="336" y="97" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="398" y="97" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3</text>

  <!-- 首现 / 重复标记 -->
  <text x="212" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="274" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="336" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="398" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="438" y="60" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 首次出现 → 切割</text>
  <text x="438" y="78" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 重复出现 → 并入前段</text>

  <!-- 划分结果 -->
  <line x1="248" y1="136" x2="248" y2="180" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="190" y="140" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="252" y="140" width="168" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">bab</text>
  <text x="212" y="194" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">首字符 'a'</text>
  <text x="336" y="194" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">首字符 'b'</text>
  <text x="470" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">互不相同 ✓</text>
  <text x="470" y="182" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">橙色虚线 = 切割点</text>

  <!-- 两个方向的论证 -->
  <rect x="40" y="216" width="275" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="177" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">上界 · 鸽笼原理</text>
  <text x="177" y="258" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">k 段需要 k 个互不相同的首字符</text>
  <text x="177" y="277" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">而 s 只有 |D| 种字符 ⇒ k ≤ |D|</text>
  <rect x="325" y="216" width="275" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="462" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">构造 · 首现切割</text>
  <text x="462" y="258" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">每个字符在首次出现的位置切一刀</text>
  <text x="462" y="277" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">恰好 |D| 段，首字符两两不同 ✓</text>

  <!-- 结论 -->
  <rect x="40" y="306" width="560" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">答案 = |D| = s 中不同字符的个数（≤ 26）</text>
  <text x="320" y="347" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">扫描一遍，遇到新字符就计数（= 在其首次出现处切割）</text>

  <!-- 备注 -->
  <rect x="40" y="372" width="560" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="390" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">位置 0 永远是切割点（第一段必须从 s[0] 开始）</text>
  <text x="320" y="408" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">重复出现的字符无法再开新段，只能并入当前段——"abab" 后半段并入 "bab"</text>
</svg>
