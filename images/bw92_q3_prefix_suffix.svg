<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="57"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">关门时刻 j：代价 = 前缀 N 数 + 后缀 Y 数</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">customers = "Y Y N Y"，在第 j 小时关门：[0, j) 开门、[j, n) 关门</text>

  <g filter="url(#rough2)">
    <rect x="60" y="80" width="80" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="140" y="80" width="80" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="220" y="80" width="80" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="300" y="80" width="80" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <text x="100" y="112" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="180" y="112" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="260" y="112" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">N</text>
  <text x="340" y="112" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="100" y="150" text-anchor="middle" font-size="10" fill="#999">第 0 小时</text>
  <text x="180" y="150" text-anchor="middle" font-size="10" fill="#999">第 1 小时</text>
  <text x="260" y="150" text-anchor="middle" font-size="10" fill="#999">第 2 小时</text>
  <text x="340" y="150" text-anchor="middle" font-size="10" fill="#999">第 3 小时</text>

  <line x1="236" y1="66" x2="236" y2="164" stroke="#d6a040" stroke-width="2.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="236" y="58" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">j = 2（此处关门）</text>

  <path d="M 62 172 L 230 172" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="146" y="188" text-anchor="middle" font-size="10.5" fill="#4a7a3a">开门时段：统计 N（没有顾客）</text>
  <path d="M 242 172 L 384 172" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="312" y="188" text-anchor="middle" font-size="10.5" fill="#b85450">关门时段：统计 Y（顾客扑空）</text>

  <rect x="60" y="212" width="220" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="170" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">prefixN[j] = Σ [s[t]='N'], t&lt;j</text>
  <text x="170" y="256" text-anchor="middle" font-size="10.5" fill="#555">j 增 1 时：s[j−1]='N' 则 +1，否则不变</text>

  <rect x="300" y="212" width="220" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="236" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">suffixY[j] = Σ [s[t]='Y'], t≥j</text>
  <text x="410" y="256" text-anchor="middle" font-size="10.5" fill="#555">j 增 1 时：s[j−1]='Y' 则 −1（移出关门段）</text>

  <rect x="60" y="290" width="460" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">penalty(j) = prefixN[j] + suffixY[j]，j = 0..n 共 n+1 个候选</text>
  <text x="290" y="332" text-anchor="middle" font-size="10.5" fill="#555">j 从小到大扫，严格小于才更新 → 天然取「最早」的最优关门时间</text>

  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#999">初始 penalty(0) = suffixY(0) = 全串 Y 个数（第 0 小时关门 = 全程关门）</text>
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#999">j = n 时关门 = 全程营业，penalty(n) = 全串 N 个数</text>
</svg>
