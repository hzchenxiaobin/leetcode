<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：两组官方样例的全部候选</text>

  <!-- 例 1 -->
  <text x="60" y="64" font-size="14" fill="#2f4a66" filter="url(#rough2)">例 1：nums = [12, 9]，k = 1</text>
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="60" y="76" width="190" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="76" y="96" fill="#2f4a66">给 12：24 | 9</text>
    <text x="76" y="114" fill="#2f4a66">= 11001 = 25</text>

    <rect x="270" y="76" width="190" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="286" y="96" fill="#2f5527">给 9：12 | 18</text>
    <text x="286" y="114" fill="#2f5527">= 11110 = 30 ★</text>
  </g>

  <!-- 例 2 -->
  <text x="60" y="164" font-size="14" fill="#2f4a66" filter="url(#rough2)">例 2：nums = [8, 1, 2]，k = 2</text>
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="60" y="176" width="130" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="125" y="196" text-anchor="middle" fill="#2f5527">给 8：32|1|2</text>
    <text x="125" y="214" text-anchor="middle" fill="#2f5527">= 100011 = 35 ★</text>

    <rect x="205" y="176" width="130" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="270" y="196" text-anchor="middle" fill="#2f4a66">给 1：8|4|2</text>
    <text x="270" y="214" text-anchor="middle" fill="#2f4a66">= 1110 = 14</text>

    <rect x="350" y="176" width="130" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="415" y="196" text-anchor="middle" fill="#2f4a66">给 2：8|1|8</text>
    <text x="415" y="214" text-anchor="middle" fill="#2f4a66">= 1001 = 9</text>
  </g>

  <!-- 警示 -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="238" width="420" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="76" y="260" fill="#8c3a36">“至多 k 次”的警示样例：nums = [1, 2], k = 1</text>
    <text x="76" y="280" fill="#8c3a36">不动手 = 3；给 1 → 2|2 = 2（反而更小！）</text>
    <text x="76" y="300" fill="#8c3a36">但给 2 → 1|4 = 5 —— 定理保证：最优值必是某个“单元素吃满 k 次”的候选。</text>
  </g>
</svg>
