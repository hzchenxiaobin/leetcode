<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">算法流程：哈希分组 + 二分定位 + 前驱后继</text>

  <!-- 步骤 1：建表 -->
  <rect x="180" y="44" width="280" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">一遍扫描建哈希表 pos</text>
  <text x="320" y="82" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">值 → 有序下标列表（天然升序）</text>

  <path d="M 320,92 L 320,112" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2：取查询 -->
  <rect x="180" y="114" width="280" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个查询 q</text>
  <text x="320" y="152" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">v ← pos[nums[q]]，m = |v|</text>

  <path d="M 320,162 L 320,182" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3：判断菱形 -->
  <polygon points="320,184 424,224 320,264 216,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m = 1 ？</text>

  <!-- 是分支 -->
  <path d="M 424,224 L 482,224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="447" y="215" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="484" y="202" width="132" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="229" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">answer ← −1</text>

  <!-- 否分支 -->
  <path d="M 320,264 L 320,286" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="333" y="280" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 步骤 4：二分 -->
  <rect x="180" y="288" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="313" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">二分定位 idx（v[idx] = q）</text>

  <path d="M 320,328 L 320,350" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 5：前驱后继 -->
  <rect x="150" y="352" width="340" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prev = v[(idx − 1 + m) % m]</text>
  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">next = v[(idx + 1) % m]</text>

  <path d="M 320,400 L 320,422" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 6：取 min -->
  <rect x="150" y="424" width="340" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="446" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">answer ← min( rd(q, prev), rd(q, next) )</text>
  <text x="320" y="466" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">rd(a, b) = min( |a − b| , n − |a − b| )</text>

  <!-- 循环回边 -->
  <path d="M 150,452 C 66,452 66,138 178,138" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="300" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">循</text>
  <text x="82" y="314" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">环</text>
  <text x="105" y="336" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">所有查询</text>
  <text x="105" y="352" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">处理完返回</text>
</svg>
