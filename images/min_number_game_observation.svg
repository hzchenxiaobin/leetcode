<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">最小数字游戏：每轮模拟 ⟶ 排序 + 两两交换</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: one round flow ===== -->
  <text x="470" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 每轮操作流程（记 Alice 拿的为 x、Bob 拿的为 y，x ≤ y，共 n/2 轮）</text>

  <g filter="url(#sk)"><rect x="66" y="96" width="188" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="160" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">Alice 移除</text>
  <text x="160" y="143" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">当前最小 x</text>

  <g filter="url(#sk)"><rect x="278" y="96" width="188" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="372" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">Bob 移除</text>
  <text x="372" y="143" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">剩余最小 y</text>

  <g filter="url(#sk)"><rect x="490" y="96" width="188" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="584" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">Bob 先把 y</text>
  <text x="584" y="143" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">放入 arr</text>

  <g filter="url(#sk)"><rect x="702" y="96" width="188" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="796" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">Alice 再把 x</text>
  <text x="796" y="143" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">放入 arr</text>

  <g filter="url(#sk)"><circle cx="160" cy="96" r="11" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="160" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><circle cx="372" cy="96" r="11" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="372" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="584" cy="96" r="11" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="584" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><circle cx="796" cy="96" r="11" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="796" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>

  <path d="M 258 125 L 272 125" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 470 125 L 484 125" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 682 125 L 696 125" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 796 158 L 796 176 L 160 176 L 160 162" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="478" y="170" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">nums 非空 → 下一轮</text>

  <g filter="url(#sk)"><rect x="170" y="192" width="600" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="470" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">每一轮向 arr 追加一对 [ y , x ] —— Bob 的较大值排在前面！</text>

  <!-- ===== Panel B: sort + swap pairs ===== -->
  <text x="470" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 等价做法：排序 → 相邻两两一组 → 组内交换</text>

  <text x="90" y="318" font-size="12" fill="#555" filter="url(#sk)">排序后 s =</text>
  <g filter="url(#sk)"><rect x="170" y="292" width="74" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="207" y="319" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="250" y="292" width="74" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="287" y="319" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="330" y="292" width="74" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="367" y="319" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="410" y="292" width="74" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="447" y="319" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>

  <path d="M 172 338 Q 247 345 322 338" stroke="#999" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 332 338 Q 407 345 482 338" stroke="#999" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="247" y="360" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">第0组：Alice 拿 2、Bob 拿 3</text>
  <text x="407" y="360" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">第1组：Alice 拿 4、Bob 拿 5</text>

  <path d="M 530 313 L 530 352" stroke="#b03a3a" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="556" y="288" width="324" height="80" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="574" y="312" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">每轮放入顺序</text>
  <text x="574" y="334" font-size="11" fill="#444" filter="url(#sk)">Bob 先放 y（较大）→ Alice 再放 x</text>
  <text x="574" y="356" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#sk)">⟹ 每组输出为 ( y , x )</text>

  <text x="90" y="394" font-size="12" fill="#555" filter="url(#sk)">输出 arr =</text>
  <g filter="url(#sk)"><rect x="170" y="368" width="74" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="207" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="250" y="368" width="74" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="287" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="330" y="368" width="74" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="367" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="410" y="368" width="74" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="447" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>

  <text x="207" y="428" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">Bob先</text>
  <text x="287" y="428" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">Alice后</text>
  <text x="367" y="428" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">Bob先</text>
  <text x="447" y="428" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">Alice后</text>

  <g filter="url(#sk)"><rect x="66" y="452" width="486" height="92" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="86" y="478" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">③ 一句话实现</text>
  <text x="86" y="504" font-size="12" font-family="monospace" fill="#333" filter="url(#sk)">sort(nums);</text>
  <text x="86" y="526" font-size="12" font-family="monospace" fill="#333" filter="url(#sk)">for (i=0; i&lt;n; i+=2) swap(nums[i], nums[i+1]);</text>

  <g filter="url(#sk)"><rect x="572" y="452" width="312" height="92" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="592" y="478" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">复杂度</text>
  <text x="592" y="504" font-size="11" fill="#444" filter="url(#sk)">时间：O(n log n)（排序主导）</text>
  <text x="592" y="526" font-size="11" fill="#444" filter="url(#sk)">空间：O(1)（原地交换）</text>

  <g filter="url(#sk)"><rect x="66" y="566" width="818" height="112" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="86" y="592" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">关键洞察</text>
  <text x="86" y="616" font-size="11" fill="#444" filter="url(#sk)">· 「移除当前最小」只与集合有关、与位置无关 → 预先排序不改变游戏结果</text>
  <text x="86" y="638" font-size="11" fill="#444" filter="url(#sk)">· 排序后第 k 轮恰好移除 s[2k]（Alice）与 s[2k+1]（Bob）</text>
  <text x="86" y="660" font-size="11" fill="#b03a3a" filter="url(#sk)">· 放入时 Bob 在前 → 每组输出 (大, 小)，即排序后相邻两两交换</text>
</svg>
