<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="330" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">n 从小到大：答案在 n ≥ 3 后只由位数决定</text>
  <text x="270" y="47" text-anchor="middle" font-size="11" fill="#888">答案 = 2^(msb(n)+1)，即「大于 n 的最小 2 的幂」</text>

  <rect x="40" y="62" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">n</text>
  <rect x="110" y="62" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="165" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">msb / M</text>
  <rect x="220" y="62" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">不同异或数</text>
  <rect x="340" y="62" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">说明</text>

  <rect x="40" y="98" width="70" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="118" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="110" y="98" width="110" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="118" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="220" y="98" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">1</text>
  <rect x="340" y="98" width="160" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="118" text-anchor="middle" font-size="9.5" fill="#888">只有 1⊕1⊕1 = 1，特判</text>

  <rect x="40" y="132" width="70" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="152" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="110" y="132" width="110" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="152" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="220" y="132" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">2</text>
  <rect x="340" y="132" width="160" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="152" text-anchor="middle" font-size="9.5" fill="#888">{1, 2}，白送 n 个</text>

  <rect x="40" y="166" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="186" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="110" y="166" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="165" y="186" text-anchor="middle" font-size="10" fill="#8a6a20">b=1, M=2</text>
  <rect x="220" y="166" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">4</text>
  <rect x="340" y="166" width="160" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="186" text-anchor="middle" font-size="9.5" fill="#888">{0,1,2,3} 全部取满</text>

  <rect x="40" y="200" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="220" text-anchor="middle" font-size="10.5" fill="#333">4…7</text>
  <rect x="110" y="200" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="165" y="220" text-anchor="middle" font-size="10" fill="#8a6a20">b=2, M=4</text>
  <rect x="220" y="200" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">8</text>
  <rect x="340" y="200" width="160" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="220" text-anchor="middle" font-size="9.5" fill="#888">{0,…,7} 全部取满</text>

  <rect x="40" y="234" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="254" text-anchor="middle" font-size="10.5" fill="#333">8…15</text>
  <rect x="110" y="234" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="165" y="254" text-anchor="middle" font-size="10" fill="#8a6a20">b=3, M=8</text>
  <rect x="220" y="234" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">16</text>
  <rect x="340" y="234" width="160" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="254" text-anchor="middle" font-size="9.5" fill="#888">{0,…,15} 全部取满</text>

  <text x="270" y="292" text-anchor="middle" font-size="10.5" fill="#777">区间 [2^b, 2^(b+1)) 内 n 再大，答案都不变——因为 nums 里没有更高位的数字</text>
  <text x="270" y="312" text-anchor="middle" font-size="10" fill="#999">n = 10^5 时 msb = 16，答案 = 131072，一次位运算即可</text>
</svg>
