<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">一行 10 座压成 8 位掩码，查表得该行组数</text>

  <!-- 位压缩示意 -->
  <g filter="url(#rough2)" font-size="11.5" fill="#666" text-anchor="middle">
    <text x="170" y="60">座位号</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="70" y="68" width="25" height="30" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="95" y="68" width="25" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="120" y="68" width="25" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="145" y="68" width="25" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="170" y="68" width="25" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="195" y="68" width="25" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="220" y="68" width="25" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="245" y="68" width="25" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="270" y="68" width="25" height="30" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="82" y="88">1</text>
    <text x="107" y="88">2</text>
    <text x="132" y="88">3</text>
    <text x="158" y="88">4</text>
    <text x="183" y="88">5</text>
    <text x="208" y="88">6</text>
    <text x="233" y="88">7</text>
    <text x="258" y="88">8</text>
    <text x="283" y="88">9</text>
  </g>
  <text x="182" y="122" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)" text-anchor="middle">座位 s 映射到位 (s−2)，座位 1 与 10 不属于任何块、直接丢弃</text>
  <path d="M 182 130 C 182 142, 182 148, 182 156" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 三个块掩码 -->
  <g filter="url(#rough2)">
    <rect x="50" y="164" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#2b4a6b" text-anchor="middle">
    <text x="125" y="182" font-weight="bold">A（座位 2..5）</text>
    <text x="125" y="199">0b00001111 = 0x0F</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="205" y="164" width="150" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22" text-anchor="middle">
    <text x="280" y="182" font-weight="bold">B（座位 4..7）</text>
    <text x="280" y="199">0b00111100 = 0x3C</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="360" y="164" width="150" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#8a3833" text-anchor="middle">
    <text x="435" y="182" font-weight="bold">C（座位 6..9）</text>
    <text x="435" y="199">0b11110000 = 0xF0</text>
  </g>

  <!-- 判定逻辑 -->
  <rect x="50" y="226" width="460" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e">
    <text x="280" y="250" text-anchor="middle" font-weight="bold">对每行掩码 mask（哈希表聚合后）：</text>
    <text x="280" y="272" text-anchor="middle">mask &amp; 0xFF == 0 → +2 组（A、C 同时可用）</text>
    <text x="280" y="292" text-anchor="middle">否则 mask 与 A、B、C 之一按位与为 0 → +1 组</text>
  </g>

  <text x="280" y="330" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">同一行多次预约用「按位或」聚合到同一个 mask 上</text>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">复杂度 O(m)（m 为预约数），与 n 无关</text>
</svg>
