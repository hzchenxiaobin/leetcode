<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">漏一种刀法就漏解：只有「⑤ 右整左切」能达到最优 7</text>
  <path d="M 190 44 Q 470 52 750 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 左：5×5 反例网格 ============ -->
  <text x="235" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b">反例网格：5×5，1 在 (0,0) (4,0) (0,4) (2,4) (4,4)</text>

  <!-- 网格 25 格，cell=50，起点 (100,110) -->
  <g filter="url(#sk2)">
    <rect x="100" y="110" width="50" height="50" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="150" y="110" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="200" y="110" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="250" y="110" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="300" y="110" width="50" height="50" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="100" y="160" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="150" y="160" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="200" y="160" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="250" y="160" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="300" y="160" width="50" height="50" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="100" y="210" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="150" y="210" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="200" y="210" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="250" y="210" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="300" y="210" width="50" height="50" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="100" y="260" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="150" y="260" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="200" y="260" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="250" y="260" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="300" y="260" width="50" height="50" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="100" y="310" width="50" height="50" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="150" y="310" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="200" y="310" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="250" y="310" width="50" height="50" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="300" y="310" width="50" height="50" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <!-- 0 / 1 数字 -->
  <g font-size="12" text-anchor="middle" fill="#b0aca2">
    <text x="175" y="140">0</text><text x="225" y="140">0</text><text x="275" y="140">0</text>
    <text x="125" y="190">0</text><text x="175" y="190">0</text><text x="225" y="190">0</text><text x="275" y="190">0</text>
    <text x="125" y="240">0</text><text x="175" y="240">0</text><text x="225" y="240">0</text><text x="275" y="240">0</text>
    <text x="125" y="290">0</text><text x="175" y="290">0</text><text x="225" y="290">0</text><text x="275" y="290">0</text>
    <text x="175" y="340">0</text><text x="225" y="340">0</text><text x="275" y="340">0</text>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="125" y="140" fill="#2b4a70">1</text>
    <text x="125" y="340" fill="#3a5a2e">1</text>
    <text x="325" y="140" fill="#7a5415">1</text>
    <text x="325" y="240" fill="#7a5415">1</text>
    <text x="325" y="340" fill="#7a5415">1</text>
  </g>

  <!-- 刀线：c=2 竖刀（全高），r=2 横刀（只切左半） -->
  <path d="M 200 98 L 200 374" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <path d="M 88 210 L 200 210" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <text x="200" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a2e">c = 2</text>
  <text x="80" y="205" text-anchor="end" font-size="11" font-weight="bold" fill="#3a5a2e">r = 2</text>

  <!-- 三个包围盒 -->
  <g filter="url(#sk2)">
    <rect x="96" y="106" width="58" height="58" rx="8" fill="#e8f0fe" fill-opacity="0.28" stroke="#446688" stroke-width="2.4"/>
    <rect x="96" y="306" width="58" height="58" rx="8" fill="#e6f4ea" fill-opacity="0.28" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="296" y="106" width="58" height="258" rx="8" fill="#fff8e1" fill-opacity="0.28" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="125" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a70">1×1 = 1</text>
  <text x="125" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a2e">1×1 = 1</text>
  <text x="325" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">5×1 = 5</text>
  <g filter="url(#sk2)">
    <rect x="130" y="396" width="210" height="30" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="235" y="416" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a2e">5 + 1 + 1 = 7 ✓</text>

  <!-- ============ 右：六种刀法成绩表 ============ -->
  <text x="715" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b">六种刀法各自能达到的最优值</text>
  <g filter="url(#sk2)">
    <rect x="530" y="94" width="370" height="46" rx="6" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="530" y="140" width="370" height="46" rx="6" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="530" y="186" width="370" height="46" rx="6" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="530" y="232" width="370" height="46" rx="6" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="530" y="278" width="370" height="46" rx="6" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="530" y="324" width="370" height="46" rx="6" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#444">
    <text x="548" y="122">① 三横条「三」</text>
    <text x="548" y="168">② 三竖条「川」</text>
    <text x="548" y="214">③ 上整下切</text>
    <text x="548" y="260">④ 下整上切</text>
    <text x="548" y="306" font-weight="bold" fill="#3a5a2e">⑤ 右整左切</text>
    <text x="548" y="352">⑥ 左整右切</text>
  </g>
  <g font-size="13.5" font-weight="bold" text-anchor="middle">
    <text x="832" y="123" fill="#b03a3a">11</text>
    <text x="832" y="169" fill="#b03a3a">10</text>
    <text x="832" y="215" fill="#b03a3a">9</text>
    <text x="832" y="261" fill="#b03a3a">9</text>
    <text x="832" y="307" fill="#3a5a2e">7 ✓</text>
    <text x="832" y="353" fill="#b03a3a">9</text>
  </g>
  <text x="715" y="396" text-anchor="middle" font-size="11" fill="#888">数值 = 该刀法族内所有切点位置的最小总代价</text>

  <!-- ============ 底部注记 ============ -->
  <g filter="url(#sk)">
    <rect x="60" y="440" width="840" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="85" y="468" font-size="13" font-weight="bold" fill="#7a5415">为什么只有 ⑤ 行：右列三个 1 隔行分布，必须整条划成一段（5×1）</text>
  <text x="85" y="492" font-size="11.5" fill="#444">左列上下两个孤立点再由半截横刀各分一段（1 + 1）——竖刀先下、左半再切，缺一不可</text>
  <text x="85" y="516" font-size="11.5" font-weight="bold" fill="#b03a3a">赛时少写一个 T 型朝向，这个用例就直接 WA——四种 T 型朝向一个都不能漏</text>
</svg>
