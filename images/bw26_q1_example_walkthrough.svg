<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    示例演算：两个输入的游程统计
  </text>

  <!-- 例 1：leetcode -->
  <text x="90" y="70" font-size="14" fill="#446688" filter="url(#rough2)">s = "leetcode"</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="40" y="82" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="74" y="82" width="68" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="142" y="82" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="176" y="82" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="210" y="82" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="244" y="82" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="278" y="82" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="57" y="104" text-anchor="middle" fill="#446688">l</text>
    <text x="108" y="104" text-anchor="middle" fill="#2f5a24" font-weight="bold">e e</text>
    <text x="159" y="104" text-anchor="middle" fill="#446688">t</text>
    <text x="193" y="104" text-anchor="middle" fill="#8a6a1a">c</text>
    <text x="227" y="104" text-anchor="middle" fill="#8a6a1a">o</text>
    <text x="261" y="104" text-anchor="middle" fill="#8a6a1a">d</text>
    <text x="295" y="104" text-anchor="middle" fill="#446688">e</text>
  </g>
  <text x="100" y="148" font-size="13" fill="#666" filter="url(#rough2)">
    游程长度 1, 2, 1, 1, 1, 1, 1 ⇒ 能量 2
  </text>
  <text x="360" y="104" font-size="15" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">
    输出 2 ✓
  </text>

  <!-- 分隔 -->
  <path d="M 60 168 C 200 174, 320 174, 460 168" stroke="#d6a040" stroke-width="1.5"
        stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>

  <!-- 例 2：abbcccddddeeeeedcba -->
  <text x="90" y="202" font-size="14" fill="#b85450" filter="url(#rough2)">
    s = "abbcccddddeeeeedcba"
  </text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="40" y="214" width="26" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="66" y="214" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="118" y="214" width="78" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="196" y="214" width="104" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="300" y="214" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.6" rx="4"/>
    <rect x="430" y="214" width="26" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="456" y="214" width="26" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="53" y="236" text-anchor="middle" fill="#446688">a</text>
    <text x="92" y="236" text-anchor="middle" fill="#2f5a24">bb</text>
    <text x="157" y="236" text-anchor="middle" fill="#8a6a1a">ccc</text>
    <text x="248" y="236" text-anchor="middle" fill="#b85450">dddd</text>
    <text x="365" y="236" text-anchor="middle" fill="#446688" font-weight="bold">eeeee</text>
    <text x="443" y="236" text-anchor="middle" fill="#2f5a24">d</text>
    <text x="469" y="236" text-anchor="middle" fill="#8a6a1a">c</text>
  </g>
  <text x="100" y="282" font-size="13" fill="#666" filter="url(#rough2)">
    游程长度 1, 2, 3, 4, 5, 1, 1 ⇒ 能量 5
  </text>
  <text x="360" y="236" font-size="15" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">
    输出 5 ✓
  </text>

  <!-- 底部说明 -->
  <rect x="90" y="286" width="340" height="0" fill="none" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">
    不同颜色的格子块 = 游程；加粗描边的块 = 最长游程
  </text>
</svg>
