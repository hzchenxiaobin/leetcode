<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="840" height="470" fill="#fafafa"/>

  <text x="420" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">网关 M = P_i：j &gt; r_i 时，最短路一定先踩到 M</text>
  <path d="M 152 40 Q 420 47 688 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 数轴：i 到 t 到 M 的分段 -->
  <line x1="70" y1="118" x2="790" y2="118" stroke="#8a8a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 70 118 L 62 113 M 70 118 L 62 123" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 790 118 L 798 113 M 790 118 L 798 123" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 分段着色 -->
  <rect x="132" y="104" width="196" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="332" y="104" width="212" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="548" y="104" width="24" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="578" y="104" width="206" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="230" y="123" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">f = 2（先去 t 再左跳）</text>
  <text x="438" y="123" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">f = 3，个别位置 2</text>
  <text x="560" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="682" y="123" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">f = 2 + f(M, j)</text>

  <!-- 刻度标签 -->
  <circle cx="132" cy="118" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="330" cy="118" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="560" cy="118" r="4" fill="#4a7a3a" filter="url(#rough2)"/>

  <text x="132" y="92" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">i</text>
  <text x="330" y="92" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">t = r_i</text>
  <text x="560" y="92" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">M = P_i</text>
  <text x="684" y="92" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">M 之后</text>

  <!-- 网关路径：i -> 左跳到 k* -> 右跳到 M -->
  <path d="M 132 146 Q 220 190 330 146" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="182" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">右跳：i → t（1 步）</text>
  <path d="M 132 172 Q 300 236 556 158" stroke="#b85450" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="254" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">先左跳到 k*（to[k*] = M）再右跳到 M：2 步，之后与 M 完全一样</text>

  <!-- 三个情况盒子 -->
  <rect x="36" y="272" width="252" height="150" rx="10" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="162" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a5a5a" filter="url(#rough2)">情况 1：r_i 不存在</text>
  <text x="162" y="322" text-anchor="middle" font-size="12" fill="#6a6a6a" filter="url(#rough2)">p_i 是后缀最大值</text>
  <text x="162" y="348" text-anchor="middle" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">S_i = 0，A_i = 0</text>
  <text x="162" y="376" text-anchor="middle" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">右侧一个点都到不了，</text>
  <text x="162" y="396" text-anchor="middle" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">只剩 i−1 个左目标</text>

  <rect x="300" y="272" width="248" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="424" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">情况 2：M = t</text>
  <text x="424" y="322" text-anchor="middle" font-size="11.5" fill="#4a6a3a" filter="url(#rough2)">t 就是前缀最优落点</text>
  <text x="424" y="346" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">j &gt; t 时 f = 1 + f(t, j)</text>
  <text x="424" y="374" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">S_i = 2(t−i−1) + 1 + S_t + A_t</text>
  <text x="424" y="400" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">A_i = (t−i) + A_t</text>

  <rect x="560" y="272" width="244" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="682" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">情况 3：M &gt; t</text>
  <text x="682" y="320" text-anchor="middle" font-size="11.5" fill="#94702a" filter="url(#rough2)">S_i = 2(t−i−1) + 3(M−t−1)</text>
  <text x="682" y="342" text-anchor="middle" font-size="11.5" fill="#94702a" filter="url(#rough2)">− C_i + 3 + S_M + 2A_M</text>
  <text x="682" y="366" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">A_i = (M−i) + A_M</text>
  <text x="682" y="390" text-anchor="middle" font-size="11" fill="#a58a55" filter="url(#rough2)">C_i：(t,M) 中两步可达</text>
  <text x="682" y="408" text-anchor="middle" font-size="11" fill="#a58a55" filter="url(#rough2)">的位置数（要去重）</text>

  <text x="420" y="452" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">t、M 都严格大于 i ⇒ 从 n 往 1 倒序即可 O(1) 转移；C_i 用树状数组区间查不同值</text>
</svg>
