<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">策略：优先删除得分更高的那种子串</text>

  <rect x="210" y="46" width="100" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">输入 s, x, y</text>

  <path d="M260,82 L260,104" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,106 344,142 260,178 176,142" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">x ≥ y ?</text>

  <path d="M176,142 L96,142 L96,190" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M344,142 L424,142 L424,190" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="132" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="380" y="132" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="26" y="192" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="96" y="214" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">第一遍：栈删 "ab"</text>
  <text x="96" y="234" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">每删一对 +x</text>

  <rect x="354" y="192" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="424" y="214" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">第一遍：栈删 "ba"</text>
  <text x="424" y="234" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">每删一对 +y</text>

  <path d="M96,250 Q96,278 200,288" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M424,250 Q424,278 320,288" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="274" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">第二遍：在剩余串上</text>
  <text x="260" y="310" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">删另一种子串</text>

  <text x="260" y="348" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">总分 = 两遍栈扫描得分之和，x = y 时两种顺序等价</text>
</svg>
