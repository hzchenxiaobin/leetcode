<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="448" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">贪心步长：单步最小增量 = 最小质因子 p = spf(x)</text>
  <path d="M 140 37 Q 320 45 500 37" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: even -->
  <text x="40" y="66" text-anchor="start" font-size="13" fill="#2b6e9e" font-weight="bold">① value 为偶数：全程每步 +2，答案 = value + 2m</text>
  <g filter="url(#sk)">
    <rect x="58" y="78" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="150" y="78" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="248" y="78" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="376" y="78" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="83" y="99" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">v</text>
  <text x="178" y="99" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">v+2</text>
  <text x="276" y="99" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">v+4</text>
  <text x="326" y="99" text-anchor="middle" font-size="14" fill="#2b6e9e">⋯</text>
  <text x="411" y="99" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">v+2m</text>
  <path d="M 112 95 L 144 95" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 210 95 L 242 95" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 338 95 L 370 95" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="129" y="74" text-anchor="middle" font-size="10" fill="#666">+2</text>
  <text x="227" y="74" text-anchor="middle" font-size="10" fill="#666">+2</text>
  <text x="355" y="74" text-anchor="middle" font-size="10" fill="#666">+2</text>
  <text x="466" y="92" text-anchor="start" font-size="10.5" fill="#666">全偶数链</text>
  <text x="466" y="108" text-anchor="start" font-size="10.5" fill="#666">相邻 gcd ≥ 2</text>

  <!-- Row 2: odd -->
  <text x="40" y="148" text-anchor="start" font-size="13" fill="#8a6415" font-weight="bold">② value 为奇数：先 +p 落到偶数，再每步 +2，答案 = value + p + 2(m−1)</text>
  <g filter="url(#sk)">
    <rect x="58" y="160" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="150" y="160" width="62" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="254" y="160" width="76" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="398" y="160" width="104" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="83" y="181" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">v</text>
  <text x="129" y="155" text-anchor="middle" font-size="10" fill="#8a6415" font-weight="bold">+p（p = spf(v)）</text>
  <text x="181" y="181" text-anchor="middle" font-size="12.5" fill="#8a6415" font-weight="bold">v+p</text>
  <text x="181" y="155" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">偶数!</text>
  <text x="292" y="181" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">v+p+2</text>
  <text x="348" y="181" text-anchor="middle" font-size="14" fill="#2e6e2e">⋯</text>
  <text x="450" y="181" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">v+p+2(m−1)</text>
  <path d="M 112 177 L 144 177" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 216 177 L 248 177" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 360 177 L 392 177" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="233" y="155" text-anchor="middle" font-size="10" fill="#666">+2</text>
  <text x="377" y="155" text-anchor="middle" font-size="10" fill="#666">+2</text>
  <text x="320" y="224" text-anchor="middle" font-size="11" fill="#666">例：value = 9，spf(9) = 3 ⇒ 9 → 12 → 14 → 16 → ⋯（从 12 起全偶，之后每步 +2）</text>

  <!-- Row 3: left segment -->
  <text x="40" y="252" text-anchor="start" font-size="13" fill="#2e6e2e" font-weight="bold">③ 左段：顶端锚定 E = value − p（必为偶数），向下每步 −2，最长 (value−p)/2 个</text>
  <g filter="url(#sk)">
    <rect x="58" y="264" width="110" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="210" y="264" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="310" y="264" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="436" y="264" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="113" y="285" text-anchor="middle" font-size="11" fill="#8a6415" font-weight="bold">E = value−p</text>
  <text x="239" y="285" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">E−2</text>
  <text x="339" y="285" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">E−4</text>
  <text x="386" y="285" text-anchor="middle" font-size="14" fill="#2b6e9e">⋯</text>
  <text x="458" y="285" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">2</text>
  <path d="M 172 281 L 204 281" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 272 281 L 304 281" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 398 281 L 430 281" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="189" y="259" text-anchor="middle" font-size="10" fill="#666">−2</text>
  <text x="289" y="259" text-anchor="middle" font-size="10" fill="#666">−2</text>
  <text x="415" y="259" text-anchor="middle" font-size="10" fill="#666">−2</text>
  <text x="320" y="324" text-anchor="middle" font-size="11" fill="#666">例：value = 15，p = 3，E = 12 ⇒ 2,4,6,8,10,12（恰 (15−3)/2 = 6 个），顶端 gcd(12,15) = 3 ✓</text>

  <!-- identity box -->
  <g filter="url(#sk)">
    <rect x="40" y="348" width="560" height="88" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="320" y="376" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">关键恒等式：gcd(a, b) = gcd(a, b−a) ⇒ gcd(x, x+d) = gcd(x, d)，连接性只由步长决定</text>
  <text x="320" y="398" text-anchor="middle" font-size="12" fill="#2b6e9e">d = 1 ⇒ gcd(x, x+1) = 1（相邻整数互质）⇒ 任何合法步长 d ≥ 2</text>
  <text x="320" y="420" text-anchor="middle" font-size="12" fill="#2b6e9e">要 gcd(x, d) &gt; 1，d 必须含 x 的质因子 ⇒ 单步最小增量 = spf(x)</text>
</svg>
