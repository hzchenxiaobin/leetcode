<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n = 2943</text>
  <path d="M 240 40 Q 320 48 400 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数位 -->
  <g filter="url(#sk)"><rect x="180" y="64" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="208" y="94" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">2</text>

  <g filter="url(#sk)"><rect x="256" y="64" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="284" y="94" text-anchor="middle" font-size="20" font-weight="bold" fill="#b07818">9</text>

  <g filter="url(#sk)"><rect x="332" y="64" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="360" y="94" text-anchor="middle" font-size="20" font-weight="bold" fill="#b07818">4</text>

  <g filter="url(#sk)"><rect x="408" y="64" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="436" y="94" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">3</text>

  <text x="490" y="92" font-size="11" fill="#888">← 从个位开始取</text>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="85" y="136" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="155" y="136" width="90" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="245" y="136" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="345" y="136" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="445" y="136" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="120" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b66">步骤</text>
  <text x="200" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b66">d = n%10</text>
  <text x="295" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b66">a（最大）</text>
  <text x="395" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b66">b（次大）</text>
  <text x="500" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b66">剩余 n</text>

  <!-- 行 1：初始 -->
  <g filter="url(#sk)"><rect x="85" y="172" width="70" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="155" y="172" width="90" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="245" y="172" width="100" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="345" y="172" width="100" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="445" y="172" width="110" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <text x="120" y="195" text-anchor="middle" font-size="12" fill="#333">初始</text>
  <text x="200" y="195" text-anchor="middle" font-size="12" fill="#333">—</text>
  <text x="295" y="195" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="395" y="195" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="500" y="195" text-anchor="middle" font-size="12" fill="#333">2943</text>

  <!-- 行 2：① -->
  <g filter="url(#sk)"><rect x="85" y="208" width="70" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="155" y="208" width="90" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="245" y="208" width="100" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="345" y="208" width="100" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="445" y="208" width="110" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <text x="120" y="231" text-anchor="middle" font-size="12" fill="#333">①</text>
  <text x="200" y="231" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="295" y="231" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="395" y="231" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="500" y="231" text-anchor="middle" font-size="12" fill="#333">294</text>

  <!-- 行 3：② -->
  <g filter="url(#sk)"><rect x="85" y="244" width="70" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="155" y="244" width="90" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="245" y="244" width="100" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="345" y="244" width="100" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="445" y="244" width="110" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <text x="120" y="267" text-anchor="middle" font-size="12" fill="#333">②</text>
  <text x="200" y="267" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="295" y="267" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="395" y="267" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="500" y="267" text-anchor="middle" font-size="12" fill="#333">29</text>

  <!-- 行 4：③（高亮） -->
  <g filter="url(#sk)"><rect x="85" y="280" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="155" y="280" width="90" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="245" y="280" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="345" y="280" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="445" y="280" width="110" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="120" y="303" text-anchor="middle" font-size="12" fill="#333">③</text>
  <text x="200" y="303" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="295" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">9</text>
  <text x="395" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">4</text>
  <text x="500" y="303" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- 行 5：④ -->
  <g filter="url(#sk)"><rect x="85" y="316" width="70" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="155" y="316" width="90" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="245" y="316" width="100" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="345" y="316" width="100" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="445" y="316" width="110" height="36" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <text x="120" y="339" text-anchor="middle" font-size="12" fill="#333">④</text>
  <text x="200" y="339" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="295" y="339" text-anchor="middle" font-size="12" fill="#333">9（不变）</text>
  <text x="395" y="339" text-anchor="middle" font-size="12" fill="#333">4（不变）</text>
  <text x="500" y="339" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- 结果 -->
  <g filter="url(#sk)"><rect x="85" y="368" width="470" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="396" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">答案 = a × b = 9 × 4 = 36</text>

  <!-- 提示 -->
  <g filter="url(#sk)"><rect x="85" y="426" width="470" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="320" y="449" text-anchor="middle" font-size="11" fill="#b03a3a">第④步 d = 2 &lt; 9 且 ≤ 4 → 不更新；最大数位 9 只出现一次 → 次大取 4</text>
</svg>
