<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">贪心：度数降序配权值 n, n−1, …, 1</text>

  <!-- 度数柱状 -->
  <text x="150" y="62" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">示例 1：度数排序后</text>
  <g filter="url(#rough2)">
    <rect x="60" y="76" width="180" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="150" y="104">城市 2：度 4</text>
    <text x="150" y="126">城市 1：度 3</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
  </g>
  <!-- 柱子（高度 = 度数） -->
  <g filter="url(#rough2)">
    <rect x="92" y="170" width="20" height="100" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="126" y="196" width="20" height="74" fill="#d6a040" opacity="0.75" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="160" y="222" width="20" height="48" fill="#4a7a3a" opacity="0.7" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="184" y="222" width="20" height="48" fill="#4a7a3a" opacity="0.7" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="208" y="248" width="20" height="22" fill="#446688" opacity="0.6" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="102" y="166">配 5</text><text x="136" y="192">配 4</text><text x="170" y="218">配 3</text>
    <text x="194" y="218">配 2</text><text x="218" y="244">配 1</text>
  </g>

  <!-- 箭头 -->
  <path d="M 252 210 L 300 210" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="196" font-size="12" fill="#446688" filter="url(#rough2)" text-anchor="middle">配对</text>

  <!-- 求和 -->
  <g filter="url(#rough2)">
    <rect x="312" y="76" width="228" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <text x="330" y="102">4×5 = 20</text>
    <text x="330" y="126">3×4 = 12</text>
    <text x="330" y="150">2×3 = 6</text>
    <text x="330" y="174">2×2 = 4</text>
    <text x="330" y="198">1×1 = 1</text>
    <text x="330" y="228" fill="#4a7a3a" font-weight="bold">合计 = 43 ✓</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="312" y="262" width="228" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="426" y="286" font-size="12.5" fill="#333" filter="url(#rough2)" text-anchor="middle">度数越大 → 值被乘的次数越多</text>
  <text x="426" y="306" font-size="12.5" fill="#333" filter="url(#rough2)" text-anchor="middle">→ 越应该配大的权值（重排不等式）</text>
</svg>
