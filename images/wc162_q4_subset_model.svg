<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每个单词 = 一个 26 维字母计数向量</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">集合可拼出 ⟺ 逐维求和不超过 letters 的计数；得分对单词可加</text>

  <!-- 卡片 1：dog -->
  <rect x="28" y="66" width="160" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="108" y="92" text-anchor="middle" font-size="14" fill="#2f4a6b" font-weight="bold" filter="url(#rough2)">dog</text>
  <text x="108" y="110" text-anchor="middle" font-size="11" fill="#476183" filter="url(#rough2)">价值 10</text>
  <rect x="46" y="120" width="40" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="135" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">d×1</text>
  <rect x="90" y="120" width="40" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="135" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">o×1</text>
  <rect x="134" y="120" width="40" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="135" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">g×1</text>
  <text x="108" y="168" text-anchor="middle" font-size="10" fill="#7a8ea8" filter="url(#rough2)">c_dog = (d1 o1 g1)</text>

  <!-- 卡片 2：dad -->
  <rect x="200" y="66" width="160" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dad</text>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#a07e33" filter="url(#rough2)">价值 11</text>
  <rect x="222" y="120" width="48" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="135" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">a×1</text>
  <rect x="278" y="120" width="48" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="135" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">d×2</text>
  <text x="280" y="168" text-anchor="middle" font-size="10" fill="#ab8a44" filter="url(#rough2)">c_dad = (a1 d2)</text>

  <!-- 卡片 3：good -->
  <rect x="372" y="66" width="160" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="452" y="92" text-anchor="middle" font-size="14" fill="#33562a" font-weight="bold" filter="url(#rough2)">good</text>
  <text x="452" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">价值 12</text>
  <rect x="384" y="120" width="40" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="135" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">d×1</text>
  <rect x="428" y="120" width="40" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="135" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">o×2</text>
  <rect x="472" y="120" width="40" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="492" y="135" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">g×1</text>
  <text x="452" y="168" text-anchor="middle" font-size="10" fill="#6a8a5a" filter="url(#rough2)">c_good = (d1 o2 g1)</text>

  <path d="M 280 190 L 280 212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 不等式 -->
  <rect x="52" y="216" width="456" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">c_dad + c_good = (a1 d3 g1 o2) ≤ C = (a2 c1 d3 g1 o2)</text>
  <text x="280" y="253" text-anchor="middle" font-size="10" fill="#a0605c" filter="url(#rough2)">逐维比较全部满足 → 子集 {dad, good} 可拼出，得分 11 + 12 = 23</text>

  <!-- 底部分支 -->
  <rect x="52" y="284" width="200" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="152" y="306" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">n ≤ 14 → 2^14 = 16384</text>
  <text x="152" y="324" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">每个子集 O(26) 校验</text>
  <text x="152" y="339" text-anchor="middle" font-size="10" fill="#7a8ea8" filter="url(#rough2)">上界约 4×10^5 次运算</text>

  <rect x="308" y="284" width="200" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="408" y="306" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">本质：26 维 0/1 背包</text>
  <text x="408" y="324" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">物品极小 → 枚举优于 DP</text>
  <text x="408" y="339" text-anchor="middle" font-size="10" fill="#ab8a44" filter="url(#rough2)">DP 要存 2^14 个 26 维向量</text>

  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">先剔除「自身就拼不出」的单词，再在剩余单词上做回溯，配合剩余价值上界剪枝</text>
</svg>
