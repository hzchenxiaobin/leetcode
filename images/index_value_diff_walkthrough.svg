<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="560" fill="#fdfcf7"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [5, 1, 4, 1]，D = 2，V = 4</text>
  <path d="M 170 42 Q 360 50 550 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel 1: j = 2 -->
  <text x="70" y="74" font-size="13" font-weight="bold" fill="#2b2b2b">第 1 轮 j = 2：纳入 r = 0，候选集 S = {nums[0]} = {5}</text>
  <g filter="url(#sk)">
    <rect x="120" y="88" width="64" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="184" y="88" width="64" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="248" y="88" width="64" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="312" y="88" width="64" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="152" y="116" text-anchor="middle" font-size="15" fill="#333">5</text>
  <text x="216" y="116" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="280" y="116" text-anchor="middle" font-size="15" fill="#333">4</text>
  <text x="344" y="116" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="152" y="148" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="216" y="148" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="280" y="148" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="344" y="148" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="152" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">r = 0（新纳入）</text>
  <text x="280" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">j = 2</text>

  <g filter="url(#sk)">
    <rect x="420" y="86" width="250" height="84" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="436" y="110" font-size="11" fill="#444">minIdx = maxIdx = 0（值 5）</text>
  <text x="436" y="132" font-size="11" fill="#444">检查：|nums[2] − 5| = 1 &lt; 4 ✗</text>
  <text x="436" y="154" font-size="11" fill="#b85450">两个代表都不达标 → j 右移</text>

  <path d="M 360 130 Q 390 168 420 128" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <!-- Panel 2: j = 3 -->
  <text x="70" y="212" font-size="13" font-weight="bold" fill="#2b2b2b">第 2 轮 j = 3：纳入 r = 1，候选集 S = {5, 1}，minIdx = 1、maxIdx = 0</text>
  <g filter="url(#sk)">
    <rect x="120" y="228" width="64" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="184" y="228" width="64" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="248" y="228" width="64" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="312" y="228" width="64" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="152" y="256" text-anchor="middle" font-size="15" fill="#333">5</text>
  <text x="216" y="256" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="280" y="256" text-anchor="middle" font-size="15" fill="#333">4</text>
  <text x="344" y="256" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="152" y="288" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="216" y="288" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="344" y="288" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="152" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">mx（值 5）</text>
  <text x="216" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">r = 1 → mn（值 1）</text>
  <text x="344" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">j = 3</text>

  <g filter="url(#sk)">
    <rect x="420" y="226" width="250" height="94" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="436" y="250" font-size="11" fill="#444">检查 min：|1 − 1| = 0 &lt; 4 ✗</text>
  <text x="436" y="272" font-size="11" fill="#444">检查 max：|1 − 5| = 4 ≥ 4 ✓</text>
  <text x="436" y="296" font-size="12" font-weight="bold" fill="#b85450">→ 返回 [0, 3]</text>

  <!-- answer highlight -->
  <g filter="url(#sk)">
    <rect x="112" y="220" width="272" height="66" rx="10" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5"/>
  </g>
  <text x="112" y="326" font-size="11" font-weight="bold" fill="#b85450">红框即答案下标对 (i = 0, j = 3)</text>

  <!-- Number line for j = 3 -->
  <text x="70" y="366" font-size="13" font-weight="bold" fill="#2b2b2b">数轴视角（j = 3，nums[j] = 1，V = 4）：mx 恰好压线达标</text>

  <g filter="url(#sk)">
    <rect x="180" y="392" width="340" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="140" y="392" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="520" y="392" width="100" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <path d="M 140 408 L 620 408" stroke="#2b2b2b" stroke-width="1.8" filter="url(#sk)"/>
  <path d="M 180 400 L 180 416" stroke="#2b2b2b" stroke-width="1.6" filter="url(#sk)"/>
  <path d="M 300 400 L 300 416" stroke="#2b2b2b" stroke-width="1.6" filter="url(#sk)"/>
  <path d="M 520 400 L 520 416" stroke="#2b2b2b" stroke-width="1.6" filter="url(#sk)"/>

  <text x="180" y="436" text-anchor="middle" font-size="10.5" fill="#555">nums[j]−V = −3</text>
  <text x="300" y="436" text-anchor="middle" font-size="10.5" fill="#555">mn = 1</text>
  <text x="520" y="436" text-anchor="middle" font-size="10.5" fill="#555">nums[j]+V = 5</text>

  <ellipse cx="300" cy="408" rx="6" ry="6" fill="#eaf6ee" stroke="#2e6e2e" stroke-width="1.8" filter="url(#sk)"/>
  <text x="300" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">mn ✗</text>
  <ellipse cx="520" cy="408" rx="6" ry="6" fill="#eaf6ee" stroke="#c98a2b" stroke-width="2.4" filter="url(#sk)"/>
  <text x="560" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">mx = 5 ✓</text>
  <text x="140" y="386" text-anchor="middle" font-size="10" fill="#2e6e2e">x ≤ −3 ✓</text>
  <text x="600" y="386" text-anchor="middle" font-size="10" fill="#2e6e2e">x ≥ 5 ✓</text>

  <!-- takeaway -->
  <g filter="url(#sk)">
    <rect x="70" y="462" width="580" height="76" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="90" y="486" font-size="12" font-weight="bold" fill="#2b2b2b">mn 落在粉区内（不达标）；mx 恰好压在右边界 5 = nums[j]+V 上 → 达标</text>
  <text x="90" y="508" font-size="11" fill="#444">注意 ≥ 含等于：差值恰好等于 V 也算达标（示例 1 正是压线案例）</text>
  <text x="90" y="528" font-size="11" fill="#444">全程只走了 j = 2、3 两轮——先纳入 r 再检查，每轮 O(1)</text>
</svg>
