<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">关键递推：完成日 = max(昨日顺延, 同类冷却解禁日)</text>

  <!-- 公式 -->
  <g filter="url(#rough2)">
    <rect x="76" y="52" width="408" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#1a2b45" text-anchor="middle">
    <text x="280" y="76">对任务 t：若非首次出现，</text>
    <text x="280" y="98" font-weight="bold">cur = max(cur + 1, last[t] + space + 1)</text>
  </g>

  <!-- 时间轴（9 天：第 1..9 天位于 x = 90 + 50*(d-1)） -->
  <text x="80" y="150" font-size="13" fill="#333" filter="url(#rough2)">示例 1：tasks = [1,2,1,2,3,1]，space = 3</text>
  <g filter="url(#rough2)">
    <path d="M 70 190 L 540 190" stroke="#446688" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1">
    <path d="M 90 186 L 90 194"/><path d="M 140 186 L 140 194"/><path d="M 190 186 L 190 194"/>
    <path d="M 240 186 L 240 194"/><path d="M 290 186 L 290 194"/><path d="M 340 186 L 340 194"/>
    <path d="M 390 186 L 390 194"/><path d="M 440 186 L 440 194"/><path d="M 490 186 L 490 194"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="middle">
    <text x="90" y="214">1</text><text x="140" y="214">2</text><text x="190" y="214">3</text>
    <text x="240" y="214">4</text><text x="290" y="214">5</text><text x="340" y="214">6</text>
    <text x="390" y="214">7</text><text x="440" y="214">8</text><text x="490" y="214">9</text>
  </g>
  <!-- 任务条：天 1,2,5,6,8,9 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="76"  y="162" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="126" y="162" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="276" y="162" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="326" y="162" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="426" y="162" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="476" y="162" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="90" y="178">1</text><text x="140" y="178">2</text><text x="290" y="178">1</text>
    <text x="340" y="178">2</text><text x="440" y="178">3</text><text x="490" y="178">1</text>
  </g>
  <!-- 休息标记：天 3,4,7 -->
  <g filter="url(#rough2)" font-size="14" fill="#999" text-anchor="middle">
    <text x="190" y="180">休</text><text x="240" y="180">休</text><text x="390" y="180">休</text>
  </g>
  <!-- 冷却区间示意：任务1 第1天 → 第5天 -->
  <g filter="url(#rough2)">
    <path d="M 90 232 L 290 232" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="6 4"/>
    <path d="M 90 232 L 90 224" stroke="#b85450" stroke-width="1.5" fill="none"/>
    <path d="M 290 232 L 290 224" stroke="#b85450" stroke-width="1.5" fill="none"/>
  </g>
  <text x="190" y="252" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">任务 1 第 1 天完成 → 下一个任务 1 最早第 1+3+1 = 5 天</text>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="272" width="440" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="292" text-anchor="middle" font-size="12.5" fill="#1d3a17" filter="url(#rough2)">休息只发生在「下一个任务是同类型且冷却未到」时——</text>
  <text x="280" y="311" text-anchor="middle" font-size="12.5" fill="#1d3a17" filter="url(#rough2)">把休息尽量提前安排，就能贪到最少天数。</text>

  <g filter="url(#rough2)">
    <rect x="60" y="334" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="354" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">不同类型互不冷却：任务 3 在第 8 天见缝插针完成，不占额外天数。</text>
  <text x="280" y="373" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">日程 = 1 2 休 休 1 2 休 3 1 → 共 9 天。</text>
</svg>
