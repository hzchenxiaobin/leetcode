<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">演算：s = "***" 的逐步滚动</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每步只留 dp[i-2]、dp[i-1]，两条来源相加</text>

  <rect x="40" y="60" width="480" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="79" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">i</text>
  <text x="160" y="79" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">s[i-1]</text>
  <text x="272" y="79" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">一位项 one·dp[i-1]</text>
  <text x="400" y="79" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">两位项 two·dp[i-2]</text>
  <text x="492" y="79" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">dp[i]</text>

  <rect x="40" y="92" width="480" height="32" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="78" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">*</text>
  <text x="272" y="113" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">9 × 1 = 9</text>
  <text x="400" y="113" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—（没有前一位）</text>
  <text x="492" y="113" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">9</text>

  <rect x="40" y="128" width="480" height="32" rx="4" fill="#f7f9fc" stroke="#ddd" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="78" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">*</text>
  <text x="272" y="149" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">9 × 9 = 81</text>
  <text x="400" y="149" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">15 × 1 = 15</text>
  <text x="492" y="149" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">96</text>

  <rect x="40" y="164" width="480" height="32" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="78" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">*</text>
  <text x="272" y="185" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">9 × 96 = 864</text>
  <text x="400" y="185" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">15 × 9 = 135</text>
  <text x="492" y="185" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">999</text>

  <path d="M 280 198 L 280 208" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="210" width="440" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">dp[3] = 9·96 + 15·9 = 864 + 135 = 999</text>

  <text x="280" y="274" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">再看 s = "1*2*"：dp = [1, 1, 18, 20, 288]（dp[0..4]）</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">第 2 位两位项 two = 9（1*），第 4 位 two = 6（2*）</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(n)，额外空间 O(1)</text>
</svg>
