<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：arr = [10, 5, 10, 10] → intervals = [5, 0, 3, 4]</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组行 -->
  <text x="52" y="78" text-anchor="end" font-size="12" fill="#888">arr =</text>
  <g filter="url(#sk)">
    <rect x="64" y="56" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="120" y="56" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="176" y="56" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="232" y="56" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="90" y="80" text-anchor="middle" font-size="13" fill="#333">10</text>
  <text x="146" y="80" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="202" y="80" text-anchor="middle" font-size="13" fill="#333">10</text>
  <text x="258" y="80" text-anchor="middle" font-size="13" fill="#333">10</text>
  <text x="90" y="106" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="146" y="106" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="202" y="106" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="258" y="106" text-anchor="middle" font-size="9.5" fill="#888">3</text>

  <!-- 分组结果 -->
  <g filter="url(#sk)">
    <rect x="48" y="122" width="304" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="380" y="122" width="228" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="200" y="144" text-anchor="middle" font-size="11.5" fill="#333">值 10 → g = [0, 2, 3]　m = 3，total = 5</text>
  <text x="494" y="144" text-anchor="middle" font-size="11.5" fill="#333">值 5 → g = [1]　m = 1，total = 1</text>

  <!-- 值 10 组演算表 -->
  <g filter="url(#sk)">
    <rect x="40" y="180" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="74" y="180" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="122" y="180" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="178" y="180" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="290" y="180" width="102" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="392" y="180" width="88" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="40" y="208" width="34" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="74" y="208" width="48" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="122" y="208" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="178" y="208" width="112" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="290" y="208" width="102" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="392" y="208" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="40" y="238" width="34" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="74" y="238" width="48" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="122" y="238" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="178" y="238" width="112" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="290" y="238" width="102" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="392" y="238" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="40" y="268" width="34" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="74" y="268" width="48" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="122" y="268" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="178" y="268" width="112" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="290" y="268" width="102" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="392" y="268" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="57" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">i</text>
  <text x="98" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">g[i]</text>
  <text x="150" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">prefix</text>
  <text x="234" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">(2i−m)·g[i]</text>
  <text x="341" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">total−2·prefix</text>
  <text x="436" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">ans[g[i]]</text>

  <text x="57" y="227" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="98" y="227" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="150" y="227" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="234" y="227" text-anchor="middle" font-size="11" fill="#333">(0−3)·0 = 0</text>
  <text x="341" y="227" text-anchor="middle" font-size="11" fill="#333">5 − 0 = 5</text>
  <text x="436" y="227" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans[0] = 5</text>

  <text x="57" y="257" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="98" y="257" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="150" y="257" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="234" y="257" text-anchor="middle" font-size="11" fill="#333">(2−3)·2 = −2</text>
  <text x="341" y="257" text-anchor="middle" font-size="11" fill="#333">5 − 0 = 5</text>
  <text x="436" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans[2] = 3</text>

  <text x="57" y="287" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="98" y="287" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="150" y="287" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="234" y="287" text-anchor="middle" font-size="11" fill="#333">(4−3)·3 = 3</text>
  <text x="341" y="287" text-anchor="middle" font-size="11" fill="#333">5 − 4 = 1</text>
  <text x="436" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans[3] = 4</text>

  <text x="260" y="316" text-anchor="middle" font-size="9.5" fill="#888">prefix[i] = 前 i 项之和（不含 g[i]），滚动维护：先套公式再累加</text>

  <!-- 值 5 单元素组 -->
  <g filter="url(#sk)">
    <rect x="500" y="186" width="128" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="564" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">值 5 组（m = 1）</text>
  <text x="564" y="226" text-anchor="middle" font-size="10" fill="#333">(0−1)·1 + 1 − 0</text>
  <text x="564" y="242" text-anchor="middle" font-size="10" fill="#333">= −1 + 1 = 0</text>
  <text x="564" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">→ ans[1] = 0</text>
  <text x="564" y="282" text-anchor="middle" font-size="9" fill="#888">单元素组自动为 0</text>
  <text x="564" y="294" text-anchor="middle" font-size="9" fill="#888">无需特判</text>

  <!-- 回填合并 -->
  <text x="88" y="376" font-size="12" font-weight="bold" fill="#555">回填合并 → intervals =</text>
  <g filter="url(#sk)">
    <rect x="268" y="352" width="50" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="324" y="352" width="50" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="380" y="352" width="50" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="436" y="352" width="50" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="293" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">5</text>
  <text x="349" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">0</text>
  <text x="405" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>
  <text x="461" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">4</text>
  <text x="293" y="402" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="349" y="402" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="405" y="402" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="461" y="402" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="560" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">✓ 与示例一致</text>

  <text x="320" y="422" text-anchor="middle" font-size="10" fill="#888">每组 O(m)，Σm = n → 整体 O(n)；暴力两两枚举则是 O(Σm²)，最坏 O(n²)</text>
</svg>
