<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：答案只有 0 / 1 / 2 天</text>
  <path d="M 150 34 Q 280 40 410 34" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Panel 1: 0 days -->
  <rect x="14" y="42" width="168" height="310" rx="10" fill="#ffffff" stroke="#e3e3e0" filter="url(#rough2)"/>
  <text x="98" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0 天 · 已经分离</text>

  <g filter="url(#rough2)"><rect x="68" y="80" width="30" height="30" rx="3" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="98" y="80" width="30" height="30" rx="3" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="68" y="110" width="30" height="30" rx="3" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="98" y="110" width="30" height="30" rx="3" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="68" y="140" width="30" height="30" rx="3" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="98" y="140" width="30" height="30" rx="3" fill="#ffffff" stroke="#cccccc"/></g>

  <g filter="url(#rough2)"><rect x="38" y="80" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="38" y="110" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="38" y="140" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>

  <g filter="url(#rough2)"><rect x="128" y="80" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="128" y="110" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="128" y="140" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>

  <text x="53" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">岛 A</text>
  <text x="143" y="184" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">岛 B</text>

  <text x="98" y="204" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">岛屿数 = 2 ≠ 1</text>
  <text x="98" y="220" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">陆地天然处于分离状态</text>
  <text x="98" y="236" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ 返回 0，一天都不用</text>

  <g filter="url(#rough2)"><rect x="70" y="256" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="84" y="256" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="98" y="256" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="112" y="256" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="70" y="270" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="84" y="270" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="98" y="270" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="112" y="270" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <text x="98" y="300" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">全水同样算分离</text>
  <text x="98" y="314" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（0 座岛，示例 2 的推论）</text>

  <!-- Panel 2: 1 day -->
  <rect x="196" y="42" width="168" height="310" rx="10" fill="#ffffff" stroke="#e3e3e0" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1 天 · 删一格即断</text>

  <g filter="url(#rough2)"><rect x="235" y="80" width="30" height="30" rx="3" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="295" y="80" width="30" height="30" rx="3" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="235" y="140" width="30" height="30" rx="3" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="295" y="140" width="30" height="30" rx="3" fill="#ffffff" stroke="#cccccc"/></g>

  <g filter="url(#rough2)"><rect x="265" y="80" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="235" y="110" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="295" y="110" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="265" y="140" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>

  <g filter="url(#rough2)"><rect x="265" y="110" width="30" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <path d="M 270 115 L 290 135" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 290 115 L 270 135" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">挖掉中心格（红 ×）</text>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">剩下 4 格两两不相邻</text>
  <text x="280" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ 4 座岛屿，1 天搞定</text>

  <g filter="url(#rough2)"><rect x="259" y="240" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="287" y="240" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="273" y="254" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="259" y="268" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="287" y="268" width="14" height="14" rx="2" fill="#ffffff" stroke="#cccccc"/></g>
  <g filter="url(#rough2)"><rect x="273" y="240" width="14" height="14" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="259" y="254" width="14" height="14" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="287" y="254" width="14" height="14" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="273" y="268" width="14" height="14" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="280" y="302" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">路径（≥3 格）、十字等形状</text>
  <text x="280" y="316" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">都存在这样的分裂点</text>

  <!-- Panel 3: 2 days -->
  <rect x="378" y="42" width="168" height="310" rx="10" fill="#ffffff" stroke="#e3e3e0" filter="url(#rough2)"/>
  <text x="462" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a7020" filter="url(#rough2)">2 天 · 单格无解</text>

  <g filter="url(#rough2)"><rect x="432" y="80" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="432" y="110" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="462" y="110" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="462" y="80" width="30" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <path d="M 467 85 L 487 105" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 487 85 L 467 105" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <text x="462" y="160" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">删掉任意单个格子</text>
  <text x="462" y="176" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">剩下 3 格连通 → 仍 1 座岛</text>
  <text x="462" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a7020" filter="url(#rough2)">单格尝试全部失败</text>

  <path d="M 462 200 L 462 214" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="440" y="222" width="22" height="22" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="462" y="244" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="462" y="222" width="22" height="22" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><rect x="440" y="244" width="22" height="22" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <path d="M 466 226 L 480 240" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 480 226 L 466 240" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 444 248 L 458 262" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 458 248 L 444 262" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <ellipse cx="451" cy="233" rx="15" ry="13" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <ellipse cx="473" cy="255" rx="15" ry="13" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="462" y="286" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">改删对角两格 (0,1)+(1,0)</text>
  <text x="462" y="302" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a7020" filter="url(#rough2)">→ 剩两格对角不相邻，2 座岛</text>
  <text x="462" y="320" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">答案 = 2；2×2 是最小的「2 天」岛</text>

  <text x="280" y="380" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">★ 关键：无论岛多大，2 天必然足够 —— 所以只需逐一检验 0 天与 1 天两种情形</text>
</svg>
