<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按二进制末尾两位决定 ±1：让 /2 连起来</text>
  <text x="310" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">偶数只能 /2；一次 ±1 之后必紧跟一次 /2，于是「末尾是 01 还是 011」决定这次进位划不划算</text>

  <!-- 面板 A：n ≡ 1 (mod 4) -->
  <rect x="26" y="64" width="284" height="212" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="88" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">n ≡ 1 (mod 4)：末尾 …01</text>

  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <rect x="40" y="102" width="58" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="69" y="122" fill="#3a4a66">…01</text>
    <text x="112" y="98" font-size="10" fill="#8a3a36">−1</text>
    <path d="M 100 117 L 126 117" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <rect x="130" y="102" width="58" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="159" y="122" fill="#3a4a66">…00</text>
    <text x="204" y="98" font-size="10" fill="#4a7a3a">/2</text>
    <path d="M 190 117 L 216 117" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <rect x="220" y="102" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="246" y="122" fill="#3a5a30">…0</text>
  </g>
  <text x="278" y="122" font-size="10" fill="#3a5a30" filter="url(#rough2)">偶</text>

  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <rect x="40" y="150" width="58" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="69" y="170" fill="#3a4a66">…01</text>
    <text x="112" y="146" font-size="10" fill="#8a3a36">+1</text>
    <path d="M 100 165 L 126 165" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <rect x="130" y="150" width="58" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="159" y="170" fill="#3a4a66">…10</text>
    <text x="204" y="146" font-size="10" fill="#4a7a3a">/2</text>
    <path d="M 190 165 L 216 165" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <rect x="220" y="150" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="246" y="170" fill="#8a3a36">…1</text>
  </g>
  <text x="278" y="170" font-size="10" fill="#8a3a36" filter="url(#rough2)">奇</text>

  <text x="42" y="206" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">13：−1 得 12 → 6 → 3 → 2 → 1，5 步</text>
  <text x="42" y="224" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">　　+1 得 14 → 7 → 8 → 4 → 2 → 1，6 步</text>
  <text x="42" y="252" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">结论：减 1，让 /2 连除两次</text>

  <!-- 面板 B：n ≡ 3 (mod 4) -->
  <rect x="314" y="64" width="280" height="212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="88" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">n ≡ 3 (mod 4)，n &gt; 3：末尾 …011</text>

  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <rect x="328" y="102" width="62" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="359" y="122" fill="#8a6a20">…011</text>
    <text x="404" y="98" font-size="10" fill="#4a7a3a">+1</text>
    <path d="M 392 117 L 418 117" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <rect x="422" y="102" width="62" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="453" y="122" fill="#8a6a20">…100</text>
    <text x="498" y="98" font-size="10" fill="#4a7a3a">/2</text>
    <path d="M 486 117 L 512 117" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <rect x="516" y="102" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="541" y="122" fill="#3a5a30">…10</text>
  </g>
  <text x="570" y="122" font-size="10" fill="#3a5a30" filter="url(#rough2)">偶</text>

  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <rect x="328" y="150" width="62" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="359" y="170" fill="#8a6a20">…011</text>
    <text x="404" y="146" font-size="10" fill="#8a3a36">−1</text>
    <path d="M 392 165 L 418 165" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <rect x="422" y="150" width="62" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="453" y="170" fill="#8a6a20">…010</text>
    <text x="498" y="146" font-size="10" fill="#4a7a3a">/2</text>
    <path d="M 486 165 L 512 165" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <rect x="516" y="150" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="541" y="170" fill="#8a3a36">…01</text>
  </g>
  <text x="570" y="170" font-size="10" fill="#8a3a36" filter="url(#rough2)">奇</text>

  <text x="330" y="206" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">15：+1 得 16 → 8 → 4 → 2 → 1，5 步</text>
  <text x="330" y="224" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">　　−1 得 14 → 7 → 8 → 4 → 2 → 1，6 步</text>
  <text x="330" y="252" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">结论：加 1，进位清掉一串 1</text>

  <!-- 特例与统一规则 -->
  <rect x="26" y="288" width="568" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="310" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">特例 n = 3 = 11₂：3 → 2 → 1 只要 2 步，而 3 → 4 → 2 → 1 要 3 步（此时 3 + 1 = 4 只换来一次 /2）。</text>
  <text x="42" y="334" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">所以必须先判 n == 3 走 −1；其余奇数按 n mod 4 决定：1 走 −1，3 走 +1。</text>

  <!-- 把两步打包 -->
  <rect x="26" y="362" width="568" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="384" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">把「±1 与紧随的 /2」打包成一步</text>
  <text x="42" y="406" font-size="11" fill="#3a5a30" filter="url(#rough2)">f(n) = 2 + min{ f((n−1)/2), f((n+1)/2) }　（n 为奇数，f(1) = 0）</text>
  <text x="42" y="426" font-size="10" fill="#555" filter="url(#rough2)">两个候选值的奇偶由末尾两位决定，奇偶又决定后续还能白拿几次 /2 —— 这就是贪心依据。</text>
</svg>
