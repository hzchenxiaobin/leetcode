<svg xmlns="http://www.w3.org/2000/svg" width="940" height="750" viewBox="0 0 940 750" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="940" height="750" fill="#fdfcf7"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough)">最小化同奇偶前缀和之差：两组 running max</text>
  <path d="M 270 46 Q 470 54 670 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- ===== Panel 1: parity pairing ===== -->
  <text x="470" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#rough)">① 只允许同奇偶配对（pre 延续示例 1 的 [0, 1, −4, −2, 1, 3]）</text>

  <!-- axes -->
  <path d="M 120 96 L 120 272" stroke="#999" stroke-width="1.2" filter="url(#rough)"/>
  <path d="M 120 272 L 672 272" stroke="#999" stroke-width="1.2" filter="url(#rough)"/>
  <text x="98" y="188" font-size="11" fill="#888" filter="url(#rough)">pre</text>
  <text x="690" y="288" font-size="11" fill="#888" filter="url(#rough)">下标 j</text>

  <!-- pre polyline (light) -->
  <path d="M 140 160 L 236 138 L 332 248 L 428 204 L 524 138 L 620 94" stroke="#c9c4b4" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#rough)"/>

  <!-- index labels -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="140" y="288" filter="url(#rough)">0</text>
    <text x="236" y="288" filter="url(#rough)">1</text>
    <text x="332" y="288" filter="url(#rough)">2</text>
    <text x="428" y="288" filter="url(#rough)">3</text>
    <text x="524" y="288" filter="url(#rough)">4</text>
    <text x="620" y="288" filter="url(#rough)">5</text>
  </g>

  <!-- valid pairing: blue 0 -> blue 2 -->
  <path d="M 148 166 C 220 240, 270 262, 322 246" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough)"/>
  <text x="236" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough)">同偶配对 (0,2)：pre[2]−pre[0] = −4</text>

  <!-- invalid pairing: blue 4 -> orange 5 -->
  <path d="M 532 134 C 560 108, 580 96, 608 92" stroke="#b0aaa0" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrK)" filter="url(#rough)"/>
  <text x="596" y="122" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough)">奇偶不同 ✗</text>

  <!-- points -->
  <g filter="url(#rough)">
    <circle cx="140" cy="160" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="236" cy="138" r="7" fill="#fff3dd" stroke="#d6a040" stroke-width="2"/>
    <circle cx="332" cy="248" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="428" cy="204" r="7" fill="#fff3dd" stroke="#d6a040" stroke-width="2"/>
    <circle cx="524" cy="138" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="620" cy="94" r="7" fill="#fff3dd" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="140" y="148" fill="#34507a" filter="url(#rough)">0</text>
    <text x="236" y="126" fill="#b07a20" filter="url(#rough)">1</text>
    <text x="332" y="266" fill="#34507a" filter="url(#rough)">−4</text>
    <text x="428" y="192" fill="#b07a20" filter="url(#rough)">−2</text>
    <text x="524" y="126" fill="#34507a" filter="url(#rough)">1</text>
    <text x="620" y="82" fill="#b07a20" filter="url(#rough)">3</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough)">
    <circle cx="716" cy="150" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="716" cy="172" r="6" fill="#fff3dd" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="730" y="154" font-size="11" fill="#444" filter="url(#rough)">偶下标 i ≡ 0</text>
  <text x="730" y="176" font-size="11" fill="#444" filter="url(#rough)">奇下标 i ≡ 1</text>
  <g filter="url(#rough)">
    <rect x="700" y="196" width="212" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8"/>
  </g>
  <text x="806" y="218" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough)">固定 j，减去前面同奇偶的</text>
  <text x="806" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough)">最大 pre[i]</text>

  <!-- ===== Panel 2: scan flow ===== -->
  <text x="470" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#rough)">② 一遍扫描：先「用」后「更」，mx[p] 只含下标 &lt; j 的前缀值</text>

  <g filter="url(#rough)">
    <rect x="300" y="352" width="340" height="40" fill="#f0ede4" stroke="#999" stroke-width="1.4" rx="16"/>
  </g>
  <text x="470" y="378" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough)">开始：j = 0，M = 0，mx[0] = mx[1] = −∞</text>
  <path d="M 470 392 L 470 412" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arrK)" filter="url(#rough)"/>

  <g filter="url(#rough)">
    <rect x="300" y="416" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
  </g>
  <text x="470" y="440" text-anchor="middle" font-size="12" fill="#34507a" filter="url(#rough)">p ← j mod 2　（j 落在哪条奇偶车道）</text>
  <path d="M 470 452 L 470 472" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arrK)" filter="url(#rough)"/>

  <g filter="url(#rough)">
    <rect x="280" y="476" width="380" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="470" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough)">M ← min(M, pre[j] − mx[p])　先用</text>
  <path d="M 470 516 L 470 536" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arrK)" filter="url(#rough)"/>

  <g filter="url(#rough)">
    <rect x="280" y="540" width="380" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="470" y="566" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07a20" filter="url(#rough)">mx[p] ← max(mx[p], pre[j])　后更</text>
  <path d="M 470 580 L 470 600" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arrK)" filter="url(#rough)"/>

  <!-- decision diamond -->
  <g filter="url(#rough)">
    <polygon points="470,606 580,642 470,678 360,642" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="470" y="648" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough)">j &lt; n ?</text>

  <!-- yes path -->
  <path d="M 470 678 L 470 700" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arrK)" filter="url(#rough)"/>
  <text x="484" y="694" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough)">是</text>
  <g filter="url(#rough)">
    <rect x="300" y="704" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
  </g>
  <text x="470" y="728" text-anchor="middle" font-size="11.5" fill="#34507a" filter="url(#rough)">pre += (−1)^j · nums[j]，j ← j+1</text>
  <path d="M 300 722 L 250 722 L 250 434 L 296 434" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough)"/>

  <!-- no path -->
  <path d="M 580 642 L 640 642" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arrK)" filter="url(#rough)"/>
  <text x="600" y="632" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough)">否</text>
  <g filter="url(#rough)">
    <rect x="652" y="616" width="252" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="778" y="638" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough)">返回 pre[n] − 2·min(M, 0)</text>
  <text x="778" y="658" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough)">min(M,0)：允许不操作</text>
</svg>
