<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <rect width="860" height="520" fill="#fafafa"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">示例 2 演算：BFS 逆序自底向上累加（seats = 2）</text>
  <path d="M 250 46 Q 430 54 610 46" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: process tree ===== -->
  <text x="210" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">BFS 序：0 → 1, 4, 5 → 3 → 6 → 2，逆序处理</text>

  <g filter="url(#sk)" stroke="#9a9a9a" stroke-width="1.6" fill="none">
    <path d="M 160 160 Q 120 205 100 250"/>
    <path d="M 160 160 Q 210 200 220 250"/>
    <path d="M 100 320 Q 105 360 118 400"/>
    <path d="M 118 460 Q 130 490 148 500"/>
  </g>

  <g filter="url(#sk)"><circle cx="160" cy="140" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="160" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">0</text>

  <g filter="url(#sk)"><circle cx="100" cy="285" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="100" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">1</text>

  <g filter="url(#sk)"><circle cx="220" cy="285" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="220" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">5</text>

  <g filter="url(#sk)"><circle cx="118" cy="430" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="118" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">3</text>

  <g filter="url(#sk)"><circle cx="160" cy="505" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="160" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">2</text>

  <!-- processing order labels -->
  <g font-size="11" font-weight="bold">
    <text x="42" y="300" fill="#446688">⑤</text>
    <text x="248" y="290" fill="#446688">⑥</text>
    <text x="148" y="445" fill="#4a7a3a">④</text>
    <text x="196" y="520" fill="#4a7a3a">①</text>
    <text x="194" y="132" fill="#b85450">根, 跳过</text>
  </g>
  <g font-size="10" fill="#888">
    <text x="36" y="315">第 6 步</text>
    <text x="242" y="305">第 5 步</text>
    <text x="142" y="460">第 4 步</text>
    <text x="190" y="535"></text>
  </g>

  <!-- ===== right: accumulation table ===== -->
  <g font-size="12">
    <!-- header -->
    <g filter="url(#sk)">
      <rect x="330" y="100" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
      <rect x="450" y="100" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
      <rect x="570" y="100" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
      <rect x="690" y="100" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    </g>
    <g text-anchor="middle" font-weight="bold" fill="#446688">
      <text x="390" y="122">处理节点 u</text>
      <text x="510" y="122">cnt(u)</text>
      <text x="630" y="122">⌈cnt/2⌉ 升</text>
      <text x="755" y="122">ans 累计</text>
    </g>

    <!-- rows -->
    <g filter="url(#sk)">
      <rect x="330" y="134" width="120" height="34" fill="#e6f4ea" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="450" y="134" width="120" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="570" y="134" width="120" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="690" y="134" width="130" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    </g>
    <text x="390" y="156" text-anchor="middle" fill="#333">① 2 (父=3)</text>
    <text x="510" y="156" text-anchor="middle" fill="#333">1</text>
    <text x="630" y="156" text-anchor="middle" fill="#333">1</text>
    <text x="755" y="156" text-anchor="middle" fill="#333">1</text>

    <g filter="url(#sk)">
      <rect x="330" y="168" width="120" height="34" fill="#e6f4ea" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="450" y="168" width="120" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="570" y="168" width="120" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="690" y="168" width="130" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    </g>
    <text x="390" y="190" text-anchor="middle" fill="#333">② 6 (父=4)</text>
    <text x="510" y="190" text-anchor="middle" fill="#333">1</text>
    <text x="630" y="190" text-anchor="middle" fill="#333">1</text>
    <text x="755" y="190" text-anchor="middle" fill="#333">2</text>

    <g filter="url(#sk)">
      <rect x="330" y="202" width="120" height="34" fill="#e6f4ea" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="450" y="202" width="120" height="34" fill="#fff8e1" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="570" y="202" width="120" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="690" y="202" width="130" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    </g>
    <text x="390" y="224" text-anchor="middle" fill="#333">③ 3 (父=1)</text>
    <text x="510" y="224" text-anchor="middle" fill="#8a6a1a" font-weight="bold">2 ←</text>
    <text x="630" y="224" text-anchor="middle" fill="#333">1</text>
    <text x="755" y="224" text-anchor="middle" fill="#333">3</text>

    <g filter="url(#sk)">
      <rect x="330" y="236" width="120" height="34" fill="#e6f4ea" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="450" y="236" width="120" height="34" fill="#fff8e1" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="570" y="236" width="120" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="690" y="236" width="130" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    </g>
    <text x="390" y="258" text-anchor="middle" fill="#333">④ 4 (父=0)</text>
    <text x="510" y="258" text-anchor="middle" fill="#8a6a1a" font-weight="bold">2 ←</text>
    <text x="630" y="258" text-anchor="middle" fill="#333">1</text>
    <text x="755" y="258" text-anchor="middle" fill="#333">4</text>

    <g filter="url(#sk)">
      <rect x="330" y="270" width="120" height="34" fill="#e6f4ea" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="450" y="270" width="120" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="570" y="270" width="120" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
      <rect x="690" y="270" width="130" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    </g>
    <text x="390" y="292" text-anchor="middle" fill="#333">⑤ 5 (父=0)</text>
    <text x="510" y="292" text-anchor="middle" fill="#333">1</text>
    <text x="630" y="292" text-anchor="middle" fill="#333">1</text>
    <text x="755" y="292" text-anchor="middle" fill="#333">5</text>

    <g filter="url(#sk)">
      <rect x="330" y="304" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
      <rect x="450" y="304" width="120" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="1.6"/>
      <rect x="570" y="304" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
      <rect x="690" y="304" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    </g>
    <text x="390" y="326" text-anchor="middle" fill="#b85450" font-weight="bold">⑥ 1 (父=0)</text>
    <text x="510" y="326" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="630" y="326" text-anchor="middle" fill="#b85450" font-weight="bold">⌈3/2⌉=2</text>
    <text x="755" y="326" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
  </g>

  <!-- annotations -->
  <g filter="url(#sk)">
    <path d="M 700 350 Q 755 372 755 398" stroke="#b85450" stroke-width="1.6" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <rect x="560" y="400" width="260" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="690" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">最终 ans = 7 升 ✓</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="330" y="400" width="200" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="430" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a1a">cnt(u) 上报给父亲：</text>
  <text x="430" y="444" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">cnt[fa[u]] += cnt[u]</text>
  <text x="430" y="466" text-anchor="middle" font-size="10" fill="#888">根节点 0 不再上报</text>
</svg>
