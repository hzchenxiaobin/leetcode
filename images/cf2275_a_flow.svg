<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="434" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：每组数据只有一次加法</text>
  <path d="M 214 42 Q 380 49 546 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 第一行：读入 → 循环 → 计算 → 输出 -->
  <rect x="30" y="96" width="160" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="110" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">读入 t</text>
  <text x="110" y="148" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">测试组数，1 ≤ t ≤ 10⁴</text>

  <rect x="214" y="96" width="160" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="294" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">循环 t 次</text>
  <text x="294" y="148" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">多测，逐组独立处理</text>

  <rect x="398" y="96" width="160" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="478" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">读 x₀, y₀, R</text>
  <text x="478" y="148" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">坐标 −10…10，R ≤ 25</text>

  <rect x="582" y="96" width="150" height="70" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="657" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">输出</text>
  <text x="657" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">x₀ , y₀ + R</text>

  <path d="M 192 131 L 210 131" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 376 131 L 394 131" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 560 131 L 578 131" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二行：为什么 -->
  <rect x="30" y="196" width="702" height="76" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="381" y="222" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">唯一需要的校验：位移取 (Δx, Δy) = (0, R)</text>
  <text x="381" y="248" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">(x₀ + 0 − x₀)² + (y₀ + R − y₀)² = 0² + R² = R²  ⇒  恰好落在接收边界上</text>
  <text x="381" y="266" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">R 与 (x₀, y₀) 都是整数，所以输出坐标必然是整点</text>

  <!-- 第三行：三个否定 -->
  <rect x="30" y="290" width="222" height="88" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="141" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">不必枚举位移</text>
  <text x="141" y="338" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">暴力是 (2R+1)² ≈ 2601</text>
  <text x="141" y="358" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">次比较/组，能过但没必要</text>

  <rect x="270" y="290" width="222" height="88" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="381" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">不必求勾股数</text>
  <text x="381" y="338" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">R 不必是斜边；轴上的</text>
  <text x="381" y="358" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">(0, ±R), (±R, 0) 永远合法</text>

  <rect x="510" y="290" width="222" height="88" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="621" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">复杂度</text>
  <text x="621" y="338" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每组 O(1)，总计 O(t)</text>
  <text x="621" y="358" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">t = 10⁴ 时约 10⁴ 次加法</text>

  <rect x="30" y="394" width="702" height="28" rx="7" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="381" y="412" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">一句话：(x, y) ← (x₀, y₀ + R)，答案永远存在，不需要任何搜索。</text>
</svg>
