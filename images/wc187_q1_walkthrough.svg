<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：B→C、D→B、C→A（边序被打乱）</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第一遍收集出发站，第二遍逐条检查到达站</text>

  <rect x="50" y="68" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="93" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">B→C</text>
  <rect x="175" y="68" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="93" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">D→B</text>
  <rect x="300" y="68" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="355" y="93" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">C→A</text>

  <path d="M 412 88 L 438 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="444" y="68" width="166" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="527" y="93" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">D = { B, D, C }</text>

  <text x="50" y="128" font-size="10.5" fill="#777" filter="url(#rough2)">第二遍：依次取出三条边的到达站 C、B、A，与 D 比对</text>

  <rect x="50" y="140" width="560" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="162" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">边</text>
  <text x="185" y="162" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">cityAi</text>
  <text x="295" y="162" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">cityBi</text>
  <text x="425" y="162" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">cityBi ∈ D ?</text>
  <text x="555" y="162" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">动作</text>

  <rect x="50" y="174" width="560" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="196" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="185" y="196" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">B</text>
  <text x="295" y="196" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">C</text>
  <text x="425" y="196" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是 ✓</text>
  <text x="555" y="196" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">跳过</text>

  <rect x="50" y="208" width="560" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="230" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="185" y="230" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">D</text>
  <text x="295" y="230" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">B</text>
  <text x="425" y="230" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是 ✓</text>
  <text x="555" y="230" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">跳过</text>

  <rect x="50" y="242" width="560" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="264" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="185" y="264" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">C</text>
  <text x="295" y="264" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">A</text>
  <text x="425" y="264" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否 ✗</text>
  <text x="555" y="264" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 A</text>

  <rect x="50" y="292" width="560" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="314" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">C、B 都在 D 中（有出边），只有 A 不在 D 中，而且 A 从未作为出发站出现</text>
  <text x="66" y="336" font-size="11" fill="#8a6a20" filter="url(#rough2)">⇒ 终点站 = “A”，流程在第三条边处提前结束</text>

  <text x="330" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：第一条边的到达站 C 并不是终点站，因此不能用 paths[0][1] 直接作答</text>
  <text x="330" y="402" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 1 同理：D = { London, New York, Lima }，Sao Paulo 不在 D 中 ⇒ 答案 Sao Paulo</text>
</svg>
