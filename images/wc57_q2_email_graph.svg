<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">邮箱是节点：同一账户内两两连边，连通分量 = 一个人</text>
  <text x="310" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">共享邮箱把两个账户「粘」在一起；同名但无公共邮箱仍是两个人</text>

  <!-- 分量 1：John 的 3 个邮箱 -->
  <rect x="50" y="62" width="382" height="120" rx="12" fill="#e6f4ea" fill-opacity="0.55"
        stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="62" y="80" font-size="10" fill="#3a5a30" filter="url(#rough2)">John 的三个邮箱（同一个人）</text>

  <rect x="60" y="92" width="110" height="28" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="110" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">john00</text>

  <rect x="188" y="132" width="118" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="247" y="150" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">johnsmith ★</text>

  <rect x="310" y="92" width="118" height="28" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="369" y="110" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">john_newyork</text>

  <path d="M 168 108 L 190 134" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 304 134 L 312 110" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="96" y="144" font-size="8.5" fill="#5a7a4a" filter="url(#rough2)">账户1 内连边</text>
  <text x="330" y="144" font-size="8.5" fill="#5a7a4a" filter="url(#rough2)">账户3 内连边</text>

  <!-- 分量 2：另一个 John -->
  <rect x="50" y="196" width="236" height="80" rx="12" fill="#e8f0fe" fill-opacity="0.7"
        stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="62" y="214" font-size="10" fill="#3a4a66" filter="url(#rough2)">John 的另一个账户</text>
  <rect x="88" y="224" width="126" height="28" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="151" y="242" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">johnnybravo</text>

  <!-- 分量 3：Mary -->
  <rect x="318" y="196" width="228" height="80" rx="12" fill="#fce4ec" fill-opacity="0.7"
        stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="330" y="214" font-size="10" fill="#8a3a36" filter="url(#rough2)">Mary</text>
  <rect x="386" y="224" width="96" height="28" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="434" y="242" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">mary</text>
  <text x="330" y="268" font-size="8.5" fill="#8a5a56" filter="url(#rough2)">只有一个邮箱 → 独立分量</text>

  <text x="66" y="268" font-size="8.5" fill="#5a6a8a" filter="url(#rough2)">与 johnsmith 无公共邮箱 → 独立分量</text>

  <!-- 结论 -->
  <rect x="50" y="292" width="520" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="312" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">读图要点</text>
  <text x="64" y="330" font-size="9.8" fill="#555" filter="url(#rough2)">johnsmith 同时属于账户 1 与账户 3 ⇒ 两条边把它们并成同一个分量。</text>
  <text x="64" y="346" font-size="9.8" fill="#555" filter="url(#rough2)">johnnybravo 与 johnsmith 没有公共邮箱 ⇒ 即使同名 John，也必须输出两个账户。</text>

  <text x="310" y="386" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">答案 = 每个连通分量：姓名 + 按 ASCII 升序排列的邮箱</text>
</svg>
