<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">BFS 主流程：相邻松弛 + 每个质数只展开一次</text>

  <!-- preprocess -->
  <rect x="150" y="50" width="340" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="75" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">SPF 筛到 max(nums)，建桶 bucket[p] = { j : p | nums[j] }</text>
  <path d="M320,90 L320,106" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="190" y="108" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">dist[0] = 0，下标 0 入队（n = 1 直接返回 0）</text>
  <path d="M320,146 L320,162" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- loop box -->
  <rect x="150" y="164" width="340" height="40" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="189" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">队列非空：出队 i，记 d = dist[i] + 1</text>
  <path d="M320,204 L320,222" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="320,224 474,266 320,308 166,266" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="260" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">nums[i] 是质数 p</text>
  <text x="320" y="278" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">且 used[p] = false ?</text>

  <!-- yes branch -->
  <path d="M474,266 L492,266" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="496" y="234" width="134" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="563" y="254" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">used[p] = true</text>
  <text x="563" y="270" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">bucket[p] 中未访问的 j：</text>
  <text x="563" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">dist[j] = d，入队</text>

  <path d="M563,300 C563,328 548,342 512,342" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <path d="M320,308 L320,326" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="332" y="322" font-size="12" fill="#666" filter="url(#rough2)">否 / 合并</text>

  <!-- neighbors box -->
  <rect x="130" y="328" width="382" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="346" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">松弛相邻 i−1 与 i+1（界内）：</text>
  <text x="321" y="364" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">未访问 → dist = d，入队</text>
  <path d="M321,372 L321,388" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="321,390 421,424 321,458 221,424" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="321" y="430" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">队列空？</text>

  <!-- yes -> return -->
  <path d="M421,424 L452,424" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="414" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="456" y="402" width="160" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="536" y="422" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 dist[n−1]</text>
  <text x="536" y="440" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（最短路一定存在）</text>

  <!-- no -> loop back -->
  <path d="M221,424 L66,424 L66,184 L146,184" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="66" y="300" font-size="12" fill="#666" filter="url(#rough2)">否</text>

  <!-- side note -->
  <rect x="30" y="466" width="580" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="484" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">小优化：出队 i == n−1 时 dist 已是最终值，可立即返回</text>
</svg>
