<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fdfcf7"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：折叠过程 = 一座「异或帕斯卡三角」</text>
  <text x="50" y="70" font-size="11.5" fill="#666">nums = [2, 8, 4, 32, 16, 1]</text>

  <!-- 第 m 行行标 -->
  <text x="22" y="107" font-size="10.5" fill="#666">m=0</text>
  <text x="22" y="159" font-size="10.5" fill="#666">m=1</text>
  <text x="22" y="211" font-size="10.5" fill="#666">m=2</text>
  <text x="22" y="263" font-size="10.5" fill="#666">m=3</text>
  <text x="22" y="315" font-size="10.5" fill="#666">m=4</text>
  <text x="22" y="367" font-size="10.5" fill="#666">m=5</text>

  <!-- 三角第 0 行：6 个格子 -->
  <rect x="27"  y="88"  width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="93"  y="88"  width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <rect x="159" y="88"  width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <rect x="225" y="88"  width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <rect x="291" y="88"  width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <rect x="357" y="88"  width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="50"  y="107" text-anchor="middle" font-size="13" fill="#2b4a6e">2</text>
  <text x="116" y="107" text-anchor="middle" font-size="13" fill="#7a5415">8</text>
  <text x="182" y="107" text-anchor="middle" font-size="13" fill="#7a5415">4</text>
  <text x="248" y="107" text-anchor="middle" font-size="13" fill="#7a5415">32</text>
  <text x="314" y="107" text-anchor="middle" font-size="13" fill="#7a5415">16</text>
  <text x="380" y="107" text-anchor="middle" font-size="13" fill="#2b4a6e">1</text>

  <!-- 第 1 行：5 个格子 -->
  <rect x="60"  y="140" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="126" y="140" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <rect x="192" y="140" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <rect x="258" y="140" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <rect x="324" y="140" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="83"  y="159" text-anchor="middle" font-size="13" fill="#2b4a6e">10</text>
  <text x="149" y="159" text-anchor="middle" font-size="13" fill="#7a5415">12</text>
  <text x="215" y="159" text-anchor="middle" font-size="13" fill="#7a5415">36</text>
  <text x="281" y="159" text-anchor="middle" font-size="13" fill="#7a5415">48</text>
  <text x="347" y="159" text-anchor="middle" font-size="13" fill="#2b4a6e">17</text>

  <!-- 第 2 行：4 个格子 -->
  <rect x="93"  y="192" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="159" y="192" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <rect x="225" y="192" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <rect x="291" y="192" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="116" y="211" text-anchor="middle" font-size="13" fill="#2b4a6e">6</text>
  <text x="182" y="211" text-anchor="middle" font-size="13" fill="#7a5415">40</text>
  <text x="248" y="211" text-anchor="middle" font-size="13" fill="#7a5415">20</text>
  <text x="314" y="211" text-anchor="middle" font-size="13" fill="#2b4a6e">33</text>

  <!-- 第 3 行：3 个格子 -->
  <rect x="126" y="244" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="192" y="244" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#sk)"/>
  <rect x="258" y="244" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="149" y="263" text-anchor="middle" font-size="13" fill="#2b4a6e">46</text>
  <text x="215" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">60</text>
  <text x="281" y="263" text-anchor="middle" font-size="13" fill="#2b4a6e">53</text>

  <!-- 第 4 行：2 个格子 -->
  <rect x="159" y="296" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="225" y="296" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="182" y="315" text-anchor="middle" font-size="13" fill="#2b4a6e">18</text>
  <text x="248" y="315" text-anchor="middle" font-size="13" fill="#2b4a6e">9</text>

  <!-- 第 5 行：1 个格子 -->
  <rect x="192" y="348" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="215" y="367" text-anchor="middle" font-size="13" fill="#2b4a6e">27</text>

  <!-- 40 ⊕ 20 = 60 的两条汇聚箭头 -->
  <path d="M 182 226 C 190 240, 200 246, 208 247" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 248 226 C 240 240, 230 246, 222 247" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="215" y="241" text-anchor="middle" font-size="11" fill="#3a3a3a">⊕</text>

  <!-- 右侧说明框 1 -->
  <rect x="428" y="88" width="200" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="528" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">第 m 行 = 长度 m+1 的所有区间</text>
  <text x="528" y="131" text-anchor="middle" font-size="11" fill="#333">第 m 行第 i 格 = f[i][i+m]</text>
  <text x="528" y="149" text-anchor="middle" font-size="10.5" fill="#555">折叠 k 次后的窗口内容 = 第 k 行</text>
  <text x="528" y="167" text-anchor="middle" font-size="10.5" fill="#555">O(n²) 个区间的分数一网打尽</text>

  <!-- 右侧说明框 2 -->
  <rect x="428" y="196" width="200" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="528" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">每个格子 = 正上方两格之异或</text>
  <text x="528" y="239" text-anchor="middle" font-size="11" fill="#333">f[l][r] = f[l][r−1] ⊕ f[l+1][r]</text>
  <text x="528" y="257" text-anchor="middle" font-size="10.5" fill="#555">转移式就是折叠操作本身，一步 O(1)</text>

  <!-- 右侧说明框 3 -->
  <rect x="428" y="292" width="200" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="528" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">橙色锥 = 区间 [1,4] 的折叠轨迹</text>
  <text x="528" y="335" text-anchor="middle" font-size="11" fill="#333">底端 60 = f[1][4] = 40 ⊕ 20</text>
  <text x="528" y="353" text-anchor="middle" font-size="10.5" fill="#555">整段 [8,4,32,16] 的分数就是 60</text>
  <text x="528" y="371" text-anchor="middle" font-size="10.5" fill="#555">（示例 1 第二个查询的答案）</text>

  <text x="215" y="406" text-anchor="middle" font-size="11" fill="#666">自顶向下逐行填表，全部区间分数 O(n²) 递推完成</text>
</svg>
