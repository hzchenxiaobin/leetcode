<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="330" fill="#fafafa"/>

  <text x="24" y="34" font-size="17" fill="#333" filter="url(#rough2)">n = 22 的二进制 "10110"，三个 1 组成两对相邻 1</text>

  <!-- 位格子：位置 4..0 -->
  <rect x="180" y="76" width="48" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="110" text-anchor="middle" font-size="20" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="236" y="76" width="48" height="52" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="20" fill="#8a949e" filter="url(#rough2)">0</text>
  <rect x="292" y="76" width="48" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="316" y="110" text-anchor="middle" font-size="20" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="348" y="76" width="48" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="110" text-anchor="middle" font-size="20" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="404" y="76" width="48" height="52" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="110" text-anchor="middle" font-size="20" fill="#8a949e" filter="url(#rough2)">0</text>

  <text x="204" y="152" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">位置 4</text>
  <text x="260" y="152" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">3</text>
  <text x="316" y="152" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <text x="372" y="152" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>
  <text x="428" y="152" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>

  <!-- 距离标注 1：位置 4 与 2 -->
  <path d="M204 190 L204 206 M316 190 L316 206 M204 198 L316 198" stroke="#d6a040" stroke-width="1.6"
        fill="none" filter="url(#rough2)" marker-end="url(#arrO)"/>
  <text x="260" y="222" text-anchor="middle" font-size="13" fill="#b07d20" filter="url(#rough2)">距离 4 − 2 = 2</text>

  <!-- 距离标注 2：位置 2 与 1 -->
  <path d="M316 246 L316 262 M372 246 L372 262 M316 254 L372 254" stroke="#b85450" stroke-width="1.6"
        fill="none" filter="url(#rough2)"/>
  <text x="344" y="280" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">距离 2 − 1 = 1</text>

  <!-- 结论 -->
  <rect x="466" y="180" width="150" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="541" y="208" text-anchor="middle" font-size="14" fill="#8a6410" filter="url(#rough2)">ans = max(2, 1)</text>
  <text x="541" y="234" text-anchor="middle" font-size="16" fill="#8a6410" filter="url(#rough2)">= 2</text>

  <path d="M466 216 C440 216 440 210 432 206" stroke="#d6a040" stroke-width="1.5" fill="none"
        filter="url(#rough2)" marker-end="url(#arrO)"/>
</svg>
