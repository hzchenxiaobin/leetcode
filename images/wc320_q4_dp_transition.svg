<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态设计与前缀和优化：O(n²k) → O(nk)</text>
  <path d="M 270 42 Q 450 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="60" width="780" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="84" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">① 状态定义：f[j][i] = 前 i 个字符（s[0..i−1]）恰好分成 j 段的完美分割数；f[0][0] = 1，答案 f[k][n]</text>
  <text x="80" y="106" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">朴素转移：f[j][i] = [s[i−1]∈N] · Σ(m=0..i−L) [s[m]∈P] · f[j−1][m]</text>
  <text x="80" y="128" font-size="11.5" fill="#b03a3a" filter="url(#rough2)">每个 (j, i) 都要重新扫一遍 m → O(n²·k) ≈ 10⁹（n = k = 1000）超时 ✗</text>

  <text x="80" y="176" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">② 转移式中与 i 有关的只有求和上界 i−L —— 把「被计入的项」抽成前缀和</text>

  <g font-size="11" text-anchor="middle" font-weight="bold">
    <g filter="url(#rough2)"><rect x="140" y="196" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="162" y="217" fill="#2e6e2e" filter="url(#rough2)">计入</text>
    <g filter="url(#rough2)"><rect x="190" y="196" width="44" height="32" rx="4" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <text x="212" y="217" fill="#999" filter="url(#rough2)">排除</text>
    <g filter="url(#rough2)"><rect x="240" y="196" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="262" y="217" fill="#2e6e2e" filter="url(#rough2)">计入</text>
    <g filter="url(#rough2)"><rect x="290" y="196" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="312" y="217" fill="#2e6e2e" filter="url(#rough2)">计入</text>
    <g filter="url(#rough2)"><rect x="340" y="196" width="44" height="32" rx="4" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <text x="362" y="217" fill="#999" filter="url(#rough2)">排除</text>
    <g filter="url(#rough2)"><rect x="430" y="196" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="452" y="217" fill="#2e6e2e" filter="url(#rough2)">计入</text>
  </g>
  <text x="407" y="217" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">……</text>
  <g font-size="11" fill="#777" text-anchor="middle">
    <text x="162" y="246" filter="url(#rough2)">m=0</text>
    <text x="212" y="246" filter="url(#rough2)">m=1</text>
    <text x="262" y="246" filter="url(#rough2)">m=2</text>
    <text x="312" y="246" filter="url(#rough2)">m=3</text>
    <text x="362" y="246" filter="url(#rough2)">m=4</text>
    <text x="407" y="246" filter="url(#rough2)">…</text>
    <text x="452" y="246" filter="url(#rough2)">m=i−L</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 480 212 Q 518 212 552 238" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="518" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">全部加进 P[x]</text>

  <g filter="url(#rough2)">
    <rect x="560" y="196" width="280" height="96" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="580" y="220" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">前缀和 P（每层 O(n) 构建）</text>
  <text x="580" y="244" font-size="12.5" fill="#444" font-family="monospace" filter="url(#rough2)">P[x] = Σ(m ≤ x) [s[m]∈P] · f[j−1][m]</text>
  <text x="580" y="266" font-size="11.5" fill="#555" font-family="monospace" filter="url(#rough2)">即 P[m] = P[m−1] + [s[m]∈P] · f[j−1][m]</text>
  <text x="580" y="284" font-size="10.5" fill="#888" filter="url(#rough2)">（j ≥ 2 时 s[m−1]∈N 已被 f[j−1][m] 隐含）</text>

  <g filter="url(#rough2)">
    <rect x="140" y="274" width="14" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="420" y="274" width="14" height="12" fill="#f0ede4" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="160" y="285" font-size="11" fill="#555" filter="url(#rough2)">= s[m]∈P，计入求和</text>
  <text x="440" y="285" font-size="11" fill="#555" filter="url(#rough2)">= s[m]∈N，系数为 0 被剔除</text>

  <g filter="url(#rough2)">
    <rect x="60" y="302" width="780" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="80" y="326" font-size="14" font-weight="bold" fill="#8a5f14" font-family="monospace" filter="url(#rough2)">f[j][i] = [s[i−1]∈N] · P[i − minLength]</text>
  <text x="80" y="346" font-size="11" fill="#777" filter="url(#rough2)">门卫：s[i−1] 必须非质数（段尾），否则 f[j][i] = 0 —— 漏掉它是最常见 WA</text>
  <text x="790" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">单点 O(1) ✓</text>

  <g filter="url(#rough2)">
    <path d="M 791 400 Q 565 372 343 400" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" stroke-dasharray="6 4"/>
  </g>
  <text x="565" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">共 k 层（j = 1..k）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="404" width="150" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="244" y="404" width="190" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="468" y="404" width="240" height="44" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="742" y="404" width="98" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <path d="M 210 426 L 240 426" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 434 426 L 464 426" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 708 426 L 738 426" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>
  <g text-anchor="middle">
    <text x="135" y="424" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">g = f[0]</text>
    <text x="135" y="440" font-size="11" fill="#2b4a6e" filter="url(#rough2)">g[0] = 1</text>
    <text x="339" y="424" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">① 用 g 建 P[m]（m = 0..n−1）</text>
    <text x="339" y="440" font-size="10" fill="#555" font-family="monospace" filter="url(#rough2)">P[m]=P[m−1]+[s[m]∈P]·g[m]</text>
    <text x="588" y="424" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">② 填 f[j][i]：i = jL..n（s[i−1]∈N）</text>
    <text x="588" y="440" font-size="10" fill="#555" font-family="monospace" filter="url(#rough2)">f[i] = P[i − L]</text>
    <text x="791" y="432" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">swap(f, g)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="462" width="780" height="44" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="450" y="480" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">时间 O(n·k)：每层 O(n) × k 层 ≈ 10⁶</text>
  <text x="450" y="498" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">空间 O(n)：滚动两个长度 n+1 的数组 + P（若按层存全表则 O(nk)）</text>
</svg>
