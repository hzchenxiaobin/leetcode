<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：调和筛求 best 表</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="11.5" fill="#888">nums = [4, 2, 8, 3]，V = 8，S = {2, 3, 4, 8}（蓝格 = 该值在数组中）</text>

  <!-- 表头行：值 v = 1..8 -->
  <text x="130" y="90" text-anchor="end" font-size="11" font-weight="bold" fill="#555">值 v</text>
  <g filter="url(#sk)"><rect x="140" y="66" width="52" height="40" rx="5" fill="#f3f3ef" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="166" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#aaa">1</text>
  <g filter="url(#sk)"><rect x="196" y="66" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="222" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="252" y="66" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="278" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="308" y="66" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="334" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="364" y="66" width="52" height="40" rx="5" fill="#f3f3ef" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="390" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#aaa">5</text>
  <g filter="url(#sk)"><rect x="420" y="66" width="52" height="40" rx="5" fill="#f3f3ef" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="446" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#aaa">6</text>
  <g filter="url(#sk)"><rect x="476" y="66" width="52" height="40" rx="5" fill="#f3f3ef" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="502" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#aaa">7</text>
  <g filter="url(#sk)"><rect x="532" y="66" width="52" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="558" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">8</text>

  <!-- 行 y=2：扫 2,4,6,8 -->
  <text x="130" y="136" text-anchor="end" font-size="11" font-weight="bold" fill="#7a5415">y = 2</text>
  <g filter="url(#sk)"><rect x="196" y="112" width="52" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="222" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="308" y="112" width="52" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="334" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="420" y="112" width="52" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="446" y="139" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">∉ S</text>
  <g filter="url(#sk)"><rect x="532" y="112" width="52" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="558" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="130" y="146" text-anchor="end" font-size="8.5" fill="#999">扫倍数</text>

  <!-- 行 y=3：扫 3,6 -->
  <text x="130" y="182" text-anchor="end" font-size="11" font-weight="bold" fill="#7a5415">y = 3</text>
  <g filter="url(#sk)"><rect x="252" y="158" width="52" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="278" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><rect x="420" y="158" width="52" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="446" y="185" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">∉ S</text>

  <!-- 行 y=4：扫 4,8（已标记） -->
  <text x="130" y="228" text-anchor="end" font-size="11" font-weight="bold" fill="#7a5415">y = 4</text>
  <g filter="url(#sk)"><rect x="308" y="204" width="52" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="334" y="229" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">已标记</text>
  <g filter="url(#sk)"><rect x="532" y="204" width="52" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="558" y="229" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">已标记</text>
  <text x="140" y="260" text-anchor="start" font-size="9.5" fill="#888">y = 8 同理：只扫 m = 8，best[8] 已标记，不覆盖</text>

  <!-- 最终 best 行 -->
  <text x="130" y="298" text-anchor="end" font-size="11" font-weight="bold" fill="#2e6e2e">best[v]</text>
  <g filter="url(#sk)"><rect x="196" y="272" width="52" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="222" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="252" y="272" width="52" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="278" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><rect x="308" y="272" width="52" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="334" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="532" y="272" width="52" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="558" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>

  <!-- 求和框 -->
  <g filter="url(#sk)">
    <rect x="90" y="330" width="460" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="351" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">ans = best[4] + best[2] + best[8] + best[3] = 2 + 2 + 2 + 3 = 9</text>
  <text x="320" y="371" text-anchor="middle" font-size="10.5" fill="#444">元素映射：4→2，2→2（不动），8→2，3→3（不动）</text>

  <!-- 底部要点 -->
  <text x="320" y="410" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">y 升序枚举 + 已标记不覆盖 ⇒ best[v] 被 S 中最小的整除源值命中</text>
  <text x="320" y="432" text-anchor="middle" font-size="10.5" fill="#888">即 best[v] = d(v) = min{ y ∈ S : y | v }，一趟筛完，所有查询 O(1) 取表</text>
</svg>
