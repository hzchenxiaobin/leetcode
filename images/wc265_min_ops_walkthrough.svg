<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="argy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#999"/></marker>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [3,5,7]，start = 0，goal = −4（域外）</text>
  <path d="M 180 40 Q 330 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- layer 0 -->
  <g filter="url(#sk)"><rect x="55" y="78" width="70" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="90" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a94">层 0</text>
  <text x="90" y="111" text-anchor="middle" font-size="9.5" fill="#5a7a9a">dist=0</text>
  <g filter="url(#sk)"><circle cx="190" cy="99" r="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g>
  <text x="190" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a94">0</text>
  <text x="190" y="133" text-anchor="middle" font-size="10.5" fill="#2b5a94">start</text>

  <!-- out-of-range discards from layer 0 -->
  <path d="M 210 92 Q 330 68 436 100" stroke="#aaa" stroke-width="1.4" fill="none" marker-end="url(#argy)" filter="url(#sk)"/>
  <text x="322" y="72" text-anchor="middle" font-size="10" fill="#999">x − num 越界</text>
  <g filter="url(#sk)"><rect x="440" y="80" width="190" height="58" rx="10" fill="#f4f4f4" stroke="#aaa" stroke-width="1.5"/></g>
  <text x="535" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#999">越界丢弃</text>
  <text x="535" y="124" text-anchor="middle" font-size="10.5" fill="#999">−3、−5、−7（均 ≠ −4）</text>

  <!-- layer 1 -->
  <g filter="url(#sk)"><rect x="55" y="178" width="70" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="90" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">层 1</text>
  <text x="90" y="211" text-anchor="middle" font-size="9.5" fill="#5a8a5a">dist=1</text>
  <path d="M 183 116 Q 165 150 162 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="150" y="147" text-anchor="middle" font-size="10.5" fill="#2e6e2e">+3</text>
  <path d="M 190 119 Q 206 155 227 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="210" y="150" text-anchor="middle" font-size="10.5" fill="#2e6e2e">+5</text>
  <path d="M 199 112 Q 258 145 295 179" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="258" y="142" text-anchor="middle" font-size="10.5" fill="#2e6e2e">+7</text>
  <g filter="url(#sk)"><circle cx="160" cy="199" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="160" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><circle cx="230" cy="199" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="230" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">5</text>
  <g filter="url(#sk)"><circle cx="300" cy="199" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="300" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">7</text>
  <text x="340" y="196" font-size="10" fill="#888">0^3=3、0^5=5、0^7=7 与 + 相同，被 dist 去重</text>
  <text x="340" y="214" font-size="11" font-weight="bold" fill="#2e6e2e">入队 {3, 5, 7}</text>

  <!-- layer 2 notes -->
  <text x="420" y="266" font-size="11.5" font-weight="bold" fill="#666">层 2 先展开 x = 3：</text>
  <text x="420" y="286" font-size="10.5" fill="#999">6、8、10、4 … 常规入队</text>
  <text x="420" y="304" font-size="10.5" fill="#999">轮到 num = 7 的减法时：</text>
  <text x="420" y="324" font-size="11" font-weight="bold" fill="#b03a3a">3 − 7 = −4 == goal ★</text>
  <path d="M 415 314 Q 365 308 312 303" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#argy)" filter="url(#sk)"/>

  <!-- layer 2 hit -->
  <g filter="url(#sk)"><rect x="55" y="288" width="70" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="90" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">层 2</text>
  <text x="90" y="321" text-anchor="middle" font-size="9.5" fill="#b85450">命中 ★</text>
  <path d="M 160 220 Q 215 262 260 292" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="196" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">3 − 7（越界）</text>
  <g filter="url(#sk)"><circle cx="285" cy="300" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="2.6"/></g>
  <text x="285" y="306" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b03a3a">−4</text>
  <text x="285" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">== goal！返回 dist[3] + 1 = 2</text>

  <!-- summary -->
  <g filter="url(#sk)"><rect x="55" y="380" width="555" height="72" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="332" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5f14">最短路径：0 →(+3)→ 3 →(−7)→ −4，共 2 步</text>
  <text x="332" y="426" text-anchor="middle" font-size="11" fill="#777">最后一步越出 [0,1000]——正因「先判等再判域」，−4 才能在被丢弃前命中</text>
  <text x="332" y="443" text-anchor="middle" font-size="10.5" fill="#999">对比：goal 在域内时（如示例 1 的 12），同样是扩展邻居时判等命中</text>
</svg>
