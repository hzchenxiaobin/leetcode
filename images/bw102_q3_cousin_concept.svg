<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">同深度 + 不同父 = 堂兄弟（例：1、10 与 7）</text>

  <!-- 树 -->
  <g filter="url(#rough2)">
    <path d="M 280 84 L 200 144" stroke="#888" stroke-width="1.6" fill="none"/>
    <path d="M 280 84 L 360 144" stroke="#888" stroke-width="1.6" fill="none"/>
    <path d="M 200 164 L 140 224" stroke="#888" stroke-width="1.6" fill="none"/>
    <path d="M 200 164 L 250 224" stroke="#888" stroke-width="1.6" fill="none"/>
    <path d="M 360 164 L 420 224" stroke="#888" stroke-width="1.6" fill="none"/>

    <ellipse cx="280" cy="74" rx="24" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="80" text-anchor="middle" font-size="14" fill="#333">5</text>

    <ellipse cx="200" cy="154" rx="24" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="200" y="160" text-anchor="middle" font-size="14" fill="#333">4</text>
    <ellipse cx="360" cy="154" rx="24" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="360" y="160" text-anchor="middle" font-size="14" fill="#333">9</text>

    <ellipse cx="140" cy="244" rx="24" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="140" y="250" text-anchor="middle" font-size="14" fill="#333">1</text>
    <ellipse cx="250" cy="244" rx="24" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="250" y="250" text-anchor="middle" font-size="14" fill="#333">10</text>
    <ellipse cx="420" cy="244" rx="24" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="420" y="250" text-anchor="middle" font-size="14" fill="#333">7</text>
  </g>

  <!-- 堂兄弟标注 -->
  <g filter="url(#rough2)">
    <path d="M 164 236 C 300 150, 370 170, 396 224" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 5" fill="none"/>
    <path d="M 274 236 C 330 190, 370 190, 398 226" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 5" fill="none"/>
  </g>
  <text x="330" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">互为堂兄弟（红虚线）</text>

  <!-- 层带 -->
  <g filter="url(#rough2)">
    <path d="M 70 208 C 200 200, 400 200, 500 208" stroke="#4a7a3a" stroke-width="0" fill="none"/>
    <rect x="66" y="218" width="440" height="60" rx="26" fill="none" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="4 5"/>
  </g>
  <text x="92" y="248" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">深度 2</text>
  <text x="92" y="162" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">深度 1</text>

  <!-- 公式 -->
  <rect x="120" y="292" width="340" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="317" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">新值(7) = 层和 1+10+7 − 兄弟和(仅 7) = 11</text>
</svg>
