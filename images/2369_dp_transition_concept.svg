<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：合法段只有三种，dp[i] 只回看 2 / 3 格</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① two equal -->
  <g filter="url(#sk)"><rect x="40" y="58" width="185" height="94" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="132" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 2 个相等</text>
  <g filter="url(#sk)"><rect x="84" y="94" width="44" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="106" y="115" text-anchor="middle" font-size="14" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="136" y="94" width="44" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="158" y="115" text-anchor="middle" font-size="14" fill="#2b6e9e" filter="url(#sk)">2</text>
  <text x="132" y="144" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">段长 2</text>

  <!-- ② three equal -->
  <g filter="url(#sk)"><rect x="248" y="58" width="185" height="94" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="340" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 3 个相等</text>
  <g filter="url(#sk)"><rect x="271" y="94" width="42" height="32" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="292" y="115" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="319" y="94" width="42" height="32" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="340" y="115" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="367" y="94" width="42" height="32" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="388" y="115" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">4</text>
  <text x="340" y="144" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">段长 3</text>

  <!-- ③ consecutive increasing -->
  <g filter="url(#sk)"><rect x="456" y="58" width="185" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="548" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">③ 连续递增，差恰 1</text>
  <g filter="url(#sk)"><rect x="479" y="94" width="42" height="32" rx="4" fill="#fdfcf7" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="500" y="115" text-anchor="middle" font-size="14" fill="#a06a10" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="527" y="94" width="42" height="32" rx="4" fill="#fdfcf7" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="548" y="115" text-anchor="middle" font-size="14" fill="#a06a10" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="575" y="94" width="42" height="32" rx="4" fill="#fdfcf7" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="596" y="115" text-anchor="middle" font-size="14" fill="#a06a10" filter="url(#sk)">5</text>
  <text x="548" y="144" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">段长 3</text>

  <!-- dp chain -->
  <text x="30" y="258" font-size="18" fill="#999" filter="url(#sk)">…</text>

  <g filter="url(#sk)"><rect x="56" y="230" width="112" height="50" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="112" y="252" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">dp[i−3]</text>
  <text x="112" y="270" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">前 i−3 个</text>

  <g filter="url(#sk)"><rect x="210" y="230" width="112" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="266" y="252" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">dp[i−2]</text>
  <text x="266" y="270" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">前 i−2 个</text>

  <g filter="url(#sk)"><rect x="364" y="230" width="112" height="50" rx="8" fill="#f2f2ee" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4"/></g>
  <text x="420" y="252" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#888" filter="url(#sk)">dp[i−1]</text>
  <text x="420" y="270" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">前 i−1 个</text>

  <g filter="url(#sk)"><rect x="518" y="224" width="118" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="577" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10" filter="url(#sk)">dp[i]</text>
  <text x="577" y="272" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">前 i 个</text>

  <!-- blue edge: dp[i-2] with type-1 segment, to dp[i] -->
  <g filter="url(#sk)">
    <path d="M 266 228 Q 392 172 514 226" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="390" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 末段长 2</text>

  <!-- green edge: dp[i-3] with type-2 or type-3 segment, to dp[i] -->
  <g filter="url(#sk)">
    <path d="M 112 284 Q 320 344 522 290" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="318" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② / ③ 末段长 3</text>

  <!-- grey crossed edge: dp[i-1] -✗- dp[i] -->
  <g filter="url(#sk)">
    <path d="M 478 256 L 512 256" stroke="#999" stroke-width="1.8" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 490 250 L 502 262 M 502 250 L 490 262" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="495" y="276" text-anchor="middle" font-size="10" fill="#a04040" filter="url(#sk)">长 1 无段</text>

  <!-- formula box -->
  <g filter="url(#sk)"><rect x="40" y="352" width="384" height="104" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="232" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">转移：三条边任一命中即可</text>
  <text x="232" y="398" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">dp[i] = (dp[i−2] ∧ ①)</text>
  <text x="232" y="420" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">∨ (dp[i−3] ∧ ②) ∨ (dp[i−3] ∧ ③)</text>
  <text x="232" y="443" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">基准 dp[0] = true（空前缀），答案 dp[n]</text>

  <!-- why linear box -->
  <g filter="url(#sk)"><rect x="448" y="352" width="192" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="544" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">为什么是 O(n)？</text>
  <text x="544" y="398" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">窗口固定：回看 2/3 格</text>
  <text x="544" y="420" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">转移 O(1) ⇒ 全程 O(n)</text>
  <text x="544" y="443" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">滚动 3 变量压 O(1) 空间</text>
</svg>
