<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">两阶段解耦：段代价查表 + 划分 DP</text>
  <path d="M 180 40 Q 320 50 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ======== stage 1 ======== -->
  <g filter="url(#sk)">
    <rect x="30" y="54" width="580" height="118" rx="12" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 预处理：任意子串的半回文代价 cost[l][r]</text>
  <g filter="url(#sk)">
    <rect x="48" y="94" width="130" height="38" rx="8" fill="#ffffff" stroke="#7aa8d8" stroke-width="1.3"/>
    <rect x="194" y="94" width="130" height="38" rx="8" fill="#ffffff" stroke="#7aa8d8" stroke-width="1.3"/>
    <rect x="340" y="94" width="130" height="38" rx="8" fill="#ffffff" stroke="#7aa8d8" stroke-width="1.3"/>
    <rect x="486" y="94" width="130" height="38" rx="8" fill="#ffffff" stroke="#7aa8d8" stroke-width="1.3"/>
  </g>
  <g font-size="11.5" fill="#2b6e9e" text-anchor="middle">
    <text x="113" y="109" filter="url(#sk)">子串 s[l..r]</text>
    <text x="113" y="125" filter="url(#sk)">长度 L = r−l+1</text>
    <text x="259" y="109" filter="url(#sk)">枚举真因数 d</text>
    <text x="259" y="125" filter="url(#sk)">d | L 且 d &lt; L</text>
    <text x="405" y="109" filter="url(#sk)">mod d 分组</text>
    <text x="405" y="125" filter="url(#sk)">组内对称配对</text>
    <text x="551" y="109" filter="url(#sk)">数不匹配对</text>
    <text x="551" y="125" filter="url(#sk)">对 d 取 min</text>
  </g>
  <g stroke="#3a3a3a" stroke-width="1.4">
    <path d="M 180 113 L 192 113" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 326 113 L 338 113" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 472 113 L 484 113" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>
  <text x="320" y="158" text-anchor="middle" font-size="11.5" fill="#2b6e9e" filter="url(#sk)">长度 1 的子串没有真因数 → cost = ∞，永不合法</text>

  <!-- ======== stage 2 ======== -->
  <g filter="url(#sk)">
    <rect x="30" y="190" width="580" height="126" rx="12" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 划分 DP：f[i][j] = 前 i 个字符切成 j 段的最小总代价</text>
  <g filter="url(#sk)">
    <rect x="64" y="230" width="32" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="102" y="230" width="32" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="140" y="230" width="32" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="178" y="230" width="32" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="216" y="230" width="32" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="254" y="230" width="32" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="292" y="230" width="32" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="330" y="230" width="32" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="368" y="230" width="32" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="80" y="249" filter="url(#sk)">a</text>
    <text x="118" y="249" filter="url(#sk)">b</text>
    <text x="156" y="249" filter="url(#sk)">c</text>
    <text x="194" y="249" filter="url(#sk)">a</text>
    <text x="232" y="249" filter="url(#sk)">c</text>
    <text x="270" y="249" filter="url(#sk)">b</text>
    <text x="308" y="249" filter="url(#sk)">a</text>
    <text x="346" y="249" filter="url(#sk)">c</text>
    <text x="384" y="249" filter="url(#sk)">b</text>
  </g>
  <g filter="url(#sk)">
    <rect x="64" y="262" width="108" height="11" rx="5" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="178" y="262" width="108" height="11" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="292" y="262" width="108" height="11" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="118" y="290" fill="#2b6e9e" filter="url(#sk)">第 1 段 → 查 cost</text>
    <text x="232" y="290" fill="#2e6e2e" filter="url(#sk)">第 2 段 → 查 cost</text>
    <text x="346" y="290" fill="#a06a10" filter="url(#sk)">第 3 段 → 查 cost</text>
  </g>
  <text x="430" y="248" font-size="12" fill="#2e6e2e" filter="url(#sk)">切 k−1 刀，各段独立</text>
  <text x="430" y="268" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">总代价 = Σ 各段 cost</text>
  <text x="430" y="288" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">（修改互不干扰，可加）</text>

  <!-- ======== stage 3 ======== -->
  <g filter="url(#sk)">
    <rect x="30" y="332" width="580" height="78" rx="12" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">f[i][j] = min t≤i−2 ( f[t][j−1] + cost[t][i−1] )</text>
  <text x="320" y="386" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">末段 s[t..i−1] 长度 ≥ 2（排除长度 1）· f[0][0] = 0 · 答案 f[n][k]</text>
  <text x="320" y="402" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">k ≤ n/2 保证存在每段 ≥ 2 的划分，答案必有限</text>
</svg>
