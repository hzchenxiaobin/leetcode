<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="4.5" refY="6" orient="auto">
      <path d="M0,0 L4.5,9 L9,0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="480" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：排序后做一次「两端对齐」的线性检查</text>
  <text x="350" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">小下标当「下界」，大下标当「上界」，两侧同时夹住每个目标</text>

  <!-- 流程框 -->
  <rect x="30" y="68" width="330" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="90" font-size="12.5" fill="#33517a" filter="url(#rough2)">① 读入 n、m、a、b；对 a、b 分别升序排序</text>

  <path d="M195 102 L195 110" stroke="#666" stroke-width="1.6" marker-end="url(#dn)" filter="url(#rough2)"/>

  <rect x="30" y="112" width="330" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="134" font-size="12.5" fill="#7a5410" filter="url(#rough2)">② n ≥ 2m ？（每组至少要 2 个不同的元素）</text>
  <text x="368" y="134" font-size="11.5" fill="#b85450" filter="url(#rough2)">否 → NO</text>

  <path d="M195 146 L195 154" stroke="#666" stroke-width="1.6" marker-end="url(#dn)" filter="url(#rough2)"/>

  <rect x="30" y="156" width="330" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="176" font-size="12.5" fill="#7a5410" filter="url(#rough2)">③ 对每个 k ∈ [0, m)：</text>
  <text x="46" y="194" font-size="12" fill="#7a5410" filter="url(#rough2)">　　a[k] &lt; b[k] 且 a[n−m+k] &gt; b[k] ？</text>
  <text x="368" y="182" font-size="11.5" fill="#b85450" filter="url(#rough2)">否 → NO</text>

  <path d="M195 202 L195 210" stroke="#666" stroke-width="1.6" marker-end="url(#dn)" filter="url(#rough2)"/>

  <rect x="30" y="212" width="330" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="234" font-size="12.5" fill="#2e6e2e" filter="url(#rough2)">④ 全部通过 → YES</text>

  <!-- 夹心示意 -->
  <text x="350" y="270" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">n = 7、m = 3 的夹心结构：a[0..2] 供下界，a[4..6] 供上界，中间同一层是 b[0..2]</text>

  <!-- k = 0 -->
  <text x="170" y="290" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k = 0</text>
  <rect x="122" y="296" width="96" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="316" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#rough2)">a[4] = 18</text>
  <text x="170" y="346" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2 &lt; 18 ✓</text>
  <rect x="122" y="354" width="96" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="170" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5410" filter="url(#rough2)">b[0] = 2</text>
  <text x="170" y="404" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1 &lt; 2 ✓</text>
  <rect x="122" y="412" width="96" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="432" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">a[0] = 1</text>

  <!-- k = 1 -->
  <text x="350" y="290" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k = 1</text>
  <rect x="302" y="296" width="96" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="316" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#rough2)">a[5] = 25</text>
  <text x="350" y="346" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">15 &lt; 25 ✓</text>
  <rect x="302" y="354" width="96" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="350" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5410" filter="url(#rough2)">b[1] = 15</text>
  <text x="350" y="404" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3 &lt; 15 ✓</text>
  <rect x="302" y="412" width="96" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="432" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">a[1] = 3</text>

  <!-- k = 2 -->
  <text x="530" y="290" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k = 2</text>
  <rect x="482" y="296" width="96" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530" y="316" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#rough2)">a[6] = 30</text>
  <text x="530" y="346" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">28 &lt; 30 ✓</text>
  <rect x="482" y="354" width="96" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="530" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5410" filter="url(#rough2)">b[2] = 28</text>
  <text x="530" y="404" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">8 &lt; 28 ✓</text>
  <rect x="482" y="412" width="96" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530" y="432" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">a[2] = 8</text>

  <text x="350" y="466" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">绿色 = 排序后前 m 小的 a（下界）；蓝色 = 后 m 大的 a（上界）；橙色 = 待造出的 b</text>
</svg>
