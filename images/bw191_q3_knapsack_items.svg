<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">每个连胜长度 = 一件物品：恰好装满的完全背包</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">体积 = T(c) = c(c+1)/2 分，代价 = c+1 天（c 天得分 + 1 天跳过）</text>

  <rect x="24" y="58" width="72" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="76" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">c = 1</text>
  <text x="60" y="94" text-anchor="middle" font-size="10" fill="#555">体积 1</text>
  <text x="60" y="112" text-anchor="middle" font-size="10" fill="#555">代价 2</text>

  <rect x="102" y="58" width="72" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="138" y="76" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">c = 2</text>
  <text x="138" y="94" text-anchor="middle" font-size="10" fill="#555">体积 3</text>
  <text x="138" y="112" text-anchor="middle" font-size="10" fill="#555">代价 3</text>

  <rect x="180" y="58" width="72" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="216" y="76" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">c = 3</text>
  <text x="216" y="94" text-anchor="middle" font-size="10" fill="#555">体积 6</text>
  <text x="216" y="112" text-anchor="middle" font-size="10" fill="#555">代价 4</text>

  <rect x="258" y="58" width="72" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="294" y="76" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">c = 4</text>
  <text x="294" y="94" text-anchor="middle" font-size="10" fill="#555">体积 10</text>
  <text x="294" y="112" text-anchor="middle" font-size="10" fill="#555">代价 5</text>

  <rect x="336" y="58" width="72" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="372" y="76" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">c = 5</text>
  <text x="372" y="94" text-anchor="middle" font-size="10" fill="#555">体积 15</text>
  <text x="372" y="112" text-anchor="middle" font-size="10" fill="#555">代价 6</text>

  <rect x="414" y="58" width="72" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="76" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">c = 6</text>
  <text x="450" y="94" text-anchor="middle" font-size="10" fill="#555">体积 21</text>
  <text x="450" y="112" text-anchor="middle" font-size="10" fill="#555">代价 7</text>

  <text x="505" y="92" text-anchor="middle" font-size="16" fill="#888">⋯</text>
  <text x="505" y="112" text-anchor="middle" font-size="9" fill="#999">c ≤ 446</text>

  <path d="M 280 128 L 280 146" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="150" width="420" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">dp[0] = 0；dp[v] = min { dp[v − T(c)] + (c+1) }</text>
  <text x="280" y="192" text-anchor="middle" font-size="10" fill="#555">对所有满足 T(c) ≤ v 的 c 取最小（n = 10⁵ 时 c 只有 446 种）</text>

  <rect x="150" y="214" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="239" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">答案 = dp[n] − 1（末段免跳过）</text>

  <rect x="40" y="270" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">为什么不能贪心？长段性价比 T(c)/(c+1) ≈ c/2 确实随 c 递增</text>
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#555">但分数必须恰好 = n：n = 12 时单段最长 T(4) = 10 拼不出 12，</text>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#555">反而是 T(3)+T(3) = 12 → 代价 8 → 7 天 ✓</text>

  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a">n = 9：段 (3,2) → 代价 7 → 6 天 ✓　　n = 12：段 (3,3) → 代价 8 → 7 天 ✓</text>
</svg>
