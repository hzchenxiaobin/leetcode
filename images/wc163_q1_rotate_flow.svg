<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：先取模去周期，再一趟下标映射</text>

  <rect x="120" y="52" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">① 读入 grid，m ← 行数，n ← 列数，N ← m·n</text>
  <text x="450" y="75" font-size="9" fill="#888" filter="url(#rough2)">N ≤ 2500</text>

  <path d="M 280 88 L 280 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="104" width="320" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="127" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② k ← k mod N　（迁移以 N 为周期）</text>

  <path d="M 280 140 L 280 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="156" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="179" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">③ 对每个格子：t ← i·n + j（行优先展平）</text>

  <path d="M 280 192 L 280 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="208" width="320" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="231" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">④ s ← (t − k + N) mod N　（来源下标）</text>
  <text x="450" y="231" font-size="9" fill="#b85450" filter="url(#rough2)">O(1) 定位</text>

  <path d="M 280 244 L 280 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="260" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">⑤ res[i][j] ← grid[s / n][s mod n]</text>
  <text x="450" y="283" font-size="9" fill="#888" filter="url(#rough2)">s / n 即行号</text>

  <path d="M 280 296 L 280 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="312" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">⑥ 返回 res（仍是 m 行 n 列）</text>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每个格子只做常数次取模与除法：时间 O(m·n)，额外空间只有结果数组 O(m·n)</text>
</svg>
