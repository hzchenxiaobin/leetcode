  <rect x="434" y="200" width="30" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- row 5: v=6 -> {0..11} -->
  <text x="96" y="249" text-anchor="end" font-size="12.5" fill="#555" filter="url(#rough2)">v = 6</text>
  <rect x="104" y="230" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
