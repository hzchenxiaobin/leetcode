<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例演算：[1,6,4,3,2] → 排序去重 [1,2,3,4,6]</text>
  <text x="260" y="45" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">蓝色 = 起点，绿色 = 已可达，橙色 = 本轮新增（读区整体右移 v）</text>

