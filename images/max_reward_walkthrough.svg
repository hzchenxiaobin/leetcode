  <!-- notes -->
  <rect x="44" y="276" width="432" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">最终最高位 11：x 轨迹 0 →(+1) 1 →(+4) 5 →(+6) 11，取法 1、4、6</text>

  <rect x="44" y="316" width="432" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#2d4d24" filter="url(#rough2)">验示例 1 [1,1,3,3]：去重 [1,3]；v=3 读 {0,1} 写 {3,4}，答案 4</text>

  <rect x="44" y="356" width="432" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">v = 6 只能读 [0,5]：x = 6 时 6 不大于 x，位 6 是非法起点</text>
