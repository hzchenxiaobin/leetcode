<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先水平翻转，再逐位取反</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="310.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">两步可以合并成「对称位置各自取反后交换」</text>
  <text x="90" y="120" text-anchor="end" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">原行</text>
  <g filter="url(#rough2)"><rect x="110" y="100" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="140.0" y="128.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="180" y="100" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="210.0" y="128.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="250" y="100" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280.0" y="128.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">0</text>
  <path d="M 300 121 Q 320.0 121.0 340 121" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="90" y="190" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">水平翻转</text>
  <g filter="url(#rough2)"><rect x="110" y="170" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="140.0" y="198.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="180" y="170" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="210.0" y="198.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="250" y="170" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="280.0" y="198.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">1</text>
  <path d="M 300 191 Q 320.0 191.0 340 191" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="90" y="260" text-anchor="end" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">取反</text>
  <g filter="url(#rough2)"><rect x="110" y="240" width="60" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="140.0" y="268.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="180" y="240" width="60" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="210.0" y="268.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="250" y="240" width="60" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="280.0" y="268.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="390" y="100" width="190" height="182" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="485" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">等价于一次双指针：</text>
  <text x="485" y="152" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">res[l] = 1 − old[r]</text>
  <text x="485" y="176" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">res[r] = 1 − old[l]</text>
  <text x="485" y="206" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">左右同时向中间推进</text>
  <text x="485" y="230" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">奇数长度时中间格</text>
  <text x="485" y="250" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">自己取反一次</text>
  <g filter="url(#rough2)"><rect x="90" y="300" width="460" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320.0" y="322" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">翻转处理顺序，取反处理数值，两者互不影响，可合并同一轮循环</text>
  <text x="320.0" y="340" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">每行只扫一半，n ≤ 20 时总共 O(n²) 个格子</text>
  </svg>