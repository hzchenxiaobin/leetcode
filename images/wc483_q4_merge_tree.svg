<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">合并过程 ↔ 一棵二叉树（示例 1 的最优方案，总成本 18）</text>

  <!-- 根结点（橙） -->
  <rect x="225" y="48" width="210" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="70" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">[1,2,3,4,5,6,7,8]</text>
  <text x="330" y="88" text-anchor="middle" font-size="10" fill="#8a7a50" filter="url(#rough2)">子集 {L0,L1,L2} · len=8 · med=4</text>

  <!-- 中间结点（蓝） -->
  <rect x="85" y="158" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="185" y="180" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[1,2,3,4,5]</text>
  <text x="185" y="198" text-anchor="middle" font-size="10" fill="#5a7099" filter="url(#rough2)">子集 {L0,L1} · len=5 · med=3</text>

  <rect x="405" y="158" width="180" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="495" y="180" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[6,7,8]</text>
  <text x="495" y="198" text-anchor="middle" font-size="10" fill="#5a7099" filter="url(#rough2)">子集 {L2} · len=3 · med=7</text>

  <!-- 叶子（绿） -->
  <rect x="28" y="270" width="140" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="98" y="292" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[1,3,5]</text>
  <text x="98" y="310" text-anchor="middle" font-size="10" fill="#5a7a5a" filter="url(#rough2)">L0 · len=3 · med=3</text>

  <rect x="205" y="270" width="120" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="292" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[2,4]</text>
  <text x="265" y="310" text-anchor="middle" font-size="10" fill="#5a7a5a" filter="url(#rough2)">L1 · len=2 · med=2</text>

  <!-- 边 -->
  <path d="M280,96 Q225,125 185,156" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M380,96 Q445,125 495,156" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M140,206 Q115,238 98,268" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M230,206 Q252,238 265,268" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 成本标签（红） -->
  <rect x="452" y="106" width="196" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="550" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">合并成本 12</text>
  <text x="550" y="133" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">= 5+3+|med 3 − med 7|</text>
  <path d="M450,123 Q430,120 415,110" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="322" y="228" width="186" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="242" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">合并成本 6</text>
  <text x="415" y="255" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">= 3+2+|med 3 − med 2|</text>
  <path d="M320,245 Q300,240 288,232" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部注解 -->
  <text x="330" y="348" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每个当前列表 = 它「由之合并而来」的原始列表子集的元素并 → len / median 只由子集决定</text>
  <text x="330" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">n 个叶子的满二叉树恰有 n−1 次合并，总成本 = 所有内部结点成本之和 → 对子集做 DP</text>
  <text x="330" y="398" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">「插入到任意位置」是烟雾弹：成本只看 len 与 median，与插入位置无关</text>
</svg>
