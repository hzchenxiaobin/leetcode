<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：闭区间 [1, 4] 逐串走查 + 单点区间边界实验</text>

  <!-- Panel 1：示例 2 走查 -->
  <rect x="16" y="34" width="608" height="218" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="54" text-anchor="start" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">示例 2：words = ["hey","aeo","mu","ooo","artro"]，left = 1，right = 4</text>

  <!-- 下标行 -->
  <rect x="44" y="66" width="30" height="22" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="59" y="81" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="86" y="66" width="30" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="101" y="81" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="128" y="66" width="30" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="143" y="81" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="170" y="66" width="30" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="81" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="212" y="66" width="30" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="227" y="81" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">4</text>

  <text x="59" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">"hey"</text>
  <text x="59" y="112" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">范围外</text>

  <!-- 闭区间括框 -->
  <rect x="80" y="62" width="168" height="54" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="164" y="130" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">闭区间 [1, 4]：两端都算</text>

  <!-- 表头 -->
  <text x="300" y="75" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">首字符</text>
  <text x="368" y="75" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">尾字符</text>
  <text x="436" y="75" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">判定</text>
  <text x="500" y="75" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">ans</text>

  <!-- 行 i=1 aeo -->
  <text x="300" y="104" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"aeo"（i=1）</text>
  <rect x="288" y="110" width="24" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="356" y="110" width="24" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="368" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o</text>
  <text x="436" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="500" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 行 i=2 mu -->
  <text x="300" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"mu"（i=2）</text>
  <rect x="288" y="156" width="24" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">m</text>
  <rect x="356" y="156" width="24" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="368" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">u</text>
  <text x="436" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="500" y="172" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>

  <!-- 行 i=3 ooo -->
  <text x="300" y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"ooo"（i=3）</text>
  <rect x="288" y="202" width="24" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o</text>
  <rect x="356" y="202" width="24" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="368" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o</text>
  <text x="436" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="500" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 行 i=4 artro -->
  <text x="300" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"artro"（i=4）</text>
  <rect x="288" y="248" width="24" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="264" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="356" y="248" width="24" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="368" y="264" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o</text>
  <text x="436" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="500" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- 结果框 -->
  <rect x="540" y="120" width="72" height="40" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="576" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">返回 3 ✓</text>
  <text x="576" y="152" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">i=4 也算——闭区间</text>

  <text x="36" y="244" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">"mu"：尾 'u' ✓ 但首 'm' ✗ → 出局（首尾缺一不可）</text>

  <!-- Panel 2：边界实验 -->
  <rect x="16" y="260" width="608" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="280" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">边界实验：left = right = 3——区间收缩成单点，只判 "ooo"（o..o ✓）→ ans = 1</text>
  <rect x="44" y="292" width="30" height="22" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="59" y="307" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="86" y="292" width="30" height="22" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="101" y="307" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <rect x="128" y="292" width="30" height="22" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="307" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <rect x="170" y="288" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="185" y="307" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="212" y="292" width="30" height="22" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="227" y="307" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="185" y="332" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">只此一个下标</text>
  <text x="280" y="300" text-anchor="start" font-size="9.5" fill="#a0433f" filter="url(#rough2)">若误写半开区间（i &lt; right / range(left, right)）：循环一趟都不跑，错答 0</text>
  <text x="280" y="318" text-anchor="start" font-size="9.5" fill="#a0433f" filter="url(#rough2)">若在示例 2 误写半开：漏掉 i = 4 的 "artro"，错答 2 ≠ 3——样例能抓住，罚时已产生</text>
  <text x="280" y="336" text-anchor="start" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">单点区间是"半开区间"错误的最小复现现场</text>

  <!-- 底部结论 -->
  <rect x="60" y="366" width="520" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="386" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">闭区间三处记牢：i ≤ right（C++）、right+1（range）、right+1（切片）——每一处都是 +1 的肌肉记忆</text>
</svg>
