<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心模型：一条线性历史 + 一个当前指针</text>

  <!-- visit 之前 -->
  <text x="380" y="62" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">visit 之前：hist = [leetcode.com, google.com, facebook.com, youtube.com]</text>

  <text x="185" y="84" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="315" y="84" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="445" y="84" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="575" y="84" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>

  <rect x="125" y="92" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="117" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">leetcode.com</text>
  <rect x="255" y="92" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="117" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">google.com</text>
  <rect x="385" y="92" width="120" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="445" y="117" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">facebook.com</text>
  <rect x="515" y="92" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="575" y="117" text-anchor="middle" font-size="11" fill="#2d5a2d" filter="url(#rough2)">youtube.com</text>

  <path d="M445,172 L445,138" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="190" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">cur = 2（当前页）</text>

  <!-- 中间的 visit -->
  <path d="M445,200 C 445,230 500,240 545,258" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="436" y="240" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">visit("linkedin.com")</text>

  <!-- visit 之后 -->
  <text x="340" y="262" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">visit 之后：cur 之后的历史全部作废，新页面接在 cur + 1 上</text>

  <text x="155" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="285" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="415" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="545" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>

  <rect x="95" y="292" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="317" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">leetcode.com</text>
  <rect x="225" y="292" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="317" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">google.com</text>
  <rect x="355" y="292" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="317" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">facebook.com</text>
  <rect x="485" y="292" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="545" y="317" text-anchor="middle" font-size="11" fill="#2d5a2d" filter="url(#rough2)">linkedin.com</text>

  <path d="M611,312 L627,312" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="632" y="292" width="104" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="684" y="311" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">youtube.com</text>
  <text x="684" y="325" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">旧前进记录，作废</text>

  <path d="M545,352 L545,320" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="545" y="370" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">cur = 3（新页面）</text>

  <rect x="56" y="386" width="648" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="404" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">back/forward 只把 cur 截到 [0, n−1] 内，只有 visit 会改动数组内容</text>
</svg>
