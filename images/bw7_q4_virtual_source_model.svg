<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="179"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：虚拟超级源点统一「井」与「管」</text>

  <!-- 超级源点 -->
  <g filter="url(#rough2)">
    <circle cx="280" cy="90" r="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="280" y="87" text-anchor="middle" font-size="14" fill="#8c3a34" font-weight="bold" filter="url(#rough2)">源点 0</text>
  <text x="280" y="103" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">虚拟水厂</text>

  <!-- 三个房子 -->
  <g filter="url(#rough2)">
    <rect x="60" y="196" width="72" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <rect x="244" y="196" width="72" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <rect x="428" y="196" width="72" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
  </g>
  <text x="96" y="218" text-anchor="middle" font-size="13" fill="#2a4a68" font-weight="bold" filter="url(#rough2)">房 1</text>
  <text x="96" y="236" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">井费 1</text>
  <text x="280" y="218" text-anchor="middle" font-size="13" fill="#2a4a68" font-weight="bold" filter="url(#rough2)">房 2</text>
  <text x="280" y="236" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">井费 2</text>
  <text x="464" y="218" text-anchor="middle" font-size="13" fill="#2a4a68" font-weight="bold" filter="url(#rough2)">房 3</text>
  <text x="464" y="236" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">井费 2</text>

  <!-- 井边（源点 -> 房子） -->
  <path d="M 254 106 L 118 192" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="158" y="140" font-size="11.5" fill="#8c3a34" filter="url(#rough2)">井边 1（wells[0]）</text>
  <path d="M 280 124 L 280 192" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="292" y="164" font-size="11.5" fill="#8c3a34" filter="url(#rough2)">井边 2</text>
  <path d="M 306 106 L 442 192" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="140" font-size="11.5" fill="#8c3a34" filter="url(#rough2)">井边 2</text>

  <!-- 管道边 -->
  <path d="M 132 222 L 244 222" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="188" y="214" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">管 1</text>
  <path d="M 316 222 L 428 222" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="372" y="214" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">管 1</text>

  <!-- MST 选中标记 -->
  <g filter="url(#rough2)" font-size="11" fill="#7a5c1e">
    <text x="196" y="240" text-anchor="middle">✓ 采纳</text>
    <text x="380" y="240" text-anchor="middle">✓ 采纳</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#2d5a22">
    <text x="180" y="176" text-anchor="middle">✓ 采纳</text>
  </g>
  <text x="330" y="176" font-size="11" fill="#bbb" filter="url(#rough2)">✗ 弃（成环）</text>

  <!-- 底部结论 -->
  <rect x="50" y="274" width="460" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">在房子 i 打井 ⟺ 源点到 i 铺一条费用 wells[i] 的管道</text>
  <text x="280" y="320" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">「全部房子有水」= n+1 个点的最小生成树</text>
</svg>
