<text x="169" y="82" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">c</text>
<rect x="194" y="56" width="38" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
<text x="213" y="82" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">c</text>
<rect x="238" y="56" width="38" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
<text x="257" y="82" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">e</text>
<rect x="282" y="56" width="38" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
<text x="301" y="82" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">s</text>
<rect x="326" y="56" width="38" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
<text x="345" y="82" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">s</text>
<rect x="370" y="56" width="38" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
<text x="389" y="82" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">e</text>
<rect x="414" y="56" width="38" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
<text x="433" y="82" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">s</text>
<text x="62" y="116" font-size="11" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">橙 = 元音，蓝 = 辅音</text>
<rect x="40" y="138" width="200" height="108" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="140" y="162" font-size="13" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">元音组</text>
<text x="140" y="190" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">u : 1</text>
<text x="140" y="214" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">e : 2</text>
