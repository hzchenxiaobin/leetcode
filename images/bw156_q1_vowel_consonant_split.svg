<text x="380" y="162" font-size="13" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">辅音组</text>
<text x="380" y="190" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">s : 4</text>
