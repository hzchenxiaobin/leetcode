<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="63" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "aczzx"</text>
  <path d="M 210 38 Q 320 46 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- match arcs above the string -->
  <g fill="none" filter="url(#sk)">
    <path d="M 120 54 Q 220 22 320 54" stroke="#b85450" stroke-width="2"/>
    <path d="M 220 54 Q 370 10 520 54" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="220" y="32" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">+2</text>
  <text x="370" y="26" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">+3</text>

  <!-- string cells -->
  <g filter="url(#sk)">
    <rect x="96" y="56" width="48" height="40" rx="4" fill="#fef6e6" stroke="#b85450" stroke-width="2"/>
    <rect x="216" y="56" width="48" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <rect x="296" y="56" width="48" height="40" rx="4" fill="#fef6e6" stroke="#b85450" stroke-width="2"/>
    <rect x="416" y="56" width="48" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <rect x="496" y="56" width="48" height="40" rx="4" fill="#ffffff" stroke="#8899aa" stroke-width="1.4"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="120" y="82">a</text>
    <text x="220" y="82">c</text>
    <text x="320" y="82">z</text>
    <text x="420" y="82">z</text>
    <text x="520" y="82">x</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="120" y="110">0</text>
    <text x="220" y="110">1</text>
    <text x="320" y="110">2</text>
    <text x="420" y="110">3</text>
    <text x="520" y="110">4</text>
  </g>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="48" y="128" width="50" height="32" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="98" y="128" width="50" height="32" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="148" y="128" width="152" height="32" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="300" y="128" width="180" height="32" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="480" y="128" width="60" height="32" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="540" y="128" width="68" height="32" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="73" y="148">下标 i</text>
    <text x="123" y="148">s[i]</text>
    <text x="224" y="148">查看 mirror 栈</text>
    <text x="390" y="148">动作</text>
    <text x="510" y="148">得分</text>
    <text x="574" y="148">累计</text>
  </g>

  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="48" y="160" width="50" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="98" y="160" width="50" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="148" y="160" width="152" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="300" y="160" width="180" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="480" y="160" width="60" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="540" y="160" width="68" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="73" y="181">0</text>
    <text x="123" y="181">a</text>
    <text x="224" y="181">st['z'] = 空</text>
    <text x="390" y="181">0 压入 st['a']</text>
    <text x="510" y="181">—</text>
    <text x="574" y="181">0</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="48" y="194" width="50" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="98" y="194" width="50" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="148" y="194" width="152" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="300" y="194" width="180" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="480" y="194" width="60" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="540" y="194" width="68" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="73" y="215">1</text>
    <text x="123" y="215">c</text>
    <text x="224" y="215">st['x'] = 空</text>
    <text x="390" y="215">1 压入 st['c']</text>
    <text x="510" y="215">—</text>
    <text x="574" y="215">0</text>
  </g>

  <!-- row 2 (match) -->
  <g filter="url(#sk)">
    <rect x="48" y="228" width="50" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="98" y="228" width="50" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="148" y="228" width="152" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="300" y="228" width="180" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="480" y="228" width="60" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="540" y="228" width="68" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="73" y="249">2</text>
    <text x="123" y="249">z</text>
    <text x="224" y="249">st['a'] = [0]</text>
    <text x="390" y="249">弹出 0，标记 0 与 2</text>
    <text x="510" y="249" font-weight="bold" fill="#2e6e2e">+2</text>
    <text x="574" y="249">2</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="48" y="262" width="50" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="98" y="262" width="50" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="148" y="262" width="152" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="300" y="262" width="180" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="480" y="262" width="60" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
    <rect x="540" y="262" width="68" height="34" rx="3" fill="#ffffff" stroke="#8899aa" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="73" y="283">3</text>
    <text x="123" y="283">z</text>
    <text x="224" y="283">st['a'] = 空</text>
    <text x="390" y="283">3 压入 st['z']</text>
    <text x="510" y="283">—</text>
    <text x="574" y="283">2</text>
  </g>

  <!-- row 4 (match) -->
  <g filter="url(#sk)">
    <rect x="48" y="296" width="50" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="98" y="296" width="50" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="148" y="296" width="152" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="300" y="296" width="180" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="480" y="296" width="60" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="540" y="296" width="68" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="73" y="317">4</text>
    <text x="123" y="317">x</text>
    <text x="224" y="317">st['c'] = [1]</text>
    <text x="390" y="317">弹出 1，标记 1 与 4</text>
    <text x="510" y="317" font-weight="bold" fill="#2e6e2e">+3</text>
    <text x="574" y="317" font-weight="bold" fill="#b85450">5</text>
  </g>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="160" y="344" width="320" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">总分 = (2−0) + (4−1) = 5 ✓</text>
  <text x="320" y="382" text-anchor="middle" font-size="10.5" fill="#888">未配对的下标（如 3 号 'z'）留在栈里，不贡献分数</text>
</svg>
