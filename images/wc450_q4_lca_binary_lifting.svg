<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="421" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法骨架：一次 BFS 预处理，倍增 LCA 在线查距离</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#888">d(x,y) = dist[x] + dist[y] − 2 · dist[ lca(x,y) ]，dist[·] 为根到点的边权和</text>

  <g filter="url(#sk)">
    <rect x="28" y="74" width="284" height="300" rx="10" fill="#f7fafc" stroke="#4a8edb" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="170" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">以 0 为根（示例 1 的树）</text>

  <g stroke-width="1.4" fill="none" filter="url(#sk)">
    <line x1="170" y1="120" x2="170" y2="182" stroke="#999"/>
    <line x1="170" y1="182" x2="100" y2="250" stroke="#b85450" stroke-width="2.2"/>
    <line x1="170" y1="182" x2="170" y2="250" stroke="#b85450" stroke-width="2.2"/>
    <line x1="170" y1="182" x2="240" y2="250" stroke="#999"/>
    <line x1="100" y1="250" x2="100" y2="320" stroke="#999"/>
  </g>
  <g font-size="10.5" text-anchor="middle" font-family="monospace">
    <text x="160" y="150" fill="#888" text-anchor="end">2</text>
    <text x="121" y="212" fill="#b85450" text-anchor="end">3</text>
    <text x="160" y="216" fill="#b85450" text-anchor="end">5</text>
    <text x="216" y="212" fill="#888">4</text>
    <text x="90" y="284" fill="#888" text-anchor="end">6</text>
  </g>

  <g filter="url(#sk)">
    <circle cx="170" cy="120" r="16" fill="#f0f0f0" stroke="#888" stroke-width="1.6"/>
    <circle cx="170" cy="182" r="16" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.4"/>
    <circle cx="100" cy="250" r="16" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="170" cy="250" r="16" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
    <circle cx="240" cy="250" r="16" fill="#f0f0f0" stroke="#888" stroke-width="1.6"/>
    <circle cx="100" cy="320" r="16" fill="#f0f0f0" stroke="#888" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="170" y="125" fill="#666">0</text>
    <text x="170" y="187" fill="#7a5415">1</text>
    <text x="100" y="255" fill="#2b6e9e">2</text>
    <text x="170" y="255" fill="#2e6e2e">3</text>
    <text x="240" y="255" fill="#666">4</text>
    <text x="100" y="325" fill="#666">5</text>
  </g>
  <g font-size="10" font-family="monospace" fill="#8a8a8a">
    <text x="192" y="124">dist=0</text>
    <text x="192" y="186">dist=2</text>
    <text x="78" y="254" text-anchor="end">dist=5</text>
    <text x="192" y="254">dist=7</text>
    <text x="262" y="254">dist=6</text>
    <text x="78" y="324" text-anchor="end">dist=11</text>
  </g>
  <text x="196" y="120" font-size="10.5" fill="#7a5415" text-anchor="start">← lca(2,3)=1</text>
  <text x="170" y="350" text-anchor="middle" font-size="11" fill="#555">d(2,3) = dist[2] + dist[3] − 2·dist[lca]</text>
  <text x="170" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">= 5 + 7 − 2×2 = 8</text>

  <g filter="url(#sk)">
    <rect x="328" y="74" width="284" height="300" rx="10" fill="#f9f8f2" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="470" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">倍增表 up[k][v]：从 v 跳 2^k 步到的祖先</text>

  <g filter="url(#sk)">
    <rect x="348" y="106" width="44" height="26" fill="#e8f0fe" stroke="#9bb8d8"/>
    <rect x="392" y="106" width="68" height="26" fill="#e8f0fe" stroke="#9bb8d8"/>
    <rect x="460" y="106" width="66" height="26" fill="#e8f0fe" stroke="#9bb8d8"/>
    <rect x="526" y="106" width="66" height="26" fill="#e8f0fe" stroke="#9bb8d8"/>
    <rect x="348" y="132" width="244" height="26" fill="#ffffff" stroke="#cfcfcf"/>
    <rect x="348" y="158" width="244" height="26" fill="#f8fafd" stroke="#cfcfcf"/>
    <rect x="348" y="184" width="244" height="26" fill="#e8f0fe" stroke="#9bb8d8"/>
    <rect x="348" y="210" width="244" height="26" fill="#ffffff" stroke="#cfcfcf"/>
    <rect x="348" y="236" width="244" height="26" fill="#f8fafd" stroke="#cfcfcf"/>
    <rect x="348" y="262" width="244" height="26" fill="#fef6e6" stroke="#d8b878"/>
  </g>
  <g stroke="#cfcfcf" filter="url(#sk)">
    <line x1="392" y1="132" x2="392" y2="288"/>
    <line x1="460" y1="132" x2="460" y2="288"/>
    <line x1="526" y1="132" x2="526" y2="288"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">
    <text x="370" y="123">v</text>
    <text x="426" y="123">k=0(父)</text>
    <text x="493" y="123">k=1</text>
    <text x="559" y="123">k=2</text>
  </g>
  <g text-anchor="middle" font-size="12" font-family="monospace" fill="#444">
    <text x="370" y="149">0</text><text x="426" y="149">0</text><text x="493" y="149">0</text><text x="559" y="149">0</text>
    <text x="370" y="175">1</text><text x="426" y="175">0</text><text x="493" y="175">0</text><text x="559" y="175">0</text>
    <text x="370" y="201" fill="#2b6e9e" font-weight="bold">2</text><text x="426" y="201" fill="#2b6e9e" font-weight="bold">1</text><text x="493" y="201">0</text><text x="559" y="201">0</text>
    <text x="370" y="227">3</text><text x="426" y="227">1</text><text x="493" y="227">0</text><text x="559" y="227">0</text>
    <text x="370" y="253">4</text><text x="426" y="253">1</text><text x="493" y="253">0</text><text x="559" y="253">0</text>
    <text x="370" y="279" fill="#7a5415" font-weight="bold">5</text><text x="426" y="279" fill="#7a5415" font-weight="bold">2</text><text x="493" y="279" fill="#7a5415" font-weight="bold">1</text><text x="559" y="279">0</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#666">
    <text x="470" y="308">up[k][v] = up[k−1][ up[k−1][v] ]（跳 2^k = 两个 2^(k−1)）</text>
    <text x="470" y="326">例：up[1][5] = up[0][up[0][5]] = up[0][2] = 1</text>
    <text x="470" y="344">up[0][根] = 根：跳过头也停在根，全程无需判空</text>
    <text x="470" y="364" font-weight="bold" fill="#2e6e2e">预处理 O(n log n)，单次查询 O(log n)</text>
  </g>

  <g filter="url(#sk)">
    <rect x="36" y="390" width="176" height="68" rx="10" fill="#f4f8fd" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="238" y="390" width="176" height="68" rx="10" fill="#f4f8fd" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="440" y="390" width="164" height="68" rx="10" fill="#f2faf4" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle">
    <text x="124" y="414" font-size="12.5" font-weight="bold" fill="#2b6e9e">① 对齐深度</text>
    <text x="124" y="434" font-size="10.5" fill="#555">深度差按二进制拆位，逐位上跳</text>
    <text x="326" y="414" font-size="12.5" font-weight="bold" fill="#2b6e9e">② 同跳找分叉</text>
    <text x="326" y="434" font-size="10.5" fill="#555">k 从高到低，up[k][x] ≠ up[k][y] 就跳</text>
    <text x="522" y="414" font-size="12.5" font-weight="bold" fill="#2e6e2e">③ 收工</text>
    <text x="522" y="434" font-size="10.5" fill="#555">up[0][x] = lca(x,y)</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 216 424 Q 225 418 234 424" stroke="#4a8edb" stroke-width="2.2" fill="none" marker-end="url(#arrB)"/>
    <path d="M 418 424 Q 427 418 436 424" stroke="#4a8edb" stroke-width="2.2" fill="none" marker-end="url(#arrB)"/>
  </g>
</svg>
