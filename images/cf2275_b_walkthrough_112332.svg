<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="440" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold"
        filter="url(#rough2)">样例 s = "112332" 的逐步走查</text>
  <text x="340" y="46" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">内存按“底 → 顶”书写；答案 = 栈里残留的文档 + 被命令 2 跳过的文档 i</text>

  <rect x="20" y="62" width="640" height="30" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="62" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="118" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <text x="250" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="430" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">内存（底→顶）</text>
  <text x="540" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">被打印</text>
  <text x="615" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">未打印集合</text>

  <rect x="20" y="92" width="640" height="38" fill="#ffffff" stroke="#c8d4e8"
        stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="20" y="130" width="640" height="38" fill="#f5f8ff" stroke="#c8d4e8"
        stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="20" y="168" width="640" height="38" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="20" y="206" width="640" height="38" fill="#ffffff" stroke="#c8d4e8"
        stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="20" y="244" width="640" height="38" fill="#f5f8ff" stroke="#c8d4e8"
        stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="20" y="282" width="640" height="38" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="62" y="116" filter="url(#rough2)">1</text>
    <text x="118" y="116" filter="url(#rough2)">'1'</text>
    <text x="250" y="116" filter="url(#rough2)">压栈 1（成为栈顶）</text>
    <text x="430" y="116" filter="url(#rough2)">[1]</text>
    <text x="540" y="116" filter="url(#rough2)">—</text>
    <text x="615" y="116" filter="url(#rough2)">—</text>

    <text x="62" y="154" filter="url(#rough2)">2</text>
    <text x="118" y="154" filter="url(#rough2)">'1'</text>
    <text x="250" y="154" filter="url(#rough2)">压栈 2（成为栈顶）</text>
    <text x="430" y="154" filter="url(#rough2)">[1, 2]</text>
    <text x="540" y="154" filter="url(#rough2)">—</text>
    <text x="615" y="154" filter="url(#rough2)">—</text>

    <text x="62" y="192" fill="#8a3a3a" filter="url(#rough2)">3</text>
    <text x="118" y="192" fill="#8a3a3a" filter="url(#rough2)">'2'</text>
    <text x="250" y="192" fill="#8a3a3a" filter="url(#rough2)">内存非空 → 弹出 2 并打印</text>
    <text x="430" y="192" fill="#8a3a3a" filter="url(#rough2)">[1]</text>
    <text x="540" y="192" fill="#8a3a3a" filter="url(#rough2)">2</text>
    <text x="615" y="192" fill="#8a3a3a" filter="url(#rough2)">3</text>

    <text x="62" y="230" filter="url(#rough2)">4</text>
    <text x="118" y="230" filter="url(#rough2)">'3'</text>
    <text x="250" y="230" filter="url(#rough2)">快印 4（内存不变）</text>
    <text x="430" y="230" filter="url(#rough2)">[1]</text>
    <text x="540" y="230" filter="url(#rough2)">4</text>
    <text x="615" y="230" filter="url(#rough2)">3</text>

    <text x="62" y="268" filter="url(#rough2)">5</text>
    <text x="118" y="268" filter="url(#rough2)">'3'</text>
    <text x="250" y="268" filter="url(#rough2)">快印 5（内存不变）</text>
    <text x="430" y="268" filter="url(#rough2)">[1]</text>
    <text x="540" y="268" filter="url(#rough2)">5</text>
    <text x="615" y="268" filter="url(#rough2)">3</text>

    <text x="62" y="306" fill="#8a3a3a" filter="url(#rough2)">6</text>
    <text x="118" y="306" fill="#8a3a3a" filter="url(#rough2)">'2'</text>
    <text x="250" y="306" fill="#8a3a3a" filter="url(#rough2)">内存非空 → 弹出 1 并打印</text>
    <text x="430" y="306" fill="#8a3a3a" filter="url(#rough2)">[ ]</text>
    <text x="540" y="306" fill="#8a3a3a" filter="url(#rough2)">1</text>
    <text x="615" y="306" fill="#8a3a3a" filter="url(#rough2)">3, 6</text>
  </g>

  <rect x="20" y="336" width="640" height="82" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="36" y="358" font-size="10.5" fill="#555" filter="url(#rough2)">结束：内存为空，答案只剩两条“被命令 2 跳过”的文档 3 与 6 → k = 2，输出 “3 6”</text>
  <text x="36" y="380" font-size="10.5" fill="#555" filter="url(#rough2)">若第 3 条命令改成 '3'（s = "113332"），文档 3 被快印，第 6 条命令弹走 2，答案变成 1 6：</text>
  <text x="36" y="402" font-size="10.5" fill="#8a3a3a" filter="url(#rough2)">栈里残留的 1 + 被命令 2 跳过的 6 —— 未打印文档恰好只有这两类来源</text>
</svg>
