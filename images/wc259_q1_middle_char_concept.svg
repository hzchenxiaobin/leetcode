<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="380" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：下标 1 的字符就是符号位</text>
  <path d="M 160 40 Q 340 50 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- column headers -->
  <text x="108" y="64" text-anchor="middle" font-size="10.5" fill="#888">op[0]</text>
  <text x="144" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">op[1] ⭐</text>
  <text x="180" y="64" text-anchor="middle" font-size="10.5" fill="#888">op[2]</text>

  <!-- row 1: ++X -->
  <text x="82" y="94" text-anchor="end" font-size="13" fill="#333">"++X"</text>
  <g filter="url(#sk)"><rect x="90" y="72" width="36" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="108" y="94" text-anchor="middle" font-size="14" fill="#333">+</text>
  <g filter="url(#sk)"><rect x="126" y="72" width="36" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="144" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">+</text>
  <g filter="url(#sk)"><rect x="162" y="72" width="36" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="180" y="94" text-anchor="middle" font-size="14" fill="#333">X</text>
  <path d="M 210 89 L 234 89" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="240" y="73" width="70" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="275" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">+1</text>

  <!-- row 2: X++ -->
  <text x="82" y="140" text-anchor="end" font-size="13" fill="#333">"X++"</text>
  <g filter="url(#sk)"><rect x="90" y="118" width="36" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="108" y="140" text-anchor="middle" font-size="14" fill="#333">X</text>
  <g filter="url(#sk)"><rect x="126" y="118" width="36" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="144" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">+</text>
  <g filter="url(#sk)"><rect x="162" y="118" width="36" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="180" y="140" text-anchor="middle" font-size="14" fill="#333">+</text>
  <path d="M 210 135 L 234 135" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="240" y="119" width="70" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="275" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">+1</text>

  <!-- row 3: --X -->
  <text x="82" y="186" text-anchor="end" font-size="13" fill="#333">"--X"</text>
  <g filter="url(#sk)"><rect x="90" y="164" width="36" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="108" y="186" text-anchor="middle" font-size="14" fill="#333">−</text>
  <g filter="url(#sk)"><rect x="126" y="164" width="36" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="144" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">−</text>
  <g filter="url(#sk)"><rect x="162" y="164" width="36" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="180" y="186" text-anchor="middle" font-size="14" fill="#333">X</text>
  <path d="M 210 181 L 234 181" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="240" y="165" width="70" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="275" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">−1</text>

  <!-- row 4: X-- -->
  <text x="82" y="232" text-anchor="end" font-size="13" fill="#333">"X--"</text>
  <g filter="url(#sk)"><rect x="90" y="210" width="36" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="108" y="232" text-anchor="middle" font-size="14" fill="#333">X</text>
  <g filter="url(#sk)"><rect x="126" y="210" width="36" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="144" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">−</text>
  <g filter="url(#sk)"><rect x="162" y="210" width="36" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="180" y="232" text-anchor="middle" font-size="14" fill="#333">−</text>
  <path d="M 210 227 L 234 227" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="240" y="211" width="70" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="275" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">−1</text>

  <!-- why box -->
  <g filter="url(#sk)"><rect x="350" y="64" width="290" height="180" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="495" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">为什么中间必是符号？</text>
  <text x="495" y="114" text-anchor="middle" font-size="12" fill="#5c4512">四种串都是「两个相同符号 + 一个 X」</text>
  <text x="495" y="134" text-anchor="middle" font-size="12" fill="#5c4512">X 只在头或尾：符号符号X / X符号符号</text>
  <text x="495" y="154" text-anchor="middle" font-size="12" fill="#5c4512">→ 下标 1 恒被符号占据，无歧义</text>
  <text x="495" y="178" text-anchor="middle" font-size="11.5" fill="#b85450">首字符 'X'：分不清 X++ 与 X--</text>
  <text x="495" y="198" text-anchor="middle" font-size="11.5" fill="#b85450">尾字符 'X'：分不清 ++X 与 --X</text>
  <text x="495" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">唯一可靠判据：op[1] == '+' ⟺ +1</text>

  <!-- counting box -->
  <g filter="url(#sk)"><rect x="66" y="262" width="300" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="216" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">计数即答案</text>
  <text x="216" y="306" text-anchor="middle" font-size="11.5" fill="#4a7a3a">X 最终值 = p − m（加操作数 − 减操作数）</text>
  <text x="216" y="324" text-anchor="middle" font-size="11.5" fill="#4a7a3a">加法交换律 ⟹ 与执行顺序无关</text>

  <!-- one-line box -->
  <g filter="url(#sk)"><rect x="390" y="262" width="250" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="515" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">一行核心代码</text>
  <text x="515" y="306" text-anchor="middle" font-size="12" fill="#446688">x += (op[1] == '+') ? 1 : -1</text>
  <text x="515" y="324" text-anchor="middle" font-size="11" fill="#6b7f99">每串一次字符比较，O(n) / O(1)</text>

  <text x="340" y="366" text-anchor="middle" font-size="11" fill="#888">把四路完整字符串比较压缩成一次字符比较——签到题的最短路径</text>
</svg>
