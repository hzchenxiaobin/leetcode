<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：分组一趟 + 每组一趟，滚动前缀和免建数组</text>

  <!-- step 1 -->
  <rect x="80" y="46" width="400" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 哈希分组（一趟，O(n)）</text>
  <text x="280" y="88" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">for i = 0..n−1：pos[nums[i]].push_back(i)（天然升序）</text>

  <path d="M 280 100 L 280 120" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="80" y="124" width="400" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">② 对每个组 g：total ← Σp，prefix ← 0，i ← 0</text>
  <text x="280" y="166" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">total 先一趟求好，主循环里 O(1) 取用</text>

  <path d="M 280 178 L 280 198" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="280,200 372,240 280,280 188,240" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="245" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; m ?</text>

  <!-- no branch -->
  <path d="M 372 240 L 428 240" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="230" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="432" y="218" width="112" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="488" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">下一组；全处理完</text>
  <text x="488" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 返回 ans</text>

  <!-- yes branch -->
  <path d="M 280 280 L 280 300" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="294" font-size="11" fill="#888" filter="url(#rough2)">是</text>

  <!-- step 3 -->
  <rect x="172" y="304" width="330" height="88" fill="#ffffff" stroke="#888" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="337" y="326" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">③ p = g[i]，ans[p] =</text>
  <text x="337" y="348" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">left = i·p − prefix</text>
  <text x="337" y="368" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold" filter="url(#rough2)">+ right = (total − prefix − p)</text>
  <text x="337" y="386" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold" filter="url(#rough2)">− (m−1−i)·p</text>

  <path d="M 280 392 L 280 410" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="150" y="414" width="260" height="44" fill="#ffffff" stroke="#888" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="440" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">④ prefix += p；i += 1</text>

  <!-- loop back edge -->
  <path d="M 150 436 L 138 436 L 138 240 L 184 240" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="128" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" transform="rotate(-90 128 342)">回到判定</text>
</svg>
