<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">U 的三个来源：一个都不能违例，且约束都是「起点必须更深」</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">把 root→v 路径上每个值的出现深度记成栈，就得到两个阈值</text>
  <rect x="24" y="62" width="512" height="148" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">约束一：没有值出现三次</text>
  <text x="280" y="112" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">值 x 在路径上出现深度 o₁ &lt; o₂ &lt; … &lt; o_k</text>
  <text x="280" y="136" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">要保证 u 之上只可能出现 2 个 ⇒ U &gt; o_{k−2}</text>
  <text x="280" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">b1 = max(所有出现 ≥ 3 次的值) o_{k−2}     ⇒  U ≥ b1 + 1</text>
  <text x="280" y="190" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">例：值 7 出现在深度 0,1,2，则起点必须 ≥ 1</text>
  <rect x="24" y="224" width="512" height="148" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">约束二：最多一个值出现两次</text>
  <text x="280" y="274" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">s_x = x 的倒数第二次出现深度（s_x ≥ U ⟺ 区间里 x 出现 ≥ 2 次）</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">要求 |{x : s_x ≥ U}| ≤ 1  ⇒  U &gt; s_(2)（所有 s 的第二大）</text>
  <text x="280" y="324" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s2 = 第二大的 s_x                ⇒  U ≥ s2 + 1</text>
  <text x="280" y="352" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">例：两个值各出现两次，起点必须比「较深的那个重复」更深</text>
  <rect x="24" y="380" width="512" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">U = max(b1 + 1, s2 + 1, 0)，且 U ≤ dep[v] 恒成立</text>
  <text x="280.0" y="418" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">两个阈值都只会随深度增加，DFS 里用可删除多重集合维护即可</text>
</svg>
