<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：外层枚举 i，内层 j 右移 + 增量计数 + 扫 26 求美丽值</text>

  <ellipse cx="110" cy="66" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="71" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">ans = 0</text>

  <path d="M 158 66 L 196 66" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="196,44 310,66 196,88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="222" y="70" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 310 66 L 348 66" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="58" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="348" y="46" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="423" y="64" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">cnt[0..25] 清零</text>
  <text x="423" y="79" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（新左端点重新计数）</text>

  <path d="M 423 86 L 423 116" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="423,116 526,142 423,168 320,142" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="423" y="139" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">j &lt; n ?</text>
  <text x="423" y="156" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">(j 从 i 开始)</text>

  <path d="M 423 168 L 423 196" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="188" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="348" y="196" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="423" y="219" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">cnt[s[j]−'a'] += 1</text>

  <path d="M 423 232 L 423 258" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="328" y="258" width="190" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="423" y="278" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">扫 c = 0..25（跳过 cnt[c]=0）</text>
  <text x="423" y="296" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">求 mx 与 mn，ans += mx − mn</text>

  <!-- j++ 回环 -->
  <path d="M 328 284 Q 300 284 300 142 L 310 142" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="220" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">j++</text>

  <!-- j 结束回 i -->
  <path d="M 526 142 Q 546 142 546 120" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 546 120 Q 546 26 310 26 Q 240 20 232 40" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="544" y="112" font-size="10.5" fill="#999" filter="url(#rough2)">否</text>

  <!-- i 结束 -->
  <path d="M 196 66 Q 130 60 96 96" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="52" font-size="11" fill="#999" filter="url(#rough2)">否</text>
  <rect x="40" y="98" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="105" y="123" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">return ans</text>

  <!-- 复杂度框 -->
  <rect x="40" y="330" width="480" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="56" y="352" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">两层循环共 n(n+1)/2 个子串，每个子串常数工作 = 1 次计数 + 26 次比较，</text>
  <text x="56" y="372" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">总时间 O(n²·26)；计数数组复用同一份，空间 O(26)。</text>
</svg>
