<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="151" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">递枕头折返模型：一个周期 = 去程 + 回程 = 2(n−1) 秒</text>
  <path d="M 90 40 Q 320 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic">以 n = 4 为例：人员编号 1 ~ 4，枕头从 1 号出发向右传</text>

  <!-- 去程 label -->
  <text x="320" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">去程：1 → 2 → 3 → 4（n−1 = 3 秒）</text>

  <!-- 去程 arrows -->
  <g filter="url(#sk)" stroke="#4a8edb" stroke-width="1.8" fill="none">
    <path d="M 226 94 L 246 94" marker-end="url(#ar)"/>
    <path d="M 310 94 L 330 94" marker-end="url(#ar)"/>
    <path d="M 394 94 L 414 94" marker-end="url(#ar)"/>
  </g>

  <!-- people boxes -->
  <g filter="url(#sk)">
    <rect x="166" y="102" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="250" y="102" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="334" y="102" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="418" y="102" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="194" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <text x="278" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <text x="362" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">3</text>
  <text x="446" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>

  <!-- 回程 arrows -->
  <g filter="url(#sk)" stroke="#4a8e4a" stroke-width="1.8" fill="none">
    <path d="M 414 144 L 394 144" marker-end="url(#ar)"/>
    <path d="M 330 144 L 310 144" marker-end="url(#ar)"/>
    <path d="M 246 144 L 226 144" marker-end="url(#ar)"/>
  </g>

  <!-- 回程 label -->
  <text x="320" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">回程：4 → 3 → 2 → 1（再 n−1 = 3 秒）</text>

  <!-- cycle dashed arc -->
  <path d="M 162 148 C 92 148, 92 88, 158 88" stroke="#b85450" stroke-width="1.6" fill="none"
        stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- fold cards -->
  <g filter="url(#sk)">
    <rect x="40" y="190" width="275" height="88" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="177" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">情况一：r &lt; n（枕头还在去程）</text>
  <text x="177" y="232" text-anchor="middle" font-size="12" fill="#5a7a9e" filter="url(#sk)">从 1 号向右传 r 秒，未到队尾或恰好到队尾</text>
  <text x="177" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">ans = r + 1</text>

  <g filter="url(#sk)">
    <rect x="325" y="190" width="275" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="462" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">情况二：r ≥ n（枕头已折返）</text>
  <text x="462" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk)">从队尾 n 往回走 r−(n−1) 秒</text>
  <text x="462" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 2(n−1) − r + 1</text>

  <!-- formula bar -->
  <g filter="url(#sk)">
    <rect x="40" y="294" width="560" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">r = time mod 2(n−1) —— 答案只由余数 r 决定（1 编号别忘了 +1）</text>

  <!-- footer -->
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">T = 2(n−1) 秒后枕头回到「1 号 + 向右」的初始状态，此后运动逐秒重复上一周期</text>
</svg>
