<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 445"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="445" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：三个因子中至多一个被"换新"</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums array -->
  <text x="170" y="84" text-anchor="end" font-size="14" fill="#2b2b2b">nums =</text>
  <g filter="url(#sk)">
    <rect x="191" y="58" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="257" y="58" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="6,4"/>
    <rect x="323" y="58" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="389" y="58" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="221" y="83">−4</text>
    <text x="287" y="83">−2</text>
    <text x="353" y="83">−1</text>
    <text x="419" y="83">−3</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <text x="221" y="112" fill="#2e5e22" font-weight="bold">A = |−4|</text>
    <text x="287" y="112" fill="#a06a10" font-weight="bold">替换它 →</text>
    <text x="419" y="112" fill="#2e5e22" font-weight="bold">B = |−3|</text>
  </g>

  <path d="M 287 118 Q 287 132 287 140" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="180" y="146" width="280" height="34" rx="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="168" text-anchor="middle" font-size="13" fill="#7a5415">v = +10⁵（符号与 (−4)·(−3) 同号）</text>

  <path d="M 320 184 Q 320 198 320 206" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="150" y="212" width="340" height="40" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="320" y="237" text-anchor="middle" font-size="13.5" fill="#333">乘积 = v × (−4) × (−3) = 10⁵ × 12 = 1 200 000</text>

  <!-- upper bound box -->
  <g filter="url(#sk)">
    <rect x="40" y="278" width="280" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="180" y="302" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">上界：谁都超不过</text>
  <text x="180" y="322" text-anchor="middle" font-size="12" fill="#2b4a6e">|v| ≤ 10⁵，|nums[i]| ≤ 10⁵</text>
  <text x="180" y="341" text-anchor="middle" font-size="12" fill="#2b4a6e">⇒ 任何乘积 ≤ 10⁵ × A × B</text>

  <!-- achievable box -->
  <g filter="url(#sk)">
    <rect x="340" y="278" width="264" height="78" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="472" y="302" text-anchor="middle" font-size="13" fill="#2e5e22" font-weight="bold">可达：构造出等号</text>
  <text x="472" y="322" text-anchor="middle" font-size="12" fill="#2e5e22">第三个下标替换为 ±10⁵</text>
  <text x="472" y="341" text-anchor="middle" font-size="12" fill="#2e5e22">与 A、B 搭档 ⇒ 恰好取到</text>

  <path d="M 320 360 L 320 376" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="140" y="382" width="360" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="408" text-anchor="middle" font-size="14" fill="#8e3a34" font-weight="bold">结论：ans = 10⁵ × A × B</text>
  <text x="320" y="436" text-anchor="middle" font-size="10.5" fill="#888">A、B：数组中绝对值最大与次大的两个元素（不同下标）</text>
</svg>
