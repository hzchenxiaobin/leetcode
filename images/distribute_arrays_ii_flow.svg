<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">第 i 次操作（i ≥ 3）的决策流程</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="64" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">前两次固定：nums[1] → arr1，nums[2] → arr2，比较只在 i ≥ 3 时发生</text>

  <!-- 取值框 -->
  <g filter="url(#rough2)">
    <rect x="225" y="76" width="190" height="36" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  </g>
  <text x="320" y="99" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取 x = nums[i]，r ← rank(x)</text>
  <path d="M 320 112 L 320 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数框 -->
  <g filter="url(#rough2)">
    <rect x="175" y="126" width="290" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="148" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c₁ ← len₁ − query₁(r)</text>
  <text x="320" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c₂ ← len₂ − query₂(r)</text>
  <path d="M 320 180 L 320 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：c1 > c2 ? -->
  <g filter="url(#rough2)">
    <polygon points="320,200 396,228 320,256 244,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="233" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">c₁ ＞ c₂ ？</text>
  <path d="M 244 228 L 158 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="44" y="206" width="112" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="100" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">入 arr1</text>
  <text x="100" y="242" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">追加 + update₁(r)</text>
  <path d="M 320 256 L 320 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="333" y="268" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 菱形 2：c1 < c2 ? -->
  <g filter="url(#rough2)">
    <polygon points="320,270 396,298 320,326 244,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="303" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">c₁ ＜ c₂ ？</text>
  <path d="M 396 298 L 482 298" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="484" y="276" width="112" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="540" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">入 arr2</text>
  <text x="540" y="312" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">追加 + update₂(r)</text>
  <path d="M 320 326 L 320 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="333" y="338" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 菱形 3：len1 <= len2 ? -->
  <g filter="url(#rough2)">
    <polygon points="320,340 396,368 320,396 244,368" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="373" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">len₁ ≤ len₂ ？</text>
  <path d="M 244 368 L 158 368" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="44" y="346" width="112" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="100" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">入 arr1</text>
  <text x="100" y="382" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">等长时也归 arr1</text>
  <path d="M 396 368 L 482 368" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="484" y="346" width="112" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="540" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">入 arr2</text>
  <text x="540" y="382" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">len₁ ＞ len₂</text>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="40" y="414" width="560" height="44" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="436" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">平局链：计数相等 → 比长度；长度也相等 → 归 arr1</text>
  <text x="320" y="452" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">n 次操作结束后按插入顺序连接：result = arr1 + arr2</text>
</svg>
