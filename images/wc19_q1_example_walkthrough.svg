<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：100 → “202”，-7 → “-10”，0 → “0”</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每轮记录余数 r，商降到 0 时停止，再把余数序列反转</text>

  <text x="40" y="72" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">num = 100（正数，neg = false，不补符号）</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="40" y="82" width="430" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="80" y="102" fill="#3a4a66">步骤</text>
    <text x="160" y="102" fill="#3a4a66">n</text>
    <text x="240" y="102" fill="#3a4a66">n ÷ 7 = q</text>
    <text x="320" y="102" fill="#3a4a66">商 q</text>
    <text x="415" y="102" fill="#3a4a66">余数 r</text>

    <rect x="40" y="112" width="430" height="30" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.1" rx="4"/>
    <text x="80" y="132" fill="#555">1</text>
    <text x="160" y="132" fill="#555">100</text>
    <text x="240" y="132" fill="#555">14</text>
    <text x="320" y="132" fill="#555">14</text>
    <text x="415" y="132" fill="#8a6a20">2 → 最低位</text>

    <rect x="40" y="142" width="430" height="30" fill="#f7fbff" stroke="#c9d6e4" stroke-width="1.1" rx="4"/>
    <text x="80" y="162" fill="#555">2</text>
    <text x="160" y="162" fill="#555">14</text>
    <text x="240" y="162" fill="#555">2</text>
    <text x="320" y="162" fill="#555">2</text>
    <text x="415" y="162" fill="#8a6a20">0</text>

    <rect x="40" y="172" width="430" height="30" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.1" rx="4"/>
    <text x="80" y="192" fill="#555">3</text>
    <text x="160" y="192" fill="#555">2</text>
    <text x="240" y="192" fill="#555">0</text>
    <text x="320" y="192" fill="#555">0</text>
    <text x="415" y="192" fill="#8a6a20">2 → 最高位</text>
  </g>

  <text x="40" y="222" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">余数序列 2, 0, 2（低位在前）→ 反转 → “202”；验证 2×49 + 0×7 + 2 = 100</text>

  <text x="40" y="254" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">num = -7（负数：先取绝对值 7，最后在最前面补 '-'）</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="40" y="264" width="430" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="80" y="284" fill="#8a3a36">步骤</text>
    <text x="160" y="284" fill="#8a3a36">n</text>
    <text x="240" y="284" fill="#8a3a36">n ÷ 7 = q</text>
    <text x="320" y="284" fill="#8a3a36">商 q</text>
    <text x="415" y="284" fill="#8a3a36">余数 r</text>

    <rect x="40" y="294" width="430" height="30" fill="#ffffff" stroke="#e8c4c8" stroke-width="1.1" rx="4"/>
    <text x="80" y="314" fill="#555">1</text>
    <text x="160" y="314" fill="#555">7</text>
    <text x="240" y="314" fill="#555">1</text>
    <text x="320" y="314" fill="#555">1</text>
    <text x="415" y="314" fill="#8a6a20">0</text>

    <rect x="40" y="324" width="430" height="30" fill="#fff7f8" stroke="#e8c4c8" stroke-width="1.1" rx="4"/>
    <text x="80" y="344" fill="#555">2</text>
    <text x="160" y="344" fill="#555">1</text>
    <text x="240" y="344" fill="#555">0</text>
    <text x="320" y="344" fill="#555">0</text>
    <text x="415" y="344" fill="#8a6a20">1</text>
  </g>

  <text x="40" y="374" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">余数 0, 1 → 反转得 “10” → 补负号 → “-10”；验证 -(1×7 + 0) = -7</text>

  <g filter="url(#rough2)">
    <rect x="40" y="388" width="470" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8"/>
    <text x="56" y="406" font-size="10.5" fill="#8a6a20">num = 0 特判：循环一次都不执行，必须直接返回 “0”，而不是空串</text>
  </g>
</svg>
