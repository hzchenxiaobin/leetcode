<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#b85450" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：同一对角线 ⇔ i + j 相同</text>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">示例 2 的锯齿矩阵：同色格子在同一条对角线上，红色 = s = 2 那条</text>

  <text x="100" y="99" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="100" y="136" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="100" y="173" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="100" y="210" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">i=3</text>
  <text x="100" y="247" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">i=4</text>

  <rect x="112" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4660" filter="url(#rough2)">1</text>
  <rect x="159" y="78" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424" filter="url(#rough2)">2</text>
  <rect x="206" y="78" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="253" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4660" filter="url(#rough2)">4</text>
  <rect x="300" y="78" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424" filter="url(#rough2)">5</text>

  <rect x="112" y="115" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424" filter="url(#rough2)">6</text>
  <rect x="159" y="115" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>
  <rect x="206" y="115" width="42" height="32" fill="none" stroke="#bbb" stroke-width="1.3" stroke-dasharray="5,4" rx="4" filter="url(#rough2)"/>
  <text x="227" y="136" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">✗</text>
  <text x="256" y="134" font-size="10.5" fill="#999" filter="url(#rough2)">← (1,2) 不存在</text>

  <rect x="112" y="152" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">8</text>

  <rect x="112" y="189" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4660" filter="url(#rough2)">9</text>
  <rect x="159" y="189" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424" filter="url(#rough2)">10</text>
  <rect x="206" y="189" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07420" filter="url(#rough2)">11</text>

  <rect x="112" y="226" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424" filter="url(#rough2)">12</text>
  <rect x="159" y="226" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07420" filter="url(#rough2)">13</text>
  <rect x="206" y="226" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4660" filter="url(#rough2)">14</text>
  <rect x="253" y="226" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424" filter="url(#rough2)">15</text>
  <rect x="300" y="226" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07420" filter="url(#rough2)">16</text>

  <path d="M 102 190 Q 178 132 254 70" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="66" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">↗ s = 2</text>

  <rect x="60" y="278" width="400" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11.5" fill="#8a3a40" filter="url(#rough2)">高亮对角线 s = 2：(2,0)、(1,1)、(0,2) 的 i + j 全都等于 2</text>
  <text x="260" y="325" text-anchor="middle" font-size="11.5" fill="#8a3a40" filter="url(#rough2)">沿 ↗ 方向每步 (i+1, j−1)，i + j 守恒 ⇒ 天然的桶号</text>
  <text x="260" y="348" text-anchor="middle" font-size="11.5" fill="#8a3a40" filter="url(#rough2)">缺口 (1,2) 不存在：s = 3 的对角线只是少一个格子，规则不变</text>
</svg>
