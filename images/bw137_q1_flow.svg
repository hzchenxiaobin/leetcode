<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">暴力做法：枚举 n - k + 1 个窗口，各自判定</text>

  <rect x="170" y="48" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="74" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">输入 nums, k（n 个元素）</text>

  <path d="M 270 90 L 270 110" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="112" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">for 起点 i = 0 .. n - k</text>
  <text x="270" y="150" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">考虑子数组 nums[i .. i + k - 1]</text>

  <path d="M 270 158 L 270 178" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,180 400,222 270,264 140,222" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">所有相邻差都是 +1 ？</text>
  <text x="270" y="234" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">nums[j] == nums[j-1] + 1</text>

  <path d="M 216 252 L 150 292" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="278" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 324 252 L 392 292" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="278" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="58" y="294" width="184" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="314" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">results[i] = nums[i+k-1]</text>
  <text x="150" y="331" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">严格递增，末元素即最大值</text>

  <rect x="300" y="294" width="184" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="392" y="314" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">results[i] = -1</text>
  <text x="392" y="331" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">存在断点，整段作废</text>

  <text x="270" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">总代价 O((n - k + 1) × k) ≤ O(n^2)，n ≤ 500 足够</text>
</svg>
