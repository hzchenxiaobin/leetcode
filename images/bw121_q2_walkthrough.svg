<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="344" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：把 4 改成 1，差在 bit2 与 bit0</text>
  <rect x="60" y="60" width="440" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2 XOR 1 XOR 3 XOR 4 = 010₂ XOR 001₂ XOR 011₂ XOR 100₂ = 100₂ = 4</text>
  <rect x="60" y="112" width="200" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="140" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">x = 4 = 100₂</text>
  <rect x="300" y="112" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="140" text-anchor="middle" font-size="14" fill="#1c3a1c" filter="url(#rough2)">k = 1 = 001₂</text>
  <path d="M160,156 L160,184" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <path d="M400,156 L400,184" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="90" y="186" width="400" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x XOR k = 100₂ XOR 001₂ = 101₂ → bit2 与 bit0 不同，答案 2</text>
  <rect x="70" y="244" width="200" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="266" text-anchor="middle" font-size="11.5" fill="#7a3030" filter="url(#rough2)">操作 1：翻 3 的 bit0</text>
  <text x="170" y="286" text-anchor="middle" font-size="11" fill="#7a3030" filter="url(#rough2)">011₂ → 010₂</text>
  <text x="170" y="304" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">数组变为 [2,1,2,4]</text>
  <rect x="292" y="244" width="200" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="266" text-anchor="middle" font-size="11.5" fill="#7a3030" filter="url(#rough2)">操作 2：翻 2 的 bit2</text>
  <text x="392" y="286" text-anchor="middle" font-size="11" fill="#7a3030" filter="url(#rough2)">010₂ → 110₂</text>
  <text x="392" y="304" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">数组变为 [6,1,2,4]，异或 = 1</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#1c3a1c" filter="url(#rough2)">6 XOR 1 XOR 2 XOR 4 = 001₂ = k ✓</text>
</svg>
