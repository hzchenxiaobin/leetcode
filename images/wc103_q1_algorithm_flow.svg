<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="240" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">三步求解，与其余元素无关</text>
  <rect x="40" y="74" width="160" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120.0" y="104.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">求 min 与 max</text>
  <path d="M 200,100 L 248,100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="248" y="74" width="180" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="338.0" y="104.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = (max − min) − 2k</text>
  <path d="M 428,100 L 476,100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="476" y="74" width="128" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540.0" y="104.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 max(0, d)</text>
  <text x="310" y="176" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">中间的 n−2 个元素只需「夹」进目标区间，不会改变极差</text>
  <text x="310" y="210" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">k = 0 时退化为原极差；d &lt; 0 时说明所有元素能调成同一个值</text>
</svg>
