<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">转移模型：读低 v 位 [0, v−1]，写 [v, 2v−1]，读写区不相交</text>
  <text x="260" y="47" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">处理 v = 4：此前的 1、2、3 已让 {0..5} 可达</text>

  <!-- arrows above cells: j -> j+4 -->
  <path d="M74,94 C74,68 202,68 202,92" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M106,94 C106,74 234,74 234,92" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M138,94 C138,80 266,80 266,92" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M170,94 C170,86 298,86 298,92" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="186" y="62" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">j → j + v（要求 j &lt; v）</text>

  <!-- dp strip: 12 cells, x=58+32i, y=98, w=32, h=38 -->
  <rect x="58"  y="98" width="32" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="90"  y="98" width="32" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="122" y="98" width="32" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="154" y="98" width="32" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="186" y="98" width="32" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="218" y="98" width="32" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="250" y="98" width="32" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="282" y="98" width="32" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="314" y="98" width="32" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="346" y="98" width="32" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="378" y="98" width="32" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="98" width="32" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="74"  y="122" text-anchor="middle" font-size="13" fill="#2d4d24" filter="url(#rough2)">0</text>
  <text x="106" y="122" text-anchor="middle" font-size="13" fill="#2d4d24" filter="url(#rough2)">1</text>
  <text x="138" y="122" text-anchor="middle" font-size="13" fill="#2d4d24" filter="url(#rough2)">2</text>
  <text x="170" y="122" text-anchor="middle" font-size="13" fill="#2d4d24" filter="url(#rough2)">3</text>
  <text x="202" y="122" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">4</text>
  <text x="234" y="122" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">5</text>
  <text x="266" y="122" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">6</text>
  <text x="298" y="122" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">7</text>
  <text x="330" y="122" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">8</text>
  <text x="362" y="122" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">9</text>
  <text x="394" y="122" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">10</text>
  <text x="426" y="122" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">11</text>

  <!-- read / write zone overlays -->
  <rect x="55" y="95" width="132" height="44" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="6,4" rx="6" filter="url(#rough2)"/>
  <rect x="184" y="95" width="132" height="44" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" rx="6" filter="url(#rough2)"/>

  <text x="121" y="160" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">读区 [0, v−1]：x &lt; v 才能取 v</text>
  <text x="250" y="160" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">写区 [v, 2v−1]：落点 x + v</text>

  <!-- bullets -->
  <rect x="44" y="184" width="432" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">读区 ∩ 写区 = ∅ ⟹ 同一个 v 天然只用一次，j 正序 / 倒序枚举都正确</text>

  <rect x="44" y="226" width="432" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="247" text-anchor="middle" font-size="12.5" fill="#2d4d24" filter="url(#rough2)">dp[j] = true ⟺ 总奖励恰为 j 可达；初始 dp[0] = true</text>

  <rect x="44" y="268" width="432" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">总和上界 S ≤ 2·v_max − 1 ⟹ dp 只需开 2·v_max（≤ 4000）</text>

  <rect x="44" y="310" width="432" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="12.5" fill="#7c2b28" filter="url(#rough2)">处理完全部值后：答案 = max{ j : dp[j] = true }</text>

  <text x="260" y="372" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">位运算视角：f |= (f &amp; ((1 &lt;&lt; v) − 1)) &lt;&lt; v —— Q4 的同款转移</text>
</svg>
