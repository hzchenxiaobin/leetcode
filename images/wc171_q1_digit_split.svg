<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">无零条件是逐位的：最低位管进位，高位和是同一个子问题</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = 10q + r，a = 10a' + x，b = 10b' + y，其中 x、y ∈ [1,9] 天生非零</text>

  <!-- 左侧：逐列加法 -->
  <text x="40" y="76" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">n = 1010 = 111 + 899</text>
  <text x="40" y="102" font-size="11" fill="#444" filter="url(#rough2)">个位：1 + 9 = 10 → 写 0，进 1</text>
  <text x="40" y="126" font-size="11" fill="#444" filter="url(#rough2)">十位：1 + 9 + 1 = 11 → 写 1，进 1</text>
  <text x="40" y="150" font-size="11" fill="#444" filter="url(#rough2)">百位：1 + 8 + 1 = 10 → 写 0，进 1</text>
  <text x="40" y="174" font-size="11" fill="#444" filter="url(#rough2)">千位：0 + 0 + 1 = 1 → 正好收尾</text>
  <text x="40" y="202" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a = 111、b = 899，都不含 0 ✓</text>

  <!-- 右侧：数字列（右对齐） -->
  <g filter="url(#rough2)">
    <rect x="300" y="76" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="323" y="99" text-anchor="middle" font-size="16" fill="#8c3b36">1</text>
    <rect x="354" y="76" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="377" y="99" text-anchor="middle" font-size="16" fill="#8c3b36">0</text>
    <rect x="408" y="76" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="431" y="99" text-anchor="middle" font-size="16" fill="#8c3b36">1</text>
    <rect x="462" y="76" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="485" y="99" text-anchor="middle" font-size="16" fill="#8c3b36">0</text>

    <rect x="354" y="132" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="377" y="155" text-anchor="middle" font-size="16" fill="#3d6b2f">1</text>
    <rect x="408" y="132" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="431" y="155" text-anchor="middle" font-size="16" fill="#3d6b2f">1</text>
    <rect x="462" y="132" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="485" y="155" text-anchor="middle" font-size="16" fill="#3d6b2f">1</text>

    <rect x="354" y="188" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="377" y="211" text-anchor="middle" font-size="16" fill="#8a6a20">8</text>
    <rect x="408" y="188" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="431" y="211" text-anchor="middle" font-size="16" fill="#8a6a20">9</text>
    <rect x="462" y="188" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="485" y="211" text-anchor="middle" font-size="16" fill="#8a6a20">9</text>
  </g>

  <text x="290" y="99" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">n =</text>
  <text x="290" y="155" text-anchor="end" font-size="12" fill="#3d6b2f" filter="url(#rough2)">a =</text>
  <text x="290" y="211" text-anchor="end" font-size="12" fill="#8a6a20" filter="url(#rough2)">b =</text>

  <!-- 括号标注 -->
  <path d="M354,228 L354,236 L454,236 L454,228" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M462,228 L462,236 L508,236 L508,228" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="404" y="254" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">高位和 11 + 89</text>
  <text x="485" y="254" text-anchor="middle" font-size="10.5" fill="#8c3b36" filter="url(#rough2)">最低位对</text>

  <!-- 公式框 -->
  <g filter="url(#rough2)">
    <rect x="40" y="272" width="480" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="280" y="294" text-anchor="middle" font-size="12.5" fill="#2f4a66">10·(a' + b') + (x + y) = 10q + r</text>
    <text x="280" y="316" text-anchor="middle" font-size="11" fill="#2f4a66">x + y = r ⇒ a' + b' = q　　x + y = r + 10 ⇒ a' + b' = q − 1</text>
    <text x="280" y="338" text-anchor="middle" font-size="11" fill="#2f4a66">于是只需递归求「和为 q 或 q − 1」的同类问题，再拼上最低位</text>
  </g>

  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">关键：x、y 只要求落在 1..9，n 的 0 位反而被 1 + 9 = 10 的进位「填掉」</text>
</svg>
