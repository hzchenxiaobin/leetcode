<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：删一条边 = 摘走一棵子树</text>
  <path d="M 150 34 Q 330 42 510 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：示例 1 的树 -->
  <text x="165" y="62" text-anchor="middle" font-size="12" fill="#888">示例 1：nums = [1,5,5,4,11]</text>

  <!-- 子树(3) 虚线框 -->
  <g filter="url(#sk)"><rect x="200" y="230" width="82" height="156" rx="12" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5"/></g>
  <text x="241" y="404" text-anchor="middle" font-size="11" fill="#a04a48">subtree(3) = {3,4}</text>

  <!-- 边 -->
  <g filter="url(#sk)">
    <path d="M 170 95 L 170 170" stroke="#7a8ba0" stroke-width="1.8" fill="none"/>
    <path d="M 170 170 L 105 255" stroke="#7a8ba0" stroke-width="1.8" fill="none"/>
    <path d="M 170 170 L 235 255" stroke="#7a8ba0" stroke-width="1.8" fill="none"/>
    <path d="M 235 255 L 235 335" stroke="#7a8ba0" stroke-width="1.8" fill="none"/>
  </g>

  <!-- 删边 (1,3) 的 ✗ -->
  <g filter="url(#sk)">
    <path d="M 197 202 L 213 216" stroke="#b85450" stroke-width="2.6" fill="none"/>
    <path d="M 213 202 L 197 216" stroke="#b85450" stroke-width="2.6" fill="none"/>
  </g>
  <text x="190" y="212" text-anchor="end" font-size="10.5" font-weight="bold" fill="#a04a48">删 (1,3)</text>

  <!-- 节点 -->
  <g filter="url(#sk)"><circle cx="170" cy="95" r="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="170" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">0</text>
  <text x="170" y="105" text-anchor="middle" font-size="9.5" fill="#2b6e9e">1</text>
  <text x="196" y="100" font-size="10.5" font-weight="bold" fill="#2e5e2e">xor=14</text>

  <g filter="url(#sk)"><circle cx="170" cy="170" r="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="170" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="170" y="180" text-anchor="middle" font-size="9.5" fill="#2b6e9e">5</text>
  <text x="196" y="175" font-size="10.5" font-weight="bold" fill="#2e5e2e">xor=15</text>

  <g filter="url(#sk)"><circle cx="105" cy="255" r="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="105" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="105" y="265" text-anchor="middle" font-size="9.5" fill="#2b6e9e">5</text>
  <text x="105" y="292" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">xor=5</text>

  <g filter="url(#sk)"><circle cx="235" cy="255" r="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="235" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="235" y="265" text-anchor="middle" font-size="9.5" fill="#2b6e9e">4</text>
  <text x="235" y="292" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">xor=15</text>

  <g filter="url(#sk)"><circle cx="235" cy="335" r="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="235" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="235" y="345" text-anchor="middle" font-size="9.5" fill="#2b6e9e">11</text>
  <text x="235" y="372" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">xor=11</text>

  <!-- total 注记 -->
  <g filter="url(#sk)"><rect x="40" y="418" width="250" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="165" y="442" text-anchor="middle" font-size="11.5" font-family="monospace" font-weight="bold" fill="#7a5415">total = 1⊕5⊕5⊕4⊕11 = 14 = xor[0]</text>

  <!-- 右：代数翻译 -->
  <g filter="url(#sk)"><rect x="322" y="58" width="310" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="477" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">以 0 定根：n−1 条边 ↔ n−1 个候选断点</text>
  <text x="477" y="96" text-anchor="middle" font-size="10.5" fill="#555">每个非根节点 c 恰对应一条父边</text>

  <path d="M 477 106 L 477 120" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="322" y="122" width="310" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="477" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">删边 (p,c) ⇒ 切出两段：subtree(c) 与 其余</text>
  <text x="477" y="162" text-anchor="middle" font-size="12" font-family="monospace" font-weight="bold" fill="#2e5e2e">XOR = ( xor[c] , total ⊕ xor[c] )</text>

  <path d="M 477 174 L 477 188" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="322" y="190" width="310" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="477" y="210" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">被摘子树两两不交 ⇒ 可从 total 逐个「抠掉」</text>
  <text x="477" y="228" text-anchor="middle" font-size="11" fill="#555">两条边的情形同理（见下图）</text>

  <g filter="url(#sk)"><rect x="322" y="254" width="310" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="477" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04a48">全程唯一的公式工具：消去律</text>
  <text x="477" y="297" text-anchor="middle" font-size="12" font-family="monospace" font-weight="bold" fill="#a04a48">x ⊕ x = 0 —— 异或掉即「减去」</text>
  <text x="477" y="318" text-anchor="middle" font-size="12" font-family="monospace" font-weight="bold" fill="#a04a48">差集 XOR = xor[外] ⊕ xor[内]</text>
  <text x="477" y="338" text-anchor="middle" font-size="10" fill="#555">既算「其余段」，也算嵌套时的「中段」</text>

  <g filter="url(#sk)"><rect x="322" y="362" width="310" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="477" y="386" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">一次后序 DFS 之后</text>
  <text x="477" y="406" text-anchor="middle" font-size="11.5" fill="#2e5e2e">任意删边方案的任何分量 XOR</text>
  <text x="477" y="426" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">都变成 O(1) 纯算术 —— O(n²) 的入场券</text>
</svg>
