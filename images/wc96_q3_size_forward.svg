<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="700" height="360" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">第一遍：只算长度，不真正解码（s = "leet2code3"）</text>

  <rect x="24" y="46" width="652" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">读入字符</text>
  <text x="160" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">l</text>
  <text x="220" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">e</text>
  <text x="280" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">e</text>
  <text x="340" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">t</text>
  <text x="400" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">2</text>
  <text x="470" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">c</text>
  <text x="530" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">o</text>
  <text x="580" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">d</text>
  <text x="630" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">e</text>
  <text x="676" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">3</text>

  <rect x="24" y="74" width="652" height="30" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="94" font-size="11" fill="#444" filter="url(#rough2)">size</text>
  <text x="166" y="94" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="226" y="94" font-size="11" fill="#444" filter="url(#rough2)">2</text>
  <text x="286" y="94" font-size="11" fill="#444" filter="url(#rough2)">3</text>
  <text x="346" y="94" font-size="11" fill="#444" filter="url(#rough2)">4</text>
  <text x="400" y="94" font-size="11" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="470" y="94" font-size="11" fill="#444" filter="url(#rough2)">9</text>
  <text x="530" y="94" font-size="11" fill="#444" filter="url(#rough2)">10</text>
  <text x="580" y="94" font-size="11" fill="#444" filter="url(#rough2)">11</text>
  <text x="632" y="94" font-size="11" fill="#444" filter="url(#rough2)">12</text>
  <text x="676" y="94" font-size="11" fill="#b85450" filter="url(#rough2)">36</text>

  <text x="40" y="132" font-size="11" fill="#666" filter="url(#rough2)">字母：size += 1　；　数字 d：size *= d</text>

  <!-- 解码内容示意 -->
  <text x="24" y="172" font-size="12" fill="#333" filter="url(#rough2)">解码结果（36 个字符）：</text>
  <rect x="24" y="182" width="264" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="156" y="204" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">"leet" → "leetleet"（8）</text>
  <rect x="300" y="182" width="376" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="488" y="204" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">+"code" → "leetleetcode"（12）→ 重复 3 次 = 36</text>

  <text x="24" y="248" font-size="12" fill="#446688" filter="url(#rough2)">k = 10 落在第 2 个周期的第 10 个字符处 → 等价于模板 "leetleetcode" 的第 10 个字符 → 'o'</text>

  <rect x="24" y="264" width="652" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="350" y="288" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">为什么要先算总长？因为 k 只有 1e9，而解码后的串可能长到 2^63</text>
  <text x="350" y="310" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">「a2345678999999999999999」解码后长度达 8.3e18，物理上无法构造，只能靠「长度 + 折叠」定位</text>
  <text x="350" y="332" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">第一遍只需 O(|s|) = O(100) 次乘加，size 用 64 位整数（C++ 用 long long）</text>
</svg>
