<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">每个连续的 1 块 + 它前面那格 0 = 一个窗口</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">窗口长度 = 块长 + 1，恰好只能覆盖 len 个位置 ⇒ 丢掉最小的那个</text>
  <text x="40" y="84" text-anchor="start" font-size="11" fill="#333" font-weight="bold">nums = [9, 2, 6, 1]，s = "0101"</text>
  <rect x="90" y="98" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="126" y="127" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">9</text>
  <text x="126" y="158" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <rect x="172" y="98" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="208" y="127" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="208" y="158" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <rect x="254" y="98" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="290" y="127" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">6</text>
  <text x="290" y="158" text-anchor="middle" font-size="9" fill="#888">i=2</text>
  <rect x="336" y="98" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="372" y="127" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="372" y="158" text-anchor="middle" font-size="9" fill="#888">i=3</text>
  <text x="126" y="180" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="208" y="180" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="290" y="180" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="372" y="180" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="44" y="180" text-anchor="start" font-size="10" fill="#888">s =</text>
  <rect x="60" y="196" width="216" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="168" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">块 1 = {1}，窗口 [0,1]</text>
  <text x="168" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">值 9+2 = 11，丢掉 min=2 → 9</text>
  <rect x="292" y="196" width="216" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">块 2 = {3}，窗口 [2,3]</text>
  <text x="400" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">值 6+1 = 7，丢掉 min=1 → 6</text>
  <rect x="40" y="268" width="468" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="274" y="287" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">两块互不重叠（槽位不冲突），答案 = 9 + 6 = 15</text>
  <text x="274" y="301" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">若块从下标 0 开始，则没有「前面那格」，必须全部覆盖</text>
  <rect x="40" y="324" width="468" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="274" y="345" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">每块的贡献 = 窗口和 − 窗口最小值；块起点为 0 时贡献 = 块和</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">每个标记最多左移一格，所以「块内 len 个标记」只能占窗口 len+1 个槽位</text>
</svg>
