<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：枚举 → 算距离 → 排序</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">O(rc log(rc))，rc ≤ 10^4</text>
  <rect x="140.0" y="70.0" width="280.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="93.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">枚举全部 (r, c)，共 rows × cols 个</text>
  <path d="M 280.0 110.0 L 280.0 128.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="128.0" width="320.0" height="40.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="151.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">键 = |r - rCenter| + |c - cCenter|</text>
  <path d="M 280.0 168.0 L 280.0 186.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140.0" y="186.0" width="280.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="209.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">按键升序排序</text>
  <path d="M 280.0 226.0 L 280.0 244.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140.0" y="244.0" width="280.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="265.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回坐标列表</text>
</svg>
