<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="460" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：建集合 → 逐中项查两端 → 两端都在则计数</text>
  <path d="M 170 38 Q 340 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: build set -->
  <g filter="url(#sk)">
    <rect x="150" y="56" width="220" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="260" y="81" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="monospace" filter="url(#sk)">① S = set(nums)</text>
  <g filter="url(#sk)">
    <path d="M 260 96 L 260 108" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- step 2: more x? decision -->
  <g filter="url(#sk)">
    <polygon points="260,110 415,158 260,206 105,158" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="260" y="163" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">② 还有未处理的 x ?</text>

  <!-- no branch: return -->
  <g filter="url(#sk)">
    <path d="M 415 158 L 456 158" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="436" y="150" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="460" y="136" width="150" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="535" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 ans ✓</text>

  <!-- yes branch: down -->
  <g filter="url(#sk)">
    <path d="M 260 206 L 260 224" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="274" y="220" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">是</text>

  <!-- step 3: compute both ends -->
  <g filter="url(#sk)">
    <rect x="150" y="228" width="220" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="260" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">③ 以 x 为中项，查两端</text>
  <text x="170" y="270" font-size="11.5" fill="#444" font-family="monospace" filter="url(#sk)">lo = x − diff</text>
  <text x="170" y="288" font-size="11.5" fill="#444" font-family="monospace" filter="url(#sk)">hi = x + diff</text>
  <g filter="url(#sk)">
    <path d="M 260 300 L 260 318" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- side notes -->
  <g filter="url(#sk)">
    <rect x="460" y="228" width="200" height="96" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="476" y="252" font-size="11" fill="#555" filter="url(#sk)">两次查询均摊 O(1)</text>
  <text x="476" y="272" font-size="11" fill="#555" filter="url(#sk)">短路：lo 不在就不查 hi</text>
  <text x="476" y="292" font-size="11" fill="#555" filter="url(#sk)">值域 ≤ 200 可换 bool[201]</text>

  <!-- step 4: both in S? decision -->
  <g filter="url(#sk)">
    <polygon points="260,324 412,368 260,412 108,368" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="260" y="362" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">lo ∈ S 且</text>
  <text x="260" y="380" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">hi ∈ S ?</text>

  <!-- yes: count -->
  <g filter="url(#sk)">
    <path d="M 412 368 L 452 368" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="432" y="360" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="458" y="346" width="152" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="534" y="373" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">④ ans++</text>

  <!-- loop back from ans++ -->
  <g filter="url(#sk)">
    <path d="M 534 390 L 534 440 L 266 440" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
  </g>

  <!-- loop back from diamond bottom (no) -->
  <g filter="url(#sk)">
    <path d="M 260 412 L 260 440 L 64 440 L 64 158 L 99 158" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="130" y="432" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">↻ 取下一个 x</text>
  <text x="86" y="240" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">循环 n 次</text>
</svg>
