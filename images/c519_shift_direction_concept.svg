<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8899aa"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="460" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">「拉取」公式:新格直接从旧格取数,方向天然正确</text>

  <!-- 左panel:行左移 -->
  <text x="170" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">行左移 k 位(例中 k=1)</text>
  <text x="170" y="84" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">原行 a</text>
  <rect x="60" y="90" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="114" y="90" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="168" y="90" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="222" y="90" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>

  <!-- 映射箭头 -->
  <path d="M 84 126 Q 100 150 116 164" fill="none" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 138 126 Q 120 150 96 166" fill="none" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 192 126 Q 172 150 148 166" fill="none" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 246 126 Q 226 150 202 166" fill="none" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 84 126 Q 160 168 236 172" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="166" y="152" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">绕回(取模)</text>

  <text x="170" y="184" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">新行 b(左移后)</text>
  <rect x="60" y="190" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="114" y="190" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="168" y="190" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <rect x="222" y="190" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <text x="84" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="138" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="192" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=2</text>
  <text x="246" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=3</text>

  <text x="170" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">b[j] = a[(j+k) mod n]</text>
  <text x="170" y="286" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">如 b[0]=a[1]=1,b[3]=a[0]=5</text>

  <!-- 右panel:列上移 -->
  <text x="500" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">列上移 m 位(例中 m=1)</text>
  <text x="500" y="84" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">原列 c</text>
  <text x="424" y="110" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <rect x="430" y="90" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="424" y="150" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <rect x="430" y="130" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="150" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="424" y="190" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>
  <rect x="430" y="170" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="424" y="230" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">i=3</text>
  <rect x="430" y="210" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="230" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <path d="M 478 105 Q 505 122 550 112" fill="none" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 478 145 Q 505 152 550 142" fill="none" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 478 185 Q 505 180 550 176" fill="none" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 478 225 Q 505 208 550 208" fill="none" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 478 105 Q 545 175 552 216" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="530" y="168" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">绕回</text>

  <rect x="556" y="90" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="580" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="556" y="130" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="580" y="150" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="556" y="170" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="580" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="556" y="210" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="580" y="230" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="580" y="256" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">新列 d(上移后)</text>

  <text x="500" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d[i] = c[(i+m) mod n]</text>
  <text x="500" y="298" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">如 d[0]=c[1]=8,d[3]=c[0]=3</text>

  <!-- 底部对比框 -->
  <rect x="30" y="308" width="600" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="336" font-size="12" font-weight="bold" fill="#8a6420" filter="url(#rough2)">「推出」(题面定义):第 j 列的元素搬到第 (j−k+n) mod n 列</text>
  <text x="48" y="364" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">「拉取」(代码写法):新行第 j 列 = 原行第 (j+k) mod n 列</text>
  <text x="48" y="392" font-size="11" fill="#555" filter="url(#rough2)">两者互为逆映射,结果相同;拉取式的取数下标 (j+k) mod n 恒在 [0,n) 内,无越界、无特判</text>
  <text x="48" y="416" font-size="11" fill="#4a7a3a" filter="url(#rough2)">左移与上移的拉取式统一为「下标 + 移位量」,方向不易写反</text>
</svg>
