<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：除 2 = 右移消位，加 1 的连锁进位折叠成单个 carry</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#r)">两个操作在二进制位层面都有极简含义 → 一条从右往左的扫描线，一次消掉一位</text>

  <!-- A: 二进制串 -->
  <text x="150" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">s =</text>
  <g filter="url(#r)">
    <rect x="180" y="66" width="38" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="222" y="66" width="38" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="264" y="66" width="38" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="306" y="66" width="38" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="199" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#r)">1</text>
  <text x="241" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#r)">1</text>
  <text x="283" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#r)">0</text>
  <text x="325" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4a44" filter="url(#r)">1</text>
  <text x="362" y="92" text-anchor="middle" font-size="12" fill="#888" filter="url(#r)">(= 13)</text>
  <text x="325" y="124" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#r)">最低位：决定奇偶</text>
  <path d="M 330 148 L 194 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" stroke-dasharray="7,5" filter="url(#r)"/>
  <text x="262" y="166" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">扫描方向：每做一次 /2（右移），数字就缩短一位</text>

  <!-- B: 两种消位方式 -->
  <g filter="url(#r)">
    <rect x="24" y="182" width="288" height="78" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="168" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">最低位 0（偶数）</text>
  <text x="168" y="228" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#r)">只需 /2 → 花 1 步</text>
  <text x="168" y="248" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#r)">右移弃位，高位原封不动</text>
  <g filter="url(#r)">
    <rect x="328" y="182" width="288" height="78" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="472" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">最低位 1（奇数）</text>
  <text x="472" y="228" text-anchor="middle" font-size="12" fill="#a0761e" filter="url(#r)">先 +1：该位 1→0，向上进位</text>
  <text x="472" y="248" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#r)">再 /2 → 共花 2 步，carry 点燃</text>
  <path d="M 578 244 L 578 220" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#r)"/>
  <text x="590" y="236" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#r)">进位</text>

  <!-- C: 连锁进位演示 -->
  <text x="320" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">为什么单个变量就够？看 +1 的连锁穿透：</text>
  <g filter="url(#r)">
    <rect x="110" y="304" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="146" y="304" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="182" y="304" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="304" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="127" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">1</text>
  <text x="163" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">0</text>
  <text x="199" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">1</text>
  <text x="235" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">1</text>
  <path d="M 272 322 L 322 322" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#r)"/>
  <text x="297" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">+1</text>
  <g filter="url(#r)">
    <rect x="336" y="304" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="372" y="304" width="34" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="408" y="304" width="34" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="444" y="304" width="34" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="353" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">1</text>
  <text x="389" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4a44" filter="url(#r)">1</text>
  <text x="425" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4a44" filter="url(#r)">0</text>
  <text x="461" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4a44" filter="url(#r)">0</text>
  <text x="320" y="364" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">1011 + 1 = 1100：进位连锁穿透低三位——但不必真的去翻这些位</text>

  <!-- D: 折叠成 carry -->
  <g filter="url(#r)">
    <rect x="24" y="380" width="592" height="86" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="404" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">把传向高位的 +1 记作 carry ∈ {0, 1}，处理第 i 位时取实际值 v = s[i] + carry ∈ {0, 1, 2}</text>
  <text x="320" y="428" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#r)">v = 0：偶数，1 步（carry 归零） · v = 1：奇数，2 步（+1 再 /2，carry = 1）</text>
  <text x="320" y="450" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4a44" filter="url(#r)">v = 2：本位实际是 0（1+1=10₂），进位继续上供 → 偶数，1 步</text>
</svg>
