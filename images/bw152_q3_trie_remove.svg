<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">Trie 上每个节点记「经过的单词数」，删一个词就是路径减一</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">words = ["jump","run","run","jump","run"]，k = 2</text>
  <rect x="244" y="48" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="270" y="71" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">root</text>
  <text x="304" y="62" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="86" y="114" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="112" y="137" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="146" y="128" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="404" y="114" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="137" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="464" y="128" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="86" y="178" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="112" y="201" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">u</text>
  <text x="146" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="404" y="178" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="201" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">u</text>
  <text x="464" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="86" y="242" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="112" y="265" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">m</text>
  <text x="146" y="256" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="404" y="242" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="265" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">n</text>
  <text x="464" y="256" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="86" y="306" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="112" y="329" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">p</text>
  <text x="146" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 270 84 L 112 114" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 112 150 L 112 178" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 112 214 L 112 242" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 112 278 L 112 306" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 270 84 L 430 114" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 430 150 L 430 178" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 430 214 L 430 242" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="112" y="366" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">jump：2 个</text>
  <text x="430" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">run：3 个（绿色）</text>
  <rect x="300" y="316" width="240" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="420" y="338" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">删掉一个 run：r、ru、run</text>
  <text x="420" y="356" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">三个节点的计数 3 → 2，仍 ≥ k</text>
  <text x="420" y="374" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">⇒ 答案长度 3；删 jump 时只剩 run 分支</text>
  <text x="280.0" y="418" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">深度 = 前缀长度；「计数 ≥ k」的最深节点就是答案</text>
</svg>
