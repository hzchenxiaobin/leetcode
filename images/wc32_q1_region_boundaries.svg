<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#b85450"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="860" height="430" fill="#fafafa"/>

  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：最短无序区间 = [最左越界下标 l, 最右越界下标 r]</text>
  <path d="M 170 40 Q 430 48 690 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 图例 -->
  <rect x="250" y="52" width="170" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="335" y="71" text-anchor="middle" font-size="12" fill="#3d6630" filter="url(#rough2)">绿：已有序，保持不动</text>
  <rect x="440" y="52" width="170" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="525" y="71" text-anchor="middle" font-size="12" fill="#9a7526" filter="url(#rough2)">橙：必须整体重排</text>

  <!-- 数组格子 nums = [2,6,4,8,10,9,15] -->
  <rect x="146" y="104" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="228" y="104" width="76" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="310" y="104" width="76" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="392" y="104" width="76" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="474" y="104" width="76" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="556" y="104" width="76" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="638" y="104" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="184" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f2f2f" filter="url(#rough2)">2</text>
  <text x="266" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f2f2f" filter="url(#rough2)">6</text>
  <text x="348" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f2f2f" filter="url(#rough2)">4</text>
  <text x="430" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f2f2f" filter="url(#rough2)">8</text>
  <text x="512" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f2f2f" filter="url(#rough2)">10</text>
  <text x="594" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f2f2f" filter="url(#rough2)">9</text>
  <text x="676" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f2f2f" filter="url(#rough2)">15</text>

  <text x="184" y="174" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">0</text>
  <text x="266" y="174" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="348" y="174" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="430" y="174" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <text x="512" y="174" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <text x="594" y="174" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <text x="676" y="174" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>

  <!-- l / r 标记 -->
  <path d="M 246 158 L 246 186" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 574 158 L 574 186" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="246" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">l = 1（6 &gt; 4）</text>
  <text x="574" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">r = 5（9 &lt; 10）</text>

  <!-- 两遍扫描说明 -->
  <rect x="32" y="216" width="388" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="240" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">第一遍：从左往右，定右界 r</text>
  <text x="52" y="264" font-size="12" fill="#333" filter="url(#rough2)">mx = max(nums[0..i-1])，一旦 nums[i] &lt; mx</text>
  <text x="52" y="286" font-size="12" fill="#333" filter="url(#rough2)">它左边有更大的数 ⇒ 必须进区间：r = i</text>
  <text x="52" y="304" font-size="11" fill="#5a7a99" filter="url(#rough2)">r 自然被刷新成「最右」的那个越界点</text>

  <rect x="440" y="216" width="388" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="240" font-size="13" font-weight="bold" fill="#3d6630" filter="url(#rough2)">第二遍：从右往左，定左界 l</text>
  <text x="460" y="264" font-size="12" fill="#333" filter="url(#rough2)">mn = min(nums[i+1..n-1])，一旦 nums[i] &gt; mn</text>
  <text x="460" y="286" font-size="12" fill="#333" filter="url(#rough2)">它右边有更小的数 ⇒ 必须进区间：l = i</text>
  <text x="460" y="304" font-size="11" fill="#6b8a5c" filter="url(#rough2)">倒序扫描，最后一次赋值即「最左」越界点</text>

  <path d="M 430 312 L 430 326" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="170" y="330" width="520" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">答案区间 [l, r] = [1, 5]，长度 = 5</text>
  <text x="430" y="382" text-anchor="middle" font-size="12" fill="#6b2f2c" filter="url(#rough2)">无序段 [6, 4, 8, 10, 9] 升序后，整个数组即为升序</text>
</svg>
