<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：从小到大配对，最小剩余值必为原数</text>

  <!-- 排序后的值轴 -->
  <text x="60" y="70" font-size="13" fill="#888" filter="url(#rough2)">值轴（升序）：</text>
  <g filter="url(#rough2)">
    <rect x="80" y="82" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="136" y="82" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="192" y="82" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="248" y="82" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="304" y="82" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="360" y="82" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="103" y="103">1</text><text x="159" y="103">2</text>
    <text x="215" y="103">3</text><text x="271" y="103">4</text>
    <text x="327" y="103">6</text><text x="383" y="103">8</text>
  </g>
  <text x="440" y="103" font-size="12" fill="#888" filter="url(#rough2)">（示例 1）</text>

  <!-- 最小值标注 -->
  <path d="M 103 118 L 103 150" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="154" width="126" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="103" y="178" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">当前最小剩余值 v=1</text>
  <text x="103" y="199" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">只能当原数！</text>

  <!-- 为什么不能当二倍数 -->
  <rect x="200" y="154" width="300" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="350" y="178" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">若 1 是二倍数，原数须是 1/2 = 0.5</text>
  <text x="350" y="199" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">但 0.5 &lt; 1 不在数组里，矛盾 ∎</text>

  <!-- 配对箭头 -->
  <path d="M 126 96 C 170 60, 230 60, 246 96" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="62" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">1 原数 → 消耗一个 2（二倍数）</text>
  <path d="M 214 96 C 270 52, 350 52, 406 96" fill="none" stroke="#446688" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="48" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3 原数 → 消耗一个 6</text>

  <!-- 身份流转说明 -->
  <rect x="60" y="240" width="440" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">值 2 被 1 消耗后，「剩余的 cnt[2]」才是 2 作为原数的个数</text>
  <text x="280" y="290" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">同一值可兼具双重身份：先被消耗、再当原数</text>

  <rect x="60" y="324" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">判定：cnt[2v] &lt; cnt[v]（剩余）⇒ 二倍数不够配 ⇒ 无解</text>
  <text x="280" y="366" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">（消耗总是「小值消耗大值」，方向不可逆）</text>
</svg>
