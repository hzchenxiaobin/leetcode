<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arGrey" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888888"/>
    </marker>
  </defs>
  <rect width="580" height="460" fill="#fafafa"/>
  <text x="290" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：排序 → 栈遍历 → 按原编号输出</text>
  <path d="M 150 35 Q 290 43 430 35" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="140" y="48" width="300" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="290" y="68" text-anchor="middle" font-size="12" fill="#446688">按 positions 升序排序，得到处理顺序 idx</text>
  <path d="M 290 80 L 290 96" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="155" y="100" width="270" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="290" y="120" text-anchor="middle" font-size="12" fill="#446688">取 idx 中下一个机器人 i</text>
  <path d="M 290 132 L 290 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="290,152 366,180 290,208 214,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="290" y="185" text-anchor="middle" font-size="12" fill="#8a6415">i 的方向 = R ?</text>
  <path d="M 366 180 L 444 180" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="402" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">是</text>

  <g filter="url(#sk)">
    <rect x="448" y="162" width="104" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="500" y="184" text-anchor="middle" font-size="12" fill="#2e6e2e">i 入栈</text>
  <path d="M 500 162 C 500 132, 470 112, 428 112" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arGreen)" filter="url(#sk)"/>

  <path d="M 290 208 L 290 238" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="352" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">否（i 向左）</text>

  <g filter="url(#sk)">
    <polygon points="290,240 372,270 290,300 208,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="290" y="275" text-anchor="middle" font-size="12" fill="#8a6415">栈顶方向 = R ?</text>
  <path d="M 208 270 L 178 270" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="193" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">否</text>

  <g filter="url(#sk)">
    <rect x="36" y="250" width="140" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="106" y="267" text-anchor="middle" font-size="11.5" fill="#2e6e2e">i 幸存：</text>
  <text x="106" y="283" text-anchor="middle" font-size="11.5" fill="#2e6e2e">写回 h 后入栈</text>
  <path d="M 60 250 Q 30 250 30 200 L 30 124 Q 30 112 44 112 L 151 112" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arGreen)" filter="url(#sk)"/>

  <path d="M 290 300 L 290 330" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="308" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">是</text>

  <g filter="url(#sk)">
    <rect x="30" y="334" width="330" height="102" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="195" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">与栈顶 R 碰撞（血量三分支）</text>
  <text x="195" y="374" text-anchor="middle" font-size="10.8" fill="#7a3a37">栈顶血 &gt; h：栈顶扣 1 血，i 销毁 → 取下一个</text>
  <text x="195" y="392" text-anchor="middle" font-size="10.8" fill="#7a3a37">栈顶血 = h：同归于尽 → 取下一个</text>
  <text x="195" y="410" text-anchor="middle" font-size="10.8" fill="#7a3a37">栈顶血 &lt; h：h − 1，弹出栈顶 → 再比新栈顶</text>
  <path d="M 120 334 Q 150 310 232 300" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arRed)" filter="url(#sk)"/>
  <text x="103" y="318" text-anchor="middle" font-size="10" fill="#b85450">i 胜后回上来</text>

  <g filter="url(#sk)">
    <rect x="402" y="340" width="158" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="481" y="358" text-anchor="middle" font-size="11.5" fill="#446688">idx 用尽：</text>
  <text x="481" y="374" text-anchor="middle" font-size="11.5" fill="#446688">幸存者按原编号输出</text>
  <path d="M 425 108 Q 566 100 566 210 L 566 300 Q 566 336 486 338" stroke="#888888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arGrey)" filter="url(#sk)"/>
  <text x="552" y="148" text-anchor="end" font-size="10" fill="#888888">idx 用尽</text>
</svg>
