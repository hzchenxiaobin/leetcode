<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：后继是行/列上的连续区间 → 倒序 DP + 线段树</text>

  <!-- column headers -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="116" y="92">j=0</text>
    <text x="168" y="92">j=1</text>
    <text x="220" y="92">j=2</text>
    <text x="272" y="92">j=3</text>
    <text x="324" y="92">j=4</text>
  </g>
  <!-- row labels -->
  <g filter="url(#rough2)" font-size="10" text-anchor="end" fill="#999">
    <text x="82" y="126">i=0</text>
    <text x="82" y="170">i=1</text>
    <text x="82" y="214">i=2</text>
    <text x="82" y="258">i=3</text>
  </g>

  <!-- neutral cells -->
  <g filter="url(#rough2)">
    <rect x="90" y="100" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="142" y="100" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="194" y="100" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="246" y="100" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="298" y="100" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="90" y="188" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="194" y="188" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="246" y="188" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="298" y="188" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="90" y="232" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="194" y="232" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="246" y="232" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="298" y="232" width="52" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>

  <!-- current cell (i,j) with value g -->
  <rect x="142" y="144" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="168" y="163" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">(i,j)</text>
  <text x="168" y="181" text-anchor="middle" font-size="14" fill="#a07820" font-weight="bold" filter="url(#rough2)">g</text>

  <!-- right successors: row i, cols j+1..j+g -->
  <g filter="url(#rough2)">
    <rect x="194" y="144" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="246" y="144" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="298" y="144" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>

  <!-- down successors: column j, rows i+1..min(i+g, m-1) -->
  <g filter="url(#rough2)">
    <rect x="142" y="188" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="142" y="232" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>

  <!-- arrows -->
  <path d="M 196 166 L 344 166" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 168 190 L 168 272" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="160" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" paint-order="stroke" stroke="#fafafa" stroke-width="3" filter="url(#rough2)">向右 g 格</text>
  <text x="182" y="238" font-size="10.5" fill="#4a7a3a" font-weight="bold" paint-order="stroke" stroke="#fafafa" stroke-width="3" filter="url(#rough2)">向下</text>

  <!-- captions under grid -->
  <g filter="url(#rough2)">
    <rect x="90" y="288" width="13" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="110" y="299" font-size="10.5" fill="#a07820" filter="url(#rough2)">当前格 (i,j)，g = grid[i][j] = 3</text>

  <text x="90" y="322" font-size="11" fill="#446688" filter="url(#rough2)">→ 向右：行 i 上列区间 [ j+1, min(j+g, n−1) ]，连续一段 ✓</text>
  <text x="90" y="344" font-size="11" fill="#4a7a3a" filter="url(#rough2)">↓ 向下：列 j 上行区间 [ i+1, min(i+g, m−1) ]，连续一段 ✓</text>
  <text x="90" y="366" font-size="10.5" fill="#b85450" filter="url(#rough2)">本图 g=3：向下本想跳到 i+g=4，越界截断到 m−1=3</text>

  <!-- right panel: reverse DP definition -->
  <rect x="370" y="100" width="255" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="498" y="122" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">反向定义 f（含自身）</text>
  <text x="498" y="142" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">f[m−1][n−1] = 1</text>
  <text x="498" y="160" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">f[i][j] = 1 + min( 行区间内最小的 f[i][·]，</text>
  <text x="498" y="178" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">列区间内最小的 f[·][j] )</text>

  <rect x="370" y="208" width="255" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="498" y="230" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">为什么倒着定义？</text>
  <text x="498" y="250" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">正向前驱 = { k : k+grid[·][k] ≥ 目标 }</text>
  <text x="498" y="266" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">——条件集合，不连续 ✗</text>
  <text x="498" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">反向后继 = 连续区间 → 线段树查 min ✓</text>

  <rect x="370" y="304" width="255" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="498" y="326" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">计算顺序：倒序行优先</text>
  <text x="498" y="346" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i = m−1 … 0，j = n−1 … 0</text>
  <text x="498" y="364" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">算 (i,j) 时，右边、下面的格</text>
  <text x="498" y="380" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">都已算好并插入两棵树</text>

  <rect x="90" y="400" width="535" height="46" rx="10" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="358" y="427" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">f 含自身 → 答案 = f[0][0]，无需再 +1；不可达 = ∞（不插入树，查询自动返回 ∞）</text>
</svg>
