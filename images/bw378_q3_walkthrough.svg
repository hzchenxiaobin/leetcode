<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：s = "aaabaaa"，两条视角得出同一个答案 2</text>
  <path d="M 240 42 Q 470 52 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① run decomposition -->
  <text x="80" y="78" font-size="13" fill="#2b2b2b">① 游程分解：a: [3, 3]，b: [1]</text>
  <text x="102" y="92" text-anchor="middle" font-size="11" fill="#446688">段 L=3</text>
  <text x="240" y="92" text-anchor="middle" font-size="11" fill="#b8862a">L=1</text>
  <text x="332" y="92" text-anchor="middle" font-size="11" fill="#446688">段 L=3</text>
  <g filter="url(#sk)">
    <rect x="80" y="98" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="126" y="98" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="172" y="98" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="98" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="264" y="98" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="310" y="98" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="356" y="98" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="102" y="124" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="148" y="124" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="194" y="124" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="240" y="124" text-anchor="middle" font-size="15" fill="#7a5415">b</text>
  <text x="286" y="124" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="332" y="124" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="378" y="124" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="440" y="112" font-size="12" fill="#555">双指针一次扫描即得（同 Q2）</text>

  <!-- ② len values -->
  <text x="80" y="168" font-size="13" fill="#2b2b2b">② len 值：</text>
  <g filter="url(#sk)">
    <rect x="150" y="152" width="294" height="30" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="162" y="172" font-size="13" fill="#8e3a34" font-family="monospace">1 2 3  |  1  |  1 2 3</text>
  <text x="470" y="166" font-size="12" fill="#444">a 的 len 多重集 {3,3,2,2,1,1}（按位置计，含重复）；b 为 {1}</text>

  <!-- ③ top-3 of a -->
  <text x="80" y="222" font-size="13" fill="#2b2b2b">③ a 降序取前三大（红框）：</text>
  <g filter="url(#sk)">
    <rect x="240" y="236" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="282" y="236" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="324" y="236" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="366" y="236" width="40" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="408" y="236" width="40" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="450" y="236" width="40" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="260" y="258" text-anchor="middle" font-size="14" fill="#8e3a34">3</text>
  <text x="302" y="258" text-anchor="middle" font-size="14" fill="#8e3a34">3</text>
  <text x="344" y="258" text-anchor="middle" font-size="14" fill="#8e3a34">2</text>
  <text x="386" y="258" text-anchor="middle" font-size="14" fill="#999">2</text>
  <text x="428" y="258" text-anchor="middle" font-size="14" fill="#999">1</text>
  <text x="470" y="258" text-anchor="middle" font-size="14" fill="#999">1</text>
  <text x="240" y="296" font-size="12" font-weight="bold" fill="#2e6e2e">前三大 [3,3,2] → 第三大 = 2（len 视角的候选）</text>

  <!-- ③' run-language formula box -->
  <g filter="url(#sk)">
    <rect x="480" y="208" width="380" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="500" y="232" font-size="13" font-weight="bold" fill="#2b5a8e">游程视角：三候选公式（r = [3, 3, 0]）</text>
  <text x="500" y="256" font-size="12" fill="#444" font-family="monospace">一段连取 3 次：r1 − 2 = 1</text>
  <text x="500" y="276" font-size="12" fill="#444" font-family="monospace">两段凑 3 次：min(r1−1, r2) = min(2, 3) = 2</text>
  <text x="500" y="296" font-size="12" fill="#444" font-family="monospace">三段各 1 次：r3 = 0 → cand = max(1, 2, 0) = 2</text>

  <!-- ④ verify x = 2 -->
  <g filter="url(#sk)">
    <rect x="80" y="340" width="380" height="126" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="100" y="364" font-size="13" font-weight="bold" fill="#2e6e2e">④ 验证 x = 2：occ(a, 2) = 4 ≥ 3 ✓</text>
  <g filter="url(#sk)">
    <rect x="100" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="136" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="172" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="240" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="276" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="312" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="100" y="384" width="68" height="22" rx="4" fill="none" stroke="#b85450" stroke-width="2.2"/>
    <rect x="136" y="384" width="68" height="22" rx="4" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
    <rect x="240" y="384" width="68" height="22" rx="4" fill="none" stroke="#b85450" stroke-width="2.2"/>
    <rect x="276" y="384" width="68" height="22" rx="4" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="117" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="153" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="189" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="257" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="293" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="329" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="100" y="436" font-size="12" fill="#444">左段 2 个窗口 + 右段 2 个窗口 = 4 次 ≥ 3</text>
  <text x="100" y="456" font-size="10" fill="#888">（"aa" 在长 3 的段内出现 3−2+1 = 2 次）</text>

  <!-- ④' check x = 3 -->
  <g filter="url(#sk)">
    <rect x="480" y="340" width="380" height="126" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="500" y="364" font-size="13" font-weight="bold" fill="#8e3a34">对照 x = 3：occ(a, 3) = 2 &lt; 3 ✗</text>
  <g filter="url(#sk)">
    <rect x="500" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="536" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="572" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="640" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="676" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="712" y="380" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="500" y="384" width="102" height="22" rx="4" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3"/>
    <rect x="640" y="384" width="102" height="22" rx="4" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3"/>
  </g>
  <text x="517" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="553" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="589" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="657" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="693" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="729" y="400" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="500" y="436" font-size="12" fill="#444">每段仅 1 个整段窗口，1 + 1 = 2 次 &lt; 3</text>
  <text x="500" y="456" font-size="12" font-weight="bold" fill="#8e3a34">→ 答案 = 2，两条视角一致 ✓</text>

  <!-- ⑤ official examples table -->
  <text x="80" y="512" font-size="13" font-weight="bold" fill="#2b2b2b">⑤ 官方三例速验：</text>
  <g filter="url(#sk)">
    <rect x="80" y="524" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="250" y="524" width="430" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="680" y="524" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="80" y="554" width="170" height="30" fill="#fffdf3" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="250" y="554" width="430" height="30" fill="#fffdf3" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="680" y="554" width="180" height="30" fill="#fffdf3" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="80" y="584" width="170" height="30" fill="#fffdf3" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="250" y="584" width="430" height="30" fill="#fffdf3" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="680" y="584" width="180" height="30" fill="#fffdf3" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="80" y="614" width="170" height="30" fill="#fffdf3" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="250" y="614" width="430" height="30" fill="#fffdf3" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="680" y="614" width="180" height="30" fill="#fffdf3" stroke="#bbbbbb" stroke-width="1"/>
  </g>
  <text x="165" y="544" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a8e">s</text>
  <text x="465" y="544" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a8e">关键计算（游程 → 三候选）</text>
  <text x="770" y="544" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a8e">答案</text>
  <text x="165" y="574" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"aaaa"</text>
  <text x="465" y="574" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">a: [4] → max(4−2, min(3,0), 0) = 2</text>
  <text x="770" y="574" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">2</text>
  <text x="165" y="604" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"abcdef"</text>
  <text x="465" y="604" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">每字符 [1] → 候选均 &lt; 1</text>
  <text x="770" y="604" text-anchor="middle" font-size="12" font-weight="bold" fill="#888" font-family="monospace">−1</text>
  <text x="165" y="634" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"abcaba"</text>
  <text x="465" y="634" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">a: [1,1,1] → max(−1, min(0,1), 1) = 1</text>
  <text x="770" y="634" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
</svg>
