<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="440" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：按阈值 X 切开，数值更新就变成 0/1 更新</text>
  <text x="340" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第 k 小 ≥ X ⟺ 至少 d − k + 1 个入值 ≥ X —— 这一步与 a 的具体大小完全无关</text>

  <!-- left: one vertex of the graph -->
  <g filter="url(#rough2)">
    <rect x="20" y="62" width="300" height="356" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <text x="170" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">取出一个顶点 v（d = 3，k_v = 2）</text>

    <line x1="152" y1="130" x2="236" y2="182" stroke="#666" stroke-width="1.3" marker-end="url(#arr)"/>
    <line x1="152" y1="220" x2="236" y2="220" stroke="#666" stroke-width="1.3" marker-end="url(#arr)"/>
    <line x1="152" y1="310" x2="236" y2="258" stroke="#666" stroke-width="1.3" marker-end="url(#arr)"/>

    <circle cx="110" cy="130" r="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="127" text-anchor="middle" font-size="11" fill="#2f4f6f">u₁</text>
    <text x="110" y="142" text-anchor="middle" font-size="12" fill="#2f4f6f">7</text>
    <circle cx="110" cy="220" r="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="217" text-anchor="middle" font-size="11" fill="#2f4f6f">u₂</text>
    <text x="110" y="232" text-anchor="middle" font-size="12" fill="#2f4f6f">4</text>
    <circle cx="110" cy="310" r="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="307" text-anchor="middle" font-size="11" fill="#2f4f6f">u₃</text>
    <text x="110" y="322" text-anchor="middle" font-size="12" fill="#2f4f6f">9</text>

    <circle cx="272" cy="220" r="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="272" y="218" text-anchor="middle" font-size="12" fill="#8a6a20">v</text>
    <text x="272" y="234" text-anchor="middle" font-size="11" fill="#8a6a20">? = 7</text>

    <text x="170" y="368" text-anchor="middle" font-size="10.5" fill="#4a7a3a">升序 4, 7, 9 ⇒ 第 2 小 = 7</text>
    <text x="170" y="390" text-anchor="middle" font-size="10.5" fill="#b85450">c_v = d − k_v + 1 = 2：要有 2 个入值 ≥ X</text>
  </g>

  <!-- right: threshold table -->
  <g filter="url(#rough2)">
    <rect x="332" y="62" width="328" height="356" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <text x="496" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">同一张表，换一个阈值 X 就换一行</text>

    <rect x="346" y="94" width="72" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="420" y="94" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="518" y="94" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="576" y="94" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="382" y="110" text-anchor="middle" font-size="10" fill="#2f4f6f">阈值 X</text>
    <text x="468" y="110" text-anchor="middle" font-size="10" fill="#2f4f6f">b(u₁) b(u₂) b(u₃)</text>
    <text x="546" y="110" text-anchor="middle" font-size="10" fill="#2f4f6f">个数</text>
    <text x="611" y="110" text-anchor="middle" font-size="10" fill="#2f4f6f">b(v) 新值</text>

    <rect x="346" y="122" width="72" height="24" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <rect x="420" y="122" width="96" height="24" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <rect x="518" y="122" width="56" height="24" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <rect x="576" y="122" width="70" height="24" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <text x="382" y="138" text-anchor="middle" font-size="10.5" fill="#444">X = 10</text>
    <text x="468" y="138" text-anchor="middle" font-size="10.5" fill="#444">0　0　0</text>
    <text x="546" y="138" text-anchor="middle" font-size="10.5" fill="#444">0</text>
    <text x="611" y="138" text-anchor="middle" font-size="10.5" fill="#888">0</text>

    <rect x="346" y="150" width="72" height="24" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <rect x="420" y="150" width="96" height="24" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <rect x="518" y="150" width="56" height="24" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <rect x="576" y="150" width="70" height="24" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <text x="382" y="166" text-anchor="middle" font-size="10.5" fill="#444">X = 9</text>
    <text x="468" y="166" text-anchor="middle" font-size="10.5" fill="#444">0　0　1</text>
    <text x="546" y="166" text-anchor="middle" font-size="10.5" fill="#444">1</text>
    <text x="611" y="166" text-anchor="middle" font-size="10.5" fill="#888">0</text>

    <rect x="346" y="178" width="72" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="420" y="178" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="518" y="178" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="576" y="178" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="382" y="194" text-anchor="middle" font-size="10.5" fill="#3a5a30">X = 7</text>
    <text x="468" y="194" text-anchor="middle" font-size="10.5" fill="#3a5a30">1　0　1</text>
    <text x="546" y="194" text-anchor="middle" font-size="10.5" fill="#3a5a30">2</text>
    <text x="611" y="194" text-anchor="middle" font-size="10.5" fill="#3a5a30">1</text>

    <rect x="346" y="206" width="72" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="420" y="206" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="518" y="206" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="576" y="206" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="382" y="222" text-anchor="middle" font-size="10.5" fill="#3a5a30">X = 4</text>
    <text x="468" y="222" text-anchor="middle" font-size="10.5" fill="#3a5a30">1　1　1</text>
    <text x="546" y="222" text-anchor="middle" font-size="10.5" fill="#3a5a30">3</text>
    <text x="611" y="222" text-anchor="middle" font-size="10.5" fill="#3a5a30">1</text>

    <text x="496" y="256" text-anchor="middle" font-size="9.5" fill="#8a6a20">位为 1 的最大 X 就是新值 7 ⇐ 命中的集合 {u₁, u₃} 只有 2 个元素</text>

    <rect x="346" y="272" width="300" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="7"/>
    <text x="356" y="292" font-size="10.5" fill="#8a3a36">任意一次更新都能被这一族阈值「同时」描述：</text>
    <text x="356" y="312" font-size="10.5" fill="#8a3a36">[ a_v 的新值 ≥ X ] = φ( b(X) )_v</text>
    <text x="356" y="328" font-size="10" fill="#7a4a46">于是 t 秒后：位向量 = φ^t( b(X) )，只需研究 φ 本身</text>

    <rect x="346" y="344" width="300" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="7"/>
    <text x="356" y="364" font-size="10.5" fill="#8a6a20">推论：把 a 降序排成 α₁ ≥ α₂ ≥ … ≥ αₙ，</text>
    <text x="356" y="384" font-size="10.5" fill="#8a6a20">答案就是某个 α_r，r = 让第 v 位变 1 的最小集合大小</text>
  </g>
</svg>
