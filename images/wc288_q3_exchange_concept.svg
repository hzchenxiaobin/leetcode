<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：一次 +1 应该给最小的元素</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="64" text-anchor="middle" font-size="12" fill="#666">面积模型看交换不等式 (a+1)·b ≥ a·(b+1) —— 以 a = 4, b = 6 为例</text>

  <!-- left panel: increment the smaller a -->
  <text x="180" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5e2e">+1 给小者 a：(a+1)·b = 5 × 6</text>
  <g filter="url(#sk2)">
    <rect x="100" y="131" width="64" height="96" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="164" y="131" width="16" height="96" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="132" y="176" text-anchor="middle" font-size="10.5" fill="#2b4a6e">公共</text>
  <text x="132" y="192" text-anchor="middle" font-size="10.5" fill="#2b4a6e">a·b = 24</text>
  <text x="172" y="110" text-anchor="middle" font-size="10" fill="#7a5415">宽 1</text>
  <text x="189" y="176" font-size="10" fill="#7a5415">新增竖条</text>
  <text x="189" y="190" font-size="10" fill="#7a5415">1 × b = 6</text>
  <text x="132" y="246" text-anchor="middle" font-size="11" fill="#446688">a = 4</text>
  <text x="94" y="184" text-anchor="end" font-size="11" fill="#446688">b = 6</text>
  <text x="180" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a5e2e">= 30 ✓</text>

  <!-- center vs -->
  <text x="320" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">vs</text>

  <!-- right panel: increment the larger b -->
  <text x="460" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34">+1 给大者 b：a·(b+1) = 4 × 7</text>
  <g filter="url(#sk2)">
    <rect x="396" y="131" width="64" height="96" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="396" y="115" width="64" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="428" y="176" text-anchor="middle" font-size="10.5" fill="#2b4a6e">公共</text>
  <text x="428" y="192" text-anchor="middle" font-size="10.5" fill="#2b4a6e">a·b = 24</text>
  <text x="470" y="124" font-size="10" fill="#8a3a34">新增横条 a×1 = 4</text>
  <text x="428" y="246" text-anchor="middle" font-size="11" fill="#446688">a = 4</text>
  <text x="390" y="184" text-anchor="end" font-size="11" fill="#446688">b = 6</text>
  <text x="460" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a34">= 28</text>

  <!-- conclusion box -->
  <rect x="60" y="292" width="520" height="156" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk2)"/>
  <text x="320" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5e2e">(a+1)·b − a·(b+1) = b − a ≥ 0（a &lt; b 时严格更大）</text>
  <text x="320" y="347" text-anchor="middle" font-size="11.5" fill="#2b2b2b">同样 1 单位增量，贴在小边上（竖条 1×b）比贴在大边上（横条 a×1）</text>
  <text x="320" y="365" text-anchor="middle" font-size="11.5" fill="#2b2b2b">多出 b − a 的面积。</text>
  <text x="320" y="391" text-anchor="middle" font-size="11.5" fill="#2b2b2b">推论：每一次 +1 都给<b>当前最小值</b> —— 元素尽量「齐平」，乘积最大。</text>
  <text x="320" y="417" text-anchor="middle" font-size="11.5" fill="#8a3a34">a = 0 时乘积从 0 变正：0 必然最先被消除。</text>
</svg>
