<svg xmlns="http://www.w3.org/2000/svg" width="880" height="474" viewBox="0 0 880 474"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="880" height="474" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：s = 1010（官方样例第 2 组），一次翻转只改两个 a 与一个计数</text>
  <path d="M 86 42 Q 440 50 794 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="440" y="60" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">power = (S + z·o) / 2，S = Σ a_j·j·(n−j)，z = #{ j : s_j = s₁ }，o = n − z</text>

  <rect x="40" y="74" width="800" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">状态</text>
  <text x="212" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">s</text>
  <text x="322" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a₁ a₂ a₃</text>
  <text x="428" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">S</text>
  <text x="500" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">z</text>
  <text x="556" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">o</text>
  <text x="624" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">z·o</text>
  <text x="716" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">power</text>

  <rect x="40" y="112" width="800" height="40" rx="6" fill="#fafafa" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="96" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始</text>
  <text x="212" y="138" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1 0 1 0</text>
  <text x="322" y="138" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1 1 1</text>
  <text x="428" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="500" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="556" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="624" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="716" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>

  <rect x="40" y="158" width="800" height="40" rx="6" fill="#fff8e1" stroke="#e2c98a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="96" y="184" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">翻转 i=1</text>
  <text x="212" y="184" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">0 0 1 0</text>
  <text x="322" y="184" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">0 1 1</text>
  <text x="428" y="184" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">7</text>
  <text x="500" y="184" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="556" y="184" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="624" y="184" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="716" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>

  <rect x="40" y="204" width="800" height="40" rx="6" fill="#fafafa" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="96" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">翻转 i=2</text>
  <text x="212" y="230" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">0 1 1 0</text>
  <text x="322" y="230" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1 0 1</text>
  <text x="428" y="230" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="500" y="230" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="556" y="230" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="624" y="230" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="716" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>

  <text x="440" y="266" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">S 的初值：1·1·3 + 1·2·2 + 1·3·1 = 10；翻转 i=1 时 a₁ 由 1 变 0（权重 3），S 从 10 降到 7</text>
  <text x="440" y="286" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">翻转 i=1 时 s₁ 自身翻转：P₀ = 0 不动，P₁ … P₃ 全部取反 ⇒ z: 2 → 3、o: 2 → 1</text>

  <rect x="40" y="304" width="360" height="150" rx="10" fill="#fafafa" stroke="#b8b8b8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">直接枚举 s = 1010 的 10 个子串</text>
  <path d="M 56 334 Q 220 340 384 334" stroke="#b8b8b8" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <text x="66" y="356" font-size="11.5" fill="#333" filter="url(#rough2)">长度 1</text>
  <text x="150" y="356" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1, 0, 1, 0</text>
  <text x="330" y="356" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="66" y="380" font-size="11.5" fill="#333" filter="url(#rough2)">长度 2</text>
  <text x="150" y="380" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">10, 01, 10</text>
  <text x="330" y="380" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="66" y="404" font-size="11.5" fill="#333" filter="url(#rough2)">长度 3</text>
  <text x="150" y="404" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">101, 010</text>
  <text x="330" y="404" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="66" y="428" font-size="11.5" fill="#333" filter="url(#rough2)">长度 4</text>
  <text x="150" y="428" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1010</text>
  <text x="330" y="428" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="66" y="450" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">合计</text>
  <text x="150" y="450" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">10 个子串</text>
  <text x="330" y="450" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7 ✓</text>

  <rect x="416" y="304" width="424" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="628" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">与官方输出对照</text>
  <text x="628" y="356" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">样例给出「7 5 5」，本表逐项吻合</text>
  <text x="628" y="380" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">长度 3 的子串含 2 个跳变 ⇒ ⌈2/2⌉ = 1</text>
  <text x="628" y="404" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">长度 4 的子串含 3 个跳变 ⇒ ⌈3/2⌉ = 2</text>
  <text x="628" y="428" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">翻转后 S 与 z·o 都只走 O(1) 步</text>
  <text x="628" y="450" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">⇒ 单次修改 O(1)，总复杂度 O(n + q)</text>
</svg>
