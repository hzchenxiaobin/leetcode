<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">时间与位置对偶：把「第几天亮」记到位置上</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">bulbs = [1,3,2]，K = 1  →  days[x] = 位置 x 被点亮的天数</text>

  <text x="150" y="108" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">days =</text>

  <g filter="url(#rough2)">
    <rect x="168" y="76" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="248" y="76" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="328" y="76" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="22" text-anchor="middle" font-weight="bold" fill="#3a4a66">
    <text x="200" y="110">1</text>
    <text x="280" y="110">3</text>
    <text x="360" y="110">2</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="200" y="142">位置 1</text>
    <text x="280" y="142">位置 2</text>
    <text x="360" y="142">位置 3</text>
  </g>

  <rect x="162" y="70" width="76" height="60" fill="none" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <rect x="242" y="70" width="76" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 3" rx="6" filter="url(#rough2)" opacity="0.85"/>
  <rect x="322" y="70" width="76" height="60" fill="none" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>

  <text x="280" y="166" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 2 天：位置 1、3 已亮，中间的位置 2 仍灭 → 恰好 K = 1 个关闭灯泡 ✓</text>

  <rect x="56" y="186" width="448" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="72" y="210" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">候选窗口 [i, j]，其中 j − i = K + 1（两端亮、内部灭）：</text>
  <text x="72" y="236" font-size="12.5" fill="#444" filter="url(#rough2)">min( days[i+1 … j−1] )  &gt;  max( days[i], days[j] )</text>
  <text x="72" y="262" font-size="11" fill="#3a5a30" filter="url(#rough2)">本例：min(3) = 3 &gt; max(1, 2) = 2  ✓  →  答案 = 第 2 天</text>

  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">「某天存在合法灯泡对」⇔「某窗口两端先亮、中间后亮」</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">答案 = min { max(days[i], days[j]) : 窗口 (i, j) 合法 }</text>
  <text x="280" y="350" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">把「按天模拟」翻转成「按位置查询」，问题就从模拟变成了滑动窗口</text>
</svg>
