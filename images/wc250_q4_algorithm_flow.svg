<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="620" height="620" fill="#fdfcf7"/>
  <text x="310" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：事件栈迭代 DFS（enter / exit 两个相位）</text>
  <path d="M 140 38 Q 310 48 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="65" y="56" width="210" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="65" y="116" width="210" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="65" y="176" width="210" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="170,238 230,268 170,298 110,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="65" y="340" width="210" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="170,402 224,432 170,462 116,432" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="170" y="78" text-anchor="middle" font-size="12.5" fill="#2b5d8e">建树：children 邻接表 + 找根</text>
  <text x="170" y="138" text-anchor="middle" font-size="12.5" fill="#2b5d8e">查询挂载：qAt[node] ← (val, idx)</text>
  <text x="170" y="198" text-anchor="middle" font-size="12.5" fill="#2b5d8e">初始化数组 Trie，栈 = [(root, enter)]</text>
  <text x="170" y="273" text-anchor="middle" font-size="12.5" fill="#a07818" font-weight="bold">栈空？</text>
  <text x="170" y="361" text-anchor="middle" font-size="12.5" fill="#2b5d8e">弹出 (u, state)</text>
  <text x="170" y="437" text-anchor="middle" font-size="12.5" fill="#a07818" font-weight="bold">state ?</text>

  <g filter="url(#sk)" fill="none" stroke="#446688" stroke-width="1.7">
    <path d="M 170 90 L 170 112" marker-end="url(#ab)"/>
    <path d="M 170 150 L 170 172" marker-end="url(#ab)"/>
    <path d="M 170 210 L 170 234" marker-end="url(#ab)"/>
    <path d="M 170 298 L 170 336" marker-end="url(#ab)"/>
    <path d="M 170 368 L 170 398" marker-end="url(#ab)"/>
  </g>
  <text x="180" y="322" font-size="11" fill="#888">否</text>

  <g filter="url(#sk)">
    <rect x="450" y="234" width="150" height="40" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="525" y="259" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-weight="bold">按原下标返回 ans</text>
  <g filter="url(#sk)" fill="none" stroke="#4a7a3a" stroke-width="1.7">
    <path d="M 230 268 Q 340 268 446 254" marker-end="url(#ag)"/>
  </g>
  <text x="240" y="256" font-size="11" fill="#4a7a3a">是</text>

  <g filter="url(#sk)">
    <rect x="360" y="368" width="230" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="360" y="424" width="230" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="360" y="486" width="230" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="65" y="500" width="210" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="475" y="390" text-anchor="middle" font-size="12.5" fill="#2b5d8e">enter：insert(u)，值 u 入 Trie</text>
  <text x="475" y="442" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">回答 qAt[u]：ans[idx] = query(val)</text>
  <text x="475" y="460" text-anchor="middle" font-size="11" fill="#b85450">此刻 Trie 恰 = 根到 u 的路径</text>
  <text x="475" y="504" text-anchor="middle" font-size="12.5" fill="#2b5d8e">压入 (u, exit)，子节点逆序入栈</text>
  <text x="170" y="522" text-anchor="middle" font-size="12.5" fill="#2b5d8e">exit：remove(u)（cnt−1）</text>

  <g filter="url(#sk)" fill="none" stroke="#b85450" stroke-width="1.7">
    <path d="M 224 424 Q 290 420 356 388" marker-end="url(#ar)"/>
    <path d="M 224 438 Q 280 452 356 446" marker-end="url(#ar)"/>
    <path d="M 475 466 L 475 482" marker-end="url(#ar)"/>
  </g>
  <text x="238" y="416" font-size="11.5" fill="#b85450" font-weight="bold">enter</text>
  <text x="238" y="456" font-size="11.5" fill="#b85450" font-weight="bold">exit</text>

  <g filter="url(#sk)" fill="none" stroke="#888" stroke-width="1.6">
    <path d="M 475 528 L 475 570 L 170 570 L 170 542" marker-end="url(#ar)"/>
    <path d="M 170 570 L 60 570 L 60 268 L 104 268" marker-end="url(#ar)"/>
  </g>
  <text x="330" y="562" font-size="11" fill="#888">回到循环</text>
  <text x="70" y="360" font-size="11" fill="#888" transform="rotate(-90 70 360)">两相位共享一个栈</text>

  <g filter="url(#sk)">
    <rect x="40" y="584" width="540" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="310" y="602" text-anchor="middle" font-size="11.5" fill="#a07818">迭代事件栈替代递归：链状树深 10⁵ 也不爆调用栈；exit 相位先入栈、后弹出，保证子树全部处理完才回溯</text>
</svg>
