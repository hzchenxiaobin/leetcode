<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1.5 L 7.5 4.5 L 1 7.5" fill="none" stroke="#8a7a4e" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">合并之后，直径从哪里来？——三类候选路径</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- panel 1: inside T1 -->
  <g filter="url(#sk)">
    <rect x="36" y="54" width="276" height="118" rx="10" fill="#f0f6fc" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="174" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88" filter="url(#sk)">① 完全待在 T₁ 里</text>
  <g filter="url(#sk)">
    <path d="M 74 146 L 122 116 L 170 146 L 218 116" fill="none" stroke="#446688" stroke-width="3" stroke-linecap="round"/>
    <path d="M 122 116 L 146 166" fill="none" stroke="#8aa4bd" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="74" cy="146" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="122" cy="116" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="170" cy="146" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="218" cy="116" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="146" cy="166" r="7" fill="#f4f2ec" stroke="#b9b3a6" stroke-width="1.4"/>
  </g>
  <text x="174" y="160" text-anchor="middle" font-size="11.5" fill="#2b5a88" filter="url(#sk)">最长 ≤ d₁（T₁ 的直径）</text>

  <!-- panel 2: inside T2 -->
  <g filter="url(#sk)">
    <rect x="328" y="54" width="276" height="118" rx="10" fill="#f0f7ef" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="466" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 完全待在 T₂ 里</text>
  <g filter="url(#sk)">
    <path d="M 366 146 L 414 116 L 462 146 L 510 116" fill="none" stroke="#4a7a3a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 414 116 L 438 166" fill="none" stroke="#9db98d" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="366" cy="146" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="414" cy="116" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="462" cy="146" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="510" cy="116" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="438" cy="166" r="7" fill="#f4f2ec" stroke="#b9b3a6" stroke-width="1.4"/>
  </g>
  <text x="466" y="160" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">最长 ≤ d₂（T₂ 的直径）</text>

  <!-- panel 3: crossing the new edge -->
  <g filter="url(#sk)">
    <rect x="36" y="188" width="568" height="182" rx="10" fill="#fdf6ec" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10" filter="url(#sk)">③ 恰好跨过新边一次（简单路径至多经过新边一次）</text>
  <g filter="url(#sk)">
    <path d="M 150 284 L 120 244" fill="none" stroke="#c9b68a" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 490 284 L 520 244" fill="none" stroke="#c9b68a" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 206 318 L 434 318" fill="none" stroke="#b85450" stroke-width="2.6" stroke-dasharray="8 6" stroke-linecap="round"/>
    <path d="M 96 318 L 150 284 L 206 318 L 434 318 L 490 284 L 544 318" fill="none" stroke="#d6a040" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="96" cy="318" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="150" cy="284" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="120" cy="244" r="7" fill="#f4f2ec" stroke="#b9b3a6" stroke-width="1.4"/>
    <circle cx="206" cy="318" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="434" cy="318" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="490" cy="284" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="520" cy="244" r="7" fill="#f4f2ec" stroke="#b9b3a6" stroke-width="1.4"/>
    <circle cx="544" cy="318" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="96" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88" filter="url(#sk)">x*</text>
  <text x="206" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#b06a10" filter="url(#sk)">u</text>
  <text x="434" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#b06a10" filter="url(#sk)">v</text>
  <text x="544" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88" filter="url(#sk)">y*</text>
  <text x="320" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">新边（长度 +1）</text>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" fill="#8a6d2e" filter="url(#sk)">长度 = dist(x*, u) + 1 + dist(v, y*) ≤ ecc₁(u) + 1 + ecc₂(v)</text>

  <!-- conclusion band -->
  <g filter="url(#sk)">
    <rect x="36" y="384" width="568" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a88" filter="url(#sk)">D(u,v) = max( d₁ , d₂ , ecc₁(u) + 1 + ecc₂(v) )</text>
  <text x="320" y="430" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">d₁、d₂ 与怎么连无关；能优化的只有第三项——把 u、v 各自挪到「最居中」的位置</text>
</svg>
