  <text x="180.0" y="70.0" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">一个完整周期 2^(b+1) = 8</text>
  <path d="M 180.0 152.0 L 298.0 152.0" stroke="#4a7a3a" stroke-width="2.0" fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="240.0" y="170.0" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">周期内后 2^b = 4 个为 1</text>
  <rect x="30.5" y="196.0" width="559.7" height="74.5" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="224.0" text-anchor="middle" font-size="11.5" fill="#2f4a6d" filter="url(#rough2)">cnt_b(n) = ⌊(n+1) / 2^{b+1}⌋ · 2^b + max(0, (n+1) mod 2^{b+1} − 2^b)</text>
  <text x="310.0" y="250.0" text-anchor="middle" font-size="10.5" fill="#5a6c88" filter="url(#rough2)">前半是整周期贡献，后半是被截断的那个周期里落在「后半段」的个数</text>
  <rect x="29.5" y="285.6" width="560.2" height="60.1" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310.0" y="311.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">g(n) = Σ_b cnt_b(n) 就是 1..n 的强数组总长度（也是 1..n 的 popcount 之和）</text>
  <text x="310.0" y="329.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">h(n) = Σ_b b · cnt_b(n) 就是这些元素的指数和 —— 两条前缀都能 O(60) 求出</text>
