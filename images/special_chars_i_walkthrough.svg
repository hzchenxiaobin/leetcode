<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：word = "aaAbcBC"（黄色 = 本步新置的位）</text>

  <!-- table header -->
  <rect x="60" y="44" width="400" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="78" y="63" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="115" y="63" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="217" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">lower 集合</text>
  <text x="380" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">upper 集合</text>

  <!-- row 0: a -->
  <rect x="60" y="72" width="400" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="91" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="95" y="72" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="91" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="135" y="72" width="165" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="91" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">{ a }</text>
  <text x="380" y="91" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">∅</text>

  <!-- row 1: a -->
  <rect x="60" y="100" width="400" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="119" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="95" y="100" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="119" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="135" y="100" width="165" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="217" y="119" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">{ a }（重复，幂等）</text>
  <text x="380" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">∅</text>

  <!-- row 2: A -->
  <rect x="60" y="128" width="400" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="147" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <rect x="95" y="128" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="147" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="217" y="147" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">{ a }</text>
  <rect x="300" y="128" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="147" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">{ A }</text>

  <!-- row 3: b -->
  <rect x="60" y="156" width="400" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="175" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <rect x="95" y="156" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="175" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="135" y="156" width="165" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="175" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">{ a, b }</text>
  <text x="380" y="175" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">{ A }</text>

  <!-- row 4: c -->
  <rect x="60" y="184" width="400" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="203" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <rect x="95" y="184" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="203" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="135" y="184" width="165" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="203" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">{ a, b, c }</text>
  <text x="380" y="203" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">{ A }</text>

  <!-- row 5: B -->
  <rect x="60" y="212" width="400" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="231" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <rect x="95" y="212" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="231" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="217" y="231" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">{ a, b, c }</text>
  <rect x="300" y="212" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="231" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">{ A, B }</text>

  <!-- row 6: C -->
  <rect x="60" y="240" width="400" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="259" font-size="12" fill="#555" filter="url(#rough2)">6</text>
  <rect x="95" y="240" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="259" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="217" y="259" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">{ a, b, c }</text>
  <rect x="300" y="240" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="259" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">{ A, B, C }</text>

  <path d="M 260 268 L 260 290" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="106" y="292" width="308" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">lower &amp; upper = { a, b, c } → ans = 3</text>

  <!-- second example -->
  <rect x="60" y="338" width="400" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">"abBCab"：lower = {a,b}，upper = {b,c}，交集 = {b} → ans = 1</text>

  <rect x="48" y="382" width="424" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="401" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">幂等性：'a' 出现两次只置一次位；谁先谁后、出现几次都不影响结果</text>
</svg>
