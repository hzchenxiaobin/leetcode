<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="340" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">博弈状态：(老鼠位置, 猫位置, 该谁走)</text>
  <rect x="60" y="74" width="180" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="102.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">鼠 m = 0</text>
  <text x="150" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">鼠胜（到达洞）</text>
  <rect x="260" y="74" width="180" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="102.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">鼠 m = 猫 c</text>
  <text x="350" y="146" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">猫胜（同格）</text>
  <rect x="460" y="74" width="160" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540.0" y="102.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">其余状态</text>
  <text x="540" y="146" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">继续博弈</text>
  <rect x="90" y="184" width="480" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="211.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">状态总数 2·n²，n ≤ 50 → 至多 5000 个状态</text>
  <rect x="90" y="250" width="480" height="46" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="277.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">鼠走时取「最有利于鼠」，猫走时取「最不利于鼠」</text>
  <text x="330" y="320" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">有环的博弈不一定有唯一胜负：双方都躲得开就是平局</text>
</svg>
