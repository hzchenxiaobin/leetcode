<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">决策流程：只需回答一个问题</text>
  <path d="M 200 42 Q 320 50 440 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="230" y="72" width="180" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="102" text-anchor="middle" font-size="14.5" fill="#7a5415" font-weight="bold">数组元素已经</text>
  <text x="320" y="124" text-anchor="middle" font-size="14.5" fill="#7a5415" font-weight="bold">全部相等了吗？</text>

  <path d="M 230 107 L 120 107 L 120 190" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 410 107 L 520 107 L 520 190" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="150" y="96" font-size="14" fill="#2e6e2e" font-weight="bold">是</text>
  <text x="478" y="96" font-size="14" fill="#b85450" font-weight="bold">否</text>

  <g filter="url(#sk)">
    <rect x="40" y="196" width="160" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="120" y="223" text-anchor="middle" font-size="17" fill="#2e5e2e" font-weight="bold">ans = 0</text>

  <g filter="url(#sk)">
    <rect x="440" y="196" width="160" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="520" y="223" text-anchor="middle" font-size="17" fill="#8a3a36" font-weight="bold">ans = 1</text>

  <g filter="url(#sk)">
    <rect x="170" y="286" width="300" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="308" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">操作时直接选 l = 0, r = n−1：</text>
  <text x="320" y="330" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">每个元素都变成 AND(nums)，必然全相等</text>

  <path d="M 520 242 L 520 266 L 470 286" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
</svg>
