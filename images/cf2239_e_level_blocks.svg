<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">层与「自由边」：块内随便漫游，升级边把层抬高</text>

  <!-- 层 c 面板 -->
  <rect x="24" y="52" width="330" height="230" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="76" font-size="14" fill="#446688" filter="url(#rough2)">当前层 c（= 到目前为止的最大 low）</text>

  <circle cx="90" cy="130" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="200" cy="130" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="310" cy="130" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <path d="M108,126 C140,112 168,112 182,126" fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="145" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">low ≤ c ≤ w</text>
  <path d="M218,126 C250,112 278,112 292,126" fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="255" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">low ≤ c ≤ w</text>

  <rect x="52" y="168" width="274" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="190" font-size="12" fill="#333" filter="url(#rough2)">绿色边走过层不变 ⇒ 整个块内互相可达</text>
  <text x="66" y="210" font-size="12" fill="#4a7a3a" filter="url(#rough2)">记 F_c = { e : low ≤ c ≤ w }，块为其连通块</text>

  <circle cx="200" cy="258" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="263" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">x</text>
  <path d="M216,252 C246,232 272,226 296,222" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="246" y="276" font-size="11" fill="#b85450" filter="url(#rough2)">low = q &gt; c</text>

  <!-- 箭头 -->
  <path d="M372,166 C410,166 424,166 448,166" fill="none" stroke="#446688" stroke-width="2.2"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="412" y="152" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">升级</text>
  <text x="412" y="192" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">走这条边</text>

  <!-- 层 q 面板 -->
  <rect x="452" y="52" width="244" height="230" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="468" y="76" font-size="14" fill="#8a6d3b" filter="url(#rough2)">升级后：层变成 q = low_e</text>

  <circle cx="506" cy="132" r="15" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="506" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x</text>
  <circle cx="604" cy="132" r="15" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="604" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y</text>
  <circle cx="556" cy="204" r="15" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="556" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">w</text>
  <path d="M520,128 C548,120 582,120 590,128" fill="none" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M516,144 C528,168 540,184 548,192" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M596,144 C584,168 572,184 564,192" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="556" y="164" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">e 本身在 F_q 里</text>
  <text x="474" y="248" font-size="11" fill="#8a6d3b" filter="url(#rough2)">所以升级可以看成「在同一个点 x</text>
  <text x="474" y="266" font-size="11" fill="#8a6d3b" filter="url(#rough2)">把层抬到 q」，再去 F_q 块里漫游</text>

  <rect x="24" y="300" width="672" height="106" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="42" y="326" font-size="13" fill="#333" filter="url(#rough2)">可达集 = F_H 块 → 升级 → F_q1 块 → 升级 → … 的一条「层链」，层严格递增（层链长度可达 O(n)）。</text>
  <text x="42" y="352" font-size="13" fill="#333" filter="url(#rough2)">又因 w_e ≥ low_e = q，升级边的两端必在同一个 G_q = { w ≥ q } 块内，</text>
  <text x="42" y="378" font-size="13" fill="#b85450" filter="url(#rough2)">所以整条链都困在起点在 G_H 的连通块里 —— 这就是「从高层往低层扫」的合法性来源。</text>
</svg>
