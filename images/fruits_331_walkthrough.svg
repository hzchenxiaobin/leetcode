<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：官方示例 1 与「中介划算」示例</text>

  <!-- Example 1 -->
  <text x="40" y="56" font-size="13" font-weight="bold" fill="#2b2b2b">示例 1：b1 = [4,2,2,2]，b2 = [1,4,1,2]</text>

  <!-- freq table -->
  <g filter="url(#sk)">
    <rect x="40" y="70" width="270" height="110" rx="6" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <path d="M 40 96 L 310 96 M 40 122 L 310 122 M 112 70 L 112 180 M 185 70 L 185 180 M 248 70 L 248 180" stroke="#c8d8ea" stroke-width="1" fill="none"/>
  </g>
  <text x="76" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">值 v</text>
  <text x="148" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">c1</text>
  <text x="216" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">c2</text>
  <text x="279" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">diff</text>
  <text x="76" y="114" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="148" y="114" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="216" y="114" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="279" y="114" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">−2</text>
  <text x="76" y="140" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="148" y="140" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="216" y="140" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="279" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a8e4a">+2</text>
  <text x="76" y="166" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="148" y="166" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="216" y="166" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="279" y="166" text-anchor="middle" font-size="11.5" fill="#999999">0</text>

  <g filter="url(#sk)">
    <path d="M 310 125 L 340 125" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- surplus derivation -->
  <g filter="url(#sk)">
    <rect x="344" y="76" width="266" height="98" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="477" y="98" text-anchor="middle" font-size="11.5" fill="#555555">diff 全偶 ✓ → E1 = { 2 }，E2 = { 1 }</text>
  <text x="477" y="118" text-anchor="middle" font-size="11.5" fill="#555555">2m = 2 个盈余，m = 1；mn = 1</text>
  <text x="477" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">配对 (2, 1)：成本 = min( min(2,1), 2×1 )</text>
  <text x="477" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">= min(1, 2) = 1 ✓</text>

  <!-- example 1 swap picture -->
  <text x="40" y="208" font-size="11" fill="#666666">实际操作：交换 b1[1]=2 与 b2[0]=1，付 min(2,1)=1，两篮排序后均为 [1,2,2,4]</text>

  <!-- Example 3 -->
  <text x="40" y="246" font-size="13" font-weight="bold" fill="#2b2b2b">自造示例：b1 = [1,1,100,100]，b2 = [1,1,200,200]</text>

  <g filter="url(#sk)">
    <rect x="40" y="260" width="270" height="66" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="175" y="282" text-anchor="middle" font-size="11.5" fill="#555555">值 1：c1=c2=2 平衡；值 100：+2；值 200：−2</text>
  <text x="175" y="302" text-anchor="middle" font-size="11.5" fill="#555555">→ E1 = { 100 }，E2 = { 200 }，m = 1</text>
  <text x="175" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">mn = 1（两篮全局最小值）</text>

  <!-- two routes -->
  <g filter="url(#sk)">
    <rect x="40" y="344" width="280" height="90" rx="8" fill="#fdeef0" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="180" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#a13d3a">路线 A：直接换 100 ↔ 200</text>
  <text x="180" y="388" text-anchor="middle" font-size="11.5" fill="#555555">成本 = min(100, 200) = 100</text>
  <text x="180" y="412" text-anchor="middle" font-size="11" fill="#999999">大值对直接换，被付者也是大值，血亏</text>

  <g filter="url(#sk)">
    <rect x="340" y="344" width="272" height="90" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="476" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">路线 B：借 1 当摆渡车（两步）</text>
  <text x="476" y="388" text-anchor="middle" font-size="11.5" fill="#555555">100 ↔ 1 付 1，再 1 ↔ 200 付 1</text>
  <text x="476" y="412" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">合计 2×mn = 2 ✓ 更优</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="40" y="448" width="572" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="326" y="473" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">答案 = min(100, 2×1) = 2：这正是「每对封顶 2·mn」的意义</text>
</svg>
