    <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [0,1,1,1,1,1,0,0,0]</text>
    <text x="320" y="50" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">0 记 −1、1 记 +1 累加，前缀和重复出现时相减即得平衡区间长度</text>
