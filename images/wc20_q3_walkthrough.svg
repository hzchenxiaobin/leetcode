    <rect x="410" y="176" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="432" y="203" text-anchor="middle" font-size="12.5" fill="#8d3b38" filter="url(#rough2)">3</text>
    <text x="432" y="168" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">S7</text>
    <rect x="460" y="176" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="482" y="203" text-anchor="middle" font-size="12.5" fill="#8d3b38" filter="url(#rough2)">2</text>
    <text x="482" y="168" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">S8</text>
    <rect x="510" y="176" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="532" y="203" text-anchor="middle" font-size="12.5" fill="#8d3b38" filter="url(#rough2)">1</text>
    <text x="532" y="168" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">S9</text>
    <rect x="57" y="173" width="50" height="48" fill="none" stroke="#446688" stroke-width="2.2" rx="7" stroke-dasharray="7 4" filter="url(#rough2)"/>
    <rect x="157" y="173" width="50" height="48" fill="none" stroke="#446688" stroke-width="2.2" rx="7" stroke-dasharray="7 4" filter="url(#rough2)"/>
    <rect x="257" y="173" width="50" height="48" fill="none" stroke="#d6a040" stroke-width="2.2" rx="7" stroke-dasharray="7 4" filter="url(#rough2)"/>
    <rect x="457" y="173" width="50" height="48" fill="none" stroke="#d6a040" stroke-width="2.2" rx="7" stroke-dasharray="7 4" filter="url(#rough2)"/>
    <rect x="207" y="173" width="50" height="48" fill="none" stroke="#3f7a46" stroke-width="2.2" rx="7" filter="url(#rough2)"/>
    <rect x="507" y="173" width="50" height="48" fill="none" stroke="#3f7a46" stroke-width="2.2" rx="7" filter="url(#rough2)"/>
    <path d="M 258 230 L 258 242 L 556 242 L 556 230" stroke="#3f7a46" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
    <text x="406" y="258" text-anchor="middle" font-size="11" fill="#3f7a46" filter="url(#rough2)">nums[3..8]：三个 1 + 三个 0，长度 6</text>
    <text x="70" y="292" font-size="11.5" fill="#446688" filter="url(#rough2)">S0 = S2 = 0 → 长度 2</text>
    <text x="330" y="292" font-size="11.5" fill="#b8860b" filter="url(#rough2)">S4 = S8 = 2 → 长度 4</text>
    <text x="70" y="316" font-size="11.5" fill="#3f7a46" filter="url(#rough2)">S3 = S9 = 1 → 长度 6（取最大）</text>
    <text x="330" y="316" font-size="11" fill="#777" filter="url(#rough2)">首次下标越小，区间越长</text>
