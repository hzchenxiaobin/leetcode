    <rect x="260" y="92" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="282" y="119" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
    <text x="282" y="150" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
    <rect x="310" y="92" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="332" y="119" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
