<svg xmlns="http://www.w3.org/2000/svg" width="660" height="460" viewBox="0 0 660 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="460" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" font-family="monospace" filter="url(#sk)">示例演算：word1 = ["ab", "c"] vs word2 = ["a", "bc"]</text>
  <path d="M 160 38 Q 330 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="638" y="56" text-anchor="end" font-size="11" fill="#999" filter="url(#sk)">红框 = 当前比较的字符</text>

  <text x="155" y="58" text-anchor="middle" font-size="11.5" fill="#667" filter="url(#sk)">word1（拼接后 "abc"）</text>
  <text x="440" y="58" text-anchor="middle" font-size="11.5" fill="#667" filter="url(#sk)">word2（拼接后 "abc"）</text>
  <g font-size="10.5" fill="#999" text-anchor="middle" font-family="monospace" filter="url(#sk)">
    <text x="131" y="72">word1[0]</text>
    <text x="197" y="72">word1[1]</text>
    <text x="399" y="72">word2[0]</text>
    <text x="463" y="72">word2[1]</text>
    <text x="46" y="72">步</text>
    <text x="297" y="72">比较</text>
    <text x="590" y="72">结果</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 173 78 L 173 334" stroke="#b0b8c4" stroke-width="1" stroke-dasharray="4,4"/>
    <path d="M 422 78 L 422 334" stroke="#b0b8c4" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <g filter="url(#sk)">
    <rect x="96" y="80" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="132" y="80" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="180" y="80" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="382" y="80" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="428" y="80" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="464" y="80" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="113" y="102" fill="#b85450">a</text>
    <text x="149" y="102" fill="#2b4a66">b</text>
    <text x="197" y="102" fill="#2b4a66">c</text>
    <text x="399" y="102" fill="#b85450">a</text>
    <text x="445" y="102" fill="#3a5a3a">b</text>
    <text x="481" y="102" fill="#3a5a3a">c</text>
  </g>
  <text x="46" y="102" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#sk)">第 0 步</text>
  <text x="297" y="102" text-anchor="middle" font-size="15" fill="#555" filter="url(#sk)">=</text>
  <text x="113" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" font-family="monospace" filter="url(#sk)">(i,j)=(0,0)</text>
  <text x="399" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" font-family="monospace" filter="url(#sk)">(x,y)=(0,0)</text>
  <text x="590" y="102" text-anchor="middle" font-size="12.5" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">相等 ✓</text>

  <g filter="url(#sk)">
    <rect x="96" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="132" y="152" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="180" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="382" y="152" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="428" y="152" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="464" y="152" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="113" y="174" fill="#2b4a66">a</text>
    <text x="149" y="174" fill="#b85450">b</text>
    <text x="197" y="174" fill="#2b4a66">c</text>
    <text x="399" y="174" fill="#3a5a3a">a</text>
    <text x="445" y="174" fill="#b85450">b</text>
    <text x="481" y="174" fill="#3a5a3a">c</text>
  </g>
  <text x="46" y="174" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#sk)">第 1 步</text>
  <text x="297" y="174" text-anchor="middle" font-size="15" fill="#555" filter="url(#sk)">=</text>
  <text x="149" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" font-family="monospace" filter="url(#sk)">(i,j)=(0,1)</text>
  <text x="445" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" font-family="monospace" filter="url(#sk)">(x,y)=(1,0)</text>
  <text x="590" y="174" text-anchor="middle" font-size="12.5" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">相等 ✓</text>

  <g filter="url(#sk)">
    <rect x="96" y="224" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="132" y="224" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="180" y="224" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="382" y="224" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="428" y="224" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="464" y="224" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="113" y="246" fill="#2b4a66">a</text>
    <text x="149" y="246" fill="#2b4a66">b</text>
    <text x="197" y="246" fill="#b85450">c</text>
    <text x="399" y="246" fill="#3a5a3a">a</text>
    <text x="445" y="246" fill="#3a5a3a">b</text>
    <text x="481" y="246" fill="#b85450">c</text>
  </g>
  <text x="46" y="246" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#sk)">第 2 步</text>
  <text x="297" y="246" text-anchor="middle" font-size="15" fill="#555" filter="url(#sk)">=</text>
  <text x="197" y="272" text-anchor="middle" font-size="10.5" fill="#b85450" font-family="monospace" filter="url(#sk)">(i,j)=(1,0)</text>
  <text x="481" y="272" text-anchor="middle" font-size="10.5" fill="#b85450" font-family="monospace" filter="url(#sk)">(x,y)=(1,1)</text>
  <text x="590" y="246" text-anchor="middle" font-size="12.5" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">相等 ✓</text>

  <g filter="url(#sk)">
    <rect x="96" y="296" width="34" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="132" y="296" width="34" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="180" y="296" width="34" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="382" y="296" width="34" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="428" y="296" width="34" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="464" y="296" width="34" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#aaa" font-weight="bold" filter="url(#sk)">
    <text x="113" y="318">a</text>
    <text x="149" y="318">b</text>
    <text x="197" y="318">c</text>
    <text x="399" y="318">a</text>
    <text x="445" y="318">b</text>
    <text x="481" y="318">c</text>
  </g>
  <text x="46" y="318" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#sk)">终止</text>
  <text x="297" y="318" text-anchor="middle" font-size="15" fill="#555" filter="url(#sk)">→</text>
  <text x="155" y="348" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">i = 2（word1 耗尽）</text>
  <text x="440" y="348" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">x = 2（word2 耗尽）</text>
  <g filter="url(#sk)">
    <rect x="522" y="300" width="136" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="590" y="322" text-anchor="middle" font-size="13" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">返回 true ✓</text>

  <g filter="url(#sk)">
    <rect x="50" y="380" width="560" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="403" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">反例：word1 = ["abc"]，word2 = ["ab"] —— 第 3 步时 word2 已耗尽而 word1 还剩 "c"，</text>
  <text x="330" y="424" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">长度不同 → false；若某步字符不等（如 "acb" vs "abc" 的第 2 步）同样提前返回 false。</text>
</svg>
