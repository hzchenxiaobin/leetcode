<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 468"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="468" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：l = 4，r = 16 → 答案 11</text>
  <path d="M 250 42 Q 380 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Panel 1: sieve scan table ===== -->
  <text x="259" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① n = ⌊√16⌋ = 4，扫描 i = 2 … 4</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="24" y="78" width="44" height="32" fill="#e8f0fe" stroke="#999999" stroke-width="1.2"/>
    <rect x="68" y="78" width="138" height="32" fill="#e8f0fe" stroke="#999999" stroke-width="1.2"/>
    <rect x="206" y="78" width="52" height="32" fill="#e8f0fe" stroke="#999999" stroke-width="1.2"/>
    <rect x="258" y="78" width="146" height="32" fill="#e8f0fe" stroke="#999999" stroke-width="1.2"/>
    <rect x="404" y="78" width="90" height="32" fill="#e8f0fe" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="46" y="98">i</text>
    <text x="137" y="98">是否质数</text>
    <text x="232" y="98">i²</text>
    <text x="331" y="98">落在 [4, 16]？</text>
    <text x="449" y="98">special</text>
  </g>

  <!-- row i = 2 -->
  <g filter="url(#rough2)">
    <rect x="24" y="110" width="44" height="34" fill="#e6f4ea" stroke="#999999" stroke-width="1.2"/>
    <rect x="68" y="110" width="138" height="34" fill="#e6f4ea" stroke="#999999" stroke-width="1.2"/>
    <rect x="206" y="110" width="52" height="34" fill="#e6f4ea" stroke="#999999" stroke-width="1.2"/>
    <rect x="258" y="110" width="146" height="34" fill="#e6f4ea" stroke="#999999" stroke-width="1.2"/>
    <rect x="404" y="110" width="90" height="34" fill="#e6f4ea" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" text-anchor="middle" filter="url(#rough2)">
    <text x="46" y="131" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="137" y="131" fill="#2e6e2e">质数 ✓</text>
    <text x="232" y="131" fill="#2e6e2e">4</text>
    <text x="331" y="131" fill="#2e6e2e">✓（4 ≥ 4）</text>
    <text x="449" y="131" font-weight="bold" fill="#2e6e2e">1</text>
  </g>

  <!-- row i = 3 -->
  <g filter="url(#rough2)">
    <rect x="24" y="144" width="44" height="34" fill="#e6f4ea" stroke="#999999" stroke-width="1.2"/>
    <rect x="68" y="144" width="138" height="34" fill="#e6f4ea" stroke="#999999" stroke-width="1.2"/>
    <rect x="206" y="144" width="52" height="34" fill="#e6f4ea" stroke="#999999" stroke-width="1.2"/>
    <rect x="258" y="144" width="146" height="34" fill="#e6f4ea" stroke="#999999" stroke-width="1.2"/>
    <rect x="404" y="144" width="90" height="34" fill="#e6f4ea" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" text-anchor="middle" filter="url(#rough2)">
    <text x="46" y="165" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="137" y="165" fill="#2e6e2e">质数 ✓</text>
    <text x="232" y="165" fill="#2e6e2e">9</text>
    <text x="331" y="165" fill="#2e6e2e">✓（9 ≤ 16）</text>
    <text x="449" y="165" font-weight="bold" fill="#2e6e2e">2</text>
  </g>

  <!-- row i = 4 -->
  <g filter="url(#rough2)">
    <rect x="24" y="178" width="44" height="34" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
    <rect x="68" y="178" width="138" height="34" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
    <rect x="206" y="178" width="52" height="34" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
    <rect x="258" y="178" width="146" height="34" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
    <rect x="404" y="178" width="90" height="34" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" text-anchor="middle" filter="url(#rough2)">
    <text x="46" y="199" font-weight="bold" fill="#888888">4</text>
    <text x="137" y="199" fill="#888888">合数（2 的倍数，被划掉）</text>
    <text x="232" y="199" fill="#888888">—</text>
    <text x="331" y="199" fill="#888888">—</text>
    <text x="449" y="199" fill="#888888">2</text>
  </g>

  <text x="259" y="234" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">2、3 是质数且平方落在区间内；4 = 2² 的倍数被筛掉</text>

  <!-- ===== Panel 2: number line check ===== -->
  <text x="243" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">② 区间 [4, 16] 逐个数对账</text>

  <!-- number boxes 4..16 -->
  <g filter="url(#rough2)">
    <rect x="24" y="276" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="58" y="276" width="30" height="32" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="92" y="276" width="30" height="32" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="126" y="276" width="30" height="32" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="160" y="276" width="30" height="32" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="194" y="276" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="228" y="276" width="30" height="32" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="262" y="276" width="30" height="32" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="296" y="276" width="30" height="32" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="330" y="276" width="30" height="32" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="364" y="276" width="30" height="32" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="398" y="276" width="30" height="32" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="432" y="276" width="30" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="39" y="297" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="73" y="297" fill="#999999">5</text>
    <text x="107" y="297" fill="#999999">6</text>
    <text x="141" y="297" fill="#999999">7</text>
    <text x="175" y="297" fill="#999999">8</text>
    <text x="209" y="297" font-weight="bold" fill="#2e6e2e">9</text>
    <text x="243" y="297" fill="#999999">10</text>
    <text x="277" y="297" fill="#999999">11</text>
    <text x="311" y="297" fill="#999999">12</text>
    <text x="345" y="297" fill="#999999">13</text>
    <text x="379" y="297" fill="#999999">14</text>
    <text x="413" y="297" fill="#999999">15</text>
    <text x="447" y="297" font-weight="bold" fill="#7a2828">16</text>
  </g>
  <text x="39" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2² ✓</text>
  <text x="209" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3² ✓</text>
  <text x="447" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">4² 也</text>
  <text x="447" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">不是</text>
  <text x="243" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">13 个数 − 2 个特殊 = 11 ✓（16 = 4²：m 是合数，不算）</text>

  <!-- ===== Panel 3: example 1 ===== -->
  <text x="618" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 示例 1 对账：l = 5，r = 7</text>
  <g filter="url(#rough2)">
    <rect x="500" y="276" width="236" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="618" y="302" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">2² = 4 &lt; 5（出下界，不计）</text>
  <text x="618" y="326" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">3² = 9 &gt; 7（出上界，p = 3 &gt; n = 2）</text>
  <text x="618" y="350" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">特殊数字 0 个</text>
  <text x="618" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">答案 = 7 − 5 + 1 − 0 = 3 ✓</text>

  <!-- ===== takeaway ===== -->
  <g filter="url(#rough2)">
    <rect x="24" y="402" width="712" height="52" rx="10" fill="#fffdf3" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="380" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心公式：答案 = (r − l + 1) − #{p 质数 ： l ≤ p² ≤ r}</text>
  <text x="380" y="444" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">边界口诀：上界筛死 p ≤ ⌊√r⌋，下界乘法 p·p ≥ l——l 为完全平方数时最不易错</text>
</svg>
