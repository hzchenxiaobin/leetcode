<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">短除法：n = 7q + r，余数 r 就是当前最低位</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">对商反复取余直到商为 0；余数按「低位 → 高位」产出，最后整体反转</text>

  <text x="30" y="76" font-size="10.5" fill="#777" filter="url(#rough2)">以 num = 99 为例</text>
  <text x="392" y="76" font-size="10.5" fill="#777" text-anchor="middle" filter="url(#rough2)">余数序列</text>

  <g filter="url(#rough2)">
    <rect x="30" y="84" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="46" y="108" font-size="12" fill="#334">99 ÷ 7 = 14 … 余 1</text>
    <rect x="372" y="84" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="394" y="108" text-anchor="middle" font-size="14" fill="#8a6a20">1</text>
  </g>

  <path d="M 180 122 L 180 128" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="30" y="130" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="46" y="154" font-size="12" fill="#334">14 ÷ 7 = 2 … 余 0</text>
    <rect x="372" y="130" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="394" y="154" text-anchor="middle" font-size="14" fill="#8a6a20">0</text>
  </g>

  <path d="M 180 168 L 180 174" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="30" y="176" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="46" y="200" font-size="12" fill="#334">2 ÷ 7 = 0 … 余 2</text>
    <rect x="372" y="176" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="394" y="200" text-anchor="middle" font-size="14" fill="#8a6a20">2</text>
  </g>

  <text x="30" y="238" font-size="10.5" fill="#555" filter="url(#rough2)">商变成 0 → 循环结束；余数取出顺序是 1、0、2（低位在前）</text>

  <path d="M 394 218 L 394 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="300" y="250" width="230" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="415" y="280" text-anchor="middle" font-size="13" fill="#3a5a30">反转 → “201”</text>
  </g>

  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">验证：2×7² + 0×7 + 1 = 98 + 1 = 99，与原数一致</text>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">若漏掉反转，得到的是镜像串 “102”，数值就错了</text>
</svg>
