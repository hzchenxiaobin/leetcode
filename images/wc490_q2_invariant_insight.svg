<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fdfcf7"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：数位阶乘和 S 在重排下不变</text>
  <path d="M 150 40 Q 280 50 410 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- digit multiset box -->
  <rect x="20" y="64" width="150" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="95" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#a87b20">n 的数字</text>
  <g filter="url(#sk)">
    <rect x="32" y="102" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="78" y="102" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="124" y="102" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#2b4a6e" text-anchor="middle">
    <text x="51" y="126">1</text>
    <text x="97" y="126">4</text>
    <text x="143" y="126">5</text>
  </g>
  <text x="95" y="160" text-anchor="middle" font-size="10" fill="#8a6a30">多重集 {1, 4, 5}</text>
  <text x="95" y="180" text-anchor="middle" font-size="9.5" fill="#999">与顺序无关</text>

  <!-- arrows multiset -> arrangements -->
  <path d="M 172 124 Q 216 98 244 95" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 172 133 Q 216 152 244 169" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 172 137 Q 218 205 244 246" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- arrangement column -->
  <text x="305" y="60" text-anchor="middle" font-size="10.5" fill="#888">任意重排 p</text>

  <rect x="250" y="72" width="110" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="305" y="99" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">145</text>
  <text x="305" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">= S ✓ 阶数数字！</text>

  <rect x="250" y="150" width="110" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="305" y="177" text-anchor="middle" font-size="15" fill="#2b4a6e">154</text>

  <rect x="250" y="228" width="110" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="305" y="255" text-anchor="middle" font-size="15" fill="#2b4a6e">451</text>

  <!-- arrows arrangements -> S -->
  <path d="M 362 95 Q 384 125 394 156" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 362 171 Q 380 172 394 172" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 362 247 Q 384 220 394 184" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- S invariant box -->
  <rect x="396" y="96" width="150" height="150" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="471" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">S（不变量）</text>
  <text x="471" y="140" text-anchor="middle" font-size="11" fill="#7a4a48">1! + 4! + 5!</text>
  <text x="471" y="158" text-anchor="middle" font-size="11" fill="#7a4a48">= 1 + 24 + 120</text>
  <text x="471" y="183" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450">= 145</text>
  <text x="471" y="207" text-anchor="middle" font-size="9.5" fill="#999">无论怎么重排</text>
  <text x="471" y="223" text-anchor="middle" font-size="9.5" fill="#999">都是这个值！</text>

  <!-- key insight callout -->
  <rect x="24" y="300" width="512" height="106" rx="10" fill="#f4f0fa" stroke="#7a5aa0" stroke-width="1.6" filter="url(#sk)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a80">p 是阶数数字 ⟺ p = S(p) = S(n)：候选值只有 S(n) 一个！</text>
  <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#4a4a4a">答案为 true ⟺ sorted(str(S(n))) = sorted(str(n))</text>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#888">例：n = 154，S = 145，数字同为 {1,4,5} → 可重排成 145 → true</text>
</svg>
