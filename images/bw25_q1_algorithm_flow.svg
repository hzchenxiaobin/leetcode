<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    算法流程：一趟求 max，一趟比较
  </text>

  <!-- 开始 -->
  <ellipse cx="260" cy="72" rx="52" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"
           filter="url(#rough2)"/>
  <text x="260" y="77" text-anchor="middle" font-size="14" fill="#2f5a24" filter="url(#rough2)">开始</text>

  <path d="M 260 92 L 260 116" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 求 max -->
  <rect x="150" y="118" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">
    扫描求 mx = max(candies)
  </text>

  <path d="M 260 158 L 260 182" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i=0 -->
  <rect x="192" y="184" width="136" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">i = 0</text>

  <path d="M 260 218 L 260 240" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判断 -->
  <polygon points="260,242 350,280 260,318 170,280" fill="#fff8e1" stroke="#d6a040"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="277" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    candies[i]+extra
  </text>
  <text x="260" y="294" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">≥ mx ？</text>

  <!-- 左分支 false -->
  <path d="M 170 280 L 108 280" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="134" y="270" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="16" y="262" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="61" y="285" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">result[i]=F</text>

  <!-- 右分支 true -->
  <path d="M 350 280 L 412 280" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="414" y="262" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="459" y="285" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">result[i]=T</text>

  <!-- 两分支汇合到 i++ -->
  <path d="M 61 298 C 61 330, 180 336, 256 336" stroke="#b85450" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <path d="M 459 298 C 459 330, 340 336, 264 336" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <rect x="192" y="322" width="136" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">i = i + 1</text>

  <path d="M 328 337 L 386 337 L 386 336" stroke="#446688" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <path d="M 386 336 C 440 334, 448 200, 262 201" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="262" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">i &lt; n 继续比较</text>

  <!-- 结束 -->
  <rect x="150" y="366" width="220" height="0" fill="none" filter="url(#rough2)"/>
  <ellipse cx="260" cy="380" rx="0" ry="0" filter="url(#rough2)"/>
  <rect x="120" y="362" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">
    i = n 时返回 result，时间 O(n)
  </text>
</svg>
