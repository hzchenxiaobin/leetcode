<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：按 nums1 升序处理，候选集只增不减</text>
  <path d="M 130 44 Q 320 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="66" text-anchor="middle" font-size="12" fill="#666">示例 1（k = 2）：下标按 nums1 值升序排好队</text>
  <text x="398" y="78" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040">当前处理</text>

  <!-- sorted sequence of (nums1 value, nums2) -->
  <g filter="url(#sk)">
    <rect x="44" y="84" width="84" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="148" y="84" width="84" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="252" y="84" width="84" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="356" y="84" width="84" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="460" y="84" width="84" height="52" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="86" y="102" text-anchor="middle" font-size="10" fill="#888">nums1=1</text>
  <text x="86" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">30</text>
  <text x="190" y="102" text-anchor="middle" font-size="10" fill="#888">nums1=2</text>
  <text x="190" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">20</text>
  <text x="294" y="102" text-anchor="middle" font-size="10" fill="#888">nums1=3</text>
  <text x="294" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">50</text>
  <text x="398" y="102" text-anchor="middle" font-size="10" fill="#b8863a">nums1=4</text>
  <text x="398" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">10</text>
  <text x="502" y="102" text-anchor="middle" font-size="10" fill="#999">nums1=5</text>
  <text x="502" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#777">40</text>
  <path d="M 44 148 L 44 156 Q 190 164 336 156 L 336 148" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="190" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">已激活候选 {20, 30, 50}</text>
  <text x="190" y="200" text-anchor="middle" font-size="10.5" fill="#666">恰好是全部 nums1 &lt; 4 的元素</text>

  <!-- min-heap panel -->
  <g filter="url(#sk)">
    <rect x="44" y="214" width="272" height="124" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="180" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">容量 k=2 的小根堆 = 前 2 大</text>
  <path d="M 139 276 Q 176 290 197 290" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="128" cy="266" r="17" fill="#fff" stroke="#446688" stroke-width="1.6"/>
    <circle cx="212" cy="296" r="17" fill="#fff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="128" y="271" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">30</text>
  <text x="212" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">50</text>
  <text x="80" y="310" text-anchor="middle" font-size="10" fill="#666">堆顶 = 堆中最小者</text>
  <path d="M 96 302 Q 110 292 115 284" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="240" y="250" width="66" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="273" y="271" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a2b">sum=80</text>

  <!-- why fast panel -->
  <g filter="url(#sk)">
    <rect x="348" y="214" width="248" height="124" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="472" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">为什么是 O(n log k)？</text>
  <text x="362" y="262" font-size="11.5" fill="#444">候选集只增不减 →</text>
  <text x="362" y="282" font-size="11.5" fill="#444">每个元素至多入堆 1 次、出堆 1 次</text>
  <text x="362" y="302" font-size="11.5" fill="#444">每次堆操作 O(log k)</text>
  <text x="362" y="326" font-size="10.5" fill="#888">排序 O(n log n) 是另一笔开销</text>

  <!-- bottom formula -->
  <g filter="url(#sk)">
    <rect x="40" y="352" width="560" height="36" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="375" text-anchor="middle" font-size="12" fill="#666">answer[i] = 已激活集合（nums1[j] &lt; nums1[i]）中前 k 大的 nums2 之和</text>
</svg>
