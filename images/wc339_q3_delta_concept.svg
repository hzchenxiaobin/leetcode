<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：基线（老鼠2 全吃）+ 换食增量 Δ = reward1[i] − reward2[i]</text>

  <!-- cheese 0 -->
  <text x="121" y="58" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">第0块</text>
  <rect x="76" y="66" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r1 = 1</text>
  <rect x="76" y="98" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r2 = 4</text>
  <text x="121" y="146" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">Δ = −3</text>

  <!-- cheese 1 -->
  <text x="231" y="58" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">第1块</text>
  <rect x="186" y="66" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r1 = 1</text>
  <rect x="186" y="98" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r2 = 4</text>
  <text x="231" y="146" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">Δ = −3</text>

  <!-- cheese 2 -->
  <text x="341" y="58" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">第2块</text>
  <rect x="296" y="66" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r1 = 3</text>
  <rect x="296" y="98" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r2 = 1</text>
  <text x="341" y="146" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Δ = +2</text>

  <!-- cheese 3 -->
  <text x="451" y="58" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">第3块</text>
  <rect x="406" y="66" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="451" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r1 = 4</text>
  <rect x="406" y="98" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="451" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r2 = 1</text>
  <text x="451" y="146" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Δ = +3</text>

  <!-- baseline box -->
  <rect x="48" y="176" width="232" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="198" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">基线：先让老鼠2吃掉全部 n 块</text>
  <text x="164" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">base = Σ reward2（例中 = 10）</text>

  <path d="M 286 204 L 330 204" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="195" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">换 k 块</text>

  <!-- mouse1 box -->
  <rect x="334" y="176" width="178" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="423" y="198" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">老鼠1 恰好要吃 k 块</text>
  <text x="423" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">⇐ 从基线换入 k 块</text>

  <text x="280" y="258" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">每块奶酪独立二选一，换哪几块互不牵连——总得分是各块得分之和，无交叉项</text>

  <!-- formula box -->
  <rect x="60" y="272" width="440" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">总分 = base + Σ（换入块的 Δ）</text>
  <text x="280" y="315" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">总分最大 ⇔ 从 Δ 中选最大的 k 个（排序取前 k）</text>

  <!-- bottom box -->
  <rect x="70" y="342" width="420" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">「恰好 k 块」是硬约束：Δ 为负也要凑满，挑亏得最少的</text>
</svg>
