<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="336" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">任务用时 = 相邻结束时刻之差</text>

  <!-- 员工标签 -->
  <text x="98" y="124" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">员工 0</text>
  <text x="178" y="124" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">员工 2</text>
  <text x="274" y="124" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">员工 0</text>
  <text x="434" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">员工 1 ★</text>

  <!-- 分段条：宽度按时长比例 -->
  <rect x="50" y="132" width="96" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">任务 0</text>
  <text x="98" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>

  <rect x="146" y="132" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">任务 1</text>
  <text x="178" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <rect x="210" y="132" width="128" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">任务 2</text>
  <text x="274" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>

  <rect x="338" y="132" width="192" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="434" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">任务 3</text>
  <text x="434" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>

  <!-- 时间轴 -->
  <line x1="36" y1="200" x2="538" y2="200" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="50" y1="194" x2="50" y2="206" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="146" y1="194" x2="146" y2="206" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="210" y1="194" x2="210" y2="206" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="338" y1="194" x2="338" y2="206" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="530" y1="194" x2="530" y2="206" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="226" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <text x="146" y="226" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <text x="210" y="226" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">5</text>
  <text x="338" y="226" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">9</text>
  <text x="530" y="226" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">15</text>

  <!-- 每段用时 -->
  <text x="98" y="252" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3 − 0 = 3</text>
  <text x="178" y="252" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">5 − 3 = 2</text>
  <text x="274" y="252" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">9 − 5 = 4</text>
  <text x="434" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">15 − 9 = 6</text>

  <!-- 公式说明框 -->
  <rect x="80" y="278" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">任务 i 用时 dur = t(i) − t(i−1)，约定 t(−1) = 0</text>
</svg>
