<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="404" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">覆盖 days[i] 的票从 days[i] 买起，只剩三种选择</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">把票的生效日右移到 days[i] 不会丢掉任何还需要覆盖的日子</text>
  <text x="30" y="74" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">站在 days[i]，三种票覆盖的日历区间</text>
  <rect x="30" y="92" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="53.0" y="114.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="76" y="92" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="99.0" y="114.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="122" y="92" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="145.0" y="114.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="168" y="92" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="191.0" y="114.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="214" y="92" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="237.0" y="114.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="260" y="92" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="283.0" y="114.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="30" y="152" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">days[i] = 4</text>
  <rect x="70" y="176" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="220.0" y="194.78" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7 天票：4 → 10（覆盖 4~10 的旅行日 4,6,7,8）</text>
  <rect x="70" y="214" width="420" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="280.0" y="232.78" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">30 天票：4 → 33（覆盖 4,6,7,8,20）</text>
  <rect x="70" y="252" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="100.0" y="270.78" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1 天票</text>
  <text x="30" y="300" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">下一段从第一个「没被覆盖」的旅行日开始</text>
  <text x="30" y="322" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">所以只需二分出 j7 / j30，直接跳到对应下标</text>
  <rect x="60" y="340" width="470" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="70" y="361.5" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">dp[i] = min(c0 + dp[i+1], c1 + dp[j7], c2 + dp[j30])</text>
</svg>
