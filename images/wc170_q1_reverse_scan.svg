<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="452" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">从右向左扫描：每步只决定一个 token</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">先逆序拼出结果，最后整体反转一次，全程无需回溯</text>

  <rect x="170" y="62" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">i = n − 1，res = 空串</text>

  <path d="M 280 96 L 280 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,110 385,150 280,190 175,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">i ≥ 0 ?</text>

  <path d="M 385 150 L 445 150 L 445 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="140" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="340" y="178" width="170" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="198" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">反转 res</text>
  <text x="425" y="215" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">返回结果</text>

  <path d="M 280 190 L 280 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="204" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <polygon points="280,210 385,252 280,294 175,252" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="257" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">s[i] == '#' ?</text>

  <path d="M 175 252 L 115 252 L 115 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="134" y="242" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="25" y="316" width="180" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="338" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">n = 10·s[i−2] + s[i−1]</text>
  <text x="115" y="358" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">res += chr('a' + n − 1)</text>
  <text x="115" y="378" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i -= 3</text>

  <path d="M 385 252 L 445 252 L 445 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="242" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="350" y="316" width="168" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="434" y="342" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">一位数字 = s[i]</text>
  <text x="434" y="364" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">res += chr('a' + s[i] − '1')</text>
  <text x="434" y="384" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i -= 1</text>

  <path d="M 115 394 L 115 414 L 530 414 L 530 78 L 394 78" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="70" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">回到循环头</text>
  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两个分支都把 i 严格减小，故循环至多 n 步</text>
  <text x="280" y="446" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(n)，额外空间 O(1)（不计输出）</text>
</svg>
