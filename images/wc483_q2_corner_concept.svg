<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：约束只落在四个角格上</text>

  <!-- 边标签 -->
  <text x="156" y="56" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">top = able（第 0 行）</text>
  <text x="156" y="268" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">bottom = also（第 3 行）</text>
  <text x="36" y="156" text-anchor="middle" font-size="11.5" fill="#446688" transform="rotate(-90 36 156)" filter="url(#rough2)">left = area（第 0 列）</text>
  <text x="276" y="156" text-anchor="middle" font-size="11.5" fill="#446688" transform="rotate(90 276 156)" filter="url(#rough2)">right = echo（第 3 列）</text>

  <!-- 4x4 网格：格宽 46，起点 (64,64) -->
  <!-- 第 0 行 -->
  <rect x="64" y="64" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="70" y="78" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">左上</text>
  <text x="87" y="98" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <rect x="110" y="64" width="46" height="46" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="133" y="95" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">b</text>
  <rect x="156" y="64" width="46" height="46" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="179" y="95" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">l</text>
  <rect x="202" y="64" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="208" y="78" font-size="8.5" fill="#d6a040" filter="url(#rough2)">右上</text>
  <text x="225" y="98" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">e</text>

  <!-- 第 1 行 -->
  <rect x="64" y="110" width="46" height="46" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="87" y="141" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">r</text>
  <rect x="110" y="110" width="46" height="46" rx="4" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="133" y="141" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="156" y="110" width="46" height="46" rx="4" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="179" y="141" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="202" y="110" width="46" height="46" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="225" y="141" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">c</text>

  <!-- 第 2 行 -->
  <rect x="64" y="156" width="46" height="46" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="87" y="187" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">e</text>
  <rect x="110" y="156" width="46" height="46" rx="4" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="133" y="187" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="156" y="156" width="46" height="46" rx="4" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="179" y="187" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="202" y="156" width="46" height="46" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="225" y="187" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">h</text>

  <!-- 第 3 行 -->
  <rect x="64" y="202" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="70" y="216" font-size="8.5" fill="#446688" filter="url(#rough2)">左下</text>
  <text x="87" y="236" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <rect x="110" y="202" width="46" height="46" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="133" y="233" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">l</text>
  <rect x="156" y="202" width="46" height="46" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="179" y="233" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">s</text>
  <rect x="202" y="202" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="208" y="216" font-size="8.5" fill="#b85450" filter="url(#rough2)">右下</text>
  <text x="225" y="236" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">o</text>

  <!-- 右侧四个角等式 -->
  <rect x="306" y="64" width="246" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="429" y="83" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">左上角：top[0] == left[0]</text>
  <text x="429" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">第 0 行 ∩ 第 0 列 → 共用格子 'a'</text>

  <rect x="306" y="122" width="246" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="429" y="141" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">右上角：top[3] == right[0]</text>
  <text x="429" y="158" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">第 0 行 ∩ 第 3 列 → 共用格子 'e'</text>

  <rect x="306" y="180" width="246" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="429" y="199" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">左下角：bottom[0] == left[3]</text>
  <text x="429" y="216" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">第 3 行 ∩ 第 0 列 → 共用格子 'a'</text>

  <rect x="306" y="238" width="246" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="429" y="257" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">右下角：bottom[3] == right[3]</text>
  <text x="429" y="274" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">第 3 行 ∩ 第 3 列 → 共用格子 'o'</text>

  <!-- 底部说明 -->
  <rect x="40" y="306" width="480" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">中央 4 格不被任何词覆盖，边框其余 12 格各归一条边独占</text>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">合法性只由 4 个角等式决定 —— 几何题坍缩为</text>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">「枚举 4 个互异下标 + 验 4 个等式」的纯组合枚举</text>
</svg>
