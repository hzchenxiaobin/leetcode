<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算:nums = ["111", "011", "001"]</text>

  <!-- 表头 -->
  <rect x="60" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <rect x="100" y="64" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="145" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">nums[i]</text>
  <rect x="190" y="64" width="105" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="242" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">nums[i][i]</text>
  <rect x="295" y="64" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">取反</text>
  <rect x="365" y="64" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">ans(逐步)</text>

  <!-- 行 0 -->
  <rect x="60" y="98" width="40" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="100" y="98" width="90" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"111"</text>
  <rect x="190" y="98" width="105" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="242" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">'1'</text>
  <rect x="295" y="98" width="70" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">'0'</text>
  <rect x="365" y="98" width="110" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="420" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">"0"</text>

  <!-- 行 1 -->
  <rect x="60" y="136" width="40" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="100" y="136" width="90" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"011"</text>
  <rect x="190" y="136" width="105" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="242" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">'1'</text>
  <rect x="295" y="136" width="70" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">'0'</text>
  <rect x="365" y="136" width="110" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="420" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">"00"</text>

  <!-- 行 2 -->
  <rect x="60" y="174" width="40" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="100" y="174" width="90" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"001"</text>
  <rect x="190" y="174" width="105" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="242" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">'1'</text>
  <rect x="295" y="174" width="70" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">'0'</text>
  <rect x="365" y="174" width="110" height="38" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="420" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">"000"</text>

  <!-- 结果框 -->
  <rect x="90" y="234" width="380" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="255" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 "000"——不在 nums 中 ✓</text>
  <text x="280" y="273" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">示例输出 "101" 也合法:任意合法答案均可</text>

  <!-- 底注:示例 1 -->
  <text x="280" y="314" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">示例 1:["01","10"] → 对角线 '0','0' → ans = "11",与示例输出一致</text>
</svg>
