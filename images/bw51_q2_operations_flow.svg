<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">reserve / unreserve 的判定流程</text>

  <!-- reserve 流程 -->
  <rect x="46" y="52" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="121" y="78" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">reserve()</text>
  <path d="M 121 94 L 121 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="121,120 191,152 121,184 51,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="121" y="157" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">freed 空？</text>

  <path d="M 191 152 L 240 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="122" font-size="10.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 121 184 L 121 216" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="206" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="244" y="96" width="276" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="382" y="123" text-anchor="middle" font-size="12" fill="#2f5226" filter="url(#rough2)">弹出堆顶并返回（当前最小编号）</text>

  <rect x="46" y="220" width="276" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="184" y="247" text-anchor="middle" font-size="12" fill="#2f5226" filter="url(#rough2)">返回 smallest++（发出全新编号）</text>

  <!-- unreserve 流程 -->
  <rect x="46" y="296" width="150" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="121" y="322" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">unreserve(x)</text>
  <path d="M 196 317 L 236 317" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="296" width="276" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="378" y="322" text-anchor="middle" font-size="12" fill="#2f5226" filter="url(#rough2)">freed.push(x)：编号 x 回收入小根堆</text>

  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">关键不变量：smallest 之前发过的编号若未在堆中，则一定正被预约；unreserve 保证只回收"当前被预约"的编号</text>
</svg>
