<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：s = "abacaba" 逐间隙判定</text>
  <path d="M 140 44 Q 340 52 540 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="55" y="60" width="45" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="100" y="60" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="150" y="60" width="115" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="265" y="60" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="315" y="60" width="63" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="77" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">i</text>
  <text x="125" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">s[i]</text>
  <text x="207" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#sk)">s[i]−s[i−1]</text>
  <text x="290" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">cur</text>
  <text x="346" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">ans</text>

  <g filter="url(#sk)"><rect x="55" y="92" width="323" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="55" y="124" width="323" height="32" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="55" y="156" width="323" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="55" y="188" width="323" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="55" y="220" width="323" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="55" y="252" width="323" height="32" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="55" y="284" width="323" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>

  <text x="77" y="112" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">0</text>
  <text x="125" y="112" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">a</text>
  <text x="207" y="112" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">—</text>
  <text x="290" y="112" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1</text>
  <text x="346" y="112" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1</text>

  <text x="77" y="144" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1</text>
  <text x="125" y="144" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">b</text>
  <text x="207" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">+1 ✓</text>
  <text x="290" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="346" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>

  <text x="77" y="176" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">2</text>
  <text x="125" y="176" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">a</text>
  <text x="207" y="176" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#sk)">−1 ✗</text>
  <text x="290" y="176" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1</text>
  <text x="346" y="176" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">2</text>

  <text x="77" y="208" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">3</text>
  <text x="125" y="208" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">c</text>
  <text x="207" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">+2 ✗</text>
  <text x="290" y="208" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1</text>
  <text x="346" y="208" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">2</text>

  <text x="77" y="240" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">4</text>
  <text x="125" y="240" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">a</text>
  <text x="207" y="240" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#sk)">−2 ✗</text>
  <text x="290" y="240" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1</text>
  <text x="346" y="240" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">2</text>

  <text x="77" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">5</text>
  <text x="125" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">b</text>
  <text x="207" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">+1 ✓</text>
  <text x="290" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="346" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">2</text>

  <text x="77" y="304" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">6</text>
  <text x="125" y="304" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">a</text>
  <text x="207" y="304" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#sk)">−1 ✗</text>
  <text x="290" y="304" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1</text>
  <text x="346" y="304" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">2</text>

  <g filter="url(#sk)"><rect x="55" y="330" width="323" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="216" y="356" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">最终 ans = 2（最长段 "ab"，出现 2 处）</text>

  <g filter="url(#sk)"><rect x="55" y="386" width="323" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="216" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">cur = 以 s[i] 结尾的最长连续段长</text>
  <text x="216" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">ans = 所有结尾位置 cur 的最大值</text>

  <g filter="url(#sk)"><rect x="415" y="60" width="240" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="535" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">⚠️ 最易错的一步</text>
  <text x="535" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">i = 3 的 'c'：a→c 差 +2</text>
  <text x="535" y="126" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">「跳过字母」不是连续！</text>
  <text x="535" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">该间隙照样把段重置为 1</text>

  <g filter="url(#sk)"><rect x="415" y="166" width="240" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="535" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">极大段划分（共 5 段）</text>
  <g filter="url(#sk)"><rect x="423" y="200" width="40" height="30" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="443" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">ab</text>
  <text x="443" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="467" y="200" width="40" height="30" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="487" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">a</text>
  <text x="487" y="246" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="511" y="200" width="40" height="30" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="531" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">c</text>
  <text x="531" y="246" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="555" y="200" width="40" height="30" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="575" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">ab</text>
  <text x="575" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="599" y="200" width="40" height="30" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="619" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">a</text>
  <text x="619" y="246" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">1</text>
  <text x="535" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = max{2, 1, 1, 2, 1} = 2</text>
  <text x="535" y="304" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">两处 "ab" 只计长度，无需去重</text>

  <g filter="url(#sk)"><rect x="415" y="330" width="240" height="122" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="535" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">示例 2：s = "abcde"</text>
  <text x="535" y="378" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">a→b→c→d→e 全程 +1</text>
  <text x="535" y="400" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">单段直通，cur 一路涨到 5</text>
  <text x="535" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#sk)">ans = 5</text>
</svg>
