<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">负数怎么变成十六进制：补码就是一个无符号数</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第一步 x = num &amp; 0xFFFFFFFF，第二步把 x 每 4 个二进制位切成一个十六进制位</text>

  <text x="280" y="68" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">32 位 = 8 个十六进制位（每位 4 个二进制位），以 num = −1 为例</text>

  <g filter="url(#rough2)">
    <rect x="72" y="78" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="124" y="78" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="176" y="78" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="228" y="78" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="280" y="78" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="332" y="78" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="384" y="78" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="436" y="78" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="20" text-anchor="middle" font-weight="bold" fill="#3a4a66">
    <text x="98" y="107">f</text>
    <text x="150" y="107">f</text>
    <text x="202" y="107">f</text>
    <text x="254" y="107">f</text>
    <text x="306" y="107">f</text>
    <text x="358" y="107">f</text>
    <text x="410" y="107">f</text>
    <text x="462" y="107">f</text>
  </g>

  <g filter="url(#rough2)" font-size="8.5" text-anchor="middle" fill="#888">
    <text x="98" y="134">31–28</text>
    <text x="150" y="134">27–24</text>
    <text x="202" y="134">23–20</text>
    <text x="254" y="134">19–16</text>
    <text x="306" y="134">15–12</text>
    <text x="358" y="134">11–8</text>
    <text x="410" y="134">7–4</text>
    <text x="462" y="134">3–0</text>
  </g>

  <text x="280" y="156" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">−1 的 32 位补码每一位都是 1，因此 8 个十六进制位全是 f</text>

  <rect x="48" y="170" width="230" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="62" y="190" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">num ≥ 0：26 → 0x1a</text>
  <text x="62" y="210" font-size="10" fill="#555" filter="url(#rough2)">x = 26，最低 4 位 1010 = 10</text>
  <text x="62" y="228" font-size="10" fill="#555" filter="url(#rough2)">查表得 'a'，右移 4 位后 x = 1</text>
  <text x="62" y="246" font-size="10" fill="#3a5a30" filter="url(#rough2)">再取 '1'，x 归零即停 → “1a”</text>

  <rect x="292" y="170" width="230" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="306" y="190" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">num 为负：−1 → 0xffffffff</text>
  <text x="306" y="210" font-size="10" fill="#555" filter="url(#rough2)">x = 2³² + (−1) = 4294967295</text>
  <text x="306" y="228" font-size="10" fill="#555" filter="url(#rough2)">= 0xffffffff，最高位必为 1</text>
  <text x="306" y="246" font-size="10" fill="#8a6a20" filter="url(#rough2)">所以负数恰好输出 8 位，不会丢符号</text>

  <path d="M 280 264 L 280 276" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="280" width="474" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="62" y="300" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">一句话：补码把负数搬到 [0, 2³²) 区间，之后按普通无符号数拆 4 位即可</text>
  <text x="62" y="317" font-size="10" fill="#555" filter="url(#rough2)">C++ 用 unsigned int x = num；Python 用 num &amp; 0xFFFFFFFF，两者都等价于模 2³²</text>
</svg>
