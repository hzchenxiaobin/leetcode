<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：碗的两端恰是子数组「最大的两个元素」</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#66778a" filter="url(#sk)">较小端点 i 的搭档唯一：前一个更大 left[i]，或下一个更大 right[i]</text>
  <path d="M 170 58 Q 320 66 470 58" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="195" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#44505c" filter="url(#sk)">nums = [2,5,3,1,4]（示例 1）</text>

  <rect x="110" y="210" width="232" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="332" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#sk)">碗</text>

  <rect x="60" y="268" width="44" height="32" fill="#eef2f6" stroke="#9aa8b5" stroke-width="1.5" filter="url(#sk)"/>
  <rect x="118" y="220" width="44" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#sk)"/>
  <rect x="176" y="252" width="44" height="48" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <rect x="234" y="284" width="44" height="16" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <rect x="292" y="236" width="44" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#sk)"/>

  <text x="82" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#44505c" filter="url(#sk)">2</text>
  <text x="140" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">5</text>
  <text x="198" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88" filter="url(#sk)">3</text>
  <text x="256" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88" filter="url(#sk)">1</text>
  <text x="314" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">4</text>

  <path d="M 52 300 L 348 300" stroke="#6b7a88" stroke-width="1.8" filter="url(#sk)"/>
  <text x="82" y="316" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">0</text>
  <text x="140" y="316" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">1</text>
  <text x="198" y="316" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">2</text>
  <text x="256" y="316" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">3</text>
  <text x="314" y="316" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">4</text>
  <text x="140" y="331" text-anchor="middle" font-size="9.5" fill="#a06a10" filter="url(#sk)">大端</text>
  <text x="314" y="331" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#sk)">小端</text>

  <path d="M 112 236 L 344 236" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="226" y="230" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#sk)">min(两端) = 4</text>

  <path d="M 306 228 Q 230 190 152 216" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="230" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">小端 4 的唯一左搭档 = 前一个更大 5</text>

  <text x="40" y="354" text-anchor="start" font-size="10.5" fill="#44505c" filter="url(#sk)">碗① [3,1,4]：min(3,4)=3 &gt; max(1)=1</text>
  <text x="40" y="374" text-anchor="start" font-size="10.5" fill="#44505c" filter="url(#sk)">碗② [5,3,1,4]：min(5,4)=4 &gt; max(3,1)=3</text>

  <text x="505" y="70" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">配对规则（元素互不相同）</text>

  <rect x="400" y="90" width="56" height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="428" y="109" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">left[i]</text>
  <rect x="482" y="90" width="56" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="510" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#sk)">i</text>
  <rect x="564" y="90" width="56" height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="592" y="109" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">right[i]</text>

  <path d="M 506 88 Q 468 70 436 88" stroke="#66778a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="462" y="64" text-anchor="middle" font-size="9.5" fill="#66778a" filter="url(#sk)">i − left[i] ≥ 2</text>
  <path d="M 514 88 Q 552 70 584 88" stroke="#66778a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="558" y="64" text-anchor="middle" font-size="9.5" fill="#66778a" filter="url(#sk)">right[i] − i ≥ 2</text>
  <text x="428" y="134" text-anchor="middle" font-size="9.5" fill="#7d8ea0" filter="url(#sk)">前一个更大</text>
  <text x="510" y="134" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#sk)">小端</text>
  <text x="592" y="134" text-anchor="middle" font-size="9.5" fill="#7d8ea0" filter="url(#sk)">下一个更大</text>

  <rect x="398" y="152" width="222" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="509" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">等价刻画：碗 = 子数组里</text>
  <text x="509" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">最大的两个元素恰在两端</text>

  <rect x="398" y="210" width="222" height="62" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="509" y="230" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#sk)">小端 i 的搭档唯一：</text>
  <text x="509" y="247" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#sk)">左 = left[i]，右 = right[i]</text>
  <text x="509" y="263" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#sk)">距离 ≥ 2 才够长度 ≥ 3</text>

  <rect x="398" y="284" width="222" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="509" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 合法配对总数</text>
  <text x="509" y="322" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">≤ 2n，碗只有 O(n) 个！</text>

  <rect x="40" y="388" width="580" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="330" y="409" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#sk)">⚠️ 相邻配对（距离 1）长度只有 2：中间为空、条件「空真」，必须排除！</text>
</svg>
