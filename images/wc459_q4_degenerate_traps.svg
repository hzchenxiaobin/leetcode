<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">两次修正：同直线对不算，平行四边形数了两遍</text>

  <!-- ============ 面板①：同直线对 ============ -->
  <rect x="24" y="46" width="190" height="278" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="119" y="70" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">陷阱① 4 点共线</text>

  <!-- 一条直线上的 4 个点 -->
  <path d="M 42,120 L 196,120" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="54" cy="120" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="96" cy="120" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="140" cy="120" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="184" cy="120" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="110" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="92" y="110" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="136" y="110" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="180" y="110" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>
  <!-- AB 与 CD 高亮 -->
  <path d="M 54,120 L 96,120" stroke="#b85450" stroke-width="3.4" filter="url(#rough2)"/>
  <path d="M 140,120 L 184,120" stroke="#b85450" stroke-width="3.4" filter="url(#rough2)"/>

  <text x="119" y="156" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">AB 与 CD 同斜率</text>
  <text x="119" y="174" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">却在同一条直线上</text>
  <text x="119" y="198" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 4 点共线，不是四边形</text>
  <text x="119" y="222" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">含 B、C 共端点的对也一样坏</text>

  <rect x="36" y="240" width="166" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">修正：按「直线」再分一层桶</text>
  <text x="119" y="280" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">T −= Σ_L C(c_L, 2)</text>
  <text x="119" y="298" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">c_L = 落在直线 L 上的线段数</text>

  <!-- ============ 面板②：平行四边形双计数 ============ -->
  <rect x="225" y="46" width="190" height="278" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">陷阱② 平行四边形</text>

  <!-- 平行四边形 P1(252,168) P2(330,142) P3(378,196) P4(300,222) -->
  <polygon points="252,168 330,142 378,196 300,222" fill="#e8f0fe" opacity="0.6" filter="url(#rough2)"/>
  <path d="M 252,168 L 330,142" stroke="#d6a040" stroke-width="3.2" filter="url(#rough2)"/>
  <path d="M 300,222 L 378,196" stroke="#d6a040" stroke-width="3.2" filter="url(#rough2)"/>
  <path d="M 330,142 L 378,196" stroke="#4a7a3a" stroke-width="3.2" filter="url(#rough2)"/>
  <path d="M 252,168 L 300,222" stroke="#4a7a3a" stroke-width="3.2" filter="url(#rough2)"/>
  <circle cx="252" cy="168" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="330" cy="142" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="378" cy="196" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="300" cy="222" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="164" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="330" y="132" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="384" y="196" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="294" y="238" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>

  <text x="320" y="262" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">橙：AB ∥ CD，绿：AD ∥ BC</text>
  <text x="320" y="284" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">✓ 是梯形，但 T 数了 2 次</text>

  <rect x="237" y="296" width="166" height="20" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="311" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">矩形、菱形、正方形同理</text>

  <!-- ============ 面板③：同中点同斜率 ============ -->
  <rect x="426" y="46" width="190" height="278" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="521" y="70" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">陷阱③ 假平行四边形</text>

  <!-- 同一直线上对称的 4 点，两条共中点线段 -->
  <path d="M 444,130 L 598,130" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="452" cy="130" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="486" cy="130" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="556" cy="130" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="590" cy="130" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 452,130 L 590,130" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <path d="M 486,130 L 556,130" stroke="#446688" stroke-width="3.4" filter="url(#rough2)"/>
  <circle cx="521" cy="130" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="521" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">共中点 M</text>

  <text x="521" y="166" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">两条线段中点相同</text>
  <text x="521" y="184" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">但斜率也相同（共线）</text>
  <text x="521" y="208" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 退化，不是平行四边形</text>

  <rect x="438" y="240" width="166" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="521" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">修正：中点桶内按斜率再扣</text>
  <text x="521" y="280" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">P −= Σ C(c, 2)</text>
  <text x="521" y="298" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">共中点且同斜率 ⟹ 必共线</text>

  <!-- 底部公式 -->
  <rect x="24" y="340" width="592" height="112" rx="10" fill="#f5f5f5" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="366" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">答案 = T − P</text>
  <text x="320" y="392" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">T = Σ_s C(m_s,2) − Σ_L C(c_L,2)：同斜率异直线的线段对</text>
  <text x="320" y="416" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">P = Σ_M C(t_M,2) − Σ_(M,s) C(c,2)：共中点异斜率的线段对</text>
  <text x="320" y="440" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">P 恰好等于平行四边形个数（对角线互相平分），把多数的那一次扣回来</text>
</svg>
