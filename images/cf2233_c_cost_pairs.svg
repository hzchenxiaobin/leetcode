<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto">
      <path d="M0,0 L7,3.4 L0,6.8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa" filter="url(#rough2)"/>

  <text x="390" y="34" text-anchor="middle" font-size="21" fill="#333" filter="url(#rough2)">代价的三层等价刻画：cost(T) = 2 × 匹配对数</text>

  <rect x="40" y="50" width="700" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="82" font-size="16.5" fill="#2f4a5f" filter="url(#rough2)">① cost 等于最长合法子序列长度，而它 = 2 × 最大匹配对数 p(T)</text>

  <path d="M390,102 L390,124" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="40" y="128" width="700" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="160" font-size="16.5" fill="#33552a" filter="url(#rough2)">② p(T) = min 切分 j （ 前缀里的 ( 个数 + 后缀里的 ) 个数 ）</text>

  <path d="M390,180 L390,202" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="40" y="206" width="700" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="238" font-size="16.5" fill="#8a6420" filter="url(#rough2)">③ p(T) = |T| − L(T)，L(T) = 最长 “若干 ) 再接若干 (” 子序列长度</text>

  <rect x="40" y="276" width="700" height="146" rx="12" fill="#fafafa" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="62" y="304" font-size="15.5" fill="#333" filter="url(#rough2)">例：T = ( ) ) ( ，|T| = 4；其中最长 “)))(((” 形子序列取后三个字符</text>

  <rect x="70" y="316" width="40" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="344" text-anchor="middle" font-size="22" fill="#b85450" filter="url(#rough2)">(</text>
  <rect x="116" y="316" width="40" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="136" y="344" text-anchor="middle" font-size="22" fill="#33552a" filter="url(#rough2)">)</text>
  <rect x="162" y="316" width="40" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="344" text-anchor="middle" font-size="22" fill="#33552a" filter="url(#rough2)">)</text>
  <rect x="208" y="316" width="40" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="228" y="344" text-anchor="middle" font-size="22" fill="#33552a" filter="url(#rough2)">(</text>

  <text x="270" y="330" font-size="15.5" fill="#33552a" filter="url(#rough2)">绿色三格 = ) ) ( ，长度 L = 3</text>
  <text x="270" y="356" font-size="15.5" fill="#b85450" filter="url(#rough2)">红格必须排除：它在 ( 之前，无法进入 ) 段</text>
  <text x="62" y="398" font-size="16.5" fill="#b85450" filter="url(#rough2)">p = 4 − 3 = 1，cost = 2；穷举所有合法子序列也只能得到 1 对</text>
</svg>
