<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">示例演算：nums = [111, 212, 223, 314, 325, 336, 347]</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888">7 个节点里有 3 个是内部节点，只有 4 个叶子把完整路径和交给答案</text>

  <g stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 170 108 L 105 138"/>
    <path d="M 170 108 L 235 138"/>
    <path d="M 105 178 L 68 216"/>
    <path d="M 105 178 L 140 216"/>
    <path d="M 235 178 L 200 216"/>
    <path d="M 235 178 L 272 216"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <circle cx="170" cy="88" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="170" y="93" fill="#3a4a66">1</text>
    <circle cx="105" cy="158" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="105" y="163" fill="#3a5a30">2</text>
    <circle cx="235" cy="158" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="235" y="163" fill="#3a5a30">3</text>
    <circle cx="68" cy="236" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="68" y="241" fill="#8a6a20">4</text>
    <circle cx="140" cy="236" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="140" y="241" fill="#8a6a20">5</text>
    <circle cx="200" cy="236" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="241" fill="#8a6a20">6</text>
    <circle cx="272" cy="236" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="272" y="241" fill="#8a6a20">7</text>
  </g>

  <g filter="url(#rough2)" font-size="8.5" fill="#888" text-anchor="middle">
    <text x="170" y="66">(1,1)</text>
    <text x="105" y="130">(2,1)</text>
    <text x="235" y="130">(2,2)</text>
    <text x="68" y="272">(3,1)</text>
    <text x="140" y="272">(3,2)</text>
    <text x="208" y="272">(3,3)</text>
    <text x="280" y="272">(3,4)</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#b85450" text-anchor="middle" font-weight="bold">
    <text x="68" y="296">7</text>
    <text x="140" y="296">8</text>
    <text x="200" y="296">10</text>
    <text x="272" y="296">11</text>
  </g>
  <text x="170" y="316" text-anchor="middle" font-size="9.5" fill="#b85450">叶子处的完整路径和</text>

  <!-- 右侧表 -->
  <text x="330" y="76" font-size="10" fill="#666">根到叶路径及其和</text>
  <g filter="url(#rough2)" font-size="10.5">
    <rect x="330" y="86" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="344" y="103" fill="#3a4a66">1 → 2 → 4</text>
    <text x="516" y="103" fill="#3a4a66" text-anchor="end">= 7</text>

    <rect x="330" y="118" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="344" y="135" fill="#3a4a66">1 → 2 → 5</text>
    <text x="516" y="135" fill="#3a4a66" text-anchor="end">= 8</text>

    <rect x="330" y="150" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="344" y="167" fill="#3a4a66">1 → 3 → 6</text>
    <text x="516" y="167" fill="#3a4a66" text-anchor="end">= 10</text>

    <rect x="330" y="182" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="344" y="199" fill="#3a4a66">1 → 3 → 7</text>
    <text x="516" y="199" fill="#3a4a66" text-anchor="end">= 11</text>

    <rect x="330" y="218" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <text x="344" y="237" fill="#8a3a36" font-weight="bold">合计</text>
    <text x="516" y="237" fill="#8a3a36" text-anchor="end" font-weight="bold">36</text>
  </g>

  <rect x="40" y="338" width="490" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="358" font-size="10" fill="#3a5a30">递推出的 pre（根到该节点的路径和）：</text>
  <text x="54" y="376" font-size="10" fill="#555">(1,1)=1 ｜ (2,1)=3 ｜ (2,2)=4 ｜ (3,1)=7 ｜ (3,2)=8 ｜ (3,3)=10 ｜ (3,4)=11</text>
  <text x="54" y="392" font-size="10" fill="#555">节点 2、3 的 pre 不累加（非叶子）；7 + 8 + 10 + 11 = 36</text>
</svg>
