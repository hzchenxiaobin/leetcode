<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold"
        filter="url(#rough2)">示例 2 演算：nums = [4, 4, 2, 1]</text>

  <!-- 步骤 1：freq -->
  <text x="40" y="56" font-size="13" fill="#446688" font-weight="bold"
        filter="url(#rough2)">① 值域计数 freq</text>
  <g filter="url(#rough2)">
    <rect x="60" y="66" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="170" y="66" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="66" width="96" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="108" y="85" text-anchor="middle" font-size="12" fill="#333">值 1 × 1</text>
    <text x="218" y="85" text-anchor="middle" font-size="12" fill="#333">值 2 × 1</text>
    <text x="328" y="85" text-anchor="middle" font-size="12" fill="#333">值 4 × 2</text>
  </g>

  <!-- 步骤 2：倒序容斥表 -->
  <text x="40" y="124" font-size="13" fill="#d6a040" font-weight="bold"
        filter="url(#rough2)">② d 从大到小：g[d] = C(m_d, 2)，再减去倍数处</text>
  <g filter="url(#rough2)">
    <!-- 表头 -->
    <rect x="40" y="134" width="72" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="112" y="134" width="96" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="208" y="134" width="96" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="304" y="134" width="96" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="134" width="80" height="24" fill="#eeeeee" stroke="#999" stroke-width="1" rx="4"/>
    <text x="76" y="150" text-anchor="middle" font-size="11" fill="#555">d</text>
    <text x="160" y="150" text-anchor="middle" font-size="11" fill="#555">m_d 倍数元素</text>
    <text x="256" y="150" text-anchor="middle" font-size="11" fill="#555">g[d]</text>
    <text x="352" y="150" text-anchor="middle" font-size="11" fill="#555">减 exact[kd]</text>
    <text x="440" y="150" text-anchor="middle" font-size="11" fill="#555">exact[d]</text>
    <!-- 行 d=4 -->
    <rect x="40" y="158" width="72" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="112" y="158" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="208" y="158" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="304" y="158" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="400" y="158" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="76" y="174" text-anchor="middle" font-size="11" fill="#d6a040">4</text>
    <text x="160" y="174" text-anchor="middle" font-size="11" fill="#333">2 (4,4)</text>
    <text x="256" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="352" y="174" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="440" y="174" text-anchor="middle" font-size="11" fill="#d6a040">1</text>
    <!-- 行 d=3 -->
    <rect x="40" y="182" width="72" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="112" y="182" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="208" y="182" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="304" y="182" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="400" y="182" width="80" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="76" y="198" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="160" y="198" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="256" y="198" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="352" y="198" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="440" y="198" text-anchor="middle" font-size="11" fill="#333">0</text>
    <!-- 行 d=2 -->
    <rect x="40" y="206" width="72" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="112" y="206" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="208" y="206" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="304" y="206" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="400" y="206" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="76" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
    <text x="160" y="222" text-anchor="middle" font-size="11" fill="#333">3 (2,4,4)</text>
    <text x="256" y="222" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="352" y="222" text-anchor="middle" font-size="11" fill="#333">−exact[4] = −1</text>
    <text x="440" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
    <!-- 行 d=1 -->
    <rect x="40" y="230" width="72" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="112" y="230" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="208" y="230" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="304" y="230" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="400" y="230" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="76" y="246" text-anchor="middle" font-size="11" fill="#446688">1</text>
    <text x="160" y="246" text-anchor="middle" font-size="11" fill="#333">4 (全部)</text>
    <text x="256" y="246" text-anchor="middle" font-size="11" fill="#333">6</text>
    <text x="352" y="246" text-anchor="middle" font-size="11" fill="#333">−(2+0+1) = −3</text>
    <text x="440" y="246" text-anchor="middle" font-size="11" fill="#446688">3</text>
  </g>

  <!-- 步骤 3：前缀和 + 查询 -->
  <text x="40" y="284" font-size="13" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">③ 前缀和 + 二分：queries = [5, 3, 1, 0]</text>
  <g filter="url(#rough2)">
    <rect x="60" y="296" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="180" y="296" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="296" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="115" y="315" text-anchor="middle" font-size="11" fill="#333">pre[1] = 3</text>
    <text x="235" y="315" text-anchor="middle" font-size="11" fill="#333">pre[2] = 5</text>
    <text x="355" y="315" text-anchor="middle" font-size="11" fill="#333">pre[4] = 6</text>
    <text x="452" y="315" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→</text>
  </g>

  <!-- 结论框 -->
  <rect x="60" y="344" width="400" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">gcdPairs 升序 = [1, 1, 1, 2, 2, 4]</text>
  <text x="260" y="380" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">answer = [4, 2, 1, 1]</text>
</svg>
