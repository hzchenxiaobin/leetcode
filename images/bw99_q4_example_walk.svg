<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 走查：edges=[[0,1],[1,2],[1,3],[4,2]]，k=3</text>

  <!-- 树 -->
  <line x1="120" y1="80" x2="240" y2="80" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="240" y1="80" x2="320" y2="140" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="240" y1="80" x2="160" y2="140" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="320" y1="140" x2="400" y2="200" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="120" cy="80" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="85" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">0</text>
  <circle cx="240" cy="80" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="85" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">1</text>
  <circle cx="320" cy="140" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="145" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="160" cy="140" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="145" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="400" cy="200" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="205" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">4</text>

  <text x="68" y="60" font-size="11" fill="#888" filter="url(#rough2)">猜测：</text>
  <text x="60" y="76" font-size="11" fill="#888" filter="url(#rough2)">(1,3)(0,1)</text>
  <text x="60" y="92" font-size="11" fill="#888" filter="url(#rough2)">(1,0)(2,4)</text>

  <!-- 换根表 -->
  <text x="380" y="76" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">根为 0 时：p[1]=0,p[2]=1,p[3]=1,p[4]=2</text>
  <text x="380" y="96" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">命中 (1,3)(0,1)(2,4) → cnt₀ = 3 ✓</text>

  <!-- 表格 -->
  <g filter="url(#rough2)">
    <rect x="60" y="250" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="270" text-anchor="middle" font-size="13" fill="#2f4a66">根 r</text>
    <rect x="124" y="250" width="60" height="30" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5"/>
    <text x="154" y="270" text-anchor="middle" font-size="13" fill="#2f4a66">0</text>
    <rect x="188" y="250" width="60" height="30" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5"/>
    <text x="218" y="270" text-anchor="middle" font-size="13" fill="#2f4a66">1</text>
    <rect x="252" y="250" width="60" height="30" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5"/>
    <text x="282" y="270" text-anchor="middle" font-size="13" fill="#2f4a66">2</text>
    <rect x="316" y="250" width="60" height="30" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5"/>
    <text x="346" y="270" text-anchor="middle" font-size="13" fill="#2f4a66">3</text>
    <rect x="380" y="250" width="60" height="30" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5"/>
    <text x="410" y="270" text-anchor="middle" font-size="13" fill="#2f4a66">4</text>

    <rect x="60" y="284" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="304" text-anchor="middle" font-size="12" fill="#2f4a66">命中 c</text>
    <rect x="124" y="284" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="154" y="304" text-anchor="middle" font-size="13" fill="#2f5527">3</text>
    <rect x="188" y="284" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="218" y="304" text-anchor="middle" font-size="13" fill="#2f5527">3</text>
    <rect x="252" y="284" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="282" y="304" text-anchor="middle" font-size="13" fill="#2f5527">3</text>
    <rect x="316" y="284" width="60" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="346" y="304" text-anchor="middle" font-size="13" fill="#8c3a36">2</text>
    <rect x="380" y="284" width="60" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="410" y="304" text-anchor="middle" font-size="13" fill="#8c3a36">2</text>

    <rect x="60" y="318" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="338" text-anchor="middle" font-size="12" fill="#2f4a66">≥ k=3?</text>
    <rect x="124" y="318" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="154" y="338" text-anchor="middle" font-size="13" fill="#2f5527">✓</text>
    <rect x="188" y="318" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="218" y="338" text-anchor="middle" font-size="13" fill="#2f5527">✓</text>
    <rect x="252" y="318" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="282" y="338" text-anchor="middle" font-size="13" fill="#2f5527">✓</text>
    <rect x="316" y="318" width="60" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="346" y="338" text-anchor="middle" font-size="13" fill="#8c3a36">✗</text>
    <rect x="380" y="318" width="60" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="410" y="338" text-anchor="middle" font-size="13" fill="#8c3a36">✗</text>
  </g>

  <text x="462" y="338" font-size="14" fill="#8c3a36" filter="url(#rough2)">→ 3</text>
</svg>
