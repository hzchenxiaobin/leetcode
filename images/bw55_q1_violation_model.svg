<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：第一个断层 k，候选只有两个</text>

  <!-- 数组元素 -->
  <text x="60" y="86" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">原数组：</text>
  <g filter="url(#rough2)">
    <rect x="120" y="66" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="182" y="66" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="244" y="66" width="58" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="306" y="66" width="58" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="368" y="66" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="430" y="66" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="149" y="90">1</text><text x="211" y="90">2</text>
    <text x="273" y="90">10</text><text x="335" y="90">5</text>
    <text x="397" y="90">7</text><text x="459" y="90">…</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="149" y="116">0</text><text x="211" y="116">1</text>
    <text x="273" y="116">k</text><text x="335" y="116">k+1</text>
    <text x="397" y="116">k+2</text><text x="459" y="116">下标</text>
  </g>
  <!-- 断层标记 -->
  <path d="M 273 132 C 285 146 315 146 327 132" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">断层：nums[k] ≥ nums[k+1]</text>

  <!-- 两个候选 -->
  <g filter="url(#rough2)">
    <rect x="110" y="196" width="150" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
    <rect x="300" y="196" width="150" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <text x="185" y="220" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">候选一：删 nums[k]</text>
  <text x="185" y="240" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">拼接条件 nums[k−1] &lt; nums[k+1]</text>
  <text x="375" y="220" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">候选二：删 nums[k+1]</text>
  <text x="375" y="240" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">拼接条件 nums[k] &lt; nums[k+2]</text>
  <path d="M 262 160 L 200 192" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 338 160 L 360 192" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 其余位置删除无效 -->
  <rect x="60" y="286" width="440" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">删任何 j ∉ {k, k+1}：nums[k] 与 nums[k+1] 仍相邻，</text>
  <text x="280" y="332" text-anchor="middle" font-size="12.5" fill="#2f5226" filter="url(#rough2)">断层原样保留 → 必然失败，无需枚举 n 个位置。</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（若整条数组无断层，本身已严格递增，直接返回 true）</text>
</svg>
