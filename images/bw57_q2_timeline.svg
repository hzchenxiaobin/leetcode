<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 时间线：times = [[1,4],[2,3],[4,6]]，target = 1</text>

  <!-- 时间轴 -->
  <line x1="60" y1="270" x2="520" y2="270" stroke="#999" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="12" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="90" y="292">t=1</text>
    <text x="160" y="292">t=2</text>
    <text x="230" y="292">t=3</text>
    <text x="300" y="292">t=4</text>
    <text x="440" y="292">t=6</text>
  </g>
  <g stroke-dasharray="4 4" stroke="#ccc" stroke-width="1" filter="url(#rough2)">
    <line x1="90" y1="60" x2="90" y2="270"/>
    <line x1="160" y1="60" x2="160" y2="270"/>
    <line x1="230" y1="60" x2="230" y2="270"/>
    <line x1="300" y1="60" x2="300" y2="270"/>
    <line x1="440" y1="60" x2="440" y2="270"/>
  </g>

  <!-- 朋友 0：1→4，椅 0 -->
  <rect x="90" y="70" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="195" y="92" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">朋友 0 占椅 0（t=1 入，t=4 出）</text>

  <!-- 朋友 1：2→3，椅 1 -->
  <rect x="160" y="116" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="195" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">朋友 1 椅 1</text>
  <path d="M 205 116 L 250 116" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="120" font-size="11" fill="#b85450" filter="url(#rough2)">t=3 释放椅 1</text>

  <!-- 朋友 2：4→6，椅 0（复用） -->
  <rect x="300" y="162" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="370" y="184" text-anchor="middle" font-size="12" fill="#2f5226" filter="url(#rough2)">朋友 2 复用椅 0（t=4）</text>

  <!-- 同时刻交接标注 -->
  <ellipse cx="300" cy="222" rx="118" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="228" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">t=4：离开 ≤ 到达，先释放后入座（用 ≤ 不是 &lt;）</text>
  <path d="M 300 244 L 300 262" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 答案标注 -->
  <rect x="60" y="300" width="200" height="22" fill="none" stroke="none"/>
  <text x="120" y="318" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">targetArr = 2 → 返回椅子 1</text>
</svg>
