<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 368"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="368" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">奇偶分治：为什么「奇数一半 + 偶数一半」一定合法</text>
  <rect x="60" y="62" width="250" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="88.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">左半：全奇数 2x−1</text>
  <rect x="350" y="62" width="250" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475.0" y="88.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">右半：全偶数 2x</text>
  <text x="60" y="132" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">三类候选，逐一排除：</text>
  <rect x="60" y="150" width="250" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="173.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">三个都在奇数半边 → 归约回子问题</text>
  <rect x="60" y="198" width="250" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="221.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">三个都在偶数半边 → 归约回子问题</text>
  <rect x="60" y="246" width="250" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="269.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">混搭 → 奇偶性不允许</text>
  <text x="350" y="170" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">若 2·a[k] = a[i] + a[j]：</text>
  <text x="350" y="198" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">左边是偶数</text>
  <text x="350" y="222" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">右边一奇一偶 → 和为奇数</text>
  <text x="350" y="246" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">偶数 ≠ 奇数 → 矛盾</text>
  <text x="330" y="312" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">所以只要两个子数组各自漂亮，拼起来就漂亮</text>
  <text x="330" y="348" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">注意：这里「漂亮」指数组本身满足条件，与它是否取满 [1,n] 无关</text>
</svg>
