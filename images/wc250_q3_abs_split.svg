<svg xmlns="http://www.w3.org/2000/svg" width="620" height="540" viewBox="0 0 620 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="620" height="540" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：拆掉绝对值 —— 左半边交给前缀 max，右半边交给后缀 max</text>
  <path d="M 130 40 Q 310 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="310" y="66" text-anchor="middle" font-size="12" fill="#666">转移 dp[r][c] = points[r][c] + max over c′ of ( dp[r−1][c′] − |c−c′| )，贵就贵在这个 max</text>

  <text x="160" y="89" text-anchor="middle" font-size="10.5" fill="#888">c′=0</text>
  <text x="235" y="89" text-anchor="middle" font-size="10.5" fill="#888">c′=1</text>
  <text x="310" y="89" text-anchor="middle" font-size="10.5" fill="#888">c′=2</text>
  <text x="385" y="89" text-anchor="middle" font-size="10.5" fill="#888">c′=3</text>
  <text x="460" y="89" text-anchor="middle" font-size="10.5" fill="#888">c′=4</text>

  <text x="34" y="114" font-size="12" fill="#2b5d8e" font-weight="bold">第 r−1 行 dp：</text>
  <g filter="url(#sk)">
    <rect x="130" y="94" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="205" y="94" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="280" y="94" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="355" y="94" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="430" y="94" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="160" y="116" text-anchor="middle" font-size="13" fill="#2b5d8e" font-weight="bold">3</text>
  <text x="235" y="116" text-anchor="middle" font-size="13" fill="#2b5d8e" font-weight="bold">7</text>
  <text x="310" y="116" text-anchor="middle" font-size="13" fill="#2b5d8e" font-weight="bold">2</text>
  <text x="385" y="116" text-anchor="middle" font-size="13" fill="#2b5d8e" font-weight="bold">9</text>
  <text x="460" y="116" text-anchor="middle" font-size="13" fill="#2b5d8e" font-weight="bold">4</text>

  <g filter="url(#sk)" fill="none" stroke="#446688" stroke-width="1.5">
    <path d="M 166 132 Q 190 162 292 184" marker-end="url(#arb)"/>
    <path d="M 238 132 Q 252 164 303 184" marker-end="url(#arb)"/>
    <path d="M 310 132 Q 310 160 310 182" marker-end="url(#arb)"/>
  </g>
  <g filter="url(#sk)" fill="none" stroke="#d6a040" stroke-width="1.5">
    <path d="M 384 132 Q 362 162 322 184" marker-end="url(#aro)"/>
    <path d="M 456 132 Q 424 162 330 184" marker-end="url(#aro)"/>
  </g>

  <text x="34" y="212" font-size="12" fill="#b85450" font-weight="bold">第 r 行选列 c=2：</text>
  <g filter="url(#sk)">
    <rect x="130" y="194" width="60" height="34" rx="4" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="205" y="194" width="60" height="34" rx="4" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="280" y="194" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="355" y="194" width="60" height="34" rx="4" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="430" y="194" width="60" height="34" rx="4" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
  </g>
  <text x="160" y="216" text-anchor="middle" font-size="12" fill="#999">·</text>
  <text x="235" y="216" text-anchor="middle" font-size="12" fill="#999">·</text>
  <text x="310" y="216" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">★</text>
  <text x="385" y="216" text-anchor="middle" font-size="12" fill="#999">·</text>
  <text x="460" y="216" text-anchor="middle" font-size="12" fill="#999">·</text>
  <text x="506" y="152" font-size="10.5" fill="#446688" font-weight="bold">蓝：左源 c′≤2</text>
  <text x="506" y="168" font-size="10.5" fill="#d6a040" font-weight="bold">橙：右源 c′≥2</text>

  <g filter="url(#sk)">
    <rect x="30" y="248" width="276" height="132" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="168" y="272" text-anchor="middle" font-size="12.5" fill="#2b5d8e" font-weight="bold">① c′ ≤ c（左源）：|c−c′| = c − c′</text>
  <text x="46" y="296" font-size="11.5" fill="#2b5d8e" font-family="monospace">dp[c′] − (c−c′) = (dp[c′]+c′) − c</text>
  <text x="46" y="318" font-size="11.5" fill="#2b5d8e">括号里只与 c′ 有关，与当前 c 解耦</text>
  <text x="46" y="342" font-size="11.5" fill="#2b5d8e" font-family="monospace" font-weight="bold">L[c] = max over c′≤c of (dp[c′]+c′)</text>
  <text x="46" y="364" font-size="11" fill="#2b5d8e">← 从左到右一趟前缀 max 递推</text>

  <g filter="url(#sk)">
    <rect x="314" y="248" width="276" height="132" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="452" y="272" text-anchor="middle" font-size="12.5" fill="#8f6b1f" font-weight="bold">② c′ ≥ c（右源）：|c−c′| = c′ − c</text>
  <text x="330" y="296" font-size="11.5" fill="#8f6b1f" font-family="monospace">dp[c′] − (c′−c) = (dp[c′]−c′) + c</text>
  <text x="330" y="318" font-size="11.5" fill="#8f6b1f">括号里同样只与 c′ 有关</text>
  <text x="330" y="342" font-size="11.5" fill="#8f6b1f" font-family="monospace" font-weight="bold">R[c] = max over c′≥c of (dp[c′]−c′)</text>
  <text x="330" y="364" font-size="11" fill="#8f6b1f">← 从右到左一趟后缀 max 递推</text>

  <g filter="url(#sk)">
    <rect x="30" y="398" width="560" height="66" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="310" y="422" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-family="monospace" font-weight="bold">dp[r][c] = points[r][c] + max( L[c] − c , R[c] + c )</text>
  <text x="310" y="448" text-anchor="middle" font-size="11.5" fill="#2f5d2f">每行先花两趟 O(n) 把 L、R 算好，之后每个 c 的转移 O(1)：行转移 O(n²) → O(n)</text>

  <g filter="url(#sk)">
    <rect x="30" y="480" width="560" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="310" y="506" text-anchor="middle" font-size="11.5" fill="#b85450">注：c′ = c 同时落在两个半区（两式都退化为 dp[c] 本身、代价 0）——max 取并集恰好不重复计费</text>
</svg>
