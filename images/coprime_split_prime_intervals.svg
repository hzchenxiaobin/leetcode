<svg xmlns="http://www.w3.org/2000/svg" width="640" height="445" viewBox="0 0 640 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="127" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="445" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">质数 = 封锁带：被压住的剪刀位全部无效</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">分割 i 无效 ⟺ 存在质数 p：first[p] ≤ i &lt; last[p]（剪刀严格落在封锁带内部）</text>

  <!-- dashed cut lines (painted first, kept light) -->
  <g filter="url(#sk)" stroke="#c8c8c8" stroke-width="1.3" stroke-dasharray="5,5">
    <path d="M 212 66 L 212 322"/>
    <path d="M 274 66 L 274 322"/>
    <path d="M 336 66 L 336 322"/>
    <path d="M 398 66 L 398 322"/>
    <path d="M 460 66 L 460 322"/>
  </g>
  <g font-size="13" fill="#666666" text-anchor="middle" filter="url(#sk)">
    <text x="212" y="62">✂</text>
    <text x="274" y="62">✂</text>
    <text x="336" y="62">✂</text>
    <text x="398" y="62">✂</text>
    <text x="460" y="62">✂</text>
  </g>

  <!-- array cells -->
  <g filter="url(#sk)">
    <rect x="150" y="68" width="62" height="44" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="212" y="68" width="62" height="44" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="274" y="68" width="62" height="44" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="336" y="68" width="62" height="44" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="398" y="68" width="62" height="44" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="460" y="68" width="62" height="44" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="181" y="96">4</text>
    <text x="243" y="96">7</text>
    <text x="305" y="96">8</text>
    <text x="367" y="96">15</text>
    <text x="429" y="96">3</text>
    <text x="491" y="96">5</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#7a7a7a" filter="url(#sk)">
    <text x="181" y="128">0</text>
    <text x="243" y="128">1</text>
    <text x="305" y="128">2</text>
    <text x="367" y="128">3</text>
    <text x="429" y="128">4</text>
    <text x="491" y="128">5</text>
    <text x="142" y="128" font-style="italic">下标</text>
    <text x="181" y="146">{2}</text>
    <text x="243" y="146">{7}</text>
    <text x="305" y="146">{2}</text>
    <text x="367" y="146">{3,5}</text>
    <text x="429" y="146">{3}</text>
    <text x="491" y="146">{5}</text>
    <text x="142" y="146" font-style="italic">质因数</text>
  </g>

  <!-- prime coverage bars -->
  <g filter="url(#sk)">
    <rect x="155" y="176" width="176" height="24" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="217" y="212" width="52" height="24" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="341" y="248" width="114" height="24" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="341" y="284" width="176" height="24" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g font-size="11" font-weight="bold" text-anchor="end" filter="url(#sk)">
    <text x="148" y="193" fill="#4a8edb">质数 2 [0,2]</text>
    <text x="148" y="229" fill="#4a8e4a">质数 7 [1,1]</text>
    <text x="148" y="265" fill="#d6a040">质数 3 [3,4]</text>
    <text x="148" y="301" fill="#b85450">质数 5 [3,5]</text>
  </g>
  <text x="278" y="229" font-size="10.5" fill="#4a8e4a" filter="url(#sk)">只占一格，不封锁</text>

  <!-- verdicts -->
  <g font-size="12" text-anchor="middle" filter="url(#sk)">
    <text x="212" y="342" fill="#b85450">i=0 ✗</text>
    <text x="274" y="342" fill="#b85450">i=1 ✗</text>
    <text x="336" y="342" fill="#4a8e4a" font-size="14" font-weight="bold">i=2 ✓</text>
    <text x="398" y="342" fill="#b85450">i=3 ✗</text>
    <text x="460" y="342" fill="#b85450">i=4 ✗</text>
  </g>

  <!-- bottom annotation -->
  <g filter="url(#sk)">
    <rect x="60" y="362" width="520" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="320" y="388" font-size="12.5" fill="#6b5a1e">分割 i 无效 ⟺ 剪刀严格落在某条封锁带内部：first[p] ≤ i &lt; last[p]</text>
    <text x="320" y="412" font-size="12.5" fill="#6b5a1e">仅 i=2 幸存：前缀质数 {2,7} ∩ 后缀质数 {3,5} = ∅ → gcd(224,225)=1，答案 2</text>
  </g>
</svg>
