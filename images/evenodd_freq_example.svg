<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="139" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：答案可能为负！</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- example A -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="270" height="170" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="175" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">s = "abcabcab"</text>
  <g font-size="11.5" fill="#444" font-family="monospace">
    <text x="60" y="108">a:3(奇)  b:3(奇)  c:2(偶)</text>
    <text x="60" y="130" fill="#9c6d14">maxOdd = 3 （a 或 b）</text>
    <text x="60" y="150" fill="#2b4a6e">minEven = 2 （c）</text>
    <text x="60" y="180" fill="#2e5e22" font-weight="bold">diff = 3 − 2 = 1</text>
    <text x="60" y="206" fill="#888">偶频字符与奇频字符不同 ✓</text>
  </g>

  <!-- example B -->
  <g filter="url(#sk)">
    <rect x="330" y="62" width="270" height="170" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="465" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" font-family="monospace">s = "aabbc"</text>
  <g font-size="11.5" fill="#444" font-family="monospace">
    <text x="350" y="108">a:2(偶)  b:2(偶)  c:1(奇)</text>
    <text x="350" y="130" fill="#9c6d14">maxOdd = 1 （c）</text>
    <text x="350" y="150" fill="#2b4a6e">minEven = 2 （a 或 b）</text>
    <text x="350" y="180" fill="#b85450" font-weight="bold">diff = 1 − 2 = −1</text>
    <text x="350" y="206" fill="#888">不能加绝对值 / 不能特判 0！</text>
  </g>

  <!-- two pitfalls -->
  <g filter="url(#sk)">
    <rect x="40" y="256" width="280" height="110" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="180" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">坑 1：频次 0 必须跳过</text>
  <g font-size="11.5" fill="#444" font-family="monospace">
    <text x="60" y="302">d~z 均未出现，freq = 0</text>
    <text x="60" y="320">0 是偶数 → 若不跳过，minEven 恒为 0</text>
    <text x="60" y="344" fill="#b85450" font-weight="bold">min_even 只在 f &gt; 0 的偶频里取</text>
  </g>

  <g filter="url(#sk)">
    <rect x="330" y="256" width="280" height="110" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="470" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">坑 2：a₁ ≠ a₂ 自动成立</text>
  <g font-size="11.5" fill="#444">
    <text x="350" y="302">同一字符频次唯一，</text>
    <text x="350" y="320">不可能既是奇数又是偶数</text>
    <text x="350" y="344" fill="#2e5e22">奇频候选集 ∩ 偶频候选集 = ∅</text>
  </g>
</svg>
