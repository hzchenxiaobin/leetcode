<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,−3,−1,5,−4]，k = 2</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">排序后从最负的开始翻，翻完 k 就用尽</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <text x="30.0" y="72.0" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">排序后 nums</text>
  <rect x="30" y="82" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="58.0" y="105.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-4</text>
  <rect x="92" y="82" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120.0" y="105.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-3</text>
  <rect x="154" y="82" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="182.0" y="105.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-1</text>
  <rect x="216" y="82" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="244.0" y="105.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="278" y="82" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="306.0" y="105.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <path d="M 30.0 140.0 L 340.0 140.0" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="30.0" y="162.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">第 1 次：翻 −4（最负）</text>
  <rect x="30" y="172" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="58.0" y="195.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="92" y="172" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120.0" y="195.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-3</text>
  <rect x="154" y="172" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="182.0" y="195.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-1</text>
  <rect x="216" y="172" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="244.0" y="195.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="278" y="172" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="306.0" y="195.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="30.0" y="232.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">第 2 次：翻 −3</text>
  <rect x="30" y="242" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="58.0" y="265.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="92" y="242" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120.0" y="265.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="154" y="242" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="182.0" y="265.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-1</text>
  <rect x="216" y="242" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="244.0" y="265.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="278" y="242" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="306.0" y="265.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="30.0" y="308.0" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">k = 0，结束：和 = 4 + 3 + (−1) + 2 + 5 = 13</text>
  <rect x="30" y="322" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="343.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">负数只剩 −1 来不及翻，答案就是 13；若 k = 3 则还要翻 −1 → 15</text>
</svg>
