<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">备用正解：二分答案 + 从右往左贪心检查</text>

  <g filter="url(#rough2)">
    <ellipse cx="280" cy="70" rx="70" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="280" y="75" text-anchor="middle" font-size="12.5" fill="#1a2b45" filter="url(#rough2)">m 可行吗？（0 ≤ m ≤ max）</text>

  <path d="M 280 96 L 280 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 210 109 L 90 109 L 90 160" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="102" font-size="11.5" fill="#b85450" filter="url(#rough2)">二分：可行 → 缩上界</text>

  <g filter="url(#rough2)">
    <rect x="120" y="164" width="320" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="280" y="188">check(m)：从右往左扫</text>
    <text x="280" y="210">cur = nums[i] + carry（右边推来的量）</text>
    <text x="280" y="232">carry = max(0, cur − m)（超载继续左推）</text>
    <text x="280" y="252">可行 ⟺ nums[0] + carry ≤ m</text>
  </g>

  <path d="M 90 192 L 90 240 L 118 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="11.5" fill="#b85450" filter="url(#rough2)">位置 0 被</text>
  <text x="60" y="316" font-size="11.5" fill="#b85450" filter="url(#rough2)">压垮 → 不可行</text>

  <g filter="url(#rough2)">
    <rect x="140" y="286" width="280" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#1d3a17" text-anchor="middle">
    <text x="280" y="306">数学等价：check(m) 可行 ⟺</text>
    <text x="280" y="324">所有 P_k ≤ k·m（k = 1..n）</text>
  </g>

  <path d="M 280 262 L 280 282" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="296" y="278" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">位置 0 没被压垮 → 可行</text>

  <g filter="url(#rough2)">
    <rect x="100" y="352" width="380" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a2f2b" text-anchor="middle">
    <text x="290" y="374">⚠️ check 必须从右往左：超载的流向是左边，</text>
    <text x="290" y="394">从左往右会在右侧超载流入前给出假的「安全」</text>
  </g>
</svg>
