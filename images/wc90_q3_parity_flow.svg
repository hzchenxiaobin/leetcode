<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="372" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">判定流程：先约分，再看两个数的奇偶性</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">设 p' = p/g、q' = q/g（g = gcd(p, q)），二者必不同时为偶数</text>
  <rect x="230" y="70" width="160" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="95.5" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">g = gcd(p, q)</text>
  <path d="M 310 112 L 310 134" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="200" y="136" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="161.5" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">p /= g ;  q /= g</text>
  <path d="M 310 178 L 310 200" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 310 202 L 430 236 L 310 270 L 190 236 Z" stroke="#d6a040" stroke-width="1.6" fill="#fff8e1" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="310" y="233" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">p' 是偶数？</text>
  <path d="M 430 236 L 502 236" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="464" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="498" y="214" width="108" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="552" y="233.3" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">返回 2</text>
  <text x="552" y="246.3" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（西南角编号）</text>
  <path d="M 310 270 L 310 292" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="324" y="286" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>
  <path d="M 310 294 L 430 326 L 310 356 L 190 326 Z" stroke="#d6a040" stroke-width="1.6" fill="#fff8e1" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="310" y="323" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">q' 是偶数？</text>
  <path d="M 430 326 L 502 326" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="464" y="316" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="498" y="304" width="108" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="552" y="323.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">返回 0</text>
  <text x="552" y="336.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（东南角编号）</text>
  <path d="M 190 326 L 120 326" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="154" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="14" y="304" width="104" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="323.3" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">返回 1</text>
  <text x="66" y="336.3" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">（东北角编号）</text>
</svg>
