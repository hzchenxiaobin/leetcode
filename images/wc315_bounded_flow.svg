<svg xmlns="http://www.w3.org/2000/svg" width="640" height="505" viewBox="0 0 640 505" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="505" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描，三个「最近位置」O(1) 滚动更新</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)"><rect x="90" y="50" width="320" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="250" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5f14">初始化 lastInvalid = lastMin = lastMax = −1，ans = 0</text>
  <path d="M 250 84 L 250 88" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop check -->
  <g filter="url(#sk)"><ellipse cx="250" cy="118" rx="58" ry="27" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="250" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5f14" font-family="monospace">i &lt; n ?</text>
  <path d="M 308 118 L 468 118" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="384" y="110" text-anchor="middle" font-size="11.5" fill="#666">否</text>
  <g filter="url(#sk)"><rect x="470" y="98" width="130" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="535" y="123" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">return ans</text>

  <!-- yes branch -->
  <path d="M 250 145 L 250 156" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="260" y="153" font-size="11.5" fill="#666">是</text>

  <!-- check 1: invalid -->
  <g filter="url(#sk)"><ellipse cx="250" cy="188" rx="66" ry="28" fill="#fdf3f2" stroke="#b85450" stroke-width="1.7"/></g>
  <text x="250" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">nums[i] 越界？</text>
  <text x="250" y="200" text-anchor="middle" font-size="9.5" fill="#b85450" font-family="monospace">&lt; minK 或 &gt; maxK</text>
  <path d="M 316 188 L 428 188" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="180" text-anchor="middle" font-size="11.5" fill="#666">是</text>
  <g filter="url(#sk)"><rect x="430" y="170" width="160" height="36" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="510" y="193" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" font-family="monospace">lastInvalid = i</text>
  <path d="M 510 206 L 510 224 L 252 224" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 216 L 250 244" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="262" y="234" font-size="11.5" fill="#666">否（继续判等值）</text>

  <!-- check 2: minK -->
  <g filter="url(#sk)"><ellipse cx="250" cy="276" rx="62" ry="28" fill="#f2f9f1" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="250" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">nums[i] == minK ?</text>
  <path d="M 312 276 L 428 276" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="268" text-anchor="middle" font-size="11.5" fill="#666">是</text>
  <g filter="url(#sk)"><rect x="430" y="258" width="160" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="510" y="281" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">lastMin = i</text>
  <path d="M 510 294 L 510 312 L 252 312" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 304 L 250 332" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="262" y="322" font-size="11.5" fill="#666">否</text>

  <!-- check 3: maxK -->
  <g filter="url(#sk)"><ellipse cx="250" cy="364" rx="62" ry="28" fill="#f0f6fd" stroke="#4a8edb" stroke-width="1.7"/></g>
  <text x="250" y="369" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a94" font-family="monospace">nums[i] == maxK ?</text>
  <path d="M 312 364 L 428 364" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="356" text-anchor="middle" font-size="11.5" fill="#666">是</text>
  <g filter="url(#sk)"><rect x="430" y="346" width="160" height="36" rx="8" fill="#d9e8fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="510" y="369" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a94" font-family="monospace">lastMax = i</text>
  <path d="M 510 382 L 510 400 L 252 400" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 392 L 250 416" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="262" y="410" font-size="11.5" fill="#666">否</text>

  <!-- accumulate -->
  <g filter="url(#sk)"><rect x="88" y="418" width="324" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="250" y="442" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5f14" font-family="monospace">ans += max(0, min(lastMin, lastMax) − lastInvalid)</text>

  <!-- loop back -->
  <path d="M 250 456 L 250 470 L 78 470 L 78 118 L 186 118" stroke="#8a5f14" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="160" y="464" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5f14">i++，处理下一个右端点</text>

  <!-- warning -->
  <g filter="url(#sk)"><rect x="60" y="480" width="540" height="20" rx="6" fill="#fdf3f2" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="330" y="494" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">⚠ 三个判断是并列 if（不是 elif）：minK == maxK 时同一元素要同时更新 lastMin 与 lastMax</text>
</svg>
