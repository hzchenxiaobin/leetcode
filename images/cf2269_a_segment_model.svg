<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">段模型：n 天被 k 个取款日切成 k 段</text>
  <path d="M 170 46 Q 360 53 550 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="68" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">取款日 d_1 &lt; d_2 &lt; … &lt; d_k，段长 L_i = d_i − d_(i−1)，约定 d_0 = 0</text>

  <!-- n = 5 的天格子，第 4、5 天取款 -->
  <text x="104" y="112" font-size="12.5" fill="#8a6015" filter="url(#rough2)">n = 5</text>
  <rect x="146" y="92" width="76" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="184" y="120" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">第 1 天</text>
  <rect x="234" y="92" width="76" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="272" y="120" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">第 2 天</text>
  <rect x="322" y="92" width="76" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="120" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">第 3 天</text>
  <rect x="410" y="92" width="76" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="120" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">第 4 天</text>
  <rect x="498" y="92" width="76" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="536" y="120" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">第 5 天</text>
  <text x="448" y="86" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">取</text>
  <text x="536" y="86" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">取</text>

  <!-- 分段括号 -->
  <path d="M 146 150 L 146 162 M 486 150 L 486 162 M 146 156 L 486 156" stroke="#446688" stroke-width="1.7"
        fill="none" filter="url(#rough2)"/>
  <path d="M 498 150 L 498 162 M 574 150 L 574 162 M 498 156 L 574 156" stroke="#4a7a3a" stroke-width="1.7"
        fill="none" filter="url(#rough2)"/>

  <text x="316" y="180" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">L_1 = 4 → 取款 2^4 = 16</text>
  <text x="536" y="180" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">L_2 = 1 → 2^1 = 2</text>

  <!-- 汇总 -->
  <rect x="90" y="196" width="540" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="106" y="225" font-size="13" fill="#3a5a30" filter="url(#rough2)">卡上总额 = Σ 2^(L_i) = 2^4 + 2^1 = 18，段数 = k = 2，段长总和 = n = 5</text>

  <!-- 反例对比 -->
  <rect x="90" y="256" width="540" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106" y="283" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">同样 n = 5、k = 2，若切成 3 + 2：2^3 + 2^2 = 12 &lt; 18 —— 天数越集中越赚</text>

  <!-- 结论 -->
  <rect x="90" y="312" width="540" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="106" y="334" font-size="12" fill="#8a6a20" filter="url(#rough2)">每次取款金额只由「距上次取款过了几天」决定：过 L 天，余额就是 2^L 美元。</text>
  <text x="106" y="352" font-size="12" fill="#8a6a20" filter="url(#rough2)">所以问题变成：把 n 拆成 k 个正整数 L_i，最大化 Σ 2^(L_i)。</text>

  <text x="360" y="390" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">答案 = 2^(n−k+1) + 2(k−1)　（k−1 段取 1，剩下 1 段取 n−k+1）</text>
  <text x="360" y="412" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">示例 n=5,k=2：2^4 + 2 = 18</text>
</svg>
