<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="620" height="380" fill="#fafafa"/>
  <text x="310" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">先填偶数位，再回头填奇数位</text>
  <text x="310" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">出现次数最多的值被摊到互不相邻的偶位槽上</text>
  <text x="30" y="92" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">计数</text>
  <rect x="90" y="70" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="150" y="94" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1 → 3 次</text>
  <rect x="90" y="118" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="150" y="142" font-size="11" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2 → 3 次</text>
  <text x="30" y="196" font-size="11" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">槽位</text>
  <rect x="90" y="178" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="202.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="150" y="178" width="60" height="40" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="202.3" font-size="12" fill="#555555" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="210" y="178" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="202.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="270" y="178" width="60" height="40" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="300" y="202.3" font-size="12" fill="#555555" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="330" y="178" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="202.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="390" y="178" width="60" height="40" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="202.3" font-size="12" fill="#555555" text-anchor="middle" filter="url(#rough2)">5</text>
  <text x="90" y="238" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">偶位 0/2/4 先放完 3 个 1，再放到 1/3/5 放 2</text>
  <rect x="90" y="266" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="290.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="150" y="266" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="290.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="210" y="266" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="290.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="270" y="266" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="300" y="290.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="330" y="266" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="290.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="390" y="266" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="290.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="120" y="322" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">①</text>
  <text x="180" y="322" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">②</text>
  <text x="240" y="322" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">③</text>
  <text x="300" y="322" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">④</text>
  <text x="360" y="322" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">⑤</text>
  <text x="420" y="322" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">⑥</text>
  <rect x="90" y="336" width="460" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="355.8" font-size="10.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">指针越过末尾就回到 1，继续在奇数位上递推</text>
</svg>
