<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">判定 check(x)：排序后逐区间贪心，尽量选最左</text>

  <rect x="320" y="44" width="216" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="428" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a20" filter="url(#rough2)">💡 为什么贪最左？</text>
  <text x="428" y="82" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">本区间选点越靠左，</text>
  <text x="428" y="98" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">后续区间的可行范围就越大，</text>
  <text x="428" y="114" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">前面让步不会让后面更差</text>
  <text x="428" y="130" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">（题解引理 3 严格化）</text>

  <rect x="50" y="56" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prev = start[0]（排序后）</text>

  <path d="M 150 96 L 150 114" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="116" width="200" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cur = max(</text>
  <text x="150" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prev + x, start[i] )</text>

  <path d="M 150 168 L 150 192" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="150,196 242,240 150,284 58,240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cur ≤</text>
  <text x="150" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">start[i] + d ?</text>

  <path d="M 242 240 L 294 240" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="298" y="218" width="202" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="399" y="244" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 false：x 不可行</text>

  <path d="M 150 284 L 150 308" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="162" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="50" y="312" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prev = cur；i ← i + 1</text>

  <path d="M 150 352 L 150 376" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="150,380 222,412 150,444 78,412" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="416" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有区间？</text>

  <path d="M 222 412 L 262 412" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="240" y="404" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="266" y="390" width="194" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="363" y="416" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 true：x 可行</text>

  <path d="M 78 412 L 30 412 L 30 142 L 44 142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="18" y="277" text-anchor="middle" font-size="11" fill="#666" transform="rotate(-90 18 277)" filter="url(#rough2)">是：处理下一个区间</text>
</svg>
