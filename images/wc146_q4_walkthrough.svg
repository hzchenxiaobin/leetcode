<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 336" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="336" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：arr1 = [1,2,3,4]，arr2 = [-1,4,5,6]</text>
  <text x="300" y="45" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">对每行线性式 f 求最大值与最小值，差值最大的那行就是答案</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="30" y="60" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="105" y="77" fill="#2f4a66">线性式 f(i)</text>
    <rect x="188" y="60" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="214" y="77" fill="#2f4a66">f(0)</text>
    <rect x="244" y="60" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="270" y="77" fill="#2f4a66">f(1)</text>
    <rect x="300" y="60" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="326" y="77" fill="#2f4a66">f(2)</text>
    <rect x="356" y="60" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="379" y="77" fill="#2f4a66">f(3)</text>
    <rect x="408" y="60" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="433" y="77" fill="#7a5c18">max</text>
    <rect x="464" y="60" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="489" y="77" fill="#7a5c18">min</text>
    <rect x="520" y="60" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5"/>
    <text x="548" y="77" fill="#8a3a36">差值</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="30" y="94" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <text x="105" y="113" fill="#3a5a30">a + b + i</text>
    <rect x="188" y="94" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5"/>
    <text x="214" y="113" fill="#333">0</text>
    <rect x="244" y="94" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5"/>
    <text x="270" y="113" fill="#333">7</text>
    <rect x="300" y="94" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5"/>
    <text x="326" y="113" fill="#333">10</text>
    <rect x="356" y="94" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5"/>
    <text x="379" y="113" fill="#333">13</text>
    <rect x="408" y="94" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5"/>
    <text x="433" y="113" fill="#7a5c18">13</text>
    <rect x="464" y="94" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5"/>
    <text x="489" y="113" fill="#7a5c18">0</text>
    <rect x="520" y="94" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
    <text x="548" y="113" fill="#8a3a36" font-weight="bold">13</text>

    <rect x="30" y="130" width="150" height="30" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="105" y="149" fill="#444">a + b − i</text>
    <rect x="188" y="130" width="52" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="214" y="149" fill="#444">0</text>
    <rect x="244" y="130" width="52" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="270" y="149" fill="#444">5</text>
    <rect x="300" y="130" width="52" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="326" y="149" fill="#444">6</text>
    <rect x="356" y="130" width="46" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="379" y="149" fill="#444">7</text>
    <rect x="408" y="130" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="5"/>
    <text x="433" y="149" fill="#7a5c18">7</text>
    <rect x="464" y="130" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="5"/>
    <text x="489" y="149" fill="#7a5c18">0</text>
    <rect x="520" y="130" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5"/>
    <text x="548" y="149" fill="#8a3a36">7</text>

    <rect x="30" y="166" width="150" height="30" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="105" y="185" fill="#444">a − b + i</text>
    <rect x="188" y="166" width="52" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="214" y="185" fill="#444">2</text>
    <rect x="244" y="166" width="52" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="270" y="185" fill="#444">−1</text>
    <rect x="300" y="166" width="52" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="326" y="185" fill="#444">0</text>
    <rect x="356" y="166" width="46" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="379" y="185" fill="#444">1</text>
    <rect x="408" y="166" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="5"/>
    <text x="433" y="185" fill="#7a5c18">2</text>
    <rect x="464" y="166" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="5"/>
    <text x="489" y="185" fill="#7a5c18">−1</text>
    <rect x="520" y="166" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5"/>
    <text x="548" y="185" fill="#8a3a36">3</text>

    <rect x="30" y="202" width="150" height="30" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="105" y="221" fill="#444">a − b − i</text>
    <rect x="188" y="202" width="52" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="214" y="221" fill="#444">2</text>
    <rect x="244" y="202" width="52" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="270" y="221" fill="#444">−3</text>
    <rect x="300" y="202" width="52" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="326" y="221" fill="#444">−4</text>
    <rect x="356" y="202" width="46" height="30" fill="#fff" stroke="#aaa" stroke-width="1.1" rx="5"/>
    <text x="379" y="221" fill="#444">−5</text>
    <rect x="408" y="202" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="5"/>
    <text x="433" y="221" fill="#7a5c18">2</text>
    <rect x="464" y="202" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="5"/>
    <text x="489" y="221" fill="#7a5c18">−5</text>
    <rect x="520" y="202" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5"/>
    <text x="548" y="221" fill="#8a3a36">7</text>
  </g>

  <rect x="30" y="246" width="546" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="262" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">最优行：a + b + i</text>
  <text x="44" y="276" font-size="10" fill="#333" filter="url(#rough2)">取 i = 3（f = 13 最大）与 j = 0（f = 0 最小）⇒ 4 行差值取 max = 13</text>

  <rect x="30" y="290" width="546" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="44" y="306" font-size="10" fill="#8a3a36" filter="url(#rough2)">回代验证：|4 − 1| + |6 − (−1)| + |3 − 0| = 3 + 7 + 3 = 13</text>
  <text x="44" y="319" font-size="10" fill="#8a3a36" filter="url(#rough2)">其余三行差值 7、3、7 都更小，故答案为 13。</text>
</svg>
