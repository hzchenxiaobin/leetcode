<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">信号塔：距离越远，信号越弱</text>

  <!-- 坐标区 -->
  <g filter="url(#rough2)" stroke="#ccc" stroke-width="1">
    <line x1="60" y1="60" x2="60" y2="280"/>
    <line x1="60" y1="280" x2="400" y2="280"/>
  </g>
  <text x="52" y="296" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="404" y="296" font-size="12" fill="#888" filter="url(#rough2)">x</text>
  <text x="44" y="66" font-size="12" fill="#888" filter="url(#rough2)">y</text>

  <!-- 塔 1 (140,120) q=7 -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="120" r="46" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="6,4"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="140" cy="120" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <line x1="140" y1="113" x2="140" y2="96" stroke="#446688" stroke-width="2"/>
    <path d="M 132 96 L 148 96" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="126" y="88" font-size="12" fill="#446688" filter="url(#rough2)">塔 q=7</text>
  <text x="188" y="152" font-size="11.5" fill="#888" filter="url(#rough2)">半径 r</text>

  <!-- 塔 2 (300,200) q=9 -->
  <g filter="url(#rough2)">
    <circle cx="300" cy="200" r="46" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6,4"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="300" cy="200" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <line x1="300" y1="193" x2="300" y2="176" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 292 176 L 308 176" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="286" y="168" font-size="12" fill="#4a7a3a" filter="url(#rough2)">塔 q=9</text>

  <!-- 候选点 P -->
  <g filter="url(#rough2)">
    <circle cx="222" cy="164" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="232" y="158" font-size="12.5" fill="#b85450" filter="url(#rough2)">P (x,y)</text>

  <path d="M 148 126 L 214 158" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 292 194 L 230 170" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="160" y="148" font-size="11.5" fill="#b85450" filter="url(#rough2)">d₁</text>
  <text x="252" y="196" font-size="11.5" fill="#b85450" filter="url(#rough2)">d₂</text>

  <!-- 公式说明框 -->
  <g filter="url(#rough2)">
    <rect x="404" y="60" width="140" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a5a10">
    <text x="474" y="86" text-anchor="middle">单塔在 P 处：</text>
    <text x="474" y="112" text-anchor="middle">⌊ q / (1+d) ⌋</text>
    <text x="474" y="140" text-anchor="middle">d ≤ r 才可达</text>
    <text x="474" y="168" text-anchor="middle">d &gt; r → 贡献 0</text>
    <text x="474" y="200" text-anchor="middle">d 变小 ⇒ 贡献不减</text>
    <text x="474" y="222" text-anchor="middle">(单调不增)</text>
  </g>

  <path d="M 456 246 C 440 262, 420 268, 400 264" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="70" y="312" width="420" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="333" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">收缩引理：把 P 夹进塔的包围盒 [0,50]²，</text>
  <text x="280" y="354" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">每座塔的距离都不增 ⇒ 信号强度不降 ⇒ 盒内必有最优</text>
</svg>
