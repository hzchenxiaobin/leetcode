<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="590" height="420" fill="#fafafa"/>

  <text x="295" y="26" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：预处理转移表 → 环检测 → 尾部补算</text>
  <text x="180" y="46" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">主循环（逐块推进）</text>
  <text x="450" y="46" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">跳出后收尾</text>

  <rect x="60" y="58" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="76" text-anchor="middle" font-size="9.8" fill="#3a4a66" filter="url(#rough2)">预处理：对每个 p ∈ [0, |s₂|)</text>
  <text x="180" y="93" text-anchor="middle" font-size="9.8" fill="#3a4a66" filter="url(#rough2)">模拟一整块 s₁，得到 f(p) 与 gain(p)</text>

  <path d="M 180 102 L 180 116" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="180,118 290,150 180,182 70,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="154" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">block &lt; n₁ ?</text>

  <text x="192" y="198" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 180 182 L 180 204" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="143" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 290 150 L 336 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="180,206 300,240 180,274 60,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="237" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">seen 中已有 p ?</text>
  <text x="180" y="252" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（成环判定）</text>

  <text x="313" y="232" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 300 240 L 336 240" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="290" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 180 274 L 180 298" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="300" width="240" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="72" y="320" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">记录 first[p] = block</text>
  <text x="72" y="336" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">total_at[p] = total</text>
  <text x="72" y="352" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">total += gain[p]; p = f(p); block++</text>

  <path d="M 60 332 L 20 332 L 20 150 L 66 150" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="244" font-size="9" fill="#888" transform="rotate(-90 36 244)" filter="url(#rough2)">循环</text>

  <rect x="340" y="126" width="220" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="352" y="146" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">block ≥ n₁：块已用尽</text>
  <text x="352" y="163" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">直接进入尾部补算</text>

  <rect x="340" y="206" width="220" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="352" y="224" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">L = block − first[p]（环长）</text>
  <text x="352" y="240" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">G = total − total_at[p]（环增益）</text>
  <text x="352" y="256" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">k = (n₁ − block) / L（整除）</text>
  <text x="352" y="272" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">total += k·G; block += k·L</text>

  <path d="M 450 174 L 450 204" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <rect x="340" y="316" width="220" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="352" y="336" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">尾部：while block &lt; n₁</text>
  <text x="352" y="352" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">total += gain[p]; p = f(p)</text>
  <text x="352" y="370" font-size="9.8" fill="#8a3a36" filter="url(#rough2)">返回 ⌊ total / n₂ ⌋</text>

  <path d="M 560 150 L 574 150 L 574 300 L 450 300 L 450 314" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 286 L 450 314" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="295" y="404" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">total 最大约 10⁸，用 64 位整数保存更稳妥；循环总轮数 ≤ |s₂|+1，与 n₁ 无关</text>
</svg>
