  <text x="320" y="70" font-size="10.5" fill="#b85450" text-anchor="end" filter="url(#rough2)">网格边界</text>
  <text x="368" y="96" font-size="10.8" fill="#8a3a36" text-anchor="start" font-weight="bold" filter="url(#rough2)">A：连通块含 (0,2)、(0,3) 这类边界格子</text>
  <text x="368" y="114" font-size="10.8" fill="#b85450" text-anchor="start" filter="url(#rough2)">边界外侧没有 1 → 不是封闭岛</text>
  <path d="M 362 100 L 164.0 98.0" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="368" y="186" font-size="10.8" fill="#8a6a20" text-anchor="start" font-weight="bold" filter="url(#rough2)">B：整个连通块都在内部，四周全是 1</text>
  <text x="368" y="204" font-size="10.8" fill="#d6a040" text-anchor="start" filter="url(#rough2)">→ 封闭岛，计数 +1</text>
  <path d="M 362 198 L 232.0 198.0" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="250" width="218" height="104" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="8" filter="url(#rough2)"/>
  <rect x="412" y="264" width="14" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="434" y="274" font-size="10.5" fill="#444" text-anchor="start" filter="url(#rough2)">0 陆地（岛屿的组成格）</text>
  <rect x="412" y="286" width="14" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="434" y="296" font-size="10.5" fill="#444" text-anchor="start" filter="url(#rough2)">1 水域</text>
  <rect x="412" y="308" width="14" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="434" y="318" font-size="10.5" fill="#444" text-anchor="start" filter="url(#rough2)">含边界格子的连通块</text>
  <rect x="412" y="330" width="14" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="434" y="340" font-size="10.5" fill="#444" text-anchor="start" filter="url(#rough2)">封闭岛（答案）</text>
  <text x="60" y="300" font-size="11.5" fill="#555" text-anchor="start" filter="url(#rough2)">关键：判据只看“有没有格子贴边”，</text>
  <text x="60" y="320" font-size="11.5" fill="#555" text-anchor="start" filter="url(#rough2)">不要求连通块是“一圈”，也不看它的形状。</text>
  <text x="60" y="352" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">推论：位于边界的 0 及其整块连通块，必不是封闭岛；</text>
  <text x="60" y="372" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">反之不贴边的连通块，其四周相邻格只能是 1（否则连成更大块）。</text>
