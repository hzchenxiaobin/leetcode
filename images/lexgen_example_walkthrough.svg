<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">演算：str1 = TFFFFFT，str2 = baab</text>

  <!-- 初始 word -->
  <text x="60" y="56" font-size="11.5" fill="#666" filter="url(#rough2)">① T 钉死 + 'a' 基线：</text>
  <g filter="url(#rough2)">
    <rect x="60" y="64" width="176" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="236" y="64" width="88" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" rx="4"/>
    <rect x="324" y="64" width="176" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <g font-size="14" fill="#333" text-anchor="middle">
      <text x="82" y="87">b</text><text x="126" y="87">a</text>
      <text x="170" y="87">a</text><text x="214" y="87">b</text>
      <text x="258" y="87" fill="#4a7a3a">a</text>
      <text x="302" y="87" fill="#4a7a3a">a</text>
      <text x="346" y="87">b</text><text x="390" y="87">a</text>
      <text x="434" y="87">a</text><text x="478" y="87">b</text>
    </g>
    <g font-size="9.5" fill="#999" text-anchor="middle">
      <text x="82" y="59">0</text><text x="126" y="59">1</text><text x="170" y="59">2</text>
      <text x="214" y="59">3</text><text x="258" y="59">4</text><text x="302" y="59">5</text>
      <text x="346" y="59">6</text><text x="390" y="59">7</text><text x="434" y="59">8</text>
      <text x="478" y="59">9</text>
    </g>
  </g>
  <text x="500" y="64" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">自由位</text>
  <text x="500" y="78" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">= {4, 5}</text>

  <!-- 五个窗口的 mism -->
  <text x="60" y="126" font-size="11.5" fill="#666" filter="url(#rough2)">② 五个 F 窗口的失配数（对齐字母 = b a a b）：</text>
  <g filter="url(#rough2)">
    <rect x="60" y="134" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="152" y="134" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="244" y="134" width="88" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="336" y="134" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="428" y="134" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <g font-size="11.5" fill="#333" text-anchor="middle">
      <text x="104" y="148">窗口1</text><text x="104" y="163">mism = 3</text>
      <text x="196" y="148">窗口2</text><text x="196" y="163">mism = 2</text>
      <text x="288" y="148" font-weight="bold" fill="#b85450">窗口3</text>
      <text x="288" y="163" font-weight="bold" fill="#b85450">mism = 0 !</text>
      <text x="380" y="148">窗口4</text><text x="380" y="163">mism = 3</text>
      <text x="472" y="148">窗口5</text><text x="472" y="163">mism = 3</text>
    </g>
  </g>
  <text x="288" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">窗口3 [3,6] 完全对齐 → 待打破；它的自由位 {4,5}，最后机会 = 5</text>

  <!-- 扫描两步 -->
  <text x="60" y="214" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">③ q=4：没有窗口的最后机会是 4 → w[4] = 'a'（基线保持）</text>
  <path d="M210,216 L258,216" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="60" y="244" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">④ q=5：窗口3（mism=0）的最后机会 = 5 → 被迫抬升！</text>
  <text x="60" y="262" font-size="11.5" fill="#666" filter="url(#rough2)">禁字母集 B = {'a'}（无 critical 窗口）→ c = 'b'；w[5] = 'b'，窗口3 的 mism: 0 → 1 ✓</text>
  <path d="M470,252 L470,300" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 最终串 -->
  <text x="60" y="298" font-size="11.5" fill="#666" filter="url(#rough2)">⑤ 最终串（位置 5 被抬升）：</text>
  <g filter="url(#rough2)">
    <rect x="60" y="308" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="104" y="308" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="148" y="308" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="192" y="308" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="236" y="308" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="280" y="308" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" rx="4"/>
    <rect x="324" y="308" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="368" y="308" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="412" y="308" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="456" y="308" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <g font-size="14" fill="#333" text-anchor="middle">
      <text x="82" y="331">b</text><text x="126" y="331">a</text><text x="170" y="331">a</text>
      <text x="214" y="331">b</text><text x="258" y="331">a</text>
      <text x="302" y="331" font-weight="bold" fill="#b85450">b</text>
      <text x="346" y="331">b</text><text x="390" y="331">a</text>
      <text x="434" y="331">a</text><text x="478" y="331">b</text>
    </g>
  </g>
  <text x="280" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">答案：baababbaab</text>

  <!-- 验证 -->
  <rect x="60" y="386" width="440" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">验证：窗口3 = "babb" ≠ "baab" ✓（恰在第 2 位被 'b' 打破）</text>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">其余窗口早在固定位失配；抬升发生在最迟可能的位置 → 字典序最小</text>
</svg>
