<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 366"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="366" fill="#fafafa"/>
<text x="260" y="28" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">转换关系是一棵以 0 为根的树，路径乘积即答案</text>
<ellipse cx="100" cy="190" rx="26" ry="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="100" y="196" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
<ellipse cx="270" cy="106" rx="26" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<text x="270" y="112" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
<ellipse cx="270" cy="276" rx="26" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<text x="270" y="282" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
<ellipse cx="440" cy="106" rx="26" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="440" y="112" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
<path d="M120,176 L248,120" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="178" y="140" font-size="13" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">×2</text>
<path d="M120,204 L248,262" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="178" y="258" font-size="13" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">×3</text>
<path d="M296,106 L414,106" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="355" y="98" font-size="13" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">×4</text>
<text x="100" y="232" font-size="12" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">ans[0] = 1</text>
<text x="270" y="152" font-size="12" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">ans[1] = 1×2 = 2</text>
<text x="270" y="322" font-size="12" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">ans[2] = 1×3 = 3</text>
<text x="440" y="152" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">ans[3] = 2×4 = 8</text>
<text x="260" y="356" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">根到每个节点路径唯一 → 一遍 DFS/BFS，边乘边取模</text>
</svg>
