<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 366" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="366" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">网格与访问计数：空格 9 个，todo 从 10 递减到 0</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">进入终点时 todo 必须恰好为 0，否则说明还有格子没走到</text>
  <rect x="60" y="80" width="68" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="94.0" y="114.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="134" y="80" width="68" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="168.0" y="114.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="208" y="80" width="68" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="242.0" y="114.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="282" y="80" width="68" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="316.0" y="114.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="60" y="146" width="68" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="94.0" y="180.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="134" y="146" width="68" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="168.0" y="180.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="208" y="146" width="68" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="242.0" y="180.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="282" y="146" width="68" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="316.0" y="180.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="60" y="212" width="68" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="94.0" y="246.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="134" y="212" width="68" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="168.0" y="246.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="208" y="212" width="68" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="242.0" y="246.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="282" y="212" width="68" height="58" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="316.0" y="246.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-1</text>
  <text x="60" y="62" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">grid（3 × 4）</text>
  <text x="366" y="62" font-size="11" fill="#446688" text-anchor="start" filter="url(#rough2)">1 = 起点  2 = 终点</text>
  <text x="366" y="80" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">0 = 空格  −1 = 障碍</text>
  <rect x="380" y="110" width="170" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="390" y="131" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">待访问数</text><text x="390" y="146.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">空格 9 个</text><text x="390" y="162.89999999999998" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">todo 初值 = 9 + 1 = 10</text>
  <rect x="40" y="288" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="50" y="309" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">要求：每个非障碍格子恰好经过一次，且最后一步落在终点</text><text x="50" y="324.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">本质是网格图上的哈密顿路径计数 → nm ≤ 20 才能回溯</text>
</svg>
