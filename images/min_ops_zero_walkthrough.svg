<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="58" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：num1 = 3，num2 = −2</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="46" y="60" width="50" height="34" rx="4" fill="#f0f0f0" stroke="#888888" stroke-width="1.2"/>
    <rect x="96" y="60" width="96" height="34" rx="4" fill="#f0f0f0" stroke="#888888" stroke-width="1.2"/>
    <rect x="192" y="60" width="112" height="34" rx="4" fill="#f0f0f0" stroke="#888888" stroke-width="1.2"/>
    <rect x="304" y="60" width="112" height="34" rx="4" fill="#f0f0f0" stroke="#888888" stroke-width="1.2"/>
    <rect x="416" y="60" width="112" height="34" rx="4" fill="#f0f0f0" stroke="#888888" stroke-width="1.2"/>
    <rect x="528" y="60" width="66" height="34" rx="4" fill="#f0f0f0" stroke="#888888" stroke-width="1.2"/>
  </g>
  <text x="71" y="81" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555">k</text>
  <text x="144" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">S = 3+2k</text>
  <text x="248" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">S 的二进制</text>
  <text x="360" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">S ≥ k ?</text>
  <text x="472" y="81" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555555">popcount(S) ≤ k ?</text>
  <text x="561" y="81" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555">判定</text>

  <g filter="url(#sk)">
    <rect x="46" y="94" width="50" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
    <rect x="96" y="94" width="96" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
    <rect x="192" y="94" width="112" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
    <rect x="304" y="94" width="112" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
    <rect x="416" y="94" width="112" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
    <rect x="528" y="94" width="66" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
  </g>
  <text x="71" y="118" text-anchor="middle" font-size="12.5" fill="#333333">1</text>
  <text x="144" y="118" text-anchor="middle" font-size="12.5" fill="#333333">5</text>
  <text x="248" y="118" text-anchor="middle" font-size="12.5" fill="#333333">101<tspan dy="4" font-size="9">2</tspan></text>
  <text x="360" y="118" text-anchor="middle" font-size="12" fill="#2e6e2e">5 ≥ 1 ✓</text>
  <text x="472" y="118" text-anchor="middle" font-size="12" fill="#b85450">2 &gt; 1 ✗</text>
  <text x="561" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗</text>

  <g filter="url(#sk)">
    <rect x="46" y="132" width="50" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
    <rect x="96" y="132" width="96" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
    <rect x="192" y="132" width="112" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
    <rect x="304" y="132" width="112" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
    <rect x="416" y="132" width="112" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
    <rect x="528" y="132" width="66" height="38" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.1"/>
  </g>
  <text x="71" y="156" text-anchor="middle" font-size="12.5" fill="#333333">2</text>
  <text x="144" y="156" text-anchor="middle" font-size="12.5" fill="#333333">7</text>
  <text x="248" y="156" text-anchor="middle" font-size="12.5" fill="#333333">111<tspan dy="4" font-size="9">2</tspan></text>
  <text x="360" y="156" text-anchor="middle" font-size="12" fill="#2e6e2e">7 ≥ 2 ✓</text>
  <text x="472" y="156" text-anchor="middle" font-size="12" fill="#b85450">3 &gt; 2 ✗</text>
  <text x="561" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗</text>

  <g filter="url(#sk)">
    <rect x="46" y="170" width="50" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="96" y="170" width="96" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="192" y="170" width="112" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="304" y="170" width="112" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="416" y="170" width="112" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="528" y="170" width="66" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="71" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333333">3</text>
  <text x="144" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333333">9</text>
  <text x="248" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333333">1001<tspan dy="4" font-size="9">2</tspan></text>
  <text x="360" y="194" text-anchor="middle" font-size="12" fill="#2e6e2e">9 ≥ 3 ✓</text>
  <text x="472" y="194" text-anchor="middle" font-size="12" fill="#2e6e2e">2 ≤ 3 ✓</text>
  <text x="561" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">✓</text>

  <g filter="url(#sk)">
    <rect x="46" y="224" width="280" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="186" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">把 9 的 8 分裂一次：9 = 4 + 4 + 1</text>
  <text x="186" y="263" text-anchor="middle" font-size="11.5" fill="#8a6415">→ 对应指数 i = 2, 2, 0</text>

  <g filter="url(#sk)">
    <rect x="340" y="224" width="254" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="467" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">k = 3 是第一个通过双条件的</text>
  <text x="467" y="263" text-anchor="middle" font-size="11.5" fill="#2e6e2e">→ 答案 3</text>

  <text x="320" y="298" text-anchor="middle" font-size="12" fill="#555555">三步的实际轨迹（每步减去 2<tspan dy="-5" font-size="9">i</tspan><tspan dy="5"> + (−2)）：</tspan></text>

  <g filter="url(#sk)">
    <rect x="66" y="312" width="54" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="93" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">3</text>
  <path d="M 122 330 L 152 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="137" y="322" text-anchor="middle" font-size="10.5" fill="#8a6415">i=2</text>
  <text x="137" y="346" text-anchor="middle" font-size="10.5" fill="#555555">−2</text>

  <g filter="url(#sk)">
    <rect x="156" y="312" width="54" height="36" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
  </g>
  <text x="183" y="334" text-anchor="middle" font-size="13" fill="#333333">1</text>
  <path d="M 212 330 L 242 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="227" y="322" text-anchor="middle" font-size="10.5" fill="#8a6415">i=2</text>
  <text x="227" y="346" text-anchor="middle" font-size="10.5" fill="#555555">−2</text>

  <g filter="url(#sk)">
    <rect x="246" y="312" width="54" height="36" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
  </g>
  <text x="273" y="334" text-anchor="middle" font-size="13" fill="#333333">−1</text>
  <path d="M 302 330 L 332 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="317" y="322" text-anchor="middle" font-size="10.5" fill="#8a6415">i=0</text>
  <text x="317" y="346" text-anchor="middle" font-size="10.5" fill="#555555">+1</text>

  <g filter="url(#sk)">
    <rect x="336" y="312" width="54" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="363" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">0</text>

  <g filter="url(#sk)">
    <rect x="420" y="312" width="178" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="509" y="327" text-anchor="middle" font-size="10.5" fill="#2b6e9e">与官方示例的三步</text>
  <text x="509" y="343" text-anchor="middle" font-size="10.5" fill="#2b6e9e">（i = 2, 2, 0）完全一致</text>

  <g filter="url(#sk)">
    <rect x="46" y="370" width="548" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="391" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">k = 1, 2 都卡在 popcount：5 = 101<tspan dy="4" font-size="9">2</tspan><tspan dy="-4">、7 = 111</tspan><tspan dy="4" font-size="9">2</tspan><tspan dy="-4"> 置位太多，</tspan></text>
  <text x="320" y="410" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">而 9 = 1001<tspan dy="4" font-size="9">2</tspan><tspan dy="-4"> 一到 k = 3 就把两个条件全过了</tspan></text>

  <g filter="url(#sk)">
    <rect x="46" y="432" width="548" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="452" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">num2 &lt; 0 时 S 随 k 递增，但 popcount(S) ≤ 36 对 k = 36 恒成立，</text>
  <text x="320" y="470" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">所以答案一定在很小的 k 处出现——枚举天然有界</text>
</svg>
