<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="540" height="300" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333">算法流程：一趟扫描 + 哈希集合</text>

  <rect x="140" y="46" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="71" text-anchor="middle" font-size="12" fill="#333">S ← 空集合；i 从 0 到 n−1</text>
  <path d="M270,86 L270,110" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,110 400,138 270,166 140,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="#333">nums[i] ≠ target[i] ?</text>
  <text x="270" y="152" text-anchor="middle" font-size="10" fill="#b85450">是 → S 插入 nums[i]</text>

  <path d="M270,166 L270,192" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="192" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="217" text-anchor="middle" font-size="12" fill="#333">扫描结束：返回 |S|</text>

  <text x="270" y="264" text-anchor="middle" font-size="12" fill="#666">时间 O(n)，空间 O(min(n, 值域))</text>
  <text x="270" y="284" text-anchor="middle" font-size="11" fill="#888">不模拟操作、不排序、不关心顺序</text>
</svg>
