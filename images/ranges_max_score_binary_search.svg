<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrAxis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：最大化最小值 → 二分答案</text>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例：start = [6,0,3]，d = 2 → 排序得 [0,3,6]，区间与选点如下</text>

  <text x="120" y="74" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">区间 [0,2]</text>
  <text x="270" y="74" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">区间 [3,5]</text>
  <text x="420" y="74" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">区间 [6,8]</text>

  <rect x="70" y="82" width="100" height="16" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="220" y="82" width="100" height="16" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="370" y="82" width="100" height="16" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <path d="M 48 150 L 505 150" stroke="#999" stroke-width="1.5" marker-end="url(#arrAxis)" filter="url(#rough2)"/>
  <line x1="70" y1="143" x2="70" y2="157" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="120" y1="143" x2="120" y2="157" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="170" y1="143" x2="170" y2="157" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="220" y1="143" x2="220" y2="157" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="270" y1="143" x2="270" y2="157" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="320" y1="143" x2="320" y2="157" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="370" y1="143" x2="370" y2="157" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="420" y1="143" x2="420" y2="157" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="470" y1="143" x2="470" y2="157" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="173" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">0</text>
  <text x="120" y="173" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="170" y="173" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="220" y="173" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="270" y="173" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4</text>
  <text x="320" y="173" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">5</text>
  <text x="370" y="173" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">6</text>
  <text x="420" y="173" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">7</text>
  <text x="470" y="173" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">8</text>

  <path d="M 84 124 L 254 124" stroke="#4a7a3a" stroke-width="1.5" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="169" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">差 = 4 ≥ x</text>
  <path d="M 284 124 L 454 124" stroke="#4a7a3a" stroke-width="1.5" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="369" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">差 = 4 ≥ x</text>

  <circle cx="70" cy="150" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="270" cy="150" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="470" cy="150" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="70" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="270" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="470" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>

  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">排序后：两两最小差 = 相邻最小差，只需检查相邻选点</text>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">从小到大判定：能否让所有相邻差都 ≥ x ？</text>
  <text x="64" y="285" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">x =</text>

  <rect x="80" y="262" width="42" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="124" y="262" width="42" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="168" y="262" width="42" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="212" y="262" width="42" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="256" y="262" width="42" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="300" y="262" width="42" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="344" y="262" width="42" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="388" y="262" width="42" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="432" y="262" width="42" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="101" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="145" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="189" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="233" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="277" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="321" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="365" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="409" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="453" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>

  <text x="101" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="145" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="189" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="233" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="277" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="321" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="365" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="409" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="453" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <path d="M 330 310 Q 295 310 282 300" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = 最大的可行 x = 4</text>

  <rect x="90" y="336" width="380" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="355" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">可行性随 x 单调（可行 ⇒ 更小必可行）⇒ 二分最大可行 x</text>
</svg>
