<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="340" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算："02:30" → "04:35"（diff = 125）</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- op labels above arrows -->
  <text x="170" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">+60 分钟</text>
  <text x="340" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">+60 分钟</text>
  <text x="500" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">+5 分钟</text>

  <!-- timeline states -->
  <g filter="url(#sk)">
    <rect x="40" y="78" width="90" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="85" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">02:30</text>
  <g filter="url(#sk)">
    <rect x="210" y="78" width="90" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="255" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">03:30</text>
  <g filter="url(#sk)">
    <rect x="380" y="78" width="90" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="425" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">04:30</text>
  <g filter="url(#sk)">
    <rect x="510" y="78" width="90" height="46" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="555" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">04:35</text>

  <!-- arrows -->
  <path d="M 134 101 L 204 101" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 304 101 L 374 101" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 474 101 L 504 101" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step counts -->
  <text x="170" y="142" text-anchor="middle" font-size="11" fill="#888">1 步</text>
  <text x="340" y="142" text-anchor="middle" font-size="11" fill="#888">1 步</text>
  <text x="490" y="142" text-anchor="middle" font-size="11" fill="#888">1 步</text>

  <!-- decomposition -->
  <text x="320" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">贪心分解：125 = 2×60 + 0×15 + 1×5 + 0×1</text>
  <g filter="url(#sk)">
    <rect x="40" y="186" width="130" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="105" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">+60 × 2 枚</text>
  <g filter="url(#sk)">
    <rect x="185" y="186" width="130" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="250" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">+15 × 0 枚</text>
  <g filter="url(#sk)">
    <rect x="330" y="186" width="130" height="46" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="395" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">+5 × 1 枚</text>
  <g filter="url(#sk)">
    <rect x="475" y="186" width="130" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="540" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#a03a36">+1 × 0 枚</text>

  <text x="320" y="266" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">答案 = 2 + 0 + 1 + 0 = 3 ✓</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="60" y="288" width="520" height="30" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="308" text-anchor="middle" font-size="11.5" fill="#888">剩余 125 → 取 2 枚 60（剩 5）→ 取 0 枚 15（剩 5）→ 取 1 枚 5（剩 0）→ 结束</text>
</svg>
