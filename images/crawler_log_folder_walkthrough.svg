<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 走查：五条日志的深度轨迹</text>
  <path d="M 175 40 Q 320 47 465 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <path d="M 112 306 L 110 272" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 94 238 L 70 200" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 126 238 L 190 200" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="62" y="308" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="112" y="330" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#sk)">主文件夹</text>
  <g filter="url(#sk)">
    <rect x="76" y="240" width="66" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="109" y="260" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#sk)">d1</text>
  <g filter="url(#sk)">
    <rect x="36" y="168" width="66" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="69" y="188" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#sk)">d2</text>
  <g filter="url(#sk)">
    <rect x="160" y="168" width="72" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="196" y="188" text-anchor="middle" font-size="12" fill="#b57a20" font-weight="bold" filter="url(#sk)">d21</text>
  <text x="196" y="158" text-anchor="middle" font-size="10" fill="#b57a20" filter="url(#sk)">← 当前位置</text>

  <path d="M 88 304 Q 79 288 88 274" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
