  <path d="M 98 202 Q 110 220 100 236" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="116" y="222" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">3</text>
  <path d="M 128 236 Q 160 216 188 202" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <text x="148" y="208" font-size="11" fill="#b57a20" font-weight="bold" filter="url(#sk)">4</text>
  <path d="M 234 175 C 258 166 260 196 234 189" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="252" y="210" font-size="11" fill="#4a8edb" font-weight="bold" filter="url(#sk)">5</text>
  <text x="140" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">文件夹树：编号为日志顺序，橙框为最终位置</text>

