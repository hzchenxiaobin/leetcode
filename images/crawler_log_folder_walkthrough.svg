  <path d="M 308 320 L 614 320" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="310" y="90" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">depth</text>
  <path d="M 310 260 L 606 260" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 310 200 L 606 200" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <text x="300" y="324" text-anchor="end" font-size="10" fill="#777" filter="url(#sk)">0</text>
  <text x="300" y="264" text-anchor="end" font-size="10" fill="#777" filter="url(#sk)">1</text>
  <text x="300" y="204" text-anchor="end" font-size="10" fill="#777" filter="url(#sk)">2</text>

  <path d="M 340 320 L 392 260" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <path d="M 392 260 L 444 200" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <path d="M 444 200 L 496 260" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <path d="M 496 260 L 548 200" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <path d="M 548 200 L 600 200" stroke="#4a8edb" stroke-width="2.5" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>

  <circle cx="340" cy="320" r="4" fill="#888" filter="url(#sk)"/>
  <circle cx="392" cy="260" r="4" fill="#d6a040" filter="url(#sk)"/>
  <circle cx="444" cy="200" r="4" fill="#d6a040" filter="url(#sk)"/>
  <circle cx="496" cy="260" r="4" fill="#4a7a3a" filter="url(#sk)"/>
  <circle cx="548" cy="200" r="4" fill="#d6a040" filter="url(#sk)"/>
  <circle cx="600" cy="200" r="8" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="2 3" filter="url(#sk)"/>
  <circle cx="600" cy="200" r="5" fill="#b85450" filter="url(#sk)"/>

  <text x="392" y="252" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#sk)">1</text>
  <text x="444" y="192" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#sk)">2</text>
  <text x="496" y="252" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#sk)">1</text>
  <text x="548" y="192" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#sk)">2</text>
  <text x="600" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#sk)">2</text>
  <text x="574" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#sk)">最终 depth = 2</text>

  <text x="340" y="344" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">开始</text>
  <text x="392" y="344" text-anchor="middle" font-size="11" fill="#b57a20" font-weight="bold" filter="url(#sk)">d1/</text>
  <text x="444" y="344" text-anchor="middle" font-size="11" fill="#b57a20" font-weight="bold" filter="url(#sk)">d2/</text>
  <text x="496" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">../</text>
  <text x="548" y="344" text-anchor="middle" font-size="11" fill="#b57a20" font-weight="bold" filter="url(#sk)">d21/</text>
  <text x="600" y="344" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold" filter="url(#sk)">./</text>

  <g filter="url(#sk)">
    <rect x="40" y="366" width="560" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="390" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#sk)">最终 depth = 2 → 返回主文件夹最少需要 2 步 ✓</text>
</svg>
