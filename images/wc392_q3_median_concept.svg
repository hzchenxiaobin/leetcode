<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：终态三段刻画，逐位独立定价</text>

  <!-- ① trap panel -->
  <text x="40" y="56" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">① 陷阱：只把中位下标改成 k 不够 —— 中位数是全序约束</text>

  <g filter="url(#rough2)">
    <rect x="48" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="68" y="88" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="94" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="114" y="88" text-anchor="middle" font-size="13" fill="#333">5</text>
    <rect x="140" y="68" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="160" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">5</text>
    <rect x="186" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="206" y="88" text-anchor="middle" font-size="13" fill="#333">6</text>
    <rect x="232" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="252" y="88" text-anchor="middle" font-size="13" fill="#333">8</text>
  </g>
  <text x="160" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">排序后 a = [2,5,5,6,8]，m = 2</text>

  <path d="M 280 83 L 330 83" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">a[2]: 5 → 4</text>

  <g filter="url(#rough2)">
    <rect x="340" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="360" y="88" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="386" y="68" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="406" y="88" text-anchor="middle" font-size="13" fill="#b85450">4</text>
    <rect x="432" y="68" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="452" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">5</text>
    <rect x="478" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="498" y="88" text-anchor="middle" font-size="13" fill="#333">6</text>
    <rect x="524" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="544" y="88" text-anchor="middle" font-size="13" fill="#333">8</text>
  </g>
  <text x="452" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">重排后中位数仍是 5 ✗（左边的 5 顶上来）</text>

  <!-- ② segment picture -->
  <text x="40" y="150" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 终态刻画：排序后 左半 ≤ k，中位 = k，右半 ≥ k（m = n/2）</text>

  <g filter="url(#rough2)">
    <rect x="80" y="172" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="100" y="192" text-anchor="middle" font-size="10" fill="#446688">≤ k</text>
    <rect x="126" y="172" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="146" y="192" text-anchor="middle" font-size="10" fill="#446688">≤ k</text>
    <rect x="172" y="172" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="192" y="192" text-anchor="middle" font-size="10" fill="#446688">≤ k</text>
    <rect x="218" y="172" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="238" y="192" text-anchor="middle" font-size="10" fill="#446688">≤ k</text>
    <rect x="264" y="172" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="284" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">= k</text>
    <rect x="310" y="172" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="330" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">≥ k</text>
    <rect x="356" y="172" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="376" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">≥ k</text>
    <rect x="402" y="172" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="422" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">≥ k</text>
  </g>

  <!-- action arrows above cells -->
  <g filter="url(#rough2)">
    <path d="M 238 162 L 238 170" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="238" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">压</text>
    <text x="284" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">钉</text>
    <path d="M 330 170 L 330 162" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <path d="M 326 166 L 330 160 L 334 166" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <text x="330" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a">抬</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <text x="169" y="228" font-size="10" font-weight="bold" fill="#446688">左半（i &lt; m）：终值 ≤ k</text>
    <text x="169" y="246" font-size="9.5" fill="#b85450">超标者（原值 &gt; k）压到恰好 k</text>
    <text x="284" y="228" font-size="10" font-weight="bold" fill="#d6a040">中位（i = m）：终值 = k</text>
    <text x="284" y="246" font-size="9.5" fill="#d6a040">钉死：代价 |a[m] − k|</text>
    <text x="371" y="228" font-size="10" font-weight="bold" fill="#4a7a3a">右半（i &gt; m）：终值 ≥ k</text>
    <text x="371" y="246" font-size="9.5" fill="#4a7a3a">不足者（原值 &lt; k）抬到恰好 k</text>
  </g>

  <!-- ③ pricing boxes -->
  <g filter="url(#rough2)">
    <rect x="40" y="264" width="176" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="128" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">左半（i &lt; m）</text>
    <text x="128" y="304" text-anchor="middle" font-size="11" fill="#333">cost = max(0, a[i] − k)</text>
    <text x="128" y="322" text-anchor="middle" font-size="9.5" fill="#777">原值 ≤ k 的位置白嫖</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="222" y="264" width="176" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="310" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040">中位（i = m）</text>
    <text x="310" y="304" text-anchor="middle" font-size="11" fill="#333">cost = |a[m] − k|</text>
    <text x="310" y="322" text-anchor="middle" font-size="9.5" fill="#777">恰好钉在 k，一分不多</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="404" y="264" width="176" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="492" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">右半（i &gt; m）</text>
    <text x="492" y="304" text-anchor="middle" font-size="11" fill="#333">cost = max(0, k − a[i])</text>
    <text x="492" y="322" text-anchor="middle" font-size="9.5" fill="#777">原值 ≥ k 的位置白嫖</text>
  </g>

  <text x="310" y="354" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">三段最优终值 min(a[i],k) / k / max(a[i],k) 拼接后仍有序 → 逐位最优可同时取到，直接求和</text>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="40" y="366" width="540" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="310" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">ans = |a[m] − k| + Σ max(0, a[i] − k) [i &lt; m] + Σ max(0, k − a[i]) [i &gt; m]</text>
    <text x="310" y="412" text-anchor="middle" font-size="10" fill="#b85450">⚠️ 偶数长度取较大中位数 ⇒ m = n/2（不是 n/2 − 1）</text>
    <text x="310" y="430" text-anchor="middle" font-size="10" fill="#b85450">⚠️ 答案上界 ≈ 2×10⁵ × 10⁹ = 2×10¹⁴ → C++/Java 用 long long</text>
  </g>
</svg>
