<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：分组 → 转分钟 → 排序 → 扫描相邻三元组</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 分组 -->
  <g filter="url(#sk)"><rect x="190" y="50" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="68" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#sk)">遍历 access_times，按姓名哈希分组</text>
  <text x="320" y="86" text-anchor="middle" font-size="11" fill="#33507a" font-family="monospace" filter="url(#sk)">g[姓名].append(HH × 60 + MM)</text>
  <path d="M 320 94 L 320 106" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 取员工并排序 -->
  <g filter="url(#sk)"><rect x="190" y="108" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="126" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#sk)">取下一位员工</text>
  <text x="320" y="142" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#sk)">其分钟列表排序为 ts</text>
  <path d="M 320 148 L 320 160" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形①：存在同窗三元组？ -->
  <g filter="url(#sk)"><polygon points="320,164 475,212 320,260 165,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">存在同窗的相邻三元组？</text>
  <text x="320" y="226" text-anchor="middle" font-size="11" fill="#7a5a10" font-family="monospace" filter="url(#sk)">ts[i] − ts[i−2] &lt; 60，i ∈ [2, m−1]</text>

  <!-- 是 → 加入答案 -->
  <path d="M 475 212 L 505 212" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="488" y="202" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="507" y="192" width="118" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="566" y="207" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">高访问员工</text>
  <text x="566" y="224" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-family="monospace" filter="url(#sk)">name → ans，break</text>
  <path d="M 566 192 L 566 128 L 456 128" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="528" y="118" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">下一位员工</text>

  <!-- 否 ↓ -->
  <path d="M 320 260 L 320 286" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="333" y="278" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <!-- 菱形②：还有员工？ -->
  <g filter="url(#sk)"><polygon points="320,290 452,336 320,382 188,336" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#sk)">还有员工未判定？</text>

  <!-- 是 → 左回环 -->
  <path d="M 188 336 L 96 336 L 96 128 L 184 128" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="168" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <text x="106" y="232" font-size="10" fill="#666" filter="url(#sk)">继续</text>

  <!-- 否 → 返回 -->
  <path d="M 452 336 L 486 336" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="488" y="316" width="140" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="558" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">ans 字典序排序</text>
  <text x="558" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">返回名单</text>

  <!-- 说明框 -->
  <g filter="url(#sk)"><rect x="60" y="400" width="560" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="340" y="422" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">① 记录不足 3 条的员工，扫描循环不执行，自然判「否」，无需特判</text>
  <text x="340" y="442" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">② 判定是存在性的：任一相邻三元组命中即 break，不必数出具体次数</text>
</svg>
