<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="15" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b">示例 2 演算 —— nums = [5,3,1,9,10]，maxDiff = 2</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="62" y="80" width="220" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="172" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">排序位 0 1 2：值 1 3 5</text>
  <text x="172" y="122" text-anchor="middle" font-size="9.5" fill="#444">原下标 2 1 0 —— 分量 0</text>
  <g filter="url(#sk)"><rect x="302" y="80" width="140" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="372" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5b84">排序位 3 4：值 9 10</text>
  <text x="372" y="122" text-anchor="middle" font-size="9.5" fill="#444">原下标 3 4 —— 分量 1</text>
  <g filter="url(#sk)"><path d="M 292 84 L 298 136" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="295" y="156" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b85450">断口 4&gt;2</text>
  <g filter="url(#sk)"><rect x="462" y="80" width="140" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="532" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">far = [1,2,2,4,4]</text>
  <text x="532" y="122" text-anchor="middle" font-size="9.5" fill="#444">pos = [2,1,0,3,4]</text>

  <g filter="url(#sk)"><rect x="42" y="168" width="60" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="72" y="188" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b5b84">查询[0,1]</text>
  <text x="116" y="182" font-size="10" fill="#444">节点0 → 排序位 2；节点1 → 排序位 1；交换成 (p,q)=(1,2)</text>
  <text x="116" y="196" font-size="10" fill="#444">far[1] = 2 ≥ q=2 → 直达</text>
  <g filter="url(#sk)"><rect x="542" y="168" width="56" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="570" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>

  <g filter="url(#sk)"><rect x="42" y="208" width="60" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="72" y="227" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b5b84">查询[0,2]</text>
  <text x="72" y="242" text-anchor="middle" font-size="8.5" fill="#446688">主角登场</text>
  <text x="116" y="222" font-size="10" fill="#444">节点0 → 排序位 2；节点2 → 排序位 0；交换成 (p,q)=(0,2)</text>
  <text x="116" y="236" font-size="10" fill="#444">far[0]=1 &lt; 2 → 跳到 1（s=1）；far[1]=2 ≥ 2 → 直达</text>
  <g filter="url(#sk)"><path d="M 130 248 Q 136 254 142 248" stroke="#4a7a3a" stroke-width="1.4" fill="none"/></g>
  <text x="116" y="250" font-size="9" fill="#888">路径：值 1 → 3 → 5（节点 2 → 1 → 0）</text>
  <g filter="url(#sk)"><rect x="542" y="208" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="570" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2</text>

  <g filter="url(#sk)"><rect x="42" y="266" width="60" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="72" y="286" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b5b84">查询[2,3]</text>
  <text x="116" y="280" font-size="10" fill="#444">节点2 在分量 0（值 1），节点3 在分量 1（值 9）</text>
  <text x="116" y="294" font-size="10" fill="#444">跨断口，无路可走</text>
  <g filter="url(#sk)"><rect x="542" y="266" width="56" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="570" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33">−1</text>

  <g filter="url(#sk)"><rect x="42" y="310" width="60" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="72" y="330" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b5b84">查询[4,3]</text>
  <text x="116" y="324" font-size="10" fill="#444">节点4 → 排序位 4；节点3 → 排序位 3；交换成 (p,q)=(3,4)</text>
  <text x="116" y="338" font-size="10" fill="#444">far[3] = 4 ≥ q=4 → 直达（|9−10|=1 ≤ 2）</text>
  <g filter="url(#sk)"><rect x="542" y="310" width="56" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="570" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>

  <g filter="url(#sk)">
    <rect x="42" y="364" width="560" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="322" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">输出 [1, 2, −1, 1] ✓（与 BFS 实测一致）</text>
  <text x="322" y="418" text-anchor="middle" font-size="10.5" fill="#444">查询 [0,2] 正是「贪心跳跃 + 倍增」的价值所在：值 1 与 5 差 4 &gt; 2 不能直达，</text>
  <text x="322" y="438" text-anchor="middle" font-size="10.5" fill="#444">必须在值 3 落脚一次；若误用 ⌈4/2⌉=2 碰巧也对，但换组数据就会虚构不存在的落脚点</text>
</svg>
