<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两种合法切割：直径（过圆心）与半径（圆心到圆上）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">一条直径切出 2 份扇形；一条半径只把边界「开一个口」，单独一条切不开圆</text>

  <g filter="url(#rough2)">
    <circle cx="150" cy="170" r="90" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)">
    <line x1="60" y1="170" x2="240" y2="170" stroke="#b85450" stroke-width="2.6"/>
    <line x1="150" y1="80" x2="150" y2="260" stroke="#b85450" stroke-width="2.6"/>
  </g>
  <g filter="url(#rough2)">
    <ellipse cx="150" cy="170" rx="5" ry="5" fill="#d6a040"/>
  </g>
  <text x="150" y="292" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2 条直径 → 4 等分</text>
  <text x="150" y="310" text-anchor="middle" font-size="10.5" fill="#555">n 偶：n/2 条直径，每条贡献 2 份</text>

  <g filter="url(#rough2)">
    <circle cx="410" cy="170" r="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)">
    <line x1="410" y1="170" x2="410" y2="80" stroke="#b85450" stroke-width="2.6"/>
    <line x1="410" y1="170" x2="488" y2="215" stroke="#b85450" stroke-width="2.6"/>
    <line x1="410" y1="170" x2="332" y2="215" stroke="#b85450" stroke-width="2.6"/>
  </g>
  <g filter="url(#rough2)">
    <ellipse cx="410" cy="170" rx="5" ry="5" fill="#d6a040"/>
  </g>
  <text x="410" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3 条半径 → 3 等分</text>
  <text x="410" y="310" text-anchor="middle" font-size="10.5" fill="#555">n 奇：直径必成对（2 份），凑不出奇数份</text>

  <rect x="60" y="330" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">奇数等分只能用半径：n 条半径把圆周分成 n 段弧 → n 个相等扇形</text>
  <text x="280" y="368" text-anchor="middle" font-size="10.5" fill="#555">混合切割（直径 + 半径）不会更省：直径省在「一条顶两条」，奇数时无用武之地</text>

  <text x="280" y="62" text-anchor="middle" font-size="10" fill="#999">黄点为圆心；红线为切割线段</text>
</svg>
