<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  <rect width="560" height="470" fill="#fafafa" filter="url(#rough2)"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">算法流程：一次点击 = 一次 BFS 洪泛</text>
  <rect x="200" y="44" width="160" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280.0" y="67.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">点击 (r, c)</text>
  <path d="M280,82 L280,110" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="168,148 280,112 392,148 280,184" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="152.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">board[r][c] == 'M' ?</text>
  <path d="M392,148 L430,148" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="128" width="112" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="486.0" y="151.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">置 'X' 并返回</text>
  <text x="410" y="142" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M280,184 L280,210" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="202" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="176" y="210" width="208" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280.0" y="235.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">统计 8 邻域地雷数 cnt</text>
  <path d="M280,252 L280,276" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="184,312 280,276 376,312 280,348" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="316.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cnt == 0 ?</text>
  <path d="M376,312 L428,312" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="428" y="292" width="116" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="486.0" y="309.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">置数字 cnt</text>
  <text x="486.0" y="326.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">停止扩散</text>
  <text x="402" y="306" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M280,348 L280,376" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="368" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="110" y="376" width="340" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280.0" y="395.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">置 'B'，把 8 邻域中未访问的 'E' 入队</text>
  <text x="280.0" y="412.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">（这些格子稍后继续判定）</text>
  <path d="M110,399 L64,399 L64,231 L172,231" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="448" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">只有 cnt == 0 才继续扩散；数字格是洪泛的终止边界，M 永不入队</text>
</svg>
