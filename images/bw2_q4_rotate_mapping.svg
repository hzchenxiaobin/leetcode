<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">数位旋转 180° 的映射表</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只有 5 个数位旋转后仍合法；含其余数位的数不可能是易混淆数</text>

  <text x="184" y="70" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">旋转后仍合法（5 个）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="78" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="102" y="78" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="164" y="78" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="226" y="78" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="288" y="78" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="17" text-anchor="middle" font-weight="bold">
    <text x="68" y="100" fill="#3a4a66">0</text>
    <text x="130" y="100" fill="#3a4a66">1</text>
    <text x="192" y="100" fill="#3a4a66">6</text>
    <text x="254" y="100" fill="#3a4a66">8</text>
    <text x="316" y="100" fill="#3a4a66">9</text>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="68" y="114">↻ 180°</text>
    <text x="130" y="114">↻ 180°</text>
    <text x="192" y="114">↻ 180°</text>
    <text x="254" y="114">↻ 180°</text>
    <text x="316" y="114">↻ 180°</text>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="68" y="130" fill="#2a5a20">0</text>
    <text x="130" y="130" fill="#2a5a20">1</text>
    <text x="192" y="130" fill="#2a5a20">9</text>
    <text x="254" y="130" fill="#2a5a20">8</text>
    <text x="316" y="130" fill="#2a5a20">6</text>
  </g>

  <text x="462" y="70" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">旋转后无效（5 个）</text>
  <g filter="url(#rough2)">
    <rect x="386" y="78" width="32" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <rect x="422" y="78" width="32" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <rect x="458" y="78" width="32" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <rect x="494" y="78" width="32" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <rect x="530" y="78" width="26" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle" font-weight="bold">
    <text x="402" y="102" fill="#8a3a36">2</text>
    <text x="438" y="102" fill="#8a3a36">3</text>
    <text x="474" y="102" fill="#8a3a36">4</text>
    <text x="510" y="102" fill="#8a3a36">5</text>
    <text x="543" y="102" fill="#8a3a36">7</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#8a3a36">
    <text x="402" y="120">✗</text>
    <text x="438" y="120">✗</text>
    <text x="474" y="120">✗</text>
    <text x="510" y="120">✗</text>
    <text x="543" y="120">✗</text>
  </g>

  <rect x="40" y="156" width="516" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="298" y="178" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">整个数旋转 180° = 数位倒序 + 逐位映射（以 16 为例）</text>
  <g filter="url(#rough2)">
    <rect x="120" y="190" width="30" height="30" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="152" y="190" width="30" height="30" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="250" y="190" width="30" height="30" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="282" y="190" width="30" height="30" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="380" y="190" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="412" y="190" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="135" y="210" fill="#333">1</text>
    <text x="167" y="210" fill="#333">6</text>
    <text x="265" y="210" fill="#333">6</text>
    <text x="297" y="210" fill="#333">1</text>
    <text x="395" y="210" fill="#3a4a66">9</text>
    <text x="427" y="210" fill="#3a4a66">1</text>
  </g>
  <path d="M 192 205 L 244 205" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="198" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">倒序</text>
  <path d="M 322 205 L 374 205" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="198" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">映射</text>
  <text x="484" y="210" text-anchor="middle" font-size="13" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">= 91</text>
  <text x="298" y="240" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">rot(16) = 91 ≠ 16，所以 16 是易混淆数</text>

  <rect x="40" y="278" width="250" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="165" y="300" text-anchor="middle" font-size="11.5" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">例：10 旋转后是 01 = 1</text>
  <text x="165" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">数位 (1)(0) → 倒序 (0)(1) → 映射 (0)(1)</text>
  <text x="165" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">前导零在数值中消失 → 旋转结果 = 1</text>
  <text x="165" y="368" text-anchor="middle" font-size="11" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">1 ≠ 10 → 10 是易混淆数 ✓</text>

  <rect x="310" y="278" width="246" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="433" y="300" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">例：69 旋转后还是 69</text>
  <text x="433" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">数位 (6)(9) → 倒序 (9)(6) → 映射 (6)(9)</text>
  <text x="433" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">(6 与 9 互换后恰好还原)</text>
  <text x="433" y="368" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">69 = 69 → 不是易混淆数 ✗（中心对称数）</text>
</svg>
