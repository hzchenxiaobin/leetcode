<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：nums = [4,2,3,1] 的分组与试算</text>

  <!-- 三组 -->
  <rect x="40" y="56" width="130" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="105" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">组 0（%3=0）</text>
  <rect x="60" y="86" width="40" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="112" y="106" font-size="10" fill="#999" filter="url(#rough2)">只有 1 个</text>
  <text x="105" y="134" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">模式 A 不可行</text>

  <rect x="184" y="56" width="150" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="259" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">组 1（%3=1）</text>
  <rect x="204" y="86" width="40" height="30" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="224" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="252" y="86" width="40" height="30" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="272" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="259" y="134" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">模式 B 不可行</text>

  <rect x="348" y="56" width="130" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="413" y="76" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">组 2（%3=2）</text>
  <rect x="368" y="86" width="40" height="30" fill="#fff" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="388" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="420" y="106" font-size="10" fill="#999" filter="url(#rough2)">只有 1 个</text>
  <text x="413" y="134" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">模式 C 不可行</text>

  <!-- 模式 D -->
  <path d="M105,150 L105,166 L413,166 L413,150" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="130" y="180" width="256" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="258" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">模式 D：3 + 4 + 2 = 9 ✓</text>

  <!-- 结果 -->
  <path d="M258,226 L258,248" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrQ)" filter="url(#rough2)"/>
  <text x="258" y="272" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">ans = 9</text>

  <text x="420" y="206" font-size="10" fill="#999" filter="url(#rough2)">9 % 3 = 0</text>
</svg>
