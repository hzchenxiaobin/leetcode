<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：num = 3, t = 2，x = 7 两步收敛</text>
  <path d="M 190 42 Q 340 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: initial -->
  <text x="100" y="108" font-size="12" font-weight="bold" fill="#2b2b2b">初始</text>
  <g filter="url(#sk)">
    <line x1="130" y1="120" x2="580" y2="120" stroke="#aaa" stroke-width="1.3"/>
    <line x1="170" y1="113" x2="170" y2="127" stroke="#888" stroke-width="1"/>
    <line x1="270" y1="113" x2="270" y2="127" stroke="#888" stroke-width="1"/>
    <line x1="370" y1="113" x2="370" y2="127" stroke="#888" stroke-width="1"/>
    <line x1="470" y1="113" x2="470" y2="127" stroke="#888" stroke-width="1"/>
    <line x1="570" y1="113" x2="570" y2="127" stroke="#888" stroke-width="1"/>
  </g>
  <text x="170" y="143" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="270" y="143" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="370" y="143" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="470" y="143" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="570" y="143" text-anchor="middle" font-size="10" fill="#888">7</text>
  <g filter="url(#sk)"><circle cx="170" cy="120" r="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="170" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">num=3</text>
  <g filter="url(#sk)"><circle cx="570" cy="120" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="570" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">x=7</text>
  <g filter="url(#sk)">
    <path d="M 170 78 Q 370 62 570 78" stroke="#4a7a3a" stroke-width="1.5" fill="none"/>
  </g>
  <text x="370" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">d = 4 = 2t</text>

  <!-- Arrow down -->
  <g filter="url(#sk)">
    <path d="M 610 160 Q 625 185 615 210" stroke="#7a5415" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="633" y="188" font-size="10" fill="#7a5415">x−1, num+1</text>

  <!-- Row 2: after op 1 -->
  <text x="80" y="238" font-size="12" font-weight="bold" fill="#2b2b2b">操作 1</text>
  <g filter="url(#sk)">
    <line x1="130" y1="250" x2="580" y2="250" stroke="#aaa" stroke-width="1.3"/>
    <line x1="170" y1="243" x2="170" y2="257" stroke="#888" stroke-width="1"/>
    <line x1="270" y1="243" x2="270" y2="257" stroke="#888" stroke-width="1"/>
    <line x1="370" y1="243" x2="370" y2="257" stroke="#888" stroke-width="1"/>
    <line x1="470" y1="243" x2="470" y2="257" stroke="#888" stroke-width="1"/>
    <line x1="570" y1="243" x2="570" y2="257" stroke="#888" stroke-width="1"/>
  </g>
  <text x="170" y="273" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="270" y="273" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="370" y="273" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="470" y="273" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="570" y="273" text-anchor="middle" font-size="10" fill="#888">7</text>
  <g filter="url(#sk)"><circle cx="270" cy="250" r="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="270" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">num=4</text>
  <g filter="url(#sk)"><circle cx="470" cy="250" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="470" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">x=6</text>
  <g filter="url(#sk)">
    <path d="M 270 208 Q 370 192 470 208" stroke="#4a7a3a" stroke-width="1.5" fill="none"/>
  </g>
  <text x="370" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">d = 2</text>

  <!-- Arrow down -->
  <g filter="url(#sk)">
    <path d="M 610 290 Q 625 315 615 340" stroke="#7a5415" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="633" y="318" font-size="10" fill="#7a5415">x−1, num+1</text>

  <!-- Row 3: after op 2, meet -->
  <text x="80" y="368" font-size="12" font-weight="bold" fill="#2b2b2b">操作 2</text>
  <g filter="url(#sk)">
    <line x1="130" y1="380" x2="580" y2="380" stroke="#aaa" stroke-width="1.3"/>
    <line x1="170" y1="373" x2="170" y2="387" stroke="#888" stroke-width="1"/>
    <line x1="270" y1="373" x2="270" y2="387" stroke="#888" stroke-width="1"/>
    <line x1="370" y1="373" x2="370" y2="387" stroke="#888" stroke-width="1"/>
    <line x1="470" y1="373" x2="470" y2="387" stroke="#888" stroke-width="1"/>
    <line x1="570" y1="373" x2="570" y2="387" stroke="#888" stroke-width="1"/>
  </g>
  <text x="170" y="403" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="270" y="403" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="370" y="403" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="470" y="403" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="570" y="403" text-anchor="middle" font-size="10" fill="#888">7</text>
  <g filter="url(#sk)">
    <circle cx="368" cy="380" r="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.5"/>
    <circle cx="372" cy="380" r="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.5"/>
  </g>
  <text x="370" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">x = num = 5，d = 0 ✓</text>

  <!-- Conclusion box -->
  <g filter="url(#sk)">
    <rect x="40" y="20" width="0" height="0" fill="none"/>
  </g>
  <text x="340" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">初始差值恰为 2t = 4，t 步内归零 → x = num + 2t = 7 可达成且最大</text>
</svg>
