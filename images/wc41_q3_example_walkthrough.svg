<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="880" height="480" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：check(12.75) 在 j = 5 处命中，差值恰为 0</text>
  <path d="M 240 42 Q 440 50 640 42" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- ===== Panel A ===== -->
  <text x="70" y="70" font-size="14.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">① 整体平移：b[i] = a[i] − x（nums = [1,12,−5,−6,50,3]，k = 4，x = 12.75）</text>

  <g filter="url(#rough2)">
    <rect x="150" y="88" width="88" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="242" y="88" width="88" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="334" y="88" width="88" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="426" y="88" width="88" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="518" y="88" width="88" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="610" y="88" width="88" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>

    <text x="194" y="118" text-anchor="middle" font-size="13" fill="#2b4a6e">1</text>
    <text x="286" y="118" text-anchor="middle" font-size="13" fill="#2b4a6e">12</text>
    <text x="378" y="118" text-anchor="middle" font-size="13" fill="#2b4a6e">−5</text>
    <text x="470" y="118" text-anchor="middle" font-size="13" fill="#2b4a6e">−6</text>
    <text x="562" y="118" text-anchor="middle" font-size="13" fill="#2b4a6e">50</text>
    <text x="654" y="118" text-anchor="middle" font-size="13" fill="#2b4a6e">3</text>

    <rect x="150" y="142" width="88" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <rect x="242" y="142" width="88" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="334" y="142" width="88" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="426" y="142" width="88" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="518" y="142" width="88" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="610" y="142" width="88" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>

    <text x="194" y="172" text-anchor="middle" font-size="13" fill="#666">−11.75</text>
    <text x="286" y="172" text-anchor="middle" font-size="13" fill="#2b5a2b">−0.75</text>
    <text x="378" y="172" text-anchor="middle" font-size="13" fill="#2b5a2b">−17.75</text>
    <text x="470" y="172" text-anchor="middle" font-size="13" fill="#2b5a2b">−18.75</text>
    <text x="562" y="172" text-anchor="middle" font-size="13" fill="#2b5a2b">37.25</text>
    <text x="654" y="172" text-anchor="middle" font-size="13" fill="#666">−9.75</text>

    <text x="194" y="204" text-anchor="middle" font-size="10.5" fill="#999">0</text>
    <text x="286" y="204" text-anchor="middle" font-size="10.5" fill="#999">1</text>
    <text x="378" y="204" text-anchor="middle" font-size="10.5" fill="#999">2</text>
    <text x="470" y="204" text-anchor="middle" font-size="10.5" fill="#999">3</text>
    <text x="562" y="204" text-anchor="middle" font-size="10.5" fill="#999">4</text>
    <text x="654" y="204" text-anchor="middle" font-size="10.5" fill="#999">5</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 242 216 v 10 h 176 v -10" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <text x="330" y="246" text-anchor="middle" font-size="11.5" fill="#3a6e3a">这一段和 = −0.75−17.75−18.75+37.25 = 0</text>
  </g>

  <!-- ===== Panel B ===== -->
  <text x="70" y="282" font-size="14.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">② 扫描 j = 4,5,6：比较 pre[j] 与窗口内最小前缀</text>

  <g filter="url(#rough2)">
    <rect x="80" y="296" width="720" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="80" y="336" width="720" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="376" width="720" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="80" y="416" width="720" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>

    <path d="M 160 296 L 160 456" stroke="#446688" stroke-width="1.2" fill="none"/>
    <path d="M 290 296 L 290 456" stroke="#446688" stroke-width="1.2" fill="none"/>
    <path d="M 510 296 L 510 456" stroke="#446688" stroke-width="1.2" fill="none"/>
    <path d="M 650 296 L 650 456" stroke="#446688" stroke-width="1.2" fill="none"/>

    <text x="120" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">j</text>
    <text x="225" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">pre[j]</text>
    <text x="400" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">min{ pre[0..j−k] }</text>
    <text x="580" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">pre[j] − minPre</text>
    <text x="725" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">判定</text>

    <text x="120" y="361" text-anchor="middle" font-size="12.5" fill="#444">4</text>
    <text x="225" y="361" text-anchor="middle" font-size="12.5" fill="#444">−49</text>
    <text x="400" y="361" text-anchor="middle" font-size="12" fill="#444">pre[0..0] → 0</text>
    <text x="580" y="361" text-anchor="middle" font-size="12.5" fill="#a04a46">−49</text>
    <text x="725" y="361" text-anchor="middle" font-size="12" fill="#a04a46">false</text>

    <text x="120" y="401" text-anchor="middle" font-size="12.5" fill="#2b5a2b">5</text>
    <text x="225" y="401" text-anchor="middle" font-size="12.5" fill="#2b5a2b">−11.75</text>
    <text x="400" y="401" text-anchor="middle" font-size="12" fill="#2b5a2b">pre[0..1] → −11.75</text>
    <text x="580" y="401" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a2b">0 ✓</text>
    <text x="725" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a2b">true 命中</text>

    <text x="120" y="441" text-anchor="middle" font-size="12.5" fill="#444">6</text>
    <text x="225" y="441" text-anchor="middle" font-size="12.5" fill="#444">−21.5</text>
    <text x="400" y="441" text-anchor="middle" font-size="12" fill="#444">pre[0..2] → −12.5</text>
    <text x="580" y="441" text-anchor="middle" font-size="12.5" fill="#a04a46">−9</text>
    <text x="725" y="441" text-anchor="middle" font-size="12" fill="#a04a46">false</text>
  </g>

  <text x="440" y="474" text-anchor="middle" font-size="11" fill="#a08a56" filter="url(#rough2)">j = 5 命中 ⇒ 子数组下标 [1,4] = [12,−5,−6,50]，和 51、长度 4，平均值 12.75 就是答案</text>
</svg>
