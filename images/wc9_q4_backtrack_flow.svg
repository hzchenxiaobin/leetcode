<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">回溯流程：按「列」为每一行挑选候选</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">递归深度 = 已填行数 k，深度达到 L 即得到一个方块</text>

  <rect x="200" y="58" width="160" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">dfs(k)　进入第 k 行</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,110 352,142 280,174 208,142" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">k == L ?</text>

  <path d="M 352 142 L 396 142" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="136" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="398" y="124" width="140" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="468" y="139" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">记录 sq 的深拷贝</text>
  <text x="468" y="153" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">然后返回上一层</text>

  <path d="M 280 174 L 280 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="190" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">否</text>

  <rect x="118" y="198" width="324" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">need = sq[0][k] + sq[1][k] + … + sq[k−1][k]</text>
  <text x="280" y="234" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">第 k 列自上而下已确定的 k 个字符（k = 0 时为空串）</text>

  <path d="M 280 244 L 280 264" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="118" y="266" width="324" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">cand = pref[need]　（空串前缀 ⇒ 全部单词）</text>
  <text x="280" y="299" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">cand 为空 ⇒ 该分支已死，立刻回溯</text>

  <path d="M 280 308 L 280 328" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="330" width="368" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="349" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">for w in cand：sq.push(w) → dfs(k+1) → sq.pop()</text>
  <text x="280" y="366" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">同一单词可被反复选用：不维护 used 集合</text>

  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不用索引时每层要枚举 n 个单词；用前缀索引后每层只剩真正匹配的那几个</text>
</svg>
