<svg xmlns="http://www.w3.org/2000/svg" width="560" height="452" viewBox="0 0 560 452" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arp" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="452" fill="#fdfcf7"/>
  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算（示例 2）：grid = [[0,0,1],[0,0,0],[0,0,0]]，答案 2</text>
  <path d="M 110 38 Q 280 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row 1: grid and dist -->
  <text x="105" y="58" text-anchor="middle" font-size="11" fill="#4a4a4a">grid：× 为小偷</text>
  <g filter="url(#sk)">
    <rect x="66" y="64" width="38" height="38" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="104" y="64" width="38" height="38" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="142" y="64" width="38" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="66" y="102" width="38" height="38" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="104" y="102" width="38" height="38" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="142" y="102" width="38" height="38" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="66" y="140" width="38" height="38" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="104" y="140" width="38" height="38" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="142" y="140" width="38" height="38" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
  </g>
  <text x="161" y="89" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">×</text>

  <path d="M 194 121 L 236 121" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="215" y="108" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a3a3a">多源 BFS</text>

  <text x="309" y="58" text-anchor="middle" font-size="11" fill="#4a4a4a">dist 矩阵（到最近小偷的距离）</text>
  <g filter="url(#sk)">
    <rect x="252" y="64" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="290" y="64" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="328" y="64" width="38" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="252" y="102" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="290" y="102" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="328" y="102" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="252" y="140" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="290" y="140" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="328" y="140" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="309" y="88" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="347" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>
  <text x="271" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">3</text>
  <text x="309" y="126" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="347" y="126" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="271" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">4</text>
  <text x="309" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">3</text>
  <text x="347" y="164" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>

  <!-- upper bound note -->
  <g filter="url(#sk)">
    <rect x="386" y="70" width="162" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="467" y="94" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">瓶颈必含起点与终点：</text>
  <text x="467" y="114" text-anchor="middle" font-size="10.5" fill="#7a5415">答案 ≤ min(dist[0][0],</text>
  <text x="467" y="134" text-anchor="middle" font-size="10.5" fill="#7a5415">dist[n−1][n−1]) = 2</text>

  <!-- row 2: check(2) grid -->
  <text x="105" y="206" text-anchor="middle" font-size="11" fill="#4a4a4a">check(2)：只保留 dist ≥ 2 的格子</text>
  <g filter="url(#sk)">
    <rect x="66" y="214" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="104" y="214" width="38" height="38" rx="4" fill="#efefef" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="142" y="214" width="38" height="38" rx="4" fill="#efefef" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="66" y="252" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="104" y="252" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="142" y="252" width="38" height="38" rx="4" fill="#efefef" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="66" y="290" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="104" y="290" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="142" y="290" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="123" y="238" text-anchor="middle" font-size="11" fill="#a0a0a0" filter="url(#sk)">×</text>
  <text x="161" y="238" text-anchor="middle" font-size="11" fill="#a0a0a0" filter="url(#sk)">×</text>
  <text x="161" y="276" text-anchor="middle" font-size="11" fill="#a0a0a0" filter="url(#sk)">×</text>
  <text x="85" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a1e" filter="url(#sk)">2</text>
  <text x="85" y="276" text-anchor="middle" font-size="11.5" fill="#2b5a1e" filter="url(#sk)">3</text>
  <text x="123" y="276" text-anchor="middle" font-size="11.5" fill="#2b5a1e" filter="url(#sk)">2</text>
  <text x="85" y="314" text-anchor="middle" font-size="11.5" fill="#2b5a1e" filter="url(#sk)">4</text>
  <text x="123" y="314" text-anchor="middle" font-size="11.5" fill="#2b5a1e" filter="url(#sk)">3</text>
  <text x="161" y="314" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a1e" filter="url(#sk)">2</text>

  <!-- path arrows -->
  <path d="M 85 246 L 85 262" stroke="#b85450" stroke-width="2.4" marker-end="url(#arp)" filter="url(#sk)"/>
  <path d="M 85 284 L 85 300" stroke="#b85450" stroke-width="2.4" marker-end="url(#arp)" filter="url(#sk)"/>
  <path d="M 96 309 L 112 309" stroke="#b85450" stroke-width="2.4" marker-end="url(#arp)" filter="url(#sk)"/>
  <path d="M 134 309 L 150 309" stroke="#b85450" stroke-width="2.4" marker-end="url(#arp)" filter="url(#sk)"/>
  <text x="105" y="348" text-anchor="middle" font-size="10" fill="#b85450">(0,0)→(1,0)→(2,0)→(2,1)→(2,2)</text>

  <!-- binary search trace -->
  <g filter="url(#sk)">
    <rect x="252" y="214" width="280" height="112" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="392" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b3a52">二分轨迹：lo = 0，hi = 2n−2 = 4</text>
  <text x="266" y="258" font-size="10.5" fill="#3a3a3a">① mid = 2：dist ≥ 2 的格子连通 → true → lo = 2</text>
  <text x="266" y="282" font-size="10.5" fill="#3a3a3a">② mid = 3：起点 dist[0][0] = 2 &lt; 3 → false → hi = 2</text>
  <text x="266" y="306" font-size="10.5" font-weight="bold" fill="#2b5a1e">③ lo = hi = 2 收敛 → 返回 2</text>

  <!-- bottom summary -->
  <g filter="url(#sk)">
    <rect x="30" y="344" width="500" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#2b5a1e">路径 (0,0)→(1,0)→(2,0)→(2,1)→(2,2) 上的 dist 为 2, 3, 4, 3, 2，瓶颈 = 2；</text>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#2b5a1e">任何路径必含起点，而起点 dist = 2 → 安全系数封顶 2 → 答案恰为 2。</text>

  <text x="280" y="434" text-anchor="middle" font-size="10.5" fill="#7a7a7a">s = 3 时起点自身即被「dist ≥ 3」排除——check 的第一个剪枝就是 dist[0][0] ≥ s。</text>
</svg>
