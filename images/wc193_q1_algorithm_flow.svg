<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：一次遍历完成前缀和</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">初始化边界 → 递推 n−1 次 → 返回结果数组</text>

  <rect x="170" y="62" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="85" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">输入 nums，n = nums.size()</text>

  <path d="M 310 98 L 310 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="122" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="145" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">res[0] = nums[0]，i = 1（边界）</text>

  <path d="M 310 158 L 310 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="310,180 420,208 310,236 200,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="310" y="213" text-anchor="middle" font-size="13" fill="#8a6a20">i &lt; n ?</text>
  </g>

  <path d="M 310 236 L 310 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="252" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="150" y="262" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="280" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">res[i] = res[i−1] + nums[i]</text>
  <text x="310" y="296" text-anchor="middle" font-size="11" fill="#556" filter="url(#rough2)">i += 1，回到判定</text>

  <path d="M 150 282 L 100 282 L 100 208 L 196 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="250" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">循环</text>

  <path d="M 420 208 L 452 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="198" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">否</text>

  <rect x="456" y="188" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="521" y="206" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">返回 res</text>
  <text x="521" y="221" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">长度 n 的前缀和</text>

  <rect x="60" y="330" width="500" height="34" fill="#f1f1f1" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="352" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">循环不变量：进入第 i 轮时，res[0..i−1] 已是 nums 的前缀和</text>

  <rect x="60" y="374" width="500" height="34" fill="#f1f1f1" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="396" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每轮只有 1 次加法与 1 次写，共 n−1 轮 → 时间 O(n)，空间 O(n)</text>
</svg>
