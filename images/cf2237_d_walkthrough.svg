<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">样例 3 走查：s = 01001，答案 10</text>

  <text x="72" y="58" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i</text>
  <text x="175" y="58" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="269" y="58" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>
  <text x="363" y="58" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="457" y="58" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3</text>
  <text x="551" y="58" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>
  <text x="645" y="58" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">5</text>

  <text x="30" y="87" font-size="12" fill="#446688" filter="url(#rough2)">s 的字符</text>
  <rect x="128" y="66" width="94" height="34" rx="5" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="89" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">—</text>
  <rect x="222" y="66" width="94" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="269" y="89" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="316" y="66" width="94" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="363" y="89" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="410" y="66" width="94" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="457" y="89" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="504" y="66" width="94" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="551" y="89" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="598" y="66" width="94" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="645" y="89" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">1</text>

  <text x="30" y="129" font-size="12" fill="#4a7a3a" filter="url(#rough2)">权值 φ</text>
  <rect x="128" y="108" width="94" height="34" rx="5" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="131" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">—</text>
  <rect x="222" y="108" width="94" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="269" y="131" text-anchor="middle" font-size="15" fill="#3c6130" filter="url(#rough2)">1</text>
  <rect x="316" y="108" width="94" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="363" y="131" text-anchor="middle" font-size="15" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="410" y="108" width="94" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="457" y="131" text-anchor="middle" font-size="15" fill="#3c6130" filter="url(#rough2)">1</text>
  <rect x="504" y="108" width="94" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="551" y="131" text-anchor="middle" font-size="15" fill="#3c6130" filter="url(#rough2)">1</text>
  <rect x="598" y="108" width="94" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="645" y="131" text-anchor="middle" font-size="15" fill="#3c6130" filter="url(#rough2)">2</text>

  <text x="30" y="187" font-size="12" fill="#8a6420" filter="url(#rough2)">前缀 P_i (mod 3)</text>
  <rect x="128" y="166" width="94" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175" y="190" text-anchor="middle" font-size="15" fill="#8a6420" filter="url(#rough2)">0</text>
  <rect x="222" y="166" width="94" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="269" y="190" text-anchor="middle" font-size="15" fill="#8a6420" filter="url(#rough2)">1</text>
  <rect x="316" y="166" width="94" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="363" y="190" text-anchor="middle" font-size="15" fill="#8a6420" filter="url(#rough2)">0</text>
  <rect x="410" y="166" width="94" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="457" y="190" text-anchor="middle" font-size="15" fill="#8a6420" filter="url(#rough2)">1</text>
  <rect x="504" y="166" width="94" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="551" y="190" text-anchor="middle" font-size="15" fill="#8f3b38" filter="url(#rough2)">2</text>
  <rect x="598" y="166" width="94" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="645" y="190" text-anchor="middle" font-size="15" fill="#8a6420" filter="url(#rough2)">1</text>

  <text x="360" y="222" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">残类计数：cnt[0] = 2（P_0, P_2），cnt[1] = 3（P_1, P_3, P_5），cnt[2] = 1（P_4）</text>

  <rect x="40" y="238" width="310" height="82" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="266" text-anchor="middle" font-size="13" fill="#2b4a63" filter="url(#rough2)">A = C(6,2) − [C(2,2) + C(3,2) + C(1,2)]</text>
  <text x="195" y="292" text-anchor="middle" font-size="13" fill="#2b4a63" filter="url(#rough2)">= 15 − (1 + 3 + 0) = 11</text>

  <rect x="370" y="238" width="310" height="82" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="266" text-anchor="middle" font-size="13" fill="#2f5228" filter="url(#rough2)">交替块 010 (m = 3) 与 01 (m = 2)</text>
  <text x="525" y="292" text-anchor="middle" font-size="13" fill="#2f5228" filter="url(#rough2)">扣 1 · (3 − 1 − 1) + 0 = 1</text>

  <rect x="200" y="342" width="320" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="374" text-anchor="middle" font-size="15" fill="#8f3b38" filter="url(#rough2)">答案 = 11 − 1 = 10 ✓</text>
</svg>
