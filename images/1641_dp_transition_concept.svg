<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#8aa4c4"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：结尾字符定乾坤</text>
  <path d="M 220 38 Q 340 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="340" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">① 尾接规则：新字符 ≥ 结尾，才能保持非降</text>

  <g filter="url(#sk)">
    <rect x="118" y="72" width="54" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="194" y="72" width="54" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="270" y="72" width="54" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="346" y="72" width="54" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <g font-size="20" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="145" y="103" fill="#3a5a3a">a</text>
    <text x="221" y="103" fill="#3a5a3a">e</text>
    <text x="297" y="103" fill="#3a5a3a">i</text>
    <text x="373" y="103" fill="#b07818">o</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 404 88 Q 426 84 444 85" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
    <path d="M 404 96 Q 452 92 512 93" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
    <path d="M 404 106 Q 456 108 578 109" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arR)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="448" y="72" width="44" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="516" y="72" width="44" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="584" y="72" width="44" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="470" y="99" font-size="18" font-weight="bold" fill="#3a5a3a">o</text>
    <text x="470" y="114" font-size="11" font-weight="bold" fill="#4a7a3a">✓</text>
    <text x="538" y="99" font-size="18" font-weight="bold" fill="#3a5a3a">u</text>
    <text x="538" y="114" font-size="11" font-weight="bold" fill="#4a7a3a">✓</text>
    <text x="606" y="99" font-size="18" font-weight="bold" fill="#b85450">a</text>
    <text x="606" y="114" font-size="11" font-weight="bold" fill="#b85450">✗</text>
  </g>

  <text x="340" y="140" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">结尾是 o ⇒ 只能再接 o、u；接 a / e / i 立刻违反非降（去掉末尾的 aei 仍是合法前缀）</text>

  <path d="M 60 154 Q 340 162 620 154" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <text x="340" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">② 状态转移：f(i, j) = 长度 i、以第 j 个元音结尾的非降串数</text>

  <text x="40" y="194" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">长度</text>
  <text x="40" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">i−1</text>
  <text x="40" y="336" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">长度</text>
  <text x="40" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">i</text>

  <g stroke="#9db8d8" stroke-width="1.1" fill="none" opacity="0.8" filter="url(#sk)">
    <path d="M 100 233 L 100 329" marker-end="url(#arB)"/>
    <path d="M 100 233 Q 140 285 214 329" marker-end="url(#arB)"/>
    <path d="M 100 233 Q 180 285 330 329" marker-end="url(#arB)"/>
    <path d="M 100 233 Q 235 285 452 329" marker-end="url(#arB)"/>
    <path d="M 100 233 Q 290 285 570 329" marker-end="url(#arB)"/>
    <path d="M 220 233 L 220 329" marker-end="url(#arB)"/>
    <path d="M 220 233 Q 260 285 330 329" marker-end="url(#arB)"/>
    <path d="M 220 233 Q 310 285 452 329" marker-end="url(#arB)"/>
    <path d="M 220 233 Q 360 285 570 329" marker-end="url(#arB)"/>
    <path d="M 330 233 L 330 329" marker-end="url(#arB)"/>
    <path d="M 330 233 Q 372 285 452 329" marker-end="url(#arB)"/>
    <path d="M 330 233 Q 420 285 570 329" marker-end="url(#arB)"/>
    <path d="M 460 233 L 460 329" marker-end="url(#arB)"/>
    <path d="M 460 233 Q 500 285 570 329" marker-end="url(#arB)"/>
    <path d="M 580 233 L 580 329" marker-end="url(#arB)"/>
  </g>

  <g filter="url(#sk)">
    <ellipse cx="100" cy="212" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="220" cy="212" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="330" cy="212" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="460" cy="212" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="580" cy="212" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="100" cy="352" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="220" cy="352" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="330" cy="352" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="460" cy="352" rx="21" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <ellipse cx="580" cy="352" rx="21" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="16" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="100" y="218" fill="#2b4a66">a</text>
    <text x="220" y="218" fill="#2b4a66">e</text>
    <text x="330" y="218" fill="#2b4a66">i</text>
    <text x="460" y="218" fill="#2b4a66">o</text>
    <text x="580" y="218" fill="#2b4a66">u</text>
    <text x="100" y="358" fill="#2b4a66">a</text>
    <text x="220" y="358" fill="#2b4a66">e</text>
    <text x="330" y="358" fill="#2b4a66">i</text>
    <text x="460" y="358" fill="#b07818">o</text>
    <text x="580" y="358" fill="#2b4a66">u</text>
  </g>

  <g stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#sk)">
    <path d="M 100 233 Q 235 285 448 328" marker-end="url(#arO)"/>
    <path d="M 220 233 Q 310 285 450 328" marker-end="url(#arO)"/>
    <path d="M 330 233 Q 372 285 454 328" marker-end="url(#arO)"/>
    <path d="M 460 233 L 460 327" marker-end="url(#arO)"/>
  </g>

  <text x="380" y="392" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b07818" filter="url(#sk)">f(i, o) = f(i−1, a) + f(i−1, e) + f(i−1, i) + f(i−1, o)</text>

  <text x="340" y="418" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">一般地 f(i, j) = Σ (k ≤ j) f(i−1, k)：15 条边构成下三角——沿字符串走向，结尾字符只增不减</text>

  <text x="340" y="434" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">（无后效性：能接什么只取决于结尾，与更前面的内容无关）</text>
</svg>
