<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="860" height="440" fill="#fafafa"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：S_L 递增、S_R 递减，唯一交点即中枢</text>
  <path d="M 240 42 Q 430 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- n=8 表 -->
  <text x="110" y="64" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 8（total = 36）</text>

  <!-- 表头行 -->
  <rect x="110" y="72" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="148" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">x</text>
  <rect x="186" y="72" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="246" y="72" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="306" y="72" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="366" y="72" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="426" y="72" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="486" y="72" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="546" y="72" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="606" y="72" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="216" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <text x="276" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">2</text>
  <text x="336" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>
  <text x="396" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">4</text>
  <text x="456" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">5</text>
  <text x="516" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07830" filter="url(#rough2)">6</text>
  <text x="576" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">7</text>
  <text x="636" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">8</text>

  <!-- S_L 行 -->
  <rect x="110" y="106" width="76" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">S_L</text>
  <rect x="186" y="106" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="246" y="106" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="306" y="106" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="366" y="106" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="426" y="106" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="486" y="106" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="546" y="106" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="606" y="106" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="276" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="336" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="396" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="456" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="516" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07830" filter="url(#rough2)">21</text>
  <text x="576" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">28</text>
  <text x="636" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">36</text>
  <text x="678" y="128" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">↗ 递增</text>

  <!-- S_R 行 -->
  <rect x="110" y="140" width="76" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">S_R</text>
  <rect x="186" y="140" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="246" y="140" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="306" y="140" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="366" y="140" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="426" y="140" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="486" y="140" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="546" y="140" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="606" y="140" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="162" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">36</text>
  <text x="276" y="162" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">35</text>
  <text x="336" y="162" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">33</text>
  <text x="396" y="162" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">30</text>
  <text x="456" y="162" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">26</text>
  <text x="516" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07830" filter="url(#rough2)">21</text>
  <text x="576" y="162" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="636" y="162" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="678" y="162" text-anchor="start" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">↘ 递减</text>

  <!-- 命中标 pill -->
  <rect x="441" y="182" width="150" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">x=6：21 = 21 ✓ 命中</text>

  <!-- n=4 表 -->
  <text x="110" y="244" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 4（total = 10）</text>

  <rect x="110" y="252" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="148" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">x</text>
  <rect x="186" y="252" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="246" y="252" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="306" y="252" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="366" y="252" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="216" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <text x="276" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">2</text>
  <text x="336" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>
  <text x="396" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">4</text>

  <rect x="110" y="286" width="76" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">S_L</text>
  <rect x="186" y="286" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="246" y="286" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="306" y="286" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="366" y="286" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="308" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="276" y="308" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="336" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="396" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">10</text>

  <rect x="110" y="320" width="76" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">S_R</text>
  <rect x="186" y="320" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="246" y="320" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="306" y="320" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="366" y="320" width="60" height="34" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="342" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="276" y="342" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="336" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="396" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <text x="268" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07830" filter="url(#rough2)">x=3：6 &lt; 7；x=4：10 &gt; 4 —— 跨过而未相等</text>

  <!-- 公式视角框 -->
  <rect x="560" y="252" width="250" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="685" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07830" filter="url(#rough2)">公式视角</text>
  <text x="685" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t = 4×5/2 = 10</text>
  <text x="685" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">isqrt(10) = 3，3² = 9 ≠ 10</text>
  <text x="685" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">非完全平方 → 无中枢</text>
  <text x="685" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 −1</text>

  <!-- 底部结论 -->
  <rect x="110" y="392" width="700" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="415" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">S_L 严格增、S_R 严格减 ⇒ 至多一个交点；交点存在 ⇔ n(n+1)/2 是完全平方数</text>
</svg>
