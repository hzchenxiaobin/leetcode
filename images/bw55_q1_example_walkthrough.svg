<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：一成一败两个样例</text>

  <!-- 样例一 -->
  <text x="60" y="66" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">样例一 [1, 2, 10, 5, 7]：断层在 (10, 5)，k = 2</text>
  <g filter="url(#rough2)">
    <rect x="60" y="82" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="116" y="82" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="172" y="82" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="228" y="82" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="284" y="82" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="86" y="104">1</text><text x="142" y="104">2</text>
    <text x="198" y="104">10</text><text x="254" y="104">5</text><text x="310" y="104">7</text>
  </g>
  <text x="198" y="132" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">删 k（值 10）</text>
  <path d="M 198 114 L 198 138" stroke="#b85450" stroke-width="0" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="146" width="276" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
  </g>
  <text x="198" y="168" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">删 10 → [1, 2, 5, 7] 严格递增 ✓ → return true</text>
  <path d="M 198 136 L 198 142" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 样例二 -->
  <text x="60" y="222" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">样例二 [2, 3, 1, 2]：断层在 (3, 1)，k = 1</text>
  <g filter="url(#rough2)">
    <rect x="60" y="238" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="116" y="238" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="172" y="238" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="228" y="238" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="86" y="260">2</text><text x="142" y="260">3</text>
    <text x="198" y="260">1</text><text x="254" y="260">2</text>
  </g>
  <text x="142" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">候选 k</text>
  <text x="198" y="288" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">候选 k+1</text>

  <!-- 两次检查均失败 -->
  <g filter="url(#rough2)">
    <rect x="60" y="300" width="230" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <rect x="300" y="300" width="230" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
  </g>
  <text x="175" y="318" text-anchor="middle" font-size="12" fill="#a0392f" font-weight="bold" filter="url(#rough2)">删 k（值 3）→ [2, 1, 2]</text>
  <text x="175" y="334" text-anchor="middle" font-size="12" fill="#a0392f" filter="url(#rough2)">2 ≥ 1 ✗</text>
  <text x="415" y="318" text-anchor="middle" font-size="12" fill="#a0392f" font-weight="bold" filter="url(#rough2)">删 k+1（值 1）→ [2, 3, 2]</text>
  <text x="415" y="334" text-anchor="middle" font-size="12" fill="#a0392f" filter="url(#rough2)">3 ≥ 2 ✗</text>
  <path d="M 142 292 L 175 298" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 198 292 L 415 298" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="354" width="470" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="295" y="377" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">两个候选都失败 → 不存在合法删除 → return false</text>
</svg>
