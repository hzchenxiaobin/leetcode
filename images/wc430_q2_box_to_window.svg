<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：盒子 = 长度 ≤ L 的子串，逐起点取最长</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 中缝分隔 + 等价徽章 -->
  <path d="M 316 62 L 316 286" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
  <g filter="url(#sk)">
    <ellipse cx="316" cy="158" rx="18" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="316" y="162" text-anchor="middle" font-size="10" fill="#9c3a34">等价</text>
  <path d="M 296 116 L 334 116" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <path d="M 336 202 L 298 202" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- 左列：视角一 枚举分割 -->
  <text x="160" y="74" text-anchor="middle" font-size="12" fill="#555">视角一：枚举所有分割（组合数爆炸）</text>
  <text x="160" y="94" text-anchor="middle" font-size="11" fill="#999">word = “dbca”，k = 2</text>

  <!-- 三种分割 -->
  <g filter="url(#sk)">
    <rect x="34" y="102" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="60" y="102" width="24" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="86" y="102" width="24" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="112" y="102" width="24" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="34" y="132" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="60" y="132" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="86" y="132" width="24" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="112" y="132" width="24" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="34" y="162" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="60" y="162" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="86" y="162" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="112" y="162" width="24" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <path d="M 59 99 L 59 129" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 3" fill="none"/>
    <path d="M 85 129 L 85 159" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 3" fill="none"/>
    <path d="M 111 159 L 111 189" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 3" fill="none"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="46" y="119" fill="#333">d</text>
    <text x="72" y="119" fill="#7a5415">b</text>
    <text x="98" y="119" fill="#7a5415">c</text>
    <text x="124" y="119" fill="#7a5415">a</text>
    <text x="46" y="149" fill="#2b6e9e">d</text>
    <text x="72" y="149" fill="#2b6e9e">b</text>
    <text x="98" y="149" fill="#7a5415">c</text>
    <text x="124" y="149" fill="#7a5415">a</text>
    <text x="46" y="179" fill="#2b6e9e">d</text>
    <text x="72" y="179" fill="#2b6e9e">b</text>
    <text x="98" y="179" fill="#2b6e9e">c</text>
    <text x="124" y="179" fill="#7a5415">a</text>
  </g>

  <path d="M 85 192 L 85 208" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="98" y="204" font-size="11" fill="#666">全部片段进盒子</text>

  <!-- 盒子 -->
  <g filter="url(#sk)">
    <rect x="20" y="214" width="280" height="62" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="60" y="236" width="28" height="18" rx="9" fill="#fdfcf7" stroke="#999999" stroke-width="1.2"/>
    <rect x="96" y="236" width="40" height="18" rx="9" fill="#fdfcf7" stroke="#999999" stroke-width="1.2"/>
    <rect x="144" y="236" width="54" height="18" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="206" y="236" width="54" height="18" rx="9" fill="#fdfcf7" stroke="#999999" stroke-width="1.2"/>
    <rect x="96" y="258" width="40" height="18" rx="9" fill="#fdfcf7" stroke="#999999" stroke-width="1.2"/>
    <rect x="144" y="258" width="28" height="18" rx="9" fill="#fdfcf7" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="160" y="230" text-anchor="middle" font-size="11" fill="#2b6e9e">盒子（6 个片段）</text>
  <g font-size="10" text-anchor="middle" font-family="monospace">
    <text x="74" y="249" fill="#555">d</text>
    <text x="116" y="249" fill="#555">db</text>
    <text x="171" y="249" fill="#2e6e2e" font-weight="bold">dbc</text>
    <text x="233" y="249" fill="#555">bca</text>
    <text x="116" y="271" fill="#555">ca</text>
    <text x="158" y="271" fill="#555">a</text>
  </g>
  <text x="160" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">取字典序最大 → “dbc”</text>

  <!-- 右列：视角二 滑窗候选 -->
  <text x="478" y="74" text-anchor="middle" font-size="12" fill="#555">视角二：每个起点只看最长候选</text>
  <text x="478" y="94" text-anchor="middle" font-size="11" fill="#999">L = n − k + 1 = 3，越界自动截断</text>

  <g font-size="10" text-anchor="end" fill="#888">
    <text x="370" y="120">i=0</text>
    <text x="370" y="152">i=1</text>
    <text x="370" y="184">i=2</text>
    <text x="370" y="216">i=3</text>
  </g>
  <g filter="url(#sk)">
    <!-- i=0 -->
    <rect x="380" y="104" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="406" y="104" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="432" y="104" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="458" y="104" width="24" height="24" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <!-- i=1 -->
    <rect x="380" y="136" width="24" height="24" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="406" y="136" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="432" y="136" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="458" y="136" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <!-- i=2（截断） -->
    <rect x="380" y="168" width="24" height="24" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="406" y="168" width="24" height="24" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="432" y="168" width="24" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="458" y="168" width="24" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <!-- i=3（截断） -->
    <rect x="380" y="200" width="24" height="24" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="406" y="200" width="24" height="24" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="432" y="200" width="24" height="24" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="458" y="200" width="24" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <!-- 胜者框 -->
    <rect x="488" y="103" width="42" height="24" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="392" y="120" fill="#2b6e9e">d</text>
    <text x="418" y="120" fill="#2b6e9e">b</text>
    <text x="444" y="120" fill="#2b6e9e">c</text>
    <text x="470" y="120" fill="#777">a</text>
    <text x="392" y="152" fill="#777">d</text>
    <text x="418" y="152" fill="#2b6e9e">b</text>
    <text x="444" y="152" fill="#2b6e9e">c</text>
    <text x="470" y="152" fill="#2b6e9e">a</text>
    <text x="392" y="184" fill="#777">d</text>
    <text x="418" y="184" fill="#777">b</text>
    <text x="444" y="184" fill="#7a5415">c</text>
    <text x="470" y="184" fill="#7a5415">a</text>
    <text x="392" y="216" fill="#777">d</text>
    <text x="418" y="216" fill="#777">b</text>
    <text x="444" y="216" fill="#777">c</text>
    <text x="470" y="216" fill="#7a5415">a</text>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="509" y="120" text-anchor="middle" fill="#2e6e2e" font-weight="bold">dbc</text>
    <text x="496" y="152" fill="#555">bca</text>
    <text x="496" y="184" fill="#555">ca</text>
    <text x="496" y="216" fill="#555">a</text>
  </g>
  <g font-size="9" fill="#c98a2b">
    <text x="530" y="182">截断</text>
    <text x="514" y="214">截断</text>
  </g>
  <text x="478" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a">同一起点：越长越好（真前缀必更小）</text>
  <text x="478" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a">→ 每个起点只保留最长候选</text>
  <text x="478" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">max = “dbc”，与视角一一致</text>

  <!-- 底部公式条 -->
  <g filter="url(#sk)">
    <rect x="80" y="306" width="480" height="42" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="324" text-anchor="middle" font-size="12" font-family="monospace" fill="#7a5415">answer = max( word[i : i+L] )，L = n − k + 1</text>
  <text x="320" y="341" text-anchor="middle" font-size="11" fill="#b85450">k = 1 时直接返回整串；尾部截断的短候选一个都不能丢</text>
</svg>
