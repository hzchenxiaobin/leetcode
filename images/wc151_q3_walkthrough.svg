<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="450" fill="#fafafa"/>
  <text x="350" y="28" font-size="14.5" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">示例 1 演算：[1, 2, −3, 3, 1] 的两次扫描</text>
  <text x="350" y="48" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">第一遍得到「前缀和 → 最后出现下标」；第二遍照表跳指针</text>
  <text x="36" y="76" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">① 第一遍：前缀和与末次下标</text>
  <text x="80" y="92" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">哑结点</text>
  <rect x="36" y="98" width="88" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="124" font-size="16" fill="#2f5e22" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p = 0</text>
  <text x="80" y="145" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">last = 3</text>
  <text x="184" y="92" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">i = 1</text>
  <rect x="140" y="98" width="88" height="58" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="184" y="124" font-size="16" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p = 1</text>
  <text x="184" y="145" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">last = 1</text>
  <text x="288" y="92" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">i = 2</text>
  <rect x="244" y="98" width="88" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="288" y="124" font-size="16" fill="#7a5c18" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p = 3</text>
  <text x="288" y="145" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">last = 4</text>
  <text x="392" y="92" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">i = 3</text>
  <rect x="348" y="98" width="88" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="124" font-size="16" fill="#2f5e22" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p = 0</text>
  <text x="392" y="145" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">last = 3</text>
  <text x="496" y="92" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">i = 4</text>
  <rect x="452" y="98" width="88" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="496" y="124" font-size="16" fill="#7a5c18" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p = 3</text>
  <text x="496" y="145" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">last = 4</text>
  <text x="600" y="92" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">i = 5</text>
  <rect x="556" y="98" width="88" height="58" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="600" y="124" font-size="16" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p = 4</text>
  <text x="600" y="145" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">last = 5</text>
  <text x="36" y="186" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">② 第二遍：从哑结点出发，逐跳重接 next（s 与第一遍同步累加）</text>
  <text x="36" y="208" font-size="10.2" fill="#888" font-weight="bold" filter="url(#rough2)">当前节点</text>
  <text x="186" y="208" font-size="10.2" fill="#888" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="286" y="208" font-size="10.2" fill="#888" font-weight="bold" filter="url(#rough2)">last[s]</text>
  <text x="400" y="208" font-size="10.2" fill="#888" font-weight="bold" filter="url(#rough2)">next 指向</text>
  <text x="556" y="208" font-size="10.2" fill="#888" font-weight="bold" filter="url(#rough2)">结果链表</text>
  <path d="M 32 216 L 664 216" stroke="#ccc" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <text x="36" y="238" font-size="10.2" fill="#333" filter="url(#rough2)">dummy（值 0）</text>
  <text x="186" y="238" font-size="10.2" fill="#2f5e22" filter="url(#rough2)">0</text>
  <text x="286" y="238" font-size="10.2" fill="#7a5c18" filter="url(#rough2)">下标 3</text>
  <text x="400" y="238" font-size="10.2" fill="#555" filter="url(#rough2)">下标 4（值 3）</text>
  <text x="556" y="238" font-size="10.2" fill="#8a3b38" filter="url(#rough2)">[]</text>
  <text x="36" y="268" font-size="10.2" fill="#333" filter="url(#rough2)">下标 4（值 3）</text>
  <text x="186" y="268" font-size="10.2" fill="#2f5e22" filter="url(#rough2)">3</text>
  <text x="286" y="268" font-size="10.2" fill="#7a5c18" filter="url(#rough2)">下标 4 自己</text>
  <text x="400" y="268" font-size="10.2" fill="#555" filter="url(#rough2)">下标 5（值 1）</text>
  <text x="556" y="268" font-size="10.2" fill="#8a3b38" filter="url(#rough2)">[3]</text>
  <text x="36" y="298" font-size="10.2" fill="#333" filter="url(#rough2)">下标 5（值 1）</text>
  <text x="186" y="298" font-size="10.2" fill="#2f5e22" filter="url(#rough2)">4</text>
  <text x="286" y="298" font-size="10.2" fill="#7a5c18" filter="url(#rough2)">下标 5 自己</text>
  <text x="400" y="298" font-size="10.2" fill="#555" filter="url(#rough2)">null，链表结束</text>
  <text x="556" y="298" font-size="10.2" fill="#8a3b38" filter="url(#rough2)">[3, 1]</text>
  <path d="M 32 308 L 664 308" stroke="#ddd" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <text x="36" y="334" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">结果：</text>
  <rect x="86" y="320" width="54" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="337" font-size="12" fill="#2f5e22" font-weight="bold" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="148" y="320" width="54" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="337" font-size="12" fill="#2f5e22" font-weight="bold" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="212" y="337" font-size="10.5" fill="#2f5e22" filter="url(#rough2)">= 官方示例输出 [3, 1]</text>
  <text x="36" y="378" font-size="10.3" fill="#555" filter="url(#rough2)">• 下标 1..3 的值 1 + 2 + (−3) = 0，一次跳转把它们整段跳过；此后再无相等的同前缀和点。</text>
  <text x="36" y="402" font-size="10.3" fill="#555" filter="url(#rough2)">• 题面允许任意合法答案：删下标 3、4 的 3 与 −3 得到 [1, 2, 1] 也满足要求；</text>
  <text x="36" y="426" font-size="10.3" fill="#888" filter="url(#rough2)">  本文算法固定「跳最远」，因此与官方示例给出的 [3, 1] 一致。</text>
</svg>
