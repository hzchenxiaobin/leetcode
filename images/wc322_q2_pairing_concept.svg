<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="860" height="390" fill="#fafafa"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：目标和唯一 → 排序后首尾配对</text>
  <path d="M 240 42 Q 430 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 目标和唯一性 -->
  <rect x="60" y="56" width="740" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">目标和由总量唯一确定（第一道门：整除性）</text>
  <text x="430" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n/2 个队 · 每队和相等  ⇒  T = total ÷ (n/2) = 2·total / n</text>
  <text x="430" y="124" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">示例 1：total = 18，n/2 = 3 → T = 6；total 不被 n/2 整除则无解</text>

  <path d="M 430 136 L 430 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- 极值标签 -->
  <text x="122" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">最小 a[0]</text>
  <text x="502" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">最大 a[n-1]</text>

  <!-- 排序后的数组格子 -->
  <rect x="90" y="176" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="166" y="176" width="64" height="44" rx="4" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="242" y="176" width="64" height="44" rx="4" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="318" y="176" width="64" height="44" rx="4" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="394" y="176" width="64" height="44" rx="4" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="470" y="176" width="64" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="122" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="198" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="274" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="350" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="426" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="502" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>

  <!-- 首尾配对括号（自内向外） -->
  <path d="M 274 224 L 274 234 L 350 234 L 350 224" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 198 224 L 198 246 L 426 246 L 426 224" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 122 224 L 122 262 L 502 262 L 502 224" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="360" y="238" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">3+3 = 6</text>
  <text x="436" y="250" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2+4 = 6</text>
  <text x="512" y="266" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1+5 = 6</text>

  <!-- 右侧提示 -->
  <rect x="560" y="176" width="250" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="685" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#8e3030" filter="url(#rough2)">任一对和 ≠ T → 返回 -1</text>

  <!-- 结论 -->
  <rect x="60" y="298" width="740" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">首尾配对是值意义上唯一的合法配对</text>
  <text x="430" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">化学反应 = 1×5 + 2×4 + 3×3 = 5 + 8 + 9 = 22</text>
</svg>
