<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1 演算：nums = [2,3,0,0,2]，k = 4</text>
  <text x="280" y="54" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">抬升代价 = [2,1,4,4,2]；红色路径为最优解回溯</text>

  <!-- table grid -->
  <rect x="50" y="84" width="416" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="50" y="116" width="416" height="216" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <path d="M 102 84 L 102 332" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 172 84 L 172 332" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 232 84 L 232 332" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 310 84 L 310 332" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 388 84 L 388 332" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <path d="M 50 152 L 466 152" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 50 188 L 466 188" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 50 224 L 466 224" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 50 260 L 466 260" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 50 296 L 466 296" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- header -->
  <text x="76" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="137" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">nums[i]</text>
  <text x="202" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">代价</text>
  <text x="271" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">f0</text>
  <text x="349" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">f1</text>
  <text x="427" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">f2</text>

  <!-- highlight cells on optimal path -->
  <rect x="232" y="116" width="78" height="36" fill="#fce4ec" rx="3" filter="url(#rough2)"/>
  <rect x="310" y="152" width="78" height="36" fill="#fce4ec" rx="3" filter="url(#rough2)"/>
  <rect x="232" y="188" width="78" height="36" fill="#fce4ec" rx="3" filter="url(#rough2)"/>
  <rect x="310" y="224" width="78" height="36" fill="#fce4ec" rx="3" filter="url(#rough2)"/>
  <rect x="388" y="260" width="78" height="36" fill="#fce4ec" rx="3" filter="url(#rough2)"/>
  <rect x="232" y="296" width="78" height="36" fill="#fce4ec" rx="3" filter="url(#rough2)"/>

  <!-- sentinel row -->
  <text x="76" y="139" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">哨兵</text>
  <text x="137" y="139" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">—</text>
  <text x="202" y="139" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">—</text>
  <text x="271" y="139" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="349" y="139" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∞</text>
  <text x="427" y="139" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∞</text>

  <!-- i = 0 -->
  <text x="76" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="137" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="202" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="271" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="349" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="427" y="175" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∞</text>

  <!-- i = 1 -->
  <text x="76" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="137" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="202" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="271" y="211" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="349" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="427" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- i = 2 -->
  <text x="76" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="137" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="202" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="271" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="349" y="247" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="427" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- i = 3 -->
  <text x="76" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="137" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="202" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="271" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="349" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="427" y="283" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- i = 4 -->
  <text x="76" y="319" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="137" y="319" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="202" y="319" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="271" y="319" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="349" y="319" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="427" y="319" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- optimal path polyline -->
  <path d="M 271 134 L 349 170 L 271 206 L 349 242 L 427 278 L 271 314" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="271" cy="134" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="349" cy="170" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="271" cy="206" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="349" cy="242" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="427" cy="278" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="271" cy="314" r="3.5" fill="#b85450" filter="url(#rough2)"/>

  <!-- conclusion -->
  <rect x="50" y="356" width="416" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="258" y="380" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">答案 = min(3, 5, 4) = 3</text>
  <text x="258" y="401" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">路径：pos0 low → pos1 抬到 4（+1）→ pos2/3 low → pos4 抬到 4（+2）</text>
  <text x="258" y="421" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">终态 [2,4,0,0,4]，所有 3 窗口最大值均 = 4 ≥ k ✓</text>
</svg>
