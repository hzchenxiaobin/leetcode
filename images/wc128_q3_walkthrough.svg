<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：weights = [1..10]，days = 5</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">载重 14 要 6 天，载重 15 只要 5 天</text>
  <rect width="580" height="396" fill="#fafafa"/>
  <text x="30.0" y="70.0" font-size="12" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">cap = 14（不可行）</text>
  <rect x="30" y="80" width="82" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="71.0" y="98.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第1天 1,2,3,4</text>
  <rect x="120" y="80" width="82" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="161.0" y="98.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第2天 5,6</text>
  <rect x="210" y="80" width="82" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="251.0" y="98.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第3天 7</text>
  <rect x="300" y="80" width="82" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="341.0" y="98.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第4天 8</text>
  <rect x="390" y="80" width="82" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="431.0" y="98.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第5天 9</text>
  <rect x="480" y="80" width="82" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="521.0" y="98.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第6天 10</text>
  <text x="30.0" y="132.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">共 6 天 &gt; 5 → 不可行</text>
  <text x="30.0" y="164.0" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">cap = 15（可行）</text>
  <rect x="30" y="174" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="78.0" y="192.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第1天 1,2,3,4,5</text>
  <rect x="134" y="174" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="182.0" y="192.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第2天 6,7</text>
  <rect x="238" y="174" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="286.0" y="192.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第3天 8</text>
  <rect x="342" y="174" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="390.0" y="192.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第4天 9</text>
  <rect x="446" y="174" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="494.0" y="192.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第5天 10</text>
  <text x="30.0" y="226.0" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">共 5 天 ≤ 5 → 可行，故答案是 15</text>
  <text x="30.0" y="258.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">二分轨迹</text>
  <rect x="30" y="270" width="86" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="73.0" y="290.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="73.0" y="285.0" font-size="8" fill="#333" text-anchor="middle" filter="url(#rough2)">lo=10,hi=55</text>
  <text x="73.0" y="299.0" font-size="8" fill="#888" text-anchor="middle" filter="url(#rough2)">mid=32</text>
  <rect x="122" y="270" width="86" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="165.0" y="290.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="165.0" y="285.0" font-size="8" fill="#333" text-anchor="middle" filter="url(#rough2)">hi=32</text>
  <text x="165.0" y="299.0" font-size="8" fill="#888" text-anchor="middle" filter="url(#rough2)">mid=21</text>
  <rect x="214" y="270" width="86" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="257.0" y="290.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="257.0" y="285.0" font-size="8" fill="#333" text-anchor="middle" filter="url(#rough2)">hi=21</text>
  <text x="257.0" y="299.0" font-size="8" fill="#888" text-anchor="middle" filter="url(#rough2)">mid=15</text>
  <rect x="306" y="270" width="86" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="349.0" y="290.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="349.0" y="285.0" font-size="8" fill="#333" text-anchor="middle" filter="url(#rough2)">hi=15</text>
  <text x="349.0" y="299.0" font-size="8" fill="#888" text-anchor="middle" filter="url(#rough2)">mid=12</text>
  <rect x="398" y="270" width="86" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="441.0" y="290.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="441.0" y="285.0" font-size="8" fill="#333" text-anchor="middle" filter="url(#rough2)">lo=13</text>
  <text x="441.0" y="299.0" font-size="8" fill="#888" text-anchor="middle" filter="url(#rough2)">mid=14</text>
  <rect x="490" y="270" width="86" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="533.0" y="290.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="533.0" y="285.0" font-size="8" fill="#333" text-anchor="middle" filter="url(#rough2)">lo=15</text>
  <text x="533.0" y="299.0" font-size="8" fill="#888" text-anchor="middle" filter="url(#rough2)">结束</text>
  <rect x="30" y="318" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="339.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">载重 14 与 15 的差别就在「1,2,3,4 之后还能不能再放一个 5」</text>
</svg>
