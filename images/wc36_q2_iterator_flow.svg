<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">next() 与 hasNext() 的执行流程</text>

  <!-- start -->
  <rect x="190" y="44" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="67" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">调用 next()</text>

  <path d="M 270 80 L 270 108" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 hasNext -->
  <polygon points="270,112 380,152 270,192 160,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="147" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">hasNext() ?</text>
  <text x="270" y="165" text-anchor="middle" font-size="9.5" fill="#a08030" filter="url(#rough2)">cnt &gt; 0 或 i &lt; n</text>

  <path d="M 380 152 L 400 152" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="145" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="404" y="128" width="118" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="463" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ' '</text>
  <text x="463" y="165" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">已耗尽，状态不变</text>

  <path d="M 270 192 L 270 222" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="216" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- D2 cnt == 0 -->
  <polygon points="270,226 390,266 270,306 150,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cnt == 0 ?</text>

  <path d="M 390 266 H 456 V 422 H 356" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="259" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="464" y="300" font-size="9" fill="#888" filter="url(#rough2)">块内直接消耗</text>
  <text x="464" y="314" font-size="9" fill="#888" filter="url(#rough2)">不重新解析</text>

  <path d="M 270 306 L 270 326" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="281" y="321" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 解析块 -->
  <rect x="150" y="326" width="240" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">解析下一块</text>
  <text x="270" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cur = s[i++]；读连续数字 → cnt</text>

  <path d="M 270 380 L 270 402" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="404" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="427" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt--</text>

  <path d="M 270 440 L 270 460" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="462" width="170" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="485" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return cur</text>
</svg>
