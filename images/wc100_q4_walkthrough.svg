<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">示例演算：k=1 取最小循环移位，k≥2 直接排序</text>
  <text x="90" y="76" text-anchor="start" font-size="13" fill="#446688" font-weight="normal" font-style="" filter="url(#rough2)">k = 1，s = "cba" 的三个循环移位：</text>
  <rect x="90" y="88" width="120" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="115.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">cba</text>
  <rect x="240" y="88" width="120" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300.0" y="115.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">bac</text>
  <rect x="390" y="88" width="120" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450.0" y="115.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">acb</text>
  <text x="560" y="116" text-anchor="start" font-size="12" fill="#d6a040" font-weight="normal" font-style="" filter="url(#rough2)">← 最小</text>
  <text x="90" y="186" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="normal" font-style="" filter="url(#rough2)">k = 3 ≥ 2，s = "baaca"：</text>
  <rect x="90" y="198" width="120" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="225.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">baaca</text>
  <path d="M 220 220 L 280 220" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="290" y="198" width="120" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="225.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">aaabc</text>
  <text x="430" y="226" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="normal" font-style="" filter="url(#rough2)">排序即可（任意排列都可达）</text>
  <text x="360" y="286" text-anchor="middle" font-size="13" fill="#b85450" font-weight="normal" font-style="" filter="url(#rough2)">易错：k≥2 时答案不是最小循环移位，而是全局升序</text>
  <text x="360" y="316" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">例："baaca" 的最小循环移位是 "aacab"，但正确答案是 "aaabc"</text>
</svg>
