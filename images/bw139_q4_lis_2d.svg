<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">二维严格 LIS：x 升序 + 同 x 时 y 降序 + 对 y 求严格 LIS</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">点集 {(1,5), (1,3), (2,4)}：同 x 的两个点不能同时入选</text>

  <text x="60" y="76" font-size="10.5" fill="#3a4a66">① 排序（x 升，y 降）</text>
  <rect x="60" y="86" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="96" y="108" text-anchor="middle" font-size="11" fill="#3a4a66">(1,5)</text>
  <rect x="132" y="86" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="168" y="108" text-anchor="middle" font-size="11" fill="#3a4a66">(1,3)</text>
  <rect x="204" y="86" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="11" fill="#3a4a66">(2,4)</text>
  <text x="300" y="108" font-size="10" fill="#999">← y 序列：5, 3, 4</text>

  <text x="60" y="152" font-size="10.5" fill="#3a5a30">② 对 y 做严格 LIS（patience sorting，lower_bound 替换）</text>

  <rect x="60" y="162" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="75" y="180" text-anchor="middle" font-size="9.5" fill="#8a6a20">y=5</text>
  <text x="100" y="180" font-size="10" fill="#555">tails = [5]（首元素直接放入）</text>

  <rect x="60" y="194" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="75" y="212" text-anchor="middle" font-size="9.5" fill="#8a6a20">y=3</text>
  <text x="100" y="212" font-size="10" fill="#555">3 &lt; 5 → 替换掉 5，tails = [3]（长度不变）</text>

  <rect x="60" y="226" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="75" y="244" text-anchor="middle" font-size="9.5" fill="#8a6a20">y=4</text>
  <text x="100" y="244" font-size="10" fill="#555">4 &gt; 3 → 追加，tails = [3, 4]，长度 2 ✓</text>

  <rect x="300" y="152" width="220" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="172" text-anchor="middle" font-size="10" fill="#3a5a30">为什么同 x 要降序？</text>
  <text x="410" y="191" text-anchor="middle" font-size="9.5" fill="#555">升序时 (1,3) 在 (1,5) 前，</text>
  <text x="410" y="207" text-anchor="middle" font-size="9.5" fill="#555">y 序列变 3,5,4，LIS = 2 会选中</text>
  <text x="410" y="223" text-anchor="middle" font-size="9.5" fill="#555">3,5 —— 而这两个点 x 相同，非法</text>
  <text x="410" y="241" text-anchor="middle" font-size="9.5" fill="#b85450">降序保证同 x 的 y 呈递减，选不进 LIS</text>

  <rect x="40" y="266" width="490" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="285" y="288" text-anchor="middle" font-size="10.5" fill="#8a6a20">严格递增用 lower_bound（非严格才用 upper_bound）——写反会漏掉「相等不许连」的限制</text>

  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#555">x 严格递增由排序位置保证，y 严格递增由 LIS 保证 ⟹ 链在二维都严格上升</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#999">复杂度 O(n log n)：排序一次 + 每个点一次二分</text>
</svg>
