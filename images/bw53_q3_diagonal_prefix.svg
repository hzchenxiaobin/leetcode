<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">对角线前缀和：菱形四条边各做一次 O(1) 区间差查询</text>

  <!-- 左：两条对角线方向 -->
  <text x="160" y="62" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">两条对角线方向</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="90" width="40" height="40" fill="#fafafa" stroke="#ddd" rx="4"/>
    <rect x="100" y="90" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="140" y="90" width="40" height="40" fill="#fafafa" stroke="#ddd" rx="4"/>
    <rect x="60" y="130" width="40" height="40" fill="#fafafa" stroke="#ddd" rx="4"/>
    <rect x="100" y="130" width="40" height="40" fill="#fafafa" stroke="#ddd" rx="4"/>
    <rect x="140" y="130" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="60" y="170" width="40" height="40" fill="#fafafa" stroke="#ddd" rx="4"/>
    <rect x="100" y="170" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="140" y="170" width="40" height="40" fill="#fafafa" stroke="#ddd" rx="4"/>
    <rect x="180" y="90" width="4" height="4" fill="none"/>
  </g>
  <path d="M 120 150 Q 140 148, 160 132" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 160 110 Q 142 108, 122 126" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="120" y="230" fill="#33507a">s1（↘）：s1[i][j] = grid[i][j] + s1[i−1][j−1]</text>
    <text x="120" y="250" fill="#2d5a22">s2（↙）：s2[i][j] = grid[i][j] + s2[i−1][j+1]</text>
  </g>
  <rect x="50" y="266" width="260" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="180" y="286" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">段和 = 前缀和之差：T→R 段和</text>
  <text x="180" y="304" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">= s1[R] − s1[T 上方一格]</text>

  <!-- 右：四条边 = 四次查询 -->
  <text x="428" y="62" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">菱形周长 = 四条对角线段</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="330" y="80" width="196" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="428" y="98" text-anchor="middle">T → R：沿 ↘ 方向</text>
    <text x="428" y="114" text-anchor="middle" fill="#666" font-size="11.5">diag1(T, R)</text>
    <rect x="330" y="128" width="196" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="428" y="146" text-anchor="middle">R → B：沿 ↙ 方向</text>
    <text x="428" y="162" text-anchor="middle" fill="#666" font-size="11.5">diag2(R, B)</text>
    <rect x="330" y="176" width="196" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="428" y="194" text-anchor="middle">L → B：沿 ↘ 方向</text>
    <text x="428" y="210" text-anchor="middle" fill="#666" font-size="11.5">diag1(L, B)</text>
    <rect x="330" y="224" width="196" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="428" y="242" text-anchor="middle">T → L：沿 ↙ 方向</text>
    <text x="428" y="258" text-anchor="middle" fill="#666" font-size="11.5">diag2(T, L)</text>
  </g>
  <rect x="330" y="276" width="196" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="293" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">四个角各被相邻两边算两次</text>
  <text x="428" y="309" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">总和要再减去四角的值各一次</text>

  <rect x="50" y="330" width="476" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="288" y="354" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">预处理 O(mn)，之后每个菱形求和 O(1)（不含 r=0 特判）</text>
</svg>
