<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">逆序思考：从 target 倒着「擦」回全 ?</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">正向：从 "?????" 盖章，答案顺序依赖前一步</text>
  <text x="60" y="92" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">逆向：从 target 出发，每次找一个「能完全对齐」的位置擦成 ?</text>
  <rect x="60" y="112" width="540" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="137.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">合法性：擦掉的每个字符都等于 stamp 对应位置；至少擦掉一个非 ? 字符</text>
  <rect x="60" y="168" width="540" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="193.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">反复擦直到全 ?；若还有非 ? 残留 → 不可能印出，返回空数组</text>
  <rect x="60" y="224" width="540" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="250.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">把擦除顺序反转，就是盖章顺序</text>
  <text x="60" y="300" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">为什么贪心可行：先擦的位置在正向里最后盖，</text>
  <text x="60" y="326" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">它只依赖当前 target 的已有字符，不影响更早的擦除</text>
  <text x="330" y="372" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">维护每个起点「已对上的字符数」，凑满 stamp 长度即可擦，无需反复全量扫描</text>
  <text x="330" y="400" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每个位置只擦一次、每个起点最多入队一次 → 总 O(n·m)，答案步数 ≤ n ≤ 10×target.length</text>
</svg>
