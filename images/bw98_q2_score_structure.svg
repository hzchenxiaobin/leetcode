<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">排序后分数只由三个统计量决定</text>

  <!-- 排序数组 -->
  <text x="280" y="62" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="middle">排序：a₀ ≤ a₁ ≤ a₂ ≤ … ≤ aₙ₋₃ ≤ aₙ₋₂ ≤ aₙ₋₁</text>
  <g filter="url(#rough2)">
    <rect x="60" y="74" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="116" y="74" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="172" y="74" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="228" y="74" width="56" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="284" y="74" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="340" y="74" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="396" y="74" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="88" y="99">a₀</text><text x="144" y="99">a₁</text><text x="200" y="99">a₂</text>
    <text x="256" y="99">…</text><text x="312" y="99">aₙ₋₃</text><text x="368" y="99">aₙ₋₂</text><text x="424" y="99">aₙ₋₁</text>
  </g>
  <!-- 最大得分：首尾 -->
  <path d="M 88 118 C 88 140, 240 150, 416 118" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="152" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">最大得分 = aₙ₋₁ − a₀（极差）</text>
  <!-- 最小得分：相邻 -->
  <path d="M 200 116 C 208 128, 218 128, 226 116" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="176" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最小得分 = min 相邻差</text>

  <!-- 三个候选 -->
  <text x="280" y="212" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">三个候选方案（最小得分都可归零）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="228" width="152" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="60" y="234" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <rect x="102" y="234" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
  </g>
  <text x="116" y="252" font-size="10.5" fill="#8a3a34" text-anchor="middle" filter="url(#rough2)">改</text>
  <text x="122" y="252" font-size="10.5" fill="#8a3a34" text-anchor="middle" filter="url(#rough2)"> </text>
  <text x="116" y="278" font-size="11.5" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">改两个最小 → aₙ₋₁ − a₂</text>

  <g filter="url(#rough2)">
    <rect x="204" y="228" width="152" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="254" y="234" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <rect x="296" y="234" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
  </g>
  <text x="280" y="278" font-size="11.5" fill="#2d4a66" text-anchor="middle" filter="url(#rough2)">两端各改一个 → aₙ₋₂ − a₁</text>

  <g filter="url(#rough2)">
    <rect x="368" y="228" width="152" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <rect x="418" y="234" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <rect x="460" y="234" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
  </g>
  <text x="444" y="278" font-size="11.5" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">改两个最大 → aₙ₋₃ − a₀</text>

  <!-- 结论 -->
  <rect x="80" y="300" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">答案 = min(三个候选极差)</text>

  <rect x="60" y="348" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">改中间元素毫无收益：动不了极值也压不平相邻差</text>
</svg>
