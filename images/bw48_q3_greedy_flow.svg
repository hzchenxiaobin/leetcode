<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序后从小到大吃硬币，吃不动立即停</text>

  <ellipse cx="110" cy="80" rx="52" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="85" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">coins 排序</text>
  <path d="M 162 80 L 198 80" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="198" y="60" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="243" y="78" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">x = 0</text>
  <text x="243" y="94" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（空集构造 0）</text>
  <path d="M 288 80 L 320 80" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="330,52 452,80 330,108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="388" y="76" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">还有硬币？</text>
  <text x="388" y="92" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">（取最小者 c）</text>

  <!-- 是分支 -->
  <path d="M 452 80 L 486 80" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="72" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <polygon points="500,60 548,80 500,100" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="524" y="76" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">c ≤</text>
  <text x="524" y="90" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">x+1?</text>

  <!-- c <= x+1: x += c -->
  <path d="M 500 100 Q 480 150 430 158 L 300 158" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="130" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="200" y="138" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="163" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">x += c</text>
  <path d="M 200 158 Q 150 158 120 106" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="140" font-size="10" fill="#4a7a3a" filter="url(#rough2)">继续取下一枚</text>

  <!-- c > x+1: break -->
  <path d="M 548 80 Q 552 200 420 210" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="537" y="150" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="300" y="192" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="215" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">break（后面更大）</text>
  <path d="M 300 210 Q 180 220 160 150" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- 结束 -->
  <path d="M 330 52 Q 330 30 240 30" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="34" font-size="11" fill="#999" filter="url(#rough2)">否（硬币耗尽）</text>
  <rect x="110" y="14" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="35" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">返回 x+1</text>
  <path d="M 150 46 L 118 62" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 说明 -->
  <rect x="40" y="250" width="480" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="56" y="274" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">x 的含义是「0..x 全部可构造」；返回 x+1 是因为 0 本身算一个（题目从 0 开始含 0）。</text>
  <text x="56" y="296" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">为什么必须排序：若先遇到大硬币而小硬币藏在后面，会把「暂时吃不下」误判成「永远吃不下」；</text>
  <text x="56" y="318" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">从小到大处理后，一旦 c &gt; x+1，所有还没处理的硬币都 ≥ c，才能名正言顺地 break。</text>
  <text x="56" y="338" font-size="11" fill="#888" filter="url(#rough2)">时间 O(n log n)（排序）+ O(n)（扫描）；空间 O(1) 额外。</text>
</svg>
