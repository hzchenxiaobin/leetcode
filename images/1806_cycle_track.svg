<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="452" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">只追踪一个元素：答案 = 元素 1 所在圈的长度</text>
  <path d="M 170 40 Q 340 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left panel: cycle decomposition ===== -->
  <g filter="url(#sk)">
    <rect x="20" y="56" width="330" height="304" rx="10" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.4"/>
  </g>
  <text x="185" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">n = 8 时 σ 的圈分解（m = n − 1 = 7）</text>

  <!-- fixed points -->
  <g filter="url(#sk)">
    <circle cx="60" cy="112" r="14" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
    <circle cx="60" cy="172" r="14" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
  </g>
  <g stroke="#999" stroke-width="1.4" fill="none" filter="url(#sk)">
    <path d="M 50,103 Q 60,88 70,103" marker-end="url(#ar)"/>
    <path d="M 50,163 Q 60,148 70,163" marker-end="url(#ar)"/>
  </g>
  <text x="60" y="116" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#666">0</text>
  <text x="60" y="176" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#666">7</text>
  <text x="90" y="116" font-size="10.5" fill="#999">不动点</text>
  <text x="90" y="176" font-size="10.5" fill="#999">不动点</text>

  <!-- cycle A: 1 -> 2 -> 4 -> 1 (element 1's cycle) -->
  <g stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)">
    <path d="M 112,144 Q 145,131 177,144" marker-end="url(#aro)"/>
    <path d="M 187,162 Q 183,205 159,226" marker-end="url(#aro)"/>
    <path d="M 131,226 Q 106,205 101,164" marker-end="url(#aro)"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="95" cy="148" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <circle cx="195" cy="148" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <circle cx="145" cy="238" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="12.5" text-anchor="middle" font-weight="bold" fill="#7a5415">
    <text x="95" y="152">1</text><text x="195" y="152">2</text><text x="145" y="242">4</text>
  </g>
  <text x="145" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">元素 1 在这个圈（长 3）</text>

  <!-- cycle B: 3 -> 6 -> 5 -> 3 -->
  <g stroke="#446688" stroke-width="1.7" fill="none" filter="url(#sk)">
    <path d="M 270,146 Q 288,133 307,146" marker-end="url(#arb)"/>
    <path d="M 314,164 Q 316,200 297,220" marker-end="url(#arb)"/>
    <path d="M 276,220 Q 258,200 253,164" marker-end="url(#arb)"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="255" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="322" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="288" cy="232" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold" fill="#446688">
    <text x="255" y="154">3</text><text x="322" y="154">6</text><text x="288" y="236">5</text>
  </g>
  <text x="288" y="264" text-anchor="middle" font-size="11" fill="#446688">另一个圈（长 3）</text>

  <text x="185" y="308" text-anchor="middle" font-size="11.5" fill="#444">两个长度 3 的圈 + 两个不动点</text>
  <text x="185" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">σ 的阶 = lcm(3, 3) = 3 = 答案</text>

  <!-- ===== right top panel: track element 1 ===== -->
  <g filter="url(#sk)">
    <rect x="370" y="56" width="290" height="180" rx="10" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.4"/>
  </g>
  <text x="515" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">追踪元素 1（n = 8：pos ← 2·pos mod 7）</text>
  <g filter="url(#sk)">
    <circle cx="415" cy="122" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="515" cy="122" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="615" cy="122" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="12.5" text-anchor="middle" font-weight="bold" fill="#446688">
    <text x="415" y="126">1</text><text x="515" y="126">2</text><text x="615" y="126">4</text>
  </g>
  <g stroke="#446688" stroke-width="1.7" fill="none" filter="url(#sk)">
    <path d="M 432,122 L 494,122" marker-end="url(#arb)"/>
    <path d="M 532,122 L 594,122" marker-end="url(#arb)"/>
    <path d="M 631,124 C 652,180 600,197 515,197 C 430,197 378,180 399,138" marker-end="url(#arb)"/>
  </g>
  <text x="463" y="112" text-anchor="middle" font-size="11.5" fill="#444">×2</text>
  <text x="563" y="112" text-anchor="middle" font-size="11.5" fill="#444">×2</text>
  <text x="515" y="214" text-anchor="middle" font-size="11" fill="#b85450">×2：8 ≡ 1 (mod 7)，回家！</text>
  <text x="515" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1 → 2 → 4 → 1，3 步 → 答案 = 3</text>

  <!-- ===== right bottom panel: why one element suffices ===== -->
  <g filter="url(#sk)">
    <rect x="370" y="252" width="290" height="108" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="515" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">为什么只追一个就够？</text>
  <text x="515" y="292" text-anchor="middle" font-size="10.8" fill="#333">圈长 ℓ(j) = 2 模 m/gcd(j,m) 的乘法阶</text>
  <text x="515" y="310" text-anchor="middle" font-size="10.8" fill="#333">m/gcd(j,m) 整除 m ⟹ ℓ(j) 整除 ℓ(1)</text>
  <text x="515" y="328" text-anchor="middle" font-size="10.8" fill="#333">元素 1 回家 ⟹ 所有元素同时回家</text>
  <text x="515" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">且它绝不提前回家 ⟹ 步数恰为答案</text>

  <!-- ===== bottom callout ===== -->
  <g filter="url(#sk)">
    <rect x="20" y="376" width="640" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">置换的阶 = 各圈长的最小公倍数；元素 1 的圈长恰是所有圈长的倍数</text>
  <text x="340" y="420" text-anchor="middle" font-size="11.5" fill="#444">于是一个 do-while、一个位置变量，O(答案) 时间 + O(1) 空间即可求解</text>
</svg>
