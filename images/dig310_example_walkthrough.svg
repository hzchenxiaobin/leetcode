  <!-- 图例 -->
  <rect x="102" y="182" width="14" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="122" y="192" font-size="10.5" fill="#666" filter="url(#rough2)">深度达峰值 3</text>
