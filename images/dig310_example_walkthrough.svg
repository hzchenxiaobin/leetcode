  <!-- 说明框 -->
  <rect x="30" y="204" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11.5" fill="#6b5320" filter="url(#rough2)">x = 2 与 x = 5 处：三个区间同时覆盖该点 → 深度冲到峰值 3</text>

  <rect x="30" y="250" width="460" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">x = 9：[6,8] 的减号生效于 r+1 = 9 → 深度回落（闭区间覆盖含右端点）</text>

  <text x="260" y="312" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">最终 ans = 3 ✓ 分组：①{[1,5],[6,8]} ②{[2,3],[5,10]} ③{[1,10]}</text>
  <text x="260" y="338" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">n 个区间只产生 2n 个事件（黄格仅 6 处）——值域稀疏时可用事件排序替代全值域扫描</text>
