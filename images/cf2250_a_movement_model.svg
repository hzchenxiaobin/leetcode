<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="16.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">完美 k 的等价结构：奇数位一律右移、偶数位一律左移</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">位置 1 只能由元素 2 左移填充，位置 n 只能由元素 n−1 右移填充 ⇒ 整条链被迫交替（以 n=6 为例）</text>

  <!-- 位置 0 -->
  <rect x="39" y="96" width="78" height="62" rx="6" fill="#f0f0f0" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="78" y="116" text-anchor="middle" font-size="10.5" fill="#7b8794" filter="url(#rough2)">位置 0</text>
  <text x="78" y="140" text-anchor="middle" font-size="13" fill="#7b8794" filter="url(#rough2)">空</text>
  <!-- 奇数位 1,3,5 -->
  <rect x="131" y="96" width="78" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="116" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">位置 1</text>
  <text x="170" y="142" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">w₁</text>
  <rect x="315" y="96" width="78" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="354" y="116" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">位置 3</text>
  <text x="354" y="142" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">w₃</text>
  <rect x="499" y="96" width="78" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="538" y="116" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">位置 5</text>
  <text x="538" y="142" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">w₅</text>
  <!-- 偶数位 2,4,6 -->
  <rect x="223" y="96" width="78" height="62" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="262" y="116" text-anchor="middle" font-size="10.5" fill="#37662c" filter="url(#rough2)">位置 2</text>
  <text x="262" y="142" text-anchor="middle" font-size="14" fill="#37662c" filter="url(#rough2)">w₂</text>
  <rect x="407" y="96" width="78" height="62" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="116" text-anchor="middle" font-size="10.5" fill="#37662c" filter="url(#rough2)">位置 4</text>
  <text x="446" y="142" text-anchor="middle" font-size="14" fill="#37662c" filter="url(#rough2)">w₄</text>
  <rect x="591" y="96" width="78" height="62" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="630" y="116" text-anchor="middle" font-size="10.5" fill="#37662c" filter="url(#rough2)">位置 6</text>
  <text x="630" y="142" text-anchor="middle" font-size="14" fill="#37662c" filter="url(#rough2)">w₆</text>
  <!-- 位置 7 -->
  <rect x="683" y="96" width="78" height="62" rx="6" fill="#f0f0f0" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="722" y="116" text-anchor="middle" font-size="10.5" fill="#7b8794" filter="url(#rough2)">位置 7</text>
  <text x="722" y="140" text-anchor="middle" font-size="13" fill="#7b8794" filter="url(#rough2)">空</text>

  <!-- 方向与落点 -->
  <text x="170" y="184" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">右移 ➜ 落 2</text>
  <text x="354" y="184" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">右移 ➜ 落 4</text>
  <text x="538" y="184" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">右移 ➜ 落 6</text>
  <text x="262" y="184" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">左移 ➜ 落 1</text>
  <text x="446" y="184" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">左移 ➜ 落 3</text>
  <text x="630" y="184" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">左移 ➜ 落 5</text>

  <text x="78" y="184" text-anchor="middle" font-size="10.5" fill="#9aa5b1" filter="url(#rough2)">必须保持空</text>
  <text x="722" y="184" text-anchor="middle" font-size="10.5" fill="#9aa5b1" filter="url(#rough2)">必须保持空</text>
  <path d="M 170 96 Q 216 66 262 96" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 354 96 Q 400 66 446 96" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 538 96 Q 584 66 630 96" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="212" width="330" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="221" y="238" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">奇数位 1,3,5,… 必须右移 ⇒ w_i &gt; k</text>
  <text x="221" y="262" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">⇒ k &lt; min{w₁,w₃,…} = mn</text>
  <rect x="414" y="212" width="330" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="579" y="238" text-anchor="middle" font-size="12.5" fill="#37662c" filter="url(#rough2)">偶数位 2,4,6,… 必须左移 ⇒ w_i &lt; k</text>
  <text x="579" y="262" text-anchor="middle" font-size="12.5" fill="#37662c" filter="url(#rough2)">⇒ k &gt; max{w₂,w₄,…} = mx</text>

  <rect x="140" y="300" width="520" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="334" text-anchor="middle" font-size="15" fill="#8a6320" font-weight="bold" filter="url(#rough2)">完美 k 存在 ⇔ mx &lt; k &lt; mn ⇔ mn − mx ≥ 2</text>

  <text x="400" y="386" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">n 为奇数时：交替链推出 w_n &gt; k，但元素 n 必须左移（否则占住位置 n+1）⇒ w_n &lt; k，矛盾</text>
  <text x="400" y="408" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">⇒ 奇数 n（含 n=1）一律 NO；偶数 n 才可能 YES，且要求奇偶两组的极差至少为 2</text>
  <text x="400" y="430" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">注意：k 必须是整数，所以是「至少差 2」而不是「至少差 1」——差 1 时区间里没有整数</text>
</svg>
