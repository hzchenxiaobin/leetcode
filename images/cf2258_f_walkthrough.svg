<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：自底向上，增量多重集怎样长出来</text>
  <path d="M 106 39 Q 380 46 654 39" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- ==================== 左面板：树 ==================== -->
  <rect x="16" y="48" width="290" height="330" rx="10" fill="#f7fbff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="161" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n = 5，a = [0, +1, −1, 0, +1]</text>

  <g filter="url(#rough2)">
    <path d="M 150 86 L 92 168" stroke="#55606e" stroke-width="1.5" fill="none"/>
    <path d="M 150 86 L 212 168" stroke="#55606e" stroke-width="1.5" fill="none"/>
    <path d="M 92 168 L 56 250" stroke="#55606e" stroke-width="1.5" fill="none"/>
    <path d="M 92 168 L 142 250" stroke="#55606e" stroke-width="1.5" fill="none"/>

    <circle cx="150" cy="86" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="150" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a36">1</text>
    <circle cx="92" cy="168" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="92" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">2</text>
    <circle cx="212" cy="168" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="212" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">3</text>
    <circle cx="56" cy="250" r="17" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="56" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e">4</text>
    <circle cx="142" cy="250" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="142" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520">5</text>

    <text x="150" y="56" text-anchor="middle" font-size="11.5" fill="#8f3a36">a₁ = 0（自由）</text>
    <text x="52" y="140" text-anchor="middle" font-size="11.5" fill="#2f4a66">a₂ = +1</text>
    <text x="252" y="140" text-anchor="middle" font-size="11.5" fill="#2f4a66">a₃ = −1</text>
    <text x="56" y="292" text-anchor="middle" font-size="11.5" fill="#3c5e2e">a₄ = 0</text>
    <text x="142" y="292" text-anchor="middle" font-size="11.5" fill="#8a6520">a₅ = +1</text>

    <text x="161" y="322" text-anchor="middle" font-size="11" fill="#55606e">自由点 1 与 4 可以自由取 ±1</text>
    <text x="161" y="342" text-anchor="middle" font-size="11" fill="#55606e">固定点 2、3、5 被题面钉死</text>
    <text x="161" y="362" text-anchor="middle" font-size="11" fill="#55606e">s：5, 3, 1, 1, 1</text>
  </g>

  <!-- ==================== 右面板：表 ==================== -->
  <rect x="318" y="48" width="426" height="330" rx="10" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="531" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6520" filter="url(#rough2)">自底向上（行序即处理顺序）</text>

  <g filter="url(#rough2)">
    <text x="344" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#55606e">顶点</text>
    <text x="388" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#55606e">a_v</text>
    <text x="462" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#55606e">f(v) 可达区间</text>
    <text x="568" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#55606e">增量表</text>
    <text x="676" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#55606e">代价 k : cost</text>
    <path d="M 330 98 Q 531 102 734 98" stroke="#9aa0a6" stroke-width="1" fill="none"/>
  </g>

  <g filter="url(#rough2)">
    <text x="344" y="120" text-anchor="middle" font-size="11" fill="#2f4a66">4</text>
    <text x="388" y="120" text-anchor="middle" font-size="11" fill="#2f4a66">0</text>
    <text x="462" y="120" text-anchor="middle" font-size="11" fill="#2f4a66">[−1, 1]</text>
    <text x="568" y="120" text-anchor="middle" font-size="11" fill="#3c5e2e">[0]</text>
    <text x="676" y="120" text-anchor="middle" font-size="10.5" fill="#2f4a66">−1 : 1　1 : 1</text>
  </g>
  <g filter="url(#rough2)">
    <text x="344" y="146" text-anchor="middle" font-size="11" fill="#2f4a66">5</text>
    <text x="388" y="146" text-anchor="middle" font-size="11" fill="#2f4a66">+1</text>
    <text x="462" y="146" text-anchor="middle" font-size="11" fill="#2f4a66">{1}</text>
    <text x="568" y="146" text-anchor="middle" font-size="11" fill="#8a6520">∅</text>
    <text x="676" y="146" text-anchor="middle" font-size="10.5" fill="#2f4a66">1 : 1</text>
  </g>
  <g filter="url(#rough2)">
    <text x="344" y="172" text-anchor="middle" font-size="11" fill="#2f4a66">3</text>
    <text x="388" y="172" text-anchor="middle" font-size="11" fill="#2f4a66">−1</text>
    <text x="462" y="172" text-anchor="middle" font-size="11" fill="#2f4a66">{−1}</text>
    <text x="568" y="172" text-anchor="middle" font-size="11" fill="#8a6520">∅</text>
    <text x="676" y="172" text-anchor="middle" font-size="10.5" fill="#2f4a66">−1 : 1</text>
  </g>
  <g filter="url(#rough2)">
    <text x="344" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3a36">2</text>
    <text x="388" y="198" text-anchor="middle" font-size="11" fill="#2f4a66">+1</text>
    <text x="462" y="198" text-anchor="middle" font-size="11" fill="#2f4a66">[1, 3]</text>
    <text x="568" y="198" text-anchor="middle" font-size="11" fill="#8f3a36">[−2]</text>
    <text x="676" y="198" text-anchor="middle" font-size="10.5" fill="#2f4a66">3 : 5　1 : 3</text>
  </g>
  <g filter="url(#rough2)">
    <text x="344" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3a36">1</text>
    <text x="388" y="224" text-anchor="middle" font-size="11" fill="#2f4a66">0</text>
    <text x="462" y="224" text-anchor="middle" font-size="11" fill="#2f4a66">[−1, 3]</text>
    <text x="568" y="224" text-anchor="middle" font-size="11" fill="#8f3a36">[−4, 0]</text>
    <text x="676" y="224" text-anchor="middle" font-size="10.5" fill="#2f4a66">3:9　1:5　−1:5</text>
  </g>

  <g filter="url(#rough2)">
    <text x="531" y="252" text-anchor="middle" font-size="11" fill="#2f4a66">v4：自由叶子 ⇒ 插一个 0；两端代价都是 |k| = 1</text>
    <text x="531" y="274" text-anchor="middle" font-size="11" fill="#2f4a66">v2：S = 2, A = B = 1 ⇒ 位置 1 领 −2；at_lo = 1+1+|3| = 5</text>
    <text x="531" y="296" text-anchor="middle" font-size="11" fill="#2f4a66">v1：S = 4, A = 2, B = 3，窗口 i ∈ [1,3]</text>
    <text x="531" y="316" text-anchor="middle" font-size="11" fill="#2f4a66">　　位置 2 ≤ A ⇒ −2；位置 3 = B（S+1 为奇）⇒ 不动</text>
    <text x="531" y="338" text-anchor="middle" font-size="11" fill="#2f4a66">v1 合并后 [−2, 0]，加 |k| 后 [−4, 0]，at_lo = 5+1+|3| = 9</text>
    <text x="531" y="360" text-anchor="middle" font-size="11" fill="#8f3a36">答案 = 9 + (−4) + 0 = 5</text>
  </g>

  <rect x="16" y="390" width="728" height="30" rx="8" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="410" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">负增量就是「把 f(v) 压小能省下的钱」，全部取走即得最小值；根节点答案为 5，与官方一致</text>
</svg>
