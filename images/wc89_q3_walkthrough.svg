<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="360" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 10，依次 seat、seat、seat、seat、leave(4)、seat</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">灰色行是 leave 之后的状态；每行给出三类候选的距离</text>
  <rect x="24" y="86" width="82" height="32" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="105.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">操作</text>
  <rect x="106" y="86" width="118" height="32" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="105.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">已坐集合</text>
  <rect x="224" y="86" width="108" height="32" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="278" y="105.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">候选与距离</text>
  <rect x="332" y="86" width="200" height="32" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="432" y="105.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">决策</text>
  <rect x="532" y="86" width="66" height="32" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="565" y="105.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">返回</text>
  <rect x="24" y="118" width="82" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="137.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">① seat</text>
  <rect x="106" y="118" width="118" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="137.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">∅</text>
  <rect x="224" y="118" width="108" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="278" y="137.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">教室空</text>
  <rect x="332" y="118" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="432" y="137.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">直接坐 0</text>
  <rect x="532" y="118" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="565" y="137.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="24" y="150" width="82" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="169.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">② seat</text>
  <rect x="106" y="150" width="118" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="169.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">{0}</text>
  <rect x="224" y="150" width="108" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="278" y="169.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">左边缘 无 / 右边缘 9</text>
  <rect x="332" y="150" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="432" y="169.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">9 最大</text>
  <rect x="532" y="150" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="565" y="169.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">9</text>
  <rect x="24" y="182" width="82" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="201.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">③ seat</text>
  <rect x="106" y="182" width="118" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="201.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">{0, 9}</text>
  <rect x="224" y="182" width="108" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="278" y="201.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">内部 (0,9)：距离 4</text>
  <rect x="332" y="182" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="432" y="201.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">4 最大</text>
  <rect x="532" y="182" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="565" y="201.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="24" y="214" width="82" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="233.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">④ seat</text>
  <rect x="106" y="214" width="118" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="233.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">{0, 4, 9}</text>
  <rect x="224" y="214" width="108" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="278" y="233.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">内部 (0,4)=2、(4,9)=2</text>
  <rect x="332" y="214" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="432" y="233.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">并列取小编号 2</text>
  <rect x="532" y="214" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="565" y="233.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="24" y="246" width="82" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="265.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">⑤ leave(4)</text>
  <rect x="106" y="246" width="118" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="265.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">{0, 2, 9}</text>
  <rect x="224" y="246" width="108" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="278" y="265.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">合并出间隙 (2, 9)</text>
  <rect x="332" y="246" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="432" y="265.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">—</text>
  <rect x="532" y="246" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="565" y="265.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">—</text>
  <rect x="24" y="278" width="82" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="297.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">⑥ seat</text>
  <rect x="106" y="278" width="118" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="297.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">{0, 2, 9}</text>
  <rect x="224" y="278" width="108" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="278" y="297.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">内部 (2,9)：距离 3</text>
  <rect x="332" y="278" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="432" y="297.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3 最大</text>
  <rect x="532" y="278" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="565" y="297.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="24" y="306" width="572" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="324" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">第 ④ 步两个内部间隙距离同为 2，按「编号最小」取 2 号；第 ⑥ 步 4 号离开后 (2, 9) 变成一条大间隙，</text>
</svg>
