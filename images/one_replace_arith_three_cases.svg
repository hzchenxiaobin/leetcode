<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">替换位置 p 与子数组 [l, r] 的三种位置关系</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">至多改一处 ⟹ 最优解结构由「替换位 p」与所选子数组的关系完全决定</text>

  <!-- 情形一 -->
  <text x="30" y="80" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">情形一：p 不在 [l, r] 内（或不变换）</text>
  <g filter="url(#r)">
    <rect x="78" y="92" width="46" height="30" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="124" y="92" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="170" y="92" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="216" y="92" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="262" y="92" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="308" y="92" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="354" y="92" width="46" height="30" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="400" y="92" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="101" y="112" text-anchor="middle" font-size="12" fill="#999">3</text>
    <text x="147" y="112" text-anchor="middle" font-size="12" fill="#333">6</text>
    <text x="193" y="112" text-anchor="middle" font-size="12" fill="#333">8</text>
    <text x="239" y="112" text-anchor="middle" font-size="12" fill="#333">10</text>
    <text x="285" y="112" text-anchor="middle" font-size="12" fill="#333">12</text>
    <text x="331" y="112" text-anchor="middle" font-size="12" fill="#333">14</text>
    <text x="377" y="112" text-anchor="middle" font-size="12" fill="#999">40</text>
    <text x="423" y="112" text-anchor="middle" font-size="12" fill="#333">7</text>
    <text x="147" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">l</text>
    <text x="331" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">r</text>
    <text x="423" y="134" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">p</text>
    <text x="423" y="88" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">替换位</text>
  </g>
  <text x="30" y="158" font-size="11" fill="#4a7a3a" filter="url(#r)">[l, r] 自身等差 → 候选 = 全局最长等差段 max(left)，图中 [6, 8, 10, 12, 14] 长 5</text>

  <!-- 情形二 -->
  <text x="30" y="197" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#r)">情形二：p 是子数组端点（v 自由适配）</text>
  <g filter="url(#r)">
    <rect x="78" y="209" width="46" height="30" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="124" y="209" width="46" height="30" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="170" y="209" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="216" y="209" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="262" y="209" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="308" y="209" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="354" y="209" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="400" y="209" width="46" height="30" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <text x="101" y="229" text-anchor="middle" font-size="12" fill="#999">9</text>
    <text x="147" y="229" text-anchor="middle" font-size="12" fill="#999">9</text>
    <text x="193" y="229" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">99</text>
    <text x="239" y="229" text-anchor="middle" font-size="12" fill="#333">8</text>
    <text x="285" y="229" text-anchor="middle" font-size="12" fill="#333">12</text>
    <text x="331" y="229" text-anchor="middle" font-size="12" fill="#333">16</text>
    <text x="377" y="229" text-anchor="middle" font-size="12" fill="#333">20</text>
    <text x="423" y="229" text-anchor="middle" font-size="12" fill="#999">5</text>
    <text x="193" y="251" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">p = l</text>
    <text x="377" y="251" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">r</text>
    <text x="193" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">替换位</text>
  </g>
  <text x="30" y="275" font-size="11" fill="#d6a040" filter="url(#r)">右侧 [p+1, r] 等差即可 → 候选 = 1 + right[p+1]；p = r 时对称：1 + left[p−1]</text>

  <!-- 情形三 -->
  <text x="30" y="314" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">情形三：p 在子数组内部（l &lt; p &lt; r）</text>
  <g filter="url(#r)">
    <rect x="78" y="326" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="124" y="326" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="170" y="326" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="216" y="326" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="326" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="308" y="326" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="354" y="326" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="400" y="326" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="446" y="326" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="101" y="346" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="147" y="346" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="193" y="346" text-anchor="middle" font-size="12" fill="#333">8</text>
    <text x="239" y="346" text-anchor="middle" font-size="12" fill="#333">11</text>
    <text x="285" y="346" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">50</text>
    <text x="331" y="346" text-anchor="middle" font-size="12" fill="#333">17</text>
    <text x="377" y="346" text-anchor="middle" font-size="12" fill="#333">20</text>
    <text x="423" y="346" text-anchor="middle" font-size="12" fill="#333">23</text>
    <text x="469" y="346" text-anchor="middle" font-size="12" fill="#333">26</text>
    <text x="285" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">替换位 p</text>
    <text x="170" y="370" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">左段，公差 d</text>
    <text x="385" y="370" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">右段，公差 d</text>
  </g>
  <text x="30" y="388" font-size="11" fill="#b85450" filter="url(#r)">两侧同公差 d，v = nums[p−1]+d = nums[p+1]−d ⟹ nums[p+1]−nums[p−1] = 2d（必须偶数）</text>
</svg>
