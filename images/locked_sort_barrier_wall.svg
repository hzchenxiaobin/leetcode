<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：锁定的下标是「墙」——值不能穿越</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 好墙示例 -->
  <text x="42" y="84" font-size="12" font-weight="bold" fill="#2b6e9e">好墙示例</text>
  <text x="304" y="56" text-anchor="middle" font-size="11" fill="#8a6415" font-weight="bold">p=3 锁定，值 4 = p+1 ✓</text>
  <g filter="url(#sk)">
    <rect x="150" y="64" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="194" y="64" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="238" y="64" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="282" y="64" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="306" y="64" width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <path d="M 283 74 Q 302 72 325 74" stroke="#d6a040" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 283 84 Q 302 86 325 84" stroke="#d6a040" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="172" y="84" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="216" y="84" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="260" y="84" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="304" y="84" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">4</text>
  <text x="348" y="84" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">5</text>
  <text x="172" y="108" text-anchor="middle" font-size="10" fill="#777">0</text>
  <text x="216" y="108" text-anchor="middle" font-size="10" fill="#777">1</text>
  <text x="260" y="108" text-anchor="middle" font-size="10" fill="#777">2</text>
  <text x="304" y="108" text-anchor="middle" font-size="10" fill="#8a6415" font-weight="bold">3 ← 墙</text>
  <text x="348" y="108" text-anchor="middle" font-size="10" fill="#777">4</text>
  <path d="M 150 118 Q 216 128 282 118" stroke="#4a8edb" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="216" y="140" text-anchor="middle" font-size="11" fill="#2b6e9e">墙左 = {1,2,3}，全部 ≤ 3 → 无值需穿墙</text>
  <text x="394" y="140" font-size="11" fill="#2e6e2e">墙右 = {5}，全部 &gt; 4</text>

  <!-- 情形① -->
  <text x="42" y="182" font-size="12" font-weight="bold" fill="#b85450">情形 ① 墙上的值错了</text>
  <g filter="url(#sk)">
    <rect x="150" y="164" width="40" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="190" y="164" width="40" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="230" y="164" width="40" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="270" y="164" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="310" y="164" width="40" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="170" y="182" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="210" y="182" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="250" y="182" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">4</text>
  <text x="290" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="330" y="182" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">5</text>
  <text x="290" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 ≠ p+1=4 ✗</text>
  <text x="370" y="172" font-size="11" fill="#b85450">值 3 被锁死在原位，</text>
  <text x="370" y="188" font-size="11" fill="#b85450">回不了家（下标 2）</text>
  <text x="370" y="204" font-size="11" fill="#b85450" font-weight="bold">→ 这面墙必须解锁</text>

  <!-- 情形② -->
  <text x="42" y="248" font-size="12" font-weight="bold" fill="#b85450">情形 ② 值对，前缀混进大值</text>
  <g filter="url(#sk)">
    <rect x="150" y="230" width="40" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="190" y="230" width="40" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="230" y="230" width="40" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="270" y="230" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="310" y="230" width="40" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="170" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <text x="210" y="248" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="250" y="248" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="290" y="248" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">4</text>
  <text x="330" y="248" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">3</text>
  <path d="M 170 226 Q 230 214 284 226" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="288" y="218" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="370" y="238" font-size="11" fill="#b85450">max(nums[0..2]) = 5 ≠ 3</text>
  <text x="370" y="254" font-size="11" fill="#b85450">值 5 的家在墙右（下标 4），</text>
  <text x="370" y="270" font-size="11" fill="#b85450" font-weight="bold">却翻不过墙 → 必须解锁</text>

  <!-- 结论 -->
  <g filter="url(#sk)">
    <rect x="40" y="296" width="560" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">墙 p 想保留，必须同时满足两个条件：</text>
  <text x="320" y="344" text-anchor="middle" font-size="12" fill="#8a6415">① nums[p] = p+1（值已就位，锁不死错值）</text>
  <text x="320" y="364" text-anchor="middle" font-size="12" fill="#8a6415">② max(nums[0..p−1]) = p（前缀恰为 {1,…,p}，没有值需要穿墙）</text>
  <text x="320" y="384" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">任一条件不满足 → p 必须解锁（计入 forced）</text>
</svg>
