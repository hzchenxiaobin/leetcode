<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums = [1,1,2,3,2,1,2]</text>

  <!-- 数组 -->
  <text x="70" y="70" font-size="12" fill="#555" filter="url(#rough2)">数组：</text>
  <rect x="120" y="52" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="166" y="52" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="212" y="52" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="258" y="52" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="304" y="52" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="350" y="52" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="396" y="52" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="141" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="187" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="233" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="279" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="325" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="371" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="417" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>

  <!-- 分组演算 -->
  <text x="260" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">按值分组（下标天然升序）→ 每组只看相邻三个</text>

  <!-- 值 1 行 -->
  <rect x="36" y="152" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="177" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">值 1</text>
  <text x="128" y="177" font-size="13" fill="#333" filter="url(#rough2)">pos = [0, 1, 5]</text>
  <text x="300" y="177" font-size="13" fill="#333" filter="url(#rough2)">窗口 (0, 1, 5)</text>
  <text x="430" y="177" font-size="13" fill="#555" filter="url(#rough2)">距离 2×5 = 10</text>

  <!-- 值 2 行 -->
  <rect x="36" y="204" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="229" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">值 2</text>
  <text x="128" y="229" font-size="13" fill="#333" filter="url(#rough2)">pos = [2, 4, 6]</text>
  <text x="300" y="229" font-size="13" fill="#333" filter="url(#rough2)">窗口 (2, 4, 6)</text>
  <text x="430" y="229" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">距离 2×4 = 8 ✓</text>

  <!-- 值 3 行 -->
  <rect x="36" y="256" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="281" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">值 3</text>
  <text x="128" y="281" font-size="13" fill="#333" filter="url(#rough2)">pos = [3]</text>
  <text x="300" y="281" font-size="13" fill="#888" filter="url(#rough2)">不足 3 个，出局</text>

  <!-- 结论 -->
  <rect x="120" y="312" width="280" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">ans = min(10, 8) = 8</text>
</svg>
