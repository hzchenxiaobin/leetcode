<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：建表 → 找端点 → 沿链走查（示例 1）</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: adjacency table -->
  <text x="177" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">邻接表 adj</text>
  <g filter="url(#sk)"><rect x="55" y="80" width="60" height="26" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="115" y="80" width="110" height="26" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="225" y="80" width="75" height="26" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="85" y="97" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">元素</text>
  <text x="170" y="97" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">邻居</text>
  <text x="262" y="97" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">度数</text>

  <g filter="url(#sk)"><rect x="55" y="106" width="60" height="28" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="115" y="106" width="110" height="28" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="225" y="106" width="75" height="28" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="85" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06b1a">1</text>
  <text x="170" y="125" text-anchor="middle" font-size="12" fill="#a06b1a" font-family="monospace">[2]</text>
  <text x="262" y="125" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06b1a">1 ← 端点</text>

  <g filter="url(#sk)"><rect x="55" y="134" width="60" height="28" fill="#fff" stroke="#9aa5b1" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="115" y="134" width="110" height="28" fill="#fff" stroke="#9aa5b1" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="225" y="134" width="75" height="28" fill="#fff" stroke="#9aa5b1" stroke-width="1"/></g>
  <text x="85" y="153" text-anchor="middle" font-size="12" fill="#445">2</text>
  <text x="170" y="153" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">[1, 3]</text>
  <text x="262" y="153" text-anchor="middle" font-size="11" fill="#445">2</text>

  <g filter="url(#sk)"><rect x="55" y="162" width="60" height="28" fill="#fff" stroke="#9aa5b1" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="115" y="162" width="110" height="28" fill="#fff" stroke="#9aa5b1" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="225" y="162" width="75" height="28" fill="#fff" stroke="#9aa5b1" stroke-width="1"/></g>
  <text x="85" y="181" text-anchor="middle" font-size="12" fill="#445">3</text>
  <text x="170" y="181" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">[4, 2]</text>
  <text x="262" y="181" text-anchor="middle" font-size="11" fill="#445">2</text>

  <g filter="url(#sk)"><rect x="55" y="190" width="60" height="28" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="115" y="190" width="110" height="28" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="225" y="190" width="75" height="28" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="85" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06b1a">4</text>
  <text x="170" y="209" text-anchor="middle" font-size="12" fill="#a06b1a" font-family="monospace">[3]</text>
  <text x="262" y="209" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06b1a">1 ← 端点</text>

  <text x="177" y="242" text-anchor="middle" font-size="10.5" fill="#888">橙色行 = 度数 1 = 链的端点</text>

  <!-- right: walk steps -->
  <g filter="url(#sk)"><rect x="330" y="64" width="290" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="475" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5d85">起点 s = 1（度 1），prev = 哨兵 ∅</text>
  <text x="475" y="99" text-anchor="middle" font-size="12" fill="#2b5d85">curr = 2，ans = [1]</text>
  <path d="M 475 108 L 475 120" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="330" y="122" width="290" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="475" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5d85">2 的邻居 {1, 3}，排除 prev = 1</text>
  <text x="475" y="157" text-anchor="middle" font-size="12" fill="#2b5d85">→ next = 3，ans = [1, 2]</text>
  <path d="M 475 166 L 475 178" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="330" y="180" width="290" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="475" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5d85">3 的邻居 {4, 2}，排除 prev = 2</text>
  <text x="475" y="215" text-anchor="middle" font-size="12" fill="#2b5d85">→ next = 4，ans = [1, 2, 3]</text>
  <path d="M 475 224 L 475 236" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="330" y="238" width="290" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="475" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">4 只剩邻居 {3} = prev → 停</text>
  <text x="475" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans = [1, 2, 3, 4] ✓</text>

  <!-- bottom: example 2 -->
  <text x="320" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">示例 2（含负数）：[[4,−2],[1,4],[−3,1]] 同样建出一条链</text>
  <path d="M 192 370 Q 220 363 248 370" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 292 370 Q 320 363 348 370" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 392 370 Q 420 363 448 370" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="170" cy="370" r="22" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="170" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06b1a">−2</text>
  <g filter="url(#sk)"><circle cx="270" cy="370" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="270" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><circle cx="370" cy="370" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="370" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><circle cx="470" cy="370" r="22" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="470" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06b1a">−3</text>

  <text x="320" y="418" text-anchor="middle" font-size="11.5" fill="#555">从 −2 出发 → [−2, 4, 1, −3]；从 −3 出发 → [−3, 1, 4, −2]（逆序）</text>
  <text x="320" y="440" text-anchor="middle" font-size="11" fill="#888">负数照常进哈希表；链只有两个走向，都是合法答案</text>
</svg>
