<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">dp[i]：过程中恰好停在 i 分的概率</text>

  <!-- 三种区间 -->
  <g filter="url(#rough2)">
    <rect x="40" y="70" width="180" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="130" y="90" text-anchor="middle" font-size="12" fill="#2f4a66">0 … k-1（继续抽）</text>
    <text x="130" y="108" text-anchor="middle" font-size="11" fill="#2f4a66">dp 会继续向外转移</text>

    <rect x="220" y="70" width="150" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="295" y="90" text-anchor="middle" font-size="12" fill="#2f5527">k … n（停住 = 成功）</text>
    <text x="295" y="108" text-anchor="middle" font-size="11" fill="#2f5527">答案累加这一段</text>

    <rect x="370" y="70" width="110" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="425" y="90" text-anchor="middle" font-size="12" fill="#8a3020">n+1 …</text>
    <text x="425" y="108" text-anchor="middle" font-size="11" fill="#8a3020">停住 = 失败</text>
  </g>

  <!-- 转移示意 -->
  <g filter="url(#rough2)">
    <text x="130" y="146" text-anchor="middle" font-size="12" fill="#333">从 j（j &lt; k）抽一张 d ∈ [1, maxPts]</text>
    <path d="M130,156 C130,196 250,196 250,168" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M130,156 C150,214 330,214 330,168" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M130,156 C170,232 410,232 410,168" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="250" y="212" font-size="11" fill="#666">j+1</text>
    <text x="330" y="228" font-size="11" fill="#666">j+d</text>
    <text x="412" y="246" font-size="11" fill="#666">j+maxPts</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="272" width="380" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="296" text-anchor="middle" font-size="13" fill="#7a5a10">dp[0] = 1，dp[i] = (1/maxPts) · Σ dp[j]</text>
    <text x="260" y="318" text-anchor="middle" font-size="12" fill="#7a5a10">求和范围 j ∈ [i-maxPts, i-1]，且只取 j &lt; k</text>
    <text x="260" y="340" text-anchor="middle" font-size="12" fill="#8a3020">i ≥ k 的 dp[i] 不再参与转移（已经停手）</text>
  </g>
</svg>
