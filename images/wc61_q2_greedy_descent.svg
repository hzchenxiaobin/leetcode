<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：第一处「下降」就是切分点</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">在下降处的高位减 1、后面所有位填 9，既不超上界又能让数字最大</text>

  <rect x="24" y="64" width="552" height="152" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="88" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">① n = 332：出现下降 3 &gt; 2</text>

  <g filter="url(#rough2)" font-size="17" font-weight="bold" text-anchor="middle">
    <rect x="64" y="100" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="118" y="100" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="172" y="100" width="46" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="87" y="126" fill="#3a4a66">3</text>
    <text x="141" y="126" fill="#3a4a66">3</text>
    <text x="195" y="126" fill="#b85450">2</text>
  </g>

  <ellipse cx="346" cy="118" rx="80" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="346" y="122" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 &gt; 2：第一处下降</text>
  <path d="M 264 118 L 226 118" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <path d="M 87 143 L 87 155" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="96" y="155" font-size="10" fill="#b85450" filter="url(#rough2)">减 1</text>
  <path d="M 141 143 L 141 155" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="150" y="155" font-size="10" fill="#4a7a3a" filter="url(#rough2)">填 9</text>

  <g filter="url(#rough2)" font-size="17" font-weight="bold" text-anchor="middle">
    <rect x="64" y="158" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="118" y="158" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="172" y="158" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="87" y="184" fill="#3a5a30">2</text>
    <text x="141" y="184" fill="#3a4a66">9</text>
    <text x="195" y="184" fill="#3a4a66">9</text>
  </g>
  <path d="M 118 202 L 118 208 L 218 208 L 218 202" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="228" y="205" font-size="10" fill="#4a7a3a" filter="url(#rough2)">后两位全填 9</text>
  <text x="330" y="184" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 299</text>

  <rect x="24" y="228" width="552" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="252" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② n = 1234：扫描不到下降</text>
  <g filter="url(#rough2)" font-size="16" font-weight="bold" text-anchor="middle">
    <rect x="64" y="264" width="42" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="112" y="264" width="42" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="160" y="264" width="42" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="208" y="264" width="42" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="85" y="288" fill="#3a4a66">1</text>
    <text x="133" y="288" fill="#3a4a66">2</text>
    <text x="181" y="288" fill="#3a4a66">3</text>
    <text x="229" y="288" fill="#3a4a66">4</text>
  </g>
  <path d="M 256 282 L 288 282" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="296" y="286" text-anchor="start" font-size="12" fill="#3a5a30" filter="url(#rough2)">已经单调 → 原样返回 1234</text>

  <text x="300" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">为什么不能只在第一处下降减 1：借位后可能把前一位顶成新的下降（332 → 322 仍不合法）</text>
  <text x="300" y="370" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">而尾部填 9 是「不超过 n」前提下能取到的最大尾数，所以答案必然是「公共前缀 + 减 1 位 + 全 9」</text>
</svg>
