<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 465"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="465" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：d = [3,1]，r = [2,3] ⇒ 答案 T = 5</text>
  <path d="M 170 42 Q 330 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="50" y="68" font-size="13" font-weight="bold" fill="#555">① 逐小时安排（机 1 需 3 次，机 2 需 1 次）</text>

  <!-- hour cards -->
  <g filter="url(#sk)">
    <rect x="50"  y="78" width="104" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="164" y="78" width="104" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="278" y="78" width="104" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="392" y="78" width="104" height="58" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="506" y="78" width="104" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="102" y="96">第 1 小时</text>
    <text x="216" y="96">第 2 小时</text>
    <text x="330" y="96">第 3 小时</text>
    <text x="444" y="96">第 4 小时</text>
    <text x="558" y="96">第 5 小时</text>
  </g>
  <g font-size="13.5" font-weight="bold" text-anchor="middle">
    <text x="102" y="116" fill="#2e5e22">机 1 送货</text>
    <text x="216" y="116" fill="#a06a10">机 2 送货</text>
    <text x="330" y="116" fill="#2e5e22">机 1 送货</text>
    <text x="444" y="116" fill="#777">空转</text>
    <text x="558" y="116" fill="#2e5e22">机 1 送货</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="102" y="130">双机都空闲</text>
    <text x="216" y="130">机 1 在充电</text>
    <text x="330" y="130">机 2 在充电</text>
    <text x="444" y="130">机1充电·机2已完工</text>
    <text x="558" y="130">双机都空闲</text>
  </g>

  <!-- summary strip -->
  <g filter="url(#sk)">
    <rect x="50" y="148" width="560" height="46" rx="9" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="330" y="167">机 1：第 1、3、5 小时送货，第 2、4 小时充电 → 3 次 ✓</text>
    <text x="330" y="185">机 2：第 2 小时送货，第 3 小时充电 → 1 次 ✓　　总时间 T = 5</text>
  </g>

  <text x="50" y="224" font-size="13" font-weight="bold" fill="#555">② 三个条件的验证（L = lcm(2,3) = 6）</text>

  <!-- verification table -->
  <g filter="url(#sk)">
    <rect x="60"  y="234" width="250" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="310" y="234" width="115" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="425" y="234" width="175" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="60"  y="264" width="250" height="32" fill="#fdfdfd" stroke="#aaa" stroke-width="1.2"/>
    <rect x="310" y="264" width="115" height="32" fill="#fce4ec" stroke="#c98a86" stroke-width="1.2"/>
    <rect x="425" y="264" width="175" height="32" fill="#e6f4ea" stroke="#8aac82" stroke-width="1.2"/>
    <rect x="60"  y="296" width="250" height="32" fill="#fdfdfd" stroke="#aaa" stroke-width="1.2"/>
    <rect x="310" y="296" width="115" height="32" fill="#fce4ec" stroke="#c98a86" stroke-width="1.2"/>
    <rect x="425" y="296" width="175" height="32" fill="#e6f4ea" stroke="#8aac82" stroke-width="1.2"/>
    <rect x="60"  y="328" width="250" height="32" fill="#fdfdfd" stroke="#aaa" stroke-width="1.2"/>
    <rect x="310" y="328" width="115" height="32" fill="#fce4ec" stroke="#c98a86" stroke-width="1.2"/>
    <rect x="425" y="328" width="175" height="32" fill="#e6f4ea" stroke="#8aac82" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle" font-weight="bold">
    <text x="185" y="254">不等式</text>
    <text x="367" y="254">T = 4</text>
    <text x="512" y="254">T = 5</text>
  </g>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="185" y="284">① T − ⌊T/2⌋ ≥ d₁ = 3</text>
    <text x="185" y="316">② T − ⌊T/3⌋ ≥ d₂ = 1</text>
    <text x="185" y="348">③ T − ⌊T/6⌋ ≥ d₁+d₂ = 4</text>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="367" y="284" fill="#8e3a34">4−2 = 2 <tspan font-weight="bold">✗</tspan></text>
    <text x="367" y="316" fill="#444">4−1 = 3 <tspan fill="#2e5e22" font-weight="bold">✓</tspan></text>
    <text x="367" y="348" fill="#444">4−0 = 4 <tspan fill="#2e5e22" font-weight="bold">✓</tspan></text>
    <text x="512" y="284" fill="#444">5−2 = 3 <tspan fill="#2e5e22" font-weight="bold">✓</tspan></text>
    <text x="512" y="316" fill="#444">5−1 = 4 <tspan fill="#2e5e22" font-weight="bold">✓</tspan></text>
    <text x="512" y="348" fill="#444">5−0 = 5 <tspan fill="#2e5e22" font-weight="bold">✓</tspan></text>
  </g>

  <!-- verdict -->
  <g filter="url(#sk)">
    <rect x="60" y="378" width="540" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle">
    <text x="330" y="399" font-size="13" font-weight="bold" fill="#8e3a34">T = 4：条件① 失败 ⇒ 不可行（机 1 只有 2 个可用小时 &lt; 3）</text>
    <text x="330" y="420" font-size="12" fill="#8e3a34">T = 5：三条件全部成立 ⇒ 最小总时间 = 5 = max(5, 1, 4)</text>
  </g>

  <text x="330" y="452" text-anchor="middle" font-size="10.5" fill="#888">注意第 4 小时整体空转：机 2 提前完工、机 1 在充电——空转完全合法</text>
</svg>
