<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="340" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">tie-break 陷阱：同起点时右端点必须降序</text>

  <!-- 上半：正确做法 -->
  <rect x="30" y="52" width="600" height="120" rx="12" fill="#e6f4ea" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="80" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓ 同起点按 end 降序：[[1,4],[1,2]]</text>

  <rect x="120" y="98" width="120" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">① [1,4]</text>
  <rect x="120" y="134" width="60" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="128" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">② [1,2]</text>
  <g stroke="#b85450" stroke-width="2">
    <line x1="128" y1="132" x2="156" y2="154" filter="url(#rough2)"/>
    <line x1="156" y1="132" x2="128" y2="154" filter="url(#rough2)"/>
  </g>

  <text x="330" y="112" font-size="13" fill="#333" filter="url(#rough2)">maxEnd=4；</text>
  <text x="330" y="132" font-size="13" fill="#333" filter="url(#rough2)">② 的 e=2 ≤ 4</text>
  <text x="330" y="152" font-size="13" fill="#b85450" filter="url(#rough2)">→ 被罩住，答案 1 ✓</text>

  <!-- 下半：错误做法 -->
  <rect x="30" y="192" width="600" height="120" rx="12" fill="#fce4ec" fill-opacity="0.3" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="220" font-size="14" fill="#b85450" filter="url(#rough2)">✗ 同起点误按 end 升序：[[1,2],[1,4]]</text>

  <rect x="120" y="238" width="60" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">① [1,2]</text>
  <rect x="120" y="274" width="120" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="268" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">② [1,4]</text>

  <text x="330" y="252" font-size="13" fill="#333" filter="url(#rough2)">maxEnd=2；</text>
  <text x="330" y="272" font-size="13" fill="#333" filter="url(#rough2)">② 的 e=4 &gt; 2 被误判幸存</text>
  <text x="330" y="292" font-size="13" fill="#b85450" filter="url(#rough2)">→ 答案错成 2 ✗</text>

  <!-- 底部总结 -->
  <rect x="90" y="316" width="480" height="20" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="330" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">原因：起点相同时，能罩住别人的"大区间"必须排在前面</text>
</svg>
