<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">把数值看成节点：四种操作就是四类单位代价的有向边</text>
  <rect x="40" y="48" width="108" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="94" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">÷11</text>
  <text x="94" y="90" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">11 | x</text>
  <rect x="164" y="48" width="108" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="218" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">÷5</text>
  <text x="218" y="90" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5 | x</text>
  <rect x="288" y="48" width="108" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="342" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−1</text>
  <text x="342" y="90" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">总是可用</text>
  <rect x="412" y="48" width="108" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="466" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+1</text>
  <text x="466" y="90" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">总是可用</text>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">目标：从 x 走到 y，边权都是 1 → 最短路 = BFS</text>
  <rect x="70" y="152" width="58" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="99" y="182" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">26</text>
  <rect x="180" y="152" width="58" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="209" y="182" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">25</text>
  <rect x="290" y="152" width="58" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="319" y="182" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <rect x="400" y="152" width="58" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="429" y="182" text-anchor="middle" font-size="16" fill="#7a3030" filter="url(#rough2)">1</text>
  <path d="M128,175 L180,175" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="154" y="166" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">−1</text>
  <path d="M238,175 L290,175" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="166" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">÷5</text>
  <path d="M348,175 L400,175" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="166" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">÷5</text>
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#1c3a1c" filter="url(#rough2)">26 → 25 → 5 → 1，共 3 步（示例 1）</text>
  <rect x="50" y="240" width="460" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">节点编号就是数值本身，最多 2x 个 → 可用数组做 visited 去重</text>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">图是单向的「向下 + 左右微调」结构，无负权、无环的困扰</text>
</svg>
