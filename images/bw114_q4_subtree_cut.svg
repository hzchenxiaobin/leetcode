<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">后序看子树和：≡ 0 (mod k) 就割</text>

  <!-- 示例树：0-2, 2-1, 1-3, 2-4，values=[1,8,1,4,4], k=6 -->
  <ellipse cx="260" cy="70" rx="44" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 (值1) Σ=18</text>
  <ellipse cx="260" cy="150" rx="44" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 (值1) Σ=17</text>
  <ellipse cx="150" cy="230" rx="44" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 (值8) Σ=12</text>
  <ellipse cx="360" cy="230" rx="44" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 (值4) Σ=4</text>
  <ellipse cx="150" cy="308" rx="44" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 (值4) Σ=4</text>

  <!-- 边 -->
  <path d="M 260 94 L 260 126" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 226 158 C 204 184, 182 200, 168 216" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 294 158 C 316 184, 338 200, 352 216" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 150 254 L 150 284" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- 割边标注 -->
  <text x="128" y="196" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">12 mod 6 = 0 ✂ 割！</text>

  <!-- 右侧规则 -->
  <rect x="392" y="60" width="112" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">自底向上</text>
  <text x="448" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Σ(v) ≡ 0</text>
  <text x="448" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">→ 割与父亲的边</text>
  <text x="448" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">否则上交 Σ(v)</text>
  <text x="448" y="170" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">（余数并入父亲）</text>

  <!-- 底部结果 -->
  <rect x="36" y="60" width="120" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">连通块 {1,3}</text>
  <text x="96" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">和 = 12 ✓</text>
  <rect x="36" y="280" width="448" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">割 1 条边得 2 个连通块：{1,3}=12 与 {0,2,4}=6，均被 6 整除</text>
  <text x="260" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = 2 ✓</text>
</svg>
