<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">固定选中人数 k：每个学生的去留由 nums[i] 与 k 的大小唯一决定</text>

  <!-- 两个开心条件框 -->
  <rect x="30" y="52" width="225" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="142" y="76" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">选中 i 开心 ⟺ k &gt; nums[i]</text>
  <text x="142" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⟹ 值 &lt; k 的必须选</text>

  <rect x="265" y="52" width="225" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="377" y="76" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">不选 i 开心 ⟺ k &lt; nums[i]</text>
  <text x="377" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">⟹ 值 &gt; k 的必须不选</text>

  <text x="260" y="146" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">数轴：把学生的 nums 值摆上去（示例取 k = 4）</text>

  <!-- 阈值色带 -->
  <rect x="58" y="170" width="202" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="260" y="170" width="202" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- k 阈值红线 -->
  <path d="M 260 158 L 260 268" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">k = 4</text>

  <!-- 学生点：值 < k（必选，绿） -->
  <circle cx="72" cy="191" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="72" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <circle cx="156" cy="191" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="156" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <circle cx="196" cy="191" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <circle cx="224" cy="191" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="224" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- 学生点：值 > k（必不选，蓝） -->
  <circle cx="346" cy="191" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="346" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <circle cx="374" cy="191" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="374" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <circle cx="406" cy="191" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="406" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <circle cx="434" cy="191" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="434" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>

  <!-- 区域说明 -->
  <text x="130" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">值 &lt; k 必须选中</text>
  <text x="260" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">值 = k：无解</text>
  <text x="390" y="232" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">值 &gt; k 必须不选</text>

  <!-- 数轴 -->
  <path d="M 55 268 L 465 268" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="472" y="262" font-size="11" fill="#888" filter="url(#rough2)">值</text>
  <path d="M 60 264 L 60 272 M 110 264 L 110 272 M 160 264 L 160 272 M 210 264 L 210 272 M 260 264 L 260 272 M 310 264 L 310 272 M 360 264 L 360 272 M 410 264 L 410 272 M 460 264 L 460 272" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="110" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="160" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="210" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="260" y="286" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="310" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="360" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="410" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="460" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">8</text>

  <!-- 结论框 -->
  <rect x="36" y="316" width="448" height="74" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">k 可行 ⟺ 恰有 k 个学生值 &lt; k，且没有学生值 = k</text>
  <text x="260" y="370" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">本例 k=4：值 &lt; 4 的恰有 4 人（0,2,3,3）✓，无人值 = 4 ✓</text>
</svg>
