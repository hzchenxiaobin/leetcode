<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">演算：一路推到 A(6) = 53</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888">A(k)：前 k 列铺满；H(k)：第 k+1 列上格已被占（下格空着）</text>

  <g filter="url(#rough2)">
    <rect x="52" y="62" width="426" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="52" y="90" width="64" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="116" y="90" width="76" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="192" y="90" width="76" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="268" y="90" width="210" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="52" y="120" width="64" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="116" y="120" width="76" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="192" y="120" width="76" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="268" y="120" width="210" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="52" y="150" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="116" y="150" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="192" y="150" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="268" y="150" width="210" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="52" y="180" width="64" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="116" y="180" width="76" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="192" y="180" width="76" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="268" y="180" width="210" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="52" y="210" width="64" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="116" y="210" width="76" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="192" y="210" width="76" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="268" y="210" width="210" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="52" y="240" width="64" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="116" y="240" width="76" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="192" y="240" width="76" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="268" y="240" width="210" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="3"/>
    <rect x="52" y="270" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="116" y="270" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="192" y="270" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="268" y="270" width="210" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">
    <text x="84" y="82">k</text>
    <text x="154" y="82">A(k)</text>
    <text x="230" y="82">H(k)</text>
  </g>
  <text x="278" y="82" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">怎么来 / 校验</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11" fill="#444">
    <text x="84" y="110">0</text><text x="154" y="110">1</text><text x="230" y="110">0</text>
    <text x="84" y="140">1</text><text x="154" y="140">1</text><text x="230" y="140">1</text>
    <text x="84" y="170">2</text><text x="154" y="170">2</text><text x="230" y="170">2</text>
    <text x="84" y="200">3</text><text x="154" y="200">5</text><text x="230" y="200">4</text>
    <text x="84" y="230">4</text><text x="154" y="230">11</text><text x="230" y="230">9</text>
    <text x="84" y="260">5</text><text x="154" y="260">24</text><text x="230" y="260">20</text>
    <text x="84" y="290">6</text><text x="154" y="290">53</text><text x="230" y="290">44</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#666">
    <text x="278" y="110">空板，1 种（边界）</text>
    <text x="278" y="140">一块竖砖（边界）</text>
    <text x="278" y="170">A(1)+A(0)+2H(0)=1+1+0</text>
    <text x="278" y="200">A(2)+A(1)+2H(1)=2+1+2（示例）</text>
    <text x="278" y="230">A(3)+A(2)+2H(2)=5+2+4</text>
    <text x="278" y="260">A(4)+A(3)+2H(3)=11+5+8</text>
    <text x="278" y="290">A(5)+A(4)+2H(4)=24+11+18</text>
  </g>

  <rect x="52" y="316" width="426" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="66" y="340" font-size="11" fill="#555" filter="url(#rough2)">A(k) = A(k−1) + A(k−2) + 2H(k−2)　　H(k) = A(k−1) + H(k−1)</text>
  <text x="66" y="364" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">A(3)=5 与官方示例一致；再消去 H 即 A(n) = 2A(n−1) + A(n−3)</text>
</svg>
