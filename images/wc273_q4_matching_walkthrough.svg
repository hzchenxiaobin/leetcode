<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：排序后 nums = [2, 4, 6, 8, 10, 12]，首个候选 d = 2（k = 1）</text>
  <text x="320" y="46" text-anchor="middle" font-size="10" fill="#555" filter="url(#sk)">i = 最小未用元素（lower，红）　p = 推进到 nums[i] + d（higher，蓝）　灰格 = 已配对</text>

  <!-- 第 1 对 -->
  <text x="44" y="88" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">第 1 对</text>
  <g filter="url(#sk)">
    <rect x="100" y="64" width="60" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="166" y="64" width="60" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="232" y="64" width="60" height="38" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="298" y="64" width="60" height="38" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="364" y="64" width="60" height="38" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="430" y="64" width="60" height="38" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="130" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">2</text>
  <text x="196" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <text x="262" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">6</text>
  <text x="328" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">8</text>
  <text x="394" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">10</text>
  <text x="460" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">12</text>
  <path d="M 130 58 L 194 58" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="163" y="50" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">d = 2</text>
  <text x="130" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">i</text>
  <text x="196" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">p</text>
  <text x="506" y="82" font-size="9.5" fill="#888" filter="url(#sk)">(2, 4)</text>
  <text x="506" y="100" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">arr ← [3]</text>

  <!-- 第 2 对 -->
  <text x="44" y="200" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">第 2 对</text>
  <g filter="url(#sk)">
    <rect x="100" y="176" width="60" height="38" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="166" y="176" width="60" height="38" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="232" y="176" width="60" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="298" y="176" width="60" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="364" y="176" width="60" height="38" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="430" y="176" width="60" height="38" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="130" y="200" text-anchor="middle" font-size="13" fill="#9e9e9e" filter="url(#sk)">2</text>
  <text x="196" y="200" text-anchor="middle" font-size="13" fill="#9e9e9e" filter="url(#sk)">4</text>
  <text x="152" y="189" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#sk)">✓</text>
  <text x="218" y="189" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#sk)">✓</text>
  <text x="262" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">6</text>
  <text x="328" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">8</text>
  <text x="394" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">10</text>
  <text x="460" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">12</text>
  <path d="M 262 170 L 326 170" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="295" y="162" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">+d</text>
  <text x="262" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">i</text>
  <text x="328" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">p</text>
  <text x="506" y="194" font-size="9.5" fill="#888" filter="url(#sk)">(6, 8)</text>
  <text x="506" y="212" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">arr ← [3, 7]</text>

  <!-- 第 3 对 -->
  <text x="44" y="312" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">第 3 对</text>
  <g filter="url(#sk)">
    <rect x="100" y="288" width="60" height="38" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="166" y="288" width="60" height="38" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="232" y="288" width="60" height="38" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="298" y="288" width="60" height="38" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="364" y="288" width="60" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="430" y="288" width="60" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="130" y="312" text-anchor="middle" font-size="13" fill="#9e9e9e" filter="url(#sk)">2</text>
  <text x="196" y="312" text-anchor="middle" font-size="13" fill="#9e9e9e" filter="url(#sk)">4</text>
  <text x="262" y="312" text-anchor="middle" font-size="13" fill="#9e9e9e" filter="url(#sk)">6</text>
  <text x="328" y="312" text-anchor="middle" font-size="13" fill="#9e9e9e" filter="url(#sk)">8</text>
  <text x="152" y="301" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#sk)">✓</text>
  <text x="218" y="301" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#sk)">✓</text>
  <text x="284" y="301" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#sk)">✓</text>
  <text x="350" y="301" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#sk)">✓</text>
  <text x="394" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">10</text>
  <text x="460" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">12</text>
  <path d="M 394 282 L 458 282" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="427" y="274" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">+d</text>
  <text x="394" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">i</text>
  <text x="460" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">p</text>
  <text x="506" y="306" font-size="9.5" fill="#888" filter="url(#sk)">(10, 12)</text>
  <text x="506" y="324" font-size="10.5" font-weight="bold" fill="#333" filter="url(#sk)">arr ← [3, 7, 11]</text>

  <text x="320" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">配满 n = 3 对 → 返回 arr = [3, 7, 11] ✓</text>

  <!-- 失败候选演示 -->
  <g filter="url(#sk)">
    <rect x="40" y="372" width="560" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="394" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#sk)">若候选换成 d = 4（k = 2）—— 一个失败的例子</text>
  <text x="320" y="416" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">2 → 6 ✓　　4 → 8 ✓　　10 → 14 ✗（14 不在 nums 中）</text>
  <text x="320" y="436" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">配不满 n 对 → 该候选失败，回到「枚举候选」换下一个 d</text>
  <text x="320" y="453" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">（本例首个候选 d = 2 一次成功，实际不会走到这一步）</text>
</svg>
