<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：把 a + b = n 拆成逐列加法</text>
  <text x="320" y="47" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">从个位到最高位逐列决策，每列只看两个数字与一个进位，而进位只有 0 / 1 两种</text>

  <!-- 左：竖式 2713 + 5287 = 8000 -->
  <text x="42" y="102" font-size="10.5" fill="#b85450" filter="url(#rough2)">进位</text>
  <text x="100" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="145" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="190" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <rect x="84" y="108" width="32" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="129" y="108" width="32" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="174" y="108" width="32" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="219" y="108" width="32" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="145" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="190" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="235" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="258" y="130" font-size="11" fill="#4a7a3a" filter="url(#rough2)">← a（无零）</text>

  <text x="56" y="174" font-size="16" fill="#555" filter="url(#rough2)">+</text>

  <rect x="84" y="150" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="129" y="150" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="174" y="150" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="219" y="150" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="172" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="145" y="172" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="190" y="172" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="235" y="172" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="258" y="172" font-size="11" fill="#446688" filter="url(#rough2)">← b（无零）</text>

  <path d="M 76 196 Q 165 200 254 194" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <rect x="84" y="202" width="32" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="129" y="202" width="32" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="174" y="202" width="32" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="219" y="202" width="32" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="224" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="145" y="224" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="224" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="235" y="224" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="258" y="216" font-size="11" fill="#b85450" filter="url(#rough2)">← n = a + b</text>
  <text x="258" y="232" font-size="11" fill="#b85450" filter="url(#rough2)">（可以含 0！）</text>

  <text x="30" y="266" font-size="11.5" fill="#333" filter="url(#rough2)">个位：3 + 7 = 10 → 写 0，向十位进 1</text>
  <text x="30" y="291" font-size="11.5" fill="#333" filter="url(#rough2)">十位：1 + 8 + 1 = 10 → 写 0，向百位进 1</text>
  <text x="30" y="316" font-size="11.5" fill="#333" filter="url(#rough2)">百位：7 + 2 + 1 = 10 → 写 0，向千位进 1</text>
  <text x="30" y="341" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">千位：2 + 5 + 1 = 8 → 写 8，进位 0 ✓</text>

  <!-- 右：三个事实 -->
  <rect x="340" y="66" width="272" height="68" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="354" y="88" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">事实一：进位只有 0 / 1</text>
  <text x="354" y="109" font-size="11.5" fill="#333" filter="url(#rough2)">每列「数字 + 数字 + 进位」≤ 9 + 9 + 1 = 19</text>
  <text x="354" y="127" font-size="11.5" fill="#333" filter="url(#rough2)">新进位 = ⌊和 / 10⌋，非 0 即 1</text>

  <rect x="340" y="144" width="272" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="354" y="166" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">事实二：无零 = 先非零段、后全零段</text>
  <text x="354" y="188" font-size="11.5" fill="#333" filter="url(#rough2)">补零到 L 位后形如 d d d 0 0：低位全 1~9</text>
  <text x="354" y="207" font-size="11.5" fill="#333" filter="url(#rough2)">一旦某位填 0，更高位只能恒填 0</text>
  <text x="354" y="223" font-size="11" fill="#4a7a3a" filter="url(#rough2)">例：b = 87 → 0 0 8 7</text>

  <rect x="340" y="238" width="272" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="354" y="260" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">事实三：n 本身可以含 0</text>
  <text x="354" y="281" font-size="11.5" fill="#333" filter="url(#rough2)">约束只作用于 a、b，不作用于和 n</text>
  <text x="354" y="296" font-size="11.5" fill="#333" filter="url(#rough2)">本例 n = 8000 含三个 0，照样合法</text>

  <!-- 底部结论 -->
  <rect x="30" y="352" width="582" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="321" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">数对 (a, b) ↔ 逐列数字对 + 一条贯穿的进位链</text>
  <text x="321" y="402" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每列校验：(a 的数字 + b 的数字 + 进位) mod 10 = n 的对应位</text>
  <text x="321" y="422" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">→ 沿列做数位 DP，把数对个数一列一列转移出来</text>
</svg>
