<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：双栈惰性中序 + 边遍历边归并</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个结点只入栈、出栈各一次；额外空间只与树高有关</text>

  <rect x="60" y="64" width="190" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="90" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">st1 = 左脊(root1)</text>
  <rect x="310" y="64" width="190" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="90" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">st2 = 左脊(root2)</text>

  <path d="M 155 106 V 118 H 405 V 106" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 280 118 V 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,126 370,158 280,190 190,158" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">两栈都空？</text>

  <path d="M 370 158 H 396" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="150" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="400" y="140" width="130" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="163" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">返回 ans，结束</text>

  <path d="M 280 190 V 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="204" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="280,214 392,250 280,286 168,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">st2 空 或</text>
  <text x="280" y="262" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">top1 &lt;= top2 ?</text>

  <path d="M 168 250 H 142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="241" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="20" y="230" width="118" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="255" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">弹出 st1 栈顶</text>

  <path d="M 392 250 H 414" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="241" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="418" y="230" width="122" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="479" y="255" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">弹出 st2 栈顶</text>

  <path d="M 79 270 V 338 H 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 479 270 V 338 H 448" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="318" width="320" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="136" y="340" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">把该值写入 ans，再把它的右子树左脊压栈</text>
  <text x="136" y="359" font-size="9.5" fill="#555" filter="url(#rough2)">栈顶始终是「尚未输出」的最小者，故可直接比较</text>
</svg>
