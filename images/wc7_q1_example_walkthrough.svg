<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="380" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444" filter="url(#rough2)">演算：internationalization ← i12iz4n</text>
  <text x="330" y="48" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">word 长 20、abbr 长 7；数字 token 直接跳过 k 格，字母 token 逐字符比对</text>

  <g filter="url(#rough2)">
    <rect x="24" y="66" width="612" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="24" y="96" width="612" height="32" fill="#ffffff" stroke="#b9c6d8" stroke-width="1"/>
    <rect x="24" y="128" width="612" height="32" fill="#f4f7fd" stroke="#b9c6d8" stroke-width="1"/>
    <rect x="24" y="160" width="612" height="32" fill="#ffffff" stroke="#b9c6d8" stroke-width="1"/>
    <rect x="24" y="192" width="612" height="32" fill="#f4f7fd" stroke="#b9c6d8" stroke-width="1"/>
    <rect x="24" y="224" width="612" height="32" fill="#ffffff" stroke="#b9c6d8" stroke-width="1"/>
    <rect x="24" y="256" width="612" height="32" fill="#f4f7fd" stroke="#b9c6d8" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" stroke="#c8d3e2" stroke-width="1" fill="none">
    <path d="M 78 66 L 78 288"/>
    <path d="M 198 66 L 198 288"/>
    <path d="M 318 66 L 318 288"/>
    <path d="M 458 66 L 458 288"/>
    <path d="M 588 66 L 588 288"/>
  </g>

  <g filter="url(#rough2)" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#33475e">
    <text x="51" y="85">步</text>
    <text x="138" y="85">abbr token</text>
    <text x="258" y="85">word 区间</text>
    <text x="388" y="85">动作</text>
    <text x="523" y="85">校验</text>
    <text x="612" y="85">i 之后</text>
  </g>

  <g filter="url(#rough2)" font-size="9.3" text-anchor="middle" fill="#444">
    <text x="51" y="116">1</text>
    <text x="138" y="116">"i"</text>
    <text x="258" y="116">[0, 1)</text>
    <text x="388" y="116">字母比对</text>
    <text x="523" y="116">word[0] = 'i' ✓</text>
    <text x="612" y="116">1</text>

    <text x="51" y="148">2</text>
    <text x="138" y="148">"12"</text>
    <text x="258" y="148">[1, 13)</text>
    <text x="388" y="148">跳过 12 格</text>
    <text x="523" y="148">1 + 12 = 13 ≤ 20</text>
    <text x="612" y="148">13</text>

    <text x="51" y="180">3</text>
    <text x="138" y="180">"i"</text>
    <text x="258" y="180">[13, 14)</text>
    <text x="388" y="180">字母比对</text>
    <text x="523" y="180">word[13] = 'i' ✓</text>
    <text x="612" y="180">14</text>

    <text x="51" y="212">4</text>
    <text x="138" y="212">"z"</text>
    <text x="258" y="212">[14, 15)</text>
    <text x="388" y="212">字母比对</text>
    <text x="523" y="212">word[14] = 'z' ✓</text>
    <text x="612" y="212">15</text>

    <text x="51" y="244">5</text>
    <text x="138" y="244">"4"</text>
    <text x="258" y="244">[15, 19)</text>
    <text x="388" y="244">跳过 4 格</text>
    <text x="523" y="244">15 + 4 = 19 ≤ 20</text>
    <text x="612" y="244">19</text>

    <text x="51" y="276">6</text>
    <text x="138" y="276">"n"</text>
    <text x="258" y="276">[19, 20)</text>
    <text x="388" y="276">字母比对</text>
    <text x="523" y="276">word[19] = 'n' ✓</text>
    <text x="612" y="276">20</text>
  </g>

  <rect x="24" y="300" width="612" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="322" font-size="10" fill="#3a5a30" filter="url(#rough2)">结束：i = 20 = len(word)，j = 7 = len(abbr) → 返回 true</text>
  <text x="40" y="342" font-size="10" fill="#3a5a30" filter="url(#rough2)">反例 apple / a2e：a 后 i = 1，跳 2 格到 i = 3，word[3] = 'l' ≠ 'e' → false</text>

  <text x="330" y="370" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">下标从 0 开始；区间按左闭右开 [i, i + k) 记法</text>
</svg>
