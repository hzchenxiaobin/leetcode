<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：用前缀平衡值刻画合法性</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">b(i) = 前 i 个字符中 '(' 数 − ')' 数（字母记 0）</text>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">合法 ⟺ 每个 b(i) ≥ 0 且 b(n) = 0</text>

  <text x="280" y="96" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">s = "a)b(c)d"，逐格看 balance</text>

  <g font-size="9.5" text-anchor="middle" fill="#999">
    <text x="139" y="116" filter="url(#rough2)">0</text>
    <text x="185" y="116" filter="url(#rough2)">1</text>
    <text x="231" y="116" filter="url(#rough2)">2</text>
    <text x="277" y="116" filter="url(#rough2)">3</text>
    <text x="323" y="116" filter="url(#rough2)">4</text>
    <text x="369" y="116" filter="url(#rough2)">5</text>
    <text x="415" y="116" filter="url(#rough2)">6</text>
  </g>

  <g>
    <rect x="116" y="122" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <rect x="162" y="122" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <rect x="208" y="122" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <rect x="254" y="122" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <rect x="300" y="122" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <rect x="346" y="122" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <rect x="392" y="122" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  </g>

  <g font-size="16" text-anchor="middle" fill="#333">
    <text x="139" y="147" filter="url(#rough2)">a</text>
    <text x="185" y="147" filter="url(#rough2)">)</text>
    <text x="231" y="147" filter="url(#rough2)">b</text>
    <text x="277" y="147" filter="url(#rough2)">(</text>
    <text x="323" y="147" filter="url(#rough2)">c</text>
    <text x="369" y="147" filter="url(#rough2)">)</text>
    <text x="415" y="147" filter="url(#rough2)">d</text>
  </g>

  <text x="92" y="176" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">b(i)</text>

  <g font-size="13" text-anchor="middle">
    <text x="139" y="180" fill="#3a4a66" filter="url(#rough2)">0</text>
    <text x="185" y="180" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
    <text x="231" y="180" fill="#3a5a30" filter="url(#rough2)">0</text>
    <text x="277" y="180" fill="#3a4a66" filter="url(#rough2)">1</text>
    <text x="323" y="180" fill="#3a5a30" filter="url(#rough2)">1</text>
    <text x="369" y="180" fill="#3a4a66" filter="url(#rough2)">0</text>
    <text x="415" y="180" fill="#3a5a30" filter="url(#rough2)">0</text>
  </g>

  <ellipse cx="185" cy="175" rx="18" ry="14" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 206 180 Q 224 184 240 190" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="196" width="448" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="72" y="218" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">坏右括号：读到 ')' 时 b 已经为 0，再减就变负 → 这个 ')' 必删</text>
  <text x="72" y="238" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">多余左括号：全文扫完仍 b(n) = B &gt; 0 → 还要回删 B 个 '('</text>

  <rect x="56" y="264" width="448" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="72" y="286" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">结论：最少删除数 = 坏 ')' 个数 r + 结尾余额 B</text>
  <text x="72" y="305" font-size="10" fill="#555" filter="url(#rough2)">第一趟删完坏 ')'，第二趟只删最右边的 B 个 '('，两趟都不需要尝试</text>

  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例中 r = 1、B = 0：删下标 1 的 ')' 即得 "ab(c)d"</text>
</svg>
