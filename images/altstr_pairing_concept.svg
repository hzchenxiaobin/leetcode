<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：两类错位配对，一次交换修复两个</text>
  <path d="M 160 40 Q 320 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="13" fill="#555">s = "111000"，n 为偶数 ⇒ 两个形态都可行；对错位更少的 "101010" 只需 1 次交换</text>

  <text x="65" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">目标 t</text>
  <text x="65" y="110" text-anchor="middle" font-size="11" fill="#2b6e9e">101010…</text>
  <g filter="url(#sk)">
    <rect x="140" y="88" width="50" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="200" y="88" width="50" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="260" y="88" width="50" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="320" y="88" width="50" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="380" y="88" width="50" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="440" y="88" width="50" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="165" y="112" text-anchor="middle" font-size="16" fill="#2b6e9e">1</text>
  <text x="225" y="112" text-anchor="middle" font-size="16" fill="#2b6e9e">0</text>
  <text x="285" y="112" text-anchor="middle" font-size="16" fill="#2b6e9e">1</text>
  <text x="345" y="112" text-anchor="middle" font-size="16" fill="#2b6e9e">0</text>
  <text x="405" y="112" text-anchor="middle" font-size="16" fill="#2b6e9e">1</text>
  <text x="465" y="112" text-anchor="middle" font-size="16" fill="#2b6e9e">0</text>

  <text x="65" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">当前 s</text>
  <text x="65" y="176" text-anchor="middle" font-size="11" fill="#555">111000</text>
  <g filter="url(#sk)">
    <rect x="140" y="154" width="50" height="36" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <rect x="200" y="154" width="50" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="260" y="154" width="50" height="36" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <rect x="320" y="154" width="50" height="36" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <rect x="380" y="154" width="50" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="440" y="154" width="50" height="36" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
  </g>
  <text x="165" y="178" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="225" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">1</text>
  <text x="285" y="178" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="345" y="178" text-anchor="middle" font-size="16" fill="#333">0</text>
  <text x="405" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">0</text>
  <text x="465" y="178" text-anchor="middle" font-size="16" fill="#333">0</text>
  <text x="248" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">A 类</text>
  <text x="430" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">B 类</text>

  <path d="M 225 196 Q 315 226 405 196" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 405 196 Q 315 242 225 196" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="315" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">一次交换 s[1] ↔ s[4]</text>

  <text x="65" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">交换后</text>
  <g filter="url(#sk)">
    <rect x="140" y="244" width="50" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="200" y="244" width="50" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
    <rect x="260" y="244" width="50" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="320" y="244" width="50" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="380" y="244" width="50" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
    <rect x="440" y="244" width="50" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="165" y="268" text-anchor="middle" font-size="16" fill="#2e6e2e">1</text>
  <text x="225" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">0 ✓</text>
  <text x="285" y="268" text-anchor="middle" font-size="16" fill="#2e6e2e">1</text>
  <text x="345" y="268" text-anchor="middle" font-size="16" fill="#2e6e2e">0</text>
  <text x="405" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">1 ✓</text>
  <text x="465" y="268" text-anchor="middle" font-size="16" fill="#2e6e2e">0</text>

  <text x="320" y="298" text-anchor="middle" font-size="12" fill="#555">红色格 = 错位：pos1 的 '1'（放 1 需 0）与 pos4 的 '0'（放 0 需 1），恰好一 A 一 B</text>

  <g filter="url(#sk)">
    <rect x="30" y="314" width="370" height="68" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="215" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">计数匹配 ⇒ A 类错位数 = B 类错位数</text>
  <text x="215" y="362" text-anchor="middle" font-size="12" fill="#2b6e9e">⇒ mis 恒为偶数，mis = 2a</text>

  <g filter="url(#sk)">
    <rect x="420" y="314" width="190" height="68" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="515" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">swaps = mis / 2</text>
  <text x="515" y="366" text-anchor="middle" font-size="11" fill="#b85450">一次交换同时修复两处</text>
</svg>
