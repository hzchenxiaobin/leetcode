<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">拼接串 + find / rfind 双向探测</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- words row -->
  <text x="60" y="78" font-size="11" fill="#888">words：</text>
  <g filter="url(#sk)"><rect x="169" y="58" width="62" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="200" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">mass</text>
  <g filter="url(#sk)"><rect x="239" y="58" width="48" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="263" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">as</text>
  <g filter="url(#sk)"><rect x="295" y="58" width="62" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="326" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">hero</text>
  <g filter="url(#sk)"><rect x="365" y="58" width="106" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="418" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">superhero</text>

  <path d="M 320 96 L 320 118" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arB)"/>
  <text x="330" y="112" font-size="11" fill="#888">用 # 连接</text>

  <!-- joined string -->
  <text x="60" y="146" font-size="11" fill="#888" font-family="monospace">joined：</text>
  <g filter="url(#sk)"><rect x="136" y="126" width="64" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g font-size="13" fill="#444" font-family="monospace">
    <text x="144" y="146" text-anchor="middle">m</text>
    <text x="160" y="146" text-anchor="middle">a</text>
    <text x="176" y="146" text-anchor="middle">s</text>
    <text x="192" y="146" text-anchor="middle">s</text>
    <text x="224" y="146" text-anchor="middle">a</text>
    <text x="240" y="146" text-anchor="middle">s</text>
    <text x="272" y="146" text-anchor="middle">h</text>
    <text x="288" y="146" text-anchor="middle">e</text>
    <text x="304" y="146" text-anchor="middle">r</text>
    <text x="320" y="146" text-anchor="middle">o</text>
    <text x="352" y="146" text-anchor="middle">s</text>
    <text x="368" y="146" text-anchor="middle">u</text>
    <text x="384" y="146" text-anchor="middle">p</text>
    <text x="400" y="146" text-anchor="middle">e</text>
    <text x="416" y="146" text-anchor="middle">r</text>
    <text x="432" y="146" text-anchor="middle">h</text>
    <text x="448" y="146" text-anchor="middle">e</text>
    <text x="464" y="146" text-anchor="middle">r</text>
    <text x="480" y="146" text-anchor="middle">o</text>
  </g>
  <g filter="url(#sk)"><rect x="200" y="126" width="16" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="248" y="126" width="16" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="328" y="126" width="16" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g font-size="13" fill="#b85450" font-family="monospace">
    <text x="208" y="146" text-anchor="middle">#</text>
    <text x="256" y="146" text-anchor="middle">#</text>
    <text x="336" y="146" text-anchor="middle">#</text>
  </g>
  <!-- as segment -->
  <g filter="url(#sk)"><rect x="216" y="126" width="32" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>

  <!-- occurrence highlights -->
  <g filter="url(#sk)"><rect x="150" y="122" width="36" height="38" rx="3" fill="none" stroke="#c98a2b" stroke-width="2.5" stroke-dasharray="6 3"/></g>
  <g filter="url(#sk)"><rect x="214" y="122" width="36" height="38" rx="3" fill="none" stroke="#4a8e4a" stroke-width="2.5"/></g>

  <!-- find probe from left -->
  <path d="M 52 208 Q 105 190 152 166" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)"/>
  <text x="52" y="230" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">find("as") = 1</text>
  <text x="52" y="248" font-size="10.5" fill="#888">首次出现：在 mass 内部</text>

  <!-- rfind probe from right -->
  <path d="M 588 208 Q 470 190 244 166" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
  <text x="588" y="230" text-anchor="end" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">rfind("as") = 5</text>
  <text x="588" y="248" text-anchor="end" font-size="10.5" fill="#888">末次出现：恰是自身段</text>

  <!-- verdict -->
  <g filter="url(#sk)"><rect x="120" y="262" width="400" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">1 ≠ 5 ⟹ "as" 在拼接串中出现 ≥ 2 次</text>
  <text x="320" y="306" text-anchor="middle" font-size="12" fill="#7a5415">⟹ 是其他单词（mass）的子串，收入答案 ✓</text>

  <!-- note -->
  <g filter="url(#sk)"><rect x="40" y="336" width="560" height="52" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="5 3"/></g>
  <text x="320" y="356" text-anchor="middle" font-size="11" fill="#666">末次出现恰是自身段也没关系：自身段只贡献一次出现，多出来的出现必在别的单词内部。</text>
  <text x="320" y="376" text-anchor="middle" font-size="11" fill="#666">n² 次两两配对查找 → 每词只需 find + rfind 两次单向探测。</text>
</svg>
