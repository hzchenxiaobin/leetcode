<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 418"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="418" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：翻转 = 窗口内镜像，落点 t = 2s + k − 1 − i</text>

  <!-- window bracket -->
  <text x="280" y="44" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">窗口 [s, s+k−1] = [2, 5]（s = 2，k = 4，n = 8）</text>
  <path d="M 192 58 L 192 51 L 368 51 L 368 58" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Row A: before -->
  <text x="96" y="81" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">反转前</text>
  <rect x="104" y="62" width="44" height="30" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="82" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">0</text>
  <rect x="148" y="62" width="44" height="30" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="82" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">0</text>
  <rect x="192" y="62" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="214" y="82" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">0</text>
  <rect x="236" y="62" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="258" y="82" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="280" y="62" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="82" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">0</text>
  <rect x="324" y="62" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346" y="82" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">0</text>
  <rect x="368" y="62" width="44" height="30" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="82" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">0</text>
  <rect x="412" y="62" width="44" height="30" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="434" y="82" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">0</text>

  <!-- indices row A -->
  <text x="126" y="108" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="170" y="108" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="214" y="108" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="258" y="108" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="302" y="108" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="346" y="108" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="390" y="108" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <text x="434" y="108" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>

  <text x="258" y="120" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 3</text>

  <!-- mirror arc -->
  <path d="M 258 126 C 258 146, 302 146, 302 126" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">镜像：i = 3 → t = s + (s+k−1) − i = 2 + 5 − 3 = 4</text>

  <!-- Row B: after -->
  <text x="96" y="189" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">反转后</text>
  <rect x="104" y="170" width="44" height="30" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="190" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">0</text>
  <rect x="148" y="170" width="44" height="30" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="190" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">0</text>
  <rect x="192" y="170" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="214" y="190" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">0</text>
  <rect x="236" y="170" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="190" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">0</text>
  <rect x="280" y="170" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="302" y="190" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="324" y="170" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346" y="190" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">0</text>
  <rect x="368" y="170" width="44" height="30" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="190" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">0</text>
  <rect x="412" y="170" width="44" height="30" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="434" y="190" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">0</text>

  <!-- indices row B -->
  <text x="126" y="216" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="170" y="216" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="214" y="216" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="258" y="216" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="302" y="216" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="346" y="216" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="390" y="216" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <text x="434" y="216" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>

  <text x="302" y="230" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">t = 4</text>

  <!-- formula box -->
  <rect x="462" y="118" width="92" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="508" y="138" text-anchor="middle" font-size="11" fill="#33475e" font-weight="bold" filter="url(#rough2)">落点公式</text>
  <text x="508" y="156" text-anchor="middle" font-size="10.5" fill="#33475e" filter="url(#rough2)">t = 2s + k − 1 − i</text>
  <text x="508" y="172" text-anchor="middle" font-size="10.5" fill="#33475e" filter="url(#rough2)">s 每 +1，t 恰 +2</text>
  <text x="508" y="188" text-anchor="middle" font-size="10.5" fill="#33475e" filter="url(#rough2)">⇒ 公差 2 等差数列</text>
  <path d="M 462 160 L 452 158" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- sweep section -->
  <text x="280" y="252" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">滑动起点 s：合法范围 [max(0, i−k+1), min(i, n−k)] = [0, 3]，落点 t = 2s</text>

  <!-- sweep table -->
  <rect x="36" y="264" width="264" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="279" text-anchor="middle" font-size="11" fill="#33475e" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="150" y="279" text-anchor="middle" font-size="11" fill="#33475e" font-weight="bold" filter="url(#rough2)">窗口 [s, s+k−1]</text>
  <text x="258" y="279" text-anchor="middle" font-size="11" fill="#33475e" font-weight="bold" filter="url(#rough2)">落点 t</text>

  <rect x="36" y="286" width="264" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="301" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="150" y="301" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 3]</text>
  <text x="258" y="301" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="36" y="308" width="264" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="323" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="323" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 4]</text>
  <text x="258" y="323" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="36" y="330" width="264" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="345" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="150" y="345" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2, 5]</text>
  <text x="258" y="345" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="36" y="352" width="264" height="22" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="367" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="150" y="367" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3, 6]</text>
  <text x="258" y="367" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- target strip -->
  <text x="434" y="280" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">同奇偶扫描（步长 2）</text>
  <rect x="330" y="286" width="26" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="343" y="305" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="356" y="286" width="26" height="28" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="369" y="305" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <rect x="382" y="286" width="26" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="305" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="408" y="286" width="26" height="28" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="421" y="305" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <rect x="434" y="286" width="26" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="447" y="305" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="460" y="286" width="26" height="28" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="473" y="305" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>
  <rect x="486" y="286" width="26" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="499" y="305" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="512" y="286" width="26" height="28" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="525" y="305" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">7</text>

  <text x="434" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">落点集 = {0, 2, 4, 6}</text>
  <text x="434" y="348" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">同一奇偶类、公差 2 的连续段</text>

  <!-- parity note -->
  <rect x="36" y="382" width="502" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287" y="401" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">奇偶性：t ≡ k−1−i (mod 2) 与 s 无关 —— k 奇 ⇒ 奇偶不变；k 偶 ⇒ 每步翻转</text>
</svg>
