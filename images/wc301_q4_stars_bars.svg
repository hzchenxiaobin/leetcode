<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">隔板法：链 + 块长 ⇄ 理想数组</text>
  <text x="280" y="54" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">以 n = 6、链 1 | 2 | 4（k = 3）为例</text>

  <text x="82" y="70" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">n 个位置</text>

  <rect x="82" y="76" width="36" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="146" y="76" width="36" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="210" y="76" width="36" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="274" y="76" width="36" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="338" y="76" width="36" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="402" y="76" width="36" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" filter="url(#rough2)"/>

  <path d="M 132,118 L 132,128" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 196,118 L 196,128" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 260,118 L 260,128" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 324,118 L 324,128" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 378,118 L 378,128" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="193.5" y="68" width="5" height="52" rx="2" fill="#b85450" filter="url(#rough2)"/>
  <rect x="257.5" y="68" width="5" height="52" rx="2" fill="#b85450" filter="url(#rough2)"/>

  <text x="280" y="136" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">n - 1 = 5 个间隙</text>
  <text x="280" y="154" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">选其中 k - 1 = 2 个插入隔板</text>

  <path d="M 280,164 L 280,194" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="184" font-size="11" fill="#666" filter="url(#rough2)">展开</text>

  <rect x="82" y="198" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="146" y="198" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="164" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="210" y="198" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="228" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="274" y="198" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="292" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <rect x="338" y="198" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="356" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <rect x="402" y="198" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>

  <rect x="193.5" y="190" width="5" height="52" rx="2" fill="#b85450" filter="url(#rough2)"/>
  <rect x="257.5" y="190" width="5" height="52" rx="2" fill="#b85450" filter="url(#rough2)"/>

  <text x="132" y="266" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">l₁ = 2</text>
  <text x="228" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">l₂ = 1</text>
  <text x="356" y="266" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">l₃ = 3</text>

  <rect x="90" y="288" width="380" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">块长方案数 = C(n-1, k-1) = C(5, 2) = 10</text>
  <text x="280" y="336" text-anchor="middle" font-size="11.5" fill="#667788" filter="url(#rough2)">每组块长与链唯一确定一个理想数组（引理 1 的双射）</text>
</svg>
