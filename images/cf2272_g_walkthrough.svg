<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：n = 5 的初始状态与三次修改</text>
  <path d="M 176 42 Q 380 49 584 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="40" y="60" width="680" height="36" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">时刻</text>
  <text x="262" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">三个必需区间</text>
  <text x="470" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">对应的边 (l, r+1)</text>
  <text x="614" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">连通块数 C</text>
  <text x="692" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 行 0 -->
  <rect x="40" y="96" width="680" height="58" fill="#f2f4f7" stroke="#c9ccd1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="262" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1,2] [3,5] [2,4]</text>
  <text x="470" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,3) (3,6) (2,5)</text>
  <text x="614" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="692" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- 行 1：高亮 -->
  <rect x="40" y="154" width="680" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="188" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="262" y="188" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">[1,2] [3,5] [1,5]</text>
  <text x="470" y="188" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">(1,3) (3,6) (1,6)</text>
  <text x="614" y="188" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">4</text>
  <text x="692" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>

  <!-- 行 2 -->
  <rect x="40" y="212" width="680" height="58" fill="#f2f4f7" stroke="#c9ccd1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="262" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2,2] [3,5] [1,5]</text>
  <text x="470" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2,3) (3,6) (1,6)</text>
  <text x="614" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="692" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- 行 3 -->
  <rect x="40" y="270" width="680" height="58" fill="#f2f4f7" stroke="#c9ccd1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="262" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2,2] [4,5] [1,5]</text>
  <text x="470" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2,3) (4,6) (1,6)</text>
  <text x="614" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="692" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- 竖线 -->
  <path d="M 152 62 L 152 326" stroke="#b0b4bb" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 360 62 L 360 326" stroke="#b0b4bb" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 570 62 L 570 326" stroke="#b0b4bb" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 652 62 L 652 326" stroke="#b0b4bb" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 说明 -->
  <rect x="40" y="342" width="680" height="70" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="368" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">t = 1：把 [2,4] 换成 [1,5]，新边 (1,6) 把 1、3、6 并成一块，C 从 3 升到 4，于是答案降到 2。</text>
  <text x="58" y="394" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">t = 2 把 [1,2] 换成 [2,2]：边 (1,3) 变成 (2,3)，2 并入 {1,3,6}，C 从 4 落回 3，答案升回 3。</text>
</svg>
