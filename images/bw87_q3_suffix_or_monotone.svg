<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：目标就是后缀 OR，窗口 OR 只增不减</text>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="280" y="60">从 i 出发能取得的最大 OR = OR(nums[i..n−1])，因为子数组 ⊆ 后缀，OR 只会越加越多</text>
  </g>

  <!-- 数组行 -->
  <text x="80" y="106" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">nums =</text>
  <g filter="url(#rough2)">
    <rect x="140" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="204" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="268" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="332" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="396" y="88" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="168" y="111">1</text><text x="232" y="111">0</text><text x="296" y="111">2</text>
    <text x="360" y="111">1</text><text x="424" y="111">3</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="168" y="140">i=0</text><text x="232" y="140">1</text><text x="296" y="140">2</text>
    <text x="360" y="140">3</text><text x="424" y="140">4</text>
  </g>

  <!-- 后缀 OR 行 -->
  <text x="80" y="178" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后缀 OR =</text>
  <g filter="url(#rough2)">
    <rect x="140" y="160" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="204" y="160" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="268" y="160" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="332" y="160" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="396" y="160" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#1d3a17" text-anchor="middle">
    <text x="168" y="183">3</text><text x="232" y="183">3</text><text x="296" y="183">3</text>
    <text x="360" y="183">3</text><text x="424" y="183">3</text>
  </g>

  <!-- i=0 的扩展过程 -->
  <text x="80" y="228" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">i = 0 时窗口 OR：</text>
  <g filter="url(#rough2)">
    <rect x="216" y="212" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <rect x="292" y="212" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <rect x="368" y="212" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="248" y="232">j=0: 1</text><text x="324" y="232">j=1: 1</text><text x="400" y="232">j=2: 3 ✓</text>
  </g>
  <path d="M 262 244 L 286 244" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 338 244 L 362 244" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="274">j 向右每走一步，窗口 OR 按位只增不减；首次等于后缀 OR 即最短</text>
    <text x="280" y="296">下标 0 的答案 = 2 − 0 + 1 = 3（子数组 [1,0,2]）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="318" width="420" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a2f2b" text-anchor="middle">
    <text x="280" y="340">难点：OR 不支持「删掉左端」的撤销，滑动窗口会失灵；</text>
    <text x="280" y="360">改问「后缀里每个 bit 最近的来源在哪」→ 逐位解决（下一张图）</text>
  </g>
</svg>
