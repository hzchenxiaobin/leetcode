<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：一个过滤条件把点分成三堆</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">coordinates = [(3,1),(2,2),(4,1),(0,0),(5,3)]，k = 1 → 基准点 (2,2)</text>

  <rect x="46" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="81" y="82" text-anchor="middle" font-size="10" fill="#3a4a66">点</text>
  <rect x="116" y="62" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="171" y="82" text-anchor="middle" font-size="10" fill="#3a4a66">x &lt; 2 且 y &lt; 2 ?</text>
  <rect x="226" y="62" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="281" y="82" text-anchor="middle" font-size="10" fill="#3a4a66">x &gt; 2 且 y &gt; 2 ?</text>
  <rect x="336" y="62" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="386" y="82" text-anchor="middle" font-size="10" fill="#3a4a66">去向</text>

  <rect x="46" y="96" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="115" text-anchor="middle" font-size="10" fill="#666">(3,1)</text>
  <rect x="116" y="96" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="115" text-anchor="middle" font-size="10" fill="#999">否</text>
  <rect x="226" y="96" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="115" text-anchor="middle" font-size="10" fill="#999">否</text>
  <rect x="336" y="96" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="115" text-anchor="middle" font-size="10" fill="#8a3a36">丢弃</text>

  <rect x="46" y="130" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="149" text-anchor="middle" font-size="10" fill="#666">(2,2)</text>
  <rect x="116" y="130" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="149" text-anchor="middle" font-size="10" fill="#999">基准点</text>
  <rect x="226" y="130" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="149" text-anchor="middle" font-size="10" fill="#999">基准点</text>
  <rect x="336" y="130" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="149" text-anchor="middle" font-size="10" fill="#8a6a20">k 本身</text>

  <rect x="46" y="164" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="183" text-anchor="middle" font-size="10" fill="#666">(4,1)</text>
  <rect x="116" y="164" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="183" text-anchor="middle" font-size="10" fill="#999">否</text>
  <rect x="226" y="164" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="183" text-anchor="middle" font-size="10" fill="#999">否</text>
  <rect x="336" y="164" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="183" text-anchor="middle" font-size="10" fill="#8a3a36">丢弃</text>

  <rect x="46" y="198" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="217" text-anchor="middle" font-size="10" fill="#666">(0,0)</text>
  <rect x="116" y="198" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="171" y="217" text-anchor="middle" font-size="10" fill="#3a5a30">是</text>
  <rect x="226" y="198" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="217" text-anchor="middle" font-size="10" fill="#999">否</text>
  <rect x="336" y="198" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="386" y="217" text-anchor="middle" font-size="10" fill="#3a4a66">左下集合</text>

  <rect x="46" y="232" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="251" text-anchor="middle" font-size="10" fill="#666">(5,3)</text>
  <rect x="116" y="232" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="251" text-anchor="middle" font-size="10" fill="#999">否</text>
  <rect x="226" y="232" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="281" y="251" text-anchor="middle" font-size="10" fill="#3a5a30">是</text>
  <rect x="336" y="232" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="386" y="251" text-anchor="middle" font-size="10" fill="#3a4a66">右上集合</text>

  <rect x="40" y="276" width="490" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="285" y="298" text-anchor="middle" font-size="11" fill="#8a6a20">左下集合只有 {(0,0)} → LIS = 1；右上集合只有 {(5,3)} → LIS = 1</text>
  <text x="285" y="318" text-anchor="middle" font-size="11" fill="#8a6a20">答案 = 1 + 1（k 自己）+ 1 = 3，对应路径 (0,0) → (2,2) → (5,3)</text>
  <text x="285" y="336" text-anchor="middle" font-size="10" fill="#555">示例 2 里 (2,1) 与 (5,6) 之间没有可插的点 → 1 + 1 = 2</text>
</svg>
