<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">自描述：段长序列连起来正好是 s 本身</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">段长只能是 1 或 2 ⇒ 首字符确定后，整串被逐位唯一确定</text>

  <!-- 第一行：s 的前 12 个字符，按段着色 -->
  <text x="70" y="92" text-anchor="end" font-size="13" fill="#3a4a66" filter="url(#rough2)">s =</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="78" y="72" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="91" y="92" fill="#3a4a66">1</text>
    <rect x="104" y="72" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="130" y="92" fill="#8a6a20">2 2</text>
    <rect x="156" y="72" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="182" y="92" fill="#3a4a66">1 1</text>
    <rect x="208" y="72" width="26" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="221" y="92" fill="#8a6a20">2</text>
    <rect x="234" y="72" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="247" y="92" fill="#3a4a66">1</text>
    <rect x="260" y="72" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="286" y="92" fill="#8a6a20">2 2</text>
    <rect x="312" y="72" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="325" y="92" fill="#3a4a66">1</text>
    <rect x="338" y="72" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="364" y="92" fill="#8a6a20">2 2</text>
  </g>

  <text x="410" y="92" font-size="12" fill="#999" filter="url(#rough2)">……</text>

  <!-- 对应关系箭头：第 k 段长度 = s[k] -->
  <g stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)">
    <path d="M 91 166 L 91 106" marker-end="url(#arr)"/>
    <path d="M 117 166 L 117 106" marker-end="url(#arr)"/>
    <path d="M 143 166 L 143 106" marker-end="url(#arr)"/>
    <path d="M 169 166 L 169 106" marker-end="url(#arr)"/>
    <path d="M 195 166 L 195 106" marker-end="url(#arr)"/>
    <path d="M 221 166 L 221 106" marker-end="url(#arr)"/>
    <path d="M 247 166 L 247 106" marker-end="url(#arr)"/>
    <path d="M 273 166 L 273 106" marker-end="url(#arr)"/>
  </g>

  <!-- 第二行：各段长度 -->
  <text x="70" y="188" text-anchor="end" font-size="12" fill="#3a5a30" filter="url(#rough2)">段长</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="78" y="168" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="91" y="188" fill="#3a5a30">1</text>
    <rect x="104" y="168" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="117" y="188" fill="#3a5a30">2</text>
    <rect x="130" y="168" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="143" y="188" fill="#3a5a30">2</text>
    <rect x="156" y="168" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="169" y="188" fill="#3a5a30">1</text>
    <rect x="182" y="168" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="195" y="188" fill="#3a5a30">1</text>
    <rect x="208" y="168" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="221" y="188" fill="#3a5a30">2</text>
    <rect x="234" y="168" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="247" y="188" fill="#3a5a30">1</text>
    <rect x="260" y="168" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="273" y="188" fill="#3a5a30">2</text>
  </g>
  <text x="300" y="188" font-size="12" fill="#999" filter="url(#rough2)">……</text>

  <!-- 索引 -->
  <g font-size="9" fill="#aaa" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="212">0</text>
    <text x="117" y="212">1</text>
    <text x="143" y="212">2</text>
    <text x="169" y="212">3</text>
    <text x="195" y="212">4</text>
    <text x="221" y="212">5</text>
    <text x="247" y="212">6</text>
    <text x="273" y="212">7</text>
    <text x="310" y="212">段号 k</text>
  </g>

  <rect x="40" y="228" width="480" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="249" font-size="11" fill="#8a6a20" filter="url(#rough2)">把 s 切成极大同字符段： 1 | 22 | 11 | 2 | 1 | 22 | 1 | 22 | ……</text>
  <text x="58" y="268" font-size="11" fill="#555" filter="url(#rough2)">各段长度依次为 1 2 2 1 1 2 1 2 ……，正是 s 的前 8 位（同一串数字）</text>
  <text x="58" y="288" font-size="11" fill="#555" filter="url(#rough2)">也就是说：s[k] 既是「第 k 个字符」，又是「第 k 段的长度」——这两件事始终相等</text>

  <rect x="40" y="314" width="480" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="336" font-size="11" fill="#3a5a30" filter="url(#rough2)">于是不需要任何搜索或试错：从左往右扫一遍，用读指针 i 取 s[i] 作为下一段长度，</text>
  <text x="58" y="356" font-size="11" fill="#3a5a30" filter="url(#rough2)">新段字符与前一段必然不同（1 ↔ 2 交替），就能唯一地把整串写出来，时间 O(n)。</text>
</svg>
