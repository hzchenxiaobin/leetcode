<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：a = "abcd"，b = "cdabcdab"</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">m = 4，L = 8 ⇒ q = 2；先试 a²，未命中再试 a³</text>

  <!-- a^2 -->
  <text x="42" y="100" font-size="12" fill="#666" filter="url(#rough2)">a²</text>
  <g filter="url(#rough2)" font-size="15" fill="#3a4a66" text-anchor="middle">
    <rect x="100" y="76" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="144" y="76" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="188" y="76" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="232" y="76" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="276" y="76" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="320" y="76" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="364" y="76" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="408" y="76" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="120" y="100">a</text>
    <text x="164" y="100">b</text>
    <text x="208" y="100">c</text>
    <text x="252" y="100">d</text>
    <text x="296" y="100">a</text>
    <text x="340" y="100">b</text>
    <text x="384" y="100">c</text>
    <text x="428" y="100">d</text>
  </g>
  <text x="466" y="100" font-size="11" fill="#b85450" filter="url(#rough2)">未命中</text>
  <text x="466" y="116" font-size="9.5" fill="#999" filter="url(#rough2)">b 无法整体对齐</text>

  <!-- a^3 -->
  <text x="42" y="190" font-size="12" fill="#666" filter="url(#rough2)">a³</text>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="100" y="166" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="144" y="166" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="188" y="166" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="232" y="166" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="276" y="166" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="320" y="166" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="364" y="166" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="408" y="166" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="452" y="166" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="496" y="166" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="540" y="166" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="584" y="166" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <g fill="#3a4a66">
      <text x="120" y="190">a</text>
      <text x="164" y="190">b</text>
      <text x="208" y="190">c</text>
      <text x="252" y="190">d</text>
      <text x="296" y="190">a</text>
      <text x="340" y="190">b</text>
      <text x="384" y="190">c</text>
      <text x="428" y="190">d</text>
      <text x="472" y="190">a</text>
      <text x="516" y="190">b</text>
      <text x="560" y="190">c</text>
      <text x="604" y="190">d</text>
    </g>
  </g>
  <g font-size="9.5" fill="#b0b0b0" text-anchor="middle" filter="url(#rough2)">
    <text x="120" y="216">0</text>
    <text x="164" y="216">1</text>
    <text x="208" y="216">2</text>
    <text x="252" y="216">3</text>
    <text x="296" y="216">4</text>
    <text x="340" y="216">5</text>
    <text x="384" y="216">6</text>
    <text x="428" y="216">7</text>
    <text x="472" y="216">8</text>
    <text x="516" y="216">9</text>
    <text x="560" y="216">10</text>
    <text x="604" y="216">11</text>
  </g>

  <path d="M 188 226 L 188 238 L 536 238 L 536 226" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="362" y="256" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">b 从下标 2 起对齐，正好占满第 1~3 块（q+1 = 3 块）</text>

  <rect x="110" y="272" width="420" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="130" y="294" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">a³ = "abcdabcdabcd"，b 是它的子串 ⇒ 答案 = 3</text>
  <text x="130" y="312" font-size="10.5" fill="#555" filter="url(#rough2)">a² = "abcdabcd" 中窗口只能从下标 0 起匹配，无法对上</text>

  <text x="320" y="352" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">对比：若 b = "cdabcd"（L = 6），a² 下标 2 处即可命中 ⇒ 答案 2</text>
</svg>
