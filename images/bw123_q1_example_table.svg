<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">常见输入走一遍判定表</text>

  <rect x="24" y="44" width="512" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="64" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">nums</text>
  <text x="196" y="64" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">排序后</text>
  <text x="330" y="64" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">关键判断</text>
  <text x="478" y="64" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">输出</text>

  <g filter="url(#rough2)">
    <rect x="24" y="74" width="512" height="34" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <rect x="24" y="108" width="512" height="34" fill="#fdfefe" stroke="#ddd" stroke-width="1"/>
    <rect x="24" y="142" width="512" height="34" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <rect x="24" y="176" width="512" height="34" fill="#fce4ec" stroke="#ddd" stroke-width="1"/>
    <rect x="24" y="210" width="512" height="34" fill="#fce4ec" stroke="#ddd" stroke-width="1"/>
  </g>

  <g font-size="10.5" fill="#333" filter="url(#rough2)">
    <text x="88" y="96" text-anchor="middle">[3,3,3]</text>
    <text x="196" y="96" text-anchor="middle">3,3,3</text>
    <text x="330" y="96" text-anchor="middle">3+3 &gt; 3 ✓，三边相等</text>
    <text x="478" y="96" text-anchor="middle" fill="#4a7a3a">equilateral</text>

    <text x="88" y="130" text-anchor="middle">[3,3,4]</text>
    <text x="196" y="130" text-anchor="middle">3,3,4</text>
    <text x="330" y="130" text-anchor="middle">3+3 &gt; 4 ✓，两边相等</text>
    <text x="478" y="130" text-anchor="middle" fill="#d6a040">isosceles</text>

    <text x="88" y="164" text-anchor="middle">[3,4,5]</text>
    <text x="196" y="164" text-anchor="middle">3,4,5</text>
    <text x="330" y="164" text-anchor="middle">3+4 &gt; 5 ✓，三边不等</text>
    <text x="478" y="164" text-anchor="middle" fill="#446688">scalene</text>

    <text x="88" y="198" text-anchor="middle">[1,1,2]</text>
    <text x="196" y="198" text-anchor="middle">1,1,2</text>
    <text x="330" y="198" text-anchor="middle">1+1 = 2 ≤ 2 ✗</text>
    <text x="478" y="198" text-anchor="middle" fill="#b85450">none</text>

    <text x="88" y="232" text-anchor="middle">[1,2,3]</text>
    <text x="196" y="232" text-anchor="middle">1,2,3</text>
    <text x="330" y="232" text-anchor="middle">1+2 = 3 ≤ 3 ✗</text>
    <text x="478" y="232" text-anchor="middle" fill="#b85450">none</text>
  </g>

  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">等号成立（和恰好等于第三边）也算不成三角形，必须严格大于</text>
  <text x="280" y="294" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">判断顺序不能颠倒：先排除 none，再数相等的边有多少条</text>
</svg>
