<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 292" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="292" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">长度固定为 3 的窗口：只判定窗口内三个数</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1：nums = [1,2,1,4,1]，逐个滑动起点 i</text>

  <rect x="80" y="90" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="112" y="118" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="150" y="90" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="182" y="118" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">2</text>
  <rect x="220" y="90" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="252" y="118" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="290" y="90" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="322" y="118" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="360" y="90" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="392" y="118" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="112" y="154" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="182" y="154" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="252" y="154" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i=2</text>
  <text x="322" y="154" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="392" y="154" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <path d="M 220 162 L 220 172 L 424 172 L 424 162" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="322" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">窗口 a=1，b=4，c=1</text>

  <path d="M 322 196 L 322 208" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="48" y="214" width="210" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="153" y="234" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">a + c = b / 2</text>
  <text x="153" y="254" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">等价于 2(a + c) = b</text>

  <rect x="300" y="214" width="196" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="398" y="234" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2 × (1 + 1) = 4 = b ✓</text>
  <text x="398" y="254" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans += 1</text>

  <text x="270" y="282" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">C++ 里 b/2 是整除（1/2 = 0），必须用乘 2 的整式判定</text>
</svg>
