<svg xmlns="http://www.w3.org/2000/svg" width="640" height="662" viewBox="0 0 640 662" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="433" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="640" height="662" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次后序遍历 + 一张字典</text>
  <path d="M 120 42 Q 320 50 520 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="250" y="52" width="140" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">开始 dfs(root)</text>
  <path d="M 320 82 L 320 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <rect x="176" y="100" width="288" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="123" text-anchor="middle" font-size="12.5" fill="#2b4a63" filter="url(#rough2)">进入结点 node：先递归左右孩子</text>
  <path d="M 320 136 L 320 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <polygon points="320,152 392,180 320,208 248,180" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="185" text-anchor="middle" font-size="12" fill="#8a322e" filter="url(#rough2)">node 为空？</text>

  <path d="M 392 180 L 452 180" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="420" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="456" y="164" width="156" height="32" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="534" y="185" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#rough2)">返回 #0（空子树）</text>

  <path d="M 320 208 L 320 226" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="332" y="220" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="176" y="226" width="288" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="249" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2b4a63" filter="url(#rough2)">lid = dfs(left); rid = dfs(right)</text>
  <path d="M 320 262 L 320 280" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <rect x="192" y="280" width="256" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="303" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2b4a63" filter="url(#rough2)">key = (val, lid, rid)</text>
  <path d="M 320 316 L 320 332" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <polygon points="320,332 396,362 320,392 244,362" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="366" text-anchor="middle" font-size="12" fill="#8a322e" filter="url(#rough2)">key 已在字典？</text>

  <path d="M 244 362 L 168 362" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="206" y="354" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="16" y="346" width="148" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="367" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">分配新编号 id，登记</text>

  <path d="M 396 362 L 456 362" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="424" y="354" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="460" y="346" width="152" height="32" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="536" y="367" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">取出旧编号 id</text>

  <path d="M 90 378 L 90 414 L 188 414" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <path d="M 536 378 L 536 414 L 452 414" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <rect x="192" y="396" width="256" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="419" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2e5e2e" filter="url(#rough2)">cnt[id] += 1</text>
  <path d="M 320 432 L 320 452" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <polygon points="320,452 398,482 320,512 242,482" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="486" text-anchor="middle" font-size="12" fill="#8a322e" filter="url(#rough2)">cnt[id] == 2 ？</text>

  <path d="M 398 482 L 452 482" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="424" y="474" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="456" y="466" width="160" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="536" y="487" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a322e" filter="url(#rough2)">ans.push(node)</text>

  <path d="M 536 498 L 536 556 L 452 556" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <path d="M 320 512 L 320 540" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="332" y="530" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="192" y="540" width="256" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="563" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2b4a63" filter="url(#rough2)">return id</text>
  <path d="M 320 576 L 320 596" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <rect x="240" y="596" width="160" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="616" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">返回 ans</text>

  <rect x="92" y="636" width="456" height="22" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="652" text-anchor="middle" font-size="11" fill="#8a7a55" filter="url(#rough2)">只在 cnt 恰好为 2 时收集：每个重复类只输出一个代表</text>
</svg>
