<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="57"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="139"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：从字符串到差值键到孤桶</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold">
    <text x="90" y="60">字符串</text>
    <text x="250" y="60" text-anchor="middle">差值计算</text>
    <text x="450" y="60" text-anchor="middle">哈希键</text>
  </g>
  <path d="M 55 68 L 520 68" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="90" y="96">"adc"</text>
    <text x="250" y="96" text-anchor="middle">c−a=3，b−c=−1</text>
    <g><rect x="400" y="82" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/></g>
    <text x="450" y="99" text-anchor="middle" fill="#1d3a17">[3, −1]</text>
  </g>
  <path d="M 55 106 L 520 106" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="90" y="134">"wzy"</text>
    <text x="250" y="134" text-anchor="middle">y−w=3，z−y=−1</text>
    <g><rect x="400" y="120" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/></g>
    <text x="450" y="137" text-anchor="middle" fill="#1d3a17">[3, −1]</text>
  </g>
  <path d="M 55 144 L 520 144" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="90" y="172">"abc"</text>
    <text x="250" y="172" text-anchor="middle">b−a=1，c−b=1</text>
    <g><rect x="400" y="158" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/></g>
    <text x="450" y="175" text-anchor="middle" fill="#7a2f2b" font-weight="bold">[1, 1]</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 375 200 L 375 224" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="390" y="220" font-size="12" fill="#b85450" filter="url(#rough2)">孤桶大小 = 1</text>

  <g filter="url(#rough2)">
    <rect x="60" y="232" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9"/>
  </g>
  <text x="160" y="259" text-anchor="middle" font-size="13" fill="#1d3a17" filter="url(#rough2)">[3, −1] × 2 → "adc"/"wzy"</text>

  <g filter="url(#rough2)">
    <rect x="300" y="232" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="9"/>
  </g>
  <text x="400" y="259" text-anchor="middle" font-size="13" fill="#7a2f2b" font-weight="bold" filter="url(#rough2)">[1, 1] × 1 → "abc" ✓</text>

  <g filter="url(#rough2)">
    <rect x="60" y="296" width="440" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="280" y="320">示例 2 同理：aaa/ccc/ddd → [0,0]（桶大小 3）</text>
    <text x="280" y="342">bob → [13, −13]（孤桶）→ 返回 "bob"</text>
    <text x="280" y="368">位置无关性：异类在开头/中间/结尾，桶判定都一样稳</text>
  </g>
</svg>
