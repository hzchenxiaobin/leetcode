<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：约简链坍缩极快，判定只看 pc(x)</text>
  <text x="300" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">pc(x) = x 的置位数。x ≥ 2 时 pc(x) &lt; x —— 链严格递减，必到唯一不动点 1</text>

  <!-- 约简链：6 个框 -->
  <g filter="url(#rough2)">
    <rect x="20" y="62" width="70" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <rect x="118" y="62" width="70" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="216" y="62" width="70" height="46" rx="6" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5"/>
    <rect x="314" y="62" width="70" height="46" rx="6" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5"/>
    <rect x="412" y="62" width="70" height="46" rx="6" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5"/>
    <rect x="510" y="62" width="70" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="55" y="83" font-size="13.5" font-weight="bold" fill="#446688">x</text>
    <text x="55" y="101" font-size="9.5" fill="#777">x &lt; n ≤ 2^800</text>
    <text x="153" y="83" font-size="13.5" font-weight="bold" fill="#2f5a24">c₁</text>
    <text x="153" y="101" font-size="9.5" fill="#777">≤ 800</text>
    <text x="251" y="83" font-size="13.5" font-weight="bold" fill="#555">c₂</text>
    <text x="251" y="101" font-size="9.5" fill="#777">≤ 9</text>
    <text x="349" y="83" font-size="13.5" font-weight="bold" fill="#555">c₃</text>
    <text x="349" y="101" font-size="9.5" fill="#777">≤ 3</text>
    <text x="447" y="83" font-size="13.5" font-weight="bold" fill="#555">c₄</text>
    <text x="447" y="101" font-size="9.5" fill="#777">≤ 2</text>
    <text x="545" y="83" font-size="13.5" font-weight="bold" fill="#8a6a1a">1</text>
    <text x="545" y="101" font-size="9.5" fill="#777">到达！</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 92 85 L 114 85" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <path d="M 190 85 L 212 85" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <path d="M 288 85 L 310 85" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <path d="M 386 85 L 408 85" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <path d="M 484 85 L 506 85" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="9.5" fill="#b85450">
    <text x="104" y="77">pc</text>
    <text x="202" y="77">pc</text>
    <text x="300" y="77">pc</text>
    <text x="398" y="77">pc</text>
    <text x="495" y="77">pc</text>
  </g>

  <text x="300" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">任何 x &lt; 2^800 至多 5 步回到 1 —— k = 5 时全体正整数可约简，答案 = (n−1) mod p</text>

  <!-- 题面例子 -->
  <text x="32" y="164" font-size="11" fill="#777" filter="url(#rough2)">题面例：</text>
  <g filter="url(#rough2)">
    <ellipse cx="138" cy="160" rx="42" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="252" cy="160" rx="34" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="342" cy="160" rx="20" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <path d="M 182 160 L 214 160" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <path d="M 288 160 L 318 160" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="11" fill="#333">
    <text x="138" y="164">6 = 110₂</text>
    <text x="252" y="164">2 = 10₂</text>
    <text x="342" y="164">1</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="9" fill="#b85450">
    <text x="198" y="152">pc（2 个 1）</text>
    <text x="303" y="152">pc</text>
  </g>
  <text x="386" y="164" font-size="10.5" fill="#777" filter="url(#rough2)">6 需 2 次操作（2-可约简）</text>

  <!-- 判定转移 -->
  <rect x="30" y="192" width="540" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">「判定转移」：x 是 k-可约简 ⇔ pc(x) 是 (k−1)-可约简</text>
  <text x="300" y="237" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">x ≥ 2 时 pc(x) &lt; x，链严格递减，故 steps(x) = 1 + steps(pc(x))；</text>
  <text x="300" y="256" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 是唯一正不动点（pc(1) = 1），「至多 k 次」即 steps(x) ≤ k。</text>
  <text x="300" y="274" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（0 永远到不了 1，不在讨论范围）</text>

  <!-- 转化 -->
  <rect x="30" y="290" width="540" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">转化：ans = #{ x ∈ [1, n−1] : pc(x) ∈ A }</text>
  <text x="300" y="334" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">A = { c ∈ [1, L] : steps(c) ≤ k−1 }，L = len(s) ≤ 800；</text>
  <text x="300" y="353" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">steps 表 O(L) 递推：steps[c] = 1 + steps[pc(c)]（pc(c) &lt; c，无环）。</text>
  <text x="300" y="374" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">八百位大数 x 的「命运」，完全由不超过 800 的小数字 pc(x) 决定。</text>

  <text x="300" y="410" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">剩下的问题：小于 n 且恰有 c 个置位的数有几个？→ 数位组合计数（见下一图）</text>
</svg>
