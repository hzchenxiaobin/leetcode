<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：转字符串 + 一遍扫描</text>
  <path d="M 210 42 Q 340 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="260" cy="86" rx="70" ry="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="260" y="91" text-anchor="middle" font-size="13" fill="#2b6e9e">输入正整数 n</text>
  <g filter="url(#sk)">
    <path d="M 260 110 L 260 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- to string -->
  <g filter="url(#sk)">
    <rect x="170" y="134" width="180" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="260" y="159" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">s = to_string(n)</text>
  <g filter="url(#sk)">
    <path d="M 260 174 L 260 194" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="185" y="198" width="150" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="260" y="223" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">i = 0, ans = 0</text>
  <g filter="url(#sk)">
    <path d="M 260 238 L 260 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- loop condition diamond -->
  <g filter="url(#sk)">
    <polygon points="260,262 330,296 260,330 190,296" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="260" y="301" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">i &lt; s.size()?</text>
  <g filter="url(#sk)">
    <path d="M 190 296 L 130 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="146" y="288" text-anchor="middle" font-size="11" fill="#a03030">否</text>
  <!-- return -->
  <g filter="url(#sk)">
    <ellipse cx="80" cy="296" rx="52" ry="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="80" y="301" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">return ans</text>

  <!-- yes branch -->
  <g filter="url(#sk)">
    <path d="M 260 330 L 260 352" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="276" y="346" font-size="11" fill="#2e6e2e">是</text>

  <!-- parity diamond -->
  <g filter="url(#sk)">
    <polygon points="260,356 318,388 260,420 202,388" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="260" y="193" text-anchor="middle" font-size="0" fill="#7a5415"> </text>
  <text x="260" y="386" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">i 是偶数?</text>
  <text x="260" y="402" text-anchor="middle" font-size="10" fill="#888">(i % 2 == 0)</text>

  <!-- yes: ans += digit -->
  <g filter="url(#sk)">
    <path d="M 202 388 L 120 388" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="152" y="380" text-anchor="middle" font-size="11" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="16" y="370" width="104" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="68" y="394" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">ans += d</text>

  <!-- no: ans -= digit -->
  <g filter="url(#sk)">
    <path d="M 318 388 L 400 388" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="356" y="380" text-anchor="middle" font-size="11" fill="#a03030">否</text>
  <g filter="url(#sk)">
    <rect x="404" y="370" width="104" height="38" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="456" y="394" text-anchor="middle" font-size="12" fill="#a03030" font-family="monospace">ans −= d</text>

  <!-- merge arrows to i++ -->
  <g filter="url(#sk)">
    <path d="M 68 408 Q 68 448 200 448" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 456 408 Q 456 448 320 448" stroke="#3a3a3a" stroke-width="1.4" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 320 448 L 300 448" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="204" y="432" width="94" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="251" y="453" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">i += 1</text>
  <!-- loop back arrow -->
  <g filter="url(#sk)">
    <path d="M 204 448 Q 150 448 150 296 Q 150 240 185 220" stroke="#3a3a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  </g>
  <text x="128" y="424" font-size="10" fill="#888">回到循环条件</text>

  <!-- side notes -->
  <g filter="url(#sk)">
    <rect x="440" y="120" width="220" height="170" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="550" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">要点</text>
  <text x="458" y="172" font-size="11" fill="#444">· d = s[i]，即该位数字</text>
  <text x="458" y="196" font-size="11" fill="#444">· 位数 ≤ 10（n ≤ 10⁹）</text>
  <text x="458" y="220" font-size="11" fill="#444">· 一遍扫描，无需回溯</text>
  <text x="458" y="244" font-size="11" fill="#444">· 时间 O(d)，空间 O(d)</text>
  <text x="458" y="268" font-size="11" fill="#7a5415">· ans 可能为负，直接返回</text>

  <!-- key insight -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="600" height="0" rx="8" fill="none" stroke="none"/>
  </g>
</svg>
