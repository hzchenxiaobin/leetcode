<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">阶梯构造：n = 6 ⇒ k = 3，第 j 个探测器取 [j+1, k+j]</text>
  <path d="M 170 44 Q 440 50 710 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="184.0" y="78" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">1</text>
  <path d="M 150 86 Q 151.5 240 150 372" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="252.0" y="78" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">2</text>
  <path d="M 218 86 Q 219.5 240 218 372" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="320.0" y="78" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">3</text>
  <path d="M 286 86 Q 287.5 240 286 372" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="388.0" y="78" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">4</text>
  <path d="M 354 86 Q 355.5 240 354 372" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="456.0" y="78" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">5</text>
  <path d="M 422 86 Q 423.5 240 422 372" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="524.0" y="78" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">6</text>
  <path d="M 490 86 Q 491.5 240 490 372" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 558 86 Q 559.5 240 558 372" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="218" y="96" width="204" height="30" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320.0" y="116.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">[2, 4]</text>
  <text x="138" y="116.0" text-anchor="end" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">D₁</text>
  <rect x="286" y="142" width="204" height="30" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="388.0" y="162.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#33602a" filter="url(#rough2)">[3, 5]</text>
  <text x="138" y="162.0" text-anchor="end" font-size="13" font-weight="bold" fill="#33602a" filter="url(#rough2)">D₂</text>
  <rect x="354" y="188" width="204" height="30" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="456.0" y="208.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">[4, 6]</text>
  <text x="138" y="208.0" text-anchor="end" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">D₃</text>
  <text x="138" y="319" text-anchor="end" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">签名</text>
  <rect x="152" y="300" width="64" height="38" rx="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="184.0" y="325" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">∅</text>
  <rect x="220" y="300" width="64" height="38" rx="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="252.0" y="325" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{1}</text>
  <rect x="288" y="300" width="64" height="38" rx="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320.0" y="325" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{1,2}</text>
  <rect x="356" y="300" width="64" height="38" rx="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="388.0" y="325" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{1,2,3}</text>
  <rect x="424" y="300" width="64" height="38" rx="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="456.0" y="325" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{2,3}</text>
  <rect x="492" y="300" width="64" height="38" rx="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="524.0" y="325" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{3}</text>
  <text x="138" y="364" text-anchor="end" font-size="12" fill="#66788c" filter="url(#rough2)">位置</text>
  <text x="152" y="364" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">← 左半：前缀集合，一路加到 {1,2,3}</text>
  <text x="556" y="364" text-anchor="end" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">右半：后缀集合 →</text>
  <rect x="70" y="392" width="740" height="70" rx="12" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="420" text-anchor="start" font-size="12.5" fill="#333333" filter="url(#rough2)">第 j 位为 1 ⇔ j+1 ≤ i ≤ k+j：仍是一段连续区间（j 号探测器），所以构造合法</text>
  <text x="90" y="446" text-anchor="start" font-size="12.5" fill="#8e3b34" filter="url(#rough2)">位置 i 的签名：i=1 得 ∅；2 ≤ i ≤ k+1 得 {1,…,i−1}；i ≥ k+2 得 {i−k,…,k}</text>
</svg>
