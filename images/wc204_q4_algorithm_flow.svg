<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：组合数取模预计算 + 递归分治计数</text>
  <path d="M 100 34 Q 280 40 460 34" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Phase 1: precompute -->
  <text x="280" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">阶段一 · 组合数取模预计算 —— 一次性 O(n)</text>

  <rect x="14" y="66" width="164" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">fact[0] = 1</text>
  <text x="96" y="97" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">fact[i] = fact[i−1]·i mod p</text>

  <path d="M 178 86 L 194 86" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="198" y="66" width="170" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">invFact[n] = fact[n]^(p−2)</text>
  <text x="283" y="97" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">快速幂求逆元（费马小定理）</text>

  <path d="M 368 86 L 384 86" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="388" y="66" width="158" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">invFact[i] = invFact[i+1]</text>
  <text x="467" y="97" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">× (i+1)，线性回推</text>

  <text x="280" y="124" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">p = 10⁹+7 是质数 → 费马小定理：a⁻¹ ≡ a^(p−2) (mod p)</text>

  <path d="M 24 136 L 536 136" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- Phase 2: recursion -->
  <text x="280" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">阶段二 · 递归分治 dfs(S) —— 数出所有等价重排</text>

  <rect x="230" y="166" width="100" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dfs(S)</text>

  <path d="M 280 190 L 280 200" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <polygon points="280,202 392,226 280,250 168,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">len(S) ≤ 1 ?</text>

  <path d="M 168 226 L 132 226" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="218" text-anchor="middle" font-size="11" fill="#9a7020" filter="url(#rough2)">是</text>

  <rect x="14" y="212" width="112" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="230" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">返回 1（递归基）</text>

  <path d="M 280 250 L 280 260" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="293" y="260" text-anchor="middle" font-size="11" fill="#9a7020" filter="url(#rough2)">否</text>

  <rect x="172" y="266" width="216" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">root = S[0]，按 &lt; / &gt; 保序分区</text>
  <text x="280" y="295" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">left、right 保持原相对顺序</text>

  <path d="M 280 302 L 280 312" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="146" y="318" width="268" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">return C(l+r, l) · dfs(left) · dfs(right) mod p</text>

  <path d="M 280 350 L 280 360" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="150" y="364" width="260" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">answer = (dfs(nums) − 1 + p) mod p</text>

  <text x="483" y="374" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">f 含原排列本身，</text>
  <text x="483" y="388" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">减 1 前先 +p 防负数</text>

  <!-- Side note -->
  <rect x="412" y="204" width="136" height="52" rx="8" fill="#ffffff" stroke="#e3e3e0" filter="url(#rough2)"/>
  <text x="480" y="222" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#555" filter="url(#rough2)">组合数查表 O(1)：</text>
  <text x="480" y="236" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">C(a,b) = fact[a]·invFact[b]</text>
  <text x="480" y="249" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">· invFact[a−b] mod p</text>
</svg>
