<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b">核心观察：枚举中位 j —— 左右各分大小，乘法原理定贡献</text>
  <path d="M 120 38 Q 320 47 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组 -->
  <g filter="url(#sk)"><rect x="96" y="56" width="48" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="120" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="152" y="56" width="48" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="176" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">5</text>
  <g filter="url(#sk)"><rect x="208" y="56" width="48" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.4"/></g>
  <text x="232" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#b8862b">3</text>
  <g filter="url(#sk)"><rect x="264" y="56" width="48" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="288" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="320" y="56" width="48" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="344" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>

  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="120" y="103">下标 0</text>
    <text x="176" y="103">下标 1</text>
    <text x="232" y="103" font-weight="bold" fill="#c98a2b">下标 2</text>
    <text x="288" y="103">下标 3</text>
    <text x="344" y="103">下标 4</text>
  </g>
  <text x="386" y="70" font-size="12.5" font-weight="bold" fill="#5a4a20">← 中位 j = 下标 2</text>
  <text x="386" y="88" font-size="11.5" fill="#888">rating[j] = 3，左管 i 右管 k</text>

  <!-- 左右分组虚框 -->
  <g filter="url(#sk)"><rect x="88" y="50" width="118" height="46" rx="9" fill="none" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <g filter="url(#sk)"><rect x="260" y="50" width="114" height="46" rx="9" fill="none" stroke="#4a8e4a" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="147" y="122" text-anchor="middle" font-size="11.5" fill="#4a8edb">左侧 i ∈ [0, j)</text>
  <text x="317" y="122" text-anchor="middle" font-size="11.5" fill="#4a8e4a">右侧 k ∈ (j, n)</text>

  <!-- 分组到四计数的箭头 -->
  <path d="M 147 126 Q 120 136 99 142" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M 147 126 Q 200 136 245 142" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M 317 126 Q 355 136 391 142" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M 317 126 Q 430 136 537 142" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <!-- 四计数芯片 -->
  <g filter="url(#sk)"><rect x="30" y="144" width="138" height="46" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="99" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">左小 = 1（2 &lt; 3）</text>
  <text x="99" y="182" text-anchor="middle" font-size="9.5" fill="#6a8a6a">左侧比 j 小的个数</text>

  <g filter="url(#sk)"><rect x="176" y="144" width="138" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="245" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">左大 = 1（5 &gt; 3）</text>
  <text x="245" y="182" text-anchor="middle" font-size="9.5" fill="#a4706e">左侧比 j 大的个数</text>

  <g filter="url(#sk)"><rect x="322" y="144" width="138" height="46" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="391" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">右大 = 1（4 &gt; 3）</text>
  <text x="391" y="182" text-anchor="middle" font-size="9.5" fill="#6a8a6a">右侧比 j 大的个数</text>

  <g filter="url(#sk)"><rect x="468" y="144" width="138" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="537" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">右小 = 1（1 &lt; 3）</text>
  <text x="537" y="182" text-anchor="middle" font-size="9.5" fill="#a4706e">右侧比 j 小的个数</text>

  <!-- 芯片到公式框的配对箭头 -->
  <path d="M 99 192 Q 135 203 172 210" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M 391 192 Q 352 203 313 210" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M 245 192 Q 288 203 336 210" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M 537 192 Q 500 203 468 210" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <!-- 公式框 -->
  <g filter="url(#sk)"><rect x="60" y="212" width="250" height="58" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="185" y="234" text-anchor="middle" font-size="12.5" fill="#2e6e2e">递增队伍 = 左小 × 右大</text>
  <text x="185" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">= 1 × 1 = 1 → (2,3,4) ↑</text>

  <g filter="url(#sk)"><rect x="330" y="212" width="250" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="455" y="234" text-anchor="middle" font-size="12.5" fill="#b85450">递减队伍 = 左大 × 右小</text>
  <text x="455" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">= 1 × 1 = 1 → (5,3,1) ↓</text>

  <!-- 汇聚到贡献 -->
  <path d="M 185 272 Q 240 283 298 288" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <path d="M 455 272 Q 400 283 342 288" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <text x="320" y="296" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b2b2b">贡献(j) = 1 + 1 = 2</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="40" y="312" width="560" height="106" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="338" text-anchor="middle" font-size="12.5" fill="#5a4a20">✓ 固定中位 j：「选 i」与「选 k」分居左右、互不牵制，乘法原理压成一次乘法</text>
  <text x="320" y="364" text-anchor="middle" font-size="12.5" fill="#5a4a20">✓ 一趟左右扫描供出四个计数，递增、递减两个方向免费共享</text>
  <text x="320" y="390" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">✓ 对 j = 1 … n−2 逐个累加贡献；每个 j 扫 O(n)，总计 O(n²)</text>
</svg>
