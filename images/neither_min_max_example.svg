<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：[3,2,1,4] 与 [1,2]</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: example A -->
  <g filter="url(#sk)">
    <rect x="25" y="60" width="330" height="300" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="190" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">示例 A：nums = [3,2,1,4]，n = 4 ≥ 3</text>

  <g filter="url(#sk)">
    <rect x="58" y="100" width="36" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="100" y="100" width="36" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="142" y="100" width="36" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="100" width="36" height="34" rx="6" fill="#f2f2ee" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="76" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">3</text>
  <text x="118" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">2</text>
  <text x="160" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">1</text>
  <text x="202" y="122" text-anchor="middle" font-size="14" fill="#777" filter="url(#sk)">4</text>
  <g filter="url(#sk)">
    <rect x="52" y="94" width="134" height="46" rx="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4"/>
  </g>
  <text x="248" y="112" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#sk)">任取前三个</text>
  <text x="248" y="126" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#sk)">(3, 2, 1)</text>

  <!-- step boxes -->
  <g filter="url(#sk)">
    <rect x="42" y="162" width="86" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="85" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">① 取前三</text>
  <text x="85" y="200" text-anchor="middle" font-size="11" fill="#2b4a6e" font-family="monospace" filter="url(#sk)">(3,2,1)</text>

  <path d="M 128 188 L 146 188" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="148" y="162" width="86" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="191" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e24" filter="url(#sk)">② 排序</text>
  <text x="191" y="200" text-anchor="middle" font-size="11" fill="#2e5e24" font-family="monospace" filter="url(#sk)">1 &lt; 2 &lt; 3</text>

  <path d="M 234 188 L 252 188" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="254" y="162" width="86" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="297" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415" filter="url(#sk)">③ 中位数</text>
  <text x="297" y="200" text-anchor="middle" font-size="11" fill="#8a6415" font-family="monospace" filter="url(#sk)">y = 2</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="52" y="238" width="276" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="190" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">输出 2 ✓（输出 3 也对：任一合法答案均可）</text>
  <text x="190" y="274" text-anchor="middle" font-size="10.5" fill="#a08040" filter="url(#sk)">1 是全局最小、4 是全局最大，2/3 都不是最值</text>

  <!-- verify note -->
  <g filter="url(#sk)">
    <rect x="52" y="296" width="276" height="48" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="190" y="314" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">对照：整体排序 [1,2,3,4] 后取 nums[1] = 2</text>
  <text x="190" y="331" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">两种做法答案一致，但中位数法 O(1)</text>

  <!-- right panel: example B -->
  <g filter="url(#sk)">
    <rect x="375" y="60" width="240" height="300" rx="12" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="495" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#sk)">示例 B：nums = [1,2]，n = 2 &lt; 3</text>

  <g filter="url(#sk)">
    <rect x="425" y="102" width="40" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="495" y="102" width="40" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="445" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <text x="515" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">2</text>
  <text x="445" y="156" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">最小值</text>
  <text x="515" y="156" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">最大值</text>

  <path d="M 495 162 L 495 188" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="410" y="192" width="170" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="495" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" font-family="monospace" filter="url(#sk)">return -1</text>
  <text x="495" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">每个元素非最小即最大</text>

  <g filter="url(#sk)">
    <rect x="392" y="260" width="206" height="84" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="495" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415" filter="url(#sk)">n = 1 同理：</text>
  <text x="495" y="302" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">唯一元素既是 min 又是 max</text>
  <text x="495" y="322" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">→ 同样返回 -1</text>
</svg>
