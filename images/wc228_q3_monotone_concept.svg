<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="540" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：单袋分拆次数 ⌊(n−1)/x⌋，总操作数 ops(x) 随 x 单调不增</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 上框：观察 1 -->
  <g filter="url(#sk)">
    <rect x="30" y="52" width="580" height="196" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="320" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04348">观察 1：单袋 n 球压到每袋 ≤ x，最少操作 ⌈n/x⌉ − 1 = ⌊(n−1)/x⌋ 次</text>

  <!-- 9 → 6+3 → 3+3+3 拆分链 -->
  <g filter="url(#sk)" font-size="14">
    <rect x="154" y="96" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <text x="176" y="117" text-anchor="middle" fill="#2b6e9e">9</text>
    <rect x="226" y="96" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <text x="248" y="117" text-anchor="middle" fill="#2b6e9e">6</text>
    <rect x="274" y="96" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <text x="296" y="117" text-anchor="middle" fill="#2b6e9e">3</text>
    <rect x="346" y="96" width="44" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <text x="368" y="117" text-anchor="middle" fill="#2e6e2e">3</text>
    <rect x="394" y="96" width="44" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <text x="416" y="117" text-anchor="middle" fill="#2e6e2e">3</text>
    <rect x="442" y="96" width="44" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <text x="464" y="117" text-anchor="middle" fill="#2e6e2e">3</text>
  </g>
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 202 112 L 220 112" marker-end="url(#ar)"/>
    <path d="M 322 112 L 340 112" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)" font-size="10.5" fill="#666">
    <text x="211" y="90" text-anchor="middle">拆 6+3</text>
    <text x="331" y="90" text-anchor="middle">拆 3+3</text>
  </g>
  <text x="320" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">n = 9，x = 3：恰 2 次 = ⌈9/3⌉ − 1 = ⌊(9−1)/3⌋</text>

  <!-- 下界 / 上界 两个小盒 -->
  <g filter="url(#sk)">
    <rect x="50" y="166" width="272" height="72" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="186" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04348">下界（鸽笼原理）</text>
  <text x="186" y="208" text-anchor="middle" font-size="11.5" fill="#333">k 份、每份 ≤ x ⟹ 至多装 k·x 个球</text>
  <text x="186" y="226" text-anchor="middle" font-size="11.5" fill="#333">⟹ k ≥ ⌈n/x⌉，操作数 ≥ ⌈n/x⌉ − 1</text>
  <g filter="url(#sk)">
    <rect x="318" y="166" width="272" height="72" rx="8" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="454" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">上界（剥离构造）</text>
  <text x="454" y="208" text-anchor="middle" font-size="11.5" fill="#333">只要剩余 &gt; x 就剥出一袋 x，余数收尾</text>
  <text x="454" y="226" text-anchor="middle" font-size="11.5" fill="#333">份数恰为 ⌈n/x⌉ ⟹ 用 ⌈n/x⌉ − 1 次</text>

  <!-- 下探箭头 -->
  <path d="M 320 252 L 320 266" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 下框：观察 2 -->
  <g filter="url(#sk)">
    <rect x="30" y="270" width="580" height="210" rx="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">观察 2：ops(x) = Σ⌊(nums[i]−1)/x⌋ 单调不增（例：nums = [2,4,8,2]，maxOps = 4）</text>

  <!-- 柱状图：ops(x) 台阶 -->
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.5">
    <path d="M 70 434 L 600 434" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <rect x="80" y="338" width="36" height="96" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="128" y="402" width="36" height="32" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="176" y="410" width="36" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="224" y="426" width="36" height="8" rx="2" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="272" y="426" width="36" height="8" rx="2" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="320" y="426" width="36" height="8" rx="2" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="368" y="426" width="36" height="8" rx="2" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="416" y="430" width="36" height="4" rx="2" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)" font-size="11" font-weight="bold">
    <text x="98" y="333" text-anchor="middle" fill="#a04348">12</text>
    <text x="146" y="397" text-anchor="middle" fill="#2e6e2e">4</text>
    <text x="194" y="405" text-anchor="middle" fill="#2e6e2e">3</text>
    <text x="242" y="421" text-anchor="middle" fill="#2e6e2e">1</text>
    <text x="290" y="421" text-anchor="middle" fill="#2e6e2e">1</text>
    <text x="338" y="421" text-anchor="middle" fill="#2e6e2e">1</text>
    <text x="386" y="421" text-anchor="middle" fill="#2e6e2e">1</text>
    <text x="434" y="426" text-anchor="middle" fill="#2e6e2e">0</text>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#333">
    <text x="98" y="452" text-anchor="middle">1</text>
    <text x="146" y="452" text-anchor="middle">2</text>
    <text x="194" y="452" text-anchor="middle">3</text>
    <text x="242" y="452" text-anchor="middle">4</text>
    <text x="290" y="452" text-anchor="middle">5</text>
    <text x="338" y="452" text-anchor="middle">6</text>
    <text x="386" y="452" text-anchor="middle">7</text>
    <text x="434" y="452" text-anchor="middle">8</text>
  </g>
  <text x="598" y="452" text-anchor="end" font-size="10.5" fill="#888">x（袋中球数上限）</text>

  <!-- maxOps 阈值虚线 -->
  <g filter="url(#sk)">
    <path d="M 70 402 L 600 402" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4"/>
  </g>
  <text x="598" y="394" text-anchor="end" font-size="11.5" font-weight="bold" fill="#a04348">maxOps = 4</text>

  <!-- x* 分界虚线 -->
  <g filter="url(#sk)">
    <path d="M 146 330 L 146 434" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>
  <text x="158" y="344" text-anchor="start" font-size="12" font-weight="bold" fill="#a04348">x*</text>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <rect x="470" y="336" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="470" y="360" width="14" height="14" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#333">
    <text x="490" y="347">ops &gt; maxOps ✗</text>
    <text x="490" y="371">ops ≤ maxOps ✓</text>
  </g>
  <text x="535" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04348">答案 x* = 2</text>

  <text x="320" y="472" text-anchor="middle" font-size="12" fill="#2b6e9e">x 变大 ⇒ 每个 ⌊(nums[i]−1)/x⌋ 只减不增 ⇒ ops(x) 单调不增 ⇒ 可行集是上闭区间 [x*, +∞)</text>

  <!-- 底部橙条 -->
  <g filter="url(#sk)">
    <rect x="30" y="494" width="580" height="38" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="518" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">二分模板：在 [1, max(nums)] 上找最小 x 使 Σ⌊(nums[i]−1)/x⌋ ≤ maxOperations</text>
</svg>
