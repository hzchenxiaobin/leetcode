<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">DFS 走查：指针 idx 推进到哪里，就判定到哪里</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">失败立即短路，不会浪费时间试探「另一条」翻转路径</text>
  <text x="30" y="70" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">示例 2：root = [1,2,3]，voyage = [1,3,2]</text>
  <circle cx="90" cy="116" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="90" y="120.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="52" cy="176" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/><text x="52" y="179.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="128" cy="176" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/><text x="128" y="179.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 90 122 L 55 168" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 90 122 L 125 168" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="180" y="100" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="200.0" y="120.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="220" y="100" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="240.0" y="120.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="260" y="100" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="280.0" y="120.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="180" y="96" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">voyage</text>
  <text x="320" y="118" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">① 1 == voyage[0] ✓  idx→1</text>
  <text x="320" y="140" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">② left=2 ≠ voyage[1]=3</text>
  <text x="320" y="162" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">    → 翻转，res=[1]</text>
  <text x="320" y="184" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">③ 先右(3) 再左(2)，全匹配 ✓</text>
  <text x="30" y="240" font-size="12" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">示例 1：root = [1,2]，voyage = [2,1]</text>
  <circle cx="90" cy="286" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="90" y="290.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="52" cy="340" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/><text x="52" y="343.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 90 292 L 55 332" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="180" y="270" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="200.0" y="290.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="220" y="270" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="240.0" y="290.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="310" y="288" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">根的值 1 ≠ voyage[0] = 2</text>
  <text x="310" y="310" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">根固定 → 直接返回 [-1]</text>
</svg>
