<svg xmlns="http://www.w3.org/2000/svg" width="660" height="448" viewBox="0 0 660 448" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="448" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：quiet = [3,2,5,4,6,1,7,0] 的逐点答案</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="40" y="80" width="36" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="58.0" y="96.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">x</text>
  <g filter="url(#sk2)"><rect x="76" y="80" width="160" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="156.0" y="96.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">rich[x]（直接更富的人）</text>
  <g filter="url(#sk2)"><rect x="236" y="80" width="250" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="361.0" y="96.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">候选与 quiet</text>
  <g filter="url(#sk2)"><rect x="486" y="80" width="76" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="524.0" y="96.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">answer[x]</text>
  <g filter="url(#sk2)"><rect x="40" y="105" width="36" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="58.0" y="121.5" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <g filter="url(#sk2)"><rect x="76" y="105" width="160" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="156.0" y="121.5" text-anchor="middle" font-size="11.5" fill="#333">{1}</text>
  <g filter="url(#sk2)"><rect x="236" y="105" width="250" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="361.0" y="121.5" text-anchor="middle" font-size="11.5" fill="#333">1 → 5（q=1），比 q0=3 小</text>
  <g filter="url(#sk2)"><rect x="486" y="105" width="76" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="524.0" y="121.5" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <g filter="url(#sk2)"><rect x="40" y="130" width="36" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="58.0" y="146.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="76" y="130" width="160" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="156.0" y="146.5" text-anchor="middle" font-size="11.5" fill="#333">{2, 3}</text>
  <g filter="url(#sk2)"><rect x="236" y="130" width="250" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="361.0" y="146.5" text-anchor="middle" font-size="11.5" fill="#333">q2=5、q3=4，dfs(3)=5（q=1）</text>
  <g filter="url(#sk2)"><rect x="486" y="130" width="76" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="524.0" y="146.5" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <g filter="url(#sk2)"><rect x="40" y="155" width="36" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="58.0" y="171.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="76" y="155" width="160" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="156.0" y="171.5" text-anchor="middle" font-size="11.5" fill="#333">{}</text>
  <g filter="url(#sk2)"><rect x="236" y="155" width="250" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="361.0" y="171.5" text-anchor="middle" font-size="11.5" fill="#333">只有自己 q=5</text>
  <g filter="url(#sk2)"><rect x="486" y="155" width="76" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="524.0" y="171.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="40" y="180" width="36" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="58.0" y="196.5" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <g filter="url(#sk2)"><rect x="76" y="180" width="160" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="156.0" y="196.5" text-anchor="middle" font-size="11.5" fill="#333">{4, 5, 6}</text>
  <g filter="url(#sk2)"><rect x="236" y="180" width="250" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="361.0" y="196.5" text-anchor="middle" font-size="11.5" fill="#333">q4=6、q5=1、q6=7 → 5</text>
  <g filter="url(#sk2)"><rect x="486" y="180" width="76" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="524.0" y="196.5" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <g filter="url(#sk2)"><rect x="40" y="205" width="36" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="58.0" y="221.5" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <g filter="url(#sk2)"><rect x="76" y="205" width="160" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="156.0" y="221.5" text-anchor="middle" font-size="11.5" fill="#333">{}</text>
  <g filter="url(#sk2)"><rect x="236" y="205" width="250" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="361.0" y="221.5" text-anchor="middle" font-size="11.5" fill="#333">自己 q=6</text>
  <g filter="url(#sk2)"><rect x="486" y="205" width="76" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="524.0" y="221.5" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <g filter="url(#sk2)"><rect x="40" y="230" width="36" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="58.0" y="246.5" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <g filter="url(#sk2)"><rect x="76" y="230" width="160" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="156.0" y="246.5" text-anchor="middle" font-size="11.5" fill="#333">{}</text>
  <g filter="url(#sk2)"><rect x="236" y="230" width="250" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="361.0" y="246.5" text-anchor="middle" font-size="11.5" fill="#333">自己 q=1，最小</text>
  <g filter="url(#sk2)"><rect x="486" y="230" width="76" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="524.0" y="246.5" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <g filter="url(#sk2)"><rect x="40" y="255" width="36" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="58.0" y="271.5" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <g filter="url(#sk2)"><rect x="76" y="255" width="160" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="156.0" y="271.5" text-anchor="middle" font-size="11.5" fill="#333">{}</text>
  <g filter="url(#sk2)"><rect x="236" y="255" width="250" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="361.0" y="271.5" text-anchor="middle" font-size="11.5" fill="#333">自己 q=7</text>
  <g filter="url(#sk2)"><rect x="486" y="255" width="76" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="524.0" y="271.5" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <g filter="url(#sk2)"><rect x="40" y="280" width="36" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="58.0" y="296.5" text-anchor="middle" font-size="11.5" fill="#333">7</text>
  <g filter="url(#sk2)"><rect x="76" y="280" width="160" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="156.0" y="296.5" text-anchor="middle" font-size="11.5" fill="#333">{3}</text>
  <g filter="url(#sk2)"><rect x="236" y="280" width="250" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="361.0" y="296.5" text-anchor="middle" font-size="11.5" fill="#333">dfs(3)=5（q=1），但 q7=0 更小</text>
  <g filter="url(#sk2)"><rect x="486" y="280" width="76" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="524.0" y="296.5" text-anchor="middle" font-size="11.5" fill="#333">7</text>
  <g filter="url(#sk2)"><rect x="45.0" y="363.0" width="570" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="330" y="386.5" text-anchor="middle" font-size="10.5" fill="#2b4a6e">注意 dfs(3) 返回的是 5 而不是 3：祖先里 5 的钱最多也最安静</text>
  <text x="330" y="401.0" text-anchor="middle" font-size="10.5" fill="#2b4a6e">quiet 互不相同，所以最小值唯一，不需要额外 tie-break</text>
</svg>
