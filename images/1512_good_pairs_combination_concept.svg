<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：好数对只取决于每个值的出现次数</text>
  <text x="320" y="50" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">同一个值出现 c 次 → 任取两个出现位置即成一对，共 C(c, 2) = c(c−1)/2 对</text>

  <!-- array cells -->
  <g filter="url(#r)">
    <rect x="120" y="62" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="188" y="62" width="60" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="256" y="62" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="324" y="62" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="392" y="62" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="460" y="62" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="150" y="85" fill="#33517a" filter="url(#r)">1</text>
    <text x="218" y="85" fill="#a0761e" filter="url(#r)">2</text>
    <text x="286" y="85" fill="#2e6e2e" filter="url(#r)">3</text>
    <text x="354" y="85" fill="#33517a" filter="url(#r)">1</text>
    <text x="422" y="85" fill="#33517a" filter="url(#r)">1</text>
    <text x="490" y="85" fill="#2e6e2e" filter="url(#r)">3</text>
  </g>
  <g font-size="11" fill="#999" text-anchor="middle">
    <text x="150" y="110" filter="url(#r)">0</text>
    <text x="218" y="110" filter="url(#r)">1</text>
    <text x="286" y="110" filter="url(#r)">2</text>
    <text x="354" y="110" filter="url(#r)">3</text>
    <text x="422" y="110" filter="url(#r)">4</text>
    <text x="490" y="110" filter="url(#r)">5</text>
  </g>

  <!-- grouping arrow -->
  <g filter="url(#r)">
    <path d="M 320 118 L 320 136" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="334" y="133" font-size="11.5" fill="#777" filter="url(#r)">按值分桶，桶内独立计数</text>

  <!-- group box 1 : value 1, count 3 -->
  <g filter="url(#r)">
    <rect x="56" y="142" width="176" height="118" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <circle cx="100" cy="196" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="144" cy="196" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="188" cy="196" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <path d="M 100 212 Q 122 226 144 212" stroke="#446688" stroke-width="1.4" fill="none"/>
    <path d="M 144 212 Q 166 226 188 212" stroke="#446688" stroke-width="1.4" fill="none"/>
    <path d="M 100 212 Q 144 238 188 212" stroke="#446688" stroke-width="1.4" fill="none"/>
  </g>
  <text x="144" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">值 1 · 出现 3 次</text>
  <g font-size="10" font-weight="bold" text-anchor="middle" fill="#33517a">
    <text x="100" y="200" filter="url(#r)">0</text>
    <text x="144" y="200" filter="url(#r)">3</text>
    <text x="188" y="200" filter="url(#r)">4</text>
  </g>
  <text x="144" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#r)">c = 3 → 3×2/2 = 3 对</text>

  <!-- group box 2 : value 2, count 1 -->
  <g filter="url(#r)">
    <rect x="232" y="142" width="176" height="118" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="320" cy="196" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">值 2 · 出现 1 次</text>
  <text x="320" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#a0761e" filter="url(#r)">1</text>
  <text x="320" y="228" text-anchor="middle" font-size="11" fill="#b8985a" filter="url(#r)">孤零零一个，配不出对</text>
  <text x="320" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#r)">c = 1 → 1×0/2 = 0 对</text>

  <!-- group box 3 : value 3, count 2 -->
  <g filter="url(#r)">
    <rect x="408" y="142" width="176" height="118" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="456" cy="196" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="536" cy="196" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <path d="M 456 212 Q 496 234 536 212" stroke="#4a7a3a" stroke-width="1.4" fill="none"/>
  </g>
  <text x="496" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">值 3 · 出现 2 次</text>
  <g font-size="10" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="456" y="200" filter="url(#r)">2</text>
    <text x="536" y="200" filter="url(#r)">5</text>
  </g>
  <text x="496" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">c = 2 → 2×1/2 = 1 对</text>

  <!-- sum -->
  <g filter="url(#r)">
    <path d="M 320 268 L 320 284" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="150" y="288" width="340" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07818" filter="url(#r)">ans = 3 + 0 + 1 = 4 ✓</text>

  <!-- insight -->
  <g filter="url(#r)">
    <rect x="56" y="344" width="528" height="68" rx="10" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <text x="320" y="370" text-anchor="middle" font-size="12" fill="#555" filter="url(#r)">① 不同值之间永不成对 → 各桶独立计数，结果直接相加</text>
  <text x="320" y="394" text-anchor="middle" font-size="12" fill="#555" filter="url(#r)">② 下标具体排布无关紧要 → 一趟扫描统计出所有 c 就够了</text>
</svg>
