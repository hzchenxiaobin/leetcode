<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold">核心观察：i 个元素有 i+1 个缝隙，约束 0 ≤ index[i] ≤ i 恰好编号它们</text>
  <path d="M 120 36 Q 320 46 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 场景说明 -->
  <text x="40" y="66" font-size="11.5" fill="#888">示例 1 · 第 5 步：把 4 插到 target=[0,1,3,2] 的下标 1</text>

  <!-- 缝隙编号 -->
  <text x="140" y="78" text-anchor="middle" font-size="11" fill="#8a9ab0">0</text>
  <text x="186" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">1</text>
  <text x="232" y="78" text-anchor="middle" font-size="11" fill="#8a9ab0">2</text>
  <text x="278" y="78" text-anchor="middle" font-size="11" fill="#8a9ab0">3</text>
  <text x="324" y="78" text-anchor="middle" font-size="11" fill="#8a9ab0">4</text>
  <polygon points="135,84 145,84 140,93" fill="#b8c4d0" filter="url(#rough2)"/>
  <polygon points="181,84 191,84 186,93" fill="#b85450" filter="url(#rough2)"/>
  <polygon points="227,84 237,84 232,93" fill="#b8c4d0" filter="url(#rough2)"/>
  <polygon points="273,84 283,84 278,93" fill="#b8c4d0" filter="url(#rough2)"/>
  <polygon points="319,84 329,84 324,93" fill="#b8c4d0" filter="url(#rough2)"/>

  <!-- 右侧图例 -->
  <rect x="398" y="58" width="236" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="408" y="76" font-size="10.5" fill="#446688">▲ = 缝隙（可插入的位置，含首尾）</text>
  <text x="408" y="93" font-size="10.5" fill="#446688">4 个元素 ⟹ 5 个缝隙（编号 0–4）</text>
  <text x="408" y="110" font-size="10.5" font-weight="bold" fill="#b85450">index[4] = 1 ⟹ 选中 1 号缝隙</text>

  <!-- 插入值 4 -->
  <rect x="48" y="92" width="46" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="71" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">4</text>
  <text x="71" y="140" text-anchor="middle" font-size="10" fill="#888">插入值</text>
  <path d="M 96 108 Q 140 145 204 162" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)"/>

  <!-- 插入前 -->
  <rect x="140" y="100" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">0</text>
  <rect x="186" y="100" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="209" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">1</text>
  <rect x="232" y="100" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">3</text>
  <rect x="278" y="100" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">2</text>

  <!-- 右移箭头 -->
  <path d="M 209 136 Q 218 154 249 166" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)"/>
  <path d="M 255 136 Q 264 154 295 166" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)"/>
  <path d="M 301 136 Q 310 154 341 166" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)"/>
  <text x="360" y="152" font-size="11" fill="#d6a040">1、3、2 整体右移一位</text>

  <!-- 插入后 -->
  <rect x="140" y="170" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">0</text>
  <rect x="186" y="170" width="46" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="209" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">4</text>
  <rect x="232" y="170" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="255" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828">1</text>
  <rect x="278" y="170" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="301" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828">3</text>
  <rect x="324" y="170" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="347" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828">2</text>

  <!-- 下标标注 -->
  <text x="163" y="218" text-anchor="middle" font-size="10" fill="#666">下标 0</text>
  <text x="209" y="218" text-anchor="middle" font-size="10" fill="#666">下标 1</text>
  <text x="255" y="218" text-anchor="middle" font-size="10" fill="#666">下标 2</text>
  <text x="301" y="218" text-anchor="middle" font-size="10" fill="#666">下标 3</text>
  <text x="347" y="218" text-anchor="middle" font-size="10" fill="#666">下标 4</text>

  <!-- 结论框 -->
  <rect x="50" y="240" width="540" height="160" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="270" font-size="12" fill="#5a4a20">✓ 插入 = 挤开：下标 p 起的元素整体右移一位，新值落入 p，长度 +1</text>
  <text x="70" y="304" font-size="12" fill="#5a4a20">✓ 合法性白送：第 i 步插入前恰有 i 个元素 ⟹ i+1 个缝隙（编号 0…i），</text>
  <text x="90" y="324" font-size="12" fill="#5a4a20">约束 0 ≤ index[i] ≤ i 与缝隙编号逐值重合 ⟹ 永不越界、全程零特判</text>
  <text x="70" y="360" font-size="12" font-weight="bold" fill="#b85450">✗ 唯一真坑：把 insert 写成 target[p] = x（覆盖）——既不右移也不增长</text>
</svg>
