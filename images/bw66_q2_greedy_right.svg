<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">贪心策略：从左到右扫，桶尽量放在仓鼠右侧</text>

  <!-- 情形 A: H..H -->
  <text x="310" y="64" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">情形 A："H..H" —— 两个仓鼠距离 ≥ 3，各需一桶</text>
  <g filter="url(#rough2)">
    <rect x="180" y="80" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="244" y="80" width="64" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="308" y="80" width="64" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="372" y="80" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="15" filter="url(#rough2)">
    <text x="212" y="105" fill="#b85450">H</text>
    <text x="276" y="105" fill="#4a7a3a">B</text>
    <text x="340" y="105" fill="#4a7a3a">B</text>
    <text x="404" y="105" fill="#b85450">H</text>
  </g>

  <!-- 情形 B: .H.H. -->
  <text x="310" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">情形 B：".H.H." —— 距离恰为 2，中间一桶喂两只</text>
  <g filter="url(#rough2)">
    <rect x="180" y="174" width="64" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="244" y="174" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="308" y="174" width="64" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="372" y="174" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="436" y="174" width="64" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="15" filter="url(#rough2)">
    <text x="212" y="199" fill="#888">.</text>
    <text x="276" y="199" fill="#b85450">H</text>
    <text x="340" y="199" fill="#d6a040" font-weight="bold">B</text>
    <text x="404" y="199" fill="#b85450">H</text>
    <text x="468" y="199" fill="#888">.</text>
  </g>
  <path d="M 332 222 Q 300 238 282 216" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 348 222 Q 380 238 398 216" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 情形 C: 无解 -->
  <text x="310" y="262" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">情形 C：".HHH." —— 中间仓鼠两侧都被占，无解 −1</text>
  <g filter="url(#rough2)">
    <rect x="180" y="278" width="64" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="244" y="278" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="308" y="278" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="372" y="278" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="436" y="278" width="64" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="15" filter="url(#rough2)">
    <text x="212" y="303" fill="#888">.</text>
    <text x="276" y="303" fill="#b85450">H</text>
    <text x="340" y="303" fill="#b85450" font-weight="bold">H</text>
    <text x="404" y="303" fill="#b85450">H</text>
    <text x="468" y="303" fill="#888">.</text>
  </g>
  <text x="340" y="342" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">左右邻居都是仓鼠 → 桶无处可放 → return −1</text>

  <!-- 决策 -->
  <rect x="120" y="356" width="380" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="377" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">扫描顺序保证：轮到仓鼠 i 时，i−1 是否有桶已知，右侧未定 → 优先右放</text>
</svg>
