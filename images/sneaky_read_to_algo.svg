<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="103" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">快速切入：题面特征 → 计数数组</text>
  <path d="M 180 42 Q 320 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 三个题面特征 -->
  <g filter="url(#sk)"><rect x="40" y="62" width="175" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="127" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 值域 0..n−1</text>
  <text x="127" y="103" text-anchor="middle" font-size="12" fill="#2b6e9e">连续、有界、已知</text>

  <g filter="url(#sk)"><rect x="235" y="62" width="170" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="320" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② len = n + 2</text>
  <text x="320" y="103" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">n = len(nums) − 2</text>

  <g filter="url(#sk)"><rect x="425" y="62" width="175" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="512" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">③ 恰好两个数字</text>
  <text x="512" y="103" text-anchor="middle" font-size="12" fill="#2b6e9e">各多出现一次（各两次）</text>

  <path d="M 127 116 L 127 148" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 116 L 320 148" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 512 116 L 512 148" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 核心观察 -->
  <g filter="url(#sk)"><rect x="90" y="152" width="460" height="54" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="320" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">核心观察：值域即下标 —— 计数数组 cnt[v]</text>
  <text x="320" y="196" text-anchor="middle" font-size="12" fill="#444">下标本身就是值：无需哈希函数、无冲突、无扩容</text>

  <path d="M 320 208 L 320 234" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 一遍扫描 -->
  <g filter="url(#sk)"><rect x="90" y="238" width="460" height="54" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">一遍扫描边数边收：++cnt[v] == 2 → 收进 ans</text>
  <text x="320" y="282" text-anchor="middle" font-size="12" fill="#444">普通数字计数封顶 1；计数到 2 的瞬间 = 捣蛋鬼第二次露面</text>

  <!-- 总结 -->
  <g filter="url(#sk)"><rect x="40" y="312" width="560" height="36" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">签到最短路径：反解 n → 开桶 → 边扫边收；时间 O(n)，空间 O(n)</text>
</svg>
