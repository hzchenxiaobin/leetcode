<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：每个源点两遍 Dijkstra，再逐点合并</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 建图 -->
  <g filter="url(#sk)"><rect x="150" y="52" width="340" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">建邻接表：无向边 (u,v) 两个方向各存一条</text>
  <text x="320" y="86" text-anchor="middle" font-size="10.5" fill="#555">每条有向边 = { 邻点, 空手权 cost, 携带权 cost×taxi }</text>
  <path d="M 320 92 L 320 104" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- 循环头 -->
  <g filter="url(#sk)"><rect x="196" y="108" width="248" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="320" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">for i = 0 … n−1（源点 = 商店 i）</text>
  <path d="M 320 144 L 320 156" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- Dijkstra 1 -->
  <g filter="url(#sk)"><rect x="150" y="160" width="340" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="179" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">Dijkstra ①：从 i 出发，边权 = cost</text>
  <text x="320" y="196" text-anchor="middle" font-size="10.5" fill="#555">得 de[j] = D₁(i,j)：空手到每家店的最短花费</text>
  <path d="M 320 204 L 320 216" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- Dijkstra 2 -->
  <g filter="url(#sk)"><rect x="150" y="220" width="340" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="239" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">Dijkstra ②：从 i 出发，边权 = cost×taxi</text>
  <text x="320" y="256" text-anchor="middle" font-size="10.5" fill="#555">得 dc[j] = D₂(i,j) = D₂(j,i)：携带返程花费</text>
  <path d="M 320 264 L 320 276" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- 合并 -->
  <g filter="url(#sk)"><rect x="128" y="280" width="384" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">ans[i] = min over j { de[j] + prices[j] + dc[j] }</text>
  <text x="320" y="319" text-anchor="middle" font-size="10.5" fill="#2e6e2e">j = i 时 de=dc=0，自动取到 prices[i]（就地购买）</text>
  <path d="M 320 328 L 320 340" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- 判断 -->
  <g filter="url(#sk)"><polygon points="320,344 408,374 320,404 232,374" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="379" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">还有源点 ?</text>
  <path d="M 408 374 L 512 374 L 512 126 L 448 126" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="478" y="366" text-anchor="middle" font-size="10.5" fill="#666">是（i++）</text>
  <path d="M 320 404 L 320 418" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="330" y="416" font-size="10.5" fill="#666">否</text>

  <!-- 返回 -->
  <g filter="url(#sk)"><rect x="230" y="422" width="180" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">return ans</text>

  <!-- 右侧批注 -->
  <g filter="url(#sk)"><rect x="470" y="160" width="162" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="551" y="180" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">边权恒 ≥ 1 &gt; 0</text>
  <text x="551" y="197" text-anchor="middle" font-size="10.5" fill="#7a5415">⇒ Dijkstra 适用</text>
  <text x="551" y="216" text-anchor="middle" font-size="10.5" fill="#7a5415">单遍 O((n+m) log n)</text>
  <text x="551" y="235" text-anchor="middle" font-size="10.5" fill="#7a5415">邻接表复用，只换权</text>
  <text x="551" y="254" text-anchor="middle" font-size="10.5" fill="#7a5415">不连通点距离 = INF</text>

  <g filter="url(#sk)"><rect x="470" y="278" width="162" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="551" y="297" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">中间距离 ~10¹⁴</text>
  <text x="551" y="314" text-anchor="middle" font-size="10.5" fill="#b85450">必须 64 位整数</text>
  <text x="551" y="333" text-anchor="middle" font-size="10.5" fill="#b85450">ans ≤ prices[i] ≤ 10⁹</text>

  <!-- 底部复杂度 -->
  <path d="M 80 486 Q 320 494 560 486" stroke="#c07820" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="320" y="512" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">总计 2n 遍 Dijkstra：O(n (n+m) log n)</text>
  <text x="320" y="532" text-anchor="middle" font-size="11" fill="#888">n ≤ 1000、m ≤ 2000 ⇒ 约 6×10⁷ 次堆操作，C++ 轻松通过；合并 O(n²) = 10⁶</text>
  <text x="320" y="550" text-anchor="middle" font-size="10.5" fill="#888">Python 建议用 scipy 的全源 Dijkstra（C 实现）替代手写 heapq 循环</text>
</svg>
