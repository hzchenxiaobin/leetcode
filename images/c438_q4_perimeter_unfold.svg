<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="680" height="340" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：从 (0,0) 剪开摊平 —— 边界点 → 周长坐标 t ∈ [0, 4s)</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M75,250 L245,250" stroke="#4a8edb" stroke-width="5" fill="none"/>
    <path d="M245,80 L245,250" stroke="#4a8e4a" stroke-width="5" fill="none"/>
    <path d="M75,80 L245,80" stroke="#c98a2b" stroke-width="5" fill="none"/>
    <path d="M75,80 L75,250" stroke="#b85450" stroke-width="5" fill="none"/>
  </g>
  <text x="75" y="268" text-anchor="middle" font-size="10" fill="#555">(0,0)→0</text>
  <text x="245" y="268" text-anchor="middle" font-size="10" fill="#555">(s,0)→s</text>
  <text x="245" y="70" text-anchor="middle" font-size="10" fill="#555">(s,s)→2s</text>
  <text x="75" y="70" text-anchor="middle" font-size="10" fill="#555">(0,s)→3s</text>
  <text x="132" y="238" text-anchor="middle" font-size="11" fill="#2b6e9e">底边 t = x</text>
  <text x="238" y="152" text-anchor="end" font-size="11" fill="#2e6e2e">右边</text>
  <text x="238" y="170" text-anchor="end" font-size="11" fill="#2e6e2e">t = s + y</text>
  <text x="152" y="102" text-anchor="middle" font-size="11" fill="#7a5415">顶边 t = 3s − x</text>
  <text x="82" y="152" text-anchor="start" font-size="11" fill="#b85450">左边</text>
  <text x="82" y="170" text-anchor="start" font-size="11" fill="#b85450">t = 4s − y</text>
  <g filter="url(#sk)">
    <circle cx="160" cy="250" r="5.5" fill="#b85450" stroke="#7a3030" stroke-width="1.5"/>
    <circle cx="185" cy="80" r="5.5" fill="#4a8edb" stroke="#2b4e6e" stroke-width="1.5"/>
  </g>
  <text x="160" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">P</text>
  <text x="185" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">Q</text>

  <path d="M278,165 L320,165" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="300" y="150" text-anchor="middle" font-size="11" fill="#555">剪开</text>
  <text x="300" y="186" text-anchor="middle" font-size="10" fill="#555">顺时针摊平</text>

  <g filter="url(#sk)">
    <path d="M340,165 L408,165" stroke="#4a8edb" stroke-width="6" fill="none"/>
    <path d="M408,165 L475,165" stroke="#4a8e4a" stroke-width="6" fill="none"/>
    <path d="M475,165 L543,165" stroke="#c98a2b" stroke-width="6" fill="none"/>
    <path d="M543,165 L610,165" stroke="#b85450" stroke-width="6" fill="none"/>
    <path d="M340,158 L340,172" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M408,158 L408,172" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M475,158 L475,172" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M543,158 L543,172" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M610,158 L610,172" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M610,158 Q475,112 344,156" stroke="#999" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#ay)"/>
    <circle cx="374" cy="165" r="5.5" fill="#b85450" stroke="#7a3030" stroke-width="1.5"/>
    <circle cx="499" cy="165" r="5.5" fill="#4a8edb" stroke="#2b4e6e" stroke-width="1.5"/>
  </g>
  <text x="475" y="120" text-anchor="middle" font-size="10" fill="#888">首尾相接成环（周长 4s）</text>
  <text x="340" y="186" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="408" y="186" text-anchor="middle" font-size="11" fill="#555">s</text>
  <text x="475" y="186" text-anchor="middle" font-size="11" fill="#555">2s</text>
  <text x="543" y="186" text-anchor="middle" font-size="11" fill="#555">3s</text>
  <text x="610" y="186" text-anchor="middle" font-size="11" fill="#555">4s</text>
  <text x="374" y="206" text-anchor="middle" font-size="10" fill="#2b6e9e">底边</text>
  <text x="441" y="206" text-anchor="middle" font-size="10" fill="#2e6e2e">右边</text>
  <text x="509" y="206" text-anchor="middle" font-size="10" fill="#7a5415">顶边</text>
  <text x="576" y="206" text-anchor="middle" font-size="10" fill="#b85450">左边</text>
  <text x="374" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">P</text>
  <text x="499" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">Q</text>

  <text x="340" y="252" text-anchor="middle" font-size="11" fill="#888">映射是双射：排序之后，「两两距离」的全部信息浓缩为环上间隙 —— 二维几何坍缩成一维环形问题</text>
  <text x="340" y="274" text-anchor="middle" font-size="10" fill="#888">同一个 t ⟺ 同一个边界点（角点唯一归属：按底 → 右 → 顶 → 左顺序判断，(0,0) 得 t = 0）</text>
  <text x="340" y="312" text-anchor="middle" font-size="10.5" fill="#888">P、Q 之间的「顺时针弧」= 周长坐标轴上的一段区间；逆时针弧 = 其补段</text>
</svg>
