<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：升序排序 + 单遍吞噬</text>

  <rect x="150" y="40" width="100" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="60" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 200 70 L 200 90" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="95" y="94" width="210" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">asteroids 升序排序</text>

  <path d="M 200 132 L 200 150" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="95" y="154" width="210" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="177" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">m = mass（long long）</text>

  <path d="M 200 192 L 200 212" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="200,214 282,254 200,294 118,254" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="252" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">i &lt; n ?</text>
  <text x="200" y="270" text-anchor="middle" font-size="10" fill="#a07820" filter="url(#rough2)">还有小行星吗</text>

  <text x="102" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 118 254 Q 60 254 60 148" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="25" y="100" width="70" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="119" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">return</text>
  <text x="60" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <text x="212" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">是</text>
  <path d="M 200 294 L 200 316" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="200,318 282,358 200,398 118,358" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="356" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">m ≥ a[i] ?</text>
  <text x="200" y="374" text-anchor="middle" font-size="10" fill="#a07820" filter="url(#rough2)">吞得下这颗吗</text>

  <text x="298" y="350" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">是</text>
  <path d="M 282 358 L 328 358" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="332" y="338" width="168" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="362" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">m += a[i]；i++</text>

  <path d="M 416 338 C 416 258, 330 212, 248 232" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="360" y="252" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">循环下一颗</text>

  <text x="212" y="414" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 200 398 L 200 418" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="125" y="422" width="150" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="447" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">return false</text>
</svg>
