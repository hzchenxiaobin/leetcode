<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="880" height="560" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把求和写成嵌套式：每个因子只出现一次</text>
  <path d="M 175 42 Q 440 48 705 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左列：五层嵌套 -->
  <rect x="50" y="60" width="392" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="90" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">最内层　W4 = (−1)⁴ = 1　（写成 n/n）</text>

  <path d="M 246 108 V 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="128" width="392" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="158" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">W3 = (n − 3)·W4 − 1</text>

  <path d="M 246 176 V 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="196" width="392" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="226" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">W2 = (n − 2)·W3 + 1</text>

  <path d="M 246 244 V 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="264" width="392" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="294" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">W1 = (n − 1)·W2 − 1</text>

  <path d="M 246 312 V 332" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="332" width="392" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="66" y="364" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">W0 = n·W1 + 1　⇒　G(n) = Σ (−1)j (n)j</text>

  <!-- 右侧注释 -->
  <rect x="470" y="60" width="372" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="84" font-size="12" fill="#8a6015" filter="url(#rough2)">第 i 层只多一个因子 (n − i)，</text>
  <text x="486" y="104" font-size="12" fill="#8a6015" filter="url(#rough2)">而 ±1 只是 “+n/n” 与 “−n/n” 的区别：</text>
  <text x="486" y="124" font-size="12" fill="#8a6015" filter="url(#rough2)">(−1)ⁱ 的符号在生成代码时就已确定，</text>
  <text x="486" y="144" font-size="12" fill="#8a6015" filter="url(#rough2)">不占任何额外字符。</text>

  <rect x="470" y="176" width="372" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="200" font-size="12" fill="#8a6015" filter="url(#rough2)">嵌套后整串只写一份：</text>
  <text x="486" y="220" font-size="12" fill="#8a6015" filter="url(#rough2)">长度 = Σ ( lit(i) 长度 + 常数 )，</text>
  <text x="486" y="240" font-size="12" fill="#8a6015" filter="url(#rough2)">即 O(K log K) 字符。若把每一层</text>
  <text x="486" y="260" font-size="12" fill="#8a6015" filter="url(#rough2)">平铺开写，会退化到 O(K²)。</text>

  <rect x="470" y="292" width="372" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="316" font-size="12" fill="#8f3a37" filter="url(#rough2)">最后再乘奇偶因子 M = (−1)ⁿ，</text>
  <text x="486" y="336" font-size="12" fill="#8f3a37" filter="url(#rough2)">M 只用两次 round 就能算出：</text>
  <text x="486" y="356" font-size="12" fill="#8f3a37" filter="url(#rough2)">M = 1 − 2·(round(n/2) − round((n−1)/2))</text>
  <text x="486" y="374" font-size="12" fill="#8f3a37" filter="url(#rough2)">这一步只花约 60 个字符。</text>

  <path d="M 246 384 V 404" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 底部：常量池 -->
  <rect x="50" y="404" width="792" height="132" rx="10" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="428" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">常量池 lit[c]：语言里没有数字，只有 n/n = 1，于是整数要靠 + 与 * 拼</text>

  <rect x="68" y="440" width="756" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="458" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">c</text>
  <text x="420" y="458" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">最短表达式 lit[c]</text>
  <text x="740" y="458" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">长度</text>

  <text x="140" y="486" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="420" y="486" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">n/n</text>
  <text x="740" y="486" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>

  <text x="140" y="506" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="420" y="506" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(n/n+n/n)</text>
  <text x="740" y="506" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>

  <text x="140" y="524" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">50</text>
  <text x="420" y="524" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">((n/n+n/n)*(n/n+((n/n+n/n)*((n/n+n/n)*((n/n+n/n)*(n/n+(n/n+n/n)))))))</text>
  <text x="740" y="524" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">69</text>
</svg>
