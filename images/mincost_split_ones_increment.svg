<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="329" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">固定右端 i，左端 j 左移：三分支 O(1) 维护孤值数 ones</text>
  <path d="M 110 36 Q 320 44 530 36" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">窗口 [j..i−1] 每步只在左边多进一个元素 nums[j]，其旧频次 c → c+1</text>

  <!-- array strip: example 1, i = 7, j = 2 -->
  <g filter="url(#sk)">
    <rect x="114" y="76" width="52" height="40" rx="5" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
    <rect x="174" y="76" width="52" height="40" rx="5" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
    <rect x="234" y="76" width="52" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="294" y="76" width="52" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="354" y="76" width="52" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="414" y="76" width="52" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="474" y="76" width="52" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="140" y="101">1</text><text x="200" y="101">2</text><text x="260" y="101">1</text>
    <text x="320" y="101">2</text><text x="380" y="101">1</text><text x="440" y="101">3</text><text x="500" y="101">3</text>
  </g>
  <text x="260" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#sk)">j</text>
  <g filter="url(#sk)" stroke="#d6a040" stroke-width="1.8" fill="none">
    <path d="M 252 64 L 200 64" marker-end="url(#arO)"/>
  </g>
  <text x="176" y="68" text-anchor="end" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#sk)">j 每步 −1</text>
  <text x="532" y="68" font-size="11" fill="#7a7a7a" filter="url(#sk)">i = 7（右端固定）</text>
  <text x="186" y="134" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#sk)">前缀：dp[j] 已定型</text>
  <g filter="url(#sk)" stroke="#4a8edb" stroke-width="1.4" fill="none">
    <path d="M 236 128 L 524 128"/>
    <path d="M 236 128 L 236 122"/>
    <path d="M 524 128 L 524 122"/>
  </g>
  <text x="380" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">窗口 = 最后一段 nums[j..i−1]，随时可用 (i−j) − ones 报价</text>

  <!-- transfer formula -->
  <g filter="url(#sk)">
    <rect x="70" y="160" width="500" height="44" rx="10" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">dp[i] = min(dp[j] + k + (i − j) − ones)，j = i−1 … 0</text>

  <!-- arrows to branches -->
  <g filter="url(#sk)" stroke="#7a7a7a" stroke-width="1.3" fill="none">
    <path d="M 136 204 L 136 216" marker-end="url(#ar)"/>
    <path d="M 320 204 L 320 216" marker-end="url(#ar)"/>
    <path d="M 504 204 L 504 216" marker-end="url(#ar)"/>
  </g>

  <!-- three branches -->
  <g filter="url(#sk)">
    <rect x="56" y="220" width="160" height="88" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="240" y="220" width="160" height="88" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="424" y="220" width="160" height="88" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="136" y="243" fill="#446688">旧频次 c = 0</text>
    <text x="320" y="243" fill="#4a8e4a">旧频次 c = 1</text>
    <text x="504" y="243" fill="#d6a040">旧频次 c ≥ 2</text>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="136" y="270">ones += 1</text>
    <text x="320" y="270">ones -= 1</text>
    <text x="504" y="270">ones 不变</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#555" filter="url(#sk)">
    <text x="136" y="292">v 成为新孤值</text>
    <text x="320" y="292">v 从孤值毕业</text>
    <text x="504" y="292">v 早已计入</text>
    <text x="136" y="304">trimmed 不变</text>
    <text x="320" y="304">两份补进 trimmed</text>
    <text x="504" y="304">trimmed 多 1 份</text>
  </g>

  <!-- flow strip -->
  <text x="320" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程（外层 i = 1..n，每轮）</text>
  <g filter="url(#sk)">
    <rect x="17" y="356" width="120" height="62" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="159" y="356" width="120" height="62" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="301" y="356" width="150" height="62" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="473" y="356" width="150" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="77" y="380" font-weight="bold">① 每轮重置</text>
    <text x="77" y="400" fill="#555">freq 清零，ones = 0</text>
    <text x="219" y="380" font-weight="bold">② j 从 i−1 → 0</text>
    <text x="219" y="400" fill="#555">窗口向左扩张一格</text>
    <text x="376" y="380" font-weight="bold">③ 三分支更新 ones</text>
    <text x="376" y="400" fill="#555">只看 nums[j] 的旧频次 c</text>
    <text x="548" y="380" font-weight="bold">④ 松弛 dp[i]</text>
    <text x="548" y="400" fill="#555">dp[j]+k+(i−j)−ones</text>
  </g>
  <g filter="url(#sk)" stroke="#7a7a7a" stroke-width="1.3" fill="none">
    <path d="M 139 387 L 155 387" marker-end="url(#ar)"/>
    <path d="M 281 387 L 297 387" marker-end="url(#ar)"/>
    <path d="M 453 387 L 469 387" marker-end="url(#ar)"/>
  </g>
  <text x="320" y="444" text-anchor="middle" font-size="11" fill="#7a7a7a" font-style="italic" filter="url(#sk)">时间 O(n²)：每步一次数组访问 + 常数分支；空间 O(n)</text>
</svg>
