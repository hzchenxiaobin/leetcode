<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟判定 + 一个阶乘累乘</text>

  <!-- 左列：主流程 -->
  <rect x="40" y="44" width="216" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="148" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">输入 complexity[0..n−1]</text>

  <path d="M 148 74 L 148 90" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="94" width="192" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="148" y="114" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">扫描 i = 1 … n−1：</text>
  <text x="148" y="134" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">存在 c[i] ≤ c[0] ？</text>

  <path d="M 100 146 Q 88 158 82 172" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 196 146 Q 208 158 214 172" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="162" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="214" y="162" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="40" y="176" width="98" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="89" y="197" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 0</text>

  <rect x="158" y="176" width="98" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="207" y="195" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans = 1×2×…×(n−1)</text>
  <text x="207" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每步 mod 1e9+7</text>

  <path d="M 207 220 L 207 238" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="158" y="242" width="98" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="207" y="263" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 左下：判定等价形式 -->
  <rect x="40" y="296" width="216" height="86" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="52" y="316" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定的三种等价说法</text>
  <text x="52" y="334" font-size="10" fill="#333" filter="url(#rough2)">① c[0] &lt; min(c[1..n−1])</text>
  <text x="52" y="352" font-size="10" fill="#333" filter="url(#rough2)">② c[0] 是全局最小且只出现一次</text>
  <text x="52" y="370" font-size="10" fill="#333" filter="url(#rough2)">③ 不存在 i ≥ 1 使 c[i] ≤ c[0]（含并列）</text>

  <!-- 右列：两个细节面板 -->
  <rect x="288" y="60" width="244" height="150" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="410" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么排列首位必须是 0？</text>

  <rect x="300" y="96" width="220" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="116" font-size="10.5" fill="#333" filter="url(#rough2)">排列 = 各台机器「依次变为已解锁」</text>
  <text x="310" y="133" font-size="10.5" fill="#333" filter="url(#rough2)">的时间线；0 号机在一切动作之前</text>
  <text x="310" y="150" font-size="10.5" fill="#333" filter="url(#rough2)">就被根密码解锁 ⇒ 必居首位。</text>
  <text x="310" y="170" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 初始解锁的是编号 0 那台机器，</text>
  <text x="310" y="187" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">不是「排在首位的机器」！</text>

  <rect x="288" y="232" width="244" height="150" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="410" y="256" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">实现细节备忘</text>

  <rect x="300" y="268" width="220" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="288" font-size="10.5" fill="#333" filter="url(#rough2)">· 判定循环从 i = 1 开始，别拿</text>
  <text x="310" y="305" font-size="10.5" fill="#333" filter="url(#rough2)">  c[0] 跟自己比较；</text>
  <text x="310" y="322" font-size="10.5" fill="#333" filter="url(#rough2)">· 阶乘必须边乘边取模，n = 1e5</text>
  <text x="310" y="339" font-size="10.5" fill="#333" filter="url(#rough2)">  时结果是天文数字；</text>
  <text x="310" y="356" font-size="10.5" fill="#333" filter="url(#rough2)">· C++ 用 long long 中转乘法即可，</text>
  <text x="310" y="372" font-size="10.5" fill="#333" filter="url(#rough2)">  只乘不除，无需乘法逆元。</text>

  <path d="M 256 120 L 284 130" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 256 330 L 284 320" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
