<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：n=20 的关键 dp 值（示例 2）</text>

  <!-- 位置轴 -->
  <line x1="60" y1="90" x2="500" y2="90" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="80" y="112">1</text><text x="170" y="112">6</text><text x="280" y="112">10</text>
    <text x="360" y="112">12</text><text x="440" y="112">18</text>
  </g>
  <g filter="url(#rough2)">
    <circle cx="80" cy="90" r="5" fill="#446688"/>
    <circle cx="170" cy="90" r="6" fill="#b85450"/>
    <circle cx="280" cy="90" r="6" fill="#b85450"/>
    <circle cx="360" cy="90" r="6" fill="#b85450"/>
    <circle cx="440" cy="90" r="6" fill="#b85450"/>
  </g>

  <!-- 订单弧 -->
  <path d="M 80 66 C 110 40, 140 40, 170 66" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="125" y="40" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">[1,6,1] 盈 6</text>
  <path d="M 170 62 C 220 24, 260 24, 280 60" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="225" y="22" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">[3,10,2] 盈 9</text>
  <path d="M 280 66 C 320 40, 345 40, 360 66" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="40" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">[10,12,3] 盈 5</text>
  <path d="M 360 66 C 400 30, 425 30, 440 62" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="28" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">[13,18,1] 盈 6</text>

  <!-- dp 表 -->
  <g filter="url(#rough2)">
    <rect x="60" y="140" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="148" y="140" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="236" y="140" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="324" y="140" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="412" y="140" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <text x="104" y="161">dp[6]=6</text>
    <text x="192" y="161">dp[10]=9</text>
    <text x="280" y="161">dp[12]=14</text>
    <text x="368" y="161">dp[15]=19</text>
    <text x="456" y="161">dp[18]=20</text>
  </g>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（其余位置继承前值）</text>

  <!-- 链式衔接箭头 -->
  <path d="M 192 176 C 230 210, 270 210, 280 178" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="226" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">9 + 5 = 14（[3,10] 接 [10,12]）</text>
  <path d="M 280 176 C 320 208, 356 208, 368 178" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="222" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">14 + 5 = 19（再接 [12,15]）</text>
  <path d="M 280 60 C 300 240, 420 240, 440 178" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="252" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">dp[13]+6 = 14+6 = 20（[3,10][10,12] 后接 [13,18]）✓ 最优</text>

  <!-- 结论 -->
  <rect x="60" y="290" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="14" fill="#2d5a22" filter="url(#rough2)">最优链：[3,10,2] + [10,12,3] + [13,18,1]</text>
  <text x="280" y="336" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">9 + 5 + 6 = 20 = dp[20]</text>

  <text x="280" y="374" text-anchor="middle" font-size="12.5" fill="#7a2e2a" filter="url(#rough2)">⚠ 端点相接（10 与 10、12 与 13 链）是本题最易算错处，写完务必回代示例</text>
</svg>
