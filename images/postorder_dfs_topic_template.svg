<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">后序 DFS 通用模板：五步骨架</text>

  <!-- code block -->
  <rect x="24" y="48" width="330" height="368" fill="#2d2d2d" rx="8" filter="url(#rough2)"/>
  <g font-size="12" font-family="Consolas, 'Courier New', monospace">
    <text x="40" y="78" fill="#c678dd">def</text>
    <text x="62" y="78" fill="#e5c07b">dfs</text>
    <text x="90" y="78" fill="#abb2bf">(node) -&gt; 上传信息:</text>
    <text x="56" y="102" fill="#c678dd">if</text>
    <text x="76" y="102" fill="#e06c75"> node </text>
    <text x="128" y="102" fill="#56b6c2">is</text>
    <text x="148" y="102" fill="#56b6c2"> None</text>
    <text x="196" y="102" fill="#d19a66">:</text>
    <text x="56" y="122" fill="#98c379">return 空树单位元   # ①</text>
    <text x="56" y="150" fill="#e5c07b">left</text>
    <text x="94" y="150" fill="#56b6c2"> = </text>
    <text x="112" y="150" fill="#61afef">dfs</text>
    <text x="134" y="150" fill="#abb2bf">(node.left)</text>
    <text x="248" y="150" fill="#5c6370"># ② 左子树信息</text>
    <text x="56" y="170" fill="#e5c07b">right</text>
    <text x="104" y="170" fill="#56b6c2"> = </text>
    <text x="122" y="170" fill="#61afef">dfs</text>
    <text x="144" y="170" fill="#abb2bf">(node.right)</text>
    <text x="254" y="170" fill="#5c6370"># ③ 右子树信息</text>
    <text x="56" y="198" fill="#e5c07b">cur</text>
    <text x="82" y="198" fill="#56b6c2"> = </text>
    <text x="100" y="198" fill="#61afef">combine</text>
    <text x="152" y="198" fill="#abb2bf">(left, right, node.val)</text>
    <text x="56" y="226" fill="#e5c07b">ans</text>
    <text x="84" y="226" fill="#56b6c2"> = </text>
    <text x="102" y="226" fill="#61afef">max</text>
    <text x="124" y="226" fill="#abb2bf">(ans, 拼出的候选)</text>
    <text x="254" y="226" fill="#5c6370"># ④ 全局擂台</text>
    <text x="56" y="254" fill="#c678dd">return</text>
    <text x="112" y="254" fill="#98c379">父节点需要的信息</text>
    <text x="254" y="254" fill="#5c6370"># ⑤ 上传</text>
  </g>
  <text x="40" y="300" fill="#5c6370" font-size="11" font-family="'Comic Sans MS', 'Kaiti SC', 楷体, cursive">⚠ ⑤ 上传的常常不是 ③ 的 cur 本身！</text>
  <text x="40" y="322" fill="#5c6370" font-size="11" font-family="'Comic Sans MS', 'Kaiti SC', 楷体, cursive">  543：cur = l+r（拐弯），上传 max(l,r)+1（单边）</text>
  <text x="40" y="344" fill="#5c6370" font-size="11" font-family="'Comic Sans MS', 'Kaiti SC', 楷体, cursive">  337：上传 (偷cur, 不偷cur) 状态元组</text>
  <text x="40" y="366" fill="#5c6370" font-size="11" font-family="'Comic Sans MS', 'Kaiti SC', 楷体, cursive">  333：上传 (min, max, size) 三元组</text>
  <text x="40" y="398" fill="#e06c75" font-size="11" font-family="'Comic Sans MS', 'Kaiti SC', 楷体, cursive">返回值 = 子树向父节点上传的信息</text>

  <!-- right side: the three questions -->
  <text x="392" y="66" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">写代码前先回答三问:</text>

  <rect x="384" y="82" width="232" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 父节点需要我什么？</text>
  <text x="500" y="122" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">→ 决定返回值（上传什么）</text>

  <path d="M 500 134 L 500 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="384" y="148" width="232" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 我需要孩子什么？</text>
  <text x="500" y="188" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">→ 决定子问题要算什么</text>

  <path d="M 500 200 L 500 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="384" y="214" width="232" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 题目答案在哪收集？</text>
  <text x="500" y="254" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">→ 返回值 or 全局变量打擂台</text>

  <!-- base case examples -->
  <rect x="384" y="282" width="232" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="500" y="304" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">空树单位元速查</text>
  <g font-size="11" fill="#555">
    <text x="396" y="326" filter="url(#rough2)">• 高度 / 最长链 → 0</text>
    <text x="396" y="346" filter="url(#rough2)">• 子树和 → 0</text>
    <text x="396" y="366" filter="url(#rough2)">• (min, max) → (+∞, −∞)</text>
    <text x="396" y="386" filter="url(#rough2)">• 是否找到 p/q → False</text>
  </g>
</svg>
