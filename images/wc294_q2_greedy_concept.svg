<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：装满的成本 = 缺口，等收益下先买最便宜的</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 原始背包（示例 1 数据） -->
  <g filter="url(#sk)"><rect x="32" y="52" width="120" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="92" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#33455e">背包 0</text>
  <text x="92" y="92" text-anchor="middle" font-size="10.5" fill="#666">容量 2 · 已装 1</text>

  <g filter="url(#sk)"><rect x="188" y="52" width="120" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="248" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#33455e">背包 1</text>
  <text x="248" y="92" text-anchor="middle" font-size="10.5" fill="#666">容量 3 · 已装 2</text>

  <g filter="url(#sk)"><rect x="344" y="52" width="120" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="404" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#33455e">背包 2</text>
  <text x="404" y="92" text-anchor="middle" font-size="10.5" fill="#666">容量 4 · 已装 4</text>

  <g filter="url(#sk)"><rect x="500" y="52" width="120" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="560" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#33455e">背包 3</text>
  <text x="560" y="92" text-anchor="middle" font-size="10.5" fill="#666">容量 5 · 已装 4</text>

  <!-- 缺口 chips -->
  <g filter="url(#sk)"><rect x="52" y="112" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="92" y="129" text-anchor="middle" font-size="12" font-family="monospace" fill="#7a5415">need = 1</text>
  <g filter="url(#sk)"><rect x="208" y="112" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="248" y="129" text-anchor="middle" font-size="12" font-family="monospace" fill="#7a5415">need = 1</text>
  <g filter="url(#sk)"><rect x="364" y="112" width="80" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="404" y="129" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e5e2e">need = 0</text>
  <text x="452" y="129" font-size="10.5" fill="#2e5e2e">缺口 0 ⇒ 已满！</text>
  <g filter="url(#sk)"><rect x="520" y="112" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="560" y="129" text-anchor="middle" font-size="12" font-family="monospace" fill="#7a5415">need = 1</text>

  <!-- 排序箭头 -->
  <path d="M 320 142 V 168" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="334" y="160" font-size="11.5" fill="#555">按缺口升序排序</text>

  <!-- 排序后的贪心扫描 -->
  <g filter="url(#sk)"><rect x="48" y="176" width="104" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="100" y="194" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2e5e2e">0</text>
  <g filter="url(#sk)"><rect x="182" y="176" width="104" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="234" y="194" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#33455e">1</text>
  <g filter="url(#sk)"><rect x="316" y="176" width="104" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="368" y="194" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#33455e">1</text>
  <g filter="url(#sk)"><rect x="450" y="176" width="104" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3"/></g>
  <text x="502" y="194" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#a04040">1</text>

  <path d="M 100 204 V 218" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 234 204 V 218" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 368 204 V 218" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 502 204 V 218" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#sk)"/>

  <text x="100" y="236" text-anchor="middle" font-size="11" font-family="monospace" fill="#2e5e2e">花 0 · 剩 2 · ans 1</text>
  <text x="234" y="236" text-anchor="middle" font-size="11" font-family="monospace" fill="#2e5e2e">花 1 · 剩 1 · ans 2</text>
  <text x="368" y="236" text-anchor="middle" font-size="11" font-family="monospace" fill="#2e5e2e">花 1 · 剩 0 · ans 3</text>
  <text x="502" y="236" text-anchor="middle" font-size="11" font-family="monospace" fill="#a04040">0 ＜ 1 · 停！</text>

  <!-- 反例警示 -->
  <g filter="url(#sk)"><rect x="36" y="254" width="568" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">⚠ 不排序「能补就补」会 WA：capacity = [3,2,2]，rocks = [0,0,0]，R = 4</text>
  <text x="320" y="300" text-anchor="middle" font-size="11.5" fill="#7a5415">原序：先花 3 补大缺口 → 剩 1，只满 1 个；升序：先花 2 + 2 → 满 2 个（正确答案）</text>

  <text x="320" y="350" text-anchor="middle" font-size="12.5" fill="#2b2b2b">每装满一个背包收益都是 +1（等收益），预算有限 ⇒ 按成本（缺口）升序购买</text>
  <text x="320" y="374" text-anchor="middle" font-size="12.5" fill="#2b2b2b">升序保证：一旦当前缺口补不起，后面只会更大 ⇒ 可直接 break</text>
  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#888">一句话：ans = 升序缺口的前缀中，累计花费 ≤ additionalRocks 的最多个数</text>
</svg>
