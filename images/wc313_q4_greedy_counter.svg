<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">为什么不能贪心：两个方向都有反例</text>
  <path d="M 190 44 Q 380 52 570 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- ===== 左面板：s = aaaa ===== -->
  <g filter="url(#sk2)">
    <rect x="20" y="62" width="360" height="336" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="200" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk2)">s = "aaaa"：贪「每步删最长」✗</text>

  <!-- 列 A：贪最长 -->
  <text x="100" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk2)">每步删最长</text>
  <g filter="url(#sk)">
    <rect x="56" y="116" width="22" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="78" y="116" width="22" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="100" y="116" width="22" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="122" y="116" width="22" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b4466" filter="url(#sk2)">
    <text x="67" y="133">a</text><text x="89" y="133">a</text><text x="111" y="133">a</text><text x="133" y="133">a</text>
  </g>
  <path d="M 100 146 L 100 162" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="112" y="158" font-size="11.5" fill="#b85450" filter="url(#sk2)">j=2</text>
  <g filter="url(#sk)">
    <rect x="79" y="168" width="22" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="101" y="168" width="22" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#6b4e12" filter="url(#sk2)">
    <text x="90" y="185">a</text><text x="112" y="185">a</text>
  </g>
  <path d="M 100 198 L 100 214" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="112" y="210" font-size="11.5" fill="#b85450" filter="url(#sk2)">j=1</text>
  <g filter="url(#sk)">
    <rect x="90" y="220" width="22" height="24" rx="3" fill="#ffffff" stroke="#aaa" stroke-width="1.3"/>
  </g>
  <text x="101" y="237" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk2)">a</text>
  <path d="M 100 250 L 100 266" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="112" y="262" font-size="11.5" fill="#b85450" filter="url(#sk2)">整删</text>
  <text x="101" y="290" text-anchor="middle" font-size="16" font-weight="bold" fill="#555" filter="url(#sk2)">∅</text>
  <text x="100" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk2)">3 步 ✗</text>

  <!-- 列 B：每步删 1 个 -->
  <text x="280" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">每步只删 1 个</text>
  <g filter="url(#sk)">
    <rect x="236" y="116" width="22" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="258" y="116" width="22" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="280" y="116" width="22" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="302" y="116" width="22" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2f4f2f" filter="url(#sk2)">
    <text x="247" y="133">a</text><text x="269" y="133">a</text><text x="291" y="133">a</text><text x="313" y="133">a</text>
  </g>
  <path d="M 280 146 L 280 160" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#sk2)"/>
  <g filter="url(#sk)">
    <rect x="247" y="166" width="22" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="269" y="166" width="22" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="291" y="166" width="22" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2f4f2f" filter="url(#sk2)">
    <text x="258" y="183">a</text><text x="280" y="183">a</text><text x="302" y="183">a</text>
  </g>
  <path d="M 280 196 L 280 210" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#sk2)"/>
  <g filter="url(#sk)">
    <rect x="258" y="216" width="22" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="280" y="216" width="22" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2f4f2f" filter="url(#sk2)">
    <text x="269" y="233">a</text><text x="291" y="233">a</text>
  </g>
  <path d="M 280 246 L 280 260" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#sk2)"/>
  <g filter="url(#sk)">
    <rect x="270" y="266" width="22" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="281" y="283" text-anchor="middle" font-size="13" fill="#2f4f2f" filter="url(#sk2)">a</text>
  <path d="M 280 296 L 280 310" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="292" y="308" font-size="11.5" fill="#b85450" filter="url(#sk2)">整删</text>
  <text x="281" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">4 步 ✓</text>
  <text x="200" y="376" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk2)">删得多 ≠ 步数多：小步走完反而更多</text>

  <!-- ===== 右面板：s = aaabaab, l = 1 ===== -->
  <g filter="url(#sk2)">
    <rect x="396" y="62" width="344" height="336" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="568" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk2)">s = "aaabaab" 在 l = 1 处：贪「删最短」✗</text>
  <text x="568" y="102" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk2)">后缀 s[1:] = aabaab，两种合法删除</text>

  <!-- 行 A：删 1 个 -->
  <text x="410" y="132" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk2)">删 1 个</text>
  <g filter="url(#sk)">
    <rect x="470" y="116" width="22" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="492" y="116" width="22" height="24" rx="3" fill="#ffffff" stroke="#aaa" stroke-width="1.3"/>
    <rect x="514" y="116" width="22" height="24" rx="3" fill="#ffffff" stroke="#aaa" stroke-width="1.3"/>
    <rect x="536" y="116" width="22" height="24" rx="3" fill="#ffffff" stroke="#aaa" stroke-width="1.3"/>
    <rect x="558" y="116" width="22" height="24" rx="3" fill="#ffffff" stroke="#aaa" stroke-width="1.3"/>
    <rect x="580" y="116" width="22" height="24" rx="3" fill="#ffffff" stroke="#aaa" stroke-width="1.3"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#sk2)">
    <text x="481" y="133" fill="#8a3a36">a</text>
    <text x="503" y="133" fill="#555">a</text><text x="525" y="133" fill="#555">b</text>
    <text x="547" y="133" fill="#555">a</text><text x="569" y="133" fill="#555">a</text><text x="591" y="133" fill="#555">b</text>
  </g>
  <path d="M 481 146 L 481 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="470" y="180" font-size="12" fill="#333" filter="url(#sk2)">剩 s[2:] = abaab，1 + dp[2] = 2</text>
  <text x="646" y="180" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk2)">✗</text>

  <!-- 行 B：删 3 个 -->
  <text x="410" y="222" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">删 3 个</text>
  <g filter="url(#sk)">
    <rect x="470" y="206" width="22" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="492" y="206" width="22" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="514" y="206" width="22" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="536" y="206" width="22" height="24" rx="3" fill="#ffffff" stroke="#aaa" stroke-width="1.3"/>
    <rect x="558" y="206" width="22" height="24" rx="3" fill="#ffffff" stroke="#aaa" stroke-width="1.3"/>
    <rect x="580" y="206" width="22" height="24" rx="3" fill="#ffffff" stroke="#aaa" stroke-width="1.3"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#sk2)">
    <text x="481" y="223" fill="#2b4466">a</text><text x="503" y="223" fill="#2b4466">a</text><text x="525" y="223" fill="#2b4466">b</text>
    <text x="547" y="223" fill="#555">a</text><text x="569" y="223" fill="#555">a</text><text x="591" y="223" fill="#555">b</text>
  </g>
  <text x="500" y="252" font-size="11" fill="#446688" filter="url(#sk2)">aab = aab ✓</text>
  <text x="470" y="274" font-size="12" fill="#333" filter="url(#sk2)">剩 s[4:] = aab，1 + dp[4] = 3</text>
  <text x="646" y="274" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">✓</text>

  <g filter="url(#sk)">
    <rect x="410" y="296" width="316" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="420" y="318" font-size="12" fill="#7a5415" filter="url(#sk2)">删得远，可能恰好跳到「更耐删」的</text>
  <text x="420" y="338" font-size="12" fill="#7a5415" filter="url(#sk2)">后缀——步数与删掉的字符数无关，</text>
  <text x="420" y="358" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk2)">只能枚举所有合法 j 取 max</text>
</svg>
