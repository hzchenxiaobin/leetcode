<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "abcac" 逐边界的断点与桶乘积</text>
  <text x="340" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">左列断点 = 各字符 last（降序）；右列断点 = 起点 j+1 起各字符 first（升序）</text>

  <!-- 字符行 -->
  <rect x="224" y="58" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="268" y="58" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="312" y="58" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="334" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="356" y="58" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="400" y="58" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="246" y="102" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">0</text>
  <text x="290" y="102" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">1</text>
  <text x="334" y="102" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">2</text>
  <text x="378" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="422" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <!-- 表格 -->
  <rect x="45" y="112" width="620" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="131" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">边界 j</text>
  <text x="165" y="131" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">断点 L（降序）</text>
  <text x="282" y="131" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">左桶 L_j</text>
  <text x="400" y="131" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">断点 N（升序）</text>
  <text x="517" y="131" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">右桶 R_(j+1)</text>
  <text x="612" y="131" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">贡献</text>

  <path d="M45,142 L665,142" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行 1: j=0 -->
  <rect x="45" y="142" width="620" height="44" fill="#ffffff" filter="url(#rough2)"/>
  <path d="M45,186 L665,186" stroke="#e0d8c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="165" y="168" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0 (a)</text>
  <text x="282" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1: 1}</text>
  <text x="400" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 (b), 2 (c)</text>
  <text x="517" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 1}</text>
  <text x="612" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1×1 = 1</text>

  <!-- 行 2: j=1 -->
  <rect x="45" y="186" width="620" height="44" fill="#fdf9f0" filter="url(#rough2)"/>
  <path d="M45,230 L665,230" stroke="#e0d8c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="212" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1 (b), 0 (a)</text>
  <text x="282" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 1}</text>
  <text x="400" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2 (c), 3 (a)</text>
  <text x="517" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 2}</text>
  <text x="612" y="212" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1+2 = 3</text>

  <!-- 行 3: j=2 -->
  <rect x="45" y="230" width="620" height="44" fill="#ffffff" filter="url(#rough2)"/>
  <path d="M45,274 L665,274" stroke="#e0d8c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="165" y="256" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2 (c), 1 (b), 0 (a)</text>
  <text x="282" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 1, 3: 1}</text>
  <text x="400" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 (a), 4 (c)</text>
  <text x="517" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 1}</text>
  <text x="612" y="256" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1+1 = 2</text>

  <!-- 行 4: j=3 -->
  <rect x="45" y="274" width="620" height="44" fill="#fdf9f0" filter="url(#rough2)"/>
  <text x="75" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="165" y="300" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3 (a), 2 (c), 1 (b)</text>
  <text x="282" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 1, 3: 2}</text>
  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4 (c)</text>
  <text x="517" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1: 1}</text>
  <text x="612" y="300" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1×1 = 1</text>

  <!-- 表格外框 -->
  <rect x="45" y="112" width="620" height="206" rx="4" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 合计框 -->
  <rect x="45" y="336" width="620" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="362" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">合计 = 1 + 3 + 2 + 1 = 7，与示例 3 的 7 个三元组一一对应</text>

  <!-- 底部注释 -->
  <text x="340" y="406" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=1 行：b 在起点 2 之后不再出现 → 右侧断点只有 2 个，断点数 = 当前窗口字符种数</text>
  <text x="340" y="428" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=3 行：最左段长 = 1−(−1) = 2（哨兵 −1），对应 "abca"、"bca" 两个含 3 种字符的子串</text>
  <text x="340" y="450" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每行两侧断点各 ≤ 26 个，整张表从 O(n²) 的桶表压缩成 O(26n) 的差分序列</text>
</svg>
