<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="450" fill="#fafafa" filter="url(#rough2)"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">贪心流程：三种覆盖情况，一次扫描</text>

  <rect x="120" y="44" width="360" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">① 排序：e 升序；e 相同时 s 降序</text>

  <path d="M 300 74 V 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="96" width="300" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="115" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">② a ← −1，b ← −1，ans ← 0</text>

  <path d="M 300 124 V 144" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="146" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="165" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">③ 取下一个区间 [s, e]</text>

  <path d="M 300 174 V 186 H 115 V 198" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 174 V 198" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 174 V 186 H 485 V 198" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="200" width="170" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="115" y="223" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">情况 1：s ≤ a</text>
  <text x="115" y="245" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">a、b 都在区间内</text>
  <text x="115" y="264" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">→ 跳过，不新增</text>

  <rect x="215" y="200" width="170" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="223" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">情况 2：s ≤ b</text>
  <text x="300" y="245" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">只有 b 在区间内</text>
  <text x="300" y="264" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">→ a←b；b←e</text>
  <text x="300" y="280" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ans += 1</text>

  <rect x="400" y="200" width="170" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="485" y="223" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">情况 3：s &gt; b</text>
  <text x="485" y="245" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">两点都不在区间内</text>
  <text x="485" y="264" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">→ a←e−1；b←e</text>
  <text x="485" y="280" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ans += 2</text>

  <path d="M 115 286 V 300 H 485 V 286" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 300 300 V 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,314 420,346 300,378 180,346" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="351" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">还有区间？</text>

  <path d="M 180 346 H 70 V 160 H 174" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="338" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 300 378 V 398" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="392" font-size="10" fill="#777" filter="url(#rough2)">否</text>

  <rect x="200" y="400" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="420" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 ans（需要的最少点数）</text>
</svg>
