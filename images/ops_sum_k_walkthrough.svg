<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">k = 11：枚举 v ∈ [1, 4]，答案 5</text>

  <rect x="40" y="52" width="440" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">v</text>
  <text x="190" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">m = ⌈11/v⌉</text>
  <text x="295" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">操作数</text>
  <text x="415" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">终局数组（和）</text>

  <rect x="40" y="84" width="440" height="38" fill="#ffffff" stroke="#b0b0b0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="108" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="190" y="108" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">11</text>
  <text x="295" y="108" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">10</text>
  <text x="415" y="108" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">[1,…,1]（和 11）</text>

  <rect x="40" y="124" width="440" height="38" fill="#ffffff" stroke="#b0b0b0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="148" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="190" y="148" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">6</text>
  <text x="295" y="148" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">6</text>
  <text x="415" y="148" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">[2,2,2,2,2,2]（和 12）</text>

  <rect x="40" y="164" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="190" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="295" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">5 ★</text>
  <text x="415" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">[3,3,3,3]（和 12）</text>

  <rect x="40" y="208" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="190" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="295" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">5 ★</text>
  <text x="415" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">[4,4,4]（和 12，示例 1）</text>

  <rect x="40" y="252" width="440" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="275" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="190" y="275" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="295" y="275" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="415" y="275" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">v 超上界，镜像后不劣</text>

  <rect x="40" y="300" width="440" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案 = 5：v = 3 与 v = 4 并列取到</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">v ≈ √k 时加法成本与复制成本达到平衡</text>
</svg>
