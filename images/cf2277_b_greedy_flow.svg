<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次扫描的判定流程</text>
  <path d="M 245 42 Q 360 50 480 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="62" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">答案只可能是 n 或 0</text>

  <rect x="250" y="78" width="220" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="106" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n 与数组 a</text>

  <path d="M 360 124 L 360 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="250" y="152" width="220" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="180" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">M = min(a)，边读边取</text>

  <path d="M 360 198 L 360 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,224 474,268 360,312 246,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="273" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">n ≥ M + 1 ?</text>

  <path d="M 246 268 L 156 268" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="245" width="104" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="102" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 n</text>

  <path d="M 474 268 L 564 268" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="566" y="245" width="104" height="46" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="618" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" filter="url(#rough2)">输出 0</text>

  <rect x="110" y="330" width="500" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="352" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">整条 a 已是最长的候选子序列：它满足就取 n</text>
  <text x="360" y="373" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">它不满足（n ≤ M）时，更短的子序列只会更差</text>
</svg>
