<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">滑动窗口：只统计最近 w 天里被保留的物品</text>
  <rect x="60" y="96" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="86" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="86" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">留</text>
  <text x="86" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 1 天</text>
  <rect x="122" y="96" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="148" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="148" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">留</text>
  <text x="148" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 2 天</text>
  <rect x="184" y="96" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="210" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="210" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">留</text>
  <text x="210" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 3 天</text>
  <rect x="246" y="96" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="272" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="272" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">留</text>
  <text x="272" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 4 天</text>
  <rect x="308" y="96" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="334" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="334" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">弃</text>
  <text x="334" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 5 天</text>
  <rect x="370" y="96" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="396" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="396" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">留</text>
  <text x="396" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 6 天</text>
  <path d="M 186 186 L 186 206 L 312 206 L 312 186" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="249" y="224" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 5 天时的窗口 [3, 3, 3]（w = 3）</text>
  <rect x="60" y="244" width="250" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="76" y="268" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">窗口内计数 cnt[3]：</text>
  <text x="76" y="292" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">第 3 天 → 1   第 4 天 → 2</text>
  <text x="76" y="312" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">第 5 天 → 想保留就变 3 &gt; m = 2</text>
  <text x="76" y="336" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">故第 5 天的 3 必须丢弃</text>
  <rect x="330" y="244" width="240" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="346" y="268" text-anchor="start" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">关键：同类型互相独立</text>
  <text x="346" y="292" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">任一窗口内类型 t 的保留数 &lt;= m</text>
  <text x="346" y="312" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">不同类型之间没有交叉约束</text>
  <text x="346" y="336" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">故可逐类型贪心，再相加</text>
  <text x="300" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">红色格子 = 被丢弃（不占窗口名额）；绿色 = 被保留</text>
</svg>
