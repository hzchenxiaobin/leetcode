<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="620" height="404" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">按位拆解：X + (T⊕X) 只关心「T 的零位」</text>
  <text x="310" y="45" text-anchor="middle" font-size="10.5" fill="#888">逐位独立 ⇒ 18 个「权重为 2^b 的异或对计数」问题，彼此不干扰</text>

  <rect x="30" y="60" width="290" height="176" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#2a3a52" filter="url(#rough2)">
    <text x="44" y="80" font-weight="bold" font-size="10.5">第 b 位的贡献</text>
    <text x="44" y="104">T_b = 1 ：X_b + (1⊕X_b) = X_b + (1−X_b) = 1</text>
    <text x="44" y="128">T_b = 0 ：X_b + (0⊕X_b) = 2·X_b</text>
    <text x="44" y="152">⇒ 与 X 无关的常数 T，加上</text>
    <text x="44" y="170">　　只在 T 的零位上翻倍的部分</text>
  </g>
  <rect x="44" y="184" width="262" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="175" y="208" text-anchor="middle" font-size="12" fill="#7a5a18" filter="url(#rough2)">g(l,r) = T + 2·(X &amp; ¬T)</text>

  <rect x="336" y="60" width="256" height="176" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#33502a" filter="url(#rough2)">
    <text x="350" y="80" font-weight="bold" font-size="10.5">于是答案拆成两部分</text>
    <text x="350" y="104">常数部分：T · Σ C(m)C(n−m) = T·K</text>
    <text x="350" y="128">位部分：2^b · #{T_b=0 且 X_b=1 的段}</text>
    <text x="350" y="152">　（按 m 的权重 C(m)C(n−m) 加权）</text>
    <text x="350" y="180">位之间只有「异或」耦合，</text>
    <text x="350" y="198">用 ±1 编码把它变成乘积。</text>
    <text x="350" y="222" font-weight="bold" font-size="10.5">⇒ 每个位一次「带权自相关」</text>
  </g>

  <path d="M 321 148 L 333 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="248" width="562" height="142" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#7a3a36" filter="url(#rough2)">
    <text x="44" y="268" font-weight="bold" font-size="10.5">把「异或不同」写成乘积：令 A_b[k] = (−1)^{p[k] 的第 b 位} ∈ {+1,−1}</text>
    <text x="44" y="292">TotalK = Σ_{s=1..n} (n−s+1)·C(s)C(n−s)　（含端点对 (0,n) 的全配对权值和）</text>
    <text x="44" y="314">Corr_b = Σ_{s=1..n} C(s)C(n−s) · Σ_{i=0..n−s} A_b[i]·A_b[i+s]　（同号 +1 / 异号 −1）</text>
    <text x="44" y="338" font-weight="bold" font-size="11">Diff_b = (TotalK − Corr_b) / 2　←　第 b 位不同的加权对数</text>
    <text x="44" y="362" font-weight="bold" font-size="11">答案 = T·K + 2 · Σ_{b: T_b=0} 2^b · Diff_b</text>
    <text x="44" y="382" font-size="9.5" fill="#a05850">Corr_b 是一条卷积的「点积」：NTT 后 Corr_b = (1/L)·Σ_k Â_b[k]·F̂[k]·Â_b[−k]，每个位只需一次正变换</text>
  </g>
</svg>
