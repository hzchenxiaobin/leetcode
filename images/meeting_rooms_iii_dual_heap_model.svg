<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arBl" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">会议室 III：双堆分工 —— idle 管编号，busy 管时刻</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- rules panel -->
  <g filter="url(#sk)">
    <rect x="60" y="62" width="396" height="128" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="80" y="86" font-size="13" font-weight="bold" fill="#7a5415">题面三条规则</text>
  <text x="80" y="112" font-size="11" fill="#444">① 每场会议进「未占用且编号最小」的房间</text>
  <text x="80" y="136" font-size="11" fill="#444">② 无空房则顺延到最早腾出的房，时长不变</text>
  <text x="80" y="160" font-size="11" fill="#444">③ 房间腾出时，优先给原 start 更早的会议</text>

  <!-- sort panel -->
  <g filter="url(#sk)">
    <rect x="484" y="62" width="396" height="128" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="504" y="86" font-size="13" font-weight="bold" fill="#2b6e9e">预处理：排序承担规则③</text>
  <text x="504" y="112" font-size="11" fill="#444">start 两两互不相同 → 按 start 升序逐场处理</text>
  <text x="504" y="136" font-size="11" fill="#444">处理顺序 = 到场顺序 = 优先级顺序</text>
  <text x="504" y="160" font-size="11" fill="#444">后到者无法插队，规则③免费落实</text>

  <!-- idle heap -->
  <text x="250" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">idle 空闲堆（编号 ↑）</text>
  <text x="250" y="256" text-anchor="middle" font-size="10" fill="#888">示例状态（n = 5）：房 0、2、4 空闲</text>
  <path d="M 236 322 L 182 374" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <path d="M 264 322 L 318 374" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="250" cy="306" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="250" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">0</text>
  <g filter="url(#sk)"><circle cx="170" cy="392" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="170" y="397" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><circle cx="330" cy="392" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="330" y="397" text-anchor="middle" font-size="13" fill="#2b6e9e">4</text>
  <text x="250" y="456" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">堆顶 = 编号最小的空房 → 规则①</text>
  <text x="250" y="476" text-anchor="middle" font-size="10" fill="#888">弹顶即分配，天然有序</text>

  <!-- busy heap -->
  <text x="660" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">busy 占用堆（(end, room) ↑）</text>
  <text x="660" y="256" text-anchor="middle" font-size="10" fill="#888">房 1 开到 5，房 3 开到 12</text>
  <path d="M 640 324 L 578 374" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <path d="M 680 324 L 742 374" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <g filter="url(#sk)"><ellipse cx="660" cy="306" rx="46" ry="22" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="660" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" font-family="monospace">(5, 1)</text>
  <g filter="url(#sk)"><ellipse cx="562" cy="392" rx="46" ry="22" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="562" y="397" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">(12, 3)</text>
  <g filter="url(#sk)"><ellipse cx="758" cy="392" rx="46" ry="22" fill="#f7f4ec" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="758" y="397" text-anchor="middle" font-size="12" fill="#aaa">…</text>
  <text x="660" y="456" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">堆顶 = 最早腾出，并列自动取小号 → 规则②</text>
  <text x="660" y="476" text-anchor="middle" font-size="10" fill="#888">元组第二维放编号，是点睛之笔</text>

  <!-- assign arrow (idle -> busy) -->
  <path d="M 284 296 Q 470 222 610 292" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arBl)" filter="url(#sk)"/>
  <text x="470" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">分配：idle 弹 r，busy 压 (e, r)</text>
  <path d="M 470 220 L 470 246" stroke="#4a8edb" stroke-width="1" stroke-dasharray="2 2" fill="none" filter="url(#sk)"/>

  <!-- release arrow (busy -> idle) -->
  <path d="M 610 328 Q 470 408 284 326" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="470" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">释放：busy 弹出 end ≤ s 的房，回 idle</text>

  <!-- delay panel -->
  <g filter="url(#sk)">
    <rect x="60" y="520" width="820" height="118" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="80" y="546" font-size="13" font-weight="bold" fill="#2e6e2e">顺延分支（idle 为空 → 规则②）</text>
  <text x="80" y="572" font-size="12" fill="#444">弹出 busy 堆顶 (t, r)：t = 全部占用中最早的腾出时刻，r = 该时刻腾出的最小编号房</text>
  <text x="80" y="596" font-size="12.5" fill="#b03a3a" font-weight="bold" font-family="monospace">新区间 = [t, t + (e − s))，时长 e − s 保持不变，与房间上一区间无缝衔接</text>
  <text x="80" y="620" font-size="11" fill="#666">每场会议 cnt[r]++；全部结束后取 cnt 最大、并列编号最小的房间为答案</text>
</svg>
