<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="600" fill="#fafafa"/>
  <text x="245" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：原地标记 + 顺着指针走一整环</text>

  <rect x="60" y="64" width="370" height="46" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="245" y="92" text-anchor="middle" font-size="11.5" fill="#2b4f6e" filter="url(#rough2)">best = 0</text>

  <rect x="60" y="142" width="370" height="58" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="245" y="165" text-anchor="middle" font-size="11" fill="#2b4f6e" filter="url(#rough2)">for i = 0 … n−1（每个下标都当一次候选起点）</text>
  <text x="245" y="186" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">若 nums[i] == −1：这个环已数过，跳过</text>

  <rect x="60" y="232" width="370" height="44" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="245" y="259" text-anchor="middle" font-size="11.5" fill="#2b4f6e" filter="url(#rough2)">cnt = 0，j = i</text>

  <rect x="60" y="308" width="370" height="66" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6410" filter="url(#rough2)">while nums[j] != −1：</text>
  <text x="245" y="354" text-anchor="middle" font-size="9.8" fill="#8a6410" filter="url(#rough2)">nxt = nums[j] → nums[j] = −1 → j = nxt → cnt += 1</text>
  <text x="245" y="368" text-anchor="middle" font-size="8.8" fill="#b08a20" filter="url(#rough2)">先存后继，再覆盖自己</text>

  <rect x="60" y="406" width="370" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="245" y="433" text-anchor="middle" font-size="11.5" fill="#2f5a24" filter="url(#rough2)">best = max(best, cnt)</text>

  <rect x="60" y="482" width="370" height="44" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="509" text-anchor="middle" font-size="11.5" fill="#a03e3a" filter="url(#rough2)">return best</text>

  <g filter="url(#rough2)" stroke="#3a3a3a" stroke-width="1.6" fill="none">
    <path d="M245,110 L245,138" marker-end="url(#arr)"/>
    <path d="M245,200 L245,228" marker-end="url(#arr)"/>
    <path d="M245,276 L245,304" marker-end="url(#arr)"/>
    <path d="M245,374 L245,402" marker-end="url(#arr)"/>
    <path d="M245,450 L245,478" marker-end="url(#arr)"/>
  </g>
  <text x="256" y="470" font-size="9.5" fill="#666" filter="url(#rough2)">所有 i 遍历完</text>

  <path d="M60,428 H26 V171 H56" fill="none" stroke="#b85450" stroke-width="1.7"
        stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="22" y="300" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">i + 1</text>

  <rect x="470" y="136" width="276" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9.6" fill="#2f5a24">
    <text x="482" y="158">· 每个下标只属于一个环，所以扫到</text>
    <text x="482" y="176">  环内第二个点时它一定已被标记</text>
    <text x="482" y="196">· 直接 continue，不会重复计数</text>
  </g>
  <path d="M430,171 L464,171" fill="none" stroke="#4a7a3a" stroke-width="1.4"
        stroke-dasharray="4 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="470" y="296" width="276" height="92" rx="10" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9.4" fill="#a03e3a">
    <text x="482" y="318">· 先把 nxt = nums[j] 存下来</text>
    <text x="482" y="336">· 再写 nums[j] = −1 做标记</text>
    <text x="482" y="354">· 最后才 j = nxt 继续跳</text>
    <text x="482" y="374">顺序反了 → 后继被覆盖，链断掉</text>
  </g>
  <path d="M430,341 L464,341" fill="none" stroke="#b85450" stroke-width="1.4"
        stroke-dasharray="4 4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="470" y="466" width="276" height="76" rx="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9.6" fill="#2b4f6e">
    <text x="482" y="488">· 每个环只从头走一次，环内其余</text>
    <text x="482" y="506">  下标进入时直接被跳过</text>
    <text x="482" y="526">· 总步数 = n，答案与起点无关</text>
  </g>
  <path d="M430,504 L464,504" fill="none" stroke="#446688" stroke-width="1.4"
        stroke-dasharray="4 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="9.8" fill="#666">
    <text x="60" y="560">· 出度、入度都为 1 ⇒ 函数图就是一堆互不相交的环，不需要 DFS 递归与栈</text>
    <text x="60" y="580">· 时间 O(n)：每个下标被写一次 −1；空间 O(1)：直接拿 nums 当访问标记</text>
  </g>
</svg>
