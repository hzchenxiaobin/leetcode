<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrC" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="800" height="560" fill="#fdfcf7"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：值只能向右流——从右往左维护「吞并者」的成长值 cur</text>
  <path d="M 120 42 Q 400 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ Row 1 : 操作语义 ============ -->
  <text x="60" y="76" font-size="12.5" fill="#555" filter="url(#sk)">操作语义：选中 i 且 nums[i] ≤ nums[i+1]，左边的值被右边「吃掉」</text>
  <text x="122" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">5 ≤ 6 ✓</text>
  <g filter="url(#sk)">
    <rect x="100" y="96" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="148" y="96" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="122" y="119" text-anchor="middle" font-size="13.5" fill="#2b4a6e" filter="url(#sk)">5</text>
  <text x="170" y="119" text-anchor="middle" font-size="13.5" fill="#2b4a6e" filter="url(#sk)">6</text>
  <text x="122" y="148" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">nums[i]</text>
  <text x="170" y="148" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">nums[i+1]</text>
  <line x1="200" y1="114" x2="236" y2="114" stroke="#666" stroke-width="1.5" marker-end="url(#arrC)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="240" y="96" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="268" y="119" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">11</text>
  <text x="268" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">5 + 6</text>
  <g font-size="11.5" fill="#444" filter="url(#sk)">
    <text x="330" y="106">一次操作 = 删掉左元素 + 右元素加上左值</text>
    <text x="330" y="124">数组变短一格，值只向右流动</text>
  </g>
  <text x="330" y="142" font-size="11" fill="#b85450" filter="url(#sk)">判定条件永远是「左 ≤ 右」——这是唯一约束</text>

  <!-- ============ Row 2 : 两个关键观察 ============ -->
  <g filter="url(#sk)">
    <rect x="60" y="166" width="335" height="86" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="415" y="166" width="335" height="86" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="78" y="192" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">① 全是正整数</text>
  <text x="78" y="212" font-size="11" fill="#444" filter="url(#sk)">合并只会让右值变大，「吞并能力」只增不减</text>
  <text x="78" y="230" font-size="11" fill="#444" filter="url(#sk)">→ 让右侧的块尽量大，永远不会吃亏</text>
  <text x="78" y="246" font-size="10.5" fill="#5a7391" filter="url(#sk)">更大的右块，只会让左边来者更容易被吞下</text>
  <text x="433" y="192" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">② 终态元素 = 连续段之和</text>
  <text x="433" y="212" font-size="11" fill="#444" filter="url(#sk)">任何操作序列结束后，每个剩余元素恰好等于</text>
  <text x="433" y="230" font-size="11" fill="#444" filter="url(#sk)">原数组某连续段的和 → 目标变为：找和最大</text>
  <text x="433" y="246" font-size="10.5" fill="#93762c" filter="url(#sk)">的可合并连续段（严格刻画见题解 §5）</text>

  <!-- ============ Row 3 : 从右往左的两分支 ============ -->
  <text x="60" y="280" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">从右往左扫：cur =「以 i+1 开头的块能达到的最大值」，每个 nums[i] 二选一</text>

  <!-- Case A : absorb -->
  <g filter="url(#sk)">
    <rect x="100" y="292" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="152" y="292" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="122" y="315" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#sk)">7</text>
  <text x="174" y="315" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">9</text>
  <text x="122" y="344" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">nums[i]</text>
  <text x="174" y="344" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">cur</text>
  <text x="217" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">并入</text>
  <line x1="202" y1="316" x2="230" y2="316" stroke="#666" stroke-width="1.5" marker-end="url(#arrC)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="234" y="292" width="52" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="260" y="315" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">16</text>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">7 + 9</text>
  <text x="330" y="302" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">情况 A：nums[i] ≤ cur → 吸收</text>
  <text x="330" y="320" font-size="11" fill="#444" filter="url(#sk)">cur ← cur + nums[i]（块向左长一格）</text>
  <text x="330" y="336" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">cur 变大 → 左边来者更容易被吞下</text>

  <!-- Case B : reset -->
  <g filter="url(#sk)">
    <rect x="100" y="360" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="152" y="360" width="44" height="36" rx="4" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3"/>
  </g>
  <text x="122" y="383" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#sk)">9</text>
  <text x="174" y="383" text-anchor="middle" font-size="13.5" fill="#999" filter="url(#sk)">3</text>
  <text x="122" y="412" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">nums[i]</text>
  <text x="174" y="412" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">旧 cur</text>
  <text x="217" y="368" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">吞不下</text>
  <line x1="202" y1="384" x2="230" y2="384" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrC)" filter="url(#sk)"/>
  <line x1="205" y1="378" x2="217" y2="390" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <line x1="217" y1="378" x2="205" y2="390" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="234" y="360" width="52" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="260" y="383" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3a36" filter="url(#sk)">9</text>
  <text x="260" y="412" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">重置</text>
  <text x="330" y="370" font-size="11.5" font-weight="bold" fill="#8f3a36" filter="url(#sk)">情况 B：nums[i] > cur → 永远吞不下</text>
  <text x="330" y="388" font-size="11" fill="#444" filter="url(#sk)">i 右侧任何元素的值都不会超过 cur</text>
  <text x="330" y="404" font-size="11" fill="#444" filter="url(#sk)">nums[i] 永远无法向右合并 → 自立门户</text>
  <text x="330" y="420" font-size="10.5" fill="#b85450" filter="url(#sk)">cur ← nums[i]，新块从 i 重新开始</text>

  <!-- ============ bottom note ============ -->
  <g filter="url(#sk)"><rect x="40" y="440" width="720" height="100" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="58" y="464" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">全正数 ⟹ cur 每一步都严格变大：吸收时加上正数；重置时 nums[i] 本来就大于旧 cur</text>
  <text x="58" y="484" font-size="11" fill="#444" filter="url(#sk)">⟹ 历史时刻的 cur 不可能是答案——它们终将被更大的 cur 覆盖，无需中途记录最大值</text>
  <text x="58" y="506" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">一趟 O(n) 扫描结束时的 cur，就是全局最大元素</text>
  <text x="58" y="526" font-size="10.5" fill="#777" filter="url(#sk)">（严格论证见题解 §5：终态刻画 → 左端可去引理 → R(i) 贪心递推 → 最优性定理）</text>
</svg>
