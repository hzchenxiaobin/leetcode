<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">关键剪枝：每行只需保留前 3 大的格子</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一行最多放一个车，另外两个车最多占掉 2 列</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="96" y="80" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="156" y="80" width="56" height="40" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="216" y="80" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="276" y="80" width="56" height="40" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="336" y="80" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>

    <rect x="96" y="130" width="56" height="40" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="156" y="130" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="216" y="130" width="56" height="40" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="276" y="130" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="336" y="130" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>

    <rect x="96" y="180" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="156" y="180" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="216" y="180" width="56" height="40" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="276" y="180" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="336" y="180" width="56" height="40" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="124" y="105" fill="#3a5a30">8</text>
    <text x="184" y="105" fill="#aaa">3</text>
    <text x="244" y="105" fill="#3a5a30">9</text>
    <text x="304" y="105" fill="#aaa">1</text>
    <text x="364" y="105" fill="#3a5a30">7</text>

    <text x="124" y="155" fill="#aaa">2</text>
    <text x="184" y="155" fill="#3a5a30">6</text>
    <text x="244" y="155" fill="#aaa">4</text>
    <text x="304" y="155" fill="#3a5a30">9</text>
    <text x="364" y="155" fill="#3a5a30">5</text>

    <text x="124" y="205" fill="#3a5a30">7</text>
    <text x="184" y="205" fill="#3a5a30">5</text>
    <text x="244" y="205" fill="#aaa">3</text>
    <text x="304" y="205" fill="#3a5a30">8</text>
    <text x="364" y="205" fill="#aaa">2</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="124" y="236">列 0</text>
    <text x="184" y="236">列 1</text>
    <text x="244" y="236">列 2</text>
    <text x="304" y="236">列 3</text>
    <text x="364" y="236">列 4</text>
  </g>

  <rect x="52" y="252" width="456" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="66" y="274" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">为什么前 3 大就够？</text>
  <text x="66" y="294" font-size="10.5" fill="#555" filter="url(#rough2)">另外两个车最多占用 2 个不同的列，所以本行前 3 大的格子里，至少一个的列没被占用。</text>

  <rect x="52" y="322" width="456" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="66" y="344" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">把它的价值换成该行前 3 大中可用的那个，总和只增不减</text>
  <text x="66" y="364" font-size="10.5" fill="#555" filter="url(#rough2)">于是候选格子从 m × n 降到不超过 3m 个，绿色格子即候选</text>
</svg>
