<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：两个官方示例的逐步走查</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- panel 1: example 1 -->
  <text x="320" y="56" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：[0,3,1,0,4,5,2,0] → [4,11]</text>

  <rect x="20" y="64" width="600" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">步骤</text>
  <text x="127" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">cur.val 本步</text>
  <text x="195" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">sum 步末</text>
  <text x="422" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">动作</text>

  <rect x="20" y="88" width="600" height="26" fill="#ffffff" stroke="#bbbbbb" stroke-width="0.9" filter="url(#rough2)"/>
  <text x="55" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">初始</text>
  <text x="127" y="105" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="195" y="105" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <text x="422" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">tail = head（首零 z₀），cur = head.next</text>

  <rect x="20" y="114" width="600" height="26" fill="#ffffff" stroke="#bbbbbb" stroke-width="0.9" filter="url(#rough2)"/>
  <text x="55" y="131" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">扫 3</text>
  <text x="127" y="131" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="195" y="131" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="422" y="131" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sum += 3</text>

  <rect x="20" y="140" width="600" height="26" fill="#ffffff" stroke="#bbbbbb" stroke-width="0.9" filter="url(#rough2)"/>
  <text x="55" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">扫 1</text>
  <text x="127" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="195" y="157" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="422" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sum += 1</text>

  <rect x="20" y="166" width="600" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="55" y="183" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">撞零①</text>
  <text x="127" y="183" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <text x="195" y="183" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <text x="422" y="183" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">tail.val = 4；串入 z₁，tail = z₁，sum = 0</text>

  <rect x="20" y="192" width="600" height="26" fill="#ffffff" stroke="#bbbbbb" stroke-width="0.9" filter="url(#rough2)"/>
  <text x="55" y="209" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">扫 4</text>
  <text x="127" y="209" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="195" y="209" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="422" y="209" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sum += 4</text>

  <rect x="20" y="218" width="600" height="26" fill="#ffffff" stroke="#bbbbbb" stroke-width="0.9" filter="url(#rough2)"/>
  <text x="55" y="235" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">扫 5</text>
  <text x="127" y="235" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="195" y="235" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">9</text>
  <text x="422" y="235" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sum += 5</text>

  <rect x="20" y="244" width="600" height="26" fill="#ffffff" stroke="#bbbbbb" stroke-width="0.9" filter="url(#rough2)"/>
  <text x="55" y="261" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">扫 2</text>
  <text x="127" y="261" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="195" y="261" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">11</text>
  <text x="422" y="261" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sum += 2</text>

  <rect x="20" y="270" width="600" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="55" y="287" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04040" filter="url(#rough2)">撞零②</text>
  <text x="127" y="287" text-anchor="middle" font-size="10.5" fill="#a04040" filter="url(#rough2)">0</text>
  <text x="195" y="287" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04040" filter="url(#rough2)">11</text>
  <text x="422" y="287" text-anchor="middle" font-size="10.5" fill="#a04040" filter="url(#rough2)">tail.val = 11；cur 是尾零 → tail.next = null，结束</text>

  <path d="M90,64 L90,296" stroke="#bbbbbb" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M165,64 L165,296" stroke="#bbbbbb" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M225,64 L225,296" stroke="#bbbbbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- panel 2: example 2 -->
  <text x="320" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2：[0,1,0,3,0,2,2,0] → [1,3,4]</text>

  <rect x="20" y="328" width="600" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">段</text>
  <text x="135" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">段内节点值</text>
  <text x="230" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">段和</text>
  <text x="440" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">复用的零节点</text>

  <rect x="20" y="350" width="600" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="0.9" filter="url(#rough2)"/>
  <text x="45" y="366" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">段①</text>
  <text x="135" y="366" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="366" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="440" y="366" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">z₀ → 1</text>

  <rect x="20" y="374" width="600" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="0.9" filter="url(#rough2)"/>
  <text x="45" y="390" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">段②</text>
  <text x="135" y="390" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="390" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="440" y="390" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">z₁ → 3</text>

  <rect x="20" y="398" width="600" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="0.9" filter="url(#rough2)"/>
  <text x="45" y="414" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">段③</text>
  <text x="135" y="414" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2, 2</text>
  <text x="230" y="414" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="440" y="414" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">z₂ → 4</text>

  <rect x="20" y="422" width="600" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="45" y="438" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04040" filter="url(#rough2)">尾零 z₃</text>
  <text x="135" y="438" text-anchor="middle" font-size="10.5" fill="#a04040" filter="url(#rough2)">—</text>
  <text x="230" y="438" text-anchor="middle" font-size="10.5" fill="#a04040" filter="url(#rough2)">—</text>
  <text x="440" y="438" text-anchor="middle" font-size="10.5" fill="#a04040" filter="url(#rough2)">不升格为容器，直接丢弃（tail.next = null 切断）</text>

  <path d="M70,328 L70,446" stroke="#bbbbbb" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M200,328 L200,446" stroke="#bbbbbb" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M260,328 L260,446" stroke="#bbbbbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- result strip -->
  <rect x="16" y="456" width="608" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="474" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">两例结果分别为 [4,11] 与 [1,3,4] ✓ —— 结果节点全部来自原零节点，零次 new</text>
</svg>
