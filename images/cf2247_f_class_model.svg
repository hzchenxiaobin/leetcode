<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：好集合 ⇔ 同一个「路径集合」类的非空子集</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">P(c) = 所有经过 c 的 (1,1)→(n,m) 自由格路径组成的集合</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="40" y="176" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="63" y="195" fill="#8a6a20">s</text>
    <rect x="306" y="176" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="329" y="195" fill="#8a6a20">t</text>

    <rect x="110" y="96" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="133" y="115" fill="#3a4a66">u1</text>
    <rect x="172" y="96" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="195" y="115" fill="#3a4a66">u2</text>
    <rect x="234" y="96" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="257" y="115" fill="#3a4a66">u3</text>

    <rect x="110" y="256" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="133" y="275" fill="#3a5a30">l1</text>
    <rect x="172" y="256" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="195" y="275" fill="#3a5a30">l2</text>
    <rect x="234" y="256" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="257" y="275" fill="#3a5a30">l3</text>
  </g>

  <g stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 86 183 L 128 118" marker-end="url(#arr)"/>
    <path d="M 86 198 L 128 264" marker-end="url(#arr)"/>
    <path d="M 156 110 L 167 110" marker-end="url(#arr)"/>
    <path d="M 218 110 L 229 110" marker-end="url(#arr)"/>
    <path d="M 156 270 L 167 270" marker-end="url(#arr)"/>
    <path d="M 218 270 L 229 270" marker-end="url(#arr)"/>
    <path d="M 280 118 L 305 183" marker-end="url(#arr)"/>
    <path d="M 280 264 L 305 198" marker-end="url(#arr)"/>
  </g>

  <text x="133" y="80" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">上支：P = {全部上支路径}</text>
  <text x="133" y="304" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">下支：P = {全部下支路径}</text>

  <text x="376" y="86" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">题面条件（对 S 中任意 c, d）</text>
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="376" y="108">经过 c 的路径都要经过 d</text>
    <text x="376" y="126">且经过 d 的路径都要经过 c</text>
    <text x="376" y="148" font-size="11" fill="#b85450" font-weight="bold">⟺ P(c) = P(d)</text>
    <text x="376" y="170">⇒ S 必是某个等价类的非空子集；</text>
    <text x="376" y="188">反之任取一类的非空子集都合法。</text>
  </g>

  <rect x="366" y="206" width="180" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="456" y="228" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">答案 = Σ_C (2^|C| − 1)</text>
  <text x="456" y="248" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">C 取遍所有等价类；</text>
  <text x="456" y="261" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">P = ∅ 的格子并成一个大类</text>

  <rect x="150" y="320" width="48" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="174" y="338" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">×</text>
  <text x="208" y="337" font-size="9.5" fill="#888" filter="url(#rough2)">障碍 / 走不到：P = ∅，可与任意格子同组</text>

  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">同一类的格子必须「同生共死」：经过其中一个的路径必然经过其余全部</text>
</svg>
