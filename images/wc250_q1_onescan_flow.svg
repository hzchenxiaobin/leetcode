<svg xmlns="http://www.w3.org/2000/svg" width="620" height="665" viewBox="0 0 620 665" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="665" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：建表 → 一趟扫描（空格结算 + 末尾补结算）</text>
  <path d="M 140 40 Q 310 50 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="190" y="52" width="240" height="34" rx="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="310" y="74" text-anchor="middle" font-size="12.5" fill="#2b5d8e" font-family="monospace" font-weight="bold">开始：ans = 0, ok = true, 建表</text>

  <path d="M 310 86 L 310 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="140" y="106" width="340" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="310" y="123" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-family="monospace">取下一字符 c（i = 0 … n−1）</text>
  <text x="310" y="138" text-anchor="middle" font-size="10" fill="#4a8e4a">建表：broken[c−'a'] ← true（对所有 c ∈ brokenLetters）</text>

  <path d="M 310 144 L 310 164" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <path d="M 310 168 L 396 204 L 310 240 L 224 204 Z" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="310" y="209" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">c 是空格？</text>

  <path d="M 224 204 L 244 204" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="234" y="196" text-anchor="middle" font-size="11.5" fill="#4a8e4a" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="50" y="184" width="190" height="40" rx="6" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="145" y="202" text-anchor="middle" font-size="11.5" fill="#7a5415" font-family="monospace" font-weight="bold">结算：ans += ok；ok = true</text>
  <text x="145" y="218" text-anchor="middle" font-size="10" fill="#c98a2b">单词边界：结算并复位</text>

  <path d="M 310 240 L 310 262" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="290" y="256" text-anchor="end" font-size="11.5" fill="#b85450" font-weight="bold">否</text>

  <g filter="url(#sk)">
    <path d="M 310 266 L 396 302 L 310 338 L 224 302 Z" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="310" y="300" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">broken[c−'a']</text>
  <text x="310" y="316" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">为 true？</text>

  <path d="M 396 302 L 452 302" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="424" y="294" text-anchor="middle" font-size="11.5" fill="#4a8e4a" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="456" y="282" width="140" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="526" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" font-family="monospace" font-weight="bold">ok = false</text>
  <text x="526" y="316" text-anchor="middle" font-size="10" fill="#b85450">该单词报废</text>

  <path d="M 310 338 L 310 394" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="290" y="370" text-anchor="end" font-size="11.5" fill="#b85450" font-weight="bold">否</text>
  <text x="326" y="370" font-size="10.5" fill="#888">ok 不变，继续</text>

  <path d="M 526 322 L 526 430 L 418 430" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 145 224 L 145 430 L 202 430" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <path d="M 310 398 L 412 430 L 310 462 L 208 430 Z" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="310" y="435" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">字符取完了？</text>

  <path d="M 208 430 L 96 430 L 96 125 L 136 125" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="150" y="420" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">否</text>

  <path d="M 310 462 L 310 484" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="330" y="478" font-size="11.5" fill="#4a8e4a" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="180" y="486" width="260" height="52" rx="6" fill="#fdf1e3" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="310" y="507" text-anchor="middle" font-size="12.5" fill="#b85450" font-family="monospace" font-weight="bold">末尾补结算：ans += ok</text>
  <text x="310" y="526" text-anchor="middle" font-size="10.5" fill="#b85450">最后一个单词后没有空格——漏掉这步必漏数</text>

  <path d="M 310 538 L 310 558" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="240" y="560" width="140" height="34" rx="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="310" y="582" text-anchor="middle" font-size="13" fill="#2b5d8e" font-family="monospace" font-weight="bold">返回 ans</text>

  <g filter="url(#sk)">
    <rect x="30" y="612" width="560" height="42" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="310" y="629" text-anchor="middle" font-size="11" fill="#8f6b1f">建表 O(B) + 扫描 O(n)：全程一次遍历，无需 split、天然流式、除表外只用两个变量</text>
  <text x="310" y="646" text-anchor="middle" font-size="11" fill="#8f6b1f">字母命中后 ok 已为 false，同词后续字符查不查表都不影响结果；return 前那次 ans += ok 别漏</text>
</svg>
