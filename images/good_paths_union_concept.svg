<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
  </defs>

  <rect width="680" height="460" fill="#fafafa"/>

  <g filter="url(#sk2)">
    <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">核心观察：好路径 ⟺ 同值端点在「值 ≤ v 的导出森林」中连通</text>
    <path d="M 100 40 Q 340 50 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none"/>
  </g>

  <!-- left: tree -->
  <g filter="url(#sk)">
    <path d="M 152 118 Q 115 150 92 178" stroke="#999" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 188 118 Q 222 150 248 178" stroke="#999" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 85 219 L 85 271" stroke="#999" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 255 219 L 255 271" stroke="#999" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- good path overlay D->B->A->C->E -->
  <g filter="url(#sk)">
    <path d="M 85 296 L 85 195 Q 85 145 170 100 Q 255 145 255 195 L 255 296" stroke="#b85450" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#sk)">
    <circle cx="170" cy="100" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="85" cy="195" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="255" cy="195" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="85" cy="300" r="24" fill="#fff8e1" stroke="#b85450" stroke-width="2.4"/>
    <circle cx="255" cy="300" r="24" fill="#fff8e1" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <g filter="url(#sk2)">
    <text x="170" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">A</text>
    <text x="170" y="112" text-anchor="middle" font-size="10.5" fill="#2b4a6e">1</text>
    <text x="85" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">B</text>
    <text x="85" y="207" text-anchor="middle" font-size="10.5" fill="#2b4a6e">1</text>
    <text x="255" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">C</text>
    <text x="255" y="207" text-anchor="middle" font-size="10.5" fill="#2b4a6e">1</text>
    <text x="85" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">D</text>
    <text x="85" y="312" text-anchor="middle" font-size="10.5" fill="#7a5415">2</text>
    <text x="255" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">E</text>
    <text x="255" y="312" text-anchor="middle" font-size="10.5" fill="#7a5415">2</text>
  </g>
  <g filter="url(#sk2)">
    <text x="170" y="338" text-anchor="middle" font-size="10" fill="#b03a3a">红折线 = 好路径 D→B→A→C→E</text>
    <text x="170" y="354" text-anchor="middle" font-size="10" fill="#666">端点 D、E 值 = 2，中间 B、A、C 值 = 1 ≤ 2 ✓</text>
  </g>

  <!-- left bottom: two views -->
  <g filter="url(#sk)">
    <rect x="40" y="364" width="290" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk2)">
    <text x="56" y="386" font-size="11" font-weight="bold" fill="#2e6e2e">换个视角看同一棵树：</text>
    <text x="56" y="406" font-size="10.5" fill="#444">v = 1：F₁ 只含 {A,B,C}，三点同块 → +C(3,2) = 3</text>
    <text x="56" y="424" font-size="10.5" fill="#444">v = 2：D、E 点亮，F₂ = 整树，{D,E} 同块</text>
    <text x="56" y="442" font-size="10.5" fill="#444">→ +C(2,2) = 1（正是红色好路径）</text>
  </g>

  <!-- right boxes -->
  <g filter="url(#sk)">
    <rect x="370" y="58" width="288" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk2)">
    <text x="514" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">等价刻画（本题最关键一步）</text>
    <text x="514" y="100" text-anchor="middle" font-size="10.5" fill="#444">vals[u] = vals[u′] = v 时，u、u′ 间存在好路径</text>
    <text x="514" y="117" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e">⟺ u、u′ 在 F_v 中连通</text>
    <text x="514" y="138" text-anchor="middle" font-size="10" fill="#666">F_v：只留值 ≤ v 的点 + 两端都 ≤ v 的边</text>
  </g>

  <g filter="url(#sk)">
    <rect x="370" y="166" width="288" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk2)">
    <text x="514" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">为什么双向成立</text>
    <text x="514" y="208" text-anchor="middle" font-size="10.5" fill="#444">⇒：好路径上每点值 ≤ v，整条路躺在 F_v 里</text>
    <text x="514" y="226" text-anchor="middle" font-size="10.5" fill="#444">⇐：F_v 中连通 ⇒ 存在全程值 ≤ v 的路；</text>
    <text x="514" y="244" text-anchor="middle" font-size="10.5" fill="#444">树上两点路径唯一，它就是那条好路径</text>
  </g>

  <g filter="url(#sk)">
    <rect x="370" y="268" width="288" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk2)">
    <text x="514" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">怎么数（按值升序单调并入）</text>
    <text x="514" y="310" text-anchor="middle" font-size="10.5" fill="#444">逐组处理值 v：先把两端 ≤ v 的边全部 union，</text>
    <text x="514" y="328" text-anchor="middle" font-size="10.5" fill="#444">再对组内节点按根分桶，桶大小 k → +C(k,2)</text>
  </g>

  <g filter="url(#sk)">
    <rect x="370" y="358" width="288" height="90" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk2)">
    <text x="514" y="380" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">⚠ 两个易错点</text>
    <text x="514" y="400" text-anchor="middle" font-size="10.5" fill="#555">单节点路径已由初值 ans = n 计入，勿重复加</text>
    <text x="514" y="418" text-anchor="middle" font-size="10.5" fill="#555">树上点对路径唯一 ⇒ 点对 ↔ 路径一一对应，</text>
    <text x="514" y="436" text-anchor="middle" font-size="10.5" fill="#555">按无序点对 C(k,2) 计数不重不漏</text>
  </g>
</svg>
