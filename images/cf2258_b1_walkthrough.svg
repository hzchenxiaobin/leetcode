<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">样例 1 演算：a = [1, 2, 3, 4, 4]，m = 4</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">suf[x] = #{a_i ≥ x}，cnt[2x] = 长度恰为 2x 的胡萝卜根数</text>

  <rect x="40" y="66" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="88" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">x</text>
  <text x="230" y="88" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">suf[x]</text>
  <text x="360" y="88" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">cnt[2x]</text>
  <text x="470" y="88" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">合计</text>

  <rect x="40" y="106" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="134" text-anchor="middle" font-size="14" fill="#2f5424" filter="url(#rough2)">1</text>
  <text x="230" y="134" text-anchor="middle" font-size="14" fill="#2f5424" filter="url(#rough2)">5</text>
  <text x="360" y="134" text-anchor="middle" font-size="14" fill="#2f5424" filter="url(#rough2)">1</text>
  <text x="470" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>

  <rect x="40" y="156" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="184" text-anchor="middle" font-size="14" fill="#2f5424" filter="url(#rough2)">2</text>
  <text x="230" y="184" text-anchor="middle" font-size="14" fill="#2f5424" filter="url(#rough2)">4</text>
  <text x="360" y="184" text-anchor="middle" font-size="14" fill="#2f5424" filter="url(#rough2)">2</text>
  <text x="470" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>

  <rect x="40" y="206" width="480" height="44" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="234" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="234" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="360" y="234" text-anchor="middle" font-size="14" fill="#999999" filter="url(#rough2)">0</text>
  <text x="470" y="234" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">3</text>

  <rect x="40" y="256" width="480" height="44" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="284" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="230" y="284" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="360" y="284" text-anchor="middle" font-size="14" fill="#999999" filter="url(#rough2)">0</text>
  <text x="470" y="284" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">2</text>

  <text x="280" y="320" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">答案为 6：取 x = 2 与 x = 1 都能得到 6 根同长碎块</text>
</svg>
