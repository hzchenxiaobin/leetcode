<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">计数 → 取最大频率 → 筛选求和</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: nums array -->
  <text x="320" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">① nums = [1, 2, 2, 3, 1, 4]</text>
  <g filter="url(#sk)" font-size="13" fill="#333">
    <rect x="188" y="86" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="232" y="86" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="276" y="86" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="320" y="86" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="364" y="86" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="408" y="86" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="210" y="108">1</text><text x="254" y="108">2</text><text x="298" y="108">2</text>
    <text x="342" y="108">3</text><text x="386" y="108">1</text><text x="430" y="108">4</text>
  </g>
  <path d="M 300 128 Q 320 142 340 128" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2: freq table -->
  <text x="320" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">② 统计每个值的出现次数</text>
  <g filter="url(#sk)" font-size="12">
    <rect x="140" y="172" width="90" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="410" y="172" width="90" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="140" y="206" width="90" height="30" rx="6" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="410" y="206" width="90" height="30" rx="6" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="140" y="240" width="90" height="30" rx="6" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="410" y="240" width="90" height="30" rx="6" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#333" font-family="monospace" text-anchor="middle">
    <text x="185" y="192">1 → 2 次</text><text x="455" y="192">2 → 2 次</text>
    <text x="185" y="226">3 → 1 次</text><text x="455" y="226">4 → 1 次</text>
    <text x="185" y="260">其余 → 0</text><text x="455" y="260">…</text>
  </g>
  <text x="320" y="225" text-anchor="middle" font-size="16" fill="#3a3a3a" font-weight="bold">→</text>

  <!-- Step 3: max freq -->
  <g filter="url(#sk)">
    <rect x="215" y="292" width="210" height="38" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="307" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">③ 最大频率 maxFreq = 2</text>
  <text x="320" y="323" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">答案 = 所有计数 = 2 的项求和</text>
  <path d="M 270 272 Q 320 284 370 272" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 4: answer -->
  <g filter="url(#sk)">
    <rect x="175" y="342" width="290" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="368" text-anchor="middle" font-size="15" fill="#8a3a3a" font-weight="bold" font-family="monospace">④ 2 + 2 = 4 ✓</text>
</svg>
