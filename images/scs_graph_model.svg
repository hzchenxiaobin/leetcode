<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">每个词长为 2 ⇒ 一张 26 个字母内的「先后约束图」</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: word -> edge ===== -->
  <text x="470" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 建模：词 "xy"（x≠y）⇒ 有向边 x→y；词 "xx" ⇒ x 至少出现 2 次</text>

  <g filter="url(#sk)"><rect x="70" y="92" width="90" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="115" y="114" text-anchor="middle" font-size="14" fill="#2b4a6e" font-weight="bold">"ab"</text>
  <path d="M 168 109 L 300 109" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="234" y="100" text-anchor="middle" font-size="10" fill="#4a8edb">连一条边</text>

  <g filter="url(#sk)"><rect x="70" y="146" width="90" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="115" y="168" text-anchor="middle" font-size="14" fill="#2b4a6e" font-weight="bold">"ba"</text>
  <path d="M 168 163 L 300 163" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="70" y="200" width="90" height="34" rx="6" fill="#fce9ec" stroke="#b03a3a" stroke-width="1.4"/></g>
  <text x="115" y="222" text-anchor="middle" font-size="14" fill="#7a2828" font-weight="bold">"aa"</text>
  <path d="M 168 217 L 300 217" stroke="#b03a3a" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="234" y="208" text-anchor="middle" font-size="10" fill="#b03a3a">不是边</text>

  <!-- graph nodes a,b -->
  <g filter="url(#sk)"><circle cx="440" cy="112" r="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="440" y="118" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">a</text>
  <g filter="url(#sk)"><circle cx="440" cy="196" r="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="440" y="202" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">b</text>
  <!-- a->b -->
  <path d="M 462 120 Q 496 154 462 188" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="508" y="160" font-size="11" fill="#2b6e9e" font-weight="bold">a→b</text>
  <!-- b->a -->
  <path d="M 418 188 Q 384 154 418 120" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="362" y="160" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">b→a</text>

  <!-- red annotation for "aa" -->
  <g filter="url(#sk)">
    <rect x="540" y="196" width="340" height="60" rx="8" fill="#fce9ec" stroke="#b03a3a" stroke-width="1.3"/>
  </g>
  <text x="556" y="220" font-size="11" font-weight="bold" fill="#7a2828">"xx" 型词：要求 f(x) ≥ 2</text>
  <text x="556" y="242" font-size="10" fill="#7a2828">（子序列匹配需要两个 x，与边无关）</text>

  <!-- ===== Panel B: cycle contradiction ===== -->
  <text x="470" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2828">② 环 ⇒ 矛盾：只出现 1 次的字母不能构成环</text>

  <g filter="url(#sk)">
    <rect x="60" y="308" width="390" height="118" rx="8" fill="#fdf3f4" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <text x="80" y="332" font-size="11" font-weight="bold" fill="#7a2828">设 f(a)=f(b)=1（各只出现一次）</text>
  <text x="80" y="356" font-size="11" fill="#444">"ab" 是子序列 ⇒ 唯一的 a 在唯一的 b 前</text>
  <text x="80" y="378" font-size="12" fill="#b03a3a" font-weight="bold" font-family="monospace">p(a) &lt; p(b)   且   p(b) &lt; p(a)</text>
  <text x="80" y="404" font-size="12" fill="#b03a3a" font-weight="bold">⇒ p(a) &lt; p(b) &lt; p(a)，矛盾 ✗</text>

  <!-- timeline mini-graph -->
  <g filter="url(#sk)">
    <rect x="480" y="308" width="400" height="118" rx="8" fill="#fdfcf7" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="500" y="332" font-size="11" font-weight="bold" fill="#2b2b2b">超序列上排位置（示意）</text>
  <path d="M 510 384 L 850 384" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="610" cy="384" r="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="610" y="389" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">a</text>
  <g filter="url(#sk)"><circle cx="740" cy="384" r="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="740" y="389" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">b</text>
  <text x="610" y="362" text-anchor="middle" font-size="9" fill="#888">仅一个 a</text>
  <text x="740" y="362" text-anchor="middle" font-size="9" fill="#888">仅一个 b</text>
  <path d="M 614 420 Q 675 442 736 420" stroke="#b03a3a" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="675" y="446" text-anchor="middle" font-size="9" fill="#b03a3a">反向要求 b 在 a 前，画不出 ✗</text>

  <!-- ===== Panel C: lift a vertex to count 2 ===== -->
  <text x="470" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ 破环：让环上某个字母出现 2 次，双向约束同时满足</text>

  <!-- "aba" string -->
  <g font-size="13">
    <g filter="url(#sk)"><rect x="130" y="478" width="44" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
    <text x="152" y="506" text-anchor="middle" fill="#7a5415" font-weight="bold">a</text>
    <g filter="url(#sk)"><rect x="174" y="478" width="44" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="196" y="506" text-anchor="middle" fill="#2e6e2e" font-weight="bold">b</text>
    <g filter="url(#sk)"><rect x="218" y="478" width="44" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
    <text x="240" y="506" text-anchor="middle" fill="#7a5415" font-weight="bold">a</text>
  </g>
  <text x="196" y="548" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">"aba"：T={a}，f=[2,1] ✓</text>
  <path d="M 142 466 Q 196 440 250 466" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="196" y="444" text-anchor="middle" font-size="9" fill="#c98a2b">a 出现两次</text>

  <!-- "bab" string -->
  <g font-size="13">
    <g filter="url(#sk)"><rect x="130" y="562" width="44" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="152" y="590" text-anchor="middle" fill="#2e6e2e" font-weight="bold">b</text>
    <g filter="url(#sk)"><rect x="174" y="562" width="44" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
    <text x="196" y="590" text-anchor="middle" fill="#7a5415" font-weight="bold">a</text>
    <g filter="url(#sk)"><rect x="218" y="562" width="44" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="240" y="590" text-anchor="middle" fill="#2e6e2e" font-weight="bold">b</text>
  </g>
  <text x="196" y="632" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">"bab"：T={b}，f=[1,2] ✓</text>
  <path d="M 142 550 Q 196 656 250 550" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- double satisfaction explanation -->
  <g filter="url(#sk)">
    <rect x="330" y="478" width="550" height="128" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="350" y="502" font-size="12" font-weight="bold" fill="#2b6e9e">为什么出现 2 次就能「双向都满足」？</text>
  <text x="350" y="526" font-size="11" fill="#444">"aba" 中：a₀ b a₁ —— 既有 a 在 b 前，也有 b 在 a 前</text>
  <text x="350" y="548" font-size="11" fill="#444">于是 "ab" 与 "ba" 同时是其子序列</text>
  <text x="350" y="572" font-size="11" fill="#b03a3a" font-weight="bold">被「提升」的字母集合 T 必须把所有环都破坏掉</text>
  <text x="350" y="594" font-size="11" fill="#2b6e9e" font-weight="bold">即：G − T 是 DAG（T 是一张反馈顶点集）</text>

  <!-- key insight -->
  <g filter="url(#sk)">
    <rect x="60" y="628" width="820" height="58" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="652" font-size="12" font-weight="bold" fill="#2b2b2b">关键洞察</text>
  <text x="80" y="672" font-size="11" fill="#444">最短超序列中每个字母恰好出现 1 或 2 次；长度 = |Σ| + |T|，最小化长度 ⇔ 求「含 R 的最小反馈顶点集 T」</text>
</svg>
