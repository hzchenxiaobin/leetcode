<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 585"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="585" fill="#fafafa"/>

  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：双桶状态随窗口滑动（k = 6，x = 2）</text>
  <path d="M 170 34 Q 340 42 510 34" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 数组格子（下标 0..7） -->
  <text x="200" y="42" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="244" y="42" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="288" y="42" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="332" y="42" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="376" y="42" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="420" y="42" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="464" y="42" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="508" y="42" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">7</text>

  <rect x="180" y="46" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="224" y="46" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="244" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="268" y="46" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="312" y="46" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="356" y="46" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="400" y="46" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="444" y="46" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="488" y="46" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="508" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <path d="M 180 96 L 440 96" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="450" y="100" font-size="10" fill="#446688" filter="url(#rough2)">窗 0</text>
  <path d="M 224 108 L 484 108" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="494" y="112" font-size="10" fill="#4a7a3a" filter="url(#rough2)">窗 1</text>
  <path d="M 268 120 L 528 120" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="538" y="124" font-size="10" fill="#a06a15" filter="url(#rough2)">窗 2</text>

  <!-- 卡 0 -->
  <rect x="24" y="136" width="632" height="126" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="38" y="148" width="50" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="63" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">窗 0</text>
  <text x="100" y="165" font-size="11.5" fill="#444" filter="url(#rough2)">[1, 1, 2, 2, 3, 4]</text>
  <text x="330" y="165" font-size="10" fill="#888" filter="url(#rough2)">频次：1×2  2×2  3×1  4×1</text>

  <rect x="38" y="180" width="200" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="46" y="188" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="207" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">2×2</text>
  <rect x="94" y="188" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="207" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">1×2</text>
  <text x="216" y="207" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="250" y="180" width="200" height="44" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="258" y="188" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="10.5" fill="#a06a15" filter="url(#rough2)">4×1</text>
  <rect x="306" y="188" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="207" text-anchor="middle" font-size="10.5" fill="#a06a15" filter="url(#rough2)">3×1</text>
  <text x="428" y="207" font-size="11" font-weight="bold" fill="#a06a15" filter="url(#rough2)">R</text>
  <rect x="470" y="180" width="90" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="515" y="209" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="515" y="176" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">sumL</text>
  <text x="38" y="242" font-size="9.5" fill="#888" filter="url(#rough2)">初始建窗：逐个 add 前 k = 6 个元素，fix 自动把前 2 强聚进 L</text>
  <text x="38" y="256" font-size="9.5" fill="#888" filter="url(#rough2)">（块内记法「值×频次」，L 内频次并列时值大者强）</text>

  <!-- 卡 1 -->
  <rect x="24" y="272" width="632" height="126" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="38" y="284" width="50" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="63" y="301" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">窗 1</text>
  <text x="100" y="301" font-size="11.5" fill="#444" filter="url(#rough2)">[1, 2, 2, 3, 4, 2]</text>
  <text x="330" y="301" font-size="10" fill="#888" filter="url(#rough2)">频次：2×3  4×1  3×1  1×1</text>

  <rect x="38" y="316" width="200" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="46" y="324" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="343" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">2×3</text>
  <rect x="94" y="324" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="343" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">4×1</text>
  <text x="216" y="343" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="250" y="316" width="200" height="44" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="258" y="324" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="10.5" fill="#a06a15" filter="url(#rough2)">3×1</text>
  <rect x="306" y="324" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="343" text-anchor="middle" font-size="10.5" fill="#a06a15" filter="url(#rough2)">1×1</text>
  <text x="428" y="343" font-size="11" font-weight="bold" fill="#a06a15" filter="url(#rough2)">R</text>
  <rect x="470" y="316" width="90" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="515" y="345" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">10</text>
  <text x="515" y="312" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">sumL</text>
  <text x="38" y="378" font-size="9.5" fill="#3a5f2e" filter="url(#rough2)">remove 1 ⇒ key (2,1) 变 (1,1)：跌破桶界 → fix③ 与 R 最强 (1,4) 互换</text>
  <text x="38" y="392" font-size="9.5" fill="#3a5f2e" filter="url(#rough2)">add 2 ⇒ key (2,2) 变 (3,2)：更强 → 稳坐 L，sumL = 8 − 4 + 6 = 10</text>

  <!-- 卡 2 -->
  <rect x="24" y="408" width="632" height="126" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="38" y="420" width="50" height="24" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="63" y="437" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a15" filter="url(#rough2)">窗 2</text>
  <text x="100" y="437" font-size="11.5" fill="#444" filter="url(#rough2)">[2, 2, 3, 4, 2, 3]</text>
  <text x="330" y="437" font-size="10" fill="#888" filter="url(#rough2)">频次：2×3  3×2  4×1</text>

  <rect x="38" y="452" width="200" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="46" y="460" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="479" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">2×3</text>
  <rect x="94" y="460" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="479" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">3×2</text>
  <text x="216" y="479" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="250" y="452" width="200" height="44" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="258" y="460" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="479" text-anchor="middle" font-size="10.5" fill="#a06a15" filter="url(#rough2)">4×1</text>
  <text x="428" y="479" font-size="11" font-weight="bold" fill="#a06a15" filter="url(#rough2)">R</text>
  <rect x="470" y="452" width="90" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="515" y="481" text-anchor="middle" font-size="20" font-weight="bold" fill="#a06a15" filter="url(#rough2)">12</text>
  <text x="515" y="448" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">sumL</text>
  <text x="38" y="514" font-size="9.5" fill="#a06a15" filter="url(#rough2)">remove 1 ⇒ key (1,1) 频次归 0：移出 R，不再回插</text>
  <text x="38" y="528" font-size="9.5" fill="#a06a15" filter="url(#rough2)">add 3 ⇒ key (1,3) 变 (2,3)：强于 L 最弱 (1,4) → 挤其降入 R，sumL → 12</text>

  <!-- 底部答案 -->
  <text x="248" y="567" text-anchor="end" font-size="12.5" fill="#444" filter="url(#rough2)">answer =</text>
  <rect x="262" y="547" width="44" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="567" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>
  <rect x="312" y="547" width="44" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="334" y="567" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">10</text>
  <rect x="362" y="547" width="44" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="567" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a15" filter="url(#rough2)">12</text>
  <text x="424" y="567" font-size="10.5" fill="#888" filter="url(#rough2)">← 与题面输出一致</text>
</svg>
