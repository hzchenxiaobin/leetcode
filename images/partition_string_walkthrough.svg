<svg xmlns="http://www.w3.org/2000/svg" width="940" height="710" viewBox="0 0 940 710" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="940" height="710" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：逐字符走查</text>
  <path d="M 320 42 Q 470 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Table 1: abbccccd ===== -->
  <text x="70" y="70" font-size="13" font-weight="bold" fill="#2b6e9e">示例 1：s = "abbccccd" —— 8 步切出 6 段</text>

  <!-- header row -->
  <g filter="url(#sk)"><rect x="70" y="82" width="800" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <g font-size="11" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="92" y="102">i</text>
    <text x="140" y="102">s[i]</text>
    <text x="217" y="102">扩展后 cur</text>
    <text x="345" y="102">cur ∈ seen ?</text>
    <text x="500" y="102">动作</text>
    <text x="725" y="102">ans（累计）</text>
  </g>

  <!-- rows: cut = green tint, extend = orange tint -->
