  <g font-size="11" text-anchor="middle">
    <text x="92" y="138" fill="#333">0</text><text x="140" y="138" fill="#333">a</text>
    <text x="217" y="138" fill="#333" font-family="monospace">"a"</text>
    <text x="345" y="138" fill="#2e6e2e" font-weight="bold">否（新）✓</text>
    <text x="500" y="138" fill="#2e6e2e" font-weight="bold">切分</text>
    <text x="725" y="138" fill="#444" font-family="monospace" font-size="10">[ "a" ]</text>
  </g>

  <g filter="url(#sk)"><rect x="70" y="152" width="800" height="38" fill="#eaf6ee" stroke="#bbb" stroke-width="0.8"/></g>
