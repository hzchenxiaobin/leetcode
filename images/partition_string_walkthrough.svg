  <g font-size="11" text-anchor="middle">
    <text x="92" y="550" fill="#333">1</text><text x="140" y="550" fill="#333">a</text>
    <text x="217" y="550" fill="#b03a3a" font-weight="bold" font-family="monospace">"a"</text>
    <text x="345" y="550" fill="#b03a3a" font-weight="bold">是 ✗</text>
    <text x="500" y="550" fill="#7a5415" font-weight="bold">继续扩展</text>
    <text x="725" y="550" fill="#444" font-family="monospace" font-size="10">[ "a" ]</text>
  </g>

  <g filter="url(#sk)"><rect x="70" y="564" width="800" height="36" fill="#eaf6ee" stroke="#bbb" stroke-width="0.8"/></g>
  <g font-size="11" text-anchor="middle">
    <text x="92" y="586" fill="#333">2</text><text x="140" y="586" fill="#333">a</text>
    <text x="217" y="586" fill="#333" font-family="monospace">"aa"</text>
    <text x="345" y="586" fill="#2e6e2e" font-weight="bold">否 ✓</text>
    <text x="500" y="586" fill="#2e6e2e" font-weight="bold">切分</text>
    <text x="725" y="586" fill="#444" font-family="monospace" font-size="10">[ "a", "aa" ]</text>
  </g>

  <g filter="url(#sk)"><rect x="70" y="600" width="800" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <g font-size="11" text-anchor="middle">
    <text x="92" y="622" fill="#333">3</text><text x="140" y="622" fill="#333">a</text>
    <text x="217" y="622" fill="#b03a3a" font-weight="bold" font-family="monospace">"a"</text>
    <text x="345" y="622" fill="#b03a3a" font-weight="bold">是 ✗</text>
    <text x="500" y="622" fill="#b03a3a" font-weight="bold">串尾仍重复 → 残留丢弃</text>
    <text x="725" y="622" fill="#444" font-family="monospace" font-size="10">[ "a", "aa" ]</text>
  </g>

  <g stroke="#d8d5cc" stroke-width="0.8" filter="url(#sk)">
    <path d="M 115 462 L 115 636"/><path d="M 165 462 L 165 636"/>
    <path d="M 270 462 L 270 636"/><path d="M 420 462 L 420 636"/>
    <path d="M 580 462 L 580 636"/>
  </g>

  <text x="470" y="676" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">最终输出：["a","b","bc","c","cc","d"] 与 ["a","aa"]，与题目示例一致 ✓</text>
</svg>
