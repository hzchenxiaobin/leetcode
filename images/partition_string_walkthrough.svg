    <text x="217" y="404" fill="#333" font-family="monospace">"d"</text>
    <text x="345" y="404" fill="#2e6e2e" font-weight="bold">否（新）✓</text>
    <text x="500" y="404" fill="#2e6e2e" font-weight="bold">切分</text>
    <text x="725" y="404" fill="#444" font-family="monospace" font-size="10">[ "a", "b", "bc", "c", "cc", "d" ]</text>
  </g>

  <!-- column separators -->
  <g stroke="#d8d5cc" stroke-width="0.8" filter="url(#sk)">
    <path d="M 115 82 L 115 418"/><path d="M 165 82 L 165 418"/>
    <path d="M 270 82 L 270 418"/><path d="M 420 82 L 420 418"/>
    <path d="M 580 82 L 580 418"/>
  </g>

  <!-- ===== Table 2: aaaa ===== -->
  <text x="70" y="450" font-size="13" font-weight="bold" fill="#5a3a7a">示例 2：s = "aaaa" —— 体会「重复 → 扩展」与「残留丢弃」</text>

  <g filter="url(#sk)"><rect x="70" y="462" width="800" height="30" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.2"/></g>
  <g font-size="11" font-weight="bold" fill="#5a3a7a" text-anchor="middle">
    <text x="92" y="481">i</text><text x="140" y="481">s[i]</text>
    <text x="217" y="481">cur</text><text x="345" y="481">cur ∈ seen ?</text>
    <text x="500" y="481">动作</text><text x="725" y="481">ans</text>
  </g>

  <g filter="url(#sk)"><rect x="70" y="492" width="800" height="36" fill="#eaf6ee" stroke="#bbb" stroke-width="0.8"/></g>
  <g font-size="11" text-anchor="middle">
    <text x="92" y="514" fill="#333">0</text><text x="140" y="514" fill="#333">a</text>
    <text x="217" y="514" fill="#333" font-family="monospace">"a"</text>
    <text x="345" y="514" fill="#2e6e2e" font-weight="bold">否 ✓</text>
    <text x="500" y="514" fill="#2e6e2e" font-weight="bold">切分</text>
    <text x="725" y="514" fill="#444" font-family="monospace" font-size="10">[ "a" ]</text>
  </g>

