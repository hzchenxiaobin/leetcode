    <text x="500" y="290" fill="#2e6e2e" font-weight="bold">切分</text>
    <text x="725" y="290" fill="#444" font-family="monospace" font-size="10">[ "a", "b", "bc", "c" ]</text>
  </g>

  <g filter="url(#sk)"><rect x="70" y="304" width="800" height="38" fill="#fef6e6" stroke="#bbb" stroke-width="0.8"/></g>
  <g font-size="11" text-anchor="middle">
    <text x="92" y="328" fill="#333">5</text><text x="140" y="328" fill="#333">c</text>
    <text x="217" y="328" fill="#b03a3a" font-weight="bold" font-family="monospace">"c"</text>
