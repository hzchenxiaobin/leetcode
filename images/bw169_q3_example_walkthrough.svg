<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [1,2,3,1,2]，逐个位置试缝</text>

  <!-- 表头 -->
  <text x="72" y="60" font-size="11" fill="#999" filter="url(#rough2)">替换 i</text>
  <text x="150" y="60" font-size="11" fill="#999" filter="url(#rough2)">左段 pre[i−1]</text>
  <text x="282" y="60" font-size="11" fill="#999" filter="url(#rough2)">右段 suf[i+1]</text>
  <text x="404" y="60" font-size="11" fill="#999" filter="url(#rough2)">候选</text>

  <path d="M60,68 L460,68" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 行 0 -->
  <text x="80" y="96" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="150" y="80" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="282" y="80" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="302" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="400" y="80" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 1 -->
  <text x="80" y="130" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="114" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="282" y="114" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="302" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="400" y="114" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="340" y="130" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1≤3 ✓</text>

  <!-- 行 2 -->
  <text x="80" y="164" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="150" y="148" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="282" y="148" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="302" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="400" y="148" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="340" y="164" font-size="11" fill="#b85450" filter="url(#rough2)">2≤1 ✗</text>

  <!-- 行 3 高亮 -->
  <rect x="60" y="178" width="410" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="198" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="150" y="182" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="282" y="182" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="302" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="400" y="182" width="56" height="22" fill="#b85450" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="198" text-anchor="middle" font-size="13" fill="#fff" filter="url(#rough2)">4</text>
  <text x="340" y="198" font-size="11" fill="#b85450" filter="url(#rough2)">3≤2 ✗</text>

  <!-- 行 4 -->
  <text x="80" y="232" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="150" y="216" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="282" y="216" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="302" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="400" y="216" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <path d="M60,248 L460,248" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="90" y="262" width="340" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最大候选 = 4（替换 i=3，接上左侧 [1,2,3]）</text>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">对应数组 [1,2,3,3,2]，答案 4</text>
</svg>
