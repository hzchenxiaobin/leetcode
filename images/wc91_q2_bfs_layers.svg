<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="330" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">从 target 出发逐层扩散：第 k 层就是答案</text>

  <rect x="40" y="62" width="560" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="66" y="96" font-size="13" fill="#d6a040" filter="url(#rough2)">dist = 0</text>
  <rect x="200" y="74" width="52" height="32" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="226" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="300" y="96" font-size="12" fill="#666" filter="url(#rough2)">起点 target（已访问）</text>

  <path d="M120,118 L120,140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="140" width="560" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="174" font-size="13" fill="#446688" filter="url(#rough2)">dist = 1</text>
  <rect x="180" y="152" width="52" height="32" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="206" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="246" y="152" width="52" height="32" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="272" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="312" y="152" width="52" height="32" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="338" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="400" y="174" font-size="12" fill="#666" filter="url(#rough2)">父结点 + 左右孩子</text>

  <path d="M120,196 L120,218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="218" width="560" height="56" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="66" y="252" font-size="13" fill="#4a7a3a" filter="url(#rough2)">dist = 2</text>
  <rect x="180" y="230" width="52" height="32" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="206" y="252" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="246" y="230" width="52" height="32" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="272" y="252" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="312" y="230" width="52" height="32" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="338" y="252" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="400" y="252" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k = 2 ⇒ 收集这一层，停止扩展</text>

  <text x="24" y="304" font-size="12" fill="#333" filter="url(#rough2)">答案 = {1, 7, 4}，顺序任意；若 k 超过树的最大偏心距，则返回空数组。</text>
</svg>
