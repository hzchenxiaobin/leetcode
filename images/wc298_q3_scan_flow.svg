<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="22" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="580" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：自右向左扫一遍 —— 0 必留，1 过预算关</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 第一行：开始 + 初始化 -->
  <g filter="url(#sk)"><ellipse cx="80" cy="78" rx="30" ry="16" fill="#f3efe6" stroke="#8a7a55" stroke-width="1.5"/></g>
  <text x="80" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6a5c3c">开始</text>
  <path d="M 112 78 H 138" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="144" y="61" width="212" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="250" y="82" text-anchor="middle" font-size="12" fill="#2b6e9e">len ← 0，val ← 0，i ← n−1</text>
  <path d="M 250 95 V 120" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 第二行：i >= 0 ? -->
  <g filter="url(#sk)"><polygon points="185,150 250,126 315,150 250,174" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="250" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">i ≥ 0 ?</text>
  <path d="M 315 150 H 366" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="338" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a20">否</text>
  <g filter="url(#sk)"><rect x="372" y="133" width="196" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="470" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">返回 len（= 答案）</text>
  <path d="M 250 174 V 198" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="258" y="192" text-anchor="start" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- 第三行：s[i] == '0' ? -->
  <g filter="url(#sk)"><polygon points="185,230 250,204 315,230 250,256" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="250" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">s[i] == '0' ?</text>
  <path d="M 315 230 H 366" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="338" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="372" y="213" width="196" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="470" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">len++（0 免费，必留）</text>
  <path d="M 568 230 H 596 V 470 H 446" stroke="#3a3a3a" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 256 V 282" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="258" y="276" text-anchor="start" font-size="11" font-weight="bold" fill="#a06a20">否</text>

  <!-- 第四行：预算判定 -->
  <g filter="url(#sk)"><polygon points="140,318 250,288 360,318 250,348" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="250" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">len &lt; 31 且</text>
  <text x="250" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">val + 2^len ≤ k ?</text>
  <path d="M 360 318 H 396" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="376" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="402" y="301" width="200" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="502" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">val += 2^len；len++</text>
  <path d="M 502 335 V 390 H 446" stroke="#3a3a3a" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 348 V 376" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="258" y="370" text-anchor="start" font-size="11" font-weight="bold" fill="#a06a20">否</text>

  <g filter="url(#sk)"><rect x="130" y="380" width="316" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="288" y="398" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48">跳过该 1（不选，len 不变）</text>
  <text x="288" y="414" text-anchor="middle" font-size="10" fill="#a06a20">更左的 1 位权只增不减，也装不下 —— 但不能 break！</text>
  <path d="M 288 424 V 452" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 第五行：i--，回边 -->
  <g filter="url(#sk)"><rect x="215" y="456" width="230" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="330" y="476" text-anchor="middle" font-size="12.5" fill="#2b6e9e">i ← i − 1（继续向左扫）</text>
  <path d="M 215 472 H 60 V 150 H 181" stroke="#3a3a3a" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="66" y="308" font-size="10.5" fill="#888" transform="rotate(-90 66 308)">循环</text>

  <!-- 底部注解 -->
  <g filter="url(#sk)"><rect x="40" y="508" width="560" height="52" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="528" text-anchor="middle" font-size="11.5" fill="#7a5415">跳过的 1 之后：val 不变、len 不减 → 2^len 不减 → 后续更左的 1 必然同样装不下</text>
  <text x="320" y="546" text-anchor="middle" font-size="11.5" fill="#7a5415">但左侧的 0 依然免费 —— 扫描必须走完全程；k ≤ 10⁹ &lt; 2³⁰，len ≥ 31 时必跳（防溢出 guard）</text>
</svg>
