<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：num = 121 —— 两个 1 各自命中</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- locked num -->
  <g filter="url(#sk)">
    <rect x="48" y="58" width="170" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="133" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">num = 121（全程不动）</text>
  <text x="240" y="81" font-size="11" fill="#888">判定式固定：121 % d == 0（d 是数位，作除数）</text>

  <!-- step table -->
  <g filter="url(#sk)">
    <rect x="48" y="104" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="112" y="104" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="192" y="104" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="302" y="104" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="402" y="104" width="72" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="474" y="104" width="88" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="80" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">轮次</text>
  <text x="152" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">t（轮初）</text>
  <text x="247" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">d = t % 10</text>
  <text x="352" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">121 % d</text>
  <text x="438" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">命中</text>
  <text x="518" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">cnt</text>

  <!-- rows -->
  <g filter="url(#sk)">
    <rect x="48" y="138" width="64" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="112" y="138" width="80" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="192" y="138" width="110" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="302" y="138" width="100" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="402" y="138" width="72" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="474" y="138" width="88" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
  </g>
  <text x="80" y="163" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="152" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">121</text>
  <text x="247" y="163" text-anchor="middle" font-size="12" fill="#7a5415">1（个位）</text>
  <text x="352" y="163" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="438" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="518" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>

  <g filter="url(#sk)">
    <rect x="48" y="178" width="64" height="40" fill="#fdfcf7" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="112" y="178" width="80" height="40" fill="#fdfcf7" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="192" y="178" width="110" height="40" fill="#fdfcf7" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="302" y="178" width="100" height="40" fill="#fdfcf7" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="402" y="178" width="72" height="40" fill="#fdfcf7" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="474" y="178" width="88" height="40" fill="#fdfcf7" stroke="#c5c0b4" stroke-width="1.1"/>
  </g>
  <text x="80" y="203" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="152" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">12</text>
  <text x="247" y="203" text-anchor="middle" font-size="12" fill="#7a5415">2（十位）</text>
  <text x="352" y="203" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="438" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">✗</text>
  <text x="518" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>

  <g filter="url(#sk)">
    <rect x="48" y="218" width="64" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="112" y="218" width="80" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="192" y="218" width="110" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="302" y="218" width="100" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="402" y="218" width="72" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
    <rect x="474" y="218" width="88" height="40" fill="#fbfaf3" stroke="#c5c0b4" stroke-width="1.1"/>
  </g>
  <text x="80" y="243" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="152" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">1</text>
  <text x="247" y="243" text-anchor="middle" font-size="12" fill="#7a5415">1（百位）</text>
  <text x="352" y="243" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="438" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="518" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2</text>

  <g filter="url(#sk)">
    <rect x="48" y="258" width="64" height="40" fill="#f2f2ee" stroke="#b0aba0" stroke-width="1.1"/>
    <rect x="112" y="258" width="80" height="40" fill="#f2f2ee" stroke="#b0aba0" stroke-width="1.1"/>
    <rect x="192" y="258" width="110" height="40" fill="#f2f2ee" stroke="#b0aba0" stroke-width="1.1"/>
    <rect x="302" y="258" width="100" height="40" fill="#f2f2ee" stroke="#b0aba0" stroke-width="1.1"/>
    <rect x="402" y="258" width="72" height="40" fill="#f2f2ee" stroke="#b0aba0" stroke-width="1.1"/>
    <rect x="474" y="258" width="88" height="40" fill="#f2f2ee" stroke="#b0aba0" stroke-width="1.1"/>
  </g>
  <text x="80" y="283" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="152" y="283" text-anchor="middle" font-size="12" fill="#777">0</text>
  <text x="247" y="283" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="352" y="283" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="438" y="283" text-anchor="middle" font-size="12" fill="#888">结束</text>
  <text x="518" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">返回 2</text>

  <!-- minis -->
  <g filter="url(#sk)">
    <rect x="48" y="318" width="250" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="173" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">num = 7（示例 1）</text>
  <text x="173" y="362" text-anchor="middle" font-size="10.5" fill="#444">唯一数位 7：7 % 7 = 0 ✓ → 返回 1</text>

  <g filter="url(#sk)">
    <rect x="312" y="318" width="250" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="437" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">num = 1248（示例 3）</text>
  <text x="437" y="362" text-anchor="middle" font-size="10.5" fill="#444">数位 1,2,4,8 全部命中 → 返回 4</text>

  <!-- key takeaway -->
  <g filter="url(#sk)">
    <rect x="48" y="396" width="584" height="38" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="62" y="420" font-size="11" fill="#555">要点：✗ 轮次 cnt 不变；同值数位（两个 1）独立判定、各计一次；t 减到 0 循环结束，cnt 即答案。</text>
</svg>
