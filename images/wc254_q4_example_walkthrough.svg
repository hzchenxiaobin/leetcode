<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e6e2e"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="590" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 3 演算：row = 3, col = 3，答案 = 3</text>
  <path d="M 300 44 Q 450 52 600 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <rect x="560" y="56" width="14" height="14" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="580" y="68" font-size="11" fill="#666">水域（被淹）</text>
  <rect x="660" y="56" width="14" height="14" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="680" y="68" font-size="11" fill="#666">陆地</text>
  <path d="M 736 63 L 756 63" stroke="#2e6e2e" stroke-width="3" fill="none" filter="url(#sk)"/>
  <text x="762" y="68" font-size="11" fill="#666">顶→底路径</text>

  <!-- ===== Day 3 ===== -->
  <text x="90" y="100" font-size="14" font-weight="bold" fill="#2b2b2b">第 3 天结束：被淹 {(1,2), (2,1), (3,3)} —— 仍可通行 ✓</text>
  <text x="162" y="112" text-anchor="middle" font-size="10" fill="#999">第1列</text>
  <text x="206" y="112" text-anchor="middle" font-size="10" fill="#999">第2列</text>
  <text x="250" y="112" text-anchor="middle" font-size="10" fill="#999">第3列</text>
  <text x="134" y="142" text-anchor="end" font-size="10" fill="#999">第1行</text>
  <text x="134" y="186" text-anchor="end" font-size="10" fill="#999">第2行</text>
  <text x="134" y="230" text-anchor="end" font-size="10" fill="#999">第3行</text>
  <g filter="url(#sk)">
    <rect x="140" y="116" width="44" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="184" y="116" width="44" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="228" y="116" width="44" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="140" y="160" width="44" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="184" y="160" width="44" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="228" y="160" width="44" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="140" y="204" width="44" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="184" y="204" width="44" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="228" y="204" width="44" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <circle cx="250" cy="138" r="4" fill="#2e6e2e" filter="url(#sk)"/>
  <path d="M 250 138 L 250 182 L 206 182 L 206 226" stroke="#2e6e2e" stroke-width="3" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="282" y="142" font-size="11" font-weight="bold" fill="#2e6e2e">起</text>
  <text x="206" y="270" text-anchor="middle" font-size="11" fill="#2e6e2e">到达底行 ✓</text>
  <text x="330" y="138" font-size="12.5" fill="#444">顶行可出发的陆地：(1,1) 与 (1,3)</text>
  <text x="330" y="162" font-size="12.5" fill="#444">(1,1) 被两块水（(1,2)、(2,1)）夹住，是死格</text>
  <text x="330" y="186" font-size="12.5" fill="#444">从 (1,3) 出发走陆路：</text>
  <text x="330" y="210" font-size="12.5" font-weight="bold" fill="#2e6e2e">(1,3) → (2,3) → (2,2) → (3,2)，触到底行 ✓</text>
  <text x="330" y="234" font-size="12.5" fill="#666">还剩 6 块陆地，顶底连通性完好</text>

  <!-- ===== Day 4 ===== -->
  <text x="90" y="292" font-size="14" font-weight="bold" fill="#2b2b2b">第 4 天结束：再淹 (2,2) —— 通路被截断 ✗</text>
  <text x="162" y="304" text-anchor="middle" font-size="10" fill="#999">第1列</text>
  <text x="206" y="304" text-anchor="middle" font-size="10" fill="#999">第2列</text>
  <text x="250" y="304" text-anchor="middle" font-size="10" fill="#999">第3列</text>
  <text x="134" y="334" text-anchor="end" font-size="10" fill="#999">第1行</text>
  <text x="134" y="378" text-anchor="end" font-size="10" fill="#999">第2行</text>
  <text x="134" y="422" text-anchor="end" font-size="10" fill="#999">第3行</text>
  <g filter="url(#sk)">
    <rect x="140" y="308" width="44" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="184" y="308" width="44" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="228" y="308" width="44" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="140" y="352" width="44" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="184" y="352" width="44" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="228" y="352" width="44" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="140" y="396" width="44" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="184" y="396" width="44" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="228" y="396" width="44" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <path d="M 250 330 L 250 368" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 243 387 L 257 401 M 257 387 L 243 401" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 221 365 L 235 379 M 235 365 L 221 379" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <ellipse cx="184" cy="418" rx="52" ry="24" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="184" y="462" text-anchor="middle" font-size="11" fill="#b85450">底簇孤悬</text>
  <text x="330" y="330" font-size="12.5" fill="#444">顶行仍剩 (1,1)、(1,3)，(1,1) 依旧被围死</text>
  <text x="330" y="354" font-size="12.5" fill="#444">从 (1,3) 只能走到 (2,3)：往下 (3,3) 是水、往左 (2,2) 是水</text>
  <text x="330" y="378" font-size="12.5" fill="#444">底行虽有 (3,1)、(3,2)，但与顶行已彻底断开 ✗</text>
  <text x="330" y="402" font-size="12.5" font-weight="bold" fill="#b85450">从第 4 天起永远过不去 → 最后能过河的是第 3 天</text>

  <!-- ===== bottom: flooding order + conclusion ===== -->
  <text x="90" y="490" font-size="12" fill="#666">淹没顺序：第1天 (1,2) → 第2天 (2,1) → 第3天 (3,3) → 第4天 (2,2) → ⋯（后面的天只会更糟）</text>
  <g filter="url(#sk)">
    <rect x="80" y="510" width="740" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="100" y="534" font-size="13" font-weight="bold" fill="#2e6e2e">通行性 = ✓ ✓ ✓ ✗ ✗ ⋯（先真后假，分界唯一），答案 = 最后一个 ✓ = 3</text>
  <text x="100" y="554" font-size="11" fill="#888">二分与逆向并查集殊途同归：一个对天数二分，一个对时间倒流，都只吃这条单调性</text>
</svg>
