<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="760" height="486" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 a = [0, 0, −1, 1]（n = 4）的区间 DP 走查</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">need = a[r+1] 决定这个区间要存哪些 k；虚设 a₅ = −1</text>

  <rect x="70" y="70" width="620" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">区间 [l, r]</text>
  <text x="262" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">need = a[r+1]</text>
  <text x="430" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">记录形式</text>
  <text x="596" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">数值</text>

  <rect x="70" y="94" width="620" height="24" fill="#ffffff" filter="url(#rough2)"/>
  <text x="130" y="111" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">[1,1]</text>
  <text x="262" y="111" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">0</text>
  <text x="430" y="111" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">f[0]（非空区间不可能 k=0）</text>
  <text x="596" y="111" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>

  <rect x="70" y="118" width="620" height="24" fill="#f7f9fb" filter="url(#rough2)"/>
  <text x="130" y="135" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">[2,2]</text>
  <text x="262" y="135" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">−1</text>
  <text x="430" y="135" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">G（只留总和）</text>
  <text x="596" y="135" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <rect x="70" y="142" width="620" height="24" fill="#ffffff" filter="url(#rough2)"/>
  <text x="130" y="159" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">[3,3]</text>
  <text x="262" y="159" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1（a₄ = 1）</text>
  <text x="430" y="159" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">f[1]</text>
  <text x="596" y="159" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <rect x="70" y="166" width="620" height="24" fill="#f7f9fb" filter="url(#rough2)"/>
  <text x="130" y="183" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">[4,4]</text>
  <text x="262" y="183" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">−1</text>
  <text x="430" y="183" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">G</text>
  <text x="596" y="183" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0（a₄=1 要求左空）</text>

  <rect x="70" y="190" width="620" height="24" fill="#ffffff" filter="url(#rough2)"/>
  <text x="130" y="207" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">[1,2]</text>
  <text x="262" y="207" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">−1</text>
  <text x="430" y="207" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">G = 1·G[2,2]</text>
  <text x="596" y="207" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <rect x="70" y="214" width="620" height="24" fill="#f7f9fb" filter="url(#rough2)"/>
  <text x="130" y="231" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">[2,3]</text>
  <text x="262" y="231" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="430" y="231" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">f[1]（根只能取 3）</text>
  <text x="596" y="231" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <rect x="70" y="238" width="620" height="24" fill="#ffffff" filter="url(#rough2)"/>
  <text x="130" y="255" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">[3,4]</text>
  <text x="262" y="255" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">−1</text>
  <text x="430" y="255" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">G = 1·f[3,3][1]</text>
  <text x="596" y="255" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <rect x="70" y="262" width="620" height="24" fill="#f7f9fb" filter="url(#rough2)"/>
  <text x="130" y="279" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">[1,3]</text>
  <text x="262" y="279" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="430" y="279" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">f[1] = G[1,2]</text>
  <text x="596" y="279" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <rect x="70" y="286" width="620" height="24" fill="#ffffff" filter="url(#rough2)"/>
  <text x="130" y="303" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">[2,4]</text>
  <text x="262" y="303" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">−1</text>
  <text x="430" y="303" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">G = G[2,2]·G[3,4] + f[2,3][1]</text>
  <text x="596" y="303" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">2</text>

  <rect x="70" y="310" width="620" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">[1,4]</text>
  <text x="262" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">−1</text>
  <text x="430" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">G = 1·G[2,4] + 1·f[1,3][1]</text>
  <text x="596" y="327" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>

  <path d="M 620 336 L 620 352" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="40" y="354" width="680" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">根在位置 1（右链 1+2=3）：C(3,0)·1·G[2,4] = 2 种；根在位置 4：C(3,3)·f[1,3][1]·1 = 1 种</text>
  <text x="380" y="400" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">三种排列：b = (0,0,0,1) ⇒ [1,2,4,3]；b = (0,0,1,1) ⇒ [1,4,3,2]；b = (0,0,2,1) ⇒ [3,4,2,1]</text>
  <text x="380" y="424" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">根取位置 2 会被 a₂ = 0 一票否决（0 要求左子树为空），根取位置 3 又会碰上 G[4,4] = 0</text>
  <text x="380" y="452" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">need ≥ 0 的非空区间只存 k ≥ 1 的值：k = 0 只有「空区间」才有 1 种，非空区间恒为 0</text>
</svg>
