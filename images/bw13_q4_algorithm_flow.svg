<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：折半 + 卷积 DP（模 10⁹+7）</text>

  <rect x="110" y="54" width="340" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① k = numPeople / 2；f[0] = 1（空圈一种）</text>

  <rect x="110" y="124" width="340" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">② i 从 1 到 k：枚举 1 号握第 2(j+1) 人（j = 0..i−1）</text>
  <path d="M 280 98 L 280 120" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="194" width="340" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">③ f[i] += f[j] × f[i−1−j]，每步取模</text>
  <path d="M 280 168 L 280 190" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="264" width="340" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">④ 返回 f[k]</text>
  <path d="M 280 238 L 280 260" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 前几项 -->
  <g filter="url(#rough2)">
    <rect x="60" y="326" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">前几项：f(2人)=1，f(4人)=2，f(6人)=5，f(8人)=14，f(10人)=42…</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">正是卡特兰数 C₁, C₂, C₃, C₄, C₅（每次都乘法取模防溢出）</text>
</svg>
