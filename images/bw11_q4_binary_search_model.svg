<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：二分「自己那段」的甜度下限 x</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">最大化最小值 → 判定「每段都 ≥ x 可行吗」，判定对 x 单调</text>

  <text x="60" y="80" font-size="12" fill="#333" font-weight="bold">sweetness = [1,2,3,4,5,6,7,8,9]，K = 5（切 6 段）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="92" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="112" y="92" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="164" y="92" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="216" y="92" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="268" y="92" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="320" y="92" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="372" y="92" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="424" y="92" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="476" y="92" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle" font-weight="bold">
    <text x="86" y="114" fill="#3a4a66">1</text>
    <text x="138" y="114" fill="#3a4a66">2</text>
    <text x="190" y="114" fill="#3a5a30">3</text>
    <text x="242" y="114" fill="#3a5a30">4</text>
    <text x="294" y="114" fill="#8a6a20">5</text>
    <text x="346" y="114" fill="#8a6a20">6</text>
    <text x="398" y="114" fill="#8a3a36">7</text>
    <text x="450" y="114" fill="#8a3a36">8</text>
    <text x="502" y="114" fill="#8a3a36">9</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#666">
    <text x="138" y="140">[1,2,3]=6</text>
    <text x="242" y="140">[4,5]=9</text>
    <text x="294" y="140">[6]=6</text>
    <text x="346" y="140">[7]=7</text>
    <text x="398" y="140">[8]=8</text>
    <text x="450" y="140">[9]=9</text>
  </g>
  <text x="300" y="158" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">x = 6 的一种切法：每段 ≥ 6，共 6 段 → 可行</text>

  <rect x="60" y="176" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="290" y="194" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">feasible(x)：贪心切段，段和首次 ≥ x 立刻落刀，数段数</text>
  <text x="290" y="210" text-anchor="middle" font-size="10.5" fill="#777">cnt ≥ K+1 ⇔ 存在每段和 ≥ x 的合法切法（多了可合并相邻段）</text>

  <g filter="url(#rough2)">
    <rect x="80" y="236" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="170" y="236" width="70" height="34" fill="#fff" stroke="#666" stroke-width="1.2" rx="6"/>
    <rect x="260" y="236" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="350" y="236" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <text x="115" y="256" fill="#3a5a30">x=1 ✓</text>
    <text x="205" y="256" fill="#777">x=4 ✓</text>
    <text x="295" y="256" fill="#8a3a36">x=7 ✗</text>
    <text x="395" y="256" fill="#8a6a20">x=6 ✓ ← 答案</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 150 253 L 166 253" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
    <path d="M 240 253 L 256 253" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
    <path d="M 330 253 L 346 253" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
  </g>
  <text x="290" y="288" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">x 增大 ⇒ 段数单调不增 ⇒ 判定呈「真…真 假…假」布局</text>

  <rect x="100" y="300" width="360" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="323" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">答案 = 最大的可行 x（本例为 6）</text>
</svg>
