<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">两步收拢：从 n·m 项到 1 项</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">以示例 1（arr1 = [1,2,3]，arr2 = [6,5]）代入完整演算</text>

  <!-- 第 0 步 -->
  <g filter="url(#sk)">
    <rect x="60" y="60" width="600" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="360" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">第 0 步 · 按 i 分组全部展开 —— 6 = n·m 项</text>
  <text x="360" y="102" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">(1&amp;6) ⊕ (1&amp;5) ⊕ (2&amp;6) ⊕ (2&amp;5) ⊕ (3&amp;6) ⊕ (3&amp;5)</text>
  <path d="M 360,114 L 360,132" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="360" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">① 对 j 收拢：a&amp;6 ⊕ a&amp;5 = a &amp; (6⊕5)，其中 Y = 6⊕5 = 3</text>

  <!-- 第 1 步 -->
  <g filter="url(#sk)">
    <rect x="60" y="158" width="600" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="360" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a1a" filter="url(#sk)">第 1 步 · 同一数组内合并 —— 3 = n 项</text>
  <text x="360" y="200" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">(1&amp;3) ⊕ (2&amp;3) ⊕ (3&amp;3)</text>
  <path d="M 360,212 L 360,230" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="360" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">② 对 i 收拢：(1&amp;3) ⊕ (2&amp;3) ⊕ (3&amp;3) = (1⊕2⊕3) &amp; 3，其中 X = 1⊕2⊕3 = 0</text>

  <!-- 第 2 步 -->
  <g filter="url(#sk)">
    <rect x="60" y="256" width="600" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="360" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">第 2 步 · 收拢完成 —— 1 项</text>
  <text x="360" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">X &amp; Y = 0 &amp; 3 = 0</text>

  <!-- 底部：对照与恒等式 -->
  <g filter="url(#sk)">
    <rect x="50" y="326" width="300" height="88" rx="8" fill="#fdf2f2" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="200" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04038" filter="url(#sk)">项数与运算量对照</text>
  <text x="200" y="368" text-anchor="middle" font-size="10" fill="#a04038" filter="url(#sk)">项数：6 → 3 → 1</text>
  <text x="200" y="386" text-anchor="middle" font-size="10" fill="#8a5048" filter="url(#sk)">n = m = 10⁵ 时：10¹⁰ → 10⁵ → 1</text>
  <text x="200" y="404" text-anchor="middle" font-size="10" fill="#8a5048" filter="url(#sk)">运算：≈10¹⁰ 次 → 2×10⁵ 次 XOR + 1 次 AND</text>
  <g filter="url(#sk)">
    <rect x="370" y="326" width="300" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="520" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a1a" filter="url(#sk)">每步都是同一条恒等式</text>
  <text x="520" y="368" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">(x&amp;y₁) ⊕ (x&amp;y₂) = x &amp; (y₁⊕y₂)</text>
  <text x="520" y="390" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">数值自测：1&amp;6 ⊕ 1&amp;5 = 0⊕1 = 1</text>
  <text x="520" y="406" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">而 1 &amp; (6⊕5) = 1&amp;3 = 1 ✓</text>
  <text x="360" y="432" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">与暴力直接计算 [0,1,2,0,2,1] 的异或和 = 0 完全一致 ✓</text>
</svg>
