<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">相邻 = 上下左右四个方向</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">对角只共享一个顶点，不算相邻——这正是示例 1 里 6 与 11 的分水岭</text>

  <rect x="22" y="66" width="252" height="212" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="148" y="88" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4 邻域：中心格只连上下左右</text>

  <g filter="url(#rough2)">
    <rect x="85" y="104" width="42" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="127" y="104" width="42" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="169" y="104" width="42" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="85" y="146" width="42" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="127" y="146" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="169" y="146" width="42" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="85" y="188" width="42" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="127" y="188" width="42" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="169" y="188" width="42" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#999" text-anchor="middle">
    <text x="106" y="130">×</text>
    <text x="190" y="214">×</text>
  </g>

  <path d="M 148 156 L 148 136" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 148 178 L 148 198" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 137 167 L 117 167" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 159 167 L 179 167" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="148" y="256" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">把中心格入栈后，只检查这 4 个邻居（× 的对角格不看）</text>

  <rect x="292" y="66" width="246" height="212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="415" y="88" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">若按 8 邻域，两块地会被错连</text>

  <g filter="url(#rough2)">
    <rect x="316" y="100" width="30" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="346" y="100" width="30" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="376" y="100" width="30" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="406" y="100" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>

    <rect x="316" y="130" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="346" y="130" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="376" y="130" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="406" y="130" width="30" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>

    <rect x="316" y="160" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="346" y="160" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="376" y="160" width="30" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="406" y="160" width="30" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>

  <path d="M 420 115 L 391 145" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <ellipse cx="406" cy="130" rx="9" ry="9" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="415" y="212" text-anchor="middle" font-size="10" fill="#8a5a20" filter="url(#rough2)">(5,10) 与 (6,9) 只在角上相接</text>
  <text x="415" y="230" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">6 + 5 被误并成 11，而正确答案是 6</text>
  <text x="415" y="252" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">所以连通性只看共享一条边的格子</text>

  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(r,c) 的邻居只有 (r-1,c)、(r+1,c)、(r,c-1)、(r,c+1) 这四个</text>
  <text x="280" y="324" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">岛屿面积 = 该连通块里 1 的个数；最大面积 = 所有连通块大小的最大值</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">题目已保证矩阵四周被 0 包围，因此不必在边界上做特判</text>
</svg>
