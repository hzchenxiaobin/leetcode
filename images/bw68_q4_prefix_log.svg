<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="181"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">log₁₀ 分解：整数部分定位数，小数部分定前缀</text>

  <!-- 科学计数法 -->
  <rect x="60" y="50" width="400" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="14" fill="#2b3d52" filter="url(#rough2)">M = 10^(x + y)，x 整数、y ∈ [0, 1)</text>

  <path d="M 150 100 C 120 122, 105 136, 95 152" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 100 C 400 122, 415 136, 425 152" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrY)" filter="url(#rough2)"/>

  <!-- 左分支：位数 -->
  <rect x="30" y="156" width="180" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="120" y="180" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">x = ⌊logM⌋</text>
  <text x="120" y="202" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">位数 d = x + 1</text>
  <text x="120" y="222" text-anchor="middle" font-size="11" fill="#4a6a3c" filter="url(#rough2)">d ≤ 10 → 整串输出</text>

  <!-- 右分支：前5位 -->
  <rect x="310" y="156" width="180" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="180" text-anchor="middle" font-size="12.5" fill="#8a6d1a" filter="url(#rough2)">y = logM − ⌊logM⌋</text>
  <text x="400" y="202" text-anchor="middle" font-size="12.5" fill="#8a6d1a" filter="url(#rough2)">pre = ⌊10^(y+4)⌋</text>
  <text x="400" y="222" text-anchor="middle" font-size="11" fill="#a3832c" filter="url(#rough2)">真值 ∈ [10⁴, 10⁵) → 钳制兜底</text>

  <!-- 示例数字轴 -->
  <text x="60" y="266" font-size="12" fill="#666" filter="url(#rough2)">例 [1, 10000]：logM ≈ 33160.4547</text>
  <line x1="60" y1="296" x2="460" y2="296" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="180" cy="296" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="180" y="316" text-anchor="middle" font-size="11.5" fill="#2e4d24" filter="url(#rough2)">x = 33160（位数 33161）</text>
  <circle cx="330" cy="296" r="6" fill="#d6a040" filter="url(#rough2)"/>
  <text x="330" y="316" text-anchor="middle" font-size="11.5" fill="#8a6d1a" filter="url(#rough2)">y = 0.4547</text>
  <text x="262" y="285" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">→</text>

  <!-- 结果 -->
  <rect x="95" y="330" width="330" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">10^(0.4547+4) = 28462.3 → pre = 28462</text>
</svg>
