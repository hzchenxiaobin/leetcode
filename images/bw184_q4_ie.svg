<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">「与 v 不互质的元素个数」用质因子容斥算</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">v = 6 = 2 × 3：cnt[2] + cnt[3] − cnt[6]</text>
  <text x="40" y="84" text-anchor="start" font-size="10.5" fill="#333">cntDiv[d] = nums 中被 d 整除的元素个数（调和级数预处理）</text>
  <rect x="60" y="104" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="126" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cntDiv[2]</text>
  <text x="120" y="140" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">= |{4, 6}| = 2</text>
  <rect x="200" y="104" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cntDiv[3]</text>
  <text x="260" y="140" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">= |{3, 6}| = 2</text>
  <rect x="340" y="104" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="126" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">cntDiv[6]</text>
  <text x="415" y="140" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">= |{6}| = 1</text>
  <text x="60" y="182" text-anchor="start" font-size="11" fill="#333" font-weight="bold">容斥：</text>
  <rect x="120" y="162" width="390" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="315" y="186" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">share(6) = cntDiv[2] + cntDiv[3] − cntDiv[6] = 2 + 2 − 1 = 3</text>
  <rect x="40" y="216" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">一般地：share(v) = Σ_{∅ ≠ S ⊆ 质因子(v)} (−1)^{|S|+1} cntDiv[∏ S]</text>
  <rect x="40" y="264" width="230" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="292" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">最大公约数 &gt; 1 ⇔ 共享某个质因子</text>
  <text x="155" y="305" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">所以按质因子容斥即可</text>
  <rect x="290" y="264" width="230" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">v ≤ 1e5 ⇒ 质因子 ≤ 6 个</text>
  <text x="405" y="305" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">子集数 ≤ 63，单次 O(64)</text>
  <rect x="40" y="336" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="355" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">总复杂度 O(maxVal·log maxVal + maxVal·2^6)，maxVal ≤ 1e5</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">注意 share(v) 会把 v 自身（若在 nums 中）也算进去，情形 A 要减 1</text>
</svg>
