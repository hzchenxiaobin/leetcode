<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="500" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查：先算交错和 G(n)，再补奇偶因子 (−1)ⁿ</text>
  <path d="M 160 42 Q 380 48 600 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="40" y="66" font-size="12" fill="#2f4a66" filter="url(#rough2)">① 交错和 G(n) = Σ (−1)j · (n)j（这里取 K = 5，n ≤ 5 都够用）</text>

  <!-- 表 A 表头 -->
  <rect x="36" y="74" width="676" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n</text>
  <text x="118" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(n)0</text>
  <text x="178" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(n)1</text>
  <text x="238" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(n)2</text>
  <text x="298" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(n)3</text>
  <text x="358" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(n)4</text>
  <text x="418" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(n)5</text>
  <text x="486" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">G(n)</text>
  <text x="576" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(−1)ⁿ</text>
  <text x="666" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">D(n)</text>

  <!-- 行 n=2 -->
  <rect x="36" y="104" width="676" height="30" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="118" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="178" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="238" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="298" y="124" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="358" y="124" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="418" y="124" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="486" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="576" y="124" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="666" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <!-- 行 n=3 -->
  <rect x="36" y="134" width="676" height="30" rx="5" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="118" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="178" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="238" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="298" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="358" y="154" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="418" y="154" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="486" y="154" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">−2</text>
  <text x="576" y="154" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">−1</text>
  <text x="666" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2</text>

  <!-- 行 n=4 -->
  <rect x="36" y="164" width="676" height="30" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="118" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="178" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="238" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="298" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">24</text>
  <text x="358" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">24</text>
  <text x="418" y="184" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="486" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">9</text>
  <text x="576" y="184" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="666" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">9</text>

  <!-- 行 n=5 -->
  <rect x="36" y="194" width="676" height="30" rx="5" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="118" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="178" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="238" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">20</text>
  <text x="298" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">60</text>
  <text x="358" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">120</text>
  <text x="418" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">120</text>
  <text x="486" y="214" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">−44</text>
  <text x="576" y="214" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">−1</text>
  <text x="666" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">44</text>

  <text x="380" y="244" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">j &gt; n 的格子恒为 0（含因子 n − n），所以写满定长 K 项也不会多算</text>

  <!-- 表 B -->
  <text x="40" y="276" font-size="12" fill="#6b4a7a" filter="url(#rough2)">② 奇偶因子 M = 1 − 2·[n 为奇数]，用两次 round 各取一半</text>

  <rect x="36" y="284" width="676" height="30" rx="5" fill="#f3e8f7" stroke="#7a4a86" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5c3668" filter="url(#rough2)">n</text>
  <text x="246" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5c3668" filter="url(#rough2)">round(n/2)</text>
  <text x="414" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5c3668" filter="url(#rough2)">round((n−1)/2)</text>
  <text x="550" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5c3668" filter="url(#rough2)">[n 为奇数]</text>
  <text x="664" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5c3668" filter="url(#rough2)">M</text>

  <rect x="36" y="314" width="676" height="28" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="86" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="246" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="414" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="550" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="664" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">+1</text>

  <rect x="36" y="342" width="676" height="28" rx="5" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="86" y="361" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="246" y="361" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="414" y="361" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="550" y="361" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="664" y="361" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">−1</text>

  <rect x="36" y="370" width="676" height="28" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="86" y="389" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="246" y="389" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="414" y="389" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="550" y="389" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="664" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">+1</text>

  <rect x="36" y="398" width="676" height="28" rx="5" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="86" y="417" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="246" y="417" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="414" y="417" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="550" y="417" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="664" y="417" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">−1</text>

  <rect x="36" y="440" width="676" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="374" y="460" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">合成：D(n) = (−1)ⁿ · G(n)。实测输出长度 k=2 → 100，k=3 → 150，k=50 → 3214</text>
  <text x="374" y="478" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">限制是 10000 字符，余量 3 倍以上（题目只要求 k ∈ {2,3,50}）</text>
</svg>
