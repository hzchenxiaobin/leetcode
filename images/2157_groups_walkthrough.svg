<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="540" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：words = ["a","b","ab","cde"]</text>
  <path d="M 170 36 Q 340 44 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: build id table -->
  <g filter="url(#sk)">
    <rect x="60" y="52" width="560" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="340" y="77" text-anchor="middle" font-size="12" fill="#2f4a66">① 建哈希表 id = { 1→"a", 2→"b", 3→"ab", 28→"cde" }，无重复掩码</text>

  <!-- step 2: process a -->
  <g filter="url(#sk)">
    <rect x="60" y="106" width="560" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="340" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e5e1e">② 处理 m = 1（"a"）</text>
  <text x="340" y="150" text-anchor="middle" font-size="11" fill="#3e6a34">添加：1|2 = 3 ✓ → union(a, ab)；替换 a→b：0|2 = 2 ✓ → union(a, b)</text>

  <!-- step 3: process b -->
  <g filter="url(#sk)">
    <rect x="60" y="176" width="560" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
  </g>
  <text x="340" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e5e1e">③ 处理 m = 2（"b"）</text>
  <text x="340" y="220" text-anchor="middle" font-size="11" fill="#3e6a34">添加：2|1 = 3 ✓；替换 b→a：0|1 = 1 ✓（已在同组，union 无事发生）</text>

  <!-- step 4: process ab -->
  <g filter="url(#sk)">
    <rect x="60" y="246" width="560" height="56" fill="#fff" stroke="#9aa8b5" stroke-width="1.4" rx="8" stroke-dasharray="6,4"/>
  </g>
  <text x="340" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">④ 处理 m = 3（"ab"）</text>
  <text x="340" y="290" text-anchor="middle" font-size="11" fill="#777">候选 5, 6, 7, 9, 10, 11, … 全部查不到 —— 无新边</text>

  <!-- step 5: process cde -->
  <g filter="url(#sk)">
    <rect x="60" y="316" width="560" height="56" fill="#fff" stroke="#9aa8b5" stroke-width="1.4" rx="8" stroke-dasharray="6,4"/>
  </g>
  <text x="340" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">⑤ 处理 m = 28（"cde"）</text>
  <text x="340" y="360" text-anchor="middle" font-size="11" fill="#777">候选 25, 26, 29, 30, … 全部查不到 —— 独自成组</text>

  <!-- final groups -->
  <g filter="url(#sk)">
    <rect x="60" y="396" width="380" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="12"/>
  </g>
  <text x="250" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e5e1e">组 1：{ "a", "b", "ab" }</text>
  <text x="250" y="446" text-anchor="middle" font-size="11" fill="#3e6a34">替换（a↔b）、添加（a+b, b+a）互通</text>
  <text x="250" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e5e1e">大小 = 3（最大组）</text>

  <g filter="url(#sk)">
    <rect x="466" y="396" width="154" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="12"/>
  </g>
  <text x="543" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">组 2：{ "cde" }</text>
  <text x="543" y="452" text-anchor="middle" font-size="12" fill="#2f4a66">大小 = 1</text>

  <path d="M 440 444 L 460 444" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="340" y="518" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34">ans = [ 2, 3 ]　（总组数 2，最大组大小 3）</text>
</svg>
