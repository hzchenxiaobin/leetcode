<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：严格递增的移动关系天然是有向无环图（DAG）</text>

  <!-- left: grid with directed edges -->
  <text x="130" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">网格 grid = [[1,1],[3,4]]</text>

  <rect x="62" y="76" width="56" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="108" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="122" y="76" width="56" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="108" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="62" y="132" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="122" y="132" width="56" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>

  <!-- directed edges on grid: small -> large -->
  <path d="M 90 116 L 90 128" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 116 L 150 128" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 158 L 118 158" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- equal values: no edge -->
  <path d="M 108 92 L 118 92" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 110 88 L 116 96" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 116 88 L 110 96" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">红箭头：小 → 大（有边）</text>
  <text x="130" y="216" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值相等 ⇒ 不构成边</text>

  <!-- middle: transform arrow -->
  <path d="M 205 130 L 245 130" fill="none" stroke="#666" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="118" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">建图</text>

  <!-- right: DAG layered -->
  <text x="410" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">按值分层的 DAG</text>

  <!-- layer bands -->
  <rect x="278" y="70" width="70" height="150" fill="#e8f0fe" stroke="none" opacity="0.35" rx="8" filter="url(#rough2)"/>
  <rect x="372" y="70" width="70" height="150" fill="#e6f4ea" stroke="none" opacity="0.45" rx="8" filter="url(#rough2)"/>
  <rect x="466" y="70" width="70" height="150" fill="#fff8e1" stroke="none" opacity="0.6" rx="8" filter="url(#rough2)"/>
  <text x="313" y="236" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">值 = 1</text>
  <text x="407" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">值 = 3</text>
  <text x="501" y="236" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">值 = 4</text>

  <!-- DAG nodes -->
  <circle cx="313" cy="105" r="20" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="313" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">(0,0)</text>
  <circle cx="313" cy="185" r="20" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="313" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">(0,1)</text>
  <circle cx="407" cy="145" r="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="407" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1,0)</text>
  <circle cx="501" cy="145" r="20" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="501" y="150" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold" filter="url(#rough2)">(1,1)</text>

  <!-- DAG edges -->
  <path d="M 330 112 Q 365 122 386 136" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 330 178 Q 420 168 480 152" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 428 145 L 479 145" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- conclusion box -->
  <rect x="48" y="262" width="464" height="118" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">每走一步值严格变大 ⇒ 永远回不到访问过的格子 ⇒ 无环</text>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">「从任意格到任意格的递增路径总数」= DAG 上所有路径总数</text>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">dp(i,j) = 1 + Σ dp(更大的相邻格) ，记忆化一次算清</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（1 = 只含自身的单格路径；按值分层即天然拓扑序）</text>
</svg>
