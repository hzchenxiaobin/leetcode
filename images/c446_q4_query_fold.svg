<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">线段树：单点更新沿链 pull，后缀查询从左到右 fold</text>
  <path d="M 140 35 Q 340 42 540 35" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="656" y="52" text-anchor="end" font-size="10.5" fill="#8a6a1a">每条查询：先 update 后 query，修改永久保留</text>

  <text x="60" y="152" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b03a3a">① 单点更新：改叶 a₂ = v，沿途 pull（父 = 左 ⊗ 右）</text>

  <!-- 普通边 -->
  <g stroke="#b0b0b0" stroke-width="1.3" fill="none" filter="url(#sk)">
    <path d="M186,192 L114,252"/><path d="M186,192 L258,252"/>
    <path d="M114,252 L78,312"/><path d="M114,252 L150,312"/>
    <path d="M258,252 L222,312"/><path d="M258,252 L294,312"/>
    <path d="M78,312 L60,360"/><path d="M78,312 L96,360"/>
    <path d="M150,312 L132,360"/><path d="M150,312 L168,360"/>
    <path d="M222,312 L204,360"/><path d="M222,312 L240,360"/>
    <path d="M294,312 L276,360"/><path d="M294,312 L312,360"/>
  </g>
  <!-- 更新路径（红） -->
  <g stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#sk)">
    <path d="M186,192 L114,252"/><path d="M114,252 L150,312"/><path d="M150,312 L132,360"/>
  </g>

  <!-- 内部节点 -->
  <g filter="url(#sk)">
    <circle cx="186" cy="192" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="114" cy="252" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="150" cy="312" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="258" cy="252" r="9" fill="#f7f7f7" stroke="#999" stroke-width="1.4"/>
    <circle cx="78" cy="312" r="9" fill="#f7f7f7" stroke="#999" stroke-width="1.4"/>
    <circle cx="222" cy="312" r="9" fill="#f7f7f7" stroke="#999" stroke-width="1.4"/>
    <circle cx="294" cy="312" r="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.5"/>
  </g>

  <!-- 叶子 -->
  <g filter="url(#sk)">
    <rect x="47" y="360" width="26" height="24" rx="3" fill="#f7f7f7" stroke="#999" stroke-width="1.3"/>
    <rect x="83" y="360" width="26" height="24" rx="3" fill="#f7f7f7" stroke="#999" stroke-width="1.3"/>
    <rect x="119" y="360" width="26" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="155" y="360" width="26" height="24" rx="3" fill="#f7f7f7" stroke="#999" stroke-width="1.3"/>
    <rect x="191" y="360" width="26" height="24" rx="3" fill="#f7f7f7" stroke="#999" stroke-width="1.3"/>
    <rect x="227" y="360" width="26" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.5"/>
    <rect x="263" y="360" width="26" height="24" rx="3" fill="#f7f7f7" stroke="#999" stroke-width="1.3"/>
    <rect x="299" y="360" width="26" height="24" rx="3" fill="#f7f7f7" stroke="#999" stroke-width="1.3"/>
  </g>
  <g font-size="10" fill="#555" text-anchor="middle">
    <text x="60" y="376">0</text><text x="96" y="376">1</text><text x="132" y="376">2</text>
    <text x="168" y="376">3</text><text x="204" y="376">4</text><text x="240" y="376">5</text>
    <text x="276" y="376">6</text><text x="312" y="376">7</text>
  </g>

  <!-- 后缀括线 -->
  <path d="M 227 400 Q 276 388 325 400" stroke="#4a8edb" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="276" y="416" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8edb">② 后缀 [s, n−1] = [5, 7]</text>
  <text x="276" y="432" text-anchor="middle" font-size="10.5" fill="#4a8edb">规范分解 = 叶[5] ⊗ 节点[6,7]，从左到右</text>

  <!-- 右侧 fold 流程 -->
  <text x="525" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">③ fold：维护 (p, res)，从左到右</text>
  <g filter="url(#sk)">
    <rect x="400" y="80" width="250" height="46" rx="8" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="525" y="100" text-anchor="middle" font-size="11.5" fill="#333">初始化 p = 1，res = 全 0</text>
  <text x="525" y="118" text-anchor="middle" font-size="10" fill="#666">res[x]：已并入前缀中余 x 的个数</text>
  <path d="M 525 128 L 525 138" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="142" width="250" height="62" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="525" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">并入整段覆盖的节点：</text>
  <text x="525" y="178" text-anchor="middle" font-size="11" fill="#333">res[(p·y) mod k] += c_node[y]</text>
  <text x="525" y="196" text-anchor="middle" font-size="11" fill="#333">p ← p · prod_node mod k</text>
  <path d="M 525 206 L 525 216" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="220" width="250" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="525" y="238" text-anchor="middle" font-size="11" fill="#333">依次并入节点 B、C、……（同式）</text>
  <text x="525" y="256" text-anchor="middle" font-size="10" fill="#4a8edb">至多 2⌈log₂ n⌉ 个，顺序天然从左到右</text>
  <path d="M 525 268 L 525 278" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="282" width="250" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="525" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">答案 = res[x]</text>
  <text x="525" y="318" text-anchor="middle" font-size="10" fill="#2e6e2e">对账：Σ res = n − s</text>

  <g filter="url(#sk)">
    <rect x="400" y="342" width="250" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="525" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">⚠ fold 顺序不能乱！</text>
  <text x="525" y="382" text-anchor="middle" font-size="10.5" fill="#b03a3a">⊗ 不满足交换律，只能左前右后</text>

  <!-- 底部复杂度 -->
  <g filter="url(#sk)">
    <rect x="60" y="440" width="600" height="26" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="360" y="458" text-anchor="middle" font-size="11.5" fill="#2e6e2e">复杂度：更新 O(k log n) · 查询 O(k log n) · 合计 O(k(n + q log n))，k=5 时约 2×10⁶</text>
</svg>
