<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="336" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">状态：按「结尾字符」给子序列分组</text>
  <text x="280" y="52" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">设 dp[c] = 以字符 c 结尾的不同非空子序列个数，total = Σ dp[c]</text>
  <rect x="40" y="84" width="70" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="108" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="75" y="132" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">dp[a]</text>
  <rect x="130" y="84" width="70" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="108" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="165" y="132" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">dp[b]</text>
  <rect x="220" y="84" width="70" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="108" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="255" y="132" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">dp[c]</text>
  <text x="345" y="130" text-anchor="middle" font-size="20" fill="#999" filter="url(#rough2)">…</text>
  <rect x="400" y="84" width="70" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="108" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">z</text>
  <text x="435" y="132" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">dp[z]</text>
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">同一结尾字符的所有子序列 = （已有的任意子序列 or 空串）末尾接上 c</text>
  <rect x="80" y="190" width="400" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">关键：新来一个 c 之后，以 c 结尾的子序列集合被整体"覆盖"</text>
  <text x="280" y="236" text-anchor="middle" font-size="11.5" fill="#a9761f" font-weight="bold" filter="url(#rough2)">个数恰为 total + 1（含空串前缀的 1 个 c）</text>
  <rect x="80" y="268" width="400" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">total ← total − dp_old[c] + (total + 1)</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">即 2·total + 1 − dp_old[c]，最后再对 1e9+7 取模</text>
</svg>
