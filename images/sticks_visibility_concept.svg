<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">可见 = 左到右最大值（record）</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#555">位置 i 可见 ⟺ 左侧没有更长的木棍 ⟺ 它刷新了「前缀最大值」纪录</text>

  <g filter="url(#sk)">
    <ellipse cx="62" cy="200" rx="20" ry="12" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
    <circle cx="62" cy="200" r="4.5" fill="#2b2b2b"/>
  </g>
  <text x="62" y="236" text-anchor="middle" font-size="11" fill="#555">从左侧看</text>
  <path d="M 88 200 L 112 200" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 118 316 Q 315 320 512 316" stroke="#b0a894" stroke-width="2.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="140" y="282" width="30" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" rx="3"/>
    <rect x="220" y="214" width="30" height="102" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" rx="3"/>
    <rect x="300" y="248" width="30" height="68" fill="#f2f0e9" stroke="#b0a894" stroke-width="1.3" rx="3"/>
    <rect x="380" y="146" width="30" height="170" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" rx="3"/>
    <rect x="460" y="180" width="30" height="136" fill="#f2f0e9" stroke="#b0a894" stroke-width="1.3" rx="3"/>
  </g>
  <text x="155" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="235" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="315" y="240" text-anchor="middle" font-size="12.5" fill="#999">2</text>
  <text x="395" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="475" y="172" text-anchor="middle" font-size="12.5" fill="#999">4</text>

  <text x="155" y="340" text-anchor="middle" font-size="10.5" fill="#2e6e2e">✓ 可见</text>
  <text x="235" y="340" text-anchor="middle" font-size="10.5" fill="#2e6e2e">✓ 可见</text>
  <text x="315" y="340" text-anchor="middle" font-size="10.5" fill="#a09880">✗ 被 3 挡</text>
  <text x="395" y="340" text-anchor="middle" font-size="10.5" fill="#2e6e2e">✓ 可见</text>
  <text x="475" y="340" text-anchor="middle" font-size="10.5" fill="#a09880">✗ 被 5 挡</text>

  <text x="155" y="360" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">max → 1</text>
  <text x="235" y="360" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">max → 3</text>
  <text x="315" y="360" text-anchor="middle" font-size="10.5" fill="#a09880">max 3</text>
  <text x="395" y="360" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">max → 5</text>
  <text x="475" y="360" text-anchor="middle" font-size="10.5" fill="#a09880">max 5</text>

  <g filter="url(#sk)">
    <rect x="48" y="376" width="544" height="42" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="394" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">可见木棍 = 刷新纪录的位置：1 → 3 → 5，共 3 根</text>
  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#2b6e9e">「恰有 k 根可见」=「恰 k 次刷新前缀最大值」—— 统计 record 数恰为 k 的排列</text>
</svg>
