<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">正难则反：有效子串数 = 总数 − 无效子串数</text>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">设时刻 t 已替换 order[0..t]，下例 n = 9，'*' 落在位置 2 和 5</text>

  <!-- 字符格子：x_i = 113 + 46i -->
  <rect x="113" y="88" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="159" y="88" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="205" y="88" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="228" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">*</text>
  <rect x="251" y="88" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="297" y="88" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="343" y="88" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="366" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">*</text>
  <rect x="389" y="88" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <rect x="435" y="88" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">f</text>
  <rect x="481" y="88" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="504" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">g</text>

  <!-- 下标 -->
  <text x="136" y="148" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="182" y="148" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="228" y="148" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="274" y="148" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="320" y="148" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="366" y="148" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="412" y="148" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="458" y="148" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="504" y="148" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">8</text>

  <!-- 极大无 '*' 段虚线框 -->
  <rect x="108" y="80" width="102" height="60" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <rect x="246" y="80" width="102" height="60" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <rect x="384" y="80" width="148" height="60" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <text x="159" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">L = 2：3 个无效</text>
  <text x="297" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">L = 2：3 个无效</text>
  <text x="458" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">L = 3：6 个无效</text>

  <!-- 公式框 -->
  <rect x="70" y="186" width="500" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">f(t) = n(n+1)/2 − Σ Lᵢ(Lᵢ+1)/2</text>
  <text x="320" y="240" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">= 45 − (3 + 3 + 6) = 33 个有效子串</text>

  <!-- 说明框 -->
  <rect x="70" y="280" width="500" height="94" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6330" filter="url(#rough2)">子串无效 ⟺ 它整段落入某段「极大无 '*' 段」内</text>
  <text x="320" y="330" text-anchor="middle" font-size="11.5" fill="#3d6330" filter="url(#rough2)">长 L 的段内部恰有 L(L+1)/2 个子串（按位置计、不去重）</text>
  <text x="320" y="354" text-anchor="middle" font-size="11.5" fill="#3d6330" filter="url(#rough2)">标记 order[0..t] 后一遍扫描即可，check 只要 O(n)</text>
</svg>
