<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="620" fill="#fafafa"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：XXOX 右端钳制 · XXX 单窗 · OOOO 零操作</text>
  <path d="M 220 42 Q 440 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- band 1: sample 2 -->
  <text x="40" y="84" font-size="12.5" font-weight="bold" fill="#666" filter="url(#rough2)">示例 2（重点：右端钳制）· s = "XXOX" · n = 4 · 输出 2</text>

  <g filter="url(#rough2)">
    <rect x="100" y="94" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="140" y="94" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="180" y="94" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="220" y="94" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="260" y="94" width="40" height="30" rx="4" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="300" y="94" width="40" height="30" rx="4" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="120" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="160" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="200" y="113" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">O</text>
  <text x="240" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="280" y="113" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">✗</text>
  <text x="320" y="113" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">✗</text>
  <text x="352" y="113" font-size="10.5" fill="#b85450" filter="url(#rough2)">越界 ✗</text>

  <text x="120" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="160" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="200" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="240" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="280" y="138" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">4</text>
  <text x="320" y="138" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">5</text>

  <g filter="url(#rough2)">
    <rect x="100" y="152" width="120" height="22" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="160" y="167" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① [0,2]</text>

  <g filter="url(#rough2)">
    <rect x="140" y="184" width="120" height="22" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="200" y="199" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② [1,3]（钳制）</text>

  <g filter="url(#rough2)">
    <rect x="220" y="216" width="120" height="22" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <text x="280" y="231" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">理想 [3,5] ✗ 越界</text>
  <path d="M 222 226 Q 175 238 158 210" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="100" y="268" font-size="10.5" fill="#b85450" filter="url(#rough2)">越界部分不存在 → 窗口左移，钳制为 [n−3, n−1] = [1,3]</text>
  <text x="100" y="286" font-size="10" fill="#777" filter="url(#rough2)">仍是一次操作盖住末尾的 X，ans 照加 1 —— 计数无需特判</text>

  <!-- scan table -->
  <g filter="url(#rough2)">
    <rect x="430" y="96" width="46" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="476" y="96" width="36" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="512" y="96" width="46" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="558" y="96" width="190" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="748" y="96" width="44" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="792" y="96" width="82" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="453" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">步骤</text>
  <text x="494" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i</text>
  <text x="535" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">s[i]</text>
  <text x="653" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">动作</text>
  <text x="770" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans</text>
  <text x="833" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">下一 i</text>

  <g filter="url(#rough2)">
    <rect x="430" y="122" width="46" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="476" y="122" width="36" height="28" rx="3" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/>
    <rect x="512" y="122" width="46" height="28" rx="3" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/>
    <rect x="558" y="122" width="190" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="748" y="122" width="44" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="792" y="122" width="82" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="453" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">①</text>
  <text x="494" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="535" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="653" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">开窗 [0,2]，i 跳到 3</text>
  <text x="770" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="833" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <g filter="url(#rough2)">
    <rect x="430" y="150" width="46" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="476" y="150" width="36" height="28" rx="3" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/>
    <rect x="512" y="150" width="46" height="28" rx="3" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/>
    <rect x="558" y="150" width="190" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="748" y="150" width="44" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="792" y="150" width="82" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="453" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">②</text>
  <text x="494" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="535" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="653" y="168" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[3,5] 越界 → 钳制 [1,3]</text>
  <text x="770" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="833" y="168" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6 ≥ n</text>

  <g filter="url(#rough2)">
    <rect x="430" y="186" width="444" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="652" y="209" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">返回 ans = 2 ✓（与官方输出一致）</text>

  <text x="450" y="272" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">XXOX</text>
  <path d="M 498 268 L 536 268" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="544" y="272" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">OOOX</text>
  <path d="M 592 268 L 630 268" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="638" y="272" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">OOOO</text>
  <text x="510" y="262" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">①</text>
  <text x="604" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">②</text>
  <text x="700" y="272" font-size="10" fill="#888" filter="url(#rough2)">O 保持不变</text>

  <path d="M 40 312 L 840 312" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <!-- band 2: sample 1 -->
  <text x="40" y="348" font-size="12.5" font-weight="bold" fill="#666" filter="url(#rough2)">示例 1 · s = "XXX" · n = 3 · 输出 1</text>
  <g filter="url(#rough2)">
    <rect x="100" y="358" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="140" y="358" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="180" y="358" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="120" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="160" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="200" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="120" y="402" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="160" y="402" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="200" y="402" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)">
    <rect x="100" y="414" width="120" height="22" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="160" y="429" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">[0,2] 一次收工</text>
  <text x="430" y="380" font-size="11" fill="#555" filter="url(#rough2)">i=0：'X' → 开窗 [0,2]，ans=1，i 跳到 3</text>
  <text x="430" y="402" font-size="11" fill="#555" filter="url(#rough2)">i=3 ≥ n=3 → 扫描结束</text>
  <text x="430" y="432" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ ans = 1 ✓</text>

  <path d="M 40 456 L 840 456" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <!-- band 3: sample 3 -->
  <text x="40" y="492" font-size="12.5" font-weight="bold" fill="#666" filter="url(#rough2)">示例 3 · s = "OOOO" · n = 4 · 输出 0</text>
  <g filter="url(#rough2)">
    <rect x="100" y="502" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="140" y="502" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="180" y="502" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="220" y="502" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="120" y="521" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">O</text>
  <text x="160" y="521" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">O</text>
  <text x="200" y="521" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">O</text>
  <text x="240" y="521" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">O</text>
  <text x="120" y="546" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="160" y="546" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="200" y="546" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="240" y="546" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="100" y="572" font-size="10.5" fill="#999" filter="url(#rough2)">全程没有 X，一个窗口都不用开</text>
  <text x="430" y="520" font-size="11" fill="#555" filter="url(#rough2)">i：0→1→2→3→4，一路 'O'</text>
  <text x="430" y="548" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ ans = 0 ✓</text>

  <text x="440" y="606" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">贪心统计的是「要几次操作」，不是「窗口精确落在哪」—— 右端钳制不影响计数</text>
</svg>
