<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrUp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：一个人 = 年份轴上一段左闭右开区间</text>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">出生当年算、死亡当年不算 —— 以某人 [1953, 1958) 为例</text>

  <!-- 存活区间横条 -->
  <rect x="100" y="68" width="296" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">存活区间 [1953, 1958) —— 这 5 年他计入人口</text>

  <!-- 年份标签 -->
  <text x="128" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1953</text>
  <text x="188" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1954</text>
  <text x="248" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1955</text>
  <text x="308" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1956</text>
  <text x="368" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1957</text>
  <text x="428" y="126" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1958</text>

  <!-- 年份格子：活着 1，死亡当年 0 -->
  <rect x="100" y="132" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="132" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="132" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="280" y="132" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="340" y="132" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="400" y="132" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="156" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">该年人口</text>
  <text x="128" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="188" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="248" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="308" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="368" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="428" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- +1 桩：birth 处 -->
  <path d="M 104 128 L 104 104" stroke="#446688" stroke-width="2" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <text x="112" y="112" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">birth 处 +1</text>

  <!-- −1 桩：death 处 -->
  <path d="M 404 176 L 404 202" stroke="#b85450" stroke-width="2" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="396" y="196" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">death 处 −1</text>

  <!-- 前缀和方向 -->
  <path d="M 112 224 L 296 224" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="304" y="228" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">逐年累加（前缀和）</text>
  <text x="200" y="248" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">累到 death（1958）时 +1 与 −1 相抵，人口归 0</text>

  <!-- 说明框 -->
  <rect x="40" y="270" width="440" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#b27a10" filter="url(#rough2)">为什么 −1 打在 death，而不是 death + 1？</text>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">区间右端开着：death−1 是活着的最后一年，death 当年他已退出；</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">前缀和累到 death 恰好把 +1 抵消——这正是「死亡当年不计入」的差分表达</text>
</svg>
