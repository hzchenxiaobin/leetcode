<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">每个区域有两个指标：威胁格数 与 墙数</text>
  <text x="260" y="52" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">按「威胁格数」挑区域，累加的却是「墙数」——两者不能混用</text>

  <!-- 3x3 环形示例 -->
  <rect x="44" y="76" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="84" y="76" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="76" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="44" y="116" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="84" y="116" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="116" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="44" y="156" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="84" y="156" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="156" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <text x="104" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4660" filter="url(#rough2)">0</text>

  <!-- 洞四周的 4 面墙 -->
  <path d="M 84 114 L 124 114" stroke="#b85450" stroke-width="3.4" fill="none" filter="url(#rough2)"/>
  <path d="M 84 158 L 124 158" stroke="#b85450" stroke-width="3.4" fill="none" filter="url(#rough2)"/>
  <path d="M 82 116 L 82 156" stroke="#b85450" stroke-width="3.4" fill="none" filter="url(#rough2)"/>
  <path d="M 126 116 L 126 156" stroke="#b85450" stroke-width="3.4" fill="none" filter="url(#rough2)"/>

  <text x="104" y="216" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">示例 2：8 个感染格围住 1 个空格</text>
  <text x="104" y="234" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">威胁格 1 个，却要 4 面墙</text>

  <!-- 右栏说明 -->
  <rect x="196" y="76" width="280" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="206" y="97" font-size="11.5" fill="#2a4660" filter="url(#rough2)">威胁格数 = frontier 集合大小（必须去重）</text>
  <text x="206" y="116" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">作用：决定「今天先封哪一个区域」</text>

  <rect x="196" y="146" width="280" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="206" y="167" font-size="11.5" fill="#2f5424" filter="url(#rough2)">墙数 = 边界边条数（一条边一面墙）</text>
  <text x="206" y="186" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">作用：累加进答案 ans，是最终输出</text>

  <rect x="196" y="216" width="280" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="206" y="236" font-size="11" fill="#8a6a20" filter="url(#rough2)">一个空格可能同时贴着多个感染格 → 1 格 4 墙；</text>
  <text x="206" y="253" font-size="11" fill="#8a6a20" filter="url(#rough2)">不同区域也可能共享同一个威胁格（示例 3 的 (1,3)）。</text>
  <text x="206" y="272" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">所以两个指标必须分开统计、分别使用。</text>

  <rect x="44" y="294" width="432" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#8a2f28" filter="url(#rough2)">每天：ans += 墙数( argmax 威胁格数 的区域 )，然后把它整块封死</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">题目保证「威胁最大」唯一，因此不需要自己设计并列的裁决规则</text>
</svg>
