<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 322" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="620" height="322" fill="#fafafa"/>
<text x="310" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" filter="url(#roughs)">示例 2：s = "a?a?"，freq_a = 2，其余为 0</text>
<rect x="40" y="46" width="48" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="64" y="73" text-anchor="middle" font-size="16" fill="#333333" font-weight="normal" filter="url(#roughs)">a</text>
<text x="64" y="104" text-anchor="middle" font-size="9" fill="#666" font-weight="normal" filter="url(#roughs)">pos0</text>
<rect x="96" y="46" width="48" height="42" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="120" y="73" text-anchor="middle" font-size="16" fill="#333333" font-weight="normal" filter="url(#roughs)">?</text>
<text x="120" y="104" text-anchor="middle" font-size="9" fill="#666" font-weight="normal" filter="url(#roughs)">pos1</text>
<rect x="152" y="46" width="48" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="176" y="73" text-anchor="middle" font-size="16" fill="#333333" font-weight="normal" filter="url(#roughs)">a</text>
<text x="176" y="104" text-anchor="middle" font-size="9" fill="#666" font-weight="normal" filter="url(#roughs)">pos2</text>
<rect x="208" y="46" width="48" height="42" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="232" y="73" text-anchor="middle" font-size="16" fill="#333333" font-weight="normal" filter="url(#roughs)">?</text>
<text x="232" y="104" text-anchor="middle" font-size="9" fill="#666" font-weight="normal" filter="url(#roughs)">pos3</text>
<rect x="246" y="40" width="358" height="30" rx="6" fill="#f2f2f2" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
<text x="290.0" y="60" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#roughs)">第几个 ?</text>
<text x="380.0" y="60" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#roughs)">堆顶</text>
<text x="475.0" y="60" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#roughs)">取出</text>
<text x="560.0" y="60" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#roughs)">填后频次</text>
<rect x="246" y="72" width="358" height="36" rx="5" fill="#e8f0fe" stroke="#dddddd" stroke-width="1.1" filter="url(#rough2)"/>
<text x="290.0" y="95" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">1</text>
<text x="380.0" y="95" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">(0, b)</text>
<text x="475.0" y="95" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">b</text>
<text x="560.0" y="95" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">b = 1</text>
<rect x="246" y="108" width="358" height="36" rx="5" fill="#fbfbfb" stroke="#dddddd" stroke-width="1.1" filter="url(#rough2)"/>
<text x="290.0" y="131" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">2</text>
<text x="380.0" y="131" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">(0, c)</text>
<text x="475.0" y="131" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">c</text>
<text x="560.0" y="131" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">c = 1</text>
<text x="310" y="178" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" filter="url(#roughs)">收集到 [b, c]，排序后仍为 [b, c]</text>
<path d="M310,190 L310,210" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="40" y="214" width="48" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="64" y="241" text-anchor="middle" font-size="16" fill="#333333" font-weight="normal" filter="url(#roughs)">a</text>
<rect x="96" y="214" width="48" height="42" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="120" y="241" text-anchor="middle" font-size="16" fill="#333333" font-weight="normal" filter="url(#roughs)">b</text>
<rect x="152" y="214" width="48" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="176" y="241" text-anchor="middle" font-size="16" fill="#333333" font-weight="normal" filter="url(#roughs)">a</text>
<rect x="208" y="214" width="48" height="42" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="232" y="241" text-anchor="middle" font-size="16" fill="#333333" font-weight="normal" filter="url(#roughs)">c</text>
<text x="310" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">结果 "abac"：分数 = C(2,2) = 1（两个 a 贡献一对）</text>
<text x="310" y="308" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">若按贪心取出顺序原地填会得到 "acab"，字典序更大</text>
</svg>
