<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">贪心：最早匹配留下最长的剩余后缀</text>
  <text x="260" y="54" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nums 中寻找 group g = [1, −1, −1] 的出现</text>

  <!-- 上排：匹配在最早位置 p' -->
  <text x="40" y="92" font-size="13" fill="#4a7a3a" filter="url(#rough2)">选法 A（贪心）</text>
  <g>
    <rect x="40" y="102" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="82" y="102" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="124" y="102" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="166" y="102" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="208" y="102" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="250" y="102" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="292" y="102" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="334" y="102" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="376" y="102" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="418" y="102" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="61" y="124" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
    <text x="103" y="124" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
    <text x="145" y="124" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
    <text x="187" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
    <text x="229" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
    <text x="271" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
    <text x="313" y="124" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">·</text>
    <text x="355" y="124" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">·</text>
    <text x="397" y="124" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">·</text>
    <text x="439" y="124" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">·</text>
  </g>
  <path d="M292,140 L292,152 L460,152 L460,146" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="168" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">后续组的可用区间更长 ✓</text>

  <path d="M240,178 Q240,192 240,206" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="196" font-size="11.5" fill="#888" filter="url(#rough2)">对比</text>

  <!-- 下排：匹配在更晚位置 p -->
  <text x="40" y="232" font-size="13" fill="#b85450" filter="url(#rough2)">选法 B（可行但不优）</text>
  <g>
    <rect x="40" y="242" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="82" y="242" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="124" y="242" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="166" y="242" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="208" y="242" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="250" y="242" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="292" y="242" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
    <rect x="334" y="242" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
    <rect x="376" y="242" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
    <rect x="418" y="242" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="61" y="264" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
    <text x="103" y="264" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
    <text x="145" y="264" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
    <text x="187" y="264" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
    <text x="229" y="264" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
    <text x="271" y="264" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
    <text x="313" y="264" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
    <text x="355" y="264" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>
    <text x="397" y="264" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>
    <text x="439" y="264" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">·</text>
  </g>
  <path d="M376,280 L376,292 L460,292 L460,286" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="408" y="308" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">可用区间被白白压短 ✗</text>

  <rect x="60" y="318" width="400" height="36" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">剩余区间只增不减 → 方案 B 能继续，方案 A 必然也能</text>
</svg>
