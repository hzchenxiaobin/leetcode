<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa" filter="url(#rough2)"/>
  <text x="280" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：回溯枚举 4 位数字 → 过滤 → 环上取最小正差</text>

  <!-- 第一行 -->
  <rect x="30" y="60" width="152" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="106" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 取可用数字集合</text>
  <text x="106" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">D = {1, 3, 4, 9}</text>

  <path d="M182,89 L202,89" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="205" y="60" width="152" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="281" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 回溯枚举 HHMM</text>
  <text x="281" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">|D|⁴ ≤ 256 个组合</text>

  <path d="M357,89 L377,89" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="380" y="60" width="152" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 过滤非法组合</text>
  <text x="456" y="104" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">HH ≥ 24 或 MM ≥ 60</text>

  <path d="M456,118 L456,158" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="324" y="160" width="208" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ Δ = (t − start + 1440) mod 1440</text>
  <text x="428" y="206" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">Δ = 0 记作 1440（次日同一时刻）</text>

  <path d="M324,191 L292,191" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="108" y="160" width="182" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="199" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ 取 Δ 最小的候选</text>
  <text x="199" y="206" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">即严格晚于现在的最近时刻</text>

  <path d="M199,222 L199,262" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="108" y="264" width="182" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="199" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输出 "19:39"</text>
  <text x="199" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">Δ = 5 分钟，最小</text>

  <text x="30" y="345" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">注：若输入 23:59（start = 1439），全部候选都更早，只能绕到次日，最小 Δ 落在 22:22。</text>
</svg>
