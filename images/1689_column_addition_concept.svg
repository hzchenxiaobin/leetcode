<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：竖式逐列看，每个数在每列至多贡献 1</text>
  <path d="M 130 44 Q 320 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: vertical addition -->
  <g filter="url(#sk)">
    <rect x="36" y="64" width="300" height="232" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="186" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">竖式：32 = 10 + 11 + 11</text>
  <text x="141" y="106" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#sk)">十位</text>
  <text x="193" y="106" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#sk)">个位</text>

  <g filter="url(#sk)">
    <rect x="120" y="112" width="42" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="172" y="112" width="42" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="141" y="131" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">1</text>
  <text x="193" y="131" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">0</text>

  <g filter="url(#sk)">
    <rect x="120" y="146" width="42" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="172" y="146" width="42" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="141" y="165" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">1</text>
  <text x="193" y="165" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">1</text>

  <text x="102" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">+</text>
  <g filter="url(#sk)">
    <rect x="120" y="180" width="42" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="172" y="180" width="42" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="141" y="199" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">1</text>
  <text x="193" y="199" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">1</text>

  <path d="M 112 219 Q 168 225 224 219" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="120" y="226" width="42" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="172" y="226" width="42" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="141" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e24" filter="url(#sk)">3</text>
  <text x="193" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e24" filter="url(#sk)">2</text>

  <text x="186" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">十位：1+1+1 = 3 ← 该列要 3 个数</text>
  <text x="186" y="292" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#sk)">个位：0+1+1 = 2</text>

  <!-- right: per-column rules -->
  <g filter="url(#sk)">
    <rect x="356" y="64" width="248" height="232" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="480" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415" filter="url(#sk)">逐列的规则</text>
  <text x="480" y="116" text-anchor="middle" font-size="12" fill="#555555" filter="url(#sk)">每个数每列贡献 0 或 1</text>
  <text x="480" y="140" text-anchor="middle" font-size="12" fill="#555555" filter="url(#sk)">列和 ≤ 9 ⇒ 永不进位</text>
  <text x="480" y="164" text-anchor="middle" font-size="12" fill="#555555" filter="url(#sk)">和的第 i 位 = 该列 1 的个数</text>
  <text x="480" y="188" text-anchor="middle" font-size="12" fill="#555555" filter="url(#sk)">数位 d ⇒ 该列至少 d 个数</text>
  <text x="480" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">瓶颈 = 最大数位 d*</text>
  <g filter="url(#sk)">
    <rect x="376" y="230" width="208" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="480" y="258" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#sk)">答案 ≥ 最大数位 d*</text>

  <!-- bottom strip -->
  <g filter="url(#sk)">
    <rect x="36" y="312" width="568" height="72" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="320" y="338" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">两边一夹（下界 + 构造上界）：答案 = 最大数位</text>
  <text x="320" y="364" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#sk)">32 → 最大数位 3 ⇒ 10 + 11 + 11；代码即 max(n) 一次扫描</text>
</svg>
