<svg xmlns="http://www.w3.org/2000/svg" width="660" height="478" viewBox="0 0 660 478" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="478" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">记忆化 DFS：每个节点只算一次，沿边合并答案</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="75.0" y="47.0" width="350" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="66.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">建反图：rich[b] 里放 a</text>
  <text x="250" y="81.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">（a 比 b 有钱，a 是 b 的直接前驱）</text>
  <g filter="url(#sk2)"><rect x="75.0" y="113.0" width="350" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="140.1" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">对每个 x 调用 dfs(x)</text>
  <g filter="url(#sk2)"><rect x="75.0" y="173.0" width="350" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="192.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">ans[x] 已算过？</text>
  <text x="250" y="207.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">是 → 直接返回（记忆化）</text>
  <g filter="url(#sk2)"><rect x="75.0" y="239.0" width="350" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="266.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">ans[x] = x（至少包含自己）</text>
  <g filter="url(#sk2)"><rect x="75.0" y="303.0" width="350" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="330.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">对每个 a ∈ rich[x]：cand = dfs(a)</text>
  <g filter="url(#sk2)"><rect x="75.0" y="363.0" width="350" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="390.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">quiet[cand] &lt; quiet[ans[x]] → ans[x] = cand</text>
  <path d="M 250 94 L 250 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 160 L 250 172" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 220 L 250 238" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 286 L 250 302" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 350 L 250 362" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 75 386 L 56 386 L 56 136 L 73 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="50" y="270" text-anchor="end" font-size="10" fill="#446688">下一个 x</text>
  <path d="M 250 410 L 250 428" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="90.0" y="429.0" width="320" height="34" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="250" y="450.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e22">所有 x 算完 → 返回 ans 数组</text>
</svg>
