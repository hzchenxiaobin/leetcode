<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：第 3 组三元组出现异号</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">A(0,0) → B(0,10) → C(10,10) → D(10,0) → E(5,5)，E 点向内凹</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="30" y="66" width="580" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="50" y="88" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">i</text>
    <text x="145" y="88" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">顶点三元组</text>
    <text x="310" y="88" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">两条边向量</text>
    <text x="434" y="88" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">cross</text>
    <text x="530" y="88" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">符号与判定</text>
  </g>

  <!-- row 0 -->
  <g filter="url(#rough2)">
    <rect x="30" y="102" width="580" height="38" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <text x="50" y="126" text-anchor="middle" font-size="10.5" fill="#555">0</text>
    <text x="145" y="126" text-anchor="middle" font-size="10.5" fill="#555">A→B→C</text>
    <text x="310" y="126" text-anchor="middle" font-size="10.5" fill="#555">(0,10) × (10,0)</text>
    <text x="434" y="126" text-anchor="middle" font-size="10.5" fill="#b85450">−100</text>
    <text x="530" y="126" text-anchor="middle" font-size="10" fill="#555">记录 sign = −1</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#rough2)">
    <rect x="30" y="142" width="580" height="38" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <text x="50" y="166" text-anchor="middle" font-size="10.5" fill="#555">1</text>
    <text x="145" y="166" text-anchor="middle" font-size="10.5" fill="#555">B→C→D</text>
    <text x="310" y="166" text-anchor="middle" font-size="10.5" fill="#555">(10,0) × (0,−10)</text>
    <text x="434" y="166" text-anchor="middle" font-size="10.5" fill="#b85450">−100</text>
    <text x="530" y="166" text-anchor="middle" font-size="10" fill="#555">同号，继续</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#rough2)">
    <rect x="30" y="182" width="580" height="38" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <text x="50" y="206" text-anchor="middle" font-size="10.5" fill="#555">2</text>
    <text x="145" y="206" text-anchor="middle" font-size="10.5" fill="#555">C→D→E</text>
    <text x="310" y="206" text-anchor="middle" font-size="10.5" fill="#555">(0,−10) × (−5,5)</text>
    <text x="434" y="206" text-anchor="middle" font-size="10.5" fill="#b85450">−50</text>
    <text x="530" y="206" text-anchor="middle" font-size="10" fill="#555">同号，继续</text>
  </g>

  <!-- row 3 高亮 -->
  <g filter="url(#rough2)">
    <rect x="30" y="222" width="580" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="50" y="246" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">3</text>
    <text x="145" y="246" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">D→E→A</text>
    <text x="310" y="246" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">(−5,5) × (−5,−5)</text>
    <text x="434" y="246" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">+50</text>
    <text x="530" y="246" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold">异号 ⇒ 返回 false</text>
  </g>

  <!-- row 4 -->
  <g filter="url(#rough2)">
    <rect x="30" y="262" width="580" height="38" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <text x="50" y="286" text-anchor="middle" font-size="10.5" fill="#555">4</text>
    <text x="145" y="286" text-anchor="middle" font-size="10.5" fill="#555">E→A→B</text>
    <text x="310" y="286" text-anchor="middle" font-size="10.5" fill="#555">(−5,−5) × (0,10)</text>
    <text x="434" y="286" text-anchor="middle" font-size="10.5" fill="#b85450">−50</text>
    <text x="530" y="286" text-anchor="middle" font-size="10" fill="#777">已提前返回，不再执行</text>
  </g>

  <path d="M 470 241 L 456 241" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="30" y="312" width="580" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="48" y="332" font-size="10.5" fill="#3a5a30" font-weight="bold">对照示例 1（正方形 [0,0] [0,5] [5,5] [5,0]）</text>
    <text x="48" y="352" font-size="10.5" fill="#555">cross 序列 = −25, −25, −25, −25：全部同号，扫描到底无冲突 ⇒ 返回 true</text>
  </g>

  <text x="320" y="372" text-anchor="middle" font-size="9.5" fill="#999">只需要比较符号，不关心叉积的具体数值大小</text>
</svg>
