<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="860" height="390" fill="#fafafa"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一趟扫描：空格缝比对 + 首尾环绕缝比对</text>
  <path d="M 240 42 Q 430 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 字符格子 sentence = "ab ba" -->
  <rect x="150" y="80" width="56" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="206" y="80" width="56" height="50" rx="4" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="262" y="80" width="56" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="318" y="80" width="56" height="50" rx="4" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="374" y="80" width="56" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="178" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <text x="234" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <text x="290" y="111" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040" filter="url(#rough2)">␣</text>
  <text x="346" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <text x="402" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>

  <!-- 串说明与下标标注 -->
  <text x="178" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">s[0]</text>
  <text x="402" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">s[n-1]</text>
  <text x="290" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">i = 2</text>
  <path d="M 290 54 L 290 76" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="150" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">sentence = "ab ba"：空格左右必是相邻单词的尾与首</text>

  <!-- 空格缝比对 -->
  <path d="M 290 128 L 290 156" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="158" width="420" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">空格缝：s[i-1]='b' == s[i+1]='b' ✓</text>
  <text x="300" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">（左邻 = 前一词的尾字符，右邻 = 后一词的首字符）</text>

  <!-- 环绕缝比对 -->
  <path d="M 300 220 L 300 246" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="248" width="420" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">环绕缝：s[0]='a' == s[n-1]='a' ✓</text>
  <text x="300" y="294" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">（串首 = 首词首字符，串尾 = 末词尾字符）</text>

  <!-- 易错点红框 -->
  <rect x="550" y="158" width="260" height="152" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="680" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">易错：大小写敏感</text>
  <text x="680" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">"Leetcode"</text>
  <text x="680" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">首 'L' ≠ 尾 'e' → false</text>
  <text x="680" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">'A' 与 'a' 也不同</text>
  <text x="680" y="290" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">"I like Leetcode" 同理出局</text>

  <!-- 底部结论 -->
  <rect x="90" y="328" width="720" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">判定：每个空格处 s[i-1]==s[i+1] 且 s[0]==s[n-1]</text>
  <text x="450" y="368" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">时间 O(n) · 额外空间 O(1) · 无需构造单词表</text>
</svg>
