<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="356" fill="#fafafa"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：排序后逐个比对 prev + "/"</text>
  <text x="380" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">输入 ["/a","/a/b","/c/d","/c/d/e","/c/f"]，恰好已有序</text>

  <rect x="30" y="62" width="700" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="55" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="150" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">folder[i]</text>
  <text x="275" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">prev（队尾）</text>
  <text x="385" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">prev + "/"</text>
  <text x="470" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">匹配</text>
  <text x="560" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="675" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="30" y="96" width="700" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="120" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="150" y="120" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">/a</text>
  <text x="275" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">—（初始）</text>
  <text x="385" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">—</text>
  <text x="470" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">—</text>
  <text x="560" y="120" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">保留，prev=/a</text>
  <text x="675" y="120" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">[/a]</text>

  <rect x="30" y="134" width="700" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="158" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="158" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">/a/b</text>
  <text x="275" y="158" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">/a</text>
  <text x="385" y="158" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">/a/</text>
  <text x="470" y="158" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">✓</text>
  <text x="560" y="158" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">跳过</text>
  <text x="675" y="158" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">[/a]</text>

  <rect x="30" y="172" width="700" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="196" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="150" y="196" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">/c/d</text>
  <text x="275" y="196" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">/a</text>
  <text x="385" y="196" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">/a/</text>
  <text x="470" y="196" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">✗</text>
  <text x="560" y="196" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">保留，prev=/c/d</text>
  <text x="675" y="196" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">[/a,/c/d]</text>

  <rect x="30" y="210" width="700" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="234" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="150" y="234" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">/c/d/e</text>
  <text x="275" y="234" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">/c/d</text>
  <text x="385" y="234" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">/c/d/</text>
  <text x="470" y="234" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">✓</text>
  <text x="560" y="234" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">跳过</text>
  <text x="675" y="234" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">[/a,/c/d]</text>

  <rect x="30" y="248" width="700" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="272" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="150" y="272" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">/c/f</text>
  <text x="275" y="272" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">/c/d</text>
  <text x="385" y="272" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">/c/d/</text>
  <text x="470" y="272" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">✗</text>
  <text x="560" y="272" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">保留（结束）</text>
  <text x="675" y="272" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">[/a,/c/d,/c/f]</text>

  <path d="M 86 62 V 286 M 220 62 V 286 M 340 62 V 286 M 440 62 V 286 M 520 62 V 286 M 640 62 V 286" stroke="#c9d2e0" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="380" y="308" text-anchor="middle" font-size="9.5" fill="#8a5a20" filter="url(#rough2)">第 2 步 /c/d 不匹配 /a/ → 说明已走出 /a 的子树，换 prev；第 4 步 /c/f 与 /c/d/ 在末位失配，同理保留</text>
  <text x="380" y="330" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">对照示例 3：/a/b/ca 对前缀 /a/b/c/ 在第 7 位失配（a ≠ /），因此不会被误删</text>
</svg>
