<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：[10,20) → [15,25) → [20,30) → [20,30)</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每次只看 lower_bound 定位点的「前驱」与「自身」，端点相接视为不重叠</text>

  <rect x="40" y="68" width="580" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">调用</text>
  <text x="275" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">判定过程（两次比较）</text>
  <text x="465" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">集合（按起点升序）</text>
  <text x="580" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">返回</text>

  <rect x="40" y="104" width="580" height="58" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="138" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">book(10,20)</text>
  <text x="275" y="138" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">集合为空 → 直接插入</text>
  <text x="465" y="138" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[10,20)</text>
  <text x="580" y="138" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <rect x="40" y="162" width="580" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="196" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">book(15,25)</text>
  <text x="275" y="190" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">右邻无（i 落在末尾）</text>
  <text x="275" y="208" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">左邻 end=20 &gt; s=15 → 冲突</text>
  <text x="465" y="196" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[10,20)</text>
  <text x="580" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <rect x="40" y="220" width="580" height="58" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="254" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">book(20,30)</text>
  <text x="275" y="248" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">右邻无，左邻只是端点相接</text>
  <text x="275" y="266" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">end=20 ≤ s=20 → 插入</text>
  <text x="465" y="254" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[10,20) [20,30)</text>
  <text x="580" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <rect x="40" y="278" width="580" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="312" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">book(20,30)</text>
  <text x="275" y="306" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">右邻命中已存在的 [20,30)</text>
  <text x="275" y="324" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">start=20 &lt; e=30 → 冲突</text>
  <text x="465" y="312" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[10,20) [20,30)</text>
  <text x="580" y="312" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <path d="M 40 104 L 620 104" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 40 162 L 620 162" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 220 L 620 220" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 278 L 620 278" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 336 L 620 336" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 160 68 L 160 336" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 390 68 L 390 336" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 540 68 L 540 336" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <text x="320" y="358" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">前两次调用都在「末尾」定位：i = len(starts)，故只检查前驱；第 4 次调用直接命中同一个键。</text>
  <text x="320" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">被拒绝的区间绝不写入集合，否则「两两不相交」不变式被破坏。</text>
</svg>
