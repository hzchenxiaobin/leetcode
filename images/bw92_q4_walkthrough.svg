<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "103301"（两个 "10301"）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">只有中心取两个 '3'（下标 2 和 3）时有贡献，各贡献 1</text>

  <g filter="url(#rough2)">
    <rect x="50" y="70" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="110" y="70" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="170" y="70" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="230" y="70" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="290" y="70" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="350" y="70" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <text x="80" y="98" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <text x="140" y="98" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>
  <text x="200" y="98" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">3</text>
  <text x="260" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="320" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="380" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="80" y="130" text-anchor="middle" font-size="10" fill="#999">下标 0</text>
  <text x="140" y="130" text-anchor="middle" font-size="10" fill="#999">下标 1</text>
  <text x="200" y="130" text-anchor="middle" font-size="10" fill="#d6a040">下标 2（中心）</text>
  <text x="260" y="130" text-anchor="middle" font-size="10" fill="#999">下标 3</text>
  <text x="320" y="130" text-anchor="middle" font-size="10" fill="#999">下标 4</text>
  <text x="380" y="130" text-anchor="middle" font-size="10" fill="#999">下标 5</text>

  <rect x="50" y="150" width="230" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="165" y="172" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">中心 = 下标 2（'3'）</text>
  <text x="165" y="192" text-anchor="middle" font-size="10.5" fill="#555">左 "10"：pre2[1][0] = 1</text>
  <text x="165" y="210" text-anchor="middle" font-size="10.5" fill="#555">右 "301"：suf2[0][1] = 1</text>
  <text x="165" y="226" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">贡献 1×1 = 1（"10301"）</text>

  <rect x="300" y="150" width="230" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="415" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">中心 = 下标 3（'3'）</text>
  <text x="415" y="192" text-anchor="middle" font-size="10.5" fill="#555">左 "103"：pre2[1][0] = 1</text>
  <text x="415" y="210" text-anchor="middle" font-size="10.5" fill="#555">右 "01"：suf2[0][1] = 1</text>
  <text x="415" y="226" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">贡献 1×1 = 1（"10301"）</text>

  <rect x="50" y="244" width="480" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">其余中心贡献为 0：例如中心 = 下标 1（'0'）时左侧只有 "1"，凑不出字符对</text>
  <text x="290" y="286" text-anchor="middle" font-size="10.5" fill="#555">答案 = 1 + 1 = 2 ✓（两个 "10301" 的下标集分别为 {0,1,2,4,5} 与 {0,1,3,4,5}）</text>

  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">对照示例 2："0000000"：任取 5 个位置都是 "00000"，C(7,5) = 21 ✓</text>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">对照示例 3："9999900000"：只有 "99999"（前 5 个 9）与 "00000"（后 5 个 0）✓</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999">计数对象是「下标集合」（子序列），相同内容的子序列按位置不同分别计数</text>
</svg>
