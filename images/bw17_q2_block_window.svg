<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="112"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">answer[1][1] 的窗口：k=1 的 3×3 邻域（示例 1）</text>

  <!-- 3x3 mat -->
  <g filter="url(#rough2)">
    <rect x="170" y="60" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="238" y="60" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="306" y="60" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="170" y="116" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="238" y="116" width="64" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="306" y="116" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="170" y="172" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="238" y="172" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="306" y="172" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="202" y="92" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="270" y="92" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="338" y="92" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="202" y="148" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="270" y="148" text-anchor="middle" font-size="15" fill="#8a6a20" filter="url(#rough2)">5</text>
  <text x="338" y="148" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="202" y="204" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <text x="270" y="204" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <text x="338" y="204" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">9</text>
  <text x="270" y="248" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">(i,j) = (1,1)：窗口 = 整个 3×3</text>

  <!-- 结果说明 -->
  <rect x="440" y="70" width="176" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="528" y="98" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">answer[1][1] = 45</text>
  <text x="528" y="124" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1+2+…+9 = 45</text>
  <text x="528" y="148" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">中心在内部：</text>
  <text x="528" y="166" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">窗口完整，无裁剪</text>

  <!-- 角格 -->
  <text x="100" y="80" font-size="12.5" fill="#666" filter="url(#rough2)">对比角格</text>
  <text x="100" y="100" font-size="12.5" fill="#666" filter="url(#rough2)">(0,0)：</text>
  <text x="100" y="120" font-size="12" fill="#b85450" filter="url(#rough2)">窗口 [−1..1]×[−1..1]</text>
  <text x="100" y="138" font-size="12" fill="#b85450" filter="url(#rough2)">裁成 [0..1]×[0..1]</text>
  <text x="100" y="158" font-size="12" fill="#b85450" filter="url(#rough2)">= 1+2+4+5 = 12</text>

  <!-- 底部公式 -->
  <rect x="100" y="276" width="440" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="295" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">k=2 时所有窗口都被裁成整张 3×3 矩阵，</text>
  <text x="320" y="313" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">于是 answer 每格都是 45（示例 2）</text>
</svg>
