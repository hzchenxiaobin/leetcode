<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">状态图：点 = 一个排列，边 = 一次移动</text>
  <text x="340" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6! = 720 个排列，最远 21 步；从目标态反向 BFS 一次建表，查表即答案</text>

  <rect x="40" y="76" width="80" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#33552a" filter="url(#rough2)">dist 0</text>
  <text x="80" y="126" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">1 个（目标）</text>

  <path d="M 122 111 L 134 111" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="136" y="76" width="80" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="176" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">dist 1</text>
  <text x="176" y="126" text-anchor="middle" font-size="9.5" fill="#6b7a8f" filter="url(#rough2)">2 个状态</text>

  <path d="M 218 111 L 230 111" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="232" y="76" width="80" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="272" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">dist 2</text>
  <text x="272" y="126" text-anchor="middle" font-size="9.5" fill="#6b7a8f" filter="url(#rough2)">3 个状态</text>

  <path d="M 314 111 L 326 111" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="328" y="76" width="80" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="368" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">dist 3</text>
  <text x="368" y="126" text-anchor="middle" font-size="9.5" fill="#6b7a8f" filter="url(#rough2)">5 个状态</text>

  <path d="M 410 111 L 422 111" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="424" y="76" width="80" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="464" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">dist 4</text>
  <text x="464" y="126" text-anchor="middle" font-size="9.5" fill="#6b7a8f" filter="url(#rough2)">6 个状态</text>

  <path d="M 506 111 L 518 111" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="520" y="76" width="80" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="560" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">dist 5</text>
  <text x="560" y="126" text-anchor="middle" font-size="9.5" fill="#6b7a8f" filter="url(#rough2)">7 个状态</text>

  <text x="624" y="104" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">…</text>
  <text x="624" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">直到 21 层</text>

  <rect x="40" y="162" width="600" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="184" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">为什么只有 360 个状态可解：一个奇偶不变量</text>
  <text x="60" y="206" font-size="10" fill="#7a6220" filter="url(#rough2)">去掉 0，把 1..5 按出现顺序排成一列，看它的逆序数奇偶性</text>
  <text x="60" y="226" font-size="10" fill="#7a6220" filter="url(#rough2)">左右移动 0：这列的顺序完全不变 → 奇偶性不变</text>
  <text x="60" y="246" font-size="10" fill="#7a6220" filter="url(#rough2)">上下移动 0：被换的数字跨过 2 个数字 = 2 次交换 → 奇偶性也不变</text>
  <text x="60" y="266" font-size="10" fill="#7a6220" filter="url(#rough2)">于是 720 个排列被劈成两半：偶排列 360 个可达，奇排列 360 个一律无解</text>

  <rect x="40" y="290" width="600" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="314" font-size="10" fill="#33552a" filter="url(#rough2)">示例 3 起点 (4,1,2,5,0,3) → 去掉 0 得 4,1,2,5,3，逆序数 4（偶）→ 可解，答案 5</text>
  <text x="60" y="336" font-size="10" fill="#33552a" filter="url(#rough2)">示例 2 起点 (1,2,3,5,4,0) → 去掉 0 得 1,2,3,5,4，逆序数 1（奇）→ 必然 -1</text>
  <text x="60" y="358" font-size="10" fill="#4a7a3a" filter="url(#rough2)">代码里不必真的判奇偶：反向 BFS 到不了的状态，查表自然落到 -1</text>
</svg>
