<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="424" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">贡献法：以支配元素 k 为主元，子数组归给最左最大值</text>
  <path d="M 130 42 Q 320 50 510 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="356" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">k = 2（支配元素）</text>
  <g filter="url(#rough2)">
    <rect x="184" y="78" width="56" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <rect x="256" y="78" width="56" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <rect x="328" y="78" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="400" y="78" width="56" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="212" y="106" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="284" y="106" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="356" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10" filter="url(#rough2)">3</text>
  <text x="428" y="106" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="212" y="140" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下标 0</text>
  <text x="284" y="140" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下标 1</text>
  <text x="356" y="140" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">下标 2</text>
  <text x="428" y="140" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下标 3</text>

  <path d="M 324 158 L 252 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="212" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04040" filter="url(#rough2)">相等 3 → 阻断 ✗</text>
  <text x="212" y="194" text-anchor="middle" font-size="11" fill="#a04040" filter="url(#rough2)">L(2) = 0</text>
  <text x="284" y="186" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">1 ⊂ 3 ✓ 通过</text>

  <path d="M 388 158 L 512 158" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="186" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">2 ⊆ 3 ✓ 通过</text>
  <g filter="url(#rough2)">
    <rect x="520" y="150" width="5" height="26" fill="none" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="562" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">右侧无阻断</text>
  <text x="562" y="188" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">R(2) = 4 = n</text>

  <g filter="url(#rough2)">
    <rect x="22" y="210" width="596" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">左端点 i ∈ {1, 2}（2 个）× 右端点 j ∈ {2, 3}（2 个）</text>
  <text x="320" y="258" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">贡献 = (k − L) × (R − k) = (2−0) × (4−2) = 4</text>
  <text x="320" y="278" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">得到 4 个好子数组：[1,3] · [1,3,2] · [3] · [3,2]，都以 k=2 为最左最大值</text>

  <g filter="url(#rough2)">
    <rect x="22" y="300" width="596" height="106" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">为什么左右阻断规则不对称？</text>
  <text x="320" y="346" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">若 k₁ &lt; k₂ 支配同一子数组，则它们互相包含 → 必有 nums[k₁] = nums[k₂]</text>
  <text x="320" y="366" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">把子数组统一归给最左的 k₁：左侧把「相等」也视为阻断，右侧只看「非子掩码」</text>
  <text x="320" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">→ 每个好子数组恰好被计数一次（不重不漏）</text>
</svg>
