<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟入桶 + 一趟过滤加权</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="200" y="56" width="240" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="81" text-anchor="middle" font-size="13.5" fill="#2b4a6e">① cnt[101] = 0，ans = 0</text>

  <path d="M 320 100 L 320 122" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="200" y="126" width="240" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="151" text-anchor="middle" font-size="13.5" fill="#2b4a6e">② 遍历 nums：cnt[x] += 1（O(n)）</text>

  <path d="M 320 170 L 320 192" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3: loop over value domain -->
  <g filter="url(#sk)">
    <rect x="200" y="196" width="240" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="221" text-anchor="middle" font-size="13.5" fill="#2e5e22">③ x = 1 → 100 逐桶检查</text>

  <path d="M 320 240 L 320 264" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- exit path from loop -->
  <path d="M 440 216 L 606 216 L 606 399 L 461 399" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="598" y="340" text-anchor="end" font-size="10.5" fill="#8a8a8a">x 扫完</text>

  <!-- diamond -->
  <g filter="url(#sk)">
    <polygon points="320,268 405,306 320,344 235,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">cnt[x] % k == 0 ?</text>

  <!-- yes branch -->
  <path d="M 405 306 L 441 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="423" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="445" y="286" width="148" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="519" y="311" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-weight="bold">ans += x × cnt[x]</text>

  <!-- loop back from yes -->
  <path d="M 519 284 Q 519 230 340 242 L 324 258" stroke="#8a8a8a" stroke-width="1.4"
        fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="422" y="232" text-anchor="middle" font-size="10.5" fill="#8a8a8a">下一个 x</text>

  <!-- no branch -->
  <path d="M 235 306 L 199 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="217" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="45" y="286" width="150" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="120" y="311" text-anchor="middle" font-size="12.5" fill="#8e3a34">跳过该桶（不加）</text>

  <!-- loop back from no -->
  <path d="M 120 284 Q 120 230 300 242 L 317 258" stroke="#8a8a8a" stroke-width="1.4"
        fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="218" y="232" text-anchor="middle" font-size="10.5" fill="#8a8a8a">下一个 x</text>

  <!-- return -->
  <g filter="url(#sk)">
    <rect x="185" y="378" width="270" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="404" text-anchor="middle" font-size="14" fill="#8e3a34" font-weight="bold">④ return ans（无命中恒为 0）</text>

  <text x="320" y="442" text-anchor="middle" font-size="11" fill="#888">两趟线性扫描：入桶 O(n) + 判定加权 O(100)；空桶 0 % k = 0 命中但贡献为 0</text>
</svg>
