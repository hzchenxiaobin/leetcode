<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">奶酪定个数，番茄定差价</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两种汉堡都用 1 片奶酪，巨无霸只是多花 2 片番茄</text>

  <g filter="url(#rough2)">
    <rect x="50" y="64" width="220" height="122" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="64" y="86" font-size="12" fill="#3a4a66" font-weight="bold">巨无霸　数量 x</text>
    <circle cx="76" cy="110" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <circle cx="102" cy="110" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <circle cx="128" cy="110" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <circle cx="154" cy="110" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="176" y="114" font-size="10.5" fill="#8a3a36">4 片番茄</text>
    <rect x="76" y="130" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2"/>
    <text x="96" y="141" font-size="10.5" fill="#8a6a20">1 片奶酪</text>
    <text x="64" y="172" font-size="10.5" fill="#555">每份消耗：4 番茄 + 1 奶酪</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="290" y="64" width="220" height="122" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="304" y="86" font-size="12" fill="#3a5a30" font-weight="bold">小皇堡　数量 y</text>
    <circle cx="316" cy="110" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <circle cx="342" cy="110" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="364" y="114" font-size="10.5" fill="#8a3a36">2 片番茄</text>
    <rect x="316" y="130" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2"/>
    <text x="336" y="141" font-size="10.5" fill="#8a6a20">1 片奶酪</text>
    <text x="304" y="172" font-size="10.5" fill="#555">每份消耗：2 番茄 + 1 奶酪</text>
  </g>

  <path d="M 160 186 L 160 200 L 250 200 L 250 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 186 L 400 200 L 310 200 L 310 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="50" y="214" width="460" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="280" y="236" text-anchor="middle" font-size="11.5" fill="#7a5a10">奶酪总量：x + y = C　　番茄总量：4x + 2y = T</text>
    <text x="280" y="264" text-anchor="middle" font-size="11.5" fill="#555">4x + 2y = 2(x + y) + 2x = 2C + 2x</text>
  </g>

  <path d="M 280 282 L 280 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="70" y="298" width="420" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="280" y="322" text-anchor="middle" font-size="14" fill="#2f3f5a" font-weight="bold">x = (T − 2C) / 2　　y = C − x</text>
    <text x="280" y="342" text-anchor="middle" font-size="10" fill="#666">一次减法 + 一次除法，闭式解，无需搜索</text>
  </g>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">多出来的「番茄对数」恰好等于巨无霸的数量 x</text>
</svg>
