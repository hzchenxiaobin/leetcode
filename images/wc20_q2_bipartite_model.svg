<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">二分图视角：位置与值的完美匹配计数</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">边 (i, k) 存在 ⟺ k 是 i 的约数 或 k 是 i 的倍数；答案 = 完美匹配的条数</text>

  <text x="96" y="124" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">位置 i</text>
  <text x="96" y="304" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">值 k</text>
  <path d="M 175 137 L 175 279" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 175 137 L 265 279" stroke="#b9c4d4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 175 137 L 355 279" stroke="#b9c4d4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 175 137 L 445 279" stroke="#b9c4d4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 265 137 L 175 279" stroke="#b9c4d4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 265 137 L 265 279" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 265 137 L 445 279" stroke="#b9c4d4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 355 137 L 175 279" stroke="#b9c4d4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 355 137 L 355 279" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 445 137 L 175 279" stroke="#b9c4d4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 445 137 L 265 279" stroke="#b9c4d4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 445 137 L 445 279" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>

  <circle cx="175" cy="118" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="175" y="124" text-anchor="middle" font-size="14" fill="#33475f" filter="url(#rough2)">1</text>
  <circle cx="265" cy="118" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="265" y="124" text-anchor="middle" font-size="14" fill="#33475f" filter="url(#rough2)">2</text>
  <circle cx="355" cy="118" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="355" y="124" text-anchor="middle" font-size="14" fill="#33475f" filter="url(#rough2)">3</text>
  <circle cx="445" cy="118" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="445" y="124" text-anchor="middle" font-size="14" fill="#33475f" filter="url(#rough2)">4</text>

  <circle cx="175" cy="298" r="19" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="175" y="304" text-anchor="middle" font-size="14" fill="#33502c" filter="url(#rough2)">1</text>
  <circle cx="265" cy="298" r="19" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="265" y="304" text-anchor="middle" font-size="14" fill="#33502c" filter="url(#rough2)">2</text>
  <circle cx="355" cy="298" r="19" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="355" y="304" text-anchor="middle" font-size="14" fill="#33502c" filter="url(#rough2)">3</text>
  <circle cx="445" cy="298" r="19" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="445" y="304" text-anchor="middle" font-size="14" fill="#33502c" filter="url(#rough2)">4</text>

  <rect x="486" y="88" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="510" y="101" font-size="10.5" fill="#555" filter="url(#rough2)">位置节点</text>
  <rect x="486" y="116" width="16" height="16" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="510" y="129" font-size="10.5" fill="#555" filter="url(#rough2)">值节点</text>
  <path d="M 486 146 L 502 146" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <text x="510" y="150" font-size="10.5" fill="#555" filter="url(#rough2)">匹配边</text>
  <text x="486" y="176" font-size="10" fill="#999" filter="url(#rough2)">n = 4：共 8 条完美匹配</text>

  <rect x="40" y="352" width="580" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="374" font-size="11" fill="#7a5c10" filter="url(#rough2)">关键压缩：已放 c 个值 ⟹ 下一位置必为 c + 1，位置维度可由 popcount(mask) 推出</text>
  <text x="58" y="394" font-size="11" fill="#7a5c10" filter="url(#rough2)">n ≤ 15 ⟹ 状态数 2^15 = 32768，状压 DP 能把所有「已用集合」一次算清</text>
</svg>
