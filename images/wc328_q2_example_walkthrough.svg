<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：打标记 → 二维前缀和还原</text>
  <path d="M 160 44 Q 340 52 520 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left grid: d after marks (4x4) -->
  <text x="184" y="78" text-anchor="middle" font-size="13" fill="#666">打完标记后的 d（4×4）</text>
  <text x="121" y="95" text-anchor="middle" font-size="10" fill="#999">c0</text>
  <text x="163" y="95" text-anchor="middle" font-size="10" fill="#999">c1</text>
  <text x="205" y="95" text-anchor="middle" font-size="10" fill="#999">c2</text>
  <text x="247" y="95" text-anchor="middle" font-size="10" fill="#999">c3</text>
  <text x="93" y="126" text-anchor="end" font-size="10" fill="#999">r0</text>
  <text x="93" y="168" text-anchor="end" font-size="10" fill="#999">r1</text>
  <text x="93" y="210" text-anchor="end" font-size="10" fill="#999">r2</text>
  <text x="93" y="252" text-anchor="end" font-size="10" fill="#999">r3</text>

  <g filter="url(#sk)"><rect x="100" y="100" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="121" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="142" y="100" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c0" stroke-width="1"/></g>
  <text x="163" y="126" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="184" y="100" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="205" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" font-family="monospace">−1</text>
  <g filter="url(#sk)"><rect x="226" y="100" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c0" stroke-width="1"/></g>
  <text x="247" y="126" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">0</text>

  <g filter="url(#sk)"><rect x="100" y="142" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c0" stroke-width="1"/></g>
  <text x="121" y="168" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="142" y="142" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="163" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="184" y="142" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c0" stroke-width="1"/></g>
  <text x="205" y="168" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="226" y="142" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="247" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" font-family="monospace">−1</text>

  <g filter="url(#sk)"><rect x="100" y="184" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="121" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" font-family="monospace">−1</text>
  <g filter="url(#sk)"><rect x="142" y="184" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c0" stroke-width="1"/></g>
  <text x="163" y="210" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="184" y="184" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="205" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="226" y="184" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c0" stroke-width="1"/></g>
  <text x="247" y="210" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">0</text>

  <g filter="url(#sk)"><rect x="100" y="226" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c0" stroke-width="1"/></g>
  <text x="121" y="252" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="142" y="226" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="163" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" font-family="monospace">−1</text>
  <g filter="url(#sk)"><rect x="184" y="226" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c0" stroke-width="1"/></g>
  <text x="205" y="252" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="226" y="226" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="247" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" font-family="monospace">1</text>

  <!-- legend -->
  <g filter="url(#sk)"><rect x="112" y="280" width="16" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="136" y="293" font-size="10.5" fill="#666">+1 标记</text>
  <g filter="url(#sk)"><rect x="196" y="280" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="220" y="293" font-size="10.5" fill="#666">−1 标记</text>

  <!-- arrow -->
  <g filter="url(#sk)"><path d="M 280 184 Q 320 184 356 178" stroke="#7a5415" stroke-width="2" fill="none" marker-end="url(#ar)"/></g>
  <text x="318" y="160" text-anchor="middle" font-size="11" fill="#7a5415">二维前缀和</text>

  <!-- right grid: restored mat (3x3) -->
  <text x="472" y="78" text-anchor="middle" font-size="13" fill="#666">还原后的 mat（左上 3×3）</text>
  <g filter="url(#sk)"><rect x="400" y="100" width="48" height="48" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="424" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="448" y="100" width="48" height="48" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="472" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="496" y="100" width="48" height="48" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="520" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="400" y="148" width="48" height="48" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="424" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="448" y="148" width="48" height="48" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="472" y="179" text-anchor="middle" font-size="17" font-weight="bold" fill="#b07818" font-family="monospace">2</text>
  <g filter="url(#sk)"><rect x="496" y="148" width="48" height="48" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="520" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="400" y="196" width="48" height="48" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="424" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="448" y="196" width="48" height="48" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="472" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="496" y="196" width="48" height="48" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="520" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>

  <!-- callout to overlap cell -->
  <g filter="url(#sk)"><path d="M 550 172 L 508 172" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <text x="556" y="168" font-size="10.5" fill="#7a5415">两查询重叠</text>
  <text x="556" y="186" font-size="10.5" font-weight="bold" fill="#7a5415">1 + 1 = 2</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="60" y="320" width="560" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="80" y="346" font-size="11.5" fill="#444" font-family="monospace">查询① [1,1,2,2] → d[1][1]+1, d[3][1]−1, d[1][3]−1, d[3][3]+1</text>
  <text x="80" y="368" font-size="11.5" fill="#444" font-family="monospace">查询② [0,0,1,1] → d[0][0]+1, d[2][0]−1, d[0][2]−1, d[2][2]+1</text>
  <text x="80" y="392" font-size="11.5" font-weight="bold" fill="#7a5415">前缀和后取左上 3×3 = [[1,1,0],[1,2,1],[0,1,1]] ✓</text>
</svg>
