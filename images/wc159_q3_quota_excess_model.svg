<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="384" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：把「平衡」翻译成「配额 + 超额」</text>
  <text x="280" y="43" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = QQQQWWWW，n = 8，配额 t = n/4 = 2；只有计数超过 2 的字符才真的「多出来」</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="130" y="56" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="168" y="56" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="206" y="56" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="244" y="56" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="282" y="56" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="320" y="56" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="358" y="56" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="396" y="56" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="149" y="78" fill="#3a4a66">Q</text>
    <text x="187" y="78" fill="#3a4a66">Q</text>
    <text x="225" y="78" fill="#3a4a66">Q</text>
    <text x="263" y="78" fill="#3a4a66">Q</text>
    <text x="301" y="78" fill="#3a5a30">W</text>
    <text x="339" y="78" fill="#3a5a30">W</text>
    <text x="377" y="78" fill="#3a5a30">W</text>
    <text x="415" y="78" fill="#3a5a30">W</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="149" y="101">0</text><text x="187" y="101">1</text><text x="225" y="101">2</text><text x="263" y="101">3</text>
    <text x="301" y="101">4</text><text x="339" y="101">5</text><text x="377" y="101">6</text><text x="415" y="101">7</text>
  </g>

  <rect x="28" y="114" width="268" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="136" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">① 统计 → 超额 = max(0, 计数 − t)</text>

  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="44" y="160" fill="#8a6a20" font-weight="bold">字符</text>
    <text x="106" y="160" fill="#8a6a20" font-weight="bold" text-anchor="middle">计数</text>
    <text x="172" y="160" fill="#8a6a20" font-weight="bold" text-anchor="middle">配额 t</text>
    <text x="246" y="160" fill="#8a6a20" font-weight="bold" text-anchor="middle">超额 need</text>

    <text x="54" y="186" font-weight="bold" fill="#3a4a66">Q</text>
    <text x="106" y="186" text-anchor="middle">4</text>
    <text x="172" y="186" text-anchor="middle">2</text>
    <text x="246" y="186" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>

    <text x="54" y="212" font-weight="bold" fill="#3a5a30">W</text>
    <text x="106" y="212" text-anchor="middle">4</text>
    <text x="172" y="212" text-anchor="middle">2</text>
    <text x="246" y="212" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>

    <text x="54" y="238" font-weight="bold" fill="#8a6a20">E</text>
    <text x="106" y="238" text-anchor="middle">0</text>
    <text x="172" y="238" text-anchor="middle">2</text>
    <text x="246" y="238" text-anchor="middle" fill="#999">0</text>

    <text x="54" y="264" font-weight="bold" fill="#8a6a20">R</text>
    <text x="106" y="264" text-anchor="middle">0</text>
    <text x="172" y="264" text-anchor="middle">2</text>
    <text x="246" y="264" text-anchor="middle" fill="#999">0</text>
  </g>
  <text x="42" y="282" font-size="9.5" fill="#999" filter="url(#rough2)">E、R 计数不足也无妨：缺的字符由替换串内部补上</text>

  <path d="M 300 202 L 326 202" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="332" y="114" width="204" height="176" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="346" y="136" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">② 等价条件（窗口外必须合法）</text>
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="346" y="160">把 [l, r] 整段替换，窗口外固定：</text>
    <text x="346" y="184" fill="#446688">count_外(c) ≤ t　对所有 c</text>
    <text x="434" y="206" text-anchor="middle" fill="#888">⇕ 移项</text>
    <text x="346" y="228" fill="#b85450">count_内(c) ≥ need(c)</text>
    <text x="346" y="252">本题里 need = (2, 2, 0, 0)，于是：</text>
    <text x="346" y="274" fill="#3a5a30">最短窗口，内部至少含 2 个 Q、2 个 W</text>
  </g>

  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">「窗口内计数 ≥ 超额」是一个可增可减的单调条件：右指针加入字符只会让它更容易满足</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">于是可以双指针：r 负责补齐 need，l 负责在合法时尽量右移，两者都只前进 ⇒ O(n)</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">need 全为 0 说明原串已平衡，直接返回 0（不进入滑动窗口）</text>
</svg>
