<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="560" fill="#fdfcf7"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：预处理查表 + 一趟扫描</text>

  <g filter="url(#sk)"><rect x="140" y="44" width="320" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="65" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">预处理：埃氏筛 + P[x] = 不超过 x 的最大质数</text>

  <g filter="url(#sk)"><path d="M 300 78 L 300 92" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="215" y="96" width="170" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="115" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">prev ← 0，i ← 0</text>

  <g filter="url(#sk)"><path d="M 300 126 L 300 136" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><polygon points="300,140 374,172 300,204 226,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="300" y="177" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">i &lt; n ?</text>
  <g filter="url(#sk)"><path d="M 374 172 L 500 172" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="430" y="164" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="505" y="156" width="115" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="562" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">return true</text>
  <g filter="url(#sk)"><path d="M 300 204 L 300 218" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="312" y="216" font-size="11" fill="#777" filter="url(#sk)">是</text>

  <g filter="url(#sk)"><rect x="195" y="222" width="210" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="242" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">x ← nums[i] − prev − 1</text>

  <g filter="url(#sk)"><path d="M 300 254 L 300 264" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><polygon points="300,268 372,300 300,332 228,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="300" y="305" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">x ≥ 2 ?</text>
  <g filter="url(#sk)"><path d="M 372 300 L 466 300" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="412" y="292" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="470" y="280" width="175" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="557" y="297" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">p ← P[x]</text>
  <text x="557" y="313" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">prev ← nums[i] − p</text>
  <g filter="url(#sk)"><path d="M 300 332 L 300 344" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="312" y="344" font-size="11" fill="#777" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><polygon points="300,348 382,382 300,416 218,382" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="300" y="387" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">nums[i] &gt; prev ?</text>
  <g filter="url(#sk)"><path d="M 382 382 L 466 382" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="420" y="374" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="470" y="366" width="130" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="535" y="386" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">prev ← nums[i]</text>
  <g filter="url(#sk)"><path d="M 300 416 L 300 430" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="312" y="428" font-size="11" fill="#777" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="222" y="434" width="156" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="300" y="456" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">return false</text>

  <g filter="url(#sk)"><path d="M 645 300 Q 678 300 678 375 Q 678 448 636 448" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><path d="M 535 398 L 535 428" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><rect x="460" y="432" width="170" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="545" y="452" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">i ← i + 1</text>

  <g filter="url(#sk)"><path d="M 545 464 L 545 505 L 105 505 L 105 172 L 220 172" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="325" y="498" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">处理下一个元素</text>

  <text x="350" y="542" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">P[0] = P[1] = 0 哨兵：x &lt; 2 时走「不减」分支；每步新值恒 ≥ prev + 1，无需回验。</text>
</svg>
