<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="560" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 演算：dp[j] 的四轮演化</text>
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#666">cost=[2,3,4,2]，time=[1,1,1,1] → 物品 (w,c) = (2,2),(2,3),(2,4),(2,2)，n = 4</text>
  <path d="M 250 44 Q 430 52 610 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- table header -->
  <g filter="url(#rough)">
    <rect x="75" y="96" width="175" height="38" fill="#f2f2f2" stroke="#999" stroke-width="1.4"/>
    <rect x="250" y="96" width="108" height="38" fill="#f2f2f2" stroke="#999" stroke-width="1.4"/>
    <rect x="358" y="96" width="108" height="38" fill="#f2f2f2" stroke="#999" stroke-width="1.4"/>
    <rect x="466" y="96" width="108" height="38" fill="#f2f2f2" stroke="#999" stroke-width="1.4"/>
    <rect x="574" y="96" width="108" height="38" fill="#f2f2f2" stroke="#999" stroke-width="1.4"/>
    <rect x="682" y="96" width="108" height="38" fill="#f2f2f2" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="162" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">轮次 ＼ j</text>
  <text x="304" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">0</text>
  <text x="412" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">1</text>
  <text x="520" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">2</text>
  <text x="628" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">3</text>
  <text x="736" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">4</text>

  <!-- row 0: init -->
  <g filter="url(#rough)">
    <rect x="75" y="134" width="175" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="250" y="134" width="108" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="358" y="134" width="108" height="52" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2"/>
    <rect x="466" y="134" width="108" height="52" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2"/>
    <rect x="574" y="134" width="108" height="52" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2"/>
    <rect x="682" y="134" width="108" height="52" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="162" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">初始</text>
  <text x="304" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#33507a">0</text>
  <text x="412" y="166" text-anchor="middle" font-size="14" fill="#999">∞</text>
  <text x="520" y="166" text-anchor="middle" font-size="14" fill="#999">∞</text>
  <text x="628" y="166" text-anchor="middle" font-size="14" fill="#999">∞</text>
  <text x="736" y="166" text-anchor="middle" font-size="14" fill="#999">∞</text>

  <!-- row 1: item 1 -->
  <g filter="url(#rough)">
    <rect x="75" y="186" width="175" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="250" y="186" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="358" y="186" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="466" y="186" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="574" y="186" width="108" height="52" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2"/>
    <rect x="682" y="186" width="108" height="52" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="162" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">物品 1</text>
  <text x="162" y="227" text-anchor="middle" font-size="11" fill="#888">(w=2, c=2)</text>
  <text x="304" y="218" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="412" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="520" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="628" y="218" text-anchor="middle" font-size="14" fill="#999">∞</text>
  <text x="736" y="218" text-anchor="middle" font-size="14" fill="#999">∞</text>

  <!-- row 2: item 2 -->
  <g filter="url(#rough)">
    <rect x="75" y="238" width="175" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="250" y="238" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="358" y="238" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="466" y="238" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="574" y="238" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="682" y="238" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="162" y="261" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">物品 2</text>
  <text x="162" y="279" text-anchor="middle" font-size="11" fill="#888">(w=2, c=3)</text>
  <text x="304" y="270" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="412" y="270" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="520" y="270" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="628" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="736" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>

  <!-- row 3: item 3 (no update) -->
  <g filter="url(#rough)">
    <rect x="75" y="290" width="175" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="250" y="290" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="358" y="290" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="466" y="290" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="574" y="290" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="682" y="290" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="162" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">物品 3</text>
  <text x="162" y="331" text-anchor="middle" font-size="11" fill="#b85450">(w=2, c=4) 无更优</text>
  <text x="304" y="322" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="412" y="322" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="520" y="322" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="628" y="322" text-anchor="middle" font-size="14" fill="#333">5</text>
  <text x="736" y="322" text-anchor="middle" font-size="14" fill="#333">5</text>

  <!-- row 4: item 4 -->
  <g filter="url(#rough)">
    <rect x="75" y="342" width="175" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="250" y="342" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="358" y="342" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="466" y="342" width="108" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="574" y="342" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="682" y="342" width="108" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
  </g>
  <text x="162" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">物品 4</text>
  <text x="162" y="383" text-anchor="middle" font-size="11" fill="#888">(w=2, c=2)</text>
  <text x="304" y="374" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="412" y="374" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="520" y="374" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="628" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="736" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a10">4 ⭐</text>
  <text x="736" y="390" text-anchor="middle" font-size="9.5" fill="#8a5a10">= dp[n] 答案</text>

  <!-- bottom banner -->
  <g filter="url(#rough)">
    <rect x="60" y="424" width="740" height="112" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="430" y="452" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">最优 dp[4] = 4 ⭐：付费刷墙 0 与墙 3，覆盖 2 + 2 = 4 ≥ 4，开销 2 + 2 = 4</text>
  <text x="430" y="478" text-anchor="middle" font-size="12" fill="#7a5415">绿色格 = 本轮新值；物品 1 轮的 j=1 走了 max(0, 1−2) = 0（单独这堵墙已够覆盖需求 1）</text>
  <text x="430" y="502" text-anchor="middle" font-size="12" fill="#7a5415">物品 3 轮 c=4 处处不更优，整轮 dp 不变 —— 一维 DP 的常态</text>
</svg>
