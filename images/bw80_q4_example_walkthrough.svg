<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="179"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例走查：nums = [2,1,4,3,5]，k = 10</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="60" y="66">r</text><text x="115" y="66">窗口和</text><text x="185" y="66">score</text>
    <text x="265" y="66">收缩后 [l, r]</text><text x="390" y="66">本次新增计数</text><text x="495" y="66">累计</text>
  </g>
  <path d="M 36 78 L 520 78" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="36" y="90" width="484" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="60" y="115">0</text><text x="115" y="115">2</text><text x="185" y="115">2</text>
    <text x="265" y="115">[0, 0]</text><text x="390" y="115">1（[2]）</text><text x="495" y="115">1</text>
    <rect x="36" y="136" width="484" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="60" y="161">1</text><text x="115" y="161">3</text><text x="185" y="161">6</text>
    <text x="265" y="161">[0, 1]</text><text x="390" y="161">2（[2],[2,1]）</text><text x="495" y="161">3</text>
    <rect x="36" y="182" width="484" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="60" y="207">2</text><text x="115" y="207">7</text><text x="185" y="207" fill="#b85450" font-weight="bold">21 ≥ 10</text>
    <text x="265" y="207">收缩 → [2, 2]</text><text x="390" y="207">1（[4]）</text><text x="495" y="207">4</text>
    <rect x="36" y="228" width="484" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="60" y="253">3</text><text x="115" y="253">7</text><text x="185" y="253" fill="#b85450" font-weight="bold">14 ≥ 10</text>
    <text x="265" y="253">收缩 → [3, 3]</text><text x="390" y="253">1（[3]）</text><text x="495" y="253">5</text>
    <rect x="36" y="274" width="484" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="60" y="299">4</text><text x="115" y="299">5</text><text x="185" y="299" fill="#b85450" font-weight="bold">10 ≥ 10</text>
    <text x="265" y="299">收缩 → [4, 4]</text><text x="390" y="299">1（[5]）</text><text x="495" y="299">6</text>
  </g>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="336" width="440" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="280" y="360" text-anchor="middle">r = 2 时窗口 [0,2] 分数 21 ≥ 10，连缩两次：去掉 2 → 10 仍 ≥ 10，</text>
    <text x="280" y="380" text-anchor="middle">再去掉 1 → 只剩 [4] 分数 4 &lt; 10 才停（注意 5×2=10 恰好也不行，</text>
    <text x="280" y="400" text-anchor="middle" font-weight="bold">是「严格小于 k」！）最终答案 6，与官方一致。</text>
  </g>
</svg>
