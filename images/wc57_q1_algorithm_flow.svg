<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：排序 + 递推可构造集合</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个单词只做一次前缀查询，判定与答案更新在同一次扫描里完成</text>

  <g filter="url(#rough2)">
    <rect x="140" y="64" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="89" text-anchor="middle" font-size="12" fill="#3a4a66">① 排序：长度升序，同长按字典序升序</text>

    <rect x="140" y="116" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="141" text-anchor="middle" font-size="12" fill="#3a4a66">② buildable ← { "" }（空串是链首）</text>

    <rect x="140" y="168" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="193" text-anchor="middle" font-size="12" fill="#3a4a66">③ 按顺序取出下一个单词 w</text>
  </g>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M 280 104 L 280 114"/>
    <path d="M 280 156 L 280 166"/>
    <path d="M 280 208 L 280 220"/>
  </g>

  <g filter="url(#rough2)">
    <polygon points="280,222 410,264 280,306 150,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="268" text-anchor="middle" font-size="11" fill="#8a6a20">w[:-1] ∈ buildable ？</text>
  </g>

  <path d="M 410 264 L 436 264" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="424" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 150 264 L 124 264" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="137" y="256" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="442" y="236" width="104" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="494" y="260" text-anchor="middle" font-size="10.5" fill="#3a5a30">加入 buildable</text>
    <text x="494" y="278" text-anchor="middle" font-size="10.5" fill="#3a5a30">更长则 best ← w</text>

    <rect x="24" y="238" width="96" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="72" y="261" text-anchor="middle" font-size="10.5" fill="#8a3a36">不做任何事</text>
    <text x="72" y="279" text-anchor="middle" font-size="10.5" fill="#8a3a36">w 不可构造</text>
  </g>

  <path d="M 494 292 L 494 308 L 400 308 L 400 322" stroke="#4a7a3a" stroke-width="1.3" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 72 290 L 72 308 L 160 308 L 160 322" stroke="#b85450" stroke-width="1.3" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="326" width="360" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="280" y="345" text-anchor="middle" font-size="11" fill="#8a6a20">④ 还有单词 → 回到 ③；否则结束</text>
    <text x="280" y="364" text-anchor="middle" font-size="11" fill="#8a6a20">⑤ 返回 best（可能是空串）</text>
  </g>

  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">排序是全局一次，循环内只有一次取前缀 + 一次哈希查询 → 线性于总字符数</text>
</svg>
