<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3 演算表：一趟扫描中 run 与 ans 的变化</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [2, 3, 9, 4, 5, 0, 6]，minK = 2，maxK = 5</text>

  <rect x="40" y="60" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="165" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="300" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">在 [2,5] 内？</text>
  <text x="405" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">run</text>
  <text x="478" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ans 累计</text>

  <rect x="40" y="88" width="480" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="165" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 2≥2 且 2≤5</text>
  <text x="405" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="478" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="40" y="118" width="480" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="300" y="138" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="405" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="478" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="40" y="148" width="480" height="30" fill="#fce4ec" stroke="#e5b8b4" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="165" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="300" y="168" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 9&gt;5，是墙 → run 清零</text>
  <text x="405" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="478" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="40" y="178" width="480" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="165" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="300" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="405" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="478" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="40" y="208" width="480" height="30" fill="#e6f4ea" stroke="#a8d0a0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="165" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="300" y="228" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓（等于 maxK 也算在界内）</text>
  <text x="405" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="478" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6 ★</text>

  <rect x="40" y="238" width="480" height="30" fill="#fce4ec" stroke="#e5b8b4" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="165" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="300" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 0&lt;2，是墙 → run 清零</text>
  <text x="405" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="478" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="40" y="268" width="480" height="30" fill="#fce4ec" stroke="#e5b8b4" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="165" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="300" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 6&gt;5，是墙 → run 清零</text>
  <text x="405" y="288" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="478" y="288" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <g stroke="#dddddd" stroke-width="1">
    <line x1="125" y1="60" x2="125" y2="298" filter="url(#rough2)"/>
    <line x1="225" y1="60" x2="225" y2="298" filter="url(#rough2)"/>
    <line x1="370" y1="60" x2="370" y2="298" filter="url(#rough2)"/>
    <line x1="440" y1="60" x2="440" y2="298" filter="url(#rough2)"/>
  </g>

  <rect x="40" y="314" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="336" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">段 [2,3] 贡献 1+2 = 3，段 [4,5] 贡献 1+2 = 3，答案 3+3 = 6；墙后 run 清零、ans 不再变</text>

  <rect x="40" y="358" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="380" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans 最大可达 n(n+1)/2 ≈ 5×10⁹（n = 10⁵ 全在界内时）—— C++ 必须用 long long 累加</text>

  <text x="280" y="414" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每步一次区间判定 + 一次加法：时间 O(n)；只有 run、ans 两个变量：空间 O(1)</text>
</svg>
