<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：示例 2 的三位员工逐一走查</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 员工 c -->
  <g filter="url(#sk)"><rect x="30" y="50" width="186" height="278" rx="8" fill="#fdfefe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="123" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a" filter="url(#sk)">员工 c（3 条）</text>
  <path d="M 48 86 Q 123 92 198 86" stroke="#446688" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="123" y="110" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace" filter="url(#sk)">原始：0808 0829 0809</text>
  <text x="123" y="134" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace" filter="url(#sk)">排序：488 · 489 · 509</text>
  <text x="123" y="160" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace" filter="url(#sk)">三元组：509 − 488 = 21</text>
  <text x="123" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">21 &lt; 60，一个三元组就够了</text>
  <g filter="url(#sk)"><rect x="53" y="250" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="123" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">✓ 高访问</text>

  <!-- 员工 d -->
  <g filter="url(#sk)"><rect x="227" y="50" width="186" height="278" rx="8" fill="#fdfefe" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#sk)">员工 d（4 条）</text>
  <path d="M 245 86 Q 320 92 395 86" stroke="#d6a040" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="320" y="110" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace" filter="url(#sk)">原始：0002 1508 1444 1410</text>
  <text x="320" y="134" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace" filter="url(#sk)">排序：2 · 850 · 884 · 908</text>
  <text x="320" y="158" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-family="monospace" filter="url(#sk)">① 884 − 2 = 882 ✗ 落空</text>
  <g filter="url(#sk)"><rect x="243" y="170" width="154" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="188" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" font-family="monospace" filter="url(#sk)">② 908 − 850 = 58 ✓ 命中</text>
  <text x="320" y="220" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#sk)">存在性：一个命中即够</text>
  <g filter="url(#sk)"><rect x="250" y="250" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="320" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">✓ 高访问</text>

  <!-- 员工 e -->
  <g filter="url(#sk)"><rect x="424" y="50" width="186" height="278" rx="8" fill="#fdfefe" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="517" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a36" filter="url(#sk)">员工 e（1 条）</text>
  <path d="M 442 86 Q 517 92 592 86" stroke="#b85450" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="517" y="110" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace" filter="url(#sk)">原始：0215</text>
  <text x="517" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">仅 1 条 &lt; 3</text>
  <text x="517" y="158" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#sk)">无三元组可判</text>
  <text x="517" y="184" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#sk)">循环 i 从 2 起，不执行</text>
  <g filter="url(#sk)"><rect x="447" y="250" width="140" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="517" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#sk)">✗ 非高访问</text>

  <!-- 底部结论框 -->
  <g filter="url(#sk)"><rect x="60" y="346" width="520" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="320" y="370" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">压线：示例 3 的 ab 排序后 625 · 680 · 684，跨度 59 差一分钟仍入窗 ✓</text>
  <text x="320" y="392" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">恰好相差 60（0815 与 0915）不算同窗 —— 条件是严格小于 60</text>
</svg>
