<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">三层枚举：分别挑百位、十位、个位，再丢进集合去重</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">digits = [1,2,3,4]；下标互不相同即可重复用同一个数字值</text>
  <rect x="60" y="64" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84.0" y="88.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="84.0" y="116" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">下标 0</text>
  <rect x="120" y="64" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144.0" y="88.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="144.0" y="116" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">下标 1</text>
  <rect x="180" y="64" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204.0" y="88.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="204.0" y="116" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">下标 2</text>
  <rect x="240" y="64" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264.0" y="88.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="264.0" y="116" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">下标 3</text>
  <rect x="96" y="150" width="78" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135.0" y="172.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">百位 i</text>
  <rect x="196" y="150" width="78" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="235.0" y="172.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">十位 j</text>
  <rect x="296" y="150" width="78" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="335.0" y="172.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">个位 l</text>
  <path d="M 300 120 L 150 146" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 120 L 240 146" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 120 L 340 146" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="206" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">digits[i] ≠ 0</text>
  <text x="235" y="206" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">任意数字</text>
  <text x="335" y="206" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">digits[l] 为偶数</text>
  <rect x="60" y="226" width="300" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="210" y="246" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">拼接成 100·a + 10·b + c 后插入 set</text>
  <text x="210" y="264" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">同一个数最多被插入一次，天然去重</text>
  <rect x="384" y="150" width="156" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="396" y="172" text-anchor="start" font-size="10" fill="#555555" filter="url(#rough2)">为什么只枚举下标</text>
  <text x="396" y="193" text-anchor="start" font-size="10" fill="#555555" filter="url(#rough2)">数字值可能重复，</text>
  <text x="396" y="214" text-anchor="start" font-size="10" fill="#555555" filter="url(#rough2)">按下标枚举=按「可用</text>
  <text x="396" y="235" text-anchor="start" font-size="10" fill="#555555" filter="url(#rough2)">次数」枚举；</text>
  <text x="396" y="256" text-anchor="start" font-size="10" fill="#555555" filter="url(#rough2)">重复值交给 set 处理</text>
  <text x="280" y="312" text-anchor="middle" font-size="10.5" fill="#333333" font-weight="bold" filter="url(#rough2)">复杂度 O(n³ · log) ，n ≤ 10，最多 1000 次枚举</text>
  <text x="280.0" y="358" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">答案要求「不同」三位偶数，去重不能省</text>
</svg>
