<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="700" height="460" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">并查集：按输入顺序逐条加边</text>

  <!-- 开始 -->
  <rect x="295" y="46" width="110" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="68" text-anchor="middle" font-size="13" fill="#33502a" filter="url(#rough2)">开始</text>
  <path d="M350,80 V116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取边 -->
  <rect x="235" y="116" width="230" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="141" text-anchor="middle" font-size="12.5" fill="#2f4a63" filter="url(#rough2)">取下一对 (a, b)</text>

  <path d="M350,156 V196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 求根 -->
  <rect x="235" y="196" width="230" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="221" text-anchor="middle" font-size="12.5" fill="#2f4a63" filter="url(#rough2)">ra = find(a)　rb = find(b)</text>

  <path d="M350,236 V272" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="350,272 440,314 350,356 260,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="319" text-anchor="middle" font-size="13" fill="#6b5316" filter="url(#rough2)">ra == rb ?</text>

  <!-- 是：返回 -->
  <path d="M440,314 H516" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="472" y="304" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="516" y="290" width="164" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="598" y="311" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">返回 [a, b]</text>
  <text x="598" y="329" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">两端已连通 ⇒ 闭环</text>

  <!-- 否：合并 -->
  <path d="M350,356 V392" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="380" font-size="12.5" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="215" y="392" width="270" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="418" text-anchor="middle" font-size="12.5" fill="#33502a" filter="url(#rough2)">parent[ra] = rb  （合并两个集合）</text>

  <!-- 回边 -->
  <path d="M485,413 H610 V136 H465" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="620" y="270" font-size="12" fill="#446688" filter="url(#rough2)">循</text>
  <text x="620" y="288" font-size="12" fill="#446688" filter="url(#rough2)">环</text>
</svg>
