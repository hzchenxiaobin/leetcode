<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三位数编码：D 定层、P 定位、V 定值</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888">num = 100·D + 10·P + V，于是 num/10 就是节点坐标，num%10 就是节点值</text>

  <!-- 数字拆解 -->
  <g filter="url(#rough2)" font-size="20" text-anchor="middle">
    <rect x="166" y="62" width="66" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="236" y="62" width="66" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <rect x="306" y="62" width="66" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="199" y="93" fill="#3a4a66">1</text>
    <text x="269" y="93" fill="#3a5a30">1</text>
    <text x="339" y="93" fill="#8a6a20">3</text>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <text x="199" y="122" fill="#446688">百位：深度 D</text>
    <text x="269" y="122" fill="#4a7a3a">十位：位置 P</text>
    <text x="339" y="122" fill="#d6a040">个位：值 V</text>
  </g>

  <rect x="392" y="62" width="150" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="404" y="82" font-size="10" fill="#8a3a36">113 → key = 11, V = 3</text>
  <text x="404" y="100" font-size="10" fill="#555">即「第 1 层第 1 位，值 3」</text>
  <text x="404" y="115" font-size="10" fill="#555">前两位天然唯一，可当哈希键</text>

  <text x="280" y="150" text-anchor="middle" font-size="10.5" fill="#666">满二叉树位置编号：第 D 层从左到右 1,2,…,2^(D−1)</text>

  <!-- 树：位置编号 -->
  <g stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 280 191 L 215 233"/>
    <path d="M 280 191 L 345 233"/>
    <path d="M 215 233 L 180 275"/>
    <path d="M 215 233 L 250 275"/>
    <path d="M 345 233 L 310 275"/>
    <path d="M 345 233 L 380 275"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <circle cx="280" cy="174" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="178" fill="#3a4a66">1,1</text>
    <circle cx="215" cy="233" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="215" y="237" fill="#3a5a30">2,1</text>
    <circle cx="345" cy="233" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="345" y="237" fill="#3a5a30">2,2</text>
    <circle cx="180" cy="292" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="180" y="296" fill="#8a6a20">3,1</text>
    <circle cx="250" cy="292" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="250" y="296" fill="#8a6a20">3,2</text>
    <circle cx="310" cy="292" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="310" y="296" fill="#8a6a20">3,3</text>
    <circle cx="380" cy="292" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="380" y="296" fill="#8a6a20">3,4</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#888">
    <text x="98" y="178">D = 1</text>
    <text x="98" y="237">D = 2</text>
    <text x="98" y="296">D = 3</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#b85450">
    <text x="306" y="242" text-anchor="end">2P−1</text>
    <text x="386" y="250">2P</text>
  </g>
  <text x="280" y="332" text-anchor="middle" font-size="9.5" fill="#b85450">反向读同一条边：位置 P 的父节点位置是 ⌈P/2⌉（例：(3,2) 的父是 (2,1)）</text>

  <rect x="60" y="342" width="470" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="74" y="361" font-size="10" fill="#3a5a30">左孩子 (D+1, 2P−1) · 右孩子 (D+1, 2P) · 父节点 (D−1, ⌈P/2⌉)</text>
  <text x="74" y="380" font-size="10" fill="#555">父节点公式让「自底向上累加路径和」成为可能：不建树也能顺着编码往上爬</text>
</svg>
