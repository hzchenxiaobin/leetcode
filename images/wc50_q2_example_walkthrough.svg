<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：增量只沿 key 的路径传播</text>

  <g filter="url(#rough2)">
    <rect x="40" y="52" width="70" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="110" y="52" width="190" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="300" y="52" width="70" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="370" y="52" width="60" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="430" y="52" width="230" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="660" y="52" width="80" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="75" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a80">步骤</text>
  <text x="205" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a80">操作</text>
  <text x="335" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a80">旧值</text>
  <text x="400" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a80">Δ</text>
  <text x="545" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a80">路径上 Σ 变化</text>
  <text x="700" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a80">结果</text>

  <g filter="url(#rough2)">
    <rect x="40" y="84" width="700" height="36" rx="4" fill="#ffffff" stroke="#c9d6e3" stroke-width="1"/>
    <rect x="40" y="120" width="700" height="36" rx="4" fill="#f6faff" stroke="#c9d6e3" stroke-width="1"/>
    <rect x="40" y="156" width="700" height="36" rx="4" fill="#ffffff" stroke="#c9d6e3" stroke-width="1"/>
    <rect x="40" y="192" width="700" height="36" rx="4" fill="#f6faff" stroke="#c9d6e3" stroke-width="1"/>
  </g>
  <text x="75" y="107" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="205" y="107" text-anchor="middle" font-size="11" fill="#333">insert("apple", 3)</text>
  <text x="335" y="107" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="400" y="107" text-anchor="middle" font-size="11" fill="#b03a3a">+3</text>
  <text x="545" y="107" text-anchor="middle" font-size="11" fill="#333">a, ap, app, appl, apple 各 +3</text>
  <text x="700" y="107" text-anchor="middle" font-size="11" fill="#333">—</text>

  <text x="75" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="205" y="143" text-anchor="middle" font-size="11" fill="#333">sum("ap")</text>
  <text x="335" y="143" text-anchor="middle" font-size="11" fill="#333">—</text>
  <text x="400" y="143" text-anchor="middle" font-size="11" fill="#333">—</text>
  <text x="545" y="143" text-anchor="middle" font-size="11" fill="#333">读节点 ap 的 Σ，不走子树</text>
  <text x="700" y="143" text-anchor="middle" font-size="11" fill="#b03a3a">3</text>

  <text x="75" y="179" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="205" y="179" text-anchor="middle" font-size="11" fill="#333">insert("app", 2)</text>
  <text x="335" y="179" text-anchor="middle" font-size="11" fill="#333">0（新键）</text>
  <text x="400" y="179" text-anchor="middle" font-size="11" fill="#b03a3a">+2</text>
  <text x="545" y="179" text-anchor="middle" font-size="11" fill="#333">a, ap, app 各 +2</text>
  <text x="700" y="179" text-anchor="middle" font-size="11" fill="#333">—</text>

  <text x="75" y="215" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="205" y="215" text-anchor="middle" font-size="11" fill="#333">sum("ap")</text>
  <text x="335" y="215" text-anchor="middle" font-size="11" fill="#333">—</text>
  <text x="400" y="215" text-anchor="middle" font-size="11" fill="#333">—</text>
  <text x="545" y="215" text-anchor="middle" font-size="11" fill="#333">读节点 ap 的 Σ = 3 + 2</text>
  <text x="700" y="215" text-anchor="middle" font-size="11" fill="#b03a3a">5</text>

  <text x="42" y="276" font-size="10" fill="#666" filter="url(#rough2)">① apple=3</text>
  <g filter="url(#rough2)">
    <rect x="150" y="252" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="262" y="252" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="374" y="252" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="486" y="252" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="598" y="252" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="200" y="274" text-anchor="middle" font-size="11" fill="#2b5a80">a : 3</text>
  <text x="312" y="274" text-anchor="middle" font-size="11" fill="#2b5a80">ap : 3</text>
  <text x="424" y="274" text-anchor="middle" font-size="11" fill="#2b5a80">app : 3</text>
  <text x="536" y="274" text-anchor="middle" font-size="11" fill="#2b5a80">appl : 3</text>
  <text x="648" y="274" text-anchor="middle" font-size="11" fill="#2b5a80">apple : 3</text>

  <g stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <path d="M 200 286 L 200 304" marker-end="url(#arr)"/>
    <path d="M 312 286 L 312 304" marker-end="url(#arr)"/>
    <path d="M 424 286 L 424 304" marker-end="url(#arr)"/>
  </g>
  <text x="208" y="300" font-size="10" fill="#b8860b" filter="url(#rough2)">+2</text>
  <text x="320" y="300" font-size="10" fill="#b8860b" filter="url(#rough2)">+2</text>
  <text x="432" y="300" font-size="10" fill="#b8860b" filter="url(#rough2)">+2</text>

  <text x="42" y="330" font-size="10" fill="#666" filter="url(#rough2)">③ app=2</text>
  <g filter="url(#rough2)">
    <rect x="150" y="306" width="100" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="262" y="306" width="100" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="374" y="306" width="100" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="486" y="306" width="100" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="598" y="306" width="100" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="200" y="328" text-anchor="middle" font-size="11" fill="#7a5415">a : 5</text>
  <text x="312" y="328" text-anchor="middle" font-size="11" fill="#7a5415">ap : 5</text>
  <text x="424" y="328" text-anchor="middle" font-size="11" fill="#7a5415">app : 5</text>
  <text x="536" y="328" text-anchor="middle" font-size="11" fill="#2e6e2e">appl : 3</text>
  <text x="648" y="328" text-anchor="middle" font-size="11" fill="#2e6e2e">apple : 3</text>

  <g filter="url(#rough2)">
    <rect x="40" y="356" width="680" height="48" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.3" stroke-dasharray="7 5"/>
  </g>
  <text x="380" y="376" text-anchor="middle" font-size="11" fill="#b03a3a">app 加入后只有 a、ap、app 三个节点 +2（它们都以 app 为前缀）</text>
  <text x="380" y="394" text-anchor="middle" font-size="11" fill="#b03a3a">appl、apple 的路径上不含 app，Σ 保持 3 —— 增量正好沿 key 的路径传播</text>
</svg>
