<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="560" fill="#fafafa"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">经典陷阱：不能对 |d| 直接套 LC 1526</text>
  <path d="M 280 44 Q 440 52 600 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="66" text-anchor="middle" font-size="12" fill="#888">符号翻转处两个位置需求方向相反，无法共享同一次操作，必须付满 |a| + |b|</text>
  <path d="M 440 88 L 440 396" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: same sign ===== -->
  <text x="230" y="100" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">① d = [2, 1]：同号段，向上可共享</text>
  <g font-size="10.5" fill="#446688" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="110" y="186" width="64" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g><text x="142" y="203">+1 [0, 0]</text>
    <g filter="url(#sk)"><rect x="110" y="212" width="148" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g><text x="184" y="229">+1 操作 [0, 1]</text>
  </g>
  <text x="104" y="201" text-anchor="end" font-size="9" fill="#999">第2层</text>
  <text x="104" y="227" text-anchor="end" font-size="9" fill="#999">第1层</text>
  <path d="M 70 240 L 390 240" stroke="#999" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="110" y="242" width="64" height="32" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g><text x="142" y="264" fill="#446688">2</text>
    <g filter="url(#sk)"><rect x="194" y="242" width="64" height="32" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g><text x="226" y="264" fill="#446688">1</text>
  </g>
  <g font-size="8" fill="#999"><text x="118" y="253">0</text><text x="202" y="253">1</text></g>
  <text x="230" y="306" text-anchor="middle" font-size="11.5" fill="#555">两个位置同向，+1 区间层层共享</text>
  <g filter="url(#sk)"><rect x="150" y="330" width="160" height="32" rx="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="230" y="351" text-anchor="middle" font-size="13" font-weight="bold" fill="#a87716">答案 = 2 ✓</text>

  <!-- ===== Panel B: sign flip ===== -->
  <text x="650" y="100" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">② d = [2, −1]：符号翻转，各自买单</text>
  <g font-size="10.5" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="530" y="186" width="64" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g><text x="562" y="203" fill="#446688">+1 [0, 0]</text>
    <g filter="url(#sk)"><rect x="530" y="212" width="64" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g><text x="562" y="229" fill="#446688">+1 [0, 0]</text>
    <g filter="url(#sk)"><rect x="614" y="280" width="64" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g><text x="646" y="297" fill="#b85450">−1 [1, 1]</text>
  </g>
  <text x="524" y="201" text-anchor="end" font-size="9" fill="#999">第2层</text>
  <text x="524" y="227" text-anchor="end" font-size="9" fill="#999">第1层</text>
  <path d="M 692 246 C 692 262 692 276 692 292" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3,3" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="700" y="270" font-size="10" fill="#b85450">向下 −1</text>
  <path d="M 490 240 L 810 240" stroke="#999" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="530" y="242" width="64" height="32" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g><text x="562" y="264" fill="#446688">2</text>
    <g filter="url(#sk)"><rect x="614" y="242" width="64" height="32" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g><text x="646" y="264" fill="#b85450">−1</text>
  </g>
  <g font-size="8" fill="#999"><text x="538" y="253">0</text><text x="622" y="253">1</text></g>
  <text x="650" y="326" text-anchor="middle" font-size="11.5" fill="#555">0 要 +2、1 要 −1，方向相反无法共享</text>
  <g filter="url(#sk)"><rect x="480" y="350" width="340" height="32" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="650" y="371" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">答案 = 3 ✓　|d| = [2, 1] 套 1526 得 2 ✗</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="408" width="760" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="80" y="436" font-size="13" font-weight="bold" fill="#2e6e2e">等价视角：按符号分段，每段独立做一次 LC 1526</text>
  <text x="80" y="462" font-size="12" fill="#333">把 d 按符号切成极大同号段，每段从 0 开始独立『砌墙』（段内正是 LC 1526 问题）</text>
  <text x="80" y="488" font-size="12" fill="#333">段与段方向相反不能共享 ⇒ 符号翻转处付满 |a| + |b|（段内可用单调栈维护）</text>
  <text x="80" y="512" font-size="12.5" font-weight="bold" fill="#2e6e2e">总代价 = 各段代价之和 = 扩展差分的正数和 Σ max(0, g_i)</text>
</svg>
