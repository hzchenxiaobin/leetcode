<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2：nums = [−3,−1,4,2]，target = 1 —— 乘积全为负</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">两个有效对的乘积是 −12 和 −2，最大乘积是负数 −2</text>

  <path d="M 308 94 Q 238 30 168 94" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="54" text-anchor="middle" font-size="10.5" fill="#446688">(2,0)：4+(−3)=1，积 −12</text>

  <path d="M 378 94 Q 308 62 238 94" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="78" font-size="10.5" fill="#b85450" font-weight="bold">(3,1)：2+(−1)=1，积 −2 ★</text>

  <rect x="140" y="96" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="96" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="96" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="96" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−3</text>
  <text x="238" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <text x="308" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="378" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="104" y="154" font-size="10.5" fill="#888">下标</text>
  <text x="168" y="154" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="238" y="154" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="308" y="154" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <text x="378" y="154" text-anchor="middle" font-size="10.5" fill="#888">3</text>

  <rect x="40" y="180" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="197" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">(i,j)</text>
  <text x="175" y="197" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">nums[i]</text>
  <text x="245" y="197" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">nums[j]</text>
  <text x="315" y="197" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">和</text>
  <text x="400" y="197" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">严格大于?</text>
  <text x="485" y="197" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">乘积</text>

  <rect x="40" y="206" width="480" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="223" text-anchor="middle" font-size="11" fill="#333">(2,0)</text>
  <text x="175" y="223" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="245" y="223" text-anchor="middle" font-size="11" fill="#333">−3</text>
  <text x="315" y="223" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="400" y="223" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="485" y="223" text-anchor="middle" font-size="11" fill="#333">−12</text>

  <rect x="40" y="232" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="249" text-anchor="middle" font-size="11" fill="#333">(3,1)</text>
  <text x="175" y="249" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="245" y="249" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="315" y="249" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="400" y="249" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="485" y="249" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">−2 ★</text>

  <g stroke="#dddddd" stroke-width="1">
    <line x1="130" y1="180" x2="130" y2="258" filter="url(#rough2)"/>
    <line x1="215" y1="180" x2="215" y2="258" filter="url(#rough2)"/>
    <line x1="285" y1="180" x2="285" y2="258" filter="url(#rough2)"/>
    <line x1="355" y1="180" x2="355" y2="258" filter="url(#rough2)"/>
    <line x1="445" y1="180" x2="445" y2="258" filter="url(#rough2)"/>
  </g>

  <text x="280" y="278" text-anchor="middle" font-size="10.5" fill="#888">其余 4 对 (0,1)(0,3)(1,2)(2,3) 之和 ≠ 1，直接跳过</text>

  <rect x="40" y="292" width="480" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="314" font-size="11" fill="#b85450" font-weight="bold">错误做法：best 从 0 起步</text>
  <text x="56" y="334" font-size="10.5" fill="#555">−12 &gt; 0 不成立，−2 &gt; 0 也不成立 → 记不下任何对，误返回 [-1,-1]</text>

  <rect x="40" y="362" width="480" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="384" font-size="11" fill="#4a7a3a" font-weight="bold">正确做法：best 从 −∞ 起步，−2 &gt; −12 → 答案 [3, 1]</text>
  <text x="56" y="404" font-size="10.5" fill="#555">负数比大小：−2 比 −12 更靠近 0，所以 −2 更大</text>
</svg>
