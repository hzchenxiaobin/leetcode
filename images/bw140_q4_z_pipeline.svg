<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两次 Z 函数：一次算前缀 LCP，一次算后缀 LCS</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">拼接串 t = pattern + '#' + s，'#' 保证匹配长度不超过 m</text>

  <rect x="46" y="62" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="121" y="82" text-anchor="middle" font-size="10" fill="#3a4a66">pattern</text>
  <rect x="196" y="62" width="26" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="82" text-anchor="middle" font-size="11" fill="#8a6a20">#</text>
  <rect x="222" y="62" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="342" y="82" text-anchor="middle" font-size="10" fill="#3a5a30">s</text>
  <text x="470" y="82" font-size="9.5" fill="#999">拼接串 t</text>

  <path d="M 280 92 L 280 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="110" width="470" height="30" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="281" y="130" text-anchor="middle" font-size="10" fill="#555">Z-box 线性扫描：z[k] = LCP(t, t[k:])，区间 [l, r] 复用已有信息 → 总 O(n + m)</text>

  <path d="M 280 140 L 280 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="158" width="222" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="157" y="178" text-anchor="middle" font-size="10" fill="#3a5a30">lcp[i] = z[m + 1 + i]（截到 m）</text>
  <text x="157" y="196" text-anchor="middle" font-size="10" fill="#3a5a30">= LCP(s[i:], pattern)</text>

  <rect x="292" y="158" width="224" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="404" y="178" text-anchor="middle" font-size="10" fill="#3a4a66">把 s、pattern 都翻转再来一次</text>
  <text x="404" y="196" text-anchor="middle" font-size="10" fill="#3a4a66">→ lcs[j] = 与 pattern 的公共后缀长</text>

  <path d="M 157 212 L 157 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 404 212 L 404 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="230" width="470" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="281" y="252" text-anchor="middle" font-size="10.5" fill="#8a6a20">枚举起点 i：判 lcp[i] + lcs[i + m − 1] ≥ m − 1，第一个成立的就是答案</text>

  <text x="280" y="288" text-anchor="middle" font-size="10" fill="#555">lcs 的下标换算：反向串位置 = n − 1 − (i + m − 1)</text>
  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#555">i 只需枚举 0 .. n − m，共 n − m + 1 个窗口</text>

  <rect x="46" y="322" width="470" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <text x="281" y="341" text-anchor="middle" font-size="10" fill="#8a3a36">对比暴力：逐窗口逐字符比对是 O(n·m)，这里降到 O(n + m)</text>
</svg>
