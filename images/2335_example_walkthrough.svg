<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：amount = [1,4,2] → 4 秒装完</text>
  <path d="M 130 44 Q 340 52 550 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="42" y="62" width="64" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="74" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">第 1 秒</text>
  <g filter="url(#sk)"><rect x="170" y="64" width="26" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="183" y="88" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">冷</text>
  <g filter="url(#sk)"><rect x="225" y="64" width="26" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="238" y="88" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">温</text>
  <text x="300" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">冷 + 温（各 1 杯）</text>
  <text x="640" y="88" text-anchor="end" font-size="12.5" fill="#555" filter="url(#sk)">剩余 (0, 3, 2)</text>

  <g filter="url(#sk)"><rect x="42" y="128" width="64" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="74" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">第 2 秒</text>
  <g filter="url(#sk)"><rect x="170" y="130" width="26" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="183" y="154" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">温</text>
  <g filter="url(#sk)"><rect x="225" y="130" width="26" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="238" y="154" text-anchor="middle" font-size="12" fill="#a03a3a" filter="url(#sk)">热</text>
  <text x="300" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">温 + 热（各 1 杯）</text>
  <text x="640" y="154" text-anchor="end" font-size="12.5" fill="#555" filter="url(#sk)">剩余 (0, 2, 1)</text>

  <g filter="url(#sk)"><rect x="42" y="194" width="64" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="74" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">第 3 秒</text>
  <g filter="url(#sk)"><rect x="170" y="196" width="26" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="183" y="220" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">温</text>
  <g filter="url(#sk)"><rect x="225" y="196" width="26" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="238" y="220" text-anchor="middle" font-size="12" fill="#a03a3a" filter="url(#sk)">热</text>
  <text x="300" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">温 + 热（各 1 杯）</text>
  <text x="640" y="220" text-anchor="end" font-size="12.5" fill="#555" filter="url(#sk)">剩余 (0, 1, 0)</text>

  <g filter="url(#sk)"><rect x="42" y="260" width="64" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="74" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">第 4 秒</text>
  <g filter="url(#sk)"><rect x="198" y="262" width="26" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="211" y="286" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">温</text>
  <text x="300" y="286" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">温（单装 1 杯）</text>
  <text x="640" y="286" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">剩余 (0, 0, 0) ✓</text>

  <g filter="url(#sk)"><rect x="30" y="336" width="310" height="156" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="185" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">公式验证 ①：最大值主导</text>
  <text x="185" y="390" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">[1,4,2] 排序 → (a,b,c) = (1,2,4)</text>
  <text x="185" y="414" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">a+b = 3 ≤ c = 4，走左分支</text>
  <text x="185" y="448" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = c = 4 ✓</text>

  <g filter="url(#sk)"><rect x="340" y="336" width="310" height="156" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="495" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">公式验证 ②：三足鼎立</text>
  <text x="495" y="390" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">[5,4,4] 排序 → (a,b,c) = (4,4,5)</text>
  <text x="495" y="414" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">a+b = 8 &gt; c = 5，走右分支</text>
  <text x="495" y="448" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">ans = ⌈13/2⌉ = 7 ✓</text>
</svg>
