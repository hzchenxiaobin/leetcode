<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：同一套闸门，三种落点</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">绿色 = 全部闸门通过；红色 = 某一闸被拦下</text>

  <rect x="16" y="66" width="548" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="26" y="87" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">queryIP</text>
  <text x="250" y="87" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">关键检查</text>
  <text x="525" y="87" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">结论</text>

  <rect x="16" y="98" width="548" height="46" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="26" y="125" font-size="10" fill="#333" filter="url(#rough2)">172.16.254.1</text>
  <text x="250" y="125" font-size="10" fill="#555" filter="url(#rough2)">4 段、无前导零、每段 ≤ 255 ✓</text>
  <text x="525" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">IPv4</text>

  <rect x="16" y="144" width="548" height="46" fill="#fbfbfb" stroke="#dddddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="26" y="171" font-size="10" fill="#333" filter="url(#rough2)">192.168.01.1</text>
  <text x="250" y="171" font-size="10" fill="#555" filter="url(#rough2)">第 3 段 “01” 有前导零 ✗</text>
  <text x="525" y="171" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">Neither</text>

  <rect x="16" y="190" width="548" height="46" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="26" y="217" font-size="10" fill="#333" filter="url(#rough2)">256.256.256.256</text>
  <text x="250" y="217" font-size="10" fill="#555" filter="url(#rough2)">每段 256 &gt; 255，数值越界 ✗</text>
  <text x="525" y="217" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">Neither</text>

  <rect x="16" y="236" width="548" height="58" fill="#fbfbfb" stroke="#dddddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="26" y="258" font-size="10" fill="#333" filter="url(#rough2)">2001:0db8:85a3:0:0:</text>
  <text x="26" y="274" font-size="10" fill="#333" filter="url(#rough2)">8A2E:0370:7334</text>
  <text x="250" y="270" font-size="10" fill="#555" filter="url(#rough2)">8 段、每段 1~4 位十六进制 ✓</text>
  <text x="525" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">IPv6</text>

  <rect x="16" y="294" width="548" height="58" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="26" y="316" font-size="10" fill="#333" filter="url(#rough2)">02001:0db8:85a3:0:0:</text>
  <text x="26" y="332" font-size="10" fill="#333" filter="url(#rough2)">8a2e:0370:7334</text>
  <text x="250" y="328" font-size="10" fill="#555" filter="url(#rough2)">第 1 段 5 位 &gt; 4 ✗</text>
  <text x="525" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">Neither</text>

  <path d="M 240 66 L 240 352" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3 4" fill="none" filter="url(#rough2)"/>
  <path d="M 486 66 L 486 352" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3 4" fill="none" filter="url(#rough2)"/>

  <text x="290" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">三类典型落点：段数不对（1.1.1 / 7 段 IPv6）、字符或长度不对（037j / 02001）、数值与前导零不对（256 / 01）</text>
  <text x="290" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 0370 是合法的：IPv6 允许前导零，这点与 IPv4 恰好相反</text>
</svg>
