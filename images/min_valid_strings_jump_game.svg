<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">mn[i] = 从 i 出发的最长匹配 → 跳跃游戏 II</text>

  <!-- target 格子：8 格，位置锚点 x(p) = 106 + 42p -->
  <text x="76" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">target</text>
  <g filter="url(#rough2)">
    <rect x="106" y="54" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="148" y="54" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="190" y="54" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="232" y="54" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="274" y="54" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="316" y="54" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="358" y="54" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="400" y="54" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="127" y="76" text-anchor="middle" font-size="14" fill="#333">a</text>
    <text x="169" y="76" text-anchor="middle" font-size="14" fill="#333">a</text>
    <text x="211" y="76" text-anchor="middle" font-size="14" fill="#333">b</text>
    <text x="253" y="76" text-anchor="middle" font-size="14" fill="#333">c</text>
    <text x="295" y="76" text-anchor="middle" font-size="14" fill="#333">d</text>
    <text x="337" y="76" text-anchor="middle" font-size="14" fill="#333">a</text>
    <text x="379" y="76" text-anchor="middle" font-size="14" fill="#333">b</text>
    <text x="421" y="76" text-anchor="middle" font-size="14" fill="#333">c</text>
  </g>

  <!-- 位置标号 -->
  <text x="76" y="112" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">pos</text>
  <g font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="106" y="112">0</text>
    <text x="148" y="112">1</text>
    <text x="190" y="112">2</text>
    <text x="232" y="112">3</text>
    <text x="274" y="112">4</text>
    <text x="316" y="112">5</text>
    <text x="358" y="112">6</text>
    <text x="400" y="112">7</text>
    <text x="442" y="112">8</text>
  </g>

  <!-- dp 值行 -->
  <text x="76" y="130" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">dp</text>
  <g font-size="11" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="106" y="130">0</text>
    <text x="148" y="130">1</text>
    <text x="190" y="130">1</text>
    <text x="232" y="130">2</text>
    <text x="274" y="130">2</text>
    <text x="316" y="130">2</text>
    <text x="358" y="130">3</text>
    <text x="400" y="130">3</text>
    <text x="442" y="130">3</text>
  </g>

  <!-- 覆盖区间条带：i=0..7，条 [i+1, i+mn[i]] -->
  <g font-size="9" fill="#666" text-anchor="end" filter="url(#rough2)">
    <text x="98" y="154">i=0</text>
    <text x="98" y="171">i=1</text>
    <text x="98" y="188">i=2</text>
    <text x="98" y="205">i=3</text>
    <text x="98" y="222">i=4</text>
    <text x="98" y="239">i=5</text>
    <text x="98" y="256">i=6</text>
    <text x="98" y="273">i=7</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="148" y="146" width="42" height="9" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="190" y="163" width="84" height="9" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="232" y="180" width="84" height="9" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="240" y="205" font-size="10" fill="#b85450">× 死点（mn=0）</text>
    <text x="282" y="222" font-size="10" fill="#b85450">× 死点（mn=0）</text>
    <rect x="358" y="231" width="84" height="9" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="400" y="248" width="42" height="9" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="408" y="273" font-size="10" fill="#b85450">× 死点（mn=0）</text>
  </g>
  <text x="460" y="160" font-size="9" fill="#666" filter="url(#rough2)">从 i 出发一段
  </text>
  <text x="460" y="174" font-size="9" fill="#666" filter="url(#rough2)">可覆盖到区间
  </text>
  <text x="460" y="188" font-size="9" fill="#666" filter="url(#rough2)">[i+1, i+mn[i]]
  </text>

  <!-- 底部说明框 -->
  <rect x="28" y="286" width="464" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">BFS 分层：dp=0：{0} → dp=1：{1,2} → dp=2：{3,4,5} → dp=3：{6,7,8}</text>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">最短路径 0 → 2 → 5 → 8（跳跃游戏 II 的分层贪心同样适用）</text>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">对应划分 aa | bcd | abc，共 3 段</text>
</svg>
