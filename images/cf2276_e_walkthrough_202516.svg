<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：s = 202516 的逐 i 统计</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">唯一有坏区间的左端点是 l = 1，A[1] = 4，B[1] = 5</text>

  <!-- 抬头底色 -->
  <rect x="60" y="84" width="610" height="36" fill="#eeeeee" stroke="none" filter="url(#rough2)"/>
  <!-- 表格网格 -->
  <path d="M 60 84 L 670 84 M 60 120 L 670 120 M 60 156 L 670 156 M 60 192 L 670 192 M 60 228 L 670 228 M 60 264 L 670 264 M 60 300 L 670 300 M 60 336 L 670 336" stroke="#b9b9b9" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 60 84 L 60 336 M 150 84 L 150 336 M 270 84 L 270 336 M 380 84 L 380 336 M 490 84 L 490 336 M 580 84 L 580 336 M 670 84 L 670 336" stroke="#b9b9b9" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 60 84 L 670 84 L 670 336 L 60 336 Z" stroke="#8a8a8a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <text x="105" y="107" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">i</text>
  <text x="210" y="107" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">i·(n−i+1)</text>
  <text x="325" y="107" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">组 1 贡献</text>
  <text x="435" y="107" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a0761e" filter="url(#rough2)">组 2 贡献</text>
  <text x="535" y="107" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8d3a35" filter="url(#rough2)">坏(i)</text>
  <text x="625" y="107" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案</text>

  <!-- 行数据 -->
  <text x="105" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="325" y="143" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">2</text>
  <text x="435" y="143" text-anchor="middle" font-size="13" fill="#a0761e" filter="url(#rough2)">0</text>
  <text x="535" y="143" text-anchor="middle" font-size="13" fill="#8d3a35" filter="url(#rough2)">2</text>
  <text x="625" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">4</text>

  <text x="105" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="210" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="325" y="179" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">2</text>
  <text x="435" y="179" text-anchor="middle" font-size="13" fill="#a0761e" filter="url(#rough2)">0</text>
  <text x="535" y="179" text-anchor="middle" font-size="13" fill="#8d3a35" filter="url(#rough2)">2</text>
  <text x="625" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">8</text>

  <text x="105" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="210" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <text x="325" y="215" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">2</text>
  <text x="435" y="215" text-anchor="middle" font-size="13" fill="#a0761e" filter="url(#rough2)">0</text>
  <text x="535" y="215" text-anchor="middle" font-size="13" fill="#8d3a35" filter="url(#rough2)">2</text>
  <text x="625" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">10</text>

  <rect x="61" y="229" width="608" height="34" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <text x="105" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="210" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <text x="325" y="251" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">0</text>
  <text x="435" y="251" text-anchor="middle" font-size="13" fill="#a0761e" filter="url(#rough2)">2</text>
  <text x="535" y="251" text-anchor="middle" font-size="13" fill="#8d3a35" filter="url(#rough2)">2</text>
  <text x="625" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">10</text>

  <text x="105" y="287" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="210" y="287" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="325" y="287" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">0</text>
  <text x="435" y="287" text-anchor="middle" font-size="13" fill="#a0761e" filter="url(#rough2)">1</text>
  <text x="535" y="287" text-anchor="middle" font-size="13" fill="#8d3a35" filter="url(#rough2)">1</text>
  <text x="625" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">9</text>

  <text x="105" y="323" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="210" y="323" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="325" y="323" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">0</text>
  <text x="435" y="323" text-anchor="middle" font-size="13" fill="#a0761e" filter="url(#rough2)">0</text>
  <text x="535" y="323" text-anchor="middle" font-size="13" fill="#8d3a35" filter="url(#rough2)">0</text>
  <text x="625" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>

  <text x="360" y="362" text-anchor="middle" font-size="12" fill="#a0761e" filter="url(#rough2)">i = 4 时 A[1] = i，l = 1 从组 1 移入组 2，贡献由常数 2 变成 6 − i</text>
  <text x="360" y="386" text-anchor="middle" font-size="12" fill="#8d3a35" filter="url(#rough2)">坏(i) = 2, 2, 2, 2, 1, 0，正是坏子串 [1,4]、[1,5] 覆盖各下标的次数</text>
  <text x="360" y="408" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">答案 = 6−2, 10−2, 12−2, 12−2, 10−1, 6−0 = 4, 8, 10, 10, 9, 6（与官方样例一致）</text>
</svg>
