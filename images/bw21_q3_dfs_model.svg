<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">后序 DFS：每个节点返回 (先左, 先右) 两个交错长度</text>

  <!-- 递归结构 -->
  <g filter="url(#rough2)">
    <rect x="180" y="58" width="200" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="80" text-anchor="middle" font-size="13.5" fill="#2b4a6b" font-weight="bold" filter="url(#rough2)">dfs(node) 返回</text>
  <text x="280" y="99" text-anchor="middle" font-size="13.5" fill="#2b4a6b" filter="url(#rough2)">(L, R) = (先向左走的最长, 先向右走的最长)</text>

  <!-- 两个来源 -->
  <g filter="url(#rough2)">
    <rect x="40" y="160" width="230" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22">
    <text x="155" y="184" text-anchor="middle" font-weight="bold">向左一步后必须向右：</text>
    <text x="155" y="206" text-anchor="middle">L = dfs(node.left).R + 1</text>
    <text x="155" y="226" text-anchor="middle" font-size="11.5" fill="#4a7a3a">（在左孩子处接着向右交错）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="290" y="160" width="230" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#8a3833">
    <text x="405" y="184" text-anchor="middle" font-weight="bold">向右一步后必须向左：</text>
    <text x="405" y="206" text-anchor="middle">R = dfs(node.right).L + 1</text>
    <text x="405" y="226" text-anchor="middle" font-size="11.5" fill="#b85450">（在右孩子处接着向左交错）</text>
  </g>

  <path d="M 220 110 C 180 128, 160 140, 155 154" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 110 C 380 128, 400 140, 405 154" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 空树与全局答案 -->
  <g filter="url(#rough2)">
    <rect x="40" y="256" width="230" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="155" y="275" text-anchor="middle" font-size="12.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">空树返回 (−1, −1)</text>
  <text x="155" y="292" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">使叶子节点处 L = R = 0</text>

  <g filter="url(#rough2)">
    <rect x="290" y="256" width="230" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="405" y="275" text-anchor="middle" font-size="12.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">ans = max(ans, L, R)</text>
  <text x="405" y="292" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">路径起点可以是任意节点</text>

  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">每个节点 O(1) 合成，总时间 O(节点数)</text>
</svg>
