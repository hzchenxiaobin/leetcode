<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：pattern = IIIDIDDD（n = 8，数字 1…9）</text>
  <path d="M 105 40 Q 280 48 455 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 弹出行高亮（i = 0,1,2,4,8） -->
  <g filter="url(#sk)"><rect x="30" y="84" width="510" height="26" fill="#e6f4ea" opacity="0.6"/></g>
  <g filter="url(#sk)"><rect x="30" y="110" width="510" height="26" fill="#e6f4ea" opacity="0.6"/></g>
  <g filter="url(#sk)"><rect x="30" y="136" width="510" height="26" fill="#e6f4ea" opacity="0.6"/></g>
  <g filter="url(#sk)"><rect x="30" y="188" width="510" height="26" fill="#e6f4ea" opacity="0.6"/></g>
  <g filter="url(#sk)"><rect x="30" y="292" width="510" height="26" fill="#e6f4ea" opacity="0.6"/></g>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="30" y="58" width="510" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="52" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">i</text>
  <text x="115" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">pattern[i]</text>
  <text x="240" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">push 后栈（底→顶）</text>
  <text x="385" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">动作</text>
  <text x="492" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">ans</text>

  <!-- 行分隔线 -->
  <path d="M 30 110 L 540 110" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 30 136 L 540 136" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 30 162 L 540 162" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 30 188 L 540 188" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 30 214 L 540 214" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 30 240 L 540 240" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 30 266 L 540 266" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 30 292 L 540 292" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <!-- 列分隔线 -->
  <path d="M 75 58 L 75 318" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 155 58 L 155 318" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 325 58 L 325 318" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 445 58 L 445 318" stroke="#c8c8c8" stroke-width="1" filter="url(#sk)"/>
  <!-- 外框 -->
  <g filter="url(#sk)"><rect x="30" y="58" width="510" height="260" fill="none" stroke="#446688" stroke-width="1.8"/></g>

  <!-- 行内容 -->
  <text x="52" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">0</text>
  <text x="115" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">I</text>
  <text x="240" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">1</text>
  <text x="385" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">遇 'I' → 弹出</text>
  <text x="492" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">1</text>

  <text x="52" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">1</text>
  <text x="115" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">I</text>
  <text x="240" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">2</text>
  <text x="385" y="127" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">遇 'I' → 弹出</text>
  <text x="492" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">12</text>

  <text x="52" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">2</text>
  <text x="115" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">I</text>
  <text x="240" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">3</text>
  <text x="385" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">遇 'I' → 弹出</text>
  <text x="492" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">123</text>

  <text x="52" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">3</text>
  <text x="115" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#sk)">D</text>
  <text x="240" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">4</text>
  <text x="385" y="179" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">'D' → 滞留</text>
  <text x="492" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">123</text>

  <text x="52" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">4</text>
  <text x="115" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">I</text>
  <text x="240" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">4 5</text>
  <text x="385" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">遇 'I' → 弹出 5 4</text>
  <text x="492" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">12354</text>

  <text x="52" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">5</text>
  <text x="115" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#sk)">D</text>
  <text x="240" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">6</text>
  <text x="385" y="231" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">'D' → 滞留</text>
  <text x="492" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">12354</text>

  <text x="52" y="257" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">6</text>
  <text x="115" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#sk)">D</text>
  <text x="240" y="257" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">6 7</text>
  <text x="385" y="257" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">'D' → 滞留</text>
  <text x="492" y="257" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">12354</text>

  <text x="52" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">7</text>
  <text x="115" y="283" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#sk)">D</text>
  <text x="240" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">6 7 8</text>
  <text x="385" y="283" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">'D' → 滞留</text>
  <text x="492" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">12354</text>

  <text x="52" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">8</text>
  <text x="115" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a10" filter="url(#sk)">末尾</text>
  <text x="240" y="309" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">6 7 8 9</text>
  <text x="385" y="309" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">i == n → 弹出 9 8 7 6</text>
  <text x="492" y="309" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a3a36" filter="url(#sk)">123549876</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)"><rect x="115" y="336" width="330" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/></g>
  <text x="280" y="361" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a10" filter="url(#sk)">最终答案：num = 123549876 ✓（字典序最小）</text>
</svg>
