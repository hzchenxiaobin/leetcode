<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">环形拨号盘：双向可达，取较短者</text>

  <!-- 拨号盘外圈 -->
  <ellipse cx="250" cy="222" rx="110" ry="110" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 指针：中心指向 0 -->
  <path d="M250,222 L250,130" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="250" y="262" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">指针初始指向 0</text>

  <!-- 10 个数字 -->
  <circle cx="250" cy="112" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="117" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">0</text>

  <circle cx="185.4" cy="133" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="185.4" y="138" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>

  <circle cx="145.4" cy="188" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145.4" y="193" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <circle cx="145.4" cy="256" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145.4" y="261" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>

  <circle cx="185.4" cy="311" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.4" y="316" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <circle cx="250" cy="332" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="337" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <circle cx="314.6" cy="311" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="314.6" y="316" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <circle cx="354.6" cy="256" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="354.6" y="261" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <circle cx="354.6" cy="188" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="354.6" y="193" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <circle cx="314.6" cy="133" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="314.6" y="138" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 短弧：1 → 9 逆时针（跨过 0），2 步 -->
  <path d="M329.9,112 A136,136 0 0 0 170.1,112" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="250" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">逆时针：2 步 ✓（1→0→9）</text>

  <!-- 长弧：1 → 9 顺时针（绕远），8 步 -->
  <path d="M329.9,112 A136,136 0 1 1 170.1,112" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="250" y="386" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">顺时针：8 步 ✗</text>

  <!-- 右侧要点面板 -->
  <rect x="430" y="70" width="190" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="525" y="93" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">从 a 到 b：顺时针 p 步</text>
  <text x="525" y="113" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">逆时针 q 步，且 p + q = 10</text>

  <rect x="430" y="146" width="190" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="525" y="170" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">环形距离公式</text>
  <text x="525" y="193" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">δ(a,b) = min(d, 10−d)</text>
  <text x="525" y="211" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">其中 d = |a − b|</text>

  <rect x="430" y="234" width="190" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="525" y="256" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">例：1 → 9，d = 8</text>
  <text x="525" y="277" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">8 &gt; 10−8，取 2 步</text>

  <rect x="430" y="310" width="190" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="525" y="333" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">拨完一个数字后</text>
  <text x="525" y="353" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">指针必停在该数字上</text>
  <text x="525" y="373" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">各段独立 → 逐段取最小</text>
</svg>
