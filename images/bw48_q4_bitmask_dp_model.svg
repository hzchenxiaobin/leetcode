<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">状态设计：mask 记录「已删掉哪些数」，轮次乘数由 popcount 唯一确定</text>

  <!-- 元素条 -->
  <text x="52" y="70" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">nums：</text>
  <g filter="url(#rough2)">
    <rect x="100" y="54" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="152" y="54" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="204" y="54" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="256" y="54" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="308" y="54" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="360" y="54" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="412" y="54" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="464" y="54" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="126" y="96">位 0</text><text x="178" y="96">位 1</text><text x="230" y="96">位 2</text><text x="282" y="96">位 3</text><text x="334" y="96">位 4</text><text x="386" y="96">位 5</text><text x="438" y="96">位 6</text><text x="490" y="96">位 7</text>
  </g>

  <!-- mask 状态 -->
  <rect x="100" y="118" width="416" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="308" y="138" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">mask = 0110_0000₂（位 5、6 已删，两数配对完毕）</text>
  <text x="308" y="156" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">已删 2 个 → 已完成 1 次操作 → 下一轮是第 2 次，乘数 = popcount(mask)/2 + 1 = 2</text>

  <!-- 转移 -->
  <path d="M 308 164 L 308 190" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="192" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="214" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">转移：从空闲位中任选两个 i、j 配对删除</text>
  <text x="310" y="236" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">dp[mask | 1&lt;&lt;i | 1&lt;&lt;j] = max(dp[mask | …], dp[mask] + round × gcd(nums[i], nums[j]))</text>

  <!-- 说明框 -->
  <rect x="40" y="266" width="230" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="290" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">为什么 mask 能编码一切关键信息？</text>
  <text x="56" y="312" font-size="11" fill="#3a4a66" filter="url(#rough2)">剩余可用元素集合 = full ⊕ mask；</text>
  <text x="56" y="332" font-size="11" fill="#3a4a66" filter="url(#rough2)">已完成轮数 = popcount(mask)/2，</text>
  <text x="56" y="352" fill="#b85450" font-size="11" font-weight="bold" filter="url(#rough2)">注意：顺序影响乘数 → 不能只配「最低空闲位」！</text>
  <text x="56" y="372" font-size="11" fill="#3a4a66" filter="url(#rough2)">必须枚举全部空闲点对 (i &lt; j)。</text>

  <rect x="290" y="266" width="230" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="306" y="290" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">规模与预处理</text>
  <text x="306" y="312" font-size="11" fill="#2f5266" filter="url(#rough2)">2n ≤ 14 → 2^14 = 16384 个状态；</text>
  <text x="306" y="332" font-size="11" fill="#2f5226" filter="url(#rough2)">gcd 表 14×14 预计算 91 次；</text>
  <text x="306" y="352" font-size="11" fill="#2f5226" filter="url(#rough2)">转移总量 Σ C(空闲数, 2) ≈ 75 万，</text>
  <text x="306" y="372" font-size="11" fill="#2f5226" filter="url(#rough2)">每步 O(1)，总量轻松可过。</text>
</svg>
