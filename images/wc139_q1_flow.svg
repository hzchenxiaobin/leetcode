<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">三步判定：拼接交换律 → gcd 长度 → 取前缀</text>
  <rect x="150" y="64" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="90" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">判断 str1 + str2 == str2 + str1 ?</text>
  <path d="M 150 108 L 90 140" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 410 108 L 470 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="40" y="140" width="180" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="130" y="161.5" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">不相等</text>
  <text x="130" y="178" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">返回 ""</text>
  <rect x="360" y="140" width="200" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="460" y="161.5" font-size="10.5" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">相等</text>
  <text x="460" y="178" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">g = gcd(len1, len2)</text>
  <path d="M 460 192 L 460 216" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="340" y="216" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="450" y="242" font-size="11" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">返回 str1 的前 g 个字符</text>
  <text x="40" y="240" font-size="11" fill="#8a6a10" text-anchor="start" font-weight="bold" filter="url(#rough2)">为什么能这么判？</text>
  <text x="40" y="262" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">若 x 同时除尽两者，则 str1+str2 与 str2+str1 都是 x 的重复 → 必相等。</text>
  <text x="40" y="284" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">反之相等时，公共周期长度必是 gcd(|str1|, |str2|) 的倍数。</text>
  <rect x="40" y="300" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="323.8" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">例：LEET / CODE → 拼接不等 → ""；AAAAAB / AAA → 拼接不等 → ""</text>
</svg>
