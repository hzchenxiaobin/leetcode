<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="500" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例演算：12 次操作，只记「账」不摊平，真实值靠后缀和还原</text>

  <rect x="20" y="46" width="620" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="45" y="66" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">步</text>
  <text x="120" y="66" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">操作</text>
  <text x="300" y="66" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">记账（add 列的变化）</text>
  <text x="470" y="66" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">栈内容（真实值，自底向顶）</text>
  <text x="605" y="66" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">返回</text>

  <!-- 高亮行底色 -->
  <rect x="20" y="256" width="620" height="90" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <rect x="20" y="226" width="620" height="30" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>

  <!-- 行分隔线 -->
  <path d="M20,76 L640,76" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,106 L640,106" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,136 L640,136" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,166 L640,166" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,196 L640,196" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,226 L640,226" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,256 L640,256" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,286 L640,286" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,316 L640,316" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,346 L640,346" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,376 L640,376" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,406 L640,406" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M20,436 L640,436" stroke="#ccd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 第 1 行 -->
  <text x="45" y="96" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="74" y="96" font-size="10.5" fill="#333" filter="url(#rough2)">push(1)</text>
  <text x="214" y="96" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="394" y="96" font-size="10.5" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="605" y="96" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 2 行 -->
  <text x="45" y="126" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">2</text>
  <text x="74" y="126" font-size="10.5" fill="#333" filter="url(#rough2)">push(2)</text>
  <text x="214" y="126" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="394" y="126" font-size="10.5" fill="#333" filter="url(#rough2)">[1, 2]</text>
  <text x="605" y="126" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 3 行 -->
  <text x="45" y="156" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">3</text>
  <text x="74" y="156" font-size="10.5" fill="#333" filter="url(#rough2)">pop()</text>
  <text x="214" y="156" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="394" y="156" font-size="10.5" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="605" y="156" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 第 4 行 -->
  <text x="45" y="186" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">4</text>
  <text x="74" y="186" font-size="10.5" fill="#333" filter="url(#rough2)">push(2)</text>
  <text x="214" y="186" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="394" y="186" font-size="10.5" fill="#333" filter="url(#rough2)">[1, 2]</text>
  <text x="605" y="186" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 5 行 -->
  <text x="45" y="216" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">5</text>
  <text x="74" y="216" font-size="10.5" fill="#333" filter="url(#rough2)">push(3)</text>
  <text x="214" y="216" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="394" y="216" font-size="10.5" fill="#333" filter="url(#rough2)">[1, 2, 3]</text>
  <text x="605" y="216" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 6 行：满栈丢弃 -->
  <text x="45" y="246" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">6</text>
  <text x="74" y="246" font-size="10.5" fill="#333" filter="url(#rough2)">push(4)</text>
  <text x="214" y="246" font-size="10.5" fill="#b85450" filter="url(#rough2)">已满，丢弃 4</text>
  <text x="394" y="246" font-size="10.5" fill="#333" filter="url(#rough2)">[1, 2, 3]</text>
  <text x="605" y="246" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 7 行：inc(5,100) -->
  <text x="45" y="276" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">7</text>
  <text x="74" y="276" font-size="10.5" fill="#333" filter="url(#rough2)">inc(5, 100)</text>
  <text x="214" y="276" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">add[2] += 100（k 被截到 3）</text>
  <text x="394" y="276" font-size="10.5" fill="#333" filter="url(#rough2)">[101, 102, 103]</text>
  <text x="605" y="276" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 8 行：inc(2,100) -->
  <text x="45" y="306" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">8</text>
  <text x="74" y="306" font-size="10.5" fill="#333" filter="url(#rough2)">inc(2, 100)</text>
  <text x="214" y="306" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">add[1] += 100</text>
  <text x="394" y="306" font-size="10.5" fill="#333" filter="url(#rough2)">[201, 202, 103]</text>
  <text x="605" y="306" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 9 行：pop 103 -->
  <text x="45" y="336" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">9</text>
  <text x="74" y="336" font-size="10.5" fill="#333" filter="url(#rough2)">pop()</text>
  <text x="214" y="336" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">add[1] += add[2] → 200</text>
  <text x="394" y="336" font-size="10.5" fill="#333" filter="url(#rough2)">[201, 202]</text>
  <text x="605" y="336" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">103</text>

  <!-- 第 10 行 -->
  <text x="45" y="366" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">10</text>
  <text x="74" y="366" font-size="10.5" fill="#333" filter="url(#rough2)">pop()</text>
  <text x="214" y="366" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">add[0] += add[1] → 200</text>
  <text x="394" y="366" font-size="10.5" fill="#333" filter="url(#rough2)">[201]</text>
  <text x="605" y="366" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">202</text>

  <!-- 第 11 行 -->
  <text x="45" y="396" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">11</text>
  <text x="74" y="396" font-size="10.5" fill="#333" filter="url(#rough2)">pop()</text>
  <text x="214" y="396" font-size="10.5" fill="#999" filter="url(#rough2)">—（栈顶无人可推）</text>
  <text x="394" y="396" font-size="10.5" fill="#333" filter="url(#rough2)">[]</text>
  <text x="605" y="396" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">201</text>

  <!-- 第 12 行 -->
  <text x="45" y="426" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">12</text>
  <text x="74" y="426" font-size="10.5" fill="#333" filter="url(#rough2)">pop()</text>
  <text x="214" y="426" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="394" y="426" font-size="10.5" fill="#333" filter="url(#rough2)">[]</text>
  <text x="605" y="426" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- 底部要点 -->
  <rect x="40" y="448" width="580" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="466" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 9 步的 103 = 3 + add[2]　第 10 步的 202 = 2 + add[1]　第 11 步的 201 = 1 + add[0]</text>
  <text x="330" y="482" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">每次 pop 只读 1 个格子、改写 1 个格子，账一路向下搬而从不丢失</text>
</svg>
