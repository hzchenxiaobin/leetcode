<svg xmlns="http://www.w3.org/2000/svg" width="660" height="545" viewBox="0 0 660 545" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="88" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="545" fill="#fdfcf7"/>
  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：示例 2 全过程，ans = [6, 14, 7]</text>
  <path d="M 160 38 Q 330 48 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="38" y="54" width="584" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="38" y="84" width="118" height="400" rx="0" fill="#fdfcf7" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="156" y="84" width="72" height="400" fill="#fdfcf7" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="228" y="84" width="150" height="400" fill="#fdfcf7" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="378" y="84" width="244" height="400" fill="#fdfcf7" stroke="#b0b0a8" stroke-width="1"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b5d8e" font-weight="bold">
    <text x="97" y="74">事件（enter/exit）</text>
    <text x="192" y="74">操作</text>
    <text x="303" y="74">Trie 内容</text>
    <text x="500" y="74">回答查询</text>
  </g>
  <line x1="38" y1="84" x2="622" y2="84" stroke="#b0b0a8" stroke-width="1.4"/>

  <g filter="url(#sk)">
    <rect x="228" y="126" width="150" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="0"/>
    <rect x="378" y="210" width="244" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="0"/>
    <rect x="38" y="336" width="584" height="42" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="0"/>
    <rect x="228" y="416" width="150" height="40" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="0"/>
  </g>

  <g font-size="12" fill="#2b2b2b">
    <text x="60" y="108">enter 2</text><text x="168" y="108">+2</text><text x="248" y="108">{2}</text><text x="392" y="108">—</text>
    <text x="60" y="148">enter 3</text><text x="168" y="148">+3</text><text x="248" y="148">{2, 3}</text><text x="392" y="148">—</text>
    <text x="60" y="188">enter 0</text><text x="168" y="188">+0</text><text x="248" y="188">{2, 3, 0}</text><text x="392" y="182" fill="#b85450" font-weight="bold">q2=[0,5]：max(5⊕2, 5⊕3, 5⊕0)</text><text x="392" y="198" fill="#b85450" font-weight="bold">= 7 ✓（取 p=2）</text>
    <text x="60" y="228">enter 4</text><text x="168" y="228">+4</text><text x="248" y="228">{2, 3, 0, 4}</text><text x="392" y="222" fill="#b85450" font-weight="bold">q0=[4,6]：max(6⊕4, 6⊕0, 6⊕3, 6⊕2)</text><text x="392" y="238" fill="#b85450" font-weight="bold">= 6 ✓（取 p=0）</text>
    <text x="60" y="268">exit 4 / enter 6 / exit 6</text><text x="168" y="268">−4 +6 −6</text><text x="248" y="268">回落后 {2, 3, 0}</text><text x="392" y="268">—</text>
    <text x="60" y="308">exit 0 / exit 3</text><text x="168" y="308">−0 −3</text><text x="248" y="308">{2}</text><text x="392" y="308">—</text>
    <text x="60" y="352">enter 7</text><text x="168" y="352">+7</text><text x="248" y="352">{2, 7}</text><text x="392" y="352">—</text>
    <text x="60" y="392">enter 1</text><text x="168" y="392">+1</text><text x="248" y="392">{2, 7, 1}</text><text x="392" y="386" fill="#b85450" font-weight="bold">q1=[1,15]：max(15⊕1, 15⊕7, 15⊕2)</text><text x="392" y="402" fill="#b85450" font-weight="bold">= 14 ✓（取 p=1）</text>
    <text x="60" y="436">exit 1 / enter 5 / exit 5</text><text x="168" y="436">−1 +5 −5</text><text x="248" y="436">回落后 {2, 7}</text><text x="392" y="436">—</text>
    <text x="60" y="464">exit 7 / exit 2</text><text x="168" y="464">−7 −2</text><text x="248" y="464">{}</text><text x="392" y="464">—</text>
  </g>

  <g filter="url(#sk)">
    <rect x="38" y="496" width="584" height="32" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="330" y="517" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-weight="bold">ans = [6, 14, 7]：回答顺序与 DFS 无关，写回时按原始下标 idx 对号入座 ✓</text>
</svg>
