<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">快速切入：二维是包装，摊平开桶是本分</text>
  <path d="M 180 38 Q 320 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 三个题面特征 -->
  <g filter="url(#sk)"><rect x="40" y="62" width="180" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="130" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 只问值，不问位置</text>
  <text x="130" y="103" text-anchor="middle" font-size="12" fill="#2b6e9e">n×n 矩阵 = n² 个数</text>

  <g filter="url(#sk)"><rect x="235" y="62" width="180" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="325" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 值域 [1, n²] 连续</text>
  <text x="325" y="103" text-anchor="middle" font-size="12" fill="#2b6e9e">m = n² ≤ 2500，很小</text>

  <g filter="url(#sk)"><rect x="430" y="62" width="170" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="515" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">③ 指纹唯一</text>
  <text x="515" y="103" text-anchor="middle" font-size="12" fill="#2b6e9e">一个 ×2，一个 ×0</text>

  <path d="M 130 116 L 130 148" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 325 116 L 325 148" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 515 116 L 515 148" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 核心观察 -->
  <g filter="url(#sk)"><rect x="90" y="152" width="460" height="54" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="320" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">核心观察：摊平 + 值域即下标 —— 计数数组 cnt[v]</text>
  <text x="320" y="196" text-anchor="middle" font-size="12" fill="#444">双层循环摊平；下标本身就是值：无哈希、无冲突、可按序扫</text>

  <path d="M 320 208 L 320 234" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 两遍扫描 -->
  <g filter="url(#sk)"><rect x="90" y="238" width="460" height="54" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">两遍扫描：先入桶，再按序查桶</text>
  <text x="320" y="282" text-anchor="middle" font-size="12" fill="#444">cnt[v] == 2 → a（重复）；cnt[v] == 0 → b（缺失）</text>

  <!-- 总结 -->
  <g filter="url(#sk)"><rect x="40" y="312" width="560" height="36" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">签到最短路径：摊平 → 开 m+1 格的桶 → 两遍扫描；时间 O(n²)，空间 O(n²)</text>
</svg>
