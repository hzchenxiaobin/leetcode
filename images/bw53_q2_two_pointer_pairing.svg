<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">排序后首尾配对：第 i 小配第 i 大</text>

  <!-- 面板 A：首尾配对 -->
  <text x="196" y="58" font-size="14" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">首尾配对（最优）</text>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="70" y="112" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="122" y="112" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="174" y="112" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="226" y="112" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="278" y="112" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="330" y="112" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="96" y="135">2</text><text x="148" y="135">3</text><text x="200" y="135">4</text>
    <text x="252" y="135">4</text><text x="304" y="135">5</text><text x="356" y="135">6</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 96 110 Q 226 56, 356 110" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 148 110 Q 226 76, 304 110" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 200 110 Q 226 92, 252 110" fill="none" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22">
    <text x="418" y="76">(2,6) → 8</text>
    <text x="418" y="96">(3,5) → 8</text>
    <text x="418" y="116">(4,4) → 8</text>
    <text x="418" y="142" font-weight="bold">max = 8 ✓</text>
  </g>

  <!-- 面板 B：同类相聚 -->
  <text x="196" y="196" font-size="14" fill="#b85450" font-weight="bold" text-anchor="middle" filter="url(#rough2)">小配小、大配大（更差）</text>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="70" y="250" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="122" y="250" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="174" y="250" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="226" y="250" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="278" y="250" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="330" y="250" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="96" y="273">2</text><text x="148" y="273">3</text><text x="200" y="273">4</text>
    <text x="252" y="273">4</text><text x="304" y="273">5</text><text x="356" y="273">6</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 96 248 Q 122 224, 148 248" fill="none" stroke="#b85450" stroke-width="2"/>
    <path d="M 200 248 Q 226 224, 252 248" fill="none" stroke="#b85450" stroke-width="2"/>
    <path d="M 304 248 Q 330 224, 356 248" fill="none" stroke="#b85450" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#8a3a36">
    <text x="418" y="226">(2,3) → 5</text>
    <text x="418" y="246">(4,4) → 8</text>
    <text x="418" y="266">(5,6) → 11</text>
    <text x="418" y="292" font-weight="bold">max = 11 ✗</text>
  </g>

  <rect x="70" y="308" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">别让最大的两个数同队：把它们拆给最小的数垫底</text>
</svg>
