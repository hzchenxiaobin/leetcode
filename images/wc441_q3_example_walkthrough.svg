<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 4：五个下标各凑各的，答案 = max k_i = 4</text>

  <!-- nums 数组 -->
  <text x="42" y="64" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">nums =</text>

  <rect x="100" y="44" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="122" y="92" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <rect x="152" y="44" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="174" y="92" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>

  <rect x="204" y="44" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="226" y="92" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>

  <rect x="256" y="44" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="278" y="92" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>

  <rect x="308" y="44" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="330" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="330" y="92" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4 ←关键</text>

  <text x="362" y="65" text-anchor="start" font-size="11" fill="#d6a040" filter="url(#rough2)">目标 6 最难凑</text>

  <!-- 查询列表 -->
  <rect x="28" y="108" width="126" height="140" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="91" y="126" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">查询（按序）</text>
  <text x="91" y="144" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">q0 [0,1] v=1</text>
  <text x="91" y="160" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">q1 [0,2] v=1</text>
  <text x="91" y="176" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">q2 [1,4] v=2</text>
  <text x="91" y="192" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">q3 [4,4] v=4</text>
  <text x="91" y="208" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">q4 [3,4] v=1</text>
  <text x="91" y="224" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">q5 [4,4] v=5</text>

  <!-- 演算表 -->
  <rect x="160" y="108" width="450" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">下标</text>
  <text x="222" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">目标</text>
  <text x="290" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">覆盖 val（序）</text>
  <text x="435" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">可达和的扩张</text>
  <text x="572" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">k_i</text>

  <rect x="160" y="132" width="450" height="30" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="180" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="222" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="290" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 1</text>
  <text x="435" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0}→{0,1} ✓</text>
  <text x="572" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="160" y="162" width="450" height="30" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="180" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="222" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="290" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 1, 2</text>
  <text x="435" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0}→{0,1}→{0,1,2} ✓</text>
  <text x="572" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="160" y="192" width="450" height="30" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="180" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="222" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="290" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 2</text>
  <text x="435" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0}→{0,1}→{0,1,2,3} ✓</text>
  <text x="572" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="160" y="222" width="450" height="30" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="180" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="222" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="290" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2, 1</text>
  <text x="435" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0}→{0,2} ✓</text>
  <text x="572" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="160" y="252" width="450" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="222" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="290" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2, 4, 1, 5</text>
  <text x="435" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0}→{0,2}→{0,2,4,6} ✓</text>
  <text x="572" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M 200,108 L 200,282" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 245,108 L 245,282" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 335,108 L 335,282" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 535,108 L 535,282" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 阈值柱状图 -->
  <text x="173" y="316" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">各下标阈值 k_i（木桶取 max）</text>

  <path d="M 62,332 L 286,332" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="292" y="336" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">max</text>

  <path d="M 56,420 L 290,420" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <rect x="70" y="398" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="393" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="83" y="438" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <rect x="110" y="376" width="26" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="371" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="123" y="438" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>

  <rect x="150" y="354" width="26" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="349" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="163" y="438" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>

  <rect x="190" y="354" width="26" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="203" y="349" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="203" y="438" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>

  <rect x="230" y="332" width="26" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="243" y="327" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="243" y="438" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>

  <text x="173" y="464" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = max(1, 2, 3, 3, 4) = 4</text>

  <!-- 离散的洞 -->
  <rect x="330" y="304" width="280" height="136" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 总量够 ≠ 凑得出</text>
  <text x="470" y="350" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">假想 nums[4] = 5：k=4 时覆盖总量</text>
  <text x="470" y="368" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2 + 4 = 6 ≥ 5，但可达和只有</text>
  <text x="470" y="386" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">{0, 2, 4, 6}，没有 5 ——</text>
  <text x="470" y="404" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">必须等 k = 5（val=1 加入）才凑得出</text>
</svg>
