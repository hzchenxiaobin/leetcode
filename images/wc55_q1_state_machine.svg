<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态机：每天只有两种持仓状态</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">手续费只在买入时记一次，所以每笔交易恰好付一次 fee</text>

  <g filter="url(#rough2)">
    <rect x="170" y="100" width="220" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="280" y="128" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">cash：不持股</text>
    <text x="280" y="152" text-anchor="middle" font-size="10.5" fill="#4a6a40">手上没有股票，利润已落袋</text>

    <rect x="170" y="240" width="220" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="280" y="268" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold">hold：持股</text>
    <text x="280" y="292" text-anchor="middle" font-size="10.5" fill="#4a5a76">手上有一张股票，成本已付 fee</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 340 180 L 340 236" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 220 236 L 220 180" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <text x="354" y="198" font-size="11.5" fill="#3a4a66" font-weight="bold">买入  -p - fee</text>
    <text x="354" y="216" font-size="10" fill="#666">把 fee 提前计入成本</text>

    <text x="206" y="198" text-anchor="end" font-size="11.5" fill="#3a5a30" font-weight="bold">卖出  +p</text>
    <text x="206" y="216" text-anchor="end" font-size="10" fill="#666">卖出不再扣费</text>

    <path d="M 210 100 C 196 66, 300 66, 286 100" stroke="#aaa" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
    <text x="322" y="80" font-size="10" fill="#888">不动 +0</text>

    <path d="M 210 316 C 196 350, 300 350, 286 316" stroke="#aaa" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
    <text x="322" y="344" font-size="10" fill="#888">不动 +0</text>
  </g>

  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">答案取第 n 天结束后的 cash（持股不如卖掉）</text>
</svg>
