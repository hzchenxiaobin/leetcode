<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">逐位递推 π：以 “aabaab” 为例（含一次回退）</text>
  <path d="M 150 34 Q 320 44 490 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 表头 -->
  <rect x="50" y="52" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="71" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4258" filter="url(#rough2)">i</text>
  <text x="116" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4258" filter="url(#rough2)">s[i]</text>
  <text x="187" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4258" filter="url(#rough2)">j 初值</text>
  <text x="377" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4258" filter="url(#rough2)">比较与回退过程</text>
  <text x="555" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4258" filter="url(#rough2)">π[i]</text>

  <!-- 行 i=0 -->
  <rect x="50" y="82" width="540" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="71" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="116" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="187" y="103" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">—（基准）</text>
  <text x="243" y="103" font-size="11" fill="#333" filter="url(#rough2)">单字符，无非空真前缀</text>
  <text x="555" y="103" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>

  <!-- 行 i=1 -->
  <rect x="50" y="116" width="540" height="34" fill="#f7f7f7" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="71" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="116" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="187" y="137" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">π[0] = 0</text>
  <text x="243" y="137" font-size="11" fill="#333" filter="url(#rough2)">s[1]=‘a’ = s[0]=‘a’ ✓ → j=1</text>
  <text x="555" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <!-- 行 i=2（回退，橙色高亮） -->
  <rect x="50" y="150" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="71" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4a20" filter="url(#rough2)">2</text>
  <text x="116" y="171" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">b</text>
  <text x="187" y="171" text-anchor="middle" font-size="11.5" fill="#5a4a20" filter="url(#rough2)">π[1] = 1</text>
  <text x="243" y="171" font-size="11" fill="#5a4a20" filter="url(#rough2)">s[2]=‘b’ ≠ s[1]=‘a’ ✗ → j=π[0]=0，仍 ✗</text>
  <text x="555" y="171" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07828" filter="url(#rough2)">0</text>

  <!-- 行 i=3 -->
  <rect x="50" y="184" width="540" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="71" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="116" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="187" y="205" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">π[2] = 0</text>
  <text x="243" y="205" font-size="11" fill="#333" filter="url(#rough2)">s[3]=‘a’ = s[0]=‘a’ ✓ → j=1</text>
  <text x="555" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <!-- 行 i=4 -->
  <rect x="50" y="218" width="540" height="34" fill="#f7f7f7" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="71" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="116" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="187" y="239" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">π[3] = 1</text>
  <text x="243" y="239" font-size="11" fill="#333" filter="url(#rough2)">s[4]=‘a’ = s[1]=‘a’ ✓ → j=2</text>
  <text x="555" y="239" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>

  <!-- 行 i=5（答案，绿色高亮） -->
  <rect x="50" y="252" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="71" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">5</text>
  <text x="116" y="273" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">b</text>
  <text x="187" y="273" text-anchor="middle" font-size="11.5" fill="#2f5a22" filter="url(#rough2)">π[4] = 2</text>
  <text x="243" y="273" font-size="11" fill="#2f5a22" filter="url(#rough2)">s[5]=‘b’ = s[2]=‘b’ ✓ → j=3</text>
  <text x="555" y="273" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">3</text>

  <!-- 列分隔线 -->
  <path d="M 92 52 L 92 286" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 140 52 L 140 286" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 235 52 L 235 286" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 520 52 L 520 286" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 答案框 -->
  <rect x="170" y="300" width="300" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">π[5] = 3 ⇒ 答案 s[0:3] = “aab”</text>

  <!-- 对照示例 -->
  <rect x="40" y="354" width="285" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="377" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4258" filter="url(#rough2)">“ababab”：π = [0,0,1,2,3,4]</text>
  <text x="182" y="398" text-anchor="middle" font-size="11.5" fill="#2c4258" filter="url(#rough2)">→ 答案 “abab”（全程无回退）</text>

  <rect x="350" y="354" width="250" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="377" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4258" filter="url(#rough2)">“level”：π = [0,0,0,0,1]</text>
  <text x="475" y="398" text-anchor="middle" font-size="11.5" fill="#2c4258" filter="url(#rough2)">→ 答案 “l”（末位才匹配）</text>
</svg>
