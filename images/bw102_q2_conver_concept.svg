<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">conver[i] = nums[i] + max(nums[0..i])，分数 = Σ conver</text>

  <!-- nums 行 -->
  <text x="90" y="86" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)">
    <rect x="140" y="64" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="168" y="87" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="196" y="64" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="224" y="87" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="252" y="64" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="280" y="87" text-anchor="middle" font-size="13" fill="#b85450">7</text>
    <rect x="308" y="64" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="336" y="87" text-anchor="middle" font-size="13" fill="#333">5</text>
    <rect x="364" y="64" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="392" y="87" text-anchor="middle" font-size="13" fill="#b85450">10</text>
  </g>

  <!-- runMax 行 -->
  <text x="90" y="132" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">前缀最大</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="140" y="110" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="168" y="131" text-anchor="middle">2</text>
    <rect x="196" y="110" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="224" y="131" text-anchor="middle">3</text>
    <rect x="252" y="110" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="280" y="131" text-anchor="middle">7</text>
    <rect x="308" y="110" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="336" y="131" text-anchor="middle">7</text>
    <rect x="364" y="110" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="392" y="131" text-anchor="middle">10</text>
  </g>
  <text x="460" y="131" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">两个量都能</text>
  <text x="460" y="147" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">增量维护！</text>

  <!-- 相加箭头 -->
  <path d="M 168 146 C 168 160, 168 158, 168 172" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 168 88 C 168 100, 168 110, 168 146" stroke="#446688" stroke-width="0" fill="none"/>

  <!-- conver 行 -->
  <text x="90" y="190" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">conver</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="140" y="168" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="168" y="191" text-anchor="middle">4</text>
    <rect x="196" y="168" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="224" y="191" text-anchor="middle">6</text>
    <rect x="252" y="168" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="191" text-anchor="middle">14</text>
    <rect x="308" y="168" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="336" y="191" text-anchor="middle">12</text>
    <rect x="364" y="168" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="392" y="191" text-anchor="middle">20</text>
  </g>

  <!-- 累加 -->
  <path d="M 392 204 C 420 226, 300 236, 280 238" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans 行 -->
  <text x="90" y="274" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">ans</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="140" y="252" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="168" y="274" text-anchor="middle">4</text>
    <rect x="196" y="252" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="224" y="274" text-anchor="middle">10</text>
    <rect x="252" y="252" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="280" y="274" text-anchor="middle">24</text>
    <rect x="308" y="252" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="336" y="274" text-anchor="middle">36</text>
    <rect x="364" y="252" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="392" y="274" text-anchor="middle">56</text>
  </g>
  <text x="280" y="310" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">ans[i] = ans[i−1] + conver[i]，无需回算前缀</text>
</svg>
