<svg xmlns="http://www.w3.org/2000/svg" width="640" height="436" viewBox="0 0 640 436" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="436" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">查询 [l, r] = [1, 5]：在 f 上二分出分界点 p，拆成两部分求和</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">f = [0, 0, 0, 3, 3, 3, 6] 单调不减，p = 第一个 f[p] &gt; l = 1 的下标 = 3</text>

  <rect x="168" y="74" width="304" height="66" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="110" y="84" width="60" height="46" rx="4" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.5"/>
    <rect x="170" y="84" width="60" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="230" y="84" width="60" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="290" y="84" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="350" y="84" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="410" y="84" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="470" y="84" width="60" height="46" rx="4" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.5"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="140" y="114" fill="#999999">2</text>
    <text x="200" y="114" fill="#3a6a2a">5</text>
    <text x="260" y="114" fill="#3a6a2a">5</text>
    <text x="320" y="114" fill="#33517a">4</text>
    <text x="380" y="114" fill="#33517a">7</text>
    <text x="440" y="114" fill="#33517a">8</text>
    <text x="500" y="114" fill="#999999">6</text>
  </g>

  <text x="200" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">l = 1</text>
  <text x="440" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">r = 5</text>

  <text x="100" y="184" text-anchor="end" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">f[i]</text>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#446688" filter="url(#sk)">
    <text x="140" y="184">0</text>
    <text x="200" y="184">0</text>
    <text x="260" y="184">0</text>
    <text x="320" y="184">3</text>
    <text x="380" y="184">3</text>
    <text x="440" y="184">3</text>
    <text x="500" y="184">6</text>
  </g>

  <path d="M 290 78 L 290 202" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="298" y="218" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">p = 3（f[3] = 3 &gt; 1 = l）</text>

  <g filter="url(#sk)">
    <rect x="170" y="228" width="120" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="290" y="228" width="180" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="140" y="248" fill="#aaaaaa">—</text>
    <text x="200" y="248" fill="#3a6a2a">1</text>
    <text x="260" y="248" fill="#3a6a2a">2</text>
    <text x="320" y="248" fill="#33517a">1</text>
    <text x="380" y="248" fill="#33517a">2</text>
    <text x="440" y="248" fill="#33517a">3</text>
    <text x="500" y="248" fill="#aaaaaa">—</text>
  </g>
  <text x="100" y="248" text-anchor="end" font-size="12" font-weight="bold" fill="#888888" filter="url(#sk)">贡献</text>
  <text x="230" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">A：贡献 i − l + 1</text>
  <text x="382" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">B：贡献 g[i] = i − f[i] + 1</text>

  <rect x="52" y="290" width="272" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="188" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">A 部分：i ∈ [l, p−1]，f[i] ≤ l</text>
  <text x="188" y="334" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">所在段跨过 l → 左端点最早只能取 l</text>
  <text x="188" y="354" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">Σ(i−l+1) = cnt·(cnt+1)/2（等差数列）</text>
  <text x="188" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">= 1 + 2 = 3</text>

  <rect x="316" y="290" width="272" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="452" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#sk)">B 部分：i ∈ [p, r]，f[i] &gt; l</text>
  <text x="452" y="334" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">所在段整体在 (l, r] 内 → 不受 l 限制</text>
  <text x="452" y="354" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">Σ(i−f[i]+1) = Σi − Σf + cnt（前缀和）</text>
  <text x="452" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#sk)">= 12 − 9 + 3 = 6</text>

  <rect x="225" y="398" width="190" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6520" filter="url(#sk)">ans = 3 + 6 = 9</text>
</svg>
