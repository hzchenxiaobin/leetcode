<svg xmlns="http://www.w3.org/2000/svg" width="660" height="458" viewBox="0 0 660 458" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="213" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="458" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">最短写法：answer(t) = bisect_right(starts, t) − bisect_left(ends, t)</text>
  <path d="M 120 38 Q 330 46 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- starts row -->
  <text x="142" y="99" text-anchor="end" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">starts =</text>
  <g filter="url(#sk)">
    <rect x="150" y="76" width="64" height="34" rx="6" fill="#4a7a3a" stroke="#2e5e2e" stroke-width="1.8"/>
    <rect x="230" y="76" width="64" height="34" rx="6" fill="#4a7a3a" stroke="#2e5e2e" stroke-width="1.8"/>
    <rect x="310" y="76" width="64" height="34" rx="6" fill="#4a7a3a" stroke="#2e5e2e" stroke-width="1.8"/>
    <rect x="390" y="76" width="64" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="182" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
    <text x="262" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
    <text x="342" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
    <text x="422" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">9</text>
  </g>
  <text x="470" y="99" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">= #{start ≤ t}</text>
  <line x1="382" y1="56" x2="382" y2="72" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="382" y="48" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">bisect_right(starts, 7) = 3</text>
  <text x="330" y="136" text-anchor="middle" font-size="12" fill="#2e5e2e" filter="url(#sk)">数的是 ≤ 7 的：{1, 3, 4} —— 若某 start 恰为 7 也算（含等号，当天开就算开）</text>

  <!-- ends row -->
  <text x="142" y="221" text-anchor="end" font-size="13" font-weight="bold" fill="#8f3a35" filter="url(#sk)">ends =</text>
  <g filter="url(#sk)">
    <rect x="150" y="198" width="64" height="34" rx="6" fill="#b85450" stroke="#8f3a35" stroke-width="1.8"/>
    <rect x="230" y="198" width="64" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="5 3"/>
    <rect x="310" y="198" width="64" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="390" y="198" width="64" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="182" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">6</text>
    <text x="262" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">7</text>
    <text x="342" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3a35">12</text>
    <text x="422" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3a35">13</text>
  </g>
  <text x="470" y="221" font-size="12.5" font-weight="bold" fill="#8f3a35" filter="url(#sk)">= #{end &lt; t}</text>
  <line x1="230" y1="178" x2="230" y2="194" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="230" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">bisect_left(ends, 7) = 1</text>
  <text x="268" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">t=7 落在这</text>
  <text x="330" y="258" text-anchor="middle" font-size="12" fill="#8f3a35" filter="url(#sk)">数的是 &lt; 7 的：{6} —— 端点 7 本身不算（end = t 当天仍盛开！）</text>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="180" y="282" width="300" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="330" y="311" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6415" filter="url(#sk)">answer(7) = 3 − 1 = 2</text>

  <!-- direction callout -->
  <g filter="url(#sk)">
    <rect x="40" y="344" width="585" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="332" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a35" filter="url(#sk)">两端包含性相反 → 二分方向相反：start ≤ t 含等号用 right；end &lt; t 严格小于用 left</text>
  <text x="332" y="388" text-anchor="middle" font-size="11.5" fill="#8f3a35" filter="url(#sk)">starts 误用 left 会漏「当天开」；ends 误用 right 会把「当天谢」误判为已谢</text>

  <!-- API mapping -->
  <g filter="url(#sk)">
    <rect x="40" y="412" width="585" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="332" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">C++ 与 Python 对应：upper_bound ↔ bisect_right（停在首个 &gt; t）；lower_bound ↔ bisect_left（停在首个 ≥ t）</text>
</svg>
