<svg xmlns="http://www.w3.org/2000/svg" width="940" height="830" viewBox="0 0 940 830" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="830" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一次遍历 + 段首判定，额外空间 O(1)</text>
  <path d="M 300 46 Q 470 54 640 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- note box top-left -->
  <g filter="url(#sk)">
    <rect x="48" y="52" width="250" height="146" rx="10" fill="#fdf2f4" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="173" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">为什么内层不超时？</text>
  <text x="64" y="104" font-size="11" fill="#444" filter="url(#sk)">内层 while 只跨过相等值</text>
  <text x="64" y="128" font-size="11" fill="#444" filter="url(#sk)">每个下标至多被越过 1 次</text>
  <text x="64" y="152" font-size="11" fill="#444" filter="url(#sk)">总代价 ≤ 2n → 整体 O(n)</text>
  <text x="64" y="176" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">无辅助数组：空间 O(1)</text>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="430" cy="70" rx="48" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="430" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">开始</text>
  <path d="M 430 90 L 430 108" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="320" y="110" width="220" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="430" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">ans = 0；n = len(nums)</text>
  <path d="M 430 152 L 430 176" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 0 : loop head -->
  <g filter="url(#sk)">
    <polygon points="430,178 560,228 430,278 300,228" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="430" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">i ≤ n−2 ?</text>
  <text x="430" y="242" text-anchor="middle" font-size="10" fill="#8a6a30" filter="url(#sk)">（还有候选下标？）</text>

  <!-- no -> return -->
  <path d="M 300 228 L 212 228" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="256" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <ellipse cx="142" cy="228" rx="66" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="142" y="234" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">返回 ans</text>

  <!-- yes -> diamond 1 -->
  <path d="M 430 278 L 430 302" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="444" y="294" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>

  <!-- diamond 1 : segment head? -->
  <g filter="url(#sk)">
    <polygon points="430,304 555,354 430,404 305,354" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="430" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">nums[i] == nums[i−1] ?</text>
  <text x="430" y="368" text-anchor="middle" font-size="10" fill="#8a6a30" filter="url(#sk)">（非段首？）</text>

  <!-- yes -> skip -->
  <path d="M 555 354 L 630 354" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="574" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="634" y="330" width="242" height="48" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1.6"/>
  </g>
  <text x="755" y="350" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">跳过（非段首）</text>
  <text x="755" y="368" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">本段已在段首判过</text>

  <!-- no -> find right neighbor -->
  <path d="M 430 404 L 430 428" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="444" y="420" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="300" y="430" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="430" y="449" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">r ← i+1，向右跳过相等值</text>
  <text x="430" y="467" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#sk)">（定位右侧最近不等邻居）</text>
  <path d="M 430 478 L 430 502" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 : tail? -->
  <g filter="url(#sk)">
    <polygon points="430,504 550,554 430,604 310,554" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="430" y="550" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">r == n ?</text>
  <text x="430" y="568" text-anchor="middle" font-size="10" fill="#8a6a30" filter="url(#sk)">（右侧无不等邻居？）</text>

  <!-- yes -> tail skip -->
  <path d="M 550 554 L 626 554" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="570" y="544" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="630" y="530" width="246" height="48" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1.6"/>
  </g>
  <text x="753" y="550" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">尾段不计（无右邻）</text>
  <text x="753" y="568" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">首尾边界规则</text>

  <!-- no -> diamond 3 -->
  <path d="M 430 604 L 430 628" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="444" y="620" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <!-- diamond 3 : hill or vale? -->
  <g filter="url(#sk)">
    <polygon points="430,630 565,686 430,742 295,686" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="430" y="678" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">比两侧都大 或 都小 ?</text>
  <text x="430" y="696" text-anchor="middle" font-size="10" fill="#8a6a30" filter="url(#sk)">（峰或谷 → 计数）</text>

  <!-- yes -> ans++ -->
  <path d="M 565 686 L 630 686" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="584" y="676" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="634" y="662" width="242" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="755" y="682" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">ans += 1</text>
  <text x="755" y="700" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">（峰或谷 +1）</text>

  <!-- no -> join rail -->
  <path d="M 430 742 L 430 776" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="444" y="762" font-size="11" fill="#b85450" filter="url(#sk)">非峰非谷，不计</text>

  <!-- ans box down to join rail -->
  <path d="M 755 710 L 755 780" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <!-- skip / tail stubs into right rail -->
  <path d="M 876 354 L 920 354" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 876 554 L 920 554" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <!-- join rail up to i += 1 -->
  <path d="M 430 780 L 920 780 L 920 156 L 798 156" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="675" y="768" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">所有分支汇合</text>

  <!-- i += 1 box -->
  <g filter="url(#sk)">
    <rect x="708" y="136" width="90" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="753" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">i += 1</text>
  <path d="M 708 156 L 436 156" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="575" y="146" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">下一个 i</text>

  <text x="470" y="814" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">段首判定 = 压缩思想的 O(1) 空间形态：不建 b 数组，判定参数与压缩版逐段一致</text>
</svg>
