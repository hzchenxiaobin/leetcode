<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：6 个句子的展开树与字典序</text>

  <!-- 句子槽位 -->
  <text x="46" y="64" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">text = "I am happy today but was sad yesterday"</text>
  <g filter="url(#rough2)">
    <rect x="46"  y="78" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="98"  y="78" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="78" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="222" y="78" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="286" y="78" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="342" y="78" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="398" y="78" width="66" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="464" y="78" width="82" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="72"  y="99">I</text><text x="124" y="99">am</text><text x="186" y="99" fill="#2d5a22" font-weight="bold">happy</text>
    <text x="254" y="99">today</text><text x="314" y="99">but</text><text x="370" y="99">was</text>
    <text x="431" y="99" fill="#7a5c1e" font-weight="bold">sad</text><text x="505" y="99">yesterday</text>
  </g>
  <text x="186" y="132" text-anchor="middle" font-size="11" fill="#2d5a22" filter="url(#rough2)">3 选 1</text>
  <text x="431" y="132" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">2 选 1</text>

  <!-- 展开树 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.5" fill="none">
    <path d="M 200 152 L 120 190"/>
    <path d="M 200 152 L 200 190"/>
    <path d="M 200 152 L 280 190"/>
    <path d="M 120 190 L 90 230"/>
    <path d="M 120 190 L 150 230"/>
    <path d="M 200 190 L 200 230"/>
    <path d="M 280 190 L 270 230"/>
    <path d="M 280 190 L 310 230"/>
  </g>
  <g filter="url(#rough2)">
    <ellipse cx="200" cy="146" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <ellipse cx="120" cy="194" rx="36" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <ellipse cx="200" cy="194" rx="36" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <ellipse cx="280" cy="194" rx="36" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="200" y="151">happy</text>
    <text x="120" y="199">cheerful</text><text x="200" y="199">happy</text><text x="280" y="199">joy</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60"  y="232" width="62" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="128" y="232" width="62" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="170" y="232" width="62" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="238" y="232" width="62" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="246" y="232" width="62" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="290" y="232" width="62" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#7a2e2a" text-anchor="middle">
    <text x="91"  y="251">+ sad</text><text x="159" y="251">+ sorrow</text>
    <text x="201" y="251">+ sad</text><text x="269" y="251">+ sorrow</text>
    <text x="277" y="251">+ sad</text><text x="321" y="251">+ sorrow</text>
  </g>
  <text x="416" y="186" font-size="12" fill="#446688" filter="url(#rough2)">每个叶子 = 一句完整输出</text>
  <text x="416" y="204" font-size="12" fill="#446688" filter="url(#rough2)">3 × 2 = 6 句</text>
  <text x="416" y="226" font-size="12" fill="#7a5c1e" filter="url(#rough2)">最终排序后：</text>
  <text x="416" y="244" font-size="11" fill="#7a5c1e" filter="url(#rough2)">cheerful…sad 在最前</text>
  <text x="416" y="260" font-size="11" fill="#7a5c1e" filter="url(#rough2)">joy…sorrow 在最后</text>

  <!-- 排序结果 -->
  <rect x="46" y="290" width="480" height="126" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="62" y="314">1. I am cheerful today but was sad yesterday</text>
    <text x="62" y="334">2. I am cheerful today but was sorrow yesterday</text>
    <text x="62" y="354">3. I am happy today but was sad yesterday</text>
    <text x="62" y="374">4. I am happy today but was sorrow yesterday</text>
    <text x="62" y="394">5. I am joy today but was sad yesterday</text>
    <text x="62" y="411" font-size="11">6. I am joy today but was sorrow yesterday</text>
  </g>
</svg>
