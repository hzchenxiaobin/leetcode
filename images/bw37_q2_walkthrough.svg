<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：在 (2,1) 累加三座塔的信号</text>

  <!-- 坐标区（放大示例区域 0..3 x 0..2） -->
  <g filter="url(#rough2)" stroke="#d8d8d8" stroke-width="1">
    <line x1="70" y1="240" x2="330" y2="240"/>
    <line x1="70" y1="240" x2="70" y2="120"/>
  </g>
  <g filter="url(#rough2)" stroke="#e8e8e8" stroke-width="1">
    <line x1="130" y1="240" x2="130" y2="120"/>
    <line x1="190" y1="240" x2="190" y2="120"/>
    <line x1="250" y1="240" x2="250" y2="120"/>
    <line x1="310" y1="240" x2="310" y2="120"/>
    <line x1="70" y1="180" x2="330" y2="180"/>
    <line x1="70" y1="120" x2="330" y2="120"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#aaa" text-anchor="middle">
    <text x="100" y="256">0</text><text x="160" y="256">1</text>
    <text x="220" y="256">2</text><text x="280" y="256">3</text>
    <text x="56" y="244">0</text><text x="56" y="184">1</text><text x="56" y="124">2</text>
  </g>

  <!-- 塔 -->
  <g filter="url(#rough2)">
    <circle cx="160" cy="120" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="220" cy="180" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="280" cy="180" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#446688">
    <text x="120" y="108">(1,2) q=5</text>
    <text x="160" y="200">(2,1) q=7</text>
    <text x="292" y="170">(3,1) q=9</text>
  </g>

  <!-- 候选点 (2,1) -->
  <g filter="url(#rough2)">
    <circle cx="220" cy="180" r="14" fill="none" stroke="#b85450" stroke-width="2.4" stroke-dasharray="4,3"/>
  </g>
  <text x="238" y="152" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">P=(2,1) ✓ 最优</text>

  <!-- 贡献箭头 -->
  <path d="M 152 126 C 180 140, 200 158, 212 168" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 272 180 L 238 180" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧算力表 -->
  <g filter="url(#rough2)">
    <rect x="350" y="52" width="192" height="232" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="8"/>
    <line x1="350" y1="90" x2="542" y2="90" stroke="#bbb" stroke-width="1.2"/>
    <line x1="350" y1="128" x2="542" y2="128" stroke="#bbb" stroke-width="1.2"/>
    <line x1="350" y1="166" x2="542" y2="166" stroke="#bbb" stroke-width="1.2"/>
    <line x1="350" y1="204" x2="542" y2="204" stroke="#bbb" stroke-width="1.2"/>
    <line x1="470" y1="52" x2="470" y2="284" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#555" text-anchor="middle">
    <text x="410" y="72" font-weight="bold">坐标</text><text x="506" y="72" font-weight="bold">信号强度</text>
    <text x="410" y="110" fill="#b85450" font-weight="bold">(2,1)</text><text x="506" y="110" fill="#b85450" font-weight="bold">7+2+4=13</text>
    <text x="410" y="148">(3,1)</text><text x="506" y="148">3+1+9=12</text>
    <text x="410" y="186">(1,1)</text><text x="506" y="186">3+2+3=8</text>
    <text x="410" y="224">(2,2)</text><text x="506" y="224">3+2+3=8</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="356" y="86" width="184" height="30" fill="none" stroke="#b85450" stroke-width="2" rx="6"/>
  </g>

  <text x="280" y="316" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">(2,1) 的分解：d=0 → 7；d=√2 → ⌊5/2.41⌋=2；d=1 → ⌊9/2⌋=4</text>
</svg>
