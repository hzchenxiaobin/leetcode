<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="356" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：逐字母查表拼接 → 整串丢进集合去重</text>
  <text x="290" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个单词先做「单词翻译」得到一个点划串；不同单词可能翻译出同一个串</text>

  <!-- 第 1 行：gin -->
  <rect x="30" y="84" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="58" y="104" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">gin</text>
  <rect x="98" y="84" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="104" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">g=--.</text>
  <rect x="160" y="84" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="187" y="104" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">i=..</text>
  <rect x="222" y="84" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="249" y="104" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">n=-.</text>
  <path d="M 282 99 L 300 99" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="104" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">--...-.</text>

  <!-- 第 2 行：zen -->
  <rect x="30" y="138" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="58" y="158" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">zen</text>
  <rect x="98" y="138" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="158" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">z=--..</text>
  <rect x="160" y="138" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="187" y="158" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">e=.</text>
  <rect x="222" y="138" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="249" y="158" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">n=-.</text>
  <path d="M 282 153 L 300 153" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="158" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">--...-.</text>

  <!-- 第 3 行：gig -->
  <rect x="30" y="192" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="58" y="212" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">gig</text>
  <rect x="98" y="192" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="212" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">g=--.</text>
  <rect x="160" y="192" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="187" y="212" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">i=..</text>
  <rect x="222" y="192" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="249" y="212" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">g=--.</text>
  <path d="M 282 207 L 300 207" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="212" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">--...--.</text>

  <!-- 第 4 行：msg -->
  <rect x="30" y="246" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="58" y="266" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">msg</text>
  <rect x="98" y="246" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="266" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">m=--</text>
  <rect x="160" y="246" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="187" y="266" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">s=...</text>
  <rect x="222" y="246" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="249" y="266" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">g=--.</text>
  <path d="M 282 261 L 300 261" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="266" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">--...--.</text>

  <!-- 集合 -->
  <rect x="392" y="64" width="176" height="224" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="480" y="86" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">哈希集合 set</text>
  <rect x="404" y="100" width="152" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="480" y="124" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">--...-.</text>
  <rect x="404" y="146" width="152" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="480" y="170" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">--...--.</text>
  <text x="480" y="214" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">|set| = 2</text>
  <text x="480" y="240" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">重复插入不改变大小</text>
  <text x="480" y="266" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">答案 = 2</text>
  <path d="M 372 180 L 388 180" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="172" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">insert</text>

  <text x="290" y="312" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">撞码例子：gin 与 zen 都拼出 --...-.；gig 与 msg 都拼出 --...--.</text>
  <text x="290" y="336" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">所以去重对象必须是「翻译后的串」，不是原单词</text>
</svg>
