<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：m = 37，limit = 9 → k = 14 段</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">total(14) = 14×(9−2−3) − D(14) = 56 − 19 = 37 = m，恰好装下</text>

  <g filter="url(#rough2)">
    <rect x="40" y="66" width="480" height="120" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8"/>
  </g>
  <text x="66" y="90" font-size="11" fill="#666" font-weight="bold">段号 i</text>
  <text x="150" y="90" font-size="11" fill="#666" font-weight="bold">digits(i)</text>
  <text x="250" y="90" font-size="11" fill="#666" font-weight="bold">后缀长度</text>
  <text x="370" y="90" font-size="11" fill="#666" font-weight="bold">cap(i) = 9 − 后缀</text>

  <text x="66" y="116" font-size="12" fill="#4a7a3a" font-weight="bold">1..9</text>
  <text x="150" y="116" font-size="12" fill="#555">1</text>
  <text x="250" y="116" font-size="12" fill="#555">1+2+3 = 6</text>
  <text x="370" y="116" font-size="12" fill="#4a7a3a" font-weight="bold">3（共 9 段 × 3 = 27 字符）</text>

  <line x1="56" y1="128" x2="504" y2="128" stroke="#eee" stroke-width="1"/>

  <text x="66" y="152" font-size="12" fill="#d6a040" font-weight="bold">10..14</text>
  <text x="150" y="152" font-size="12" fill="#555">2</text>
  <text x="250" y="152" font-size="12" fill="#555">2+2+3 = 7</text>
  <text x="370" y="152" font-size="12" fill="#d6a040" font-weight="bold">2（共 5 段 × 2 = 10 字符）</text>

  <line x1="56" y1="162" x2="504" y2="162" stroke="#eee" stroke-width="1"/>
  <text x="66" y="182" font-size="11" fill="#666">合计</text>
  <text x="370" y="182" font-size="11.5" fill="#666" font-weight="bold">27 + 10 = 37 = m ✓</text>

  <g filter="url(#rough2)">
    <rect x="40" y="204" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="96" y="204" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="170" y="204" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="244" y="204" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="294" y="204" width="40" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="338" y="204" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="412" y="204" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <text x="66" y="224" text-anchor="middle" font-size="9.5" fill="#446688">thi</text>
  <text x="131" y="224" text-anchor="middle" font-size="9.5" fill="#d6a040">&lt;1/14&gt;</text>
  <text x="205" y="224" text-anchor="middle" font-size="9.5" fill="#d6a040">&lt;2/14&gt;</text>
  <text x="267" y="224" text-anchor="middle" font-size="9.5" fill="#446688">s r</text>
  <text x="314" y="224" text-anchor="middle" font-size="9.5" fill="#999">……</text>
  <text x="373" y="224" text-anchor="middle" font-size="9.5" fill="#4a7a3a">me</text>
  <text x="447" y="224" text-anchor="middle" font-size="9.5" fill="#4a7a3a">&lt;14/14&gt;</text>
  <text x="280" y="252" text-anchor="middle" font-size="10" fill="#888">每段总长恰为 9（蓝色正文 + 橙色/绿色后缀）</text>

  <rect x="40" y="268" width="230" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="155" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k = 13 行吗？</text>
  <text x="155" y="310" text-anchor="middle" font-size="10.5" fill="#555">total(13) = 13×4 − 17 = 35 &lt; 37 ✗</text>

  <rect x="290" y="268" width="230" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="405" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">对照示例 2：m=13, limit=15</text>
  <text x="405" y="310" text-anchor="middle" font-size="10.5" fill="#555">k=2：total = 2×(15−1−3) − 2 = 20 ≥ 13 ✓</text>

  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">注意最后一段也允许 &lt; limit（题目只约束「前面各段 = limit」）</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999">但贪心构造下最后一段 2+7=9 恰好也等于 limit；「age&lt;2/2&gt;」长 8 &lt; 15 合法</text>
</svg>
