<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：异或自反 → 相邻 pref 作差即还原 arr</text>

  <!-- top panel: cancellation derivation -->
  <g filter="url(#sk)"><rect x="20" y="44" width="600" height="170" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">相邻两个前缀，中间只隔一个 arr[i]</text>
  <text x="320" y="98" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">pref[i] = pref[i−1] ⊕ arr[i]　（i ≥ 1）</text>
  <text x="320" y="126" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">两边同时 ⊕ pref[i−1]：</text>
  <g filter="url(#sk)"><rect x="118" y="140" width="82" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="332" y="140" width="82" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="320" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">pref[i] ⊕ pref[i−1] = pref[i−1] ⊕ arr[i] ⊕ pref[i−1]</text>
  <path d="M 205 152 L 328 152" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="266" y="140" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">a ⊕ a = 0</text>
  <text x="320" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">⇒　arr[i] = pref[i] ⊕ pref[i−1]</text>

  <!-- bottom left: prefix-sum analogy -->
  <g filter="url(#sk)"><rect x="20" y="232" width="292" height="222" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="166" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">前缀和的差分还原（老朋友）</text>
  <g filter="url(#sk)"><rect x="56" y="274" width="70" height="30" rx="5" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="140" y="274" width="70" height="30" rx="5" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="224" y="274" width="70" height="30" rx="5" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <text x="91" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">pref[0]</text>
  <text x="175" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">pref[1]</text>
  <text x="259" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">pref[2]</text>
  <path d="M 130 312 L 236 312" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="183" y="332" text-anchor="middle" font-size="11.5" fill="#2e5e2e" filter="url(#sk)">arr[i] = pref[i] − pref[i−1]</text>
  <text x="166" y="362" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">累积用 +，还原用 −</text>
  <text x="166" y="384" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">加减互为逆运算</text>
  <text x="166" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">前缀 → 差分：一次相减</text>

  <!-- bottom right: prefix-xor analogy -->
  <g filter="url(#sk)"><rect x="328" y="232" width="292" height="222" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="474" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#sk)">前缀异或的差分还原（本题）</text>
  <g filter="url(#sk)"><rect x="364" y="274" width="70" height="30" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="448" y="274" width="70" height="30" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="532" y="274" width="70" height="30" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="399" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">pref[0]</text>
  <text x="483" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">pref[1]</text>
  <text x="567" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">pref[2]</text>
  <path d="M 438 312 L 544 312" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="491" y="332" text-anchor="middle" font-size="11.5" fill="#a06a1a" filter="url(#sk)">arr[i] = pref[i] ⊕ pref[i−1]</text>
  <text x="474" y="362" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">累积用 ⊕，还原也用 ⊕</text>
  <text x="474" y="384" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">⊕ 的逆运算是它自己</text>
  <text x="474" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a" filter="url(#sk)">前缀 → 差分：一次异或</text>
  <path d="M 312 342 L 328 342" fill="none" stroke="#8a6a2a" stroke-width="1.4" marker-end="url(#arR)" filter="url(#sk)"/>
</svg>
