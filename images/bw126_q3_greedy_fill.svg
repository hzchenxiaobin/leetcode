<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 362" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="560" height="362" fill="#fafafa"/>
<text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="normal" filter="url(#roughs)">两步：先定「填哪些字母」，再定「每个位置填谁」</text>
<ellipse cx="280" cy="60" rx="104" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="280" y="66" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">统计 26 个字母的频次</text>
<path d="M280,84 L280,104" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="120" y="106" width="320" height="56" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="128" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">对每个 '?'：取堆顶 (频次, 字母)</text>
<text x="280" y="148" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">收集该字母，并把它的频次 +1</text>
<path d="M280,162 L280,182" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="120" y="184" width="320" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="206" text-anchor="middle" font-size="13" fill="#8a5a10" font-weight="bold" filter="url(#roughs)">把收集到的字母升序排序</text>
<text x="280" y="224" text-anchor="middle" font-size="10" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">贪心取出的顺序未必非递减，必须重排</text>
<path d="M280,232 L280,252" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="120" y="254" width="320" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="276" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">从左到右，把 '?' 依次换成排序后的字母</text>
<text x="280" y="294" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">小的字母放前面 → 字典序最小</text>
<path d="M280,302 L280,320" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="280" y="344" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">示例 s = "a?a?"：取到 [b, c] → 排序不变 → "abac"</text>
</svg>
