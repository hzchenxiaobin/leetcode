<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="720" height="372" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">可排序 ⟺ 每个置换环内部同色</text>

  <!-- 排列 2 3 1 | 5 6 4 | 8 7 -->
  <rect x="84" y="78" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="130" y="78" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="176" y="78" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="268" y="78" width="46" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="314" y="78" width="46" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="360" y="78" width="46" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="452" y="78" width="46" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="498" y="78" width="46" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="107" y="108" text-anchor="middle" font-size="19" fill="#33517a" filter="url(#rough2)">2</text>
  <text x="153" y="108" text-anchor="middle" font-size="19" fill="#33517a" filter="url(#rough2)">3</text>
  <text x="199" y="108" text-anchor="middle" font-size="19" fill="#33517a" filter="url(#rough2)">1</text>
  <text x="291" y="108" text-anchor="middle" font-size="19" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="337" y="108" text-anchor="middle" font-size="19" fill="#3a5a30" filter="url(#rough2)">6</text>
  <text x="383" y="108" text-anchor="middle" font-size="19" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="475" y="108" text-anchor="middle" font-size="19" fill="#8a6a20" filter="url(#rough2)">8</text>
  <text x="521" y="108" text-anchor="middle" font-size="19" fill="#8a6a20" filter="url(#rough2)">7</text>

  <text x="107" y="140" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="153" y="140" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="199" y="140" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="291" y="140" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="337" y="140" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">5</text>
  <text x="383" y="140" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">6</text>
  <text x="475" y="140" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">7</text>
  <text x="521" y="140" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">8</text>

  <path d="M 82 72 L 82 64 L 224 64 L 224 72" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="56" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#rough2)">环 (1 2 3)，长度 3</text>
  <path d="M 266 72 L 266 64 L 408 64 L 408 72" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="337" y="56" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">环 (4 5 6)，长度 3</text>
  <path d="M 450 72 L 450 64 L 546 64 L 546 72" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="498" y="56" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">环 (7 8)</text>

  <text x="620" y="106" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">每个环是一个</text>
  <text x="620" y="124" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">独立的置换块</text>

  <path d="M 360 156 L 360 178" fill="none" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#rough2)"/>

  <!-- 同色 ok -->
  <rect x="40" y="186" width="300" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="190" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">整环同色 → 可以排好 ✓</text>
  <text x="190" y="232" text-anchor="middle" font-size="11" fill="#4a6a40" filter="url(#rough2)">环内元素只在环内流转，一定能转回原位；</text>
  <text x="190" y="250" text-anchor="middle" font-size="11" fill="#4a6a40" filter="url(#rough2)">不同环互不干扰，逐环摆平即可。</text>

  <!-- 混色 fail -->
  <rect x="380" y="186" width="300" height="74" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="530" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8d3a35" filter="url(#rough2)">环内混色 → 无法排好 ✗</text>
  <text x="530" y="232" text-anchor="middle" font-size="11" fill="#8d3a35" filter="url(#rough2)">某个位置需要的值被锁在另一颜色里，</text>
  <text x="530" y="250" text-anchor="middle" font-size="11" fill="#8d3a35" filter="url(#rough2)">颜色类内的「值与位置」集合对不上。</text>

  <rect x="40" y="276" width="640" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#rough2)">由此得到两条铁律</text>
  <text x="60" y="320" font-size="11" fill="#7a5f1e" filter="url(#rough2)">① Alice 的安全着法：把若干「完整」环一起染色（同回合同色，总长度 ≤ k），或补完 Bob 刚开的环。</text>
  <text x="60" y="340" font-size="11" fill="#7a5f1e" filter="url(#rough2)">② Alice 若把某个环染成「一半有色、一半还白」，Bob 下一步用反色填白即胜 —— 半染环 = 送分。</text>
</svg>
