<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="560" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：判定可按列拆开，合规列整列计数</text>

  <!-- 列下标 -->
  <text x="148" y="80" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="204" y="80" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>
  <text x="260" y="80" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="316" y="80" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3</text>
  <text x="372" y="80" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>
  <text x="428" y="80" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">5</text>
  <text x="466" y="80" font-size="11" fill="#888" filter="url(#rough2)">行黑数</text>

  <!-- 行下标 -->
  <text x="106" y="117" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="106" y="161" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">1</text>
  <text x="106" y="205" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="106" y="249" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">3</text>

  <!-- 网格：4 行 × 6 列 -->
  <!-- row 0: W B W B B W -->
  <rect x="120" y="90" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="176" y="90" width="56" height="44" fill="#55606e" stroke="#3a4450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="232" y="90" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="288" y="90" width="56" height="44" fill="#55606e" stroke="#3a4450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="344" y="90" width="56" height="44" fill="#55606e" stroke="#3a4450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="400" y="90" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- row 1 -->
  <rect x="120" y="134" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="176" y="134" width="56" height="44" fill="#55606e" stroke="#3a4450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="232" y="134" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="288" y="134" width="56" height="44" fill="#55606e" stroke="#3a4450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="344" y="134" width="56" height="44" fill="#55606e" stroke="#3a4450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="400" y="134" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- row 2 -->
  <rect x="120" y="178" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="176" y="178" width="56" height="44" fill="#55606e" stroke="#3a4450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="232" y="178" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="288" y="178" width="56" height="44" fill="#55606e" stroke="#3a4450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="344" y="178" width="56" height="44" fill="#55606e" stroke="#3a4450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="400" y="178" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- row 3 -->
  <rect x="120" y="222" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="176" y="222" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="232" y="222" width="56" height="44" fill="#55606e" stroke="#3a4450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="288" y="222" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="344" y="222" width="56" height="44" fill="#55606e" stroke="#3a4450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="400" y="222" width="56" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- B / W 字符 -->
  <text x="204" y="119" text-anchor="middle" font-size="16" fill="#ffffff" filter="url(#rough2)">B</text>
  <text x="316" y="119" text-anchor="middle" font-size="16" fill="#ffffff" filter="url(#rough2)">B</text>
  <text x="372" y="119" text-anchor="middle" font-size="16" fill="#ffffff" filter="url(#rough2)">B</text>
  <text x="204" y="163" text-anchor="middle" font-size="16" fill="#ffffff" filter="url(#rough2)">B</text>
  <text x="316" y="163" text-anchor="middle" font-size="16" fill="#ffffff" filter="url(#rough2)">B</text>
  <text x="372" y="163" text-anchor="middle" font-size="16" fill="#ffffff" filter="url(#rough2)">B</text>
  <text x="204" y="207" text-anchor="middle" font-size="16" fill="#ffffff" filter="url(#rough2)">B</text>
  <text x="316" y="207" text-anchor="middle" font-size="16" fill="#ffffff" filter="url(#rough2)">B</text>
  <text x="372" y="207" text-anchor="middle" font-size="16" fill="#ffffff" filter="url(#rough2)">B</text>
  <text x="260" y="251" text-anchor="middle" font-size="16" fill="#ffffff" filter="url(#rough2)">B</text>
  <text x="372" y="251" text-anchor="middle" font-size="16" fill="#ffffff" filter="url(#rough2)">B</text>

  <!-- 合规列高亮 -->
  <rect x="173" y="85" width="62" height="186" rx="6" fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <rect x="285" y="85" width="62" height="186" rx="6" fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <rect x="341" y="85" width="62" height="186" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 行黑数 -->
  <text x="486" y="119" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3 ✓</text>
  <text x="486" y="163" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3 ✓</text>
  <text x="486" y="207" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3 ✓</text>
  <text x="486" y="251" font-size="12" fill="#b85450" filter="url(#rough2)">2 ✗</text>

  <!-- 列黑数 -->
  <text x="106" y="292" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">列黑数</text>
  <text x="148" y="292" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="204" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="316" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="372" y="292" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="428" y="292" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- 判定标注 -->
  <text x="204" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 合规列</text>
  <text x="316" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 合规列</text>
  <text x="372" y="312" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">4 ≠ N</text>
  <text x="260" y="312" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1 ≠ N</text>

  <!-- 右侧说明：第 4 列为何不算 -->
  <rect x="530" y="130" width="208" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="634" y="152" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">红虚线圈住的第 4 列</text>
  <text x="634" y="172" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">含 B 的行也全同，但</text>
  <text x="634" y="192" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">colCnt = 4 ≠ N = 3</text>
  <text x="634" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">整列不合规 → 不计</text>

  <!-- 两条规则 -->
  <rect x="76" y="336" width="292" height="82" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="360" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">规则一：行 R 与列 C</text>
  <text x="222" y="380" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">都恰好有 N 个黑像素</text>
  <text x="222" y="402" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">rowCnt[R] = N 且 colCnt[C] = N</text>

  <rect x="392" y="336" width="292" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="538" y="360" text-anchor="middle" font-size="11.5" fill="#8a6a1f" filter="url(#rough2)">规则二：列 C 上所有含 B 的行</text>
  <text x="538" y="380" text-anchor="middle" font-size="11.5" fill="#8a6a1f" filter="url(#rough2)">都必须与行 R 完全相同</text>
  <text x="538" y="402" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">⟹ 该列的行要么全同、要么整列作废</text>

  <!-- 结论 -->
  <rect x="132" y="442" width="496" height="82" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="468" text-anchor="middle" font-size="12" fill="#2f5d25" filter="url(#rough2)">合规列 c = 1, 3 各贡献 colCnt[c] = N = 3 个像素</text>
  <text x="380" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">答案 = 3 + 3 = 6 ✓</text>
</svg>
