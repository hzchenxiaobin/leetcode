<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="680" height="440" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 演算：三步贪心，答案 3</text>

  <!-- x(v) = 50 + v*37 -->
  <path d="M42,225 L650,225" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" stroke="#666" stroke-width="1">
    <line x1="50" y1="221" x2="50" y2="229"/><line x1="87" y1="221" x2="87" y2="229"/>
    <line x1="124" y1="221" x2="124" y2="229"/><line x1="161" y1="221" x2="161" y2="229"/>
    <line x1="198" y1="221" x2="198" y2="229"/><line x1="235" y1="221" x2="235" y2="229"/>
    <line x1="272" y1="221" x2="272" y2="229"/><line x1="309" y1="221" x2="309" y2="229"/>
    <line x1="346" y1="221" x2="346" y2="229"/><line x1="383" y1="221" x2="383" y2="229"/>
    <line x1="420" y1="221" x2="420" y2="229"/><line x1="457" y1="221" x2="457" y2="229"/>
    <line x1="494" y1="221" x2="494" y2="229"/><line x1="531" y1="221" x2="531" y2="229"/>
    <line x1="568" y1="221" x2="568" y2="229"/><line x1="605" y1="221" x2="605" y2="229"/>
    <line x1="642" y1="221" x2="642" y2="229"/>
  </g>
  <g font-size="9" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="50" y="240">0</text><text x="87" y="240">1</text><text x="124" y="240">2</text>
    <text x="161" y="240">3</text><text x="198" y="240">4</text><text x="235" y="240">5</text>
    <text x="272" y="240">6</text><text x="309" y="240">7</text><text x="346" y="240">8</text>
    <text x="383" y="240">9</text><text x="420" y="240">10</text><text x="457" y="240">11</text>
    <text x="494" y="240">12</text><text x="531" y="240">13</text><text x="568" y="240">14</text>
    <text x="605" y="240">15</text><text x="642" y="240">16</text>
  </g>

  <!-- 目标段（轴下方） -->
  <rect x="87" y="248" width="148" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="309" y="248" width="37" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="420" y="248" width="185" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="340" y="276" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">目标并集 S（合并后三段）：[1,5]、[7,8]、[10,15]</text>

  <!-- 可用区间（浅色薄条） -->
  <g filter="url(#rough2)">
    <rect x="87" y="204" width="111" height="7" fill="#e8f0fe" stroke="#8898b8" stroke-width="1"/>
    <rect x="87" y="204" width="222" height="7" fill="#e8f0fe" stroke="#8898b8" stroke-width="1"/>
    <rect x="161" y="204" width="222" height="7" fill="#e8f0fe" stroke="#8898b8" stroke-width="1"/>
    <rect x="235" y="204" width="185" height="7" fill="#e8f0fe" stroke="#8898b8" stroke-width="1"/>
    <rect x="420" y="204" width="185" height="7" fill="#e8f0fe" stroke="#8898b8" stroke-width="1"/>
  </g>
  <text x="640" y="199" text-anchor="end" font-size="9.5" fill="#8898b8" filter="url(#rough2)">可用区间（浅色薄条）</text>

  <!-- 选中的三个区间 -->
  <rect x="87" y="150" width="222" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">① [1,7]</text>

  <rect x="161" y="112" width="222" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">② [3,9]</text>

  <rect x="420" y="74" width="185" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="512" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">③ [10,15]</text>

  <!-- 跳跃弧线 -->
  <path d="M87,192 Q198,180 305,190" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="196" y="184" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">p=1 → cur=7</text>
  <path d="M309,190 Q346,180 379,190" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="344" y="176" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">p=7 → cur=9</text>
  <path d="M383,190 Q494,178 601,190" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="492" y="184" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">p=10 → cur=15</text>

  <!-- 演算说明 -->
  <text x="40" y="310" font-size="11" fill="#555" filter="url(#rough2)">① 段 [1,5]：cur=0 &lt; 1，p=1；候选 a≤1：[1,4]、[1,7] → 选 [1,7]（cnt=1，cur=7，伸进段 2）</text>
  <text x="40" y="334" font-size="11" fill="#555" filter="url(#rough2)">② 段 [7,8]：cur=7 ≥ s=7，p=7；候选新增 a≤7：[3,9]（[1,4] 右端 4 已废）→ 选 [3,9]（cnt=2，cur=9）</text>
  <text x="40" y="358" font-size="11" fill="#555" filter="url(#rough2)">③ 段 [10,15]：cur=9 &lt; 10，p=10；候选新增 a≤10：[5,10]、[10,15] → 选 [10,15]（cnt=3，cur=15）</text>

  <rect x="230" y="380" width="220" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="340" y="403" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">三段全覆盖 → 返回 3 ✓</text>
</svg>
