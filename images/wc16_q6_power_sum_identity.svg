<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：m 位全 1 就是一个等比数列</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = 1 + k + k^2 + ⋯ + k^(m−1) = (k^m − 1) / (k − 1)，其中 k ≥ 2、m ≥ 2</text>

  <g filter="url(#rough2)" font-size="10" fill="#3a4a66" text-anchor="middle">
    <text x="172" y="70">k^4</text>
    <text x="228" y="70">k^3</text>
    <text x="284" y="70">k^2</text>
    <text x="340" y="70">k^1</text>
    <text x="396" y="70">k^0</text>
  </g>

  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="148" y="78" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="172" y="105" fill="#3a4a66">1</text>
    <rect x="204" y="78" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="228" y="105" fill="#3a4a66">1</text>
    <rect x="260" y="78" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="284" y="105" fill="#3a4a66">1</text>
    <rect x="316" y="78" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="340" y="105" fill="#3a4a66">1</text>
    <rect x="372" y="78" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <text x="396" y="105" fill="#8a3a36">1</text>
  </g>
  <text x="280" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">n 在 k 进制下共 m 位，每一位都是 1（红色是最低位的 1）</text>

  <rect x="55" y="152" width="450" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">n = (k^m − 1) / (k − 1)</text>
  <text x="280" y="199" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">给定 n 后，只需枚举位数 m，再反解 k —— 两个未知量被拆成一个枚举 + 一个判定</text>

  <rect x="55" y="232" width="218" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="164" y="254" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">m 固定时</text>
  <text x="164" y="276" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">f(k, m) = 1 + k + ⋯ + k^(m−1)</text>
  <text x="164" y="294" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">关于 k 严格递增 ⇒ 解至多一个</text>
  <text x="164" y="314" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">于是可以对 k 二分查找</text>

  <rect x="287" y="232" width="218" height="98" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="396" y="254" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">m 变化时</text>
  <text x="396" y="276" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">m 越大 ⇒ 同一个 n 需要的 k 越小</text>
  <text x="396" y="294" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">⇒ 最小的 k 藏在最大的可行 m</text>
  <text x="396" y="314" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">⇒ m 从大到小枚举，命中即答案</text>

  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位数上界：f(2, m) = 2^m − 1 ≤ n ⇒ m ≤ ⌊log2(n + 1)⌋，n ≤ 10^18 时 m ≤ 59</text>
</svg>
