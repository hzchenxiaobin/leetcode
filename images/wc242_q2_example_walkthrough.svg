<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 318"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="318" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：dist=[1,3,2]，hour=2.7 ⇒ H = 270</text>

  <!-- table header -->
  <rect x="35" y="40" width="550" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">v</text>
  <text x="160" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">S = ⌈1/v⌉+⌈3/v⌉</text>
  <text x="280" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">末项 2/v</text>
  <text x="365" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">T(v)</text>
  <text x="495" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">100(Sv+2) ≤ 270v</text>

  <!-- row v=1 -->
  <rect x="35" y="70" width="550" height="36" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="93" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="93" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 + 3 = 4</text>
  <text x="280" y="93" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2.00</text>
  <text x="365" y="93" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6.00</text>
  <text x="495" y="93" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">600 ≤ 270 ✗</text>

  <!-- row v=2 -->
  <rect x="35" y="106" width="550" height="36" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 + 2 = 3</text>
  <text x="280" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1.00</text>
  <text x="365" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4.00</text>
  <text x="495" y="129" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">800 ≤ 540 ✗</text>

  <!-- row v=3 (answer) -->
  <rect x="35" y="142" width="550" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="60" y="165" text-anchor="middle" font-size="11.5" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="160" y="165" text-anchor="middle" font-size="11.5" fill="#2a4a1a" filter="url(#rough2)">1 + 1 = 2</text>
  <text x="280" y="165" text-anchor="middle" font-size="11.5" fill="#2a4a1a" filter="url(#rough2)">0.67</text>
  <text x="365" y="165" text-anchor="middle" font-size="11.5" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">2.67</text>
  <text x="495" y="165" text-anchor="middle" font-size="11.5" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">800 ≤ 810 ✓</text>

  <!-- row v=4 -->
  <rect x="35" y="178" width="550" height="36" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="201" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="201" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 + 1 = 2</text>
  <text x="280" y="201" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0.50</text>
  <text x="365" y="201" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2.50</text>
  <text x="495" y="201" text-anchor="middle" font-size="11.5" fill="#3a5a2a" filter="url(#rough2)">1000 ≤ 1080 ✓（非最小）</text>

  <!-- table outer border -->
  <rect x="35" y="40" width="550" height="174" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="310" y="233" text-anchor="middle" font-size="11.5" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">v = 3 是最小可行时速 ⇒ 答案 = 3（与「末项 2/3 恰被整数式 800 ≤ 810 捕捉」一致）</text>

  <!-- binary search trace box -->
  <rect x="35" y="244" width="300" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="263" text-anchor="middle" font-size="11" fill="#223a55" font-weight="bold" filter="url(#rough2)">二分收敛（[1, 10⁷]）</text>
  <text x="185" y="280" text-anchor="middle" font-size="10" fill="#33465e" filter="url(#rough2)">mid = 5000000 ✓ → hi 左移；mid ≈ 2500000 ✓ → …</text>
  <text x="185" y="296" text-anchor="middle" font-size="10" fill="#33465e" filter="url(#rough2)">每次砍半，⌈log₂ 10⁷⌉ = 24 次后收敛到 v* = 3</text>

  <!-- float pitfall box -->
  <rect x="350" y="244" width="235" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="263" text-anchor="middle" font-size="11" fill="#7a3030" font-weight="bold" filter="url(#rough2)">浮点反例（见 §8.3）</text>
  <text x="467" y="280" text-anchor="middle" font-size="10" fill="#7a4040" filter="url(#rough2)">dist=[1,1,7]，hour=2.28：T(25) = 2.28 恰相等</text>
  <text x="467" y="296" text-anchor="middle" font-size="10" fill="#7a4040" filter="url(#rough2)">浮点累加偏大 ⇒ 漏掉 25，误答 26</text>
</svg>
