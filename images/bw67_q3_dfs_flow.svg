<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：建图 → 逐点搜索 → 取最大</text>

  <rect x="90" y="52" width="340" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="13" fill="#2b3d52" filter="url(#rough2)">建邻接表：枚举有序对 (i, j)，i≠j</text>
  <text x="375" y="102" font-size="12" fill="#8a6d1a" filter="url(#rough2)">判据：dx²+dy² ≤ rᵢ²（64 位整数）</text>
  <path d="M 260 94 L 260 116" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="90" y="120" width="340" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="13.5" fill="#6b5215" filter="url(#rough2)">对每个起点 s = 0 … n−1：</text>
  <rect x="115" y="156" width="290" height="30" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="12.5" fill="#6b5215" filter="url(#rough2)">visited 清零，从 s 开始 DFS/BFS</text>
  <rect x="115" y="190" width="290" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="12.5" fill="#6b5215" filter="url(#rough2)">cnt = 可达点数（含 s），best = max(best, cnt)</text>
  <path d="M 60 172 C 48 172, 44 172, 46 172" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 46 120 C 40 150, 40 190, 46 224" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <path d="M 260 228 L 260 250" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="254" width="260" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="13.5" fill="#2e4d24" filter="url(#rough2)">返回 best（初值 1：只引爆自己）</text>

  <rect x="95" y="310" width="330" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">复杂度：建图 O(n²) + 搜索 O(n·(n+E))</text>
  <text x="260" y="344" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">n ≤ 100 → 最坏 O(n³) ≈ 10⁶，稳过</text>
</svg>
