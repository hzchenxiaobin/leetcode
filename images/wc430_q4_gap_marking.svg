<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="117" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：把数组翻译成「间隔标记」，一步闭式</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="62" text-anchor="middle" font-size="11" fill="#999">例：数组 [2, 2, 1, 1]（n = 4, k = 2）→ 间隔标记 (=, ≠, =)</text>

  <!-- 数组与间隔标记 -->
  <g filter="url(#sk)">
    <rect x="183" y="76" width="46" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="259" y="76" width="46" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="335" y="76" width="46" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="411" y="76" width="46" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <g font-size="16" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="206" y="103" fill="#2b6e9e">2</text>
    <text x="282" y="103" fill="#2b6e9e">2</text>
    <text x="358" y="103" fill="#7a5415">1</text>
    <text x="434" y="103" fill="#7a5415">1</text>
  </g>
  <g font-size="18" text-anchor="middle" font-weight="bold">
    <text x="244" y="104" fill="#2e6e2e">=</text>
    <text x="320" y="104" fill="#b85450">≠</text>
    <text x="396" y="104" fill="#2e6e2e">=</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#888">
    <text x="244" y="136">锁定</text>
    <text x="320" y="136">避开</text>
    <text x="396" y="136">锁定</text>
  </g>

  <text x="320" y="160" text-anchor="middle" font-size="12" fill="#555">标记由数组唯一决定 → 按「哪 k 个间隔是 =」分类，不重不漏，共 C(n−1, k) 类</text>

  <!-- 三种填数选择 -->
  <g filter="url(#sk)">
    <rect x="36" y="174" width="182" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="229" y="174" width="182" height="56" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="422" y="174" width="182" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="127" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">首元素 arr[0]</text>
  <text x="127" y="218" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">任取：m 种</text>
  <text x="320" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">间隔「=」→ 锁定前值</text>
  <text x="320" y="218" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">1 种</text>
  <text x="513" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">间隔「≠」→ 避开前值</text>
  <text x="513" y="218" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">m−1 种</text>

  <text x="320" y="254" text-anchor="middle" font-size="12" fill="#555">固定一种标记：填法 = m · (m−1)<tspan dy="-5" font-size="9">n−1−k</tspan><tspan dy="5"> 种 —— 与选哪 k 个间隔无关</tspan></text>

  <!-- 公式框 -->
  <g filter="url(#sk)">
    <rect x="80" y="268" width="480" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="294" text-anchor="middle" font-size="17" font-weight="bold" font-family="monospace" fill="#9c3a34">ans = C(n−1, k) · m · (m−1)<tspan dy="-6" font-size="12">n−1−k</tspan><tspan dy="6"> mod (10</tspan><tspan dy="-5" font-size="12">9</tspan><tspan dy="5">+7)</tspan></text>
  <text x="320" y="318" text-anchor="middle" font-size="11" fill="#9c3a34">选标记方案数 × 每种标记下的填法数（乘法原理 + 加法原理）</text>

  <text x="320" y="354" text-anchor="middle" font-size="12" fill="#7a5415">⚠️ 快速幂按 0<tspan dy="-4" font-size="9">0</tspan><tspan dy="4"> = 1 约定实现，k = n−1、m = 1 等边界自动正确，无需特判</tspan></text>
</svg>
