<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序后双指针互推</text>

  <g filter="url(#rough2)">
    <rect x="30" y="48" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="120" y="66" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">两个列表分别按起点排序</text>
  <text x="120" y="81" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">题面不保证有序！</text>

  <g filter="url(#rough2)">
    <path d="M 120 88 L 120 112" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <rect x="180" y="114" width="200" height="76" fill="#fff" stroke="#666" stroke-width="1.4" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="280" y="136" fill="#333" font-weight="bold">lo = max(s₁[i], s₂[j])</text>
    <text x="280" y="156" fill="#333" font-weight="bold">hi = min(e₁[i], e₂[j])</text>
    <text x="280" y="176" fill="#888" font-size="10">当前时段对的交集</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 280 190 L 280 214" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 380 152 L 470 152 L 470 190" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" stroke-dasharray="4 3"/>
  </g>

  <g filter="url(#rough2)">
    <path d="M 196 254 L 148 254 L 148 292 L 196 292" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <path d="M 364 254 L 412 254 L 412 292 L 364 292" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <rect x="60" y="214" width="140" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="360" y="214" width="140" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <rect x="52" y="292" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <rect x="328" y="292" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="130" y="231" fill="#3a5a30" font-weight="bold">hi − lo ≥ duration?</text>
    <text x="130" y="245" fill="#777">是</text>
    <text x="430" y="231" fill="#8a3a36" font-weight="bold">谁先结束？</text>
    <text x="430" y="245" fill="#777">否</text>
    <text x="142" y="311" fill="#3a5a30" font-weight="bold">返回 [lo, lo+duration]</text>
    <text x="428" y="311" fill="#8a3a36" font-weight="bold">终点小者出局：i++ / j++</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 232 152 L 178 152 L 178 212" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
  </g>
  <text x="290" y="270" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每轮至少一个指针前进 → 至多 n₁+n₂ 轮，循环必然终止</text>
</svg>
