<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：面积 = 最高的水平间隔 × 最宽的竖直间隔</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">切口把蛋糕切成网格，每块都是「一条水平带 ∩ 一条竖直带」</text>

  <rect x="130" y="76" width="280" height="220" fill="#ffffff" stroke="#555" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <rect x="130" y="164" width="280" height="88" fill="#e6f4ea" opacity="0.85" filter="url(#rough2)"/>
  <rect x="200" y="76" width="140" height="220" fill="#fff8e1" opacity="0.85" filter="url(#rough2)"/>

  <g stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" fill="none" filter="url(#rough2)">
    <line x1="130" y1="120" x2="410" y2="120"/>
    <line x1="130" y1="164" x2="410" y2="164"/>
    <line x1="130" y1="252" x2="410" y2="252"/>
    <line x1="130" y1="208" x2="410" y2="208"/>
    <line x1="200" y1="76" x2="200" y2="296"/>
    <line x1="340" y1="76" x2="340" y2="296"/>
    <line x1="270" y1="76" x2="270" y2="296"/>
  </g>

  <rect x="200" y="164" width="140" height="88" fill="#dcefe0" stroke="#4a7a3a" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">最大块</text>
  <text x="270" y="226" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">2 × 2 = 4</text>

  <path d="M 96 76 L 96 296" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="190" text-anchor="end" font-size="12" fill="#3a4a66" filter="url(#rough2)">h = 5</text>
  <path d="M 130 316 L 410 316" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">w = 4</text>

  <text x="420" y="150" font-size="11" fill="#3a5a30" filter="url(#rough2)">最高的水平带</text>
  <text x="420" y="168" font-size="11" fill="#3a5a30" filter="url(#rough2)">间隔 = 4 − 2 = 2</text>
  <text x="420" y="196" font-size="11" fill="#8a6a20" filter="url(#rough2)">最宽的竖直带</text>
  <text x="420" y="214" font-size="11" fill="#8a6a20" filter="url(#rough2)">间隔 = 3 − 1 = 2</text>

  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">水平切口只影响块的「高」，竖直切口只影响块的「宽」，两者互不干涉</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">所以只要分别求出两方向的最大相邻间隔，乘起来就是答案（再对 10⁹+7 取模）</text>
</svg>
