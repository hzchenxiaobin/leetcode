<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    样例走查：a = [1,1,2,3,4,1,6,5,7,8]，n = 10
  </text>
  <text x="350" y="52" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    L = 5 的所有窗口都不 good；L = 4 时两段值域 {1..4} 与 {5..8} 正好各占一半
  </text>

  <rect x="110" y="92" width="240" height="48" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="410" y="92" width="240" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2" filter="url(#rough2)"/>

  <rect x="54" y="96" width="52" height="40" rx="4" fill="#ffffff" stroke="#999999"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="114" y="96" width="52" height="40" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="174" y="96" width="52" height="40" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="234" y="96" width="52" height="40" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="294" y="96" width="52" height="40" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="354" y="96" width="52" height="40" rx="4" fill="#ffffff" stroke="#999999"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="414" y="96" width="52" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <rect x="474" y="96" width="52" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="534" y="96" width="52" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="560" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <rect x="594" y="96" width="52" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="620" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>

  <text x="80" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="140" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="200" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="320" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="380" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="440" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="500" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">8</text>
  <text x="560" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">9</text>
  <text x="620" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">10</text>

  <text x="230" y="176" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    第 1 段 i=2..5：值域 {1,2,3,4}，m = 1
  </text>
  <text x="530" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    第 2 段 i=7..10：值域 {5,6,7,8}，m = 5
  </text>

  <rect x="90" y="188" width="520" height="32" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="209" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    查 best[1+4] = best[5] = 7 ≥ 2+4 = 6 ⇒ 第二段起点在 7，不与 2..5 重叠 ⇒ L = 4 可行
  </text>

  <text x="60" y="248" font-size="12.5" fill="#446688" filter="url(#rough2)">
    L = 5 的全部 6 个窗口（注定失败）：
  </text>

  <text x="60" y="278" font-size="11.5" fill="#333" filter="url(#rough2)">
    [1..5] 1 1 2 3 4 → 有重复 ✗
  </text>
  <text x="60" y="304" font-size="11.5" fill="#333" filter="url(#rough2)">
    [2..6] 1 2 3 4 1 → 有重复 ✗
  </text>
  <text x="60" y="330" font-size="11.5" fill="#333" filter="url(#rough2)">
    [3..7] 2 3 4 1 6 → 极差 5 ≠ 4 ✗
  </text>
  <text x="380" y="278" font-size="11.5" fill="#333" filter="url(#rough2)">
    [4..8] 3 4 1 6 5 → 极差 5 ≠ 4 ✗
  </text>
  <text x="380" y="304" font-size="11.5" fill="#333" filter="url(#rough2)">
    [5..9] 4 1 6 5 7 → 极差 6 ≠ 4 ✗
  </text>
  <text x="380" y="330" font-size="11.5" fill="#333" filter="url(#rough2)">
    [6..10] 1 6 5 7 8 → 极差 7 ≠ 4 ✗
  </text>

  <text x="350" y="378" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    ⇒ 最长可行长度 = 4
  </text>
</svg>
