<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：分段计数 + 二分答案</text>
  <path d="M 260 42 Q 450 52 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: split runs -->
  <g filter="url(#sk)">
    <rect x="130" y="66" width="640" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="155" y="92" font-size="14" font-weight="bold" fill="#2b5a8e">Step 1 · 分段</text>
  <text x="155" y="114" font-size="12" fill="#444" font-family="monospace">一次扫描 s，拆成极大同字符段，记录 runs[c] = [L1, L2, …]（O(n)）</text>

  <path d="M 450 144 L 450 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2: init -->
  <g filter="url(#sk)">
    <rect x="130" y="172" width="640" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="155" y="196" font-size="13" font-weight="bold" fill="#7a5415">Step 2 · 初始化</text>
  <text x="155" y="216" font-size="12" fill="#444" font-family="monospace">lo = 1, hi = n, ans = −1（全程未可行则保持 −1）</text>

  <path d="M 450 230 L 450 254" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3: check mid -->
  <g filter="url(#sk)">
    <rect x="130" y="258" width="640" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="155" y="284" font-size="14" font-weight="bold" fill="#2e6e2e">Step 3 · 取 mid = (lo + hi) / 2，check(mid)：</text>
  <text x="155" y="306" font-size="12" fill="#444" font-family="monospace">对每个字符 c：cnt(c) = Σ max(0, Li − mid + 1)，Li ∈ runs[c]</text>
  <text x="155" y="328" font-size="12" fill="#444" font-family="monospace">若某字符 cnt(c) ≥ 3 → 可行；26 桶互独立，命中即短路</text>
  <text x="155" y="348" font-size="10" fill="#888">单次 check O(段数 + 26)，只读不写</text>

  <path d="M 450 360 L 450 386" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="450,390 580,446 450,502 320,446" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="450" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3a34">check(mid)</text>
  <text x="450" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3a34">可行？</text>

  <!-- yes branch -->
  <path d="M 320 446 L 240 446 L 240 540" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="268" y="438" font-size="13" font-weight="bold" fill="#2e6e2e">是 ✓</text>
  <g filter="url(#sk)">
    <rect x="110" y="544" width="260" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="240" y="572" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">ans = mid</text>
  <text x="240" y="594" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">lo = mid + 1（还能更长）</text>

  <!-- no branch -->
  <path d="M 580 446 L 660 446 L 660 540" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="596" y="438" font-size="13" font-weight="bold" fill="#b85450">否 ✗</text>
  <g filter="url(#sk)">
    <rect x="530" y="544" width="260" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="660" y="572" text-anchor="middle" font-size="13" fill="#8e3a34" font-family="monospace">hi = mid − 1</text>
  <text x="660" y="594" text-anchor="middle" font-size="13" fill="#8e3a34" font-family="monospace">mid 太长，往左缩</text>

  <!-- loop back -->
  <path d="M 240 616 L 240 646 L 810 646 L 810 308 L 774 308" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="6 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 660 616 L 660 646" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="6 3" filter="url(#sk)"/>
  <text x="700" y="640" font-size="11" fill="#666">lo ≤ hi 则回到 Step 3 继续二分</text>

  <!-- exit -->
  <path d="M 450 502 L 450 544" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="2 3" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="330" y="548" width="240" height="64" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4"/>
  </g>
  <text x="450" y="574" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">lo &gt; hi → 返回 ans</text>
  <text x="450" y="596" text-anchor="middle" font-size="11" fill="#888">从未可行 → 返回 −1</text>
</svg>
