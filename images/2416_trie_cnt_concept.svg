<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：Trie 节点上的 cnt = 该前缀的分数</text>
  <path d="M 130 44 Q 340 52 550 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="150" y="70" width="52" height="30" rx="6" fill="#f0f0f0" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/></g>
  <text x="176" y="90" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">root</text>

  <g filter="url(#sk)"><path d="M 163 101 L 123 149" stroke="#4a7a3a" stroke-width="3" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 114 182 L 114 249" stroke="#4a7a3a" stroke-width="3" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 189 101 L 261 149" stroke="#d6a040" stroke-width="2.5" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 114 282 L 114 349" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 270 182 L 270 249" stroke="#446688" stroke-width="1.6" fill="none"/></g>

  <g filter="url(#sk)"><rect x="92" y="152" width="44" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="114" y="172" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><rect x="248" y="152" width="44" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="270" y="172" text-anchor="middle" font-size="14" fill="#7a5415" filter="url(#sk)">b</text>
  <g filter="url(#sk)"><rect x="92" y="252" width="44" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="114" y="272" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">b</text>
  <g filter="url(#sk)"><rect x="248" y="252" width="44" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="270" y="272" text-anchor="middle" font-size="14" fill="#7a5415" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><rect x="92" y="352" width="44" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="114" y="372" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">c</text>

  <g filter="url(#sk)"><circle cx="140" cy="150" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="140" y="154" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="296" cy="150" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="296" y="154" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="140" cy="250" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="140" y="254" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="296" cy="250" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="296" y="254" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><circle cx="140" cy="350" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="140" y="354" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">1</text>

  <text x="58" y="222" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">"ab"</text>
  <text x="238" y="120" font-size="14" font-weight="bold" fill="#b07818" filter="url(#sk)">"b"</text>

  <g filter="url(#sk)"><rect x="386" y="64" width="262" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="517" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#sk)">节点 ⟺ 非空前缀</text>
  <text x="517" y="113" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">根→节点路径逐字符拼出前缀</text>
  <text x="517" y="133" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">"ab" 的 b 与 "b" 是两个节点</text>
  <text x="517" y="155" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">前缀身份由完整路径唯一决定</text>

  <g filter="url(#sk)"><rect x="386" y="192" width="262" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="517" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">cnt[v] = 该前缀的分数</text>
  <text x="517" y="241" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">插入单词：路径上每个节点 +1</text>
  <text x="517" y="261" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">插完全部单词后，</text>
  <text x="517" y="283" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">cnt = 以此为前缀的单词个数</text>
  <g filter="url(#sk)"><path d="M 384 248 L 160 260" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="386" y="320" width="262" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="517" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">查询：沿路径累加 cnt</text>
  <text x="517" y="369" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">answer[i] = 途经各节点 cnt 之和</text>
  <text x="517" y="389" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">根不参与 —— 空前缀不计分</text>
  <text x="517" y="411" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">下移一步 = 多统计一个前缀</text>

  <text x="190" y="452" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">words = ["abc","ab","bc","b"] 建成的 Trie（绿 a 支 / 橙 b 支）</text>
</svg>
