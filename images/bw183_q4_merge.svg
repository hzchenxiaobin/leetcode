<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">合并 = 余数卷积；parent[i] &lt; i 保证可以倒序迭代</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">用 (a + b) % k 合并，复杂度 O(n·k²)</text>
  <rect x="30" y="80" width="496" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="278" y="104" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">new0[(a+b) % k] += dp0[u][a] × (dp0[v][b] + dp1[v][b])</text>
  <rect x="30" y="132" width="496" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="278" y="156" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">new1[(a+b) % k] += dp1[u][a] × dp0[v][b]      （u 选了 → v 不能选）</text>
  <text x="30" y="208" text-anchor="start" font-size="11" fill="#333" font-weight="bold">倒序迭代（不需要递归）</text>
  <rect x="40" y="220" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="80" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">v=0</text>
  <rect x="138" y="220" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="178" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">v=1</text>
  <rect x="236" y="220" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="276" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">v=2</text>
  <rect x="334" y="220" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="374" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">v=3</text>
  <rect x="432" y="220" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="472" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">v=4</text>
  <text x="40" y="286" text-anchor="start" font-size="10" fill="#888">v 从 n−1 递减到 1，把 dp[v] 合并进 dp[parent[v]]</text>
  <text x="40" y="306" text-anchor="start" font-size="10" fill="#888">（处理 v 时，v 的所有后代都已被合并进来）</text>
  <rect x="30" y="322" width="496" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="278" y="346" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">合并后 dp[u] 立刻覆盖旧值（用临时数组 n0/n1 避免原地污染）</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">n ≤ 1000、k ≤ 100 ⇒ 约 10^7 次乘法，取模用 long long 中间量</text>
</svg>
