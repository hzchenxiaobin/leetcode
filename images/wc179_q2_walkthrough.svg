<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="452" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：一路跟踪前缀最大值 curMax</text>

  <!-- 示例 1 标题与列头 -->
  <text x="280" y="52" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">示例 1：flips = [3,2,4,1,5]（答案 2）</text>
  <text x="56" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">步 i</text>
  <text x="104" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">翻位</text>
  <text x="165" y="72" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="197" y="72" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="229" y="72" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="261" y="72" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="293" y="72" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="362" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Sᵢ · max</text>
  <text x="492" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">判定</text>

  <!-- 第 1 步 -->
  <rect x="40" y="80" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="102" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="88" y="80" width="32" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="102" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="150" y="80" width="30" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="102" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="182" y="80" width="30" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="197" y="102" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="214" y="80" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="102" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="246" y="80" width="30" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="261" y="102" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="278" y="80" width="30" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="293" y="102" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="322" y="102" font-size="11" fill="#666" filter="url(#rough2)">{3} · 3</text>
  <text x="492" y="102" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 ≠ 1 ✗</text>

  <!-- 第 2 步 -->
  <rect x="40" y="124" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="146" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="88" y="124" width="32" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="146" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="150" y="124" width="30" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="146" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="182" y="124" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="146" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="214" y="124" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="146" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="246" y="124" width="30" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="261" y="146" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="278" y="124" width="30" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="293" y="146" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="322" y="146" font-size="11" fill="#666" filter="url(#rough2)">{2,3} · 3</text>
  <text x="492" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 ≠ 2 ✗</text>

  <!-- 第 3 步 -->
  <rect x="40" y="168" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="190" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="88" y="168" width="32" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="190" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="150" y="168" width="30" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="190" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="182" y="168" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="190" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="214" y="168" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="190" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="246" y="168" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="190" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="278" y="168" width="30" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="293" y="190" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="322" y="190" font-size="11" fill="#666" filter="url(#rough2)">{2,3,4} · 4</text>
  <text x="492" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4 ≠ 3 ✗</text>

  <!-- 第 4 步（高亮行） -->
  <rect x="32" y="209" width="500" height="40" rx="6" fill="#eaf5e8" filter="url(#rough2)"/>
  <rect x="40" y="212" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="234" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="88" y="212" width="32" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="234" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="150" y="212" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="234" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="182" y="212" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="234" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="214" y="212" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="234" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="246" y="212" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="234" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="278" y="212" width="30" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="293" y="234" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="322" y="234" font-size="11" fill="#666" filter="url(#rough2)">{1,2,3,4} · 4</text>
  <text x="492" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4 = 4 ✓</text>

  <!-- 第 5 步（高亮行） -->
  <rect x="32" y="253" width="500" height="40" rx="6" fill="#eaf5e8" filter="url(#rough2)"/>
  <rect x="40" y="256" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="278" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="88" y="256" width="32" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="278" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <rect x="150" y="256" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="278" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="182" y="256" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="278" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="214" y="256" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="278" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="246" y="256" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="278" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="278" y="256" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="293" y="278" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <text x="322" y="278" font-size="11" fill="#666" filter="url(#rough2)">{1,…,5} · 5</text>
  <text x="492" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5 = 5 ✓</text>

  <!-- 示例 2 -->
  <text x="280" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">示例 2：flips = [4,1,2,3]（答案 1）</text>
  <text x="60" y="350" font-size="11.5" fill="#666" filter="url(#rough2)">第 1 步 翻 4 → "0001"，S = {4}，max = 4 ≠ 1 ✗</text>
  <text x="60" y="372" font-size="11.5" fill="#666" filter="url(#rough2)">第 2 步 翻 1 → "1001"，S = {1,4}，max = 4 ≠ 2 ✗</text>
  <text x="60" y="394" font-size="11.5" fill="#666" filter="url(#rough2)">第 3 步 翻 2 → "1101"，S = {1,2,4}，max = 4 ≠ 3 ✗</text>
  <text x="60" y="416" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 4 步 翻 3 → "1111"，S = {1,2,3,4}，max = 4 = 4 ✓ ← 一致</text>

  <!-- 底部小结 -->
  <text x="280" y="444" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">判定看的是累计最大值，不是本步翻的值 —— 无需真的维护字符串</text>
</svg>
