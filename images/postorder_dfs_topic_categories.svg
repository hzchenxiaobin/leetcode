<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">后序 DFS 九大题型：差异全在「上传什么 / 答案在哪」</text>

  <!-- 3x3 grid of category cards -->
  <!-- Row 1 -->
  <g filter="url(#rough2)">
    <rect x="24" y="52" width="192" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="120" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 高度/深度汇总</text>
    <text x="120" y="96" text-anchor="middle" font-size="10" fill="#888">上传：子树高度</text>
    <text x="120" y="112" text-anchor="middle" font-size="10" fill="#888">答案：返回值</text>
    <text x="120" y="136" text-anchor="middle" font-size="10" fill="#4a7a3a">104 / 559 / 110</text>

    <rect x="224" y="52" width="192" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="320" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 路径/直径（树形 DP）</text>
    <text x="320" y="96" text-anchor="middle" font-size="10" fill="#888">上传：单边贡献 ⚠≠答案</text>
    <text x="320" y="112" text-anchor="middle" font-size="10" fill="#888">答案：全局擂台拼两边</text>
    <text x="320" y="136" text-anchor="middle" font-size="10" fill="#d6a040">543 / 124 / 687 / 2246</text>

    <rect x="424" y="52" width="192" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="520" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 子树聚合</text>
    <text x="520" y="96" text-anchor="middle" font-size="10" fill="#888">上传：(sum, size) 摘要</text>
    <text x="520" y="112" text-anchor="middle" font-size="10" fill="#888">答案：返回值 / 哈希表</text>
    <text x="520" y="136" text-anchor="middle" font-size="10" fill="#446688">563 / 508 / 1339 / 2265</text>
  </g>

  <!-- Row 2 -->
  <g filter="url(#rough2)">
    <rect x="24" y="176" width="192" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="120" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ BST 判定</text>
    <text x="120" y="220" text-anchor="middle" font-size="10" fill="#888">上传：(min,max,size) 多元组</text>
    <text x="120" y="236" text-anchor="middle" font-size="10" fill="#888">答案：合法处更新全局</text>
    <text x="120" y="260" text-anchor="middle" font-size="10" fill="#b85450">333 / 1373</text>

    <rect x="224" y="176" width="192" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="320" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 选/不选树形 DP</text>
    <text x="320" y="220" text-anchor="middle" font-size="10" fill="#888">上传：状态元组</text>
    <text x="320" y="236" text-anchor="middle" font-size="10" fill="#888">答案：根的 max</text>
    <text x="320" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a">337 / 968 / 979</text>

    <rect x="424" y="176" width="192" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="520" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑥ 删除/剪枝</text>
    <text x="520" y="220" text-anchor="middle" font-size="10" fill="#888">上传：剪后子树（或 None）</text>
    <text x="520" y="236" text-anchor="middle" font-size="10" fill="#888">⚠ 返回值接回父指针</text>
    <text x="520" y="260" text-anchor="middle" font-size="10" fill="#d6a040">814 / 1325 / 1110 / 366</text>
  </g>

  <!-- Row 3 -->
  <g filter="url(#rough2)">
    <rect x="24" y="300" width="192" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="120" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑦ 最近公共祖先</text>
    <text x="120" y="344" text-anchor="middle" font-size="10" fill="#888">上传：是否含 p/q</text>
    <text x="120" y="360" text-anchor="middle" font-size="10" fill="#888">答案：左右都有 → 特判记录</text>
    <text x="120" y="384" text-anchor="middle" font-size="10" fill="#446688">236 / 1644 / 1123</text>

    <rect x="224" y="300" width="192" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="320" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑧ 构造/序列化</text>
    <text x="320" y="344" text-anchor="middle" font-size="10" fill="#888">后序末位 = 根</text>
    <text x="320" y="360" text-anchor="middle" font-size="10" fill="#888">后序串 = 子树指纹</text>
    <text x="320" y="384" text-anchor="middle" font-size="10" fill="#b85450">106 / 889 / 652 / 114</text>

    <rect x="424" y="300" width="192" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="520" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑨ 图上后序</text>
    <text x="520" y="344" text-anchor="middle" font-size="10" fill="#888">离开时压栈</text>
    <text x="520" y="360" text-anchor="middle" font-size="10" fill="#888">⚠ 逆后序 = 拓扑序</text>
    <text x="520" y="384" text-anchor="middle" font-size="10" fill="#4a7a3a">210 / 332 / 753</text>
  </g>

  <!-- bottom note -->
  <text x="320" y="444" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先判断信息流向（子传父 or 父传子）→ 再设计返回值语义 → 套五步骨架</text>
</svg>
