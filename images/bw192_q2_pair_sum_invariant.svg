<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心不变量：一次操作只动两格，且两格之和不变</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">source[i] ← source[i] + source[j] − delta　·　source[j] ← delta（i ≠ j，delta 任意）</text>

  <text x="96" y="94" text-anchor="end" font-size="11" fill="#888">操作前</text>
  <g filter="url(#rough2)">
    <rect x="104" y="74" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="160" y="74" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="216" y="74" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="272" y="74" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="328" y="74" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="384" y="74" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <text x="130" y="96" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="186" y="96" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">7</text>
  <text x="242" y="96" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="298" y="96" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="354" y="96" text-anchor="middle" font-size="13" fill="#a07820" font-weight="bold">5</text>
  <text x="410" y="96" text-anchor="middle" font-size="13" fill="#333">2</text>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="130" y="124">0</text><text x="186" y="124">1</text><text x="242" y="124">2</text>
    <text x="298" y="124">3</text><text x="354" y="124">4</text><text x="410" y="124">5</text>
  </g>
  <text x="186" y="139" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="354" y="139" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">j</text>
  <text x="498" y="88" text-anchor="middle" font-size="10.5" fill="#666">数对和</text>
  <text x="498" y="106" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">= 7 + 5 = 12</text>

  <path d="M 280 152 V 182" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="172" font-size="11" fill="#666">选 i ≠ j，任取 delta = 9</text>

  <text x="96" y="216" text-anchor="end" font-size="11" fill="#888">操作后</text>
  <g filter="url(#rough2)">
    <rect x="104" y="196" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="160" y="196" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="216" y="196" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="272" y="196" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="328" y="196" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="384" y="196" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <text x="130" y="218" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="186" y="218" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <text x="242" y="218" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="298" y="218" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="354" y="218" text-anchor="middle" font-size="13" fill="#a07820" font-weight="bold">9</text>
  <text x="410" y="218" text-anchor="middle" font-size="13" fill="#333">2</text>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="130" y="246">0</text><text x="186" y="246">1</text><text x="242" y="246">2</text>
    <text x="298" y="246">3</text><text x="354" y="246">4</text><text x="410" y="246">5</text>
  </g>
  <text x="498" y="210" text-anchor="middle" font-size="10.5" fill="#666">数对和</text>
  <text x="498" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= 3 + 9 = 12 ✓</text>

  <rect x="70" y="268" width="420" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">(a + b − delta) + delta = a + b —— delta 被完全抵消</text>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#555">delta 取任意整数都不改变数对之和</text>

  <rect x="70" y="334" width="420" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">其余 n − 2 格原封不动 ⇒ Σsource 全程不变</text>
  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#555">必要性：Σsource ≠ Σtarget 时永远无法变成 target</text>
</svg>
