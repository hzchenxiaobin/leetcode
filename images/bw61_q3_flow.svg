<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="82"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：扫描位置 i 的两种转移来源</text>

  <rect x="170" y="52" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">for i = 1 … n：位置 i 的决策</text>

  <polygon points="280,120 364,158 280,196 196,158" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">endAt[i] 非空？</text>
  <path d="M 280 98 L 280 116" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左分支：无订单 -->
  <rect x="42" y="230" width="196" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="252" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">dp[i] ← dp[i−1]</text>
  <text x="140" y="272" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">（空驶一格，不接单）</text>
  <path d="M 210 178 C 160 190, 130 205, 128 226" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="208" font-size="12" fill="#d6a040" filter="url(#rough2)">否</text>

  <!-- 右分支：有订单 -->
  <rect x="322" y="222" width="200" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="422" y="245" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">for (s, w) in endAt[i]：</text>
  <text x="422" y="266" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">dp[i] ← max(dp[i],</text>
  <text x="422" y="285" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">dp[s] + w)</text>
  <path d="M 350 178 C 400 190, 425 200, 426 218" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="206" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 汇合 -->
  <polygon points="280,316 356,348 280,380 204,348" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i == n ?</text>
  <path d="M 140 288 C 150 310, 200 322, 226 338" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 422 296 C 412 316, 352 328, 334 340" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="420" y="330" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="355" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">return dp[n]</text>
  <path d="M 358 348 L 416 348" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <text x="92" y="352" font-size="12" fill="#888" filter="url(#rough2)">否 → i++</text>
  <path d="M 204 348 C 170 348, 140 340, 132 300" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
