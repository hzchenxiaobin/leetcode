<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：字符串坍缩为频次数组，固定 c 后「盈余右移搭桥」</text>
  <path d="M 240 44 Q 470 52 700 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: collapse ===== -->
  <g filter="url(#sk)">
    <rect x="36" y="62" width="868" height="112" rx="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="60" y="86" font-size="13" font-weight="bold" fill="#2b6e9e">第 1 步 · 位置无关 ⇒ 坍缩为 26 维频次数组</text>

  <text x="52" y="128" font-size="12" fill="#666">字符串 s</text>
  <g filter="url(#sk)">
    <rect x="52" y="110" width="30" height="34" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="86" y="110" width="30" height="34" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="120" y="110" width="30" height="34" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="154" y="110" width="30" height="34" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="188" y="110" width="30" height="34" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <text x="67" y="132" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="101" y="132" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="135" y="132" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="169" y="132" text-anchor="middle" font-size="14" fill="#333">z</text>
  <text x="203" y="132" text-anchor="middle" font-size="14" fill="#333">a</text>

  <path d="M 240 127 L 292 127" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="266" y="112" text-anchor="middle" font-size="10.5" fill="#2b6e9e">只数个数</text>

  <g filter="url(#sk)">
    <rect x="308" y="104" width="46" height="46" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="360" y="104" width="46" height="46" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="412" y="104" width="46" height="46" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="464" y="104" width="46" height="46" rx="5" fill="#f0ede4" stroke="#aaa" stroke-width="1.2"/>
    <rect x="516" y="104" width="46" height="46" rx="5" fill="#f0ede4" stroke="#aaa" stroke-width="1.2"/>
    <rect x="724" y="104" width="46" height="46" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="331" y="122" text-anchor="middle" font-size="11" fill="#7a5415">a</text>
  <text x="331" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">2</text>
  <text x="383" y="122" text-anchor="middle" font-size="11" fill="#7a5415">b</text>
  <text x="383" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <text x="435" y="122" text-anchor="middle" font-size="11" fill="#7a5415">c</text>
  <text x="435" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">0</text>
  <text x="487" y="129" text-anchor="middle" font-size="13" fill="#999">…</text>
  <text x="539" y="129" text-anchor="middle" font-size="13" fill="#999">…</text>
  <text x="747" y="122" text-anchor="middle" font-size="11" fill="#7a5415">z</text>
  <text x="747" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <text x="592" y="129" text-anchor="middle" font-size="12" fill="#888">26 个计数</text>

  <text x="60" y="162" font-size="11" fill="#555">删 ⇔ occ[x]−1　增 ⇔ occ[x]+1　变成下一字母 ⇔ occ[x]−1 且 occ[x+1]+1（'z' 无出边）—— 三种操作与「好坏」判定都不挑位置</text>

  <!-- ===== Panel 2: fix c, bridge ===== -->
  <g filter="url(#sk)">
    <rect x="36" y="192" width="868" height="252" rx="12" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="60" y="216" font-size="13" font-weight="bold" fill="#7a5415">第 2 步 · 固定公共频次 c：每个字母目标 t ∈ {0, c}，盈余向右邻缺口「搭桥」</text>

  <!-- letter x (surplus) -->
  <g filter="url(#sk)">
    <rect x="80" y="238" width="150" height="168" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="155" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">字母 x（盈余方）</text>
  <text x="155" y="288" text-anchor="middle" font-size="12" fill="#333">occₓ = 5</text>
  <text x="155" y="310" text-anchor="middle" font-size="12" fill="#333">目标 tₓ = 0</text>
  <text x="155" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">盈余 s = 5</text>
  <path d="M 155 356 L 155 388" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="155" y="400" text-anchor="middle" font-size="11" fill="#8a3a36">删 −1 ×5（或不删、搬走）</text>

  <!-- letter x+1 (deficit) -->
  <g filter="url(#sk)">
    <rect x="420" y="238" width="150" height="168" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="495" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">字母 x+1（缺口方）</text>
  <text x="495" y="288" text-anchor="middle" font-size="12" fill="#333">occ = 1</text>
  <text x="495" y="310" text-anchor="middle" font-size="12" fill="#333">目标 t = c = 3</text>
  <text x="495" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">缺口 d = 2</text>
  <path d="M 495 392 L 495 360" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="495" y="404" text-anchor="middle" font-size="11" fill="#2e6e2e">增 +1 ×2（或由左邻搬来）</text>

  <!-- bridge arrow -->
  <path d="M 236 300 Q 325 268 414 296" stroke="#c98a2b" stroke-width="2.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="325" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">操作 3：右移 1 个 = 1 次</text>
  <text x="325" y="330" text-anchor="middle" font-size="10.5" fill="#7a5415">搬 k 个：删 (s−k) + 搬 k + 增 (d−k)</text>
  <text x="325" y="346" text-anchor="middle" font-size="10.5" fill="#7a5415">总代价 s+d−k ⇒ 搬满 k=min(s,d)</text>

  <!-- right notes -->
  <g filter="url(#sk)">
    <rect x="600" y="238" width="304" height="168" rx="10" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="752" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">代价对比（每搬 1 个）</text>
  <text x="752" y="288" text-anchor="middle" font-size="11.5" fill="#8a3a36">不搭桥：删 1 + 增 1 = 2 次</text>
  <text x="752" y="310" text-anchor="middle" font-size="11.5" fill="#2e6e2e">搭桥：右移 1 次 ⇒ 净省 1</text>
  <text x="752" y="340" text-anchor="middle" font-size="11" fill="#555">字母只能变大 ⇒ 盈余只能向右流</text>
  <text x="752" y="360" text-anchor="middle" font-size="11" fill="#555">移两格 ≡ 删+增（2 次）</text>
  <text x="752" y="380" text-anchor="middle" font-size="11" fill="#555">⇒ 不妨每个字符至多右移一格</text>
  <text x="752" y="400" text-anchor="middle" font-size="11" fill="#555">⇒ 搬运互不穿流，逐边独立</text>

  <!-- ===== Bottom formula ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="462" width="820" height="94" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="90" y="494" font-size="15" font-weight="bold" fill="#2b2b2b">固定 (c, t) 的最小代价 = Σ |occₓ − tₓ| − Σ min(盈余ₓ, 缺口ₓ₊₁)</text>
  <text x="90" y="522" font-size="12" fill="#444">其中 盈余ₓ = max(0, occₓ − tₓ)，缺口ₓ = max(0, tₓ − occₓ)；两项均非负，任一为 0 时节省自动归零。</text>
  <text x="90" y="544" font-size="12" fill="#444">盈余/缺口只依赖相邻两个字母的目标 ⇒ 满足无后效性，可沿 a→z 做两状态线性 DP（见下图）。</text>
</svg>
