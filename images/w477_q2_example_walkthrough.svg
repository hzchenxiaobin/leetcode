  <path d="M280 162 Q 350 158 350 205 Q 350 252 320 294" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <rect x="70" y="352" width="380" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="13" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">ans = i − j = 5 − 1 = 4</text>
  <text x="260" y="396" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#rough2)">子数组 nums[1..4] = [1,3,2,0]：XOR = 0，2 奇 2 偶 ✓</text>
