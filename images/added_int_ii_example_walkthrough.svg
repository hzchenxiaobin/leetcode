<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：官方样例一步命中 vs 构造样例回退命中</text>
  <path d="M 140 42 Q 340 50 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ================= left panel: example 1 ================= -->
  <g filter="url(#sk)">
    <rect x="18" y="62" width="318" height="352" rx="12" fill="#f4f8fd" stroke="#8aa8c8" stroke-width="1.3"/>
  </g>
  <text x="177" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">示例 1：j = 2 一步命中</text>
  <text x="177" y="114" text-anchor="middle" font-size="11.5" fill="#444">排序 nums1 = [4, 8, 12, 16, 20]</text>
  <text x="177" y="132" text-anchor="middle" font-size="11.5" fill="#444">排序 nums2 = [10, 14, 18]</text>

  <g filter="url(#sk)">
    <rect x="48" y="142" width="258" height="30" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="177" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">x = nums2[0] − nums1[2] = 10 − 12 = −2</text>

  <!-- verification table -->
  <text x="95" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">a</text>
  <text x="165" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">a + x</text>
  <text x="252" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">结果</text>
  <g filter="url(#sk)">
    <path d="M 60 200 L 294 200" stroke="#c9d6e4" stroke-width="1.2"/>
    <path d="M 60 222 L 294 222" stroke="#dfe8f0" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 60 244 L 294 244" stroke="#dfe8f0" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 60 266 L 294 266" stroke="#dfe8f0" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 60 288 L 294 288" stroke="#dfe8f0" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="95" y="216" text-anchor="middle" font-size="11.5" fill="#444">4</text>
  <text x="165" y="216" text-anchor="middle" font-size="11.5" fill="#444">2</text>
  <text x="252" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">删 ✗</text>
  <text x="95" y="238" text-anchor="middle" font-size="11.5" fill="#444">8</text>
  <text x="165" y="238" text-anchor="middle" font-size="11.5" fill="#444">6</text>
  <text x="252" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">删 ✗</text>
  <text x="95" y="260" text-anchor="middle" font-size="11.5" fill="#444">12</text>
  <text x="165" y="260" text-anchor="middle" font-size="11.5" fill="#444">10</text>
  <text x="252" y="260" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">配 ✓</text>
  <text x="95" y="282" text-anchor="middle" font-size="11.5" fill="#444">16</text>
  <text x="165" y="282" text-anchor="middle" font-size="11.5" fill="#444">14</text>
  <text x="252" y="282" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">配 ✓</text>
  <text x="95" y="304" text-anchor="middle" font-size="11.5" fill="#444">20</text>
  <text x="165" y="304" text-anchor="middle" font-size="11.5" fill="#444">18</text>
  <text x="252" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">配 ✓</text>

  <text x="177" y="326" text-anchor="middle" font-size="11.5" fill="#2e6e2e">跳过恰 2 个（4、8），p 走完 nums2 → 合法</text>

  <g filter="url(#sk)">
    <rect x="67" y="338" width="220" height="38" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="177" y="363" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">返回 x = −2 ✓</text>
  <text x="177" y="398" text-anchor="middle" font-size="10.5" fill="#888">其实 x = 2、6 也合法（另两种删法），最小是 −2</text>

  <!-- ================= right panel: constructed fallback ================= -->
  <g filter="url(#sk)">
    <rect x="344" y="62" width="318" height="352" rx="12" fill="#fffdf8" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="503" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">构造样例：逼出回退链</text>
  <text x="503" y="114" text-anchor="middle" font-size="11.5" fill="#444">nums1 = [1, 5, 6, 7, 100]，nums2 = [2, 3, 4]</text>

  <!-- j=2 fails -->
  <g filter="url(#sk)">
    <rect x="366" y="128" width="274" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="503" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">j=2：x = 2 − 6 = −4</text>
  <text x="503" y="170" text-anchor="middle" font-size="11" fill="#b85450">100 + (−4) = 96 ≠ 4</text>
  <text x="503" y="188" text-anchor="middle" font-size="11" fill="#b85450">『4』无人可配 → 失败 ✗</text>

  <!-- fallback arrow -->
  <g filter="url(#sk)">
    <path d="M 503 198 L 503 216" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="530" y="212" font-size="10.5" font-weight="bold" fill="#b85450">回退 j←1</text>

  <!-- j=1 succeeds -->
  <g filter="url(#sk)">
    <rect x="366" y="220" width="274" height="86" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="503" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">j=1：x = 2 − 5 = −3</text>
  <text x="503" y="262" text-anchor="middle" font-size="11" fill="#2e6e2e">删 1 与 100（跳过恰 2 个）</text>
  <text x="503" y="280" text-anchor="middle" font-size="11" fill="#2e6e2e">5→2，6→3，7→4 全配对</text>
  <text x="503" y="298" text-anchor="middle" font-size="11" fill="#2e6e2e">p 走完 nums2 → 合法 ✓</text>

  <g filter="url(#sk)">
    <rect x="393" y="314" width="220" height="38" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="503" y="339" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">返回 x = −3 ✓</text>

  <g filter="url(#sk)">
    <rect x="356" y="362" width="294" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="503" y="380" text-anchor="middle" font-size="10.5" fill="#7a5415">官方样例都在 j=2 一步命中是错觉——</text>
  <text x="503" y="397" text-anchor="middle" font-size="10.5" fill="#7a5415">干扰元素可两端夹击，2→1→0 必须走完</text>
</svg>
