<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="330" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">第 k 次发 k 颗，收糖人是 (k−1) mod n</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把「第几轮」和「第几个人」摊平成一个递增计数器 k：k 同时决定发几颗、发给谁</text>

  <rect x="22" y="74" width="280" height="98" fill="#f5f8ff" stroke="#b9c9e0" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="302" y="74" width="276" height="98" fill="#fffdf5" stroke="#e8d5a8" stroke-width="1.2" rx="10" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="34" y="86" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="102" y="86" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="170" y="86" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="238" y="86" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="62" y="114" fill="#3a4a66">1</text>
    <text x="130" y="114" fill="#3a4a66">2</text>
    <text x="198" y="114" fill="#3a4a66">3</text>
    <text x="266" y="114" fill="#3a4a66">4</text>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="314" y="86" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="382" y="86" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="450" y="86" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="518" y="86" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="342" y="114" fill="#8a6a20">5</text>
    <text x="410" y="114" fill="#8a6a20">6</text>
    <text x="478" y="114" fill="#8a6a20">7</text>
    <text x="546" y="114" fill="#8a6a20">8</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#4a7a3a">
    <text x="62" y="152">小朋友 0</text>
    <text x="130" y="152">小朋友 1</text>
    <text x="198" y="152">小朋友 2</text>
    <text x="266" y="152">小朋友 3</text>
    <text x="342" y="152">小朋友 0</text>
    <text x="410" y="152">小朋友 1</text>
    <text x="478" y="152">小朋友 2</text>
    <text x="546" y="152">小朋友 3</text>
  </g>

  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">第 1 轮（第 1~4 次）</text>
  <text x="430" y="190" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">第 2 轮（第 5~8 次）：回到队首，礼物数接着 +1</text>

  <rect x="40" y="208" width="520" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="230" font-size="11" fill="#3a5a30" filter="url(#rough2)">已发总数 T(k) = k(k+1)/2；当 T(k) ≥ candies 时立即停下</text>
  <text x="54" y="252" font-size="11" fill="#3a5a30" filter="url(#rough2)">若剩余 r &lt; k（不够一整份），把 r 全部给当前小朋友，这就是最后一次</text>
  <text x="54" y="274" font-size="11" fill="#3a5a30" filter="url(#rough2)">所以只需按「次」结算，总次数满足 t(t+1)/2 ≥ candies，约 44721 次</text>

  <text x="300" y="308" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">关键：不必维护「第几轮」，一次 (k−1) mod n 就完成了换人</text>
</svg>
