<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="960" height="530" fill="#fafafa"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：num = "123"（n=3, S=6, target=3, m=2）</text>
  <path d="M 250 42 Q 480 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Table A: after d=0 ===== -->
  <text x="182" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">① 处理 d=0 之后（c₀=0，原地保留）</text>
  <g font-size="10" fill="#888" filter="url(#sk)">
    <text x="113" y="100" text-anchor="middle">s=0</text>
    <text x="159" y="100" text-anchor="middle">1</text>
    <text x="205" y="100" text-anchor="middle">2</text>
    <text x="251" y="100" text-anchor="middle">3</text>
    <text x="88" y="124" text-anchor="end">j=0</text>
    <text x="88" y="158" text-anchor="end">1</text>
    <text x="88" y="192" text-anchor="end">2</text>
  </g>
  <g filter="url(#sk)">
    <rect x="90" y="106" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="136" y="106" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="182" y="106" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="228" y="106" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="90" y="140" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="136" y="140" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="182" y="140" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="228" y="140" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="90" y="174" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="136" y="174" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="182" y="174" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="228" y="174" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
  </g>
  <text x="113" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>

  <!-- ===== Table B: after d=1 ===== -->
  <text x="642" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">② 处理 d=1 之后（c₁=1）</text>
  <g font-size="10" fill="#888" filter="url(#sk)">
    <text x="573" y="100" text-anchor="middle">s=0</text>
    <text x="619" y="100" text-anchor="middle">1</text>
    <text x="665" y="100" text-anchor="middle">2</text>
    <text x="711" y="100" text-anchor="middle">3</text>
    <text x="548" y="124" text-anchor="end">j=0</text>
    <text x="548" y="158" text-anchor="end">1</text>
    <text x="548" y="192" text-anchor="end">2</text>
  </g>
  <g filter="url(#sk)">
    <rect x="550" y="106" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="596" y="106" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="642" y="106" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="688" y="106" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="550" y="140" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="596" y="140" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="642" y="140" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="688" y="140" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="550" y="174" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="596" y="174" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="642" y="174" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="688" y="174" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
  </g>
  <text x="573" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="619" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="550" y="230" font-size="10.5" fill="#666" filter="url(#sk)">安放 1：k=0 原地（×1/0!1!）、k=1 → (1,1)（×1/1!0!）</text>

  <!-- arrow A -> B -->
  <path d="M 284 160 Q 420 140 546 160" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arB)"/>

  <!-- ===== Table C: after d=2 ===== -->
  <text x="182" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">③ 处理 d=2 之后（c₂=1）</text>
  <g font-size="10" fill="#888" filter="url(#sk)">
    <text x="113" y="290" text-anchor="middle">s=0</text>
    <text x="159" y="290" text-anchor="middle">1</text>
    <text x="205" y="290" text-anchor="middle">2</text>
    <text x="251" y="290" text-anchor="middle">3</text>
    <text x="88" y="314" text-anchor="end">j=0</text>
    <text x="88" y="348" text-anchor="end">1</text>
    <text x="88" y="382" text-anchor="end">2</text>
  </g>
  <g filter="url(#sk)">
    <rect x="90" y="296" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="136" y="296" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="182" y="296" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="228" y="296" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="90" y="330" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="136" y="330" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="182" y="330" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="228" y="330" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="90" y="364" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="136" y="364" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="182" y="364" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="228" y="364" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="113" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="159" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="205" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="251" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="90" y="420" font-size="10.5" fill="#666" filter="url(#sk)">安放 2：(0,0)→(1,2)、(1,1)→(2,3)，各 ×1/(1!·0!)</text>

  <!-- arrow B -> C -->
  <path d="M 642 216 Q 400 250 190 288" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arB)"/>

  <!-- ===== Table D: after d=3 ===== -->
  <text x="642" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">④ 处理 d=3 之后（c₃=1）</text>
  <g font-size="10" fill="#888" filter="url(#sk)">
    <text x="573" y="290" text-anchor="middle">s=0</text>
    <text x="619" y="290" text-anchor="middle">1</text>
    <text x="665" y="290" text-anchor="middle">2</text>
    <text x="711" y="290" text-anchor="middle">3</text>
    <text x="548" y="314" text-anchor="end">j=0</text>
    <text x="548" y="348" text-anchor="end">1</text>
    <text x="548" y="382" text-anchor="end">2</text>
  </g>
  <g filter="url(#sk)">
    <rect x="550" y="296" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="596" y="296" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="642" y="296" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="688" y="296" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="550" y="330" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="596" y="330" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="642" y="330" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="688" y="330" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="550" y="364" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="596" y="364" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="642" y="364" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb"/>
    <rect x="688" y="364" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="573" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="619" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="665" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="711" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="711" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">1</text>
  <text x="550" y="420" font-size="10.5" fill="#b03a3a" filter="url(#sk)">注：(1,1)→(2,4)：ns=4 &gt; 3 剪枝；(2,3) 处 j 已满，k 只能取 0</text>

  <!-- arrow C -> D -->
  <path d="M 284 350 Q 420 330 546 350" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arB)"/>

  <!-- ===== finale box ===== -->
  <g filter="url(#sk)">
    <rect x="235" y="448" width="490" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="480" y="472" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = dp[2][3] · m! · (n−m)! = 1 × 2! × 1! = 2</text>
  <text x="480" y="496" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">对应平衡排列 "132" 与 "231" ✓（终点 (j=2, s=3) 红框）</text>
</svg>
