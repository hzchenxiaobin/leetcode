<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="640" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：计数 → 特判 → 排序求和</text>
  <path d="M 120 42 Q 280 50 440 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="190" y="58" width="120" height="40" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="250" y="83" text-anchor="middle" font-size="13" fill="#3a5a7a" font-weight="bold">输入 s, k</text>

  <path d="M 250 98 L 250 122" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数 -->
  <g filter="url(#rough2)">
    <rect x="150" y="126" width="200" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="250" y="154" text-anchor="middle" font-size="13" fill="#8a6415">统计频率 cnt[26]</text>

  <path d="M 250 172 L 250 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- m -->
  <g filter="url(#rough2)">
    <rect x="120" y="200" width="260" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="250" y="228" text-anchor="middle" font-size="13" fill="#8a6415">m = 非零频率个数（不同字符数）</text>

  <path d="M 250 246 L 250 270" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判断 -->
  <g filter="url(#rough2)">
    <polygon points="250,274 350,334 250,394 150,334" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="250" y="340" text-anchor="middle" font-size="14" fill="#a03a36" font-weight="bold">m ≤ k ?</text>

  <!-- 是 → 返回 0 -->
  <path d="M 350 334 L 424 334" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="374" y="324" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">是</text>
  <g filter="url(#rough2)">
    <rect x="428" y="310" width="100" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="478" y="339" text-anchor="middle" font-size="14" fill="#2e5e2e" font-weight="bold">返回 0</text>

  <!-- 否 ↓ -->
  <path d="M 250 394 L 250 420" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="412" font-size="12" fill="#a03a36" font-weight="bold">否</text>

  <!-- 排序 -->
  <g filter="url(#rough2)">
    <rect x="150" y="424" width="200" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="250" y="452" text-anchor="middle" font-size="13" fill="#3a5a7a">频率升序排序</text>

  <path d="M 250 470 L 250 494" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 求和 -->
  <g filter="url(#rough2)">
    <rect x="100" y="498" width="300" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="250" y="528" text-anchor="middle" font-size="13" fill="#3a5a7a">删光频率最小的 m−k 个字符</text>

  <path d="M 250 548 L 250 572" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <g filter="url(#rough2)">
    <rect x="150" y="576" width="200" height="46" rx="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="250" y="604" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">返回出现次数之和</text>
</svg>
