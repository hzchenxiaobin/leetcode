<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：符号随负数逐个翻转</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#666">nums ＝ [−1, −2, −3, −4, 3, 2, 1]，n ＝ 7</text>

  <text x="110" y="82" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="180" y="82" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="250" y="82" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="320" y="82" text-anchor="middle" font-size="11" fill="#999">3</text>
  <text x="390" y="82" text-anchor="middle" font-size="11" fill="#999">4</text>
  <text x="460" y="82" text-anchor="middle" font-size="11" fill="#999">5</text>
  <text x="530" y="82" text-anchor="middle" font-size="11" fill="#999">6</text>

  <g filter="url(#sk)">
    <rect x="78" y="90" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="148" y="90" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="218" y="90" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="288" y="90" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="358" y="90" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="428" y="90" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="498" y="90" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="110" y="112" text-anchor="middle" font-size="14" fill="#333">−1</text>
  <text x="180" y="112" text-anchor="middle" font-size="14" fill="#333">−2</text>
  <text x="250" y="112" text-anchor="middle" font-size="14" fill="#333">−3</text>
  <text x="320" y="112" text-anchor="middle" font-size="14" fill="#333">−4</text>
  <text x="390" y="112" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="460" y="112" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="530" y="112" text-anchor="middle" font-size="14" fill="#333">1</text>

  <path d="M 110 126 L 110 132" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 180 126 L 180 132" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 250 126 L 250 132" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 320 126 L 320 132" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 390 126 L 390 132" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 460 126 L 460 132" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 530 126 L 530 132" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="82" y="136" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="152" y="136" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="222" y="136" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="292" y="136" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="362" y="136" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="432" y="136" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="502" y="136" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <text x="110" y="155" text-anchor="middle" font-size="12" fill="#33517a" font-weight="bold">1</text>
  <text x="180" y="155" text-anchor="middle" font-size="12" fill="#33517a" font-weight="bold">2</text>
  <text x="250" y="155" text-anchor="middle" font-size="12" fill="#33517a" font-weight="bold">3</text>
  <text x="320" y="155" text-anchor="middle" font-size="12" fill="#33517a" font-weight="bold">4</text>
  <text x="390" y="155" text-anchor="middle" font-size="12" fill="#33517a" font-weight="bold">4</text>
  <text x="460" y="155" text-anchor="middle" font-size="12" fill="#33517a" font-weight="bold">4</text>
  <text x="530" y="155" text-anchor="middle" font-size="12" fill="#33517a" font-weight="bold">4</text>
  <text x="575" y="155" text-anchor="start" font-size="10" fill="#999">neg 计数</text>

  <path d="M 110 166 L 110 172" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 180 166 L 180 172" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 250 166 L 250 172" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 320 166 L 320 172" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 390 166 L 390 172" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 460 166 L 460 172" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 530 166 L 530 172" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="88" y="176" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <rect x="158" y="176" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="228" y="176" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <rect x="298" y="176" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="368" y="176" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="438" y="176" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="508" y="176" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
  </g>
  <text x="110" y="197" text-anchor="middle" font-size="15" fill="#8f3830" font-weight="bold">−</text>
  <text x="180" y="197" text-anchor="middle" font-size="15" fill="#2e5a24" font-weight="bold">＋</text>
  <text x="250" y="197" text-anchor="middle" font-size="15" fill="#8f3830" font-weight="bold">−</text>
  <text x="320" y="197" text-anchor="middle" font-size="15" fill="#2e5a24" font-weight="bold">＋</text>
  <text x="390" y="197" text-anchor="middle" font-size="15" fill="#2e5a24" font-weight="bold">＋</text>
  <text x="460" y="197" text-anchor="middle" font-size="15" fill="#2e5a24" font-weight="bold">＋</text>
  <text x="530" y="197" text-anchor="middle" font-size="15" fill="#2e5a24" font-weight="bold">＋</text>
  <text x="575" y="197" text-anchor="start" font-size="10" fill="#999">当前符号</text>

  <text x="320" y="232" text-anchor="middle" font-size="12.5" fill="#444">负数让符号像开关一样逐个拨动：− → ＋ → − → ＋；正数只是「路过」</text>

  <g filter="url(#sk)">
    <rect x="120" y="246" width="400" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="320" y="264" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">最终 neg ＝ 4（偶数个负数）</text>
  <text x="320" y="280" text-anchor="middle" font-size="12" fill="#2e5a24">→ 返回 ＋1，与示例 1 输出 1 一致</text>

  <g filter="url(#sk)">
    <rect x="30" y="300" width="290" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="330" y="300" width="280" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="175" y="324" text-anchor="middle" font-size="12.5" fill="#8f3830" font-weight="bold">示例 2：[1, 5, 0, 2, −3]</text>
  <text x="175" y="346" text-anchor="middle" font-size="11.5" fill="#8f3830">扫描 1、5 → neg ＝ 0</text>
  <text x="175" y="364" text-anchor="middle" font-size="11.5" fill="#8f3830">第 3 个元素是 0 → 短路</text>
  <text x="175" y="382" text-anchor="middle" font-size="11.5" fill="#8f3830">返回 0（后面的 −3 无需看）</text>
  <text x="470" y="324" text-anchor="middle" font-size="12.5" fill="#8a6415" font-weight="bold">示例 3：[−1, 1, −1, 1, −1]</text>
  <text x="470" y="346" text-anchor="middle" font-size="11.5" fill="#8a6415">无 0；负数出现在第 1、3、5 位</text>
  <text x="470" y="364" text-anchor="middle" font-size="11.5" fill="#8a6415">neg ＝ 3（奇数）</text>
  <text x="470" y="382" text-anchor="middle" font-size="11.5" fill="#8a6415">返回 −1，与示例输出一致</text>
</svg>
