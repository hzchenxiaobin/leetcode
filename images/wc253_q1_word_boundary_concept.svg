<svg xmlns="http://www.w3.org/2000/svg" width="680" height="402" viewBox="0 0 680 402" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="402" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：s 必须恰好落在某个词的末尾（词界对齐）</text>
  <path d="M 140 38 Q 340 48 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Section A: hit -->
  <text x="70" y="68" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">① 恰好命中：s = "iloveleetcode"，n = 13</text>

  <text x="52" y="97" font-size="12" fill="#888" filter="url(#sk)">s</text>
  <!-- s strip: 13 cells -->
  <g filter="url(#sk)"><rect x="70" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="85" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">i</text>
  <g filter="url(#sk)"><rect x="100" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="115" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">l</text>
  <g filter="url(#sk)"><rect x="130" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="145" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">o</text>
  <g filter="url(#sk)"><rect x="160" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="175" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">v</text>
  <g filter="url(#sk)"><rect x="190" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="205" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><rect x="220" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="235" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">l</text>
  <g filter="url(#sk)"><rect x="250" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="265" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><rect x="280" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="295" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><rect x="310" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="325" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">t</text>
  <g filter="url(#sk)"><rect x="340" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="355" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><rect x="370" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="385" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">o</text>
  <g filter="url(#sk)"><rect x="400" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="415" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">d</text>
  <g filter="url(#sk)"><rect x="430" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="445" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">e</text>

  <!-- word blocks -->
  <text x="18" y="150" font-size="11" fill="#888" filter="url(#sk)">words</text>
  <g filter="url(#sk)"><rect x="70" y="126" width="30" height="38" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="85" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">i</text>
  <g filter="url(#sk)"><rect x="100" y="126" width="120" height="38" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="160" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">love</text>
  <g filter="url(#sk)"><rect x="220" y="126" width="240" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="340" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#sk)">leetcode</text>
  <g filter="url(#sk)"><rect x="460" y="126" width="180" height="38" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="550" y="150" text-anchor="middle" font-size="13" fill="#8a8f98" filter="url(#sk)">apples</text>

  <!-- boundary dashed lines -->
  <path d="M 100 74 L 100 170" stroke="#b0b8c4" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <path d="M 220 74 L 220 170" stroke="#b0b8c4" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <path d="M 460 74 L 460 170" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="100" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">L(1)=1</text>
  <text x="220" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">L(2)=5</text>
  <text x="460" y="120" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">L(3)=13</text>
  <text x="640" y="120" text-anchor="middle" font-size="10" fill="#8a8f98" filter="url(#sk)">L(4)=18</text>

  <!-- word index labels -->
  <text x="85" y="178" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">第1词</text>
  <text x="160" y="178" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">第2词</text>
  <text x="340" y="178" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">第3词</text>
  <text x="550" y="178" text-anchor="middle" font-size="10.5" fill="#8a8f98" filter="url(#sk)">第4词（不再消费）</text>

  <!-- ruler -->
  <path d="M 70 190 L 640 190" stroke="#b0b8c4" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 70 185 L 70 195" stroke="#b0b8c4" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 100 185 L 100 195" stroke="#b0b8c4" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 220 185 L 220 195" stroke="#b0b8c4" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 460 185 L 460 195" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <path d="M 640 185 L 640 195" stroke="#b0b8c4" stroke-width="1.2" filter="url(#sk)"/>
  <text x="70" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">0</text>
  <text x="100" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">1</text>
  <text x="220" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">5</text>
  <text x="460" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#sk)">13</text>
  <text x="640" y="206" text-anchor="middle" font-size="11" fill="#8a8f98" filter="url(#sk)">18</text>
  <g filter="url(#sk)"><ellipse cx="460" cy="191" rx="24" ry="12" fill="none" stroke="#4a7a3a" stroke-width="1.8"/></g>

  <text x="70" y="230" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#sk)">s 在第 3 词 "leetcode" 末尾恰好用尽：L(3) = n = 13 → 前 3 词拼接 == s → true ✓</text>

  <!-- Section B: stuck mid-word -->
  <text x="70" y="260" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">② 词中间耗尽（易错）：s = "ilo"，n = 3</text>

  <text x="52" y="287" font-size="12" fill="#888" filter="url(#sk)">s</text>
  <g filter="url(#sk)"><rect x="70" y="268" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="85" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">i</text>
  <g filter="url(#sk)"><rect x="100" y="268" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="115" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">l</text>
  <g filter="url(#sk)"><rect x="130" y="268" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="145" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">o</text>

  <g filter="url(#sk)"><rect x="70" y="304" width="90" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="115" y="327" text-anchor="middle" font-size="13" fill="#2f5d25" filter="url(#sk)">ilo</text>
  <g filter="url(#sk)"><rect x="160" y="304" width="60" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="190" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">ve</text>
  <text x="115" y="354" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">words[0] = "ilove"</text>

  <path d="M 160 264 L 160 342" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <text x="172" y="300" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">n = 3</text>
  <text x="172" y="316" font-size="10" fill="#b85450" filter="url(#sk)">← 卡在词中间</text>

  <text x="70" y="380" font-size="12" fill="#b85450" filter="url(#sk)">n = 3 不是任何词末长度 → s 只是拼接结果的前缀 → false ✗</text>

  <!-- info box -->
  <g filter="url(#sk)"><rect x="410" y="262" width="246" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="533" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">长度是唯一的进度条</text>
  <text x="424" y="308" font-size="11" fill="#5c4512" filter="url(#sk)">· 每词非空 → L(k) 随 k 严格递增</text>
  <text x="424" y="328" font-size="11" fill="#5c4512" filter="url(#sk)">· L(k) ≥ n 即可判定（提前终止）</text>
  <text x="424" y="348" font-size="11" fill="#5c4512" filter="url(#sk)">· 词全拼完仍 L(k) &lt; n → false</text>
</svg>
