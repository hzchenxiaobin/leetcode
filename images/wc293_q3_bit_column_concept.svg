<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">核心观察：按位与逐「列」独立，全 1 列撑起结果</text>
  <text x="260" y="54" text-anchor="middle" font-size="12"
        fill="#888" filter="url(#rough2)">题面示例：1 &amp; 5 &amp; 3 = 1</text>

  <rect x="258" y="76" width="44" height="156" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="180" y="92" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">bit₂</text>
  <text x="230" y="92" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">bit₁</text>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a"
        font-weight="bold" filter="url(#rough2)">bit₀</text>

  <text x="150" y="122" text-anchor="end" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="122" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="230" y="122" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="280" y="122" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="150" y="150" text-anchor="end" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="180" y="150" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">1</text>
  <text x="230" y="150" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="280" y="150" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="150" y="178" text-anchor="end" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="180" y="178" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="230" y="178" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">1</text>
  <text x="280" y="178" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 146 192 L 316 190" stroke="#666" stroke-width="1.8"
        stroke-linecap="round" filter="url(#rough2)"/>

  <text x="150" y="220" text-anchor="end" font-size="14" fill="#666" filter="url(#rough2)">&amp;</text>
  <text x="180" y="220" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="230" y="220" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="280" y="220" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 304 220 C 330 220, 340 196, 344 176" stroke="#4a7a3a" stroke-width="2.2"
        fill="none" stroke-linecap="round" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="332" y="96" width="168" height="76" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="416" y="120" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">bit₀ 列全是 1</text>
  <text x="416" y="140" text-anchor="middle" font-size="12"
        fill="#4a7a3a" filter="url(#rough2)">⇒ 结果该位保住 1</text>
  <text x="416" y="160" text-anchor="middle" font-size="12"
        fill="#4a7a3a" filter="url(#rough2)">⇒ AND = 1 &gt; 0</text>

  <rect x="332" y="186" width="168" height="76" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="416" y="210" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">bit₁、bit₂ 列出现 0</text>
  <text x="416" y="230" text-anchor="middle" font-size="12"
        fill="#b85450" filter="url(#rough2)">⇒ 列内一个 0 就把</text>
  <text x="416" y="250" text-anchor="middle" font-size="12"
        fill="#b85450" filter="url(#rough2)">这一位拉成 0</text>

  <path d="M 280 236 C 279 252, 281 260, 280 268" stroke="#4a7a3a" stroke-width="2.2"
        fill="none" stroke-linecap="round" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="46" y="272" width="428" height="56" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#d6a040" filter="url(#rough2)">AND &gt; 0  ⟺  存在某一位 k，使选中数第 k 位全为 1</text>
  <text x="260" y="316" text-anchor="middle" font-size="12"
        fill="#d6a040" filter="url(#rough2)">问题转化：最长组合 = 「1 最多的那一位」的 1 的个数</text>

  <text x="260" y="348" text-anchor="middle" font-size="11"
        fill="#888" filter="url(#rough2)">按位与不进位、不借位，每一位互不干扰 —— 这就是逐位拆解的资本</text>
</svg>
