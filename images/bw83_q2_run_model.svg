<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">游程计数：每个 0 贡献「以它结尾的全 0 子数组」个数</text>

  <!-- 数组格子 -->
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <rect x="72"  y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="124" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="176" y="56" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="228" y="56" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="280" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="332" y="56" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="384" y="56" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="436" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="98"  y="81">1</text>
    <text x="150" y="81">3</text>
    <text x="202" y="81" fill="#1d3a17" font-weight="bold">0</text>
    <text x="254" y="81" fill="#1d3a17" font-weight="bold">0</text>
    <text x="306" y="81">2</text>
    <text x="358" y="81" fill="#1d3a17" font-weight="bold">0</text>
    <text x="410" y="81" fill="#1d3a17" font-weight="bold">0</text>
    <text x="462" y="81">4</text>
  </g>

  <!-- 贡献标注 -->
  <g filter="url(#rough2)" font-size="13" fill="#b85450" text-anchor="middle">
    <text x="202" y="118">+1</text>
    <text x="254" y="118">+2</text>
    <text x="358" y="118">+1</text>
    <text x="410" y="118">+2</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
    <text x="98" y="118">·</text><text x="150" y="118">·</text><text x="306" y="118">·</text><text x="462" y="118">·</text>
  </g>
  <text x="280" y="140" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">非 0 元素把游程打断，计数清零重来</text>

  <!-- 游程 1 的子数组 -->
  <text x="80" y="184" font-size="13.5" fill="#333" filter="url(#rough2)">游程 1（长度 2）能贡献的全 0 子数组：</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="130" y="196" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="152" y="216">[0]</text>
    <rect x="190" y="196" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="212" y="216">[0]</text>
    <rect x="250" y="196" width="68" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="284" y="216">[0, 0]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="344" y="194" width="176" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="432" y="218" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">L=2：1+2 = 3 个</text>

  <!-- 公式框 -->
  <path d="M 280 246 L 280 264" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="105" y="268" width="350" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="290" text-anchor="middle" font-size="14.5" fill="#1a2b45" filter="url(#rough2)">一段长 L 的连续 0 段贡献 1 + 2 + … + L</text>
  <text x="280" y="310" text-anchor="middle" font-size="15" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">= L(L+1)/2 个全 0 子数组</text>

  <g filter="url(#rough2)">
    <rect x="60" y="342" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="367" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">本例：3 + 3 = 6。答案可达 n(n+1)/2 ≈ 5×10⁹，必须用 64 位整数。</text>
</svg>
