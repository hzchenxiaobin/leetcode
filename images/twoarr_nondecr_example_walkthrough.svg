<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="700" height="480" fill="#fdfcf7"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums1 = [1,3,2,1]，nums2 = [2,2,3,4]</text>
  <path d="M 170 40 Q 350 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table grid -->
  <g filter="url(#sk)" stroke="#999999" stroke-width="1.2">
    <rect x="60" y="64" width="580" height="264" fill="none"/>
    <line x1="60" y1="120" x2="640" y2="120"/>
    <line x1="60" y1="172" x2="640" y2="172"/>
    <line x1="60" y1="224" x2="640" y2="224"/>
    <line x1="60" y1="276" x2="640" y2="276"/>
    <line x1="120" y1="64" x2="120" y2="328"/>
    <line x1="230" y1="64" x2="230" y2="328"/>
    <line x1="340" y1="64" x2="340" y2="328"/>
    <line x1="490" y1="64" x2="490" y2="328"/>
  </g>

  <!-- header -->
  <text x="90" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">i</text>
  <text x="175" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">a = nums1[i]</text>
  <text x="285" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">b = nums2[i]</text>
  <text x="415" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">dp[i][0]</text>
  <text x="415" y="106" text-anchor="middle" font-size="10.5" fill="#666">末尾选 a</text>
  <text x="565" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">dp[i][1]</text>
  <text x="565" y="106" text-anchor="middle" font-size="10.5" fill="#666">末尾选 b</text>

  <!-- row 0 -->
  <text x="90" y="151" text-anchor="middle" font-size="12" fill="#444">0</text>
  <text x="175" y="151" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="285" y="151" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="415" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="415" y="162" text-anchor="middle" font-size="9" fill="#888">初始</text>
  <text x="565" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">1</text>
  <text x="565" y="162" text-anchor="middle" font-size="9" fill="#888">初始</text>

  <!-- row 1 -->
  <text x="90" y="203" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="175" y="203" text-anchor="middle" font-size="12" fill="#444">3</text>
  <text x="285" y="203" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="415" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="415" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">a≥a ✓ · a≥b ✓</text>
  <text x="565" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">2</text>
  <text x="565" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">b≥a ✓ · b≥b ✓</text>

  <!-- row 2 -->
  <text x="90" y="255" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="175" y="255" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="285" y="255" text-anchor="middle" font-size="12" fill="#444">3</text>
  <text x="415" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="415" y="266" text-anchor="middle" font-size="9" fill="#b03a3a">仅 a≥b ✓（续 B 行）</text>
  <text x="565" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">3</text>
  <text x="565" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a">b≥a ✓ · b≥b ✓</text>

  <!-- row 3 -->
  <text x="90" y="307" text-anchor="middle" font-size="12" fill="#444">3</text>
  <text x="175" y="307" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="285" y="307" text-anchor="middle" font-size="12" fill="#444">4</text>
  <text x="415" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#888888">1</text>
  <text x="415" y="318" text-anchor="middle" font-size="9" fill="#b03a3a">✗ ✗（重新起算）</text>
  <g filter="url(#sk)">
    <rect x="497" y="282" width="86" height="40" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="540" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="540" y="318" text-anchor="middle" font-size="9" fill="#2e6e2e">b≥a ✓ · b≥b ✓</text>

  <!-- pitfall box -->
  <g filter="url(#sk)">
    <rect x="60" y="352" width="580" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="350" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">⚠ i=2 选 a=2 时只能续 B 行（2 ≥ 2 ✓，2 ≥ 3 ✗）</text>
  <text x="350" y="394" text-anchor="middle" font-size="11" fill="#555">若只记一个 dp[1] 而不知末尾是 3(a) 还是 2(b)，续接判断就无从下手——两状态必须并列维护</text>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="60" y="420" width="580" height="44" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="350" y="447" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">答案 = max = dp[3][1] = 4，对应 nums3 = [1,2,3,4]（取 a₀, b₁, b₂, b₃）</text>
</svg>
