<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">核心观察：异或前缀 X 与奇偶差 P，打包成一个状态对</text>

  <text x="38" y="66" font-size="12" fill="#555" filter="url(#rough2)">nums =</text>

  <rect x="92" y="42" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="113" y="63" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="113" y="80" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">奇</text>

  <rect x="144" y="42" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="63" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="80" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">奇</text>

  <rect x="196" y="42" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="217" y="63" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="217" y="80" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">奇</text>

  <rect x="248" y="42" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="269" y="63" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="269" y="80" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">偶</text>

  <rect x="300" y="42" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="321" y="63" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="321" y="80" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">偶</text>

  <text x="372" y="70" font-size="10.5" fill="#888" filter="url(#rough2)">0 也算偶数！</text>

  <path d="M141 108 Q 267 76 393 108" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="267" y="98" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">状态对 (3,1) 再现！</text>

  <text x="22" y="140" font-size="11" fill="#555" filter="url(#rough2)">前缀 i：</text>

  <rect x="78" y="126" width="62" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 0)</text>
  <text x="109" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i = 0</text>

  <rect x="152" y="126" width="62" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="183" y="148" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">(3, 1)</text>
  <text x="183" y="168" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">i = 1</text>

  <rect x="226" y="126" width="62" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 2)</text>
  <text x="257" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i = 2</text>

  <rect x="300" y="126" width="62" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="331" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 3)</text>
  <text x="331" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i = 3</text>

  <rect x="374" y="126" width="62" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3, 2)</text>
  <text x="405" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i = 4</text>

  <rect x="448" y="126" width="62" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="479" y="148" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">(3, 1)</text>
  <text x="479" y="168" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">i = 5</text>

  <text x="267" y="200" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">两端状态对相同 ⟹ 中间 nums[1..4] = [1, 3, 2, 0] 平衡，长度 5 − 1 = 4</text>

  <rect x="24" y="218" width="232" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="240" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">区间 XOR = X_l ⊕ X_r</text>
  <text x="140" y="260" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">= 0 ⟺ X_l = X_r</text>

  <rect x="264" y="218" width="232" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="240" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">区间奇偶差 = P_r − P_l</text>
  <text x="380" y="260" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">= 0 ⟺ 奇偶各半 ⟺ P_l = P_r</text>

  <rect x="80" y="300" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">两条条件合一句：状态对 (X, P) 整体相等</text>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#8a6a30" filter="url(#rough2)">⟺ 该子数组 XOR 为 0 且 奇偶数量相等</text>

  <rect x="40" y="300" width="26" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)" opacity="0"/>
  <text x="260" y="376" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">P 的口径随意（奇−偶 或 偶−奇），配对只关心相等</text>
</svg>
