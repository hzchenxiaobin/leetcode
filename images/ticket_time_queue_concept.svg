<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">循环队列规则：队头买 1 张（1 秒）→ 回队尾 或 离开</text>
  <path d="M 120 42 Q 320 52 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- buy box above head -->
  <g filter="url(#sk)">
    <rect x="130" y="66" width="170" height="38" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="215" y="90" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">队头买 1 张票（1 秒）</text>

  <!-- arrow head person -> buy box -->
  <path d="M 210 158 L 210 112" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- requeue arrow: buy box curving right to tail -->
  <path d="M 300 85 C 400 58, 480 70, 492 150" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="425" y="60" text-anchor="middle" font-size="12" fill="#2b6e9e">还有剩 → 瞬间回队尾（不耗时）</text>

  <!-- leave arrow: buy box curving left down -->
  <path d="M 130 85 C 80 100, 70 180, 95 252" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="35" y="256" width="145" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="107" y="279" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">买完 → 离开队伍</text>

  <!-- people row -->
  <g filter="url(#sk)">
    <circle cx="210" cy="190" r="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="210" y="197" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="210" y="234" text-anchor="middle" font-size="12" fill="#666">0 号（队头）</text>

  <g filter="url(#sk)">
    <circle cx="330" cy="190" r="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="330" y="197" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="330" y="234" text-anchor="middle" font-size="12" fill="#666">1 号</text>

  <g filter="url(#sk)">
    <circle cx="450" cy="190" r="28" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.4"/>
  </g>
  <text x="450" y="197" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">2</text>
  <text x="450" y="234" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">2 号 = k（队尾）</text>

  <!-- target annotation -->
  <path d="M 545 190 L 486 190" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="552" y="186" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">目标：</text>
  <text x="552" y="202" text-anchor="middle" font-size="11" fill="#b85450">k 买完的时刻</text>

  <!-- queue direction baseline -->
  <path d="M 178 250 L 482 250" stroke="#9aa5b1" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="266" text-anchor="middle" font-size="11" fill="#8a94a0">队首在左 · 新排队的人接到最右（队尾）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="205" y="296" width="400" height="44" rx="10" fill="#fff8e8" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="405" y="314" text-anchor="middle" font-size="12" fill="#7a5415">图中数字 = 该人还要买的张数（tickets = [2,3,2], k = 2）</text>
  <text x="405" y="332" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">每秒恰好一人买一张票 → 总时间 = 购票总张数</text>
</svg>
