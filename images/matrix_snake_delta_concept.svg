<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">编号即坐标：pos = i × n + j</text>
  <path d="M 180 42 Q 320 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left: 3x3 grid with ids -->
  <g filter="url(#sk)">
    <rect x="52" y="66" width="200" height="200" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="76" y="90" width="46" height="46" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
    <text x="99" y="119" fill="#446688">0</text>
    <g filter="url(#sk)"><rect x="129" y="90" width="46" height="46" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.2"/></g>
    <text x="152" y="119" fill="#4a7a3a">1</text>
    <g filter="url(#sk)"><rect x="182" y="90" width="46" height="46" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
    <text x="205" y="119" fill="#446688">2</text>
    <g filter="url(#sk)"><rect x="76" y="143" width="46" height="46" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.2"/></g>
    <text x="99" y="172" fill="#4a7a3a">3</text>
    <g filter="url(#sk)"><rect x="129" y="143" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="152" y="172" fill="#8a6a1a">4</text>
    <g filter="url(#sk)"><rect x="182" y="143" width="46" height="46" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
    <text x="205" y="172" fill="#446688">5</text>
    <g filter="url(#sk)"><rect x="76" y="196" width="46" height="46" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
    <text x="99" y="225" fill="#446688">6</text>
    <g filter="url(#sk)"><rect x="129" y="196" width="46" height="46" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
    <text x="152" y="225" fill="#446688">7</text>
    <g filter="url(#sk)"><rect x="182" y="196" width="46" height="46" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
    <text x="205" y="225" fill="#446688">8</text>
  </g>
  <text x="152" y="286" text-anchor="middle" font-size="12" fill="#666">n = 3：编号 = 行×3 + 列</text>

  <!-- arrows on grid: RIGHT +1 -->
  <path d="M 83 78 Q 99 72 115 78" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="99" y="64" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">RIGHT → +1</text>
  <!-- UP -3 from 4 to 1 -->
  <path d="M 165 136 Q 160 120 156 108" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="216" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">UP → −n</text>

  <!-- Right: two-n-base-digit explanation -->
  <g filter="url(#sk)">
    <rect x="288" y="66" width="300" height="200" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="438" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">把 pos 看成一个「两位 n 进制数」</text>
  <text x="438" y="122" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">pos = i · n + j</text>
  <text x="438" y="144" text-anchor="middle" font-size="12" fill="#666">高位 = 行 i，低位 = 列 j</text>

  <g filter="url(#sk)">
    <rect x="308" y="160" width="120" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="368" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">竖直移动 ±n</text>
  <g filter="url(#sk)">
    <rect x="448" y="160" width="120" height="34" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="508" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">水平移动 ±1</text>
  <text x="438" y="218" text-anchor="middle" font-size="11.5" fill="#555">上下 = 高位加减 1（跨一整行）</text>
  <text x="438" y="238" text-anchor="middle" font-size="11.5" fill="#555">左右 = 低位加减 1（同行相邻格）</text>
  <text x="438" y="256" text-anchor="middle" font-size="11" fill="#999">如 4 号格：上到 1（−3），右到 5（+1）</text>

  <!-- Bottom: delta table -->
  <g filter="url(#sk)">
    <rect x="52" y="306" width="536" height="70" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="320" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">四条指令 = 四个固定增量（查表 O(1)）</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">
    <g filter="url(#sk)"><rect x="76" y="342" width="100" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
    <text x="126" y="359" fill="#446688">UP: −n</text>
    <g filter="url(#sk)"><rect x="196" y="342" width="100" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
    <text x="246" y="359" fill="#446688">DOWN: +n</text>
    <g filter="url(#sk)"><rect x="316" y="342" width="100" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/></g>
    <text x="366" y="359" fill="#4a7a3a">LEFT: −1</text>
    <g filter="url(#sk)"><rect x="436" y="342" width="110" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/></g>
    <text x="491" y="359" fill="#4a7a3a">RIGHT: +1</text>
  </g>
</svg>
