<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：颜色类合法 ⟺ 异或线性无关</text>
  <path d="M 246 46 Q 390 54 534 46" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="72" width="330" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="201" y="98" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">Nim：先手必胜 ⟺ 异或和非零</text>
  <text x="201" y="124" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">Mad Hatter 保留同色的一批石堆</text>
  <text x="201" y="146" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">Alice 先手，所以要求保留的异或和 ≠ 0</text>
  <text x="201" y="166" text-anchor="middle" font-size="12" fill="#5b7690" filter="url(#rough2)">他可以不选满一整色 ⟹ 任意非空子集都要查</text>

  <rect x="414" y="72" width="330" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="579" y="98" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">⟺ 该颜色类是 GF(2) 线性无关组</text>
  <text x="579" y="124" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">某个非空子集异或为 0</text>
  <text x="579" y="146" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">⟺ 这些石堆数线性相关</text>
  <text x="579" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">于是问题变成：用最少线性无关组覆盖全集</text>

  <path d="M 371 124 L 409 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="390" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">例子：石堆数值本身就是二进制向量</text>

  <rect x="52" y="238" width="316" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">颜色类 {1, 2}：合法 ✓</text>
  <text x="210" y="292" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">子集 {1}→1　{2}→2　{1,2}→3</text>
  <text x="210" y="316" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">非空子集异或全不为 0</text>
  <text x="210" y="346" text-anchor="middle" font-size="12" fill="#5b7a50" filter="url(#rough2)">1 = 01，2 = 10：两个向量线性无关</text>
  <text x="210" y="368" text-anchor="middle" font-size="12" fill="#5b7a50" filter="url(#rough2)">所以 k = 2 时可以把 {3} 单独放一色</text>

  <rect x="412" y="238" width="316" height="150" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="570" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">颜色类 {1, 2, 3}：非法 ✗</text>
  <text x="570" y="292" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">1 ⊕ 2 ⊕ 3 = 0（全取就输）</text>
  <text x="570" y="316" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">3 = 1 ⊕ 2，三向量线性相关</text>
  <text x="570" y="346" text-anchor="middle" font-size="12" fill="#a86a66" filter="url(#rough2)">3 维空间里 3 个堆也可能相关</text>
  <text x="570" y="368" text-anchor="middle" font-size="12" fill="#a86a66" filter="url(#rough2)">例：18 ⊕ 16 ⊕ 2 = 0（样例里的坑）</text>
</svg>
