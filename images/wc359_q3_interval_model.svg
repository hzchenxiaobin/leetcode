<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：offer = 带权区间，共享房屋即冲突</text>
  <path d="M 90 38 Q 280 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="230" y="72" text-anchor="middle" font-size="11" fill="#b85450">B、C 共享房屋 1、2 → 互斥，只能二选一</text>

  <!-- offer B: [0,2] gold 2 -->
  <g filter="url(#sk)">
    <rect x="110" y="100" width="160" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="190" y="118" text-anchor="middle" font-size="12" fill="#2b2b2b">B [0,2] 金 2</text>
  <path d="M 278 96 L 292 110 M 292 96 L 278 110" stroke="#b85450" stroke-width="2.2" fill="none"/>

  <!-- offer A: [0,0] gold 1 -->
  <g filter="url(#sk)">
    <rect x="102" y="152" width="16" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="128" y="170" font-size="12" fill="#2b2b2b">A [0,0] 金 1</text>
  <path d="M 116 144 L 121 149 L 131 138" stroke="#4a7a3a" stroke-width="2.2" fill="none"/>

  <!-- offer C: [1,3] gold 2 -->
  <g filter="url(#sk)">
    <rect x="190" y="204" width="160" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="270" y="222" text-anchor="middle" font-size="12" fill="#2b2b2b">C [1,3] 金 2</text>
  <path d="M 356 198 L 361 203 L 371 192" stroke="#4a7a3a" stroke-width="2.2" fill="none"/>

  <!-- overlap box -->
  <g filter="url(#sk)">
    <rect x="184" y="90" width="92" height="152" rx="6" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/>
  </g>

  <!-- legend -->
  <path d="M 440 88 L 445 93 L 455 82" stroke="#4a7a3a" stroke-width="2.2" fill="none"/>
  <text x="464" y="94" font-size="11" fill="#2b2b2b">选入最优解</text>
  <path d="M 440 110 L 452 122 M 452 110 L 440 122" stroke="#b85450" stroke-width="2.2" fill="none"/>
  <text x="464" y="118" font-size="11" fill="#2b2b2b">被排除（冲突）</text>

  <!-- number axis -->
  <path d="M 70 290 L 495 290" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <circle cx="110" cy="290" r="4" fill="#446688"/>
    <circle cx="190" cy="290" r="4" fill="#446688"/>
    <circle cx="270" cy="290" r="4" fill="#446688"/>
    <circle cx="350" cy="290" r="4" fill="#446688"/>
    <circle cx="430" cy="290" r="4" fill="#446688"/>
  </g>
  <text x="110" y="312" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <text x="190" y="312" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <text x="270" y="312" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="350" y="312" text-anchor="middle" font-size="12" fill="#2b2b2b">3</text>
  <text x="430" y="312" text-anchor="middle" font-size="12" fill="#2b2b2b">4</text>
  <text x="280" y="334" text-anchor="middle" font-size="10.5" fill="#7a7a7a">数轴上的 n = 5 个房屋（0 ~ 4），每个 offer 是其上的一个闭区间</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="346" width="480" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#7a5415">最优解 A + C = 3 金：选中区间两两不相交。无权版（LC 435）可用「最早结束」贪心，</text>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#7a5415">带权后失效——示例 2 中最早结束的 [0,0] 只值 1 金，最优却是 [0,2] 的 10 金 → 必须 DP</text>
</svg>
