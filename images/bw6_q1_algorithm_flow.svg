<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：两次二分 + 乘法比较</text>

  <!-- 步骤 1 -->
  <rect x="180" y="52" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="13.5" fill="#2a4a68" filter="url(#rough2)">① lo = 二分找第一个 ≥ target</text>

  <path d="M 280 92 L 280 112" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定：target 存在？ -->
  <path d="M 280 190 L 200 150 L 280 122 L 360 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="147" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">lo == N 或</text>
  <text x="280" y="163" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">nums[lo] ≠ target ?</text>

  <path d="M 200 150 L 110 150 L 110 172" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="118" y="140" font-size="12.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="52" y="174" width="116" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="197" text-anchor="middle" font-size="13.5" fill="#8c3a34" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <path d="M 280 190 L 280 210" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="204" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">否（target 存在）</text>

  <!-- 步骤 2 -->
  <rect x="180" y="212" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="13.5" fill="#2a4a68" filter="url(#rough2)">② hi = 二分找第一个 &gt; target</text>

  <path d="M 280 252 L 280 272" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="150" y="274" width="260" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">③ 返回 (hi − lo) × 2 &gt; N</text>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">整数乘法比较，避免除法取整陷阱</text>
</svg>
