<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：k=3，arrival=[1,2,3,4,5]，load=[5,2,3,3,3]</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="20" y="46" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#446688" text-anchor="middle" font-weight="bold">
    <text x="42" y="66">i</text>
    <text x="76" y="66">t</text>
    <text x="160" y="66">释放(结束≤t)</text>
    <text x="250" y="66">free</text>
    <text x="330" y="66">i%k</text>
    <text x="420" y="66">分配</text>
    <text x="512" y="66">cnt</text>
  </g>

  <!-- 行 -->
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="20" y="78" width="520" height="30" fill="none" stroke="#999" stroke-width="1" rx="3"/>
    <text x="42" y="98">0</text>
    <text x="76" y="98">1</text>
    <text x="160" y="98">—</text>
    <text x="250" y="98">{1,2}</text>
    <text x="330" y="98">0</text>
    <text x="420" y="98">服务器 0（忙至 6）</text>
    <text x="512" y="98">[1,0,0]</text>

    <rect x="20" y="110" width="520" height="30" fill="none" stroke="#999" stroke-width="1" rx="3"/>
    <text x="42" y="130">1</text>
    <text x="76" y="130">2</text>
    <text x="160" y="130">—</text>
    <text x="250" y="130">{2}</text>
    <text x="330" y="130">1</text>
    <text x="420" y="130">服务器 1（忙至 4）</text>
    <text x="512" y="130">[1,1,0]</text>

    <rect x="20" y="142" width="520" height="30" fill="none" stroke="#999" stroke-width="1" rx="3"/>
    <text x="42" y="162">2</text>
    <text x="76" y="162">3</text>
    <text x="160" y="162">—</text>
    <text x="250" y="162">{}</text>
    <text x="330" y="162">2</text>
    <text x="420" y="162">服务器 2（忙至 6）</text>
    <text x="512" y="162">[1,1,1]</text>

    <rect x="20" y="174" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="42" y="194">3</text>
    <text x="76" y="194">4</text>
    <text x="160" y="194" fill="#4a7a3a" font-weight="bold">服务器 1（4≤4）</text>
    <text x="250" y="194">{1}</text>
    <text x="330" y="194">0</text>
    <text x="420" y="194" fill="#b8860b" font-weight="bold">lower_bound(0)→1</text>
    <text x="512" y="194" fill="#b8860b" font-weight="bold">[1,2,1]</text>

    <rect x="20" y="206" width="520" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="42" y="226">4</text>
    <text x="76" y="226">5</text>
    <text x="160" y="226">—（堆顶 6&gt;5）</text>
    <text x="250" y="226">{}</text>
    <text x="330" y="226">1</text>
    <text x="420" y="226" fill="#b85450" font-weight="bold">全忙 → 舍弃</text>
    <text x="512" y="226">[1,2,1]</text>
  </g>

  <!-- 时间线图示 -->
  <text x="90" y="272" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">时间线（0 号与 2 号忙到 6，1 号忙到 4）</text>
  <g filter="url(#rough2)">
    <rect x="90" y="286" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="90" y="312" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="90" y="338" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="120" y="281" font-size="11" fill="#446688" font-weight="bold">s0</text>
    <text x="120" y="307" font-size="11" fill="#446688" font-weight="bold">s1</text>
    <text x="120" y="333" font-size="11" fill="#446688" font-weight="bold">s2</text>
    <text x="120" y="300">忙</text>
  </g>
  <line x1="160" y1="282" x2="460" y2="282" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="160" y1="308" x2="460" y2="308" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="160" y1="334" x2="460" y2="334" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="196" y="360">1</text>
    <text x="262" y="360">2</text>
    <text x="328" y="360">3</text>
    <text x="394" y="360">4</text>
    <text x="460" y="360">5</text>
  </g>
  <!-- 任务条 -->
  <g filter="url(#rough2)">
    <rect x="196" y="276" width="160" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="196" y="302" width="64" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="196" y="328" width="160" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="262" y="302" width="66" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#446688" text-anchor="middle">
    <text x="276" y="272">请求0：t=1..6</text>
    <text x="228" y="298">请求1：1..4 →</text>
    <text x="295" y="298" fill="#b85450">请求3：4..7</text>
    <text x="276" y="324">请求2：t=3..6</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="90" y="374" width="380" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="397" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">最大计数 2 由服务器 1 取得 → 输出 [1] ✓</text>
</svg>
