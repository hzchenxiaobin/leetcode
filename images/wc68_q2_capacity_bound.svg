<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：可行 ⟺ 最多字符的出现次数 k ≤ ⌈n/2⌉</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">鸽巢上界：k 个相同字符之间至少需要 k−1 个「隔板」，而其他字符总共只有 n−k 个</text>

  <rect x="36" y="64" width="488" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="52" y="86" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">可行示例：s = "aaabb"，n = 5，k = 3 ≤ ⌈5/2⌉ = 3</text>

  <!-- 第一行：把 a 隔位铺开 -->
  <rect x="52" y="96" width="42" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="73" y="117" text-anchor="middle" font-size="14" fill="#2f3f55" filter="url(#rough2)">a</text>
  <rect x="104" y="96" width="42" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="5" filter="url(#rough2)"/>
  <text x="125" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空档</text>
  <rect x="156" y="96" width="42" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="177" y="117" text-anchor="middle" font-size="14" fill="#2f3f55" filter="url(#rough2)">a</text>
  <rect x="208" y="96" width="42" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="5" filter="url(#rough2)"/>
  <text x="229" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空档</text>
  <rect x="260" y="96" width="42" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="281" y="117" text-anchor="middle" font-size="14" fill="#2f3f55" filter="url(#rough2)">a</text>
  <text x="318" y="116" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 最多字符隔位摆放</text>

  <path d="M 125 128 L 125 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 229 128 L 229 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二行：空档回填 -->
  <rect x="52" y="152" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="73" y="173" text-anchor="middle" font-size="14" fill="#35592c" filter="url(#rough2)">a</text>
  <rect x="104" y="152" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="125" y="173" text-anchor="middle" font-size="14" fill="#35592c" filter="url(#rough2)">b</text>
  <rect x="156" y="152" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="177" y="173" text-anchor="middle" font-size="14" fill="#35592c" filter="url(#rough2)">a</text>
  <rect x="208" y="152" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="229" y="173" text-anchor="middle" font-size="14" fill="#35592c" filter="url(#rough2)">b</text>
  <rect x="260" y="152" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="281" y="173" text-anchor="middle" font-size="14" fill="#35592c" filter="url(#rough2)">a</text>
  <text x="318" y="172" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">② 其余字符回填空档 → "ababa"</text>

  <text x="52" y="200" font-size="10" fill="#666" filter="url(#rough2)">空档数 k−1 = 2，其他字符数 n−k = 2，恰好够填 → 构造成功</text>

  <rect x="36" y="212" width="488" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="52" y="234" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">不可行示例：s = "aaab"，n = 4，k = 3 &gt; ⌈4/2⌉ = 2</text>
  <text x="52" y="252" font-size="10" fill="#7a4a46" filter="url(#rough2)">3 个 a 之间需要 2 个隔板，但其他字符只有 1 个 b，无论怎么排都会出现 "aa" 相邻。</text>
  <text x="52" y="266" font-size="10" fill="#7a4a46" filter="url(#rough2)">即 k−1 = 2 &gt; n−k = 1，鸽巢条件被破坏 → 答案为空串。</text>

  <rect x="36" y="290" width="488" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="52" y="310" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">大顶堆贪心的容量判据</text>
  <text x="52" y="328" font-size="11" fill="#5a4a20" filter="url(#rough2)">k − 1 ≤ n − k  ⟺  2k ≤ n + 1  ⟺  k ≤ ⌊(n+1)/2⌋</text>
  <text x="52" y="342" font-size="10" fill="#666" filter="url(#rough2)">先判这一条：不满足直接返回 ""；满足则下面的贪心构造一定成功。</text>

  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">"aaabb" → "ababa"；"aaab" → ""；"aab" → "aba"</text>
</svg>
