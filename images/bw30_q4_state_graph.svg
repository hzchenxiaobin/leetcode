<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    必胜态必有指向必败态的出边
  </text>

  <!-- 状态节点：以 i=8 为例 -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="120" r="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="120" y="118" text-anchor="middle" font-size="14" fill="#2f5a24" filter="url(#rough2)">i = 8</text>
  <text x="120" y="136" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">必胜 W</text>

  <!-- 出边：拿 1/4 -->
  <g filter="url(#rough2)">
    <path d="M 146 106 C 200 84, 250 78, 300 76" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 146 134 C 200 158, 250 170, 300 178" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="12">
    <text x="200" y="76" fill="#666">拿 4²=... 不，拿 1 → 7</text>
    <text x="212" y="166" fill="#666">拿 4 → 4</text>
  </g>

  <!-- 7 号：必败 -->
  <g filter="url(#rough2)">
    <circle cx="330" cy="76" r="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="330" y="74" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">i = 7</text>
  <text x="330" y="92" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">必败 L</text>

  <!-- 4 号：必胜 -->
  <g filter="url(#rough2)">
    <circle cx="330" cy="178" r="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="330" y="176" text-anchor="middle" font-size="14" fill="#2f5a24" filter="url(#rough2)">i = 4</text>
  <text x="330" y="194" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">必胜 W</text>

  <!-- 7 的出边全部指向 W -->
  <g filter="url(#rough2)">
    <path d="M 358 64 C 400 46, 430 48, 456 60" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
    <path d="M 356 90 C 400 106, 430 112, 456 118" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="412" y="42" fill="#b85450">拿 1 → 6 (W)</text>
    <text x="420" y="106" fill="#b85450">拿 4 → 3 (W)</text>
  </g>

  <!-- 递推式 -->
  <rect x="60" y="228" width="400" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">win[i] = 存在 j²≤i 使 win[i−j²] = false</text>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0 是必败锚点：win[0] = false（无石可拿者输）</text>

  <!-- 结论 -->
  <rect x="60" y="296" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    我方赢 ⇔ 能一步把对手「关进」必败态
  </text>
</svg>
