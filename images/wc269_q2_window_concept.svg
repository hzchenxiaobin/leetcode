<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：窗口定长 2k+1，中心右移一位 = 出一进一</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="64" text-anchor="middle" font-size="12" fill="#666">nums = [7, 4, 3, 9, 1, 8, 5, 2, 6]，k = 3（窗口大小 2k+1 = 7）</text>

  <!-- window at center i=3: [0,6] -->
  <text x="96" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">中心 i = 3</text>
  <text x="96" y="120" text-anchor="middle" font-size="11.5" fill="#888">窗口 [0, 6]，S₃ = 37</text>
  <g filter="url(#sk)">
    <rect x="120" y="88" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="176" y="88" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="232" y="88" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="288" y="88" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="344" y="88" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="400" y="88" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="456" y="88" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="512" y="88" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="146" y="112" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">7</text>
  <text x="202" y="112" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">4</text>
  <text x="258" y="112" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">3</text>
  <text x="314" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">9</text>
  <text x="370" y="112" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">1</text>
  <text x="426" y="112" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">8</text>
  <text x="482" y="112" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">5</text>
  <text x="538" y="112" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">2</text>
  <text x="594" y="112" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">6</text>
  <!-- index row -->
  <text x="146" y="140" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">0</text>
  <text x="202" y="140" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">1</text>
  <text x="258" y="140" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">2</text>
  <text x="314" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" font-family="monospace">3</text>
  <text x="370" y="140" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">4</text>
  <text x="426" y="140" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">5</text>
  <text x="482" y="140" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">6</text>
  <text x="538" y="140" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">7</text>
  <text x="594" y="140" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">8</text>
  <!-- center marker -->
  <path d="M 314 78 L 314 66" stroke="#b85450" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="314" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">中心</text>

  <!-- shift arrow -->
  <path d="M 320 152 Q 320 172 320 186" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="418" y="172" text-anchor="middle" font-size="11.5" fill="#666">中心 +1，窗口整体右移一格</text>

  <!-- window at center i=4: [1,7] -->
  <text x="96" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">中心 i = 4</text>
  <text x="96" y="240" text-anchor="middle" font-size="11.5" fill="#888">窗口 [1, 7]，S₄ = 32</text>
  <g filter="url(#sk)">
    <rect x="120" y="208" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="176" y="208" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="232" y="208" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="288" y="208" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="344" y="208" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="400" y="208" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="456" y="208" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="512" y="208" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="146" y="232" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">7</text>
  <text x="202" y="232" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">4</text>
  <text x="258" y="232" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">3</text>
  <text x="314" y="232" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">9</text>
  <text x="370" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">1</text>
  <text x="426" y="232" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">8</text>
  <text x="482" y="232" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">5</text>
  <text x="538" y="232" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">2</text>
  <text x="594" y="232" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">6</text>
  <text x="146" y="260" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">0</text>
  <text x="202" y="260" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">1</text>
  <text x="258" y="260" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">2</text>
  <text x="314" y="260" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">3</text>
  <text x="370" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" font-family="monospace">4</text>
  <text x="426" y="260" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">5</text>
  <text x="482" y="260" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">6</text>
  <text x="538" y="260" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">7</text>
  <text x="594" y="260" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">8</text>
  <path d="M 370 198 L 370 186" stroke="#b85450" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="370" y="180" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">中心</text>

  <!-- out / in annotations -->
  <g filter="url(#sk)"><rect x="112" y="276" width="66" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="145" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36">− nums[0]</text>
  <text x="145" y="311" text-anchor="middle" font-size="11" fill="#a03a36">离开：− 7</text>
  <path d="M 145 274 L 145 262" stroke="#b85450" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="494" y="276" width="66" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="527" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22">+ nums[7]</text>
  <text x="527" y="311" text-anchor="middle" font-size="11" fill="#2e5e22">进入：+ 2</text>
  <path d="M 527 274 L 527 262" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- transition formula -->
  <g filter="url(#sk)"><rect x="130" y="338" width="380" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="365" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7a5415">S₄ = S₃ − nums[0] + nums[7] = 37 − 7 + 2 = 32</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="40" y="396" width="560" height="58" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="420" text-anchor="middle" font-size="12" fill="#7a5415">相邻窗口重叠 2k 个元素，只有两端各变一个：减去刚离开的左端、加上刚进入的右端。</text>
  <text x="320" y="441" text-anchor="middle" font-size="12" fill="#7a5415">每步 O(1) 由旧和推出新和，避免每个中心重新求和的 O(k) 开销。</text>
</svg>
