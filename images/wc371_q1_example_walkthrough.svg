<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1,2,3,4,5]，共 15 个 i ≤ j 数对</text>

  <!-- 列头 -->
  <text x="152" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">y=1</text>
  <text x="200" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">y=2</text>
  <text x="248" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">y=3</text>
  <text x="296" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">y=4</text>
  <text x="344" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">y=5</text>

  <!-- 行标签 -->
  <text x="118" y="79" text-anchor="end" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">x=1</text>
  <text x="118" y="115" text-anchor="end" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">x=2</text>
  <text x="118" y="151" text-anchor="end" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">x=3</text>
  <text x="118" y="187" text-anchor="end" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">x=4</text>
  <text x="118" y="223" text-anchor="end" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">x=5</text>

  <!-- 第 1 行 -->
  <g filter="url(#sk)"><rect x="128" y="56" width="48" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
  <text x="152" y="79" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="176" y="56" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="200" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="224" y="56" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="248" y="79" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#sk)">✗</text>
  <g filter="url(#sk)"><rect x="272" y="56" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="296" y="79" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#sk)">✗</text>
  <g filter="url(#sk)"><rect x="320" y="56" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="344" y="79" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#sk)">✗</text>

  <!-- 第 2 行 -->
  <g filter="url(#sk)"><rect x="176" y="92" width="48" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
  <text x="200" y="115" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="224" y="92" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="248" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="272" y="92" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="296" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="320" y="92" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="344" y="115" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#sk)">✗</text>
  <!-- 陷阱格虚线圈 -->
  <g filter="url(#sk)"><ellipse cx="344" cy="110" rx="32" ry="24" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4"/></g>

  <!-- 第 3 行 -->
  <g filter="url(#sk)"><rect x="224" y="128" width="48" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
  <text x="248" y="151" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="272" y="128" width="48" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="296" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#sk)">7★</text>
  <g filter="url(#sk)"><rect x="320" y="128" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="344" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">6</text>

  <!-- 第 4 行 -->
  <g filter="url(#sk)"><rect x="272" y="164" width="48" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
  <text x="296" y="187" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="320" y="164" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="344" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">1</text>

  <!-- 第 5 行 -->
  <g filter="url(#sk)"><rect x="320" y="200" width="48" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
  <text x="344" y="223" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">0</text>

  <!-- 下三角说明 -->
  <text x="170" y="150" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">下三角与上三角</text>
  <text x="170" y="167" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">同判同值，略</text>

  <!-- 图例 -->
  <g filter="url(#sk)"><rect x="396" y="56" width="222" height="178" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/></g>
  <text x="507" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">图例</text>
  <g filter="url(#sk)"><rect x="406" y="88" width="22" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="436" y="100" font-size="10.5" fill="#555" filter="url(#sk)">强数对，格内为 XOR 值</text>
  <g filter="url(#sk)"><rect x="406" y="112" width="22" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="436" y="124" font-size="10.5" fill="#555" filter="url(#sk)">✗ 非强数对（大数 &gt; 2×小数）</text>
  <g filter="url(#sk)"><rect x="406" y="136" width="22" height="16" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
  <text x="436" y="148" font-size="10.5" fill="#555" filter="url(#sk)">对角线自身对，XOR = 0</text>
  <g filter="url(#sk)"><rect x="406" y="160" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="436" y="172" font-size="10.5" fill="#555" filter="url(#sk)">★ 答案：3 ⊕ 4 = 7</text>
  <g filter="url(#sk)"><ellipse cx="417" cy="196" rx="11" ry="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4"/></g>
  <text x="436" y="200" font-size="10.5" fill="#555" filter="url(#sk)">陷阱格 (2,5)：XOR = 7 也不算</text>

  <!-- 陷阱指引箭头 -->
  <path d="M 376 118 Q 402 158, 404 186" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- 结论 -->
  <g filter="url(#sk)"><rect x="70" y="248" width="460" height="28" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="300" y="267" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#sk)">强数对共 11 个 = 对角 5 个（XOR 均为 0）+ 非对角 6 个，与题面一致</text>
  <g filter="url(#sk)"><rect x="70" y="284" width="460" height="28" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="300" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#sk)">最大异或值 = 3 ⊕ 4 = 7</text>
  <text x="320" y="338" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#sk)">陷阱：(2,5) 的 XOR 同为 7，但 5 &gt; 2×2 = 4 不是强数对 —— 条件判定必须先于更新</text>
</svg>
