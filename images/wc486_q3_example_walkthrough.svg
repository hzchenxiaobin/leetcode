<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 演算：星形树（x=1、y=2、z=3）</text>

  <!-- 左侧：星形树 -->
  <line x1="120" y1="110" x2="45" y2="175" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="120" y1="110" x2="120" y2="215" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="120" y1="110" x2="195" y2="175" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="120" cy="110" r="15" fill="#f5f5f5" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <circle cx="45" cy="175" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="45" y="180" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="25" y="168" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>

  <circle cx="120" cy="215" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="220" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="144" y="222" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y</text>

  <circle cx="195" cy="175" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="195" y="180" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="215" y="168" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">z</text>

  <text x="140" y="275" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">dx = [1, 0, 2, 2]</text>
  <text x="140" y="301" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">dy = [1, 2, 0, 2]</text>
  <text x="140" y="327" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">dz = [1, 2, 2, 0]</text>

  <!-- 右侧：逐点判定表 -->
  <rect x="280" y="64" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="318" y="64" width="97" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="415" y="64" width="93" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="508" y="64" width="69" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="577" y="64" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="299" y="82" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">u</text>
  <text x="366" y="82" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(dx,dy,dz)</text>
  <text x="461" y="82" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">排序后 (a,b,c)</text>
  <text x="542" y="82" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a²+b²=c²?</text>
  <text x="601" y="82" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">特殊</text>

  <!-- 行 0：不特殊 -->
  <rect x="280" y="92" width="38" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="92" width="97" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="415" y="92" width="93" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="508" y="92" width="69" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="577" y="92" width="48" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="299" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="366" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 1, 1)</text>
  <text x="461" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 1, 1)</text>
  <text x="542" y="113" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2 ≠ 1</text>
  <text x="601" y="113" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 行 1：特殊 -->
  <rect x="280" y="126" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="126" width="97" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="415" y="126" width="93" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="508" y="126" width="69" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="577" y="126" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="299" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="366" y="147" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">(0, 2, 2)</text>
  <text x="461" y="147" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0, 2, 2)</text>
  <text x="542" y="147" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0+4=4</text>
  <text x="601" y="147" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 行 2：特殊 -->
  <rect x="280" y="160" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="160" width="97" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="415" y="160" width="93" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="508" y="160" width="69" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="577" y="160" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="299" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="366" y="181" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(2, 0, 2)</text>
  <text x="461" y="181" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0, 2, 2)</text>
  <text x="542" y="181" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0+4=4</text>
  <text x="601" y="181" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 行 3：特殊 -->
  <rect x="280" y="194" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="194" width="97" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="415" y="194" width="93" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="508" y="194" width="69" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="577" y="194" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-opacity="0.5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="299" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="366" y="215" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">(2, 2, 0)</text>
  <text x="461" y="215" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0, 2, 2)</text>
  <text x="542" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0+4=4</text>
  <text x="601" y="215" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <text x="452" y="248" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">u=2 的 (2,0,2) 排序后才得 (0,2,2) —— 必须先排序</text>

  <!-- 底部：要点与结论 -->
  <rect x="30" y="344" width="355" height="108" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="207" y="368" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">a = 0 也是合法勾股</text>
  <text x="207" y="392" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">0² + b² = b²：当 u 恰为某个目标节点、</text>
  <text x="207" y="412" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">且到另外两个目标等距时成立</text>
  <text x="207" y="438" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">本例三个叶子 1、2、3 均为 (0, 2, 2)</text>

  <rect x="415" y="344" width="195" height="108" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="512" y="382" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 ans = 3</text>
  <text x="512" y="410" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">特殊节点：1、2、3</text>
  <text x="512" y="434" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">中心 0 的 (1,1,1) 不满足</text>
</svg>
