<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="860" height="660" fill="#fafafa"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：先判二分（奇环 ⇒ −1），再逐分量求「直径 + 1」求和</text>
  <path d="M 210 40 Q 430 48 650 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 建图 -->
  <rect x="230" y="52" width="240" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="78" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">建邻接表（无向边双向存储）</text>
  <path d="M 350 94 L 350 118" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶段一容器 -->
  <rect x="70" y="120" width="560" height="256" rx="10" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="86" y="142" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">阶段一：2 着色判定 + 收集连通分量</text>

  <rect x="170" y="156" width="360" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="185" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">取一个未染色节点 s：BFS 交替染 0/1，顺手收集连通分量</text>
  <path d="M 350 204 L 350 224" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="350,228 460,266 350,304 240,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="271" text-anchor="middle" font-size="12.5" fill="#8a6414" filter="url(#rough2)">扫到同色相邻？</text>

  <path d="M 460 266 L 636 266" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="545" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是（发现奇环）</text>
  <rect x="640" y="238" width="180" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="730" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3a34" filter="url(#rough2)">return −1</text>
  <text x="730" y="282" text-anchor="middle" font-size="10.5" fill="#8c3a34" filter="url(#rough2)">（非二分图，无解）</text>

  <path d="M 350 304 L 350 324" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="320" font-size="11" fill="#555" filter="url(#rough2)">否</text>
  <rect x="210" y="326" width="280" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="348" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">该分量收进 comps</text>

  <path d="M 210 343 C 130 343 130 180 166 180" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="258" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">存在未染色</text>
  <text x="108" y="272" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">节点？</text>

  <path d="M 350 360 L 350 386" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="380" font-size="11" fill="#555" filter="url(#rough2)">全部染完</text>

  <!-- 阶段二容器 -->
  <rect x="70" y="388" width="560" height="196" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="86" y="410" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">阶段二：逐连通分量枚举源点求直径</text>

  <rect x="170" y="416" width="360" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="445" text-anchor="middle" font-size="12.5" fill="#2e5e28" filter="url(#rough2)">对分量 C 的每个源点 s 跑 BFS：depth(s) = 最大距离</text>
  <path d="M 350 464 L 350 482" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="484" width="360" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="506" text-anchor="middle" font-size="12" fill="#2e5e28" filter="url(#rough2)">best = max depth（分量直径）</text>
  <text x="350" y="524" text-anchor="middle" font-size="12" fill="#2e5e28" filter="url(#rough2)">ans += best + 1</text>

  <path d="M 530 508 C 606 508 606 440 534 440" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="608" y="478" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">下一个分量</text>

  <path d="M 350 584 L 350 604" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="606" width="240" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="632" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">return ans</text>

  <!-- 右侧注记 -->
  <rect x="650" y="416" width="170" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="735" y="442" text-anchor="middle" font-size="11.5" fill="#8a6414" filter="url(#rough2)">n ≤ 500</text>
  <text x="735" y="466" text-anchor="middle" font-size="11.5" fill="#8a6414" filter="url(#rough2)">枚举全部 n 个源点</text>
  <text x="735" y="490" text-anchor="middle" font-size="11.5" fill="#8a6414" filter="url(#rough2)">O(n(n+E)) ≈ 5×10⁶</text>
  <text x="735" y="512" text-anchor="middle" font-size="10" fill="#a08040" filter="url(#rough2)">两次 BFS 求直径仅对树成立</text>
</svg>
