<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>

  <text x="340" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：j = 4 这一列的逐行 min</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">排序后（r 升序）：[1,3](w2,idx0) → [1,5](w5,idx2) → [4,5](w2,idx1) → [6,7](w1,idx4) → [6,9](w3,idx3) → [8,9](w1,idx5)</text>

  <!-- 表头 -->
  <g filter="url(#rough2)"><rect x="52" y="60" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="72" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">i</text>
  <g filter="url(#rough2)"><rect x="92" y="60" width="150" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="167" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">区间（w, 原下标）</text>
  <g filter="url(#rough2)"><rect x="242" y="60" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="262" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">k</text>
  <g filter="url(#rough2)"><rect x="282" y="60" width="170" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="367" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">选 a[i] 候选</text>
  <g filter="url(#rough2)"><rect x="452" y="60" width="176" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="540" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">min 后 f[i+1][4]</text>

  <!-- 行 0 -->
  <text x="72" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="167" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,3]（2，0）</text>
  <text x="262" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="367" y="109" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">(−2, [0])</text>
  <text x="540" y="109" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(−2, [0])</text>
  <!-- 行 1 -->
  <text x="72" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="167" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,5]（5，2）</text>
  <text x="262" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="367" y="135" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">(−5, [2])</text>
  <text x="540" y="135" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(−5, [2])</text>
  <text x="600" y="135" font-size="9.5" fill="#666" filter="url(#rough2)">得分5&gt;2</text>
  <!-- 行 2：不选胜 -->
  <g filter="url(#rough2)"><rect x="50" y="118" width="580" height="24" rx="4" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="72" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="167" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4,5]（2，1）</text>
  <text x="262" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="367" y="161" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">(−4, [0,1])</text>
  <text x="540" y="161" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(−5, [2])</text>
  <text x="596" y="161" font-size="9.5" fill="#b85450" filter="url(#rough2)">不选胜</text>
  <!-- 行 3 -->
  <text x="72" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="167" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[6,7]（1，4）</text>
  <text x="262" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="367" y="187" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">(−6, [2,4])</text>
  <text x="540" y="187" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(−6, [2,4])</text>
  <text x="600" y="187" font-size="9.5" fill="#666" filter="url(#rough2)">得分6&gt;5</text>
  <!-- 行 4 -->
  <text x="72" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="167" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[6,9]（3，3）</text>
  <text x="262" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="367" y="213" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">(−8, [2,3])</text>
  <text x="540" y="213" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(−8, [2,3])</text>
  <text x="600" y="213" font-size="9.5" fill="#666" filter="url(#rough2)">得分8&gt;6</text>
  <!-- 行 5：不选胜 -->
  <g filter="url(#rough2)"><rect x="50" y="196" width="580" height="24" rx="4" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="72" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="167" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[8,9]（1，5）</text>
  <text x="262" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="367" y="239" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">(−7, [2,4,5])</text>
  <text x="540" y="239" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(−8, [2,3])</text>
  <text x="596" y="239" font-size="9.5" fill="#b85450" filter="url(#rough2)">不选胜</text>

  <!-- 表格外框（仅示意，不遮行） -->
  <!-- 说明箭头：k 的来源 -->
  <path d="M 262 254 C 262 274 200 274 180 264" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="262" y="284" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">k = 前 i 个中右端点 &lt; lᵢ 的个数（一次二分）</text>

  <!-- 两处“不选胜”注解 -->
  <g filter="url(#rough2)"><rect x="52" y="300" width="360" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="70" y="320" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">两处“不选胜”：第一维 −8 &lt; −7 自动完成，</text>
  <text x="70" y="338" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">字典序根本不用出场——得分并列时第二维才登场</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)"><rect x="428" y="300" width="204" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="530" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">f[6][4] = (−8, [2,3])</text>
  <text x="530" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">输出 [2,3]，得分 8 ✓</text>
  <text x="530" y="364" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">（选 idx2=[1,5] 与 idx3=[6,9]，</text>
  <text x="530" y="380" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">5 &lt; 6 相容，5 + 3 = 8）</text>
  <text x="530" y="400" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">示例 2 同法得 [1,3,5,6] ✓</text>

  <!-- 底部提示 -->
  <text x="232" y="376" font-size="10.5" fill="#444" filter="url(#rough2)">每个候选 = 子方案插入 idxᵢ 重排 + 负得分减 wᵢ；</text>
  <text x="232" y="394" font-size="10.5" fill="#444" filter="url(#rough2)">方案长度 ≤ 4，拷贝 + 排序都是 O(1)</text>
</svg>
