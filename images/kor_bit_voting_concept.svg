<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">按位投票：每一列独立计票</text>
  <text x="280" y="62" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">K-or 的第 i 位 ⟺ 该位为 1 的元素个数 cnt[i] ≥ k</text>

  <!-- bit column headers -->
  <text x="116" y="90" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">bit 3</text>
  <text x="152" y="90" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">bit 2</text>
  <text x="188" y="90" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">bit 1</text>
  <text x="224" y="90" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">bit 0</text>

  <!-- row labels -->
  <text x="82" y="117" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="82" y="151" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="82" y="185" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="82" y="219" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="82" y="253" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="82" y="287" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">15</text>

  <!-- bit cells: 7=0111 12=1100 9=1001 8=1000 9=1001 15=1111 (bit3..bit0) -->
  <!-- row 7 -->
  <rect x="100" y="100" width="32" height="30" fill="#f2f2f2" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="100" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="100" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="100" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="120" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="152" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="188" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="224" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <!-- row 12 -->
  <rect x="100" y="134" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="134" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="134" width="32" height="30" fill="#f2f2f2" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="134" width="32" height="30" fill="#f2f2f2" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="116" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="152" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="188" y="154" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="224" y="154" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <!-- row 9 -->
  <rect x="100" y="168" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="168" width="32" height="30" fill="#f2f2f2" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="168" width="32" height="30" fill="#f2f2f2" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="168" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="152" y="188" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="188" y="188" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="224" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <!-- row 8 -->
  <rect x="100" y="202" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="202" width="32" height="30" fill="#f2f2f2" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="202" width="32" height="30" fill="#f2f2f2" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="202" width="32" height="30" fill="#f2f2f2" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="116" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="152" y="222" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="188" y="222" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="224" y="222" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <!-- row 9 -->
  <rect x="100" y="236" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="236" width="32" height="30" fill="#f2f2f2" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="236" width="32" height="30" fill="#f2f2f2" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="236" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="152" y="256" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="188" y="256" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="224" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <!-- row 15 -->
  <rect x="100" y="270" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="270" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="270" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="270" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="290" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="152" y="290" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="188" y="290" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="224" y="290" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- column count footers -->
  <rect x="100" y="308" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="308" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="308" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="308" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="116" y="325" text-anchor="middle" font-size="12.5" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">5 ✓</text>
  <text x="152" y="325" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">3 ✗</text>
  <text x="188" y="325" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">2 ✗</text>
  <text x="224" y="325" text-anchor="middle" font-size="12.5" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">4 ✓</text>
  <text x="162" y="350" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">cnt[i] ≥ k = 4 ？（本例 k=4）</text>

  <!-- result row -->
  <text x="82" y="381" text-anchor="end" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">K-or</text>
  <rect x="100" y="362" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="362" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="362" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="362" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="382" text-anchor="middle" font-size="14" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="152" y="382" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="188" y="382" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="224" y="382" text-anchor="middle" font-size="14" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="258" y="382" font-size="14" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">= 1001₂ = 9</text>
  <text x="162" y="416" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">列与列零交互 ⟹ 32 个独立的一维计数子问题</text>

  <!-- right panel: k semantics -->
  <text x="415" y="104" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">k 的三档语义（票数门槛）</text>
  <rect x="290" y="116" width="250" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="415" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">k = 1：至少 1 票</text>
  <text x="415" y="162" text-anchor="middle" font-size="12.5" fill="#99741c" filter="url(#rough2)">⟹ 退化为普通按位或 OR</text>

  <rect x="290" y="186" width="250" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="415" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1 &lt; k &lt; n：至少 k 票</text>
  <text x="415" y="232" text-anchor="middle" font-size="12.5" fill="#557" filter="url(#rough2)">⟹ 阈值计数（本题一般情形）</text>

  <rect x="290" y="256" width="250" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="415" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">k = n：全票通过</text>
  <text x="415" y="302" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">⟹ 退化为普通按位与 AND</text>

  <rect x="290" y="330" width="250" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="415" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">自检锚点</text>
  <text x="415" y="376" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k=1 时答案应等于全体 OR</text>
  <text x="415" y="390" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k=n 时答案应等于全体 AND</text>
</svg>
