  <text x="305" y="141.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="50" y="200" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">奇位槽</text>
  <rect x="130" y="182" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
