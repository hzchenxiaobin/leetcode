  <rect x="458" y="138" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="474" y="159.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="490" y="138" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="506" y="159.3" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="522" y="138" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="538" y="159.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="554" y="138" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="570" y="159.3" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="330" y="196" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">任意相邻两格不同 ✓</text>
  <rect x="330" y="216" width="250" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="342" y="234.6" font-size="10" fill="#8a6a10" text-anchor="start" filter="url(#rough2)">长度 8：偶位 4 个、奇位 4 个</text>
  <text x="342" y="250.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">众数 1 出现 4 = ⌈8/2⌉ 次，刚好占满偶位</text>
</svg>
