  <text x="155" y="141.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="180" y="120" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="205" y="141.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
