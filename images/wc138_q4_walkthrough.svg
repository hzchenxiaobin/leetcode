  <text x="378" y="159.3" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="394" y="138" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
