  <rect width="620" height="340" fill="#fafafa"/>
  <text x="310" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 2：[1,1,1,1,2,2,3,3]</text>
