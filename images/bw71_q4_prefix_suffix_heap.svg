<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">前后缀堆：preMin[i] 与 sufMax[i] 的维护</text>

  <!-- prefix part -->
  <text x="60" y="64" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">从左往右扫：大根堆保「前缀最小的 n 个」</text>
  <g filter="url(#rough2)">
    <rect x="60" y="78" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="116" y="78" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="172" y="78" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="228" y="78" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="284" y="78" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="340" y="78" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="86" y="101">7</text><text x="142" y="101">9</text><text x="198" y="101">5</text>
    <text x="254" y="101">8</text><text x="310" y="101">1</text><text x="366" y="101">3</text>
  </g>
  <text x="240" y="134" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">（绿色 = 当前堆中保留的最小 n=2 个）</text>
  <g filter="url(#rough2)">
    <path d="M 254 118 C 260 148, 268 158, 280 166" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="284" y="170" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="394" y="192" text-anchor="middle">堆已满（size &gt; n）→ 弹出堆顶最大者</text>
    <text x="394" y="212" text-anchor="middle">preMin[i] = 堆内元素之和（或未满 = +∞）</text>
  </g>

  <!-- suffix part -->
  <text x="60" y="256" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">从右往左扫：小根堆保「后缀最大的 n 个」</text>
  <g filter="url(#rough2)">
    <rect x="60" y="270" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="116" y="270" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="172" y="270" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="270" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="284" y="270" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="340" y="270" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="86" y="293">7</text><text x="142" y="293">9</text><text x="198" y="293">5</text>
    <text x="254" y="293">8</text><text x="310" y="293">1</text><text x="366" y="293">3</text>
  </g>
  <text x="240" y="326" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">（红色 = 当前堆中保留的最大 n=2 个）</text>
  <g filter="url(#rough2)">
    <path d="M 86 310 C 80 336, 74 344, 66 352" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="356" width="440" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="380" font-size="13" fill="#333" filter="url(#rough2)" text-anchor="middle">sufMax[i] = 堆内元素之和；两数组各一趟 O(n log n)</text>
</svg>
