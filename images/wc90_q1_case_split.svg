<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">先把所有情形枚举干净，答案只有四类</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">交换必须「恰好一次」且 i ≠ j，因此空交换与多交换都要单独讨论</text>
  <rect x="28" y="84" width="176" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="116" y="114.1" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">①  长度不同</text>
  <rect x="212" y="84" width="268" height="52" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="346" y="113.8" text-anchor="middle" font-size="10.5" fill="#aaaaaa" filter="url(#rough2)">s 与 goal 长度不等，任何交换都改不了长度</text>
  <rect x="488" y="84" width="104" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="540" y="114.3" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>
  <rect x="28" y="146" width="176" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="116" y="176.1" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">②  s == goal</text>
  <rect x="212" y="146" width="268" height="52" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="346" y="175.8" text-anchor="middle" font-size="10.5" fill="#aaaaaa" filter="url(#rough2)">需要某个字符在 s 中出现 ≥ 2 次，才能交换两个相同字符</text>
  <rect x="488" y="146" width="104" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="540" y="176.3" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">true / false</text>
  <rect x="28" y="208" width="176" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="116" y="238.1" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">③  恰好 2 个失配位 i &lt; j</text>
  <rect x="212" y="208" width="268" height="52" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="346" y="237.8" text-anchor="middle" font-size="10.5" fill="#aaaaaa" filter="url(#rough2)">必须 s[i] = goal[j] 且 s[j] = goal[i]（交叉相等）</text>
  <rect x="488" y="208" width="104" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="540" y="238.3" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>
  <rect x="28" y="270" width="176" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="116" y="300.1" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">④  其余情况</text>
  <rect x="212" y="270" width="268" height="52" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="346" y="299.8" text-anchor="middle" font-size="10.5" fill="#aaaaaa" filter="url(#rough2)">失配位 0 个但字符全不重复、或失配位 ≥ 3 个</text>
  <rect x="488" y="270" width="104" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="540" y="300.3" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>
  <text x="28" y="366" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">特别提醒：② 中「有重复字符」是必须的——否则任何交换都会改变字符串，</text>
  <text x="28" y="386" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">例如 s = goal = "ab" 只能交换成 "ba" ≠ "ab"，答案为 false。</text>
</svg>
