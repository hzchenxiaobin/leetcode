<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">双指针原地压缩：读指针分组，写指针落笔</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">关键不变量 write ≤ read —— 写指针永远追不上读指针，未读数据不会被覆盖</text>

  <text x="48" y="80" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">输入 chars（read 从头扫到尾）</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="48" y="90" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="88" y="90" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="128" y="90" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="168" y="90" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="208" y="90" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="248" y="90" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="288" y="90" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="328" y="90" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="66" y="115" fill="#3a4a66">a</text>
    <text x="106" y="115" fill="#3a4a66">a</text>
    <text x="146" y="115" fill="#3a5a30">b</text>
    <text x="186" y="115" fill="#3a5a30">b</text>
    <text x="226" y="115" fill="#8a6a20">c</text>
    <text x="266" y="115" fill="#8a6a20">c</text>
    <text x="306" y="115" fill="#8a6a20">c</text>
    <text x="346" y="115" fill="#8a6a20">c</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="66" y="140">0</text><text x="106" y="140">1</text><text x="146" y="140">2</text>
    <text x="186" y="140">3</text><text x="226" y="140">4</text><text x="266" y="140">5</text>
    <text x="306" y="140">6</text><text x="346" y="140">7</text>
  </g>

  <g filter="url(#rough2)" stroke-width="1.5" fill="none">
    <path d="M 48 152 L 124 152" stroke="#446688"/>
    <path d="M 48 152 L 48 160" stroke="#446688"/>
    <path d="M 124 152 L 124 160" stroke="#446688"/>
    <path d="M 128 152 L 204 152" stroke="#4a7a3a"/>
    <path d="M 128 152 L 128 160" stroke="#4a7a3a"/>
    <path d="M 204 152 L 204 160" stroke="#4a7a3a"/>
    <path d="M 208 152 L 364 152" stroke="#d6a040"/>
    <path d="M 208 152 L 208 160" stroke="#d6a040"/>
    <path d="M 364 152 L 364 160" stroke="#d6a040"/>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#666">
    <text x="86" y="176">"aa"，cnt=2</text>
    <text x="166" y="176">"bb"，cnt=2</text>
    <text x="286" y="176">"cccc"，cnt=4</text>
  </g>

  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.5" fill="none">
    <path d="M 86 182 L 86 208" marker-end="url(#arr)"/>
    <path d="M 166 182 L 166 208" marker-end="url(#arr)"/>
    <path d="M 286 182 L 246 208" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="48" y="212" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="88" y="212" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="128" y="212" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="168" y="212" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="208" y="212" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="248" y="212" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="66" y="237" fill="#3a5a30">a</text>
    <text x="106" y="237" fill="#3a5a30">2</text>
    <text x="146" y="237" fill="#3a5a30">b</text>
    <text x="186" y="237" fill="#3a5a30">2</text>
    <text x="226" y="237" fill="#3a5a30">c</text>
    <text x="266" y="237" fill="#3a5a30">4</text>
  </g>

  <text x="48" y="266" font-size="10" fill="#3a5a30" filter="url(#rough2)">输出区（write 落笔）：前 6 位 = "a2b2c4"，返回 write = 6；其后 2 格内容无关紧要</text>

  <rect x="384" y="86" width="160" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="398" y="106" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">两个指针的分工</text>
  <text x="398" y="130" font-size="10" fill="#555" filter="url(#rough2)">read：探路，找到组右边界</text>
  <text x="398" y="148" font-size="10" fill="#555" filter="url(#rough2)">　　　（值变化或越界即停）</text>
  <text x="398" y="172" font-size="10" fill="#555" filter="url(#rough2)">write：落笔，写字符 + 数字</text>
  <text x="398" y="190" font-size="10" fill="#555" filter="url(#rough2)">　　　（新组开始时才推进）</text>
  <text x="398" y="214" font-size="10" fill="#8a6a20" filter="url(#rough2)">压缩后的长度必 ≤ 原长度，</text>
  <text x="398" y="230" font-size="10" fill="#8a6a20" filter="url(#rough2)">所以 write 写入的位置一定</text>
  <text x="398" y="246" font-size="10" fill="#8a6a20" filter="url(#rough2)">落在已处理区间内。</text>

  <rect x="48" y="288" width="496" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="64" y="310" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">不变量：每一轮开始与结束时都有 write ≤ read</text>
  <text x="64" y="332" font-size="10" fill="#555" filter="url(#rough2)">cnt = 1：只写字符本身，占 1 格，恰好等于该组长度 1；</text>
  <text x="64" y="350" font-size="10" fill="#555" filter="url(#rough2)">cnt ≥ 2：写 1 + len(str(cnt)) 格，而 1 + len(str(cnt)) ≤ cnt 对 cnt ≥ 2 恒成立；</text>
  <text x="64" y="368" font-size="10" fill="#555" filter="url(#rough2)">因此累计写出的格数 ≤ 累计读过的格数，write 最多追平 read，绝不越过 →</text>
  <text x="64" y="384" font-size="10" fill="#8a3a36" filter="url(#rough2)">尚未处理的后缀永远不会被提前覆盖，这正是「常量额外空间」能成立的原因。</text>
</svg>
