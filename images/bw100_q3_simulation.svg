<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 走查：nums = [2,1,3,4,5,2]</text>

  <!-- 原数组（带下标） -->
  <g filter="url(#rough2)">
    <rect x="70"  y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="126" y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="182" y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="238" y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="294" y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="350" y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="96"  y="74" text-anchor="middle" font-size="14" fill="#7a5a10">2</text>
    <text x="152" y="74" text-anchor="middle" font-size="14" fill="#7a5a10">1</text>
    <text x="208" y="74" text-anchor="middle" font-size="14" fill="#7a5a10">3</text>
    <text x="264" y="74" text-anchor="middle" font-size="14" fill="#7a5a10">4</text>
    <text x="320" y="74" text-anchor="middle" font-size="14" fill="#7a5a10">5</text>
    <text x="376" y="74" text-anchor="middle" font-size="14" fill="#7a5a10">2</text>
    <text x="96"  y="100" text-anchor="middle" font-size="11" fill="#888">0</text>
    <text x="152" y="100" text-anchor="middle" font-size="11" fill="#888">1</text>
    <text x="208" y="100" text-anchor="middle" font-size="11" fill="#888">2</text>
    <text x="264" y="100" text-anchor="middle" font-size="11" fill="#888">3</text>
    <text x="320" y="100" text-anchor="middle" font-size="11" fill="#888">4</text>
    <text x="376" y="100" text-anchor="middle" font-size="11" fill="#888">5</text>
  </g>
  <text x="430" y="74" font-size="12" fill="#666" filter="url(#rough2)">↑ 下标</text>

  <!-- 三步操作 -->
  <g filter="url(#rough2)">
    <!-- 步骤1: 取 (1, idx1)，标记 0,1,2 -->
    <rect x="126" y="124" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="70"  y="124" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="182" y="124" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="238" y="124" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="294" y="124" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="350" y="124" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="96"  y="146" text-anchor="middle" font-size="12" fill="#888">2</text>
    <text x="152" y="146" text-anchor="middle" font-size="14" fill="#2f5527">+1</text>
    <text x="208" y="146" text-anchor="middle" font-size="12" fill="#888">3</text>
    <text x="264" y="146" text-anchor="middle" font-size="12" fill="#7a5a10">4</text>
    <text x="320" y="146" text-anchor="middle" font-size="12" fill="#7a5a10">5</text>
    <text x="376" y="146" text-anchor="middle" font-size="12" fill="#7a5a10">2</text>
    <text x="436" y="146" font-size="12" fill="#2f5527">score=1</text>

    <!-- 步骤2: 取 (2, idx5)，标记 4,5 -->
    <rect x="350" y="170" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="70"  y="170" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="126" y="170" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="182" y="170" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="238" y="170" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="294" y="170" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="96"  y="192" text-anchor="middle" font-size="12" fill="#888">2</text>
    <text x="152" y="192" text-anchor="middle" font-size="12" fill="#888">1</text>
    <text x="208" y="192" text-anchor="middle" font-size="12" fill="#888">3</text>
    <text x="264" y="192" text-anchor="middle" font-size="12" fill="#7a5a10">4</text>
    <text x="320" y="192" text-anchor="middle" font-size="12" fill="#888">5</text>
    <text x="376" y="192" text-anchor="middle" font-size="14" fill="#2f5527">+2</text>
    <text x="436" y="192" font-size="12" fill="#2f5527">score=3</text>

    <!-- 步骤3: 取 (4, idx3) -->
    <rect x="238" y="216" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="70"  y="216" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="126" y="216" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="182" y="216" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="294" y="216" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="350" y="216" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="96"  y="238" text-anchor="middle" font-size="12" fill="#888">2</text>
    <text x="152" y="238" text-anchor="middle" font-size="12" fill="#888">1</text>
    <text x="208" y="238" text-anchor="middle" font-size="12" fill="#888">3</text>
    <text x="264" y="238" text-anchor="middle" font-size="14" fill="#2f5527">+4</text>
    <text x="320" y="238" text-anchor="middle" font-size="12" fill="#888">5</text>
    <text x="376" y="238" text-anchor="middle" font-size="12" fill="#888">2</text>
    <text x="436" y="238" font-size="12" fill="#2f5527">score=7</text>
  </g>

  <text x="260" y="278" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">处理顺序 = (值, 下标) 升序：1@1 → 2@0 → 2@5 → 3@2 → 4@3 → 5@4</text>
  <text x="260" y="298" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">（2@0、3@2、5@4 扫到时已被标记，直接跳过）</text>

  <rect x="150" y="316" width="220" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="16" fill="#2f5527" filter="url(#rough2)">总得分 1+2+4 = 7 ✓</text>
</svg>
