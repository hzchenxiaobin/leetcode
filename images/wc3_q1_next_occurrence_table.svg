  <text x="66" y="311" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">查询 s 是否 t 的子序列：p = 0，对每个字符 c 做 p = nxt[p][c]</text>
  <text x="66" y="329" font-size="10" fill="#555" filter="url(#rough2)">若 p = m 说明剩余后缀里没有 c → false；否则 p ← p + 1 继续（命中后必须右移一格）</text>
  <text x="66" y="344" font-size="10" fill="#555" filter="url(#rough2)">预处理 O(26m)，单次查询 O(|s|)，与 t 的长度无关；k 个查询总代价 O(26m + Σ|s|)</text>

  <text x="260" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">蓝色 = 真实位置，粉色 = 哨兵 m（该字符在 [i, m) 中不存在）</text>
