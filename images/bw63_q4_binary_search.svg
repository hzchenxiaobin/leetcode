<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="77"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">count(x) 单调不减，二分找最小可行值</text>

  <!-- count 阶梯函数 -->
  <g filter="url(#rough2)">
    <path d="M 70 300 L 140 300 L 140 262 L 220 262 L 220 224 L 310 224 L 310 176 L 420 176 L 420 128 L 510 128"
          fill="none" stroke="#446688" stroke-width="2.5"/>
  </g>
  <!-- 坐标轴 -->
  <g filter="url(#rough2)">
    <path d="M 60 320 L 530 320" stroke="#999" stroke-width="1.5"/>
    <path d="M 60 320 L 60 100" stroke="#999" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666">
    <text x="525" y="338">x</text>
    <text x="34" y="110">count</text>
  </g>
  <!-- k 线 -->
  <g filter="url(#rough2)">
    <path d="M 60 176 L 420 176" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5"/>
  </g>
  <text x="96" y="168" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">k</text>

  <!-- 交点标注：第一个 count>=k 的位置 -->
  <g filter="url(#rough2)">
    <circle cx="420" cy="176" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <g filter="url(#rough2)">
    <path d="M 420 190 L 420 312" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#8a3a34" text-anchor="middle" font-weight="bold">
    <text x="420" y="340">p_k（答案）</text>
  </g>
  <text x="252" y="252" font-size="12" fill="#2d5a22" filter="url(#rough2)">count(x) &lt; k</text>
  <text x="462" y="150" font-size="12" fill="#2d5a22" filter="url(#rough2)">count(x) ≥ k</text>

  <!-- 二分区间 -->
  <g filter="url(#rough2)">
    <path d="M 70 96 L 70 106 M 510 96 L 510 106" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 70 101 L 510 101" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#2d5a22" text-anchor="middle">
    <text x="70" y="88">lo = −1e10−1</text>
    <text x="500" y="88">hi = 1e10</text>
  </g>

  <!-- 说明框 -->
  <rect x="50" y="356" width="0" height="0" fill="none"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#33506e">
    <text x="280" y="358" text-anchor="middle" font-weight="bold">二分不变量：count(lo) &lt; k ≤ count(hi)，收敛到最小可行值 hi</text>
  </g>
</svg>
