<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [3, 1, 4, 1, 5]，k = 3（答案 5）</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="66" text-anchor="middle" font-size="12" fill="#888">target = p[5] = 14 mod 3 = 2；best[0] = 0 起步（★ 行表示 p[j] = target，产生答案候选）</text>

  <!-- table -->
  <!-- header -->
  <g filter="url(#sk)">
    <rect x="70" y="84" width="540" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#2b4a66" text-anchor="middle" font-weight="bold">
    <text x="106" y="104">j</text>
    <text x="168" y="104">nums[j]</text>
    <text x="250" y="104">p[j−1] → p[j]</text>
    <text x="380" y="104">dp[j] = nums[j]+best[p[j−1]]</text>
    <text x="548" y="104">ans</text>
  </g>

  <!-- rows -->
  <g filter="url(#sk)">
    <line x1="70" y1="114" x2="610" y2="115" stroke="#446688" stroke-width="1"/>
    <line x1="70" y1="152" x2="610" y2="153" stroke="#c9c9c9" stroke-width="1"/>
    <line x1="70" y1="190" x2="610" y2="191" stroke="#c9c9c9" stroke-width="1"/>
    <line x1="70" y1="228" x2="612" y2="229" stroke="#b85450" stroke-width="1.6"/>
    <line x1="70" y1="266" x2="610" y2="267" stroke="#c9c9c9" stroke-width="1"/>
    <line x1="70" y1="304" x2="612" y2="305" stroke="#b85450" stroke-width="1.6"/>
    <line x1="70" y1="84"  x2="70"  y2="304" stroke="#446688" stroke-width="1.5"/>
    <line x1="610" y1="84" x2="610" y2="304" stroke="#446688" stroke-width="1.5"/>
    <line x1="140" y1="84" x2="140" y2="304" stroke="#d9d9d9" stroke-width="1"/>
    <line x1="200" y1="84" x2="200" y2="304" stroke="#d9d9d9" stroke-width="1"/>
    <line x1="330" y1="84" x2="330" y2="304" stroke="#d9d9d9" stroke-width="1"/>
    <line x1="500" y1="84" x2="500" y2="304" stroke="#d9d9d9" stroke-width="1"/>
  </g>
  <rect x="70" y="190" width="542" height="40" fill="#fce4ec" opacity="0.5"/>
  <rect x="70" y="266" width="542" height="40" fill="#fce4ec" opacity="0.5"/>

  <g font-size="12" text-anchor="middle" font-family="monospace">
    <text x="106" y="138" fill="#333">1</text>
    <text x="168" y="138" fill="#333">3</text>
    <text x="250" y="138" fill="#2b6e9e">0 → 0</text>
    <text x="380" y="138" fill="#333">3 + best[0] = 3</text>
    <text x="548" y="138" fill="#999">∞</text>

    <text x="106" y="176" fill="#333">2</text>
    <text x="168" y="176" fill="#333">1</text>
    <text x="250" y="176" fill="#2b6e9e">0 → 1</text>
    <text x="380" y="176" fill="#333">1 + best[0] = 1</text>
    <text x="548" y="176" fill="#999">∞</text>

    <text x="106" y="214" fill="#333">3</text>
    <text x="168" y="214" fill="#333">4</text>
    <text x="250" y="214" fill="#2b6e9e">1 → 2</text>
    <text x="380" y="214" fill="#333">4 + best[1] = 5</text>
    <text x="548" y="214" fill="#b85450" font-weight="bold">5 ★</text>

    <text x="106" y="252" fill="#333">4</text>
    <text x="168" y="252" fill="#333">1</text>
    <text x="250" y="252" fill="#2b6e9e">2 → 0</text>
    <text x="380" y="252" fill="#333">1 + best[2] = 6</text>
    <text x="548" y="252" fill="#333">5</text>

    <text x="106" y="290" fill="#333">5</text>
    <text x="168" y="290" fill="#333">5</text>
    <text x="250" y="290" fill="#2b6e9e">0 → 2</text>
    <text x="380" y="290" fill="#333">5 + best[0] = 5</text>
    <text x="548" y="290" fill="#b85450" font-weight="bold">5 ★</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="380" y="147">best[0]=0, best[1]=1, best[2]=5</text>
    <text x="380" y="223">p[3]=2=target，候选 5</text>
    <text x="380" y="299">p[5]=2=target，候选 5</text>
  </g>

  <!-- best bucket evolution -->
  <text x="340" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">桶的演化（best[残差] = 最小保留和）：</text>
  <g filter="url(#sk)">
    <rect x="80"  y="352" width="130" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="228" y="352" width="130" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="376" y="352" width="130" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="524" y="352" width="86" height="34" rx="6" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="145" y="365" text-anchor="middle" font-size="10.5" fill="#2d4d22" font-family="monospace">best[0] = 0</text>
  <text x="145" y="379" text-anchor="middle" font-size="9" fill="#4a7a3a">虚拟起点</text>
  <text x="293" y="365" text-anchor="middle" font-size="10.5" fill="#2b4a66" font-family="monospace">best[1] = 1</text>
  <text x="293" y="379" text-anchor="middle" font-size="9" fill="#557">j=2 入桶</text>
  <text x="441" y="365" text-anchor="middle" font-size="10.5" fill="#2b4a66" font-family="monospace">best[2] = 5</text>
  <text x="441" y="379" text-anchor="middle" font-size="9" fill="#557">j=3 入桶</text>
  <text x="567" y="365" text-anchor="middle" font-size="10.5" fill="#999" font-family="monospace">其余 ∞</text>

  <!-- final state -->
  <text x="340" y="416" text-anchor="middle" font-size="12" fill="#2d4d22">最终答案 5：保留 nums[5] = 5（最后一个 ★ 行的方案），其前间隙 [3,1,4,1] 的和 9 ≡ 0 (mod 3)，可全部删除。</text>
  <g filter="url(#sk)">
    <rect x="252" y="428" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="296" y="428" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="340" y="428" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="384" y="428" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="428" y="428" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="274" y="448" text-anchor="middle" font-size="12" fill="#a06a10" font-family="monospace">3</text>
  <text x="318" y="448" text-anchor="middle" font-size="12" fill="#a06a10" font-family="monospace">1</text>
  <text x="362" y="448" text-anchor="middle" font-size="12" fill="#a06a10" font-family="monospace">4</text>
  <text x="406" y="448" text-anchor="middle" font-size="12" fill="#a06a10" font-family="monospace">1</text>
  <text x="450" y="448" text-anchor="middle" font-size="12" fill="#2d4d22" font-weight="bold" font-family="monospace">5</text>
  <text x="484" y="448" font-size="10" fill="#b85450">← 保留</text>
</svg>
