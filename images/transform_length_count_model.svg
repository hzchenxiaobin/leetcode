<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#r)">丢掉顺序：字符串 ⇒ 26 个计数器</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">替换逐字符独立 ⇒ 只问长度时，字符排列顺序是冗余信息</text>

  <!-- top: chars evolve independently -->
  <text x="110" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">每个字符独立演化</text>
  <rect x="60" y="102" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="96" y="102" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <rect x="132" y="102" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="168" y="102" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#r)"/>
  <text x="77" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">a</text>
  <text x="113" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">b</text>
  <text x="149" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">c</text>
  <text x="185" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">z</text>
  <path d="M 77 138 Q 70 158 62 172" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <path d="M 113 138 Q 108 158 102 172" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <path d="M 149 138 Q 146 158 142 172" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <path d="M 185 138 Q 192 152 176 168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="66" y="188" font-size="11" fill="#446688" filter="url(#r)">→ b</text>
  <text x="104" y="188" font-size="11" fill="#446688" filter="url(#r)">→ c</text>
  <text x="138" y="188" font-size="11" fill="#446688" filter="url(#r)">→ d</text>
  <text x="168" y="188" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">→ "ab"</text>
  <text x="120" y="212" font-size="11" fill="#7a7a7a" filter="url(#r)">一轮之后：总长 = 1 + 1 + 1 + 2</text>

  <!-- middle: count strip -->
  <text x="330" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">一轮转换 = 计数右移一格 + z 分裂</text>
  <rect x="248" y="104" width="180" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#r)"/>
  <text x="338" y="126" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace" filter="url(#r)">cnt[0..25]  频率向量</text>
  <path d="M 434 121 Q 462 121 460 121" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <text x="468" y="118" font-size="11" fill="#446688" filter="url(#r)">a..y：</text>
  <text x="468" y="133" font-size="11" fill="#446688" filter="url(#r)">整体 +1 格</text>

  <!-- z split visual -->
  <text x="320" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">z 是唯一「一分为二」的字符</text>
  <rect x="292" y="182" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <text x="320" y="204" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">z×k</text>
  <path d="M 318 220 Q 288 244 262 258" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 324 220 Q 354 244 380 258" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <rect x="226" y="262" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#r)"/>
  <text x="261" y="283" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">a += k</text>
  <rect x="346" y="262" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#r)"/>
  <text x="381" y="283" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">b += k</text>
  <text x="320" y="316" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#r)">右移不改变总数 ⇒ 每轮长度增量 = 上一轮 cnt[z]</text>

  <!-- bottom note -->
  <rect x="42" y="336" width="556" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r)"/>
  <text x="320" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07520" filter="url(#r)">26 维线性递推：状态 = 频率向量，转移 = 固定线性映射，跑 t 轮后求和</text>
  <text x="320" y="384" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#r)">只有加法 ⇒ 全程 mod 10⁹+7 安全；t ≤ 10⁵ 时 O(26t) 逐轮模拟即过</text>
</svg>
