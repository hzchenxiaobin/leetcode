<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例 "_R__LL_" 的贪心演算</text>

  <rect x="86" y="58" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="84" text-anchor="middle" font-size="16" fill="#8a6d1f" filter="url(#rough2)">_</text>
  <rect x="136" y="58" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="84" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">R</text>
  <rect x="186" y="58" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="84" text-anchor="middle" font-size="16" fill="#8a6d1f" filter="url(#rough2)">_</text>
  <rect x="236" y="58" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="84" text-anchor="middle" font-size="16" fill="#8a6d1f" filter="url(#rough2)">_</text>
  <rect x="286" y="58" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="84" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">L</text>
  <rect x="336" y="58" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="84" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">L</text>
  <rect x="386" y="58" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="84" text-anchor="middle" font-size="16" fill="#8a6d1f" filter="url(#rough2)">_</text>

  <path d="M260,104 L260,126" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="70" y="132" width="100" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="154" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">L × 2</text>
  <rect x="210" y="132" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">R × 1</text>
  <rect x="350" y="132" width="100" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="154" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">_ × 4</text>

  <text x="260" y="198" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">固定净位移 d = R − L = 1 − 2 = −1</text>
  <text x="260" y="226" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">4 个 '_' 全部向左：位置 = −1 − 4 = −5</text>

  <rect x="130" y="248" width="260" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">最远距离 = |−5| = 5</text>

  <text x="260" y="330" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">答案 = |cntL − cntR| + cntU</text>
</svg>
