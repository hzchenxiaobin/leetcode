<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="490" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：分桶 → 求和 → 比较，三个样例一图看尽</text>
  <path d="M 200 40 Q 380 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Card 1: tie ===== -->
  <g filter="url(#rough2)">
    <rect x="24" y="62" width="232" height="270" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="140" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2828" filter="url(#rough2)">示例 1：平局双输</text>

  <g filter="url(#rough2)">
    <rect x="58" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="92" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="126" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="194" y="102" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="72" y="121" fill="#446688">1</text>
    <text x="106" y="121" fill="#446688">2</text>
    <text x="140" y="121" fill="#446688">3</text>
    <text x="174" y="121" fill="#446688">4</text>
    <text x="208" y="121" fill="#a07820" font-weight="bold">10</text>
  </g>

  <text x="140" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">s₁ = 1+2+3+4 = 10</text>
  <text x="140" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">s₂ = 10</text>
  <text x="140" y="208" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">s₁ = s₂ → 平局</text>
  <text x="140" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a2828" filter="url(#rough2)">✗ false</text>
  <text x="140" y="268" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">两种选择都无法「严格大于」</text>
  <text x="140" y="290" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">陷阱：个位数之和恰好也是 10</text>

  <!-- ===== Card 2: single wins ===== -->
  <g filter="url(#rough2)">
    <rect x="264" y="62" width="232" height="270" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="380" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">示例 2：个位数险胜</text>

  <g filter="url(#rough2)">
    <rect x="281" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="315" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="349" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="383" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="417" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="451" y="102" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="295" y="121" fill="#446688">1</text>
    <text x="329" y="121" fill="#446688">2</text>
    <text x="363" y="121" fill="#446688">3</text>
    <text x="397" y="121" fill="#446688">4</text>
    <text x="431" y="121" fill="#446688">5</text>
    <text x="465" y="121" fill="#a07820" font-weight="bold">14</text>
  </g>

  <text x="380" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">s₁ = 1+2+3+4+5 = 15</text>
  <text x="380" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">s₂ = 14</text>
  <text x="380" y="208" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">s₁ &gt; s₂ → 选个位数</text>
  <text x="380" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ true</text>
  <text x="380" y="268" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">选个位数：15 &gt; 14 严格成立</text>
  <text x="380" y="290" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">差 1 也是赢——比较是严格大于</text>

  <!-- ===== Card 3: double wins ===== -->
  <g filter="url(#rough2)">
    <rect x="504" y="62" width="232" height="270" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="620" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">示例 3：两位数反超</text>

  <g filter="url(#rough2)">
    <rect x="555" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="589" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="623" y="102" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="657" y="102" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="569" y="121" fill="#446688">5</text>
    <text x="603" y="121" fill="#446688">5</text>
    <text x="637" y="121" fill="#446688">5</text>
    <text x="671" y="121" fill="#a07820" font-weight="bold">25</text>
  </g>

  <text x="620" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">s₁ = 5+5+5 = 15</text>
  <text x="620" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">s₂ = 25</text>
  <text x="620" y="208" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">s₂ &gt; s₁ → 选两位数</text>
  <text x="620" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ true</text>
  <text x="620" y="268" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">选两位数：25 &gt; 15 严格成立</text>
  <text x="620" y="290" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">3 个个位数也赢不过 1 个两位数</text>

  <!-- ===== takeaway ===== -->
  <g filter="url(#rough2)">
    <rect x="24" y="352" width="712" height="118" rx="10" fill="#fffdf3" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="380" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一张表看尽所有情况（s₁、s₂ 非负，三分律保证恰居其一）</text>

  <g filter="url(#rough2)">
    <rect x="44" y="394" width="214" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="151" y="415" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">s₁ &gt; s₂ ⇒ true（选个位）</text>
  <g filter="url(#rough2)">
    <rect x="273" y="394" width="214" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="380" y="415" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">s₂ &gt; s₁ ⇒ true（选两位）</text>
  <g filter="url(#rough2)">
    <rect x="502" y="394" width="214" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="609" y="415" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a2828" filter="url(#rough2)">s₁ = s₂ ⇒ false（平局）</text>

  <text x="380" y="452" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">判据只有一个：两桶之和是否相等——不等则必有较大的一桶可选，相等则两边都赢不了</text>
</svg>
