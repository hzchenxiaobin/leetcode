<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="510" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：nums = [1,2,3,4,5,6]，k = 6 —— 答案 7</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Step 1: divisors -->
  <text x="24" y="74" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 因子表</text>
  <rect x="110" y="56" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="128" y="75" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="154" y="56" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="172" y="75" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="198" y="56" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="75" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="242" y="56" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">6</text>
  <text x="310" y="75" font-size="10.5" fill="#888" filter="url(#rough2)">6 = 2·3 → d(6) = 4 个因子</text>

  <!-- Step 2: gcd freq -->
  <text x="24" y="150" font-size="12" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">② GCD 频次</text>
  <text x="88" y="139" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">x</text>
  <rect x="100" y="120" width="32" height="28" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="139" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="138" y="120" width="32" height="28" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="139" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <rect x="176" y="120" width="32" height="28" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192" y="139" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <rect x="214" y="120" width="32" height="28" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="139" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <rect x="252" y="120" width="32" height="28" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="139" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <rect x="290" y="120" width="32" height="28" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="139" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">6</text>

  <text x="88" y="171" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">g</text>
  <rect x="100" y="152" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="116" y="171" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="138" y="152" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="154" y="171" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="176" y="152" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="171" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="214" y="152" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="171" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="252" y="152" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="268" y="171" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="290" y="152" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="306" y="171" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">6</text>

  <text x="356" y="140" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">freq：1→2，2→2，3→1，6→1</text>
  <text x="356" y="162" font-size="10.5" fill="#888" filter="url(#rough2)">4 和 5 都塌缩进 g = 2 / g = 1</text>
  <text x="356" y="182" font-size="10.5" fill="#888" filter="url(#rough2)">g 序列 = [1,2,3,2,1,6]</text>

  <!-- Step 3: pair enumeration grid -->
  <text x="24" y="226" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">③ 枚举因子对 (d1 ≤ d2)，共 C(4+1,2) = 10 对</text>

  <rect x="24" y="236" width="112" height="48" rx="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="255" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">(1,1)</text>
  <text x="80" y="276" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">✗</text>

  <rect x="142" y="236" width="112" height="48" rx="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="255" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">(1,2)</text>
  <text x="198" y="276" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">✗</text>

  <rect x="260" y="236" width="112" height="48" rx="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="255" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">(1,3)</text>
  <text x="316" y="276" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">✗</text>

  <rect x="378" y="236" width="112" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="434" y="255" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">(1,6)</text>
  <text x="434" y="276" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">✓ +2</text>

  <rect x="496" y="236" width="112" height="48" rx="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="552" y="255" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">(2,2)</text>
  <text x="552" y="276" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">✗</text>

  <rect x="24" y="290" width="112" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="309" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">(2,3)</text>
  <text x="80" y="330" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">✓ +2</text>

  <rect x="142" y="290" width="112" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="309" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">(2,6)</text>
  <text x="198" y="330" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">✓ +2</text>

  <rect x="260" y="290" width="112" height="48" rx="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="309" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">(3,3)</text>
  <text x="316" y="330" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">✗</text>

  <rect x="378" y="290" width="112" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="434" y="309" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">(3,6)</text>
  <text x="434" y="330" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">✓ +1</text>

  <rect x="496" y="290" width="112" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="552" y="309" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">(6,6)</text>
  <text x="552" y="330" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">✓ +0</text>

  <!-- Sum bar -->
  <rect x="24" y="352" width="584" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="375" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">合法贡献：2 + 2 + 2 + 1 + 0 = 7 —— 与暴力计数完全一致</text>

  <!-- Notes -->
  <rect x="24" y="400" width="584" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="424" text-anchor="middle" font-size="10.8" fill="#8a6d1f" filter="url(#rough2)">(6,6) 虽合法，但 c = 1 → C(1,2) = 0：同因子配对必须用组合数</text>
  <text x="316" y="446" text-anchor="middle" font-size="10.8" fill="#8a6d1f" filter="url(#rough2)">(3,3) 虽同因子，9 % 6 ≠ 0 → 跳过：先判整除，再按频次计数</text>

  <!-- Verify -->
  <rect x="24" y="470" width="584" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="490" text-anchor="middle" font-size="10.8" fill="#2d5a24" filter="url(#rough2)">暴力对拍：(1,6),(2,3),(2,6),(3,4),(3,6),(4,6),(5,6) —— 恰好 7 对 ✓</text>
</svg>
