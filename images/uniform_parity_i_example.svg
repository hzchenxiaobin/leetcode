<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums1 = [2, 4, 5]（混合情况）</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 上排：nums1 的三个格子 -->
  <g filter="url(#rough2)">
    <rect x="128" y="60" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="160" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="102" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">偶</text>

  <g filter="url(#rough2)">
    <rect x="288" y="60" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="320" y="102" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">偶</text>

  <g filter="url(#rough2)">
    <rect x="448" y="60" width="64" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="480" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="480" y="102" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">奇</text>

  <!-- 向下箭头 -->
  <path d="M 160 112 L 160 166" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 112 L 320 166" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 480 112 L 480 166" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 箭头旁标注 -->
  <text x="172" y="136" font-size="11" fill="#555" filter="url(#rough2)">减去奇数 5</text>
  <text x="172" y="152" font-size="11" fill="#555" font-family="monospace" filter="url(#rough2)">2 − 5 = −3</text>
  <text x="332" y="136" font-size="11" fill="#555" filter="url(#rough2)">减去奇数 5</text>
  <text x="332" y="152" font-size="11" fill="#555" font-family="monospace" filter="url(#rough2)">4 − 5 = −1</text>
  <text x="492" y="136" font-size="11" fill="#555" filter="url(#rough2)">保留原值</text>
  <text x="492" y="152" font-size="11" fill="#555" font-family="monospace" filter="url(#rough2)">nums2[2] = 5</text>

  <!-- 下排：nums2 的三个格子（全奇，绿） -->
  <g filter="url(#rough2)">
    <rect x="128" y="172" width="64" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="160" y="196" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">−3</text>
  <text x="160" y="214" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">奇</text>

  <g filter="url(#rough2)">
    <rect x="288" y="172" width="64" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="196" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">−1</text>
  <text x="320" y="214" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">奇</text>

  <g filter="url(#rough2)">
    <rect x="448" y="172" width="64" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="480" y="196" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="480" y="214" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">奇</text>

  <!-- 结果框 -->
  <g filter="url(#rough2)">
    <rect x="140" y="248" width="360" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">nums2 = [−3, −1, 5]</text>
  <text x="320" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">全部为奇数 ✓</text>

  <!-- 关键点注释 -->
  <g filter="url(#rough2)">
    <rect x="56" y="312" width="528" height="72" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="334" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">关键点</text>
  <text x="320" y="352" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">① 偶 − 奇 = 奇：偶数减去任意一个奇数，结果必为奇数</text>
  <text x="320" y="370" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">② 下标 0 和 1 共用同一个 j（元素 5）：各下标选择互相独立，j 可重复使用</text>
</svg>
