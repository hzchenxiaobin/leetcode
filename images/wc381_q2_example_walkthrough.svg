<svg xmlns="http://www.w3.org/2000/svg" width="640" height="478" viewBox="0 0 640 478" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="478" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：n = 5，x = 2，y = 4（10 个无序对逐个 ×2 进桶）</text>
  <path d="M 110 40 Q 320 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header row -->
  <g filter="url(#sk)">
    <rect x="30" y="58" width="90" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="120" y="58" width="100" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="220" y="58" width="150" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="370" y="58" width="90" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="460" y="58" width="150" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" fill="#2b5d85" text-anchor="middle">
    <text x="75" y="77">点对 (i,j)</text>
    <text x="170" y="77">直走 j−i</text>
    <text x="295" y="77">绕弦 |i−x|+1+|j−y|</text>
    <text x="415" y="77">d = min</text>
    <text x="535" y="77">res（累加后）</text>
  </g>

  <!-- rows: star rows (chord shorter) in orange -->
  <g filter="url(#sk)" font-size="12" text-anchor="middle">
    <rect x="30" y="88" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="120" y="88" width="100" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="220" y="88" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="370" y="88" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="460" y="88" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="75" y="106" fill="#333">(1, 2)</text>
    <text x="170" y="106" fill="#2e6e2e">1</text>
    <text x="295" y="106" fill="#a04a5a">4</text>
    <text x="415" y="106" fill="#333">1</text>
    <text x="535" y="106" fill="#2b5d85">[2, 0, 0, 0, 0]</text>

    <rect x="30" y="115" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="120" y="115" width="100" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="220" y="115" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="370" y="115" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="460" y="115" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="75" y="133" fill="#333">(1, 3)</text>
    <text x="170" y="133" fill="#2e6e2e">2</text>
    <text x="295" y="133" fill="#a04a5a">3</text>
    <text x="415" y="133" fill="#333">2</text>
    <text x="535" y="133" fill="#2b5d85">[2, 2, 0, 0, 0]</text>

    <rect x="30" y="142" width="90" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="120" y="142" width="100" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="220" y="142" width="150" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="370" y="142" width="90" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="460" y="142" width="150" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <text x="75" y="160" fill="#333">(1, 4)</text>
    <text x="170" y="160" fill="#2e6e2e">3</text>
    <text x="295" y="160" fill="#a04a5a">2</text>
    <text x="415" y="160" fill="#a06b1a" font-weight="bold">2 ★</text>
    <text x="535" y="160" fill="#2b5d85">[2, 4, 0, 0, 0]</text>

    <rect x="30" y="169" width="90" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="120" y="169" width="100" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="220" y="169" width="150" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="370" y="169" width="90" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="460" y="169" width="150" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <text x="75" y="187" fill="#333">(1, 5)</text>
    <text x="170" y="187" fill="#2e6e2e">4</text>
    <text x="295" y="187" fill="#a04a5a">3</text>
    <text x="415" y="187" fill="#a06b1a" font-weight="bold">3 ★</text>
    <text x="535" y="187" fill="#2b5d85">[2, 4, 2, 0, 0]</text>

    <rect x="30" y="196" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="120" y="196" width="100" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="220" y="196" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="370" y="196" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="460" y="196" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="75" y="214" fill="#333">(2, 3)</text>
    <text x="170" y="214" fill="#2e6e2e">1</text>
    <text x="295" y="214" fill="#a04a5a">2</text>
    <text x="415" y="214" fill="#333">1</text>
    <text x="535" y="214" fill="#2b5d85">[4, 4, 2, 0, 0]</text>

    <rect x="30" y="223" width="90" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="120" y="223" width="100" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="220" y="223" width="150" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="370" y="223" width="90" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="460" y="223" width="150" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <text x="75" y="241" fill="#333">(2, 4)</text>
    <text x="170" y="241" fill="#2e6e2e">2</text>
    <text x="295" y="241" fill="#a04a5a">1</text>
    <text x="415" y="241" fill="#a06b1a" font-weight="bold">1 ★</text>
    <text x="535" y="241" fill="#2b5d85">[6, 4, 2, 0, 0]</text>

    <rect x="30" y="250" width="90" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="120" y="250" width="100" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="220" y="250" width="150" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="370" y="250" width="90" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="460" y="250" width="150" height="27" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <text x="75" y="268" fill="#333">(2, 5)</text>
    <text x="170" y="268" fill="#2e6e2e">3</text>
    <text x="295" y="268" fill="#a04a5a">2</text>
    <text x="415" y="268" fill="#a06b1a" font-weight="bold">2 ★</text>
    <text x="535" y="268" fill="#2b5d85">[6, 6, 2, 0, 0]</text>

    <rect x="30" y="277" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="120" y="277" width="100" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="220" y="277" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="370" y="277" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="460" y="277" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="75" y="295" fill="#333">(3, 4)</text>
    <text x="170" y="295" fill="#2e6e2e">1</text>
    <text x="295" y="295" fill="#a04a5a">2</text>
    <text x="415" y="295" fill="#333">1</text>
    <text x="535" y="295" fill="#2b5d85">[8, 6, 2, 0, 0]</text>

    <rect x="30" y="304" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="120" y="304" width="100" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="220" y="304" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="370" y="304" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="460" y="304" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="75" y="322" fill="#333">(3, 5)</text>
    <text x="170" y="322" fill="#2e6e2e">2</text>
    <text x="295" y="322" fill="#a04a5a">3</text>
    <text x="415" y="322" fill="#333">2</text>
    <text x="535" y="322" fill="#2b5d85">[8, 8, 2, 0, 0]</text>

    <rect x="30" y="331" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="120" y="331" width="100" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="220" y="331" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="370" y="331" width="90" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="460" y="331" width="150" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="75" y="349" fill="#333">(4, 5)</text>
    <text x="170" y="349" fill="#2e6e2e">1</text>
    <text x="295" y="349" fill="#a04a5a">4</text>
    <text x="415" y="349" fill="#333">1</text>
    <text x="535" y="349" fill="#2b5d85">[10, 8, 2, 0, 0]</text>
  </g>

  <text x="320" y="376" text-anchor="middle" font-size="11" fill="#a06b1a">★ = 绕弦更短的 4 对：(1,4) 3→2、(1,5) 4→3、(2,4) 2→1、(2,5) 3→2</text>

  <!-- result strip -->
  <g filter="url(#sk)">
    <rect x="75" y="392" width="90" height="52" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="175" y="392" width="90" height="52" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="275" y="392" width="90" height="52" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="375" y="392" width="90" height="52" rx="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
    <rect x="475" y="392" width="90" height="52" rx="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" text-anchor="middle">
    <text x="120" y="410" font-size="11" fill="#666">k = 1</text>
    <text x="220" y="410" font-size="11" fill="#666">k = 2</text>
    <text x="320" y="410" font-size="11" fill="#666">k = 3</text>
    <text x="420" y="410" font-size="11" fill="#666">k = 4</text>
    <text x="520" y="410" font-size="11" fill="#666">k = 5</text>
    <text x="120" y="436" font-size="16" font-weight="bold" fill="#2e6e2e">10</text>
    <text x="220" y="436" font-size="16" font-weight="bold" fill="#2e6e2e">8</text>
    <text x="320" y="436" font-size="16" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="420" y="436" font-size="16" font-weight="bold" fill="#999">0</text>
    <text x="520" y="436" font-size="16" font-weight="bold" fill="#999">0</text>
  </g>

  <text x="320" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8e4a">Σ res = 10 + 8 + 2 = 20 = 5 × 4 ✓ 通过自检</text>
</svg>
