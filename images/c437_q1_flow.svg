<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：双指针分组扫描</text>
  <path d="M 210 40 Q 340 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="245" y="62" width="110" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="300" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 0</text>

  <g filter="url(#rough2)">
    <path d="M 300 98 L 300 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- diamond 1 -->
  <g filter="url(#rough2)">
    <polygon points="300,118 380,152 300,186 220,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="300" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <g filter="url(#rough2)">
    <path d="M 380 152 L 448 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="408" y="144" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="450" y="134" width="130" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="515" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">return false</text>

  <g filter="url(#rough2)">
    <path d="M 300 186 L 300 204" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="314" y="200" font-size="11" fill="#888" filter="url(#rough2)">是</text>

  <!-- expand run -->
  <g filter="url(#rough2)">
    <rect x="210" y="206" width="180" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="300" y="227" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">j = i，向右扩展 j</text>
  <text x="300" y="244" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">while j &lt; n 且 s[j] == s[i]</text>

  <g filter="url(#rough2)">
    <path d="M 300 250 L 300 268" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- diamond 2 -->
  <g filter="url(#rough2)">
    <polygon points="300,270 395,306 300,342 205,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="300" y="311" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">j − i == k ?</text>
  <g filter="url(#rough2)">
    <path d="M 395 306 L 448 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="418" y="298" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="450" y="288" width="130" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="515" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return true</text>

  <g filter="url(#rough2)">
    <path d="M 300 342 L 300 360" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="314" y="356" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- i = j -->
  <g filter="url(#rough2)">
    <rect x="255" y="362" width="90" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="300" y="383" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = j</text>

  <!-- loop back -->
  <g filter="url(#rough2)">
    <path d="M 255 378 L 150 378 L 150 152 L 216 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="160" y="292" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">跳到下一段起点</text>

  <!-- complexity note -->
  <g filter="url(#rough2)">
    <rect x="470" y="200" width="190" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="565" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">i、j 单调前进</text>
  <text x="565" y="238" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">每字符至多访问两次</text>
  <text x="565" y="254" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">整体 O(n)</text>

  <text x="340" y="420" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">注意：处理完一段后 i = j 整段跳过（写 i+1 结果不变但会退化成 O(n·L)）</text>
</svg>
