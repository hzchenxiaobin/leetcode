<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一次涂色可以顺便盖住同字符的远处位置</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 s = "abca" 为例：整段涂 a，再补 b、c，只需 3 次</text>

  <rect x="140" y="72" width="216" height="52" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <rect x="150" y="76" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="104" text-anchor="middle" font-size="16" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="200" y="76" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="222" y="104" text-anchor="middle" font-size="16" fill="#8a6a20" filter="url(#rough2)">b</text>
  <rect x="250" y="76" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="272" y="104" text-anchor="middle" font-size="16" fill="#8a6a20" filter="url(#rough2)">c</text>
  <rect x="300" y="76" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="104" text-anchor="middle" font-size="16" fill="#3a5a30" filter="url(#rough2)">a</text>

  <text x="172" y="136" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="222" y="136" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="272" y="136" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="322" y="136" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>

  <text x="368" y="82" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 1 次：涂 a（0..3）</text>
  <text x="368" y="104" font-size="10" fill="#666" filter="url(#rough2)">1、2 号位随后被 b、c 覆盖</text>
  <text x="368" y="124" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0、3 号位保留 a</text>

  <rect x="40" y="160" width="540" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="184" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">dp[i][j] = min( ① dp[i+1][j] + 1 ,</text>
  <text x="58" y="206" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">② min{ dp[i+1][k-1] + dp[k][j] : i &lt; k ≤ j 且 s[k] = s[i] } )</text>

  <rect x="60" y="232" width="200" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="254" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">dp[1][2]：子串 "bc"</text>
  <text x="76" y="276" font-size="10" fill="#444" filter="url(#rough2)">b、c 各涂一次 → 2</text>
  <text x="76" y="296" font-size="9.5" fill="#777" filter="url(#rough2)">与端点 0、3 互不干扰</text>

  <text x="278" y="276" text-anchor="middle" font-size="18" fill="#666" filter="url(#rough2)">+</text>

  <rect x="296" y="232" width="200" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="254" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">dp[3][3]：子串 "a"</text>
  <text x="312" y="276" font-size="10" fill="#444" filter="url(#rough2)">与 0 号位同字符</text>
  <text x="312" y="296" font-size="9.5" fill="#777" filter="url(#rough2)">并入第 1 次涂色 → 1</text>

  <text x="512" y="278" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 3</text>

  <rect x="40" y="328" width="540" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="352" font-size="10.5" fill="#555" filter="url(#rough2)">区间内没有同字符可共享时，只剩分支 ①：dp[i][j] = dp[i+1][j] + 1</text>
  <text x="58" y="376" font-size="10.5" fill="#555" filter="url(#rough2)">每个同字符位置 k 都可能让 s[i] 少涂一次，所以要遍历所有 k 取最小</text>
  <text x="58" y="400" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">最终答案 dp[0][n-1]；先合并相邻同字符只是常数级加速</text>
</svg>
