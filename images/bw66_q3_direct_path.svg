<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="141"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">绕路必不划算：任何路径的代价都能被"直走"覆盖</text>

  <!-- 网格 3x4，start (1,0) home (2,3) -->
  <text x="320" y="56" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">示例 1：start=(1,0)，home=(2,3)，最优路径代价 18</text>
  <g filter="url(#rough2)">
    <rect x="160" y="70" width="80" height="52" rx="4" fill="#fafafa" stroke="#ccc"/>
    <rect x="240" y="70" width="80" height="52" rx="4" fill="#fafafa" stroke="#ccc"/>
    <rect x="320" y="70" width="80" height="52" rx="4" fill="#fafafa" stroke="#ccc"/>
    <rect x="400" y="70" width="80" height="52" rx="4" fill="#fafafa" stroke="#ccc"/>
    <rect x="160" y="122" width="80" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="240" y="122" width="80" height="52" rx="4" fill="#fafafa" stroke="#ccc"/>
    <rect x="320" y="122" width="80" height="52" rx="4" fill="#fafafa" stroke="#ccc"/>
    <rect x="400" y="122" width="80" height="52" rx="4" fill="#fafafa" stroke="#ccc"/>
    <rect x="160" y="174" width="80" height="52" rx="4" fill="#fafafa" stroke="#ccc"/>
    <rect x="240" y="174" width="80" height="52" rx="4" fill="#fafafa" stroke="#ccc"/>
    <rect x="320" y="174" width="80" height="52" rx="4" fill="#fafafa" stroke="#ccc"/>
    <rect x="400" y="174" width="80" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <!-- 直走路径 -->
  <path d="M 200 148 L 200 200 L 440 200" fill="none" stroke="#4a7a3a" stroke-width="3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="200" cy="148" r="9" fill="#446688" filter="url(#rough2)"/>
  <circle cx="440" cy="200" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="188" y="152" font-size="12" fill="#446688" filter="url(#rough2)">start</text>
  <text x="452" y="204" font-size="12" fill="#4a7a3a" filter="url(#rough2)">home</text>
  <text x="310" y="240" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">下移 1 步（rowCosts[2]=3）+ 右移 3 步（colCosts[1..3]=2+6+7）= 18</text>

  <!-- 绕路对比 -->
  <text x="320" y="284" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">绕路路径（先上再右再下）：多付 rowCosts[0]=5 和 rowCosts[2]=3</text>
  <path d="M 208 140 Q 120 100 208 90" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 公式 -->
  <rect x="80" y="308" width="480" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="334" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">最小代价 = Σ rowCosts[r]（r 在 start 与 home 行的闭区间）</text>
  <text x="320" y="358" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">　　　　　+ Σ colCosts[c]（c 在 start 与 home 列的闭区间）− 两个起点费用</text>
  <text x="320" y="382" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（机器人出发那一步不付"进入起点"的代价，所以扣掉 rowCosts[r0] 与 colCosts[c0]）</text>
</svg>
