<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="360" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1（n=3, x=5, queries=[10,11]）</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="40" y="48" width="70" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="75" y="68" text-anchor="middle">查询 q</text>
    <rect x="110" y="48" width="120" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="170" y="68" text-anchor="middle">窗口 [q−x, q]</text>
    <rect x="230" y="48" width="190" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="325" y="68" text-anchor="middle">窗口内的日志 (id, time)</text>
    <rect x="420" y="48" width="130" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="485" y="68" text-anchor="middle">active（服务器集）</text>
    <rect x="550" y="48" width="90" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="595" y="68" text-anchor="middle">答案</text>
  </g>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="40" y="84" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="75" y="105" text-anchor="middle">10</text>
    <rect x="110" y="84" width="120" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="170" y="105" text-anchor="middle">[5, 10]</text>
    <rect x="230" y="84" width="190" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="325" y="105" text-anchor="middle">(1,5)、(2,6)　← (1,3) 被弹出</text>
    <rect x="420" y="84" width="130" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="485" y="105" text-anchor="middle">{1, 2}</text>
    <rect x="550" y="84" width="90" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="595" y="105" text-anchor="middle" fill="#b85450">1</text>

    <rect x="40" y="124" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="75" y="145" text-anchor="middle">11</text>
    <rect x="110" y="124" width="120" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="170" y="145" text-anchor="middle">[6, 11]</text>
    <rect x="230" y="124" width="190" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="325" y="145" text-anchor="middle">(2,6)　← (1,5) 被弹出</text>
    <rect x="420" y="124" width="130" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="485" y="145" text-anchor="middle">{2}</text>
    <rect x="550" y="124" width="90" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="595" y="145" text-anchor="middle" fill="#b85450">2</text>
  </g>

  <path d="M 90 176 C 240 184, 460 184, 600 178" stroke="#ddd" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <text x="340" y="206" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2（n=3, x=2, queries=[3,4]，日志含重复服务器）</text>

  <!-- 表头 2 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="40" y="222" width="70" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="75" y="242" text-anchor="middle">查询 q</text>
    <rect x="110" y="222" width="120" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="170" y="242" text-anchor="middle">窗口</text>
    <rect x="230" y="222" width="190" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="325" y="242" text-anchor="middle">窗口内的日志</text>
    <rect x="420" y="222" width="130" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="485" y="242" text-anchor="middle">active</text>
    <rect x="550" y="222" width="90" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="595" y="242" text-anchor="middle">答案</text>

    <rect x="40" y="258" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="75" y="279" text-anchor="middle">3</text>
    <rect x="110" y="258" width="120" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="170" y="279" text-anchor="middle">[1, 3]</text>
    <rect x="230" y="258" width="190" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="325" y="279" text-anchor="middle">(2,1)、(3,1)、(1,2)</text>
    <rect x="420" y="258" width="130" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="485" y="279" text-anchor="middle">{1, 2, 3}</text>
    <rect x="550" y="258" width="90" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="595" y="279" text-anchor="middle" fill="#b85450">0</text>

    <rect x="40" y="298" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="75" y="319" text-anchor="middle">4</text>
    <rect x="110" y="298" width="120" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="170" y="319" text-anchor="middle">[2, 4]</text>
    <rect x="230" y="298" width="190" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="325" y="319" text-anchor="middle">(1,2)、(2,4)</text>
    <rect x="420" y="298" width="130" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="485" y="319" text-anchor="middle">{1, 2}</text>
    <rect x="550" y="298" width="90" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="595" y="319" text-anchor="middle" fill="#b85450">1</text>
  </g>

  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">q=4 时服务器 2 的 (2,1) 弹出、(2,4) 纳入：cnt[2] 2→1，active 不减——所以要按「条数」计数</text>
</svg>
