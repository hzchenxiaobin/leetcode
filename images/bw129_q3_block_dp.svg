<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="85"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="600" height="344" fill="#fafafa"/>
  <text x="300.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">按「最后一段」转移：追加 k 个 0（1 ≤ k ≤ limit）</text>
  <rect x="39.7" y="95.8" width="31.9" height="32.3" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56.0" y="117.1" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">·</text>
  <rect x="72.0" y="96.2" width="31.7" height="32.0" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="88.0" y="117.1" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">·</text>
  <rect x="104.2" y="96.0" width="32.3" height="32.3" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="120.0" y="117.1" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">1</text>
  <rect x="135.9" y="95.7" width="32.2" height="31.7" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="152.0" y="117.1" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">1</text>
  <text x="174.0" y="118.0" text-anchor="middle" font-size="14" fill="#888888" filter="url(#rough2)">…</text>
  <rect x="191.7" y="96.2" width="32.2" height="32.2" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="208.0" y="117.1" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">0</text>
  <rect x="224.3" y="95.8" width="31.7" height="31.7" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="240.0" y="117.1" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">0</text>
  <rect x="256.3" y="95.7" width="31.8" height="31.7" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="272.0" y="117.1" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">0</text>
  <rect x="187.5" y="91.5" width="103.9" height="39.7" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" fill-opacity="0.45" filter="url(#rough2)"/>
  <text x="240.0" y="84.0" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">k 个 0（1≤k≤limit）</text>
  <text x="104.0" y="84.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">前缀以 1 结尾</text>
  <rect x="39.8" y="158.4" width="249.7" height="75.3" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165.0" y="182.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">dp0[i][j] = Σ dp1[i−k][j]</text>
  <text x="165.0" y="199.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">状态：用了 i 个 0、j 个 1，</text>
  <text x="165.0" y="216.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">末位是 0（末段长 1..limit）</text>
  <rect x="310.2" y="158.1" width="260.1" height="75.3" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440.0" y="182.2" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">对称地</text>
  <text x="440.0" y="199.2" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">dp1[i][j] = Σ dp0[i−k'][j]…</text>
  <text x="440.0" y="216.2" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">即沿 j 方向数 1 的个数</text>
  <text x="300.0" y="268.0" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">末段一旦超过 limit 就不合法，所以 k 只在 1..limit 之间枚举</text>
  <text x="300.0" y="290.0" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">每个数组被「最后一段」唯一划分 ⇒ 按段转移不重不漏</text>
  <text x="300.0" y="312.0" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">边界：i=0（全 1）或 j=0（全 0）时只有一条 k=ones / k=zeros 的转移</text>
</svg>
