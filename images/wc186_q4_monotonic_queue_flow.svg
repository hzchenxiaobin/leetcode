<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：单调队列优化 DP（对每个 i 依次执行）</text>
  <text x="320" y="41" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">队列存下标，对应 dp 值从队头到队尾递减；四步顺序固定：过期 → 查询 → 入队 → 记答案</text>

  <g filter="url(#rough2)">
    <rect x="245" y="50" width="150" height="28" rx="14" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="320" y="68" text-anchor="middle" font-size="11.5" fill="#555">i = 0 … n−1 依次遍历</text>

    <path d="M320,78 L320,90" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <rect x="105" y="92" width="430" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="125" y="112" font-size="12" font-weight="bold" fill="#8a3a36">① 过期出队（队头 · 左端）</text>
    <text x="125" y="130" font-size="10.5" fill="#555">while 队非空 且 队头 &lt; i − k ： pop_front()　—— 滑出窗口 [i−k, i−1] 的下标永不复活</text>

    <path d="M320,140 L320,152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <rect x="105" y="154" width="430" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="125" y="174" font-size="12" font-weight="bold" fill="#3a5a3a">② 查询窗口最大，计算 dp[i]</text>
    <text x="125" y="192" font-size="10.5" fill="#555">best = 队空 ? 0 : dp[队头]； dp[i] = nums[i] + max(0, best)　—— 队头即窗口内 dp 最大</text>

    <path d="M320,202 L320,214" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <rect x="105" y="216" width="430" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="125" y="236" font-size="12" font-weight="bold" fill="#2b4a66">③ 入队弹尾（队尾 · 右端）</text>
    <text x="125" y="254" font-size="10.5" fill="#555">while 队非空 且 dp[队尾] ≤ dp[i] ： pop_back()；再 push_back(i)　—— 「dp 更小且更早」者永非最大</text>

    <path d="M320,264 L320,276" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <rect x="105" y="278" width="430" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="125" y="298" font-size="12" font-weight="bold" fill="#b07818">④ 更新答案</text>
    <text x="125" y="316" font-size="10.5" fill="#555">ans = max( ans , dp[i] )　—— 子序列可结束在任意位置：答案是 max(dp)，不是 dp[n−1]</text>

    <path d="M535,302 L585,302 L585,64 L400,64" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="585" y="52" text-anchor="middle" font-size="10" fill="#3a3a3a">i ← i + 1</text>

    <path d="M320,326 L320,340" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="332" y="336" font-size="9.5" fill="#888">i = n，循环结束</text>

    <rect x="250" y="342" width="140" height="28" rx="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">返回 ans</text>
  </g>

  <g filter="url(#rough2)">
    <text x="40" y="378" font-size="12" font-weight="bold" fill="#2b2b2b">队列形态：dp 值从队头到队尾递减</text>

    <rect x="200" y="390" width="76" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="238" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a3a">1 : 8</text>
    <rect x="276" y="390" width="76" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="314" y="410" text-anchor="middle" font-size="11" fill="#555">3 : 3</text>

    <text x="238" y="440" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">队头（窗口内 dp 最大）</text>
    <text x="314" y="440" text-anchor="middle" font-size="10.5" fill="#555">队尾</text>

    <path d="M118,406 L194,406" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)"/>
    <text x="112" y="394" text-anchor="middle" font-size="10" fill="#b85450">过期出队</text>

    <path d="M500,406 L360,406" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <text x="488" y="394" text-anchor="middle" font-size="10" fill="#4a7a3a">弹尾后入队</text>

    <text x="552" y="428" text-anchor="middle" font-size="9.5" fill="#888">（示例演算 i=3 后的状态）</text>
  </g>
</svg>
