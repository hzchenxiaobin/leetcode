<svg xmlns="http://www.w3.org/2000/svg" width="660" height="460" viewBox="0 0 660 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="460" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "cd%#*#"，k = 3 的倒序追踪</text>
  <path d="M 200 38 Q 330 48 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: forward lengths -->
  <text x="30" y="60" font-size="11" fill="#888">第一步 · 正向扫一遍，只记长度：</text>
  <g font-size="11.5" font-family="monospace" font-weight="bold">
    <g filter="url(#sk)"><rect x="60" y="68" width="46" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="83" y="85" text-anchor="middle" fill="#2b6e9e">c→1</text>
    <g filter="url(#sk)"><rect x="114" y="68" width="46" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="137" y="85" text-anchor="middle" fill="#2b6e9e">d→2</text>
    <g filter="url(#sk)"><rect x="168" y="68" width="46" height="26" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
    <text x="191" y="85" text-anchor="middle" fill="#7a5415">%→2</text>
    <g filter="url(#sk)"><rect x="222" y="68" width="46" height="26" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="245" y="85" text-anchor="middle" fill="#2e6e2e">#→4</text>
    <g filter="url(#sk)"><rect x="276" y="68" width="46" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
    <text x="299" y="85" text-anchor="middle" fill="#a04040">*→3</text>
    <g filter="url(#sk)"><rect x="330" y="68" width="46" height="26" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="353" y="85" text-anchor="middle" fill="#2e6e2e">#→6</text>
  </g>
  <text x="396" y="85" font-size="11" fill="#444">最终长度 6，k=3 &lt; 6 ✓</text>

  <!-- Step 2: backward trace -->
  <text x="30" y="120" font-size="11" fill="#888">第二步 · 倒序把 k 映射回来源（Li = 处理完前 i 个字符后的长度）：</text>

  <!-- table header -->
  <g filter="url(#sk)"><rect x="40" y="130" width="36" height="30" fill="#f0ede4" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="76" y="130" width="52" height="30" fill="#f0ede4" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="128" y="130" width="180" height="30" fill="#f0ede4" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="308" y="130" width="130" height="30" fill="#f0ede4" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="438" y="130" width="182" height="30" fill="#f0ede4" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g font-size="11.5" font-weight="bold" fill="#555">
    <text x="58" y="149" text-anchor="middle">i</text>
    <text x="102" y="149" text-anchor="middle">s[i]</text>
    <text x="218" y="149" text-anchor="middle">反向映射</text>
    <text x="373" y="149" text-anchor="middle">下标 k</text>
    <text x="529" y="149" text-anchor="middle">说明</text>
  </g>

  <!-- row 1: i=5 '#' -->
  <g filter="url(#sk)"><rect x="40" y="160" width="36" height="42" fill="#fdfcf7" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="76" y="160" width="52" height="42" fill="#fdfcf7" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="128" y="160" width="180" height="42" fill="#fdfcf7" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="308" y="160" width="130" height="42" fill="#fdfcf7" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="438" y="160" width="182" height="42" fill="#fdfcf7" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <text x="58" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">5</text>
  <text x="102" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">#</text>
  <text x="218" y="186" text-anchor="middle" font-size="11" font-family="monospace" fill="#444">k ≥ L5=3 ⇒ k−=3</text>
  <text x="373" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">3 → 0</text>
  <text x="529" y="186" text-anchor="middle" font-size="10.5" fill="#666">后半副本映回前半</text>

  <!-- row 2: i=4 '*' -->
  <g filter="url(#sk)"><rect x="40" y="202" width="36" height="42" fill="#f7f5ee" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="76" y="202" width="52" height="42" fill="#f7f5ee" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="128" y="202" width="180" height="42" fill="#f7f5ee" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="308" y="202" width="130" height="42" fill="#f7f5ee" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="438" y="202" width="182" height="42" fill="#f7f5ee" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <text x="58" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">4</text>
  <text x="102" y="229" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04040">*</text>
  <text x="218" y="228" text-anchor="middle" font-size="11" font-family="monospace" fill="#444">删末尾 ⇒ 不变</text>
  <text x="373" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">0 → 0</text>
  <text x="529" y="228" text-anchor="middle" font-size="10.5" fill="#666">前面的下标不动</text>

  <!-- row 3: i=3 '#' -->
  <g filter="url(#sk)"><rect x="40" y="244" width="36" height="42" fill="#fdfcf7" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="76" y="244" width="52" height="42" fill="#fdfcf7" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="128" y="244" width="180" height="42" fill="#fdfcf7" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="308" y="244" width="130" height="42" fill="#fdfcf7" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="438" y="244" width="182" height="42" fill="#fdfcf7" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <text x="58" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">3</text>
  <text x="102" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">#</text>
  <text x="218" y="270" text-anchor="middle" font-size="11" font-family="monospace" fill="#444">k &lt; L3=2 ⇒ 不变</text>
  <text x="373" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">0 → 0</text>
  <text x="529" y="270" text-anchor="middle" font-size="10.5" fill="#666">落前半，直接通过</text>

  <!-- row 4: i=2 '%' -->
  <g filter="url(#sk)"><rect x="40" y="286" width="36" height="42" fill="#f7f5ee" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="76" y="286" width="52" height="42" fill="#f7f5ee" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="128" y="286" width="180" height="42" fill="#f7f5ee" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="308" y="286" width="130" height="42" fill="#f7f5ee" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="438" y="286" width="182" height="42" fill="#f7f5ee" stroke="#b8b4a8" stroke-width="1.2"/></g>
  <text x="58" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">2</text>
  <text x="102" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">%</text>
  <text x="218" y="312" text-anchor="middle" font-size="11" font-family="monospace" fill="#444">k ← L2−1−k = 1</text>
  <text x="373" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">0 → 1</text>
  <text x="529" y="312" text-anchor="middle" font-size="10.5" fill="#666">反转 ⇒ 对称位置</text>

  <!-- row 5: i=1 'd' (hit) -->
  <g filter="url(#sk)"><rect x="40" y="328" width="36" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="76" y="328" width="52" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="128" y="328" width="180" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="308" y="328" width="130" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="438" y="328" width="182" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="58" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="102" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">d</text>
  <text x="218" y="354" text-anchor="middle" font-size="11" font-family="monospace" fill="#2e6e2e" font-weight="bold">k == L1=1 ⇒ 命中！</text>
  <text x="373" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1 → 'd'</text>
  <text x="529" y="354" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">返回 'd' ✓</text>

  <!-- bottom: final string -->
  <g filter="url(#sk)">
    <rect x="40" y="388" width="580" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="60" y="420" font-size="11.5" fill="#2e6e2e" font-weight="bold">最终 result =</text>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="160" y="398" width="28" height="30" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="174" y="418" text-anchor="middle" fill="#444">d</text>
    <g filter="url(#sk)"><rect x="192" y="398" width="28" height="30" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="206" y="418" text-anchor="middle" fill="#444">c</text>
    <g filter="url(#sk)"><rect x="224" y="398" width="28" height="30" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="238" y="418" text-anchor="middle" fill="#444">d</text>
    <g filter="url(#sk)"><rect x="256" y="398" width="28" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="270" y="418" text-anchor="middle" fill="#7a5415" font-weight="bold">d</text>
    <g filter="url(#sk)"><rect x="288" y="398" width="28" height="30" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="302" y="418" text-anchor="middle" fill="#444">c</text>
    <g filter="url(#sk)"><rect x="320" y="398" width="28" height="30" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="334" y="418" text-anchor="middle" fill="#444">d</text>
  </g>
  <text x="270" y="437" text-anchor="middle" font-size="9" fill="#c98a2b" font-weight="bold">k=3</text>
  <text x="386" y="418" font-size="11.5" fill="#2e6e2e">第 3 位是 'd' —— 与倒序追踪结果一致 ✓</text>
</svg>
