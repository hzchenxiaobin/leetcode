<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">构造：数位是积木塔，每轮横切一层（n = 324）</text>
  <path d="M 130 42 Q 320 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- bar chart: three towers -->
  <!-- 百位 tower height 3 -->
  <g filter="url(#sk)">
    <rect x="100" y="280" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="125" y="300" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">1</text>
  <g filter="url(#sk)">
    <rect x="100" y="250" width="50" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="125" y="270" text-anchor="middle" font-size="12" fill="#2e5e24" filter="url(#sk)">1</text>
  <g filter="url(#sk)">
    <rect x="100" y="220" width="50" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="125" y="240" text-anchor="middle" font-size="12" fill="#8a6415" filter="url(#sk)">1</text>

  <!-- 十位 tower height 2 -->
  <g filter="url(#sk)">
    <rect x="170" y="280" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="195" y="300" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">1</text>
  <g filter="url(#sk)">
    <rect x="170" y="250" width="50" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="195" y="270" text-anchor="middle" font-size="12" fill="#2e5e24" filter="url(#sk)">1</text>

  <!-- 个位 tower height 4 -->
  <g filter="url(#sk)">
    <rect x="240" y="280" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="265" y="300" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">1</text>
  <g filter="url(#sk)">
    <rect x="240" y="250" width="50" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="265" y="270" text-anchor="middle" font-size="12" fill="#2e5e24" filter="url(#sk)">1</text>
  <g filter="url(#sk)">
    <rect x="240" y="220" width="50" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="265" y="240" text-anchor="middle" font-size="12" fill="#8a6415" filter="url(#sk)">1</text>
  <g filter="url(#sk)">
    <rect x="240" y="190" width="50" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="265" y="210" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">1</text>

  <!-- baseline -->
  <path d="M 80 313 Q 180 319 310 313" stroke="#3a3a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="125" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">百位 3</text>
  <text x="195" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">十位 2</text>
  <text x="265" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">个位 4</text>

  <!-- slice labels -->
  <text x="322" y="210" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">第 4 层 → 001</text>
  <text x="322" y="240" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">第 3 层 → 101</text>
  <text x="322" y="270" text-anchor="start" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">第 2 层 → 111</text>
  <text x="322" y="300" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">第 1 层 → 111</text>

  <!-- right panel: peeling rule -->
  <g filter="url(#sk)">
    <rect x="430" y="64" width="174" height="250" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="517" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e24" filter="url(#sk)">逐层剥离规则</text>
  <text x="517" y="112" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#sk)">第 t 轮：</text>
  <text x="517" y="130" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#sk)">剩余 &gt; 0 的数位放 1</text>
  <text x="517" y="148" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#sk)">否则放 0</text>
  <text x="517" y="166" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#sk)">→ 每座塔各降 1 格</text>
  <text x="517" y="190" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#sk)">每层是合法十-二进制数</text>
  <text x="517" y="214" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#sk)">4 轮后全部清零</text>
  <g filter="url(#sk)">
    <rect x="444" y="228" width="146" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="517" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">轮数 = 最高塔</text>
  <text x="517" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">= 最大数位 4</text>

  <!-- bottom strip -->
  <g filter="url(#sk)">
    <rect x="36" y="352" width="568" height="62" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="320" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">层饼恒等式：每列被切走的层数 = 该数位的值</text>
  <text x="320" y="400" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#sk)">111 + 111 + 101 + 001 = 324，恰用 4 个数 = 最大数位 4</text>
</svg>
