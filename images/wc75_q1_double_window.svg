<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="390" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：一次旋转 = s+s 中一个长度为 n 的窗口</text>

  <text x="232" y="86" text-anchor="end" font-size="14" fill="#2b4a6f" filter="url(#rough2)">s =</text>
  <rect x="240" y="62" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="90" text-anchor="middle" font-size="17" fill="#2b4a6f" filter="url(#rough2)">a</text>
  <rect x="288" y="62" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="90" text-anchor="middle" font-size="17" fill="#2b4a6f" filter="url(#rough2)">b</text>
  <rect x="336" y="62" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="90" text-anchor="middle" font-size="17" fill="#2b4a6f" filter="url(#rough2)">c</text>
  <rect x="384" y="62" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="90" text-anchor="middle" font-size="17" fill="#2b4a6f" filter="url(#rough2)">d</text>
  <rect x="432" y="62" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="456" y="90" text-anchor="middle" font-size="17" fill="#2b4a6f" filter="url(#rough2)">e</text>

  <text x="360" y="130" text-anchor="middle" font-size="12.5" fill="#667" filter="url(#rough2)">双写：t = s + s，长度 2n = 10</text>

  <text x="112" y="172" text-anchor="end" font-size="14" fill="#33604a" filter="url(#rough2)">t =</text>
  <rect x="120" y="148" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="176" text-anchor="middle" font-size="17" fill="#2b4a6f" filter="url(#rough2)">a</text>
  <rect x="168" y="148" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="176" text-anchor="middle" font-size="17" fill="#2b4a6f" filter="url(#rough2)">b</text>
  <rect x="216" y="148" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="176" text-anchor="middle" font-size="17" fill="#8a6a20" filter="url(#rough2)">c</text>
  <rect x="264" y="148" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="176" text-anchor="middle" font-size="17" fill="#8a6a20" filter="url(#rough2)">d</text>
  <rect x="312" y="148" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="176" text-anchor="middle" font-size="17" fill="#8a6a20" filter="url(#rough2)">e</text>
  <rect x="360" y="148" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="176" text-anchor="middle" font-size="17" fill="#33604a" filter="url(#rough2)">a</text>
  <rect x="408" y="148" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="176" text-anchor="middle" font-size="17" fill="#33604a" filter="url(#rough2)">b</text>
  <rect x="456" y="148" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="176" text-anchor="middle" font-size="17" fill="#33604a" filter="url(#rough2)">c</text>
  <rect x="504" y="148" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="528" y="176" text-anchor="middle" font-size="17" fill="#33604a" filter="url(#rough2)">d</text>
  <rect x="552" y="148" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="576" y="176" text-anchor="middle" font-size="17" fill="#33604a" filter="url(#rough2)">e</text>

  <rect x="212" y="142" width="248" height="54" rx="8" fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="336" y="220" text-anchor="middle" font-size="12.5" fill="#8f3b38" filter="url(#rough2)">窗口 p = 2：c d e a b = goal，对应左移 2 位</text>

  <rect x="36" y="240" width="120" height="48" rx="6" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="260" text-anchor="middle" font-size="11.5" fill="#667" filter="url(#rough2)">k = 0</text>
  <text x="96" y="279" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">abcde</text>

  <rect x="168" y="240" width="120" height="48" rx="6" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="228" y="260" text-anchor="middle" font-size="11.5" fill="#667" filter="url(#rough2)">k = 1</text>
  <text x="228" y="279" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">bcdea</text>

  <rect x="300" y="240" width="120" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="260" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">k = 2 ✓</text>
  <text x="360" y="279" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">cdeab</text>

  <rect x="432" y="240" width="120" height="48" rx="6" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="260" text-anchor="middle" font-size="11.5" fill="#667" filter="url(#rough2)">k = 3</text>
  <text x="492" y="279" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">deabc</text>

  <rect x="564" y="240" width="120" height="48" rx="6" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="624" y="260" text-anchor="middle" font-size="11.5" fill="#667" filter="url(#rough2)">k = 4</text>
  <text x="624" y="279" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">eabcd</text>

  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">左移 k 位的 s[k:] + s[:k] 恰好是 t 从下标 k 起的长 n 窗口；k 取 0..n-1 共 n 个</text>
  <text x="360" y="346" text-anchor="middle" font-size="12" fill="#8f3b38" filter="url(#rough2)">注意：t 在 p = n 处还有一个窗口，内容就是 s 本身（即 k = 0），不会多出假候选</text>
  <text x="360" y="372" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">于是「goal 是 s 的旋转」⇔「goal 出现在 t 中」（前提：|s| = |goal|）</text>
</svg>
