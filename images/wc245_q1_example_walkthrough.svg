<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：逐字母计数 → 整除性判定</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: example 1 -->
  <text x="48" y="66" font-size="13" font-weight="bold" fill="#2b2b2b">示例 1</text>
  <text x="104" y="66" font-size="12" fill="#444" font-family="monospace">words = ["abc","aabc","bc"]，n = 3</text>
  <g filter="url(#sk)">
    <rect x="48" y="74" width="90" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="138" y="74" width="62" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="200" y="74" width="62" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="262" y="74" width="62" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="93" y="92" text-anchor="middle" font-size="12" fill="#2b6e9e">串 \ 字母</text>
  <text x="169" y="92" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">a</text>
  <text x="231" y="92" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">b</text>
  <text x="293" y="92" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">c</text>
  <g filter="url(#sk)">
    <rect x="48" y="100" width="90" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="138" y="100" width="62" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="200" y="100" width="62" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="262" y="100" width="62" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
  </g>
  <text x="93" y="118" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">"abc"</text>
  <text x="169" y="118" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <text x="231" y="118" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <text x="293" y="118" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="48" y="126" width="90" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="138" y="126" width="62" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="200" y="126" width="62" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="262" y="126" width="62" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
  </g>
  <text x="93" y="144" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">"aabc"</text>
  <text x="169" y="144" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">2</text>
  <text x="231" y="144" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <text x="293" y="144" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="48" y="152" width="90" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="138" y="152" width="62" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="200" y="152" width="62" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="262" y="152" width="62" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
  </g>
  <text x="93" y="170" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">"bc"</text>
  <text x="169" y="170" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">0</text>
  <text x="231" y="170" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <text x="293" y="170" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="48" y="178" width="90" height="28" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="138" y="178" width="62" height="28" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="200" y="178" width="62" height="28" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="262" y="178" width="62" height="28" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="93" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">总计 total</text>
  <text x="169" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">3</text>
  <text x="231" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">3</text>
  <text x="293" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">3</text>
  <g filter="url(#sk)">
    <rect x="48" y="206" width="90" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="138" y="206" width="62" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="200" y="206" width="62" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="262" y="206" width="62" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="93" y="225" text-anchor="middle" font-size="12" fill="#2e6e2e">判定 % 3</text>
  <text x="169" y="225" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">3%3=0 ✓</text>
  <text x="231" y="225" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">3%3=0 ✓</text>
  <text x="293" y="225" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">3%3=0 ✓</text>
  <g filter="url(#sk)">
    <rect x="48" y="246" width="276" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="186" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">→ return true</text>
  <text x="186" y="282" text-anchor="middle" font-size="10" fill="#666">k_a = k_b = k_c = 1：每串各分 1a 1b 1c，都成 "abc"</text>

  <!-- Panel B: example 2 -->
  <text x="428" y="66" font-size="13" font-weight="bold" fill="#2b2b2b">示例 2</text>
  <text x="484" y="66" font-size="12" fill="#444" font-family="monospace">words = ["ab","a"]，n = 2</text>
  <g filter="url(#sk)">
    <rect x="428" y="74" width="90" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="518" y="74" width="56" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="574" y="74" width="56" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="473" y="92" text-anchor="middle" font-size="12" fill="#2b6e9e">串 \ 字母</text>
  <text x="546" y="92" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">a</text>
  <text x="602" y="92" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">b</text>
  <g filter="url(#sk)">
    <rect x="428" y="100" width="90" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="518" y="100" width="56" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="574" y="100" width="56" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
  </g>
  <text x="473" y="118" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">"ab"</text>
  <text x="546" y="118" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <text x="602" y="118" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="428" y="126" width="90" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="518" y="126" width="56" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="574" y="126" width="56" height="26" rx="4" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1.2"/>
  </g>
  <text x="473" y="144" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">"a"</text>
  <text x="546" y="144" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <text x="602" y="144" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">0</text>
  <g filter="url(#sk)">
    <rect x="428" y="152" width="90" height="28" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="518" y="152" width="56" height="28" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="574" y="152" width="56" height="28" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="473" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">总计 total</text>
  <text x="546" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">2</text>
  <text x="602" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="428" y="180" width="90" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="518" y="180" width="56" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="574" y="180" width="56" height="28" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="473" y="199" text-anchor="middle" font-size="12" fill="#2e6e2e">判定 % 2</text>
  <text x="546" y="199" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">2%2=0 ✓</text>
  <text x="602" y="199" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">1%2=1 ✗</text>
  <g filter="url(#sk)">
    <rect x="428" y="220" width="202" height="72" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="529" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">→ return false</text>
  <text x="529" y="258" text-anchor="middle" font-size="10" fill="#666">b 仅 1 个，无法均分给 2 个串</text>
  <text x="529" y="274" text-anchor="middle" font-size="10" fill="#666">守恒律禁止无中生有</text>

  <!-- Bottom key insight -->
  <g filter="url(#sk)">
    <rect x="48" y="336" width="582" height="52" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="339" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">唯一约束 = 每个字母在所有串中的总数（守恒量，逐列求和即可）</text>
  <text x="339" y="378" text-anchor="middle" font-size="11" fill="#444">每列都能被 n 整除 ⇒ 必能配平并排成同一目标串（§5 引理 3 给出构造）</text>
</svg>
