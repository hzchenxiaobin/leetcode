<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：n = 8，m = 3 → 5 个窗口逐一比对</text>

  <!-- cmp 行 -->
  <text x="118" y="78" text-anchor="end" font-size="12" fill="#d6a040" filter="url(#rough2)">cmp =</text>
  <rect x="131" y="56" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="175" y="56" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="219" y="56" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="263" y="56" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="307" y="56" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="351" y="56" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="395" y="56" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="236" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <text x="280" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="324" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="368" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="412" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>

  <!-- 匹配窗口高亮 -->
  <rect x="125" y="50" width="178" height="46" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="301" y="50" width="134" height="46" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="214" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">窗口 i=0</text>
  <text x="368" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">窗口 i=4</text>

  <!-- 表格：匹配行底色 -->
  <rect x="150" y="146" width="350" height="32" fill="#e6f4ea" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="274" width="350" height="32" fill="#e6f4ea" rx="3" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="150" y="118" width="350" height="28" fill="#f0f0f0" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="230" y1="118" x2="230" y2="306" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="118" x2="400" y2="306" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="118" width="350" height="188" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="150" y1="146" x2="500" y2="146" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="178" x2="500" y2="178" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="210" x2="500" y2="210" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="242" x2="500" y2="242" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="274" x2="500" y2="274" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="315" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">窗口 cmp[i..i+2]</text>
  <text x="450" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">匹配？</text>

  <!-- 表格行 -->
  <text x="190" y="167" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="315" y="167" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1, 0, −1]</text>
  <text x="450" y="167" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="190" y="199" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="315" y="199" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[0, −1, 1]</text>
  <text x="450" y="199" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="190" y="231" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="315" y="231" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[−1, 1, 1]</text>
  <text x="450" y="231" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="190" y="263" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="315" y="263" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1, 1, 0]</text>
  <text x="450" y="263" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="190" y="295" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="315" y="295" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1, 0, −1]</text>
  <text x="450" y="295" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 底部说明 -->
  <text x="280" y="336" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">窗口总数 = n − m = 8 − 3 = 5，其中 2 个与 pattern 全等</text>
  <text x="280" y="364" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 ans = 2，对应子数组 [1,4,4,1] 与 [3,5,5,3]</text>
  <text x="280" y="392" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">逐位比较遇到不等可提前退出（首位不等即剪枝）</text>
</svg>
