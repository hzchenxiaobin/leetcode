<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="79" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1,2,3,4,5]（已排序）</text>
  <path d="M 220 34 Q 360 42 500 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="30" y="48" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="70" y="48" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="140" y="48" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="340" y="48" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="460" y="48" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="610" y="48" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="50" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">j</text>
  <text x="105" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">nums[j]</text>
  <text x="240" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">插入 / 收缩动作</text>
  <text x="400" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">Trie 内容</text>
  <text x="535" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">query(nums[j])</text>
  <text x="650" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">ans</text>

  <!-- 行 0 -->
  <g filter="url(#sk)">
    <rect x="30" y="82" width="40" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="82" width="70" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="140" y="82" width="200" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="340" y="82" width="120" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="460" y="82" width="150" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="610" y="82" width="80" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="50" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">0</text>
  <text x="105" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <text x="240" y="105" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">插入 1</text>
  <text x="400" y="105" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">{1}</text>
  <text x="535" y="105" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">1 ⊕ 1 = 0</text>
  <text x="650" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">0</text>

  <!-- 行 1 -->
  <g filter="url(#sk)">
    <rect x="30" y="120" width="40" height="38" fill="#fdfdf8" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="120" width="70" height="38" fill="#fdfdf8" stroke="#bbb" stroke-width="1"/>
    <rect x="140" y="120" width="200" height="38" fill="#fdfdf8" stroke="#bbb" stroke-width="1"/>
    <rect x="340" y="120" width="120" height="38" fill="#fdfdf8" stroke="#bbb" stroke-width="1"/>
    <rect x="460" y="120" width="150" height="38" fill="#fdfdf8" stroke="#bbb" stroke-width="1"/>
    <rect x="610" y="120" width="80" height="38" fill="#fdfdf8" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="50" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <text x="105" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <text x="240" y="143" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">插入 2（2·1 = 2 ≥ 2）</text>
  <text x="400" y="143" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">{1, 2}</text>
  <text x="535" y="143" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">2 ⊕ 1 = 3</text>
  <text x="650" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#sk)">3</text>

  <!-- 行 2 -->
  <g filter="url(#sk)">
    <rect x="30" y="158" width="40" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="158" width="70" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="140" y="158" width="200" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="340" y="158" width="120" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="460" y="158" width="150" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="610" y="158" width="80" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="50" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <text x="105" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <text x="240" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">插入 3；</text>
  <text x="240" y="190" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#sk)">2·1 = 2 &lt; 3 → 删 1</text>
  <text x="400" y="181" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">{2, 3}</text>
  <text x="535" y="181" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">3 ⊕ 2 = 1</text>
  <text x="650" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>

  <!-- 行 3（高亮） -->
  <g filter="url(#sk)">
    <rect x="30" y="196" width="40" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="70" y="196" width="70" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="140" y="196" width="200" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="340" y="196" width="120" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="460" y="196" width="150" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="610" y="196" width="80" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="50" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#sk)">3</text>
  <text x="105" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#sk)">4</text>
  <text x="240" y="219" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">插入 4（2·2 = 4 ≥ 4）</text>
  <text x="400" y="219" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">{2, 3, 4}</text>
  <text x="535" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#sk)">4 ⊕ 3 = 7 ★</text>
  <text x="650" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a36" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="618" y="201" width="64" height="30" rx="15" fill="none" stroke="#b85450" stroke-width="2"/></g>

  <!-- 行 4 -->
  <g filter="url(#sk)">
    <rect x="30" y="234" width="40" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="234" width="70" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="140" y="234" width="200" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="340" y="234" width="120" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="460" y="234" width="150" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="610" y="234" width="80" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="50" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <text x="105" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">5</text>
  <text x="240" y="250" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">插入 5；</text>
  <text x="240" y="266" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#sk)">2·2 = 4 &lt; 5 → 删 2</text>
  <text x="400" y="257" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">{3, 4, 5}</text>
  <text x="535" y="257" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">5 ⊕ 3 = 6</text>
  <text x="650" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#sk)">7</text>

  <!-- 注解 -->
  <text x="360" y="298" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">答案 7 = 3 ⊕ 4 在 j = 3 产生：窗口 {2, 3, 4} 内任意元素都与 4 构成强数对</text>
  <text x="360" y="320" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#sk)">若 j = 4 时忘了删 2，query(5) 会拿到 5 ⊕ 2 = 7 —— 来自非法对 (2, 5)，且恰好与正解同值，极具迷惑性</text>
</svg>
