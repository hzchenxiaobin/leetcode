<svg xmlns="http://www.w3.org/2000/svg" width="660" height="450" viewBox="0 0 660 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="450" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：三个一维组件，拼出 ans[k]</text>
  <path d="M 150 38 Q 330 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="58" text-anchor="middle" font-size="12" fill="#666">常定性把二维 (k, i) 判定拆成互不相干的三个一维问题</text>

  <g filter="url(#sk)">
    <rect x="30" y="76" width="190" height="196" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="240" y="76" width="190" height="196" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="450" y="76" width="190" height="196" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>

  <text x="125" y="100" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">① Z 函数 → m(k)</text>
  <text x="125" y="122" text-anchor="middle" font-size="11" fill="#2b6e9e">拼接 s ＝ nums ⊕ 0 ⊕ target</text>
  <text x="125" y="140" text-anchor="middle" font-size="11" fill="#2b6e9e">（0 为分隔符，不在值域）</text>
  <text x="125" y="164" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-weight="bold">m(k) ＝ z[n＋1＋k]</text>
  <text x="125" y="184" text-anchor="middle" font-size="11" fill="#2b6e9e">＝ LCP(nums, target[k..])</text>
  <text x="125" y="208" text-anchor="middle" font-size="11" fill="#2b6e9e">＝ nums 与窗口的首失配下标</text>
  <text x="125" y="238" text-anchor="middle" font-size="11" fill="#2b6e9e">截断：hi ＝ min(m(k), n−1)</text>
  <text x="125" y="260" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">一趟 O(n＋m)</text>

  <text x="335" y="100" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">② 非递增段 → s(k)</text>
  <text x="335" y="122" text-anchor="middle" font-size="11" fill="#2e6e2e">start[e] ＝ target[p..e] 保持</text>
  <text x="335" y="140" text-anchor="middle" font-size="11" fill="#2e6e2e">非递增的最小起点 p：</text>
  <text x="335" y="164" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">start[0] ＝ 0</text>
  <text x="335" y="184" text-anchor="middle" font-size="11" fill="#2e6e2e">t[e−1] ≥ t[e] ? start[e−1] : e</text>
  <text x="335" y="208" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">s(k) ＝ max(0, start[k＋n−1] − k)</text>
  <text x="335" y="228" text-anchor="middle" font-size="11" fill="#2e6e2e">＝ 形状条件的下界</text>
  <text x="335" y="260" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">一趟 O(m)</text>

  <text x="545" y="100" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">③ 滑窗频差 → bad(k)</text>
  <text x="545" y="122" text-anchor="middle" font-size="11" fill="#b85450">cnt ＝ 窗口内频次 − nums 频次</text>
  <text x="545" y="140" text-anchor="middle" font-size="11" fill="#b85450">bad ＝ 频差非零的值个数</text>
  <text x="545" y="164" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">bad ＝ 0 ⟺ 多重集相等</text>
  <text x="545" y="184" text-anchor="middle" font-size="11" fill="#b85450">⟺ C(k, 0)（常定性实例）</text>
  <text x="545" y="208" text-anchor="middle" font-size="11" fill="#b85450">滑窗：去 target[k]，进 target[k＋n]</text>
  <text x="545" y="228" text-anchor="middle" font-size="11" fill="#b85450">跨越 0 才动 bad（四种转移）</text>
  <text x="545" y="260" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">一趟 O(n＋m＋V)</text>

  <path d="M 125 276 Q 125 300 240 316" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <path d="M 335 276 Q 335 300 335 314" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <path d="M 545 276 Q 545 300 430 316" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="60" y="322" width="540" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="330" y="348" text-anchor="middle" font-size="14" fill="#8a6415" font-weight="bold">ans[k] ＝ bad(k)＝0 ? max(0, hi − s(k) ＋ 1) : 0</text>
  <text x="330" y="374" text-anchor="middle" font-size="11.5" fill="#8a6415">hi ＝ min(m(k), n−1)；区间 [s(k), hi] 内的每个 i 一起生效（常定性保证 C 同真同假）</text>

  <g filter="url(#sk)">
    <rect x="100" y="406" width="460" height="34" rx="8" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.4"/>
  </g>
  <text x="330" y="428" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">总复杂度：时间 O(n＋m＋V)，空间 O(n＋m＋V) —— 全程线性</text>
</svg>
