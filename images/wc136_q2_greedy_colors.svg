<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">每点度 ≤ 3，故 4 种颜色里必有一种可用</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">按编号顺序逐个染色，只看「已染色的邻居」用了哪些颜色</text>

  <circle cx="140" cy="120" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="125" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
  <circle cx="270" cy="120" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" fill="#3a5a30">2</text>
  <circle cx="270" cy="240" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="245" text-anchor="middle" font-size="12" fill="#8a6a20">3</text>
  <circle cx="140" cy="240" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="245" text-anchor="middle" font-size="12" fill="#8a3a36">4</text>

  <path d="M 156 134 L 254 134" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 270 140 L 270 220" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 254 226 L 156 226" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 140 220 L 140 140" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 156 106 L 254 106" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 156 254 L 254 254" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="205" y="100" text-anchor="middle" font-size="10" fill="#888">6 条边 → 每个点度 3</text>

  <rect x="330" y="66" width="200" height="126" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="344" y="86" font-size="11" fill="#3a4a66" font-weight="bold">染色时的局面</text>
  <text x="344" y="108" font-size="10" fill="#555">当前点最多 3 个邻居</text>
  <text x="344" y="128" font-size="10" fill="#555">它们最多占用 3 种颜色</text>
  <text x="344" y="150" font-size="10" fill="#555">4 − 3 = 1 种必空闲</text>
  <text x="344" y="172" font-size="10" fill="#446688">→ 贪心永不失败</text>

  <rect x="330" y="206" width="200" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="344" y="226" font-size="11" fill="#3a5a30" font-weight="bold">为什么不需要回溯？</text>
  <text x="344" y="248" font-size="10" fill="#555">前面染好的颜色不会被改动，</text>
  <text x="344" y="266" font-size="10" fill="#555">当前点一定存在合法选择，</text>
  <text x="344" y="284" font-size="10" fill="#555">故整个序列一次扫完即可。</text>

  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#999">本题的图是 4 色可着色的（度 ≤ 3 ⇒ 由 Brooks 定理 3 色足够，4 色更宽松）</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#999">greedy 只需「已染色邻居的颜色集合」，无需存整张邻接矩阵之外的结构</text>
<text x="280" y="374" text-anchor="middle" font-size="10" fill="#999">时间复杂度 O(n + |paths|)，空间 O(n + |paths|)</text>
</svg>
