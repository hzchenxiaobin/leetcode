<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：pre 增量递推，右侧和 = total − pre</text>

  <!-- 数组条 -->
  <g filter="url(#rough2)">
    <rect x="60" y="58" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="136" y="58" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="212" y="58" width="72" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="288" y="58" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="364" y="58" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="440" y="58" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="96" y="85">2</text><text x="172" y="85">5</text>
    <text x="248" y="85" font-weight="bold" fill="#7a5c1e">9</text>
    <text x="324" y="85">5</text><text x="400" y="85">3</text><text x="476" y="85">…</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="96" y="116">i=0</text><text x="172" y="116">i=1</text>
    <text x="248" y="116">i=2（当前）</text><text x="324" y="116">i=3</text>
    <text x="400" y="116">i=4</text><text x="476" y="116">i=5</text>
  </g>

  <!-- 左侧括线：pre -->
  <path d="M 60 140 Q 248 158 436 140" stroke="#4a7a3a" fill="none" stroke-width="2" filter="url(#rough2)"/>
  <text x="248" y="176" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">pre = 2+5+3+9+5 = 24（右侧新增 nums[4]=5 增量而来）</text>

  <!-- 右侧括线：total − pre -->
  <path d="M 452 200 Q 480 216 508 200" stroke="#b85450" fill="none" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="234" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">右和 3</text>

  <!-- 公式框 -->
  <rect x="50" y="256" width="460" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">diff = | ⌊pre / (i+1)⌋ − ⌊(total − pre) / (n−i−1)⌋ |</text>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">每个下标 O(1) 算出，总复杂度从 O(n²) 降到 O(n)</text>

  <!-- 提示 -->
  <rect x="50" y="312" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">i = n−1 时右半为空：右均值按题意取 0（除零防护）</text>
</svg>
