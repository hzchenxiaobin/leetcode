<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：开工时刻 T&#8202;ⱼ 一确定，整条时刻表就被前缀和「锁死」</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 巫师流水线 -->
  <text x="56" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">药水 j</text>
  <path d="M 78 68 L 104 68" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <g stroke="#446688" stroke-width="1.6" fill="#e8f0fe">
      <rect x="110" y="48" width="76" height="40" rx="8"/>
      <rect x="240" y="48" width="76" height="40" rx="8"/>
      <rect x="370" y="48" width="76" height="40" rx="8"/>
      <rect x="500" y="48" width="76" height="40" rx="8"/>
    </g>
  </g>
  <g font-size="13" fill="#2b4a6b" text-anchor="middle" font-weight="bold">
    <text x="148" y="65">巫师 0</text><text x="278" y="65">巫师 1</text>
    <text x="408" y="65">巫师 2</text><text x="538" y="65">巫师 3</text>
  </g>
  <g font-size="10.5" fill="#6b83a0" text-anchor="middle">
    <text x="148" y="81">skill=1</text><text x="278" y="81">skill=5</text>
    <text x="408" y="81">skill=2</text><text x="538" y="81">skill=4</text>
  </g>
  <g stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)">
    <path d="M 188 68 L 236 68"/>
    <path d="M 318 68 L 366 68"/>
    <path d="M 448 68 L 496 68"/>
  </g>
  <text x="320" y="118" text-anchor="middle" font-size="12.5" fill="#666">一到就开工、完工即交棒 —— 每段耗时 time&#8202;ᵢⱼ = skill[i] × mana[j]，全程零等待</text>

  <!-- 刚性时间条 -->
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="109" y="152">巫师 0</text><text x="224" y="152">巫师 1</text>
    <text x="358" y="152">巫师 2</text><text x="473" y="152">巫师 3</text>
  </g>
  <g filter="url(#sk)">
    <g stroke="#446688" stroke-width="1.6">
      <rect x="90" y="160" width="38" height="36" rx="3" fill="#e8f0fe"/>
      <rect x="128" y="160" width="192" height="36" rx="3" fill="#dbe7fa"/>
      <rect x="320" y="160" width="77" height="36" rx="3" fill="#e8f0fe"/>
      <rect x="397" y="160" width="153" height="36" rx="3" fill="#dbe7fa"/>
    </g>
    <path d="M 128 158 L 128 198 M 320 158 L 320 198 M 397 158 L 397 198" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="11.5" fill="#2b4a6b" text-anchor="middle" font-weight="bold">
    <text x="109" y="182">1·m&#8202;ⱼ</text><text x="224" y="182">5·m&#8202;ⱼ</text>
    <text x="358" y="182">2·m&#8202;ⱼ</text><text x="473" y="182">4·m&#8202;ⱼ</text>
  </g>
  <text x="90" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">T&#8202;ⱼ（开工）</text>
  <text x="552" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">T&#8202;ⱼ + P[n]·m&#8202;ⱼ（完成）</text>
  <text x="320" y="240" text-anchor="middle" font-size="11" fill="#888">段宽 ∝ skill[i]；P[i] = skill[0..i−1] 之和（前缀和），相邻边界之差 = skill[i]·m&#8202;ⱼ</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="90" y="264" width="460" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">时刻表刚性：药水 j 在巫师 i 的区间 = [ T&#8202;ⱼ + P[i]·m&#8202;ⱼ ,  T&#8202;ⱼ + P[i+1]·m&#8202;ⱼ ]</text>
  <text x="320" y="320" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a05a20">⇒ 整条流水线只剩一个自由度：开工时刻 T&#8202;ⱼ</text>

  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#888">P[0] = 0，P[i+1] = P[i] + skill[i]；m&#8202;ⱼ = mana[j]；调整 T&#8202;ⱼ = 整体平移这张时刻表</text>
  <text x="320" y="390" text-anchor="middle" font-size="11" fill="#888">优化目标从「安排 n×m 段工作」坍缩成「决定 m 个开工时刻」</text>
</svg>
