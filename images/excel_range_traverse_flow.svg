<svg xmlns="http://www.w3.org/2000/svg" width="560" height="620" viewBox="0 0 560 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="620" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：外层枚举列 col，内层枚举行 row</text>
  <path d="M 170 40 Q 280 48 390 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="200" cy="52" rx="34" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="200" y="57" text-anchor="middle" font-size="14" fill="#2b4a1e" filter="url(#sk)">开始</text>

  <!-- box1 parse -->
  <g filter="url(#sk)">
    <rect x="120" y="84" width="160" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="105" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">解析 s[0] s[1] s[3] s[4]</text>

  <!-- box2 col init -->
  <g filter="url(#sk)">
    <rect x="120" y="136" width="160" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="157" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">col ← s[0]</text>

  <!-- diamond1 col <= s[3] ? -->
  <g filter="url(#sk)">
    <polygon points="200,178 255,208 200,238 145,208" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="200" y="213" text-anchor="middle" font-size="13" fill="#6b4a10" filter="url(#sk)">col ≤ s[3] ?</text>

  <!-- box3 row init -->
  <g filter="url(#sk)">
    <rect x="120" y="262" width="160" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="283" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">row ← s[1]</text>

  <!-- diamond2 row <= s[4] ? -->
  <g filter="url(#sk)">
    <polygon points="200,304 255,334 200,364 145,334" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="200" y="339" text-anchor="middle" font-size="13" fill="#6b4a10" filter="url(#sk)">row ≤ s[4] ?</text>

  <!-- box4 append (emphasis) -->
  <g filter="url(#sk)">
    <rect x="110" y="388" width="180" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="200" y="411" text-anchor="middle" font-size="13" font-weight="bold" fill="#833" filter="url(#sk)">追加 col + row 到 ans</text>

  <!-- box5 row++ -->
  <g filter="url(#sk)">
    <rect x="120" y="444" width="160" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="465" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">row ← row + 1</text>

  <!-- col+1 box (right) -->
  <g filter="url(#sk)">
    <rect x="355" y="318" width="120" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="415" y="339" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">col ← col + 1</text>

  <!-- end -->
  <g filter="url(#sk)">
    <ellipse cx="200" cy="568" rx="44" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="200" y="573" text-anchor="middle" font-size="13" fill="#2b4a1e" filter="url(#sk)">返回 ans 结束</text>

  <!-- note box top right -->
  <g filter="url(#sk)">
    <rect x="350" y="80" width="170" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="12" fill="#2b4a1e" text-anchor="middle">
    <text x="435" y="108">外层列固定时，</text>
    <text x="435" y="128">内层行从 r1 扫到 r2；</text>
    <text x="435" y="148">扫完一列换下一列</text>
  </g>

  <!-- main flow arrows -->
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 200 69 V 80" marker-end="url(#ar)"/>
    <path d="M 200 116 V 132" marker-end="url(#ar)"/>
    <path d="M 200 168 V 174" marker-end="url(#ar)"/>
    <path d="M 200 238 V 258" marker-end="url(#ar)"/>
    <path d="M 200 294 V 300" marker-end="url(#ar)"/>
    <path d="M 200 364 V 384" marker-end="url(#ar)"/>
    <path d="M 200 424 V 440" marker-end="url(#ar)"/>
    <!-- row loop back: box5 left -> diamond2 left vertex -->
    <path d="M 120 460 H 95 V 334 H 141" marker-end="url(#ar)"/>
    <!-- diamond2 N -> col+1 box -->
    <path d="M 255 334 H 351" marker-end="url(#ar)"/>
    <!-- col+1 box top -> diamond1 right vertex (re-test col) -->
    <path d="M 415 318 V 208 H 259" marker-end="url(#ar)"/>
    <!-- diamond1 N -> end -->
    <path d="M 145 208 H 78 V 568 H 152" marker-end="url(#ar)"/>
  </g>

  <!-- labels -->
  <g filter="url(#sk)" font-size="12" fill="#666">
    <text x="208" y="234">Y</text>
    <text x="208" y="360">Y</text>
    <text x="268" y="328">N</text>
    <text x="128" y="200">N</text>
  </g>
  <text x="98" y="404" font-size="10" fill="#888" filter="url(#sk)">行循环</text>
  <text x="424" y="262" font-size="10" fill="#888" filter="url(#sk)">列循环</text>
</svg>
