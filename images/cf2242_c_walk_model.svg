<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="452" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把操作序列画成折线：只有谷底 M 与终点 S 有用</text>
  <path d="M 186 42 Q 380 49 574 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <path d="M 88 108 L 88 386" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 88 240 L 520 240" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <text x="78" y="112" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">S</text>
  <text x="86" y="234" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="110" y="100" font-size="11" fill="#999" filter="url(#rough2)">横轴 = 操作序号（+1 复制 / −1 删除）</text>

  <!-- 折线 0,-1,-2,-3,-2,-1,0,+1,+2 -->
  <path d="M 100 240 L 150 273 L 200 306 L 250 339 L 300 306 L 350 273 L 400 240 L 450 207 L 500 174"
        stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <circle cx="100" cy="240" r="3.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="150" cy="273" r="3.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="200" cy="306" r="3.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="250" cy="339" r="5.4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="300" cy="306" r="3.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="350" cy="273" r="3.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="400" cy="240" r="3.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="450" cy="207" r="3.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="500" cy="174" r="5.4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="252" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">谷底 M = −3</text>
  <text x="486" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">终点 S = +2</text>
  <text x="100" y="228" font-size="11" fill="#446688" filter="url(#rough2)">起点</text>
  <text x="152" y="268" font-size="11" fill="#777" filter="url(#rough2)">−1</text>
  <text x="202" y="301" font-size="11" fill="#777" filter="url(#rough2)">−2</text>
  <text x="452" y="200" font-size="11" fill="#777" filter="url(#rough2)">+1</text>

  <!-- 右侧公式卡 -->
  <rect x="534" y="72" width="196" height="92" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="94" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">谁还活着</text>
  <text x="550" y="118" font-size="12" fill="#2f4a66" filter="url(#rough2)">c_v + M ≥ 1 才存活</text>
  <text x="550" y="140" font-size="12" fill="#2f4a66" filter="url(#rough2)">存活值计数 = c_v + S</text>
  <text x="550" y="158" font-size="10.5" fill="#5b7896" filter="url(#rough2)">死掉的值永不复生</text>

  <rect x="534" y="176" width="196" height="86" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="198" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">数组长度</text>
  <text x="550" y="222" font-size="12" fill="#3c5e2e" filter="url(#rough2)">L = m′·S + P</text>
  <text x="550" y="244" font-size="10.5" fill="#547844" filter="url(#rough2)">m′ = 存活个数，P = 存活计数和</text>

  <rect x="534" y="274" width="196" height="106" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="550" y="296" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">反解 S</text>
  <text x="550" y="320" font-size="12" fill="#8a6015" filter="url(#rough2)">S = (k − P) / m′</text>
  <text x="550" y="342" font-size="12" fill="#8a6015" filter="url(#rough2)">须整除，且 S ≥ 1 − min c</text>
  <text x="550" y="364" font-size="10.5" fill="#9a7a33" filter="url(#rough2)">min c 取存活值里的最小计数</text>

  <!-- 底部结论 -->
  <rect x="46" y="396" width="668" height="44" rx="9" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="423" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">存活集合只由 M 决定：取遍 M 就得到至多「不同计数个数」种集合，逐种解 S 即可</text>
</svg>
