<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：无向化 + 一次遍历累加标记 w</text>
  <text x="360" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">核心手法：把「改哪条边」变成「沿父边往下走时要不要付 1 的代价」</text>

  <rect x="60" y="64" width="600" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="78" y="86" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 建图：一条路线拆成两条带标记的无向边</text>
  <text x="78" y="108" font-size="10.5" fill="#555" filter="url(#rough2)">对 connections[i] = [a, b]，即原方向 a→b：</text>
  <text x="98" y="126" font-size="10.5" fill="#555" filter="url(#rough2)">g[a] 中加入 (b, w = 1)　　// 从 a 走向 b 与箭头同向，是「背离 0」，要走就得翻转</text>
  <text x="98" y="143" font-size="10.5" fill="#555" filter="url(#rough2)">g[b] 中加入 (a, w = 0)　　// 从 b 走向 a 与箭头反向，已经是「指向 0」，免费</text>

  <path d="M 360 152 L 360 174" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="178" width="600" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="78" y="200" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 从 0 出发遍历（迭代式 DFS 或 BFS），只统计、不改图</text>
  <text x="78" y="222" font-size="10.5" fill="#555" filter="url(#rough2)">vis[0] = true，栈 = [0]，ans = 0</text>
  <text x="78" y="242" font-size="10.5" fill="#555" filter="url(#rough2)">弹出 u；对每条邻接边 (v, w)：</text>
  <text x="98" y="261" font-size="10.5" fill="#555" filter="url(#rough2)">若 vis[v] 已为真 → 这是回头边（v 是 u 的父节点），跳过</text>
  <text x="98" y="280" font-size="10.5" fill="#555" filter="url(#rough2)">若 vis[v] 为假 → vis[v] = true，ans += w，把 v 入栈（v 是 u 的孩子）</text>

  <path d="M 360 298 L 360 318" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="322" width="600" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="78" y="342" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 遍历结束后返回 ans</text>
  <text x="78" y="360" font-size="10.5" fill="#555" filter="url(#rough2)">树中每个点只有一条父边，n−1 条边各被「父 → 子」访问一次，ans 即背离 0 的边数</text>

  <text x="360" y="394" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">复杂度 O(n) 时间、O(n) 空间；n ≤ 5×10⁴，一次线性遍历即可</text>
  <text x="360" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">若把 w 写反，结果会变成 (n−1) − 正确答案，这也是最常见的 WA 来源</text>
</svg>
