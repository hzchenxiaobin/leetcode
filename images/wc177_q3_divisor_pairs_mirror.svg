<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">因数对关于 √m 镜像：越靠近 √m，两数越接近</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk2)">以 m = 1000 为例（num = 999 时的 num+1），8 组因数对全在图上，d 从 1 递增到 25</text>
  <path d="M 120 60 Q 360 70 600 60" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- diff column header -->
  <text x="96" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#sk2)">差 m/d − d</text>

  <!-- mirror axis -->
  <path d="M 360 92 L 360 336" stroke="#b85450" stroke-width="1.4" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <text x="360" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk2)">√1000 ≈ 31.62（镜像轴）</text>

  <!-- rows: connector lines first -->
  <path d="M 205 100 L 508 100" stroke="#cfcfcf" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 225 128 L 492 128" stroke="#cfcfcf" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 247 156 L 470 156" stroke="#cfcfcf" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 263 184 L 454 184" stroke="#cfcfcf" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 283 212 L 434 212" stroke="#cfcfcf" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 295 240 L 422 240" stroke="#cfcfcf" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 323 268 L 394 268" stroke="#cfcfcf" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 331 296 L 386 296" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#sk)"/>

  <!-- diff values -->
  <text x="96" y="104" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#sk2)">999</text>
  <text x="96" y="132" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#sk2)">498</text>
  <text x="96" y="160" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#sk2)">246</text>
  <text x="96" y="188" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#sk2)">195</text>
  <text x="96" y="216" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#sk2)">117</text>
  <text x="96" y="244" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#sk2)">90</text>
  <text x="96" y="272" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#sk2)">30</text>
  <text x="96" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">15</text>

  <!-- row 0 -->
  <g filter="url(#sk2)"><rect x="175" y="86" width="32" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="191" y="105" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">1</text>
  <text x="530" y="105" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#sk2)">1000</text>
  <!-- row 1 -->
  <g filter="url(#sk2)"><rect x="195" y="114" width="32" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="211" y="133" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">2</text>
  <text x="510" y="133" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#sk2)">500</text>
  <!-- row 2 -->
  <g filter="url(#sk2)"><rect x="217" y="142" width="32" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="233" y="161" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">4</text>
  <text x="488" y="161" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#sk2)">250</text>
  <!-- row 3 -->
  <g filter="url(#sk2)"><rect x="233" y="170" width="32" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="249" y="189" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">5</text>
  <text x="472" y="189" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#sk2)">200</text>
  <!-- row 4 -->
  <g filter="url(#sk2)"><rect x="253" y="198" width="32" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="269" y="217" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">8</text>
  <text x="452" y="217" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#sk2)">125</text>
  <!-- row 5 -->
  <g filter="url(#sk2)"><rect x="265" y="226" width="32" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="281" y="245" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">10</text>
  <text x="440" y="245" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#sk2)">100</text>
  <!-- row 6 -->
  <g filter="url(#sk2)"><rect x="293" y="254" width="32" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="309" y="273" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">20</text>
  <text x="412" y="273" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#sk2)">50</text>
  <!-- row 7 : winner -->
  <g filter="url(#sk2)"><rect x="301" y="282" width="32" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="317" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">25</text>
  <text x="404" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">40</text>

  <!-- side labels -->
  <text x="200" y="332" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk2)">d ≤ √m 一侧（小因数，逐个枚举）</text>
  <text x="520" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk2)">m/d ≥ √m 一侧（配对得到，无需枚举）</text>

  <!-- notes -->
  <g filter="url(#sk2)"><rect x="44" y="348" width="632" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="360" y="370" text-anchor="middle" font-size="12.5" fill="#2e5e22" filter="url(#sk2)">差 m/d − d 随 d 增大而单调递减 ⇒ 只需在 d ≤ √m 中找「最大的因数」，配对即最优</text>
  <g filter="url(#sk2)"><rect x="44" y="392" width="632" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="360" y="413" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk2)">m = 1000 时 25 是 ≤ 31.62 的最大因数 → 得到 (25, 40)；num+2 = 1001 再算一次，取差更小者</text>
</svg>
