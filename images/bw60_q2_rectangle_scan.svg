<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：每个农场组都是矩形 ⇒ 左上角唯一可辨</text>

  <!-- 左：合法地图 -->
  <text x="140" y="64" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">题目保证的合法地图</text>
  <g filter="url(#rough2)">
    <!-- 网格背景 -->
    <g stroke="#ddd" stroke-width="1">
      <line x1="40" y1="96" x2="256" y2="96"/><line x1="40" y1="136" x2="256" y2="136"/>
      <line x1="40" y1="176" x2="256" y2="176"/><line x1="40" y1="216" x2="256" y2="216"/>
      <line x1="40" y1="256" x2="256" y2="256"/><line x1="40" y1="296" x2="256" y2="296"/>
      <line x1="40" y1="96" x2="40" y2="296"/><line x1="80" y1="96" x2="80" y2="296"/>
      <line x1="120" y1="96" x2="120" y2="296"/><line x1="160" y1="96" x2="160" y2="296"/>
      <line x1="200" y1="96" x2="200" y2="296"/><line x1="256" y1="96" x2="256" y2="296"/>
    </g>
    <!-- 农场组 1：单格 (0,0) -->
    <rect x="41" y="97" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <!-- 农场组 2：2×2 (1,1)-(2,2) -->
    <rect x="121" y="177" width="78" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="60" y="120">1</text>
    <text x="160" y="216">1 1</text><text x="160" y="256">1 1</text>
  </g>
  <!-- 左上角标记 -->
  <g filter="url(#rough2)">
    <circle cx="41" cy="97" r="7" fill="#b85450"/>
    <circle cx="121" cy="177" r="7" fill="#b85450"/>
  </g>
  <text x="140" y="324" font-size="12" fill="#8a3a34" filter="url(#rough2)" text-anchor="middle">红点 = 左上角（上方、左侧都不是农场）</text>
  <text x="140" y="344" font-size="12" fill="#666" filter="url(#rough2)" text-anchor="middle">组互不相邻 ⇒ 不会误判</text>
  <text x="140" y="368" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)" text-anchor="middle">输出：[[0,0,0,0],[1,1,2,2]]</text>

  <!-- 右：判据 -->
  <text x="420" y="64" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">左上角判据（无需访问标记）</text>
  <g filter="url(#rough2)">
    <rect x="316" y="84" width="208" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#33506e">
    <text x="420" y="110" text-anchor="middle" font-weight="bold">land[i][j] == 1，且</text>
    <text x="420" y="132" text-anchor="middle">i == 0 或 land[i−1][j] == 0</text>
    <text x="420" y="152" text-anchor="middle">j == 0 或 land[i][j−1] == 0</text>
    <text x="420" y="172" text-anchor="middle">⇒ (i, j) 是某个组的左上角</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="316" y="200" width="208" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="420" y="224" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)" text-anchor="middle">找到左上角后</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22">
    <text x="420" y="246" text-anchor="middle">向下走到底 → r2（首个下方为 0）</text>
    <text x="420" y="266" text-anchor="middle">向右走到边 → c2（首个右侧为 0）</text>
    <text x="420" y="286" text-anchor="middle">矩形保证 ⇒ 行列独立探测即可</text>
  </g>
  <rect x="316" y="306" width="208" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="330" font-size="12" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)" text-anchor="middle">免 DFS/BFS：不修改输入、无递归栈</text>
  <text x="420" y="352" font-size="12" fill="#7a5c1e" filter="url(#rough2)" text-anchor="middle">每格至多被看常数次，O(mn) 且常数极小</text>
</svg>
