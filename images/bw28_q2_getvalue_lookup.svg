<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="251"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">查询回放：getValue(3,1) 逆序翻日记，最新覆盖者胜出</text>

  <!-- 矩形坐标示意：4x3 -->
  <text x="60" y="62" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">矩阵（4 行 × 3 列）</text>
  <g filter="url(#rough2)">
    <rect x="80" y="74" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="132" y="74" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="184" y="74" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>

    <rect x="80" y="112" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="132" y="112" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="184" y="112" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>

    <rect x="80" y="150" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="132" y="150" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="184" y="150" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>

    <rect x="80" y="188" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <rect x="132" y="188" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="184" y="188" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
  </g>
  <text y="102" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="106">5</tspan><tspan x="158">5</tspan><tspan x="210">5</tspan></text>
  <text y="140" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="106">5</tspan><tspan x="158">5</tspan><tspan x="210">5</tspan></text>
  <text y="178" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="106">5</tspan><tspan x="158">5</tspan><tspan x="210">5</tspan></text>
  <text y="216" font-size="12" fill="#8a6a20" font-weight="bold" text-anchor="middle" filter="url(#rough2)"><tspan x="106">10</tspan><tspan x="158">10</tspan><tspan x="210">10</tspan></text>
  <text x="244" y="212" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 问 (3,1)</text>

  <!-- 日记栈 -->
  <text x="330" y="62" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">历史日记（自上而下 = 由新到旧）</text>
  <g filter="url(#rough2)">
    <rect x="330" y="74" width="190" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="330" y="120" width="190" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
  </g>
  <text x="425" y="99" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最新:②(3,0,3,2,10)</text>
  <text x="425" y="145" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">较旧:①(0,0,3,2,5)</text>

  <path d="M 330 94 Q 280 94 240 108" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 覆盖 (3,1)？是！</text>
  <text x="425" y="176" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 返回 10，不再往下翻</text>

  <!-- 另一查询 -->
  <rect x="55" y="240" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="72" y="262" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">对照 getValue(0,2)：② 是 (3,0)-(3,2) 不含第 0 行 → 翻到 ① (0,0,3,2,5) → 命中 → 返回 5</text>
  <text x="72" y="282" font-size="11" fill="#555" filter="url(#rough2)">若整本日记都翻完还没有覆盖者，说明该格从未被更新，答案就是初始矩阵的值</text>

  <text x="60" y="322" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">矩形覆盖判定：row1 ≤ row ≤ row2 且 col1 ≤ col ≤ col2（闭区间，两端都含）</text>
  <text x="60" y="342" font-size="11" fill="#555" filter="url(#rough2)">题目保证 row1 ≤ row2、col1 ≤ col2，故无需归一化端点顺序</text>
</svg>
