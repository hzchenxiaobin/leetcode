<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="187"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">按频次装桶：整桶取 × v^c，边界桶 × C(c,t) · v^t</text>

  <!-- 频次阶梯 -->
  <g filter="url(#rough2)">
    <text x="70" y="66" text-anchor="end" font-size="12.5" fill="#555">频次降序</text>
    <!-- 桶1: 频次3 -->
    <rect x="92" y="46" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="120" y="71" text-anchor="middle" font-size="15" fill="#333">3</text>
    <!-- 桶2: 频次2 x2 -->
    <rect x="156" y="46" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="184" y="71" text-anchor="middle" font-size="15" fill="#333">2</text>
    <rect x="220" y="46" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="248" y="71" text-anchor="middle" font-size="15" fill="#333">2</text>
    <!-- 桶3: 频次1 x3 -->
    <rect x="284" y="46" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="312" y="71" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="348" y="46" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="376" y="71" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="412" y="46" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="440" y="71" text-anchor="middle" font-size="15" fill="#333">1</text>

    <text x="120" y="104" text-anchor="middle" font-size="10.5" fill="#446688">c=1</text>
    <text x="204" y="104" text-anchor="middle" font-size="10.5" fill="#4a7a3a">c=2（同频一桶）</text>
    <text x="376" y="104" text-anchor="middle" font-size="10.5" fill="#d6a040">c=3（同频一桶）</text>
  </g>

  <!-- k 名额线 -->
  <g filter="url(#rough2)">
    <path d="M 92 120 C 200 112, 300 112, 380 120" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="7 4"/>
    <text x="500" y="116" font-size="12" fill="#b85450">k = 4 个名额</text>
    <path d="M 380 118 L 380 130" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)"/>
  </g>

  <!-- 取法标注 -->
  <g filter="url(#rough2)">
    <path d="M 120 118 C 120 136, 150 144, 180 152" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <rect x="92" y="154" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="182" y="176" text-anchor="middle" font-size="12" fill="#446688">整桶取 1 个：贡献 3¹</text>

    <path d="M 204 118 C 210 134, 220 142, 240 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <rect x="200" y="196" width="190" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="295" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a">整桶取 2 个：贡献 2²</text>

    <path d="M 376 132 C 390 148, 420 158, 450 168" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="330" y="240" width="240" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="450" y="262" text-anchor="middle" font-size="12.5" fill="#d6a040">边界桶：剩 1 名额、3 个字符</text>
    <text x="450" y="284" text-anchor="middle" font-size="12.5" fill="#b85450">任选 1 个：C(3,1) · 1¹ = 3 种</text>
  </g>

  <!-- 乘法结构 -->
  <g filter="url(#rough2)">
    <rect x="60" y="308" width="520" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="320" y="330" text-anchor="middle" font-size="13" fill="#4a7a3a">答案 = 3¹ × 2² × C(3,1) × 1¹（两层相乘：选哪些字符 × 每字符选哪个下标）</text>
    <text x="320" y="352" text-anchor="middle" font-size="12" fill="#555">同桶字符频次相同 → 乘积统一为 v^t，只有边界桶产生组合数 C(c,t)</text>
  </g>
</svg>
