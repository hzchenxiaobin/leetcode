<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：目录树 = Trie，每个节点都是「三件套」</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">路径按 / 切段后从根下行；四种操作只是「下行 + 在终点做一件小事」</text>

  <!-- 目录链 -->
  <g filter="url(#rough2)">
    <rect x="44" y="72" width="58" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5"/>
    <rect x="146" y="72" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="248" y="72" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="350" y="72" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="452" y="72" width="58" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="73" y="97" fill="#8a6a20">/</text>
    <text x="175" y="97" fill="#3a4a66">a</text>
    <text x="277" y="97" fill="#3a4a66">b</text>
    <text x="379" y="97" fill="#3a4a66">c</text>
    <text x="481" y="97" fill="#3a5a30">d</text>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 103 91 L 140 91" marker-end="url(#arr)"/>
    <path d="M 205 91 L 242 91" marker-end="url(#arr)"/>
    <path d="M 307 91 L 344 91" marker-end="url(#arr)"/>
    <path d="M 409 91 L 446 91" marker-end="url(#arr)"/>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#777" filter="url(#rough2)">
    <text x="73" y="126">根节点</text>
    <text x="481" y="126">文件（isFile）</text>
  </g>
  <text x="250" y="142" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">a → b → c → d 依次挂在上一级的 ch 里，路径 /a/b/c/d 就是这条链</text>

  <!-- 左卡：节点结构 -->
  <rect x="34" y="160" width="246" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="48" y="182" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">节点 Node：目录与文件同构</text>
  <g font-size="10.5" fill="#555" filter="url(#rough2)">
    <text x="48" y="206">ch : 名字 → 子节点</text>
    <text x="70" y="226">ls 时取它的 key 排序输出</text>
    <text x="48" y="250">content : 字符串，add 追加</text>
    <text x="48" y="274">isFile : 只有文件才为 true</text>
  </g>

  <!-- 右卡：四种操作 -->
  <rect x="294" y="160" width="232" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="306" y="182" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">四种操作 = 一次 walk(path)</text>
  <g font-size="10" fill="#555" filter="url(#rough2)">
    <text x="306" y="206">ls   → 目录：排序列 key</text>
    <text x="330" y="224">文件：只回自身名</text>
    <text x="306" y="246">mkdir→ 缺节点就新建</text>
    <text x="306" y="268">add  → 建文件并追加内容</text>
    <text x="306" y="288">read → 返回 content</text>
  </g>

  <rect x="34" y="308" width="492" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#3a4a66" filter="url(#rough2)">
    <text x="48" y="330">为什么要统一节点？因为终点是文件还是目录，在「下行阶段」并不需要区分：</text>
    <text x="48" y="350">mkdir 只需一路补节点，add 只需在终点打上 isFile 标记并追加内容，逻辑只有一套。</text>
  </g>
</svg>
