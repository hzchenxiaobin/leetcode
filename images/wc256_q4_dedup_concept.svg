<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#fdfcf7"/>
  <text x="440" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：不同位置会「撞车」—— 按「末尾字符」分桶去重</text>
  <path d="M 250 40 Q 440 50 630 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- string display -->
  <text x="356" y="84" text-anchor="end" font-size="14" fill="#445" font-family="monospace">binary =</text>
  <g filter="url(#sk)">
    <rect x="368" y="58" width="40" height="36" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="416" y="58" width="40" height="36" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="464" y="58" width="40" height="36" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="388" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#335" font-family="monospace">1</text>
  <text x="436" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#335" font-family="monospace">0</text>
  <text x="484" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#335" font-family="monospace">1</text>
  <text x="388" y="112" text-anchor="middle" font-size="10.5" fill="#999" font-family="monospace">下标 0</text>
  <text x="436" y="112" text-anchor="middle" font-size="10.5" fill="#999" font-family="monospace">1</text>
  <text x="484" y="112" text-anchor="middle" font-size="10.5" fill="#999" font-family="monospace">2</text>
  <text x="530" y="74" font-size="11.5" fill="#777">同一个字符串可由不同的下标集合产生</text>
  <text x="530" y="94" font-size="11.5" fill="#777">例："1" 可来自 {0}，也可来自 {2}</text>

  <!-- left panel: raw picks -->
  <g filter="url(#sk)">
    <rect x="30" y="132" width="380" height="232" rx="10" fill="#f5f9fd" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="52" y="158" font-size="13.5" font-weight="bold" fill="#2b6e9e">原始：示例 3 的 6 个「好」挑选</text>
  <g filter="url(#sk)">
    <rect x="42" y="224" width="356" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="60" y="186" font-size="12.5" fill="#445" font-family="monospace">{0}</text>
  <text x="150" y="186" font-size="12" fill="#999" font-family="monospace">→</text>
  <text x="176" y="186" font-size="12.5" fill="#445" font-family="monospace">"1"</text>
  <text x="60" y="212" font-size="12.5" fill="#445" font-family="monospace">{1}</text>
  <text x="150" y="212" font-size="12" fill="#999" font-family="monospace">→</text>
  <text x="176" y="212" font-size="12.5" fill="#445" font-family="monospace">"0"</text>
  <text x="60" y="238" font-size="12.5" fill="#445" font-family="monospace">{2}</text>
  <text x="150" y="238" font-size="12" fill="#999" font-family="monospace">→</text>
  <text x="176" y="238" font-size="12.5" fill="#445" font-family="monospace">"1"</text>
  <text x="252" y="238" font-size="11" fill="#b03a3a">撞车！与 {0} 的 "1" 相同</text>
  <text x="60" y="264" font-size="12.5" fill="#445" font-family="monospace">{0,1}</text>
  <text x="150" y="264" font-size="12" fill="#999" font-family="monospace">→</text>
  <text x="176" y="264" font-size="12.5" fill="#445" font-family="monospace">"10"</text>
  <text x="60" y="290" font-size="12.5" fill="#445" font-family="monospace">{0,2}</text>
  <text x="150" y="290" font-size="12" fill="#999" font-family="monospace">→</text>
  <text x="176" y="290" font-size="12.5" fill="#445" font-family="monospace">"11"</text>
  <text x="60" y="316" font-size="12.5" fill="#445" font-family="monospace">{0,1,2}</text>
  <text x="150" y="316" font-size="12" fill="#999" font-family="monospace">→</text>
  <text x="176" y="316" font-size="12.5" fill="#445" font-family="monospace">"101"</text>
  <text x="52" y="348" font-size="10.5" fill="#999">"01" 有前导 0 被过滤；"00"、"001" 同理</text>

  <!-- arrow between panels -->
  <path d="M 416 248 L 454 248" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="435" y="238" text-anchor="middle" font-size="11" fill="#666">去重</text>

  <!-- right panel: dedup & buckets -->
  <g filter="url(#sk)">
    <rect x="470" y="132" width="380" height="232" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="492" y="158" font-size="13.5" font-weight="bold" fill="#2e6e2e">按值去重，再按末位分桶</text>
  <text x="492" y="186" font-size="12" font-weight="bold" fill="#335">以 '1' 结尾 → 计数器 ends1（3 个）</text>
  <g filter="url(#sk)">
    <rect x="492" y="192" width="52" height="24" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/>
    <rect x="550" y="192" width="52" height="24" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/>
    <rect x="608" y="192" width="58" height="24" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="518" y="209" text-anchor="middle" font-size="12.5" fill="#335" font-family="monospace">"1"</text>
  <text x="576" y="209" text-anchor="middle" font-size="12.5" fill="#335" font-family="monospace">"11"</text>
  <text x="637" y="209" text-anchor="middle" font-size="12.5" fill="#335" font-family="monospace">"101"</text>
  <text x="492" y="246" font-size="12" font-weight="bold" fill="#335">以 '0' 结尾 → 计数器 ends0（1 个）＋ 特例</text>
  <g filter="url(#sk)">
    <rect x="492" y="252" width="52" height="24" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/>
    <rect x="550" y="252" width="52" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="518" y="269" text-anchor="middle" font-size="12.5" fill="#335" font-family="monospace">"10"</text>
  <text x="576" y="269" text-anchor="middle" font-size="12.5" fill="#335" font-family="monospace">"0"</text>
  <text x="616" y="269" font-size="10.5" fill="#b03a3a">"0" 不进桶，走 has0 旁路</text>
  <text x="492" y="304" font-size="11" fill="#555">6 次挑选 − 1 次撞车 = 5 个不同值</text>
  <text x="492" y="326" font-size="11" fill="#555">末位只有 0 / 1 两种 → 两个计数器编码全部信息</text>
  <text x="492" y="348" font-size="11" fill="#555">只记「集合大小」，不存字符串本身，空间 O(1)</text>

  <!-- bottom insight -->
  <g filter="url(#sk)">
    <rect x="30" y="378" width="820" height="86" rx="8" fill="#fffdf3" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="52" y="400" font-size="13" font-weight="bold" fill="#b85450">末字符「重挂」（interchange）—— 用 O(1) 状态去重的关键</text>
  <text x="52" y="424" font-size="11.5" fill="#445">好子序列 t = 前缀 s ＋ 末字符 c；扫到 c 时，任何以 c 结尾的 t 都能把末位挪到当前位置，</text>
  <text x="52" y="442" font-size="11.5" fill="#445">串值不变。于是「以当前 c 结尾」的集合恰为 { s + c : s 是合法前缀 }，</text>
  <text x="52" y="460" font-size="11.5" fill="#a05a5a">映射 s ↦ s + c 单射 → 按桶计数天然不重不漏；旧桶整体被新桶覆盖，覆盖式赋值不丢项</text>
</svg>
