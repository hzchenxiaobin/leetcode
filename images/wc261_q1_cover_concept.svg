<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#fafafa"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：最左未覆盖的 X —— 从它开窗，整段跳 3</text>
  <path d="M 230 42 Q 450 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="62" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">它左边全是已搞定的 O，窗口左移纯浪费；开窗 [i, i+2] 右缘最远，顺带消灭右侧最多 2 个 X</text>

  <!-- string cells -->
  <text x="55" y="110" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)">
    <rect x="100" y="90" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="140" y="90" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="180" y="90" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="220" y="90" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="260" y="90" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="300" y="90" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="340" y="90" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="120" y="110" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">O</text>
  <text x="160" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="200" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="240" y="110" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">O</text>
  <text x="280" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="320" y="110" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">O</text>
  <text x="360" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">X</text>

  <!-- leader triangles above cells 1 and 4 -->
  <g filter="url(#rough2)">
    <polygon points="160,78 154,88 166,88" fill="#b85450"/>
    <polygon points="280,78 274,88 286,88" fill="#b85450"/>
  </g>

  <!-- indices -->
  <text x="120" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="160" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="200" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="240" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="280" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="320" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="360" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>

  <!-- window brackets -->
  <g filter="url(#rough2)">
    <rect x="100" y="152" width="120" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <text x="160" y="167" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">[0,2] ✗</text>
  <text x="395" y="167" font-size="10.5" fill="#b85450" filter="url(#rough2)">白盖 0 号 O，右侧还少一格</text>

  <g filter="url(#rough2)">
    <rect x="140" y="184" width="120" height="22" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="200" y="199" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① [1,3]</text>
  <text x="395" y="199" font-size="10.5" fill="#446688" filter="url(#rough2)">从最左 X 开窗，右缘最远</text>

  <g filter="url(#rough2)">
    <rect x="260" y="214" width="120" height="22" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="229" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② [4,6]</text>
  <text x="395" y="229" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">跨 O 一窗带走 X@4、X@6</text>

  <!-- scan panel -->
  <g filter="url(#rough2)">
    <rect x="560" y="78" width="310" height="170" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="715" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">一趟扫描（n = 7）</text>
  <text x="572" y="122" font-size="11" fill="#888" filter="url(#rough2)">i=0：'O' → i += 1</text>
  <text x="572" y="142" font-size="11" fill="#446688" filter="url(#rough2)">i=1：'X' → ans=1，跳到 4</text>
  <text x="572" y="162" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i=4：'X' → ans=2，跳到 7</text>
  <text x="572" y="182" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">i=7 ≥ n → 结束，返回 2</text>
  <text x="572" y="204" font-size="10" fill="#777" filter="url(#rough2)">X@2 在窗口①内、X@6 在窗口②内 ✓</text>

  <!-- observation cards -->
  <g filter="url(#rough2)">
    <rect x="35" y="264" width="270" height="176" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="315" y="264" width="270" height="176" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="595" y="264" width="270" height="176" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="170" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">① 最左 X：硬需求 + 右缘最远</text>
  <text x="52" y="320" font-size="11.5" fill="#333" filter="url(#rough2)">· 某个窗口必须罩住最左未覆盖 X</text>
  <text x="52" y="340" font-size="11.5" fill="#333" filter="url(#rough2)">· 它左侧全是 O / 已覆盖 → 左移浪费</text>
  <text x="52" y="360" font-size="11.5" fill="#333" filter="url(#rough2)">· 从它开窗 [i, i+2]：右缘推最远</text>
  <text x="52" y="380" font-size="11.5" fill="#333" filter="url(#rough2)">· 交换论证：最优窗口可换成它</text>
  <text x="170" y="416" text-anchor="middle" font-size="10.5" fill="#667" filter="url(#rough2)">覆盖需求逐个击破 → 归纳即贪心</text>

  <text x="450" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 窗口可跨 O（审题！）</text>
  <text x="332" y="320" font-size="11.5" fill="#333" filter="url(#rough2)">· 题面：已是 'O' 的字符保持不变</text>
  <text x="332" y="340" font-size="11.5" fill="#333" filter="url(#rough2)">· 窗口混着 O 完全合法，X 无需连续</text>
  <text x="332" y="360" font-size="11.5" fill="#333" filter="url(#rough2)">· ✗ 按 X 连续段算 ceil(段长/3)</text>
  <text x="332" y="380" font-size="11.5" fill="#333" filter="url(#rough2)">· "XOX"：分段给 2，实际 1 窗搞定</text>
  <text x="450" y="416" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">窗口盖的是「位置」，不是「X 段」</text>

  <text x="730" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">③ 跳 3：一窗带走三格</text>
  <text x="612" y="320" font-size="11.5" fill="#333" filter="url(#rough2)">· 窗口 [i, i+2] → 从 i+3 重新找 X</text>
  <text x="612" y="340" font-size="11.5" fill="#333" filter="url(#rough2)">· ✗ 逐格推进："XXXX" 会给 4</text>
  <text x="612" y="360" font-size="11.5" fill="#333" filter="url(#rough2)">· ✓ 跳 3：2 次 —— 整段跳过</text>
  <text x="612" y="380" font-size="11.5" fill="#333" filter="url(#rough2)">· 右端越界时钳制为 [n−3, n−1]</text>
  <text x="730" y="416" text-anchor="middle" font-size="10.5" fill="#776" filter="url(#rough2)">计数不变，代码零特判</text>

  <text x="450" y="462" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">本质：用最少的长度 3 区间覆盖所有 X 的位置 —— 固定长度区间覆盖贪心的最简形态</text>
</svg>
