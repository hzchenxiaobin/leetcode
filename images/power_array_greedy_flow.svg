<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：15 轮逐位贪心（b = 14 → 0）</text>
  <path d="M 260 42 Q 470 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- main loop label -->
  <g filter="url(#sk)">
    <rect x="60" y="62" width="400" height="464" rx="10" fill="none" stroke="#7a9ec2" stroke-width="1.4" stroke-dasharray="7 5"/>
  </g>
  <text x="90" y="86" font-size="12" font-weight="bold" fill="#2b6e9e">for b = 14 down to 0：</text>

  <!-- step 1: count -->
  <g filter="url(#sk)">
    <rect x="90" y="102" width="340" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="260" y="126" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">① 遍历全部元素</text>
  <text x="260" y="146" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">统计各块 cnt[j]（第 b 位=1）与 size[j]</text>

  <path d="M 260 158 L 260 180" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2: prefix full -->
  <g filter="url(#sk)">
    <rect x="90" y="184" width="340" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="260" y="208" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">② 前缀满判定</text>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">full[j] = 块 0..j 是否整体 ⊆ B_b</text>

  <path d="M 260 240 L 260 262" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3: max candidate -->
  <g filter="url(#sk)">
    <rect x="90" y="266" width="340" height="62" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="260" y="290" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">③ 求最大候选（取最深并列块 j*）</text>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace" font-weight="bold">m = max{ cp[j] + cnt[j] : full[j−1] }</text>

  <path d="M 260 328 L 260 350" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 4: record -->
  <g filter="url(#sk)">
    <rect x="90" y="354" width="340" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="260" y="378" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">④ 记录答案</text>
  <text x="260" y="397" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">power[14 − b] = m</text>

  <path d="M 260 406 L 260 428" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <path d="M 260 432 L 380 480 L 260 528 L 140 480 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="262" y="474" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">m 严格落在</text>
  <text x="262" y="492" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">块 j* 内部？</text>

  <!-- split box (yes) -->
  <g filter="url(#sk)">
    <rect x="500" y="440" width="380" height="84" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="690" y="464" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">⑤ 分裂块 j*（是）</text>
  <text x="690" y="484" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">块 j* → [∩B_b 在前 | \B_b 在后]</text>
  <text x="690" y="502" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">cp 插入检查点 m，后续块编号 +1</text>
  <text x="690" y="518" text-anchor="middle" font-size="10" fill="#888">（m 顶满整块 / m=已有检查点时跳过）</text>
  <path d="M 380 480 L 496 480" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="438" y="470" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- loop back edges -->
  <path d="M 140 480 L 74 480 L 74 130 L 86 130" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="82" y="472" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 880 480 L 906 480 L 906 550 L 260 550 L 260 534" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 260 528 L 260 536" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="470" y="566" text-anchor="middle" font-size="10" fill="#888">处理下一位 b−1；b &lt; 0 时结束</text>

  <!-- end box -->
  <g filter="url(#sk)">
    <rect x="90" y="556" width="340" height="44" rx="22" fill="#f0ede4" stroke="#8a8a8a" stroke-width="1.5"/>
  </g>
  <text x="260" y="583" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">返回 power（长度 15）</text>

  <!-- side notes -->
  <g filter="url(#sk)">
    <rect x="520" y="102" width="360" height="150" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="700" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">复杂度速览</text>
  <text x="540" y="152" font-size="11" fill="#444" font-family="monospace">· 每位 ≤ 16 块（15 位各产生 ≤ 1 检查点）</text>
  <text x="540" y="174" font-size="11" fill="#444" font-family="monospace">· 每轮一次 O(n) 统计 + 一次 O(n) 重编号</text>
  <text x="540" y="200" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">· 时间 O(15·2n) ≈ O(n)，空间 O(n)</text>
  <text x="540" y="236" font-size="11" fill="#7a2828">n = 5×10⁴ 时约 150 万次基本操作</text>
</svg>
