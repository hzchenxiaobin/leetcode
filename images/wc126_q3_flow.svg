<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">滑动窗口流程：右扩、超限左缩、随时记录长度</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">两个指针都只向右走，总移动次数 ≤ 2n</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="150" y="68" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="91.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r 右移一格：读入 nums[r]</text>
  <path d="M 280.0 106.0 L 280.0 130.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="130" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="153.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">若 nums[r] == 0：zeros++</text>
  <path d="M 280.0 168.0 L 280.0 192.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,192 400,220 280,248 160,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280.0" y="225.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">zeros &gt; k ?</text>
  <path d="M 400.0 220.0 L 444.0 220.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="450.0" y="224.0" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="450" y="202" width="108" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="504.0" y="224.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">zeros--, l++</text>
  <path d="M 280.0 248.0 L 280.0 272.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="288.0" y="266.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="150" y="272" width="260" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="295.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans = max(ans, r - l + 1)</text>
  <rect x="30" y="322" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="343.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">每个 r 结束时的窗口都以 r 为右端点的最小合法窗口</text>
</svg>
