<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">框架法：出现最多的任务决定骨架</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1：A×3、B×3，n = 2 → f = 3，cnt = 2，T = 6</text>

  <g filter="url(#rough2)">
    <rect x="60" y="78" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <rect x="126" y="78" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="192" y="78" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" rx="5"/>
    <rect x="60" y="128" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <rect x="126" y="128" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="192" y="128" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" rx="5"/>
    <rect x="60" y="178" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="5"/>
    <rect x="126" y="178" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
  </g>

  <g font-size="15" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="90" y="107" fill="#3a4a66">A</text>
    <text x="156" y="107" fill="#3a5a30">B</text>
    <text x="222" y="107" fill="#a08030" font-size="13">空闲</text>
    <text x="90" y="157" fill="#3a4a66">A</text>
    <text x="156" y="157" fill="#3a5a30">B</text>
    <text x="222" y="157" fill="#a08030" font-size="13">空闲</text>
    <text x="90" y="207" fill="#3a4a66">A</text>
    <text x="156" y="207" fill="#3a5a30">B</text>
  </g>

  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="90" y="240">第 1 段</text>
    <text x="156" y="240">宽 n+1 = 3</text>
  </g>

  <path d="M 264 100 L 296 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 150 L 296 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 200 L 296 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g font-size="11" fill="#555" filter="url(#rough2)">
    <text x="304" y="96">前 f−1 = 2 段，每段宽 n+1</text>
    <text x="304" y="112" font-size="10" fill="#888">段内主任务占 1 格，其余 n 格要给别的任务或空闲</text>
    <text x="304" y="150">尾段宽 cnt = 2</text>
    <text x="304" y="166" font-size="10" fill="#888">cnt 个主任务的最后一次执行，各自占一格</text>
    <text x="304" y="200">同一主任务相邻两次执行</text>
    <text x="304" y="216" font-size="10" fill="#888">至少隔 n 个时刻 ⟹ 间隔正好被段宽锁住</text>
  </g>

  <rect x="60" y="256" width="500" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="76" y="282" font-size="13" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">L = (f − 1) × (n + 1) + cnt = 2 × 3 + 2 = 8</text>
  <text x="76" y="302" font-size="11" fill="#3a5a30" filter="url(#rough2)">T = 6 &lt; L = 8，差的 2 个时刻只能空转 → 答案 8</text>

  <g font-size="10.5" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="310" y="340">L 是任何调度都逃不掉的下界：主任务的间隔段 + 主任务的收尾</text>
    <text x="310" y="362">而 T 是另一个下界：每个任务至少要占一个时刻</text>
    <text x="310" y="384">两类任务都多（每种次数少）时框架被填满还溢出 → 答案变成 T</text>
  </g>
</svg>
