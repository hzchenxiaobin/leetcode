<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="372" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">情形 ②：s 与 goal 完全相同，必须存在重复字符</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">交换两个相同字符等于「空操作」，这是唯一能让 s 保持不变的一次交换</text>
  <rect x="40" y="92" width="250" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="165" y="122" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s = goal = "aa"</text>
  <text x="165" y="152" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a 出现 2 次 → 交换两个 a</text>
  <text x="165" y="180" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">仍为 "aa" → true</text>
  <rect x="330" y="92" width="250" height="106" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="455" y="122" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">s = goal = "ab"</text>
  <text x="455" y="152" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">没有重复字符</text>
  <text x="455" y="180" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">交换后必变 "ba" → false</text>
  <rect x="110" y="232" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="257" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="152" y="232" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="257" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">a</text>
  <text x="230" y="258" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">出现次数 ≥ 2 → 可以交换两个 a，字符串不变</text>
  <rect x="110" y="288" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="313" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="152" y="288" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="313" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">b</text>
  <text x="230" y="314" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">全不重复 → 任何交换都会改变字符串</text>
  <text x="40" y="358" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">实现：统计 26 个字母的出现次数，只要有一个 ≥ 2 就是 true。</text>
</svg>
