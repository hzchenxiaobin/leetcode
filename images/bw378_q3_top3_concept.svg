<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" viewBox="0 0 940 680" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="680" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：出现 ≥ 3 次 ⟺ 长度 ≤ len 值的第三大</text>
  <path d="M 250 42 Q 470 52 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- string cells with len values -->
  <text x="80" y="76" font-size="13" fill="#2b2b2b">以 s = "aaabaaa" 为例（与 Q2 演算同例，两版可对照）：</text>
  <text x="102" y="88" text-anchor="middle" font-size="11" fill="#446688">段 L=3</text>
  <text x="240" y="88" text-anchor="middle" font-size="11" fill="#b8862a">L=1</text>
  <text x="332" y="88" text-anchor="middle" font-size="11" fill="#446688">段 L=3</text>
  <g filter="url(#sk)">
    <rect x="80" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="126" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="172" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="94" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="264" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="310" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="356" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="102" y="120" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="148" y="120" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="194" y="120" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="240" y="120" text-anchor="middle" font-size="15" fill="#7a5415">b</text>
  <text x="286" y="120" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="332" y="120" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="378" y="120" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="102" y="158" text-anchor="middle" font-size="13" fill="#8e3a34" font-family="monospace">1</text>
  <text x="148" y="158" text-anchor="middle" font-size="13" fill="#8e3a34" font-family="monospace">2</text>
  <text x="194" y="158" text-anchor="middle" font-size="13" fill="#8e3a34" font-family="monospace">3</text>
  <text x="240" y="158" text-anchor="middle" font-size="13" fill="#8e3a34" font-family="monospace">1</text>
  <text x="286" y="158" text-anchor="middle" font-size="13" fill="#8e3a34" font-family="monospace">1</text>
  <text x="332" y="158" text-anchor="middle" font-size="13" fill="#8e3a34" font-family="monospace">2</text>
  <text x="378" y="158" text-anchor="middle" font-size="13" fill="#8e3a34" font-family="monospace">3</text>
  <text x="80" y="180" font-size="11" fill="#888">↑ len[i]：以 i 结尾的同字符延续长度</text>
  <text x="440" y="106" font-size="12" fill="#444">len[i]：s[i] = s[i−1] 时 = len[i−1] + 1，否则 = 1</text>
  <text x="440" y="128" font-size="12" fill="#444">段长 L 的游程内部，len 值恰为 1..L 各一次</text>
  <text x="440" y="150" font-size="12" fill="#444">→ 长度 x 的窗口在段内可放 L−x+1 个起点</text>

  <!-- two boxes: counting equivalence + threshold -->
  <g filter="url(#sk)">
    <rect x="80" y="210" width="380" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="100" y="236" font-size="13" font-weight="bold" fill="#2b5a8e">计数等价（Q2 公式的另一面）</text>
  <text x="100" y="262" font-size="12" fill="#333" font-family="monospace">occ(c,x) = #{ i : s[i]=c 且 len[i] ≥ x }</text>
  <text x="100" y="284" font-size="12" fill="#444">每个 len ≥ x 的位置 ↔ c^x 的一次出现</text>
  <text x="100" y="302" font-size="10" fill="#888">（与 Q2 的 Σ max(0, L−x+1) 逐段一致）</text>
  <path d="M 462 262 L 478 262" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="480" y="210" width="380" height="104" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="500" y="236" font-size="13" font-weight="bold" fill="#8e3a34">阈值判定：数 len 值就够了</text>
  <text x="500" y="262" font-size="12" fill="#444" font-family="monospace">occ(c,x) ≥ 3 ⟺ 至少 3 个 len 值 ≥ x</text>
  <text x="500" y="284" font-size="12" font-weight="bold" fill="#8e3a34" font-family="monospace">⟺ x ≤ 该字符 len 值的第三大</text>
  <text x="500" y="302" font-size="10" fill="#888">判定阈值是 3 → 第 4 大及以后全部无关</text>

  <!-- sorted multiset, top-3 highlighted -->
  <text x="80" y="356" font-size="13" fill="#2b2b2b">a 的 len 值按位置计（含重复），降序排列——只有前三大会被「问到」：</text>
  <g filter="url(#sk)">
    <rect x="80" y="370" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="122" y="370" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="164" y="370" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="206" y="370" width="40" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="248" y="370" width="40" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="290" y="370" width="40" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="100" y="392" text-anchor="middle" font-size="14" fill="#8e3a34">3</text>
  <text x="142" y="392" text-anchor="middle" font-size="14" fill="#8e3a34">3</text>
  <text x="184" y="392" text-anchor="middle" font-size="14" fill="#8e3a34">2</text>
  <text x="226" y="392" text-anchor="middle" font-size="14" fill="#999">2</text>
  <text x="268" y="392" text-anchor="middle" font-size="14" fill="#999">1</text>
  <text x="310" y="392" text-anchor="middle" font-size="14" fill="#999">1</text>
  <path d="M 82 412 C 104 420, 160 420, 202 412" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="80" y="440" font-size="12" font-weight="bold" fill="#2e6e2e">前三大 [3,3,2]，第三大 = 2 → a 的候选答案 = 2</text>
  <text x="360" y="392" font-size="11" fill="#999">← 重复值保留：两个长 3 的段</text>
  <g filter="url(#sk)">
    <rect x="480" y="362" width="380" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="500" y="388" font-size="13" font-weight="bold" fill="#2b5a8e">b 的 len 值 {1}：不足 3 个</text>
  <text x="500" y="412" font-size="12" fill="#444">无可行长度；槽位哨兵 0 自动表达「不足」</text>

  <!-- run-language closed form -->
  <g filter="url(#sk)">
    <rect x="80" y="460" width="780" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="100" y="486" font-size="13" font-weight="bold" fill="#2e6e2e">翻译回游程语言：三大游程长 r1 ≥ r2 ≥ r3（不足补 0）</text>
  <text x="470" y="514" text-anchor="middle" font-size="14" fill="#333" font-family="monospace" font-weight="bold">第三大 = max( r1 − 2 ,  min(r1 − 1, r2) ,  r3 )</text>
  <text x="100" y="538" font-size="11" fill="#666">本例 a：r = [3, 3, 0] → max(1, 2, 0) = 2 ✓ 与 len 视角一致</text>

  <!-- why only top-3 -->
  <g filter="url(#sk)">
    <rect x="80" y="572" width="780" height="92" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="6 3"/>
  </g>
  <text x="100" y="598" font-size="13" font-weight="bold" fill="#2b2b2b">为什么第 4 大及以后「轮不到」？</text>
  <text x="100" y="622" font-size="12" fill="#444">判定只问「有几个 len 值 ≥ x」——第 4 大再大也排在第三大之后，永远轮不到它去「卡住第三个」</text>
  <text x="100" y="644" font-size="12" font-weight="bold" fill="#2e6e2e">→ 每字符 3 槽 × 26 字符 = 78 个整数：一次扫描 O(n)、空间 O(1)，连二分都省了</text>
</svg>
