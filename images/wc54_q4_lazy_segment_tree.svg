<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">流程：坐标压缩 → 查询区间最大值 → 整段赋值 → 记录历史最高</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每个方块做两次 O(log n) 操作：query 得到 base，assign 把整段写成 base + side</text>

  <!-- ===== 左侧流程 ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="66" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="52" y="85" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 坐标压缩（一次性）</text>
  <text x="52" y="102" font-size="9" fill="#555" filter="url(#rough2)">xs = sort(unique{left, left+side})</text>

  <path d="M 170 112 L 170 126" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="128" width="260" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="52" y="147" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② base = query(l, r−1)</text>
  <text x="52" y="164" font-size="9" fill="#555" filter="url(#rough2)">l = idx[left]，r = idx[left+side]</text>
  <text x="52" y="180" font-size="9" fill="#555" filter="url(#rough2)">基本区间 i 代表 [xs[i], xs[i+1])</text>

  <path d="M 170 190 L 170 204" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="206" width="260" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="52" y="225" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ h = base + side</text>
  <text x="52" y="242" font-size="9" fill="#555" filter="url(#rough2)">assign(l, r−1, h)：整段覆盖成 h</text>

  <path d="M 170 252 L 170 266" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="268" width="260" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="52" y="287" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">④ best = max(best, h)</text>
  <text x="52" y="304" font-size="9" fill="#555" filter="url(#rough2)">ans.append(best)，best 单调不减</text>

  <g filter="url(#rough2)">
    <rect x="40" y="330" width="260" height="50" fill="#f0f2f5" stroke="#8a8f99" stroke-width="1.4" rx="8"/>
  </g>
  <text x="52" y="349" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="52" y="366" font-size="9" fill="#555" filter="url(#rough2)">时间 O(n log n)，空间 O(n)（m ≤ 2n−1）</text>

  <!-- ===== 右侧线段树 ===== -->
  <text x="330" y="76" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">线段树：节点维护一段基本区间</text>
  <text x="330" y="94" font-size="9.5" fill="#666" filter="url(#rough2)">mx = 区间最大高度，tag = 懒赋值标记</text>

  <g filter="url(#rough2)" stroke="#999" stroke-width="1.2">
    <line x1="460" y1="150" x2="380" y2="180"/>
    <line x1="460" y1="150" x2="540" y2="180"/>
    <line x1="380" y1="212" x2="340" y2="240"/>
    <line x1="380" y1="212" x2="420" y2="240"/>
    <line x1="540" y1="212" x2="500" y2="240"/>
    <line x1="540" y1="212" x2="580" y2="240"/>
  </g>

  <rect x="415" y="118" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="138" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">mx · tag</text>

  <rect x="340" y="180" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="380" y="200" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">mx · tag</text>
  <rect x="500" y="180" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="540" y="200" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">mx · tag</text>

  <rect x="312" y="240" width="56" height="30" fill="#f6f6f6" stroke="#999" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="340" y="259" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">0</text>
  <rect x="392" y="240" width="56" height="30" fill="#f6f6f6" stroke="#999" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="420" y="259" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">1</text>
  <rect x="472" y="240" width="56" height="30" fill="#f6f6f6" stroke="#999" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="500" y="259" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">2</text>
  <rect x="552" y="240" width="56" height="30" fill="#f6f6f6" stroke="#999" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="580" y="259" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">3</text>

  <text x="460" y="290" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">叶子 i 代表基本区间 [xs[i], xs[i+1])</text>

  <g filter="url(#rough2)">
    <rect x="330" y="306" width="270" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
  </g>
  <text x="342" y="324" font-size="8.8" fill="#8a6a20" filter="url(#rough2)">query：整段覆盖→直接返回 mx；否则 push 后递归取 max</text>
  <text x="342" y="341" font-size="8.8" fill="#8a6a20" filter="url(#rough2)">assign：整段覆盖→打 tag；否则 push 后递归并回写 mx</text>
  <text x="342" y="358" font-size="8.8" fill="#666" filter="url(#rough2)">push：把 tag 下传给左右儿子，再清空当前标记</text>
  <text x="342" y="372" font-size="8.8" fill="#666" filter="url(#rough2)">只有被覆盖的节点会改动，故单次操作 O(log n)</text>
</svg>
