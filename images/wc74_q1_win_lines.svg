  <text x="56" y="360" font-size="9.8" fill="#2f3f5c" text-anchor="start" filter="url(#rough2)">实现：把 9 格拼成 flat，8 组下标逐组比较「三字符相等且非空」</text>
  <text x="56" y="375" font-size="9.8" fill="#b85450" text-anchor="start" filter="url(#rough2)">关键：用 bool 累积而不是计数条数 —— 同一玩家可以同时占满两条线</text>
