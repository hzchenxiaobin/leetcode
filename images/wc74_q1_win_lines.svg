  <text x="190" y="110" font-size="9.5" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">第 1 行被 X 占满</text>
  <text x="190" y="126" font-size="9.5" fill="#888" text-anchor="start" filter="url(#rough2)">→ 三行同色即胜</text>
  <text x="430" y="110" font-size="9.5" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">第 1 列被 X 占满</text>
  <text x="430" y="126" font-size="9.5" fill="#888" text-anchor="start" filter="url(#rough2)">→ 三列同色即胜</text>
