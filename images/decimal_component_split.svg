<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">按位拆分：每个非零数位 ↔ 一个 10 进制分量</text>
  <text x="260" y="62" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">n = 537 的十进制表示</text>

  <!-- 数位格子 -->
  <rect x="170" y="80" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="198" y="110" text-anchor="middle" font-size="22" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="232" y="80" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="22" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="294" y="80" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="322" y="110" text-anchor="middle" font-size="22" fill="#446688" filter="url(#rough2)">7</text>

  <text x="198" y="142" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×10²</text>
  <text x="260" y="142" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×10¹</text>
  <text x="322" y="142" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×10⁰</text>

  <!-- 箭头 -->
  <path d="M 198 150 C 178 190, 145 215, 120 244" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 150 C 258 185, 259 215, 260 244" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 322 150 C 342 190, 375 215, 400 244" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分量框 -->
  <rect x="60" y="250" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="279" text-anchor="middle" font-size="20" fill="#4a7a3a" filter="url(#rough2)">500</text>

  <rect x="210" y="250" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="20" fill="#4a7a3a" filter="url(#rough2)">30</text>

  <rect x="360" y="250" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="279" text-anchor="middle" font-size="20" fill="#4a7a3a" filter="url(#rough2)">7</text>

  <text x="185" y="278" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">+</text>
  <text x="335" y="278" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">+</text>

  <text x="110" y="314" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">= 5×10²</text>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">= 3×10¹</text>
  <text x="410" y="314" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">= 7×10⁰</text>

  <!-- 底部说明 -->
  <rect x="70" y="340" width="380" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="12" fill="#7a6020" filter="url(#rough2)">数位为 0 的位不产生任何分量</text>
  <text x="260" y="386" text-anchor="middle" font-size="12" fill="#7a6020" filter="url(#rough2)">（0 不是合法分量：数字 d 必须在 1~9 中）</text>
</svg>
