<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：单个数对的代价只有 0 / 1 / 2 三档</text>
  <path d="M 185 40 Q 320 48 455 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">取一个数对 ( a , b )，不妨设 a ≤ b；公共和的目标值记为 T</text>

  <g filter="url(#sk)">
    <path d="M 88 318 L 88 112" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 88 318 L 596 318" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="76" y="108" text-anchor="end" font-size="13" fill="#555" filter="url(#sk)">代价</text>
  <text x="592" y="338" text-anchor="end" font-size="13" fill="#555" filter="url(#sk)">目标 T</text>

  <g filter="url(#sk)">
    <path d="M 90 160 L 586 160" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="5 5" fill="none"/>
    <path d="M 90 230 L 586 230" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="5 5" fill="none"/>
    <path d="M 90 300 L 586 300" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="5 5" fill="none"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#555" text-anchor="end" filter="url(#sk)">
    <text x="80" y="165">2</text>
    <text x="80" y="235">1</text>
    <text x="80" y="305">0</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 220 316 L 220 234" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
    <path d="M 340 316 L 340 297" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
    <path d="M 480 316 L 480 234" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
  </g>

  <g filter="url(#sk)">
    <path d="M 130 160 C 158 156, 186 164, 212 160" stroke="#446688" stroke-width="3" fill="none"/>
    <path d="M 220 230 C 252 226, 300 234, 332 230" stroke="#446688" stroke-width="3" fill="none"/>
    <path d="M 348 230 C 380 226, 435 234, 472 230" stroke="#446688" stroke-width="3" fill="none"/>
    <path d="M 480 160 C 506 156, 540 164, 570 160" stroke="#446688" stroke-width="3" fill="none"/>
  </g>
  <g fill="#446688" filter="url(#sk)">
    <circle cx="130" cy="160" r="3.5"/>
    <circle cx="220" cy="230" r="3.5"/>
    <circle cx="348" cy="230" r="3.5"/>
    <circle cx="480" cy="160" r="3.5"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="340" cy="300" r="7" fill="#b85450" stroke="#8f3a36" stroke-width="1.5"/>
  </g>

  <g font-size="12.5" fill="#555" text-anchor="middle" filter="url(#sk)">
    <text x="130" y="338">2</text>
    <text x="220" y="338">a+1</text>
    <text x="340" y="338">a+b</text>
    <text x="480" y="338">b+limit+1</text>
    <text x="570" y="338">2·limit</text>
  </g>
  <g stroke="#555" stroke-width="1.2" filter="url(#sk)">
    <path d="M 130 320 L 130 326" fill="none"/>
    <path d="M 220 320 L 220 326" fill="none"/>
    <path d="M 340 320 L 340 326" fill="none"/>
    <path d="M 480 320 L 480 326" fill="none"/>
    <path d="M 570 320 L 570 326" fill="none"/>
  </g>

  <g text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="170" y="147" font-size="13" fill="#b85450">改 2 个数</text>
    <text x="276" y="216" font-size="13" fill="#4a7a3a">改 1 个数</text>
    <text x="340" y="284" font-size="13" fill="#b85450">0 次，不用动</text>
    <text x="410" y="216" font-size="13" fill="#4a7a3a">改 1 个数</text>
    <text x="525" y="147" font-size="13" fill="#b85450">改 2 个数</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#999" filter="url(#sk)">
    <text x="170" y="181">T 太小</text>
    <text x="525" y="181">T 太大</text>
  </g>

  <g filter="url(#sk)">
    <rect x="58" y="352" width="524" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="369" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#sk)">只改一个数 ⟺ T − a 或 T − b 落在 [1, limit] 内</text>
  <text x="320" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818" filter="url(#sk)">⟹ 可行区间 [a+1, b+limit]，中间夹着零代价点 T = a+b</text>
</svg>
