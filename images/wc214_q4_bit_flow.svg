<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：每个 x 一轮「两查、取 min、一插」</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="64" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">初始化：V ← max(instructions)，BIT 开 V+1 桶，cost = 0，total = 0</text>

  <!-- 取元素 -->
  <g filter="url(#rough2)">
    <rect x="225" y="76" width="190" height="34" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  </g>
  <text x="320" y="98" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取下一个元素 x</text>
  <path d="M 320 110 L 320 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 两查 -->
  <g filter="url(#rough2)">
    <rect x="160" y="126" width="320" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="148" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">less ← query(x − 1)　　（严格小于 x）</text>
  <text x="320" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">greater ← total − query(x)　（严格大于 x）</text>
  <path d="M 320 180 L 320 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取 min 累加 -->
  <g filter="url(#rough2)">
    <rect x="190" y="196" width="260" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="213" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">cost ← cost + min(less, greater)</text>
  <text x="320" y="230" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">本次插入代价（long long 累加，最后取模）</text>
  <path d="M 320 236 L 320 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 一插 -->
  <g filter="url(#rough2)">
    <rect x="190" y="252" width="260" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">update(x, +1)，total ← total + 1</text>
  <text x="320" y="286" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">插入 x —— 必须先查后改！</text>
  <path d="M 320 292 L 320 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：还有元素？ -->
  <g filter="url(#rough2)">
    <polygon points="320,306 384,334 320,362 256,334" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="339" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">还有下一个元素？</text>

  <!-- 是：回到取元素 -->
  <path d="M 256 334 Q 140 330 132 260 L 132 150 Q 132 94 190 93 L 219 93" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">是</text>

  <!-- 否：返回 -->
  <path d="M 320 362 L 320 376" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="333" y="374" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="170" y="380" width="300" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="320" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 cost mod (10⁹ + 7)</text>

  <!-- 右侧语义注记 -->
  <g filter="url(#rough2)">
    <rect x="446" y="126" width="176" height="122" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="534" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">query(t) 的语义</text>
  <text x="534" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">值 ≤ t 的累计频次 P(t)</text>
  <text x="534" y="188" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">P(x−1) → 严格小于 x</text>
  <text x="534" y="208" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">total − P(x) → 严格大于 x</text>
  <text x="534" y="228" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">等于 x 的被两侧同时排除</text>
  <text x="534" y="244" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（重复值零成本）</text>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="40" y="426" width="560" height="36" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="449" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">顺序纪律：先两查、后一插——先 update 会把 x 自己数进前缀，greater 恒少 1</text>
</svg>
