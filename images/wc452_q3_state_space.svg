<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：位置不够用 —— 状态必须是 (位置, 已收集掩码, 剩余能量)</text>
  <path d="M 200 42 Q 470 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== grid 5x3, cell 46, origin (80,92) ===== -->
  <!-- plain '.' cells -->
  <g filter="url(#sk)" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2">
    <rect x="80" y="92" width="46" height="46" rx="4"/>
    <rect x="126" y="92" width="46" height="46" rx="4"/>
    <rect x="172" y="92" width="46" height="46" rx="4"/>
    <rect x="218" y="92" width="46" height="46" rx="4"/>
    <rect x="80" y="184" width="46" height="46" rx="4"/>
    <rect x="172" y="184" width="46" height="46" rx="4"/>
    <rect x="218" y="184" width="46" height="46" rx="4"/>
    <rect x="264" y="184" width="46" height="46" rx="4"/>
  </g>
  <g font-size="12" fill="#c8c8c8" text-anchor="middle">
    <text x="103" y="119">.</text><text x="149" y="119">.</text><text x="195" y="119">.</text><text x="241" y="119">.</text>
    <text x="103" y="211">.</text><text x="195" y="211">.</text><text x="241" y="211">.</text><text x="287" y="211">.</text>
  </g>
  <!-- L2 at (0,4) -->
  <g filter="url(#sk)"><rect x="264" y="92" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="287" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#a07020">L②</text>
  <!-- S at (1,0) -->
  <g filter="url(#sk)"><rect x="80" y="138" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="103" y="167" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a6a2a">S</text>
  <!-- L1 at (1,1) -->
  <g filter="url(#sk)"><rect x="126" y="138" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="149" y="167" text-anchor="middle" font-size="15" font-weight="bold" fill="#a07020">L①</text>
  <!-- P at (1,2) highlighted -->
  <g filter="url(#sk)"><rect x="172" y="138" width="46" height="46" rx="4" fill="#fff3cd" stroke="#d6a040" stroke-width="2.5"/></g>
  <g filter="url(#sk)"><circle cx="195" cy="161" r="9.5" fill="#b85450" stroke="#8a3a36" stroke-width="1.2"/></g>
  <text x="195" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">P</text>
  <!-- X at (1,4) -->
  <g filter="url(#sk)"><rect x="264" y="138" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="287" y="167" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04040">X</text>
  <!-- R at (2,1) -->
  <g filter="url(#sk)"><rect x="126" y="184" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="149" y="213" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">R</text>

  <path d="M 195,234 L 195,256" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="207" y="254" font-size="12" font-weight="bold" fill="#a07020">同一格 P，两种历史</text>

  <!-- ===== card A ===== -->
  <g filter="url(#sk)"><rect x="70" y="268" width="392" height="112" rx="10" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="86" y="292" font-size="13" font-weight="bold" fill="#2b6e9e">状态 A：第 2 步到达 P —— 快，但能量见底</text>
  <text x="86" y="316" font-size="12" fill="#333">(P, mask = {L①}, e = 2)</text>
  <g filter="url(#sk)">
    <rect x="86" y="328" width="20" height="12" fill="#4a8edb" stroke="#2b6e9e" stroke-width="1"/>
    <rect x="108" y="328" width="20" height="12" fill="#4a8edb" stroke="#2b6e9e" stroke-width="1"/>
    <rect x="130" y="328" width="20" height="12" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="152" y="328" width="20" height="12" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <text x="182" y="338" font-size="10" fill="#888">2 / 4</text>
  <text x="86" y="366" font-size="11" fill="#555">到 L② 还需 3 步 &gt; 剩 2 能量，此路不通 ✗</text>

  <!-- middle annotation -->
  <text x="266" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">同一 (位置, 掩码)、不同能量 ⇒ 互不支配，两个都得进队列 —— 能量必须进状态！</text>

  <!-- ===== card B ===== -->
  <g filter="url(#sk)"><rect x="70" y="396" width="392" height="112" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="86" y="420" font-size="13" font-weight="bold" fill="#2e6e2e">状态 B：第 6 步绕路回到 P —— 慢，但踩 R 回满</text>
  <text x="86" y="444" font-size="12" fill="#333">(P, mask = {L①}, e = 4)</text>
  <g filter="url(#sk)">
    <rect x="86" y="456" width="20" height="12" fill="#4a8e4a" stroke="#2e6e2e" stroke-width="1"/>
    <rect x="108" y="456" width="20" height="12" fill="#4a8e4a" stroke="#2e6e2e" stroke-width="1"/>
    <rect x="130" y="456" width="20" height="12" fill="#4a8e4a" stroke="#2e6e2e" stroke-width="1"/>
    <rect x="152" y="456" width="20" height="12" fill="#4a8e4a" stroke="#2e6e2e" stroke-width="1"/>
  </g>
  <text x="182" y="466" font-size="10" fill="#888">4 / 4</text>
  <text x="86" y="494" font-size="11" fill="#555">4 能量 ≥ 3 步 → 直达 L②，收集完成 ✓</text>

  <!-- ===== right: state tuple ===== -->
  <g filter="url(#sk)"><rect x="510" y="92" width="360" height="158" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="530" y="118" font-size="13" font-weight="bold" fill="#7a5415">BFS 的节点：三元组状态</text>
  <text x="690" y="152" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2b2b">( pos , mask , e )</text>
  <g filter="url(#sk)"><rect x="525" y="166" width="102" height="42" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="576" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">位置</text>
  <text x="576" y="200" text-anchor="middle" font-size="10" fill="#666">≤ 20×20 = 400</text>
  <g filter="url(#sk)"><rect x="637" y="166" width="102" height="42" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="688" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">掩码</text>
  <text x="688" y="200" text-anchor="middle" font-size="10" fill="#666">≤ 2¹⁰ = 1024</text>
  <g filter="url(#sk)"><rect x="749" y="166" width="102" height="42" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="800" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">能量</text>
  <text x="800" y="200" text-anchor="middle" font-size="10" fill="#666">0..50 共 51 档</text>
  <text x="690" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">乘积上界 ≈ 2.1×10⁷ —— 有限状态，直接枚举可过</text>

  <!-- ===== right: notes ===== -->
  <g filter="url(#sk)"><rect x="510" y="268" width="360" height="240" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="530" y="294" font-size="13" font-weight="bold" fill="#7a5415">实现要点</text>
  <text x="530" y="322" font-size="11" fill="#444">· 每步代价同为 1 → BFS 按层扩散，层数即答案</text>
  <text x="530" y="350" font-size="11" fill="#444">· 进入 R 立即回满能量：满能量永远不劣</text>
  <text x="530" y="378" font-size="11" fill="#444">· 踩 L 自动收集（mask | bit），可重复经过</text>
  <text x="530" y="406" font-size="11" fill="#444">· visited 必须含 (掩码, 能量) 两维，缺一不可</text>
  <text x="530" y="434" font-size="11" fill="#444">· 一个 L 都没有时，答案就是 0</text>
  <text x="530" y="462" font-size="11" fill="#444">· 「更晚但能量更高」≠ 更好（剪枝陷阱见 §4）</text>
  <text x="530" y="492" font-size="10" fill="#888">状态总数 ≤ 400 × 1024 × 51 ≈ 2.1×10⁷，C++ 轻松，Python 需扁平数组</text>
</svg>
