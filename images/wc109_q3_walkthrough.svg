<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="360" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：3×3 与 5×5 环</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">示例 2：grid = [[0,1,0],[0,0,0],[0,0,1]]</text>
  <rect x="80" y="80" width="46" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103.0" y="104.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="134" y="80" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157.0" y="104.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="80" width="46" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="211.0" y="104.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="80" y="128" width="46" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103.0" y="152.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="134" y="128" width="46" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157.0" y="152.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="188" y="128" width="46" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="211.0" y="152.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="80" y="176" width="46" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103.0" y="200.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="134" y="176" width="46" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157.0" y="200.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="188" y="176" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="211.0" y="200.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="270" y="96" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">岛 A = {(0,1)}</text>
  <text x="270" y="122" text-anchor="start" font-size="11" fill="#d6a040" filter="url(#rough2)">岛 B = {(2,2)}</text>
  <text x="270" y="152" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 层：{(0,0), (1,1)}</text>
  <text x="270" y="178" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 2 层：{(1,0), (1,2), (2,1)}</text>
  <text x="270" y="204" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(2,1) 的邻居 (2,2) 是岛 B → 返回 2</text>
  <text x="60" y="266" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">示例 3：5×5 外圈全 1、中心 (2,2) 为 1，中间一圈 0</text>
  <text x="60" y="296" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">外圈岛 A 的 1 层邻居就包含中心岛 B 的格子 → 答案是 1</text>
  <text x="330" y="340" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">若两岛相邻（距离 1 的水域都没有），答案会是 0；题目保证恰好两座岛，故至少 1</text>
</svg>
