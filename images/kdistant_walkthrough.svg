<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums=[3,4,9,1,3,9,5], key=9, k=1</text>
  <path d="M 160 44 Q 320 52 480 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组格子 -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="150" y="66" width="52" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="176" y="88">3</text>
    <g filter="url(#sk)"><rect x="206" y="66" width="52" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="232" y="88">4</text>
    <g filter="url(#sk)"><rect x="262" y="66" width="52" height="34" rx="6" fill="#ffe8cc" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="288" y="88" fill="#a06514" font-weight="bold">9</text>
    <g filter="url(#sk)"><rect x="318" y="66" width="52" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="344" y="88">1</text>
    <g filter="url(#sk)"><rect x="374" y="66" width="52" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="400" y="88">3</text>
    <g filter="url(#sk)"><rect x="430" y="66" width="52" height="34" rx="6" fill="#ffe8cc" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="456" y="88" fill="#a06514" font-weight="bold">9</text>
    <g filter="url(#sk)"><rect x="486" y="66" width="52" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="512" y="88">5</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="176" y="112">i=0</text><text x="232" y="112">i=1</text><text x="288" y="112">i=2</text>
    <text x="344" y="112">i=3</text><text x="400" y="112">i=4</text><text x="456" y="112">i=5</text><text x="512" y="112">i=6</text>
  </g>

  <!-- 步骤 1 -->
  <g filter="url(#sk)">
    <rect x="60" y="132" width="250" height="88" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="185" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① j=2：第一个 key</text>
  <g font-size="11.5" fill="#2b6e9e" font-family="monospace">
    <text x="76" y="174">left = max(0, 2−1) = 1</text>
    <text x="76" y="192">right = min(6, 2+1)+1 = 4</text>
    <text x="76" y="210" font-weight="bold">输出 → 1, 2, 3</text>
  </g>

  <!-- 步骤 2 -->
  <g filter="url(#sk)">
    <rect x="330" y="132" width="250" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="455" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">② j=5：第二个 key</text>
  <g font-size="11.5" fill="#2e6e2e" font-family="monospace">
    <text x="346" y="174">left = max(4, 5−1) = 4</text>
    <text x="346" y="192">right = min(6, 5+1)+1 = 7</text>
    <text x="346" y="210" font-weight="bold">输出 → 4, 5, 6</text>
  </g>

  <path d="M 310 176 L 330 176" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 覆盖条可视化 -->
  <text x="90" y="252" font-size="12" font-weight="bold" fill="#2b2b2b">覆盖:</text>
  <g filter="url(#sk)">
    <rect x="206" y="238" width="164" height="24" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="288" y="255" text-anchor="middle" font-size="11" fill="#2b6e9e">[1,3]（j=2）</text>
  <g filter="url(#sk)">
    <rect x="374" y="238" width="164" height="24" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="456" y="255" text-anchor="middle" font-size="11" fill="#2e6e2e">[4,6]（j=5）</text>

  <!-- 最终答案 -->
  <g filter="url(#sk)">
    <rect x="160" y="284" width="320" height="44" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="304" text-anchor="middle" font-size="12" fill="#7a5415">两段区间恰好拼接，无重叠无遗漏</text>
  <text x="320" y="322" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold" font-family="monospace">答案 = [1,2,3,4,5,6] ✓</text>

  <text x="320" y="348" text-anchor="middle" font-size="11" fill="#888">时间 O(n)：每个下标最多被输出一次。空间 O(1) 额外（不计答案）。</text>
</svg>
