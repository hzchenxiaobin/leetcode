<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#667"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = ")(a(b)c("</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两趟都派上用场：1 个坏 ')' + 2 个多余 '(' = 删 3 个</text>

  <text x="60" y="70" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第一趟（左 → 右）：balance 不能为负</text>

  <rect x="56" y="78" width="448" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <g font-size="10" fill="#3a4a66" text-anchor="middle">
    <text x="86" y="93" filter="url(#rough2)">i</text>
    <text x="146" y="93" filter="url(#rough2)">s[i]</text>
    <text x="236" y="93" filter="url(#rough2)">balance</text>
    <text x="390" y="93" filter="url(#rough2)">动作</text>
  </g>

  <g>
    <rect x="56" y="100" width="448" height="21" fill="#fce4ec" stroke="#e0b8bd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="56" y="121" width="448" height="21" fill="#ffffff" stroke="#e2e2e2" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="56" y="142" width="448" height="21" fill="#e6f4ea" stroke="#d5e5d8" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="56" y="163" width="448" height="21" fill="#ffffff" stroke="#e2e2e2" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="56" y="184" width="448" height="21" fill="#e6f4ea" stroke="#d5e5d8" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="56" y="205" width="448" height="21" fill="#ffffff" stroke="#e2e2e2" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="56" y="226" width="448" height="21" fill="#e6f4ea" stroke="#d5e5d8" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="56" y="247" width="448" height="21" fill="#ffffff" stroke="#e2e2e2" stroke-width="1" rx="3" filter="url(#rough2)"/>
  </g>

  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="86" y="115" filter="url(#rough2)">0</text>
    <text x="146" y="115" filter="url(#rough2)">)</text>
    <text x="236" y="115" filter="url(#rough2)">0</text>
    <text x="390" y="115" fill="#8a3a36" filter="url(#rough2)">丢弃（balance 已是 0）</text>

    <text x="86" y="136" filter="url(#rough2)">1</text>
    <text x="146" y="136" filter="url(#rough2)">a</text>
    <text x="236" y="136" filter="url(#rough2)">0</text>
    <text x="390" y="136" filter="url(#rough2)">保留</text>

    <text x="86" y="157" filter="url(#rough2)">2</text>
    <text x="146" y="157" filter="url(#rough2)">(</text>
    <text x="236" y="157" filter="url(#rough2)">1</text>
    <text x="390" y="157" filter="url(#rough2)">保留，balance +1</text>

    <text x="86" y="178" filter="url(#rough2)">3</text>
    <text x="146" y="178" filter="url(#rough2)">b</text>
    <text x="236" y="178" filter="url(#rough2)">1</text>
    <text x="390" y="178" filter="url(#rough2)">保留</text>

    <text x="86" y="199" filter="url(#rough2)">4</text>
    <text x="146" y="199" filter="url(#rough2)">(</text>
    <text x="236" y="199" filter="url(#rough2)">2</text>
    <text x="390" y="199" filter="url(#rough2)">保留，balance +1</text>

    <text x="86" y="220" filter="url(#rough2)">5</text>
    <text x="146" y="220" filter="url(#rough2)">c</text>
    <text x="236" y="220" filter="url(#rough2)">2</text>
    <text x="390" y="220" filter="url(#rough2)">保留</text>

    <text x="86" y="241" filter="url(#rough2)">6</text>
    <text x="146" y="241" filter="url(#rough2)">)</text>
    <text x="236" y="241" filter="url(#rough2)">1</text>
    <text x="390" y="241" filter="url(#rough2)">配对，balance −1</text>

    <text x="86" y="262" filter="url(#rough2)">7</text>
    <text x="146" y="262" filter="url(#rough2)">(</text>
    <text x="236" y="262" filter="url(#rough2)">2</text>
    <text x="390" y="262" filter="url(#rough2)">保留，balance +1</text>
  </g>

  <text x="60" y="288" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">第一趟后 t = "a(b(c)("，balance = B = 2；第二趟（右 → 左）：excess = 2</text>

  <text x="124" y="316" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">t =</text>

  <g>
    <rect x="140" y="296" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="176" y="296" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="212" y="296" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="248" y="296" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <rect x="284" y="296" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="320" y="296" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="356" y="296" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  </g>

  <g font-size="14" text-anchor="middle" fill="#333">
    <text x="158" y="317" filter="url(#rough2)">a</text>
    <text x="194" y="317" filter="url(#rough2)">(</text>
    <text x="230" y="317" filter="url(#rough2)">b</text>
    <text x="266" y="317" filter="url(#rough2)">(</text>
    <text x="302" y="317" filter="url(#rough2)">c</text>
    <text x="338" y="317" filter="url(#rough2)">)</text>
    <text x="374" y="317" filter="url(#rough2)">(</text>
  </g>

  <path d="M 252 300 L 280 322" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 280 300 L 252 322" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 360 300 L 388 322" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 388 300 L 360 322" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <g font-size="10" fill="#b85450" text-anchor="middle">
    <text x="266" y="342" filter="url(#rough2)">删</text>
    <text x="374" y="342" filter="url(#rough2)">删</text>
  </g>

  <path d="M 302 350 L 302 368" stroke="#667" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="370" width="320" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">结果 "a(bc)"：删除 3 个 = r + B</text>

  <text x="280" y="418" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">校验 balance 依次 0,1,1,2,2,1,0 → 处处 ≥ 0 且末尾为 0</text>
</svg>
