<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：数组被相邻下降处切成若干「极大非降段」</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">以 nums = [2, 5, 5, 4, 7, 8, 6] 为例：相邻逆序（下降）处就是段边界</text>

  <text x="290" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">5 &gt; 4</text>
  <text x="470" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">8 &gt; 6</text>

  <g filter="url(#sk)">
    <rect x="110" y="80" width="60" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="170" y="80" width="60" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="230" y="80" width="60" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="290" y="80" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="350" y="80" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="410" y="80" width="60" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="470" y="80" width="60" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="140" y="110" fill="#3a6a2a">2</text>
    <text x="200" y="110" fill="#3a6a2a">5</text>
    <text x="260" y="110" fill="#3a6a2a">5</text>
    <text x="320" y="110" fill="#33517a">4</text>
    <text x="380" y="110" fill="#33517a">7</text>
    <text x="440" y="110" fill="#33517a">8</text>
    <text x="500" y="110" fill="#8a6520">6</text>
  </g>

  <path d="M 290 80 L 284 94 L 293 104 L 287 116 L 291 126" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 470 80 L 476 94 L 467 104 L 473 116 L 469 126" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>

  <path d="M 112 136 Q 200 144 288 136" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 292 136 Q 380 144 468 136" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 472 136 Q 500 142 528 136" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <text x="200" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">极大非降段 A</text>
  <text x="380" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">极大非降段 B</text>
  <text x="500" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">段 C</text>

  <text x="100" y="188" text-anchor="end" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">f[i]</text>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#446688" filter="url(#sk)">
    <text x="140" y="188">0</text>
    <text x="200" y="188">0</text>
    <text x="260" y="188">0</text>
    <text x="320" y="188">3</text>
    <text x="380" y="188">3</text>
    <text x="440" y="188">3</text>
    <text x="500" y="188">6</text>
  </g>

  <text x="100" y="216" text-anchor="end" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">g[i]</text>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#4a7a3a" filter="url(#sk)">
    <text x="140" y="216">1</text>
    <text x="200" y="216">2</text>
    <text x="260" y="216">3</text>
    <text x="320" y="216">1</text>
    <text x="380" y="216">2</text>
    <text x="440" y="216">3</text>
    <text x="500" y="216">1</text>
  </g>

  <rect x="70" y="228" width="500" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">f 与 g 的含义</text>
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="#6a5530" filter="url(#sk)">f[i]：以 i 结尾的极大非降段左端点 → 段内任取左端点都稳定</text>
  <text x="320" y="292" text-anchor="middle" font-size="12" fill="#6a5530" filter="url(#sk)">g[i] = i − f[i] + 1：恰好以 i 为右端点的稳定子数组个数</text>

  <rect x="70" y="318" width="500" height="68" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">关键性质：f 单调不减</text>
  <text x="320" y="362" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">段只会整体右移 →「f[i] ≤ l」的下标是一段连续前缀 → 分界点可二分！</text>
  <text x="320" y="380" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">注意 g 并不单调，别对 g 二分；min 的切换只由 f[i] 与 l 的大小决定</text>
</svg>
