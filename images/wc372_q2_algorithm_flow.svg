<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描计数，O(1) 额外空间</text>
  <path d="M 150 34 Q 320 42 490 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><rect x="70" y="52" width="100" height="28" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="120" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">开始</text>
  <path d="M 120 80 L 120 94" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)"><rect x="60" y="94" width="120" height="30" rx="4" fill="#fdfcf7" stroke="#3a3a3a" stroke-width="1.4"/></g>
  <text x="120" y="114" text-anchor="middle" font-size="12.5" fill="#333">cnt = 0, ans = 0</text>
  <path d="M 120 124 L 120 138" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形1：i < n ? -->
  <g filter="url(#sk)"><polygon points="120,140 178,168 120,196 62,168" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="120" y="173" text-anchor="middle" font-size="12.5" fill="#7a5415">i &lt; n ?</text>
  <text x="200" y="160" font-size="11" fill="#a03a36">否</text>
  <path d="M 178 168 L 240 168" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 返回框 -->
  <g filter="url(#sk)"><rect x="240" y="152" width="110" height="32" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="295" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36">返回 ans</text>

  <text x="128" y="210" font-size="11" fill="#2e6e2e">是</text>
  <path d="M 120 196 L 120 212" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形2：s[i]=='1' ? -->
  <g filter="url(#sk)"><polygon points="120,214 178,242 120,270 62,242" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="120" y="247" text-anchor="middle" font-size="12.5" fill="#7a5415">s[i] == '1' ?</text>

  <!-- 是 → cnt -->
  <text x="48" y="234" font-size="11" fill="#2e6e2e">是</text>
  <path d="M 62 242 L 62 290" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="20" y="290" width="84" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="62" y="311" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">cnt += 1</text>

  <!-- 否 → ans -->
  <text x="186" y="234" font-size="11" fill="#a03a36">否</text>
  <path d="M 178 242 L 178 290" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="136" y="290" width="84" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="178" y="311" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a36">ans += cnt</text>

  <!-- 汇合到 i++ -->
  <path d="M 62 322 L 62 346 L 108 346" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 178 322 L 178 346 L 192 346" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="110" y="331" width="80" height="30" rx="4" fill="#fdfcf7" stroke="#3a3a3a" stroke-width="1.4"/></g>
  <text x="150" y="351" text-anchor="middle" font-size="12.5" fill="#333">i += 1</text>

  <!-- 回边 -->
  <path d="M 150 361 L 150 396 L 14 396 L 14 168 L 58 168" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="84" y="390" font-size="10.5" fill="#4a8edb">继续下一字符</text>

  <!-- 右侧说明面板 -->
  <g filter="url(#sk)"><rect x="372" y="54" width="240" height="330" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="388" y="80" font-size="14" font-weight="bold" fill="#2b6e9e">两个计数器</text>

  <g filter="url(#sk)"><rect x="388" y="94" width="208" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="398" y="113" font-size="11.5" font-weight="bold" fill="#2e6e2e">cnt：已扫过前缀里 1 的个数</text>
  <text x="398" y="131" font-size="10.5" fill="#555">即「当前位置左侧的黑球总数」</text>

  <g filter="url(#sk)"><rect x="388" y="148" width="208" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="398" y="167" font-size="11.5" font-weight="bold" fill="#a03a36">ans：逆序对累加器</text>
  <text x="398" y="185" font-size="10.5" fill="#555">每遇到一个 0 就把 cnt 收进来</text>

  <g filter="url(#sk)"><rect x="388" y="202" width="208" height="58" rx="6" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="398" y="221" font-size="11" fill="#444">遇 '0' 时 ans += cnt：</text>
  <text x="398" y="238" font-size="10.5" fill="#555">这个 0 左边每个黑球都得</text>
  <text x="398" y="254" font-size="10.5" fill="#555">与它交错一次，各贡献一步</text>

  <g filter="url(#sk)"><rect x="388" y="268" width="208" height="58" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="398" y="287" font-size="11.5" font-weight="bold" fill="#a05a15">⚠ 溢出：D 最大 ≈ n²/4</text>
  <text x="398" y="304" font-size="10.5" fill="#555">n = 10⁵ 时约 2.5×10⁹，超 int32</text>
  <text x="398" y="320" font-size="10.5" fill="#555">C++ 全程用 long long</text>

  <text x="492" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">读入即计数：一趟 O(n)，空间 O(1)</text>

  <text x="320" y="410" text-anchor="middle" font-size="12" fill="#888">别模拟怎么换——每个 0 只需知道左边有几个 1</text>
</svg>
