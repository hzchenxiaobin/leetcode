<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 425"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="425" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">奇数组成数 c(n) 满足斐波那契递推</text>
  <text x="260" y="47" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">以 n = 5 为例：c(5) = 5 = c(4) + c(3) = 3 + 2</text>

  <!-- 上区：首项 = 1 -->
  <text x="95" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">c(5) 中首项 = 1 的</text>
  <rect x="40" y="86" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="95" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1+3+1</text>
  <rect x="40" y="116" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="95" y="133" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1+1+3</text>
  <rect x="40" y="146" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="95" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1+1+1+1+1</text>

  <path d="M 155 98 L 325 98" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 155 128 L 325 128" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 155 158 L 325 158" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="240" y="92" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">删去首 1</text>

  <text x="415" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">得到 c(4) 的组成</text>
  <rect x="330" y="86" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3+1</text>
  <rect x="330" y="116" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="133" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1+3</text>
  <rect x="330" y="146" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1+1+1+1</text>

  <!-- 下区：首项 >= 3 -->
  <text x="95" y="205" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c(5) 中首项 ≥ 3 的</text>
  <rect x="40" y="215" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="95" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="40" y="245" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="95" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3+1+1</text>

  <path d="M 155 227 L 325 227" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 155 257 L 325 257" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="240" y="221" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">首项 − 2</text>

  <text x="415" y="205" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">得到 c(3) 的组成</text>
  <rect x="330" y="215" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="330" y="245" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1+1+1</text>

  <text x="260" y="293" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">首项是奇数：非 1 即 ≥ 3，两类不交不漏，映射均可逆 → 双射</text>

  <rect x="55" y="308" width="410" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">c(n) = c(n−1) + c(n−2)，c(1) = c(2) = 1</text>
  <text x="260" y="354" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">⟹ c(n) = F(n)（斐波那契数）</text>
  <text x="260" y="380" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 2 × F(n) mod 1e9+7</text>
  <text x="260" y="397" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">（乘 2：游程序列固定后，首字符选 a 或 b）</text>
</svg>
