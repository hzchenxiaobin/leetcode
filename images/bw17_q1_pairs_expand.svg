<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="110"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">两两配对 (freq, val)：nums = [1, 2, 3, 4]</text>

  <!-- 输入序列 -->
  <g filter="url(#rough2)">
    <rect x="120" y="60" width="60" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="184" y="60" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="272" y="60" width="60" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="336" y="60" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="150" y="86" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="214" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="302" y="86" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="366" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="150" y="120" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">freq</text>
  <text x="214" y="120" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">val</text>
  <text x="302" y="120" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">freq</text>
  <text x="366" y="120" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">val</text>

  <!-- 分组框 -->
  <rect x="108" y="52" width="144" height="74" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <rect x="260" y="52" width="144" height="74" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="180" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">第 0 对 [1,2]</text>
  <text x="332" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">第 1 对 [3,4]</text>

  <!-- 展开箭头 -->
  <path d="M 180 152 C 180 178, 140 186, 120 198" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 332 152 C 332 186, 300 200, 268 214" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <text x="60" y="222" font-size="13" fill="#666" filter="url(#rough2)">输出：</text>
  <g filter="url(#rough2)">
    <rect x="116" y="206" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="176" y="206" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="236" y="206" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="296" y="206" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="142" y="231" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="202" y="231" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="262" y="231" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="322" y="231" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="142" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 个 2</text>
  <text x="262" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 个 4</text>

  <!-- 说明框 -->
  <rect x="90" y="284" width="460" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="302" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">偶数下标（0,2,4,…）永远是 freq，奇数下标永远是 val——</text>
  <text x="320" y="320" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">i 从 0 开始、每次跨 2，就不会站错位置</text>
</svg>
