<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：num = "1234"，t = 256 = 2^8，mm = 3</text>

  <g font-size="11.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="54" y="60">p</text>
    <text x="122" y="60">保留前缀</text>
    <text x="206" y="60">试 dg</text>
    <text x="300" y="60">剩余需求</text>
    <text x="380" y="60">后缀位数 L</text>
    <text x="452" y="60">可用位</text>
    <text x="516" y="60">结论</text>
  </g>
  <path d="M 24 70 L 540 70" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="54" y="94">3</text><text x="122" y="94">123</text><text x="206" y="94">5</text>
    <text x="300" y="94">2^7·5^1</text><text x="380" y="94">3+1=4</text><text x="452" y="94">0</text>
    <text x="516" y="94" fill="#b85450">✗</text>

    <text x="54" y="122">3</text><text x="122" y="122">123</text><text x="206" y="122">8</text>
    <text x="300" y="122">2^4</text><text x="380" y="122">2</text><text x="452" y="122">0</text>
    <text x="516" y="122" fill="#b85450">✗</text>

    <text x="54" y="150">2</text><text x="122" y="150">12</text><text x="206" y="150">4</text>
    <text x="300" y="150">2^5</text><text x="380" y="150">2</text><text x="452" y="150">1</text>
    <text x="516" y="150" fill="#b85450">✗</text>

    <text x="54" y="178">2</text><text x="122" y="178">12</text><text x="206" y="178">8</text>
    <text x="300" y="178">2^4</text><text x="380" y="178">2</text><text x="452" y="178">1</text>
    <text x="516" y="178" fill="#b85450">✗</text>

    <text x="54" y="206">1</text><text x="122" y="206">1</text><text x="206" y="206">3</text>
    <text x="300" y="206">2^8</text><text x="380" y="206">3</text><text x="452" y="206">2</text>
    <text x="516" y="206" fill="#b85450">✗</text>
  </g>

  <!-- 命中行 -->
  <rect x="24" y="216" width="516" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <g font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="54" y="238">1</text><text x="122" y="238">1</text><text x="206" y="238">4</text>
    <text x="300" y="238">2^6</text><text x="380" y="238">2</text><text x="452" y="238">2</text>
    <text x="516" y="238" fill="#4a7a3a">✓</text>
  </g>

  <!-- 结果拼装 -->
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">拼接："1" + "4" + 补 0 个 "1" + "88"</text>

  <g filter="url(#rough2)">
    <rect x="150" y="288" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="214" y="288" width="60" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
    <rect x="278" y="288" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="342" y="288" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g font-size="15" text-anchor="middle" filter="url(#rough2)">
    <text x="180" y="312" fill="#333">1</text>
    <text x="244" y="312" fill="#333" font-weight="bold">4</text>
    <text x="308" y="312" fill="#333">8</text>
    <text x="372" y="312" fill="#333">8</text>
  </g>
  <text x="446" y="312" font-size="13" fill="#4a7a3a" filter="url(#rough2)">= "1488"</text>

  <text x="280" y="348" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">1 × 4 × 8 × 8 = 256，且 1488 ≥ 1234，无零</text>
</svg>
