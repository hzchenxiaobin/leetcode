<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="360" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1：mat = [[1,2],[3,4]] 的转移明细</text>
  <rect x="24" y="58" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="89" y="78" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">上一状态</text>
  <rect x="162" y="58" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="207" y="78" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[g]</text>
  <rect x="260" y="58" width="170" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="345" y="78" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">与 v=3 合成</text>
  <rect x="438" y="58" width="158" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="517" y="78" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">与 v=4 合成</text>
  <rect x="24" y="96" width="130" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="89" y="124" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">g=1</text>
  <rect x="162" y="96" width="90" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="207" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="260" y="96" width="170" height="44" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="345" y="124" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">gcd(1,3)=1</text>
  <rect x="438" y="96" width="158" height="44" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="517" y="124" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">gcd(1,4)=1</text>
  <rect x="24" y="146" width="130" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="89" y="174" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">g=2</text>
  <rect x="162" y="146" width="90" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="207" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="260" y="146" width="170" height="44" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="345" y="174" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">gcd(2,3)=1</text>
  <rect x="438" y="146" width="158" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="517" y="174" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">gcd(2,4)=2</text>
  <rect x="24" y="202" width="572" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="228" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">汇总：ndp[1] = 1 + 1 + 1 = 3，ndp[2] = 1 → 答案 dp[1] = 3</text>
  <rect x="24" y="256" width="572" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="280" text-anchor="start" font-size="10" fill="#8a6a20" filter="url(#rough2)">示例 2：[[2,2],[2,2]] → 第一行 dp[2]=2；第二行 gcd(2,2)=2 → ndp[2]=4，dp[1]=0</text>
  <text x="42" y="302" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">示例 3：[[1,1],[1,1]] → dp[1]=2 后 ndp[1]=4 → 答案 4</text>
</svg>
