<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：n = 6 的环（示例 2）</text>
  <path d="M 140 38 Q 290 46 440 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 左：六边形环，环序 0-3-1-5-4-2 -->
  <g filter="url(#rough2)">
    <polygon points="165,145 242.9,190 242.9,280 165,325 87.1,280 87.1,190"
             fill="none" stroke="#888" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- 边乘积标注 -->
  <text x="212" y="160" text-anchor="middle" font-size="12" fill="#555">1·3</text>
  <text x="256" y="237" text-anchor="middle" font-size="12" fill="#555">3·5</text>
  <text x="212" y="313" text-anchor="middle" font-size="12" fill="#555">5·6</text>
  <text x="118" y="313" text-anchor="middle" font-size="12" fill="#555">6·4</text>
  <text x="74" y="237" text-anchor="middle" font-size="12" fill="#555">4·2</text>
  <text x="118" y="160" text-anchor="middle" font-size="12" fill="#555">2·1</text>

  <!-- 节点：值在圆内，编号在外 -->
  <g filter="url(#rough2)"><circle cx="165" cy="145" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="165" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">1</text>
  <text x="165" y="122" text-anchor="middle" font-size="11" fill="#888">节点 0</text>

  <g filter="url(#rough2)"><circle cx="242.9" cy="190" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="242.9" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">3</text>
  <text x="272" y="180" text-anchor="middle" font-size="11" fill="#888">节点 3</text>

  <g filter="url(#rough2)"><circle cx="242.9" cy="280" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="242.9" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">5</text>
  <text x="272" y="296" text-anchor="middle" font-size="11" fill="#888">节点 1</text>

  <g filter="url(#rough2)"><circle cx="165" cy="325" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="165" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415">6</text>
  <text x="165" y="361" text-anchor="middle" font-size="11" fill="#888">节点 5（峰值）</text>

  <g filter="url(#rough2)"><circle cx="87.1" cy="280" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="87.1" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a7a">4</text>
  <text x="60" y="296" text-anchor="middle" font-size="11" fill="#888">节点 4</text>

  <g filter="url(#rough2)"><circle cx="87.1" cy="190" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="87.1" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a7a">2</text>
  <text x="60" y="180" text-anchor="middle" font-size="11" fill="#888">节点 2</text>

  <!-- 右：邻接表 -->
  <g filter="url(#rough2)"><rect x="330" y="58" width="240" height="94" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="450" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a7a">邻接表（按输入序）</text>
  <text x="365" y="104" font-size="12" fill="#3a5a7a">0:{3,2}</text>
  <text x="365" y="122" font-size="12" fill="#3a5a7a">3:{0,1}</text>
  <text x="365" y="140" font-size="12" fill="#3a5a7a">1:{3,5}</text>
  <text x="470" y="104" font-size="12" fill="#3a5a7a">5:{1,4}</text>
  <text x="470" y="122" font-size="12" fill="#3a5a7a">4:{5,2}</text>
  <text x="470" y="140" font-size="12" fill="#3a5a7a">2:{4,0}</text>

  <!-- 右：贴值表 -->
  <g filter="url(#rough2)"><rect x="330" y="166" width="240" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="450" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">按环序 0-3-1-5-4-2 贴值</text>
  <g filter="url(#rough2)">
    <rect x="338" y="198" width="224" height="26" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="338" y="228" width="224" height="26" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
  </g>
  <text x="352" y="215" font-size="12" fill="#2e5e2e">位置</text>
  <text x="352" y="245" font-size="12" fill="#2e5e2e">贴值</text>
  <text x="400" y="215" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="432" y="215" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="464" y="215" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="496" y="215" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="528" y="215" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="552" y="215" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="400" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">1</text>
  <text x="432" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">3</text>
  <text x="464" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">5</text>
  <text x="496" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">6</text>
  <text x="528" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a7a">4</text>
  <text x="552" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a7a">2</text>

  <!-- 右：求和 -->
  <g filter="url(#rough2)"><rect x="330" y="280" width="240" height="98" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="450" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">沿环序逐边求和</text>
  <text x="450" y="328" text-anchor="middle" font-size="13" fill="#8a6415">3 + 15 + 30 + 24 + 8 + 2</text>
  <text x="450" y="360" text-anchor="middle" font-size="22" font-weight="bold" fill="#a03a36">= 82</text>

  <text x="290" y="412" text-anchor="middle" font-size="12" fill="#555">路径（示例 1）同法：链 0-1-2-3 贴 [1,3,4,2]，1·3 + 3·4 + 4·2 = 23</text>
</svg>
