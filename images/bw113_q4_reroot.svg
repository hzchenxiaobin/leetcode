<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">换根一步：父子边含义翻转，其余不变</text>

  <!-- 左树：根 = x -->
  <text x="120" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">根 = x</text>
  <ellipse cx="120" cy="96" rx="26" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">x</text>
  <ellipse cx="120" cy="190" rx="26" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="196" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">y</text>
  <ellipse cx="52" cy="262" rx="22" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y 的子树</text>
  <ellipse cx="196" cy="262" rx="22" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="196" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y 的子树</text>
  <path d="M 120 118 L 120 168" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="146" y="146" font-size="12" fill="#446688" filter="url(#rough2)">需 x→y 方向</text>
  <path d="M 106 208 C 88 226, 74 236, 64 246" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 134 208 C 152 226, 168 236, 178 246" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 中间箭头 -->
  <path d="M 208 150 C 240 130, 280 130, 312 150" fill="none" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">根从 x 换到 y</text>

  <!-- 右树：根 = y -->
  <text x="400" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">根 = y</text>
  <ellipse cx="400" cy="96" rx="26" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">y</text>
  <ellipse cx="400" cy="190" rx="26" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="196" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x</text>
  <ellipse cx="330" cy="262" rx="22" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x 的子树</text>
  <ellipse cx="472" cy="262" rx="22" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="472" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x 的子树</text>
  <path d="M 400 118 L 400 168" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="366" y="146" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">需 y→x 方向</text>
  <path d="M 386 208 C 368 226, 352 236, 342 246" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 414 208 C 432 226, 448 236, 458 246" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 底部公式 -->
  <rect x="36" y="286" width="448" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans[y] = ans[x] − cost(x→y) + cost(y→x)，即 ±1</text>
</svg>
