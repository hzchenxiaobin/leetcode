<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">g 个组，每组两个去向 → 2^g 种方案</text>

  <!-- 两个组 -->
  <ellipse cx="150" cy="120" rx="90" ry="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="114" text-anchor="middle" font-size="14" fill="#2f5527" filter="url(#rough2)">第 1 组</text>
  <text x="150" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[1,3] [2,5] [4,8]</text>

  <ellipse cx="380" cy="120" rx="84" ry="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="114" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">第 2 组</text>
  <text x="380" y="134" text-anchor="middle" font-size="12" fill="#a07518" filter="url(#rough2)">[10,20]</text>

  <!-- 每组的两个选择 -->
  <path d="M 100 152 C 90 176 84 190 80 206" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 200 152 C 214 178 222 192 228 206" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 336 152 C 328 176 324 190 320 206" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 424 152 C 438 178 446 192 452 206" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="48" y="208" width="64" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="226" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">进第1组</text>
  <rect x="196" y="208" width="64" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="226" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">进第2组</text>
  <rect x="288" y="208" width="64" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="226" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">进第1组</text>
  <rect x="436" y="208" width="64" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="226" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">进第2组</text>

  <text x="260" y="262" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">两组互不相交，选择相互独立</text>
  <path d="M 180 268 L 330 268" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="284" width="300" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="15" fill="#8c3a36" filter="url(#rough2)">方案数 = 2 × 2 = 2^g = 4 ✓</text>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">（g 可达 10⁵，需快速幂 + 取模 10⁹+7）</text>
</svg>
