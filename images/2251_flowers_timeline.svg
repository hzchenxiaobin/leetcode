<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="201" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：花期是闭区间 → 盛开数是时间轴上的阶梯</text>
  <path d="M 150 38 Q 330 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- people arrival lines -->
  <g stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#sk)">
    <line x1="104" y1="70" x2="104" y2="248"/>
    <line x1="138" y1="70" x2="138" y2="248"/>
    <line x1="274" y1="70" x2="274" y2="248"/>
    <line x1="410" y1="70" x2="410" y2="248"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="104" cy="56" r="4.5" fill="#b85450"/>
    <circle cx="138" cy="56" r="4.5" fill="#b85450"/>
    <circle cx="274" cy="56" r="4.5" fill="#b85450"/>
    <circle cx="410" cy="56" r="4.5" fill="#b85450"/>
    <text x="104" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">人 t=2</text>
    <text x="138" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">人 t=3</text>
    <text x="274" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">人 t=7</text>
    <text x="410" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">人 t=11</text>
  </g>

  <!-- flower bars (closed intervals, endpoints as dots) -->
  <g filter="url(#sk)">
    <rect x="70" y="76" width="170" height="24" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="70" cy="88" r="4" fill="#446688"/>
    <circle cx="240" cy="88" r="4" fill="#446688"/>
    <text x="62" y="93" text-anchor="end" font-size="12" font-weight="bold" fill="#446688">花0</text>
    <text x="250" y="93" font-size="11.5" fill="#446688">[1,6]</text>
  </g>
  <g filter="url(#sk)">
    <rect x="138" y="112" width="136" height="24" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="138" cy="124" r="4" fill="#4a7a3a"/>
    <circle cx="274" cy="124" r="4" fill="#4a7a3a"/>
    <text x="130" y="129" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a">花1</text>
    <text x="284" y="129" font-size="11.5" fill="#4a7a3a">[3,7]</text>
  </g>
  <g filter="url(#sk)">
    <rect x="342" y="148" width="102" height="24" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="342" cy="160" r="4" fill="#d6a040"/>
    <circle cx="444" cy="160" r="4" fill="#d6a040"/>
    <text x="334" y="165" text-anchor="end" font-size="12" font-weight="bold" fill="#8a6415">花2</text>
    <text x="454" y="165" font-size="11.5" fill="#8a6415">[9,12]</text>
  </g>
  <g filter="url(#sk)">
    <rect x="172" y="184" width="306" height="24" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="172" cy="196" r="4" fill="#b85450"/>
    <circle cx="478" cy="196" r="4" fill="#b85450"/>
    <text x="164" y="201" text-anchor="end" font-size="12" font-weight="bold" fill="#8f3a35">花3</text>
    <text x="488" y="201" font-size="11.5" fill="#8f3a35">[4,13]</text>
  </g>

  <!-- answer bubbles on each person line -->
  <g filter="url(#sk)">
    <ellipse cx="104" cy="234" rx="11" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <ellipse cx="138" cy="234" rx="11" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <ellipse cx="274" cy="234" rx="11" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <ellipse cx="410" cy="234" rx="11" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="104" y="238.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3a35">1</text>
    <text x="138" y="238.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3a35">2</text>
    <text x="274" y="238.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3a35">2</text>
    <text x="410" y="238.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3a35">2</text>
  </g>

  <!-- time axis -->
  <line x1="50" y1="258" x2="545" y2="258" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#sk)"/>
  <g font-size="10.5" fill="#555" text-anchor="middle" filter="url(#sk)">
    <text x="70" y="274">1</text><text x="104" y="274">2</text><text x="138" y="274">3</text>
    <text x="172" y="274">4</text><text x="206" y="274">5</text><text x="240" y="274">6</text>
    <text x="274" y="274">7</text><text x="308" y="274">8</text><text x="342" y="274">9</text>
    <text x="376" y="274">10</text><text x="410" y="274">11</text><text x="444" y="274">12</text>
    <text x="478" y="274">13</text><text x="512" y="274">14</text>
  </g>
  <text x="556" y="262" font-size="11.5" fill="#555" filter="url(#sk)">t →</text>

  <!-- event boxes -->
  <g filter="url(#sk)">
    <rect x="40" y="292" width="285" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="182" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">开花事件：start 时刻 +1</text>
  <text x="182" y="328" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#sk)">+1 @ {1, 3, 4, 9}</text>
  <g filter="url(#sk)">
    <rect x="340" y="292" width="285" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="482" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a35" filter="url(#sk)">谢花事件：end + 1 时刻 −1</text>
  <text x="482" y="328" text-anchor="middle" font-size="11" fill="#8f3a35" filter="url(#sk)">−1 @ {7, 8, 13, 14}，注意不是 end！</text>

  <!-- t=7 callout -->
  <g filter="url(#sk)">
    <rect x="40" y="352" width="585" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="332" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">t = 7 恰落在花1 的 end 上：闭区间，当天仍盛开 ✓</text>
  <text x="332" y="391" text-anchor="middle" font-size="12" fill="#8a6415" filter="url(#sk)">花0 [1,6] ✗ 已谢 · 花1 [3,7] ✓ 在开 · 花2 [9,12] ✗ 未开 → 答案 2</text>

  <!-- staircase summary -->
  <g filter="url(#sk)">
    <rect x="40" y="416" width="585" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="332" y="442" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">盛开数只在事件点跳变，两个事件之间恒定 —— 一条阶梯函数</text>
</svg>
