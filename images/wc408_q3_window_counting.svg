<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">固定 L 与 0 的个数 z：两条约束夹出合法右端点 R</text>
  <path d="M 190 40 Q 380 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="700" y="52" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">蓝 = 1　橙 = 0</text>

  <!-- ===== L marker ===== -->
  <text x="218" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">左端点 L = 2</text>
  <line x1="218" y1="54" x2="218" y2="64" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== cells ===== -->
  <g filter="url(#rough2)">
    <rect x="60"  y="68" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="124" y="68" width="60" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="188" y="68" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="252" y="68" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="316" y="68" width="60" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="380" y="68" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="444" y="68" width="60" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="508" y="68" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="572" y="68" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="636" y="68" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="90"  y="91" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="154" y="91" text-anchor="middle" font-size="13" fill="#a07820" filter="url(#rough2)">0</text>
  <text x="218" y="91" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="282" y="91" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="346" y="91" text-anchor="middle" font-size="13" fill="#a07820" filter="url(#rough2)">0</text>
  <text x="410" y="91" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="474" y="91" text-anchor="middle" font-size="13" fill="#a07820" filter="url(#rough2)">0</text>
  <text x="538" y="91" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="602" y="91" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="666" y="91" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>

  <!-- index labels -->
  <text x="90"  y="112" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">0</text>
  <text x="154" y="112" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">1</text>
  <text x="218" y="112" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">2</text>
  <text x="282" y="112" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">3</text>
  <text x="346" y="112" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">4</text>
  <text x="410" y="112" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">5</text>
  <text x="474" y="112" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">6</text>
  <text x="538" y="112" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">7</text>
  <text x="602" y="112" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">8</text>
  <text x="666" y="112" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">9</text>

  <!-- ===== marker lane ===== -->
  <text x="346" y="143" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">Z₁ = 4</text>
  <text x="474" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">Z₂ = 6</text>
  <text x="538" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">Q₄ = 7</text>
  <text x="735" y="143" text-anchor="end" font-size="10" fill="#999999" filter="url(#rough2)">Z₃ 不存在 ⇒ r2 = n−1 = 9</text>

  <!-- dashed guides -->
  <line x1="474" y1="150" x2="474" y2="306" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="538" y1="150" x2="538" y2="306" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="696" y1="150" x2="696" y2="306" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== bar 1: zeros window ===== -->
  <g filter="url(#rough2)">
    <rect x="444" y="190" width="252" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="70" y="207" font-size="11" fill="#446688" filter="url(#rough2)">① 0 恰有 z = 2 个 ⟹ R ∈ [Z₂, r2] = [6, 9]</text>

  <!-- ===== bar 2: ones lower bound ===== -->
  <g filter="url(#rough2)">
    <rect x="508" y="228" width="196" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <line x1="704" y1="241" x2="726" y2="241" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="70" y="245" font-size="11" fill="#2e6e2e" filter="url(#rough2)">② 1 至少 z² = 4 个 ⟹ R ≥ Q₄ = 7（无上界）</text>

  <!-- ===== bar 3: intersection ===== -->
  <g filter="url(#rough2)">
    <rect x="508" y="266" width="188" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="602" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">有效 R = [7, 9]</text>
  <text x="70" y="286" font-size="11" font-weight="bold" fill="#a07820" filter="url(#rough2)">③ 交集 → 个数 = r2 − max(r1, Q₄) + 1 = 9 − 7 + 1 = 3</text>

  <!-- ===== formula box ===== -->
  <g filter="url(#rough2)">
    <rect x="50" y="322" width="660" height="86" rx="10" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="380" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" filter="url(#rough2)">每对 (L, z) 的贡献公式</text>
  <text x="380" y="367" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">贡献 = max(0, r2 − max(r1, Q<tspan dy="3" font-size="9">z²</tspan><tspan dy="-3">) + 1)，z = 0 时无 Q 约束</tspan></text>
  <text x="380" y="387" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">r1 = Z<tspan dy="3" font-size="9">z</tspan><tspan dy="-3">（L 起第 z 个 0 的位置；z = 0 时 r1 = L）</tspan></text>
  <text x="380" y="403" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">r2 = Z<tspan dy="3" font-size="9">z+1</tspan><tspan dy="-3"> − 1（第 z+1 个 0 不存在则 r2 = n−1）</tspan></text>
</svg>
