<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">示例 1：piles = [3,6,7,11]，h = 8，二分 k ∈ [1, 11]</text>

  <!-- 步骤表 -->
  <rect x="24" y="48" width="612" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="68" font-size="11" fill="#2c4a63" filter="url(#rough2)">轮次</text>
  <text x="120" y="68" font-size="11" fill="#2c4a63" filter="url(#rough2)">lo, hi</text>
  <text x="220" y="68" font-size="11" fill="#2c4a63" filter="url(#rough2)">mid</text>
  <text x="300" y="68" font-size="11" fill="#2c4a63" filter="url(#rough2)">各堆小时数</text>
  <text x="520" y="68" font-size="11" fill="#2c4a63" filter="url(#rough2)">总耗时 vs 8</text>
  <text x="616" y="68" font-size="11" fill="#2c4a63" filter="url(#rough2)">动作</text>

  <rect x="24" y="80" width="612" height="30" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="100" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="120" y="100" font-size="11" fill="#444" filter="url(#rough2)">1, 11</text>
  <text x="228" y="100" font-size="11" fill="#444" filter="url(#rough2)">6</text>
  <text x="300" y="100" font-size="11" fill="#444" filter="url(#rough2)">1+1+2+2</text>
  <text x="520" y="100" font-size="11" fill="#b85450" filter="url(#rough2)">6 ≤ 8 ✓</text>
  <text x="600" y="100" font-size="11" fill="#444" filter="url(#rough2)">hi=6</text>

  <rect x="24" y="112" width="612" height="30" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="132" font-size="11" fill="#444" filter="url(#rough2)">2</text>
  <text x="120" y="132" font-size="11" fill="#444" filter="url(#rough2)">1, 6</text>
  <text x="228" y="132" font-size="11" fill="#444" filter="url(#rough2)">3</text>
  <text x="300" y="132" font-size="11" fill="#444" filter="url(#rough2)">1+2+3+4</text>
  <text x="520" y="132" font-size="11" fill="#b85450" filter="url(#rough2)">10 &gt; 8 ✗</text>
  <text x="596" y="132" font-size="11" fill="#444" filter="url(#rough2)">lo=4</text>

  <rect x="24" y="144" width="612" height="30" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="164" font-size="11" fill="#444" filter="url(#rough2)">3</text>
  <text x="120" y="164" font-size="11" fill="#444" filter="url(#rough2)">4, 6</text>
  <text x="228" y="164" font-size="11" fill="#444" filter="url(#rough2)">5</text>
  <text x="300" y="164" font-size="11" fill="#444" filter="url(#rough2)">1+2+2+3</text>
  <text x="520" y="164" font-size="11" fill="#b85450" filter="url(#rough2)">8 ≤ 8 ✓</text>
  <text x="600" y="164" font-size="11" fill="#444" filter="url(#rough2)">hi=5</text>

  <rect x="24" y="176" width="612" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="196" font-size="11" fill="#8a6410" filter="url(#rough2)">4</text>
  <text x="120" y="196" font-size="11" fill="#8a6410" filter="url(#rough2)">4, 5</text>
  <text x="228" y="196" font-size="11" fill="#8a6410" filter="url(#rough2)">4</text>
  <text x="300" y="196" font-size="11" fill="#8a6410" filter="url(#rough2)">1+2+2+3</text>
  <text x="520" y="196" font-size="11" fill="#4a7a3a" filter="url(#rough2)">8 ≤ 8 ✓</text>
  <text x="600" y="196" font-size="11" fill="#8a6410" filter="url(#rough2)">hi=4</text>

  <text x="24" y="238" font-size="12" fill="#333" filter="url(#rough2)">lo == hi == 4，二分结束，返回 4</text>

  <!-- 判定公式 -->
  <rect x="24" y="256" width="300" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="174" y="280" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">单堆耗时（向上取整）</text>
  <text x="174" y="308" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">⌈p / k⌉ = (p + k − 1) / k</text>
  <text x="174" y="334" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">注意是整除（向下取整）实现</text>

  <rect x="340" y="256" width="296" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="488" y="280" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">判定单调的理由</text>
  <text x="488" y="306" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">k 增大 ⇒ 每堆耗时 ⌈p/k⌉ 不增</text>
  <text x="488" y="328" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">⇒ 总耗时不增 ⇒ 「可行」是后缀</text>

  <text x="24" y="378" font-size="11" fill="#666" filter="url(#rough2)">mid = lo + (hi − lo) / 2 可以避免 lo + hi 溢出；本题 lo、hi ≤ 1e9 用 int 也安全</text>
</svg>
