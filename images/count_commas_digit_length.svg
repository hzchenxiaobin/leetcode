<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">逗号数只由位数决定</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="70" y="58" width="500" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <line x1="170" y1="58" x2="170" y2="88" stroke="#4a8edb" stroke-width="1.2"/>
    <line x1="410" y1="58" x2="410" y2="88" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="120" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">位数 L</text>
  <text x="290" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">数值范围</text>
  <text x="505" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">逗号数 ⌊(L−1)/3⌋</text>

  <!-- row 1: L = 1~3 -->
  <g filter="url(#sk2)">
    <rect x="70" y="88" width="500" height="32" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <line x1="170" y1="88" x2="170" y2="120" stroke="#9db8cc" stroke-width="1"/>
    <line x1="410" y1="88" x2="410" y2="120" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <text x="120" y="109" text-anchor="middle" font-size="13" fill="#444">1 ~ 3</text>
  <text x="290" y="109" text-anchor="middle" font-size="13" fill="#444">1 ~ 999</text>
  <text x="505" y="109" text-anchor="middle" font-size="13" fill="#444">0</text>

  <!-- row 2: L = 4~6 (highlighted) -->
  <g filter="url(#sk2)">
    <rect x="70" y="120" width="500" height="32" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <line x1="170" y1="120" x2="170" y2="152" stroke="#c98a2b" stroke-width="1.2"/>
    <line x1="410" y1="120" x2="410" y2="152" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="120" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">4 ~ 6</text>
  <text x="290" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">1,000 ~ 999,999</text>
  <text x="505" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>

  <!-- row 3: L = 7~9 -->
  <g filter="url(#sk2)">
    <rect x="70" y="152" width="500" height="32" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <line x1="170" y1="152" x2="170" y2="184" stroke="#9db8cc" stroke-width="1"/>
    <line x1="410" y1="152" x2="410" y2="184" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <text x="120" y="173" text-anchor="middle" font-size="13" fill="#444">7 ~ 9</text>
  <text x="290" y="173" text-anchor="middle" font-size="13" fill="#444">1,000,000 ~ 999,999,999</text>
  <text x="505" y="173" text-anchor="middle" font-size="13" fill="#444">2</text>

  <!-- annotation arrow to row 2 -->
  <path d="M 380 214 Q 440 206 492 158" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="330" y="226" text-anchor="middle" font-size="12" fill="#b85450">本题 n ≤ 100000（最多 6 位）→ 只有第二行出现，逗号数恒为 1</text>

  <!-- segmentation -->
  <text x="80" y="258" font-size="13" font-weight="bold" fill="#2b2b2b">把 [1, n] 按逗号情况分段：</text>
  <g filter="url(#sk)">
    <rect x="70" y="272" width="190" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="165" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1 ~ 999</text>
  <text x="165" y="316" text-anchor="middle" font-size="12" fill="#2e6e2e">0 个逗号</text>
  <path d="M 270 301 L 296 301" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="304" y="272" width="266" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="437" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1000 ~ n（n ≤ 100000）</text>
  <text x="437" y="316" text-anchor="middle" font-size="12" fill="#2b6e9e">每个数恰 1 个逗号</text>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="120" y="348" width="400" height="50" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="371" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">ans = max(0, n − 999)</text>
  <text x="320" y="390" text-anchor="middle" font-size="11" fill="#888">即区间 [1000, n] 内的整数个数</text>
</svg>
