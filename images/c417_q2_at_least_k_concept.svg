<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：答案 = g(k) − g(k+1)，其中 g(m) = 「5 元音齐 + 辅音 ≥ m」</text>

  <!-- 嵌套集合图 -->
  <ellipse cx="140" cy="112" rx="118" ry="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="152" cy="118" rx="64" ry="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="112" y="70" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g(k)：元音齐 且 辅音 ≥ k</text>
  <text x="152" y="122" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">g(k+1)</text>
  <text x="152" y="138" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">辅音 ≥ k+1</text>

  <!-- 差集标注 -->
  <path d="M 96 132 C 70 148, 78 170, 108 166" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="62" y="185" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">月牙差集 = 辅音恰好 k</text>

  <!-- 公式框 -->
  <rect x="296" y="58" width="196" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="394" y="80" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">answer = g(k) − g(k+1)</text>
  <text x="394" y="99" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">容斥：按辅音数分类，N_k = Σ(c≥k) − Σ(c≥k+1)</text>

  <!-- 单调性演示：一行格子，固定 r，l 左移扩张 -->
  <text x="14" y="222" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">「至少」方向：窗口扩张 ⇒ 两条件同向变易</text>
  <rect x="150" y="206" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="222" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">e</text>
  <rect x="176" y="206" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="222" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">c</text>
  <rect x="202" y="206" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="222" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">i</text>
  <rect x="228" y="206" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="222" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">o</text>
  <rect x="254" y="206" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="222" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">u</text>
  <path d="M 163 240 L 163 250 L 279 250 L 279 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="221" y="264" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">窗口变大：元音只增不减 &amp; 辅音只增不减</text>
  <path d="M 320 218 L 292 218" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="362" y="222" font-size="10" fill="#4a7a3a" filter="url(#rough2)">合法左端点 = 前缀 {0..l_max}</text>
  <text x="362" y="238" font-size="10" fill="#4a7a3a" filter="url(#rough2)">贡献 l_max + 1 个，可滑窗 ✓</text>

  <!-- 反例：恰好不单调 -->
  <text x="14" y="298" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">「恰好 k」方向：l 右移会丢掉唯一元音 ⇒ 合法性非单调，不能直接滑窗</text>
  <rect x="60" y="308" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="323" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">a</text>
  <rect x="84" y="308" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="96" y="323" text-anchor="middle" font-size="11" fill="#2a4a22" filter="url(#rough2)">e</text>
  <rect x="108" y="308" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="323" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">c</text>
  <rect x="132" y="308" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="323" text-anchor="middle" font-size="11" fill="#2a4a22" filter="url(#rough2)">i</text>
  <rect x="156" y="308" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="323" text-anchor="middle" font-size="11" fill="#2a4a22" filter="url(#rough2)">o</text>
  <rect x="180" y="308" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="323" text-anchor="middle" font-size="11" fill="#2a4a22" filter="url(#rough2)">u</text>
  <text x="96" y="344" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">[e..u]：k=1 辅音 ✓</text>
  <text x="168" y="344" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">[i..u]：辅音 0 ✗ 且缺 e,a</text>
  <path d="M 112 336 C 130 352, 150 352, 162 338" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 右下要点框 -->
  <rect x="250" y="286" width="256" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="266" y="308" font-size="10" fill="#8a3a36" filter="url(#rough2)">l 从 e 挪到 i：辅音 1→0（破坏"恰好"）</text>
  <text x="266" y="326" font-size="10" fill="#8a3a36" filter="url(#rough2)">l 从 a 挪到 e：丢掉唯一 a（破坏"元音齐"）</text>
  <text x="266" y="344" font-size="10" fill="#8a3a36" filter="url(#rough2)">⇒ 反向 ⇒ 不能套单指针模板，先容斥再滑</text>
</svg>
