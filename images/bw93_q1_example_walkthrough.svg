<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：strs = ["alic3","bob","3","4","00000"]</text>

  <!-- 表头 -->
  <rect x="40" y="48" width="130" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">字符串</text>
  <rect x="170" y="48" width="130" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="235" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">全为数字？</text>
  <rect x="300" y="48" width="100" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">分支</text>
  <rect x="400" y="48" width="80" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">值</text>

  <!-- 行 1：alic3 -->
  <rect x="40" y="86" width="130" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"alic3"</text>
  <rect x="170" y="86" width="130" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="235" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">否（含字母）</text>
  <rect x="300" y="86" width="100" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">长度</text>
  <rect x="400" y="86" width="80" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5 ★</text>

  <!-- 行 2：bob -->
  <rect x="40" y="128" width="130" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"bob"</text>
  <rect x="170" y="128" width="130" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="235" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">否</text>
  <rect x="300" y="128" width="100" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">长度</text>
  <rect x="400" y="128" width="80" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 3："3" -->
  <rect x="40" y="170" width="130" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="192" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"3"</text>
  <rect x="170" y="170" width="130" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="235" y="192" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">是</text>
  <rect x="300" y="170" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">数值</text>
  <rect x="400" y="170" width="80" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="192" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 4："4" -->
  <rect x="40" y="212" width="130" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="234" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"4"</text>
  <rect x="170" y="212" width="130" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="235" y="234" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">是</text>
  <rect x="300" y="212" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">数值</text>
  <rect x="400" y="212" width="80" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="234" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- 行 5："00000" -->
  <rect x="40" y="254" width="130" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="276" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"00000"</text>
  <rect x="170" y="254" width="130" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="235" y="276" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">是（前导零）</text>
  <rect x="300" y="254" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">数值</text>
  <rect x="400" y="254" width="80" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="276" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <!-- 最大值标注 -->
  <path d="M418,86 L418,74 L444,74" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M480,150 Q500,160 484,240" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="320" y="308" width="160" height="36" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="331" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">ans = 5 ✓</text>
  <text x="60" y="330" font-size="12" fill="#666" filter="url(#rough2)">★ 由混合串 "alic3" 贡献</text>
</svg>
