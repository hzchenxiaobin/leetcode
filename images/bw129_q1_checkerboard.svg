<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="80"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">示例 2：棋盘格，四块全是 2:2</text>
  <rect x="55.8" y="96.1" width="44.1" height="44.2" rx="3" fill="#4d4d4d" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="78.0" y="125.0" text-anchor="middle" font-size="22" fill="#ffffff" filter="url(#rough2)">B</text>
  <rect x="99.8" y="95.8" width="43.8" height="43.8" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="122.0" y="125.0" text-anchor="middle" font-size="22" fill="#555555" filter="url(#rough2)">W</text>
  <rect x="144.2" y="95.7" width="44.0" height="43.8" rx="3" fill="#4d4d4d" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="166.0" y="125.0" text-anchor="middle" font-size="22" fill="#ffffff" filter="url(#rough2)">B</text>
  <rect x="55.9" y="140.0" width="44.2" height="44.1" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="78.0" y="169.0" text-anchor="middle" font-size="22" fill="#555555" filter="url(#rough2)">W</text>
  <rect x="99.7" y="139.8" width="43.8" height="44.3" rx="3" fill="#4d4d4d" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="122.0" y="169.0" text-anchor="middle" font-size="22" fill="#ffffff" filter="url(#rough2)">B</text>
  <rect x="144.2" y="140.2" width="44.2" height="44.2" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="166.0" y="169.0" text-anchor="middle" font-size="22" fill="#555555" filter="url(#rough2)">W</text>
  <rect x="56.3" y="184.2" width="43.8" height="44.2" rx="3" fill="#4d4d4d" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="78.0" y="213.0" text-anchor="middle" font-size="22" fill="#ffffff" filter="url(#rough2)">B</text>
  <rect x="100.0" y="184.2" width="44.0" height="44.0" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="122.0" y="213.0" text-anchor="middle" font-size="22" fill="#555555" filter="url(#rough2)">W</text>
  <rect x="143.9" y="184.0" width="43.9" height="43.7" rx="3" fill="#4d4d4d" stroke="#9a9a9a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="166.0" y="213.0" text-anchor="middle" font-size="22" fill="#ffffff" filter="url(#rough2)">B</text>
  <text x="122.0" y="84.0" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">grid</text>
  <text x="316.0" y="92.0" text-anchor="start" font-size="10.5" fill="#888888" filter="url(#rough2)">块位置         计数        结论</text>
  <text x="310.0" y="108.0" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">(0,0)</text>
  <text x="372.0" y="108.0" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">2B 2W</text>
  <text x="452.0" y="108.0" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 仍是 2 色</text>
  <text x="310.0" y="134.0" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">(0,1)</text>
  <text x="372.0" y="134.0" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">2B 2W</text>
  <text x="452.0" y="134.0" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 仍是 2 色</text>
  <text x="310.0" y="160.0" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">(1,0)</text>
  <text x="372.0" y="160.0" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">2B 2W</text>
  <text x="452.0" y="160.0" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 仍是 2 色</text>
  <text x="310.0" y="186.0" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">(1,1)</text>
  <text x="372.0" y="186.0" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">2B 2W</text>
  <text x="452.0" y="186.0" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 仍是 2 色</text>
  <rect x="30.3" y="206.3" width="500.5" height="60.2" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280.0" y="231.0" text-anchor="middle" font-size="11" fill="#7a3b38" filter="url(#rough2)">棋盘格每个 2×2 块都恰好两黑两白，四块一个都不能用</text>
  <text x="280.0" y="249.0" text-anchor="middle" font-size="11" fill="#7a3b38" filter="url(#rough2)">改一格只把某块变成 3:1 —— 永远凑不出 4:0 或 0:4，返回 false</text>
  <text x="280.0" y="288.0" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">注意：改动点 (1,1) 同时属于四块，但它只让每块从 2:2 变 3:1</text>
  <text x="280.0" y="310.0" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">所以「共享格子」并不能救场，逐块判定才是对的</text>
</svg>
