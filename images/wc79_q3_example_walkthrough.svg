<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [9,1,2,3,9]，k = 3</text>
  <text x="280" y="45" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">pre = [0,9,10,12,15,24]，dp[i][j] = 前 i 个数切成恰好 j 段的最大分数</text>

  <rect x="40" y="58" width="72" height="30" fill="#eceff1" stroke="#90a4ae" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="76" y="78" text-anchor="middle" font-size="11" fill="#546e7a" filter="url(#rough2)">i \ j</text>

  <g filter="url(#rough2)">
    <rect x="118" y="58" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="206" y="58" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="294" y="58" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="162" y="79" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">j = 1</text>
    <text x="250" y="79" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">j = 2</text>
    <text x="338" y="79" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">j = 3</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11">
    <rect x="40" y="92" width="72" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="76" y="114" fill="#8a6a20">i = 1</text>
    <rect x="40" y="130" width="72" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="76" y="152" fill="#8a6a20">i = 2</text>
    <rect x="40" y="168" width="72" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="76" y="190" fill="#8a6a20">i = 3</text>
    <rect x="40" y="206" width="72" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="76" y="228" fill="#8a6a20">i = 4</text>
    <rect x="40" y="244" width="72" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="76" y="266" fill="#8a6a20">i = 5</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <rect x="118" y="92" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="206" y="92" width="88" height="34" fill="#eceff1" stroke="#b0bec5" stroke-width="1.2" rx="4"/>
    <rect x="294" y="92" width="88" height="34" fill="#eceff1" stroke="#b0bec5" stroke-width="1.2" rx="4"/>
    <text x="162" y="114" fill="#3a5a30" font-weight="bold">9.00</text>
    <text x="250" y="114" fill="#b0bec5">—</text>
    <text x="338" y="114" fill="#b0bec5">—</text>

    <rect x="118" y="130" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="206" y="130" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="294" y="130" width="88" height="34" fill="#eceff1" stroke="#b0bec5" stroke-width="1.2" rx="4"/>
    <text x="162" y="152" fill="#3a5a30" font-weight="bold">5.00</text>
    <text x="250" y="152" fill="#3a5a30" font-weight="bold">10.00</text>
    <text x="338" y="152" fill="#b0bec5">—</text>

    <rect x="118" y="168" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="206" y="168" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="294" y="168" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="162" y="190" fill="#3a5a30" font-weight="bold">4.00</text>
    <text x="250" y="190" fill="#3a5a30" font-weight="bold">10.50</text>
    <text x="338" y="190" fill="#3a5a30" font-weight="bold">12.00</text>

    <rect x="118" y="206" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="206" y="206" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="294" y="206" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="162" y="228" fill="#3a5a30" font-weight="bold">3.75</text>
    <text x="250" y="228" fill="#3a5a30" font-weight="bold">11.00</text>
    <text x="338" y="228" fill="#3a5a30" font-weight="bold">13.50</text>

    <rect x="118" y="244" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="206" y="244" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="294" y="244" width="88" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="162" y="266" fill="#3a5a30" font-weight="bold">4.80</text>
    <text x="250" y="266" fill="#3a5a30" font-weight="bold">12.75</text>
    <text x="338" y="266" fill="#8a3a36" font-weight="bold">20.00</text>
  </g>

  <rect x="394" y="92" width="150" height="186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#6a5420">
    <text x="406" y="112" font-weight="bold">最终格 dp[5][3]</text>
    <text x="406" y="132">= max( 14.67,</text>
    <text x="406" y="150">　　　　16.50,</text>
    <text x="406" y="168">　　　　20.00 )</text>
    <text x="406" y="190" font-weight="bold" fill="#b85450">= 20.00</text>
    <text x="406" y="212">最后一刀 t = 4</text>
    <text x="406" y="232">尾段 [9]，均值 9</text>
    <text x="406" y="252">前缀 dp[4][2] = 11</text>
    <text x="406" y="270" fill="#999">⇒ 11 + 9 = 20</text>
  </g>

  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">灰色格子 i &lt; j 非法（切不出 j 个非空段），不填、也不参与任何转移</text>
  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每一格 = 枚举最后一刀 t 后取最大；只依赖左边一列（第 j−1 层），可滚动成一维</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">右上角那片灰色三角永远不可达，是划分型 DP 表的典型形状</text>
</svg>
