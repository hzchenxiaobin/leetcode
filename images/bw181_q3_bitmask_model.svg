<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">枚举子集：一个 n 位掩码描述一个诱导子图</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">nums = [1,0,1]，n = 3，掩码从 001 枚举到 111</text>
  <rect x="100" y="84" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="124.0" y="109.04" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="124.0" y="138" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <rect x="188" y="84" width="48" height="40" fill="#f2f2f2" stroke="#999999" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212.0" y="109.04" text-anchor="middle" font-size="14" fill="#999999" font-weight="bold">0</text>
  <text x="212.0" y="138" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <rect x="276" y="84" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300.0" y="109.04" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="300.0" y="138" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="124" y="74" text-anchor="middle" font-size="9.5" fill="#888">下标</text>
  <ellipse cx="170" cy="210" rx="26" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <ellipse cx="280" cy="210" rx="26" ry="26" fill="#f2f2f2" stroke="#999999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#999999" font-weight="bold" filter="url(#rough2)">1</text>
  <ellipse cx="390" cy="210" rx="26" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 196 210 L 254 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 306 210 L 364 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="225" y="200" text-anchor="middle" font-size="9.5" fill="#888">边 0-1</text>
  <text x="335" y="200" text-anchor="middle" font-size="9.5" fill="#888">边 1-2</text>
  <rect x="40" y="258" width="224" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="152" y="286" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">mask = 101 → 子集 {0,2}</text>
  <text x="152" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">只留端点都在子集的边：0 条</text>
  <rect x="296" y="258" width="224" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="408" y="286" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">0 与 2 之间无通路</text>
  <text x="408" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">→ 不连通，不计入答案</text>
  <rect x="40" y="336" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">mask = 111 → 子集 {0,1,2}：两条边都在，连通 ✓，和 = 2 为偶数 → 计入</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">2^13 = 8192 个子集 × O(n) 判定，完全可以直接枚举</text>
</svg>
