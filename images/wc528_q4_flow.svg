<svg xmlns="http://www.w3.org/2000/svg" width="620" height="480" viewBox="0 0 620 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一遍扫描，滚动维护 AND 分段</text>

  <g filter="url(#rough2)">
    <rect x="110" y="48" width="400" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="68" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">读入 v = nums[j]，先更新 last[v] = j</text>
  <text x="310" y="84" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">last 记录每个值最近一次出现的下标</text>

  <path d="M 310 92 L 310 104" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="110" y="106" width="400" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="128" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">所有旧段 x ← x &amp; v，相邻同值段合并</text>
  <text x="310" y="145" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">段用 (x, lo, hi) 表示，按起点升序排列</text>

  <path d="M 310 154 L 310 166" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="110" y="168" width="400" height="48" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="310" y="190" text-anchor="middle" font-size="12" fill="#2e5a24" filter="url(#rough2)">追加单元素段 (v, j, j)；与末段同值则并入</text>
  <text x="310" y="207" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">单元素子数组必然一致，所以 v 段非空</text>

  <path d="M 310 216 L 310 230" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="310,232 404,276 310,320 216,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="310" y="272" text-anchor="middle" font-size="12" fill="#8a6415" filter="url(#rough2)">p = last[x] ≥ lo ？</text>
  <text x="310" y="289" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#rough2)">p 不存在时视为 −1</text>

  <path d="M 250 300 L 158 344" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 300 L 462 344" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="315" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="424" y="315" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="40" y="346" width="220" height="48" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="360" y="346" width="220" height="48" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="150" y="368" text-anchor="middle" font-size="12" fill="#8f3830" filter="url(#rough2)">该段贡献 0</text>
  <text x="150" y="385" text-anchor="middle" font-size="10.5" fill="#8f3830" filter="url(#rough2)">段内没有元素等于 x</text>
  <text x="470" y="368" text-anchor="middle" font-size="12" fill="#2e5a24" filter="url(#rough2)">ans += min(hi, p) − lo + 1</text>
  <text x="470" y="385" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">即 i ∈ [lo, min(hi, p)] 的个数</text>

  <path d="M 150 394 L 250 426" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 394 L 370 426" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="170" y="428" width="280" height="36" rx="9" fill="#eceff1" stroke="#78909c" stroke-width="1.6"/>
  </g>
  <text x="310" y="451" text-anchor="middle" font-size="12" fill="#37474f" filter="url(#rough2)">j 扫完后返回 ans（64 位整数）</text>
</svg>
