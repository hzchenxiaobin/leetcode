<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">数轴上看取整：找最近的 10 的倍数，平局取较大者</text>

  <!-- 数轴 -->
  <g filter="url(#rough2)">
    <line x1="40" y1="140" x2="480" y2="140" stroke="#446688" stroke-width="2"/>
    <g font-size="11" fill="#555">
      <line x1="60"  y1="132" x2="60"  y2="148" stroke="#446688" stroke-width="1.6"/>
      <text x="60"  y="166" text-anchor="middle">0</text>
      <line x1="120" y1="132" x2="120" y2="148" stroke="#446688" stroke-width="1.6"/>
      <text x="120" y="166" text-anchor="middle">10</text>
      <line x1="180" y1="132" x2="180" y2="148" stroke="#446688" stroke-width="1.6"/>
      <text x="180" y="166" text-anchor="middle">20</text>
      <line x1="240" y1="132" x2="240" y2="148" stroke="#446688" stroke-width="1.6"/>
      <text x="240" y="166" text-anchor="middle">30</text>
      <line x1="300" y1="132" x2="300" y2="148" stroke="#446688" stroke-width="1.6"/>
      <text x="300" y="166" text-anchor="middle">40</text>
      <line x1="360" y1="132" x2="360" y2="148" stroke="#446688" stroke-width="1.6"/>
      <text x="360" y="166" text-anchor="middle">50</text>
      <line x1="420" y1="132" x2="420" y2="148" stroke="#446688" stroke-width="1.6"/>
      <text x="420" y="166" text-anchor="middle">60</text>
    </g>

    <!-- 9 → 10 -->
    <circle cx="114" cy="140" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="114" y="120" text-anchor="middle" font-size="11.5" fill="#4a7a3a">9</text>
    <path d="M 117 137 C 120 130, 122 126, 122 122" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <!-- 15 → 20：平局 -->
    <circle cx="150" cy="140" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="150" y="188" text-anchor="middle" font-size="11.5" fill="#b85450">15</text>
    <path d="M 155 140 C 170 140, 172 140, 176 140" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arr)"/>
    <text x="150" y="212" text-anchor="middle" font-size="11.5" fill="#b85450">距离 10、20 都是 5</text>
    <text x="150" y="230" text-anchor="middle" font-size="11.5" fill="#b85450">→ 取大的 20</text>

  </g>

  <!-- 公式面板 -->
  <g filter="url(#rough2)">
    <rect x="36" y="252" width="448" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="60" y="280" font-size="13.5" fill="#8a6d1f">一条式子搞定：</text>
    <text x="260" y="308" text-anchor="middle" font-size="14.5" fill="#333">rounded = (purchaseAmount + 5) / 10 × 10（整数除法）</text>
    <text x="260" y="332" text-anchor="middle" font-size="12" fill="#555">余额 = 100 − rounded；9→10、15→20、10→10、4→0</text>
  </g>
</svg>
