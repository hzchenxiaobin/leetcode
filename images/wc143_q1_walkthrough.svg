<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1：candies = 7，num_people = 4 → [1,2,3,1]</text>

  <g filter="url(#rough2)">
    <rect x="40" y="44" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="63" y="63" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">第 k 次</text>
    <text x="121" y="63" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">应发 k 颗</text>
    <text x="228" y="63" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">实发（= min(k, 剩余)）</text>
    <text x="345" y="63" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">剩余 candies</text>
    <text x="475" y="63" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">ans 数组</text>

    <rect x="40" y="72" width="520" height="30" fill="#ffffff" stroke="#c9d4e4" stroke-width="1" rx="3"/>
    <text x="63" y="92" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="121" y="92" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="228" y="92" text-anchor="middle" font-size="11" fill="#3a5a30">1 颗 → 小朋友 0</text>
    <text x="345" y="92" text-anchor="middle" font-size="11" fill="#555">6</text>
    <text x="475" y="92" text-anchor="middle" font-size="11" fill="#555">[1,0,0,0]</text>

    <rect x="40" y="102" width="520" height="30" fill="#f7f9fc" stroke="#c9d4e4" stroke-width="1" rx="3"/>
    <text x="63" y="122" text-anchor="middle" font-size="11" fill="#555">2</text>
    <text x="121" y="122" text-anchor="middle" font-size="11" fill="#555">2</text>
    <text x="228" y="122" text-anchor="middle" font-size="11" fill="#3a5a30">2 颗 → 小朋友 1</text>
    <text x="345" y="122" text-anchor="middle" font-size="11" fill="#555">4</text>
    <text x="475" y="122" text-anchor="middle" font-size="11" fill="#555">[1,2,0,0]</text>

    <rect x="40" y="132" width="520" height="30" fill="#ffffff" stroke="#c9d4e4" stroke-width="1" rx="3"/>
    <text x="63" y="152" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="121" y="152" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="228" y="152" text-anchor="middle" font-size="11" fill="#3a5a30">3 颗 → 小朋友 2</text>
    <text x="345" y="152" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="475" y="152" text-anchor="middle" font-size="11" fill="#555">[1,2,3,0]</text>

    <rect x="40" y="162" width="520" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="63" y="182" text-anchor="middle" font-size="11" fill="#8a3a36">4</text>
    <text x="121" y="182" text-anchor="middle" font-size="11" fill="#8a3a36">4</text>
    <text x="228" y="182" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">只剩 1 颗，全给小朋友 3</text>
    <text x="345" y="182" text-anchor="middle" font-size="11" fill="#8a3a36">0</text>
    <text x="475" y="182" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">[1,2,3,1]</text>
  </g>

  <text x="300" y="209" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">最后一趟只剩 1 颗，不够应发的 4 颗 → 全部给当前小朋友，随即结束</text>

  <text x="300" y="240" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2：candies = 10，num_people = 3 → [5,2,3]</text>

  <g filter="url(#rough2)">
    <rect x="40" y="256" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="63" y="275" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">第 k 次</text>
    <text x="121" y="275" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">应发 k 颗</text>
    <text x="228" y="275" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">实发（= min(k, 剩余)）</text>
    <text x="345" y="275" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">剩余 candies</text>
    <text x="475" y="275" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">ans 数组</text>

    <rect x="40" y="284" width="520" height="26" fill="#ffffff" stroke="#c9d4e4" stroke-width="1" rx="3"/>
    <text x="63" y="302" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="121" y="302" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="228" y="302" text-anchor="middle" font-size="11" fill="#3a5a30">1 颗 → 小朋友 0</text>
    <text x="345" y="302" text-anchor="middle" font-size="11" fill="#555">9</text>
    <text x="475" y="302" text-anchor="middle" font-size="11" fill="#555">[1,0,0]</text>

    <rect x="40" y="310" width="520" height="26" fill="#f7f9fc" stroke="#c9d4e4" stroke-width="1" rx="3"/>
    <text x="63" y="328" text-anchor="middle" font-size="11" fill="#555">2</text>
    <text x="121" y="328" text-anchor="middle" font-size="11" fill="#555">2</text>
    <text x="228" y="328" text-anchor="middle" font-size="11" fill="#3a5a30">2 颗 → 小朋友 1</text>
    <text x="345" y="328" text-anchor="middle" font-size="11" fill="#555">7</text>
    <text x="475" y="328" text-anchor="middle" font-size="11" fill="#555">[1,2,0]</text>

    <rect x="40" y="336" width="520" height="26" fill="#ffffff" stroke="#c9d4e4" stroke-width="1" rx="3"/>
    <text x="63" y="354" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="121" y="354" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="228" y="354" text-anchor="middle" font-size="11" fill="#3a5a30">3 颗 → 小朋友 2</text>
    <text x="345" y="354" text-anchor="middle" font-size="11" fill="#555">4</text>
    <text x="475" y="354" text-anchor="middle" font-size="11" fill="#555">[1,2,3]</text>

    <rect x="40" y="362" width="520" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="63" y="380" text-anchor="middle" font-size="11" fill="#3a5a30">4</text>
    <text x="121" y="380" text-anchor="middle" font-size="11" fill="#3a5a30">4</text>
    <text x="228" y="380" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">4 颗全发 → 回到小朋友 0</text>
    <text x="345" y="380" text-anchor="middle" font-size="11" fill="#3a5a30">0</text>
    <text x="475" y="380" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">[5,2,3]</text>
  </g>

  <text x="300" y="406" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">这一趟恰好发完 4 颗，不回队首；小朋友 0 累计 1 + 4 = 5</text>
  <text x="300" y="422" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">两例的共同规律：实发 = min(应发, 剩余)，人号 = (k−1) mod n</text>
</svg>
