<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">目标值只能是第 0 张牌的两个面</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">所以候选值最多 2 个，不必枚举 1..6</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="60" y="74" width="90" height="110" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="105.0" y="133.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <path d="M 60.0 129.0 L 150.0 129.0" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105.0" y="108.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">tops[0] = 2</text>
  <text x="105.0" y="154.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">bottoms[0] = 5</text>
  <path d="M 158.0 108.0 L 210.0 96.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 158.0 154.0 L 210.0 168.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="214" y="78" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="274.0" y="100.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">候选 v = 2</text>
  <rect x="214" y="152" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="274.0" y="174.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">候选 v = 5</text>
  <text x="350.0" y="98.0" font-size="10" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">→ 统计上面 ≠2 的张数、下面 ≠2 的张数</text>
  <text x="350.0" y="172.0" font-size="10" fill="#b85450" text-anchor="start" filter="url(#rough2)">→ 逐张检查是否有一面为 5</text>
  <rect x="30" y="208" width="520" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="229.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">固定 v 后每张牌的旋转与否是「被决定的」：上面不是 v、下面也不是 v → 直接否决</text>
  <text x="40.0" y="245.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">上面不是 v（下面必是 v）→ 必须转；上面是 v → 不必转</text>
  <text x="40.0" y="261.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">故「让 tops 全为 v」的次数 = #{i : tops[i] != v}，同理 bottoms，取 min</text>
  <text x="30.0" y="306.0" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">答案 = min over 候选 v 的 min(rot_top(v), rot_bottom(v))</text>
</svg>
