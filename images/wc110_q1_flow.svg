<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">reorderLogFiles 算法流程</text>
  <rect x="56" y="52" width="408" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="13.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">① 一次遍历分类</text>
  <text x="260" y="96" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">看「标识符后第一个字符」是否数字</text>
  <path d="M 260 108 L 260 128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="130" width="408" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="13.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">② 数字日志入 digits</text>
  <text x="260" y="174" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">按遍历顺序 push，稳定无需排序</text>
  <path d="M 260 186 L 260 206" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="208" width="408" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="13.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">③ 字母日志 sort(letters)</text>
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">比较键 (内容 content, 标识符 id)</text>
  <path d="M 260 264 L 260 284" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="286" width="408" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="13.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">④ letters + digits 拼接返回</text>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">原地不动数字日志的相对顺序</text>
  <rect x="56" y="344" width="408" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">整体 O(n log n)：只有字母日志参与排序</text>
</svg>
