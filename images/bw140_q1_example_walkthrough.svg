<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 3：nums = [999, 19, 199]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">逐个数位和，最小值 10 出现在第二个元素上</text>

  <rect x="60" y="64" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="120" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66">原元素</text>
  <rect x="186" y="64" width="190" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="281" y="84" text-anchor="middle" font-size="10.5" fill="#8a6a20">数位拆解</text>
  <rect x="382" y="64" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="442" y="84" text-anchor="middle" font-size="10.5" fill="#3a5a30">替换后</text>

  <rect x="60" y="100" width="120" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="120" y="122" text-anchor="middle" font-size="12" fill="#666">999</text>
  <rect x="186" y="100" width="190" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="281" y="122" text-anchor="middle" font-size="11" fill="#8a6a20">9 + 9 + 9 = 27</text>
  <rect x="382" y="100" width="120" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="442" y="122" text-anchor="middle" font-size="12" fill="#666">27</text>

  <rect x="60" y="140" width="120" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="120" y="162" text-anchor="middle" font-size="12" fill="#666">19</text>
  <rect x="186" y="140" width="190" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="281" y="162" text-anchor="middle" font-size="11" fill="#8a6a20">1 + 9 = 10</text>
  <rect x="382" y="140" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="442" y="162" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">10 ← min</text>

  <rect x="60" y="180" width="120" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="120" y="202" text-anchor="middle" font-size="12" fill="#666">199</text>
  <rect x="186" y="180" width="190" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="281" y="202" text-anchor="middle" font-size="11" fill="#8a6a20">1 + 9 + 9 = 19</text>
  <rect x="382" y="180" width="120" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="442" y="202" text-anchor="middle" font-size="12" fill="#666">19</text>

  <rect x="60" y="234" width="200" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="254" text-anchor="middle" font-size="10.5" fill="#3a4a66">示例 1：[10,12,13,14]</text>
  <text x="160" y="274" text-anchor="middle" font-size="10.5" fill="#3a4a66">→ [1,3,4,5]，答案 1</text>

  <rect x="280" y="234" width="220" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="254" text-anchor="middle" font-size="10.5" fill="#8a3a36">示例 2：[1,2,3,4] 本身是单位数</text>
  <text x="390" y="274" text-anchor="middle" font-size="10.5" fill="#8a3a36">→ 数位和不变，答案 1</text>

  <rect x="40" y="300" width="490" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="285" y="323" text-anchor="middle" font-size="11" fill="#8a6a20">答案 10：注意 999 的数位和 27 比 19 的数位和大，位数多不等于数位和大</text>
</svg>
