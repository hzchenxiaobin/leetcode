<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 468"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="468" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">电话键盘上的骑士跳（10 个数字，5 号是孤点）</text>
  <rect x="120" y="64" width="64" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152.0" y="96.0" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <rect x="230" y="64" width="64" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262.0" y="96.0" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">2</text>
  <rect x="340" y="64" width="64" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372.0" y="96.0" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">3</text>
  <rect x="120" y="138" width="64" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152.0" y="169.9" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">4</text>
  <rect x="230" y="138" width="64" height="52" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262.0" y="169.9" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">5</text>
  <rect x="340" y="138" width="64" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372.0" y="169.9" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">6</text>
  <rect x="120" y="212" width="64" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152.0" y="243.9" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">7</text>
  <rect x="230" y="212" width="64" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262.0" y="243.9" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">8</text>
  <rect x="340" y="212" width="64" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372.0" y="243.9" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">9</text>
  <rect x="230" y="286" width="64" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262.0" y="317.9" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">0</text>
  <text x="475" y="100" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">5 号没有骑士落点</text>
  <text x="475" y="124" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">（长度为 n&gt;1 时它只能作为结尾）</text>
  <rect x="60" y="372" width="540" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="398.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">邻接表：0→{4,6} 1→{6,8} 2→{7,9} 3→{4,8} 4→{0,3,9} 5→{} 6→{0,1,7} 7→{2,6} 8→{1,3} 9→{2,4}</text>
  <text x="330" y="448" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每个数字的落点固定，与 n 无关 —— 这就是能 O(n) 递推的前提</text>
</svg>
