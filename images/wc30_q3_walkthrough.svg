<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s1 = "ab"，s2 = "eidbaooo"</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">固定窗口长度 m = 2，目标计数 cnt_s1：a → 1，b → 1，其余 0</text>

  <rect x="50" y="62" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="75" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">起点 i</text>
  <text x="152" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">窗口</text>
  <text x="242" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">cnt_a</text>
  <text x="304" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">cnt_b</text>
  <text x="372" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">diff</text>
  <text x="466" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">判定</text>

  <rect x="50" y="92" width="460" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="111" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="152" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"ei"</text>
  <text x="242" y="111" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="304" y="111" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="372" y="111" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="466" y="111" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">false</text>

  <rect x="50" y="120" width="460" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="139" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="152" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"id"</text>
  <text x="242" y="139" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="304" y="139" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="372" y="139" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="466" y="139" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">false</text>

  <rect x="50" y="148" width="460" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="167" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="152" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"db"</text>
  <text x="242" y="167" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="304" y="167" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="372" y="167" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="466" y="167" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">false</text>

  <rect x="46" y="176" width="468" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="195" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="152" y="195" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">"ba"</text>
  <text x="242" y="195" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="304" y="195" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="372" y="195" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="466" y="195" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <rect x="50" y="204" width="460" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="223" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="152" y="223" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"ao"</text>
  <text x="242" y="223" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="304" y="223" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="372" y="223" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="466" y="223" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">false</text>

  <rect x="50" y="232" width="460" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="251" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="152" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"oo"</text>
  <text x="242" y="251" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="304" y="251" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="372" y="251" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="466" y="251" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">false</text>

  <rect x="50" y="260" width="460" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="279" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="152" y="279" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"oo"</text>
  <text x="242" y="279" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="304" y="279" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="372" y="279" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="466" y="279" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">false</text>

  <rect x="40" y="300" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="322" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">i = 3：窗口 "ba" 的 cnt_a = cnt_b = 1，与 cnt_s1 逐格相同 ⇒ diff = 0 ⇒ true</text>
  <text x="58" y="342" font-size="10" fill="#555" filter="url(#rough2)">i = 3 → 4 的增量：移出 s2[3] = "b"（cnt_b 由 1 变 0，diff+1），</text>
  <text x="58" y="358" font-size="10" fill="#555" filter="url(#rough2)">移入 s2[5] = "o"（cnt_o 由 0 变 1，diff+1）⇒ diff = 2，与上表一致</text>
</svg>
