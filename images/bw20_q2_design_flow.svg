<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="122"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">Cashier 设计：哈希表存单价，计数器取模触发折扣</text>

  <!-- 构造：哈希表 -->
  <text x="150" y="60" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">构造函数：建价目表</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="30" y="74" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="60" y="94">商品</text>
    <rect x="90" y="74" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="120" y="94">单价</text>
    <rect x="30" y="106" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="60" y="124">1</text>
    <rect x="90" y="106" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="120" y="124">100</text>
    <rect x="30" y="132" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="60" y="150">2</text>
    <rect x="90" y="132" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="120" y="150">200</text>
    <rect x="30" y="158" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="60" y="176">3</text>
    <rect x="90" y="158" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="120" y="176">300</text>
    <rect x="30" y="184" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="60" y="202">…</text>
    <rect x="90" y="184" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="120" y="202">…</text>
  </g>
  <text x="150" y="238" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">price[products[i]] = prices[i]</text>
  <text x="150" y="258" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">查询 O(1)，商品号最大 200</text>

  <!-- getBill 流程 -->
  <text x="412" y="60" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">getBill(product, amount)</text>
  <rect x="330" y="72" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="95" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">① bill = Σ price[pᵢ]×amountᵢ</text>
  <path d="M 430 108 L 430 122" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="124" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="147" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② cnt += 1（第几位顾客）</text>
  <path d="M 430 160 L 430 174" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="430,176 492,204 430,232 368,204" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt % n == 0 ?</text>
  <path d="M 368 204 L 330 204 L 330 246" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="196" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 492 204 L 530 204 L 530 246" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="516" y="196" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="240" y="248" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="271" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">bill × (100−d)/100</text>
  <rect x="440" y="248" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="271" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">bill</text>

  <!-- 底部要点 -->
  <rect x="30" y="296" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">计数「重新开始」的准确含义：第 n、2n、3n… 位顾客打折，即 cnt 能被 n 整除时</text>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">折扣公式：x − x·discount/100 = x × (100 − discount)/100</text>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">金额用 double 累加/返回；整型累加再转 double 也精确（本题范围内）</text>
</svg>
