  <text x="337" y="110" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· 除 (0,j) 与 (i,n-1)</text>
  <text x="337" y="125" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">  之外全部为 '#'</text>
  <text x="337" y="140" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· 任一下移都必须</text>
  <text x="337" y="155" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">  发生在最后一列</text>
  <text x="337" y="170" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· 故路径唯一</text>
  <text x="260" y="300" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">m=4, n=4 的构造结果（蓝=空，红=障碍）</text>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">唯一路径：(0,0)→(0,1)→(0,2)→(0,3)</text>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">→(1,3)→(2,3)→(3,3)</text>
