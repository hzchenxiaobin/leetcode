<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">从 I 版到 II 版：只是数据范围变大，算法必须换</text>

  <rect x="34" y="52" width="220" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="144" y="76" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">I 版：m, n ≤ 100</text>
  <text x="144" y="102" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">行三元组 C(100, 3) ≈ 1.6 × 10^5</text>
  <text x="144" y="126" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每组 27 种取法</text>
  <text x="144" y="152" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">≈ 4.4 × 10^6 次比较</text>
  <text x="144" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 秒过</text>

  <rect x="286" y="52" width="220" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="396" y="76" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">II 版：m, n ≤ 500</text>
  <text x="396" y="102" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">行三元组 C(500, 3) ≈ 2.1 × 10^7</text>
  <text x="396" y="126" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每组 27 种取法</text>
  <text x="396" y="152" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">≈ 5.6 × 10^8 次比较</text>
  <text x="396" y="180" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 太慢</text>

  <path d="M 258 126 L 282 126" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="34" y="222" width="472" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="48" y="244" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">"每行前 3 大"这条剪枝依然成立，但不能再枚举行三元组</text>
  <text x="48" y="264" font-size="10.5" fill="#555" filter="url(#rough2)">改成枚举"一个锚点格子"，再在剩余候选里精确找出最优的两个</text>

  <rect x="34" y="290" width="472" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="48" y="312" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">目标复杂度：O(m n log n) 级别，与 m^3 脱钩</text>
  <text x="48" y="332" font-size="10.5" fill="#555" filter="url(#rough2)">锚点只有 3m ≤ 1500 个，每个锚点的配对只在前 5 列、每列前 3 大里进行</text>
</svg>
