<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：候选锁定第一行，其余行二分判定</text>

  <!-- 矩阵：4 行 5 列 -->
  <text x="60" y="70" font-size="12" fill="#333" font-weight="bold">mat（每行递增）：</text>

  <g filter="url(#rough2)">
    <rect x="60" y="82" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="60" y="116" width="300" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <rect x="60" y="150" width="300" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <rect x="60" y="184" width="300" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
  </g>

  <!-- 值为 5 的格子高亮 -->
  <g filter="url(#rough2)">
    <rect x="260" y="82" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="200" y="116" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="140" y="150" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="260" y="184" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>

  <text y="104" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="90">1</tspan><tspan x="120">2</tspan><tspan x="150" fill="#b85450" font-weight="bold">3</tspan><tspan x="180">4</tspan><tspan x="290" fill="#4a7a3a" font-weight="bold">5</tspan></text>
  <text y="138" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="120">2</tspan><tspan x="180">4</tspan><tspan x="290" fill="#4a7a3a" font-weight="bold">5</tspan><tspan x="240">8</tspan><tspan x="330">10</tspan></text>
  <text y="172" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="90">3</tspan><tspan x="290" fill="#4a7a3a" font-weight="bold">5</tspan><tspan x="240">7</tspan><tspan x="270">9</tspan><tspan x="330">11</tspan></text>
  <text y="206" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="90">1</tspan><tspan x="150" fill="#b85450" font-weight="bold">3</tspan><tspan x="290" fill="#4a7a3a" font-weight="bold">5</tspan><tspan x="240">7</tspan><tspan x="270">9</tspan></text>

  <!-- 第一行强调 -->
  <path d="M 52 99 L 52 78 Q 52 70 62 70" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="230" font-size="11.5" fill="#446688" font-weight="bold">候选 = 第一行的 5 个元素（蓝行）</text>

  <!-- 箭头：候选 5 → 各行二分 -->
  <path d="M 330 100 Q 420 120 428 135" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 134 Q 400 150 428 152" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 168 Q 400 175 428 169" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 202 Q 400 200 428 186" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧二分示意 -->
  <text x="440" y="70" font-size="11.5" fill="#333" font-weight="bold">行内二分</text>
  <g filter="url(#rough2)">
    <rect x="432" y="106" width="110" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <rect x="432" y="134" width="110" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <rect x="432" y="162" width="110" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <rect x="432" y="190" width="110" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
  </g>
  <text x="487" y="121" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">找到 5 ✓</text>
  <text x="487" y="149" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">找到 5 ✓</text>
  <text x="487" y="177" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">找到 5 ✓</text>
  <text x="487" y="205" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">找到 5 ✓</text>

  <text x="487" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 5</text>

  <!-- 说明区 -->
  <rect x="60" y="262" width="230" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="76" y="286" font-size="11.5" fill="#333" font-weight="bold">为什么候选只有第一行？</text>
  <text x="76" y="306" font-size="11" fill="#555">公共元素按定义出现在每一行，</text>
  <text x="76" y="324" font-size="11" fill="#555">自然包含在 mat[0] 里；</text>
  <text x="76" y="342" font-size="11" fill="#555">候选从 10⁴ 个缩到 m 个。</text>

  <rect x="310" y="262" width="230" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="326" y="286" font-size="11.5" fill="#333" font-weight="bold">为什么首个命中即最小？</text>
  <text x="326" y="306" font-size="11" fill="#555">第一行严格递增，枚举序 = 值序；</text>
  <text x="326" y="324" font-size="11" fill="#555">红字 1、3、4 都先于 5 被否决</text>
  <text x="326" y="342" font-size="11" fill="#555">（在某行二分落空）。</text>

  <text x="60" y="386" font-size="11" fill="#555">每行判定 O(log m)，总 O(m · n log m) ≈ 2.3×10⁶，额外空间 O(1)</text>
  <text x="60" y="406" font-size="11" fill="#999">bw9 Q3 · 找出所有行中最小公共元素</text>
</svg>
