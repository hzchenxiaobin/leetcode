<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算：cost = [6, 5, 7, 9, 2, 2]</text>

  <!-- 第一步排序 -->
  <text x="140" y="62" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">第 1 步：降序排序</text>
  <g filter="url(#rough2)" font-size="13" fill="#666">
    <text x="40" y="90">原数组：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="110" y="72" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="166" y="72" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="222" y="72" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="278" y="72" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="334" y="72" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="390" y="72" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="136" y="93">6</text>
    <text x="192" y="93">5</text>
    <text x="248" y="93">7</text>
    <text x="304" y="93">9</text>
    <text x="360" y="93">2</text>
    <text x="416" y="93">2</text>
  </g>
  <path d="M 250 118 C 250 138, 250 138, 250 148" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="13" fill="#666">
    <text x="40" y="172">排序后：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="110" y="154" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="166" y="154" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="222" y="154" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="278" y="154" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="334" y="154" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="390" y="154" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="136" y="175">9</text>
    <text x="192" y="175">7</text>
    <text x="248" y="175">6</text>
    <text x="304" y="175">5</text>
    <text x="360" y="175">2</text>
    <text x="416" y="175">2</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#666" text-anchor="middle">
    <text x="136" y="200">买</text>
    <text x="192" y="200">买</text>
    <text x="248" y="200">免费 ✓</text>
    <text x="304" y="200">买</text>
    <text x="360" y="200">买</text>
    <text x="416" y="200">免费 ✓</text>
  </g>

  <!-- 第二步求和 -->
  <text x="140" y="232" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">第 2 步：跳过下标 ≡ 2 (mod 3) 求和</text>
  <g filter="url(#rough2)">
    <rect x="80" y="248" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="270" y="276" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)" font-weight="bold">ans = 9 + 7 + 5 + 2 = 23</text>

  <!-- 右侧注意 -->
  <g filter="url(#rough2)">
    <rect x="470" y="248" width="74" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="507" y="266" font-size="11.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">与官方解释</text>
  <text x="507" y="282" font-size="11.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">分组完全一致</text>

  <text x="280" y="320" font-size="12.5" fill="#666" filter="url(#rough2)" text-anchor="middle">n = 2 的边界 [5,5]：凑不出免费名额，直接 5 + 5 = 10</text>
</svg>
