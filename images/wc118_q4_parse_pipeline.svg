<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="348" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">解析流水线：字符串 → 三段数字 → 精确分数 → 交叉相乘</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每段只做整数乘加，循环节靠 (10^l_r − 1) 收进分母</text>
  <text x="30" y="68" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">字符串</text>
  <rect x="30" y="78" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="105.0" y="102.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">"0.5(25)"</text>
  <rect x="60" y="140" width="120" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="120.0" y="165.14" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">I = 0</text>
  <rect x="196" y="140" width="128" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="260.0" y="164.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">N = 5, l_n = 1</text>
  <rect x="340" y="140" width="156" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="418.0" y="164.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R = 25, l_r = 2</text>
  <path d="M 105 120 L 105 136" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 105 120 L 252 136" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 140 120 L 400 136" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="60" y="208" width="436" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="70" y="229.5" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">分数</text><text x="70" y="246.175" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">num = (0·10 + 5)·99 + 25 = 520    den = 10·99 = 990</text>
  <path d="M 278 184 L 278 204" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="60" y="284" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="70" y="306" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">约分 → 52/99</text>
  <rect x="288" y="284" width="208" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="392.0" y="312.14" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">交叉相乘比较</text>
  <path d="M 262 308 L 284 308" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
</svg>
