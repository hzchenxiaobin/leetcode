<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">三种「修复单元」：不匹配位置怎么消灭</text>

  <!-- ① C+D 配对 -->
  <circle cx="34" cy="88" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="93" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <!-- 左侧两列 C D -->
  <rect x="62" y="64" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="62" y="98" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="79" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="79" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="102" y="64" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="98" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="119" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <!-- 箭头 -->
  <path d="M148,96 L188,96" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="86" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">swap</text>
  <!-- 结果两列 B A -->
  <rect x="198" y="64" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="198" y="98" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="215" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="238" y="64" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="238" y="98" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="255" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <!-- 右侧说明 -->
  <text x="330" y="76" font-size="13" fill="#333" filter="url(#rough2)">C + D 互补对：一次 swap 双杀</text>
  <text x="330" y="98" font-size="12" fill="#777" filter="url(#rough2)">交换两列的 s 位（或 t 位）即可</text>
  <rect x="330" y="110" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="128" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">每对花费 min( sw , 2f )</text>

  <!-- 分隔线 -->
  <path d="M30,160 Q260,166 490,160" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <!-- ② 同型对 -->
  <circle cx="34" cy="218" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="223" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <!-- 两列 C C -->
  <rect x="62" y="194" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="62" y="228" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="79" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="79" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="102" y="194" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="228" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="119" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <!-- 箭头1: cross -->
  <path d="M148,216 L184,216" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="206" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">cross</text>
  <!-- 中间两列 D C -->
  <rect x="194" y="194" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="194" y="228" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="211" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="234" y="194" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="228" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="251" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <!-- 箭头2: swap -->
  <path d="M280,216 L316,216" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="206" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">swap</text>
  <!-- 结果两列 -->
  <rect x="326" y="194" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="228" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="343" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="343" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="366" y="194" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="228" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="383" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="383" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <!-- 右侧说明 -->
  <text x="424" y="200" font-size="12" fill="#333" filter="url(#rough2)">C + C 同型对：</text>
  <text x="424" y="218" font-size="12" fill="#777" filter="url(#rough2)">先 cross 转型一个</text>
  <text x="424" y="236" font-size="12" fill="#777" filter="url(#rough2)">凑成 C+D 再 swap</text>
  <rect x="424" y="246" width="88" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="468" y="263" text-anchor="middle" font-size="11" fill="#b8860b" filter="url(#rough2)">min( sw+cr , 2f )</text>

  <!-- 分隔线 -->
  <path d="M30,286 Q260,292 490,286" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <!-- ③ 落单单个 -->
  <circle cx="34" cy="336" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="341" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <!-- 一列 C -->
  <rect x="62" y="312" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="62" y="346" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="79" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="79" y="366" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <!-- 箭头 -->
  <path d="M110,342 L150,342" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="332" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">flip</text>
  <!-- 结果一列 B -->
  <rect x="160" y="312" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="346" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="177" y="366" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <!-- 右侧说明 -->
  <text x="240" y="324" font-size="13" fill="#333" filter="url(#rough2)">落单的 1 个：一次 flip 直接修复</text>
  <text x="240" y="346" font-size="12" fill="#777" filter="url(#rough2)">（C 翻成 A 或 B 均可）</text>
  <rect x="240" y="356" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="315" y="373" text-anchor="middle" font-size="11" fill="#b8860b" filter="url(#rough2)">花费 f</text>

  <!-- 底部公式框 -->
  <rect x="30" y="400" width="460" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="424" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">设不匹配位置有 x 个 C 型、y 个 D 型，R = |x−y|：</text>
  <text x="260" y="448" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = min(x,y)·min(sw, 2f) + min( R·f , (R mod 2)·f + ⌊R/2⌋·(sw+cr) )</text>
</svg>
