<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">排序 + 双指针：三分支决策，每一步丢弃都安全</text>

  <!-- 排序后的数组 -->
  <text x="40" y="62" font-size="11" fill="#999" filter="url(#rough2)">排序后</text>
  <rect x="60" y="70" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="124" y="70" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="188" y="70" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="214" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="252" y="70" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="316" y="70" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="392" y="86" font-size="12" fill="#666" filter="url(#rough2)">sum = nums[L] + nums[R]</text>
  <text x="392" y="104" font-size="11" fill="#999" filter="url(#rough2)">= 1 + 4 = 5，与 k 比</text>

  <!-- 指针 -->
  <path d="M86,130 L86,108" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <path d="M342,130 L342,108" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">R</text>

  <!-- 进入决策 -->
  <path d="M214,154 L214,178 L264,203" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,198 356,232 280,266 204,232" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">比较 sum 与 k</text>

  <!-- 三个分支箭头 -->
  <path d="M232,254 L118,300" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">&lt; k</text>
  <path d="M280,266 L280,300" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">= k</text>
  <path d="M328,254 L442,300" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">&gt; k</text>

  <!-- 分支框：sum < k -->
  <rect x="24" y="306" width="165" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="106" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">sum &lt; k</text>
  <text x="106" y="348" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">left++（左端太小）</text>
  <text x="106" y="366" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">L 连当前最大值都配不够</text>
  <text x="106" y="382" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">⇒ 丢弃 L 安全</text>

  <!-- 分支框：sum == k -->
  <rect x="197" y="306" width="165" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="279" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">sum == k</text>
  <text x="279" y="348" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans++，两端同时收进</text>
  <text x="279" y="366" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">left++ 且 right−−</text>
  <text x="279" y="382" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">⇒ 记 1 对，继续</text>

  <!-- 分支框：sum > k -->
  <rect x="370" y="306" width="165" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">sum &gt; k</text>
  <text x="452" y="348" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">right−−（右端太大）</text>
  <text x="452" y="366" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">R 连当前最小值都配超</text>
  <text x="452" y="382" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">⇒ 丢弃 R 安全</text>

  <text x="280" y="424" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">left &lt; right 恒取两个不同位置 ⇒ 无需 v = k/2 自配对特判；left ≥ right 时窗口耗尽，自然结束</text>
</svg>
