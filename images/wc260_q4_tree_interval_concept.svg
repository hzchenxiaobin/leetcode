<svg xmlns="http://www.w3.org/2000/svg" width="690" height="400" viewBox="0 0 690 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="690" height="400" fill="#fafafa"/>
  <text x="345" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：运算顺序 ↔ 括号化 —— 枚举「最后一步运算」</text>
  <path d="M 150 38 Q 345 48 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表达式树：(7+3)*(1*2)，根 = 最后一步 -->
  <g filter="url(#sk)">
    <path d="M 236 92 Q 190 115 158 133" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 264 92 Q 310 115 344 133" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 139 158 Q 115 180 102 199" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 161 158 Q 185 180 198 199" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 341 158 Q 320 180 306 199" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 363 158 Q 385 180 399 199" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="250" cy="80" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="250" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">×</text>
  <g filter="url(#sk)">
    <circle cx="150" cy="145" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="150" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d25">+</text>
  <g filter="url(#sk)">
    <circle cx="352" cy="145" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="352" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">×</text>
  <g filter="url(#sk)">
    <circle cx="95" cy="212" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="205" cy="212" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="297" cy="212" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="407" cy="212" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="95" y="217" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="205" y="217" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="297" y="217" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="407" y="217" text-anchor="middle" font-size="12" fill="#333">2</text>

  <text x="445" y="66" font-size="12" font-weight="bold" fill="#b85450">树根 = 最后应用的运算符</text>
  <path d="M 442 72 L 276 78" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="48" y="149" font-size="11" fill="#4a7a3a">(7+3)→10</text>
  <text x="382" y="149" font-size="11" fill="#446688">(1×2)→2</text>
  <text x="252" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">10 × 2 = 20（一种错序）</text>

  <!-- token 行 -->
  <g filter="url(#sk)">
    <rect x="73" y="258" width="44" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="123" y="258" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="169" y="258" width="44" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="219" y="258" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="265" y="258" width="44" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="315" y="258" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="361" y="258" width="44" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="95" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">7</text>
  <text x="143" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">+</text>
  <text x="191" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>
  <text x="239" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">×</text>
  <text x="287" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="335" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">×</text>
  <text x="383" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>

  <path d="M 95 227 L 95 256" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 205 227 L 191 256" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 297 227 L 287 256" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 407 227 L 383 256" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>

  <!-- 区间括号 -->
  <path d="M 73 306 L 73 320 L 213 320 L 213 306" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="143" y="340" text-anchor="middle" font-size="10.5" fill="#4a7a3a">左区间 [0..1] → f(0,1)</text>
  <path d="M 265 306 L 265 320 L 405 320 L 405 306" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="335" y="340" text-anchor="middle" font-size="10.5" fill="#446688">右区间 [2..3] → f(2,3)</text>
  <path d="M 73 350 L 73 364 L 405 364 L 405 350" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="239" y="384" text-anchor="middle" font-size="10.5" fill="#b85450">整体区间 [0..3] → f(0,3) = {13, 20}</text>

  <!-- 右侧说明 -->
  <g filter="url(#sk)">
    <rect x="445" y="56" width="225" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="557" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">顺序 ↔ 树，一一对应</text>
  <text x="557" y="100" text-anchor="middle" font-size="10.5" fill="#5c4512">每步选一个运算符，作用于</text>
  <text x="557" y="117" text-anchor="middle" font-size="10.5" fill="#5c4512">两个相邻的已算出的值</text>
  <text x="557" y="134" text-anchor="middle" font-size="10.5" fill="#5c4512">应用 n−1 步 ↔ 一棵表达式树</text>
  <text x="557" y="151" text-anchor="middle" font-size="10.5" fill="#5c4512">不同顺序 ↔ 不同树形</text>

  <g filter="url(#sk)">
    <rect x="445" y="190" width="225" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="557" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">区间 DP（LC 241 同款）</text>
  <text x="557" y="234" text-anchor="middle" font-size="11" fill="#446688">f(i,i) = { dᵢ }</text>
  <text x="557" y="252" text-anchor="middle" font-size="11" fill="#446688">f(i,j) = ⋃ₖ { x ⊙ₖ y }</text>
  <text x="557" y="269" text-anchor="middle" font-size="10" fill="#446688">x∈f(i,k)，y∈f(k+1,j)</text>
  <text x="557" y="288" text-anchor="middle" font-size="10" fill="#446688">k 取遍 [i, j) 内的分割点</text>

  <g filter="url(#sk)">
    <rect x="445" y="324" width="225" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="557" y="348" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">打分只看「哪些值可达」</text>
  <text x="557" y="368" text-anchor="middle" font-size="10.5" fill="#b85450">—— 无需逐一枚举顺序！</text>
</svg>
