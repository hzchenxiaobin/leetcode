<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="330" fill="#fafafa"/>

  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算</text>
  <text x="310" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">两个示例分别验证「有进位」与「末尾多个 0」</text>
  <rect x="40" y="66" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n</text>
  <rect x="100" y="66" width="190" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n² / 十六进制</text>
  <rect x="290" y="66" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n³ / 三十六进制</text>
  <rect x="530" y="66" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="575.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">答案</text>
  <rect x="40" y="98" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">13</text>
  <rect x="100" y="98" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">169 = A×16 + 9 -&gt; "A9"</text>
  <rect x="290" y="98" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2197 = 1×36² + 25×36 + 1 -&gt; "1P1"</text>
  <rect x="530" y="98" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="575.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">"A91P1"</text>
  <rect x="40" y="130" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">36</text>
  <rect x="100" y="130" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1296 = 5×16² + 1×16 -&gt; "510"</text>
  <rect x="290" y="130" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">46656 = 1×36³ -&gt; "1000"</text>
  <rect x="530" y="130" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="575.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">"5101000"</text>
  <rect x="40" y="180" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="202.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">26 对应字母 P（10+25），36 进制下 1000 表示 1×36³</text>
  <text x="310.0" y="222.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">余数为 0 时也要写 0：36³ 的三十六进制是 "1000" 而不是 "1"</text>
  <text x="40" y="274" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">注意 n² 的十六进制有 3 位、n³ 的三十六进制有 4 位，位数由数值决定</text>
</svg>
