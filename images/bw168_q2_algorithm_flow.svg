<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 376" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="376" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：可行性 → 9 的个数 → 余数 → 补零</text>
  <rect x="30" y="64" width="500" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sum &gt; 9 * num ？ 是 → 返回 ""</text>
  <path d="M 280 102 L 280 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="110" width="500" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">q = sum // 9，r = sum % 9</text>
  <path d="M 280 148 L 280 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="156" width="500" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">结果 = "9" * q</text>
  <path d="M 280 194 L 280 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="202" width="500" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r &gt; 0 时追加 str(r)</text>
  <path d="M 280 240 L 280 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="248" width="500" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">补 (num - q - [r&gt;0]) 个 '0'</text>
  <path d="M 280 286 L 280 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="294" width="500" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回结果</text>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">时间 O(num)：字符串重复构造，不做逐位模拟</text>
</svg>
