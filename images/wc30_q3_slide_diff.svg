<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">定长滑动窗口 + 差异计数器 diff：O(n)</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">窗口长度恒为 m，每移动一格只改动「移出」「移入」两个字符的计数</text>

  <rect x="60" y="62" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="86" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 若 m = |s1| &gt; n = |s2| 直接返回 false；否则统计 cnt_s1 与首窗口 cnt_win[0..m)</text>

  <path d="M 280 104 L 280 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="118" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="142" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">② diff = #{ c : cnt_s1[c] ≠ cnt_win[c] }；一旦 diff == 0，当前窗口就是答案</text>

  <path d="M 280 160 L 280 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="174" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="196" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">③ 窗口右移一格：先「移出」s2[i−m]，再「移入」s2[i]，各自只看这两个字符</text>
  <text x="76" y="216" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">   每次更新：计数由「相等」变「不等」则 diff+1，由「不等」变「相等」则 diff−1</text>

  <path d="M 280 232 L 280 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="104" y="262">0</text>
    <text x="148" y="262">1</text>
    <text x="192" y="262">2</text>
    <text x="236" y="262">3</text>
    <text x="280" y="262">4</text>
    <text x="324" y="262">5</text>
    <text x="368" y="262">6</text>
    <text x="412" y="262">7</text>
  </g>

  <rect x="124" y="266" width="136" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="168" y="266" width="136" height="42" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>

  <rect x="86" y="270" width="36" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="292" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">e</text>
  <rect x="130" y="270" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <rect x="174" y="270" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="192" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d</text>
  <rect x="218" y="270" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="236" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <rect x="262" y="270" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="306" y="270" width="36" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="292" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">o</text>
  <rect x="350" y="270" width="36" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="292" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">o</text>
  <rect x="394" y="270" width="36" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="292" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">o</text>

  <path d="M 148 314 L 148 336" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="148" y="354" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">移出 s2[i−m]</text>
  <path d="M 280 338 L 280 316" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">移入 s2[i]</text>

  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">绿色实框 = 当前窗口，橙色虚线框 = 右移一格后的窗口；两步共 2 次计数改动 ⇒ O(1)</text>
</svg>
