<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="384" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：从两端共取 k 张 ⇔ 中间留下一段连续窗口</text>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">cardPoints = [1, 2, 3, 4, 5, 6, 1]（n = 7，k = 3，total = 22）</text>

  <rect x="168" y="64" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="188" y="75.5" font-size="11" fill="#8a6a20" filter="url(#rough2)">留下（中间）</text>
  <rect x="276" y="64" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="296" y="75.5" font-size="11" fill="#2f5424" filter="url(#rough2)">取走（两端）</text>

  <text x="78" y="102" font-size="12" fill="#666" filter="url(#rough2)">分配①：左端 0 张 + 右端 3 张（a = 0，b = 3）</text>

  <rect x="78" y="110" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#a07420" filter="url(#rough2)">1</text>
  <rect x="129" y="110" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#a07420" filter="url(#rough2)">2</text>
  <rect x="180" y="110" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#a07420" filter="url(#rough2)">3</text>
  <rect x="231" y="110" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#a07420" filter="url(#rough2)">4</text>
  <rect x="282" y="110" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5424" filter="url(#rough2)">5</text>
  <rect x="333" y="110" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5424" filter="url(#rough2)">6</text>
  <rect x="384" y="110" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="407" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5424" filter="url(#rough2)">1</text>

  <text x="254" y="173" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">留下 [1,2,3,4]，W = 10 → 取走 22 − 10 = 12<tspan fill="#b85450" font-weight="bold">（最优）</tspan></text>

  <text x="78" y="200" font-size="12" fill="#666" filter="url(#rough2)">分配②：左端 2 张 + 右端 1 张（a = 2，b = 1）</text>

  <rect x="78" y="208" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5424" filter="url(#rough2)">1</text>
  <rect x="129" y="208" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5424" filter="url(#rough2)">2</text>
  <rect x="180" y="208" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#a07420" filter="url(#rough2)">3</text>
  <rect x="231" y="208" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#a07420" filter="url(#rough2)">4</text>
  <rect x="282" y="208" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#a07420" filter="url(#rough2)">5</text>
  <rect x="333" y="208" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#a07420" filter="url(#rough2)">6</text>
  <rect x="384" y="208" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="407" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5424" filter="url(#rough2)">1</text>

  <text x="254" y="271" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">留下 [3,4,5,6]，W = 18 → 取走 22 − 18 = 4</text>

  <text x="260" y="297" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">窗口长度恒为 n − k = 4，起点 a 可取 0 … k，共 k + 1 = 4 个位置</text>

  <rect x="70" y="312" width="380" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="13" fill="#2a4660" filter="url(#rough2)">取走之和 = total − W，total 固定</text>
  <text x="260" y="357" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2a4660" filter="url(#rough2)">最大化取走之和 ⟺ 最小化长度 n − k 窗口的和 W</text>
</svg>
