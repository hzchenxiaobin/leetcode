<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="440" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 自底向上演算：f 表与答案</text>
  <path d="M 190 42 Q 350 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== 左：树与上传箭头 ====== -->
  <text x="188" y="64" text-anchor="middle" font-size="12" fill="#666">values = [5,2,5,2,1,1]（节点 0..5）</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 170 105 L 75 190"/>
    <path d="M 170 105 L 170 190"/>
    <path d="M 170 105 L 265 190"/>
    <path d="M 170 190 L 170 258"/>
    <path d="M 170 258 L 170 326"/>
  </g>

  <g filter="url(#sk)" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 4">
    <path d="M 148 318 Q 126 292 148 268" marker-end="url(#ar2)"/>
    <path d="M 148 250 Q 126 224 148 200" marker-end="url(#ar2)"/>
    <path d="M 148 182 Q 120 148 150 118" marker-end="url(#ar2)"/>
  </g>

  <g filter="url(#sk)">
    <circle cx="170" cy="105" r="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="75" cy="190" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <circle cx="170" cy="190" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <circle cx="265" cy="190" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <circle cx="170" cy="258" r="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <circle cx="170" cy="326" r="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="170" y="110">0</text>
    <text x="75" y="195">1</text>
    <text x="170" y="195">2</text>
    <text x="265" y="195">3</text>
    <text x="170" y="263">4</text>
    <text x="170" y="331">5</text>
  </g>

  <g filter="url(#sk)">
    <rect x="204" y="95" width="46" height="20" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="99" y="180" width="46" height="20" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="196" y="180" width="46" height="20" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="291" y="180" width="46" height="20" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="192" y="248" width="46" height="20" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="192" y="316" width="46" height="20" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)" font-size="11" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="227" y="109">f=5</text>
    <text x="122" y="194">f=2</text>
    <text x="219" y="194">f=1</text>
    <text x="314" y="194">f=2</text>
    <text x="215" y="262">f=1</text>
    <text x="215" y="330">f=1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="32" y="352" width="312" height="56" rx="8" fill="#f6f6f2" stroke="#c9c9c2" stroke-width="1.2"/>
  </g>
  <text x="188" y="374" text-anchor="middle" font-size="12" fill="#555">叶子 1、3、5 直接取 values（没有孩子）</text>
  <text x="188" y="396" text-anchor="middle" font-size="12" fill="#555">f 沿链 5→4→2→0 自底向上逐层取 min</text>

  <!-- ====== 右：f 表 ====== -->
  <text x="514" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">f 表（自底向上填）</text>

  <g filter="url(#sk)">
    <rect x="360" y="84" width="308" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="360" y="114" width="308" height="160" fill="#fdfdfa"/>
    <rect x="360" y="274" width="308" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)" stroke="#c8d8ea" stroke-width="1">
    <line x1="360" y1="146" x2="668" y2="146"/>
    <line x1="360" y1="178" x2="668" y2="178"/>
    <line x1="360" y1="210" x2="668" y2="210"/>
    <line x1="360" y1="242" x2="668" y2="242"/>
    <line x1="360" y1="274" x2="668" y2="274"/>
  </g>
  <g filter="url(#sk)" stroke="#4a8edb" stroke-width="1" stroke-dasharray="3 3">
    <line x1="432" y1="84" x2="432" y2="306"/>
    <line x1="506" y1="84" x2="506" y2="306"/>
    <line x1="586" y1="84" x2="586" y2="306"/>
  </g>

  <g filter="url(#sk)" font-size="12" font-weight="bold" fill="#2e5e8a" text-anchor="middle">
    <text x="396" y="104">节点 u</text>
    <text x="469" y="104">values</text>
    <text x="546" y="104">Σ f[孩子]</text>
    <text x="627" y="104">f[u] = min</text>
  </g>
  <g filter="url(#sk)" font-size="12" fill="#333" text-anchor="middle">
    <text x="396" y="134">5（叶）</text>
    <text x="469" y="134">1</text>
    <text x="546" y="134">—</text>
    <text x="627" y="134">1</text>

    <text x="396" y="166">4</text>
    <text x="469" y="166">1</text>
    <text x="546" y="166">f[5] = 1</text>
    <text x="627" y="166">min(1,1) = 1</text>

    <text x="396" y="198">2</text>
    <text x="469" y="198">5</text>
    <text x="546" y="198">f[4] = 1</text>
    <text x="627" y="198">min(5,1) = 1</text>

    <text x="396" y="230">1（叶）</text>
    <text x="469" y="230">2</text>
    <text x="546" y="230">—</text>
    <text x="627" y="230">2</text>

    <text x="396" y="262">3（叶）</text>
    <text x="469" y="262">2</text>
    <text x="546" y="262">—</text>
    <text x="627" y="262">2</text>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="396" y="294">0</text>
    <text x="469" y="294">5</text>
    <text x="546" y="294">2+1+2 = 5</text>
    <text x="627" y="294">min(5,5) = 5</text>
  </g>

  <g filter="url(#sk)">
    <rect x="360" y="326" width="308" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="514" y="353" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">答案 = Σ values − f[0] = 16 − 5 = 11</text>

  <text x="514" y="392" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">f[0] 两侧打平：保留 {0} 或 {1,3,4} / {1,3,5} 皆最优</text>
  <text x="514" y="412" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">最优方案不唯一，最优值唯一，得分都是 11</text>
</svg>
