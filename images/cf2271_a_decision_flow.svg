<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定流程：先卡 |y| 的上界，再看奇偶</text>
  <path d="M 208 44 Q 380 51 552 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 输入 -->
  <rect x="286" y="60" width="188" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="88" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">读入 (a, b)</text>
  <path d="M 380 106 L 380 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1 -->
  <polygon points="380,130 490,175 380,220 270,175" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="181" text-anchor="middle" font-size="14.5" fill="#8a6015" filter="url(#rough2)">b &gt; a + 1 ?</text>

  <path d="M 492 175 L 552 175" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="518" y="166" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">是</text>
  <rect x="556" y="152" width="160" height="46" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="636" y="180" text-anchor="middle" font-size="14" fill="#a14340" filter="url(#rough2)">答案 −1</text>

  <path d="M 380 222 L 380 251" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="241" font-size="12" fill="#3c5e2e" filter="url(#rough2)">否</text>

  <!-- 菱形 2 -->
  <polygon points="380,255 500,300 380,345 260,300" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="306" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">(a − b) 是偶数 ?</text>

  <path d="M 258 300 L 204 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="231" y="291" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">否</text>
  <rect x="40" y="277" width="160" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="120" y="305" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">答案 a + 1</text>

  <path d="M 502 300 L 556 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="529" y="291" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <rect x="560" y="277" width="160" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="640" y="305" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">答案 a</text>

  <!-- 说明 -->
  <rect x="40" y="368" width="680" height="56" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="390" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">走到第 k 次操作后，高度必须满足 |y| ≤ k 且 y ≡ k (mod 2)；反过来每个满足的值都走得到</text>
  <text x="380" y="412" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">于是 b ≤ a+1 时两候选必定命中一个：偶差 ⇒ b ≤ a，奇差 ⇒ b ≡ a+1</text>
</svg>
