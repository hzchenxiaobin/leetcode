<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：容斥计数 + 二分收敛</text>

  <text x="30" y="58" font-size="10.5" fill="#446688" filter="url(#rough2)">① n = 5, a = 2, b = 11, c = 13　（lcm：22 / 26 / 143 / 286）</text>

  <rect x="30" y="68" width="570" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <g font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="42" y="85">x</text>
    <text x="110" y="85">容斥分项（加 3 项、减 3 项、加 1 项）</text>
    <text x="452" y="85">count(x)</text>
    <text x="524" y="85">判断</text>
  </g>

  <rect x="30" y="95" width="570" height="24" fill="#ffffff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="30" y="119" width="570" height="24" fill="#ffffff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="30" y="143" width="570" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="30" y="167" width="570" height="24" fill="#ffffff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <g font-size="10" fill="#444" filter="url(#rough2)">
    <text x="42" y="112">8</text>
    <text x="110" y="112">4 + 0 + 0 − 0 − 0 − 0 + 0</text>
    <text x="452" y="112">4</text>
    <text x="524" y="112">4 &lt; 5，向右</text>

    <text x="42" y="136">9</text>
    <text x="110" y="136">4 + 0 + 0 − 0 − 0 − 0 + 0</text>
    <text x="452" y="136">4</text>
    <text x="524" y="136">4 &lt; 5，向右</text>

    <text x="42" y="160" fill="#8a3a36" font-weight="bold">10</text>
    <text x="110" y="160" fill="#8a3a36">5 + 0 + 0 − 0 − 0 − 0 + 0</text>
    <text x="452" y="160" fill="#8a3a36" font-weight="bold">5</text>
    <text x="524" y="160" fill="#8a3a36">5 ≥ 5 ✓ 最小</text>

    <text x="42" y="184">11</text>
    <text x="110" y="184">5 + 1 + 0 − 0 − 0 − 0 + 0</text>
    <text x="452" y="184">6</text>
    <text x="524" y="184">6 ≥ 5，非最小</text>
  </g>

  <text x="30" y="222" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">② n = 4, a = 2, b = 3, c = 4　（lcm：6 / 4 / 12 / 12）</text>

  <rect x="30" y="232" width="570" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <g font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">
    <text x="42" y="249">x</text>
    <text x="110" y="249">容斥分项（加 3 项、减 3 项、加 1 项）</text>
    <text x="452" y="249">count(x)</text>
    <text x="524" y="249">判断</text>
  </g>

  <rect x="30" y="259" width="570" height="24" fill="#ffffff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="30" y="283" width="570" height="24" fill="#ffffff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="30" y="307" width="570" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>

  <g font-size="10" fill="#444" filter="url(#rough2)">
    <text x="42" y="276">4</text>
    <text x="110" y="276">2 + 1 + 1 − 0 − 1 − 0 + 0</text>
    <text x="452" y="276">3</text>
    <text x="524" y="276">3 &lt; 4，向右</text>

    <text x="42" y="300">5</text>
    <text x="110" y="300">2 + 1 + 1 − 0 − 1 − 0 + 0</text>
    <text x="452" y="300">3</text>
    <text x="524" y="300">3 &lt; 4，向右</text>

    <text x="42" y="324" fill="#8a3a36" font-weight="bold">6</text>
    <text x="110" y="324" fill="#8a3a36">3 + 2 + 1 − 1 − 1 − 0 + 0</text>
    <text x="452" y="324" fill="#8a3a36" font-weight="bold">4</text>
    <text x="524" y="324" fill="#8a3a36">4 ≥ 4 ✓ 最小</text>
  </g>

  <rect x="40" y="348" width="540" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#6a5a2a" filter="url(#rough2)">
    <text x="58" y="370">count(x) 每次只可能 +0 或 +1：只有 x 自己是丑数时才会增长，</text>
    <text x="58" y="390">所以「第一个 count(x) ≥ n 的 x」一定恰好是第 n 个丑数。</text>
  </g>
</svg>
