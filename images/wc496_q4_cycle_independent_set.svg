<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">核心观察：环形数组中峰不能相邻 → 选峰 = 环 Cn 上的「独立集」</text>

  <!-- ===== 左：环形数组（n = 8） ===== -->
  <ellipse cx="165" cy="218" rx="100" ry="85" fill="none" stroke="#999"
           stroke-width="1.6" stroke-dasharray="6,5" filter="url(#rough2)"/>

  <!-- 8 个格子围成一圈，值 [1,3,1,3,1,3,1,3]，奇数位为峰 -->
  <!-- i=0 顶 -->
  <rect x="145" y="118" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="132" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="145" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">0</text>
  <!-- i=1 右上（峰） -->
  <rect x="215.5" y="143" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235.5" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="235.5" y="170" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="256" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">峰</text>
  <!-- i=2 右 -->
  <rect x="245" y="203" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="217" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="265" y="230" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">2</text>
  <!-- i=3 右下（峰） -->
  <rect x="215.5" y="263" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235.5" y="277" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="235.5" y="290" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="256" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">峰</text>
  <!-- i=4 底 -->
  <rect x="145" y="288" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="302" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="315" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">4</text>
  <!-- i=5 左下（峰） -->
  <rect x="74.5" y="263" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="94.5" y="277" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="94.5" y="290" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="74" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">峰</text>
  <!-- i=6 左 -->
  <rect x="45" y="203" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="217" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="65" y="230" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">6</text>
  <!-- i=7 左上（峰） -->
  <rect x="74.5" y="143" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="94.5" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="94.5" y="170" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="74" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">峰</text>

  <text x="165" y="350" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n = 8 的环：峰(绿, 值3)与谷(蓝, 值1)交替，首尾相邻</text>
  <text x="165" y="370" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">峰两两不相邻 ⟹ 峰数 ≤ ⌊8/2⌋ = 4 个</text>

  <!-- ===== 右上：单峰代价 ===== -->
  <rect x="340" y="52" width="300" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="76" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">单峰代价（只依赖原始邻居值）</text>
  <text x="490" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cost[i] = max(0, max(左邻, 右邻) + 1 − nums[i])</text>
  <text x="490" y="120" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">（左邻 / 右邻即 nums[i∓1]，下标对 n 取模）</text>
  <text x="490" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">峰的邻居 ∉ S、永不被抬高（抬了只帮倒忙）</text>
  <text x="490" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⟹ 各峰代价互不耦合，总代价 = Σ cost[i]</text>

  <!-- ===== 右中：-1 判定 ===== -->
  <rect x="340" y="188" width="300" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="212" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">峰数上限 → −1 判定</text>
  <text x="490" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">相邻不能同为峰 ⟹ 峰数 ≤ ⌊n/2⌋</text>
  <text x="490" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">k &gt; ⌊n/2⌋ 直接返回 −1；否则隔一选一必有解</text>

  <!-- ===== 右下：至少 k → 恰好 k ===== -->
  <rect x="340" y="290" width="300" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="314" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">「至少 k」⟹「恰好 k」</text>
  <text x="490" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cost ≥ 0，独立集的子集仍是独立集</text>
  <text x="490" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⟹ 只需求环上「大小恰为 k」的最小权独立集</text>
</svg>
