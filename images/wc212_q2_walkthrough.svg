<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="680" height="570" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：nums = [4,6,5,9,3,7]，l = [0,0,2]，r = [2,3,5]</text>
  <path d="M 110 36 Q 340 44 570 36" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- nums strip -->
  <text x="40" y="72" font-size="11" font-family="monospace" fill="#555" filter="url(#r)">nums =</text>
  <g filter="url(#r)">
    <rect x="110" y="54" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="156" y="54" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="202" y="54" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="248" y="54" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="294" y="54" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="340" y="54" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#r)" font-size="13" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <text x="131" y="75">4</text>
    <text x="177" y="75">6</text>
    <text x="223" y="75">5</text>
    <text x="269" y="75">9</text>
    <text x="315" y="75">3</text>
    <text x="361" y="75">7</text>
  </g>
  <g filter="url(#r)" font-size="9" fill="#999" text-anchor="middle">
    <text x="131" y="96">0</text>
    <text x="177" y="96">1</text>
    <text x="223" y="96">2</text>
    <text x="269" y="96">3</text>
    <text x="315" y="96">4</text>
    <text x="361" y="96">5</text>
  </g>
  <text x="640" y="64" text-anchor="end" font-size="10.5" font-family="monospace" fill="#555" filter="url(#r)">l = [0, 0, 2]    r = [2, 3, 5]</text>
  <text x="640" y="80" text-anchor="end" font-size="10" fill="#888" filter="url(#r)">三个查询彼此独立，逐个过闸</text>

  <!-- ===== band 1: query 0 (true) ===== -->
  <g filter="url(#r)">
    <rect x="40" y="112" width="600" height="122" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="58" y="134" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">查询 0：nums[0..2] = [4, 6, 5]</text>
  <text x="624" y="134" text-anchor="end" font-size="10.5" font-family="monospace" fill="#444" filter="url(#r)">mn=4, mx=6 → (6−4)%2=0，d=1</text>
  <g filter="url(#r)">
    <rect x="70" y="146" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="116" y="146" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="162" y="146" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#r)" font-size="12" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <text x="88" y="163">4</text>
    <text x="134" y="163">6</text>
    <text x="180" y="163">5</text>
  </g>
  <g filter="url(#r)" stroke="#446688" stroke-width="1.4" fill="none">
    <path d="M 88 172 Q 89 183 90 191" marker-end="url(#ar)"/>
    <path d="M 134 172 Q 170 183 205 191" marker-end="url(#ar)"/>
    <path d="M 180 172 Q 167 183 153 191" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#r)">
    <rect x="64" y="194" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="124" y="194" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="184" y="194" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#r)" font-size="12.5" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="90" y="212">4</text>
    <text x="150" y="212">5</text>
    <text x="210" y="212">6</text>
  </g>
  <g filter="url(#r)" font-size="8.5" fill="#557" text-anchor="middle">
    <text x="90" y="224">k=0</text>
    <text x="150" y="224">k=1</text>
    <text x="210" y="224">k=2</text>
  </g>
  <g filter="url(#r)">
    <rect x="470" y="152" width="150" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="545" y="172" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">true ✓</text>
  <text x="545" y="190" text-anchor="middle" font-size="9.5" fill="#2e6e2e" filter="url(#r)">三槽恰好占满，双射成立</text>

  <!-- ===== band 2: query 1 (false, blocked at gate 2) ===== -->
  <g filter="url(#r)">
    <rect x="40" y="246" width="600" height="122" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="58" y="268" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">查询 1：nums[0..3] = [4, 6, 5, 9]</text>
  <text x="624" y="268" text-anchor="end" font-size="10.5" font-family="monospace" fill="#444" filter="url(#r)">mn=4, mx=9 → (9−4)%3=2 ≠ 0</text>
  <g filter="url(#r)">
    <rect x="70" y="280" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="116" y="280" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="162" y="280" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="208" y="280" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#r)" font-size="12" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <text x="88" y="297">4</text>
    <text x="134" y="297">6</text>
    <text x="180" y="297">5</text>
    <text x="226" y="297">9</text>
  </g>
  <path d="M 64 318 L 300 318" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" fill="none" filter="url(#r)"/>
  <g filter="url(#r)" stroke="#b85450" stroke-width="1.6">
    <line x1="64" y1="312" x2="64" y2="324"/>
    <line x1="300" y1="312" x2="300" y2="324"/>
  </g>
  <text x="310" y="322" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#r)">整除闸门拦截 → 直接 false</text>
  <g filter="url(#r)">
    <rect x="64" y="328" width="52" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="124" y="328" width="52" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="184" y="328" width="52" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="244" y="328" width="52" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <g filter="url(#r)" font-size="12.5" font-weight="bold" fill="#999" text-anchor="middle">
    <text x="90" y="346">？</text>
    <text x="150" y="346">？</text>
    <text x="210" y="346">？</text>
    <text x="270" y="346">？</text>
  </g>
  <g filter="url(#r)" font-size="8.5" fill="#999" text-anchor="middle">
    <text x="90" y="358">k=0</text>
    <text x="150" y="358">k=1</text>
    <text x="210" y="358">k=2</text>
    <text x="270" y="358">k=3</text>
  </g>
  <g filter="url(#r)">
    <rect x="470" y="286" width="150" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="545" y="306" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#r)">false ✗</text>
  <text x="545" y="324" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#r)">公差非整数，无需落槽</text>

  <!-- ===== band 3: query 2 (true) ===== -->
  <g filter="url(#r)">
    <rect x="40" y="380" width="600" height="122" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="58" y="402" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">查询 2：nums[2..5] = [5, 9, 3, 7]</text>
  <text x="624" y="402" text-anchor="end" font-size="10.5" font-family="monospace" fill="#444" filter="url(#r)">mn=3, mx=9 → (9−3)%3=0，d=2</text>
  <g filter="url(#r)">
    <rect x="70" y="414" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="116" y="414" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="162" y="414" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="208" y="414" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#r)" font-size="12" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <text x="88" y="431">5</text>
    <text x="134" y="431">9</text>
    <text x="180" y="431">3</text>
    <text x="226" y="431">7</text>
  </g>
  <g filter="url(#r)" stroke="#446688" stroke-width="1.4" fill="none">
    <path d="M 88 440 Q 115 451 146 459" marker-end="url(#ar)"/>
    <path d="M 134 440 Q 200 451 262 459" marker-end="url(#ar)"/>
    <path d="M 180 440 Q 135 451 96 459" marker-end="url(#ar)"/>
    <path d="M 226 440 Q 218 451 212 459" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#r)">
    <rect x="64" y="462" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="124" y="462" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="184" y="462" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="244" y="462" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#r)" font-size="12.5" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="90" y="480">3</text>
    <text x="150" y="480">5</text>
    <text x="210" y="480">7</text>
    <text x="270" y="480">9</text>
  </g>
  <g filter="url(#r)" font-size="8.5" fill="#557" text-anchor="middle">
    <text x="90" y="492">k=0</text>
    <text x="150" y="492">k=1</text>
    <text x="210" y="492">k=2</text>
    <text x="270" y="492">k=3</text>
  </g>
  <g filter="url(#r)">
    <rect x="470" y="420" width="150" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="545" y="440" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">true ✓</text>
  <text x="545" y="458" text-anchor="middle" font-size="9.5" fill="#2e6e2e" filter="url(#r)">d=2，四槽各归其位</text>

  <!-- bottom note -->
  <g filter="url(#r)">
    <rect x="40" y="514" width="600" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="58" y="534" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#r)">对照：示例 3 的 [0, 2, 2, 6] 会通过前两道闸门（d=2）</text>
  <text x="58" y="550" font-size="10.5" fill="#444" filter="url(#r)">但两个 2 撞在 k=1、k=2 空 —— 第三道闸门（seen 查重）才是唯一能拦住它的地方</text>
</svg>
