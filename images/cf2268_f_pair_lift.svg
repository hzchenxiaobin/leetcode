<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="452" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">组内提升：等高就一起抬；不等高就借「外侧」邻列把深的那个拖上来</text>
  <text x="330" y="45" text-anchor="middle" font-size="10" fill="#888">令牌 = 本阶段要归位的值 x；目标行 = 第 x 行；三者都只用到 i ≥ x 的操作</text>

  <!-- ================= panel A : p == q ================= -->
  <g filter="url(#rough2)">
    <rect x="26" y="58" width="608" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
  </g>
  <text x="40" y="78" font-size="11" fill="#2f4f6f" font-weight="bold" filter="url(#rough2)">① p = q：组内操作 (i, L) 把两个令牌一起上移，1 步 = 2 个令牌</text>
  <!-- strip L -->
  <g filter="url(#rough2)">
    <rect x="60" y="88" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="60" y="106" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="60" y="124" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="60" y="142" width="40" height="18" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="110" y="88" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="110" y="106" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="110" y="124" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="110" y="142" width="40" height="18" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
  </g>
  <g font-size="9.5" fill="#7a3a36" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="152">x 已在 i+1</text><text x="130" y="152">x 已在 i+1</text>
    <text x="80" y="101">junk</text><text x="80" y="119">junk</text><text x="80" y="137">junk</text>
    <text x="130" y="101">junk</text><text x="130" y="119">junk</text><text x="130" y="137">junk</text>
  </g>
  <text x="160" y="101" font-size="10" fill="#555" filter="url(#rough2)">第 x 行</text>
  <text x="160" y="152" font-size="10" fill="#555" filter="url(#rough2)">第 p+1 行</text>
  <g stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)">
    <path d="M80 142 L80 96" marker-end="url(#arrR)"/>
    <path d="M130 142 L130 96" marker-end="url(#arrR)"/>
  </g>
  <g font-size="10" fill="#2f4f6f" filter="url(#rough2)">
    <text x="250" y="104">左列 L、右列 R 的令牌深度相同（都在第 p 行）</text>
    <text x="250" y="124">⇒ 连续做 p − x 次 op(i, L)，i = p−1 … x</text>
    <text x="250" y="144">每次操作在两列上各消掉一个「该值不在第 x 行」的毛病</text>
    <text x="250" y="162" fill="#8a4b46">开销 p − x：这是最理想的情况，全程贴着下界</text>
  </g>

  <!-- ================= panel B : p > q ================= -->
  <g filter="url(#rough2)">
    <rect x="26" y="180" width="608" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
  </g>
  <text x="40" y="200" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">② p &gt; q：把深的那个（左列）借左邻 L−1 拖上来，再一起抬</text>
  <g filter="url(#rough2)">
    <rect x="60" y="210" width="34" height="16" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="60" y="226" width="34" height="16" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="60" y="242" width="34" height="16" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="60" y="258" width="34" height="16" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="60" y="274" width="34" height="16" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="104" y="210" width="34" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="104" y="226" width="34" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="104" y="242" width="34" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="104" y="258" width="34" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="104" y="274" width="34" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="148" y="210" width="34" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="148" y="226" width="34" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="148" y="242" width="34" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="148" y="258" width="34" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="148" y="274" width="34" height="16" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
  </g>
  <g font-size="8.5" fill="#444" text-anchor="middle" filter="url(#rough2)">
    <text x="77" y="302">L−1（被拖）</text>
    <text x="121" y="302">列 L</text>
    <text x="165" y="302">列 R</text>
  </g>
  <g font-size="9" fill="#7a3a36" text-anchor="middle" filter="url(#rough2)">
    <text x="121" y="286">x</text>
    <text x="165" y="254">x</text>
  </g>
  <g stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)">
    <path d="M121 276 L121 214" marker-end="url(#arrR)"/>
  </g>
  <text x="190" y="222" font-size="10" fill="#7a5a20" filter="url(#rough2)">op(i, L−1) 只抬 L 的令牌，被拖的是 L−1 列（它还没处理，随便脏）</text>
  <text x="190" y="242" font-size="10" fill="#7a5a20" filter="url(#rough2)">把 L 的令牌拖到第 q 行 ⇒ 两组令牌等高 ⇒ 回到 ① 一起抬</text>
  <text x="190" y="262" font-size="10" fill="#7a5a20" filter="url(#rough2)">p &lt; q 完全对称：借右邻 R+1，用 op(i, R) 把 R 的令牌拖到第 p 行</text>
  <text x="190" y="282" font-size="9.5" fill="#a07020">总开销仍是 max(p, q) − x，没有浪费</text>
  <text x="190" y="300" font-size="9.5" fill="#a07020">拖拽的每一步都在第 q 行以上，绝不碰已就位的前 x−1 行</text>

  <!-- ================= panel C : corner cases ================= -->
  <g filter="url(#rough2)">
    <rect x="26" y="322" width="608" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
  </g>
  <text x="40" y="342" font-size="11" fill="#33502a" font-weight="bold" filter="url(#rough2)">③ 退化情形：一侧令牌已经正好在第 x 行（q = x）</text>
  <g font-size="10" fill="#33502a" filter="url(#rough2)">
    <text x="40" y="362">此时最后一步「把另一个拖上来」必然动到已就位的那个，两种补法：</text>
    <text x="56" y="382">• 若左邻尚未处理：直接 op(x, L−1) 把左令牌拖到第 x 行（1 步，最优）；</text>
    <text x="56" y="400">• 否则：op(x, L) 把已就位的右令牌压到 x+1 行，再把左令牌拖到 x+1 行，最后 op(x, L) 一起抬回第 x 行（多 1 步）；</text>
    <text x="56" y="418">• 没有外侧邻列的首尾列对同理由内侧那一侧代劳，最坏多 3 步；整列唯一受影响的只有第 x 行以下。</text>
    <text x="40" y="434" font-size="9.5" fill="#4a7a3a">这些「一侧已就位」的列对在随机数据里每阶段只有 O(1) 个，所以额外的 9n 次额度绰绰有余。</text>
  </g>
</svg>
