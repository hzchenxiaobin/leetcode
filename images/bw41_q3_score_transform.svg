<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="15"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">取走石子 i = 自己得 a[i] + 剥夺对方 b[i]</text>

  <!-- 天平 -->
  <g filter="url(#rough2)">
    <path d="M 280 70 L 150 110" fill="none" stroke="#888" stroke-width="3"/>
    <path d="M 280 70 L 410 110" fill="none" stroke="#888" stroke-width="3"/>
    <rect x="270" y="64" width="20" height="16" fill="#d6a040" rx="4"/>
  </g>

  <!-- 左盘：Alice -->
  <g filter="url(#rough2)">
    <path d="M 100 110 L 200 110" fill="none" stroke="#888" stroke-width="3"/>
    <rect x="88" y="112" width="124" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#446688" text-anchor="middle">
    <text x="150" y="134">Alice 得分</text>
    <text x="150" y="154">+ aliceValues[i]</text>
  </g>

  <!-- 右盘：Bob -->
  <g filter="url(#rough2)">
    <path d="M 360 110 L 460 110" fill="none" stroke="#888" stroke-width="3"/>
    <rect x="348" y="112" width="124" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#b85450" text-anchor="middle">
    <text x="410" y="134">Bob 被剥夺</text>
    <text x="410" y="154">− bobValues[i]</text>
  </g>

  <!-- 取走动作 -->
  <g filter="url(#rough2)">
    <ellipse cx="280" cy="196" rx="60" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="202" font-size="14" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">石子 i</text>

  <path d="M 240 190 C 190 170, 170 160, 152 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 190 C 370 170, 390 160, 408 150" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分差公式 -->
  <g filter="url(#rough2)">
    <rect x="60" y="240" width="440" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2d5a22" text-anchor="middle">
    <text x="280" y="262">分差 D = Σ(取走的 s[i]) − Σ bobValues，s[i]=a[i]+b[i]</text>
    <text x="280" y="284">第二项与策略无关 → 等价于"轮流取 s 值"的博弈</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="110" y="300" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="320" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">"拿到 + 不让对方拿到"合并成同一个量纲 s[i]</text>
</svg>
