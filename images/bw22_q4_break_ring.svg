<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">断环成链：首尾不能同取 → 拆成两条链分别 DP 取最大</text>

  <!-- 环 -->
  <g filter="url(#rough2)">
    <ellipse cx="110" cy="150" rx="78" ry="72" fill="none" stroke="#ccc" stroke-width="1.3" stroke-dasharray="6 5"/>
    <circle cx="110" cy="78" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="44" cy="150" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="176" cy="150" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="72" cy="212" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="148" cy="212" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="110" y="83" font-weight="bold" fill="#8a3833">首块</text>
    <text x="44" y="155">尾块</text>
  </g>
  <text x="110" y="258" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">首、尾在环上相邻 → 不能同时选</text>

  <!-- 两条链 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold">
    <text x="400" y="70" text-anchor="middle">情形一：不选首块 → 链 = slices[1..]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="300" y="82" width="38" height="36" fill="#eeeeee" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="342" y="82" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="384" y="82" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="426" y="82" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="468" y="82" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="510" y="82" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="319" y="104">弃</text>
    <text x="361" y="104">可自由选</text>
    <text x="403" y="104"></text>
    <text x="445" y="104"></text>
    <text x="487" y="104"></text>
    <text x="529" y="104"></text>
  </g>

  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold">
    <text x="400" y="160" text-anchor="middle">情形二：不选尾块 → 链 = slices[..3n−2]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="300" y="172" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="342" y="172" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="384" y="172" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="426" y="172" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="468" y="172" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="510" y="172" width="38" height="36" fill="#eeeeee" stroke="#999" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="529" y="194">弃</text>
  </g>

  <path d="M 196 140 C 250 120, 270 104, 296 100" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 196 166 C 250 186, 270 190, 296 190" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- DP 说明 -->
  <rect x="30" y="238" width="500" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5c1e">
    <text x="280" y="262" text-anchor="middle" font-weight="bold">链上 DP：dp[j][0/1] = 前 i 个选 j 个、第 i 个不选/选的最大和</text>
    <text x="280" y="284" text-anchor="middle">转移：dp[j][0] = max(dp[j][0], dp[j][1])（跳过当前）</text>
    <text x="280" y="304" text-anchor="middle">　　　dp[j][1] = dp[j−1][0] + a[i]（前一个必须没选）</text>
  </g>
</svg>
