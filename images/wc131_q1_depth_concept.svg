<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="310" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">深度视角：最外层括号 = 深度跨越 0↔1 的位置</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">s = "(()())(())"，红色四个字符就是各原语的最外层</text>
  <rect x="42.0" y="88.0" width="40.0" height="42.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="62.0" y="114.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(</text>
  <text x="62.0" y="148.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">d=0</text>
  <text x="62.0" y="166.0" font-size="9" fill="#b85450" text-anchor="middle" filter="url(#rough2)">删</text>
  <rect x="88.0" y="88.0" width="40.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="108.0" y="114.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(</text>
  <text x="108.0" y="148.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">d=1</text>
  <text x="108.0" y="166.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">留</text>
  <rect x="134.0" y="88.0" width="40.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="154.0" y="114.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">)</text>
  <text x="154.0" y="148.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">d=2</text>
  <text x="154.0" y="166.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">留</text>
  <rect x="180.0" y="88.0" width="40.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200.0" y="114.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(</text>
  <text x="200.0" y="148.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">d=1</text>
  <text x="200.0" y="166.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">留</text>
  <rect x="226.0" y="88.0" width="40.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="246.0" y="114.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">)</text>
  <text x="246.0" y="148.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">d=2</text>
  <text x="246.0" y="166.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">留</text>
  <rect x="272.0" y="88.0" width="40.0" height="42.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="292.0" y="114.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">)</text>
  <text x="292.0" y="148.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">d=1</text>
  <text x="292.0" y="166.0" font-size="9" fill="#b85450" text-anchor="middle" filter="url(#rough2)">删</text>
  <rect x="318.0" y="88.0" width="40.0" height="42.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="338.0" y="114.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(</text>
  <text x="338.0" y="148.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">d=0</text>
  <text x="338.0" y="166.0" font-size="9" fill="#b85450" text-anchor="middle" filter="url(#rough2)">删</text>
  <rect x="364.0" y="88.0" width="40.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="384.0" y="114.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(</text>
  <text x="384.0" y="148.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">d=1</text>
  <text x="384.0" y="166.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">留</text>
  <rect x="410.0" y="88.0" width="40.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430.0" y="114.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">)</text>
  <text x="430.0" y="148.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">d=2</text>
  <text x="430.0" y="166.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">留</text>
  <rect x="456.0" y="88.0" width="40.0" height="42.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="476.0" y="114.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">)</text>
  <text x="476.0" y="148.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">d=1</text>
  <text x="476.0" y="166.0" font-size="9" fill="#b85450" text-anchor="middle" filter="url(#rough2)">删</text>
  <rect x="30.0" y="196.0" width="240.0" height="50.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150.0" y="217.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">'(' 保留 ⟺ 读它之前 depth &gt; 0</text>
  <text x="150.0" y="231.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">（在 0 处它开启新原语）</text>
  <rect x="290.0" y="196.0" width="240.0" height="50.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410.0" y="217.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">')' 保留 ⟺ 读它之后 depth &gt; 0</text>
  <text x="410.0" y="231.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">（降到 0 时它关闭原语）</text>
  <text x="25.0" y="272.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">同一遍扫描即可判定：判断条件只需比较 depth 与 0，无需显式栈。</text>
  <text x="25.0" y="294.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">结果 "()()" + "()" = "()()()"。</text>
</svg>
