<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">把 words 压缩成列字符计数表 cnt</text>

  <!-- 三个单词（行） -->
  <g filter="url(#rough2)" font-size="13" fill="#888">
    <text x="40" y="72">words[0]</text>
    <text x="40" y="102">words[1]</text>
    <text x="40" y="132">words[2]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="120" y="56" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="156" y="56" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="192" y="56" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="228" y="56" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="120" y="86" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="156" y="86" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="192" y="86" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="228" y="86" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="120" y="116" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="156" y="116" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <rect x="192" y="116" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="228" y="116" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="138" y="72">a</text><text x="174" y="72">c</text><text x="210" y="72">c</text><text x="246" y="72">a</text>
    <text x="138" y="102">b</text><text x="174" y="102">b</text><text x="210" y="102">b</text><text x="246" y="102">b</text>
    <text x="138" y="132">c</text><text x="174" y="132">a</text><text x="210" y="132">c</text><text x="246" y="132">a</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#888" text-anchor="middle">
    <text x="138" y="150">列0</text><text x="174" y="150">列1</text><text x="210" y="150">列2</text><text x="246" y="150">列3</text>
  </g>

  <!-- 压缩箭头 -->
  <path d="M 190 158 C 190 178, 190 186, 190 198" fill="none" stroke="#446688" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="180" font-size="12.5" fill="#446688" filter="url(#rough2)">按列统计 →</text>

  <!-- cnt 表 -->
  <g filter="url(#rough2)">
    <rect x="70" y="204" width="300" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <line x1="70" y1="238" x2="370" y2="238" stroke="#c3d0e4" stroke-width="1.2"/>
    <line x1="70" y1="272" x2="370" y2="272" stroke="#c3d0e4" stroke-width="1.2"/>
    <line x1="70" y1="306" x2="370" y2="306" stroke="#c3d0e4" stroke-width="1.2"/>
    <line x1="150" y1="204" x2="150" y2="344" stroke="#c3d0e4" stroke-width="1.2"/>
    <line x1="230" y1="204" x2="230" y2="344" stroke="#c3d0e4" stroke-width="1.2"/>
    <line x1="310" y1="204" x2="310" y2="344" stroke="#c3d0e4" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#446688" text-anchor="middle">
    <text x="110" y="226" font-weight="bold">cnt</text><text x="190" y="226">列0</text><text x="270" y="226">列1</text>
    <text x="350" y="226" font-size="10.5">列2 …</text>
    <text x="110" y="260">a</text><text x="190" y="260">1</text><text x="270" y="260">1</text><text x="350" y="260">0</text>
    <text x="110" y="294">b</text><text x="190" y="294">1</text><text x="270" y="294">1</text><text x="350" y="294">1</text>
    <text x="110" y="328">c</text><text x="190" y="328">1</text><text x="270" y="328">1</text><text x="350" y="328">2</text>
  </g>

  <!-- 右侧说明 -->
  <g filter="url(#rough2)">
    <rect x="390" y="204" width="150" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a5a10">
    <text x="465" y="230" text-anchor="middle">单词选谁不重要，</text>
    <text x="465" y="252" text-anchor="middle">只数「有几种选法」：</text>
    <text x="465" y="282" text-anchor="middle" font-weight="bold">cnt[j][c] = 第 j 列</text>
    <text x="465" y="302" text-anchor="middle" font-weight="bold">字符 c 的单词数</text>
    <text x="465" y="330" text-anchor="middle" font-size="11">信息量 1000×1000</text>
    <text x="465" y="344" text-anchor="middle" font-size="11">→ 1000×26</text>
  </g>
</svg>
