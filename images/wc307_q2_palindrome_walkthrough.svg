<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：正常构造 与 前导零陷阱</text>
  <path d="M 210 36 Q 320 44 430 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- panel 1 -->
  <g filter="url(#sk)">
    <rect x="28" y="52" width="584" height="204" rx="10" fill="#f6fbf6" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="48" y="80" font-size="14" font-weight="bold" fill="#2e6e2e">num = "444947137"</text>
  <g font-size="12" fill="#333">
    <text x="48" y="106">① 频次：4×4、7×2、9/3/1 各 1</text>
    <text x="48" y="130">② 对数取满：4 → 2 对，7 → 1 对</text>
    <text x="48" y="154">③ left（9→0 降序）= 744</text>
    <text x="48" y="178">④ center = 9（最大落单）</text>
    <text x="48" y="202">⑤ left[0]='7' 非零，不触发清空</text>
  </g>
  <text x="483" y="108" text-anchor="middle" font-size="10.5" fill="#888">left + center + left 的逆序</text>
  <g filter="url(#sk)">
    <rect x="352" y="120" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="390" y="120" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="428" y="120" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="466" y="120" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="504" y="120" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="542" y="120" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="580" y="120" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#333">
    <text x="369" y="142">7</text>
    <text x="407" y="142">4</text>
    <text x="445" y="142">4</text>
    <text x="483" y="142" fill="#b8860b">9</text>
    <text x="521" y="142">4</text>
    <text x="559" y="142">4</text>
    <text x="597" y="142">7</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#666">
    <text x="406" y="172">left</text>
    <text x="483" y="172">center</text>
    <text x="592" y="172">left^R</text>
  </g>
  <text x="483" y="212" text-anchor="middle" font-size="15" font-weight="bold" font-family="monospace" fill="#2e6e2e">res = 7449447 ✓</text>

  <!-- panel 2 -->
  <g filter="url(#sk)">
    <rect x="28" y="272" width="584" height="196" rx="10" fill="#fef6f6" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="48" y="300" font-size="14" font-weight="bold" fill="#b85450">num = "00009"（前导零陷阱）</text>
  <g font-size="12" fill="#333">
    <text x="48" y="326">① 频次：0×4、9×1</text>
    <text x="48" y="350">② 对数：0 → 2 对，9 → 0 对，left = "00"</text>
    <text x="48" y="374">③ left[0] == '0'：无非零配对 → 清空</text>
    <text x="48" y="398">④ center = 9 → res = "9"</text>
  </g>
  <text x="48" y="432" font-size="11" font-style="italic" fill="#888">注：全零且无落单（如 "0000"）→ res 为空 → 兜底返回 "0"</text>
  <text x="432" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">left = "00" → 丢弃</text>
  <g filter="url(#sk)">
    <rect x="396" y="318" width="34" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
    <rect x="434" y="318" width="34" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#888">
    <text x="413" y="340">0</text>
    <text x="451" y="340">0</text>
  </g>
  <g stroke="#b85450" stroke-width="2.5" filter="url(#sk)">
    <path d="M 390 312 L 474 358"/>
    <path d="M 474 312 L 390 358"/>
  </g>
  <path d="M 432 368 L 432 388" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="415" y="392" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="432" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8860b">9</text>
  <text x="462" y="414" font-size="14" font-weight="bold" font-family="monospace" fill="#2e6e2e">res = "9" ✓</text>
</svg>
