<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：四次出现怎么落到 4n 个位置上</text>
  <text x="320" y="46" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">O(n) 直接算位置填数，不需要搜索、不需要随机化</text>

  <g filter="url(#rough2)">
    <rect x="40" y="60" width="400" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="240" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66">读入 t，多测循环 t 次</text>

    <rect x="40" y="112" width="400" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="240" y="135" text-anchor="middle" font-size="10.5" fill="#3a4a66">读入 n，开一个长度 4n 的数组 a[]</text>

    <path d="M 240 96 L 240 110" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 240 148 L 240 166" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <polygon points="90,198 240,168 390,198 240,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="240" y="202" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">n = 2 ?</text>
  </g>

  <path d="M 390 198 L 466 198" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="192" text-anchor="middle" font-size="9.5" fill="#8a3a38" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="470" y="176" width="150" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="545" y="194" text-anchor="middle" font-size="10" fill="#8a3a38" font-weight="bold">n = 2 特判</text>
    <text x="545" y="211" text-anchor="middle" font-size="9.5" fill="#8a3a38">s = (0, 0, 1, 0)</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 240 228 L 240 246" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="252" y="242" font-size="9.5" fill="#4a7a3a">否</text>

    <rect x="40" y="248" width="400" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="240" y="266" text-anchor="middle" font-size="10.5" fill="#3a5a30">取偏移 s = (0, 0, 1, 3)：a_k = cyc(x + s_k)</text>
    <text x="240" y="282" text-anchor="middle" font-size="9.5" fill="#3a5a30">⇒ Δ = (0, 1, 2)；无环绕行的间隔是 n, n+1, n+2</text>

    <path d="M 240 288 L 240 302" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="40" y="304" width="400" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="240" y="322" text-anchor="middle" font-size="10.5" fill="#3a4a66">对每个 x：p_k = k·n + a_k(x)，然后 a[p_k] ← x</text>
    <text x="240" y="338" text-anchor="middle" font-size="9.5" fill="#3a4a66">四个位置分别落在四个块里，天然不重不漏</text>

    <path d="M 240 344 L 240 358" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="40" y="360" width="400" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="240" y="384" text-anchor="middle" font-size="10.5" fill="#8a6a20">输出 a[1..4n]，每个测试占一行</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#888">
    <text x="466" y="128">数组长 4n ≤ 800</text>
    <text x="466" y="240">cyc(v) = ((v−1) mod n) + 1</text>
    <text x="466" y="258">块 k = 位置 k·n+1 起到 (k+1)·n</text>
    <text x="466" y="276">间隔恒为 n + Δ_k</text>
    <text x="466" y="368">总输出 ≤ 8×10⁴ 个数</text>
  </g>
</svg>
