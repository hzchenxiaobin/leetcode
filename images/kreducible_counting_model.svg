<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">数位计数：在第一个「n 是 1、x 是 0」的位置分岔</text>
  <text x="310" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">以 s = "1101"（n = 13，L = 4）为例 —— 统计 [0, n−1] 中恰有 c 个置位的数 N(n, c)</text>

  <!-- s 的位 -->
  <g filter="url(#rough2)">
    <rect x="230" y="62" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="276" y="62" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="322" y="62" width="40" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="368" y="62" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="14" fill="#333">
    <text x="250" y="84">1</text>
    <text x="296" y="84">1</text>
    <text x="342" y="84" fill="#999">0</text>
    <text x="388" y="84">1</text>
  </g>
  <text x="215" y="84" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)" text-anchor="middle" font-size="10" fill="#777">
    <text x="250" y="110">i = 0 ✓</text>
    <text x="296" y="110">i = 1 ✓</text>
    <text x="342" y="110">i = 2</text>
    <text x="388" y="110">i = 3 ✓</text>
  </g>

  <!-- 分支 A：i=0 -->
  <text x="28" y="160" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">分歧位 i=0</text>
  <g filter="url(#rough2)">
    <rect x="140" y="142" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="176" y="142" width="32" height="26" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="212" y="142" width="32" height="26" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="248" y="142" width="32" height="26" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <text x="156" y="160" fill="#8a6a1a" font-weight="bold">0</text>
    <text x="192" y="160" fill="#999">?</text>
    <text x="228" y="160" fill="#999">?</text>
    <text x="264" y="160" fill="#999">?</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="300" y="152">ones = 0，后 3 位自由</text>
    <text x="300" y="168">恰放 c 个 1：C(3, c)，覆盖 x ∈ [0, 7]</text>
  </g>

  <!-- 分支 B：i=1 -->
  <text x="28" y="210" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">分歧位 i=1</text>
  <g filter="url(#rough2)">
    <rect x="140" y="192" width="32" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="176" y="192" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="212" y="192" width="32" height="26" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="248" y="192" width="32" height="26" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <text x="156" y="210" fill="#446688">1</text>
    <text x="192" y="210" fill="#8a6a1a" font-weight="bold">0</text>
    <text x="228" y="210" fill="#999">?</text>
    <text x="264" y="210" fill="#999">?</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="300" y="202">前缀照抄（1 个 1），后 2 位自由</text>
    <text x="300" y="218">C(2, c−1)，覆盖 x ∈ [8, 11]</text>
  </g>

  <!-- 分支 C：i=3 -->
  <text x="28" y="260" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">分歧位 i=3</text>
  <g filter="url(#rough2)">
    <rect x="140" y="242" width="32" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="176" y="242" width="32" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="212" y="242" width="32" height="26" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.6"/>
    <rect x="248" y="242" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <text x="156" y="260" fill="#446688">1</text>
    <text x="192" y="260" fill="#446688">1</text>
    <text x="228" y="260" fill="#999">0</text>
    <text x="264" y="260" fill="#8a6a1a" font-weight="bold">0</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="300" y="252">前缀含 2 个 1，后 0 位自由</text>
    <text x="300" y="268">C(0, c−2)，x = 12 定死</text>
  </g>

  <text x="140" y="287" font-size="10.5" fill="#b85450" filter="url(#rough2)">i = 2 是 '0' 位：x 只能照抄 0，无法在此「变得比 n 小」，不构成分歧位 ✗</text>

  <!-- 公式 -->
  <rect x="40" y="298" width="540" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">N(n, c) = Σ C(L−1−i, c − ones)　（对所有 s[i]='1' 的 i 求和）</text>
  <text x="310" y="344" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ones = s[0..i−1] 中 1 的个数；组合数下标越界（&lt;0 或 &gt; 自由位数）记 0</text>
  <text x="310" y="360" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">每个分支 = 前缀照抄 + 该位翻 0 + 后缀任填</text>

  <!-- 汇总 -->
  <rect x="40" y="382" width="540" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">ans = Σ (c ∈ A) N(n, c)</text>
  <text x="310" y="428" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每个 x &lt; n 的分歧位唯一 → 不重不漏；x = 0 对应 c = 0 ∉ A，自动排除</text>
</svg>
