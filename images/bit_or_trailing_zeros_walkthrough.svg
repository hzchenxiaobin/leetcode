<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：一趟扫描数偶数</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Example 1 -->
  <text x="320" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">示例 1：nums = [1, 2, 3, 4, 5]</text>

  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="120" y="76" width="56" height="34" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.4"/></g>
    <text x="148" y="98" text-anchor="middle" fill="#666">1 奇</text>
    <g filter="url(#sk)"><rect x="188" y="76" width="56" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="216" y="98" text-anchor="middle" fill="#2e5e2e" font-weight="bold">2 偶</text>
    <g filter="url(#sk)"><rect x="256" y="76" width="56" height="34" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.4"/></g>
    <text x="284" y="98" text-anchor="middle" fill="#666">3 奇</text>
    <g filter="url(#sk)"><rect x="324" y="76" width="56" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
    <text x="352" y="98" text-anchor="middle" fill="#2e5e2e" font-weight="bold">4 偶</text>
    <g filter="url(#sk)"><rect x="392" y="76" width="56" height="34" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.4"/></g>
    <text x="420" y="98" text-anchor="middle" fill="#666">5 奇</text>
  </g>

  <g font-size="11.5" fill="#555" font-family="monospace">
    <text x="148" y="126" text-anchor="middle">cnt=0</text>
    <text x="216" y="126" text-anchor="middle">cnt=1</text>
    <text x="284" y="126" text-anchor="middle">cnt=1</text>
    <text x="352" y="126" text-anchor="middle" fill="#2e5e2e" font-weight="bold">cnt=2 满了!</text>
    <text x="420" y="126" text-anchor="middle" fill="#888">不再看</text>
  </g>
  <path d="M 352 132 Q 380 150 448 150" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="452" y="136" width="148" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="526" y="156" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">return true ✓</text>

  <g filter="url(#sk)">
    <rect x="120" y="172" width="400" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="320" y="192" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">验证：2 | 4 = 6 = "110"，末位一个 0 ✓</text>

  <!-- Example 3 -->
  <text x="320" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">示例 3：nums = [1, 3, 5, 7, 9]</text>

  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="120" y="252" width="56" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="148" y="274" text-anchor="middle" fill="#8f3a36">1 奇</text>
    <g filter="url(#sk)"><rect x="188" y="252" width="56" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="216" y="274" text-anchor="middle" fill="#8f3a36">3 奇</text>
    <g filter="url(#sk)"><rect x="256" y="252" width="56" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="284" y="274" text-anchor="middle" fill="#8f3a36">5 奇</text>
    <g filter="url(#sk)"><rect x="324" y="252" width="56" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="352" y="274" text-anchor="middle" fill="#8f3a36">7 奇</text>
    <g filter="url(#sk)"><rect x="392" y="252" width="56" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="420" y="274" text-anchor="middle" fill="#8f3a36">9 奇</text>
  </g>

  <g font-size="11.5" fill="#555" font-family="monospace">
    <text x="148" y="302" text-anchor="middle">cnt=0</text>
    <text x="216" y="302" text-anchor="middle">cnt=0</text>
    <text x="284" y="302" text-anchor="middle">cnt=0</text>
    <text x="352" y="302" text-anchor="middle">cnt=0</text>
    <text x="420" y="302" text-anchor="middle">cnt=0</text>
  </g>
  <g filter="url(#sk)">
    <rect x="452" y="286" width="148" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="526" y="306" text-anchor="middle" font-size="13" fill="#8f3a36" font-weight="bold">return false ✗</text>

  <!-- Reason note -->
  <g filter="url(#sk)">
    <rect x="120" y="330" width="400" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="320" y="350" text-anchor="middle" font-size="12.5" fill="#8f3a36" font-family="monospace">全奇数：任选 ≥2 个，OR 末位必为 1 ✗</text>

  <!-- Footer -->
  <g filter="url(#sk)">
    <rect x="70" y="376" width="500" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="320" y="398" text-anchor="middle" font-size="12.5" fill="#33557a">判定只依赖一个统计量：偶数个数。扫描一趟，攒够两个即可提前收工。</text>
</svg>
