<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">第二类斯特林数：S(i, j) = S(i-1, j-1) + j · S(i-1, j)</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">含义：把 i 个有区别的人分成 j 个无区别的非空组</text>

  <text x="280" y="72" text-anchor="middle" font-size="10.5" fill="#666">i = 1：S(1,1) = 1</text>
  <rect x="220" y="80" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="280" y="99" text-anchor="middle" font-size="11" fill="#3a4a66">S(1,1) = 1</text>

  <text x="280" y="128" text-anchor="middle" font-size="10.5" fill="#666">i = 2</text>
  <rect x="160" y="136" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="220" y="155" text-anchor="middle" font-size="11" fill="#3a4a66">S(2,1) = 1</text>
  <rect x="290" y="136" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="350" y="155" text-anchor="middle" font-size="11" fill="#3a4a66">S(2,2) = 1</text>

  <text x="280" y="184" text-anchor="middle" font-size="10.5" fill="#666">i = 3</text>
  <rect x="100" y="192" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="160" y="211" text-anchor="middle" font-size="11" fill="#3a4a66">S(3,1) = 1</text>
  <rect x="230" y="192" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="290" y="211" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">S(3,2) = 3</text>
  <rect x="360" y="192" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="420" y="211" text-anchor="middle" font-size="11" fill="#3a4a66">S(3,3) = 1</text>

  <path d="M 220 164 L 250 192" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="182" font-size="9.5" fill="#4a7a3a">S(2,1)→新组</text>
  <path d="M 350 164 L 320 192" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="352" y="186" font-size="9.5" fill="#446688">2·S(2,2) → 并入旧组</text>

  <rect x="52" y="240" width="456" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="261" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">S(3,2) = S(2,1) + 2 · S(2,2) = 1 + 2 × 1 = 3</text>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#555">第 3 个人要么自成一组（前 2 人分 1 组），要么加入已有的 2 组之一</text>

  <rect x="52" y="304" width="456" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="10.5" fill="#3a5a30">再做一层「组是有编号的」：满射数 = j! · S(n, j)</text>
  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#3a5a30">n = 3、j = 2 时满射数 = 2! × 3 = 6（3 人分到节目 A、B 且都非空的 6 种安排）</text>
</svg>
