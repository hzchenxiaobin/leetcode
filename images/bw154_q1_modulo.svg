<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 336" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="336" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">只做减法：把总和减到 k 的倍数</text>
  <text x="270" y="47" text-anchor="middle" font-size="11" fill="#888">每次操作让总和恰好 −1，所以问题变成「最少减几次」</text>

  <path d="M 50 176 L 492 176" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <circle cx="60" cy="176" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="60" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">10</text>
  <circle cx="200" cy="176" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">15</text>
  <circle cx="340" cy="176" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="340" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">20</text>
  <circle cx="480" cy="176" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="480" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">25</text>

  <circle cx="312" cy="176" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="312" y="164" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">S = 19</text>

  <path d="M 306 154 L 212 118" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">减 4 次</text>

  <rect x="118" y="84" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="193" y="102" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">15 = 3 × 5 ✓</text>

  <path d="M 312 196 L 312 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a">19 mod 5 = 4</text>

  <rect x="60" y="240" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="260" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">答案 = S mod k</text>
  <text x="160" y="277" text-anchor="middle" font-size="10" fill="#666">19 − 4 = 15 已是 5 的倍数</text>

  <rect x="284" y="240" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="384" y="260" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">更少为什么不行</text>
  <text x="384" y="277" text-anchor="middle" font-size="10" fill="#777">0 ≤ t &lt; r 时 S − t 必有余数</text>

  <text x="270" y="312" text-anchor="middle" font-size="10" fill="#999">只能减不能加，所以「往上凑到下一个倍数」的选项不存在，直接减 r</text>
  <text x="270" y="330" text-anchor="middle" font-size="10" fill="#999">操作可以摊到任意多个下标上，只要总和减够 r 次即可</text>
</svg>
