<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="352" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：游程分解后，答案只由 max₁ 与 max₀ 两个数决定</text>

  <!-- string boxes: s = "110100010" -->
  <text x="92" y="72" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">s =</text>
  <rect x="104" y="48" width="40" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="48" width="40" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="168" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="192" y="48" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="236" y="48" width="40" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="280" y="48" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="324" y="48" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="344" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="368" y="48" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="388" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="412" y="48" width="40" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="456" y="48" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="476" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <!-- run brackets -->
  <path d="M 104 90 V 100 H 188 V 90" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="146" y="118" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 192 90 V 100 H 232 V 90" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="118" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <path d="M 236 90 V 100 H 276 V 90" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="118" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <path d="M 280 90 V 100 H 408 V 90" fill="none" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="344" y="118" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 412 90 V 100 H 452 V 90" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="118" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <path d="M 456 90 V 100 H 496 V 90" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="476" y="118" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>

  <!-- arrows from winning runs -->
  <path d="M 146 124 C 146 138, 170 146, 192 152" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 344 124 C 344 138, 368 146, 390 152" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result boxes -->
  <rect x="120" y="154" width="160" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="178" text-anchor="middle" font-size="12.5" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">max₁ = 2（来自 "11"）</text>
  <rect x="320" y="154" width="160" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="178" text-anchor="middle" font-size="12.5" fill="#223a55" font-weight="bold" filter="url(#rough2)">max₀ = 3（来自 "000"）</text>

  <!-- arrows to compare box -->
  <path d="M 200 192 C 200 206, 250 212, 288 216" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 192 C 400 206, 350 212, 312 216" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compare box -->
  <rect x="170" y="218" width="260" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="237" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">max₁ &gt; max₀ ？即 2 &gt; 3 不成立</text>
  <text x="300" y="253" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 返回 false</text>

  <!-- note boxes -->
  <rect x="36" y="280" width="258" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="300" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">严格大于，不是 ≥</text>
  <text x="165" y="317" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">"111000"：两边最长段都是 3，</text>
  <text x="165" y="331" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">3 &gt; 3 不成立 → false</text>
  <rect x="306" y="280" width="258" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="300" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">缺席的字符按 0 处理</text>
  <text x="435" y="317" text-anchor="middle" font-size="10.5" fill="#3a5a2a" filter="url(#rough2)">全 1 串的 max₀ = 0 → true；</text>
  <text x="435" y="331" text-anchor="middle" font-size="10.5" fill="#3a5a2a" filter="url(#rough2)">最大值初值取 0 即兜底，无需特判</text>
</svg>
