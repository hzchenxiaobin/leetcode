<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="91" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：每个起点 i 的扩展路径与命中</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="52" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#sk)">nums = [9,3,1,2,6,3]，k = 3；格内数值 = 以 i 为起点、j 为右端的前缀 gcd</text>

  <!-- 表头 -->
  <text x="128" y="72" text-anchor="end" font-size="10" fill="#999999" filter="url(#sk)">i ↓ j →</text>
  <text x="172" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">0</text>
  <text x="236" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">1</text>
  <text x="300" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">2</text>
  <text x="364" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">3</text>
  <text x="428" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">4</text>
  <text x="492" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">5</text>
  <text x="578" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">命中子数组</text>

  <!-- 行 i=0 -->
  <g filter="url(#sk)">
    <rect x="140" y="78" width="64" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="204" y="78" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="268" y="78" width="64" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="332" y="78" width="64" height="52" rx="4" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="396" y="78" width="64" height="52" rx="4" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="460" y="78" width="64" height="52" rx="4" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
  </g>
  <text x="128" y="110" text-anchor="end" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">i=0</text>
  <text x="172" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415" filter="url(#sk)">9</text>
  <text x="172" y="124" text-anchor="middle" font-size="9" fill="#8a6415" filter="url(#sk)">k ∣ g 继续</text>
  <text x="236" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e22" filter="url(#sk)">3</text>
  <text x="236" y="124" text-anchor="middle" font-size="9" fill="#2e5e22" filter="url(#sk)">= k ✓ 计数</text>
  <text x="300" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <text x="300" y="124" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">k ∤ g break</text>
  <text x="545" y="110" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">✓ [9,3]</text>

  <!-- 行 i=1 -->
  <g filter="url(#sk)">
    <rect x="204" y="130" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="268" y="130" width="64" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="332" y="130" width="64" height="52" rx="4" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="396" y="130" width="64" height="52" rx="4" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="460" y="130" width="64" height="52" rx="4" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
  </g>
  <text x="128" y="162" text-anchor="end" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">i=1</text>
  <text x="236" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e22" filter="url(#sk)">3</text>
  <text x="236" y="176" text-anchor="middle" font-size="9" fill="#2e5e22" filter="url(#sk)">= k ✓ 计数</text>
  <text x="300" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <text x="300" y="176" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">k ∤ g break</text>
  <text x="545" y="162" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">✓ [3]</text>

  <!-- 行 i=2 -->
  <g filter="url(#sk)">
    <rect x="268" y="182" width="64" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="332" y="182" width="64" height="52" rx="4" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="396" y="182" width="64" height="52" rx="4" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="460" y="182" width="64" height="52" rx="4" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
  </g>
  <text x="128" y="214" text-anchor="end" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">i=2</text>
  <text x="300" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <text x="300" y="228" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">k ∤ g break</text>
  <text x="545" y="214" text-anchor="start" font-size="12.5" fill="#bbbbbb" filter="url(#sk)">—</text>

  <!-- 行 i=3 -->
  <g filter="url(#sk)">
    <rect x="332" y="234" width="64" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="396" y="234" width="64" height="52" rx="4" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="460" y="234" width="64" height="52" rx="4" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
  </g>
  <text x="128" y="266" text-anchor="end" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">i=3</text>
  <text x="364" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">2</text>
  <text x="364" y="280" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">k ∤ g break</text>
  <text x="545" y="266" text-anchor="start" font-size="12.5" fill="#bbbbbb" filter="url(#sk)">—</text>

  <!-- 行 i=4 -->
  <g filter="url(#sk)">
    <rect x="396" y="286" width="64" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="460" y="286" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="128" y="318" text-anchor="end" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">i=4</text>
  <text x="428" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415" filter="url(#sk)">6</text>
  <text x="428" y="332" text-anchor="middle" font-size="9" fill="#8a6415" filter="url(#sk)">k ∣ g 继续</text>
  <text x="492" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e22" filter="url(#sk)">3</text>
  <text x="492" y="332" text-anchor="middle" font-size="9" fill="#2e5e22" filter="url(#sk)">= k ✓ 计数</text>
  <text x="545" y="318" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">✓ [6,3]</text>

  <!-- 行 i=5 -->
  <g filter="url(#sk)">
    <rect x="460" y="338" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="128" y="370" text-anchor="end" font-size="11" font-weight="bold" fill="#666666" filter="url(#sk)">i=5</text>
  <text x="492" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e22" filter="url(#sk)">3</text>
  <text x="492" y="384" text-anchor="middle" font-size="9" fill="#2e5e22" filter="url(#sk)">= k ✓ 计数</text>
  <text x="545" y="370" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">✓ [3]</text>

  <!-- 合计 -->
  <g filter="url(#sk)">
    <rect x="170" y="406" width="300" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="320" y="429" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">合计 4 个：[9,3]、[3]、[6,3]、[3]</text>

  <!-- 底注 -->
  <g filter="url(#sk)">
    <rect x="60" y="452" width="520" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="320" y="473" text-anchor="middle" font-size="10.5" fill="#2b4a6e" filter="url(#sk)">i=0：9 → 命中 3 → 1 触发 break；i=2、i=3 首格即 break；灰色虚格是剪枝省掉的枚举</text>
</svg>
