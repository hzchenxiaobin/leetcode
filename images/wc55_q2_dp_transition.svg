<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 376" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="376" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态与转移：dp[i][j] 的三个来源</text>
  <text x="280" y="46" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">dp[i][j] = s1 前 i 个字符与 s2 前 j 个字符的最大权和公共子序列权重</text>

  <g filter="url(#rough2)">
    <rect x="52" y="80" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <rect x="190" y="80" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="328" y="80" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="170" y="176" width="120" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11">
    <text x="112" y="103" fill="#8a3a36">dp[i−1][j−1]</text>
    <text x="250" y="103" fill="#3a4a66">dp[i−1][j]</text>
    <text x="388" y="103" fill="#3a4a66">dp[i][j−1]</text>
    <text x="230" y="200" fill="#8a6a20" font-size="12" font-weight="bold">dp[i][j]</text>
  </g>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.4" fill="none">
    <path d="M 112 116 L 196 172" marker-end="url(#arr)"/>
    <path d="M 250 116 L 232 172" marker-end="url(#arr)"/>
    <path d="M 388 116 L 268 172" marker-end="url(#arr)"/>
  </g>

  <text x="86" y="150" font-size="9" fill="#4a7a3a" filter="url(#rough2)">相等：+ ord(c)</text>
  <text x="252" y="148" font-size="9" fill="#446688" filter="url(#rough2)">不等：取 max</text>
  <text x="330" y="164" font-size="9" fill="#446688" filter="url(#rough2)">两者皆可</text>

  <rect x="40" y="236" width="480" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="258" font-size="10" fill="#3a5a30" filter="url(#rough2)">s1[i−1] == s2[j−1] ：  dp[i][j] = dp[i−1][j−1] + ord(s1[i−1])</text>
  <text x="56" y="280" font-size="10" fill="#3a5a30" filter="url(#rough2)">否则 ：  dp[i][j] = max( dp[i−1][j], dp[i][j−1] )</text>
  <text x="56" y="302" font-size="10" fill="#3a5a30" filter="url(#rough2)">边界 ：  dp[0][j] = dp[i][0] = 0，最终 W = dp[n][m]</text>
  <text x="56" y="324" font-size="10" fill="#8a3a36" filter="url(#rough2)">答案 ：  ans = Σ1 + Σ2 − 2 · W</text>

  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">一维滚动：diag 暂存 dp[i−1][j−1]，dp[j] 未被覆盖时就是 dp[i−1][j]，dp[j−1] 已属本行</text>
</svg>
