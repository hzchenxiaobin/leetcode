<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="620" height="450" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：降序取箱，累计容量走到 ≥ S 即停</text>
  <path d="M 160 36 Q 310 44 460 36" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- example 1 -->
  <text x="70" y="60" font-size="13" font-weight="bold" fill="#446688" filter="url(#r)">示例 1：apple = [1,3,2] ⇒ S = 6；capacity 降序 = [5,4,3,2,1]</text>
  <g filter="url(#r)">
    <rect x="70" y="70" width="60" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <rect x="140" y="70" width="60" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <rect x="220" y="70" width="60" height="44" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
    <rect x="300" y="70" width="60" height="44" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
    <rect x="380" y="70" width="60" height="44" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" fill="#2b4a6e" filter="url(#r)">
    <text x="100" y="97">5</text>
    <text x="170" y="97">4</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#777" filter="url(#r)">
    <text x="250" y="97">3</text>
    <text x="330" y="97">2</text>
    <text x="410" y="97">1</text>
  </g>
  <g filter="url(#r)">
    <rect x="70" y="124" width="60" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="140" y="124" width="60" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="100" y="141" text-anchor="middle" font-size="11.5" fill="#b0722a" filter="url(#r)">5 &lt; 6 ↻</text>
  <text x="170" y="141" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">9 ≥ 6 ✓ 停</text>
  <text x="390" y="141" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#r)">不再取</text>
  <text x="70" y="176" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">答案 k = 2：两个最大的箱子 5 + 4 = 9 已覆盖 S = 6</text>
  <path d="M 60 196 Q 310 204 560 196" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#r)"/>

  <!-- example 2 -->
  <text x="70" y="225" font-size="13" font-weight="bold" fill="#446688" filter="url(#r)">示例 2：apple = [5,5,5] ⇒ S = 15；capacity 降序 = [7,4,2,2]</text>
  <g filter="url(#r)">
    <rect x="70" y="235" width="70" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="170" y="235" width="70" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="270" y="235" width="70" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="370" y="235" width="70" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" fill="#2b4a6e" filter="url(#r)">
    <text x="105" y="262">7</text>
    <text x="205" y="262">4</text>
    <text x="305" y="262">2</text>
    <text x="405" y="262">2</text>
  </g>
  <g filter="url(#r)">
    <rect x="70" y="289" width="70" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="170" y="289" width="70" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="270" y="289" width="70" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="370" y="289" width="70" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="105" y="306" text-anchor="middle" font-size="11.5" fill="#b0722a" filter="url(#r)">7 &lt; 15 ↻</text>
  <text x="205" y="306" text-anchor="middle" font-size="11.5" fill="#b0722a" filter="url(#r)">11 &lt; 15 ↻</text>
  <text x="305" y="306" text-anchor="middle" font-size="11.5" fill="#b0722a" filter="url(#r)">13 &lt; 15 ↻</text>
  <text x="405" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">15 = 15 ✓ 停</text>
  <text x="70" y="341" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">答案 k = 4：恰好取完全部箱子，15 = 15 —— 恰好装满也要停</text>

  <!-- callout -->
  <g filter="url(#r)">
    <rect x="40" y="360" width="540" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="62" y="384" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">易错提醒：升序取箱 WA</text>
  <text x="62" y="406" font-size="12" fill="#444" filter="url(#r)">示例 1 若升序取 1, 2, 3：累计 1 → 3 → 6，第 3 个才 ≥ 6，误答 3（正确 2）</text>
  <text x="62" y="426" font-size="12" fill="#444" filter="url(#r)">每步取当前最大 ⇒ 同样个数下总容量最大，才最省名额</text>
</svg>
