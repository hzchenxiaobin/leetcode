<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：总花费 f(z) 随捆绑数 z 分段线性</text>
  <path d="M 180 40 Q 340 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="60" text-anchor="middle" font-size="12" fill="#444">固定捆绑数 z 后单品个数唯一确定，总花费只剩一个变量 z</text>

  <!-- axes -->
  <g filter="url(#sk)">
    <path d="M 95 335 L 640 335" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
    <path d="M 95 352 L 95 78" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="625" y="352" font-size="12" fill="#444">z</text>
  <text x="60" y="82" font-size="12" fill="#444">f(z)</text>

  <!-- curve: three linear pieces -->
  <g filter="url(#sk)">
    <path d="M 115 130 L 330 255" stroke="#4a8edb" stroke-width="2.6" fill="none"/>
    <path d="M 330 255 L 530 215" stroke="#4a8e4a" stroke-width="2.6" fill="none"/>
    <path d="M 530 215 L 615 172" stroke="#c98a2b" stroke-width="2.6" fill="none" stroke-dasharray="7 5"/>
  </g>

  <!-- dashed guides -->
  <g filter="url(#sk)">
    <path d="M 330 255 L 330 335" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
    <path d="M 530 215 L 530 335" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
    <path d="M 330 255 L 95 255" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
  </g>

  <!-- candidate points -->
  <g filter="url(#sk)">
    <circle cx="115" cy="130" r="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="530" cy="215" r="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="330" cy="255" r="9" fill="#f5e0e0" stroke="#b85450" stroke-width="2.4"/>
    <circle cx="330" cy="255" r="4" fill="#b85450"/>
  </g>
  <text x="345" y="280" font-size="12" font-weight="bold" fill="#b03a3a">最小值只出现在折点上！</text>

  <!-- tick labels -->
  <text x="112" y="352" text-anchor="middle" font-size="12" fill="#444">0</text>
  <text x="330" y="352" text-anchor="middle" font-size="12" fill="#444">m = min(n1, n2)</text>
  <text x="530" y="352" text-anchor="middle" font-size="12" fill="#444">M = max(n1, n2)</text>

  <!-- slope annotations -->
  <text x="150" y="120" font-size="11.5" fill="#2b6e9e" font-weight="bold">段1 斜率 = costBoth − cost1 − cost2</text>
  <text x="150" y="135" font-size="11" fill="#555">（一个捆绑 vs 各买一个）</text>
  <text x="355" y="196" font-size="11.5" fill="#2e6e2e" font-weight="bold">段2 斜率 = costBoth − cost2</text>
  <text x="355" y="211" font-size="11" fill="#555">（只剩需求大的一侧，另一侧浪费）</text>
  <text x="545" y="150" font-size="11.5" fill="#7a5415" font-weight="bold">段3 斜率 = costBoth &gt; 0</text>
  <text x="545" y="165" font-size="11" fill="#555">（两侧都已满足，纯浪费）</text>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="60" y="382" width="560" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="80" y="405" font-size="12.5" fill="#2b2b2b">每一段都是<b>直线</b> → 线性段的最小值只会取在端点 → 只需比较 <tspan font-family="monospace" font-weight="bold">f(0)</tspan>、<tspan font-family="monospace" font-weight="bold">f(m)</tspan>、<tspan font-family="monospace" font-weight="bold">f(M)</tspan> 三个候选</text>
</svg>
