<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一趟滚动，只记「最近两次出现」</text>

  <!-- 左侧流程 -->
  <rect x="30" y="58" width="250" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 扫描到 nums[i]，查 last[v]</text>
  <text x="155" y="99" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">v 之前出现的最近两个下标</text>

  <path d="M155 110 L155 128" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="132" width="250" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="153" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 已有两次出现 → 结算候选</text>
  <text x="155" y="173" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">cand = 2 × (i − prev₂)</text>

  <path d="M155 184 L155 202" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="206" width="250" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 滚动窗口右移一格</text>
  <text x="155" y="247" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">prev₂ ← prev₁，prev₁ ← i</text>

  <path d="M155 258 L155 276" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="280" width="250" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="301" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ 结束：ans = min(全部候选)</text>
  <text x="155" y="321" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">从未更新 → 返回 −1</text>

  <!-- 右侧演示 -->
  <text x="412" y="66" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">等价视角：宽度恒为 3 的滑窗</text>
  <text x="412" y="84" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">贴着 pos[v] 右移（例 [2,3,7,9]）</text>

  <rect x="312" y="98" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="358" y="98" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="379" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="404" y="98" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="450" y="98" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="471" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>

  <rect x="306" y="90" width="146" height="50" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <text x="379" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">窗口 (2,3,7)：跨度 5</text>

  <path d="M379 164 Q 379 186 409 186 L439 186" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="176" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">右移一格</text>

  <rect x="352" y="196" width="146" height="50" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <text x="425" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">窗口 (3,7,9)：跨度 6</text>

  <rect x="306" y="272" width="196" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="404" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每个下标至多属于 3 个窗口</text>
  <text x="404" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">→ 全部窗口总数 ≤ n</text>
  <text x="404" y="334" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">扫描全表也不贵，O(n)</text>
</svg>
