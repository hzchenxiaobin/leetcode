<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：k = 7 六步命中 0；k = 2 原地转圈</text>
  <text x="310" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">节点 = 当前余数 r；边 = 添一个 1，即 r ← (10r + 1) mod k</text>

  <!-- k = 7 -->
  <g filter="url(#sk)">
    <text x="30" y="88" font-size="13" fill="#2b6e9e" font-weight="bold">k = 7（示例 2）</text>
    <text x="118" y="88" font-size="11" fill="#666">从空数 r=0 出发，橙色圈里是每步的余数</text>

    <text x="75" y="115" text-anchor="middle" font-size="10.5" fill="#888">第 1 步</text>
    <text x="168" y="115" text-anchor="middle" font-size="10.5" fill="#888">第 2 步</text>
    <text x="261" y="115" text-anchor="middle" font-size="10.5" fill="#888">第 3 步</text>
    <text x="354" y="115" text-anchor="middle" font-size="10.5" fill="#888">第 4 步</text>
    <text x="447" y="115" text-anchor="middle" font-size="10.5" fill="#888">第 5 步</text>
    <text x="540" y="115" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">第 6 步</text>

    <circle cx="75" cy="143" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="168" cy="143" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="261" cy="143" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="354" cy="143" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="447" cy="143" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="540" cy="143" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <circle cx="540" cy="143" r="15.5" fill="none" stroke="#4a7a3a" stroke-width="1.1"/>
    <text x="75" y="148" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">1</text>
    <text x="168" y="148" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">4</text>
    <text x="261" y="148" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">6</text>
    <text x="354" y="148" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">5</text>
    <text x="447" y="148" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">2</text>
    <text x="540" y="148" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">0</text>

    <path d="M 97 143 L 145 143" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 190 143 L 238 143" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 283 143 L 331 143" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 376 143 L 424 143" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 469 143 L 517 143" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

    <text x="75" y="182" text-anchor="middle" font-size="10.5" fill="#33506b">1</text>
    <text x="168" y="182" text-anchor="middle" font-size="10.5" fill="#33506b">11</text>
    <text x="261" y="182" text-anchor="middle" font-size="10.5" fill="#33506b">111</text>
    <text x="354" y="182" text-anchor="middle" font-size="10.5" fill="#33506b">1111</text>
    <text x="447" y="182" text-anchor="middle" font-size="10.5" fill="#33506b">11111</text>
    <text x="540" y="182" text-anchor="middle" font-size="10" fill="#33506b">111111</text>
    <text x="310" y="205" text-anchor="middle" font-size="11" fill="#888">（圈下方是到目前为止构造出的全 1 数，全程只用小整数算余数）</text>

    <path d="M 470 215 Q 540 245 545 218" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <text x="415" y="232" font-size="11.5" fill="#2f5d24" font-weight="bold">r = 0 命中!</text>
    <text x="415" y="248" font-size="11" fill="#2f5d24">111111 = 7 × 15873</text>
    <text x="415" y="264" font-size="11" fill="#2f5d24">返回位数 6</text>
  </g>

  <!-- k = 2 -->
  <g filter="url(#sk)">
    <text x="30" y="300" font-size="13" fill="#b03a3a" font-weight="bold">k = 2（示例 3，无解）</text>

    <circle cx="150" cy="365" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="150" y="370" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">1</text>
    <path d="M 138 346 C 105 318, 72 340, 125 360" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 162 346 C 195 318, 228 340, 175 360" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <text x="150" y="312" text-anchor="middle" font-size="10.5" fill="#888">1 → 11 → 111 → 1111 → ...</text>
    <text x="150" y="328" text-anchor="middle" font-size="10.5" fill="#b03a3a">余数永远是 1，到不了 0</text>
    <text x="150" y="412" text-anchor="middle" font-size="10.5" fill="#888">自环死循环</text>

    <rect x="300" y="330" width="290" height="72" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="445" y="352" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">全 1 数个位恒为 1 → 恒为奇数、mod 5 余 1</text>
    <text x="445" y="371" text-anchor="middle" font-size="11.5" fill="#b03a3a">2 | k 或 5 | k 时永远无解 → 返回 −1</text>
    <text x="445" y="392" text-anchor="middle" font-size="10.5" fill="#7a4a48">（O(1) 剪枝；不剪枝则靠「k 步未命中」兜底）</text>
  </g>
</svg>
