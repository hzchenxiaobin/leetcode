<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：个位为 k 的数 = 10·a + k，c 个之和的个位只由 c·k 决定</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 三个被选数：每个拆成「10 的倍数」+「个位 k」 -->
  <g filter="url(#sk)"><rect x="108" y="56" width="104" height="23" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="160" y="72" text-anchor="middle" font-size="12" fill="#2b6e9e">10·a1</text>
  <g filter="url(#sk)"><rect x="108" y="79" width="104" height="23" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="160" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a20">k</text>

  <text x="230" y="78" text-anchor="middle" font-size="16" fill="#666">+</text>

  <g filter="url(#sk)"><rect x="248" y="56" width="104" height="23" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="300" y="72" text-anchor="middle" font-size="12" fill="#2b6e9e">10·a2</text>
  <g filter="url(#sk)"><rect x="248" y="79" width="104" height="23" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="300" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a20">k</text>

  <text x="380" y="80" text-anchor="middle" font-size="16" fill="#666">…</text>

  <g filter="url(#sk)"><rect x="408" y="56" width="104" height="23" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="460" y="72" text-anchor="middle" font-size="12" fill="#2b6e9e">10·ac</text>
  <g filter="url(#sk)"><rect x="408" y="79" width="104" height="23" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="460" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a20">k</text>

  <text x="310" y="118" text-anchor="middle" font-size="11.5" fill="#666">被选的 c 个数：每个都拆成「10 的倍数」+「个位 k」两截</text>

  <!-- 引导虚线：蓝截 → 蓝项，橙截 → 红项 -->
  <path d="M 205 108 Q 248 128 282 136" stroke="#4a8edb" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 460 108 Q 434 128 418 136" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="288" y="150" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">模 10 后消失</text>
  <text x="418" y="150" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">唯一决定个位</text>

  <text x="320" y="180" text-anchor="middle" font-size="16" fill="#333">sum = <tspan fill="#2b6e9e" font-weight="bold">10·(a1 + a2 + … + ac)</tspan> + <tspan fill="#b85450" font-weight="bold">c·k</tspan></text>

  <!-- 两条件 -->
  <g filter="url(#sk)"><rect x="90" y="200" width="460" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="224" text-anchor="middle" font-size="12.5" fill="#2e5e2e">令 sum = num：条件 ① (c·k) mod 10 = num mod 10 —— 个位对齐</text>
  <text x="320" y="244" text-anchor="middle" font-size="12.5" fill="#2e5e2e">条件 ② c·k ≤ num —— 不透支（每个数 ≥ k，c 个至少 c·k）</text>

  <!-- 示例验证 -->
  <g filter="url(#sk)"><rect x="60" y="272" width="520" height="96" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="320" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">以 num = 58，k = 9 验证（示例 1）</text>
  <text x="320" y="316" text-anchor="middle" font-size="12.5" fill="#444">49 = 10·4 + 9，9 = 10·0 + 9 → 58 = 10·(4+0) + 2·9</text>
  <text x="320" y="336" text-anchor="middle" font-size="12" fill="#2e5e2e">个位：58 mod 10 = 8 = (2·9) mod 10 ✓ → c = 2</text>
  <text x="320" y="356" text-anchor="middle" font-size="11.5" fill="#7a5415">构造：c−1 = 1 个 k，再放一个大数 58 − 9 = 49 → {9, 49}</text>

  <text x="320" y="400" text-anchor="middle" font-size="11.5" fill="#888">「十位以上」全是 10 的倍数、模 10 消失 —— 真正的自由度只有「个数 c」与「个位 k」</text>
</svg>
