<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">一短一长、一静一动：表建 nums2，枚举 nums1</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#555">两个不对称性指向同一方向 —— freq 建在长且被改的 nums2 上，count 枚举短的 nums1</text>

  <text x="45" y="95" font-size="13" font-weight="bold" fill="#2e6e2e">nums1：短（≤ 1000）· 只读</text>
  <g filter="url(#sk)">
    <rect x="45" y="104" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="89" y="104" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="133" y="104" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="177" y="104" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="221" y="104" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="265" y="104" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="67" y="126" text-anchor="middle" font-size="13" fill="#2e6e2e">1</text>
  <text x="111" y="126" text-anchor="middle" font-size="13" fill="#2e6e2e">1</text>
  <text x="155" y="126" text-anchor="middle" font-size="13" fill="#2e6e2e">2</text>
  <text x="199" y="126" text-anchor="middle" font-size="13" fill="#2e6e2e">2</text>
  <text x="243" y="126" text-anchor="middle" font-size="13" fill="#2e6e2e">2</text>
  <text x="287" y="126" text-anchor="middle" font-size="13" fill="#2e6e2e">3</text>
  <text x="45" y="166" font-size="11" fill="#2e6e2e">count 时逐个枚举（含重复：1×2，2×3，3×1）</text>

  <text x="340" y="95" font-size="13" font-weight="bold" fill="#2b6e9e">nums2：长（≤ 10⁵）· 被 add 单点修改</text>
  <g filter="url(#sk)">
    <rect x="340" y="104" width="32" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="372" y="104" width="32" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="404" y="104" width="32" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="436" y="104" width="32" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="468" y="104" width="32" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="500" y="104" width="32" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="532" y="104" width="32" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="356" y="126" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="388" y="126" text-anchor="middle" font-size="12" fill="#2b6e9e">4</text>
  <text x="420" y="126" text-anchor="middle" font-size="12" fill="#2b6e9e">5</text>
  <text x="452" y="126" text-anchor="middle" font-size="12" fill="#2b6e9e">2</text>
  <text x="484" y="126" text-anchor="middle" font-size="12" fill="#2b6e9e">5</text>
  <text x="516" y="126" text-anchor="middle" font-size="12" fill="#2b6e9e">4</text>
  <text x="548" y="126" text-anchor="middle" font-size="13" fill="#2b6e9e">…</text>
  <text x="575" y="126" font-size="12" fill="#2b6e9e">…</text>

  <g filter="url(#sk)">
    <rect x="492" y="160" width="128" height="28" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="556" y="179" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">add(index, val)</text>
  <path d="M 512 158 L 490 141" stroke="#d6a040" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 160 142 L 160 201" stroke="#4a8e4a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="170" y="176" font-size="10.5" fill="#555">枚举 x</text>
  <path d="M 480 142 L 480 201" stroke="#4a8edb" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="176" text-anchor="end" font-size="10.5" fill="#555">O(n₂) 建 · add O(1) 增删</text>

  <g filter="url(#sk)">
    <rect x="40" y="205" width="270" height="78" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="175" y="228" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">count(tot) = Σ freq[tot − x]</text>
  <text x="175" y="249" text-anchor="middle" font-size="11" fill="#2e6e2e">x 依次取 nums1 的每个元素（含重复）</text>
  <text x="175" y="269" text-anchor="middle" font-size="11" fill="#2e6e2e">单次查询 O(n₁) = 10³ 次哈希查表</text>

  <g filter="url(#sk)">
    <rect x="340" y="205" width="278" height="78" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="479" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">freq：值 → 出现次数（哈希表）</text>
  <text x="479" y="249" text-anchor="middle" font-size="12" fill="#2b6e9e">{ 1:1, 2:1, 4:2, 5:2 }</text>
  <text x="479" y="269" text-anchor="middle" font-size="10.5" fill="#2b6e9e">键数 ≤ n₂ = 10⁵；任一时刻 ≡ nums2 值分布</text>

  <path d="M 338 244 L 314 244" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="326" y="258" text-anchor="middle" font-size="10.5" fill="#555">查表</text>

  <g filter="url(#sk)">
    <rect x="40" y="300" width="560" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">方向选反（表建 nums1、枚举 nums2）：1000 次 count × 10⁵ 次查询 = 10⁸ 次哈希查表</text>
  <text x="320" y="342" text-anchor="middle" font-size="11" fill="#b85450">C++ 赌常数，Python 必 TLE —— 「过样例、提交 TLE」的典型</text>

  <text x="320" y="380" text-anchor="middle" font-size="11.5" fill="#555">设计题口诀：枚举短的一侧 · 频率表建在长且被修改的一侧 · add 两次计数器 O(1) 维护</text>
</svg>
