<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：一次交换只能做两件事</text>
  <text x="380" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先把 text 切成游程（连续同字符段），再在「段」的粒度上打主意</text>

  <text x="70" y="92" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">情况一：单段向旁边借一个同类字符 → 段长 + 1</text>
  <text x="26" y="140" font-size="9.5" fill="#999" filter="url(#rough2)">原始</text>
  <rect x="70" y="110" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="138" text-anchor="middle" font-size="15" fill="#8a3a36" filter="url(#rough2)">b</text>
  <rect x="116" y="110" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="138" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="162" y="110" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="138" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="208" y="110" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="138" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="254" y="110" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="138" text-anchor="middle" font-size="15" fill="#8a3a36" filter="url(#rough2)">b</text>
  <rect x="390" y="110" width="44" height="44" fill="#fff" stroke="#7a9a6a" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="138" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="412" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">远处的备用 a</text>
  <path d="M 386 132 L 304 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="26" y="212" font-size="9.5" fill="#999" filter="url(#rough2)">交换后</text>
  <rect x="70" y="184" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="212" text-anchor="middle" font-size="15" fill="#8a3a36" filter="url(#rough2)">b</text>
  <rect x="116" y="184" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="212" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="162" y="184" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="212" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="208" y="184" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="212" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="254" y="184" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="212" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">a</text>
  <text x="324" y="204" font-size="11" fill="#3a5a30" filter="url(#rough2)">L = 3 → 4</text>
  <text x="324" y="222" font-size="10" fill="#888" filter="url(#rough2)">前提 cnt[a] &gt; L</text>

  <text x="70" y="258" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">情况二：两块同类段只隔一个异字符 → 合并后 + 1</text>
  <text x="26" y="304" font-size="9.5" fill="#999" filter="url(#rough2)">原始</text>
  <rect x="70" y="274" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="302" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="116" y="274" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="302" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="162" y="274" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="302" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="208" y="274" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="302" text-anchor="middle" font-size="15" fill="#8a3a36" filter="url(#rough2)">b</text>
  <rect x="254" y="274" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="302" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="300" y="274" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="302" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="346" y="274" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="302" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">a</text>
  <text x="230" y="336" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">间隔段长 = 1</text>

  <text x="26" y="376" font-size="9.5" fill="#999" filter="url(#rough2)">交换后</text>
  <rect x="70" y="350" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="378" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="116" y="350" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="378" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="162" y="350" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="378" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="208" y="350" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="378" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="254" y="350" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="378" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="300" y="350" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="378" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="346" y="350" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="378" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">a</text>
  <text x="416" y="370" font-size="11" fill="#446688" filter="url(#rough2)">L1 + L2 + 1 = 7</text>
  <text x="416" y="388" font-size="10" fill="#888" filter="url(#rough2)">仍需与 cnt[a] 取小</text>
</svg>
