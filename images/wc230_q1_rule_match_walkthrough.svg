<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：锁定颜色列，逐行比对</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="140" y="54" width="360" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="320" y="74" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">ruleKey="color" → idx=1, ruleValue="silver"</text>

  <g filter="url(#sk)">
    <rect x="50" y="100" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="94" y="100" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="194" y="100" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="294" y="100" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="50" y="136" width="44" height="36" fill="#fdfcf7" stroke="#446688" stroke-width="0.9"/>
    <rect x="94" y="136" width="100" height="36" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
    <rect x="194" y="136" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="294" y="136" width="100" height="36" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
    <rect x="50" y="172" width="44" height="36" fill="#fdfcf7" stroke="#446688" stroke-width="0.9"/>
    <rect x="94" y="172" width="100" height="36" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
    <rect x="194" y="172" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="294" y="172" width="100" height="36" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
    <rect x="50" y="208" width="44" height="36" fill="#fdfcf7" stroke="#446688" stroke-width="0.9"/>
    <rect x="94" y="208" width="100" height="36" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
    <rect x="194" y="208" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="294" y="208" width="100" height="36" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
  </g>
  <text x="72" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">i</text>
  <text x="144" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">type</text>
  <text x="244" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">color</text>
  <text x="344" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">name</text>
  <text x="72" y="158" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">0</text>
  <text x="144" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">phone</text>
  <text x="244" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">blue</text>
  <text x="344" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">pixel</text>
  <text x="72" y="194" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">1</text>
  <text x="144" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">computer</text>
  <text x="244" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">silver</text>
  <text x="344" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">lenovo</text>
  <text x="72" y="230" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">2</text>
  <text x="144" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">phone</text>
  <text x="244" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">gold</text>
  <text x="344" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">iphone</text>

  <path d="M 396 154 L 416 154" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 396 190 L 416 190" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 396 226 L 416 226" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="420" y="137" width="200" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="432" y="158" font-size="11" fill="#8a4440" font-family="monospace" filter="url(#sk)">blue ≠ silver ×</text>
  <text x="608" y="158" text-anchor="end" font-size="11" fill="#666" font-family="monospace" filter="url(#sk)">cnt = 0</text>

  <g filter="url(#sk)">
    <rect x="420" y="173" width="200" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="432" y="194" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">silver = silver √</text>
  <text x="608" y="194" text-anchor="end" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">cnt = 1</text>

  <g filter="url(#sk)">
    <rect x="420" y="209" width="200" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="432" y="230" font-size="11" fill="#8a4440" font-family="monospace" filter="url(#sk)">gold ≠ silver ×</text>
  <text x="608" y="230" text-anchor="end" font-size="11" fill="#666" font-family="monospace" filter="url(#sk)">cnt = 1</text>

  <g filter="url(#sk)">
    <rect x="170" y="272" width="300" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">遍历结束 → 返回 count = 1</text>
  <text x="320" y="350" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">type / name 两列整趟未被访问</text>
</svg>
