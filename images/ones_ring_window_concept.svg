<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="880" height="450" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：终态 = 环上长 t 的连续段，代价 = 段内 0 的个数</text>
  <path d="M 240 44 Q 440 54 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左：示例 1 的环形数组 -->
  <text x="185" y="68" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">示例 1：nums = [0,1,0,1,1,0,0]，t = 3</text>

  <circle cx="185" cy="250" r="88" fill="none" stroke="#c5cdd6" stroke-width="2" filter="url(#rough2)"/>

  <!-- 下标标签（环外圈） -->
  <g font-size="10" fill="#9aa5af" text-anchor="middle" filter="url(#rough2)">
    <text x="185" y="118">0</text>
    <text x="288" y="168">1</text>
    <text x="314" y="279">2</text>
    <text x="242" y="369">3</text>
    <text x="128" y="369">4</text>
    <text x="56" y="279">5</text>
    <text x="82" y="168">6</text>
  </g>

  <!-- 环上格子 -->
  <g filter="url(#rough2)">
    <circle cx="185" cy="162" r="17" fill="#ffffff" stroke="#99a6b3" stroke-width="1.6"/>
    <circle cx="254" cy="195" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <circle cx="271" cy="270" r="17" fill="#ffffff" stroke="#99a6b3" stroke-width="1.6"/>
    <circle cx="223" cy="329" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="147" cy="329" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="99" cy="270" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="116" cy="195" r="17" fill="#ffffff" stroke="#99a6b3" stroke-width="1.6"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="185" y="167">0</text>
    <text x="254" y="200">1</text>
    <text x="271" y="275">0</text>
    <text x="223" y="334">1</text>
    <text x="147" y="334">1</text>
    <text x="99" y="275">0</text>
    <text x="116" y="200">0</text>
  </g>

  <!-- 最优窗口弧 -->
  <path d="M 233 349 A 110 110 0 0 1 78 274" fill="none" stroke="#446688" stroke-width="4"
        stroke-linecap="round" filter="url(#rough2)"/>
  <text x="185" y="384" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">最优窗口 W = 下标 {3,4,5}（长 t = 3）</text>

  <!-- 窗内 0 / 窗外 1 标注 -->
  <path d="M 60 300 L 88 282" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="30" y="312" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">窗内的 0</text>
  <path d="M 296 164 L 272 188" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="156" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">窗外的 1</text>

  <!-- 一次交换 -->
  <path d="M 254 195 Q 160 215 99 270" stroke="#b85450" stroke-width="2" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="172" y="212" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">一次交换</text>

  <text x="185" y="408" text-anchor="middle" font-size="12" fill="#556" filter="url(#rough2)">窗内 0 数 = 1 → 该窗口代价 = 1</text>
  <text x="185" y="430" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">环形：下标 6 与 0 相邻，窗口可跨首尾</text>

  <!-- 右：三个事实框 -->
  <g filter="url(#rough2)">
    <rect x="375" y="70" width="475" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="395" y="96" font-size="13" font-weight="bold" fill="#33455c" filter="url(#rough2)">① 交换不改变 1 的总数 t</text>
  <text x="395" y="120" font-size="11.5" fill="#556" filter="url(#rough2)">终态：所有 1 恰占满某个长度 t 的环形窗口 W，W 外全为 0</text>

  <g filter="url(#rough2)">
    <rect x="375" y="156" width="475" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="395" y="182" font-size="13" font-weight="bold" fill="#33455c" filter="url(#rough2)">② 设 W 内有 z 个 0，则 W 内 1 数 = t − z</text>
  <text x="395" y="206" font-size="11.5" fill="#556" filter="url(#rough2)">总数守恒 ⟹ W 外恰有 z 个 1，与窗内的 0 两两配对</text>

  <g filter="url(#rough2)">
    <rect x="375" y="242" width="475" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="395" y="268" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">③ 每次交换使 W 内 1 数至多 +1</text>
  <text x="395" y="292" font-size="11.5" fill="#8a6a2a" filter="url(#rough2)">仅「窗内 0 ↔ 窗外 1」有效：下界 z 次，且 z 次恰好完成 ⟹ 代价 = z</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="375" y="328" width="475" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="612" y="356" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">答案 = min（窗内 0 数）= t − max（窗内 1 数）</text>
  <text x="612" y="382" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">对长度 t 的环形窗口滑动一趟即可，O(n)</text>
</svg>
