<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：nums = [3,1,4,2,5]</text>
  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">queries = [[2,3,4],[1,0,4]]，期望输出 [0]</text>

  <!-- Step 0: initial -->
  <text x="52" y="84" font-size="12.5" fill="#333" filter="url(#rough2)">初始建树：</text>
  <rect x="150" y="66" width="46" height="30" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="173" y="86" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">3</text>
  <rect x="202" y="66" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="225" y="86" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">1</text>
  <rect x="254" y="66" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="277" y="86" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">4</text>
  <rect x="306" y="66" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="329" y="86" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">2</text>
  <rect x="358" y="66" width="46" height="30" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="381" y="86" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">5</text>

  <text x="52" y="126" font-size="12.5" fill="#333" filter="url(#rough2)">p =</text>
  <rect x="150" y="108" width="46" height="24" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="173" y="125" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="202" y="108" width="46" height="24" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="225" y="125" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="254" y="108" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="277" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="306" y="108" width="46" height="24" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="329" y="125" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="358" y="108" width="46" height="24" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="381" y="125" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="430" y="125" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">← 1&lt;4&gt;2，</text>
  <text x="430" y="141" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">add(3, +1)</text>

  <!-- Step 1: update -->
  <text x="52" y="182" font-size="12.5" fill="#b85450" filter="url(#rough2)">[2, 3, 4]：</text>
  <rect x="150" y="164" width="46" height="30" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="173" y="184" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">3</text>
  <rect x="202" y="164" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="225" y="184" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">1</text>
  <rect x="254" y="164" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="277" y="184" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">4</text>
  <rect x="306" y="164" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="329" y="184" text-anchor="middle" font-size="12.5" fill="#7c2b28" filter="url(#rough2)">4</text>
  <rect x="358" y="164" width="46" height="30" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="381" y="184" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="430" y="184" font-size="11.5" fill="#b85450" filter="url(#rough2)">← nums[3]</text>
  <text x="430" y="200" font-size="11.5" fill="#b85450" filter="url(#rough2)">2 改 4</text>

  <rect x="46" y="206" width="428" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="228" font-size="12" fill="#7a5a10" filter="url(#rough2)">refresh(2)：1&lt;4 但 4&gt;4 不成立，p[2] 1→0，add(3, −1)</text>
  <text x="60" y="248" font-size="12" fill="#7a5a10" filter="url(#rough2)">refresh(3)：4&lt;4 不成立，p[3] 仍 0，无变化</text>
  <text x="60" y="263" font-size="11" fill="#8a8a8a" filter="url(#rough2)">refresh(4)：j = n−1 是数组端点，永远非峰，直接跳过</text>

  <!-- Step 2: query -->
  <text x="52" y="306" font-size="12.5" fill="#446688" filter="url(#rough2)">[1, 0, 4]：</text>
  <rect x="150" y="288" width="46" height="24" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="173" y="305" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="202" y="288" width="46" height="24" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="225" y="305" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="254" y="288" width="46" height="24" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="277" y="305" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="306" y="288" width="46" height="24" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="329" y="305" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="358" y="288" width="46" height="24" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="381" y="305" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>

  <text x="52" y="346" font-size="12.5" fill="#333" filter="url(#rough2)">pre(4) − pre(1) = 0 − 0 =</text>
  <text x="252" y="347" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <path d="M262,342 C310,342 330,332 332,316" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="330" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">answer = [0] ✓</text>

  <rect x="46" y="368" width="428" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="12.5" fill="#7c2b28" filter="url(#rough2)">陷阱：两个 4 相邻相等，「严格大于」不成立——</text>
  <text x="260" y="407" text-anchor="middle" font-size="12.5" fill="#7c2b28" filter="url(#rough2)">改值把唯一的峰削平，查询答案恰好为 0</text>
</svg>
