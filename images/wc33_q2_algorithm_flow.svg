<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">算法流程：常数时间，无需枚举顺序</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">三步：算 6 个平方距离 → 排序 → 按位置读三重条件</text>

  <rect x="90" y="70" width="380" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"
        filter="url(#rough2)"/>
  <text x="280" y="97" text-anchor="middle" font-size="11" fill="#3a4a66">① 枚举 i &lt; j 的 6 个点对：d = Δx² + Δy²（平方距离）</text>

  <path d="M 280 114 L 280 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>

  <rect x="90" y="134" width="380" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"
        filter="url(#rough2)"/>
  <text x="280" y="161" text-anchor="middle" font-size="11" fill="#3a4a66">② 升序排序 → d[0..5]，前 4 小的是边，后 2 大的是对角线</text>

  <path d="M 280 178 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>

  <rect x="50" y="198" width="460" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"
        filter="url(#rough2)"/>
  <text x="66" y="222" font-size="11.5" fill="#8a6a20" font-weight="bold">③ 同时检查三个条件</text>
  <text x="66" y="248" font-size="10.5" fill="#555">• d[0] &gt; 0 —— 四点互不相同（排除重合点）</text>
  <text x="66" y="272" font-size="10.5" fill="#555">• d[0]=d[1]=d[2]=d[3] —— 四条边等长</text>
  <text x="66" y="296" font-size="10.5" fill="#555">• d[4]=d[5]=2·d[0] —— 两条对角线等长，且为边长的 √2 倍</text>

  <path d="M 280 312 L 280 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>

  <polygon points="140,366 280,330 420,366 280,402" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"
           filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="11.5" fill="#8a3a36">三条件全部成立？</text>

  <path d="M 420 366 L 452 366" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>
  <rect x="454" y="348" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"
        filter="url(#rough2)"/>
  <text x="500" y="371" text-anchor="middle" font-size="10.5" fill="#8a3a36">返回 false</text>

  <path d="M 280 402 L 280 420" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>
  <rect x="196" y="422" width="168" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="280" y="446" text-anchor="middle" font-size="11" fill="#3a5a30">返回 true</text>

  <text x="280" y="474" text-anchor="middle" font-size="9.5" fill="#999">全程整数运算：没有开方，没有浮点比较，也没有 4! 种顺序枚举</text>
</svg>
