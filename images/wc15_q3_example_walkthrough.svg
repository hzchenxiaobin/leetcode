<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">演算：board = "WWRRBBWW"，hand = "WRBRW" → 2</text>

  <!-- 初始 -->
  <text x="24" y="96" font-size="11" fill="#555" font-weight="bold">初始</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <circle cx="120" cy="92" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="120" y="96" fill="#555">W</text>
    <circle cx="150" cy="92" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="150" y="96" fill="#555">W</text>
    <circle cx="180" cy="92" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/><text x="180" y="96" fill="#8a3a36">R</text>
    <circle cx="210" cy="92" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/><text x="210" y="96" fill="#8a3a36">R</text>
    <circle cx="240" cy="92" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="240" y="96" fill="#3a4a66">B</text>
    <circle cx="270" cy="92" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="270" y="96" fill="#3a4a66">B</text>
    <circle cx="300" cy="92" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="300" y="96" fill="#555">W</text>
    <circle cx="330" cy="92" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="330" y="96" fill="#555">W</text>
  </g>
  <text x="384" y="96" font-size="10" fill="#888">4 段，共 8 颗</text>

  <path d="M 96 106 L 96 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 1 步 -->
  <text x="24" y="154" font-size="11" fill="#4a7a3a" font-weight="bold">① 插 R</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <circle cx="120" cy="150" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="120" y="154" fill="#555">W</text>
    <circle cx="150" cy="150" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="150" y="154" fill="#555">W</text>
    <circle cx="180" cy="150" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/><text x="180" y="154" fill="#8a3a36">R</text>
    <circle cx="210" cy="150" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/><text x="210" y="154" fill="#8a3a36">R</text>
    <circle cx="240" cy="150" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/><text x="240" y="154" fill="#8a3a36">R</text>
    <circle cx="270" cy="150" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="270" y="154" fill="#3a4a66">B</text>
    <circle cx="300" cy="150" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="300" y="154" fill="#3a4a66">B</text>
    <circle cx="330" cy="150" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="330" y="154" fill="#555">W</text>
    <circle cx="360" cy="150" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="360" y="154" fill="#555">W</text>
  </g>
  <rect x="164" y="133" width="92" height="34" fill="none" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="396" y="154" font-size="10" fill="#b85450">新插的 R 把 RR 变成 RRR</text>

  <path d="M 96 164 L 96 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 消除 RRR -->
  <text x="24" y="212" font-size="11" fill="#8a3a36" font-weight="bold">消 RRR</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <circle cx="120" cy="208" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="120" y="212" fill="#555">W</text>
    <circle cx="150" cy="208" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="150" y="212" fill="#555">W</text>
    <circle cx="180" cy="208" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="180" y="212" fill="#3a4a66">B</text>
    <circle cx="210" cy="208" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="210" y="212" fill="#3a4a66">B</text>
    <circle cx="240" cy="208" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="240" y="212" fill="#555">W</text>
    <circle cx="270" cy="208" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="270" y="212" fill="#555">W</text>
  </g>
  <text x="308" y="212" font-size="10" fill="#888">两侧 WW 仍是 2 连，不再连锁</text>

  <path d="M 96 222 L 96 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 2 步 -->
  <text x="24" y="270" font-size="11" fill="#446688" font-weight="bold">② 插 B</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <circle cx="120" cy="266" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="120" y="270" fill="#555">W</text>
    <circle cx="150" cy="266" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="150" y="270" fill="#555">W</text>
    <circle cx="180" cy="266" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/><text x="180" y="270" fill="#3a4a66">B</text>
    <circle cx="210" cy="266" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="210" y="270" fill="#3a4a66">B</text>
    <circle cx="240" cy="266" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/><text x="240" y="270" fill="#3a4a66">B</text>
    <circle cx="270" cy="266" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="270" y="270" fill="#555">W</text>
    <circle cx="300" cy="266" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="300" y="270" fill="#555">W</text>
  </g>
  <rect x="164" y="249" width="92" height="34" fill="none" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="336" y="270" font-size="10" fill="#446688">BB 变成 BBB，整段被移除</text>

  <path d="M 96 280 L 96 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 连锁全消 -->
  <text x="24" y="328" font-size="11" fill="#8a6a20" font-weight="bold">连锁</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <circle cx="120" cy="324" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="120" y="328" fill="#555">W</text>
    <circle cx="150" cy="324" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="150" y="328" fill="#555">W</text>
    <circle cx="180" cy="324" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="180" y="328" fill="#555">W</text>
    <circle cx="210" cy="324" r="13" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="210" y="328" fill="#555">W</text>
  </g>
  <path d="M 232 324 L 262 324" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="272" y="315" font-size="10.5" fill="#b85450">4 个 W 合并成一段</text>
  <text x="272" y="332" font-size="10.5" fill="#b85450">≥3 ⇒ 全部消除，桌面变空</text>

  <rect x="24" y="366" width="572" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="388" font-size="11" fill="#8a6a20" font-weight="bold">结论：2 颗（R 一次、B 一次），与官方输出一致</text>
  <text x="40" y="410" font-size="10.5" fill="#555">注意第 2 步之后的「连锁」：BBB 被删后两侧 WW 合并成 4 连，也会被删——消除必须一直跑到稳定。</text>
  <text x="40" y="426" font-size="10.5" fill="#555">对照示例 1（board = "WRRBBW"，hand = "RB"）：两颗球用尽仍剩球，只能返回 −1。</text>
</svg>
