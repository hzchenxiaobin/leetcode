<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：建掩码 → 两两判定 → 并查集计数分量</text>
  <path d="M 160 36 Q 320 46 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① 建掩码 -->
  <g filter="url(#sk)">
    <rect x="170" y="48" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b">① 每行去重 → mask[i] 第 v 位置 1</text>
  <text x="320" y="85" text-anchor="middle" font-size="10" fill="#6a87a8">O(n·m)，值 1 ≤ v ≤ 100</text>
  <path d="M 320 94 L 320 104" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ② 枚举配对 -->
  <g filter="url(#sk)">
    <rect x="170" y="106" width="300" height="38" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="129" text-anchor="middle" font-size="13" fill="#333">② comps = n，枚举所有配对 i &lt; j</text>
  <path d="M 320 144 L 320 154" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ③ popcount -->
  <g filter="url(#sk)">
    <rect x="170" y="156" width="300" height="38" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="179" text-anchor="middle" font-size="13" fill="#333">③ c = popcount(mask[i] &amp; mask[j])</text>
  <path d="M 320 194 L 320 204" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形判定 -->
  <g filter="url(#sk)">
    <path d="M 320 208 L 420 248 L 320 288 L 220 248 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">c ≥ k ?</text>

  <!-- 是 -->
  <path d="M 320 288 L 320 298" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="334" y="299" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- ④ union -->
  <g filter="url(#sk)">
    <rect x="170" y="300" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="324" text-anchor="middle" font-size="13" fill="#2e5e2e">④ find(i) ≠ find(j) → union，comps −= 1</text>

  <!-- 否：跳回枚举 -->
  <path d="M 420 248 Q 486 244 486 190 Q 486 124 474 124" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="448" y="238" font-size="12" font-weight="bold" fill="#b85450">否</text>

  <!-- 处理完一对：下一对 -->
  <path d="M 470 320 Q 560 320 560 200 Q 560 124 474 124" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="546" y="334" font-size="11" fill="#666">下一对</text>

  <!-- 出口 -->
  <path d="M 320 340 L 320 350" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="334" y="350" font-size="10" fill="#888">全部枚举完</text>

  <!-- ⑤ 返回 -->
  <g filter="url(#sk)">
    <rect x="170" y="352" width="300" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="376" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a3a34">返回 comps（= n − 有效合并次数）</text>

  <!-- 剪枝小抄 -->
  <g filter="url(#sk)">
    <rect x="24" y="200" width="148" height="124" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" stroke-dasharray="6,4"/>
  </g>
  <text x="98" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">剪枝小抄</text>
  <g font-size="10" fill="#3a5a3a" text-anchor="middle">
    <text x="98" y="240">若 mask[i] 里 1 的个数</text>
    <text x="98" y="255">（即不同值数）&lt; k：它与</text>
    <text x="98" y="270">任何行的交集都 &lt; k，</text>
    <text x="98" y="285">必为孤立分量，</text>
    <text x="98" y="300">可从枚举中直接跳过</text>
  </g>

  <text x="320" y="408" text-anchor="middle" font-size="11" fill="#888">连通分量也可 DFS/BFS；并查集不必显式建邻接表，计数顺手完成</text>
</svg>
