<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333">窗口内维护：出现次数 cnt 与不同元素和 sum</text>

  <text x="40" y="76" font-size="13" fill="#446688">nums</text>
  <rect x="96" y="58" width="40" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="58" width="40" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="82" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="162" y="82" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="208" y="82" text-anchor="middle" font-size="15" fill="#333">3</text>
  <text x="254" y="82" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="300" y="82" text-anchor="middle" font-size="15" fill="#333">4</text>
  <text x="346" y="82" text-anchor="middle" font-size="15" fill="#333">2</text>
  <path d="M138,50 L324,50" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M92,104 L364,104" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="372" y="112" font-size="12" fill="#d6a040">窗口 [l, r]</text>
  <text x="150" y="130" font-size="12" fill="#446688">l 只能右移 →</text>
  <text x="290" y="130" font-size="12" fill="#446688">← r 逐个右移</text>

  <rect x="60" y="152" width="200" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="176" font-size="12" fill="#333">cnt[2] = 2，cnt[3] = 1，cnt[1] = 1</text>
  <text x="72" y="200" font-size="12" fill="#333">sum = 2 + 3 + 1 = 6</text>

  <rect x="292" y="152" width="228" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="304" y="176" font-size="12" fill="#333">左移 l 前先判断：sum − nums[l]</text>
  <text x="304" y="200" font-size="12" fill="#333">（仅当 cnt[nums[l]] = 1 才减）</text>

  <rect x="60" y="240" width="460" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="264" font-size="12" fill="#333">单调性：l 越大，不同值集合越小 → sum 单调不增</text>
  <text x="74" y="284" font-size="12" fill="#b85450">故「最短达标窗口」=「达标的最大 l」，双指针一趟完成</text>
</svg>
