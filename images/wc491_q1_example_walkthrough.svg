<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：三组样例的倒序扫描走查</text>
  <text x="320" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">绿框 = 停下的切割点；红框 + 删除线 = 被删的尾部元音；蓝框 = 保留</text>

  <!-- ======== Row 1: idea ======== -->
  <text x="40" y="66" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1｜s = "idea"</text>
  <rect x="150" y="74" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="104" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">i</text>
  <rect x="196" y="74" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="219" y="104" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">d</text>
  <rect x="242" y="74" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="104" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">e</text>
  <rect x="288" y="74" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="311" y="104" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">a</text>
  <line x1="246" y1="97" x2="284" y2="97" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="292" y1="97" x2="330" y2="97" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="219" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">停！</text>
  <text x="173" y="134" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="219" y="134" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="265" y="134" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="311" y="134" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="404" y="103" text-anchor="middle" font-size="18" fill="#888" filter="url(#rough2)">⇒</text>
  <text x="500" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">输出</text>
  <rect x="440" y="78" width="120" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="103" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"id"</text>
  <text x="150" y="158" font-size="10.5" fill="#666" filter="url(#rough2)">a ∈ V ✓ 左移 → e ∈ V ✓ 左移 → d ∉ V 停，i = 1：删去尾部 "ea"（2 个），头部元音 'i' 保留</text>

  <!-- ======== Row 2: day ======== -->
  <text x="40" y="198" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2｜s = "day"</text>
  <rect x="150" y="208" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="238" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">d</text>
  <rect x="196" y="208" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="219" y="238" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">a</text>
  <rect x="242" y="208" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="265" y="238" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">y</text>
  <text x="265" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">停！</text>
  <text x="173" y="268" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="219" y="268" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="265" y="268" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="330" y="236" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⚠ 'y' 不是元音！（常见陷阱）</text>
  <text x="404" y="237" text-anchor="middle" font-size="18" fill="#888" filter="url(#rough2)">⇒</text>
  <text x="500" y="206" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">输出</text>
  <rect x="440" y="212" width="120" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="237" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"day"</text>
  <text x="150" y="292" font-size="10.5" fill="#666" filter="url(#rough2)">y ∉ V → 第一轮即停，i = 2：中间的 'a' 虽是元音但不属于尾部连续段 → 保留，原样返回（删 0 个）</text>

  <!-- ======== Row 3: aeiou ======== -->
  <text x="40" y="324" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3｜s = "aeiou"</text>
  <rect x="150" y="334" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="364" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">a</text>
  <rect x="196" y="334" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="219" y="364" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">e</text>
  <rect x="242" y="334" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="364" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">i</text>
  <rect x="288" y="334" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="311" y="364" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">o</text>
  <rect x="334" y="334" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="357" y="364" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">u</text>
  <line x1="154" y1="357" x2="192" y2="357" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="200" y1="357" x2="238" y2="357" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="246" y1="357" x2="284" y2="357" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="292" y1="357" x2="330" y2="357" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="338" y1="357" x2="376" y2="357" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="173" y="394" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="219" y="394" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="265" y="394" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="311" y="394" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="357" y="394" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="404" y="363" text-anchor="middle" font-size="18" fill="#888" filter="url(#rough2)">⇒</text>
  <text x="500" y="332" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">输出</text>
  <rect x="440" y="338" width="120" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="363" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">""（空串）</text>
  <text x="150" y="418" font-size="10.5" fill="#666" filter="url(#rough2)">a,e,i,o,u 全 ∈ V → i 一路减到 −1（扫穿整个串）：前缀长 0，substr(0, 0) 天然返回空串（删 5 个）</text>

  <!-- bottom note -->
  <rect x="60" y="436" width="520" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="451" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">「尾部元音」= 从末位起连续的极长全元音段：三组样例分别删 2 个、0 个、5 个</text>
  <text x="320" y="466" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">头部（'i'）与中间（'a'）的元音一律不动；全元音串的空串边界由下标语义自动消化</text>
</svg>
