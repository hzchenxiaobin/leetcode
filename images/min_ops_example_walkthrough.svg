<svg xmlns="http://www.w3.org/2000/svg" width="940" height="690" viewBox="0 0 940 690" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="690" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 逐列演算：grid = [[1,1,1],[0,0,0]] → 答案 3</text>
  <path d="M 240 42 Q 470 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: original grid & counts ===== -->
  <text x="470" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 原始网格（m = 2，n = 3）与每列计数</text>

  <g font-size="10" fill="#888" font-weight="bold">
    <text x="166" y="92" text-anchor="middle">列0</text>
    <text x="246" y="92" text-anchor="middle">列1</text>
    <text x="326" y="92" text-anchor="middle">列2</text>
    <text x="95" y="117">行0</text>
    <text x="95" y="153">行1</text>
  </g>
  <g filter="url(#sk)"><rect x="140" y="98" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="166" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk)"><rect x="220" y="98" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="246" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk)"><rect x="300" y="98" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="326" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk)"><rect x="140" y="134" width="52" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="166" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">0</text>
  <g filter="url(#sk)"><rect x="220" y="134" width="52" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="246" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">0</text>
  <g filter="url(#sk)"><rect x="300" y="134" width="52" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="326" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">0</text>

  <g filter="url(#sk)"><rect x="430" y="92" width="450" height="76" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="450" y="114" font-size="12" font-weight="bold" fill="#2b2b2b">每列 cnt：0 → 1，1 → 1，其余值 → 0</text>
  <text x="450" y="136" font-size="11" fill="#444" font-family="monospace">cost(j, 0) = 2−1 = 1；cost(j, 1) = 1；cost(j, v≥2) = 2</text>
  <text x="450" y="156" font-size="10" fill="#888">三列计数完全相同 → 每列套同一张代价表</text>

  <!-- ===== Panel 2: dp table ===== -->
  <text x="470" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">② dp 表：第 0 列只付自身代价，之后每列加「最优前驱」</text>

  <!-- header row y=214..244 -->
  <g filter="url(#sk)"><rect x="170" y="214" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="230" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">值 v</text>
  <g filter="url(#sk)"><rect x="290" y="214" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="345" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">dp[0][v]</text>
  <g filter="url(#sk)"><rect x="400" y="214" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="455" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">dp[1][v]</text>
  <g filter="url(#sk)"><rect x="510" y="214" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="565" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">dp[2][v]</text>

  <!-- row v=0: 1,2,3 -->
  <g filter="url(#sk)"><rect x="170" y="244" width="120" height="32" fill="#f0ede4" stroke="#999" stroke-width="1"/></g>
  <text x="230" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">0</text>
  <g filter="url(#sk)"><rect x="290" y="244" width="110" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="345" y="265" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="400" y="244" width="110" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="455" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="510" y="244" width="110" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="565" y="265" text-anchor="middle" font-size="12" fill="#444">3</text>

  <!-- row v=1: 1,2,3 (path: dp0 and dp2) -->
  <g filter="url(#sk)"><rect x="170" y="276" width="120" height="32" fill="#f0ede4" stroke="#999" stroke-width="1"/></g>
  <text x="230" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">1</text>
  <g filter="url(#sk)"><rect x="290" y="276" width="110" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="345" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <g filter="url(#sk)"><rect x="400" y="276" width="110" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="455" y="297" text-anchor="middle" font-size="12" fill="#444">2</text>
  <g filter="url(#sk)"><rect x="510" y="276" width="110" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="565" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">3</text>

  <!-- row v=2..9: 2,3,4 -->
  <g filter="url(#sk)"><rect x="170" y="308" width="120" height="32" fill="#f0ede4" stroke="#999" stroke-width="1"/></g>
  <text x="230" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">2 ~ 9</text>
  <g filter="url(#sk)"><rect x="290" y="308" width="110" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="345" y="329" text-anchor="middle" font-size="12" fill="#444">2</text>
  <g filter="url(#sk)"><rect x="400" y="308" width="110" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="455" y="329" text-anchor="middle" font-size="12" fill="#444">3</text>
  <g filter="url(#sk)"><rect x="510" y="308" width="110" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="565" y="329" text-anchor="middle" font-size="12" fill="#444">4</text>

  <!-- path arrows dp[0][1] -> dp[1][0] -> dp[2][1] -->
  <path d="M 370 290 Q 410 260 442 262" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 475 275 Q 515 265 545 290" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- right annotations -->
  <text x="660" y="248" font-size="11.5" font-weight="bold" fill="#444">第 1 列转移（b₁ = 0）：</text>
  <text x="660" y="268" font-size="10.5" fill="#b03a3a" font-family="monospace">dp[1][0] = 1 + v₂ = 1 + 1 = 2</text>
  <text x="660" y="286" font-size="10.5" fill="#b03a3a" font-family="monospace">dp[1][1] = 1 + v₁ = 1 + 1 = 2</text>
  <text x="660" y="304" font-size="10.5" fill="#888" font-family="monospace">dp[1][v≥2] = 2 + 1 = 3</text>
  <text x="660" y="326" font-size="10" fill="#888">本例 v₁ = v₂ = 1：撞色惩罚恰为 0</text>

  <text x="470" y="372" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">第 2 列同理：dp[2][0]=1+2=3，dp[2][1]=1+2=3，dp[2][≥2]=2+2=4 → 答案 = min = 3</text>

  <!-- ===== Panel 3: backtracking ===== -->
  <text x="470" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ 回溯：列 0 取 1 → 列 1 取 0 → 列 2 取 1，总代价 1 + 1 + 1 = 3</text>

  <text x="246" y="438" text-anchor="middle" font-size="11" fill="#888">修改后矩阵</text>
  <g font-size="10" fill="#888" font-weight="bold">
    <text x="95" y="463">行0</text>
    <text x="95" y="499">行1</text>
  </g>
  <!-- final grid, changed cells red -->
  <g filter="url(#sk)"><rect x="140" y="442" width="52" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="166" y="463" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <g filter="url(#sk)"><rect x="220" y="442" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="246" y="463" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">0</text>
  <g filter="url(#sk)"><rect x="300" y="442" width="52" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="326" y="463" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <g filter="url(#sk)"><rect x="140" y="478" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="166" y="499" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">1</text>
  <g filter="url(#sk)"><rect x="220" y="478" width="52" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="246" y="499" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">0</text>
  <g filter="url(#sk)"><rect x="300" y="478" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="326" y="499" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">1</text>

  <text x="246" y="532" text-anchor="middle" font-size="10" fill="#888">列值序列 1, 0, 1（相邻互异 ✓）</text>

  <!-- legend -->
  <text x="430" y="458" font-size="11" fill="#b03a3a" font-weight="bold">■ 红色 = 被修改的格子（共 3 个）</text>
  <text x="430" y="478" font-size="11" fill="#2e6e2e" font-weight="bold">■ 绿色 = 保持原值的格子</text>

  <!-- ops list -->
  <g filter="url(#sk)"><rect x="430" y="496" width="450" height="96" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="450" y="520" font-size="12" font-weight="bold" fill="#2b6e9e">3 次操作明细</text>
  <text x="450" y="540" font-size="11" fill="#444" font-family="monospace">grid[1][0]：0 → 1</text>
  <text x="450" y="558" font-size="11" fill="#444" font-family="monospace">grid[0][1]：1 → 0</text>
  <text x="450" y="576" font-size="11" fill="#444" font-family="monospace">grid[1][2]：0 → 1</text>
  <text x="450" y="594" font-size="10" fill="#888">与官方解释完全一致：恰好 3 次操作</text>

  <!-- final answer -->
  <g filter="url(#sk)"><circle cx="470" cy="640" r="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="470" y="647" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">答案 = 3 ✓</text>
</svg>
