<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">三类翻转，分别取最大增益</text>
  <rect x="40" y="56" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="90.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 前缀 [0..i]：Δ = |a[i+1] − a[0]| − |a[i+1] − a[i]|</text>
  <rect x="40" y="126" width="440" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="160.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 后缀 [i..n−1]：Δ = |a[i−1] − a[n−1]| − |a[i] − a[i−1]|</text>
  <rect x="40" y="196" width="440" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="238.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 内部 [L..R]：Δ = 2 · ( max 段内较小值 − min 段内较大值 )</text>
  <text x="260" y="292" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">其中「段」指相邻对 (a[i], a[i+1])，较小值取 min、较大值取 max。</text>
  <rect x="52" y="312" width="420" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="64" y="330" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">合成答案</text>
  <text x="64" y="346" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">答案 = 原数组值 + max(0, ①, ②, ③ 的最大增益)</text>
  <text x="64" y="361" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">之所以出现 2 倍：两个绝对值各有两种拆法，取最优推导得到。</text>
</svg>
