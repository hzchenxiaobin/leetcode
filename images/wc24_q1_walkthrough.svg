<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root = [1,2,3,4,5]</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">后序自底向上：先 4、5，再 2、3，最后 1（表格按访问顺序排列）</text>

  <!-- 表头 -->
  <rect x="55" y="62" width="450" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#3a4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="110" y="84">节点 u</text>
    <text x="207" y="84">h(左)</text>
    <text x="292" y="84">h(右)</text>
    <text x="385" y="84">候选 L+R</text>
    <text x="470" y="84">返回 h(u)</text>
  </g>

  <!-- 数据行：4 与 5 为叶子 -->
  <g filter="url(#rough2)">
    <rect x="55" y="100" width="450" height="32" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="6"/>
    <rect x="55" y="136" width="450" height="32" fill="#f7f9fc" stroke="#b8c4d0" stroke-width="1.2" rx="6"/>
    <rect x="55" y="172" width="450" height="32" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="6"/>
    <rect x="55" y="208" width="450" height="32" fill="#f7f9fc" stroke="#b8c4d0" stroke-width="1.2" rx="6"/>
    <!-- 根节点行高亮 -->
    <rect x="55" y="244" width="450" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>

  <g font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="121">4</text><text x="207" y="121">0</text><text x="292" y="121">0</text><text x="385" y="121">0</text><text x="470" y="121">1</text>
    <text x="110" y="157">5</text><text x="207" y="157">0</text><text x="292" y="157">0</text><text x="385" y="157">0</text><text x="470" y="157">1</text>
    <text x="110" y="193">2</text><text x="207" y="193">1</text><text x="292" y="193">1</text><text x="385" y="193">2</text><text x="470" y="193">2</text>
    <text x="110" y="229">3</text><text x="207" y="229">0</text><text x="292" y="229">0</text><text x="385" y="229">0</text><text x="470" y="229">1</text>
  </g>

  <g font-size="11" fill="#2f5a2a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="110" y="266">1</text><text x="207" y="266">2</text><text x="292" y="266">1</text><text x="385" y="266">3</text><text x="470" y="266">3</text>
  </g>

  <!-- 最大值标注 -->
  <path d="M 508 261 L 530 261" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="534" y="265" font-size="9" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">max</text>

  <!-- 结论 -->
  <rect x="55" y="296" width="450" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="68" y="314" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">ans = max(0, 0, 2, 0, 3) = 3　→　路径 4 → 2 → 1 → 3，共 3 条边</text>
  <text x="68" y="330" font-size="9.5" fill="#8a7a55" filter="url(#rough2)">注意直径不一定经过根：如 [1,2,null,3,4,5,null,6] 的答案为 4</text>

  <text x="280" y="360" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">叶子 4 的 h 是节点数口径的 1，等价于「一条 0 边长的链」，所以 h 可以直接相加</text>
</svg>
