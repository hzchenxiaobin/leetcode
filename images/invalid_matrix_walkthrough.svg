<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="410" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 2 演算：第 0 行的两个 1 撞车</text>
  <path d="M 280 44 Q 440 52 600 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左：示例矩阵 -->
  <text x="155" y="72" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">示例 2（n = 3）</text>
  <g filter="url(#rough2)">
    <rect x="74" y="84" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="128" y="84" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="182" y="84" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="74" y="138" width="54" height="54" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
    <rect x="128" y="138" width="54" height="54" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
    <rect x="182" y="138" width="54" height="54" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
    <rect x="74" y="192" width="54" height="54" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
    <rect x="128" y="192" width="54" height="54" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
    <rect x="182" y="192" width="54" height="54" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <text x="101" y="117">1</text>
    <text x="155" y="117">1</text>
    <text x="209" y="117">1</text>
    <text x="101" y="171">1</text>
    <text x="155" y="171">2</text>
    <text x="209" y="171">3</text>
    <text x="101" y="225">1</text>
    <text x="155" y="225">2</text>
    <text x="209" y="225">3</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="end">
    <text x="66" y="116">i=0</text>
    <text x="66" y="170">i=1</text>
    <text x="66" y="224">i=2</text>
  </g>

  <!-- 步骤标记圈 -->
  <circle cx="101" cy="111" r="27" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="155" cy="111" r="27" fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="209" cy="111" r="27" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="101" y="262" fill="#4a7a3a">j=0 ✓</text>
    <text x="155" y="262" fill="#b85450">j=1 ✗</text>
    <text x="209" y="262" fill="#999">j=2 未达</text>
  </g>

  <!-- 右：seen_row 数组 -->
  <text x="590" y="72" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">seen_row（i = 0 行检查）</text>
  <g filter="url(#rough2)">
    <rect x="490" y="84" width="62" height="50" fill="#ffffff" stroke="#99a6b3" stroke-width="1.4" rx="6"/>
    <rect x="572" y="84" width="62" height="50" fill="#ffffff" stroke="#99a6b3" stroke-width="1.4" rx="6"/>
    <rect x="654" y="84" width="62" height="50" fill="#ffffff" stroke="#99a6b3" stroke-width="1.4" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="521" y="152">下标 1</text>
    <text x="603" y="152">下标 2</text>
    <text x="685" y="152">下标 3</text>
  </g>
  <g filter="url(#rough2)" font-size="16" font-weight="bold" text-anchor="middle">
    <text x="510" y="117" fill="#4a7a3a">✓</text>
    <text x="536" y="117" fill="#b85450">✗</text>
  </g>

  <!-- 两条箭头 -->
  <path d="M 101 143 C 220 205 380 150 482 108" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="268" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">j=0：标记 seen[1] ← ✓</text>
  <path d="M 155 143 C 270 232 400 185 482 122" stroke="#b85450" stroke-width="1.8" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">j=1：seen[1] 已被标记！</text>

  <!-- 结果框 -->
  <g filter="url(#rough2)">
    <rect x="470" y="180" width="350" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="645" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4442" filter="url(#rough2)">return false：第 0 行的 1 出现两次</text>
  <text x="645" y="224" text-anchor="middle" font-size="11" fill="#8a4442" filter="url(#rough2)">j=1 即短路，剩余 7 个元素不再扫描</text>

  <!-- 底部注释框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="290" width="760" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="440" y="318" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#rough2)">补充：第 0 列 [1,1,1] 同样非法；但 fused 写法里 i=0 轮的行检查在 j=1 先触发，</text>
  <text x="440" y="342" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#rough2)">列检查（v_col = matrix[j][0]）刚标记完 j=0 的一个 1，还没来得及报错。</text>
  <text x="440" y="366" text-anchor="middle" font-size="12" fill="#a67c1e" filter="url(#rough2)">短路返回是 seen 数组查重的优势：最早冲突点立即退出，最坏 O(n²)、最好 O(1)。</text>
</svg>
