<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">中心 3：邻居值降序 → 取前 k=2 个正数</text>

  <!-- 邻居值降序条形 -->
  <text x="60" y="66" font-size="13" fill="#333" filter="url(#rough2)">邻居值（降序）：</text>

  <rect x="60" y="80" width="120" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="102" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10 ✓</text>

  <rect x="190" y="80" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="102" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2 ✓</text>

  <rect x="300" y="80" width="100" height="34" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="102" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">-10 ✗</text>

  <rect x="410" y="80" width="100" height="34" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="460" y="102" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">-20 ✗</text>

  <!-- 框选前 2 个 -->
  <path d="M52,74 L286,74 L286,120 L52,120 Z" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="52" y="64" font-size="12" fill="#d6a040" filter="url(#rough2)">min(k, deg) = 2 个配额</text>
  <text x="410" y="130" font-size="12" fill="#666" filter="url(#rough2)">≤ 0 即停</text>

  <!-- 求和流程 -->
  <rect x="150" y="150" width="100" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">中心值 4</text>
  <path d="M255,167 L295,167" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="300" y="150" width="100" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+10 +2</text>
  <path d="M405,167 L445,167" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="450" y="150" width="60" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="172" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">16</text>

  <!-- 各中心结果对比 -->
  <text x="60" y="215" font-size="13" fill="#333" filter="url(#rough2)">各中心的最优星和：</text>

  <rect x="60" y="228" width="66" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="93" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c=0: 3</text>
  <rect x="134" y="228" width="66" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="167" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c=1: 9</text>
  <rect x="208" y="228" width="66" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="241" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c=2: 5</text>
  <rect x="282" y="228" width="76" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c=3: 16 ★</text>
  <rect x="366" y="228" width="66" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="399" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c=4: 14</text>
  <rect x="440" y="228" width="60" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="470" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">其余 ≤ 0</text>

  <path d="M320,228 L320,214" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- 结论框 -->
  <rect x="80" y="285" width="360" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">answer = max(各中心: 自身值 + 前 k 个正邻居和)</text>
  <text x="260" y="326" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">k=0 或无边时退化为 max(vals)</text>
</svg>
