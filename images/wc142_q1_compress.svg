<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr_orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#78909c"/>
    </marker>
    <marker id="arr_purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="650" height="420" fill="#fafafa"/>

  <text x="325.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">count 数组 = 已排好序的压缩样本</text>
  <text x="325.0" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">值域固定 0..255，统计量只需扫描 256 格</text>

  <rect x="60" y="96" width="72" height="52" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="96.0" y="123.0" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="96.0" y="142.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">count[0]</text>
  <rect x="152" y="96" width="72" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="188.0" y="123.0" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="188.0" y="142.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">count[1]</text>
  <rect x="244" y="96" width="72" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="123.0" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="280.0" y="142.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">count[2]</text>
  <rect x="336" y="96" width="72" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="372.0" y="123.0" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="372.0" y="142.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">count[3]</text>
  <text x="56" y="86" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">count[k]：整数 k 在样本中出现 count[k] 次</text>
  <text x="430" y="128" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">… 其余 252 格全 0</text>
  <text x="56" y="182" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">展开后的样本（8 个元素，天然升序）—— 但 N 可达 1e9，不能真展开</text>
  <rect x="56" y="206" width="58" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="85.0" y="231.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="85.0" y="248.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">#0</text>
  <rect x="126" y="206" width="58" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155.0" y="231.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="155.0" y="248.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">#1</text>
  <rect x="196" y="206" width="58" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="225.0" y="231.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="225.0" y="248.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">#2</text>
  <rect x="266" y="206" width="58" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="295.0" y="231.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="295.0" y="248.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">#3</text>
  <rect x="336" y="206" width="58" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="365.0" y="231.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="365.0" y="248.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">#4</text>
  <rect x="406" y="206" width="58" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="435.0" y="231.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="435.0" y="248.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">#5</text>
  <rect x="476" y="206" width="58" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="505.0" y="231.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="505.0" y="248.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">#6</text>
  <rect x="546" y="206" width="58" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="575.0" y="231.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="575.0" y="248.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">#7</text>
  <text x="24" y="190" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">展开 ↓</text>
  <rect x="36" y="300" width="180" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="126.0" y="331.0" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">min = 1，max = 3</text>
  <text x="126.0" y="354.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">首个 / 末个非零 k</text>
  <rect x="232" y="300" width="196" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="330.0" y="331.0" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">mean = Σk·count[k] / N</text>
  <text x="330.0" y="354.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">19 / 8 = 2.375</text>
  <rect x="444" y="300" width="180" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="534.0" y="331.0" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">mode = argmax count[k]</text>
  <text x="534.0" y="354.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">count[3]=4 → 3</text>
  <text x="24" y="404" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">中位数与顺序无关，只与「第几个」有关 → 用计数前缀定位（下一张图）</text>
</svg>
