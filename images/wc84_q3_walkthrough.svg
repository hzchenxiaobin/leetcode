<svg xmlns="http://www.w3.org/2000/svg" width="620" height="440" viewBox="0 0 620 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="89" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="93" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="440" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：最大频次就是答案 3</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="310.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">A 的 1：(0,0) (0,1) (1,1) (2,1)；B 的 1：(1,1) (1,2) (2,2)；d = q − p</text>
  <g filter="url(#rough2)"><rect x="70" y="96" width="410" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="120.0" y="113.68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">A 的点 p</text>
  <text x="220.0" y="113.68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">B 的点 q</text>
  <text x="330.0" y="113.68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">d = p − q</text>
  <text x="435.0" y="113.68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">cnt[d]</text>
  <g filter="url(#rough2)"><rect x="70" y="122" width="410" height="26" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="140.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0)</text>
  <text x="220.0" y="140.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="330.0" y="140.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="435.0" y="140.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="70" y="148" width="410" height="26" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="166.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,1)</text>
  <text x="220.0" y="166.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,2)</text>
  <text x="330.0" y="166.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="435.0" y="166.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="70" y="174" width="410" height="26" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="192.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="220.0" y="192.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,2)</text>
  <text x="330.0" y="192.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="435.0" y="192.2" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 ★</text>
  <g filter="url(#rough2)"><rect x="70" y="200" width="410" height="26" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="218.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0)</text>
  <text x="220.0" y="218.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,2)</text>
  <text x="330.0" y="218.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,2)</text>
  <text x="435.0" y="218.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="70" y="226" width="410" height="26" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="244.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,1)</text>
  <text x="220.0" y="244.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,2)</text>
  <text x="330.0" y="244.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,1)</text>
  <text x="435.0" y="244.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="70" y="252" width="410" height="26" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="270.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="220.0" y="270.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,2)</text>
  <text x="330.0" y="270.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,1)</text>
  <text x="435.0" y="270.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="70" y="278" width="410" height="26" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="296.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,1)</text>
  <text x="220.0" y="296.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="330.0" y="296.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(−1,−1)</text>
  <text x="435.0" y="296.2" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="310" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">d = (1,1) 出现 3 次 → A 向右下各 1 格，重叠 3</text>
  <g filter="url(#rough2)"><rect x="70" y="338" width="480" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310.0" y="360" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">(0,−1) 出现 2 次，其余 d 各 1 次，最大值 3</text>
  <text x="310.0" y="378" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">d = q − p 就是 A 的位移：A 加 d 后，p 恰好落到 q 上</text>
  </svg>