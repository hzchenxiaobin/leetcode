<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">至少一条边平行于坐标轴 -&gt; 底边只有两类</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">竖底：同 x 的两点；横底：同 y 的两点</text>
  <rect x="40" y="58" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="160.0" y="76.0" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">竖底（平行 y 轴）</text>
  <text x="160.0" y="92.0" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">底 = maxY[x] - minY[x]，高 = |x - x'|</text>
  <rect x="310" y="58" width="250" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="435.0" y="76.0" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">横底（平行 x 轴）</text>
  <text x="435.0" y="92.0" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">底 = maxX[y] - minX[y]，高 = |y - y'|</text>
  <path d="M 80 130 L 80 250" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <circle cx="80" cy="130" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="80" cy="250" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="250" cy="190" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="122" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">底</text>
  <text x="262" y="186" font-size="10.5" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">第三点</text>
  <path d="M 92 190 L 240 190" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="150" y="182" font-size="10" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">高 = 水平距离</text>
  <rect x="320" y="130" width="240" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="440.0" y="154.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">2 × 面积 = 底 × 高</text>
  <text x="440.0" y="174.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">所以只要让「底」与「高」各自取到最大</text>
  <rect x="320" y="206" width="240" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="440.0" y="230.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">同一 x 上的点可以很多，</text>
  <text x="440.0" y="250.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">底取该 x 的 y 极差即最大</text>
  <text x="40" y="320" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">面积不能为 0：底 &gt; 0 且高 &gt; 0，否则该候选无效</text>
  <text x="40" y="344" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">所有点同 x（或同 y）时答案 -1</text>
</svg>
