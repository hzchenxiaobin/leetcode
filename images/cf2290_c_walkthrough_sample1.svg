<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">样例 1 走查：h = [1, 2, 2, 3, 3, 3] → k = 1 + 2 + 2 = 5</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">排序：1 2 2 3 3 3　→　第一段取 1 2 3，第二段补剩余副本 3 3 2</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="150" y="66" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="175" y="91" fill="#3a5a30">1</text>
    <rect x="202" y="66" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="227" y="91" fill="#3a4a66">2</text>
    <rect x="254" y="66" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="279" y="91" fill="#3a4a66">2</text>
    <rect x="306" y="66" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5"/>
    <text x="331" y="91" fill="#8a6a20">3</text>
    <rect x="358" y="66" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5"/>
    <text x="383" y="91" fill="#8a6a20">3</text>
    <rect x="410" y="66" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5"/>
    <text x="435" y="91" fill="#8a6a20">3</text>
  </g>
  <text x="118" y="90" text-anchor="end" font-size="10.5" fill="#888">排序后</text>
  <text x="472" y="90" font-size="10" fill="#888">同高度相邻成段</text>
  <text x="472" y="108" font-size="10" fill="#b85450">cnt = 1, 2, 3</text>

  <path d="M 310 106 L 310 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="150" y="130" width="50" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="175" y="157" fill="#3a5a30">1</text>
    <rect x="202" y="130" width="50" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="227" y="157" fill="#3a5a30">2</text>
    <rect x="254" y="130" width="50" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="279" y="157" fill="#3a5a30">3</text>
    <rect x="306" y="130" width="50" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <text x="331" y="157" fill="#8a3a36">3</text>
    <rect x="358" y="130" width="50" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="383" y="157" fill="#3a4a66">3</text>
    <rect x="410" y="130" width="50" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="435" y="157" fill="#3a4a66">2</text>
  </g>
  <text x="118" y="157" text-anchor="end" font-size="10.5" fill="#888">排列</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="175" y="190" fill="#3a5a30">L</text>
    <text x="227" y="190" fill="#3a5a30">L</text>
    <text x="279" y="190" fill="#3a5a30">L</text>
    <text x="331" y="190" fill="#b85450">·</text>
    <text x="383" y="190" fill="#3a4a66">R</text>
    <text x="435" y="190" fill="#3a4a66">R</text>
  </g>

  <path d="M 150 202 L 150 216 L 304 216 L 304 202" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="227" y="232" text-anchor="middle" font-size="10" fill="#3a5a30">第一段：每个高度各 1 本，升序</text>
  <path d="M 306 202 L 306 216 L 460 216 L 460 202" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="383" y="232" text-anchor="middle" font-size="10" fill="#3a4a66">第二段：剩余副本 3,3,2（降序分块）</text>

  <rect x="60" y="248" width="500" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <text x="130" y="268">高度 v</text>
    <text x="240" y="268">出现次数 cnt_v</text>
    <text x="370" y="268">min(cnt_v, 2)</text>
    <text x="490" y="268">可见位置</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#555">
    <rect x="60" y="284" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="130" y="302">1</text>
    <text x="240" y="302">1</text>
    <text x="370" y="302">1</text>
    <text x="490" y="302">左链 1 本</text>

    <rect x="60" y="314" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="130" y="332">2</text>
    <text x="240" y="332">2</text>
    <text x="370" y="332">2</text>
    <text x="490" y="332">左链 1 + 右链 1</text>

    <rect x="60" y="344" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="130" y="362">3</text>
    <text x="240" y="362">3</text>
    <text x="370" y="362">2</text>
    <text x="490" y="362">左链 1 + 右链 1</text>
  </g>

  <rect x="60" y="378" width="500" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="310" y="399" text-anchor="middle" font-size="11" fill="#8a3a36">k = 1 + 2 + 2 = 5；中间的 3 左右都有 ≥ 自己的书，两侧都看不见</text>
</svg>
