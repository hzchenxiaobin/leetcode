<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：可做花束数关于天数单调不减</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">于是「能否做够 m 束」是一个布尔阶梯，二分最小的可行天数</text>

  <line x1="90" y1="290" x2="552" y2="290" stroke="#555" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="90" y1="290" x2="90" y2="94" stroke="#555" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="96" y="88" font-size="10.5" fill="#555" filter="url(#rough2)">可做花束数</text>
  <text x="548" y="94" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">天数 day</text>

  <text x="80" y="295" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="80" y="240" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="80" y="185" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">2</text>

  <line x1="335" y1="100" x2="335" y2="290" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="540" y1="100" x2="540" y2="290" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="335" y="306" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7</text>
  <text x="540" y="306" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">12</text>
  <text x="90" y="306" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>

  <path d="M 90 290 L 335 290 L 335 235 L 540 235 L 540 180 L 552 180"
        fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>

  <line x1="90" y1="180" x2="556" y2="180" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="100" y="174" font-size="10.5" fill="#b08020" filter="url(#rough2)">目标线 m = 2 束</text>

  <circle cx="540" cy="180" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="524" y="164" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 12</text>

  <circle cx="335" cy="235" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="346" y="230" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">第 7 天：1 束 &lt; 2</text>

  <rect x="90" y="318" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="106" y="338" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">单调性 ⇒ 二分答案</text>
  <text x="106" y="356" font-size="10" fill="#555" filter="url(#rough2)">天数 x 可行，则任意 y &gt; x 一定也可行；找最小的可行 x，即二分下界</text>
</svg>
