<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">去程 + 回程 ⇔ 两条同时向右/下的路径</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">把回程路径反向读，它就是另一条从 (0,0) 走到 (n−1,n−1) 的正向路径</text>

  <rect x="30" y="66" width="230" height="234" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="145" y="88" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">路径 A（原去程）</text>

  <g filter="url(#rough2)">
    <rect x="85" y="100" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="125" y="100" width="40" height="40" fill="#ffffff" stroke="#9bb3cc" stroke-width="1.2" rx="4"/>
    <rect x="165" y="100" width="40" height="40" fill="#ffffff" stroke="#9bb3cc" stroke-width="1.2" rx="4"/>
    <rect x="85" y="140" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="125" y="140" width="40" height="40" fill="#ffffff" stroke="#9bb3cc" stroke-width="1.2" rx="4"/>
    <rect x="165" y="140" width="40" height="40" fill="#ffffff" stroke="#9bb3cc" stroke-width="1.2" rx="4"/>
    <rect x="85" y="180" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="125" y="180" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="165" y="180" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <path d="M 105 108 L 105 196 L 185 196" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="248" text-anchor="middle" font-size="10.5" fill="#3a5a30">只允许 ↓ / → ，绿格为经过的格子</text>
  <text x="145" y="272" text-anchor="middle" font-size="10.5" fill="#666">起点 (0,0) → 终点 (2,2)</text>
  <text x="145" y="290" text-anchor="middle" font-size="10" fill="#999">n = 3 的示意</text>

  <rect x="300" y="66" width="230" height="234" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="415" y="88" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">路径 B（回程反向看）</text>

  <g filter="url(#rough2)">
    <rect x="355" y="100" width="40" height="40" fill="#fff3d6" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="395" y="100" width="40" height="40" fill="#fff3d6" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="435" y="100" width="40" height="40" fill="#ffffff" stroke="#d9c48c" stroke-width="1.2" rx="4"/>
    <rect x="355" y="140" width="40" height="40" fill="#ffffff" stroke="#d9c48c" stroke-width="1.2" rx="4"/>
    <rect x="395" y="140" width="40" height="40" fill="#ffffff" stroke="#d9c48c" stroke-width="1.2" rx="4"/>
    <rect x="435" y="140" width="40" height="40" fill="#fff3d6" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="355" y="180" width="40" height="40" fill="#ffffff" stroke="#d9c48c" stroke-width="1.2" rx="4"/>
    <rect x="395" y="180" width="40" height="40" fill="#ffffff" stroke="#d9c48c" stroke-width="1.2" rx="4"/>
    <rect x="435" y="180" width="40" height="40" fill="#fff3d6" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <path d="M 375 108 L 455 108 L 455 196" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="248" text-anchor="middle" font-size="10.5" fill="#8a6a20">回程只允许 ↑ / ← ，反向即 ↓ / →</text>
  <text x="415" y="272" text-anchor="middle" font-size="10.5" fill="#666">同一条格子集合，顺序倒过来而已</text>
  <text x="415" y="290" text-anchor="middle" font-size="10" fill="#999">两条路径天然共享起点与终点</text>

  <rect x="30" y="314" width="500" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="46" y="335" font-size="11" fill="#8a3a36" font-weight="bold">目标转换</text>
  <text x="46" y="355" font-size="10.5" fill="#555">答案 = 两条路径覆盖的樱桃「并集」大小：回程经过已被摘空的格子，拿不到第二颗，</text>
  <text x="46" y="369" font-size="10.5" fill="#555">所以同一格子只计一次 —— 这才是本题要优化的对象。</text>

  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#999">并集而非求和，是本题区别于「两条独立路径」的关键</text>
</svg>
