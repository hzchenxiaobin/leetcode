<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：甜蜜度 = 选中 k 颗糖果的「最小相邻差」</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- number line -->
  <path d="M 50 130 L 595 130" stroke="#7a7a7a" stroke-width="2" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)"><ellipse cx="60" cy="130" rx="8" ry="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <g filter="url(#sk)"><ellipse cx="86" cy="130" rx="5" ry="5" fill="#eeeeee" stroke="#999999" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><ellipse cx="164" cy="130" rx="5" ry="5" fill="#eeeeee" stroke="#999999" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><ellipse cx="242" cy="130" rx="5" ry="5" fill="#eeeeee" stroke="#999999" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><ellipse cx="372" cy="130" rx="8" ry="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <g filter="url(#sk)"><ellipse cx="580" cy="130" rx="8" ry="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/></g>

  <text x="60" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">1</text>
  <text x="86" y="158" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="164" y="158" text-anchor="middle" font-size="11" fill="#999">5</text>
  <text x="242" y="158" text-anchor="middle" font-size="11" fill="#999">8</text>
  <text x="372" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">13</text>
  <text x="580" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">21</text>
  <text x="60" y="108" text-anchor="middle" font-size="10.5" fill="#2e5e2e">选中 ✓</text>
  <text x="86" y="112" text-anchor="middle" font-size="9" fill="#aaa">跳过</text>
  <text x="320" y="176" text-anchor="middle" font-size="10.5" fill="#888">排序后 price = [1, 2, 5, 8, 13, 21]，k = 3，一种选法 {1, 13, 21}</text>

  <!-- far pair arc: 1 -> 21 -->
  <path d="M 60 122 Q 320 62 580 122" stroke="#8888cc" stroke-width="1.6" fill="none" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="320" y="86" text-anchor="middle" font-size="11.5" fill="#6666aa">非相邻对：21 − 1 = 12 + 8 = 20 ≥ 8</text>

  <!-- adjacent gaps -->
  <path d="M 68 138 L 364 138" stroke="#d6a040" stroke-width="2" marker-start="url(#arB)" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="216" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a">相邻差 = 12</text>
  <path d="M 380 138 L 572 138" stroke="#b85450" stroke-width="2.4" marker-start="url(#arR)" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="476" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a3a">相邻差 = 8 ← 最小！</text>

  <!-- lemma box -->
  <g filter="url(#sk)"><rect x="55" y="196" width="530" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">引理 1：任意 a&#10662; − a&#10661; = 中间各相邻差之和 ≥ 最小相邻差</text>
  <text x="320" y="242" text-anchor="middle" font-size="11.5" fill="#446688">⇒ 全盒最小差必在某对「相邻选中」取得 ⇒ 甜蜜度 = 选中序列的最小相邻差，与原顺序无关</text>

  <!-- monotonicity box -->
  <g filter="url(#sk)"><rect x="55" y="274" width="258" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="184" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a">二段性：f(d) = 能否使相邻差都 ≥ d</text>
  <text x="184" y="320" text-anchor="middle" font-size="11" fill="#a06a1a">d 越小越易满足 ⇒ 可行域是 [0, d*]</text>

  <!-- binary search box -->
  <g filter="url(#sk)"><rect x="327" y="274" width="258" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="456" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">「最大化最小值」→ 二分答案</text>
  <text x="456" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a">每次 O(n) 贪心 check，可行则向右找更大</text>
</svg>
