<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/></marker>
  </defs>
  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">把「能量」看成阶梯函数的面积：能量 = Σ 指示函数的累加</text>

  <path d="M 60 300 L 520 300" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 300 L 60 60" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="514" y="286" font-size="11" fill="#666" text-anchor="end" filter="url(#rough2)">阈值 d</text>
  <text x="68" y="58" font-size="11" fill="#666" filter="url(#rough2)">count(能量 ≥ d)</text>

  <g filter="url(#rough2)">
    <rect x="115" y="120" width="55" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="170" y="180" width="110" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="280" y="210" width="55" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="335" y="270" width="165" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="142" y="112">6</text><text x="225" y="172">4</text>
    <text x="307" y="202">3</text><text x="417" y="262">1</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="115" y="318">1</text><text x="170" y="318">2</text>
    <text x="280" y="318">4</text><text x="335" y="318">5</text><text x="500" y="318">8</text>
  </g>
  <path d="M 115 300 L 115 116" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <rect x="60" y="336" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">对整数 m：m = 有多少个 d 满足 m ≥ d ⇒ 整体求和可换序</text>
  <rect x="60" y="376" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="399" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">Σ = Σ_t (d_t − d_(t−1)) × count(d_t)，只需在差值处求值</text>
</svg>
