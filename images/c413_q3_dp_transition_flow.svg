<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="349" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="690" height="390" fill="#fdfcf7"/>

  <text x="345" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">转移：每个值恰好决策一次——跳过，或放进一个空闲行</text>

  <!-- 顶部：当前处理的值 -->
  <rect x="205" y="46" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="345" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">处理值 v（行集合 R = rowOf[v]）</text>

  <path d="M 300 86 C 260 104, 220 112, 180 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 390 86 C 430 104, 470 112, 510 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 分支一：跳过 -->
  <rect x="48" y="130" width="256" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="176" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">分支一：跳过 v</text>
  <text x="176" y="177" text-anchor="middle" font-size="11.5" fill="#333">dp[mask] 保持不变（不占行、不加分）</text>
  <text x="176" y="196" text-anchor="middle" font-size="10.5" fill="#555">值全为正，这一分支只做保底</text>

  <!-- 分支二：选 v -->
  <rect x="386" y="130" width="256" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="514" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">分支二：选 v，放入空闲行 r ∈ R∖mask</text>
  <text x="514" y="177" text-anchor="middle" font-size="11.5" fill="#333">dp[mask ∪ {r}] ← max(·, dp[mask] + v)</text>
  <text x="514" y="196" text-anchor="middle" font-size="10.5" fill="#555">占一行、加 v 分；倒序视角下写作下式 ↓</text>

  <!-- 中部：倒序原地更新 -->
  <rect x="48" y="226" width="594" height="66" rx="8" fill="#f4f7fb" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="345" y="250" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">mask 从全集降到 0（倒序），dp[mask] ← max(dp[mask], dp[mask∖{r}] + v)</text>
  <text x="345" y="272" text-anchor="middle" font-size="11" fill="#333">转移源 mask∖{r} 比目标更小、倒序时本轮尚未更新 → 读到的一定是旧值，每个 v 恰好加一次</text>

  <path d="M 345 292 L 345 308" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 底部：警告 -->
  <rect x="48" y="314" width="594" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="345" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34">⚠ 正序原地更新 = 同一个 v「选了又选」，退化成完全背包</text>
  <text x="345" y="360" text-anchor="middle" font-size="11" fill="#555">两种修法：mask 倒序（上），或每轮拷贝旧 dp 推新 dp（稍费内存、逻辑最直白）</text>
</svg>
