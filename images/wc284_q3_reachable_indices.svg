<svg xmlns="http://www.w3.org/2000/svg" width="620" height="450" viewBox="0 0 620 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#556" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="620" height="450" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">可达索引集合：[0, min(k, n−1)] 中挖掉 k−1</text>
  <path d="M 130 44 Q 310 54 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 情形一 -->
  <text x="60" y="80" text-anchor="start" font-size="14" font-weight="bold" fill="#33475e" filter="url(#sk)">情形一：2 ≤ k ≤ n−1（k 落在数组内部，示意 k=4, n=8）</text>
  <text x="328" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#sk)">k = 4</text>
  <path d="M 328 74 L 328 94" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="70" y="98" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="128" y="98" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="186" y="98" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="244" y="98" width="52" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="302" y="98" width="52" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="360" y="98" width="52" height="42" rx="4" fill="#f4f4ee" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="418" y="98" width="52" height="42" rx="4" fill="#f4f4ee" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="476" y="98" width="52" height="42" rx="4" fill="#f4f4ee" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="96" y="124">9</text><text x="154" y="124">7</text><text x="212" y="124">8</text>
    <text x="270" y="124">6</text><text x="328" y="124">3</text><text x="386" y="124">5</text>
    <text x="444" y="124">2</text><text x="502" y="124">1</text>
  </g>
  <text x="270" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <g font-size="11" fill="#777" text-anchor="middle" filter="url(#sk)">
    <text x="96" y="156">0</text><text x="154" y="156">1</text><text x="212" y="156">2</text>
    <text x="270" y="156">3</text><text x="328" y="156">4</text><text x="386" y="156">5</text>
    <text x="444" y="156">6</text><text x="502" y="156">7</text>
  </g>
  <text x="154" y="182" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">删 i+1 个再推回</text>
  <text x="154" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">（可垫删 1 个 / 两两对消）</text>
  <text x="270" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">间隙 k−1</text>
  <text x="270" y="198" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">两种方式都差一步</text>
  <text x="328" y="182" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">恰好删 k 个</text>
  <text x="328" y="198" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">nums[k] 露头</text>
  <text x="444" y="182" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">i &gt; k：删除次数不够</text>
  <text x="444" y="198" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">永远压在堆顶之下</text>

  <!-- 情形二 -->
  <text x="60" y="244" text-anchor="start" font-size="14" font-weight="bold" fill="#33475e" filter="url(#sk)">情形二：k ≥ n+1（k 已越出数组右端，没有间隙）</text>
  <g filter="url(#sk)">
    <rect x="70" y="260" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="128" y="260" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="186" y="260" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="244" y="260" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="302" y="260" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="360" y="260" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="418" y="260" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="476" y="260" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#2e6e2e" text-anchor="middle" filter="url(#sk)">
    <text x="96" y="286">9</text><text x="154" y="286">7</text><text x="212" y="286">8</text>
    <text x="270" y="286">6</text><text x="328" y="286">3</text><text x="386" y="286">5</text>
    <text x="444" y="286">2</text><text x="502" y="286">1</text>
  </g>
  <text x="310" y="326" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">删光 n 个后随便烧步数（两两对消 / 垫推 / 叠推），人人可达；k−1 已越界 → ans = max(nums)</text>

  <!-- 结论公式 -->
  <g filter="url(#sk)">
    <rect x="70" y="352" width="480" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="310" y="378" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33475e" filter="url(#sk)">ans = max( nums[0 .. min(k−2, n−1)] ∪ { nums[k]：k &lt; n } )</text>
  <text x="310" y="400" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">（k ≥ 2 的通用式；k = 0 / n = 1 / k = 1 的特判见决策流程图）</text>
</svg>
