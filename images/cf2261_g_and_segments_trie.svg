<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="700" height="470" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：固定 r 切成 AND 段，每段变成一次 Trie 前缀查询</text>

  <!-- Panel 1: segments -->
  <rect x="26" y="44" width="648" height="132" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="66" text-anchor="start" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">固定右端点 r = 8：l 从 1 到 r，AND(a[l..r]) 只有不超过 26 种取值</text>
  <g filter="url(#rough2)">
    <rect x="60" y="78" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="112" y="78" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="164" y="78" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="216" y="78" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="268" y="78" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="320" y="78" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="372" y="78" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="424" y="78" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#555">
    <text x="82" y="98" filter="url(#rough2)">l=1</text>
    <text x="134" y="98" filter="url(#rough2)">l=2</text>
    <text x="186" y="98" filter="url(#rough2)">l=3</text>
    <text x="238" y="98" filter="url(#rough2)">l=4</text>
    <text x="290" y="98" filter="url(#rough2)">l=5</text>
    <text x="342" y="98" filter="url(#rough2)">l=6</text>
    <text x="394" y="98" filter="url(#rough2)">l=7</text>
    <text x="446" y="98" filter="url(#rough2)">l=8</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="116" width="148" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="216" y="116" width="148" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="372" y="116" width="96" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <text x="134" y="133" fill="#33517a" filter="url(#rough2)">段 1：[1,3]　A = 4</text>
    <text x="290" y="133" fill="#2e6e2e" filter="url(#rough2)">段 2：[4,6]　A = 12</text>
    <text x="420" y="133" fill="#a0761e" filter="url(#rough2)">段 3：[7,8]　A = 6</text>
  </g>
  <text x="490" y="98" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">每段内部 A 不变 ⇒</text>
  <text x="490" y="118" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">查询的「模式串」v 也不变</text>
  <text x="490" y="140" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">总段数 O(25)</text>

  <!-- arrows down to queries -->
  <path d="M134,142 L134,176" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M290,142 L290,176" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M420,142 L420,176" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Panel 2: query form -->
  <rect x="26" y="182" width="336" height="128" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="204" text-anchor="start" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">一段 = 一次查询</text>
  <text x="44" y="226" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">对 A 里每个为 1 的位 j：</text>
  <text x="60" y="248" text-anchor="start" font-size="12" fill="#8a4a44" filter="url(#rough2)">数一数 p = l−1 ∈ [lo−1, hi−1]，</text>
  <text x="60" y="268" text-anchor="start" font-size="12" fill="#8a4a44" filter="url(#rough2)">使 s[p] 与 v 在「≥ j 的所有位」上相同，</text>
  <text x="60" y="288" text-anchor="start" font-size="12" fill="#8a4a44" filter="url(#rough2)">计入 2 的 j 次幂 × 这个个数。</text>
  <text x="44" y="306" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">其中 v = s[r] 异或 A（s 是前缀异或）</text>

  <!-- Panel 3: trie walk -->
  <rect x="374" y="182" width="300" height="128" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="392" y="204" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a4a44" filter="url(#rough2)">Trie：沿 v 的位往下走</text>
  <g filter="url(#rough2)">
    <rect x="392" y="216" width="56" height="26" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <rect x="470" y="216" width="56" height="26" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <rect x="548" y="216" width="56" height="26" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#8a4a44">
    <text x="420" y="233" filter="url(#rough2)">位 24</text>
    <text x="498" y="233" filter="url(#rough2)">位 j</text>
    <text x="576" y="233" filter="url(#rough2)">位 0</text>
  </g>
  <path d="M448,229 L468,229" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M526,229 L546,229" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="264" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">每层的计数 cnt = 能走到该节点的 p 的个数</text>
  <text x="392" y="284" text-anchor="start" font-size="11.5" fill="#8a4a44" filter="url(#rough2)">A 的该位为 1：把 2^j × cnt 累加进答案</text>
  <text x="392" y="302" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">走不动（子树为空）就停：更低位没有 p 能匹配</text>

  <!-- Panel 4: offline -->
  <rect x="26" y="326" width="648" height="118" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="350" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">离线：段区间用「两个前缀计数」做差分</text>
  <text x="44" y="374" text-anchor="start" font-size="12" fill="#2e6e2e" filter="url(#rough2)">段 [lo, hi] ⇒ 在位置 hi−1 挂一个 +1 事件，在位置 lo−2 挂一个 −1 事件（负数则丢弃）。</text>
  <text x="44" y="396" text-anchor="start" font-size="12" fill="#2e6e2e" filter="url(#rough2)">按 t = 0,1,…,n 扫描：先把 s[t] 插入 Trie，再回答挂在 t 上的所有事件。</text>
  <text x="44" y="418" text-anchor="start" font-size="12" fill="#33517a" filter="url(#rough2)">此时 Trie 里正好是 s[0..t]，查询结果就是「p ≤ t 的个数」，差分后即 [lo−1, hi−1]。</text>
  <text x="44" y="438" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">AND 段总数为 O(25n) 个 ⇒ 事件 O(50n) 个；每个事件一次 O(25) 的 Trie 走步。</text>
</svg>
