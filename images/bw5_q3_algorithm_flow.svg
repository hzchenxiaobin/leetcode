<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：Kruskal + 并查集</text>

  <rect x="60" y="52" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 边按 cost 升序排序</text>

  <rect x="300" y="52" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 初始化并查集 fa[i] = i</text>
  <path d="M 262 74 L 296 74" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="132" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="159" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">③ 依次扫每条边 (u, v, w)</text>
  <path d="M 400 98 C 400 116, 340 120, 320 130" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,200 364,238 280,276 196,238" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">find(u) ≠ find(v) ?</text>
  <path d="M 280 178 L 280 196" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="420" y="216" width="118" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="479" y="235" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">选入：cost += w</text>
  <text x="479" y="251" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">合并分量 used++</text>
  <path d="M 366 238 L 416 238" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="42" y="216" width="118" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="101" y="235" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">跳过（会成环）</text>
  <text x="101" y="251" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">看下一条边</text>
  <path d="M 194 238 L 164 238" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="230" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 扫完判定 -->
  <polygon points="280,304 352,336 280,368 208,336" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">used == n−1 ?</text>
  <path d="M 280 278 L 280 300" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="294" font-size="12" fill="#888" filter="url(#rough2)">边扫完</text>

  <rect x="420" y="316" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="341" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">return cost</text>
  <path d="M 354 336 L 416 336" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="60" y="316" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="125" y="341" text-anchor="middle" font-size="13" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">return −1（不连通）</text>
  <path d="M 206 336 L 194 336" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="328" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
</svg>
