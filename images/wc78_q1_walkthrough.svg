<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：四种记录各自向下分发</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888">单条记录只影响它自己及其父域名，不同记录在表里合并</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="28" y="54" width="216" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="136" y="74" text-anchor="middle" font-size="11" fill="#3a4a66">记录（rep + domain）</text>
    <rect x="252" y="54" width="228" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="366" y="74" text-anchor="middle" font-size="11" fill="#3a4a66">拆出的后缀（各 +rep）</text>
    <rect x="488" y="54" width="104" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="540" y="74" text-anchor="middle" font-size="11" fill="#3a4a66">次数</text>
  </g>

  <!-- 第 1 行 -->
  <g filter="url(#rough2)">
    <rect x="28" y="90" width="216" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="40" y="114" font-size="10.5" fill="#8a6a20">900 google.mail.com</text>
    <rect x="252" y="90" width="228" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="264" y="114" font-size="10" fill="#555">google.mail.com → mail.com → com</text>
    <rect x="488" y="90" width="104" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="540" y="114" text-anchor="middle" font-size="10.5" fill="#555">+900 ×3</text>
  </g>

  <!-- 第 2 行 -->
  <g filter="url(#rough2)">
    <rect x="28" y="134" width="216" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="40" y="158" font-size="10.5" fill="#8a6a20">50 yahoo.com</text>
    <rect x="252" y="134" width="228" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="264" y="158" font-size="10" fill="#555">yahoo.com → com</text>
    <rect x="488" y="134" width="104" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="540" y="158" text-anchor="middle" font-size="10.5" fill="#555">+50 ×2</text>
  </g>

  <!-- 第 3 行 -->
  <g filter="url(#rough2)">
    <rect x="28" y="178" width="216" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="40" y="202" font-size="10.5" fill="#8a6a20">1 intel.mail.com</text>
    <rect x="252" y="178" width="228" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="264" y="202" font-size="10" fill="#555">intel.mail.com → mail.com → com</text>
    <rect x="488" y="178" width="104" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="540" y="202" text-anchor="middle" font-size="10.5" fill="#555">+1 ×3</text>
  </g>

  <!-- 第 4 行 -->
  <g filter="url(#rough2)">
    <rect x="28" y="222" width="216" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="40" y="246" font-size="10.5" fill="#8a6a20">5 wiki.org</text>
    <rect x="252" y="222" width="228" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="264" y="246" font-size="10" fill="#555">wiki.org → org</text>
    <rect x="488" y="222" width="104" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="540" y="246" text-anchor="middle" font-size="10.5" fill="#555">+5 ×2</text>
  </g>

  <!-- 合并结果 -->
  <rect x="28" y="276" width="564" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="298" font-size="11.5" fill="#3a5a30" font-weight="bold">合并后（被多条记录共享的子域名需要相加）</text>
  <text x="44" y="320" font-size="10.5" fill="#555">mail.com = 900 + 1 = 901　；　com = 900 + 50 + 1 = 951</text>
  <text x="44" y="340" font-size="10.5" fill="#555">org = 5　；　google.mail.com = 900　；　yahoo.com = 50</text>
  <text x="44" y="360" font-size="10.5" fill="#555">intel.mail.com = 1　；　wiki.org = 5</text>
  <text x="44" y="376" font-size="10" fill="#7a9a6a">共 10 次累加 → 10 次写入、7 个不同的键 ⇒ 输出 7 行</text>

  <text x="310" y="404" text-anchor="middle" font-size="10" fill="#999">注意：com 被三条记录命中，这正是必须用 += 而不是 = 的原因</text>
</svg>
