<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">引理：等长三段必有更省的等价替换</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">→ 最优方案中每个连胜长度至多出现 2 次（可当 0/1/2 背包做）</text>

  <rect x="36" y="58" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="74" y="58" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="112" y="58" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="53" y="78" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">1</text>
  <text x="91" y="78" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">1</text>
  <text x="129" y="78" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">1</text>
  <text x="91" y="110" text-anchor="middle" font-size="10" fill="#555">3 分 · 代价 6</text>
  <path d="M 168 74 L 206 74" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="216" y="58" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="233" y="78" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">2</text>
  <text x="233" y="110" text-anchor="middle" font-size="10" fill="#555">3 分 · 代价 3</text>
  <rect x="430" y="62" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="78" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">省 3 天</text>

  <rect x="36" y="122" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="74" y="122" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="112" y="122" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="53" y="142" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">2</text>
  <text x="91" y="142" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">2</text>
  <text x="129" y="142" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">2</text>
  <text x="91" y="174" text-anchor="middle" font-size="10" fill="#555">9 分 · 代价 9</text>
  <path d="M 168 138 L 206 138" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="216" y="122" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="254" y="122" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="233" y="142" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">3</text>
  <text x="271" y="142" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">2</text>
  <text x="245" y="174" text-anchor="middle" font-size="10" fill="#555">9 分 · 代价 7</text>
  <rect x="430" y="126" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="142" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">省 2 天</text>

  <rect x="36" y="186" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="74" y="186" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="112" y="186" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="53" y="206" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">3</text>
  <text x="91" y="206" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">3</text>
  <text x="129" y="206" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">3</text>
  <text x="91" y="238" text-anchor="middle" font-size="10" fill="#555">18 分 · 代价 12</text>
  <path d="M 168 202 L 206 202" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="216" y="186" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="254" y="186" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="233" y="206" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">5</text>
  <text x="271" y="206" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">2</text>
  <text x="245" y="238" text-anchor="middle" font-size="10" fill="#555">18 分 · 代价 9</text>
  <rect x="430" y="190" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="206" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">省 3 天</text>

  <rect x="40" y="256" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">一般 c：把三段 c（合计 3T(c) 分）整体换成 3T(c) 的更优拆分</text>
  <text x="280" y="294" text-anchor="middle" font-size="10" fill="#555">如 c=5：T(9) = 45 = 3T(5)，代价 10 ≪ 18；c=100：拆 (173,12,6)，代价 194 ≪ 303</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#555">已将同一 DP 扩展到 3×10⁵，对 1 ≤ c ≤ 446 全量验证 F(3T(c)) &lt; 3(c+1)</text>

  <rect x="40" y="330" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">于是 Python 可按 0/1/2 背包做：每个长度两遍「倒序」扫描 + numpy 向量化</text>
  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#555">（向量化时右边读的是更新前数组，天然等价倒序）n = 10⁵ 全表仅 0.15 s</text>
</svg>
