<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：截断到 k 段 = 该日志所属的时间单位</text>

  <text x="320" y="62" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">完整时间戳（19 字符 / 6 段，每段定宽补零）</text>

  <!-- 完整时间戳 -->
  <rect x="163" y="72" width="64" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2017</text>
  <rect x="231" y="72" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="254" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">01</text>
  <rect x="281" y="72" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="304" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">01</text>
  <rect x="331" y="72" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="354" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">23</text>
  <rect x="381" y="72" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="404" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">59</text>
  <rect x="431" y="72" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="454" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">59</text>

  <!-- 字段名 -->
  <text x="195" y="130" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">Year</text>
  <text x="254" y="130" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">Month</text>
  <text x="304" y="130" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">Day</text>
  <text x="354" y="130" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">Hour</text>
  <text x="404" y="130" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">Min</text>
  <text x="454" y="130" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">Sec</text>

  <text x="320" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">granularity = Hour ⇒ 只保留前 4 段</text>
  <path d="M320,138 V149" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 截断后的前缀 -->
  <rect x="163" y="174" width="64" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="195" y="201" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">2017</text>
  <rect x="231" y="174" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="254" y="201" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">01</text>
  <rect x="281" y="174" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="304" y="201" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">01</text>
  <rect x="331" y="174" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="354" y="201" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">23</text>
  <rect x="381" y="174" width="46" height="42" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="404" y="201" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">59</text>
  <rect x="431" y="174" width="46" height="42" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="454" y="201" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">59</text>

  <path d="M484,195 H498" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="504" y="190" font-size="11" fill="#b85450" filter="url(#rough2)">丢弃后 2 段</text>
  <text x="504" y="206" font-size="10" fill="#999" filter="url(#rough2)">（Min / Sec）</text>

  <text x="320" y="248" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">截断结果：2017:01:01:23　（长度 13 的前缀）</text>

  <!-- 前缀长度表 -->
  <rect x="52" y="266" width="536" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">前缀长度 ℓ：Year 4　Month 7　Day 10　Hour 13　Minute 16　Second 19</text>
  <text x="320" y="310" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">公式 ℓ = 4 + 3(k − 1)：年占 4 位，其后每段 2 位数字 + 1 个冒号</text>

  <!-- 三条结论 -->
  <rect x="52" y="338" width="536" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="68" y="362" font-size="12.5" fill="#333" filter="url(#rough2)">① 定宽补零 ⇒ 19 字符等长 ⇒ 字典序 = 时间先后</text>
  <text x="68" y="388" font-size="12.5" fill="#333" filter="url(#rough2)">② 截断 πₖ 单调不减 ⇒ 同一时间单位在有序表里是连续一段</text>
  <text x="68" y="414" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">③ 区间查询 = 前缀字符串的闭区间查询（无需补全边界）</text>

  <text x="320" y="454" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">一句话：用同一把「截断尺」去量日志与查询端点，比较全部交给字典序。</text>
</svg>
