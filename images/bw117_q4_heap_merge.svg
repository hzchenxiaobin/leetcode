<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">小根堆归并：m 个「栈」逐日弹最小</text>

  <!-- 三家店的可买序列（从右往左弹） -->
  <text x="90" y="60" font-size="12" fill="#446688" filter="url(#rough2)">店 0：</text>
  <rect x="120" y="44" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="44" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="44" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="62" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">8</text>
  <text x="173" y="62" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">5</text>
  <text x="209" y="62" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">2</text>
  <path d="M 236 57 L 268 57" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="61" font-size="11" fill="#b85450" filter="url(#rough2)">只能从右往左买（栈）</text>

  <text x="90" y="96" font-size="12" fill="#4a7a3a" filter="url(#rough2)">店 1：</text>
  <rect x="120" y="80" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="80" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="80" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="98" text-anchor="middle" font-size="11" fill="#2d5a1f" filter="url(#rough2)">6</text>
  <text x="173" y="98" text-anchor="middle" font-size="11" fill="#2d5a1f" filter="url(#rough2)">4</text>
  <text x="209" y="98" text-anchor="middle" font-size="11" fill="#2d5a1f" filter="url(#rough2)">1</text>

  <text x="90" y="132" font-size="12" fill="#8a6d3b" filter="url(#rough2)">店 2：</text>
  <rect x="120" y="116" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="116" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="116" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="134" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">9</text>
  <text x="173" y="134" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">7</text>
  <text x="209" y="134" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">3</text>

  <!-- 堆 -->
  <path d="M 240 100 Q 300 120 330 160" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 128 Q 290 140 322 165" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="380" cy="200" rx="90" ry="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="192" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">小根堆（≤ m 个）</text>
  <text x="380" y="212" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">各店当前栈顶</text>
  <text x="380" y="230" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">{1, 2, 3} → 弹 1</text>

  <!-- 产出序列 -->
  <path d="M 380 246 Q 380 270 340 282" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="286" width="440" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">弹出序列 = 全局升序：1, 2, 3, 4, 5, 6, 7, 8, 9</text>

  <!-- 结果 -->
  <rect x="90" y="348" width="380" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="14" fill="#2d5a1f" filter="url(#rough2)">∑ v·d = 1²+2²+3²+…+9² = 285 ✓</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每店弹出序 = 值升序 = 下标降序（合法栈序）</text>
</svg>
