<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：四组输入走查</text>
  <path d="M 200 40 Q 320 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header row -->
  <g filter="url(#sk2)">
    <rect x="30" y="56" width="90" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="120" y="56" width="90" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="210" y="56" width="90" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="300" y="56" width="120" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="420" y="56" width="120" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="540" y="56" width="70" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="75" y="75">n</text>
    <text x="165" y="75">数字和 S</text>
    <text x="255" y="75">数字积 P</text>
    <text x="360" y="75">S + P</text>
    <text x="480" y="75">n % (S+P)</text>
    <text x="575" y="75">答案</text>
  </g>

  <!-- row 1: n=99 -->
  <g filter="url(#sk2)">
    <rect x="30" y="92" width="90" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="120" y="92" width="90" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="210" y="92" width="90" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="300" y="92" width="120" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="420" y="92" width="120" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="540" y="92" width="70" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#444" text-anchor="middle" font-family="monospace">
    <text x="75" y="113">99</text>
    <text x="165" y="113">9+9=18</text>
    <text x="255" y="113">9×9=81</text>
    <text x="360" y="113">99</text>
    <text x="480" y="113">0</text>
  </g>
  <text x="575" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">true ✓</text>

  <!-- row 2: n=23 -->
  <g filter="url(#sk2)">
    <rect x="30" y="132" width="90" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="120" y="132" width="90" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="210" y="132" width="90" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="300" y="132" width="120" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="420" y="132" width="120" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="540" y="132" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#444" text-anchor="middle" font-family="monospace">
    <text x="75" y="153">23</text>
    <text x="165" y="153">2+3=5</text>
    <text x="255" y="153">2×3=6</text>
    <text x="360" y="153">11</text>
    <text x="480" y="153">1</text>
  </g>
  <text x="575" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">false ✗</text>

  <!-- row 3: n=10, highlight 0 digit -->
  <g filter="url(#sk2)">
    <rect x="30" y="172" width="90" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="120" y="172" width="90" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="210" y="172" width="90" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="300" y="172" width="120" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="420" y="172" width="120" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="540" y="172" width="70" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#444" text-anchor="middle" font-family="monospace">
    <text x="75" y="193" fill="#7a5415" font-weight="bold">10</text>
    <text x="165" y="193">1+0=1</text>
    <text x="255" y="193" fill="#7a5415" font-weight="bold">1×0=0</text>
    <text x="360" y="193">1</text>
    <text x="480" y="193">0</text>
  </g>
  <text x="575" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">true ✓</text>

  <!-- row 4: n=1 -->
  <g filter="url(#sk2)">
    <rect x="30" y="212" width="90" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="120" y="212" width="90" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="210" y="212" width="90" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="300" y="212" width="120" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="420" y="212" width="120" height="34" rx="4" fill="#fffdf3" stroke="#c9c2a8" stroke-width="1"/>
    <rect x="540" y="212" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#444" text-anchor="middle" font-family="monospace">
    <text x="75" y="233">1</text>
    <text x="165" y="233">1</text>
    <text x="255" y="233">1</text>
    <text x="360" y="233">2</text>
    <text x="480" y="233">1</text>
  </g>
  <text x="575" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">false ✗</text>

  <!-- annotations -->
  <g filter="url(#sk2)">
    <rect x="30" y="262" width="285" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="172" y="280" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">含 0 数位：P 归零，无需特判</text>
  <text x="172" y="296" text-anchor="middle" font-size="11" fill="#7a5415">S+P = S = 1，10 % 1 = 0 → true</text>

  <g filter="url(#sk2)">
    <rect x="330" y="262" width="280" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="470" y="280" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">一位数恒 false</text>
  <text x="470" y="296" text-anchor="middle" font-size="11" fill="#8a3a36">S+P = 2n &gt; n，余数 = n ≠ 0</text>

  <g filter="url(#sk2)">
    <rect x="30" y="316" width="580" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="320" y="330" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">彩蛋观察：两位数以 9 结尾时（19, 29, …, 99）</text>
  <text x="320" y="344" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">S = d+9, P = 9d ⇒ S+P = 10d+9 = n，商恰为 1</text>
</svg>
