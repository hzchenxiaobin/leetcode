<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：3 个长度为 k = 4 的窗口</text>
  <path d="M 176 40 Q 320 47 464 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [1, 12, −5, −6, 50, 3]，n = 6，窗口数 n − k + 1 = 3</text>

  <g filter="url(#rough2)">
    <rect x="40" y="80" width="70" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="118" y="80" width="330" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="456" y="80" width="86" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="550" y="80" width="80" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#2e4f70" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="104">起点 i</text>
    <text x="283" y="104">窗口元素</text>
    <text x="499" y="104">和 Sᵢ</text>
    <text x="590" y="104">平均值</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="124" width="70" height="42" rx="6" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="118" y="124" width="330" height="42" rx="6" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="456" y="124" width="86" height="42" rx="6" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="550" y="124" width="80" height="42" rx="6" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.3"/>

    <rect x="40" y="170" width="70" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="118" y="170" width="330" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="456" y="170" width="86" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="550" y="170" width="80" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>

    <rect x="40" y="216" width="70" height="42" rx="6" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="118" y="216" width="330" height="42" rx="6" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="456" y="216" width="86" height="42" rx="6" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="550" y="216" width="80" height="42" rx="6" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.3"/>
  </g>

  <g font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="151">0</text>
    <text x="283" y="151">nums[0..3]：1，12，−5，−6</text>
    <text x="499" y="151">2</text>
    <text x="590" y="151" font-size="10.5">2/4 = 0.5</text>

    <text x="75" y="197" font-weight="bold" fill="#2e5a24">1</text>
    <text x="283" y="197" font-weight="bold" fill="#2e5a24">nums[1..4]：12，−5，−6，50</text>
    <text x="499" y="197" font-weight="bold" fill="#2e5a24">51</text>
    <text x="590" y="197" font-size="10.5" font-weight="bold" fill="#2e5a24">51/4 = 12.75</text>

    <text x="75" y="243">2</text>
    <text x="283" y="243">nums[2..5]：−5，−6，50，3</text>
    <text x="499" y="243">42</text>
    <text x="590" y="243" font-size="10.5">42/4 = 10.5</text>
  </g>


  <g filter="url(#rough2)">
    <rect x="40" y="272" width="590" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
    <rect x="40" y="352" width="590" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <text x="335" y="297" text-anchor="middle" font-size="12.5" fill="#8a6415" filter="url(#rough2)">S₁ = S₀ − nums[0] + nums[4] = 2 − 1 + 50 = 51</text>
  <text x="335" y="322" text-anchor="middle" font-size="12.5" fill="#8a6415" filter="url(#rough2)">S₂ = S₁ − nums[1] + nums[5] = 51 − 12 + 3 = 42</text>
  <text x="335" y="378" text-anchor="middle" font-size="14" fill="#8f3830" font-weight="bold" filter="url(#rough2)">maxSum = 51（绿色高亮行）→ 最大平均数 = 51 / 4 = 12.75</text>
  <text x="335" y="398" text-anchor="middle" font-size="11" fill="#8f3830" filter="url(#rough2)">全程只做整数加减与比较，最后统一除一次 k</text>
</svg>
