<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">一趟扫描流程：与「原始前驱」比签名</text>

  <rect x="195" y="44" width="110" height="30" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 250 74 L 250 86" stroke="#446688" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="155" y="90" width="190" height="34" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">预处理 sig[i] = sort(words[i])</text>

  <path d="M 250 124 L 250 136" stroke="#446688" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="250,140 312,166 250,192 188,166" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <text x="332" y="158" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 312 166 L 360 166" stroke="#446688" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="364" y="150" width="108" height="32" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>

  <text x="260" y="206" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 250 192 L 250 204" stroke="#446688" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="250,208 345,238 250,268 155,238" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="233" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &gt; 0 且</text>
  <text x="250" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sig[i] == sig[i−1] ?</text>
  <text x="354" y="230" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <path d="M 345 238 L 370 238" stroke="#446688" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="374" y="222" width="100" height="32" rx="6" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="242" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">跳过 words[i]</text>

  <text x="260" y="280" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 250 268 L 250 276" stroke="#446688" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="170" y="280" width="160" height="32" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">words[i] 加入 ans</text>

  <path d="M 424 254 C 424 296, 330 322, 254 322" stroke="#888" stroke-width="1.8"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 250 312 L 250 322 L 90 322 Q 85 322 85 306 L 85 180 Q 85 166 182 166"
        stroke="#888" stroke-width="1.8" fill="none" stroke-linecap="round"
        marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="97" y="246" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">i ← i + 1</text>

  <text x="260" y="350" text-anchor="middle" font-size="11"
        fill="#888" filter="url(#rough2)">与原始 words[i−1] 比较 ⟺ 与上一个保留元素比较（同段签名相同）</text>
</svg>
