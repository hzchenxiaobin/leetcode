<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：s = "bbcbaba" → 答案 4</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 字符串条 -->
  <text x="162" y="100" text-anchor="end" font-size="13" font-weight="bold" fill="#446688">s</text>
  <g filter="url(#sk)"><rect x="170" y="78" width="38" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="189" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">b</text>
  <g filter="url(#sk)"><rect x="214" y="78" width="38" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="233" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">b</text>
  <g filter="url(#sk)"><rect x="258" y="78" width="38" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="277" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">c</text>
  <g filter="url(#sk)"><rect x="302" y="78" width="38" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="321" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">b</text>
  <g filter="url(#sk)"><rect x="346" y="78" width="38" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="365" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="390" y="78" width="38" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="409" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">b</text>
  <g filter="url(#sk)"><rect x="434" y="78" width="38" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="453" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">a</text>
  <text x="189" y="126" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="233" y="126" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="277" y="126" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="321" y="126" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="365" y="126" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="409" y="126" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="453" y="126" text-anchor="middle" font-size="9" fill="#888">6</text>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="60" y="146" width="540" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="86" y="163" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">外层 x</text>
  <text x="137" y="163" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">first</text>
  <text x="187" y="163" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">last</text>
  <text x="271" y="163" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">中间开区间内容</text>
  <text x="371" y="163" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">不同字符集</text>
  <text x="476" y="163" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">生成回文</text>
  <text x="570" y="163" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">计数</text>

  <!-- 行 1：x = 'a' -->
  <g filter="url(#sk)"><rect x="60" y="172" width="540" height="44" fill="#f3f7fb" stroke="#999999" stroke-width="1.2"/></g>
  <text x="86" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">'a'</text>
  <text x="137" y="198" text-anchor="middle" font-size="11" fill="#444">4</text>
  <text x="187" y="198" text-anchor="middle" font-size="11" fill="#444">6</text>
  <text x="271" y="198" text-anchor="middle" font-size="11" fill="#444">s[5..5] = "b"</text>
  <text x="371" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">{ b }</text>
  <text x="476" y="198" text-anchor="middle" font-size="11" fill="#444">"aba"</text>
  <text x="570" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>

  <!-- 行 2：x = 'b' -->
  <g filter="url(#sk)"><rect x="60" y="216" width="540" height="44" fill="#f2f8f2" stroke="#999999" stroke-width="1.2"/></g>
  <text x="86" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">'b'</text>
  <text x="137" y="242" text-anchor="middle" font-size="11" fill="#444">0</text>
  <text x="187" y="242" text-anchor="middle" font-size="11" fill="#444">5</text>
  <text x="271" y="242" text-anchor="middle" font-size="11" fill="#444">s[1..4] = "bcba"</text>
  <text x="371" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">{ a, b, c }</text>
  <text x="476" y="242" text-anchor="middle" font-size="11" fill="#444">bbb · bcb · bab</text>
  <text x="570" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">3</text>

  <!-- 行 3：x = 'c' -->
  <g filter="url(#sk)"><rect x="60" y="260" width="540" height="44" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/></g>
  <text x="86" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#888888">'c'</text>
  <text x="137" y="286" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="187" y="286" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="271" y="286" text-anchor="middle" font-size="11" fill="#888">空（只出现一次）</text>
  <text x="371" y="286" text-anchor="middle" font-size="11" fill="#888">{ }</text>
  <text x="476" y="286" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="570" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">0</text>

  <!-- 列分隔线 -->
  <path d="M 112 146 L 112 304" stroke="#999999" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 162 146 L 162 304" stroke="#999999" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 212 146 L 212 304" stroke="#999999" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 330 146 L 330 304" stroke="#999999" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 412 146 L 412 304" stroke="#999999" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 540 146 L 540 304" stroke="#999999" stroke-width="1" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="60" y="146" width="540" height="158" rx="4" fill="none" stroke="#446688" stroke-width="1.6"/></g>

  <!-- 合计 -->
  <g filter="url(#sk)">
    <rect x="170" y="318" width="300" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">合计 = 1 + 3 + 0 = 4 ✓</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="70" y="366" width="500" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="320" y="386" text-anchor="middle" font-size="11" fill="#2e6e2e">中间串 "bcba" 里 b 出现两次，集合只记一次 —— 按 (x, y) 对天然去重</text>
  <text x="320" y="406" text-anchor="middle" font-size="11" fill="#2e6e2e">窗口是开区间：端点就是两端的 x，不算中间字符</text>
</svg>
