<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="317" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [2,1,6,4]，仅删除 i = 1 时平衡</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">totalEven = 8（偶位 2+6），totalOdd = 5（奇位 1+4）</text>

  <g filter="url(#sk)">
    <rect x="40" y="74" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="80" y="74" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="144" y="74" width="62" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="206" y="74" width="62" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="268" y="74" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="340" y="74" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="412" y="74" width="74" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="486" y="74" width="74" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="560" y="74" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#2b4a66" text-anchor="middle" filter="url(#sk)">
    <text x="60" y="95">i</text>
    <text x="112" y="95" font-family="monospace">nums[i]</text>
    <text x="175" y="95" font-family="monospace">leftE</text>
    <text x="237" y="95" font-family="monospace">leftO</text>
    <text x="304" y="95" font-family="monospace">rightE</text>
    <text x="376" y="95" font-family="monospace">rightO</text>
    <text x="449" y="95">新偶和</text>
    <text x="523" y="95">新奇和</text>
    <text x="580" y="95">平衡?</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="106" width="40" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="80" y="106" width="64" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="144" y="106" width="62" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="206" y="106" width="62" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="268" y="106" width="72" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="340" y="106" width="72" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="412" y="106" width="74" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="486" y="106" width="74" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="560" y="106" width="40" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="60" y="136" font-size="13" font-weight="bold" fill="#555">0</text>
    <text x="112" y="129" font-size="13" fill="#333" font-family="monospace">2</text>
    <text x="112" y="147" font-size="9.5" fill="#446688">偶</text>
    <text x="175" y="136" font-size="13" fill="#333" font-family="monospace">0</text>
    <text x="237" y="136" font-size="13" fill="#333" font-family="monospace">0</text>
    <text x="304" y="136" font-size="10.5" fill="#7a5a10" font-family="monospace">8-0-2=6</text>
    <text x="376" y="136" font-size="10.5" fill="#7a5a10" font-family="monospace">5-0-0=5</text>
    <text x="449" y="136" font-size="10.5" fill="#333" font-family="monospace">0+5=5</text>
    <text x="523" y="136" font-size="10.5" fill="#333" font-family="monospace">0+6=6</text>
    <text x="580" y="140" font-size="13" fill="#b85450">✗</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="154" width="40" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="80" y="154" width="64" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="144" y="154" width="62" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="206" y="154" width="62" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="268" y="154" width="72" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="340" y="154" width="72" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="412" y="154" width="74" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="486" y="154" width="74" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="560" y="154" width="40" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="60" y="184" font-size="13" font-weight="bold" fill="#3a5a3a">1</text>
    <text x="112" y="177" font-size="13" fill="#3a5a3a" font-family="monospace">1</text>
    <text x="112" y="195" font-size="9.5" fill="#4a7a3a">奇</text>
    <text x="175" y="184" font-size="13" fill="#3a5a3a" font-family="monospace">2</text>
    <text x="237" y="184" font-size="13" fill="#3a5a3a" font-family="monospace">0</text>
    <text x="304" y="184" font-size="10.5" fill="#3a5a3a" font-family="monospace">8-2-0=6</text>
    <text x="376" y="184" font-size="10.5" fill="#3a5a3a" font-family="monospace">5-0-1=4</text>
    <text x="449" y="184" font-size="10.5" font-weight="bold" fill="#3a5a3a" font-family="monospace">2+4=6</text>
    <text x="523" y="184" font-size="10.5" font-weight="bold" fill="#3a5a3a" font-family="monospace">0+6=6</text>
    <text x="580" y="188" font-size="15" font-weight="bold" fill="#3a5a3a">✓</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="202" width="40" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="80" y="202" width="64" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="144" y="202" width="62" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="206" y="202" width="62" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="268" y="202" width="72" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="340" y="202" width="72" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="412" y="202" width="74" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="486" y="202" width="74" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="560" y="202" width="40" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="60" y="232" font-size="13" font-weight="bold" fill="#555">2</text>
    <text x="112" y="225" font-size="13" fill="#333" font-family="monospace">6</text>
    <text x="112" y="243" font-size="9.5" fill="#446688">偶</text>
    <text x="175" y="232" font-size="13" fill="#333" font-family="monospace">2</text>
    <text x="237" y="232" font-size="13" fill="#333" font-family="monospace">1</text>
    <text x="304" y="232" font-size="10.5" fill="#7a5a10" font-family="monospace">8-2-6=0</text>
    <text x="376" y="232" font-size="10.5" fill="#7a5a10" font-family="monospace">5-1-0=4</text>
    <text x="449" y="232" font-size="10.5" fill="#333" font-family="monospace">2+4=6</text>
    <text x="523" y="232" font-size="10.5" fill="#333" font-family="monospace">1+0=1</text>
    <text x="580" y="236" font-size="13" fill="#b85450">✗</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="250" width="40" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="80" y="250" width="64" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="144" y="250" width="62" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="206" y="250" width="62" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="268" y="250" width="72" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="340" y="250" width="72" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="412" y="250" width="74" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="486" y="250" width="74" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
    <rect x="560" y="250" width="40" height="48" fill="#fcfcfc" stroke="#a8b8c8" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="60" y="280" font-size="13" font-weight="bold" fill="#555">3</text>
    <text x="112" y="273" font-size="13" fill="#333" font-family="monospace">4</text>
    <text x="112" y="291" font-size="9.5" fill="#4a7a3a">奇</text>
    <text x="175" y="280" font-size="13" fill="#333" font-family="monospace">8</text>
    <text x="237" y="280" font-size="13" fill="#333" font-family="monospace">1</text>
    <text x="304" y="280" font-size="10.5" fill="#7a5a10" font-family="monospace">8-8-0=0</text>
    <text x="376" y="280" font-size="10.5" fill="#7a5a10" font-family="monospace">5-1-4=0</text>
    <text x="449" y="280" font-size="10.5" fill="#333" font-family="monospace">8+0=8</text>
    <text x="523" y="280" font-size="10.5" fill="#333" font-family="monospace">1+0=1</text>
    <text x="580" y="284" font-size="13" fill="#b85450">✗</text>
  </g>

  <g filter="url(#sk)">
    <rect x="100" y="314" width="440" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="320" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">ans = 1：仅删除 i = 1（值 1）后剩余 [2,6,4] 平衡</text>

  <g filter="url(#sk)">
    <rect x="40" y="372" width="560" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#sk)">E = Even（偶位）、O = Odd（奇位）：leftX / rightX 均按原数组下标的奇偶计</text>
  <text x="320" y="412" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#sk)">每行判定后才累入：i 偶 → leftE 累入 nums[i]，i 奇 → leftO 累入 nums[i]</text>
  <text x="320" y="430" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#sk)">所以第 i 行的 leftE / leftO 恰为下标 &lt; i 的原偶 / 奇位和（先判定，后累入）</text>
</svg>
