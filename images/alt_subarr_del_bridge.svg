<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8e5db8"/>
    </marker>
    <marker id="arK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="410" fill="#fdfcf7"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">删除一个元素 = 把两次相邻比较合并成一次「桥接」比较</text>
  <path d="M 270 42 Q 460 48 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组（示例 2：[3,2,1,2,3,2,1]，删除下标 3） -->
  <g font-size="17" font-weight="bold">
    <g filter="url(#sk)"><rect x="140" y="88" width="62" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" rx="5"/></g>
    <text x="171" y="116" text-anchor="middle" fill="#2b6e9e">3</text>
    <g filter="url(#sk)"><rect x="212" y="88" width="62" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="5"/></g>
    <text x="243" y="116" text-anchor="middle" fill="#2e6e2e">2</text>
    <g filter="url(#sk)"><rect x="284" y="88" width="62" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="5"/></g>
    <text x="315" y="116" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="356" y="88" width="62" height="44" fill="#f5e0e0" stroke="#b85450" stroke-width="2" rx="5"/></g>
    <text x="387" y="112" text-anchor="middle" fill="#b03a3a">2</text>
    <path d="M 360 92 L 414 128 M 414 92 L 360 128" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
    <text x="387" y="128" text-anchor="middle" font-size="8" fill="#b03a3a">删除</text>
    <g filter="url(#sk)"><rect x="428" y="88" width="62" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="5"/></g>
    <text x="459" y="116" text-anchor="middle" fill="#2e6e2e">3</text>
    <g filter="url(#sk)"><rect x="500" y="88" width="62" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="5"/></g>
    <text x="531" y="116" text-anchor="middle" fill="#2e6e2e">2</text>
    <g filter="url(#sk)"><rect x="572" y="88" width="62" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" rx="5"/></g>
    <text x="603" y="116" text-anchor="middle" fill="#2b6e9e">1</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="171" y="146" text-anchor="middle">0</text>
    <text x="243" y="146" text-anchor="middle">1</text>
    <text x="315" y="146" text-anchor="middle">2</text>
    <text x="387" y="146" text-anchor="middle">3</text>
    <text x="459" y="146" text-anchor="middle">4</text>
    <text x="531" y="146" text-anchor="middle">5</text>
    <text x="603" y="146" text-anchor="middle">6</text>
    <text x="118" y="146" text-anchor="middle">下标</text>
  </g>
  <g font-size="15" font-weight="bold">
    <text x="207" y="172" text-anchor="middle" fill="#999">&gt;</text>
    <text x="279" y="172" text-anchor="middle" fill="#2e6e2e">&gt;</text>
    <text x="351" y="172" text-anchor="middle" fill="#c98a2b">&lt;</text>
    <text x="423" y="172" text-anchor="middle" fill="#c98a2b">&lt;</text>
    <text x="495" y="172" text-anchor="middle" fill="#2e6e2e">&gt;</text>
    <text x="567" y="172" text-anchor="middle" fill="#999">&gt;</text>
  </g>
  <g font-size="8" fill="#999">
    <text x="207" y="186" text-anchor="middle">d0</text>
    <text x="279" y="186" text-anchor="middle">d1</text>
    <text x="351" y="186" text-anchor="middle">d2</text>
    <text x="423" y="186" text-anchor="middle">d3</text>
    <text x="495" y="186" text-anchor="middle">d4</text>
    <text x="567" y="186" text-anchor="middle">d5</text>
  </g>

  <!-- 桥接弧 -->
  <path d="M 315 84 Q 387 40 451 82" stroke="#8e5db8" stroke-width="2.2" fill="none" stroke-dasharray="6 4" marker-end="url(#arP)" filter="url(#sk)"/>
  <text x="387" y="80" text-anchor="middle" font-size="10" fill="#5a3a7a" font-weight="bold">桥接 t：1 与 3 直接比较（1 &lt; 3）</text>

  <!-- 右侧图例 -->
  <g filter="url(#sk)"><rect x="656" y="94" width="13" height="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="3"/></g>
  <text x="676" y="105" font-size="11" fill="#2e6e2e">选中的下标 {1, 2, 4, 5}</text>
  <g filter="url(#sk)"><rect x="656" y="118" width="13" height="13" fill="#f5e0e0" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
  <text x="676" y="129" font-size="11" fill="#b03a3a">被删除的 nums[3]</text>
  <text x="676" y="153" font-size="11" fill="#888">删除后整段仍不交替</text>
  <text x="676" y="169" font-size="11" fill="#888">但 {1,2,4,5} 交替 ✓</text>

  <!-- 符号序列视角 -->
  <text x="200" y="218" font-size="11" fill="#888">删除前</text>
  <g font-size="15" font-weight="bold">
    <g filter="url(#sk)"><rect x="200" y="228" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/></g>
    <text x="218" y="250" text-anchor="middle" fill="#666">&gt;</text>
    <g filter="url(#sk)"><rect x="242" y="228" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/></g>
    <text x="260" y="250" text-anchor="middle" fill="#666">&gt;</text>
    <g filter="url(#sk)"><rect x="284" y="228" width="36" height="32" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" rx="4"/></g>
    <text x="302" y="250" text-anchor="middle" fill="#7a5415">&lt;</text>
    <g filter="url(#sk)"><rect x="326" y="228" width="36" height="32" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" rx="4"/></g>
    <text x="344" y="250" text-anchor="middle" fill="#7a5415">&lt;</text>
    <g filter="url(#sk)"><rect x="368" y="228" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/></g>
    <text x="386" y="250" text-anchor="middle" fill="#666">&gt;</text>
    <g filter="url(#sk)"><rect x="410" y="228" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/></g>
    <text x="428" y="250" text-anchor="middle" fill="#666">&gt;</text>
  </g>
  <path d="M 288 264 L 284 270 L 366 270 L 362 264" stroke="#c98a2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="325" y="284" text-anchor="middle" font-size="10" fill="#7a5415">d2、d3 随删除消失</text>

  <path d="M 470 244 L 528 244" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arK)" filter="url(#sk)"/>
  <text x="499" y="233" text-anchor="middle" font-size="10" fill="#444">删 nums[3]</text>

  <text x="545" y="218" font-size="11" fill="#888">删除后</text>
  <g font-size="15" font-weight="bold">
    <g filter="url(#sk)"><rect x="545" y="228" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/></g>
    <text x="563" y="250" text-anchor="middle" fill="#666">&gt;</text>
    <g filter="url(#sk)"><rect x="587" y="228" width="36" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="4"/></g>
    <text x="605" y="250" text-anchor="middle" fill="#2e6e2e">&gt;</text>
    <g filter="url(#sk)"><rect x="629" y="228" width="36" height="32" fill="#f3eaf7" stroke="#8e5db8" stroke-width="2" rx="4"/></g>
    <text x="647" y="250" text-anchor="middle" fill="#5a3a7a">&lt;</text>
    <g filter="url(#sk)"><rect x="671" y="228" width="36" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="4"/></g>
    <text x="689" y="250" text-anchor="middle" fill="#2e6e2e">&gt;</text>
    <g filter="url(#sk)"><rect x="713" y="228" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/></g>
    <text x="731" y="250" text-anchor="middle" fill="#666">&gt;</text>
  </g>
  <text x="647" y="214" text-anchor="middle" font-size="9.5" fill="#5a3a7a" font-weight="bold">t（新比较）</text>
  <g filter="url(#sk)">
    <rect x="583" y="222" width="138" height="44" fill="none" stroke="#4a8e4a" stroke-width="1.8" stroke-dasharray="5 3" rx="7"/>
  </g>
  <text x="651" y="284" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">&gt; &lt; &gt; 交替 ✓ 长度 = 3 + 1 = 4</text>

  <!-- 底部说明框 -->
  <g filter="url(#sk)">
    <rect x="70" y="310" width="780" height="84" rx="9" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="92" y="336" font-size="12" font-weight="bold" fill="#2b2b2b">本质：在符号序列上求最长交替子段，但允许把一对相邻符号 (d[j−1], d[j]) 替换成新符号 t = sgn(nums[j+1] − nums[j−1])</text>
  <text x="92" y="360" font-size="11.5" fill="#444">t 是跨过被删元素的一次「全新」比较，可能与左右两侧的符号都相反，从而把两段交替子数组拼接起来</text>
  <text x="92" y="382" font-size="11.5" fill="#888">若被删元素不在所选子数组内部，删除不起作用，等价于「不删除」的情形</text>
</svg>
