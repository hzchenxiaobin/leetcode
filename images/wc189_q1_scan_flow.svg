<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="500" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次线性扫描，逐个学生判定</text>
  <text x="360" y="50" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">每个学生只做两次整数比较，短路求值让大部分学生连第二个条件都不用看</text>

  <rect x="265" y="60" width="190" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">开始：ans = 0</text>

  <path d="M 360 102 L 360 130" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,132 470,176 360,220 250,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="181" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 470 176 L 528 176" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="486" y="168" font-size="11" fill="#8f3830" filter="url(#rough2)">否</text>
  <rect x="530" y="154" width="170" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="615" y="181" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">返回 ans</text>

  <path d="M 360 220 L 360 250" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="242" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="170" y="252" width="380" height="66" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">startTime[i] ≤ queryTime</text>
  <text x="360" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">且 queryTime ≤ endTime[i] ?</text>

  <path d="M 300 318 L 300 348" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="308" y="340" font-size="11" fill="#2e5a24" filter="url(#rough2)">是</text>
  <path d="M 430 318 L 430 348" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="438" y="340" font-size="11" fill="#8f3830" filter="url(#rough2)">否</text>

  <rect x="200" y="350" width="180" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">ans += 1</text>

  <rect x="410" y="350" width="170" height="44" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="495" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3830" filter="url(#rough2)">跳过</text>

  <path d="M 290 394 L 290 416 L 360 416" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 495 394 L 495 416 L 360 416" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 360 416 L 360 438" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="270" y="440" width="180" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="466" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">i += 1</text>

  <path d="M 270 460 L 110 460 L 110 176 L 244 176" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="330" font-size="11" fill="#446688" filter="url(#rough2)">回到循环头</text>
</svg>
