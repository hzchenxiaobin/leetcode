<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="310" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">两个必须特判的角落：0 与负数</text>
  <text x="140" y="58" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0 只能与 0 配对</text>
  <rect x="40" y="72" width="70" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="98" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="120" y="72" width="70" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="98" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="212" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 偶数个</text>
  <rect x="40" y="128" width="70" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="154" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="212" y="154" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 奇数个 → false</text>
  <line x1="280" y1="50" x2="280" y2="300" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="420" y="58" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">负数按 |x| 而不是数值排序</text>
  <rect x="320" y="72" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="98" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">-2</text>
  <path d="M 444 92 L 470 92" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="472" y="72" width="70" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="507" y="98" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">-4</text>
  <text x="420" y="128" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">2×(-2) = -4，|2x| &gt; |x|</text>
  <text x="420" y="152" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">按数值升序会先处理 -4，</text>
  <text x="420" y="170" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">去找 -8 → 直接判错</text>
  <rect x="320" y="190" width="222" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="431" y="218" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">排序键取 (|v|, v)</text>
  <rect x="40" y="250" width="502" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0 的个数为奇数时，任何排列都无法两两配成 {0,0} 对</text>
</svg>
