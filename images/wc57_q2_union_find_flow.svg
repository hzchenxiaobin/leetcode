<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">并查集三步走：建集合 → 合并 → 按根分组</text>
  <text x="310" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把每个邮箱看作并查集里的一个元素，同一账户就是一次「批量合并」</text>

  <rect x="46" y="62" width="528" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="82" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 建集合</text>
  <text x="60" y="99" font-size="9.8" fill="#555" filter="url(#rough2)">对每个账户里出现的邮箱 e：parent[e] = e。邮箱总数 N 最多 9000。</text>
  <text x="60" y="113" font-size="9.8" fill="#555" filter="url(#rough2)">用哈希表把「邮箱字符串」映射到集合下标，避免字符串比较开销。</text>

  <path d="M 310 120 L 310 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="138" width="528" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="158" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 账户内合并</text>
  <text x="60" y="175" font-size="9.8" fill="#555" filter="url(#rough2)">对每个账户 accounts[i]：以 acc[1] 为锚点，对 j ≥ 2 执行 union(acc[1], acc[j])，</text>
  <text x="60" y="189" font-size="9.8" fill="#555" filter="url(#rough2)">即把第 j 个邮箱所在的集合挂到锚点集合下（路径压缩 + 按大小合并）。</text>

  <path d="M 310 196 L 310 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="214" width="528" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="234" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 按根聚合</text>
  <text x="60" y="251" font-size="9.8" fill="#555" filter="url(#rough2)">遍历所有账户的所有邮箱，r = find(e)，把 e 放进以 r 为键的哈希集合；</text>
  <text x="60" y="265" font-size="9.8" fill="#555" filter="url(#rough2)">同时记录 root → 姓名（同一分量内姓名必相同，取任意一个即可）。</text>

  <path d="M 310 272 L 310 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="290" width="528" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="310" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">④ 排序输出</text>
  <text x="60" y="327" font-size="9.8" fill="#555" filter="url(#rough2)">每个分量的邮箱按字符 ASCII 升序排序，前面拼上姓名，即为该账户的一行。</text>

  <rect x="46" y="356" width="528" height="30" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="376" font-size="9.5" fill="#666" filter="url(#rough2)">等价实现：把邮箱当图节点、同账户两两连边，再 DFS / BFS 求连通分量，复杂度同阶。</text>

  <text x="310" y="412" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">时间 O(N·α(N) + Σ k_i log k_i)　空间 O(N)，N 为邮箱总数</text>
</svg>
