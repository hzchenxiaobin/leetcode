<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">每个下标 i 的窗口：从 max(0, i−nums[i]) 到 i</text>
  <path d="M 170 42 Q 320 52 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- top array nums = [2,3,1] -->
  <text x="70" y="82" font-size="13" fill="#666">nums =</text>
  <g font-family="monospace" font-size="14" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="130" y="62" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="170" y="62" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="210" y="62" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="150" y="83">2</text><text x="190" y="83">3</text><text x="230" y="83">1</text>
    <text x="150" y="108" font-size="11" fill="#888">下标 0</text>
    <text x="190" y="108" font-size="11" fill="#888">1</text>
    <text x="230" y="108" font-size="11" fill="#888">2</text>
  </g>

  <!-- dashed guide lines along cell boundaries -->
  <path d="M 130 114 L 130 316" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 170 114 L 170 316" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 210 114 L 210 316" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 250 114 L 250 316" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>

  <!-- row i=0 -->
  <text x="12" y="148" font-size="12" fill="#555" font-family="monospace">i=0 nums[0]=2</text>
  <g filter="url(#sk)">
    <rect x="130" y="134" width="40" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="150" y="153" text-anchor="middle" font-size="12" fill="#2e5e22" font-family="monospace">2</text>
  <text x="266" y="153" font-size="11.5" fill="#777" font-family="monospace">start = max(0, 0−2) = 0</text>
  <text x="470" y="153" font-size="12" fill="#2b4a6e" font-family="monospace">和 = 2</text>

  <!-- row i=1 -->
  <text x="12" y="193" font-size="12" fill="#555" font-family="monospace">i=1 nums[1]=3</text>
  <g filter="url(#sk)">
    <rect x="130" y="179" width="80" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="170" y="198" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">2+3 = 5</text>
  <text x="266" y="198" font-size="11.5" fill="#b85450" font-family="monospace">start = max(0, 1−3) = 0 ← 钳位</text>
  <text x="470" y="198" font-size="12" fill="#2b4a6e" font-family="monospace">和 = 5</text>

  <!-- row i=2 -->
  <text x="12" y="238" font-size="12" fill="#555" font-family="monospace">i=2 nums[2]=1</text>
  <g filter="url(#sk)">
    <rect x="170" y="224" width="80" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="210" y="243" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">3+1 = 4</text>
  <text x="266" y="243" font-size="11.5" fill="#777" font-family="monospace">start = max(0, 2−1) = 1</text>
  <text x="470" y="243" font-size="12" fill="#2b4a6e" font-family="monospace">和 = 4</text>

  <!-- note about left extension -->
  <path d="M 236 64 Q 196 30 168 60" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="58" font-size="11.5" fill="#b85450">i 向左最多延伸 nums[i] 格，</text>
  <text x="300" y="74" font-size="11.5" fill="#b85450">越界则停在 0</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="170" y="290" width="300" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="313" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">每个下标一段连续区间 →</text>
  <text x="320" y="334" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" font-family="monospace">总和 = 2 + 5 + 4 = 11</text>

  <!-- footer hint -->
  <text x="320" y="386" text-anchor="middle" font-size="12" fill="#888">连续区间的和 = 前缀和的标准触发场景</text>
  <text x="320" y="406" text-anchor="middle" font-size="12" fill="#888">pre[r+1] − pre[l] 一步搞定，无需内层循环</text>
</svg>
