<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">T(i) 的 O(n) 递推：池子分类 + 一趟扫描</text>
  <path d="M 170 40 Q 320 50 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left panel: why ===== -->
  <text x="40" y="70" font-size="14" font-weight="bold" fill="#555" filter="url(#sk)">① 池子分类（为什么这样递推）</text>

  <g filter="url(#sk)">
    <rect x="40" y="84" width="270" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="175" y="104" text-anchor="middle" font-size="12" fill="#2e5e22" filter="url(#sk)">T(i)：从 i 个元素的池子里</text>
  <text x="175" y="121" text-anchor="middle" font-size="12" fill="#2e5e22" filter="url(#sk)">任选至多 m = k−1 个</text>

  <path d="M 105 132 Q 100 142 102 150" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 245 132 Q 250 142 248 150" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="154" width="128" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="104" y="174" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#sk)">不选第 i 个：</text>
  <text x="104" y="190" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#sk)">至多 m 个</text>
  <text x="104" y="206" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace" filter="url(#sk)">= T(i−1)</text>

  <g filter="url(#sk)">
    <rect x="182" y="154" width="128" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="246" y="172" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">选第 i 个：</text>
  <text x="246" y="187" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">其余至多 m−1 个</text>
  <text x="246" y="206" text-anchor="middle" font-size="11.5" fill="#7a5415" font-family="monospace" filter="url(#sk)">= T(i−1)−C(i−1,m)</text>

  <path d="M 104 216 Q 120 230 140 236" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 246 216 Q 230 230 212 236" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="240" width="270" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="175" y="262" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22" font-family="monospace" filter="url(#sk)">T(i) = 2·T(i−1) − C(i−1,m)·[i &gt; m]</text>
  <text x="175" y="282" text-anchor="middle" font-size="11.5" fill="#2e5e22" filter="url(#sk)">i ≤ m 时修正项为 0：</text>
  <text x="175" y="298" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace" filter="url(#sk)">T(i) = 2ⁱ（长度限制未生效）</text>

  <text x="40" y="334" font-size="12" fill="#8c3a34" filter="url(#sk)">C(i−1, m) 增量维护，免去每次重算：</text>
  <text x="40" y="354" font-size="12.5" fill="#8c3a34" font-family="monospace" filter="url(#sk)">C(i, m) = C(i−1, m) · i / (i−m)</text>
  <text x="40" y="382" font-size="12" fill="#888" filter="url(#sk)">除法全部走模逆元</text>
  <text x="40" y="400" font-size="12" fill="#888" font-family="monospace" filter="url(#sk)">(p = 10⁹+7 为质数)</text>

  <!-- ===== right panel: how ===== -->
  <text x="352" y="70" font-size="14" font-weight="bold" fill="#555" filter="url(#sk)">② 执行流程</text>

  <g filter="url(#sk)">
    <rect x="352" y="82" width="250" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="477" y="103" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">排序 nums，令 m = k − 1</text>

  <path d="M 477 116 L 477 130" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="352" y="134" width="250" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="477" y="153" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">线性逆元筛 inv[1..n]：</text>
  <text x="477" y="172" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-family="monospace" filter="url(#sk)">inv[i] = −⌊p/i⌋·inv[p mod i] mod p</text>

  <path d="M 477 186 L 477 200" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="352" y="204" width="250" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="477" y="223" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace" filter="url(#sk)">T[0] = 1，comb = 1（即 C(m,m)）</text>
  <text x="477" y="242" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace" filter="url(#sk)">for i = 1 … n−1：</text>

  <path d="M 477 256 L 477 268" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="477,272 555,298 477,324 399,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="477" y="303" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace" filter="url(#sk)">i &gt; m ?</text>

  <path d="M 399 298 L 372 298" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 555 298 L 582 298" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="366" y="288" text-anchor="middle" font-size="11.5" fill="#2e5e22" filter="url(#sk)">否</text>
  <text x="588" y="288" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="352" y="330" width="110" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="407" y="349" text-anchor="middle" font-size="11" fill="#2e5e22" filter="url(#sk)">即 i ≤ m：</text>
  <text x="407" y="366" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace" filter="url(#sk)">T[i] = 2·T[i−1]</text>

  <g filter="url(#sk)">
    <rect x="474" y="330" width="150" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="549" y="348" text-anchor="middle" font-size="11.5" fill="#8c3a34" font-family="monospace" filter="url(#sk)">T[i] −= comb</text>
  <text x="549" y="366" text-anchor="middle" font-size="11.5" fill="#8c3a34" font-family="monospace" filter="url(#sk)">comb ← comb·i·inv[i−m]</text>
  <text x="549" y="381" text-anchor="middle" font-size="10.5" fill="#8c3a34" filter="url(#sk)">（C(i−1,m) 推到 C(i,m)）</text>

  <path d="M 407 376 Q 440 404 470 408" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 549 388 Q 520 404 492 408" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="352" y="414" width="272" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="488" y="437" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" font-family="monospace" filter="url(#sk)">ans = Σ nums[i]·(T[i]+T[n−1−i])</text>

  <text x="175" y="436" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">排序 O(n log n) 主导，其余全部 O(n)</text>
</svg>
