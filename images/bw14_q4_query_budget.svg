<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">询问配额分析：365 &lt; 400 的由来</text>

  <!-- 左：同层活跃矩形互不交 -->
  <text x="170" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">同一深度的活跃矩形两两不交</text>
  <text x="170" y="86" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（孩子划分父亲，不交性逐层保持）</text>

  <g>
    <rect x="40" y="104" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="66" cy="121" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <rect x="98" y="104" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="124" cy="121" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <rect x="156" y="104" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="182" cy="121" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <rect x="40" y="146" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="66" cy="163" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <rect x="98" y="146" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="124" cy="163" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <rect x="156" y="146" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="182" cy="163" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <rect x="40" y="188" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="66" cy="205" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <rect x="98" y="188" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="124" cy="205" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <rect x="156" y="188" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="182" cy="205" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <rect x="40" y="230" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="66" cy="247" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <rect x="98" y="230" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="124" cy="247" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <rect x="156" y="230" width="52" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="182" cy="247" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  </g>
  <rect x="40" y="278" width="240" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="300" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">每个活跃矩形 ≥ 1 艘船（互不交）</text>
  <text x="160" y="322" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">船至多 10 艘 → 每层活跃矩形 ≤ 10</text>
  <text x="160" y="362" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">非活跃矩形不再产生任何询问</text>

  <!-- 右：逐层计数 -->
  <text x="468" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">逐层累计询问数</text>
  <rect x="330" y="84" width="280" height="230" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">每个活跃矩形最多问 4 个孩子</text>
  <text x="470" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">跨度每层减半，深度 0..9 非单格</text>
  <text x="470" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">深度 10 全为单格（不再延伸）</text>
  <text x="470" y="196" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">总数 ≤ 1 + 4×(1 + 9×10)</text>
  <text x="470" y="222" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">= 1 + 364 = 365</text>
  <text x="470" y="252" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">365 &lt; 400 ✓</text>
  <text x="470" y="282" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">实测：280 组随机/对抗数据</text>
  <text x="470" y="300" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">最大询问数 341</text>
</svg>
