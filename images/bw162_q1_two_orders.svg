  <line x1="560" y1="277" x2="560" y2="283" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="560" y="322" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">12</text>
  <line x1="600" y1="277" x2="600" y2="283" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="600" y="322" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">13</text>
