<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">核心观察一：一次操作 = 圆环上的循环移位，复合 = 位移相加 mod n</text>

  <!-- 左：圆环示意 -->
  <text x="160" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">① 操作 = 圆环上的循环移位</text>

  <ellipse cx="145" cy="180" rx="72" ry="72" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 88 118 A 72 72 0 0 1 202 118" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <circle cx="145" cy="108" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <circle cx="217" cy="180" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <circle cx="145" cy="252" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="257" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <circle cx="73" cy="180" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="73" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>

  <rect x="50" y="284" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">abcd</text>
  <path d="M 112 299 L 178 299" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="145" y="291" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">l = 2</text>
  <rect x="180" y="284" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cdab</text>
  <text x="145" y="334" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">后缀 cd 搬到开头（橙色两位）</text>

  <!-- 右：复合可加 -->
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">② 复合 = 位移相加（以 s = abcd 为例）</text>

  <rect x="345" y="72" width="54" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="91" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">abcd</text>
  <path d="M 401 86 L 448 86" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="425" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">l(1)=2</text>
  <rect x="452" y="72" width="54" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="479" y="91" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cdab</text>
  <path d="M 508 86 L 555 86" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="532" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">l(2)=1</text>
  <rect x="559" y="72" width="54" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="586" y="91" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">bcda</text>

  <text x="480" y="126" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">等效于一次操作 l = (2+1) mod 4 = 3：</text>
  <rect x="430" y="138" width="54" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="457" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">abcd</text>
  <path d="M 486 152 L 524 152" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="505" y="144" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">l=3</text>
  <rect x="528" y="138" width="54" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">bcda</text>

  <text x="480" y="202" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">L = ( l(1) + l(2) + … + l(k) ) mod n</text>
  <text x="480" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">每步 l ∈ [1, n−1]：小步大步都行，唯独不能原地不动</text>

  <!-- 结论框 -->
  <rect x="75" y="352" width="490" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="377" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">k 步后的串只由 L 决定，与操作顺序无关</text>
  <text x="320" y="401" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">方案数 = 序列 (l(1),…,l(k)) 的个数：每项 ∈ [1,n−1] 且总和 ≡ L (mod n)</text>
</svg>
