<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="55" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：dp[6] 沿 0 → 1 → 4 → 7 逐步长出来</text>
  <path d="M 130 36 Q 320 44 510 36" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic">target = 6，types = [[6,1],[3,2],[2,3]]，answer = dp[6] = 7</text>

  <!-- header -->
  <g filter="url(#sk)">
    <rect x="44" y="82" width="110" height="38" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
    <rect x="154" y="82" width="56" height="38" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
    <rect x="210" y="82" width="56" height="38" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
    <rect x="266" y="82" width="56" height="38" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
    <rect x="322" y="82" width="56" height="38" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
    <rect x="378" y="82" width="56" height="38" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
    <rect x="434" y="82" width="56" height="38" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
    <rect x="490" y="82" width="56" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#555" filter="url(#sk)">
    <text x="99" y="105">阶段 ↓ j →</text>
    <text x="182" y="105">0</text><text x="238" y="105">1</text><text x="294" y="105">2</text>
    <text x="350" y="105">3</text><text x="406" y="105">4</text><text x="462" y="105">5</text>
    <text x="518" y="105" fill="#d6a040">6 ★</text>
  </g>

  <!-- row: init -->
  <g filter="url(#sk)">
    <rect x="44" y="120" width="110" height="44" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
    <rect x="154" y="120" width="56" height="44" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="210" y="120" width="336" height="44" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="490" y="120" width="56" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#sk)">
    <text x="99" y="146" fill="#555" font-weight="bold">初始（空集）</text>
    <text x="182" y="146" fill="#4a8edb" font-weight="bold">1</text>
    <text x="518" y="146" fill="#bbb">0</text>
  </g>
  <text x="330" y="146" font-size="11" text-anchor="middle" fill="#cccccc" filter="url(#sk)">0  0  0  0  0（全部不可达）</text>

  <!-- row: (6,1) -->
  <g filter="url(#sk)">
    <rect x="44" y="164" width="110" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="154" y="164" width="392" height="44" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="490" y="164" width="56" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#4a8edb" filter="url(#sk)">
    <text x="99" y="190" font-weight="bold">题型 (6,1)</text>
    <text x="182" y="190">1</text><text x="238" y="190">1</text><text x="294" y="190">1</text>
    <text x="350" y="190">1</text><text x="406" y="190">1</text><text x="462" y="190">1</text>
    <text x="518" y="190" font-weight="bold">1</text>
  </g>

  <!-- row: (3,2) -->
  <g filter="url(#sk)">
    <rect x="44" y="208" width="110" height="44" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="154" y="208" width="392" height="44" rx="5" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="490" y="208" width="56" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#4a8e4a" filter="url(#sk)">
    <text x="99" y="234" font-weight="bold">题型 (3,2)</text>
    <text x="182" y="234">1</text><text x="238" y="234">1</text><text x="294" y="234">1</text>
    <text x="350" y="234">2</text><text x="406" y="234">3</text><text x="462" y="234">3</text>
    <text x="518" y="234" font-weight="bold">4</text>
  </g>

  <!-- row: (2,3) -->
  <g filter="url(#sk)">
    <rect x="44" y="252" width="110" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="154" y="252" width="392" height="44" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="490" y="252" width="56" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#d6a040" filter="url(#sk)">
    <text x="99" y="278" font-weight="bold">题型 (2,3)</text>
    <text x="182" y="278">1</text><text x="238" y="278">1</text><text x="294" y="278">1</text>
    <text x="350" y="278">3</text><text x="406" y="278">4</text><text x="462" y="278">4</text>
  </g>
  <text x="518" y="278" font-size="14" text-anchor="middle" font-weight="bold" fill="#b85450" filter="url(#sk)">7</text>

  <!-- annotation arrows -->
  <g filter="url(#sk)" stroke="#4a8e4a" stroke-width="1.3" fill="none">
    <path d="M 350 252 Q 380 266 486 284" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    <path d="M 294 252 Q 340 286 486 292" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    <path d="M 182 252 Q 260 300 486 300" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  </g>

  <!-- annotations -->
  <g filter="url(#sk)">
    <rect x="60" y="326" width="520" height="76" rx="9" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
  </g>
  <text x="320" y="348" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold" filter="url(#sk)">(3,2) 步：dp[6] = dp[6] + dp[4] + dp[2] + dp[0] = 1+1+1+1 = 4（做 0..3 道 2 分题）</text>
  <text x="320" y="368" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#sk)">(2,3) 步：dp[6] = dp[6] + dp[3] + dp[0] = 4+2+1 = 7（做 0..2 道 3 分题）</text>
  <text x="320" y="390" text-anchor="middle" font-size="11" fill="#7a7a7a" font-style="italic" filter="url(#sk)">读到的 dp[4]、dp[2]、dp[0]、dp[3] 全是「上一行」的旧值 —— 倒序 / 新数组都在保证这件事</text>
</svg>
