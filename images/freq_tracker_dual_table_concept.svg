<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fdfcf7"/>
  <text x="280" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">双哈希表：cnt 的「值」= freq 的「键」</text>
  <path d="M 150 42 Q 280 50 410 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 上表 cnt ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="62" width="420" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="90" y="86" font-size="14" font-weight="bold" fill="#2b4a6e">cnt：数字 → 出现频率</text>
  <g filter="url(#sk)">
    <rect x="100" y="98" width="100" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="100" y="98" width="100" height="34" rx="4" fill="none" stroke="#446688" stroke-width="1.4"/>
    <rect x="190" y="98" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="150" y="120" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="220" y="120" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">2</text>
  <g filter="url(#sk)">
    <rect x="300" y="98" width="100" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="390" y="98" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="350" y="120" text-anchor="middle" font-size="13" fill="#333">7</text>
  <text x="420" y="120" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">1</text>
  <g filter="url(#sk)">
    <rect x="100" y="140" width="100" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="190" y="140" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="150" y="162" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="220" y="162" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">3</text>
  <text x="330" y="162" font-size="11" fill="#888">cnt[5]=3：数字 5 出现 3 次</text>

  <!-- 映射箭头 -->
  <path d="M 236 184 Q 200 216 168 240" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 436 184 Q 300 230 208 244" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="330" y="212" font-size="12" fill="#4a8edb" font-weight="bold">「值」落到同值的「键」上</text>

  <!-- ===== 下表 freq ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="248" width="420" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="90" y="272" font-size="14" font-weight="bold" fill="#2e5e24">freq：频率 → 该桶里的数字个数</text>
  <!-- 频率桶条形 -->
  <g filter="url(#sk)">
    <rect x="140" y="288" width="70" height="66" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="250" y="288" width="70" height="66" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="360" y="288" width="70" height="66" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="175" y="308" text-anchor="middle" font-size="12" fill="#2e5e24" font-weight="bold">f = 1</text>
  <text x="175" y="330" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="175" y="348" text-anchor="middle" font-size="10" fill="#888">桶里 {7}</text>
  <text x="285" y="308" text-anchor="middle" font-size="12" fill="#2e5e24" font-weight="bold">f = 2</text>
  <text x="285" y="330" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="285" y="348" text-anchor="middle" font-size="10" fill="#888">桶里 {3}</text>
  <text x="395" y="308" text-anchor="middle" font-size="12" fill="#2e5e24" font-weight="bold">f = 3</text>
  <text x="395" y="330" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="395" y="348" text-anchor="middle" font-size="10" fill="#888">桶里 {5}</text>

  <!-- 查询标注 -->
  <path d="M 436 321 Q 470 321 486 318" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="440" y="60" width="0" height="0" fill="none"/>
  </g>
  <text x="470" y="290" font-size="11" fill="#b85450" font-weight="bold">hasFrequency(3)</text>
  <text x="470" y="306" font-size="11" fill="#b85450">= freq[3] &gt; 0</text>
  <text x="470" y="322" font-size="11" fill="#b85450">→ true，O(1)</text>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#2e5e24" font-weight="bold">不变量：freq[f] = 恰好出现 f 次的数字个数（f ≥ 1）</text>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#888">add / deleteOne 时「离旧桶、入新桶」，两张表始终同步</text>
</svg>
