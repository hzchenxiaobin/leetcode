      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="540" height="360" fill="#fafafa"/>
<text x="270" y="26" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 2：单调栈模拟 [3,1,2,1]</text>
