<text x="205.0" y="69" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">弹栈后栈内</text>
<rect x="290" y="48" width="120" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
