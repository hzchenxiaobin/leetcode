<text x="205.0" y="242" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">[1]</text>
<rect x="290" y="220" width="120" height="34" rx="5" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" filter="url(#rough2)"/>
