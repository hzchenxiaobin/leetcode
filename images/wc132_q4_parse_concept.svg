<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="620" height="300" fill="#fafafa"/>

  <text x="310.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">解析：破折号个数 = 深度，数字串 = 节点值</text>
  <text x="310.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">S = "1-2--3--4"：一行里同时编码了深度与值</text>
  <rect x="60.0" y="92.0" width="30.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="75.0" y="118.4" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="75.0" y="156.0" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">d=0</text>
  <rect x="104.0" y="92.0" width="44.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="126.0" y="118.4" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-2</text>
  <text x="126.0" y="156.0" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">d=1</text>
  <rect x="162.0" y="92.0" width="58.0" height="44.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="191.0" y="118.4" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">--3</text>
  <text x="191.0" y="156.0" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">d=2</text>
  <rect x="234.0" y="92.0" width="58.0" height="44.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="263.0" y="118.4" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">--4</text>
  <text x="263.0" y="156.0" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">d=2</text>
  <rect x="60.0" y="186.0" width="240.0" height="50.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180.0" y="207.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">父节点 = 之前最后一个</text>
  <text x="180.0" y="221.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">深度 d-1 的节点</text>
  <rect x="320.0" y="186.0" width="260.0" height="50.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450.0" y="207.5" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">「最后一个深度 d-1」= 当前路径上</text>
  <text x="450.0" y="221.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">深度 d-1 的祖先（栈的作用）</text>
  <text x="25.0" y="268.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">先序保证父节点一定先于子节点出现，且离开子树后不再回来。</text>
</svg>
