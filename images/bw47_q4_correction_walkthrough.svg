<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">修正演算：示例 2 查询 k=5，双指针得 7，再减「度数和虚高」的相邻点对</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="140" y="52" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="236" y="52" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="332" y="52" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="428" y="52" width="92" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="90" y="73">相邻点对</text><text x="188" y="73">deg 和 s</text><text x="284" y="73">重边 m</text><text x="380" y="73">s &gt; 5 且 s−m ≤ 5 ?</text><text x="474" y="73">修正</text>
  </g>

  <!-- 数据行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="92" width="100" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="140" y="92" width="96" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="236" y="92" width="96" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="332" y="92" width="96" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="428" y="92" width="92" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="90" y="113">(1, 5)</text><text x="188" y="113">9</text><text x="284" y="113">3</text>
    <text x="380" y="113" fill="#2f5226">9−3=6 &gt; 5，实际合法</text><text x="474" y="113" fill="#2f5226">不减</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="128" width="100" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="140" y="128" width="96" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="236" y="128" width="96" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="332" y="128" width="96" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="428" y="128" width="92" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="90" y="149">(2, 5)</text><text x="188" y="149">8</text><text x="284" y="149">2</text>
    <text x="380" y="149" fill="#2f5226">8−2=6 &gt; 5，实际合法</text><text x="474" y="149" fill="#2f5226">不减</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="164" width="100" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="140" y="164" width="96" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="236" y="164" width="96" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="332" y="164" width="96" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="428" y="164" width="92" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="90" y="185">(3, 4)</text><text x="188" y="185">4</text><text x="284" y="185">1</text>
    <text x="380" y="185" fill="#2f5226">s ≤ 5，本就没计入</text><text x="474" y="185" fill="#2f5226">不减</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="200" width="100" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="140" y="200" width="96" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="236" y="200" width="96" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="332" y="200" width="96" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="428" y="200" width="92" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="90" y="221">(1, 3)</text><text x="188" y="221">7</text><text x="284" y="221">1</text>
    <text x="380" y="221" fill="#2f5226">7−1=6 &gt; 5，实际合法</text><text x="474" y="221" fill="#2f5226">不减</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="236" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="140" y="236" width="96" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="236" y="236" width="96" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="332" y="236" width="96" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="428" y="236" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    <text x="90" y="257">(2, 3)</text><text x="188" y="257">6</text><text x="284" y="257">1</text>
    <text x="380" y="257">6 &gt; 5 但 6−1=5 不大于 5</text><text x="474" y="257">cnt −−</text>
  </g>

  <!-- 结论 -->
  <rect x="40" y="284" width="480" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="308" font-size="12" fill="#2f5226" filter="url(#rough2)">点对 (2,3)：deg[2]+deg[3] = 3+3 = 6 &gt; 5 被双指针计入；</text>
  <text x="60" y="328" font-size="12" fill="#2f5226" filter="url(#rough2)">但它俩之间有 1 条重边，实际 cnt = 6 − 1 = 5，不严格大于 5 → 多算了，减 1。</text>
  <text x="60" y="356" font-size="13" fill="#2f5226" font-weight="bold" filter="url(#rough2)">answers = 7 − 1 = 6，与官方示例一致。</text>
  <text x="60" y="376" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">只有相邻点对需要修正，总数 ≤ 边数 E，每个查询 O(n + E)。</text>
</svg>
