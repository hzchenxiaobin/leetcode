<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：特判 0 → 拼掩码 → 异或</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">O(log N) 时间，O(1) 空间</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <polygon points="290,64 400,90 290,116 180,90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290.0" y="95.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">N == 0 ?</text>
  <path d="M 400.0 90.0 L 440.0 90.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="446.0" y="94.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="446" y="72" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="501.0" y="94.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 1</text>
  <path d="M 290.0 116.0 L 290.0 140.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="298.0" y="134.0" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="140" y="140" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="163.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">mask = 0；x = N</text>
  <path d="M 290.0 178.0 L 290.0 200.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="200" width="360" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="223.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">while x &gt; 0：mask = (mask&lt;&lt;1)|1；x &gt;&gt;= 1</text>
  <path d="M 290.0 238.0 L 290.0 260.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="260" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="283.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 N ^ mask</text>
  <text x="30.0" y="322.0" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">循环次数 = N 的二进制位数 → 掩码恰好 b 个 1</text>
</svg>
