<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：四象限对称 + 有界搜索盒</text>

  <!-- 坐标轴 -->
  <line x1="280" y1="60" x2="280" y2="360" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="120" y1="260" x2="460" y2="260" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="272" y="70" font-size="11" fill="#888">y</text>
  <text x="466" y="264" font-size="11" fill="#888">x</text>

  <!-- 骑士与 8 个走法 -->
  <circle cx="280" cy="260" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">马</text>
  <g stroke="#446688" stroke-width="1.4" filter="url(#rough2)">
    <line x1="280" y1="260" x2="340" y2="220"/>
    <line x1="280" y1="260" x2="340" y2="300"/>
    <line x1="280" y1="260" x2="220" y2="220"/>
    <line x1="280" y1="260" x2="220" y2="300"/>
    <line x1="280" y1="260" x2="356" y2="256"/>
    <line x1="280" y1="260" x2="356" y2="264"/>
    <line x1="280" y1="260" x2="204" y2="256"/>
    <line x1="280" y1="260" x2="204" y2="264"/>
  </g>
  <text x="196" y="316" font-size="11" fill="#446688">8 个 (±1,±2)/(±2,±1) 走法</text>
  <text x="196" y="332" font-size="11" fill="#446688">关于两条坐标轴对称</text>

  <!-- 三个对称目标 -->
  <circle cx="380" cy="200" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="396" y="196" font-size="11.5" fill="#4a7a3a" font-weight="bold">(x, y)</text>
  <circle cx="180" cy="200" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="196" font-size="11.5" fill="#b85450" font-weight="bold">(−x, y)</text>
  <circle cx="180" cy="320" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="342" font-size="11.5" fill="#b85450" font-weight="bold">(−x, −y)</text>
  <circle cx="380" cy="320" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="342" font-size="11.5" fill="#b85450" font-weight="bold">(x, −y)</text>

  <path d="M 370 210 Q 300 250 190 210" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 370 310 Q 300 280 190 310" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="252" y="238" font-size="10.5" fill="#b85450">镜像翻转路径仍合法</text>
  <text x="248" y="302" font-size="10.5" fill="#b85450">四个象限答案相同</text>

  <!-- 搜索盒示意 -->
  <rect x="296" y="172" width="130" height="102" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="8 5" filter="url(#rough2)"/>
  <text x="298" y="166" font-size="11.5" fill="#d6a040" font-weight="bold">搜索盒 [-2, x+2] × [-2, y+2]</text>
  <text x="300" y="286" font-size="10.5" fill="#d6a040">BFS 只在这个小盒子里进行</text>

  <!-- (1,1) 借道示意 -->
  <text x="30" y="66" font-size="12" fill="#333" font-weight="bold">为什么要留 -2 的余量？</text>
  <text x="30" y="86" font-size="11" fill="#555">(1,1) 的两步路径只能是：</text>
  <text x="42" y="106" font-size="11" fill="#555">(0,0) → (2,−1) → (1,1)</text>
  <text x="42" y="124" font-size="11" fill="#555">(0,0) → (−1,2) → (1,1)</text>
  <text x="30" y="146" font-size="11" fill="#b85450" font-weight="bold">必须借道负半轴一格！</text>
  <text x="30" y="166" font-size="11" fill="#555">对称化简：x = |x|, y = |y|，</text>
  <text x="30" y="184" font-size="11" fill="#555">只需向第一象限搜索。</text>

  <rect x="30" y="212" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="90" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最坏盒子</text>
  <text x="90" y="247" text-anchor="middle" font-size="10.5" fill="#4a7a3a">155 × 155 ≈ 2.4 万格</text>

  <text x="30" y="404" font-size="11" fill="#999">bw9 Q2 · 进击的骑士</text>
</svg>
