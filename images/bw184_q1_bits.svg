<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">恰好一对连续置位：相邻位置同时为 1 的「对」只能有一处</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">n = 6 → 二进制 110：k=1 处「11」，答案 true</text>
  <rect x="170" y="100" width="60" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="200" y="132" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="200" y="168" text-anchor="middle" font-size="9.5" fill="#888">bit0</text>
  <rect x="100" y="100" width="60" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="130" y="132" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="130" y="168" text-anchor="middle" font-size="9.5" fill="#888">bit1</text>
  <rect x="30" y="100" width="60" height="50" fill="#f2f2f2" stroke="#999999" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="60" y="132" text-anchor="middle" font-size="16" fill="#666" font-weight="bold">0</text>
  <text x="60" y="168" text-anchor="middle" font-size="9.5" fill="#888">bit2</text>
  <path d="M 104 90 L 236 90" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="170" y="82" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold">一对相邻置位（bit0, bit1）</text>
  <rect x="300" y="100" width="210" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">t = n &amp; (n &gt;&gt; 1)</text>
  <text x="405" y="136" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">= 110 &amp; 011 = 010</text>
  <rect x="300" y="168" width="210" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">t ≠ 0 且 t &amp; (t−1) == 0</text>
  <text x="405" y="204" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">⇔ t 只有一个 1</text>
  <rect x="40" y="226" width="470" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="275" y="243" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">t 的第 i 位为 1 ⇔ n 的第 i 位与第 i+1 位同时为 1</text>
  <text x="275" y="257" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">即「相邻置位对」的个数 = popcount(t)</text>
  <rect x="40" y="282" width="470" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="275" y="299" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">要求恰好一对 ⇒ popcount(t) == 1</text>
  <text x="275" y="313" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">⇔ t 是 2 的幂（t &amp; (t−1) == 0）且 t ≠ 0</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">n = 0 时 t = 0，直接 false；n = 7 时 t = 011（两个 1）→ false</text>
</svg>
