<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">双端匹配：首尾不等时，比较两侧冒泡代价</text>
  <text x="280" y="54" font-size="13" fill="#666" filter="url(#rough2)" text-anchor="middle">以 "letelt" 的窗口 [0,5] 为例</text>

  <!-- 字符格 -->
  <g filter="url(#rough2)">
    <rect x="90" y="106" width="62" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="152" y="106" width="62" height="44" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="214" y="106" width="62" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="276" y="106" width="62" height="44" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="338" y="106" width="62" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="400" y="106" width="62" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="18" fill="#333" text-anchor="middle">
    <text x="121" y="134">l</text>
    <text x="183" y="134">e</text>
    <text x="245" y="134">t</text>
    <text x="307" y="134">e</text>
    <text x="369" y="134">l</text>
    <text x="431" y="134">t</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#999" text-anchor="middle">
    <text x="121" y="162">0</text><text x="183" y="162">1</text><text x="245" y="162">2</text>
    <text x="307" y="162">3</text><text x="369" y="162">4</text><text x="431" y="162">5</text>
  </g>

  <!-- 上方指针 l / 下方 r -->
  <g filter="url(#rough2)">
    <path d="M 121 84 L 121 102" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrB)"/>
    <path d="M 431 200 L 431 156" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)"/>
  </g>
  <text x="121" y="74" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">l = 0</text>
  <text x="431" y="216" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">r = 5</text>

  <!-- 伙伴位置 -->
  <g filter="url(#rough2)">
    <path d="M 369 84 L 369 102" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
    <path d="M 245 200 L 245 156" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  </g>
  <text x="369" y="74" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">p = 4：'l' 的最右出现</text>
  <text x="245" y="216" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">q = 2：'t' 的最左出现</text>

  <!-- 两条路线 -->
  <g filter="url(#rough2)">
    <rect x="52" y="242" width="216" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#2a4a22">
    <text x="68" y="268">左路：s[p] 冒泡到右端 r</text>
    <text x="68" y="292">代价 r − p = 1 次交换</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="292" y="242" width="216" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#6a3a36">
    <text x="308" y="268">右路：s[q] 冒泡到左端 l</text>
    <text x="308" y="292">代价 q − l = 2 次交换</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 369 176 C 300 220, 220 226, 172 236" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
    <path d="M 245 226 C 300 236, 320 240, 340 242" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="116" y="316" width="328" height="0" fill="none"/>
  </g>
  <text x="280" y="328" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)" text-anchor="middle">1 ≤ 2，本例走左路；两侧任选其一都通向最优解</text>
</svg>
