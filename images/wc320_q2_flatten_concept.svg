<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="880" height="460" fill="#fafafa"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：BST 中序摊平 → 有序数组上二分找邻居</text>
  <path d="M 250 40 Q 440 48 630 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- BST -->
  <text x="250" y="62" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">BST：任意节点满足 左 &lt; 根 &lt; 右（值互不相同）</text>
  <g stroke="#8a97a8" stroke-width="1.6" filter="url(#rough2)">
    <path d="M 250 105 L 165 170" fill="none"/>
    <path d="M 250 105 L 335 170" fill="none"/>
    <path d="M 165 170 L 120 240" fill="none"/>
    <path d="M 165 170 L 210 240" fill="none"/>
    <path d="M 335 170 L 295 240" fill="none"/>
    <path d="M 335 170 L 385 240" fill="none"/>
    <path d="M 385 240 L 348 305" fill="none"/>
  </g>
  <g font-size="13" font-weight="bold" font-family="monospace">
    <g filter="url(#rough2)"><circle cx="250" cy="105" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="250" y="110" text-anchor="middle" fill="#2b4a6e" filter="url(#rough2)">6</text>
    <g filter="url(#rough2)"><circle cx="165" cy="170" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="165" y="175" text-anchor="middle" fill="#2b4a6e" filter="url(#rough2)">2</text>
    <g filter="url(#rough2)"><circle cx="335" cy="170" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="335" y="175" text-anchor="middle" fill="#2b4a6e" filter="url(#rough2)">13</text>
    <g filter="url(#rough2)"><circle cx="120" cy="240" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="120" y="245" text-anchor="middle" fill="#2b4a6e" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><circle cx="210" cy="240" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="210" y="245" text-anchor="middle" fill="#2b4a6e" filter="url(#rough2)">4</text>
    <g filter="url(#rough2)"><circle cx="295" cy="240" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="295" y="245" text-anchor="middle" fill="#2b4a6e" filter="url(#rough2)">9</text>
    <g filter="url(#rough2)"><circle cx="385" cy="240" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="385" y="245" text-anchor="middle" fill="#2b4a6e" filter="url(#rough2)">15</text>
    <g filter="url(#rough2)"><circle cx="348" cy="305" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="348" y="310" text-anchor="middle" fill="#2b4a6e" filter="url(#rough2)">14</text>
  </g>
  <text x="250" y="348" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#rough2)">中序遍历：左 → 根 → 右</text>

  <!-- arrow to array -->
  <path d="M 415 166 L 508 166" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">摊平 O(n)</text>

  <!-- sorted array -->
  <g font-size="13" font-family="monospace">
    <g filter="url(#rough2)"><rect x="520" y="150" width="40" height="32" rx="4" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="540" y="171" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="564" y="150" width="40" height="32" rx="4" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="584" y="171" text-anchor="middle" fill="#333" filter="url(#rough2)">2</text>
    <g filter="url(#rough2)"><rect x="608" y="150" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
    <text x="628" y="171" text-anchor="middle" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">4</text>
    <g filter="url(#rough2)"><rect x="652" y="150" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="672" y="171" text-anchor="middle" fill="#8a5f14" font-weight="bold" filter="url(#rough2)">6</text>
    <g filter="url(#rough2)"><rect x="696" y="150" width="40" height="32" rx="4" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="716" y="171" text-anchor="middle" fill="#333" filter="url(#rough2)">9</text>
    <g filter="url(#rough2)"><rect x="740" y="150" width="40" height="32" rx="4" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="760" y="171" text-anchor="middle" fill="#333" filter="url(#rough2)">13</text>
    <g filter="url(#rough2)"><rect x="784" y="150" width="40" height="32" rx="4" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="804" y="171" text-anchor="middle" fill="#333" filter="url(#rough2)">14</text>
    <g filter="url(#rough2)"><rect x="828" y="150" width="40" height="32" rx="4" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="848" y="171" text-anchor="middle" fill="#333" filter="url(#rough2)">15</text>
  </g>
  <g font-size="10" fill="#999">
    <text x="540" y="196" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="584" y="196" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="628" y="196" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="672" y="196" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="716" y="196" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="760" y="196" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="804" y="196" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="848" y="196" text-anchor="middle" filter="url(#rough2)">7</text>
  </g>

  <!-- query marker -->
  <path d="M 654 136 L 654 194" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="654" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">q = 5</text>

  <!-- annotations -->
  <text x="520" y="226" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">● mini：树中 ≤ 5 的最大值 → a[2] = 4（floor）</text>
  <text x="520" y="248" font-size="12.5" font-weight="bold" fill="#b87a20" filter="url(#rough2)">● maxi：树中 ≥ 5 的最小值 → a[3] = 6（ceiling）</text>

  <!-- bottom insight -->
  <rect x="60" y="286" width="760" height="76" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">树形不确定性被一次性摊平：查询答案只依赖「值集合」，不依赖树形</text>
  <text x="440" y="334" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">中序 = 严格递增（无需再排序），单次查询 O(log n) 与树是否平衡无关</text>
  <text x="440" y="352" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">顺树搜索 O(h) 在链状树（h = n）上退化，摊平则彻底免疫</text>

  <!-- footer note -->
  <text x="440" y="398" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">8 个节点值摊平后：a = [1, 2, 4, 6, 9, 13, 14, 15]（本图即官方示例 1 的树）</text>
</svg>
