<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">前序 vs 后序：信息的两种流向</text>

  <!-- ===== Left panel: preorder (top-down) ===== -->
  <rect x="24" y="48" width="290" height="330" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="169" y="72" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">前序：进入节点时做事</text>
  <text x="169" y="90" text-anchor="middle" font-size="11" fill="#888">信息装在「参数」里，父传子（向下流）</text>

  <!-- tree: root 1, children 2 3, grandchildren 4 5 -->
  <g font-size="11" fill="#333">
    <circle cx="169" cy="122" r="16" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="169" y="126" text-anchor="middle">1</text>
    <circle cx="109" cy="182" r="16" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="109" y="186" text-anchor="middle">2</text>
    <circle cx="229" cy="182" r="16" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="229" y="186" text-anchor="middle">3</text>
    <circle cx="79" cy="242" r="16" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="79" y="246" text-anchor="middle">4</text>
    <circle cx="139" cy="242" r="16" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="139" y="246" text-anchor="middle">5</text>
  </g>
  <!-- downward arrows along edges -->
  <g stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M 160 134 L 116 168" marker-end="url(#arrG)" stroke="#446688"/>
    <path d="M 178 134 L 222 168" marker-end="url(#arrG)"/>
    <path d="M 100 194 L 83 226" marker-end="url(#arrG)"/>
    <path d="M 118 194 L 132 226" marker-end="url(#arrG)"/>
  </g>
  <text x="169" y="290" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">进入节点时：知道「根 → 我」的路径，</text>
  <text x="169" y="308" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">下面的子树还是黑盒 ⬛</text>
  <text x="169" y="340" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">适合：路径前缀 / 祖先最值下传</text>
  <text x="169" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">113 / 437 / 1448</text>

  <!-- ===== Right panel: postorder (bottom-up) ===== -->
  <rect x="326" y="48" width="290" height="330" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="471" y="72" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">后序：离开节点时做事</text>
  <text x="471" y="90" text-anchor="middle" font-size="11" fill="#888">信息装在「返回值」里，子传父（向上流）</text>

  <g font-size="11" fill="#333">
    <circle cx="471" cy="122" r="16" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="471" y="126" text-anchor="middle">1</text>
    <circle cx="411" cy="182" r="16" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="411" y="186" text-anchor="middle">2</text>
    <circle cx="531" cy="182" r="16" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="531" y="186" text-anchor="middle">3</text>
    <circle cx="381" cy="242" r="16" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="381" y="246" text-anchor="middle">4</text>
    <circle cx="441" cy="242" r="16" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="441" y="246" text-anchor="middle">5</text>
  </g>
  <!-- upward arrows along edges -->
  <g stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M 388 226 L 404 196" marker-end="url(#arrR)"/>
    <path d="M 434 226 L 418 196" marker-end="url(#arrR)"/>
    <path d="M 420 168 L 462 136" marker-end="url(#arrR)"/>
    <path d="M 522 168 L 480 136" marker-end="url(#arrR)"/>
  </g>
  <text x="471" y="290" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">离开节点时：每棵子树都已处理完，</text>
  <text x="471" y="308" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">手里握着它们的全部摘要 📦</text>
  <text x="471" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">适合：子树信息聚合 / 自底向上决策</text>
  <text x="471" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">104 / 543 / 337 / 236 / 814</text>

  <!-- ===== Bottom: the rule ===== -->
  <rect x="24" y="396" width="592" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="422" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">判断口诀</text>
  <text x="320" y="444" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">「需要孩子的信息才能算自己」→ 后序　　「自己的信息要给孩子用」→ 前序</text>
</svg>
