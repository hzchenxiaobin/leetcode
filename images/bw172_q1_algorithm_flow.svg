<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="290" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：倒序扫一遍，再取一次上整</text>

  <rect x="140" y="46" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">seen = ∅；p = n；i = n − 1</text>

  <path d="M260,84 L260,108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>

  <polygon points="260,112 370,152 260,192 150,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[i] ∈ seen ?</text>
  <text x="260" y="166" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i ≥ 0 时</text>

  <!-- 否 -->
  <text x="392" y="146" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="378" y="156" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="443" y="174" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">seen.add；p = i</text>
  <text x="443" y="189" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i−−，继续</text>

  <!-- 是 -->
  <text x="126" y="146" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="16" y="156" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="174" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">break</text>
  <text x="76" y="189" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">p 即边界</text>

  <path d="M260,196 L260,220" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>

  <rect x="140" y="224" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 (p + 2) / 3 = ⌈p / 3⌉</text>

  <text x="440" y="240" font-size="10" fill="#999" filter="url(#rough2)">O(n)</text>
</svg>
