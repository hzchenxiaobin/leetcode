<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="241"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：charge=[3,6,1,3,4]，run=[2,1,3,4,5]，budget=25</text>

  <!-- 表头：机器人行 -->
  <g filter="url(#rough2)" font-size="13" fill="#888" text-anchor="middle">
    <text x="120" y="54">i=0</text>
    <text x="172" y="54">i=1</text>
    <text x="224" y="54">i=2</text>
    <text x="276" y="54">i=3</text>
    <text x="328" y="54">i=4</text>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <rect x="98"  y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="202" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="254" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="306" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="120" y="82">3</text>
    <text x="172" y="82">6</text>
    <text x="224" y="82">1</text>
    <text x="276" y="82">3</text>
    <text x="328" y="82">4</text>
    <text x="70" y="82" font-size="12">charge</text>
  </g>

  <!-- 逐 r 演算 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <!-- r=0 -->
    <text x="60" y="126">r=0</text>
    <rect x="98" y="112" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="154" y="128">窗 [0,0]：3 + 1×2 = 5 ✓</text>
    <text x="400" y="128" fill="#4a7a3a" font-weight="bold">best=1</text>

    <!-- r=1 -->
    <text x="60" y="162">r=1</text>
    <rect x="98" y="148" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="206" y="164">窗 [0,1]：6 + 2×3 = 12 ✓（3 被弹）</text>
    <text x="452" y="164" fill="#4a7a3a" font-weight="bold">best=2</text>

    <!-- r=2 -->
    <text x="60" y="198">r=2</text>
    <rect x="98" y="184" width="148" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="258" y="200">窗 [0,2]：6 + 3×6 = 24 ✓</text>
    <text x="452" y="200" fill="#b85450" font-weight="bold">best=3</text>

    <!-- r=3 -->
    <text x="60" y="240">r=3</text>
    <rect x="98" y="220" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="120" y="236" fill="#b85450">[0,3]：6+4×10=46 ✗</text>
    <rect x="98" y="248" width="148" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="120" y="264" fill="#b85450">[1,3]：6+3×8=30 ✗</text>
    <rect x="98" y="276" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="120" y="292" fill="#1d3a17">[2,3]：3+2×7=17 ✓</text>
    <text x="452" y="292" fill="#4a7a3a" font-weight="bold">best=3</text>

    <!-- r=4 -->
    <text x="60" y="332">r=4</text>
    <rect x="98" y="312" width="148" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="120" y="328" fill="#b85450">[2,4]：4+3×12=40 ✗</text>
    <rect x="98" y="340" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="120" y="356" fill="#1d3a17">[3,4]：4+2×9=22 ✓</text>
    <text x="452" y="356" fill="#4a7a3a" font-weight="bold">best=3</text>
  </g>

  <!-- 收缩轨迹 -->
  <text x="60" y="390" font-size="12.5" fill="#888" filter="url(#rough2)">left 轨迹：0 → 0 → 0 → 2 → 3（单调不减，双指针合法）</text>
  <path d="M 98 404 L 400 404" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#446688" text-anchor="middle">
    <circle cx="120" cy="404" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="224" cy="404" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="328" cy="404" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="384" cy="404" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="120" y="424">l=0</text>
    <text x="224" y="424">l=0</text>
    <text x="328" y="424">l=2</text>
    <text x="384" y="424">l=3</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="70" y="436" width="420" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="455" text-anchor="middle" font-size="13.5" fill="#1d3a17" filter="url(#rough2)">最终 best = 3 ✓（窗口 [0,2]，开销 24 ≤ 25）</text>
</svg>
