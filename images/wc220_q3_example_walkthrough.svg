<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1,−1,−2,4,−7,3]，k = 2 → 答案 7</text>
  <path d="M 170 34 Q 320 44 470 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row highlight backgrounds -->
  <g filter="url(#sk)">
    <rect x="22" y="214" width="386" height="40" fill="#fff8e1"/>
    <rect x="22" y="294" width="386" height="40" fill="#e6f4ea"/>
  </g>

  <!-- table frame -->
  <g filter="url(#sk)">
    <rect x="20" y="64" width="390" height="30" fill="#e8f0fe"/>
    <rect x="20" y="64" width="390" height="270" fill="none" stroke="#446688" stroke-width="1.6"/>
    <path d="M 54 64 L 54 334 M 108 64 L 108 334 M 174 64 L 174 334 M 330 64 L 330 334 M 372 64 L 372 334" stroke="#446688" stroke-width="1.1"/>
    <path d="M 20 134 L 410 134 M 20 174 L 410 174 M 20 214 L 410 214 M 20 254 L 410 254 M 20 294 L 410 294" stroke="#446688" stroke-width="1.1"/>
  </g>

  <!-- header -->
  <g filter="url(#sk)" font-size="10.5" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <text x="37" y="83">i</text>
    <text x="81" y="83">nums[i]</text>
    <text x="141" y="83">窗口</text>
    <text x="252" y="83">队列（查询前，队头→队尾）</text>
    <text x="351" y="83">best</text>
    <text x="391" y="83">dp[i]</text>
  </g>

  <!-- table rows -->
  <g filter="url(#sk)" font-size="10.5" fill="#333" text-anchor="middle">
    <text x="37" y="118">0</text><text x="81" y="118">1</text><text x="141" y="118">—</text><text x="252" y="118" font-size="10">起点：下标 0 入队</text><text x="351" y="118">—</text><text x="391" y="118" font-weight="bold">1</text>
    <text x="37" y="158">1</text><text x="81" y="158">−1</text><text x="141" y="158">[0,0]</text><text x="252" y="158">[0:1]</text><text x="351" y="158">1</text><text x="391" y="158">0</text>
    <text x="37" y="198">2</text><text x="81" y="198">−2</text><text x="141" y="198">[0,1]</text><text x="252" y="198">[0:1, 1:0]</text><text x="351" y="198">1</text><text x="391" y="198">−1</text>
    <text x="37" y="238">3</text><text x="81" y="238">4</text><text x="141" y="238">[1,2]</text><text x="252" y="238" font-size="10">过期弹 0 → [1:0, 2:−1]</text><text x="351" y="238">0</text><text x="391" y="238" font-weight="bold">4</text>
    <text x="37" y="278">4</text><text x="81" y="278">−7</text><text x="141" y="278">[2,3]</text><text x="252" y="278" font-size="10">[3:4]（2、1 已被弹尾）</text><text x="351" y="278">4</text><text x="391" y="278">−3</text>
    <text x="37" y="318">5</text><text x="81" y="318">3</text><text x="141" y="318">[3,4]</text><text x="252" y="318" font-size="10">[3:4, 4:−3]（3 未过期）</text><text x="351" y="318">4</text><text x="391" y="318" font-weight="bold">7</text>
  </g>

  <!-- strip header -->
  <text x="505" y="58" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">dp 数组（蓝=窗口 绿圈=队头 红=本步）</text>

  <!-- mini strips -->
  <g filter="url(#sk)">
    <!-- row i=0: [1] -->
    <rect x="432" y="101" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="462" y="101" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="492" y="101" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="522" y="101" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="552" y="101" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="582" y="101" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- row i=1: window [0,0], front 0, new 1 -->
    <rect x="432" y="141" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="430" y="139" width="30" height="30" rx="4" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="462" y="141" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="492" y="141" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="522" y="141" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="552" y="141" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="582" y="141" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- row i=2: window [0,1], front 0, new 2 -->
    <rect x="432" y="181" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="430" y="179" width="30" height="30" rx="4" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="462" y="181" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="492" y="181" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="522" y="181" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="552" y="181" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="582" y="181" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- row i=3: window [1,2], front 1, new 3 -->
    <rect x="432" y="221" width="26" height="26" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="462" y="221" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="460" y="219" width="30" height="30" rx="4" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="492" y="221" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="522" y="221" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="552" y="221" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="582" y="221" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- row i=4: window [2,3], front 3, new 4 -->
    <rect x="432" y="261" width="26" height="26" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="462" y="261" width="26" height="26" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="492" y="261" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="522" y="261" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="520" y="259" width="30" height="30" rx="4" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="552" y="261" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="582" y="261" width="26" height="26" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- row i=5: window [3,4], front 3, new 5 -->
    <rect x="432" y="301" width="26" height="26" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="462" y="301" width="26" height="26" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="492" y="301" width="26" height="26" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="522" y="301" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="520" y="299" width="30" height="30" rx="4" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="552" y="301" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="582" y="301" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <!-- mini strip values -->
  <g filter="url(#sk)" font-size="11" fill="#333" text-anchor="middle">
    <text x="445" y="118" font-weight="bold">1</text>
    <text x="445" y="158">1</text><text x="475" y="158" font-weight="bold">0</text>
    <text x="445" y="198">1</text><text x="475" y="198">0</text><text x="505" y="198" font-weight="bold">−1</text>
    <text x="445" y="238" fill="#aaa">1</text><text x="475" y="238" font-weight="bold" fill="#2e5a24">0</text><text x="505" y="238">−1</text><text x="535" y="238" font-weight="bold">4</text>
    <text x="445" y="278" fill="#aaa">1</text><text x="475" y="278" fill="#aaa">0</text><text x="505" y="278">−1</text><text x="535" y="278" font-weight="bold" fill="#2e5a24">4</text><text x="565" y="278" font-weight="bold">−3</text>
    <text x="445" y="318" fill="#aaa">1</text><text x="475" y="318" fill="#aaa">0</text><text x="505" y="318" fill="#aaa">−1</text><text x="535" y="318" font-weight="bold" fill="#2e5a24">4</text><text x="565" y="318">−3</text><text x="595" y="318" font-weight="bold">7</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="344" width="560" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" text-anchor="middle">
    <text x="320" y="368" font-size="12.5" font-weight="bold" fill="#2e5a24">dp = [1, 0, −1, 4, −3, 7]，答案 = dp[5] = 7（路径 0→1→3→5，跨度 1, 2, 2 ≤ k）</text>
    <text x="320" y="390" font-size="11.5" fill="#4a7a3a">i = 3 弹尾「清场」：dp[3]=4 一次压走 2:−1 与 1:0——更小且更早，永不复用</text>
    <text x="320" y="410" font-size="11.5" fill="#4a7a3a">i = 5 过期判定：窗口 [3,4]，队头 3 满足 3 ≥ 5−2 → 未过期（误用 ≤ 会错丢 dp[3]=4）</text>
  </g>
</svg>
