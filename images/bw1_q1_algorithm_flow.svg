<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="490" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：二分找 { f(i) ≥ 0 } 的最左位置</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">命中不返回，记录 pos 后继续向左压缩，保证拿到最小下标</text>

  <g filter="url(#rough2)">
    <rect x="212" y="56" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="14"/>
  </g>
  <text x="260" y="75" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 86 L 260 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="172" y="102" width="176" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="123" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">lo = 0，hi = n − 1，pos = −1</text>

  <path d="M 260 136 L 260 146" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,148 348,178 260,208 172,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">lo ≤ hi ?</text>

  <path d="M 260 208 L 260 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="218" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="172" y="222" width="176" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="242" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">mid = lo + (hi − lo) / 2</text>

  <path d="M 260 254 L 260 264" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,266 356,296 260,326 164,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">arr[mid] − mid ≥ 0 ?</text>

  <path d="M 164 296 L 148 296" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="288" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="16" y="278" width="132" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="82" y="292" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">pos = mid</text>
  <text x="82" y="307" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">hi = mid − 1（向左压缩）</text>

  <path d="M 356 296 L 372 296" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="288" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="374" y="278" width="132" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="440" y="292" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">lo = mid + 1</text>
  <text x="440" y="307" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">（不动点只能在右侧）</text>

  <path d="M 82 278 L 82 178 L 168 178" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 278 L 440 178 L 352 178" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="234" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">回到 lo ≤ hi</text>
  <text x="440" y="234" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">回到 lo ≤ hi</text>

  <path d="M 348 178 L 486 178 L 486 408 L 372 408" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="172" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否（区间为空）</text>

  <polygon points="260,380 368,408 260,436 152,408" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="404" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">pos ≠ −1 且</text>
  <text x="260" y="419" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">arr[pos] == pos ?</text>

  <path d="M 152 408 L 138 408" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="399" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="16" y="390" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
  </g>
  <text x="76" y="412" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">返回 pos</text>

  <path d="M 260 436 L 260 450" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="448" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="200" y="452" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
  </g>
  <text x="260" y="472" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">返回 −1</text>
</svg>
