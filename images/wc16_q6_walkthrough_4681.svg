<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 4681，m 从 12 递减</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">m 大时 k 只能贴着 2，稍大就超过 n；直到 m = 5 才第一次命中</text>

  <g filter="url(#rough2)">
    <rect x="14" y="64" width="124" height="152" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="76" y="88" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">m = 12</text>
    <text x="76" y="112" text-anchor="middle" font-size="9.5" fill="#555">f(2) = 4095</text>
    <text x="76" y="128" text-anchor="middle" font-size="9.5" fill="#555">f(3) = 265720</text>
    <text x="76" y="146" text-anchor="middle" font-size="9.5" fill="#666">跨过 n，无整数解</text>
    <text x="76" y="176" text-anchor="middle" font-size="11" fill="#8a3a36">✗ 无解</text>
    <text x="76" y="198" text-anchor="middle" font-size="9" fill="#999">k 只能取 2</text>

    <rect x="150" y="64" width="124" height="152" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="212" y="88" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">m = 8</text>
    <text x="212" y="112" text-anchor="middle" font-size="9.5" fill="#555">f(3) = 3280</text>
    <text x="212" y="128" text-anchor="middle" font-size="9.5" fill="#555">f(4) = 21845</text>
    <text x="212" y="146" text-anchor="middle" font-size="9.5" fill="#666">跨过 n，无整数解</text>
    <text x="212" y="176" text-anchor="middle" font-size="11" fill="#8a3a36">✗ 无解</text>
    <text x="212" y="198" text-anchor="middle" font-size="9" fill="#999">k 只能取 3</text>

    <rect x="286" y="64" width="124" height="152" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="348" y="88" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">m = 6</text>
    <text x="348" y="112" text-anchor="middle" font-size="9.5" fill="#555">f(5) = 3906</text>
    <text x="348" y="128" text-anchor="middle" font-size="9.5" fill="#555">f(6) = 9331</text>
    <text x="348" y="146" text-anchor="middle" font-size="9.5" fill="#666">跨过 n，无整数解</text>
    <text x="348" y="176" text-anchor="middle" font-size="11" fill="#8a3a36">✗ 无解</text>
    <text x="348" y="198" text-anchor="middle" font-size="9" fill="#999">k 只能取 5</text>

    <rect x="422" y="64" width="124" height="152" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8"/>
    <text x="484" y="88" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">m = 5</text>
    <text x="484" y="112" text-anchor="middle" font-size="9.5" fill="#555">f(8) = 4681</text>
    <text x="484" y="128" text-anchor="middle" font-size="9.5" fill="#555">f(9) = 7381</text>
    <text x="484" y="146" text-anchor="middle" font-size="9.5" fill="#555">正好等于 n</text>
    <text x="484" y="176" text-anchor="middle" font-size="11" fill="#3a5a30">✓ 命中 k = 8</text>
    <text x="484" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a">立即返回 "8"</text>
  </g>

  <path d="M 546 236 L 18 236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">m 递减：可行 k 的上界变松，第一次命中就是最小 k</text>

  <rect x="55" y="272" width="450" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">4681 = 1 + 8 + 64 + 512 + 4096 = (11111)₈</text>
  <text x="280" y="316" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">m = 4 也不必再看：f(16) = 4369 &lt; n &lt; f(17) = 5220，同样无解，而 k 只会更大</text>
</svg>
