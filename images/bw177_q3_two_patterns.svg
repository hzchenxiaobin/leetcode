<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 428" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="428" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两种奇偶模板：逐位比对，错位必须 ±1 翻转奇偶</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [-2,-3,1,4]；模板 A：偶奇偶奇，模板 B：奇偶奇偶</text>
  <text x="36" y="84" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="116" y="68" width="62" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147.0" y="91.5" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">-2</text>
  <text x="147" y="124" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=0</text>
  <rect x="190" y="68" width="62" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221.0" y="91.5" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">-3</text>
  <text x="221" y="124" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=1</text>
  <rect x="264" y="68" width="62" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295.0" y="91.5" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="295" y="124" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=2</text>
  <rect x="338" y="68" width="62" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369.0" y="91.5" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="369" y="124" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="36" y="178" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">模板 A</text>
  <rect x="116" y="152" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147.0" y="175.32" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">偶</text>
  <text x="147" y="202" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="190" y="152" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221.0" y="175.32" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">奇</text>
  <text x="221" y="202" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="264" y="152" width="62" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295.0" y="175.32" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">偶</text>
  <text x="295" y="202" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="338" y="152" width="62" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369.0" y="175.32" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">奇</text>
  <text x="369" y="202" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="36" y="266" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">模板 B</text>
  <rect x="116" y="240" width="62" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147.0" y="263.32" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">奇</text>
  <text x="147" y="290" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="190" y="240" width="62" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221.0" y="263.32" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">偶</text>
  <text x="221" y="290" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="264" y="240" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295.0" y="263.32" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">奇</text>
  <text x="295" y="290" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="338" y="240" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369.0" y="263.32" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">偶</text>
  <text x="369" y="290" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="36" y="300" width="236" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="320" text-anchor="start" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">模板 A：错 2 位（i=2,3）</text>
  <text x="48" y="335" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">1 是奇数→改成 0 或 2；4 是偶数→改成 3 或 5</text>
  <rect x="288" y="300" width="236" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="320" text-anchor="start" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">模板 B：错 2 位（i=0,1）</text>
  <text x="300" y="335" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">-2→-1/-3；-3→-2/-4</text>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两边最少操作数都是 2 → answer[0] = 2，还要在两种模板里比极差</text>
  <text x="280" y="410" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">✓ = 该位奇偶已匹配（0 操作）；✗ = 必须翻一次奇偶（恰好 1 操作）</text>
</svg>
