<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">操作只删前缀：k 次操作后剩下的必然是后缀 nums[3k:]</text>
  <path d="M 150 44 Q 320 54 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- duplicate pair arcs above the array -->
  <path d="M 190 115 Q 250 78 310 115" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="250" y="76" text-anchor="middle" font-size="11.5" fill="#a67a1a" filter="url(#sk)">值 2</text>
  <path d="M 230 115 Q 290 48 350 115" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="290" y="46" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">值 3</text>
  <path d="M 350 115 Q 370 82 390 115" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- nums array -->
  <text x="78" y="141" font-size="13" fill="#666" filter="url(#sk)">nums =</text>
  <g font-family="monospace" font-size="14" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="130" y="120" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="170" y="120" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="210" y="120" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="250" y="120" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="290" y="120" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="330" y="120" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="370" y="120" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="410" y="120" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="450" y="120" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <text x="150" y="140">1</text><text x="190" y="140">2</text><text x="230" y="140">3</text>
    <text x="270" y="140">4</text><text x="310" y="140">2</text><text x="350" y="140">3</text>
    <text x="390" y="140">3</text><text x="430" y="140">5</text><text x="470" y="140">7</text>
    <text x="150" y="168" font-size="11" fill="#888">0</text>
    <text x="190" y="168" font-size="11" fill="#888">1</text>
    <text x="230" y="168" font-size="11" fill="#888">2</text>
    <text x="270" y="168" font-size="11" fill="#888">3</text>
    <text x="310" y="168" font-size="11" fill="#888">4</text>
    <text x="350" y="168" font-size="12" font-weight="bold" fill="#b85450">5</text>
    <text x="390" y="168" font-size="11" fill="#888">6</text>
    <text x="430" y="168" font-size="11" fill="#888">7</text>
    <text x="470" y="168" font-size="11" fill="#888">8</text>
  </g>
  <g filter="url(#sk)">
    <ellipse cx="350" cy="164" rx="15" ry="10" fill="none" stroke="#b85450" stroke-width="1.8"/>
  </g>

  <!-- conflict annotations -->
  <text x="190" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">冲突</text>
  <text x="230" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">冲突</text>
  <text x="350" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">i* = 5</text>

  <!-- op group labels -->
  <g filter="url(#sk)">
    <rect x="150" y="212" width="122" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="211" y="231" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#sk)">操作① 删 [0..2]</text>
  <g filter="url(#sk)">
    <rect x="290" y="212" width="122" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="351" y="231" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">操作② 删 [3..5]</text>
  <g filter="url(#sk)">
    <rect x="430" y="212" width="112" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="486" y="231" text-anchor="middle" font-size="12" fill="#2e5e22" filter="url(#sk)">保留 [6..8]</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="130" y="272" width="380" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="297" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace" filter="url(#sk)">冲突下标 {1, 2, 5}，最晚者 i* = 5</text>
  <text x="320" y="324" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" font-family="monospace" filter="url(#sk)">答案 = 5 // 3 + 1 = 2</text>

  <!-- footer -->
  <text x="320" y="378" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">只要 3k &gt; i*：每对重复中靠前的元素必被删，后缀 nums[3k:] 必然互异</text>
  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">「不足 3 个全删」「删成空数组」等情形均被 3k &gt; i* 一并涵盖，无需特判</text>
</svg>
