<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="680" height="410" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">示例 2 走查：只在词首比较，i = 5 处命中并立即返回</text>
  <text x="340" y="48" text-anchor="middle" font-size="10" fill="#888">sentence = "this problem is an easy problem"（n = 31）　searchWord = "pro"（m = 3）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="72" width="600" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="68" y="92" text-anchor="middle" font-size="9.5" fill="#2f4a60">下标 i</text>
    <text x="124" y="92" text-anchor="middle" font-size="9.5" fill="#2f4a60">字符</text>
    <text x="187" y="92" text-anchor="middle" font-size="9.5" fill="#2f4a60">是词首？</text>
    <text x="261" y="92" text-anchor="middle" font-size="9.5" fill="#2f4a60">第几个词</text>
    <text x="385" y="92" text-anchor="middle" font-size="9.5" fill="#2f4a60">窗口 s[i..i+m)</text>
    <text x="555" y="92" text-anchor="middle" font-size="9.5" fill="#2f4a60">动作</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="104" width="600" height="36" fill="none" stroke="#cfd8e3" stroke-width="1"/>
    <text x="68" y="127" text-anchor="middle" font-size="10.5" fill="#555">0</text>
    <text x="124" y="127" text-anchor="middle" font-size="10.5" fill="#555">t</text>
    <text x="187" y="127" text-anchor="middle" font-size="10.5" fill="#555">是</text>
    <text x="261" y="127" text-anchor="middle" font-size="10.5" fill="#555">1</text>
    <text x="385" y="127" text-anchor="middle" font-size="10.5" fill="#555">"thi" vs "pro" ✗</text>
    <text x="555" y="127" text-anchor="middle" font-size="10.5" fill="#555">i++</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="140" width="600" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="68" y="163" text-anchor="middle" font-size="10.5" fill="#2f6a2f" font-weight="bold">5</text>
    <text x="124" y="163" text-anchor="middle" font-size="10.5" fill="#2f6a2f" font-weight="bold">p</text>
    <text x="187" y="163" text-anchor="middle" font-size="10.5" fill="#2f6a2f" font-weight="bold">是</text>
    <text x="261" y="163" text-anchor="middle" font-size="10.5" fill="#2f6a2f" font-weight="bold">2</text>
    <text x="385" y="163" text-anchor="middle" font-size="10.5" fill="#2f6a2f" font-weight="bold">"pro" = "pro" ✓</text>
    <text x="555" y="163" text-anchor="middle" font-size="10.5" fill="#2f6a2f" font-weight="bold">返回 2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="176" width="600" height="36" fill="none" stroke="#cfd8e3" stroke-width="1"/>
    <text x="68" y="199" text-anchor="middle" font-size="10.5" fill="#555">13</text>
    <text x="124" y="199" text-anchor="middle" font-size="10.5" fill="#555">i</text>
    <text x="187" y="199" text-anchor="middle" font-size="10.5" fill="#555">是</text>
    <text x="261" y="199" text-anchor="middle" font-size="10.5" fill="#555">3</text>
    <text x="385" y="199" text-anchor="middle" font-size="10.5" fill="#555">"is " vs "pro" ✗</text>
    <text x="555" y="199" text-anchor="middle" font-size="10.5" fill="#555">i++</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="212" width="600" height="36" fill="#fafafa" stroke="#cfd8e3" stroke-width="1"/>
    <text x="68" y="235" text-anchor="middle" font-size="10.5" fill="#b0b0b0">16</text>
    <text x="124" y="235" text-anchor="middle" font-size="10.5" fill="#b0b0b0">a</text>
    <text x="187" y="235" text-anchor="middle" font-size="10.5" fill="#b0b0b0">是</text>
    <text x="261" y="235" text-anchor="middle" font-size="10.5" fill="#b0b0b0">4</text>
    <text x="385" y="235" text-anchor="middle" font-size="10.5" fill="#b0b0b0">"an " vs "pro" ✗</text>
    <text x="555" y="235" text-anchor="middle" font-size="10.5" fill="#b0b0b0">已提前返回</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="248" width="600" height="36" fill="#fafafa" stroke="#cfd8e3" stroke-width="1"/>
    <text x="68" y="271" text-anchor="middle" font-size="10.5" fill="#b0b0b0">19</text>
    <text x="124" y="271" text-anchor="middle" font-size="10.5" fill="#b0b0b0">e</text>
    <text x="187" y="271" text-anchor="middle" font-size="10.5" fill="#b0b0b0">是</text>
    <text x="261" y="271" text-anchor="middle" font-size="10.5" fill="#b0b0b0">5</text>
    <text x="385" y="271" text-anchor="middle" font-size="10.5" fill="#b0b0b0">"eas" vs "pro" ✗</text>
    <text x="555" y="271" text-anchor="middle" font-size="10.5" fill="#b0b0b0">未访问</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="284" width="600" height="36" fill="#fafafa" stroke="#cfd8e3" stroke-width="1"/>
    <text x="68" y="307" text-anchor="middle" font-size="10.5" fill="#b0b0b0">24</text>
    <text x="124" y="307" text-anchor="middle" font-size="10.5" fill="#b0b0b0">p</text>
    <text x="187" y="307" text-anchor="middle" font-size="10.5" fill="#b0b0b0">是</text>
    <text x="261" y="307" text-anchor="middle" font-size="10.5" fill="#b0b0b0">6</text>
    <text x="385" y="307" text-anchor="middle" font-size="10.5" fill="#b0b0b0">"pro" = "pro" ✓</text>
    <text x="555" y="307" text-anchor="middle" font-size="10.5" fill="#b0b0b0">未访问</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 40 72 V 320" stroke="#cfd8e3" stroke-width="1" fill="none"/>
    <path d="M 96 72 V 320" stroke="#cfd8e3" stroke-width="1" fill="none"/>
    <path d="M 152 72 V 320" stroke="#cfd8e3" stroke-width="1" fill="none"/>
    <path d="M 222 72 V 320" stroke="#cfd8e3" stroke-width="1" fill="none"/>
    <path d="M 300 72 V 320" stroke="#cfd8e3" stroke-width="1" fill="none"/>
    <path d="M 470 72 V 320" stroke="#cfd8e3" stroke-width="1" fill="none"/>
    <path d="M 640 72 V 320" stroke="#cfd8e3" stroke-width="1" fill="none"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="334" width="600" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="54" y="354" font-size="10" fill="#7a5a10">i = 1..4、6..12、14..15、17..18、20..23 都不是词首，直接跳过；31 个字符里只有 6 个词首位置进入比较。</text>
    <text x="54" y="371" font-size="9.5" fill="#8a6a20">注：第 3 行的窗口 "is " 末位是空格，与只含字母的 searchWord 天然失配，所以不必特判词尾。</text>
  </g>

  <text x="340" y="400" text-anchor="middle" font-size="9.5" fill="#999">命中即返回 ⇒ 返回的下标天然是满足条件的最小下标</text>
</svg>
