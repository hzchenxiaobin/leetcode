<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：s = "abcde"，t = "edbac"</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="60" y="52" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="140" y="52" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="240" y="52" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="340" y="52" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="440" y="52" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)">
    <text x="100" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">字符 c</text>
    <text x="190" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">pos_s(c)</text>
    <text x="290" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">pos_t(c)</text>
    <text x="390" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">|差值|</text>
    <text x="475" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">累计</text>
  </g>

  <!-- table rows -->
  <g filter="url(#rough2)">
    <rect x="60" y="82" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="140" y="82" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="240" y="82" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="340" y="82" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="440" y="82" width="70" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>

    <rect x="60" y="112" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="140" y="112" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="240" y="112" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="340" y="112" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="440" y="112" width="70" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>

    <rect x="60" y="142" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="140" y="142" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="240" y="142" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="340" y="142" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="440" y="142" width="70" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>

    <rect x="60" y="172" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="140" y="172" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="240" y="172" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="340" y="172" width="100" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="440" y="172" width="70" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>

    <rect x="60" y="202" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="140" y="202" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="240" y="202" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="340" y="202" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="440" y="202" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>

  <!-- row contents -->
  <g filter="url(#rough2)">
    <text x="100" y="102" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="190" y="102" text-anchor="middle" font-size="13" fill="#333">0</text>
    <text x="290" y="102" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="390" y="102" text-anchor="middle" font-size="13" fill="#333">|0−3| = 3</text>
    <text x="475" y="102" text-anchor="middle" font-size="13" fill="#d6a040">3</text>

    <text x="100" y="132" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="190" y="132" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="290" y="132" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="390" y="132" text-anchor="middle" font-size="13" fill="#333">|1−2| = 1</text>
    <text x="475" y="132" text-anchor="middle" font-size="13" fill="#d6a040">4</text>

    <text x="100" y="162" text-anchor="middle" font-size="13" fill="#333">c</text>
    <text x="190" y="162" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="290" y="162" text-anchor="middle" font-size="13" fill="#333">4</text>
    <text x="390" y="162" text-anchor="middle" font-size="13" fill="#333">|2−4| = 2</text>
    <text x="475" y="162" text-anchor="middle" font-size="13" fill="#d6a040">6</text>

    <text x="100" y="192" text-anchor="middle" font-size="13" fill="#333">d</text>
    <text x="190" y="192" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="290" y="192" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="390" y="192" text-anchor="middle" font-size="13" fill="#333">|3−1| = 2</text>
    <text x="475" y="192" text-anchor="middle" font-size="13" fill="#d6a040">8</text>

    <text x="100" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">e</text>
    <text x="190" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">4</text>
    <text x="290" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">0</text>
    <text x="390" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">|4−0| = 4</text>
    <text x="475" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">12</text>
  </g>

  <!-- result box -->
  <g filter="url(#rough2)">
    <rect x="60" y="260" width="450" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="285" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">排列差 = 3 + 1 + 2 + 2 + 4 = 12 ✓</text>
  <text x="285" y="307" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两趟遍历：先扫 t 建 pos 表，再扫 s 累加绝对差</text>

  <!-- edge notes -->
  <g filter="url(#rough2)">
    <rect x="60" y="338" width="215" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <rect x="295" y="338" width="215" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="167" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">边界：n = 1 或 s = t</text>
  <text x="167" y="376" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">答案为 0（每个差值都是 0）</text>
  <text x="402" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">上界：t 为 s 反转时</text>
  <text x="402" y="376" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">答案最大 182（n = 26），无溢出</text>
</svg>
