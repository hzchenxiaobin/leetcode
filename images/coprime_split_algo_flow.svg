<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="620" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：分解 → 聚合 → 一次扫描</text>

  <!-- loop-back dashed arrow (painted first) -->
  <g filter="url(#sk)" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,5" fill="none">
    <path d="M 210 546 L 120 546 L 120 335 L 164 335" marker-end="url(#ar)"/>
  </g>
  <text x="126" y="448" font-size="11" fill="#8a8a8a" filter="url(#sk)">i ← i + 1</text>
  <text x="228" y="538" font-size="12" fill="#8a8a8a" filter="url(#sk)">否</text>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="200" y="48" width="240" height="40" rx="16" fill="#f5f5f5" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="320" y="73" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">输入 nums（n ≤ 10⁴，nums[i] ≤ 10⁶）</text>
  <path d="M 320 88 L 320 102" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box 1 -->
  <g filter="url(#sk)">
    <rect x="170" y="106" width="300" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5e94" filter="url(#sk)">① SPF 筛：求 [2, maxV] 的最小质因子</text>
  <text x="320" y="146" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#sk)">O(M log log M) 预处理，单元素分解 O(ω)</text>
  <path d="M 320 156 L 320 170" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box 2 -->
  <g filter="url(#sk)">
    <rect x="170" y="174" width="300" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5e94" filter="url(#sk)">② 分解每个 nums[j]：记录 first[p] / last[p]</text>
  <text x="320" y="214" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#sk)">首次出现写 first；j 递增，覆盖写即最末</text>
  <path d="M 320 224 L 320 238" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box 3 -->
  <g filter="url(#sk)">
    <rect x="170" y="242" width="300" height="50" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2f" filter="url(#sk)">③ 按起点聚合 startMax</text>
  <text x="320" y="282" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#sk)">startMax[j] = max{ last[p] : first[p] = j }</text>
  <path d="M 320 292 L 320 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box 4 -->
  <g filter="url(#sk)">
    <rect x="170" y="310" width="300" height="50" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="331" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2f" filter="url(#sk)">④ 从左扫描：维护 reach</text>
  <text x="320" y="350" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#sk)">i = 0 … n−2，reach = max(reach, startMax[i])</text>
  <path d="M 320 360 L 320 378" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="320,384 430,430 320,476 210,430" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="427" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">i &gt; n−2 ？</text>
  <text x="320" y="445" text-anchor="middle" font-size="10.5" fill="#8a6a1a" filter="url(#sk)">候选已扫完</text>
  <text x="184" y="422" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">是</text>
  <path d="M 210 430 L 154 430" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="30" y="408" width="120" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="90" y="435" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">返回 −1</text>

  <text x="330" y="492" font-size="12" fill="#8a8a8a" filter="url(#sk)">否</text>
  <path d="M 320 476 L 320 494" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="320,500 430,546 320,592 210,546" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="543" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">reach ≤ i ？</text>
  <text x="320" y="561" text-anchor="middle" font-size="10.5" fill="#8a6a1a" filter="url(#sk)">封锁带全部收进前缀</text>
  <text x="452" y="538" text-anchor="middle" font-size="12" fill="#4a8e4a" filter="url(#sk)">是</text>
  <path d="M 430 546 L 484 546" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="490" y="522" width="120" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="550" y="542" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a6a2f" filter="url(#sk)">返回 i</text>
  <text x="550" y="560" text-anchor="middle" font-size="10.5" fill="#3a6a2f" filter="url(#sk)">最小有效分割</text>
</svg>
