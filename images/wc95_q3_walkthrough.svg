<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">示例演算：n = 4，a = 2，b = 3，lcm = 6</text>

  <rect x="24" y="46" width="612" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">轮次</text>
  <text x="130" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">lo, hi</text>
  <text x="240" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">mid</text>
  <text x="330" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">⌊m/2⌋+⌊m/3⌋−⌊m/6⌋</text>
  <text x="540" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">≥ 4 ?</text>
  <text x="610" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">动作</text>

  <rect x="24" y="74" width="612" height="28" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="93" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="130" y="93" font-size="11" fill="#444" filter="url(#rough2)">1, 8</text>
  <text x="248" y="93" font-size="11" fill="#444" filter="url(#rough2)">4</text>
  <text x="330" y="93" font-size="11" fill="#444" filter="url(#rough2)">2 + 1 − 0 = 3</text>
  <text x="546" y="93" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="604" y="93" font-size="11" fill="#444" filter="url(#rough2)">lo=5</text>

  <rect x="24" y="102" width="612" height="28" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="121" font-size="11" fill="#444" filter="url(#rough2)">2</text>
  <text x="130" y="121" font-size="11" fill="#444" filter="url(#rough2)">5, 8</text>
  <text x="248" y="121" font-size="11" fill="#444" filter="url(#rough2)">6</text>
  <text x="330" y="121" font-size="11" fill="#444" filter="url(#rough2)">3 + 2 − 1 = 4</text>
  <text x="546" y="121" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="604" y="121" font-size="11" fill="#444" filter="url(#rough2)">hi=6</text>

  <rect x="24" y="130" width="612" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="149" font-size="11" fill="#8a6410" filter="url(#rough2)">3</text>
  <text x="130" y="149" font-size="11" fill="#8a6410" filter="url(#rough2)">5, 6</text>
  <text x="248" y="149" font-size="11" fill="#8a6410" filter="url(#rough2)">5</text>
  <text x="330" y="149" font-size="11" fill="#8a6410" filter="url(#rough2)">2 + 1 − 0 = 3</text>
  <text x="546" y="149" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="604" y="149" font-size="11" fill="#8a6410" filter="url(#rough2)">lo=6</text>

  <text x="24" y="184" font-size="12" fill="#333" filter="url(#rough2)">lo = hi = 6，返回 6（对 10⁹+7 取模后仍是 6）</text>

  <!-- 神奇数序列 -->
  <text x="24" y="216" font-size="12" fill="#446688" filter="url(#rough2)">神奇数序列：2, 3, 4, 6, 8, 9, 10, 12, …　⇒ 第 4 个是 6</text>
  <g>
    <rect x="40" y="228" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="63" y="250" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">2</text>
    <rect x="94" y="228" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="117" y="250" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">3</text>
    <rect x="148" y="228" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="171" y="250" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">4</text>
    <rect x="202" y="228" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="225" y="250" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">6</text>
    <rect x="256" y="228" width="46" height="34" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="279" y="250" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">8</text>
    <rect x="310" y="228" width="46" height="34" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="333" y="250" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">9</text>
  </g>
  <text x="225" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">第 4 个</text>

  <rect x="24" y="300" width="300" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="174" y="324" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">为什么「第一个达标位置」一定是神奇数？</text>
  <text x="174" y="348" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">若 x 不是神奇数，则 count(x) = count(x−1)，</text>
  <text x="174" y="368" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">与「x 是第一个达标位置」矛盾</text>

  <rect x="340" y="300" width="296" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="488" y="324" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">规模提醒</text>
  <text x="488" y="348" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">n ≤ 1e9、a,b ≤ 4e4 ⇒ 答案可达 4e13，</text>
  <text x="488" y="368" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">必须用 64 位整数（long long / Python int）</text>
</svg>
