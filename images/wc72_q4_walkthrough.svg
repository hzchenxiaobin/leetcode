<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：arr = [1,2,3,5]，k = 3</text>

  <!-- ① 归并走查 -->
  <rect x="30" y="44" width="660" height="178" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="70" font-size="12.5" fill="#2d4a66" filter="url(#rough2)">① 多路归并：只需弹出 k-1 = 2 次</text>
  <text x="48" y="98" font-size="11.5" fill="#2d4a66" filter="url(#rough2)">初始堆：{ 1/5(0,3), 1/3(0,2), 1/2(0,1) }</text>
  <text x="48" y="124" font-size="11.5" fill="#2d4a66" filter="url(#rough2)">第 1 次：弹出 1/5(0,3)，压入 2/5(1,3) ⇒ { 1/3, 2/5, 1/2 }</text>
  <text x="48" y="150" font-size="11.5" fill="#2d4a66" filter="url(#rough2)">第 2 次：弹出 1/3(0,2)，压入 2/3(1,2) ⇒ { 2/5, 1/2, 2/3 }</text>
  <text x="48" y="176" font-size="11.5" fill="#2d4a66" filter="url(#rough2)">k-1 = 2 次已弹完，堆顶 2/5 ⇒ 返回 [2, 5]</text>
  <text x="48" y="202" font-size="11" fill="#8a3b38" filter="url(#rough2)">全序：1/5 &lt; 1/3 &lt; 2/5 &lt; 1/2 &lt; 3/5 &lt; 2/3，第 3 小正是 2/5</text>

  <!-- ② 二分走查 -->
  <rect x="30" y="236" width="660" height="216" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="262" font-size="12.5" fill="#8a6420" filter="url(#rough2)">② 值域二分：每轮 count(mid) 一次 O(n) 扫描（列出前 4 轮与收敛）</text>

  <rect x="45" y="274" width="630" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="293" font-size="11" fill="#3a5a30" filter="url(#rough2)">mid</text>
  <text x="180" y="293" font-size="11" fill="#3a5a30" filter="url(#rough2)">count(mid)</text>
  <text x="310" y="293" font-size="11" fill="#3a5a30" filter="url(#rough2)">与 k = 3 比较</text>
  <text x="440" y="293" font-size="11" fill="#3a5a30" filter="url(#rough2)">动作</text>

  <g font-size="11.5" fill="#5a4210" filter="url(#rough2)">
    <text x="64" y="322">0.5</text>
    <text x="180" y="322">4</text>
    <text x="310" y="322">≥ 3 ✓</text>
    <text x="440" y="322">hi = 0.5，候选 1/2</text>

    <text x="64" y="346">0.25</text>
    <text x="180" y="346">1</text>
    <text x="310" y="346">&lt; 3 ✗</text>
    <text x="440" y="346">lo = 0.25，不更新候选</text>

    <text x="64" y="370">0.375</text>
    <text x="180" y="370">2</text>
    <text x="310" y="370">&lt; 3 ✗</text>
    <text x="440" y="370">lo = 0.375</text>

    <text x="64" y="394">0.4375</text>
    <text x="180" y="394">3</text>
    <text x="310" y="394">≥ 3 ✓</text>
    <text x="440" y="394">hi = 0.4375，候选 2/5</text>

    <text x="64" y="418">→ 0.4</text>
    <text x="180" y="418">→ 3</text>
    <text x="310" y="418">收敛</text>
    <text x="440" y="418">候选稳定在 2/5 ⇒ 返回 [2, 5]</text>
  </g>

  <text x="48" y="440" font-size="11" fill="#8a6420" filter="url(#rough2)">两条路线答案一致；堆版全程整数比较，二分版把每轮代价压到 O(n)。</text>
</svg>
