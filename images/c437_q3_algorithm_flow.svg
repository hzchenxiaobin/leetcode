<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="590" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：吸收扩展造候选 + 区间贪心计数</text>
  <path d="M 90 40 Q 340 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="470" y="54" width="190" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="565" y="72" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">k = 0：空选择天然合法</text>
  <text x="565" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">直接 return true ✓</text>

  <text x="200" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">第一步：吸收扩展，制造候选</text>

  <rect x="60" y="94" width="280" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="117" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">① 一遍扫描 s，记录 first[c] / last[c]</text>
  <path d="M 200 132 V 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="150" width="280" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="168" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">② 对每个出现过的字母 c</text>
  <text x="200" y="186" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">l ← first[c]，r ← last[c]</text>
  <path d="M 200 196 V 212" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="214" width="280" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="237" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">③ 吸收扫描：i 从 l 走到 r</text>
  <path d="M 200 252 V 268" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="200,270 300,312 200,354 100,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="308" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">first[s[i]] &lt; l ?</text>
  <text x="200" y="324" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（x 在左侧出现过）</text>
  <path d="M 300 312 H 318" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="309" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 200 354 V 370" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="368" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="320" y="290" width="125" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">起点作废 ✗</text>
  <text x="382" y="324" text-anchor="middle" font-size="10.5" fill="#b03a3a" filter="url(#rough2)">⟲ 处理下一字母</text>

  <rect x="60" y="372" width="280" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="395" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">r ← max(r, last[s[i]])，i++</text>
  <path d="M 60 391 H 44 V 233 H 56" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 410 V 426" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="200,428 300,470 200,512 100,470" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="466" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">扫描结束，区间</text>
  <text x="200" y="482" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">= 整串 [0, n−1] ?</text>
  <path d="M 300 470 H 318" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="309" y="462" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 200 512 V 528" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="526" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="320" y="448" width="125" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="466" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">丢弃 ✗</text>
  <text x="382" y="482" text-anchor="middle" font-size="10.5" fill="#b03a3a" filter="url(#rough2)">⟲ 处理下一字母</text>

  <rect x="110" y="530" width="180" height="36" rx="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="553" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">收入候选集（≤ 26 个）</text>

  <text x="565" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第二步：区间调度贪心</text>
  <rect x="470" y="128" width="190" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="565" y="151" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">④ 按右端点升序排序</text>
  <path d="M 565 166 V 182" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="470" y="184" width="190" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="565" y="207" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">⑤ 贪心遍历：pre = −1</text>
  <path d="M 565 222 V 240" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="565,242 650,280 565,318 480,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="565" y="285" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">l &gt; pre ?</text>
  <path d="M 565 318 V 334" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="577" y="332" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 650 280 C 674 298 674 408 650 428" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="668" y="356" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <rect x="475" y="336" width="180" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="565" y="359" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">选！cnt++，pre ← r</text>
  <path d="M 565 374 V 392" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="612" y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">遍历结束</text>

  <polygon points="565,394 648,428 565,462 482,428" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="565" y="433" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">cnt ≥ k ?</text>

  <path d="M 540 458 Q 517 470 517 482" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="522" y="476" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 590 458 Q 612 470 612 482" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="598" y="476" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="475" y="484" width="85" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="517" y="505" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">true ✓</text>
  <rect x="570" y="484" width="85" height="32" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="612" y="505" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">false ✗</text>

  <path d="M 290 548 H 455 V 147 H 466" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="540" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">全部字母处理完</text>
</svg>
