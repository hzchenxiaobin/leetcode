<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fdfcf7"/>
  <text x="360" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n ＝ 34，k ＝ 6</text>
  <text x="360" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">两轮除法，商归零，sum 从 0 累到 9</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="95" y="78" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="165" y="78" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="275" y="78" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="385" y="78" width="90" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="475" y="78" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">
    <text x="130" y="101">轮次</text>
    <text x="220" y="101">除法</text>
    <text x="330" y="101">余数 n % k</text>
    <text x="430" y="101">新 n ＝ n / k</text>
    <text x="550" y="101">sum</text>
  </g>

  <!-- row 1: initial -->
  <g filter="url(#sk)">
    <rect x="95" y="114" width="70" height="46" fill="#fff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="165" y="114" width="110" height="46" fill="#fff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="275" y="114" width="110" height="46" fill="#e6f4ea" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="385" y="114" width="90" height="46" fill="#e8f0fe" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="475" y="114" width="150" height="46" fill="#fff8e1" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">
    <text x="130" y="141">初始</text>
    <text x="220" y="141">—</text>
    <text x="330" y="141">—</text>
    <text x="430" y="141" font-weight="bold" fill="#2a4a6a">34</text>
    <text x="550" y="141">0</text>
  </g>

  <!-- row 2: round 1 -->
  <g filter="url(#sk)">
    <rect x="95" y="160" width="70" height="46" fill="#fff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="165" y="160" width="110" height="46" fill="#fff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="275" y="160" width="110" height="46" fill="#e6f4ea" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="385" y="160" width="90" height="46" fill="#e8f0fe" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="475" y="160" width="150" height="46" fill="#fff8e1" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">
    <text x="130" y="187" font-weight="bold">①</text>
    <text x="220" y="187">34 ÷ 6</text>
    <text x="330" y="187" font-size="14" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="430" y="187" font-weight="bold" fill="#2a4a6a">5</text>
    <text x="550" y="187">0 ＋ 4 ＝ 4</text>
  </g>

  <!-- row 3: round 2 -->
  <g filter="url(#sk)">
    <rect x="95" y="206" width="70" height="46" fill="#fff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="165" y="206" width="110" height="46" fill="#fff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="275" y="206" width="110" height="46" fill="#e6f4ea" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="385" y="206" width="90" height="46" fill="#e8f0fe" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="475" y="206" width="150" height="46" fill="#fff8e1" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">
    <text x="130" y="233" font-weight="bold">②</text>
    <text x="220" y="233">5 ÷ 6</text>
    <text x="330" y="233" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>
    <text x="430" y="233" font-weight="bold" fill="#2a4a6a">0</text>
    <text x="550" y="233">4 ＋ 5 ＝ 9</text>
  </g>

  <!-- row 4: stop -->
  <g filter="url(#sk)">
    <rect x="95" y="252" width="70" height="46" fill="#fce4ec" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="165" y="252" width="110" height="46" fill="#fce4ec" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="275" y="252" width="110" height="46" fill="#fce4ec" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="385" y="252" width="90" height="46" fill="#fce4ec" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="475" y="252" width="150" height="46" fill="#fce4ec" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#a04038" filter="url(#sk)">
    <text x="130" y="279" font-weight="bold">停止</text>
    <text x="220" y="279">n ＝ 0，退出</text>
    <text x="330" y="279">—</text>
    <text x="430" y="279">—</text>
    <text x="550" y="279" font-size="14" font-weight="bold">9 ✓</text>
  </g>

  <!-- left box: reversal needed only to write the representation -->
  <g filter="url(#sk)">
    <rect x="95" y="320" width="300" height="112" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="245" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">若要把表示写出来（504 题那种）才需要倒序：</text>
  <g filter="url(#sk)">
    <rect x="135" y="354" width="36" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="181" y="354" width="36" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="268" y="354" width="36" height="36" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="314" y="354" width="36" height="36" rx="6" fill="#fff" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="153" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04038" filter="url(#sk)">4</text>
  <text x="199" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <text x="286" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <text x="332" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04038" filter="url(#sk)">4</text>
  <text x="153" y="404" text-anchor="middle" font-size="9" fill="#555" filter="url(#sk)">先出</text>
  <text x="199" y="404" text-anchor="middle" font-size="9" fill="#555" filter="url(#sk)">后出</text>
  <text x="286" y="404" text-anchor="middle" font-size="9" fill="#555" filter="url(#sk)">高位</text>
  <text x="332" y="404" text-anchor="middle" font-size="9" fill="#555" filter="url(#sk)">低位</text>
  <path d="M 225,372 H 260" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="245" y="424" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">54（6 进制）＝ 5×6 ＋ 4 ＝ 34</text>

  <!-- right box: sum is order-free -->
  <g filter="url(#sk)">
    <rect x="430" y="320" width="240" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="550" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">本题求和：顺序无关！</text>
  <text x="550" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">4 ＋ 5 ＝ 5 ＋ 4 ＝ 9</text>
  <text x="550" y="398" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">循环里直接 sum ＋＝ 余数</text>
  <text x="550" y="416" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">不用数组、不用倒序</text>
</svg>
