<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">inc / dec：两个方向的“以 i 结尾”并行接龙</text>

  <!-- nums row -->
  <text x="14" y="86" font-size="13" fill="#888" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)">
    <rect x="70" y="62" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="94" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">1</text>
    <rect x="136" y="62" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="160" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">4</text>
    <rect x="202" y="62" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="226" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">3</text>
    <rect x="268" y="62" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="292" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">3</text>
    <rect x="334" y="62" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="358" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">2</text>
  </g>

  <!-- comparison badges between gaps -->
  <g filter="url(#rough2)">
    <circle cx="130" cy="120" r="13" fill="#fafafa" stroke="#446688" stroke-width="1.6"/>
    <text x="130" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">＞</text>
    <circle cx="196" cy="120" r="13" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="196" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">＜</text>
    <circle cx="262" cy="120" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="262" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">＝</text>
    <circle cx="328" cy="120" r="13" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="328" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">＜</text>
  </g>

  <!-- inc track -->
  <text x="14" y="176" font-size="13" fill="#4a7a3a" filter="url(#rough2)">inc ↑</text>
  <g filter="url(#rough2)">
    <rect x="70" y="152" width="48" height="36" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.3" rx="4"/>
    <text x="94" y="175" text-anchor="middle" font-size="13" fill="#666">1</text>
    <rect x="136" y="152" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="160" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5e24">2</text>
    <rect x="202" y="152" width="48" height="36" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.3" rx="4"/>
    <text x="226" y="175" text-anchor="middle" font-size="13" fill="#666">1</text>
    <rect x="268" y="152" width="48" height="36" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.3" rx="4"/>
    <text x="292" y="175" text-anchor="middle" font-size="13" fill="#666">1</text>
    <rect x="334" y="152" width="48" height="36" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.3" rx="4"/>
    <text x="358" y="175" text-anchor="middle" font-size="13" fill="#666">1</text>
  </g>

  <!-- dec track -->
  <text x="14" y="234" font-size="13" fill="#d6a040" filter="url(#rough2)">dec ↓</text>
  <g filter="url(#rough2)">
    <rect x="70" y="210" width="48" height="36" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.3" rx="4"/>
    <text x="94" y="233" text-anchor="middle" font-size="13" fill="#666">1</text>
    <rect x="136" y="210" width="48" height="36" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.3" rx="4"/>
    <text x="160" y="233" text-anchor="middle" font-size="13" fill="#666">1</text>
    <rect x="202" y="210" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="226" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5e24">2</text>
    <rect x="268" y="210" width="48" height="36" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.3" rx="4"/>
    <text x="292" y="233" text-anchor="middle" font-size="13" fill="#666">1</text>
    <rect x="334" y="210" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="358" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5e24">2</text>
  </g>

  <!-- side note -->
  <g filter="url(#rough2)">
    <rect x="398" y="152" width="134" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="465" y="180" text-anchor="middle" font-size="11.5" fill="#8a6a1a">任一时刻</text>
    <text x="465" y="202" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1a">min(inc, dec) = 1</text>
    <text x="465" y="224" text-anchor="middle" font-size="11.5" fill="#8a6a1a">至多一边在接龙</text>
  </g>

  <!-- arrows into ans box -->
  <path d="M 160 190 L 208 282" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 226 248 L 240 280" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 358 248 L 310 282" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans box -->
  <g filter="url(#rough2)">
    <rect x="110" y="286" width="320" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
    <text x="270" y="315" text-anchor="middle" font-size="14" fill="#2f5e24">ans = 全程 max(inc, dec) 的历史峰值 = 2</text>
  </g>

  <!-- strictness note -->
  <text x="270" y="362" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">严格 ⇒ 相等（＝）时两个方向同时断裂，inc 与 dec 一起归 1</text>
</svg>
