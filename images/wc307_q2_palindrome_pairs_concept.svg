<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：回文 = 镜像配对 + 至多一个落单中心</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- mirror pair arcs -->
  <text x="320" y="68" text-anchor="middle" font-size="12" fill="#666">镜像位成对：左右各放一个相同数字</text>
  <g stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)">
    <path d="M 164 100 Q 320 50 476 100"/>
    <path d="M 216 100 Q 320 66 424 100"/>
    <path d="M 268 100 Q 320 82 372 100"/>
  </g>

  <!-- palindrome boxes -->
  <g filter="url(#sk)">
    <rect x="141" y="100" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="193" y="100" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="245" y="100" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="297" y="100" width="46" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="349" y="100" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="401" y="100" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="453" y="100" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#333">
    <text x="164" y="127">7</text>
    <text x="216" y="127">4</text>
    <text x="268" y="127">4</text>
    <text x="320" y="127" fill="#b8860b">9</text>
    <text x="372" y="127">4</text>
    <text x="424" y="127">4</text>
    <text x="476" y="127">7</text>
  </g>
  <path d="M 320 158 L 320 146" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">落单数字 → 中心（至多 1 个）</text>

  <path d="M 40 182 Q 320 190 600 182" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- frequency table -->
  <text x="204" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">num = "444947137" 的频次表</text>
  <g filter="url(#sk)">
    <rect x="60" y="214" width="64" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="124" y="214" width="72" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="196" y="214" width="88" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="284" y="214" width="64" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">
    <text x="92" y="231">数字 d</text>
    <text x="160" y="231">频次 cnt</text>
    <text x="240" y="231">对数 ⌊c/2⌋</text>
    <text x="316" y="231">落单?</text>
  </g>
  <g filter="url(#sk)">
    <rect x="60" y="240" width="64" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="124" y="240" width="72" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="196" y="240" width="88" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="284" y="240" width="64" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333">
    <text x="92" y="257">9</text>
    <text x="160" y="257">1</text>
    <text x="240" y="257">0</text>
    <text x="316" y="257" fill="#b8860b" font-weight="bold">✓</text>
  </g>
  <g filter="url(#sk)">
    <rect x="60" y="266" width="64" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="124" y="266" width="72" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="196" y="266" width="88" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="284" y="266" width="64" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333">
    <text x="92" y="283">7</text>
    <text x="160" y="283">2</text>
    <text x="240" y="283" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="316" y="283" fill="#999">—</text>
  </g>
  <g filter="url(#sk)">
    <rect x="60" y="292" width="64" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="124" y="292" width="72" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="196" y="292" width="88" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="284" y="292" width="64" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333">
    <text x="92" y="309">4</text>
    <text x="160" y="309">4</text>
    <text x="240" y="309" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="316" y="309" fill="#999">—</text>
  </g>
  <g filter="url(#sk)">
    <rect x="60" y="318" width="64" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="124" y="318" width="72" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="196" y="318" width="88" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="284" y="318" width="64" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333">
    <text x="92" y="335">3</text>
    <text x="160" y="335">1</text>
    <text x="240" y="335">0</text>
    <text x="316" y="335" fill="#b8860b" font-weight="bold">✓</text>
  </g>
  <g filter="url(#sk)">
    <rect x="60" y="344" width="64" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="124" y="344" width="72" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="196" y="344" width="88" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="284" y="344" width="64" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333">
    <text x="92" y="361">1</text>
    <text x="160" y="361">1</text>
    <text x="240" y="361">0</text>
    <text x="316" y="361" fill="#b8860b" font-weight="bold">✓</text>
  </g>

  <!-- construction boxes -->
  <path d="M 350 281 Q 372 280 388 252" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 350 255 Q 380 290 388 322" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="392" y="214" width="204" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="494" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">左半 left（9 → 0 降序拼对）</text>
  <text x="494" y="262" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e6e2e">「7」+「44」= 744</text>
  <g filter="url(#sk)">
    <rect x="392" y="306" width="204" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="494" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">中心 center（最大落单）</text>
  <text x="494" y="348" text-anchor="middle" font-size="12" font-family="monospace" fill="#7a5415">9</text>
  <path d="M 494 360 L 494 384" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 596 278 Q 630 330 596 384" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="392" y="386" width="204" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="494" y="408" text-anchor="middle" font-size="11" font-family="monospace" fill="#2e6e2e">res = left + center + left^R</text>
  <text x="494" y="430" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">7449447</text>

  <text x="320" y="462" text-anchor="middle" font-size="11" fill="#888">每对左右各一个 · 所有对降序排进左半 · 最大落单当中心 · 首字符为 0 则弃全部对</text>
</svg>
