<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="600" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：并查集静态分组 + 每组一个在线电站有序集合</text>
  <path d="M 240 42 Q 470 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左侧：电站图 ===== -->
  <text x="250" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">电网结构（固定不变）</text>

  <!-- 电网 A：链 1-2-3-4-5 -->
  <g filter="url(#sk)">
    <line x1="105" y1="118" x2="180" y2="158" stroke="#446688" stroke-width="1.6"/>
    <line x1="216" y1="164" x2="284" y2="120" stroke="#446688" stroke-width="1.6"/>
    <line x1="320" y1="114" x2="388" y2="158" stroke="#446688" stroke-width="1.6"/>
    <line x1="424" y1="164" x2="455" y2="128" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="13" text-anchor="middle">
    <ellipse cx="88" cy="110" rx="19" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="198" cy="170" rx="19" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="302" cy="112" rx="19" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="406" cy="170" rx="19" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="472" cy="118" rx="19" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="88" y="115">1</text><text x="198" y="175">2</text><text x="302" y="117">3</text>
    <text x="406" y="175">4</text><text x="472" y="123">5</text>
  </g>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">电网 A：DSU 同根 → find(1)=…=find(5)</text>

  <!-- 电网 B：6-7 -->
  <g filter="url(#sk)">
    <line x1="122" y1="300" x2="180" y2="300" stroke="#4a7a3a" stroke-width="1.6"/>
    <ellipse cx="100" cy="300" rx="19" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="202" cy="300" rx="19" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="100" y="305">6</text><text x="202" y="305">7</text>
  </g>
  <text x="152" y="346" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">电网 B</text>

  <!-- 孤立电站 8 -->
  <g filter="url(#sk)">
    <ellipse cx="100" cy="420" rx="19" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="100" y="425" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">8</text>
  <text x="100" y="462" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#sk)">电网 C（孤立）</text>

  <!-- ===== 右侧：每组的有序集合 ===== -->
  <text x="730" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">在线集合（动态增删）</text>

  <path d="M 300 130 Q 470 96 528 108" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 225 296 Q 420 232 528 200" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 122 414 Q 380 350 528 292" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 电网 A 的集合 -->
  <g filter="url(#sk)">
    <rect x="532" y="92" width="390" height="106" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="550" y="116" font-size="13" font-weight="bold" fill="#2b6e9e">S[A] = {1, 2, 3, 4, 5}（初始全在线）</text>
  <text x="550" y="142" font-size="12" fill="#444" font-family="monospace">[2,1] 之后 → S[A] = {2, 3, 4, 5}</text>
  <text x="550" y="168" font-size="12" fill="#b85450" font-weight="bold" font-family="monospace">查询 [1,1] → x 离线 → 取最小在线 *begin() = 2</text>
  <text x="550" y="188" font-size="10" fill="#888">C++ 用 std::set&lt;int&gt;，O(log) 取最小 / 删除</text>

  <!-- 电网 B 的集合 -->
  <g filter="url(#sk)">
    <rect x="532" y="212" width="390" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="550" y="236" font-size="13" font-weight="bold" fill="#2e6e2e">S[B] = {6, 7}</text>
  <text x="550" y="260" font-size="12" fill="#444" font-family="monospace">[2,6] 之后 → S[B] = {7} → [1,6] 答案 = 7</text>

  <!-- 电网 C 的集合 -->
  <g filter="url(#sk)">
    <rect x="532" y="304" width="390" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="550" y="328" font-size="13" font-weight="bold" fill="#8a6a1a">S[C] = {8}</text>
  <text x="550" y="352" font-size="12" fill="#444" font-family="monospace">[2,8] 之后 → S[C] = ∅ → [1,8] 答案 = -1</text>

  <!-- ===== 底部要点 ===== -->
  <g filter="url(#sk)">
    <rect x="48" y="420" width="844" height="156" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="70" y="448" font-size="13" font-weight="bold" fill="#2b2b2b">为什么这样划分职责？</text>
  <text x="70" y="474" font-size="12" fill="#444">① 连通性只由 connections 决定，离线不改变连接 → 一开始 DSU 分好组，之后不再变</text>
  <text x="70" y="500" font-size="12" fill="#444">② 离线不可逆（没有"重新上线"操作）→ 每个电站至多从集合中删除一次，删除总量 ≤ c</text>
  <text x="70" y="526" font-size="12" fill="#444">③ "编号最小的在线电站" = 按电站 id 排序取最小 → 有序集合天然支持</text>
  <text x="70" y="552" font-size="12" fill="#b85450" font-weight="bold">④ 陷阱：x 在线时答案就是 x 本身，不是集合最小元！</text>
</svg>
