<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#fafafa"/>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：计算截止线 → 排序 → 逐槽位贪心判定</text>
  <path d="M 210 40 Q 450 50 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="60" y="60" width="780" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="84" font-size="13.5" font-weight="bold" fill="#33517a">Step 1 · 每只怪物折叠成整数截止线 — O(n)</text>
  <text x="80" y="107" font-size="12" fill="#444">arrival[i] = (dist[i] + speed[i] − 1) / speed[i]　⇔　⌈dist[i] / speed[i]⌉</text>
  <text x="80" y="129" font-size="11" fill="#666">纯整数运算，零浮点精度风险；speed ≥ 1 且 dist ≥ 1 ⇒ arrival ≥ 1</text>

  <path d="M 450 140 L 450 158" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="60" y="160" width="780" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="184" font-size="13.5" font-weight="bold" fill="#33517a">Step 2 · arrival 升序排序 — O(n log n)</text>
  <text x="80" y="207" font-size="11" fill="#666">最迫近的怪物排最前（EDF：最早截止者优先）；值域 ≤ 10^5 也可改用计数排序 O(n + V)</text>

  <path d="M 450 232 L 450 250" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="60" y="252" width="780" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="80" y="276" font-size="13.5" font-weight="bold" fill="#2e5e2e">Step 3 · 从 k = 0 起逐槽位判定排序后的第 k 只</text>
  <text x="80" y="298" font-size="11" fill="#666">第 k 分钟的武器槽位，装得下第 k 只 ⇔ arrival[k] &gt; k</text>

  <path d="M 450 312 L 450 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- Decision diamond -->
  <g filter="url(#sk)">
    <polygon points="450,332 635,402 450,472 265,402" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="450" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5a15">arrival[k] &gt; k ？</text>
  <text x="450" y="420" text-anchor="middle" font-size="10.5" fill="#8a6a1e">第 k 分钟开始时它还活着吗</text>

  <text x="646" y="396" font-size="13" font-weight="bold" fill="#4a7a3a">是</text>
  <text x="466" y="486" font-size="13" font-weight="bold" fill="#b85450">否</text>

  <!-- Yes branch -->
  <path d="M 635 402 L 656 402" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arG)"/>
  <g filter="url(#sk)">
    <rect x="660" y="372" width="190" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="755" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">消灭它，ans = k + 1</text>
  <text x="755" y="418" text-anchor="middle" font-size="11" fill="#555">k += 1，回到判定</text>

  <!-- loop back -->
  <path d="M 755 372 L 755 318 Q 620 306 470 330" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="768" y="316" font-size="10.5" fill="#4a7a3a">k &lt; n</text>

  <!-- k == n branch -->
  <path d="M 755 434 L 755 466" stroke="#8e5db8" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="746" y="456" text-anchor="end" font-size="10.5" fill="#8e5db8">k == n</text>
  <g filter="url(#sk)">
    <rect x="655" y="470" width="200" height="64" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.8"/>
  </g>
  <text x="755" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">return n</text>
  <text x="755" y="516" text-anchor="middle" font-size="10.5" fill="#77559a">n 只怪物全部消灭 ✓</text>

  <!-- No branch -->
  <path d="M 450 472 L 450 494" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arR)"/>
  <g filter="url(#sk)">
    <rect x="280" y="498" width="340" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="450" y="522" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038">return k —— 游戏在第 k 分钟开始时结束</text>
  <text x="450" y="544" text-anchor="middle" font-size="11" fill="#8a4a44">前 k 只已收入囊中；后面的怪物再宽松也轮不到出手</text>
  <text x="450" y="562" text-anchor="middle" font-size="10" fill="#a04038">（答案 = 最长合法前缀的长度）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="592" width="780" height="84" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="616" font-size="11.5" fill="#444">⚠ 一旦 arrival[k] ≤ k 立即返回 k：第 k 分钟开始时怪物已抵达，游戏在这一刻结束——</text>
  <text x="80" y="638" font-size="11.5" fill="#444">答案是最长「合法前缀」的长度；若 n 只全部通过（一切 k 均有 arrival[k] &gt; k），则返回 n。</text>
  <text x="80" y="660" font-size="11" fill="#888">复杂度：时间 O(n log n)（瓶颈在排序）｜空间 O(n)（原地改写 dist 可省去辅助数组）</text>
</svg>
