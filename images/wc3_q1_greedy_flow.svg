<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="-8" y="-8" width="536" height="436" fill="#fafafa" filter="url(#rough2)"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描，两个退出条件</text>

  <rect x="200" y="50" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="71" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i = 0，j = 0</text>

  <polygon points="270,100 355,126 270,152 185,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">i == n ?</text>

  <polygon points="270,179 355,205 270,231 185,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="209" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">j == m ?</text>

  <polygon points="270,258 365,284 270,310 175,284" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">t[j] == s[i] ?</text>

  <rect x="392" y="109" width="108" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="446" y="131" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 true</text>

  <rect x="392" y="188" width="108" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="446" y="210" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <rect x="400" y="267" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="289" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">i++</text>

  <rect x="230" y="344" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="365" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">j++</text>

  <g fill="none" stroke="#666" stroke-width="1.5">
    <path d="M 270 84 L 270 98" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 354 126 L 390 126" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 270 154 L 270 177" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 354 205 L 390 205" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 270 233 L 270 256" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 364 284 L 398 284" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 270 312 L 270 342" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 445 301 L 445 360 L 312 360" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 270 376 L 270 392 L 90 392 L 90 66 L 197 66" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <g font-size="10" fill="#666">
    <text x="360" y="119" filter="url(#rough2)">是</text>
    <text x="360" y="198" filter="url(#rough2)">是</text>
    <text x="282" y="172" filter="url(#rough2)">否</text>
    <text x="282" y="251" filter="url(#rough2)">否</text>
    <text x="374" y="278" filter="url(#rough2)">是</text>
    <text x="282" y="334" filter="url(#rough2)">否</text>
    <text x="452" y="330" filter="url(#rough2)">是</text>
  </g>

  <text x="260" y="410" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">两条终止边覆盖全部结束方式；循环体内每轮 j 必定 +1，故必然终止</text>
</svg>
