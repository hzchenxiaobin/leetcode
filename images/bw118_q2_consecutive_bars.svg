<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">连续删除段：边长 = 段长 + 1</text>

  <!-- 水平线编号 1..6，其中 2,3,4 可删（连续段 k=3） -->
  <text x="60" y="70" font-size="13" fill="#446688" filter="url(#rough2)">水平线（n=4）：</text>
  <line x1="150" y1="66" x2="500" y2="66" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="56" font-size="12" fill="#446688" filter="url(#rough2)">1（固定）</text>
  <line x1="150" y1="100" x2="500" y2="100" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="150" y="92" font-size="12" fill="#b85450" filter="url(#rough2)">2（可删）</text>
  <line x1="150" y1="134" x2="500" y2="134" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="150" y="126" font-size="12" fill="#b85450" filter="url(#rough2)">3（可删）</text>
  <line x1="150" y1="168" x2="500" y2="168" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="150" y="160" font-size="12" fill="#b85450" filter="url(#rough2)">4（可删）</text>
  <line x1="150" y1="202" x2="500" y2="202" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="194" font-size="12" fill="#446688" filter="url(#rough2)">5（固定）</text>
  <line x1="150" y1="236" x2="500" y2="236" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="228" font-size="12" fill="#446688" filter="url(#rough2)">6（固定）</text>

  <!-- 删除后的空洞高亮 -->
  <rect x="160" y="68" width="330" height="132" rx="4" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <text x="325" y="138" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">删掉连续段 {2,3,4}</text>
  <text x="325" y="158" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">空洞高度 = 6−1 … </text>

  <!-- 边长标注 -->
  <line x1="520" y1="66" x2="520" y2="202" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="534" y="130" font-size="13" fill="#2d5a1f" filter="url(#rough2)">k+1</text>
  <text x="534" y="148" font-size="12" fill="#4a7a3a" filter="url(#rough2)">= 4</text>

  <!-- 推导框 -->
  <rect x="50" y="262" width="460" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">连续段 [l, r]（k = r−l+1 条）全删后：</text>
  <text x="280" y="312" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">两侧固定线 l−1 与 r+1 围出空洞</text>
  <text x="280" y="336" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">边长 = (r+1) − (l−1) = k + 1</text>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">（hBars 值域 [2, n+1] 保证 l−1 ≥ 1、r+1 ≤ n+2 存在）</text>
</svg>
