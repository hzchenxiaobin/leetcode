<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：premin 逐行快照与打擂台（示例 1）</text>
  <text x="270" y="46" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">滚动数组视角：premin[j] 未更新 = 上一行（上块），已更新 = 本行（左块）</text>

  <!-- snapshot row 0 -->
  <text x="118" y="92" text-anchor="end" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">处理完第 0 行</text>
  <g filter="url(#rough2)">
    <rect x="130" y="70" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="178" y="70" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="226" y="70" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="274" y="70" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="152" y="93" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">9</text>
    <text x="200" y="93" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a">5</text>
    <text x="248" y="93" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a">5</text>
    <text x="296" y="93" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">3</text>
  </g>
  <text x="356" y="88" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">ans = 2</text>
  <text x="356" y="108" font-size="10.5" fill="#888" filter="url(#rough2)">本行最佳 (0,2)：7 − 5 = 2</text>

  <!-- snapshot row 1 -->
  <text x="118" y="160" text-anchor="end" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">处理完第 1 行</text>
  <g filter="url(#rough2)">
    <rect x="130" y="138" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="178" y="138" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="226" y="138" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="274" y="138" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="152" y="161" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">8</text>
    <text x="200" y="161" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a">5</text>
    <text x="248" y="161" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a">5</text>
    <text x="296" y="161" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">1</text>
  </g>
  <text x="356" y="156" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">ans = 4</text>
  <text x="356" y="176" font-size="10.5" fill="#888" filter="url(#rough2)">本行最佳 (1,1)：9 − 5 = 4</text>

  <!-- snapshot row 2 (record) -->
  <text x="118" y="228" text-anchor="end" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">处理完第 2 行</text>
  <g filter="url(#rough2)">
    <rect x="130" y="206" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="178" y="206" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="226" y="206" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="274" y="206" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="152" y="229" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">6</text>
    <text x="200" y="229" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a">5</text>
    <text x="248" y="229" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a">5</text>
    <text x="296" y="229" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">1</text>
  </g>
  <text x="356" y="224" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = 9</text>
  <text x="356" y="244" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">本行最佳 (2,2)：14 − 5 = 9 ← 破纪录</text>

  <!-- snapshot row 3 -->
  <text x="118" y="296" text-anchor="end" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">处理完第 3 行</text>
  <g filter="url(#rough2)">
    <rect x="130" y="274" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="178" y="274" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="226" y="274" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="274" y="274" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="152" y="297" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">2</text>
    <text x="200" y="297" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">2</text>
    <text x="248" y="297" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">2</text>
    <text x="296" y="297" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">1</text>
  </g>
  <text x="356" y="292" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">ans = 9</text>
  <text x="356" y="312" font-size="10.5" fill="#888" filter="url(#rough2)">本行最佳 (3,1)：5 − 2 = 3，未刷新</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="40" y="336" width="460" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">最优解定格：起点 (0,1) = 5 → 终点 (2,2) = 14，得分 9</text>
  <text x="270" y="378" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">全局最小起点值 5（绿色）一路传递；第 3 行最佳仅 3，未破纪录</text>
</svg>
