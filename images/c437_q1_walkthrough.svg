<svg xmlns="http://www.w3.org/2000/svg" width="680" height="384" viewBox="0 0 680 384" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="384" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：s = "aaabaaa"</text>
  <path d="M 230 40 Q 340 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- string cells -->
  <text x="122" y="78" font-size="13" fill="#555" filter="url(#rough2)">s =</text>
  <text x="169" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="207" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="245" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="283" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="321" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="359" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="397" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)">
    <rect x="150" y="56" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="188" y="56" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="226" y="56" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="264" y="56" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="302" y="56" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="340" y="56" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="378" y="56" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="169" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="207" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="245" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="283" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="321" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="359" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="397" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="207" y="112" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">段1 L=3</text>
  <text x="283" y="112" text-anchor="middle" font-size="10.5" fill="#a06a1a" filter="url(#rough2)">段2 L=1</text>
  <text x="359" y="112" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">段3 L=3</text>

  <!-- k = 3 table -->
  <text x="60" y="132" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">k = 3</text>
  <text x="60" y="148" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">段</text>
  <text x="140" y="148" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">区间</text>
  <text x="230" y="148" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">字符</text>
  <text x="310" y="148" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">L</text>
  <text x="380" y="148" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">L == k ?</text>
  <g filter="url(#rough2)">
    <rect x="50" y="156" width="410" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="60" y="172" font-size="11.5" fill="#333" filter="url(#rough2)">段1</text>
  <text x="140" y="172" font-size="11.5" fill="#333" filter="url(#rough2)">[0, 3)</text>
  <text x="230" y="172" font-size="11.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="310" y="172" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="380" y="172" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3 == 3 ✓ 命中</text>
  <g filter="url(#rough2)">
    <path d="M 462 168 L 480 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="488" y="172" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return true</text>

  <!-- k = 4 table -->
  <text x="60" y="210" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">k = 4</text>
  <text x="60" y="226" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">段</text>
  <text x="140" y="226" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">区间</text>
  <text x="230" y="226" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">字符</text>
  <text x="310" y="226" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">L</text>
  <text x="380" y="226" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">L == k ?</text>
  <g filter="url(#rough2)">
    <rect x="50" y="232" width="410" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="0.9"/>
    <rect x="50" y="258" width="410" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="0.9"/>
    <rect x="50" y="284" width="410" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="0.9"/>
  </g>
  <text x="60" y="248" font-size="11.5" fill="#333" filter="url(#rough2)">段1</text>
  <text x="140" y="248" font-size="11.5" fill="#333" filter="url(#rough2)">[0, 3)</text>
  <text x="230" y="248" font-size="11.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="310" y="248" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="380" y="248" font-size="11.5" fill="#b03a3a" filter="url(#rough2)">3 ≠ 4 ✗</text>
  <text x="60" y="274" font-size="11.5" fill="#333" filter="url(#rough2)">段2</text>
  <text x="140" y="274" font-size="11.5" fill="#333" filter="url(#rough2)">[3, 4)</text>
  <text x="230" y="274" font-size="11.5" fill="#333" filter="url(#rough2)">b</text>
  <text x="310" y="274" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="380" y="274" font-size="11.5" fill="#b03a3a" filter="url(#rough2)">1 ≠ 4 ✗</text>
  <text x="60" y="300" font-size="11.5" fill="#333" filter="url(#rough2)">段3</text>
  <text x="140" y="300" font-size="11.5" fill="#333" filter="url(#rough2)">[4, 7)</text>
  <text x="230" y="300" font-size="11.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="310" y="300" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="380" y="300" font-size="11.5" fill="#b03a3a" filter="url(#rough2)">3 ≠ 4 ✗</text>
  <g filter="url(#rough2)">
    <path d="M 462 274 L 480 274" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="488" y="278" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">return false</text>

  <!-- takeaway -->
  <g filter="url(#rough2)">
    <rect x="30" y="322" width="620" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="340" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读法：先切极长段，只看每段长度</text>
  <text x="340" y="360" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">k=3 时段1 长度恰为 3 直接命中；k=4 时 3 / 1 / 3 无一命中，扫描完返回 false</text>
</svg>
