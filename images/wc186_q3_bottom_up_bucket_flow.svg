<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：自底向上遍历填桶，再按桶号拼接</text>

  <ellipse cx="155" cy="48" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="53" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">开始</text>
  <path d="M 155 66 L 155 82" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="86" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="107" text-anchor="middle" font-size="12" fill="#2a4660" filter="url(#rough2)">① 求 maxSum = max(i + len(i) − 1)</text>
  <path d="M 155 120 L 155 136" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="140" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="161" text-anchor="middle" font-size="12" fill="#2a4660" filter="url(#rough2)">② 行号 i 自底向上：R−1 → 0</text>
  <path d="M 155 174 L 155 190" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="194" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="215" text-anchor="middle" font-size="12" fill="#2a4660" filter="url(#rough2)">③ 行内 j: 0 → len(i)−1，执行</text>
  <text x="155" y="233" text-anchor="middle" font-size="12" fill="#2a4660" filter="url(#rough2)">g[i+j].append(nums[i][j])</text>
  <path d="M 155 242 L 155 258" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="155,262 235,292 155,322 75,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="297" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">还有未处理的行？</text>
  <path d="M 235 292 L 268 292 L 268 157 L 259 157" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="243" y="283" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <path d="M 155 322 L 155 342" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="338" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <rect x="55" y="346" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="367" text-anchor="middle" font-size="12" fill="#2a4660" filter="url(#rough2)">④ s: 0 → maxSum 依次拼接 g[s]</text>
  <path d="M 155 380 L 155 396" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="155" cy="416" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="421" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">输出答案</text>

  <rect x="300" y="92" width="205" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="402" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5424" filter="url(#rough2)">为何桶内自动有序？</text>
  <text x="402" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">自底向上：i 从 R−1 → 0 处理</text>
  <text x="402" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">同桶（i+j = s）中大 i 先入桶</text>
  <text x="402" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">⇒ 桶内天然 i 降序（自下而上）</text>
  <text x="402" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">零比较、零排序</text>

  <rect x="300" y="246" width="205" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="402" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">行内 j 从左到右，行吗？</text>
  <text x="402" y="292" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">同行 i 固定，j 递增 ⇒ i+j 递增</text>
  <text x="402" y="312" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">元素散进不同桶，</text>
  <text x="402" y="332" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">不破坏任何桶内顺序</text>

  <rect x="300" y="376" width="205" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="402" y="394" text-anchor="middle" font-size="11" fill="#2a4660" filter="url(#rough2)">时间 O(n) · 空间 O(n)</text>
  <text x="402" y="411" text-anchor="middle" font-size="11" fill="#2a4660" filter="url(#rough2)">n = 矩阵中元素总数</text>
</svg>
