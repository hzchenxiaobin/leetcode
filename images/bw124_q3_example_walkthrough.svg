<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1：nums = [3,2,1,2,3,4]，三次操作都是 5</text>

  <!-- 第 1 行 -->
  <g filter="url(#rough2)">
    <rect x="80" y="42" width="52" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="138" y="42" width="52" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="196" y="42" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="254" y="42" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="312" y="42" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="370" y="42" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="106" y="64">3</text><text x="164" y="64">2</text><text x="222" y="64">1</text>
    <text x="280" y="64">2</text><text x="338" y="64">3</text><text x="396" y="64">4</text>
  </g>
  <text x="452" y="64" font-size="9.8" fill="#8c3a3a" filter="url(#rough2)">删前两个：3+2=5</text>

  <path d="M 280 76 L 280 92" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 2 行 -->
  <g filter="url(#rough2)">
    <rect x="196" y="96" width="52" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="254" y="96" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="312" y="96" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="370" y="96" width="52" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="222" y="118">1</text><text x="280" y="118">2</text><text x="338" y="118">3</text><text x="396" y="118">4</text>
  </g>
  <text x="452" y="118" font-size="9.8" fill="#a08a50" filter="url(#rough2)">删首尾：1+4=5</text>

  <path d="M 280 130 L 280 146" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 3 行 -->
  <g filter="url(#rough2)">
    <rect x="254" y="150" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9"/>
    <rect x="312" y="150" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="280" y="172">2</text><text x="338" y="172">3</text>
  </g>
  <text x="380" y="172" font-size="9.8" fill="#2f5226" filter="url(#rough2)">删首尾：2+3=5</text>

  <path d="M 280 184 L 280 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="216" font-size="10" fill="#999" filter="url(#rough2)">空区间，无法继续 → 共 3 次</text>

  <rect x="30" y="230" width="500" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="10.8" fill="#2f5226" filter="url(#rough2)">首步取「前两个」得到 score = 5，之后三种删法都恰好等于 5，于是连做 3 次</text>

  <text x="280" y="282" text-anchor="middle" font-size="10.3" fill="#666" filter="url(#rough2)">另两种首步：删后两个（3+4=7）、删首尾（3+4=7），分数变 7 后最多只能再做 0 次</text>
  <text x="280" y="304" text-anchor="middle" font-size="10.3" fill="#888" filter="url(#rough2)">所以答案是 max(1+2, 1+0, 1+0) = 3</text>
</svg>
