<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：夹逼 + 失配时只枚举两种删法</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">不枚举「删哪个字符」，而是让冲突自己把候选集缩到 2 个</text>

  <rect x="200" y="62" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">i ← 0，j ← n − 1</text>

  <path d="M 280 94 L 280 112" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280 114 L 360 150 L 280 186 L 200 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">i &lt; j ？</text>

  <path d="M 360 150 L 430 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="143" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="432" y="132" width="112" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="488" y="155" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 true</text>

  <path d="M 280 186 L 280 206" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="201" font-size="10" fill="#888" filter="url(#rough2)">是</text>

  <path d="M 280 208 L 366 244 L 280 280 L 194 244 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="249" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">s[i] == s[j] ？</text>

  <path d="M 194 244 L 84 244 L 84 150 L 196 150" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是：i++，j−−</text>

  <path d="M 280 280 L 280 300" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="295" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <rect x="110" y="300" width="340" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">返回 isPal(i+1, j) || isPal(i, j−1)</text>
  <text x="280" y="341" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">删 s[i] 查右段，删 s[j] 查左段，任一为回文即可</text>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">isPal 用双指针 O(n) 判闭区间回文；失配只发生一次 → 总 O(n)，空间 O(1)</text>
</svg>
