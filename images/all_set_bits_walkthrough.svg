<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="42" text-anchor="middle" font-size="19" font-weight="bold" fill="#446688" filter="url(#rough2)">示例演算：位数一步定位答案</text>

  <!-- table outline -->
  <rect x="45" y="70" width="430" height="240" fill="#ffffff" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="45" y="70" width="430" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <line x1="125" y1="70" x2="125" y2="310" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="255" y1="70" x2="255" y2="310" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="315" y1="70" x2="315" y2="310" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="395" y1="70" x2="395" y2="310" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="85" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">n</text>
  <text x="190" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">二进制</text>
  <text x="285" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <text x="355" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">2^b−1</text>
  <text x="435" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">答案</text>

  <line x1="45" y1="116" x2="475" y2="116" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- row 1: n=3 -->
  <rect x="45" y="116" width="430" height="46" fill="#e6f4ea" stroke="none" opacity="0.6" filter="url(#rough2)"/>
  <line x1="45" y1="162" x2="475" y2="162" stroke="#8aa" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="144" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="190" y="144" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">11</text>
  <text x="285" y="144" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="355" y="144" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="435" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- row 2: n=5 -->
  <line x1="45" y1="208" x2="475" y2="208" stroke="#8aa" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="190" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">101</text>
  <text x="285" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="355" y="190" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="435" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">7</text>

  <!-- row 3: n=8 -->
  <line x1="45" y1="254" x2="475" y2="254" stroke="#8aa" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="236" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="190" y="236" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1000</text>
  <text x="285" y="236" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="355" y="236" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">15</text>
  <text x="435" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">15</text>

  <!-- row 4: n=10 -->
  <text x="85" y="282" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <text x="190" y="282" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1010</text>
  <text x="285" y="282" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="355" y="282" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">15</text>
  <text x="435" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">15</text>

  <!-- annotations -->
  <text x="160" y="340" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">绿色行：n 全 1 → 答案 = n</text>
  <text x="160" y="362" text-anchor="middle" font-size="13" fill="#99741c" filter="url(#rough2)">橙色答案：需补满 b 位 → 2^b − 1</text>

  <rect x="300" y="330" width="175" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="387" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">上界：n = 1000</text>
  <text x="387" y="370" text-anchor="middle" font-size="13" fill="#99741c" filter="url(#rough2)">b = 10 → 答案 1023</text>
</svg>
