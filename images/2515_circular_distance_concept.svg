<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">环形数组上的双向距离</text>
  <path d="M 210 42 Q 320 50 430 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <g filter="url(#sk)"><ellipse cx="38" cy="62" rx="6" ry="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="50" y="66" font-size="10" fill="#4a7a3a" font-weight="bold">= target</text>
  <g filter="url(#sk)"><ellipse cx="38" cy="80" rx="6" ry="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="50" y="84" font-size="10" fill="#446688" font-weight="bold">= 起点</text>

  <!-- circular nodes -->
  <g filter="url(#sk)"><ellipse cx="185" cy="120" rx="27" ry="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="185" y="124" text-anchor="middle" font-size="11" fill="#2e5e2e">hello</text>
  <text x="185" y="90" text-anchor="middle" font-size="10" fill="#555">idx 0</text>

  <g filter="url(#sk)"><ellipse cx="268.7" cy="180.8" rx="27" ry="23" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/></g>
  <text x="268.7" y="185" text-anchor="middle" font-size="12" fill="#2b4a66">i</text>
  <text x="306" y="164" font-size="10.5" fill="#b85450" font-weight="bold">start</text>
  <text x="306" y="178" font-size="10" fill="#555">idx 1</text>

  <g filter="url(#sk)"><ellipse cx="236.7" cy="279.2" rx="27" ry="23" fill="#ffffff" stroke="#999999" stroke-width="1.2"/></g>
  <text x="236.7" y="283" text-anchor="middle" font-size="11" fill="#555">am</text>
  <text x="252" y="318" text-anchor="middle" font-size="10" fill="#555">idx 2</text>

  <g filter="url(#sk)"><ellipse cx="133.3" cy="279.2" rx="27" ry="23" fill="#ffffff" stroke="#999999" stroke-width="1.2"/></g>
  <text x="133.3" y="283" text-anchor="middle" font-size="8.5" fill="#555">leetcode</text>
  <text x="118" y="318" text-anchor="middle" font-size="10" fill="#555">idx 3</text>

  <g filter="url(#sk)"><ellipse cx="101.3" cy="180.8" rx="27" ry="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="101.3" y="185" text-anchor="middle" font-size="11" fill="#2e5e2e">hello</text>
  <text x="67" y="184" text-anchor="end" font-size="10" fill="#555">idx 4</text>

  <!-- center -->
  <text x="185" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">n = 5</text>
  <text x="185" y="219" text-anchor="middle" font-size="10.5" fill="#888">start = 1</text>

  <!-- right arc: node1 -> node4 clockwise -->
  <path d="M 240 184 A 60 60 0 1 1 131 182" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="185" y="298" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a">右移 3 步</text>

  <!-- left arc: node1 -> node0 counter-clockwise -->
  <path d="M 240 184 A 60 60 0 0 0 193 149" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="252" y="146" font-size="12.5" font-weight="bold" fill="#3a6a2a">左移 1 步</text>

  <!-- right panel: formulas -->
  <text x="487" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">距离公式（n = 数组长度）</text>

  <g filter="url(#sk)"><rect x="355" y="102" width="265" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="368" y="121" font-size="10.5" font-weight="bold" fill="#a06a1a">右移（+1 方向）</text>
  <text x="487" y="139" text-anchor="middle" font-size="12" font-family="monospace" fill="#7a5415">dR = (i - start + n) % n</text>

  <g filter="url(#sk)"><rect x="355" y="156" width="265" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="368" y="175" font-size="10.5" font-weight="bold" fill="#3a6a2a">左移（-1 方向）</text>
  <text x="487" y="193" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e5e2e">dL = (start - i + n) % n</text>

  <g filter="url(#sk)"><rect x="355" y="210" width="265" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="487" y="235" text-anchor="middle" font-size="12.5" font-weight="bold" font-family="monospace" fill="#2b4a66">dist(i) = min(dR, dL)</text>

  <g filter="url(#sk)"><rect x="355" y="258" width="265" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="487" y="281" text-anchor="middle" font-size="11" font-family="monospace" fill="#8a3a3a">ans = min{ dist(i) : words[i]=target }</text>
  <text x="487" y="303" text-anchor="middle" font-size="10.5" fill="#8a3a3a">无匹配 → 返回 -1</text>

  <text x="320" y="342" text-anchor="middle" font-size="10.5" fill="#888">提示：i ≠ start 时 dR + dL = n，故单点距离 ≤ n/2，可用 n 作「未找到」哨兵</text>
</svg>
