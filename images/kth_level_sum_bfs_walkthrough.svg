<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="173" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 走查：四轮 BFS 收集 sums = [5, 17, 13, 10]</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic">k = 2：每轮 for 只处理快照 size 个节点，levelSum 轮末追加进 sums</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="40" y="66" width="68" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="108" y="66" width="192" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="300" y="66" width="100" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="400" y="66" width="200" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#2b6e9e" filter="url(#sk)">
    <text x="74" y="84">轮次</text>
    <text x="204" y="84">队列快照（size）</text>
    <text x="350" y="84">levelSum</text>
    <text x="500" y="84">sums（追加后）</text>
  </g>

  <!-- table rows -->
  <g filter="url(#sk)">
    <rect x="40" y="94" width="68" height="44" fill="#ffffff" stroke="#c9c4ba" stroke-width="1"/>
    <rect x="108" y="94" width="192" height="44" fill="#ffffff" stroke="#c9c4ba" stroke-width="1"/>
    <rect x="300" y="94" width="100" height="44" fill="#ffffff" stroke="#c9c4ba" stroke-width="1"/>
    <rect x="400" y="94" width="200" height="44" fill="#ffffff" stroke="#c9c4ba" stroke-width="1"/>

    <rect x="40" y="138" width="68" height="44" fill="#fbfaf7" stroke="#c9c4ba" stroke-width="1"/>
    <rect x="108" y="138" width="192" height="44" fill="#fbfaf7" stroke="#c9c4ba" stroke-width="1"/>
    <rect x="300" y="138" width="100" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="400" y="138" width="200" height="44" fill="#fbfaf7" stroke="#c9c4ba" stroke-width="1"/>

    <rect x="40" y="182" width="68" height="44" fill="#ffffff" stroke="#c9c4ba" stroke-width="1"/>
    <rect x="108" y="182" width="192" height="44" fill="#ffffff" stroke="#c9c4ba" stroke-width="1"/>
    <rect x="300" y="182" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="400" y="182" width="200" height="44" fill="#ffffff" stroke="#c9c4ba" stroke-width="1"/>

    <rect x="40" y="226" width="68" height="44" fill="#fbfaf7" stroke="#c9c4ba" stroke-width="1"/>
    <rect x="108" y="226" width="192" height="44" fill="#fbfaf7" stroke="#c9c4ba" stroke-width="1"/>
    <rect x="300" y="226" width="100" height="44" fill="#ffffff" stroke="#c9c4ba" stroke-width="1"/>
    <rect x="400" y="226" width="200" height="44" fill="#fbfaf7" stroke="#c9c4ba" stroke-width="1"/>
  </g>

  <g text-anchor="middle" filter="url(#sk)">
    <text x="74" y="121" font-size="13" font-weight="bold" fill="#4a8edb">L1</text>
    <text x="204" y="121" font-size="13" fill="#444">[5]</text>
    <text x="350" y="121" font-size="13" fill="#444">5</text>
    <text x="500" y="121" font-size="13" fill="#444">[5]</text>

    <text x="74" y="165" font-size="13" font-weight="bold" fill="#4a8e4a">L2</text>
    <text x="204" y="165" font-size="13" fill="#444">[8, 9]</text>
    <text x="350" y="165" font-size="14" font-weight="bold" fill="#2b6e9e">17</text>
    <text x="500" y="165" font-size="13" fill="#444">[5, 17]</text>

    <text x="74" y="209" font-size="13" font-weight="bold" fill="#d6a040">L3</text>
    <text x="204" y="209" font-size="13" fill="#444">[2, 1, 3, 7]</text>
    <text x="350" y="209" font-size="14" font-weight="bold" fill="#b85450">13</text>
    <text x="500" y="209" font-size="13" fill="#444">[5, 17, 13]</text>

    <text x="74" y="253" font-size="13" font-weight="bold" fill="#4a8edb">L4</text>
    <text x="204" y="253" font-size="13" fill="#444">[4, 6]</text>
    <text x="350" y="253" font-size="13" fill="#444">10</text>
    <text x="500" y="253" font-size="13" fill="#444">[5, 17, 13, 10]</text>
  </g>

  <!-- transition -->
  <path d="M 320 274 L 320 296" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="336" y="292" text-anchor="start" font-size="12" fill="#5a5a5a" font-weight="bold" filter="url(#sk)">BFS 结束：len(sums) = 4 ≥ k = 2 ✓</text>

  <!-- sorted boxes -->
  <text x="140" y="331" text-anchor="end" font-size="12" font-weight="bold" fill="#7a7a7a" filter="url(#sk)">降序：</text>
  <g filter="url(#sk)">
    <rect x="156" y="304" width="68" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="252" y="304" width="68" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="348" y="304" width="68" height="44" rx="6" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
    <rect x="444" y="304" width="68" height="44" rx="6" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="190" y="332" fill="#4a8edb">17</text>
    <text x="286" y="332" fill="#b85450">13</text>
    <text x="382" y="332" fill="#666666">10</text>
    <text x="478" y="332" fill="#666666">5</text>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#sk)">
    <text x="190" y="366" fill="#7a7a7a">第 1 大</text>
    <text x="286" y="366" fill="#b85450" font-weight="bold">第 2 大 ✓</text>
    <text x="382" y="366" fill="#7a7a7a">第 3 大</text>
    <text x="478" y="366" fill="#7a7a7a">第 4 大</text>
  </g>

  <!-- footer -->
  <text x="320" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">返回 sums[1] = 13</text>
  <text x="320" y="422" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">若 len(sums) &lt; k（层数不足），直接返回 −1，不进入排序</text>
</svg>
