<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">贪心两条规则：位置最靠左 + 同值最靠右</text>

  <!-- 左面板 -->
  <text x="175" y="54" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">① 交换位置越靠左越好（num = 2736）</text>

  <text x="84" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7@1</text>
  <text x="146" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7@1</text>
  <text x="208" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6@3</text>
  <text x="270" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6@3</text>

  <rect x="56" y="82" width="118" height="54" rx="8" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <rect x="180" y="82" width="118" height="54" rx="8" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <rect x="62" y="86" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="84" y="115" text-anchor="middle" font-size="15" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="124" y="86" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="146" y="115" text-anchor="middle" font-size="15" fill="#2e6e2e" filter="url(#rough2)">7</text>
  <rect x="186" y="86" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="115" text-anchor="middle" font-size="15" fill="#33475b" filter="url(#rough2)">3</text>
  <rect x="248" y="86" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="15" fill="#33475b" filter="url(#rough2)">6</text>

  <text x="115" y="154" text-anchor="middle" font-size="9.2" fill="#8a6d1f" filter="url(#rough2)">换这两格 ⇒ 7236</text>
  <text x="239" y="154" text-anchor="middle" font-size="9.2" fill="#888" filter="url(#rough2)">也能变大，但更靠右 ⇒ 2763</text>

  <text x="44" y="216" text-anchor="end" font-size="10" fill="#333" filter="url(#rough2)">结果</text>
  <rect x="62" y="190" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="217" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#rough2)">7</text>
  <rect x="124" y="190" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="217" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#rough2)">2</text>
  <rect x="186" y="190" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="217" text-anchor="middle" font-size="14" fill="#33475b" filter="url(#rough2)">3</text>
  <rect x="248" y="190" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="217" text-anchor="middle" font-size="14" fill="#33475b" filter="url(#rough2)">6</text>

  <text x="175" y="258" text-anchor="middle" font-size="9.2" fill="#666" filter="url(#rough2)">字母标签 7@1 表示「该位置右侧最大值为 7，位于下标 1」</text>

  <!-- 右面板 -->
  <path d="M352,52 L352,296" stroke="#ddd" stroke-width="1.3" stroke-dasharray="6,5" filter="url(#rough2)"/>
  <text x="526" y="54" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">② 同值时取最靠右的最大位（1999）</text>

  <text x="366" y="94" font-size="9.5" fill="#666" filter="url(#rough2)">换 @1</text>
  <rect x="430" y="76" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="443" y="94" text-anchor="middle" font-size="11" fill="#33475b" filter="url(#rough2)">9</text>
  <rect x="458" y="76" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="471" y="94" text-anchor="middle" font-size="11" fill="#33475b" filter="url(#rough2)">1</text>
  <rect x="486" y="76" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="499" y="94" text-anchor="middle" font-size="11" fill="#33475b" filter="url(#rough2)">9</text>
  <rect x="514" y="76" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="527" y="94" text-anchor="middle" font-size="11" fill="#33475b" filter="url(#rough2)">9</text>
  <text x="548" y="94" font-size="9.5" fill="#888" filter="url(#rough2)">9199</text>

  <text x="366" y="132" font-size="9.5" fill="#666" filter="url(#rough2)">换 @2</text>
  <rect x="430" y="114" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="443" y="132" text-anchor="middle" font-size="11" fill="#33475b" filter="url(#rough2)">9</text>
  <rect x="458" y="114" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="471" y="132" text-anchor="middle" font-size="11" fill="#33475b" filter="url(#rough2)">9</text>
  <rect x="486" y="114" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="499" y="132" text-anchor="middle" font-size="11" fill="#33475b" filter="url(#rough2)">1</text>
  <rect x="514" y="114" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="527" y="132" text-anchor="middle" font-size="11" fill="#33475b" filter="url(#rough2)">9</text>
  <text x="548" y="132" font-size="9.5" fill="#888" filter="url(#rough2)">9919</text>

  <text x="366" y="170" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">换 @3</text>
  <rect x="430" y="152" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="443" y="170" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">9</text>
  <rect x="458" y="152" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="471" y="170" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">9</text>
  <rect x="486" y="152" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="499" y="170" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">9</text>
  <rect x="514" y="152" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="527" y="170" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="548" y="170" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">9991 ✓</text>

  <text x="526" y="206" text-anchor="middle" font-size="9.2" fill="#666" filter="url(#rough2)">首位换成 9 后，剩下的 9 越靠前越大</text>
  <text x="526" y="224" text-anchor="middle" font-size="9.2" fill="#666" filter="url(#rough2)">⇒ 与最右边的 9 交换，后缀字典序最大</text>
  <text x="526" y="252" text-anchor="middle" font-size="9.2" fill="#446688" filter="url(#rough2)">同理 98368 ⇒ 98863（3 与最右的 8 交换）</text>

  <!-- 底部说明 -->
  <rect x="40" y="304" width="620" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="328" text-anchor="middle" font-size="9.6" fill="#446688" filter="url(#rough2)">规则①：在所有「右边存在更大数字」的位置里选最靠左的 i —— 修最高位收益最大，一位胜过后面所有位</text>
  <text x="350" y="350" text-anchor="middle" font-size="9.6" fill="#446688" filter="url(#rough2)">规则②：右侧有多个相同最大值时选最靠右的 j —— 其他大数字留在前面，剩余序列字典序最大</text>
</svg>
