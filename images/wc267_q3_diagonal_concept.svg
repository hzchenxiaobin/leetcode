<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="117" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a94a0"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="640" height="490" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">编码 = 斜向写入 + 按行读出（"cipher"，rows=3 → cols=4）</text>
  <path d="M 120 38 Q 320 48 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 对角线编号 -->
  <text x="242" y="56" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a8edb">k=0</text>
  <text x="294" y="56" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c98a2b">k=1</text>
  <text x="346" y="56" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#999">k=2</text>
  <text x="398" y="56" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#999">k=3</text>

  <!-- 行标签 -->
  <text x="208" y="91" text-anchor="end" font-size="10" fill="#888">行0</text>
  <text x="208" y="137" text-anchor="end" font-size="10" fill="#888">行1</text>
  <text x="208" y="183" text-anchor="end" font-size="10" fill="#888">行2</text>

  <!-- 矩阵：3 行 4 列 -->
  <g filter="url(#sk)"><rect x="216" y="64" width="52" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="242" y="93" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">c</text>
  <g filter="url(#sk)"><rect x="268" y="64" width="52" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="294" y="93" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">h</text>
  <g filter="url(#sk)"><rect x="320" y="64" width="52" height="46" rx="4" fill="#f2f2ee" stroke="#b8b8b0" stroke-width="1.4"/></g>
  <text x="346" y="93" text-anchor="middle" font-size="14" fill="#999">·</text>
  <g filter="url(#sk)"><rect x="372" y="64" width="52" height="46" rx="4" fill="#f2f2ee" stroke="#b8b8b0" stroke-width="1.4"/></g>
  <text x="398" y="93" text-anchor="middle" font-size="14" fill="#999">·</text>

  <g filter="url(#sk)"><rect x="216" y="110" width="52" height="46" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="3 3"/></g>
  <g filter="url(#sk)"><rect x="268" y="110" width="52" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="294" y="139" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">i</text>
  <g filter="url(#sk)"><rect x="320" y="110" width="52" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="346" y="139" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">e</text>
  <g filter="url(#sk)"><rect x="372" y="110" width="52" height="46" rx="4" fill="#f2f2ee" stroke="#b8b8b0" stroke-width="1.4"/></g>
  <text x="398" y="139" text-anchor="middle" font-size="14" fill="#999">·</text>

  <g filter="url(#sk)"><rect x="216" y="156" width="52" height="46" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="3 3"/></g>
  <g filter="url(#sk)"><rect x="268" y="156" width="52" height="46" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="3 3"/></g>
  <g filter="url(#sk)"><rect x="320" y="156" width="52" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="346" y="185" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">p</text>
  <g filter="url(#sk)"><rect x="372" y="156" width="52" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="398" y="185" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">r</text>

  <!-- 对角线推进箭头 -->
  <path d="M 260 101 L 272 113" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 312 147 L 324 159" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 312 101 L 324 113" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 364 147 L 376 159" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- 写完一条对角线回到顶行 -->
  <path d="M 318 186 C 110 205, 110 75, 288 62" stroke="#8a94a0" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="150" y="232" text-anchor="middle" font-size="10.5" fill="#8a94a0">写完一条对角线 → 回顶行，起点右移一格</text>

  <!-- 图例（右上） -->
  <g filter="url(#sk)"><rect x="452" y="74" width="14" height="14" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="472" y="85" font-size="10.5" fill="#555">对角线 k=0（文本 cip）</text>
  <g filter="url(#sk)"><rect x="452" y="96" width="14" height="14" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="472" y="107" font-size="10.5" fill="#555">对角线 k=1（文本 her）</text>
  <g filter="url(#sk)"><rect x="452" y="118" width="14" height="14" rx="3" fill="#f2f2ee" stroke="#b8b8b0" stroke-width="1.4"/></g>
  <text x="472" y="129" font-size="10.5" fill="#555">填充空格（k=2、k=3）</text>
  <g filter="url(#sk)"><rect x="452" y="140" width="14" height="14" rx="3" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="3 3"/></g>
  <text x="472" y="151" font-size="10.5" fill="#555">左下三角 j&lt;i：从不写入</text>
  <g filter="url(#sk)"><rect x="452" y="162" width="14" height="14" rx="3" fill="#fafafa" stroke="#ccc" stroke-width="1"/></g>
  <text x="459" y="174" text-anchor="middle" font-size="13" fill="#999">·</text>
  <text x="472" y="173" font-size="10.5" fill="#555">· 表示空格</text>

  <!-- 一维条带：行主序展开 -->
  <path d="M 68 244 L 68 236 L 236 236 L 236 244" stroke="#8a94a0" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 236 244 L 236 236 L 404 236 L 404 244" stroke="#8a94a0" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 404 244 L 404 236 L 572 236 L 572 244" stroke="#8a94a0" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="152" y="230" text-anchor="middle" font-size="10.5" fill="#8a94a0">行 0 →</text>
  <text x="320" y="230" text-anchor="middle" font-size="10.5" fill="#8a94a0">行 1 →</text>
  <text x="488" y="230" text-anchor="middle" font-size="10.5" fill="#8a94a0">行 2 →</text>

  <g filter="url(#sk)"><rect x="68" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="89" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">c</text>
  <g filter="url(#sk)"><rect x="110" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="131" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">h</text>
  <g filter="url(#sk)"><rect x="152" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="173" y="268" text-anchor="middle" font-size="12" fill="#999">·</text>
  <g filter="url(#sk)"><rect x="194" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="215" y="268" text-anchor="middle" font-size="12" fill="#999">·</text>
  <g filter="url(#sk)"><rect x="236" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="257" y="268" text-anchor="middle" font-size="12" fill="#999">·</text>
  <g filter="url(#sk)"><rect x="278" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="299" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">i</text>
  <g filter="url(#sk)"><rect x="320" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="341" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">e</text>
  <g filter="url(#sk)"><rect x="362" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="383" y="268" text-anchor="middle" font-size="12" fill="#999">·</text>
  <g filter="url(#sk)"><rect x="404" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="425" y="268" text-anchor="middle" font-size="12" fill="#999">·</text>
  <g filter="url(#sk)"><rect x="446" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="467" y="268" text-anchor="middle" font-size="12" fill="#999">·</text>
  <g filter="url(#sk)"><rect x="488" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="509" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">p</text>
  <g filter="url(#sk)"><rect x="530" y="246" width="42" height="34" rx="3" fill="#ffffff" stroke="#aab4be" stroke-width="1.3"/></g>
  <text x="551" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">r</text>

  <text x="89" y="294" text-anchor="middle" font-size="9.5" fill="#999">0</text>
  <text x="131" y="294" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="173" y="294" text-anchor="middle" font-size="9.5" fill="#999">2</text>
  <text x="215" y="294" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="257" y="294" text-anchor="middle" font-size="9.5" fill="#999">4</text>
  <text x="299" y="294" text-anchor="middle" font-size="9.5" fill="#999">5</text>
  <text x="341" y="294" text-anchor="middle" font-size="9.5" fill="#999">6</text>
  <text x="383" y="294" text-anchor="middle" font-size="9.5" fill="#999">7</text>
  <text x="425" y="294" text-anchor="middle" font-size="9.5" fill="#999">8</text>
  <text x="467" y="294" text-anchor="middle" font-size="9.5" fill="#999">9</text>
  <text x="509" y="294" text-anchor="middle" font-size="9.5" fill="#999">10</text>
  <text x="551" y="294" text-anchor="middle" font-size="9.5" fill="#999">11</text>

  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#666">encodedText = "ch···ie···pr"（长度 n = 12 = rows × cols）</text>

  <!-- 高亮对应关系 -->
  <g filter="url(#sk)"><rect x="314" y="104" width="62" height="58" rx="6" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4"/></g>
  <g filter="url(#sk)"><rect x="316" y="242" width="50" height="44" rx="6" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4"/></g>
  <text x="320" y="346" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">M[1][2] = encodedText[1×4+2] = encodedText[6] = 'e'</text>

  <!-- 观察框 -->
  <g filter="url(#sk)"><rect x="48" y="366" width="544" height="108" rx="10" fill="#fff8e8" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="320" y="392" text-anchor="middle" font-size="12" fill="#7a5415"><tspan font-weight="bold">观察一（行主序双射）</tspan>：encodedText 就是矩阵的行主序展开</text>
  <text x="320" y="412" text-anchor="middle" font-size="12" fill="#7a5415">M[i][j] = encodedText[i×cols+j] —— 不建矩阵也能"看"任意格子</text>
  <text x="320" y="438" text-anchor="middle" font-size="12" fill="#7a5415"><tspan font-weight="bold">观察二（对角线序）</tspan>：文本只经过 j≥i 的格子，逐条枚举起点 (0,k)</text>
  <text x="320" y="458" text-anchor="middle" font-size="12" fill="#7a5415">沿 (i, k+i) 收集 → 尾部 rstrip → 原文</text>
</svg>
