<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="372" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">子字符串匹配：在 '*' 处把模式串切成两段</text>
  <text filter="url(#rough2)" x="290" y="48" text-anchor="middle" font-size="11" fill="#888">'*' 可换成任意串 ⇒ 左段要出现在右段的左边（可隔开）</text>

  <text filter="url(#rough2)" x="24" y="106" font-size="12" fill="#333" font-weight="bold">s =</text>

  <g filter="url(#rough2)">
    <rect x="66" y="84" width="44" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="114" y="84" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="162" y="84" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="210" y="84" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="258" y="84" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="306" y="84" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="354" y="84" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="402" y="84" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="16" text-anchor="middle" font-weight="bold">
    <text x="88" y="112" fill="#777">l</text>
    <text x="136" y="112" fill="#4a7a3a">e</text>
    <text x="184" y="112" fill="#4a7a3a">e</text>
    <text x="232" y="112" fill="#a5822a">t</text>
    <text x="280" y="112" fill="#a5822a">c</text>
    <text x="328" y="112" fill="#a5822a">o</text>
    <text x="376" y="112" fill="#a5822a">d</text>
    <text x="424" y="112" fill="#446688">e</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="88" y="140">0</text>
    <text x="136" y="140">1</text>
    <text x="184" y="140">2</text>
    <text x="232" y="140">3</text>
    <text x="280" y="140">4</text>
    <text x="328" y="140">5</text>
    <text x="376" y="140">6</text>
    <text x="424" y="140">7</text>
  </g>

  <text filter="url(#rough2)" x="460" y="106" font-size="11" fill="#4a7a3a" font-weight="bold">left = "ee"</text>
  <text filter="url(#rough2)" x="460" y="124" font-size="11" fill="#446688" font-weight="bold">right = "e"</text>
  <text filter="url(#rough2)" x="460" y="142" font-size="10" fill="#a5822a">中间段随意</text>

  <path d="M 150 150 L 150 176" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 420 150 L 420 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="66" y="180" width="382" height="74" fill="#eef3f8" stroke="#8899aa" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="78" y="202" font-size="11.5" fill="#3a4a66" font-weight="bold">最左上下文（把 '*' 撑到最大）</text>
  <text filter="url(#rough2)" x="78" y="222" font-size="10.8" fill="#555">① 在 s 中找 left 的最左出现 → i = 1，占 s[1..2]</text>
  <text filter="url(#rough2)" x="78" y="242" font-size="10.8" fill="#555">② 从 i + |left| = 3 开始找 right → 命中下标 7，3 ≤ 7 ✓</text>

  <rect x="66" y="272" width="440" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="80" y="296" font-size="11.5" fill="#8a3a36" font-weight="bold">判定成功的等价形式</text>
  <text filter="url(#rough2)" x="80" y="318" font-size="11" fill="#444">存在 $l \le r$：s[l..l+|left|) = left 且 s[r..r+|right|) = right</text>
  <text filter="url(#rough2)" x="80" y="338" font-size="11" fill="#444">取 l 为 left 最左出现、r 为 right 最右出现，是一组最宽松的可行解</text>

  <text filter="url(#rough2)" x="290" y="366" text-anchor="middle" font-size="10" fill="#999">子串 s[1..7] = "eetcode" = "ee" + 任意串 "tcod" + "e"，答案为 true</text>
</svg>
