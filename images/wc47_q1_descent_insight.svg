<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：下降点至多一处，改法只有二选一</text>

  <!-- 数组 [1,1,4,2,3]，下降点 i = 2 -->
  <text x="206" y="52" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">i−1</text>
  <text x="260" y="52" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i</text>
  <text x="314" y="52" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i+1</text>

  <rect x="128" y="60" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="60" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="236" y="60" width="48" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="290" y="60" width="48" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="344" y="60" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <rect x="232" y="56" width="110" height="52" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>

  <text x="260" y="126" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums[i] &gt; nums[i+1] ⇒ 下降点 i</text>
  <text x="260" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">唯一下降点意味着前缀 nums[0..i] 与后缀 nums[i+1..] 各自非递减</text>

  <!-- 方案一：压低左元素 -->
  <rect x="30" y="158" width="222" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="141" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① i = 0 或 nums[i−1] ≤ nums[i+1]</text>
  <text x="141" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">把 nums[i] 压到 nums[i+1]</text>
  <text x="141" y="228" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4 → 2，左边的 1 ≤ 2 仍成立</text>

  <!-- 方案二：抬高右元素 -->
  <rect x="268" y="158" width="222" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="379" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② i &gt; 0 且 nums[i−1] &gt; nums[i+1]</text>
  <text x="379" y="204" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">只能抬高右邻 nums[i+1]</text>
  <text x="379" y="228" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[2,4,1,5] → [2,4,4,5]</text>

  <!-- 结论 -->
  <rect x="30" y="258" width="460" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">一次修改只影响相邻两对 (k−1,k) 与 (k,k+1)，所以两处下降必然无解</text>
  <text x="260" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">抬高会顶到右边元素 ⇒ 交给后续扫描的下降计数兜底</text>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">判定只比两个数：左邻 vs 右邻</text>
</svg>
