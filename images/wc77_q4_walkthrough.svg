<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="700" height="410" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#3d3d3d" font-weight="bold" filter="url(#rough2)">示例走查：nums = [1,2,3,4,5,6,7,8]，S = 36，n = 8，half = 4</text>
  <text x="350" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k 从 1 试到 4：先用 S·k mod n = 0 过筛，再查 dp[k] 的第 target 位</text>

  <g filter="url(#rough2)">
    <rect x="24" y="66" width="652" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="24" y="104" width="652" height="38" fill="#fafafa" stroke="#c8cfd8" stroke-width="1.2" rx="4"/>
    <rect x="24" y="142" width="652" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="4"/>
    <rect x="24" y="180" width="652" height="38" fill="#fafafa" stroke="#c8cfd8" stroke-width="1.2" rx="4"/>
    <rect x="24" y="218" width="652" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <path d="M 92 66 L 92 256" stroke="#c8cfd8" stroke-width="1" fill="none"/>
    <path d="M 214 66 L 214 256" stroke="#c8cfd8" stroke-width="1" fill="none"/>
    <path d="M 306 66 L 306 256" stroke="#c8cfd8" stroke-width="1" fill="none"/>
    <path d="M 474 66 L 474 256" stroke="#c8cfd8" stroke-width="1" fill="none"/>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#3d3d3d">
    <text x="58" y="90" text-anchor="middle" fill="#3a4a66" font-weight="bold">k</text>
    <text x="153" y="90" text-anchor="middle" fill="#3a4a66" font-weight="bold">目标 S·k / n</text>
    <text x="260" y="90" text-anchor="middle" fill="#3a4a66" font-weight="bold">整数？</text>
    <text x="390" y="90" text-anchor="middle" fill="#3a4a66" font-weight="bold">dp[k] 的第 target 位</text>
    <text x="575" y="90" text-anchor="middle" fill="#3a4a66" font-weight="bold">结论</text>

    <text x="58" y="128" text-anchor="middle">1</text>
    <text x="153" y="128" text-anchor="middle">36·1/8 = 4.5</text>
    <text x="260" y="128" text-anchor="middle" fill="#b85450">否</text>
    <text x="390" y="128" text-anchor="middle" fill="#999">—（无整数目标）</text>
    <text x="575" y="128" text-anchor="middle" fill="#888">跳过这一轮</text>

    <text x="58" y="166" text-anchor="middle" font-weight="bold" fill="#2f5a28">2</text>
    <text x="153" y="166" text-anchor="middle" font-weight="bold" fill="#2f5a28">36·2/8 = 9</text>
    <text x="260" y="166" text-anchor="middle" fill="#4a7a3a">是</text>
    <text x="390" y="166" text-anchor="middle" fill="#2f5a28">{1,8} → 1+8 = 9 ✓</text>
    <text x="575" y="166" text-anchor="middle" font-weight="bold" fill="#2f5a28">命中 → 返回 true</text>

    <text x="58" y="204" text-anchor="middle">3</text>
    <text x="153" y="204" text-anchor="middle">36·3/8 = 13.5</text>
    <text x="260" y="204" text-anchor="middle" fill="#b85450">否</text>
    <text x="390" y="204" text-anchor="middle" fill="#999">—（无整数目标）</text>
    <text x="575" y="204" text-anchor="middle" fill="#888">跳过这一轮</text>

    <text x="58" y="242" text-anchor="middle">4</text>
    <text x="153" y="242" text-anchor="middle">36·4/8 = 18</text>
    <text x="260" y="242" text-anchor="middle" fill="#4a7a3a">是</text>
    <text x="390" y="242" text-anchor="middle">{1,4,5,8} = 18 ✓</text>
    <text x="575" y="242" text-anchor="middle" fill="#8a6a20">也会命中（官方示例的切法）</text>
  </g>

  <rect x="24" y="276" width="300" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="174" y="300" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">A = {1, 8}　和 9，2 个</text>
  <text x="174" y="324" text-anchor="middle" font-size="12" fill="#3d3d3d" filter="url(#rough2)">avg = 9 / 2 = 4.5</text>

  <text x="350" y="316" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">=</text>

  <rect x="376" y="276" width="300" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="526" y="300" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">B = {2,3,4,5,6,7}　和 27，6 个</text>
  <text x="526" y="324" text-anchor="middle" font-size="12" fill="#3d3d3d" filter="url(#rough2)">avg = 27 / 6 = 4.5</text>

  <text x="350" y="370" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 k = 2 就已经命中，算法在这里就返回了；k = 4 那行只是复核官方示例给出的切法</text>
  <text x="350" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">若所有 k 都不命中（例如 nums = [3,1]）：S·1/2 = 2，但没有任何单元素和为 2 ⟹ 返回 false</text>
</svg>
