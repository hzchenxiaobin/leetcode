<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 505" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="505" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：连续性只由相邻字符对决定 —— s[i] = s[i−1] + 1</text>
  <path d="M 100 46 Q 340 54 580 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="150" y="60" width="380" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#sk)">「abc…xyz」的子串 ⟺ 内部每相邻字母恰好差 +1</text>
  <text x="340" y="110" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">约束只涉及相邻两个字符 → 每个间隙独立判定，天然适配单趟扫描</text>

  <g filter="url(#sk)"><path d="M 200 126 L 200 152" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 480 126 L 480 152" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="120" y="160" width="44" height="44" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="186" y="160" width="44" height="44" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="252" y="160" width="44" height="44" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="318" y="160" width="44" height="44" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="384" y="160" width="44" height="44" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="450" y="160" width="44" height="44" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="516" y="160" width="44" height="44" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/></g>

  <text x="142" y="188" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">a</text>
  <text x="208" y="188" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">b</text>
  <text x="274" y="188" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">a</text>
  <text x="340" y="188" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">c</text>
  <text x="406" y="188" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">a</text>
  <text x="472" y="188" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">b</text>
  <text x="538" y="188" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">a</text>

  <text x="175" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">✓</text>
  <text x="175" y="203" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">+1</text>
  <text x="241" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="241" y="203" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">−1</text>
  <text x="307" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="307" y="203" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">+2</text>
  <text x="373" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="373" y="203" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">−2</text>
  <text x="439" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">✓</text>
  <text x="439" y="203" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">+1</text>
  <text x="505" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="505" y="203" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">−1</text>

  <g filter="url(#sk)"><rect x="118" y="222" width="114" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="175" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ab → 2</text>
  <g filter="url(#sk)"><rect x="250" y="222" width="48" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="274" y="244" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">a → 1</text>
  <g filter="url(#sk)"><rect x="316" y="222" width="48" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="340" y="244" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">c → 1</text>
  <g filter="url(#sk)"><rect x="382" y="222" width="114" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="439" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ab → 2</text>
  <g filter="url(#sk)"><rect x="514" y="222" width="48" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="538" y="244" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">a → 1</text>

  <text x="340" y="280" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">差 ≠ +1 的间隙即切分点：整串被切成 5 个极大连续段</text>

  <g filter="url(#sk)"><rect x="190" y="294" width="300" height="36" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="340" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#a03a3a" filter="url(#sk)">ans = max{2, 1, 1, 2, 1} = 2</text>

  <g filter="url(#sk)"><rect x="42" y="350" width="292" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="188" y="376" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ 间隙差 +1 → cur = cur + 1</text>
  <text x="188" y="400" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">当前段向右延续一个字符</text>
  <text x="188" y="424" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">cur 恰是「以 i 结尾」的段长</text>

  <g filter="url(#sk)"><rect x="346" y="350" width="292" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="492" y="376" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">✗ 间隙差 ≠ +1 → cur = 1</text>
  <text x="492" y="400" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">段在此间隙处断开</text>
  <text x="492" y="424" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">s[i] 自成新段的第一个字符</text>

  <g filter="url(#sk)"><rect x="42" y="458" width="596" height="36" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="340" y="481" text-anchor="middle" font-size="12" font-weight="bold" fill="#a03a3a" filter="url(#sk)">⚠️ a→c 差 +2 不算（跳过字母）；z→a 环绕不算；答案上限 26（整个字母表）</text>
</svg>
