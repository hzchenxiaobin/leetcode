<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：特判 0 → 符号外提 → 短除 → 反转</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每轮循环只产生一个 7 进制位，循环次数 = 位数 ≈ log₇|num|</text>

  <g filter="url(#rough2)">
    <rect x="190" y="56" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16"/>
    <text x="280" y="77" text-anchor="middle" font-size="12" fill="#334">convertToBase7(num)</text>
  </g>

  <path d="M 280 88 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,108 380,140 280,172 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="145" text-anchor="middle" font-size="12" fill="#8a6a20">num == 0 ?</text>
  </g>

  <path d="M 380 140 L 422 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="426" y="118" width="112" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="482" y="145" text-anchor="middle" font-size="12" fill="#3a5a30">返回 “0”</text>
  </g>

  <path d="M 280 172 L 280 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="190" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="140" y="200" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="156" y="220" font-size="11" fill="#334">neg = num &lt; 0，n = |num|</text>
    <text x="156" y="237" font-size="11" fill="#334">res = 空的数字序列</text>
  </g>

  <path d="M 280 246 L 280 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,274 380,306 280,338 180,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="311" text-anchor="middle" font-size="12" fill="#8a6a20">n &gt; 0 ?</text>
  </g>

  <path d="M 280 338 L 280 354" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="350" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="150" y="356" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="166" y="376" font-size="11" fill="#334">res 追加一位：n % 7</text>
    <text x="166" y="393" font-size="11" fill="#334">n = n // 7（整除向下）</text>
  </g>

  <path d="M 150 380 L 110 380 L 110 306 L 174 306" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="352" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">循环</text>

  <path d="M 380 306 L 470 306 L 470 478 L 414 478" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="298" font-size="10" fill="#b85450" filter="url(#rough2)">否（n = 0）</text>

  <g filter="url(#rough2)">
    <rect x="150" y="450" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="166" y="472" font-size="11" fill="#3a5a30">若 neg，则答案最前面补一个 '-'</text>
    <text x="166" y="490" font-size="11" fill="#3a5a30">反转 res 的顺序，返回字符串</text>
  </g>
</svg>
