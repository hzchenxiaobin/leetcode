<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 406" width="620" height="406" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="406" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">懒删除：堆里只放「内部间隙」，出堆时用双向链表验真</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个已坐座位在链表中记录前后邻居；间隙失效时 nxt[l] 已不是 r</text>
  <text x="130" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">已坐座位的双向链表</text>
  <rect x="56" y="106" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="128.5" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="148" y="106" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="128.5" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="240" y="106" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="128.5" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">9</text>
  <path d="M 112 116 L 146 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 146 134 L 114 134" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 204 116 L 238 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 238 134 L 206 134" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="130" y="162" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">prv ← / nxt →（头尾为 None）</text>
  <text x="430" y="92" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">最小堆（按 −距离 排序）</text>
  <rect x="330" y="104" width="132" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="122.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">(−4, 4, 0, 9)</text>
  <rect x="470" y="104" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="122.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">有效 ✓</text>
  <rect x="330" y="138" width="132" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="156.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">(−1, 1, 0, 2)</text>
  <rect x="470" y="138" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="156.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">有效 ✓</text>
  <rect x="330" y="172" width="132" height="30" fill="#efefef" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="190.8" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">(−1, 3, 2, 4)</text>
  <rect x="470" y="172" width="100" height="30" fill="#efefef" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="190.8" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">已过期 ✗</text>
  <rect x="330" y="206" width="132" height="30" fill="#efefef" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="224.8" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">(−1, 8, 2, 9)</text>
  <rect x="470" y="206" width="100" height="30" fill="#efefef" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="224.8" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">已过期 ✗</text>
  <path d="M 414 119 L 424 119" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="40" y="254" width="540" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="272" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">入堆时机：新间隙诞生（有人坐下把大间隙劈成两半，或有人离开把两段合并）。</text>
  <text x="50" y="286.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">出堆时机：seat() 取候选之前，循环查看堆顶 (l, r)，若 nxt[l] ≠ r 就说明它早已被拆掉，直接丢弃。</text>
  <text x="50" y="301.8" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">这样每次插入/删除只产生 O(1) 个新间隙，堆里最多 O(调用次数) 条记录。</text>
  <text x="40" y="356" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">不变量 ①：链表里 l 与 r 相邻 ⇔ 堆中 (l, r) 是真间隙</text>
  <text x="40" y="380" text-anchor="start" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">不变量 ②：每个空隙的候选座位 = l + (r − l) // 2，距离 = (r − l) // 2</text>
</svg>
