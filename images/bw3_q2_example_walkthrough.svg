<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：S = “havefunonleetcode”，K = 5，13 个窗口中 6 个合法</text>

  <g filter="url(#rough2)">
    <rect x="55" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="85" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="115" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="145" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="175" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="205" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="235" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="265" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="295" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="325" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="355" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="385" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="415" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="445" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="475" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="505" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="535" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">
    <text x="69" y="68">h</text><text x="99" y="68">a</text><text x="129" y="68">v</text><text x="159" y="68">e</text>
    <text x="189" y="68">f</text><text x="219" y="68">u</text><text x="249" y="68">n</text><text x="279" y="68">o</text>
    <text x="309" y="68" fill="#b85450">n</text><text x="339" y="68">l</text><text x="369" y="68" fill="#b85450">e</text>
    <text x="399" y="68" fill="#b85450">e</text><text x="429" y="68">t</text><text x="459" y="68">c</text>
    <text x="489" y="68">o</text><text x="519" y="68">d</text><text x="549" y="68">e</text>
  </g>

  <g filter="url(#rough2)" font-size="8" text-anchor="middle" fill="#999">
    <text x="69" y="92">0</text><text x="99" y="92">1</text><text x="129" y="92">2</text><text x="159" y="92">3</text>
    <text x="189" y="92">4</text><text x="219" y="92">5</text><text x="249" y="92">6</text><text x="279" y="92">7</text>
    <text x="309" y="92">8</text><text x="339" y="92">9</text><text x="369" y="92">10</text><text x="399" y="92">11</text>
    <text x="429" y="92">12</text><text x="459" y="92">13</text><text x="489" y="92">14</text>
    <text x="519" y="92">15</text><text x="549" y="92">16</text>
  </g>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="69" y="124" fill="#4a7a3a">✓</text><text x="99" y="124" fill="#4a7a3a">✓</text><text x="129" y="124" fill="#4a7a3a">✓</text><text x="159" y="124" fill="#4a7a3a">✓</text>
    <text x="189" y="124" fill="#b85450">✗</text><text x="219" y="124" fill="#b85450">✗</text><text x="249" y="124" fill="#b85450">✗</text><text x="279" y="124" fill="#b85450">✗</text>
    <text x="309" y="124" fill="#b85450">✗</text><text x="339" y="124" fill="#b85450">✗</text><text x="369" y="124" fill="#b85450">✗</text><text x="399" y="124" fill="#4a7a3a">✓</text>
    <text x="429" y="124" fill="#4a7a3a">✓</text>
  </g>

  <g filter="url(#rough2)" font-size="8.5" text-anchor="middle" fill="#b85450">
    <text x="189" y="142">n×2</text><text x="219" y="142">n×2</text><text x="249" y="142">n×2</text>
    <text x="279" y="142">e×2</text><text x="309" y="142">e×2</text><text x="339" y="142">e×2</text><text x="369" y="142">e×2</text>
  </g>
  <text x="540" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 合法：distinct = k</text>
  <text x="540" y="136" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 含重复字符</text>
  <text x="320" y="152" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">上方 ✓/✗ 对齐各窗口的起点下标；✗ 下方标注重复的是哪个字母</text>

  <rect x="55" y="158" width="530" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="182" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">合法窗口 6 个：havef、avefu、vefun、efuno、etcod、tcode</text>
  <text x="320" y="204" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">起点下标 {0, 1, 2, 3, 11, 12}：长度恰为 5 且 distinct = 5（互异）</text>

  <rect x="55" y="236" width="530" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="258" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">中段 7 个窗口为何全灭？</text>
  <text x="320" y="278" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">起点 4–6：窗口必含 s[6] = s[8] = “n”（funon、unonl、nonle）</text>
  <text x="320" y="298" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">起点 7–10：窗口必含 s[10] = s[11] = “e”（onlee、nleet、leetc、eetco）</text>

  <text x="320" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对照：示例 2 S = “home”，K = 5 &gt; n = 4，窗口根本凑不齐 → 输出 0</text>
</svg>
