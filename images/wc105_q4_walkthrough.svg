<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 316"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="316" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例：n = 2，goal = 3，k = 1 → 答案 2</text>
  <rect x="60" y="58" width="70" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="79.96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="146" y="58" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="191.0" y="79.96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">dp[i][1]</text>
  <rect x="252" y="58" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="297.0" y="79.96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">dp[i][2]</text>
  <rect x="358" y="58" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403.0" y="79.96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">…</text>
  <rect x="464" y="58" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="564.0" y="79.96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">计算过程</text>
  <rect x="60" y="102" width="70" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="146" y="102" width="90" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="191.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="102" width="90" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="297.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="358" y="102" width="90" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="464" y="102" width="200" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="564.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">—</text>
  <rect x="60" y="146" width="70" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="146" y="146" width="90" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="191.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="252" y="146" width="90" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="297.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="358" y="146" width="90" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="464" y="146" width="200" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="564.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[1][1] = 1 × (2−0) = 2</text>
  <rect x="60" y="190" width="70" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="146" y="190" width="90" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="191.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="252" y="190" width="90" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="297.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="358" y="190" width="90" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="464" y="190" width="200" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="564.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[2][2] = 2 × (2−1) = 2；dp[2][1] = 0</text>
  <rect x="60" y="234" width="70" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="146" y="234" width="90" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="191.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="252" y="234" width="90" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="297.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="358" y="234" width="90" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="464" y="234" width="200" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="564.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[3][2] = dp[2][2] × (2−1) = 2</text>
  <text x="340" y="296" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">合法的两个播放列表：[1,2,1] 与 [2,1,2]；重复的歌必须间隔至少 k=1 首</text>
</svg>
