<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [5, 4, 3, 8] 全过程</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="66" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">绿色 = 新元素落入的数组（每步恰好一个数组接收）</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="28" y="78" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="92" y="78" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="156" y="78" width="200" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="356" y="78" width="128" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="484" y="78" width="128" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="60" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">步骤</text>
  <text x="124" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">nums[i]</text>
  <text x="256" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">尾元素比较</text>
  <text x="420" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">arr1</text>
  <text x="548" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">arr2</text>

  <!-- 第 1 行：操作 1 -->
  <g filter="url(#rough2)">
    <rect x="28" y="112" width="64" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="92" y="112" width="64" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="156" y="112" width="200" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="356" y="112" width="128" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="484" y="112" width="128" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="60" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">操作 1</text>
  <text x="124" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="256" y="139" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">—（规则固定给 arr1）</text>
  <text x="420" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">[5]</text>
  <text x="548" y="139" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">—</text>

  <!-- 第 2 行：操作 2 -->
  <g filter="url(#rough2)">
    <rect x="28" y="156" width="64" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="92" y="156" width="64" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="156" y="156" width="200" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="356" y="156" width="128" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="484" y="156" width="128" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="60" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">操作 2</text>
  <text x="124" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="256" y="183" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">—（规则固定给 arr2）</text>
  <text x="420" y="183" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#rough2)">[5]</text>
  <text x="548" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">[4]</text>

  <!-- 第 3 行：操作 3 -->
  <g filter="url(#rough2)">
    <rect x="28" y="200" width="64" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="92" y="200" width="64" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="156" y="200" width="200" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="356" y="200" width="128" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="484" y="200" width="128" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="60" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">操作 3</text>
  <text x="124" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="256" y="227" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">5 ＞ 4 → 归 arr1</text>
  <text x="420" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">[5, 3]</text>
  <text x="548" y="227" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#rough2)">[4]</text>

  <!-- 第 4 行：操作 4 -->
  <g filter="url(#rough2)">
    <rect x="28" y="244" width="64" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="92" y="244" width="64" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="156" y="244" width="200" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="356" y="244" width="128" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="484" y="244" width="128" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="60" y="271" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">操作 4</text>
  <text x="124" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="256" y="265" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">3 ＜ 4 → 归 arr2</text>
  <text x="256" y="281" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">（比较方向反转！）</text>
  <text x="420" y="271" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#rough2)">[5, 3]</text>
  <text x="548" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">[4, 8]</text>

  <!-- 结果行 -->
  <g filter="url(#rough2)">
    <rect x="28" y="292" width="584" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="320" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" font-family="monospace" filter="url(#rough2)">result = [5, 3] ++ [4, 8] = [5, 3, 4, 8]</text>
  <text x="320" y="331" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">与示例输出一致 ✓</text>

  <!-- 关键点注释 -->
  <g filter="url(#rough2)">
    <rect x="60" y="348" width="520" height="44" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">关键：第 3 步把 3 放进 arr1 后，arr1 的尾从 5 变成 3</text>
  <text x="320" y="384" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">第 4 步比较随之反转：arr2 的尾 4 更大，于是 8 归 arr2</text>
</svg>
