<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：start = 3 的逐分钟感染（配色按分钟）</text>
  <path d="M 140 42 Q 320 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- tree -->
  <g stroke="#b0b0b0" stroke-width="1.8" filter="url(#sk)">
    <line x1="205" y1="100" x2="135" y2="180"/>
    <line x1="205" y1="100" x2="280" y2="180"/>
    <line x1="135" y1="180" x2="178" y2="260"/>
    <line x1="280" y1="180" x2="252" y2="260"/>
    <line x1="280" y1="180" x2="325" y2="260"/>
    <line x1="178" y1="260" x2="135" y2="335"/>
    <line x1="178" y1="260" x2="222" y2="335"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="205" cy="100" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="135" cy="180" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="280" cy="180" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.6"/>
    <circle cx="178" cy="260" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="252" cy="260" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="325" cy="260" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="135" cy="335" r="19" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="222" cy="335" r="19" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#sk)">
    <text x="205" y="105">1</text>
    <text x="135" y="185">5</text>
    <text x="280" y="185" fill="#b85450">3</text>
    <text x="178" y="265">4</text>
    <text x="252" y="265">10</text>
    <text x="325" y="265">6</text>
    <text x="135" y="340">9</text>
    <text x="222" y="340">2</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">
    <text x="205" y="130">d=1</text>
    <text x="135" y="210">d=2</text>
    <text x="280" y="210">d=0</text>
    <text x="178" y="290">d=3</text>
    <text x="252" y="290">d=1</text>
    <text x="325" y="290">d=1</text>
    <text x="135" y="365">d=4</text>
    <text x="222" y="365">d=4</text>
  </g>
  <text x="255" y="173" text-anchor="end" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">start</text>
  <text x="205" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">（配色同核心观察图：按感染分钟着色，d = 距离 = 分钟）</text>

  <!-- BFS layer table -->
  <g filter="url(#sk)">
    <rect x="380" y="120" width="48" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="428" y="120" width="80" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="508" y="120" width="117" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">
    <text x="404" y="137">分钟 d</text>
    <text x="468" y="137">新感染</text>
    <text x="566" y="137">感染来源</text>
  </g>

  <g filter="url(#sk)">
    <rect x="380" y="146" width="48" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="428" y="146" width="80" height="30" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="508" y="146" width="117" height="30" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="404" y="165" font-weight="bold" fill="#b85450">0</text>
    <text x="468" y="165" font-weight="bold">3</text>
    <text x="566" y="165">起点</text>
  </g>

  <g filter="url(#sk)">
    <rect x="380" y="176" width="48" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="428" y="176" width="80" height="30" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="508" y="176" width="117" height="30" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="404" y="195" font-weight="bold" fill="#b8860b">1</text>
    <text x="468" y="195" font-weight="bold">1、10、6</text>
    <text x="566" y="195">3 的父 + 左右子</text>
  </g>

  <g filter="url(#sk)">
    <rect x="380" y="206" width="48" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="428" y="206" width="80" height="30" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="508" y="206" width="117" height="30" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="404" y="225" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="468" y="225" font-weight="bold">5</text>
    <text x="566" y="225">1 的另一侧孩子</text>
  </g>

  <g filter="url(#sk)">
    <rect x="380" y="236" width="48" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="428" y="236" width="80" height="30" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="508" y="236" width="117" height="30" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="404" y="255" font-weight="bold" fill="#446688">3</text>
    <text x="468" y="255" font-weight="bold">4</text>
    <text x="566" y="255">5 的右子</text>
  </g>

  <g filter="url(#sk)">
    <rect x="380" y="266" width="48" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="428" y="266" width="80" height="30" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="508" y="266" width="117" height="30" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="404" y="285" font-weight="bold" fill="#777">4</text>
    <text x="468" y="285" font-weight="bold">9、2</text>
    <text x="566" y="285">4 的左右子</text>
  </g>

  <g filter="url(#sk)">
    <rect x="380" y="310" width="245" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="502" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">最大层 d = 4 → 答案 4 ✓</text>

  <!-- bottom variant note -->
  <g filter="url(#sk)">
    <rect x="40" y="402" width="585" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="332" y="425" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">自拟变体 start = 5：第 1 分钟同时感染「右子 4」与「父 1」——上行边登场</text>
  <text x="332" y="446" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">只算子树高度得 h(5) = 2；正确答案是 3（最远点 10/6，路径 5→1→3→10）</text>
</svg>
