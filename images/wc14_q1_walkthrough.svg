<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：三种位长，同一条公式</text>
  <text x="310" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">补数 = num ^ (2^k − 1)，k = num 的二进制长度</text>

  <text x="40" y="78" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">num</text>
  <text x="150" y="78" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">num 的二进制（无前导零）</text>
  <text x="352" y="78" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">k</text>
  <text x="392" y="78" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">mask = 2^k − 1</text>
  <text x="512" y="78" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">结果</text>
  <path d="M 30 86 L 590 86" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="28" y="94" width="564" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="40" y="116" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">5</text>
  <text x="150" y="116" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">101</text>
  <text x="352" y="116" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">3</text>
  <text x="392" y="116" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">7</text>
  <text x="512" y="116" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">010 = 2</text>

  <rect x="28" y="136" width="564" height="34" fill="#f3f6fb" stroke="#9aa7b8" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="40" y="158" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">1</text>
  <text x="150" y="158" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">1</text>
  <text x="352" y="158" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">1</text>
  <text x="392" y="158" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">1</text>
  <text x="512" y="158" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">0 = 0</text>

  <rect x="28" y="178" width="564" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="40" y="200" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">10</text>
  <text x="150" y="200" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">1010</text>
  <text x="352" y="200" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">4</text>
  <text x="392" y="200" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">15</text>
  <text x="512" y="200" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">0101 = 5</text>

  <rect x="28" y="220" width="564" height="34" fill="#f3f6fb" stroke="#9aa7b8" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="40" y="242" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">2147483646</text>
  <text x="150" y="242" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">111…110（31 位）</text>
  <text x="352" y="242" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">31</text>
  <text x="392" y="242" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">2147483647</text>
  <text x="512" y="242" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">00…001 = 1</text>

  <rect x="28" y="262" width="564" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="40" y="284" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">2147483647</text>
  <text x="150" y="284" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">111…111（31 位）</text>
  <text x="352" y="284" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">31</text>
  <text x="392" y="284" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">2147483647</text>
  <text x="512" y="284" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">00…000 = 0</text>

  <rect x="28" y="310" width="564" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="42" y="332" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">mask 与 num 同宽：k 位全 1，结果位数不超过 k（可能出现前导 0，如 010）</text>
  <text x="42" y="352" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">num 取到 2^31 − 1 时 k = 31，mask 铺满 31 位，补数恰好为 0</text>
</svg>
