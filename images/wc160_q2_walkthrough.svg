<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">走查：n = 3、start = 2 的逐项演算</text>
  <text x="310" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">先算反射格雷码 g，再整体异或 2；最后一列是相邻两项的异或值（必须是单个 1）</text>

  <!-- 表头底色 -->
  <rect x="60" y="62" width="515" height="30" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <!-- ans 列浅绿底 -->
  <rect x="305" y="92" width="100" height="240" fill="#eef7f0" stroke="none" filter="url(#rough2)"/>

  <!-- 网格线 -->
  <g filter="url(#rough2)" stroke="#a8a8a8" stroke-width="1.1" fill="none">
    <path d="M 125 62 L 125 332"/>
    <path d="M 195 62 L 195 332"/>
    <path d="M 305 62 L 305 332"/>
    <path d="M 405 62 L 405 332"/>
    <path d="M 505 62 L 505 332"/>
    <path d="M 60 92 L 575 92"/>
    <path d="M 60 122 L 575 122"/>
    <path d="M 60 152 L 575 152"/>
    <path d="M 60 182 L 575 182"/>
    <path d="M 60 212 L 575 212"/>
    <path d="M 60 242 L 575 242"/>
    <path d="M 60 272 L 575 272"/>
    <path d="M 60 302 L 575 302"/>
  </g>
  <rect x="60" y="62" width="515" height="270" fill="none" stroke="#666" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <!-- 表头文字 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#8a6a20" text-anchor="middle">
    <text x="92" y="82">序号 i</text>
    <text x="160" y="82">i &gt;&gt; 1</text>
    <text x="250" y="82">g(i) = i ^ (i&gt;&gt;1)</text>
    <text x="355" y="82">ans = g ^ 2</text>
    <text x="455" y="82">二进制 ans</text>
    <text x="540" y="82">相邻异或</text>
  </g>

  <!-- 数据行 -->
  <g filter="url(#rough2)" font-size="10" fill="#333" text-anchor="middle">
    <text x="92" y="112">0</text><text x="160" y="112">0</text><text x="250" y="112">0</text>
    <text x="355" y="112" fill="#2f4a26">2</text><text x="455" y="112" fill="#2f4a26">010</text><text x="540" y="112" fill="#aaa">-</text>

    <text x="92" y="142">1</text><text x="160" y="142">0</text><text x="250" y="142">1</text>
    <text x="355" y="142" fill="#2f4a26">3</text><text x="455" y="142" fill="#2f4a26">011</text><text x="540" y="142" fill="#b85450">1</text>

    <text x="92" y="172">2</text><text x="160" y="172">1</text><text x="250" y="172">3</text>
    <text x="355" y="172" fill="#2f4a26">1</text><text x="455" y="172" fill="#2f4a26">001</text><text x="540" y="172" fill="#b85450">2</text>

    <text x="92" y="202">3</text><text x="160" y="202">1</text><text x="250" y="202">2</text>
    <text x="355" y="202" fill="#2f4a26">0</text><text x="455" y="202" fill="#2f4a26">000</text><text x="540" y="202" fill="#b85450">1</text>

    <text x="92" y="232">4</text><text x="160" y="232">2</text><text x="250" y="232">6</text>
    <text x="355" y="232" fill="#2f4a26">4</text><text x="455" y="232" fill="#2f4a26">100</text><text x="540" y="232" fill="#b85450">4</text>

    <text x="92" y="262">5</text><text x="160" y="262">2</text><text x="250" y="262">7</text>
    <text x="355" y="262" fill="#2f4a26">5</text><text x="455" y="262" fill="#2f4a26">101</text><text x="540" y="262" fill="#b85450">1</text>

    <text x="92" y="292">6</text><text x="160" y="292">3</text><text x="250" y="292">5</text>
    <text x="355" y="292" fill="#2f4a26">7</text><text x="455" y="292" fill="#2f4a26">111</text><text x="540" y="292" fill="#b85450">2</text>

    <text x="92" y="322">7</text><text x="160" y="322">3</text><text x="250" y="322">4</text>
    <text x="355" y="322" fill="#2f4a26">6</text><text x="455" y="322" fill="#2f4a26">110</text><text x="540" y="322" fill="#b85450">1</text>
  </g>

  <!-- 收尾说明 -->
  <rect x="60" y="348" width="515" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="364" font-size="10" fill="#3a4a66" filter="url(#rough2)">首尾再验一次：110 ^ 010 = 100 = 4，仍是单个 1 —— 环闭合，方案合法。</text>
  <text x="76" y="381" font-size="10" fill="#8a3a36" filter="url(#rough2)">注：官方给的是 [2,6,7,5,4,0,1,3]（旋转法），本题任意合法排列都算对。</text>
</svg>
