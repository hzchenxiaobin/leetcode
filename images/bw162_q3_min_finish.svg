<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">关键观察：先玩的那一类，只关心「最早能玩完的时刻」</text>
  <text x="80" y="78" text-anchor="start" font-size="12.5" fill="#446688" filter="url(#rough2)">陆地：finish = start + duration</text>
  <rect x="100" y="96" width="108" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="154.0" y="122.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i=0: 6</text>
  <rect x="230" y="96" width="108" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284.0" y="122.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i=1: 9</text>
  <rect x="100" y="152" width="108" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="154.0" y="178.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">min = 6</text>
  <path d="M 154 142 L 154 150" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="78" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">水上游乐：finish = start + duration</text>
  <rect x="400" y="96" width="108" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="454.0" y="122.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">j=0: 9</text>
  <rect x="400" y="152" width="108" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="454.0" y="178.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">min = 9</text>
  <path d="M 454 142 L 454 150" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="214" width="620" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="240" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">第二项的结束时刻 = max(前一项结束, 它的开放时间) + 它的时长</text>
  <text x="350" y="264" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">对固定的第二项，这个值随「前一项结束」单调不减 ⇒ 用 min 就够</text>
  <rect x="40" y="292" width="300" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">先陆地：minLandFinish = 6</text>
  <text x="190" y="342" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">→ 对每个水上游乐 O(1)</text>
  <rect x="360" y="292" width="300" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="318" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">先水上游乐：minWaterFinish = 9</text>
  <text x="510" y="342" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">→ 对每个陆地 O(1)</text>
</svg>
