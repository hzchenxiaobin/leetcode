<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">排序双指针：值压过最小未配对的位置</text>

  <!-- 排序后的数组（上：位置值，下：候选 perm 值） -->
  <text x="70" y="66" font-size="13" fill="#666" filter="url(#rough2)">nums 升序：1 1 1 2 3 3 5</text>

  <!-- 位置行 -->
  <g filter="url(#rough2)">
    <rect x="70"  y="80" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="122" y="80" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="174" y="80" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="226" y="80" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="278" y="80" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="330" y="80" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="382" y="80" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="94"  y="100" text-anchor="middle" font-size="14" fill="#2f4a66">1</text>
    <text x="146" y="100" text-anchor="middle" font-size="14" fill="#2f4a66">1</text>
    <text x="198" y="100" text-anchor="middle" font-size="14" fill="#2f4a66">1</text>
    <text x="250" y="100" text-anchor="middle" font-size="14" fill="#2f4a66">2</text>
    <text x="302" y="100" text-anchor="middle" font-size="14" fill="#2f4a66">3</text>
    <text x="354" y="100" text-anchor="middle" font-size="14" fill="#2f4a66">3</text>
    <text x="406" y="100" text-anchor="middle" font-size="14" fill="#2f4a66">5</text>
  </g>
  <text x="46" y="100" font-size="12" fill="#888" filter="url(#rough2)">位置</text>

  <!-- 值行 -->
  <g filter="url(#rough2)">
    <rect x="70"  y="210" width="48" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="122" y="210" width="48" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="174" y="210" width="48" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="226" y="210" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="278" y="210" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="330" y="210" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="382" y="210" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="94"  y="230" text-anchor="middle" font-size="14" fill="#7a5a10">1</text>
    <text x="146" y="230" text-anchor="middle" font-size="14" fill="#7a5a10">1</text>
    <text x="198" y="230" text-anchor="middle" font-size="14" fill="#7a5a10">1</text>
    <text x="250" y="230" text-anchor="middle" font-size="14" fill="#2f5527">2</text>
    <text x="302" y="230" text-anchor="middle" font-size="14" fill="#2f5527">3</text>
    <text x="354" y="230" text-anchor="middle" font-size="14" fill="#2f5527">3</text>
    <text x="406" y="230" text-anchor="middle" font-size="14" fill="#2f5527">5</text>
  </g>
  <text x="40" y="230" font-size="12" fill="#888" filter="url(#rough2)">候选值</text>

  <!-- 配对箭头 -->
  <path d="M 250 206 C 220 180 130 160 100 116" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 302 206 C 280 176 170 156 148 116" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 354 206 C 340 176 230 152 200 116" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 406 206 C 390 170 290 146 252 116" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 无法配对 -->
  <path d="M 94 206 L 94 174 L 108 174" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="94" y="166" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 &gt; 1 不成立，跳过</text>

  <!-- 说明 -->
  <rect x="70" y="266" width="380" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">x 从左到右扫候选值；i 指向最小未配对的位置值</text>
  <text x="260" y="308" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">x &gt; nums[i] → 配对，i++；否则 x 连最小位置都压不过</text>
  <text x="260" y="328" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">必然压不过任何位置 → 跳过。最终 i = 4 ✓</text>
</svg>
