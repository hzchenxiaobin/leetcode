<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：外层枚举 x，内层逐位体检</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两个循环、一个布尔量，没有任何额外数据结构</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="120" y="64" width="320" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="88" fill="#3a4a66">① x 从 left 到 right 依次枚举</text>

    <rect x="120" y="114" width="320" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="138" fill="#3a4a66">② y ← x，ok ← true</text>
  </g>

  <path d="M 280 100 L 280 112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 150 L 280 162" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="120" y="164" width="320" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="136" y="188" font-size="11" fill="#8a6a20">③ while (y &gt; 0)：d ← y % 10，y ← y / 10</text>
    <text x="136" y="208" font-size="11" fill="#8a6a20">   若 d == 0 或 x % d ≠ 0 → ok ← false，break</text>
  </g>

  <path d="M 280 228 L 280 236" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,238 404,268 280,298 156,268" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="273" text-anchor="middle" font-size="12" fill="#3a5a30">ok == true ？</text>
  </g>

  <path d="M 404 268 L 408 268" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 156 268 L 152 268" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="410" y="240" width="136" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="478" y="262" fill="#3a5a30">是：ans.push(x)</text>
    <text x="478" y="282" fill="#3a5a30">保留这个数</text>

    <rect x="14" y="240" width="136" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="82" y="262" fill="#8a3a36">否：跳过 x</text>
    <text x="82" y="282" fill="#8a3a36">不收录</text>
  </g>

  <path d="M 478 296 L 478 330" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 82 296 L 82 330" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 280 298 L 280 330" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="330" width="440" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="359" text-anchor="middle" font-size="11.5" fill="#3a4a66">⑤ x ← x + 1，若 x ≤ right 就回到 ①；否则返回 ans</text>
  </g>

  <path d="M 60 353 L 8 353 L 8 86 L 116 86" stroke="#446688" stroke-width="1.4" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="6 4"/>
  <text x="16" y="220" font-size="9.5" fill="#8a97a8" filter="url(#rough2)" transform="rotate(-90 16 220)">下一位 x</text>

  <text x="280" y="398" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">ans 天然升序：x 从小到大枚举，命中即入列，无需再排序</text>
</svg>
