<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">重映射：nums1 → nums2 坐标系，三维偏序</text>

  <!-- two arrays -->
  <text x="60" y="62" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">nums1 = [2, 0, 1, 3]</text>
  <g filter="url(#rough2)">
    <rect x="60" y="74" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="74" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="192" y="74" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="258" y="74" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="90" y="99">2</text><text x="156" y="99">0</text><text x="222" y="99">1</text><text x="288" y="99">3</text>
  </g>
  <text x="360" y="99" font-size="12" fill="#666" filter="url(#rough2)">位置 i₁</text>

  <text x="60" y="152" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">nums2 = [0, 1, 2, 3]</text>
  <g filter="url(#rough2)">
    <rect x="60" y="164" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="126" y="164" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="192" y="164" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="258" y="164" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="90" y="189">0</text><text x="156" y="189">1</text><text x="222" y="189">2</text><text x="288" y="189">3</text>
  </g>
  <text x="360" y="189" font-size="12" fill="#666" filter="url(#rough2)">位置 i₂</text>

  <!-- remap arrows -->
  <g filter="url(#rough2)">
    <path d="M 90 118 C 110 132, 220 148, 264 162" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 156 118 C 80 138, 70 150, 76 162" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 222 118 C 150 138, 140 150, 146 162" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 288 118 C 290 136, 290 148, 288 162" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- remapped sequence -->
  <text x="60" y="242" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">a = [2, 0, 1, 3]：nums1 每个值换成它在 nums2 中的位置</text>
  <g filter="url(#rough2)">
    <rect x="60" y="254" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="126" y="254" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="192" y="254" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="258" y="254" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="90" y="279">2</text><text x="156" y="279">0</text><text x="222" y="279">1</text><text x="288" y="279">3</text>
  </g>

  <!-- conclusion box -->
  <g filter="url(#rough2)">
    <rect x="40" y="316" width="480" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="280" y="340" text-anchor="middle" font-weight="bold" fill="#8a6d1f">好三元组 ⇔ a 中的严格递增三元组 a[p] &lt; a[q] &lt; a[r]（p &lt; q &lt; r）</text>
    <text x="280" y="360" text-anchor="middle">即固定中间 a[q]：左边比它小的个数 × 右边比它大的个数，再对 q 求和</text>
    <text x="280" y="378" text-anchor="middle">—— 经典三维偏序降维（i₁、i₂ 两维有序 + 值一维）</text>
  </g>
</svg>
