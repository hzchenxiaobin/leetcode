<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="181"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：n 在 b = n−2 进制下恒为 “12”，必不回文</text>

  <!-- 除法分解 -->
  <g filter="url(#rough2)">
    <rect x="80" y="52" width="400" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="76" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">n = 1 × (n−2) + 2</text>
  <text x="280" y="98" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">商 1、余 2 都小于 n−2（当 n ≥ 5）→ 表示恰好两位</text>

  <!-- 两位数展示 -->
  <g filter="url(#rough2)" font-size="20" fill="#333" text-anchor="middle">
    <rect x="200" y="126" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="256" y="126" width="56" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="228" y="158" fill="#1a2b45" font-weight="bold">1</text>
    <text x="284" y="158" fill="#b85450" font-weight="bold">2</text>
    <text x="180" y="158" font-size="14" fill="#888">bⁿ⁻² 位：</text>
    <text x="324" y="158" font-size="14" fill="#888">b⁰ 位</text>
  </g>
  <!-- 回文判定 -->
  <path d="M 228 178 C 228 200 284 200 284 180" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="216" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ≠ 2 → 不是回文！</text>

  <!-- 逻辑链 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="60" y="238" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="135" y="256" text-anchor="middle">严格回文要求</text>
    <text x="135" y="272" text-anchor="middle">所有 b 都回文</text>
    <path d="M 212 259 L 242 259" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>
    <rect x="246" y="238" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="321" y="256" text-anchor="middle">b = n−2 在</text>
    <text x="321" y="272" text-anchor="middle">检查范围内 [2, n−2]</text>
    <path d="M 398 259 L 428 259" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="432" y="238" width="90" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="477" y="256" text-anchor="middle" fill="#b85450" font-weight="bold">该进制</text>
    <text x="477" y="272" text-anchor="middle" fill="#b85450" font-weight="bold">必不回文</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="100" y="300" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="319" text-anchor="middle" font-size="14.5" fill="#1d3a17" filter="url(#rough2)">全称命题被一个反例否决</text>
  <text x="280" y="338" text-anchor="middle" font-size="14.5" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">⇒ 对一切 n ≥ 4 答案恒为 false</text>

  <!-- 特例注记 -->
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">n = 4 特判：b = 2 时 4 = 100₂，首位 1 ≠ 末位 0，同样不回文</text>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（“两位推导”只对 n ≥ 5 成立，n = 4 需单独走这一步）</text>
</svg>
