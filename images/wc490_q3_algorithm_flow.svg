<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 445" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="560" height="445" fill="#fdfcf7"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描 s，双计数器库存</text>
  <path d="M 150 34 Q 280 44 410 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <rect x="185" y="48" width="190" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11" fill="#2b4a6e">one = t 中 '1' 的个数</text>
  <text x="280" y="83" text-anchor="middle" font-size="11" fill="#2b4a6e">zero = n − one</text>
  <path d="M 280 92 L 280 103" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <polygon points="280,106 356,136 280,166 204,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="280" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#a87b20">s[i] = 0 ?</text>

  <path d="M 204 136 Q 165 148 143 167" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="172" y="138" text-anchor="middle" font-size="11" fill="#666">是</text>
  <path d="M 356 136 Q 400 148 422 167" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="390" y="138" text-anchor="middle" font-size="11" fill="#666">否</text>

  <!-- diamond 2 -->
  <polygon points="140,172 216,202 140,232 64,202" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="140" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">one &gt; 0 ?</text>
  <path d="M 64 202 Q 54 228 73 251" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="46" y="228" text-anchor="middle" font-size="11" fill="#666">是</text>
  <path d="M 140 232 Q 163 244 192 251" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="157" y="242" text-anchor="middle" font-size="11" fill="#666">否</text>

  <!-- diamond 3 -->
  <polygon points="425,172 501,202 425,232 349,202" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="425" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">zero &gt; 0 ?</text>
  <path d="M 425 232 Q 402 244 373 251" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="405" y="242" text-anchor="middle" font-size="11" fill="#666">是</text>
  <path d="M 501 202 Q 516 228 513 251" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="516" y="228" text-anchor="middle" font-size="11" fill="#666">否</text>

  <!-- outcome boxes -->
  <rect x="12" y="254" width="128" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="76" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans[i] = '1'</text>
  <text x="76" y="293" text-anchor="middle" font-size="9.5" fill="#4a7a3a">one −−（对位命中）</text>

  <rect x="168" y="254" width="128" height="52" rx="6" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#sk)"/>
  <text x="232" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#777777">ans[i] = '0'</text>
  <text x="232" y="293" text-anchor="middle" font-size="9.5" fill="#999999">zero −−（垫同位）</text>

  <rect x="324" y="254" width="128" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="388" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans[i] = '1'</text>
  <text x="388" y="293" text-anchor="middle" font-size="9.5" fill="#4a7a3a">zero −−（对位命中）</text>

  <rect x="478" y="254" width="72" height="52" rx="6" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#sk)"/>
  <text x="514" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#777777">ans = '0'</text>
  <text x="514" y="293" text-anchor="middle" font-size="9" fill="#999999">one −− 垫位</text>

  <!-- merge -->
  <g stroke="#5a5a5a" stroke-width="1.3" fill="none" filter="url(#sk)">
    <path d="M 76 306 L 76 330"/>
    <path d="M 232 306 L 232 330"/>
    <path d="M 388 306 L 388 330"/>
    <path d="M 514 306 L 514 330"/>
    <path d="M 76 330 L 514 330"/>
  </g>
  <path d="M 280 330 L 280 344" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop / final -->
  <rect x="180" y="348" width="200" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#b85450">i++（i &lt; n 则回到 s[i] 判断）</text>
  <text x="280" y="381" text-anchor="middle" font-size="10.5" fill="#b85450">扫完 s → 返回 ans</text>

  <!-- note -->
  <rect x="24" y="398" width="512" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="280" y="421" text-anchor="middle" font-size="11" fill="#a87b20">⚠ 垫位分支也要扣库存：维持「剩余库存 = 剩余格数」，贪心永不空仓</text>
</svg>
