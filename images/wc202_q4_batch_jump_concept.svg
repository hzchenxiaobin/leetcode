<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：把「吃 1」打包进除法 —— 逐天模拟坍缩为两条跳跃边</text>
  <path d="M 110 34 Q 320 41 530 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">「吃 1」的唯一价值 = 消余数凑整除；n mod 2 ≤ 1、n mod 3 ≤ 2 ⇒ 至多吃 2 个就能除</text>

  <!-- 左侧：原始操作链 -->
  <text x="160" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" filter="url(#rough2)">原始视角：每天一步（O(n) 个中间态）</text>

  <rect x="60" y="96" width="60" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1e" filter="url(#rough2)">n</text>

  <rect x="150" y="96" width="60" height="32" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="180" y="117" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">n−1</text>

  <rect x="240" y="96" width="60" height="32" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="270" y="117" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">n−2</text>

  <path d="M 300 100 L 316 100" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <text x="322" y="104" font-size="13" fill="#999" filter="url(#rough2)">…</text>

  <path d="M 120 106 L 148 106" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 210 106 L 238 106" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="134" y="92" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">吃 1</text>
  <text x="224" y="92" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">吃 1</text>

  <!-- 链上除法出口 -->
  <rect x="150" y="170" width="78" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="189" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">⌊n/2⌋</text>
  <path d="M 180 128 Q 180 148 186 166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="132" y="150" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">消掉 n%2 个后 ÷2</text>

  <rect x="262" y="170" width="78" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="301" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⌊n/3⌋</text>
  <path d="M 272 128 Q 284 148 296 166" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="332" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">消掉 n%3 个后 ÷3</text>

  <rect x="60" y="170" width="60" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <path d="M 90 128 Q 90 148 90 166" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="34" y="150" font-size="9" fill="#b85450" filter="url(#rough2)">一路吃 1（n 天）</text>

  <rect x="60" y="222" width="300" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="240" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">转移 f(n) = 1 + f(n−1) 强迫逐格填表</text>
  <text x="210" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">n = 2×10⁹ ⇒ 数组 8 GB、时间 O(n) ✗</text>

  <!-- 中间大箭头 -->
  <path d="M 374 150 Q 400 150 424 150" stroke="#3a3a3a" stroke-width="2.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="399" y="140" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a3a3a" filter="url(#rough2)">打包！</text>

  <!-- 右侧：压缩跳跃图 -->
  <text x="522" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">压缩视角：整段跳跃（O(log²n) 个状态）</text>

  <rect x="488" y="120" width="68" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="522" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a1e" filter="url(#rough2)">n</text>

  <rect x="432" y="204" width="76" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">⌊n/2⌋</text>
  <path d="M 508 154 Q 484 178 474 198" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="446" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">吃 n%2 个 + ÷2</text>
  <text x="446" y="186" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">代价 = n%2 + 1 天</text>

  <rect x="536" y="204" width="76" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="574" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⌊n/3⌋</text>
  <path d="M 536 154 Q 560 178 570 198" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="598" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">吃 n%3 个 + ÷3</text>
  <text x="598" y="186" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">代价 = n%3 + 1 天</text>

  <rect x="486" y="272" width="72" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="522" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">0（兜底）</text>
  <path d="M 522 156 Q 522 216 522 268" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="600" y="238" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">一路吃 1</text>
  <text x="600" y="251" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">代价 = n 天</text>

  <!-- 底部结论 -->
  <rect x="86" y="306" width="468" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">f(n) = min( n,  n%2 + 1 + f(⌊n/2⌋),  n%3 + 1 + f(⌊n/3⌋) )</text>
  <text x="320" y="342" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每步状态 ÷2 或 ÷3 ⇒ 状态数 O(log²n)，n = 2×10⁹ 时至多 620 个</text>
</svg>
