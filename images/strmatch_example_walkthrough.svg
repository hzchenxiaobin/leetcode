  <!-- answer -->
  <g filter="url(#sk)"><rect x="80" y="380" width="480" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="402" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">答案 = ["as", "hero"]（顺序任意，与示例一致 ✓）</text>
  <text x="320" y="422" text-anchor="middle" font-size="10.5" fill="#555">蓝条 = 首次出现位置，绿条 = 末次出现位置；两位置不同 ⟺ 出现 ≥ 2 次 ⟺ 是其他单词的子串</text>
</svg>
