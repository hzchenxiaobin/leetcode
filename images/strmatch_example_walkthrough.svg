  <text x="356" y="286" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">rfind = 18</text>
  <text x="500" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">收入 ✓</text>

