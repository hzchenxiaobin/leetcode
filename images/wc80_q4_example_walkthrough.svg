<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：t = 6 与 t = 4 的最短指令序列</text>

  <text x="40" y="56" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">t = 6  ⇒  AAARA（范式①，5 步）</text>
  <text x="340" y="56" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">t = 4  ⇒  AARRA（范式②，5 步）</text>

  <rect x="40" y="64" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
