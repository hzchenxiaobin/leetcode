  <text x="209" y="82" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">速度</text>

  <rect x="340" y="64" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="408" y="64" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="476" y="64" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="373" y="82" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">指令</text>
  <text x="441" y="82" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">位置</text>
  <text x="509" y="82" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">速度</text>

  <rect x="40" y="94" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="108" y="94" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="94" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
