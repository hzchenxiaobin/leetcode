  <text x="141" y="145" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="209" y="145" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+2</text>

  <rect x="40" y="158" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="108" y="158" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="158" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="73" y="177" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">A</text>
  <text x="141" y="177" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="209" y="177" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+4</text>

  <rect x="40" y="190" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="108" y="190" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="190" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="73" y="209" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">A</text>
  <text x="141" y="209" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">7</text>
  <text x="209" y="209" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">+8</text>

  <rect x="340" y="94" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="408" y="94" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="476" y="94" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="373" y="113" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">起点</text>
  <text x="441" y="113" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="509" y="113" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+1</text>

  <rect x="340" y="126" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="408" y="126" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="476" y="126" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="373" y="145" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">A</text>
  <text x="441" y="145" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="509" y="145" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+2</text>

  <rect x="340" y="158" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="408" y="158" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="476" y="158" width="66" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="373" y="177" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">A</text>
  <text x="441" y="177" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="509" y="177" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+4</text>

  <rect x="340" y="190" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="408" y="190" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="476" y="190" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="373" y="209" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">R</text>
  <text x="441" y="209" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="509" y="209" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">−1</text>

  <rect x="40" y="222" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="108" y="222" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="222" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="73" y="241" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">R</text>
  <text x="141" y="241" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">7</text>
  <text x="209" y="241" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">−1</text>

  <rect x="340" y="222" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="408" y="222" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="476" y="222" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="373" y="241" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">R</text>
  <text x="441" y="241" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="509" y="241" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">+1</text>

  <rect x="40" y="254" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="108" y="254" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="254" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="73" y="273" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">A</text>
  <text x="141" y="273" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">6</text>
  <text x="209" y="273" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">−2</text>

  <rect x="340" y="254" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="408" y="254" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="476" y="254" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="373" y="273" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">A</text>
  <text x="441" y="273" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="509" y="273" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">+2</text>

  <text x="40" y="308" font-size="10" fill="#666" filter="url(#rough2)">t = 6：n = 3、F = 7，范式① 得 3 + 1 + dp[7−6] = 5，即 AAARA；范式② 得 4 + dp[3] = 6，被淘汰。</text>
  <text x="40" y="330" font-size="10" fill="#666" filter="url(#rough2)">t = 4：n = 3，范式① 得 3 + 1 + dp[3] = 6；范式② 取 j = 0 得 3 + 0 + 1 + dp[1] = 5，即 AARRA。</text>

  <rect x="40" y="346" width="540" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="368" font-size="10" fill="#3a4a66" filter="url(#rough2)">AARRA 里的两个 R：第一次把速度 +4 变成 −1（掉头，位置不动），</text>
  <text x="56" y="388" font-size="10" fill="#3a4a66" filter="url(#rough2)">第二次把 −1 变回 +1（原地重启：花 2 步把失控的速度降回 1）</text>
</svg>
