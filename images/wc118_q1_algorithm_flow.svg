<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法结构：两层「边乘边判」的 while + 两个 break</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">不预先算对数上界，就不会有浮点误差；两个 break 是正确性开关</text>
  <rect x="30" y="74" width="306" height="196" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="44" y="96" font-size="11.5" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">外层 a = 1, a·x, a·x^2, …（a ≤ bound）</text>
  <rect x="46" y="108" width="274" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="130" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">内层 b = 1, b·y, b·y^2, …（a + b ≤ bound）</text>
  <rect x="64" y="142" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="139.0" y="162.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">res.add(a + b)</text>
  <text x="60" y="192" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">y == 1 时 b 不再增长 → break</text>
  <text x="44" y="254" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">x == 1 时 a 不再增长 → break</text>
  <rect x="350" y="74" width="180" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="360" y="95" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">指数上界</text><text x="360" y="110.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">底数 ≥ 2：≤ log2(10^6)+1</text><text x="360" y="126.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每边至多 20 项</text>
  <rect x="350" y="176" width="180" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="360" y="197" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">去重与输出</text><text x="360" y="212.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">set 天然去重</text><text x="360" y="228.89999999999998" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">最后升序返回</text>
  <path d="M 340 118 L 348 118" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 340 212 L 348 212" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
</svg>
