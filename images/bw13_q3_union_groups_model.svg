<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：近义词的传递性 → 并查集分组</text>

  <!-- 左：同义词对 -->
  <text x="140" y="66" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">同义词对（无向）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="80" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="40" y="120" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="40" y="160" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="140" y="102">happy — joy</text>
    <text x="140" y="142">joy — cheerful</text>
    <text x="140" y="182">sad — sorrow</text>
  </g>

  <path d="M 244 130 C 280 130, 290 160, 316 168" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="216" font-size="12" fill="#446688" filter="url(#rough2)">union 归并</text>

  <!-- 右：分组 -->
  <text x="430" y="66" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">连通分量 = 可互换词组</text>
  <g filter="url(#rough2)">
    <rect x="330" y="80" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="330" y="132" width="200" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="430" y="106" fill="#2d5a22" font-weight="bold">{cheerful, happy, joy}</text>
    <text x="430" y="158">{sad, sorrow}</text>
  </g>

  <!-- 说明 -->
  <rect x="40" y="234" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">happy↔joy、joy↔cheerful ⇒ happy↔cheerful（传递）</text>
  <text x="280" y="286" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">句中每个词只能被「同组内任意词」替换，组外词必须原样保留</text>

  <rect x="40" y="326" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">句子替换方案数 = 各词选项数的乘积（笛卡尔积），</text>
  <text x="280" y="372" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">本题 2 个可替换词 × 3 种选择 = 6 句，再整体按字典序排序</text>
</svg>
