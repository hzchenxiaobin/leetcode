<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">从每个 1 向两侧数连续的 0，停在第一个非零位置</text>

  <!-- 数组格子 -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="50" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="85" y="96" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="110" y="70" width="50" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="135" y="96" text-anchor="middle" font-size="15" fill="#333">0</text>
    <rect x="160" y="70" width="50" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="185" y="96" text-anchor="middle" font-size="15" fill="#333">0</text>
    <rect x="210" y="70" width="50" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="235" y="96" text-anchor="middle" font-size="15" fill="#333">-1</text>
    <rect x="260" y="70" width="50" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="285" y="96" text-anchor="middle" font-size="15" fill="#333">0</text>
    <rect x="310" y="70" width="50" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="335" y="96" text-anchor="middle" font-size="15" fill="#333">0</text>
    <rect x="360" y="70" width="50" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="385" y="96" text-anchor="middle" font-size="15" fill="#333">0</text>
    <rect x="410" y="70" width="50" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="435" y="96" text-anchor="middle" font-size="15" fill="#333">1</text>
  </g>

  <text x="85" y="132" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">i</text>
  <text x="435" y="132" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">i'</text>

  <!-- 右扫：0 遇到 -1 → 计 2 -->
  <path d="M85,122 L228,122" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="150" y="144" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2 个 0 → 停在 -1 ✓ 摧毁 2</text>

  <!-- 左扫：1 遇到 1 → 作废 -->
  <path d="M435,122 L322,122" fill="none" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="385" y="146" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">停在 1 ✗ 作废</text>

  <!-- 从右侧 1 向左扫到 -1 -->
  <path d="M432,176 Q330,230 242,178" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)" marker-end="url(#arrB)"/>
  <text x="330" y="232" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">4 个 0 → 停在 -1 ✓ 摧毁 4</text>

  <!-- 说明框 -->
  <rect x="40" y="264" width="440" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">合法移动 ⟺ 1 与 -1 相邻地夹着一段纯 0</text>
  <text x="260" y="308" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">摧毁数 = 这段 0 的个数</text>
  <text x="260" y="328" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = max(所有相邻非零对的 0 段长，端点须为 1 和 -1)</text>
</svg>
