<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">枚举所有 3×3 窗口：左上角共 (R-2)×(C-2) 个</text>

  <!-- 网格 4 行 5 列 -->
  <g filter="url(#rough2)">
    <rect x="60" y="56" width="250" height="200" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <path d="M110,56 L110,256 M160,56 L160,256 M210,56 L210,256 M260,56 L260,256" stroke="#446688" stroke-width="1.2"/>
    <path d="M60,106 L310,106 M60,156 L310,156 M60,206 L310,206" stroke="#446688" stroke-width="1.2"/>
    <text x="85" y="86" text-anchor="middle" font-size="12" fill="#2f4a66">4</text>
    <text x="135" y="86" text-anchor="middle" font-size="12" fill="#2f4a66">3</text>
    <text x="185" y="86" text-anchor="middle" font-size="12" fill="#2f4a66">8</text>
    <text x="235" y="86" text-anchor="middle" font-size="12" fill="#2f4a66">4</text>
    <text x="285" y="86" text-anchor="middle" font-size="12" fill="#2f4a66">9</text>
    <text x="85" y="136" text-anchor="middle" font-size="12" fill="#2f4a66">9</text>
    <text x="135" y="136" text-anchor="middle" font-size="12" fill="#2f4a66">5</text>
    <text x="185" y="136" text-anchor="middle" font-size="12" fill="#2f4a66">1</text>
    <text x="235" y="136" text-anchor="middle" font-size="12" fill="#2f4a66">9</text>
    <text x="285" y="136" text-anchor="middle" font-size="12" fill="#2f4a66">3</text>
    <text x="85" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">2</text>
    <text x="135" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">7</text>
    <text x="185" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">6</text>
    <text x="235" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">2</text>
    <text x="285" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">1</text>
    <text x="85" y="236" text-anchor="middle" font-size="12" fill="#2f4a66">6</text>
    <text x="135" y="236" text-anchor="middle" font-size="12" fill="#2f4a66">0</text>
    <text x="185" y="236" text-anchor="middle" font-size="12" fill="#2f4a66">15</text>
    <text x="235" y="236" text-anchor="middle" font-size="12" fill="#2f4a66">8</text>
    <text x="285" y="236" text-anchor="middle" font-size="12" fill="#2f4a66">2</text>

    <!-- 窗口 1 -->
    <rect x="60" y="56" width="150" height="150" fill="none" stroke="#4a7a3a" stroke-width="3"/>
    <text x="135" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a">窗口 (0,0)</text>
    <!-- 窗口 2 -->
    <rect x="110" y="106" width="150" height="150" fill="none" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5"/>
    <text x="210" y="286" text-anchor="middle" font-size="11" fill="#b85450">窗口 (1,1)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="336" y="60" width="160" height="196" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="416" y="86" text-anchor="middle" font-size="12" fill="#7a5a10">左上角 (i, j)</text>
    <text x="416" y="110" text-anchor="middle" font-size="12" fill="#7a5a10">i ∈ [0, R-3]</text>
    <text x="416" y="132" text-anchor="middle" font-size="12" fill="#7a5a10">j ∈ [0, C-3]</text>
    <text x="416" y="162" text-anchor="middle" font-size="12" fill="#2f5527">窗口数</text>
    <text x="416" y="184" text-anchor="middle" font-size="12" fill="#2f5527">= (R-2)(C-2)</text>
    <text x="416" y="212" text-anchor="middle" font-size="11" fill="#8a3020">R,C ≤ 10</text>
    <text x="416" y="232" text-anchor="middle" font-size="11" fill="#8a3020">最多 64 个窗口</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="304" width="380" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="326" text-anchor="middle" font-size="12" fill="#2f4a66">R 或 C 小于 3 时窗口数为 0，直接返回 0</text>
  </g>
</svg>
