<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="860" height="520" fill="#fafafa"/>

  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 4 演算：n=4，a=(3,1,4,1)，p=(3,2,4,1)</text>
  <path d="M 110 42 Q 430 49 750 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ============ 左：树 + S ============ -->
  <text x="160" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">以最早的点 3 为根，标出 S(u)</text>

  <path d="M 90 120 L 90 155" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 110 175 L 172 175" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 190 193 L 190 232" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <circle cx="90" cy="100" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="90" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">3</text>
  <text x="118" y="96" font-size="11" fill="#8f3a36" filter="url(#rough2)">S=9</text>
  <text x="118" y="112" font-size="10" fill="#8f3a36" filter="url(#rough2)">t=1（根）</text>

  <circle cx="90" cy="175" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="36" y="171" font-size="11" fill="#2f4a66" filter="url(#rough2)">S=5</text>

  <circle cx="190" cy="175" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="216" y="171" font-size="11" fill="#8a6015" filter="url(#rough2)">S=2</text>

  <circle cx="190" cy="250" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="216" y="246" font-size="11" fill="#3c5e2e" filter="url(#rough2)">S=1</text>

  <rect x="36" y="286" width="248" height="62" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="308" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">total = S(3) = 3+1+4+1 = 9</text>
  <text x="160" y="332" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">ans[r] = total + pref[r]</text>

  <!-- ============ 右上：合并过程 ============ -->
  <text x="562" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 按 t 递减激活：合并连通块并记下 w[c]</text>

  <rect x="312" y="76" width="512" height="164" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 312 108 L 824 108" stroke="#c8c8c8" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 312 144 L 824 144" stroke="#dedede" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 312 180 L 824 180" stroke="#dedede" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 312 212 L 824 212" stroke="#dedede" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="324" y="98" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">处理 (u, t)</text>
  <text x="432" y="98" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">活跃邻居 v</text>
  <text x="536" y="98" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">记下的 w[c]</text>
  <text x="712" y="98" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">合并后 K(u)</text>

  <text x="324" y="132" font-size="11.5" fill="#333" filter="url(#rough2)">(1, t=4)</text>
  <text x="432" y="132" font-size="11.5" fill="#333" filter="url(#rough2)">无</text>
  <text x="536" y="132" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="712" y="132" font-size="11.5" fill="#333" filter="url(#rough2)">{1}</text>

  <text x="324" y="168" font-size="11.5" fill="#333" filter="url(#rough2)">(4, t=3)</text>
  <text x="432" y="168" font-size="11.5" fill="#333" filter="url(#rough2)">无</text>
  <text x="536" y="168" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="712" y="168" font-size="11.5" fill="#333" filter="url(#rough2)">{4}</text>

  <text x="324" y="201" font-size="11.5" fill="#333" filter="url(#rough2)">(2, t=2)</text>
  <text x="432" y="201" font-size="11.5" fill="#333" filter="url(#rough2)">1, 4</text>
  <text x="536" y="201" font-size="11.5" fill="#8a6015" filter="url(#rough2)">w[1]=2, w[4]=8</text>
  <text x="712" y="201" font-size="11.5" fill="#333" filter="url(#rough2)">{1,2,4}</text>

  <text x="324" y="232" font-size="11.5" fill="#333" filter="url(#rough2)">(3, t=1)</text>
  <text x="432" y="232" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="536" y="232" font-size="11.5" fill="#8a6015" filter="url(#rough2)">w[2]=9−5=4</text>
  <text x="712" y="232" font-size="11.5" fill="#333" filter="url(#rough2)">{1,2,3,4}</text>

  <!-- ============ 右下：前缀和 ============ -->
  <text x="562" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">② 按 t 递增（3→2→4→1）做前缀和</text>

  <rect x="312" y="276" width="512" height="150" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 312 308 L 824 308" stroke="#c8c8c8" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 312 338 L 824 338" stroke="#dedede" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 312 368 L 824 368" stroke="#dedede" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 312 398 L 824 398" stroke="#dedede" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="340" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">u</text>
  <text x="432" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">kp[u]</text>
  <text x="520" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">w[u]</text>
  <text x="620" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">pref[u]</text>
  <text x="742" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">ans[u]=9+pref</text>

  <text x="340" y="330" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="432" y="330" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="520" y="330" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="620" y="330" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="742" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">15</text>

  <text x="340" y="360" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="432" y="360" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="520" y="360" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">4</text>
  <text x="620" y="360" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="742" y="360" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">13</text>

  <text x="340" y="390" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="432" y="390" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="520" y="390" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="620" y="390" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="742" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">9</text>

  <text x="340" y="418" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="432" y="418" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="520" y="418" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">8</text>
  <text x="620" y="418" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="742" y="418" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">21</text>

  <!-- ============ 结论 ============ -->
  <rect x="60" y="448" width="740" height="52" rx="11" fill="#e6f4ea" fill-opacity="0.75" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="470" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">按点下标输出：15 13 9 21　（w[1]=S(2)=2、w[4]=total−S(4)=8、w[2]=total−S(1)=4）</text>
  <text x="430" y="490" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">与官方样例 4 的答案完全一致</text>
</svg>
