<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：两个官方样例逐段套公式</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="40" y="52" width="280" height="254" rx="10" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="180" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">例 1：n = 5，sick = [0, 4]</text>
  <g filter="url(#sk)"><rect x="68" y="88" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="88" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">0</text>
  <g filter="url(#sk)"><rect x="114" y="88" width="40" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="134" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="160" y="88" width="40" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="180" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="206" y="88" width="40" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="226" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="252" y="88" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="272" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">4</text>
  <text x="180" y="150" text-anchor="middle" font-size="12" fill="#444">唯一的段：中间段 [1, 2, 3]，m = 3，M = 3</text>
  <g filter="url(#sk)"><rect x="64" y="160" width="112" height="28" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="120" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(1, 2, 3)</text>
  <g filter="url(#sk)"><rect x="184" y="160" width="112" height="28" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="240" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(1, 3, 2)</text>
  <g filter="url(#sk)"><rect x="64" y="196" width="112" height="28" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="120" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(3, 1, 2)</text>
  <g filter="url(#sk)"><rect x="184" y="196" width="112" height="28" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="240" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(3, 2, 1)</text>
  <text x="180" y="248" text-anchor="middle" font-size="12" fill="#444">段内方式 2^(3−1) = 4 种；穿插 3!/3! = 1</text>
  <text x="180" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">答案 = 1 × 4 = 4 ✓</text>
  <text x="180" y="298" text-anchor="middle" font-size="11" fill="#888">（与官方输出一致）</text>

  <g filter="url(#sk)"><rect x="322" y="52" width="278" height="254" rx="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="461" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">例 2：n = 4，sick = [1]</text>
  <g filter="url(#sk)"><rect x="369" y="88" width="40" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="389" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <g filter="url(#sk)"><rect x="415" y="88" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="435" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">1</text>
  <g filter="url(#sk)"><rect x="461" y="88" width="40" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="481" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="507" y="88" width="40" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="527" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="461" y="150" text-anchor="middle" font-size="12" fill="#444">左开放 [0]（m=1）＋ 右开放 [2, 3]（m=2）</text>
  <g filter="url(#sk)"><rect x="380" y="160" width="52" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="406" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">[0]</text>
  <g filter="url(#sk)"><rect x="448" y="160" width="90" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="493" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">[2 → 3]</text>
  <g filter="url(#sk)"><rect x="346" y="196" width="74" height="28" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="383" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(0, 2, 3)</text>
  <g filter="url(#sk)"><rect x="424" y="196" width="74" height="28" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="461" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(2, 0, 3)</text>
  <g filter="url(#sk)"><rect x="502" y="196" width="74" height="28" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="539" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(2, 3, 0)</text>
  <text x="461" y="248" text-anchor="middle" font-size="12" fill="#444">段内方式均 1 种；穿插 3!/(1!·2!) = 3</text>
  <text x="461" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">答案 = 1 × 1 × 3 = 3 ✓</text>
  <text x="461" y="298" text-anchor="middle" font-size="11" fill="#888">（与官方输出一致）</text>

  <g filter="url(#sk)"><rect x="55" y="322" width="530" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#a87b1e">自拟混合样例：n = 8，sick = [1, 4, 6]</text>
  <text x="320" y="368" text-anchor="middle" font-size="12" fill="#444">左开放 [0]（m=1）｜中间 [2,3]（m=2）｜中间 [5]（m=1）｜右开放 [7]（m=1）</text>
  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#444">答案 = 5!/(1!·2!·1!·1!) × 2^(2−1) × 2^(1−1) = 60 × 2 = 120</text>
  <text x="320" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">与 DFS 暴力枚举一致 ✓（n ≤ 9 的全部 sick 组合均已对拍通过）</text>

  <text x="320" y="452" text-anchor="middle" font-size="11" fill="#666">套路：切段 → 开放段 1 种 / 中间段 2^(m−1) 种 → 多重集排列穿插 → 费马小定理取模</text>
</svg>
