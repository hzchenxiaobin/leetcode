<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="540" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：计数 + 逐轮分层输出</text>

  <rect x="120" y="56" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">统计每个值的出现次数 cnt[v]</text>
  <path d="M260,100 L260,122" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="128" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">求最大出现次数 M = max(cnt)</text>
  <path d="M260,172 L260,190" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="170,240 260,194 350,240 260,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r ≤ M ?</text>

  <text x="272" y="310" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M260,286 L260,320" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="326" width="340" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">第 r 轮：v 从小到大扫描</text>
  <text x="260" y="369" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cnt[v] ≥ r ⇒ 追加 v 到 ans</text>
  <path d="M260,380 L260,398" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="404" width="140" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="430" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r ← r + 1</text>

  <path d="M330,425 L450,425 L450,240 L358,240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="146" y="228" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M170,240 L78,240 L78,498 L168,498" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="176" y="476" width="168" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="503" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
