<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按「次」结算的模拟流程</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每一趟只做一次减法；收尾交给 min 自动吸收</text>

  <ellipse cx="190" cy="76" rx="52" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="80" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">开始</text>

  <path d="M 190 96 L 190 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="190,110 278,146 190,182 102,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="150" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">candies &gt; 0 ?</text>

  <path d="M 278 146 L 328 146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="138" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="334" y="126" width="192" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="151" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">返回 ans</text>

  <text x="200" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 190 182 L 190 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="76" y="206" width="228" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190" y="230" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">d = min(k, candies)</text>

  <path d="M 190 244 L 190 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="76" y="268" width="228" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190" y="288" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">ans[(k−1) mod n] += d</text>
  <text x="190" y="307" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">candies −= d</text>

  <path d="M 190 318 L 190 338" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="76" y="342" width="228" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190" y="364" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">k += 1</text>

  <path d="M 76 359 L 44 359 L 44 146 L 96 146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="252" text-anchor="middle" font-size="10" fill="#446688" transform="rotate(-90 34 252)" filter="url(#rough2)">回到判断</text>

  <rect x="334" y="272" width="192" height="98" fill="#fffdf5" stroke="#e8d5a8" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="348" y="292" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">次数上界</text>
  <text x="348" y="312" font-size="10" fill="#555" filter="url(#rough2)">T(k) = k(k+1)/2 ≥ candies</text>
  <text x="348" y="331" font-size="10" fill="#555" filter="url(#rough2)">⇒ k ≤ 44721（candies ≤ 1e9）</text>
  <text x="348" y="350" font-size="10" fill="#555" filter="url(#rough2)">循环体是 O(1)，总耗时很小</text>
  <text x="348" y="366" font-size="10" fill="#888" filter="url(#rough2)">截断只发生一次，就在最后一趟</text>
</svg>
