<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：n mod 3 决定尾部结构</text>
  <path d="M 180 36 Q 320 46 460 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="18" y="60" width="104" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="150" y="61" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="182" y="61" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="214" y="61" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="266" y="61" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="298" y="61" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="330" y="61" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="70" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">n % 3 = 0</text>
  <text x="164" y="81" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="196" y="81" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="228" y="81" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="280" y="81" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="312" y="81" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="344" y="81" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="382" y="81" text-anchor="middle" font-size="12" fill="#4a7a3a">n = 6 → 全 3-块，完美 ✓</text>

  <g filter="url(#sk)">
    <rect x="18" y="118" width="104" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="150" y="119" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="182" y="119" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="214" y="119" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="266" y="119" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="298" y="119" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="330" y="119" width="28" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="382" y="119" width="28" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="414" y="119" width="28" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="70" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24">n % 3 = 2</text>
  <text x="164" y="139" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="196" y="139" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="228" y="139" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="280" y="139" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="312" y="139" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="344" y="139" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="396" y="139" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="428" y="139" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="462" y="139" text-anchor="middle" font-size="12" fill="#4a7a3a">尾部一个 2-块 ✓</text>

  <g filter="url(#sk)">
    <rect x="18" y="176" width="104" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="150" y="177" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="177" y="177" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="204" y="177" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="240" y="177" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="267" y="177" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="294" y="177" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="330" y="177" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="357" y="177" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="384" y="177" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="420" y="177" width="24" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="447" y="177" width="24" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="483" y="177" width="24" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="510" y="177" width="24" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M 154 212 Q 279 219 404 212" stroke="#446688" stroke-width="1.4" fill="none"/>
    <path d="M 424 212 Q 472 218 520 212" stroke="#d6a040" stroke-width="1.4" fill="none"/>
  </g>
  <text x="70" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">n % 3 = 1</text>
  <text x="162" y="197" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="189" y="197" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="216" y="197" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="252" y="197" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="279" y="197" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="306" y="197" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="342" y="197" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="369" y="197" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="396" y="197" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="432" y="197" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="459" y="197" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="495" y="197" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="522" y="197" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="279" y="234" text-anchor="middle" font-size="11" fill="#446688">前 n − 4 位：每 3 一组</text>
  <text x="472" y="234" text-anchor="middle" font-size="11" fill="#8a6415">末 4 位：拆 2 + 2</text>

  <g filter="url(#sk)">
    <rect x="55" y="248" width="530" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830">唯一特例：余 1 时继续按 3 切，尾部会剩 1 个孤块（非法 ✗）</text>
  <text x="320" y="296" text-anchor="middle" font-size="12.5" fill="#8f3830">解法：提前停在剩 4 位处，拆成 2 + 2（逻辑上从末尾 3-块「借」1 位）</text>
  <text x="320" y="318" text-anchor="middle" font-size="12.5" fill="#8f3830">两个 2-块恰好用满「至多两个 2-块」配额 ✓</text>
</svg>
