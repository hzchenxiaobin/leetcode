<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="251"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：枚举右端点 → 入队 → 超预算则收缩左端</text>

  <!-- 流程框 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <!-- 步骤1 -->
    <rect x="90" y="56" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="180" y="76">right 右移一格</text>
    <text x="180" y="94" font-size="12" fill="#446688">sum += run[right]</text>

    <path d="M 180 100 L 180 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>

    <!-- 步骤2 -->
    <rect x="90" y="128" width="180" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="180" y="150">入队维护单调性</text>
    <text x="180" y="170" font-size="12" fill="#7a5a10">弹尾：charge[back] ≤ charge[right]</text>

    <path d="M 180 186 L 180 210" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>

    <!-- 步骤3 菱形判定 -->
    <polygon points="180,214 280,248 180,282 80,248" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="180" y="244" font-size="13" fill="#b85450" font-weight="bold">charge[队头] +</text>
    <text x="180" y="262" font-size="13" fill="#b85450" font-weight="bold">k×sum &gt; budget ?</text>

    <path d="M 280 248 L 340 248" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="310" y="240" font-size="11.5" fill="#b85450">是</text>
    <path d="M 180 282 L 180 312" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
    <text x="196" y="302" font-size="11.5" fill="#4a7a3a">否</text>

    <!-- 收缩 -->
    <rect x="344" y="222" width="180" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
    <text x="434" y="242">收缩：left 右移</text>
    <text x="434" y="262" font-size="11.5" fill="#b85450">队头==left 则弹头；sum −= run[left]</text>
    <path d="M 434 274 C 434 296 340 244 284 252" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="380" y="296" font-size="10.5" fill="#b85450">循环判定</text>

    <!-- 记录 -->
    <rect x="90" y="316" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="180" y="336">best = max(best, 窗长)</text>
    <text x="180" y="354" font-size="12" fill="#4a7a3a">left ≤ right 才记录</text>
  </g>

  <!-- 右侧要点 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="360" y="56" width="170" height="110" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="10"/>
    <text x="445" y="80" text-anchor="middle" font-weight="bold" fill="#446688">为什么双指针合法？</text>
    <text x="372" y="102">固定 r，开销随 l 增大</text>
    <text x="372" y="120">单调不增（引理 1）</text>
    <text x="372" y="142">⇒ l*(r) 单调不减，</text>
    <text x="372" y="160">left 永不回退</text>
  </g>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="360" y="316" width="170" height="58" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="10"/>
    <text x="445" y="338" text-anchor="middle" font-weight="bold" fill="#4a7a3a">复杂度</text>
    <text x="445" y="358" text-anchor="middle">每下标进出队各一次</text>
    <text x="445" y="374" text-anchor="middle">总时间 O(n)</text>
  </g>
</svg>
