<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">核心观察：特殊楼层是隔板，隔出空隙</text>
  <text x="260" y="56" text-anchor="middle" font-size="12"
        fill="#888" filter="url(#rough2)">示例 1：bottom = 2, top = 9, special = [4, 6]</text>

  <text x="51" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">哨兵</text>
  <text x="189" y="78" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">特殊</text>
  <text x="281" y="78" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">特殊</text>
  <text x="465" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">哨兵</text>

  <rect x="30" y="86" width="42" height="46" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="76" y="86" width="42" height="46" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="122" y="86" width="42" height="46" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="168" y="86" width="42" height="46" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="214" y="86" width="42" height="46" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="86" width="42" height="46" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="306" y="86" width="42" height="46" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="352" y="86" width="42" height="46" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="398" y="86" width="42" height="46" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="444" y="86" width="42" height="46" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="51" y="114" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">1</text>
  <text x="97" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="143" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="189" y="114" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="235" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="281" y="114" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="327" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <text x="373" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <text x="419" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">9</text>
  <text x="465" y="114" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">10</text>

  <path d="M 76 136 Q 122 150 168 136" stroke="#446688" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="122" y="168" text-anchor="middle" font-size="12"
        fill="#446688" filter="url(#rough2)">头段 [2,3]</text>
  <text x="122" y="184" text-anchor="middle" font-size="11"
        fill="#446688" filter="url(#rough2)">4 − 2 = 2</text>

  <path d="M 216 136 Q 236 150 258 136" stroke="#446688" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="237" y="168" text-anchor="middle" font-size="12"
        fill="#446688" filter="url(#rough2)">中间段 [5,5]</text>
  <text x="237" y="184" text-anchor="middle" font-size="11"
        fill="#446688" filter="url(#rough2)">6−4−1 = 1</text>

  <path d="M 306 136 Q 373 152 440 136" stroke="#d6a040" stroke-width="2.6"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="373" y="168" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#d6a040" filter="url(#rough2)">尾段 [7,9] ★</text>
  <text x="373" y="184" text-anchor="middle" font-size="11"
        fill="#d6a040" filter="url(#rough2)">9 − 6 = 3</text>

  <path d="M 373 192 C 371 200, 375 206, 373 212" stroke="#d6a040" stroke-width="2.5"
        fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="216" width="146" height="34" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="373" y="238" text-anchor="middle" font-size="14" font-weight="bold"
        fill="#d6a040" filter="url(#rough2)">ans = 3</text>

  <rect x="60" y="268" width="400" height="56" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="13"
        fill="#446688" filter="url(#rough2)">统一视角：左右各加一个哨兵隔板 bottom−1 与 top+1</text>
  <text x="260" y="312" text-anchor="middle" font-size="13"
        fill="#446688" filter="url(#rough2)">所有空隙统一为 gap = b − a − 1（a、b 为相邻隔板）</text>

  <text x="260" y="348" text-anchor="middle" font-size="11"
        fill="#888" filter="url(#rough2)">灰色格 1、10 是虚拟哨兵（不在租期内），仅用于统一公式</text>
</svg>
