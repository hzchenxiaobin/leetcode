<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：两遍递推 + 双条件判定</text>

  <!-- 两遍递推 -->
  <rect x="40" y="52" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="75" text-anchor="middle" font-size="13" fill="#2b3d52" filter="url(#rough2)">① 正序递推 left[i]</text>
  <rect x="280" y="52" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="75" text-anchor="middle" font-size="13" fill="#2e4d24" filter="url(#rough2)">② 逆序递推 right[i]</text>

  <path d="M 140 92 C 140 108, 200 112, 230 124" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 92 C 380 108, 320 112, 290 124" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 1 -->
  <polygon points="260,128 360,170 260,212 160,170" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="13" fill="#6b5215" filter="url(#rough2)">left[i] ≥ time+1 ？</text>

  <path d="M 360 170 C 390 170, 400 172, 420 180" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="405" y="160" font-size="12" fill="#b85450" filter="url(#rough2)">否 → 跳过</text>

  <path d="M 260 216 C 260 236, 260 244, 260 258" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="240" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 判定菱形 2 -->
  <polygon points="260,262 355,300 260,338 165,300" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="13" fill="#6b5215" filter="url(#rough2)">right[i] ≥ time+1 ？</text>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">是 → i 加入答案 ✓</text>

  <path d="M 165 300 C 120 300, 100 296, 75 288" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="95" y="272" font-size="12" fill="#b85450" filter="url(#rough2)">否 → 跳过</text>

  <text x="40" y="130" font-size="11.5" fill="#888" filter="url(#rough2)">单步转移：</text>
  <text x="40" y="146" font-size="11.5" fill="#888" filter="url(#rough2)">断链则段长回落 1</text>
</svg>
