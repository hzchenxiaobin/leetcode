<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">判定函数：能装就装，装不下换天</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">给定载重下的最少天数由贪心达到</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="140" y="62" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="84.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">used = 1，cur = 0</text>
  <path d="M 290.0 98.0 L 290.0 120.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="120" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="142.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">依次取包裹 w</text>
  <path d="M 290.0 156.0 L 290.0 178.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="290,178 400,204 290,230 180,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290.0" y="209.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cur + w ≤ cap ?</text>
  <path d="M 400.0 204.0 L 440.0 204.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="446.0" y="208.0" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="446" y="184" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="506.0" y="208.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cur += w</text>
  <path d="M 290.0 230.0 L 290.0 254.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="298.0" y="248.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="170" y="254" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="278.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">used++；cur = w</text>
  <path d="M 290.0 294.0 L 290.0 312.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="312" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="333.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">used &gt; D → 立即返回 false</text>
  <text x="30.0" y="200.0" font-size="10" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">二分时：可行 → hi = mid</text>
  <text x="30.0" y="220.0" font-size="10" fill="#b85450" text-anchor="start" filter="url(#rough2)">不可行 → lo = mid + 1</text>
</svg>
