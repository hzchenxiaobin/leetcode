<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：逐层选择与输出顺序</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">左：官方示例 1 的四条选择路径；右：题面示例 "{a,b,c}d{e,f}" 的 6 个词</text>

  <g filter="url(#rough2)">
    <rect x="46" y="64" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="100" y="64" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="154" y="64" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="208" y="64" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="262" y="64" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" font-weight="bold">
    <text x="73" y="82" fill="#3a4a66">T0 选</text>
    <text x="127" y="82" fill="#3a4a66">T1 选</text>
    <text x="181" y="82" fill="#3a4a66">T2 选</text>
    <text x="235" y="82" fill="#3a4a66">T3 选</text>
    <text x="304" y="82" fill="#2a5a20">单词</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="73" y="116" fill="#333">a</text>
    <text x="127" y="116" fill="#333">c</text>
    <text x="181" y="116" fill="#2a5a20" font-weight="bold">d</text>
    <text x="235" y="116" fill="#333">f</text>
    <text x="304" y="116" fill="#2a5a20" font-weight="bold">acdf ①</text>
    <text x="73" y="152" fill="#333">a</text>
    <text x="127" y="152" fill="#333">c</text>
    <text x="181" y="152" fill="#b85450" font-weight="bold">e</text>
    <text x="235" y="152" fill="#333">f</text>
    <text x="304" y="152" fill="#2a5a20" font-weight="bold">acef ②</text>
    <text x="73" y="188" fill="#333">b</text>
    <text x="127" y="188" fill="#333">c</text>
    <text x="181" y="188" fill="#2a5a20" font-weight="bold">d</text>
    <text x="235" y="188" fill="#333">f</text>
    <text x="304" y="188" fill="#2a5a20" font-weight="bold">bcdf ③</text>
    <text x="73" y="224" fill="#333">b</text>
    <text x="127" y="224" fill="#333">c</text>
    <text x="181" y="224" fill="#b85450" font-weight="bold">e</text>
    <text x="235" y="224" fill="#333">f</text>
    <text x="304" y="224" fill="#2a5a20" font-weight="bold">bcef ④</text>
  </g>

  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1" fill="none">
    <line x1="50" y1="128" x2="340" y2="128"/>
    <line x1="50" y1="164" x2="340" y2="164"/>
    <line x1="50" y1="200" x2="340" y2="200"/>
  </g>

  <rect x="400" y="64" width="130" height="164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="465" y="86" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">{a,b,c}d{e,f}</text>
  <text x="465" y="102" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">T0×T1×T2 = 3×1×2 = 6 个</text>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" font-weight="bold">
    <text x="440" y="126" fill="#2a5a20">ade</text>
    <text x="494" y="126" fill="#2a5a20">adf</text>
    <text x="440" y="150" fill="#2a5a20">bde</text>
    <text x="494" y="150" fill="#2a5a20">bdf</text>
    <text x="440" y="174" fill="#2a5a20">cde</text>
    <text x="494" y="174" fill="#2a5a20">cdf</text>
  </g>
  <text x="465" y="200" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">先按 T0 分组（a&lt;b&lt;c），</text>
  <text x="465" y="214" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">组内再按 T2 分组（d&lt;e）</text>

  <rect x="46" y="252" width="484" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="288" y="274" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">等长串的字典序 = 第一个不同位置上比大小：acdf 与 acef 首次不同在 T2（d &lt; e）</text>
  <text x="288" y="292" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">DFS 按层生成：先固定更小的前缀，再把该前缀的所有延伸走完，才轮到下一个前缀</text>
  <text x="288" y="306" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（若无嵌套花括号、组内互异的前提不成立，则需生成后再 sort + 去重）</text>

  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">官方示例 2："abcd" → 只有 4 个单字母 token，唯一单词就是 "abcd"</text>
</svg>
