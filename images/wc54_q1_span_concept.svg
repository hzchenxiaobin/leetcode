<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="54"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a6415" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：同度子数组 = 某个度元素的 first..last 区间</text>
  <path d="M 118 40 Q 320 48 522 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">nums = [1, 2, 2, 3, 1]，度 = 2（元素 1 与 2 各出现 2 次）</text>

  <g filter="url(#rough2)">
    <rect x="154" y="84" width="60" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
    <rect x="222" y="84" width="60" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="290" y="84" width="60" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="358" y="84" width="60" height="62" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" rx="5"/>
    <rect x="426" y="84" width="60" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
  </g>
  <g font-size="19" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="184" y="125">1</text>
    <text x="252" y="125">2</text>
    <text x="320" y="125">2</text>
    <text x="388" y="125">3</text>
    <text x="456" y="125">1</text>
  </g>
  <g font-size="11" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="184" y="168">0</text>
    <text x="252" y="168">1</text>
    <text x="320" y="168">2</text>
    <text x="388" y="168">3</text>
    <text x="456" y="168">4</text>
  </g>

  <path d="M 184 178 L 184 190 L 456 190 L 456 178" stroke="#b85450" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold" filter="url(#rough2)">元素 1：first = 0，last = 4 → 跨度 5</text>

  <path d="M 252 220 L 252 236 L 320 236 L 320 220" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="330" y="241" font-size="12" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">跨度 2（最短，即答案）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="278" width="520" height="80" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
  </g>
  <text x="320" y="304" text-anchor="middle" font-size="12.5" fill="#2e4f70" font-weight="bold" filter="url(#rough2)">度 degree = max 频次 = 2</text>
  <text x="320" y="326" text-anchor="middle" font-size="12" fill="#2e4f70" filter="url(#rough2)">候选长度 = 只对 cnt[x] = degree 的 x 取 last[x] − first[x] + 1</text>
  <text x="320" y="348" text-anchor="middle" font-size="12.5" fill="#8a6415" font-weight="bold" filter="url(#rough2)">答案 = min(5, 2) = 2</text>

  <g filter="url(#rough2)">
    <rect x="60" y="370" width="520" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="394" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#rough2)">同度子数组必须完整包住某个度元素的全部出现位置；包住它的最短区间正是 first..last，</text>
  <text x="320" y="414" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#rough2)">再短就会漏掉一次出现、度随之变小 —— 所以只需三张表，无需枚举子数组。</text>
</svg>
