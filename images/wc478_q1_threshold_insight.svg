<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：合格 ⟺ 严格小于第 k 大（计重数）</text>

  <!-- 原数组 -->
  <text x="130" y="73" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">原数组</text>
  <text x="462" y="73" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">k = 2</text>
  <rect x="205" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="267" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="289" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="329" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="391" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- 排序箭头 -->
  <path d="M320,92 L320,112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="106" font-size="11.5" fill="#666" filter="url(#rough2)">升序排序</text>

  <!-- 最大的 k 个虚线区域 -->
  <rect x="321" y="112" width="124" height="50" rx="6" fill="#fff8e1" fill-opacity="0.5" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- 排序后数组 -->
  <rect x="205" y="120" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="267" y="120" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="289" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="329" y="120" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="351" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="391" y="120" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- 合格 / 不合格标记 -->
  <text x="227" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="289" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="351" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="413" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 阈值标注 -->
  <path d="M439,140 L456,140" stroke="#8a6d1f" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="462" y="116" width="162" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="543" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">阈值 t = a[n−k] = 2</text>
  <text x="543" y="155" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">（计重数的第 k 大）</text>

  <!-- 最大的 k 个括号 -->
  <path d="M323,180 C350,194 436,194 443,180" stroke="#8a6d1f" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="383" y="210" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">最大的 k = 2 个</text>

  <!-- 两个方向的论证 -->
  <rect x="60" y="224" width="250" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">若 v &lt; t（绿色格）</text>
  <text x="185" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">末 k 个元素全都 ≥ t &gt; v</text>
  <text x="185" y="276" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">白捡 k 个更大 → 合格 ✓</text>
  <rect x="330" y="224" width="250" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">若 v ≥ t（红色格）</text>
  <text x="455" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">大于 v 的元素至多 k − 1 个</text>
  <text x="455" y="276" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">不足 k 个 → 不合格 ✗</text>

  <!-- 答案公式 -->
  <rect x="60" y="298" width="520" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">答案 = 值严格小于 t 的元素个数 = t 首次出现的下标（lower_bound）</text>
  <text x="320" y="338" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">本例：[1,2,2,3] 中小于 2 的只有 1 个 → 答案 = 1</text>

  <!-- k=0 特判 -->
  <rect x="60" y="360" width="520" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">特判 k = 0：「至少 0 个更大」恒成立，全员合格</text>
  <text x="320" y="397" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">答案 = n（此时 a[n−k] = a[n] 越界，必须先判）</text>

  <!-- 图例 -->
  <text x="140" y="421" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 合格（v &lt; t）</text>
  <text x="320" y="421" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 不合格（v ≥ t）</text>
  <text x="500" y="421" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">t = 第 k 大（计重数）</text>
</svg>
