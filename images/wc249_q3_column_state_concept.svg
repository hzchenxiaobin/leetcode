<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="abO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="500" fill="#fdfcf7"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">按列分解：小维度 m 压成状态，大维度 n 当阶段</text>
  <path d="M 210 40 Q 330 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左：m=3, n=4 网格 ===== -->
  <text x="170" y="68" text-anchor="middle" font-size="11" fill="#888">m = 3, n = 4 的一种合法涂色</text>

  <!-- 绿色虚线高亮第 1 列（状态 s） -->
  <g filter="url(#sk)"><rect x="107" y="77" width="52" height="120" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 5"/></g>

  <!-- 网格：4 列 x 3 行，格子 42x34，列距 52，行距 38 -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <!-- 列 0: R G B -->
    <g filter="url(#sk)"><rect x="60" y="82" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="81" y="104" fill="#b03a3a">R</text>
    <g filter="url(#sk)"><rect x="60" y="120" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="81" y="142" fill="#2e6e2e">G</text>
    <g filter="url(#sk)"><rect x="60" y="158" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="81" y="180" fill="#2b6e9e">B</text>
    <!-- 列 1: G B R（状态 s，虚线框内） -->
    <g filter="url(#sk)"><rect x="112" y="82" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="133" y="104" fill="#2e6e2e">G</text>
    <g filter="url(#sk)"><rect x="112" y="120" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="133" y="142" fill="#2b6e9e">B</text>
    <g filter="url(#sk)"><rect x="112" y="158" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="133" y="180" fill="#b03a3a">R</text>
    <!-- 列 2: B R G -->
    <g filter="url(#sk)"><rect x="164" y="82" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="185" y="104" fill="#2b6e9e">B</text>
    <g filter="url(#sk)"><rect x="164" y="120" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="185" y="142" fill="#b03a3a">R</text>
    <g filter="url(#sk)"><rect x="164" y="158" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="185" y="180" fill="#2e6e2e">G</text>
    <!-- 列 3: R B R -->
    <g filter="url(#sk)"><rect x="216" y="82" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="237" y="104" fill="#b03a3a">R</text>
    <g filter="url(#sk)"><rect x="216" y="120" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="237" y="142" fill="#2b6e9e">B</text>
    <g filter="url(#sk)"><rect x="216" y="158" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="237" y="180" fill="#b03a3a">R</text>
  </g>
  <text x="133" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">一列 = 一个状态 s = (G, B, R)</text>
  <text x="133" y="232" text-anchor="middle" font-size="10" fill="#888">列内：相邻行不同色（纵向约束）</text>

  <!-- 中：放大相邻两列 -->
  <path d="M 162 130 Q 250 96 326 128" stroke="#bbbbbb" stroke-width="1.2" fill="none" stroke-dasharray="4 4" marker-end="url(#ab)" filter="url(#sk)" opacity="0.8"/>
  <text x="410" y="68" text-anchor="middle" font-size="11" fill="#888">放大：相邻两列的横向约束</text>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <!-- 列 A: G B R -->
    <g filter="url(#sk)"><rect x="330" y="82" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="351" y="104" fill="#2e6e2e">G</text>
    <g filter="url(#sk)"><rect x="330" y="120" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="351" y="142" fill="#2b6e9e">B</text>
    <g filter="url(#sk)"><rect x="330" y="158" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="351" y="180" fill="#b03a3a">R</text>
    <!-- 列 B: B R G -->
    <g filter="url(#sk)"><rect x="430" y="82" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="451" y="104" fill="#2b6e9e">B</text>
    <g filter="url(#sk)"><rect x="430" y="120" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="451" y="142" fill="#b03a3a">R</text>
    <g filter="url(#sk)"><rect x="430" y="158" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="451" y="180" fill="#2e6e2e">G</text>
  </g>
  <!-- 三根「逐行不同」箭头 -->
  <path d="M 376 99 L 426 99" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#abO)" filter="url(#sk)"/>
  <path d="M 376 137 L 426 137" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#abO)" filter="url(#sk)"/>
  <path d="M 376 175 L 426 175" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#abO)" filter="url(#sk)"/>
  <text x="401" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">兼容 ⟺ 每一行颜色都不同</text>
  <text x="401" y="232" text-anchor="middle" font-size="10" fill="#888">（横向约束，交给 DP 转移）</text>

  <!-- ===== 左下：状态数公式 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="248" width="250" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="80" y="272" font-size="12" font-weight="bold" fill="#2b6e9e">合法列状态数 S</text>
  <text x="80" y="294" font-size="11" fill="#444">S = 3 × 2^(m−1)：首行 3 色，其后每行 2 色</text>
  <text x="84" y="322" font-size="11" fill="#888">m =</text>
  <text x="126" y="322" font-size="12" fill="#444">1</text>
  <text x="164" y="322" font-size="12" fill="#444">2</text>
  <text x="202" y="322" font-size="12" fill="#444">3</text>
  <text x="240" y="322" font-size="12" fill="#444">4</text>
  <text x="278" y="322" font-size="12" fill="#444">5</text>
  <text x="84" y="346" font-size="11" fill="#888">S =</text>
  <text x="126" y="346" font-size="12" fill="#444">3</text>
  <text x="164" y="346" font-size="12" fill="#444">6</text>
  <text x="202" y="346" font-size="12" fill="#444">12</text>
  <text x="240" y="346" font-size="12" fill="#444">24</text>
  <text x="278" y="346" font-size="12" font-weight="bold" fill="#7a5415">48</text>
  <g filter="url(#sk)">
    <ellipse cx="278" cy="342" rx="15" ry="12" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- ===== 右下：可行性 ===== -->
  <g filter="url(#sk)">
    <rect x="340" y="248" width="260" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="360" y="272" font-size="12" font-weight="bold" fill="#7a5415">为什么这样可行</text>
  <text x="360" y="296" font-size="11" fill="#444">m ≤ 5 ⟹ 状态数 S ≤ 48</text>
  <text x="360" y="318" font-size="11" fill="#444">n ≤ 1000 ⟹ 至多 999 轮转移</text>
  <text x="360" y="342" font-size="11" font-weight="bold" fill="#2e6e2e">O(n·S²) ≈ 2.3 × 10⁶ 次加法，稳过</text>

  <!-- ===== 底部：反面对照 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="386" width="540" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="330" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">反面对照：为什么不能按行分解？</text>
  <text x="330" y="434" text-anchor="middle" font-size="11" fill="#444">按行分解 → 行状态数 3 × 2^(n−1)，n = 1000 时约 10^301，直接爆炸</text>
  <text x="330" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">状态压缩原则：把小维度压进状态，沿大维度做阶段</text>
</svg>
