<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="560" height="420" fill="#fdfcf7"/>

  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">两条互换规则 → 一个翻转开关</text>
  <path d="M 150 38 Q 280 48 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Rule 1 -->
  <rect x="24" y="66" width="186" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="117" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">规则①：奇数分</text>
  <text x="117" y="112" text-anchor="middle" font-size="11" fill="#7a4a48">nums[i] 为奇数 → 互换</text>

  <!-- Rule 2 -->
  <rect x="24" y="168" width="186" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="117" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#a87b20">规则②：每 6 场</text>
  <text x="117" y="214" text-anchor="middle" font-size="11" fill="#8a6a30">i % 6 == 5 → 互换</text>

  <!-- arrows rules -> toggle -->
  <path d="M 212 105 Q 240 112 254 128" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 212 195 Q 240 188 254 172" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Toggle -->
  <rect x="258" y="100" width="132" height="102" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="324" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">主动方 s</text>
  <text x="324" y="146" text-anchor="middle" font-size="12" fill="#2b4a6e">+1：玩家①主动</text>
  <text x="324" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a">−1：玩家②主动</text>
  <text x="324" y="190" text-anchor="middle" font-size="10" fill="#888">每次互换：s ← −s</text>

  <!-- arrow toggle -> scoring -->
  <path d="M 324 204 L 324 240" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Scoring box -->
  <rect x="258" y="244" width="132" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="324" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">记分（两条规则之后）</text>
  <text x="324" y="286" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">diff += s * nums[i]</text>

  <!-- Key insight box -->
  <rect x="424" y="66" width="126" height="168" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="487" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">关键：双翻转抵消</text>
  <text x="434" y="114" font-size="10.5" fill="#7a4a48">同一场比赛两条规则</text>
  <text x="434" y="130" font-size="10.5" fill="#7a4a48">都触发 → 互换两次</text>
  <text x="434" y="146" font-size="10.5" font-weight="bold" fill="#b85450">→ 等于没有互换！</text>
  <text x="434" y="170" font-size="10.5" fill="#7a4a48">（XOR 语义，</text>
  <text x="434" y="184" font-size="10.5" fill="#7a4a48">与两规则的先后无关）</text>
  <text x="434" y="208" font-size="10.5" fill="#7a4a48">示例 2 第 5 场：</text>
  <text x="434" y="222" font-size="10.5" font-weight="bold" fill="#b85450">→ 玩家②继续主动</text>

  <!-- Timeline -->
  <text x="280" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">比赛索引时间轴（0-indexed）</text>

  <text x="208" y="342" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">奇数分随时触发↘</text>
  <text x="352" y="342" text-anchor="middle" font-size="9.5" fill="#a87b20" font-weight="bold">↙每 6 场触发</text>

  <g filter="url(#sk)">
    <rect x="91" y="348" width="42" height="34" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/>
    <rect x="139" y="348" width="42" height="34" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/>
    <rect x="187" y="348" width="42" height="34" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/>
    <rect x="235" y="348" width="42" height="34" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/>
    <rect x="283" y="348" width="42" height="34" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/>
    <rect x="331" y="348" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="379" y="348" width="42" height="34" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/>
    <rect x="427" y="348" width="42" height="34" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="112" y="369">0</text>
    <text x="160" y="369">1</text>
    <text x="208" y="369" fill="#b85450" font-weight="bold">2</text>
    <text x="256" y="369">3</text>
    <text x="304" y="369">4</text>
    <text x="352" y="369" fill="#a87b20" font-weight="bold">5</text>
    <text x="400" y="369">6</text>
    <text x="448" y="369">7</text>
  </g>

  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#888">规则②固定落在 i = 5, 11, 17, …；规则①由本场分数奇偶触发；同场相遇 → 抵消</text>
</svg>
