  <text x="46" y="176" font-size="10" fill="#555" filter="url(#rough2)">约束</text>
  <text x="112" y="176" font-size="10" fill="#555" filter="url(#rough2)">1←6, 2←5, 3←6, 4←{3,6}，其余为空（左边必须在右边之前）</text>

  <text x="46" y="208" font-size="10" fill="#555" filter="url(#rough2)">群组图</text>
  <text x="112" y="208" font-size="10" fill="#555" filter="url(#rough2)">跨组边只有一条 0→3（其余边两端同组，留在组内；组 4 无约束）</text>
  <circle cx="110" cy="240" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
