  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">拼接得到 [6,3,4,5,2,0,7,1]（官方答案 [6,3,4,1,5,2,0,7] 同样合法）</text>
  <text x="280" y="412" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">输出任意合法排列即可，判题只校验同组相邻与依赖顺序</text>
