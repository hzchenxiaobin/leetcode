<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例与自造数据走查</text>
  <path d="M 245 40 Q 390 48 535 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="62" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">判据：n ≥ min(a) + 1 ⇒ 答案 n；否则 0</text>

  <rect x="36" y="80" width="708" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">用例</text>
  <text x="250" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="402" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n</text>
  <text x="470" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">min a</text>
  <text x="582" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n ≥ min a + 1</text>
  <text x="700" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <rect x="36" y="114" width="708" height="34" rx="5" fill="#fafafa" stroke="#c8d0d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">样例 1</text>
  <text x="250" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[0]</text>
  <text x="402" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="582" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1 ≥ 1 ✓</text>
  <text x="700" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <rect x="36" y="148" width="708" height="34" rx="5" fill="#fafafa" stroke="#c8d0d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">样例 2</text>
  <text x="250" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="402" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="582" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1 ≥ 2 ✗</text>
  <text x="700" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" filter="url(#rough2)">0</text>

  <rect x="36" y="182" width="708" height="34" rx="5" fill="#fafafa" stroke="#c8d0d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="204" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">样例 3</text>
  <text x="250" y="204" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[5,3,4]</text>
  <text x="402" y="204" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="470" y="204" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="582" y="204" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3 ≥ 4 ✗</text>
  <text x="700" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" filter="url(#rough2)">0</text>

  <rect x="36" y="216" width="708" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">样例 4</text>
  <text x="250" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[2,1,1,0,3]</text>
  <text x="402" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="470" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="582" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5 ≥ 1 ✓</text>
  <text x="700" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5</text>

  <rect x="36" y="250" width="708" height="34" rx="5" fill="#fafafa" stroke="#c8d0d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">自造</text>
  <text x="250" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[2,2,2]</text>
  <text x="402" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="470" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="582" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3 ≥ 3 ✓</text>
  <text x="700" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">3</text>

  <rect x="36" y="284" width="708" height="34" rx="5" fill="#fafafa" stroke="#c8d0d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="306" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">自造</text>
  <text x="250" y="306" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[2,2]</text>
  <text x="402" y="306" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="470" y="306" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="582" y="306" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2 ≥ 3 ✗</text>
  <text x="700" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" filter="url(#rough2)">0</text>

  <rect x="36" y="332" width="708" height="86" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="356" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[2,1,1,0,3]（有 0）：正数逐个单点删光，0 一直留到最后</text>
  <text x="390" y="380" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">[2,1,1,0,3] → [1,1,0,3] → [1,0,3] → [0,3] → [0]</text>
  <text x="390" y="404" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[2,2,2]（无 0，m − 1 = 2）：减 [1,2] 删第 2 位 → [1,2] → 再来一轮 → [0]</text>
</svg>
