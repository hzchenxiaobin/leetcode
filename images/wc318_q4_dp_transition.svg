<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fdfcf7"/>
  <text x="340" y="29" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">二维 DP：第 i 个工厂要么不用，要么修末尾连续 k 台</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="205" y="62" width="270" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="340" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#31506f" filter="url(#sk)">f[i][j]</text>
  <text x="340" y="107" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">前 i 个工厂修前 j 台机器人的最小距离</text>

  <path d="M 250 122 Q 190 142 165 169" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 430 122 Q 490 142 515 169" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="40" y="174" width="260" height="108" rx="9" fill="#f0f4f8" stroke="#446688" stroke-width="1.7"/></g>
  <text x="170" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#31506f" filter="url(#sk)">选择 1：跳过工厂 i</text>
  <text x="170" y="229" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#sk)">f[i−1][j]</text>
  <text x="170" y="256" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">k = 0，前 j 台全部由旧工厂维修</text>

  <g filter="url(#sk)"><rect x="380" y="174" width="260" height="108" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="510" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5f14" filter="url(#sk)">选择 2：使用工厂 i</text>
  <text x="510" y="229" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#sk)">f[i−1][j−k] + 段代价</text>
  <text x="510" y="256" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">1 ≤ k ≤ min(limitᵢ, j)</text>

  <text x="55" y="316" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">排序后的机器人前缀：</text>
  <g filter="url(#sk)">
    <rect x="210" y="296" width="55" height="36" rx="4" fill="#eeeeee" stroke="#888888" stroke-width="1.4"/>
    <rect x="270" y="296" width="55" height="36" rx="4" fill="#eeeeee" stroke="#888888" stroke-width="1.4"/>
    <rect x="330" y="296" width="55" height="36" rx="4" fill="#eeeeee" stroke="#888888" stroke-width="1.4"/>
    <rect x="390" y="296" width="55" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="450" y="296" width="55" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="510" y="296" width="55" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="237" y="319" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">…</text>
  <text x="297" y="319" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">j−k−1</text>
  <text x="357" y="319" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">…</text>
  <text x="417" y="319" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5f14" filter="url(#sk)">j−k</text>
  <text x="477" y="319" text-anchor="middle" font-size="11" fill="#8a5f14" filter="url(#sk)">…</text>
  <text x="537" y="319" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5f14" filter="url(#sk)">j−1</text>
  <path d="M 392 342 Q 477 354 562 342" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="477" y="371" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5f14" filter="url(#sk)">末尾连续 k 台 → 工厂 i</text>
  <text x="275" y="354" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">前 j−k 台由前 i−1 厂负责</text>

  <g filter="url(#sk)"><rect x="48" y="393" width="584" height="66" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="340" y="418" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#35602c" filter="url(#sk)">f[i][j] = min( f[i−1][j],  minₖ f[i−1][j−k] + cost(i,j,k) )</text>
  <text x="340" y="443" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">cost 从右往左累加 |robot[j−k] − factory[i−1]|，无需重复计算整段</text>
</svg>
