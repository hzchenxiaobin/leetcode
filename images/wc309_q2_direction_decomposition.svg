<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：路径 ⟺ 「朝目标 / 背离」步数分配 ⟺ 组合数</text>

  <!-- ===== ① number line with one path ===== -->
  <text x="40" y="56" font-size="12" fill="#4a7a3a" font-weight="bold">① 一条路径只是方向步数的排列（示例：startPos=1, endPos=2, k=3）</text>

  <g filter="url(#rough2)">
    <line x1="70" y1="122" x2="510" y2="122" stroke="#446688" stroke-width="2"/>
    <line x1="90"  y1="114" x2="90"  y2="130" stroke="#446688" stroke-width="1.6"/>
    <line x1="190" y1="114" x2="190" y2="130" stroke="#446688" stroke-width="1.6"/>
    <line x1="290" y1="114" x2="290" y2="130" stroke="#446688" stroke-width="1.6"/>
    <line x1="390" y1="114" x2="390" y2="130" stroke="#446688" stroke-width="1.6"/>
    <line x1="490" y1="114" x2="490" y2="130" stroke="#446688" stroke-width="1.6"/>
    <text x="90"  y="148" text-anchor="middle" font-size="12" fill="#666">0</text>
    <text x="190" y="148" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="290" y="148" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="390" y="148" text-anchor="middle" font-size="12" fill="#666">3</text>
    <text x="490" y="148" text-anchor="middle" font-size="12" fill="#666">4</text>

    <circle cx="190" cy="122" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="290" cy="122" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="190" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">起点 1</text>
    <text x="290" y="168" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">终点 2</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 196 110 Q 240 72 284 110" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
    <text x="240" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① →</text>
    <path d="M 296 110 Q 340 72 384 110" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
    <text x="340" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② →</text>
    <path d="M 384 110 Q 340 88 296 110" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
    <text x="340" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ ←</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="182" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="87" y="199" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">→</text>
    <rect x="110" y="182" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="127" y="199" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">→</text>
    <rect x="150" y="182" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="167" y="199" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">←</text>
    <text x="205" y="199" font-size="12" fill="#666">＝ 2 步朝目标（绿）＋ 1 步背离（红），净推进 ＋1 ＝ d</text>
  </g>

  <line x1="40" y1="224" x2="520" y2="224" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ===== ② equations & feasibility ===== -->
  <text x="40" y="248" font-size="12" fill="#446688" font-weight="bold">② 解方程定步数（d = |endPos − startPos|）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="262" width="270" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="195" y="288" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">r + l = k　（步数分配）</text>
    <text x="195" y="312" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">r − l = d　（净位移）</text>
    <text x="195" y="342" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">⟹ r = (k+d)/2 ，l = (k−d)/2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="360" y="262" width="180" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="450" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">可行性两条件缺一不可</text>
    <text x="450" y="306" text-anchor="middle" font-size="12" fill="#666">• k 与 d 同奇偶（k−d 为偶）</text>
    <text x="450" y="326" text-anchor="middle" font-size="12" fill="#666">• d ≤ k（步数够走）</text>
    <text x="450" y="350" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">不满足 → 答案为 0</text>
  </g>

  <line x1="40" y1="384" x2="520" y2="384" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ===== ③ arrangements ===== -->
  <text x="40" y="408" font-size="12" fill="#b85450" font-weight="bold">③ 方案数 = 从 k 个步槽里选 r 个放「朝目标」= C(k, r)</text>

  <g filter="url(#rough2)">
    <rect x="70" y="422" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="85" y="438" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→</text>
    <rect x="104" y="422" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="119" y="438" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→</text>
    <rect x="138" y="422" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="153" y="438" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">←</text>
    <text x="185" y="438" font-size="12" fill="#666">1→2→3→2</text>

    <rect x="70" y="452" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="85" y="468" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→</text>
    <rect x="104" y="452" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="119" y="468" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">←</text>
    <rect x="138" y="452" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="153" y="468" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→</text>
    <text x="185" y="468" font-size="12" fill="#666">1→2→1→2</text>

    <rect x="70" y="482" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="85" y="498" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">←</text>
    <rect x="104" y="482" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="119" y="498" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→</text>
    <rect x="138" y="482" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="153" y="498" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→</text>
    <text x="185" y="498" font-size="12" fill="#666">1→0→1→2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="360" y="430" width="180" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
    <text x="450" y="456" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">{→,→,←} 的全部排列</text>
    <text x="450" y="480" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">C(3, 2) = 3</text>
  </g>
</svg>
