<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：一条边的贡献 = 跨过它的同组点对数</text>
  <path d="M 110 42 Q 320 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 图例 -->
  <circle cx="196" cy="60" r="8" fill="#dbe9fb" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="210" y="65" font-size="12" fill="#2b4a6b" filter="url(#sk)">组 A（全树 4 个）</text>
  <circle cx="376" cy="60" r="8" fill="#ffe9c4" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="390" y="65" font-size="12" fill="#9a6d1a" filter="url(#sk)">组 B（全树 3 个）</text>

  <!-- 两个连通块 -->
  <g filter="url(#sk)"><rect x="48" y="78" width="250" height="258" rx="12" fill="#eef4fc" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4"/></g>
  <text x="173" y="98" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">连通块 L：{0, 1, 3}，c_A=3，c_B=0</text>
  <g filter="url(#sk)"><rect x="336" y="78" width="256" height="258" rx="12" fill="#fdf6e8" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4"/></g>
  <text x="464" y="98" text-anchor="middle" font-size="12" fill="#9a6d1a" filter="url(#sk)">连通块 R：{2, 4, 5, 6}，c_A=1，c_B=3</text>

  <!-- 树的普通边 -->
  <path d="M 178 136 L 112 218" stroke="#7a8a9a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 112 218 L 112 300" stroke="#7a8a9a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 408 168 L 352 252" stroke="#7a8a9a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 408 168 L 478 252" stroke="#7a8a9a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 352 252 L 352 312" stroke="#7a8a9a" stroke-width="1.8" fill="none" filter="url(#sk)"/>

  <!-- 被统计（删除）的边 -->
  <path d="M 178 136 L 408 168" stroke="#b85450" stroke-width="3" fill="none" filter="url(#sk)"/>
  <path d="M 283 144 L 301 160" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 301 144 L 283 160" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <text x="292" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">统计这条边 e</text>

  <!-- 跨边的同组点对（虚线弧） -->
  <path d="M 478 252 Q 320 86 178 136" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="2 5" opacity="0.8" filter="url(#sk)"/>
  <path d="M 478 252 Q 290 160 112 218" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="2 5" opacity="0.8" filter="url(#sk)"/>
  <path d="M 478 252 Q 310 330 112 300" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="2 5" opacity="0.8" filter="url(#sk)"/>
  <text x="508" y="286" font-size="11.5" fill="#b85450" filter="url(#sk)">组 A 跨边点对</text>
  <text x="508" y="302" font-size="11.5" fill="#b85450" filter="url(#sk)">(0,5)(1,5)(3,5)</text>

  <!-- 树节点 -->
  <g filter="url(#sk)"><circle cx="178" cy="136" r="17" fill="#dbe9fb" stroke="#446688" stroke-width="2"/></g>
  <text x="178" y="141" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><circle cx="112" cy="218" r="17" fill="#dbe9fb" stroke="#446688" stroke-width="2"/></g>
  <text x="112" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><circle cx="112" cy="300" r="17" fill="#dbe9fb" stroke="#446688" stroke-width="2"/></g>
  <text x="112" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><circle cx="408" cy="168" r="17" fill="#ffe9c4" stroke="#d6a040" stroke-width="2"/></g>
  <text x="408" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6d1a" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="352" cy="252" r="17" fill="#ffe9c4" stroke="#d6a040" stroke-width="2"/></g>
  <text x="352" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6d1a" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><circle cx="478" cy="252" r="17" fill="#dbe9fb" stroke="#446688" stroke-width="2.4"/></g>
  <text x="478" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><circle cx="352" cy="312" r="17" fill="#ffe9c4" stroke="#d6a040" stroke-width="2"/></g>
  <text x="352" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6d1a" filter="url(#sk)">6</text>

  <!-- 公式说明框 -->
  <g filter="url(#sk)"><rect x="48" y="352" width="544" height="114" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="320" y="376" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#sk)">c_g = e 的 v 侧子树中组 g 节点数 ， k_g = 全树组 g 节点总数</text>
  <text x="320" y="402" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">边 e 的贡献 = Σ_g c_g × (k_g − c_g)</text>
  <text x="320" y="426" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#sk)">本例：A 组 1×(4−1)=3（R 侧只有节点 5） ， B 组 3×(3−3)=0（B 全在 R 侧）</text>
  <text x="320" y="450" text-anchor="middle" font-size="12" fill="#6a8aa8" filter="url(#sk)">答案 = 全部 n−1 条边的贡献之和（每个点对的距离被拆成路径上每条边各计 1）</text>
</svg>
