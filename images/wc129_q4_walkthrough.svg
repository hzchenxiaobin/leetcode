<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：s = "0110" 的子串值</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">n = 3 → 集合 {1,2,3} 大小 3 → true；n = 4 → 3 ≠ 4 → false</text>
  <rect width="580" height="384" fill="#fafafa"/>
  <text x="40.0" y="64.0" font-size="10" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">长度</text>
  <text x="120.0" y="64.0" font-size="10" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">子串</text>
  <text x="290.0" y="64.0" font-size="10" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">值</text>
  <text x="380.0" y="64.0" font-size="10" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">在 [1,3] 内</text>
  <text x="470.0" y="64.0" font-size="10" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">在 [1,4] 内</text>
  <rect x="34" y="78" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="64.0" y="99.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="104" y="78" width="160" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="184.0" y="98.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">0 / 1 / 1 / 0</text>
  <rect x="270" y="78" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="315.0" y="98.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0,1,1,0</text>
  <rect x="366" y="78" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="411.0" y="98.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">1 ✓</text>
  <rect x="462" y="78" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="507.0" y="98.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">1 ✓</text>
  <rect x="34" y="122" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="64.0" y="143.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="104" y="122" width="160" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="184.0" y="142.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">01 / 11 / 10</text>
  <rect x="270" y="122" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="315.0" y="142.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1,3,2</text>
  <rect x="366" y="122" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="411.0" y="142.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">1,2,3 ✓</text>
  <rect x="462" y="122" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="507.0" y="142.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">1,2,3 ✓</text>
  <rect x="34" y="166" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="64.0" y="187.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="104" y="166" width="160" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="184.0" y="186.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">011 / 110</text>
  <rect x="270" y="166" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="315.0" y="186.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3,6</text>
  <rect x="366" y="166" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="411.0" y="186.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">3 ✓</text>
  <rect x="462" y="166" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="507.0" y="186.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">3 ✓</text>
  <rect x="34" y="210" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="64.0" y="231.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="104" y="210" width="160" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="184.0" y="230.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">0110</text>
  <rect x="270" y="210" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="315.0" y="230.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="366" y="210" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="411.0" y="230.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">—</text>
  <rect x="462" y="210" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="507.0" y="230.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">—</text>
  <text x="30.0" y="262.0" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">S(n=3) = {1,2,3}，|S| = 3 = n → true</text>
  <text x="30.0" y="290.0" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">S(n=4) = {1,2,3}，|S| = 3 ≠ 4 → false（4 的 "100" 不在 s 中）</text>
  <rect x="30" y="310" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="331.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">注意 "01" 的值是 1：前导零被忽略，但 "1" 仍是它的后缀子串，语义正确</text>
</svg>
