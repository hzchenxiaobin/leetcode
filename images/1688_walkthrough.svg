<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n = 7 逐轮配对（3 + 2 + 1 = 6 = 7 − 1）</text>
  <path d="M 110 44 Q 320 52 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- round labels -->
  <text x="48" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#888888" filter="url(#sk)">R1</text>
  <text x="48" y="164" text-anchor="middle" font-size="10" font-weight="bold" fill="#888888" filter="url(#sk)">R2</text>
  <text x="48" y="234" text-anchor="middle" font-size="10" font-weight="bold" fill="#888888" filter="url(#sk)">R3</text>
  <text x="48" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#888888" filter="url(#sk)">R4</text>

  <!-- round 1: 7 teams -->
  <g filter="url(#sk)">
    <circle cx="78" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="122" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="166" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="210" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="254" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="298" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="342" cy="90" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#sk)" font-size="9.5" fill="#2b4a6e" text-anchor="middle">
    <text x="78" y="94">T1</text>
    <text x="122" y="94">T2</text>
    <text x="166" y="94">T3</text>
    <text x="210" y="94">T4</text>
    <text x="254" y="94">T5</text>
    <text x="298" y="94">T6</text>
  </g>
  <text x="342" y="94" text-anchor="middle" font-size="9.5" fill="#8a6415" filter="url(#sk)">T7</text>
  <text x="342" y="66" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#sk)">轮空</text>
  <path d="M 78 104 Q 100 114 122 104" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 166 104 Q 188 114 210 104" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 254 104 Q 276 114 298 104" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 100 116 L 100 144" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 188 116 L 188 144" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 276 116 L 276 144" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 342 104 L 342 144" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- round 2: 4 teams -->
  <g filter="url(#sk)">
    <circle cx="100" cy="160" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="188" cy="160" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="276" cy="160" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="342" cy="160" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#sk)" font-size="9.5" text-anchor="middle">
    <text x="100" y="164" fill="#2e5e24">W1</text>
    <text x="188" y="164" fill="#2e5e24">W2</text>
    <text x="276" y="164" fill="#2e5e24">W3</text>
    <text x="342" y="164" fill="#8a6415">T7</text>
  </g>
  <path d="M 100 174 Q 144 184 188 174" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 276 174 Q 309 184 342 174" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 144 186 L 144 214" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 309 186 L 309 214" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- round 3: 2 teams -->
  <g filter="url(#sk)">
    <circle cx="144" cy="230" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="309" cy="230" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="9.5" fill="#2e5e24" text-anchor="middle">
    <text x="144" y="234">F1</text>
    <text x="309" y="234">F2</text>
  </g>
  <path d="M 144 244 Q 226 254 309 244" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 226 256 L 226 283" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- champion -->
  <g filter="url(#sk)">
    <circle cx="226" cy="300" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="226" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e24" filter="url(#sk)">1</text>
  <text x="226" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e24" filter="url(#sk)">冠军</text>

  <!-- ledger -->
  <g filter="url(#sk)">
    <rect x="420" y="64" width="190" height="200" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="515" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">场次账本</text>
  <g filter="url(#sk)" font-size="11" fill="#555555" text-anchor="middle">
    <text x="515" y="112">第 1 轮　7 → 4 ｜ 3 场</text>
    <text x="515" y="134">第 2 轮　4 → 2 ｜ 2 场</text>
    <text x="515" y="156">第 3 轮　2 → 1 ｜ 1 场</text>
  </g>
  <path d="M 435 170 L 600 170" stroke="#888888" stroke-width="1.1" filter="url(#sk)"/>
  <text x="515" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">合计 3 + 2 + 1 = 6</text>
  <g filter="url(#sk)">
    <rect x="435" y="204" width="160" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="515" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">6 = 7 − 1</text>
  <text x="515" y="238" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">总场次 = n − 1</text>
  <text x="515" y="256" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#sk)">第 1 轮 7 为奇数 → 1 队轮空</text>

  <!-- caption -->
  <text x="320" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">每场淘汰 1 支 ⇒ 总场次 = 总淘汰数 = n − 1</text>
  <text x="320" y="382" text-anchor="middle" font-size="11" fill="#888888" filter="url(#sk)">无论哪支队伍轮空、奇偶如何交错，答案都不变</text>
</svg>
