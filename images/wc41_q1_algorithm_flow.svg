<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.017" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：首窗求和 → 逐格滑动 → 取最大和</text>

  <g filter="url(#rough2)">
    <ellipse cx="320" cy="58" rx="52" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="150" y="94" width="340" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="150" y="164" width="340" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <polygon points="320,220 406,266 320,312 234,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="150" y="344" width="340" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="150" y="430" width="340" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <ellipse cx="320" cy="498" rx="48" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <text x="320" y="63" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">开始</text>
  <text x="320" y="115" text-anchor="middle" font-size="12.5" fill="#2e4f70" font-weight="bold" filter="url(#rough2)">首窗求和（只需一次 O(k) 累加）</text>
  <text x="320" y="137" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">S ← nums[0] + nums[1] + ⋯ + nums[k−1]</text>
  <text x="320" y="184" text-anchor="middle" font-size="12.5" fill="#2e4f70" font-weight="bold" filter="url(#rough2)">maxSum ← S</text>
  <text x="320" y="201" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">初值必须取首窗和，不能写 0</text>
  <text x="320" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415" filter="url(#rough2)">i &lt; n ?</text>
  <text x="432" y="302" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#rough2)">i = k … n − 1</text>
  <text x="320" y="371" text-anchor="middle" font-size="12.5" fill="#2e4f70" filter="url(#rough2)">S ← S + nums[i] − nums[i − k]</text>
  <text x="320" y="393" text-anchor="middle" font-size="12.5" fill="#2e4f70" filter="url(#rough2)">maxSum ← max(maxSum, S)，i ← i + 1</text>
  <text x="320" y="457" text-anchor="middle" font-size="13" fill="#8f3830" font-weight="bold" filter="url(#rough2)">返回 (double) maxSum / k</text>
  <text x="320" y="503" text-anchor="middle" font-size="12" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">结束</text>

  <g fill="none" stroke="#6b6b6b" stroke-width="1.6" filter="url(#rough2)">
    <path d="M 320 79 L 320 92" marker-end="url(#arr)"/>
    <path d="M 320 144 L 320 162" marker-end="url(#arr)"/>
    <path d="M 320 208 L 320 218" marker-end="url(#arr)"/>
    <path d="M 320 312 L 320 342" marker-end="url(#arr)"/>
    <path d="M 320 472 L 320 481" marker-end="url(#arr)"/>
  </g>
  <text x="336" y="331" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 150 376 L 86 376 L 86 266 L 230 266" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="330" font-size="11" fill="#4a7a3a" filter="url(#rough2)">回边</text>

  <path d="M 406 266 L 500 266 L 500 451 L 494 451" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="422" y="256" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
</svg>
