<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 定位中位数 → 双指针左右夹取</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每轮丢掉一个端点，窗口恰好收缩一格，重复 k 轮</text>

  <rect x="170" y="62" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">1. 升序排序 arr</text>

  <path d="M 280 98 L 280 116" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="116" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="139" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">2. m = a[(n−1)//2]；l = 0，r = n−1</text>

  <path d="M 280 152 L 280 172" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="172" width="480" height="156" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="508" y="190" text-anchor="end" font-size="10" fill="#8a6a20" filter="url(#rough2)">重复 k 次</text>

  <polygon points="280,186 420,220 280,254 140,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">|a[r]−m| ≥ |a[l]−m| ?</text>

  <path d="M 200 236 L 152 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 236 L 408 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="242" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="402" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="42" y="264" width="176" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="285" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">取 a[l]，l++</text>

  <rect x="342" y="264" width="176" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="285" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">取 a[r]，r−−</text>

  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每轮取走后窗口收缩一格，直至选满 k 个</text>

  <path d="M 280 328 L 280 344" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="346" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#8a4a48" filter="url(#rough2)">返回 res（顺序任意）</text>
</svg>
