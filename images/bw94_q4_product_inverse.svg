<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">整句乘法原理 + 模逆元：s = "too hot"</text>

  <!-- 两个单词 -->
  <rect x="60" y="50" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="78" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">"too"</text>

  <rect x="330" y="50" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="78" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">"hot"</text>

  <text x="262" y="78" font-size="15" fill="#666" filter="url(#rough2)">×</text>

  <!-- 各自方案数 -->
  <path d="M120,98 L120,130" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M390,98 L390,130" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="50" y="134" width="140" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3! / 2! = 3</text>
  <text x="120" y="172" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">fact[3] × invFact[2]</text>

  <rect x="320" y="134" width="140" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3! = 6</text>
  <text x="390" y="172" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">fact[3] × invFact[1]³</text>

  <!-- 乘法 -->
  <path d="M190,157 L300,157" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="245" y="148" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">相乘 mod p</text>

  <rect x="170" y="200" width="180" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">ans = 3 × 6 = 18</text>

  <!-- 逆元预计算侧栏 -->
  <rect x="30" y="264" width="460" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">模 p = 10⁹+7（素数）下「除法」→「乘逆元」</text>
  <text x="260" y="306" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">fact 表正向递推；invFact[n] = fact[n]^(p−2)（费马小定理）</text>
  <text x="260" y="330" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">invFact[i−1] = invFact[i] × i，一次快速幂倒推出全表</text>
</svg>
