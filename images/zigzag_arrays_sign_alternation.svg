<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 445"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="445" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">锯齿形条件 ⟺ 相邻比较号交替（升、降轮流出现）</text>

  <!-- 主例：2 4 1 3 2 -->
  <rect x="100" y="78" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126" y="104" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="200" y="78" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="104" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="300" y="78" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="326" y="104" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="400" y="78" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="426" y="104" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="500" y="78" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="526" y="104" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">2</text>

  <!-- 升弧（2→4）与（1→3） -->
  <path d="M 142 74 Q 176 36 210 74" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="176" y="48" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">升</text>
  <path d="M 342 74 Q 376 36 410 74" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="376" y="48" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">升</text>

  <!-- 降弧（4→1）与（3→2） -->
  <path d="M 242 122 Q 276 162 310 122" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="276" y="158" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">降</text>
  <path d="M 442 122 Q 476 162 510 122" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="476" y="158" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">降</text>

  <text x="320" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">升 → 降 → 升 → 降，比较号交替 ✓ 合法锯齿形</text>

  <path d="M 40 202 L 600 202" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="320" y="228" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">禁止形态：连续两步同向 ⟺ 三元严格单调</text>

  <!-- 左：三元严格递增 -->
  <rect x="70" y="252" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="93" y="275" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <rect x="150" y="252" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="173" y="275" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">2</text>
  <rect x="230" y="252" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="253" y="275" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">3</text>
  <path d="M 105 248 Q 123 224 141 248" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="123" y="230" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">升</text>
  <path d="M 185 248 Q 203 224 221 248" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="203" y="230" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">升</text>
  <path d="M 58 242 L 262 340" stroke="#b85450" stroke-width="3" opacity="0.55" filter="url(#rough2)"/>
  <path d="M 262 242 L 58 340" stroke="#b85450" stroke-width="3" opacity="0.55" filter="url(#rough2)"/>
  <text x="160" y="364" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 &lt; 2 &lt; 3：三元严格递增 ✗</text>

  <!-- 右：三元严格递减 -->
  <rect x="370" y="252" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="393" y="275" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">3</text>
  <rect x="450" y="252" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="473" y="275" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">2</text>
  <rect x="530" y="252" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="553" y="275" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <path d="M 405 292 Q 423 316 441 292" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="423" y="314" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">降</text>
  <path d="M 485 292 Q 503 316 521 292" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="503" y="314" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">降</text>
  <path d="M 358 242 L 562 340" stroke="#b85450" stroke-width="3" opacity="0.55" filter="url(#rough2)"/>
  <path d="M 562 242 L 358 340" stroke="#b85450" stroke-width="3" opacity="0.55" filter="url(#rough2)"/>
  <text x="460" y="364" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3 &gt; 2 &gt; 1：三元严格递减 ✗</text>

  <!-- 底部要点框 -->
  <rect x="48" y="382" width="544" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">相邻不等 ⇒ 每一步非「升」即「降」；三元单调 ⇔ 连续两步同号</text>
  <text x="320" y="424" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">故合法 ⇔ 升降严格交替：整条数组只有「升降升降…」与「降升降升…」两种走势</text>
</svg>
