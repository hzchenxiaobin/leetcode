<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：Quebec 与 New York 的双链上溯</text>

  <!-- 两条链 -->
  <text x="60" y="66" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">region1 = Quebec 的祖先链（存入集合）</text>
  <g filter="url(#rough2)">
    <rect x="52"  y="80" width="96" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="160" y="80" width="96" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="268" y="80" width="120" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="404" y="80" width="96" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="100" y="104">Quebec</text><text x="208" y="104">Canada</text>
    <text x="328" y="104">North America</text><text x="452" y="104">Earth</text>
  </g>
  <path d="M 150 99 L 156 99" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 258 99 L 264 99" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 99 L 400 99" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="60" y="164" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">region2 = New York 逐级上溯（检查是否命中集合）</text>
  <g filter="url(#rough2)">
    <rect x="52"  y="178" width="96" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <rect x="160" y="178" width="96" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <rect x="268" y="178" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6"/>
    <rect x="404" y="178" width="96" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="100" y="202">New York ✗</text><text x="208" y="202">United States ✗</text>
    <text x="328" y="202" fill="#2d5a22" font-weight="bold">North America ✓</text><text x="452" y="202">Earth（不会走到）</text>
  </g>
  <path d="M 150 197 L 156 197" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 258 197 L 264 197" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 197 L 400 197" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 命中说明 -->
  <rect x="60" y="248" width="440" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">上溯序列：New York ∉ 集合 → United States ∉ 集合 →</text>
  <text x="280" y="296" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">North America ∈ 集合 → 输出 "North America"</text>

  <rect x="60" y="326" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">第二个示例 Canada / South America：两条链只在 Earth 相交，</text>
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">说明「先存 region1 链再查 region2 链」对远亲同样正确</text>
</svg>
