<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">O(1) 解法流程：取模 + 一次比较</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input -->
  <g filter="url(#sk)">
    <rect x="250" y="54" width="140" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415" filter="url(#sk)">输入 n, k</text>

  <path d="M 320 92 L 320 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- period -->
  <g filter="url(#sk)">
    <rect x="215" y="116" width="210" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">period = 2 × (n − 1)</text>

  <path d="M 320 154 L 320 174" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- mod -->
  <g filter="url(#sk)">
    <rect x="215" y="178" width="210" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">r = k mod period</text>

  <path d="M 320 216 L 320 238" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond -->
  <g filter="url(#sk)">
    <polygon points="320,240 412,282 320,324 228,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415" filter="url(#sk)">r &lt; n ?</text>

  <!-- left branch -->
  <path d="M 228 282 L 178 282" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="203" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">是（去程）</text>
  <g filter="url(#sk)">
    <rect x="48" y="260" width="126" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="111" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">return r</text>

  <!-- right branch -->
  <path d="M 412 282 L 462 282" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="437" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">否（回程）</text>
  <g filter="url(#sk)">
    <rect x="466" y="260" width="126" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="529" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">return period − r</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="328" width="560" height="38" rx="8" fill="#f4f4f0" stroke="#9a9a90" stroke-width="1.2"/>
  </g>
  <text x="320" y="352" text-anchor="middle" font-size="12" fill="#5a5a50" filter="url(#sk)">n, k ≤ 50 时按秒模拟 O(k) 也能过；公式 O(1)，k 大到 10¹⁸ 依然成立</text>
</svg>
