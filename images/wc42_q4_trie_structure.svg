<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">字典树：三个词根共享一棵前缀树</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">dictionary = ["cat", "bat", "rat"]；边上的字母即节点字母，粗圈 = 终结节点（一个词根的末尾）</text>

  <!-- 边 -->
  <g filter="url(#rough2)" stroke="#888" stroke-width="1.6">
    <line x1="64" y1="180" x2="168" y2="90"/>
    <line x1="64" y1="180" x2="168" y2="180"/>
    <line x1="64" y1="180" x2="168" y2="270"/>
    <line x1="168" y1="90" x2="272" y2="90"/>
    <line x1="168" y1="180" x2="272" y2="180"/>
    <line x1="168" y1="270" x2="272" y2="270"/>
    <line x1="272" y1="90" x2="376" y2="90"/>
    <line x1="272" y1="180" x2="376" y2="180"/>
    <line x1="272" y1="270" x2="376" y2="270"/>
  </g>

  <!-- cattle 的下降路径：root -> c -> a -> t 高亮 -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2.8" marker-end="url(#arr)">
    <line x1="64" y1="180" x2="150" y2="100"/>
    <line x1="186" y1="88" x2="254" y2="88"/>
    <line x1="290" y1="88" x2="356" y2="88"/>
  </g>

  <!-- 节点 -->
  <g filter="url(#rough2)">
    <circle cx="64" cy="180" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="64" y="184" text-anchor="middle" font-size="11" fill="#2f4666">root</text>
    <text x="64" y="152" text-anchor="middle" font-size="10" fill="#888">空</text>

    <circle cx="168" cy="90" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="168" y="95" text-anchor="middle" font-size="13" fill="#2f4666">c</text>
    <circle cx="168" cy="180" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="168" y="185" text-anchor="middle" font-size="13" fill="#2f4666">b</text>
    <circle cx="168" cy="270" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="168" y="275" text-anchor="middle" font-size="13" fill="#2f4666">r</text>

    <circle cx="272" cy="90" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="272" y="95" text-anchor="middle" font-size="13" fill="#2f4666">a</text>
    <circle cx="272" cy="180" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="272" y="185" text-anchor="middle" font-size="13" fill="#2f4666">a</text>
    <circle cx="272" cy="270" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="272" y="275" text-anchor="middle" font-size="13" fill="#2f4666">a</text>

    <circle cx="376" cy="90" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="376" y="95" text-anchor="middle" font-size="13" fill="#7a5a10">t</text>
    <circle cx="376" cy="180" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="376" y="185" text-anchor="middle" font-size="13" fill="#7a5a10">t</text>
    <circle cx="376" cy="270" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="376" y="275" text-anchor="middle" font-size="13" fill="#7a5a10">t</text>

    <text x="400" y="94" font-size="10" fill="#a07a20">终结：cat</text>
    <text x="400" y="184" font-size="10" fill="#a07a20">终结：bat</text>
    <text x="400" y="274" font-size="10" fill="#a07a20">终结：rat</text>
  </g>

  <rect x="30" y="294" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#3c5c30">
    <text x="46" y="314" font-weight="bold">查询规则（以 cattle 为例，红色路径）</text>
    <text x="46" y="332">沿字符逐层下降 root → c → a → t，落到终结节点 ⇒ 立刻输出前缀 "cat"，后面的 tle 不再管</text>
    <text x="46" y="350">首次命中即最短；中途无子节点（如 "the" 的 t 之后没有 h）⇒ 原样保留</text>
  </g>
</svg>
