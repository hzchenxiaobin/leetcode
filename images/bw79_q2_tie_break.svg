<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="310" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">平局规则：返回字典序最大的名字</text>

  <!-- 两个并列最大 -->
  <g filter="url(#rough2)">
    <rect x="60" y="58" width="170" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="290" y="58" width="170" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="145" y="84">Bob</text>
    <text x="145" y="108" fill="#4a7a3a" font-weight="bold">5 个单词</text>
    <text x="375" y="84">Charlie</text>
    <text x="375" y="108" fill="#4a7a3a" font-weight="bold">5 个单词</text>
  </g>
  <text x="260" y="150" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)" text-anchor="middle">单词数打平！题目要求：返回字典序「最大」的名字</text>

  <!-- 首字母比较 -->
  <g filter="url(#rough2)">
    <rect x="150" y="170" width="80" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="290" y="170" width="80" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="22" fill="#333" text-anchor="middle">
    <text x="190" y="204">B</text><text x="330" y="204">C</text>
  </g>
  <path d="M 236 196 L 282 196" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="186" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">&lt;</text>
  <text x="190" y="244" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="middle">'B' = 66</text>
  <text x="330" y="244" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="middle">'C' = 67</text>

  <g filter="url(#rough2)">
    <rect x="150" y="262" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="284" font-size="13" fill="#333" filter="url(#rough2)" text-anchor="middle">"Charlie" 更大 → 返回 "Charlie"</text>
</svg>
