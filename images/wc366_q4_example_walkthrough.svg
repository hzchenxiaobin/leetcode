<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1：nums = [2,6,5,8]，k = 2 —— 真实操作与位库存殊途同归</text>
  <path d="M 120 36 Q 320 44 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: absorption construction -->
  <g filter="url(#sk)">
    <rect x="36" y="74" width="300" height="252" rx="10" fill="#ffffff" stroke="#b9c6d8" stroke-width="1.3"/>
  </g>
  <text x="186" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">依序吸收构造（真实操作序列）</text>
  <text x="186" y="84" text-anchor="middle" font-size="10" fill="#556" filter="url(#sk)">op(i,j)：i 为 OR 侧（吸收方），j 交出位</text>

  <g filter="url(#sk)" font-size="11" fill="#556">
    <text x="98" y="108" text-anchor="end">初始</text>
    <text x="98" y="138" text-anchor="end">op(0,1)</text>
    <text x="98" y="168" text-anchor="end">op(0,2)</text>
    <text x="98" y="198" text-anchor="end">op(0,3)</text>
    <text x="98" y="228" text-anchor="end">op(1,2)</text>
    <text x="98" y="258" text-anchor="end">op(1,3)</text>
  </g>

  <!-- array rows: cells x=104+i*33, w=30, h=24 -->
  <g filter="url(#sk)">
    <rect x="104" y="92" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="137" y="92" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="170" y="92" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="203" y="92" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="119" y="108" text-anchor="middle" font-size="11.5" fill="#333">2</text>
    <text x="152" y="108" text-anchor="middle" font-size="11.5" fill="#333">6</text>
    <text x="185" y="108" text-anchor="middle" font-size="11.5" fill="#333">5</text>
    <text x="218" y="108" text-anchor="middle" font-size="11.5" fill="#333">8</text>

    <rect x="104" y="122" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="137" y="122" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="170" y="122" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="203" y="122" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="119" y="138" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">6</text>
    <text x="152" y="138" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">2</text>
    <text x="185" y="138" text-anchor="middle" font-size="11.5" fill="#333">5</text>
    <text x="218" y="138" text-anchor="middle" font-size="11.5" fill="#333">8</text>

    <rect x="104" y="152" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="137" y="152" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="170" y="152" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="203" y="152" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="119" y="168" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">7</text>
    <text x="152" y="168" text-anchor="middle" font-size="11.5" fill="#333">2</text>
    <text x="185" y="168" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">4</text>
    <text x="218" y="168" text-anchor="middle" font-size="11.5" fill="#333">8</text>

    <rect x="104" y="182" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="137" y="182" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="170" y="182" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="203" y="182" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="119" y="198" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">15</text>
    <text x="152" y="198" text-anchor="middle" font-size="11.5" fill="#333">2</text>
    <text x="185" y="198" text-anchor="middle" font-size="11.5" fill="#333">4</text>
    <text x="218" y="198" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">0</text>

    <rect x="104" y="212" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="137" y="212" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="170" y="212" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="203" y="212" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="119" y="228" text-anchor="middle" font-size="11" fill="#2e5e22" font-weight="bold">15</text>
    <text x="152" y="228" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">6</text>
    <text x="185" y="228" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">0</text>
    <text x="218" y="228" text-anchor="middle" font-size="11.5" fill="#333">0</text>

    <rect x="104" y="242" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="137" y="242" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="170" y="242" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="203" y="242" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="119" y="258" text-anchor="middle" font-size="11" fill="#2e5e22" font-weight="bold">15</text>
    <text x="152" y="258" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-weight="bold">6</text>
    <text x="185" y="258" text-anchor="middle" font-size="11.5" fill="#333">0</text>
    <text x="218" y="258" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  </g>
  <text x="240" y="198" font-size="10" font-weight="bold" fill="#2e5e22" filter="url(#sk)">← v₁ 定格</text>
  <text x="240" y="228" font-size="10" font-weight="bold" fill="#2e5e22" filter="url(#sk)">← v₂ 定格</text>
  <text x="240" y="258" font-size="10" fill="#556" filter="url(#sk)">（值不变）</text>

  <g filter="url(#sk)">
    <rect x="60" y="276" width="250" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="185" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#sk)">选 15 与 6 → 15² + 6² = 261</text>

  <!-- right panel: bit counting -->
  <g filter="url(#sk)">
    <rect x="348" y="74" width="256" height="252" rx="10" fill="#ffffff" stroke="#b9c6d8" stroke-width="1.3"/>
  </g>
  <text x="476" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">位库存直达（比赛写法）</text>
  <g filter="url(#sk)" font-size="12" fill="#333">
    <text x="372" y="102">bit3（值 8）：<tspan font-weight="bold" fill="#2e5e22">cnt = 1</tspan></text>
    <text x="372" y="126">bit2（值 4）：<tspan font-weight="bold" fill="#2e5e22">cnt = 2</tspan></text>
    <text x="372" y="150">bit1（值 2）：<tspan font-weight="bold" fill="#2e5e22">cnt = 2</tspan></text>
    <text x="372" y="174">bit0（值 1）：<tspan font-weight="bold" fill="#2e5e22">cnt = 1</tspan></text>
  </g>
  <path d="M 368 190 Q 476 196 584 190" stroke="#c9d4e0" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="372" y="218" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">i = 1：v₁ = 8 + 4 + 2 + 1 = 15</text>
  <text x="372" y="246" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">i = 2：v₂ = 4 + 2 = 6</text>
  <g filter="url(#sk)">
    <rect x="372" y="276" width="216" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="480" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#sk)">15² + 6² = 261 ✓</text>

  <!-- bottom boxes -->
  <g filter="url(#sk)">
    <rect x="40" y="338" width="560" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#sk)">对照官方解法：op(0,3) 得 [0,6,5,10]，再 op(2,3) 得 [0,6,0,15] —— 同样收敛到 {15, 6}</text>
  <text x="320" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#sk)">嵌套链是一切最优操作殊途同归的终点：怎么搬无所谓，搬到位即可</text>
  <g filter="url(#sk)">
    <rect x="40" y="404" width="560" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="430" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">比赛写法：数 cnt → 按 i 拼 v → 平方和取模，O((n+k)·30) 一步到位</text>
</svg>
