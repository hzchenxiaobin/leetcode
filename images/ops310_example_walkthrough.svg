<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：s = "abacaba"</text>

  <!-- 表格：表头 -->
  <rect x="24" y="46" width="472" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i</text>
  <text x="80" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s[i]</text>
  <text x="155" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">判断</text>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">动作</text>
  <text x="389" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">段内集合</text>
  <text x="472" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- 行 0：a 新字符 -->
  <rect x="24" y="74" width="472" height="32" fill="#f4faf4" stroke="#9bb89a" stroke-width="1" filter="url(#rough2)"/>
  <text x="42" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="80" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="155" y="95" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">新字符</text>
  <text x="270" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">并入当前段</text>
  <text x="389" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{a}</text>
  <text x="472" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 1：b 新字符 -->
  <rect x="24" y="106" width="472" height="32" fill="#f4faf4" stroke="#9bb89a" stroke-width="1" filter="url(#rough2)"/>
  <text x="42" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="80" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="155" y="127" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">新字符</text>
  <text x="270" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">并入当前段</text>
  <text x="389" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{a, b}</text>
  <text x="472" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 2：a 重复 -->
  <rect x="24" y="138" width="472" height="32" fill="#fff3e0" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="80" y="159" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="155" y="159" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">重复！</text>
  <text x="270" y="159" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">切割，新段 {a}</text>
  <text x="389" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{a}</text>
  <text x="472" y="159" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 行 3：c 新字符 -->
  <rect x="24" y="170" width="472" height="32" fill="#f4faf4" stroke="#9bb89a" stroke-width="1" filter="url(#rough2)"/>
  <text x="42" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="80" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <text x="155" y="191" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">新字符</text>
  <text x="270" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">并入当前段</text>
  <text x="389" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{a, c}</text>
  <text x="472" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行 4：a 重复 -->
  <rect x="24" y="202" width="472" height="32" fill="#fff3e0" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="80" y="223" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="155" y="223" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">重复！</text>
  <text x="270" y="223" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">切割，新段 {a}</text>
  <text x="389" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{a}</text>
  <text x="472" y="223" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 行 5：b 新字符 -->
  <rect x="24" y="234" width="472" height="32" fill="#f4faf4" stroke="#9bb89a" stroke-width="1" filter="url(#rough2)"/>
  <text x="42" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="80" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="155" y="255" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">新字符</text>
  <text x="270" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">并入当前段</text>
  <text x="389" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{a, b}</text>
  <text x="472" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 6：a 重复 -->
  <rect x="24" y="266" width="472" height="32" fill="#fff3e0" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="80" y="287" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="155" y="287" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">重复！</text>
  <text x="270" y="287" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">切割，新段 {a}</text>
  <text x="389" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{a}</text>
  <text x="472" y="287" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 分段条 -->
  <text x="26" y="336" font-size="13" fill="#333" filter="url(#rough2)">贪心划分：</text>

  <rect x="110" y="318" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="344" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">ab</text>
  <rect x="178" y="318" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="344" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">ac</text>
  <rect x="246" y="318" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="276" y="344" text-anchor="middle" font-size="14" fill="#a07820" filter="url(#rough2)">ab</text>
  <rect x="314" y="318" width="36" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="332" y="344" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">a</text>

  <text x="140" y="374" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">①</text>
  <text x="208" y="374" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">②</text>
  <text x="276" y="374" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">③</text>
  <text x="332" y="374" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">④</text>

  <text x="430" y="344" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 4 段 ✓ 最少</text>
  <text x="260" y="398" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">每列 ans 只在「重复」行 +1 —— 切割次数 = ans − 1 = 3</text>
</svg>
