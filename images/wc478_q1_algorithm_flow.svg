<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：特判 → 排序 → 取阈值 → 一次二分</text>

  <!-- 开始 -->
  <rect x="240" y="44" width="160" height="38" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="68" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">输入 nums 与 k</text>

  <path d="M320,82 L320,102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 k=0 -->
  <polygon points="320,106 425,148 320,190 215,148" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">k = 0 ?</text>

  <!-- 是：返回 n -->
  <path d="M425,148 L486,148" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="138" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">是</text>
  <rect x="490" y="126" width="112" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="546" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">返回 n</text>
  <text x="546" y="163" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">（全员合格）</text>

  <!-- 否 -->
  <path d="M320,190 L320,210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="331" y="204" font-size="11.5" fill="#666" filter="url(#rough2)">否</text>

  <!-- 排序 -->
  <rect x="210" y="212" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="237" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">升序排序 nums</text>

  <path d="M320,252 L320,270" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取阈值 -->
  <rect x="165" y="272" width="310" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">t = nums[n − k]</text>
  <text x="320" y="313" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（计重数的第 k 大）</text>

  <path d="M320,324 L320,342" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 二分 -->
  <rect x="110" y="344" width="340" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = lower_bound(nums, t)</text>
  <text x="280" y="387" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">首个 = t 的下标，其左侧元素全部小于 t</text>

  <path d="M280,400 L280,418" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="200" y="420" width="160" height="38" rx="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>

  <!-- 进阶注记 -->
  <rect x="474" y="350" width="150" height="64" rx="8" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="549" y="371" text-anchor="middle" font-size="11" font-weight="bold" fill="#666" filter="url(#rough2)">进阶：nth_element</text>
  <text x="549" y="387" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">找 t，再线性计数</text>
  <text x="549" y="402" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">平均 O(n)</text>
</svg>
