<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：每行删最大 ⇒ 排序后按列取最大</text>
  <path d="M 190 44 Q 340 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left panel: original matrix -> sorted matrix -->
  <text x="60" y="76" font-size="13" font-weight="bold" fill="#2b6e9e">① 原矩阵</text>
  <g filter="url(#sk)">
    <rect x="70" y="88" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="120" y="88" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="170" y="88" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="70" y="126" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="120" y="126" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="170" y="126" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="93" y="111" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="143" y="111" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="193" y="111" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="93" y="149" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="143" y="149" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="193" y="149" text-anchor="middle" font-size="14" fill="#333">1</text>

  <g filter="url(#sk)">
    <path d="M 143 172 L 143 200" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <text x="160" y="192" font-size="11" fill="#7a5415">每行升序排序</text>

  <text x="60" y="206" font-size="13" font-weight="bold" fill="#2e6e2e">② 排序后</text>
  <g filter="url(#sk)">
    <rect x="70" y="212" width="46" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="120" y="212" width="46" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="170" y="212" width="46" height="36" rx="4" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="70" y="250" width="46" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="120" y="250" width="46" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="170" y="250" width="46" height="36" rx="4" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="93" y="235" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="143" y="235" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="193" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="93" y="273" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="143" y="273" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="193" y="273" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- column max badges -->
  <g filter="url(#sk)">
    <rect x="70" y="296" width="46" height="24" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="120" y="296" width="46" height="24" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="170" y="296" width="46" height="24" rx="6" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="93" y="312" text-anchor="middle" font-size="11" fill="#2e6e2e">max=1</text>
  <text x="143" y="312" text-anchor="middle" font-size="11" fill="#2e6e2e">max=3</text>
  <text x="193" y="312" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">max=4</text>
  <text x="60" y="344" font-size="11" fill="#888">第 t 轮删除的恰是倒数第 t 列（列 j = n−t）</text>

  <!-- Right panel: rounds -->
  <text x="390" y="76" font-size="13" font-weight="bold" fill="#2b6e2b">③ 逐轮删除 → 逐列取最大</text>

  <text x="390" y="104" font-size="12" font-weight="bold" fill="#2b2b2b">第 1 轮</text>
  <g filter="url(#sk)">
    <rect x="455" y="85" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="493" y="85" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="471" y="103" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="509" y="103" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="532" y="104" font-size="14" fill="#3a3a3a">→</text>
  <text x="552" y="104" font-size="14" font-weight="bold" fill="#b03a3a">+4</text>
  <text x="470" y="128" font-size="10" fill="#888">（列 2）</text>

  <text x="390" y="152" font-size="12" font-weight="bold" fill="#2b2b2b">第 2 轮</text>
  <g filter="url(#sk)">
    <rect x="455" y="133" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="493" y="133" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="471" y="151" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="509" y="151" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="532" y="152" font-size="14" fill="#3a3a3a">→</text>
  <text x="552" y="152" font-size="14" font-weight="bold" fill="#b03a3a">+3</text>
  <text x="470" y="176" font-size="10" fill="#888">（列 1）</text>

  <text x="390" y="200" font-size="12" font-weight="bold" fill="#2b2b2b">第 3 轮</text>
  <g filter="url(#sk)">
    <rect x="455" y="181" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="493" y="181" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="471" y="199" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="509" y="199" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="532" y="200" font-size="14" fill="#3a3a3a">→</text>
  <text x="552" y="200" font-size="14" font-weight="bold" fill="#b03a3a">+1</text>
  <text x="470" y="224" font-size="10" fill="#888">（列 0）</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="380" y="238" width="272" height="80" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="516" y="266" text-anchor="middle" font-size="13" fill="#444">答案 = 4 + 3 + 1</text>
  <text x="516" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">= 8 ✓</text>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="40" y="356" width="612" height="58" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="60" y="380" font-size="11.5" font-weight="bold" fill="#2b2b2b">关键观察：第 t 轮删除的值集合 = 排序后矩阵的一整列，并列删任一不影响值集合。</text>
  <text x="60" y="402" font-size="11" fill="#444">于是逐轮模拟的 O(mn²) 塌缩为「每行排序 + 逐列取最大求和」的 O(mn log n)，且无删除细节。</text>
</svg>
