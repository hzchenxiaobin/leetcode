<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 386"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="386" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">状态转移：每个格子只看上一行的三个邻居</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">matrix 的两行示意（灰色为可来源）</text>
  <rect x="200" y="186" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230.0" y="209.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,0)</text>
  <rect x="270" y="186" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300.0" y="209.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,1)</text>
  <rect x="340" y="186" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370.0" y="209.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,2)</text>
  <rect x="270" y="106" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300.0" y="129.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,1)</text>
  <rect x="200" y="106" width="60" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230.0" y="129.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0)</text>
  <rect x="340" y="106" width="60" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370.0" y="129.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,2)</text>
  <path d="M 230 148 L 230 182" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 300 148 L 300 182" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 370 148 L 370 182" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="330" y="246" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">dp[r][c] = matrix[r][c] + min(dp[r−1][c−1], dp[r−1][c], dp[r−1][c+1])</text>
  <rect x="60" y="262" width="540" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="286.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">边界列只有两个来源；第一行直接等于 matrix[0]</text>
  <text x="330" y="330" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 最后一行 dp 的最小值</text>
  <text x="330" y="366" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">只需保留上一行 → 空间从 O(n²) 降到 O(n)</text>
</svg>
