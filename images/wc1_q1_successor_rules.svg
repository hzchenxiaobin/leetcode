<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">先序后继：三条规则，O(1) 算出下一个数</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">先尝试深入长子，再尝试下一个兄弟，都不行才回退</text>

  <g filter="url(#rough2)">
    <rect x="38" y="84" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="272" y="84" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="60" y="105">1</text>
    <text x="294" y="105">2</text>
  </g>
  <text x="160" y="76" text-anchor="middle" font-size="9.5" fill="#b07a20" filter="url(#rough2)">父节点的下一个兄弟</text>

  <path d="M 86 100 L 268 100" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="35" y="170" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <rect x="115" y="170" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="195" y="170" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="22" y="248" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="60" y="191">10</text>
    <text x="140" y="191">11</text>
    <text x="220" y="191">12</text>
  </g>
  <text x="60" y="268" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">10·cur</text>

  <g filter="url(#rough2)" stroke="#8899aa" stroke-width="1.1" fill="none">
    <path d="M 58 170 L 58 120" marker-end="url(#arr)"/>
    <path d="M 85 186 L 113 186" marker-end="url(#arr)"/>
    <path d="M 58 202 L 58 244" marker-end="url(#arr)"/>
  </g>
  <text x="66" y="150" font-size="9" fill="#666" filter="url(#rough2)">回退 · 规则 3</text>
  <text x="100" y="180" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">兄弟</text>
  <text x="66" y="228" font-size="9" fill="#666" filter="url(#rough2)">深入 · 规则 1</text>

  <text x="140" y="304" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">cur = 10 时的三种走法</text>

  <g filter="url(#rough2)">
    <rect x="356" y="84" width="268" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9"/>
    <rect x="356" y="160" width="268" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9"/>
    <rect x="356" y="244" width="268" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9"/>
  </g>

  <text x="370" y="104" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">规则 1 · 深入（最先判断）</text>
  <text x="370" y="122" font-size="9.5" fill="#333" filter="url(#rough2)">10·cur ≤ n  ⇒  cur ← 10·cur</text>
  <text x="370" y="138" font-size="8.5" fill="#6a7a60" filter="url(#rough2)">先判这条，否则会跳过整棵子树</text>

  <text x="370" y="180" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">规则 2 · 下一个兄弟</text>
  <text x="370" y="198" font-size="9.5" fill="#333" filter="url(#rough2)">否则若还有兄弟：</text>
  <text x="370" y="214" font-size="9.5" fill="#333" filter="url(#rough2)">cur % 10 ≠ 9 且 cur+1 ≤ n</text>
  <text x="370" y="228" font-size="9.5" fill="#333" filter="url(#rough2)">⇒  cur ← cur + 1</text>

  <text x="370" y="264" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">规则 3 · 回退到父节点</text>
  <text x="370" y="282" font-size="9.5" fill="#333" filter="url(#rough2)">否则 cur ← cur // 10，再判规则 2</text>
  <text x="370" y="298" font-size="9.5" fill="#333" filter="url(#rough2)">可连退多层：199 → 19 → 1</text>
  <text x="370" y="312" font-size="8.5" fill="#8a6a60" filter="url(#rough2)">回退只发生在没有兄弟时</text>

  <rect x="40" y="350" width="560" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="372" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">每上移一层都恰好撤销一次之前的深入  ⇒  回退总次数 ≤ 深入总次数</text>
  <text x="320" y="390" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">n 轮循环均摊 O(1)／轮，总时间 O(n)，额外空间 O(1)</text>

  <text x="320" y="432" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">n = 13 时实际路径：1 → 10 → 11 → 12 → 13 →（回退到 1）→ 2 → 3 → … → 9</text>
</svg>
