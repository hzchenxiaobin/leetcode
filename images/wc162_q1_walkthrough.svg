<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="372" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：m = 2，n = 3，indices = [[0,1],[1,1]]</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">红色 = 奇数，绿色 = 偶数；右侧为最终形态</text>

  <text x="113" y="90" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">初始</text>
  <text x="313" y="90" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">执行 [0,1] 后</text>
  <text x="513" y="90" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">执行 [1,1] 后（最终）</text>

  <!-- 初始矩阵 -->
  <rect x="50" y="100" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="92" y="100" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="100" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="50" y="136" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="92" y="136" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="136" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="71" y="123" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="113" y="123" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="155" y="123" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="71" y="159" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="113" y="159" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="155" y="159" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">0</text>

  <path d="M 186 136 L 240 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第一轮后 -->
  <rect x="250" y="100" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="292" y="100" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="334" y="100" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="250" y="136" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="292" y="136" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="334" y="136" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="271" y="123" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="313" y="123" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="355" y="123" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="271" y="159" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="313" y="159" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="355" y="159" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">0</text>

  <path d="M 386 136 L 440 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 最终矩阵 -->
  <rect x="450" y="100" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="492" y="100" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="534" y="100" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="450" y="136" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="492" y="136" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="534" y="136" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="471" y="123" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="513" y="123" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="555" y="123" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="471" y="159" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="513" y="159" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="555" y="159" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">1</text>

  <text x="113" y="196" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">奇数 0 个</text>
  <text x="313" y="196" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">奇数 3 个</text>
  <text x="513" y="196" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">奇数 6 个 ✓</text>

  <!-- 计数器面板 -->
  <text x="50" y="228" font-size="10.5" fill="#555" filter="url(#rough2)">rowParity：</text>
  <rect x="128" y="212" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="212" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="145" y="229" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="179" y="229" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="206" y="228" font-size="10" fill="#888" filter="url(#rough2)">两行各被加 1 次 → R = 2</text>

  <text x="50" y="266" font-size="10.5" fill="#555" filter="url(#rough2)">colParity：</text>
  <rect x="128" y="250" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="250" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="250" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="145" y="267" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">0</text>
  <text x="179" y="267" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">0</text>
  <text x="213" y="267" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">0</text>
  <text x="238" y="266" font-size="10" fill="#888" filter="url(#rough2)">列 1 加 2 次 → C = 0</text>

  <rect x="368" y="206" width="230" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="483" y="230" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">R·(n−C) + (m−R)·C</text>
  <text x="483" y="252" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">= 2·(3−0) + (2−2)·0</text>
  <text x="483" y="272" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">= 6</text>

  <text x="320" y="320" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">公式只需 2 + 3 个计数器，就得到与逐格模拟相同的 6 —— 全程没有建出 2×3 矩阵</text>
  <text x="320" y="344" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对比示例 2：m = n = 2，indices = [[1,1],[0,0]] ⇒ R = 2，C = 2 ⇒ 0 ✓</text>
</svg>
