<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b">算法流程：外层枚举中位 j，内层左右各扫一趟</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><rect x="250" y="56" width="140" height="32" rx="16" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="320" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ans = 0</text>
  <path d="M 320 90 L 320 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- 枚举中位 -->
  <g filter="url(#sk)"><rect x="225" y="108" width="190" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="320" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">枚举中位 j = 1 … n−2</text>
  <path d="M 320 144 L 320 158" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- 扫左侧 -->
  <g filter="url(#sk)"><rect x="185" y="162" width="270" height="54" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="184" text-anchor="middle" font-size="11.5" fill="#2b6e9e">① 扫左侧 [0, j)：数出左小 leftSmaller</text>
  <text x="320" y="206" text-anchor="middle" font-size="11.5" fill="#2b6e9e">左大 = j − 左小（互异 ⟹ 非小即大）</text>
  <path d="M 320 218 L 320 232" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- 扫右侧 -->
  <g filter="url(#sk)"><rect x="185" y="236" width="270" height="54" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="258" text-anchor="middle" font-size="11.5" fill="#2b6e9e">② 扫右侧 (j, n)：数出右大 rightLarger</text>
  <text x="320" y="280" text-anchor="middle" font-size="11.5" fill="#2b6e9e">右小 = n−1−j − 右大</text>
  <path d="M 320 292 L 320 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- 累加贡献 -->
  <g filter="url(#sk)"><rect x="170" y="310" width="300" height="40" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="320" y="335" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a4a20">③ ans += 左小 × 右大 + 左大 × 右小</text>
  <path d="M 320 352 L 320 366" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- 判断菱形 -->
  <g filter="url(#sk)"><polygon points="250,400 320,372 390,400 320,428" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="320" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">j 遍历完？</text>

  <!-- 是 → 返回 -->
  <path d="M 390 400 L 466 400" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="425" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#sk)"><rect x="470" y="382" width="124" height="36" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="532" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">return ans</text>

  <!-- 否 → 回到枚举 -->
  <path d="M 250 400 C 95 400 95 127 221 127" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="158" y="117" text-anchor="middle" font-size="10.5" fill="#888">否（取下一个 j）</text>

  <!-- 右侧代价注记 -->
  <g filter="url(#sk)"><rect x="460" y="160" width="165" height="124" rx="8" fill="none" stroke="#8a9ab0" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <g font-size="10" fill="#6a7a90" text-anchor="middle">
    <text x="542" y="182" font-size="11" font-weight="bold">单步代价</text>
    <text x="542" y="200">左扫 O(j)</text>
    <text x="542" y="216">＋ 右扫 O(n−1−j)</text>
    <text x="542" y="232">单步合计 O(n)</text>
    <text x="542" y="250">共 n−2 个 j</text>
    <text x="542" y="268">⟹ 总 O(n²) ≈ 10⁶</text>
  </g>

  <text x="320" y="452" text-anchor="middle" font-size="11" fill="#888">递增与递减共享同一组计数 —— 一次扫描，两种队伍全数清</text>
</svg>
