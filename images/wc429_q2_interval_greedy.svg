<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：元素 x 可变成 [x-k, x+k] 内任意整数</text>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2：nums = [4,4,4,4]，k = 1 → 四个区间都是 [3, 5]</text>

  <!-- 数轴 -->
  <path d="M60,252 L470,252" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M70,246 L70,258 M146,246 L146,258 M222,246 L222,258 M298,246 L298,258 M374,246 L374,258 M450,246 L450,258" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="146" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="222" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="298" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <text x="374" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">6</text>
  <text x="450" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">7</text>

  <!-- 放置点到数轴的虚线 -->
  <path d="M146,103 L146,244" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M222,143 L222,244" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M298,183 L298,244" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 四个区间条 [3,5] -->
  <rect x="146" y="84" width="152" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="99" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>
  <circle cx="146" cy="95" r="7" fill="#4a7a3a" stroke="#2d4d24" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">放 3</text>

  <rect x="146" y="124" width="152" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="139" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">i=1</text>
  <circle cx="222" cy="135" r="7" fill="#4a7a3a" stroke="#2d4d24" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">放 4</text>

  <rect x="146" y="164" width="152" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="179" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">i=2</text>
  <circle cx="298" cy="175" r="7" fill="#4a7a3a" stroke="#2d4d24" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">放 5</text>

  <rect x="146" y="204" width="152" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="219" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">i=3</text>

  <!-- 第 4 个区间被堵死：cur=6 > 5 -->
  <path d="M366,208 L382,224 M382,208 L366,224" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="376" y="196" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">cur = last+1 = 6 &gt; 5</text>
  <text x="376" y="240" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">放弃（保持原值 4）</text>

  <!-- 底部说明框 -->
  <rect x="55" y="300" width="410" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#7a6020" filter="url(#rough2)">贪心：cur = max(x-k, last+1)，取区间内比 last 大的最小整数</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">放得越小，给后面留的空间越大；整个区间被堵死才放弃</text>
</svg>
