<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="24" y="30" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">两句话合并计数：只保留出现恰好 1 次的单词</text>
  <rect x="24" y="48" width="290" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="169.0" y="71.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">s1 = "this apple is sweet"</text>
  <rect x="24" y="94" width="290" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="169.0" y="117.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">s2 = "this apple is sour"</text>
  <rect x="340" y="48" width="270" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="475.0" y="84.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">拼接成一个长句</text>
  <text x="475.0" y="104.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">按空格切分 → 8 个单词</text>
  <path d="M316 90 L338 90" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M475 136 L475 164" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="24" y="170" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">空白分隔、单词只含小写字母 ⇒ 直接 split</text>
  <rect x="340" y="168" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="490" y="168" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="415" y="188" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">单词</text>
  <text x="550" y="188" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">次数</text>
  <rect x="340" y="198" width="150" height="28" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="490" y="198" width="120" height="28" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">this</text>
  <text x="550" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="340" y="226" width="150" height="28" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="490" y="226" width="120" height="28" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">apple</text>
  <text x="550" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="340" y="254" width="150" height="28" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="490" y="254" width="120" height="28" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="273" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">is</text>
  <text x="550" y="273" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="340" y="282" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="490" y="282" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="301" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sweet</text>
  <text x="550" y="301" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="340" y="310" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="490" y="310" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="329" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sour</text>
  <text x="550" y="329" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="24" y="200" width="280" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="164.0" y="236.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">答案（顺序任意）</text>
  <text x="164.0" y="256.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">["sweet", "sour"]</text>
  <path d="M336 242 L308 242" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="24" y="316" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">计数 &gt; 1 的单词在两个句子里反复出现</text>
  <text x="24" y="340" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">⇒ 一律淘汰；只统计合并后的总次数</text>
</svg>
