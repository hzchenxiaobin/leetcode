<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">剥洋葱：两端同字符，整段成对剥掉</text>

  <!-- 第一行 aabccabba -->
  <text x="34" y="82" font-size="13" fill="#666" filter="url(#rough2)">第 0 层</text>
  <g>
    <rect x="100" y="60" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="134" y="60" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="168" y="60" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="202" y="60" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="236" y="60" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="270" y="60" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="304" y="60" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="338" y="60" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="372" y="60" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="117" y="83" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
    <text x="151" y="83" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
    <text x="185" y="83" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
    <text x="219" y="83" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
    <text x="253" y="83" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
    <text x="287" y="83" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
    <text x="321" y="83" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
    <text x="355" y="83" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
    <text x="389" y="83" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  </g>
  <text x="430" y="82" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">两端同为 a：剥「aa…a」</text>

  <path d="M240,98 Q240,122 240,138" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="122" font-size="12" fill="#666" filter="url(#rough2)">删 2 + 1 个 a</text>

  <!-- 第二行 bccabb -->
  <text x="34" y="172" font-size="13" fill="#666" filter="url(#rough2)">第 1 层</text>
  <g>
    <rect x="100" y="150" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="134" y="150" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="168" y="150" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="202" y="150" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="236" y="150" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="270" y="150" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="117" y="173" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
    <text x="151" y="173" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
    <text x="185" y="173" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
    <text x="219" y="173" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
    <text x="253" y="173" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
    <text x="287" y="173" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  </g>
  <text x="330" y="172" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">两端同为 b：剥「b…bb」</text>

  <path d="M190,188 Q190,212 190,228" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="212" font-size="12" fill="#666" filter="url(#rough2)">删 1 + 2 个 b</text>

  <!-- 第三行 cca -->
  <text x="34" y="262" font-size="13" fill="#666" filter="url(#rough2)">第 2 层</text>
  <g>
    <rect x="100" y="240" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <rect x="134" y="240" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <rect x="168" y="240" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="117" y="263" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
    <text x="151" y="263" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
    <text x="185" y="263" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  </g>
  <text x="230" y="262" font-size="12.5" fill="#b85450" filter="url(#rough2)">c ≠ a：卡死，剩余 3 个字符</text>

  <rect x="110" y="302" width="300" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">双指针 i、j 只增不减 → 答案 j − i + 1 = 3</text>
</svg>
