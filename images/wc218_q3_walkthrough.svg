<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：n = 5，数值与串同步生长</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">转移式 ans ← ans × 2^L + i；★ = L 跳变行（i 为 2 的幂）</text>

  <!-- 表头 -->
  <rect x="42" y="60" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <rect x="76" y="60" width="62" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">bin(i)</text>
  <rect x="138" y="60" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">L</text>
  <rect x="174" y="60" width="148" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans × 2^L + i</text>
  <rect x="322" y="60" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">新 ans</text>
  <rect x="388" y="60" width="210" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="493" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">串表示</text>

  <!-- 第 1 行：i=1，L 跳变 -->
  <rect x="42" y="86" width="34" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="76" y="86" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="86" width="36" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="156" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1 ★</text>
  <rect x="174" y="86" width="148" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0×2 + 1</text>
  <rect x="322" y="86" width="66" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="388" y="86" width="210" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="493" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- 第 2 行：i=2，L 跳变 -->
  <rect x="42" y="126" width="34" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="76" y="126" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="138" y="126" width="36" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="156" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2 ★</text>
  <rect x="174" y="126" width="148" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1×4 + 2</text>
  <rect x="322" y="126" width="66" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="388" y="126" width="210" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="493" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">110</text>

  <!-- 第 3 行：i=3，示例 2 终点 -->
  <rect x="42" y="166" width="34" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="76" y="166" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <rect x="138" y="166" width="36" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="174" y="166" width="148" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6×4 + 3</text>
  <rect x="322" y="166" width="66" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">27</text>
  <rect x="326" y="170" width="58" height="32" rx="4" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="388" y="166" width="210" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="190" font-size="12" fill="#333" filter="url(#rough2)">11011</text>
  <text x="447" y="190" font-size="9.5" fill="#b85450" filter="url(#rough2)">← 示例 2 停在这行</text>

  <!-- 第 4 行：i=4，L 跳变 -->
  <rect x="42" y="206" width="34" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="76" y="206" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">100</text>
  <rect x="138" y="206" width="36" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="156" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">3 ★</text>
  <rect x="174" y="206" width="148" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">27×8 + 4</text>
  <rect x="322" y="206" width="66" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">220</text>
  <rect x="388" y="206" width="210" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="493" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11011100</text>

  <!-- 第 5 行：i=5 -->
  <rect x="42" y="246" width="34" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="76" y="246" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">101</text>
  <rect x="138" y="246" width="36" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="174" y="246" width="148" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">220×8 + 5</text>
  <rect x="322" y="246" width="66" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1765</text>
  <rect x="388" y="246" width="210" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="493" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11011100101</text>

  <!-- 注记 -->
  <text x="320" y="316" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">第 5 行后串 = "11011100101" = 1765，与把 1~5 逐位直接拼出的结果完全一致 ✓</text>
  <text x="320" y="340" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">L 的跳变只发生在 ★ 行（i = 1、2、4）；每轮结束 ans &lt; MOD，移位前余数始终被压在 2^30 以内</text>
</svg>
