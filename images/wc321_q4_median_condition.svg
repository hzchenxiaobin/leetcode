<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="860" height="500" fill="#fafafa"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：中位数 = k ⟺ d = 大数个数 − 小数个数 ∈ {0, 1}</text>
  <path d="M 180 42 Q 430 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 变换规则条 -->
  <text x="62" y="90" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">变换：</text>
  <rect x="118" y="64" width="152" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">x &gt; k → +1（大）</text>
  <rect x="292" y="64" width="152" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="368" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">x &lt; k → −1（小）</text>
  <rect x="466" y="64" width="152" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="542" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">x = k → 0</text>
  <text x="646" y="82" font-size="11.5" fill="#555" filter="url(#rough2)">子数组里 a 个 −1、b 个 +1、</text>
  <text x="646" y="99" font-size="11.5" fill="#555" filter="url(#rough2)">一个 0（k），d = b − a = 变换和</text>

  <!-- 面板 A：奇数长度 -->
  <rect x="35" y="125" width="385" height="245" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="227" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">奇数长度 L = 2m+1（例：L = 5）</text>

  <text x="88" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">小</text>
  <text x="144" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">小</text>
  <text x="200" y="172" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="256" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">大</text>
  <text x="312" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">大</text>

  <rect x="65" y="178" width="46" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e3030" filter="url(#rough2)">−1</text>
  <rect x="121" y="178" width="46" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="144" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e3030" filter="url(#rough2)">−1</text>
  <rect x="177" y="178" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="200" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#a07830" filter="url(#rough2)">k</text>
  <rect x="233" y="178" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="256" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">+1</text>
  <rect x="289" y="178" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="312" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">+1</text>

  <path d="M 65 224 L 65 232 L 167 232 L 167 224" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="116" y="252" text-anchor="middle" font-size="11.5" fill="#8e3030" filter="url(#rough2)">a = m = 2 个小</text>
  <path d="M 233 224 L 233 232 L 335 232 L 335 224" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="284" y="252" text-anchor="middle" font-size="11.5" fill="#2e5e28" filter="url(#rough2)">b = m = 2 个大</text>

  <path d="M 200 276 L 200 224" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="227" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">中位下标 ⌊(L−1)/2⌋ = 2，恰是 k</text>
  <text x="227" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">d = b − a = 2 − 2 = 0 ✓</text>
  <text x="227" y="352" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">k 恰在正中间，两边一样多</text>

  <!-- 面板 B：偶数长度 -->
  <rect x="440" y="125" width="385" height="245" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="632" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">偶数长度 L = 2m（例：L = 6）</text>

  <text x="492" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">小</text>
  <text x="548" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">小</text>
  <text x="604" y="172" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="660" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">大</text>
  <text x="716" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">大</text>
  <text x="772" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">大</text>

  <rect x="469" y="178" width="46" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="492" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e3030" filter="url(#rough2)">−1</text>
  <rect x="525" y="178" width="46" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="548" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e3030" filter="url(#rough2)">−1</text>
  <rect x="581" y="178" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="604" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#a07830" filter="url(#rough2)">k</text>
  <rect x="637" y="178" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="660" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">+1</text>
  <rect x="693" y="178" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="716" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">+1</text>
  <rect x="749" y="178" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="772" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">+1</text>

  <path d="M 469 224 L 469 232 L 571 232 L 571 224" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="520" y="252" text-anchor="middle" font-size="11.5" fill="#8e3030" filter="url(#rough2)">a = m−1 = 2 个小</text>
  <path d="M 637 224 L 637 232 L 795 232 L 795 224" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="716" y="252" text-anchor="middle" font-size="11.5" fill="#2e5e28" filter="url(#rough2)">b = m = 3 个大</text>

  <path d="M 604 276 L 604 224" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="632" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">中位下标 ⌊(L−1)/2⌋ = 2，仍是 k</text>
  <text x="632" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#a07830" filter="url(#rough2)">d = b − a = 3 − 2 = 1 ✓</text>
  <text x="632" y="352" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">偶长取靠左中位 ⇒ 大数恰可多一个</text>

  <!-- 结论框 -->
  <rect x="60" y="395" width="740" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="426" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a07830" filter="url(#rough2)">含 k 的子数组：中位数 = k ⟺ 变换和 d ∈ {0, 1}（偶长取靠左中位）</text>
  <text x="430" y="452" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">d = bal(左段) + bal(右段)，k 贡献 0；左右两段独立扩展、自由组合 ⇒ 哈希配对计数</text>
</svg>
