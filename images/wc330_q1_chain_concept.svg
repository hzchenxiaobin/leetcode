<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="336" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：x % (x−1) = 1 触发链式下降，桌面收敛为 {2,3,…,n}</text>

  <!-- ====== vertical chain on the left ====== -->
  <text x="110" y="40" text-anchor="middle" font-size="9.5" fill="#888">第 0 天：桌面 = {n}</text>

  <rect x="78" y="46" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="69" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">n</text>

  <path d="M 110 84 L 110 100" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="146" y="94" font-size="9.5" fill="#4a7a3a" font-weight="bold">n % (n−1) = 1</text>

  <rect x="78" y="102" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="125" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">n−1</text>

  <path d="M 110 140 L 110 156" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="146" y="150" font-size="9" fill="#4a7a3a" font-weight="bold">(n−1) % (n−2) = 1</text>

  <rect x="78" y="158" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="181" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">n−2</text>

  <path d="M 110 196 L 110 214" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="146" y="206" font-size="9" fill="#4a7a3a" font-weight="bold">⋮ 每步 −1，逐日下拉</text>

  <rect x="78" y="216" width="64" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="239" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">2</text>

  <path d="M 110 254 L 110 270" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="30" y="272" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="291" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2 % 1 = 0 ≠ 1，链终止</text>

  <!-- ====== key identity box ====== -->
  <rect x="250" y="44" width="286" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="393" y="66" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">关键恒等式（对 x ≥ 3）</text>
  <text x="393" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x = 1·(x−1) + 1</text>
  <text x="393" y="108" text-anchor="middle" font-size="10.5" fill="#333">⇒ x % (x−1) = 1，次日 x−1 必上桌</text>
  <text x="393" y="124" text-anchor="middle" font-size="9.5" fill="#888">链长 ≤ n−2 ≤ 98 ≪ 10⁹ 天，必能走完</text>

  <!-- ====== two-sided squeeze ====== -->
  <rect x="250" y="148" width="286" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="393" y="163" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">夹逼①：候选 i 限制在 [1, n]</text>
  <text x="393" y="179" text-anchor="middle" font-size="9.5" fill="#333">桌面数字永远不会超过 n</text>

  <rect x="250" y="198" width="286" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="393" y="213" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">夹逼②：x % 1 ≡ 0 ≠ 1</text>
  <text x="393" y="229" text-anchor="middle" font-size="9.5" fill="#333">数字 1 永远不会被拉上桌（n ≥ 2 时）</text>

  <path d="M 393 238 L 393 254" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ====== answer box ====== -->
  <rect x="250" y="256" width="286" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="393" y="276" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">终态桌面 = {2, 3, ⋯, n}</text>
  <text x="393" y="296" text-anchor="middle" font-size="10.5" fill="#b85450">不同数字数 = n − 1（n = 1 时特判为 1）</text>

  <!-- ====== bottom note ====== -->
  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#888">「只增不减 + 值域有界」⇒ 有限步收敛，10⁹ 天只是「跑到不动」的保证</text>
</svg>
