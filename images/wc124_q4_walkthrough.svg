<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1 的回溯树：nums = [1,17,8]</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每个结点是「已选的最后一个数」，边表示新增一个与之和为平方数的数</text>

  <circle cx="280" cy="70" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="75" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">∅</text>

  <path d="M 268 82 L 122 118" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 85 L 280 118" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 292 82 L 438 118" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="110" cy="130" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="135" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="280" cy="130" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="135" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <circle cx="450" cy="130" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="135" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">17</text>

  <path d="M 110 145 L 110 178" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 268 142 L 244 178" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 292 142 L 316 178" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 450 145 L 450 178" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="110" cy="192" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="197" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <circle cx="240" cy="192" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="197" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="320" cy="192" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="197" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">17</text>
  <circle cx="450" cy="192" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="197" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>

  <path d="M 110 207 L 110 238" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 240 207 L 240 238" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 320 207 L 320 238" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 450 207 L 450 238" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="110" cy="252" r="15" fill="#c8e6c9" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="257" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">17</text>
  <circle cx="240" cy="252" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="257" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">17</text>
  <circle cx="320" cy="252" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="257" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <circle cx="450" cy="252" r="15" fill="#c8e6c9" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="257" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="110" y="284" font-size="10" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓ 1,8,17</text>
  <text x="240" y="284" font-size="9.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">✗ 1+17=18</text>
  <text x="320" y="284" font-size="9.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">✗ 17+1=18</text>
  <text x="450" y="284" font-size="10" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓ 17,8,1</text>

  <rect x="30" y="296" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <text x="42" y="314" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">两条完整路径都计一，剪枝掉的两个分支在中途就因「和不是平方数」被砍掉。答案 2。</text>
</svg>
