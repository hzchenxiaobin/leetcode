<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="380" fill="#fdfcf7"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：nums = [1, 2, 1, 2, 1, 1, 1]</text>
  <path d="M 200 40 Q 330 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- indices -->
  <g font-size="10" fill="#999">
    <text x="117" y="54" text-anchor="middle">0</text>
    <text x="189" y="54" text-anchor="middle">1</text>
    <text x="261" y="54" text-anchor="middle">2</text>
    <text x="333" y="54" text-anchor="middle">3</text>
    <text x="405" y="54" text-anchor="middle">4</text>
    <text x="477" y="54" text-anchor="middle">5</text>
    <text x="549" y="54" text-anchor="middle">6</text>
  </g>

  <!-- cells: final window idx 2..6 green; conflict pair idx 1,3 red border -->
  <g filter="url(#sk)"><rect x="85"  y="60" width="64" height="44" rx="4" fill="#ffffff" stroke="#8899aa" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="157" y="60" width="64" height="44" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="229" y="60" width="64" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="301" y="60" width="64" height="44" rx="4" fill="#eaf6ee" stroke="#b85450" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="373" y="60" width="64" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="445" y="60" width="64" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="517" y="60" width="64" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>

  <g font-size="17" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="117" y="89">1</text>
    <text x="189" y="89">2</text>
    <text x="261" y="89">1</text>
    <text x="333" y="89">2</text>
    <text x="405" y="89">1</text>
    <text x="477" y="89">1</text>
    <text x="549" y="89">1</text>
  </g>

  <!-- prime sets -->
  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="117" y="122">∅</text>
    <text x="189" y="122" fill="#b85450" font-weight="bold">{2}</text>
    <text x="261" y="122">∅</text>
    <text x="333" y="122" fill="#b85450" font-weight="bold">{2}</text>
    <text x="405" y="122">∅</text>
    <text x="477" y="122">∅</text>
    <text x="549" y="122">∅</text>
  </g>

  <!-- bracket A: window before r=3 -->
  <path d="M 85 132 L 85 142 L 281 142 L 281 132" stroke="#4a8edb" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="183" y="160" text-anchor="middle" font-size="11" fill="#2b6e9e">r = 2 时的窗口 [1, 2, 1]（下标 0..2），win = {2}</text>

  <!-- bracket B: final window -->
  <path d="M 229 170 L 229 180 L 581 180 L 581 170" stroke="#4a8e4a" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <text x="405" y="198" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">r = 3 收缩后 [1, 2]（下标 2..3）→ r = 4,5,6 连加三个 1 → [1, 2, 1, 1, 1]，长度 5</text>

  <!-- conflict & shrink note -->
  <g filter="url(#sk)">
    <rect x="40" y="212" width="580" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="11" fill="#8a3a3a">
    <text x="330" y="234" text-anchor="middle" font-weight="bold">r = 3 冲突：新元素 2 的素数 {2} 已被下标 1 的 2 占用（红框配对）</text>
    <text x="330" y="252" text-anchor="middle">连续移出下标 0（值 1，素数 ∅，win 不变）、下标 1（值 2，win 清空）</text>
    <text x="330" y="268" text-anchor="middle">left = 2 → 新元素 2 入窗，窗口变为 [1, 2]（下标 2..3）</text>
  </g>

  <!-- verification -->
  <g filter="url(#sk)">
    <rect x="40" y="290" width="580" height="70" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g font-size="11.5" fill="#2e6e2e">
    <text x="330" y="314" text-anchor="middle" font-weight="bold">最终窗口 [1, 2, 1, 1, 1]（下标 2..6）：长度 5</text>
    <text x="330" y="334" text-anchor="middle">prod = 2，gcd = 1，lcm = 2 → prod = lcm × gcd ✓</text>
    <text x="330" y="352" text-anchor="middle">答案 = 5（初始下界 ans = 2 被覆盖）</text>
  </g>
</svg>
