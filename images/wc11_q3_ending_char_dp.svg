<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="392" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：(末字符, 长度) 唯一确定一个合法子串</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">前驱也唯一，所以给定末字符和长度只能往左拼出一种写法 —— 去重变成了「数长度」</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="30" y="70" width="128" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="94" y="90" fill="#3a4a66">末字符 b, 长度 1</text>
    <text x="94" y="108" fill="#3a4a66" font-weight="bold">"b"</text>

    <rect x="188" y="70" width="128" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="252" y="90" fill="#3a4a66">长度 2</text>
    <text x="252" y="108" fill="#3a4a66" font-weight="bold">"ab"</text>

    <rect x="346" y="70" width="128" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="410" y="90" fill="#3a5a30">长度 3</text>
    <text x="410" y="108" fill="#3a5a30" font-weight="bold">"zab"</text>

    <rect x="504" y="70" width="128" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="568" y="90" fill="#3a5a30">长度 4</text>
    <text x="568" y="108" fill="#3a5a30" font-weight="bold">"yzab"</text>
  </g>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <path d="M 160 93 L 184 93"/>
    <path d="M 318 93 L 342 93"/>
    <path d="M 476 93 L 500 93"/>
  </g>

  <rect x="30" y="136" width="602" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="156" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">于是：以 c 结尾的不同合法子串，恰好是长度 1, 2, …, dp[c] 这 dp[c] 个</text>
  <text x="46" y="174" font-size="10" fill="#888" filter="url(#rough2)">不必真的把这些串存进集合 —— 长度个数就是答案，天然去重</text>

  <text x="320" y="205" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">dp[c] = s 中以字符 c 结尾、且整段合法的子串的最长长度（即该位置上连续合法的后缀长度）</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="70" y="220" width="140" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="140" y="240" fill="#8a3a36">末字符 z</text>
    <text x="140" y="260" fill="#8a3a36" font-weight="bold">dp[z] = 1</text>

    <rect x="250" y="220" width="140" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="320" y="240" fill="#8a3a36">末字符 a</text>
    <text x="320" y="260" fill="#8a3a36" font-weight="bold">dp[a] = 2</text>

    <rect x="430" y="220" width="140" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="500" y="240" fill="#8a3a36">末字符 b</text>
    <text x="500" y="260" fill="#8a3a36" font-weight="bold">dp[b] = 3</text>
  </g>

  <text x="320" y="294" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">s = "zab" ⇒ 答案 = dp[z] + dp[a] + dp[b] = 1 + 2 + 3 = 6</text>

  <rect x="70" y="308" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="326" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">为什么「长度 1..dp[c]」都能取到：它们都是那条最长合法串的后缀，截短后仍合法且在 s 中</text>
  <text x="320" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">超过 dp[c] 的长度在 s 中根本不存在，自然不计入</text>

  <text x="320" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：不同末字符之间不会撞串（末字符不同），所以 26 个 dp 直接相加即可</text>
</svg>
