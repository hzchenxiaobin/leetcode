<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">技能集合 → 整数掩码：覆盖判定就是按位或</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">m = 3 的例子：每个技能占一位，一个人掌握的技能 = 一个 3 位掩码</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="45" y="64" width="140" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="115" y="83" font-size="12" fill="#3a4a66">java</text>
    <text x="115" y="99" font-size="10" fill="#6b7a99">bit0 · 001</text>

    <rect x="205" y="64" width="140" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="275" y="83" font-size="12" fill="#3a4a66">nodejs</text>
    <text x="275" y="99" font-size="10" fill="#6b7a99">bit1 · 010</text>

    <rect x="365" y="64" width="140" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="435" y="83" font-size="12" fill="#3a4a66">reactjs</text>
    <text x="435" y="99" font-size="10" fill="#6b7a99">bit2 · 100</text>
  </g>

  <text x="45" y="132" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">备选人员（people）与他们的掩码</text>

  <g filter="url(#rough2)" font-size="11">
    <rect x="45" y="140" width="470" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="60" y="161" fill="#3a5a30">0 号：[java]</text>
    <text x="500" y="161" text-anchor="end" fill="#3a5a30" font-weight="bold">001</text>

    <rect x="45" y="178" width="470" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="60" y="199" fill="#3a5a30">1 号：[nodejs]</text>
    <text x="500" y="199" text-anchor="end" fill="#3a5a30" font-weight="bold">010</text>

    <rect x="45" y="216" width="470" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="60" y="237" fill="#8a6a20">2 号：[nodejs, reactjs]</text>
    <text x="500" y="237" text-anchor="end" fill="#8a6a20" font-weight="bold">110</text>
  </g>

  <path d="M 280 250 L 280 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="278" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
    <text x="280" y="300" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">团队 {0, 2}：001 | 110 = 111</text>
    <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#555">111 三位全为 1 ⇔ 三项需求技能全部被覆盖</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="45" y="348" width="470" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="60" y="368" font-size="10.5" fill="#3a4a66" font-weight="bold">为什么能压缩？</text>
    <text x="60" y="386" font-size="10" fill="#555">只关心「每项技能有没有人被覆盖」，不关心覆盖的人是谁 → 状态数 2^m ≤ 65536</text>
  </g>

  <text x="280" y="414" text-anchor="middle" font-size="10" fill="#999">若直接枚举「人的子集」则是 2^n（n ≤ 60），不可行；换成枚举「技能覆盖状态」才可行</text>
</svg>
