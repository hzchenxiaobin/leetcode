<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：系数 → 后缀 gcd → 逐位贪心</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="150" y="60" width="380" height="46" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b" filter="url(#sk)">① 预处理 pw[i] = 10ⁱ mod k</text>
  <text x="340" y="97" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">pw[0] = 1 mod k，递推 pw[i] = pw[i−1]·10 mod k</text>
  <g filter="url(#sk)"><path d="M 340 106 L 340 122" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="150" y="126" width="380" height="60" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="147" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b" filter="url(#sk)">② 系数 c[i]（i = 0..m−1，m = ⌈n/2⌉）</text>
  <text x="340" y="165" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">配对位：(pw[n−1−i] + pw[i]) mod k</text>
  <text x="340" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#b8860b" filter="url(#sk)">中间位（n 奇）：pw[mid] —— 只算一次！</text>
  <g filter="url(#sk)"><path d="M 340 186 L 340 202" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="150" y="206" width="380" height="60" rx="8" fill="#edf7ef" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="340" y="227" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">③ 后缀 gcd：suf[m] = k；suf[i] = gcd(c[i], suf[i+1])</text>
  <text x="340" y="245" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">suf[i+1] 的倍数（mod k）＝ 位置 i+1..m−1 的可达余数集</text>
  <text x="340" y="260" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">（k ≤ 9 时成立的关键：数字 0..9 共 10 个 ≥ 任何周期）</text>
  <g filter="url(#sk)"><path d="M 340 266 L 340 282" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><polygon points="340,286 470,330 340,374 210,330" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="340" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a36" filter="url(#sk)">④ 贪心：d 从 9 ↓ 0</text>
  <text x="340" y="340" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#sk)">nr = (r − d·c[i]) mod k</text>
  <text x="340" y="357" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3a36" filter="url(#sk)">suf[i+1] 整除 nr ？</text>

  <g filter="url(#sk)"><path d="M 470 330 L 520 330 L 520 376 L 468 376" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ab)"/></g>
  <text x="486" y="322" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="336" y="384" width="264" height="52" rx="8" fill="#edf7ef" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="468" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">锁定 d[i] = d，r ← nr</text>
  <text x="468" y="424" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">进入下一位 i+1（i = m−1 时收尾）</text>

  <g filter="url(#sk)"><path d="M 300 374 Q 260 402 262 340 Q 263 300 302 292" stroke="#999999" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/></g>
  <text x="238" y="402" font-size="11.5" fill="#8f3a36" filter="url(#sk)">否，试下一个 d</text>
  <text x="222" y="286" font-size="10.5" fill="#888" filter="url(#sk)">（d=0 必可行，归纳保证）</text>

  <g filter="url(#sk)"><path d="M 468 436 L 468 456 L 340 456 L 340 470" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><rect x="150" y="474" width="380" height="44" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="493" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b" filter="url(#sk)">⑤ 镜像拼接：ans = half + reverse(half[:n−m])</text>
  <text x="340" y="510" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">n 奇数只镜像前 m−1 个，中间位不重复</text>

  <g filter="url(#sk)"><rect x="556" y="286" width="112" height="120" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4 3"/></g>
  <text x="612" y="306" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1a" filter="url(#sk)">保底写法</text>
  <text x="612" y="324" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">后缀可行性 DP</text>
  <text x="612" y="340" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">f[i][r] ∈ {0,1}</text>
  <text x="612" y="356" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">O(10·k·n)</text>
  <text x="612" y="372" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">k ≤ 9 时坍缩</text>
  <text x="612" y="388" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">为后缀 gcd</text>
</svg>
