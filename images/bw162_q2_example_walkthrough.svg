<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="360" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">三个示例的判定：少的是「窗口外」的元素</text>
  <text x="54" y="78" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">示例</text>
  <text x="124" y="78" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">nums</text>
  <text x="242" y="78" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">k</text>
  <text x="298" y="78" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">排序后</text>
  <text x="416" y="78" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">最长窗口</text>
  <text x="606" y="78" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">需移除</text>
  <line x1="50" y1="86" x2="682" y2="86" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="124" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="124" y="124" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[2,1,5]</text>
  <text x="242" y="124" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="298" y="124" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[1,2,5]</text>
  <text x="416" y="124" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[1,2]（2 ≤ 1·2）</text>
  <text x="606" y="124" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="54" y="170" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="124" y="170" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[1,6,2,9]</text>
  <text x="242" y="170" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="298" y="170" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[1,2,6,9]</text>
  <text x="416" y="170" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[2,6]（6 ≤ 2·3）</text>
  <text x="606" y="170" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="54" y="216" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="124" y="216" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[4,6]</text>
  <text x="242" y="216" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="298" y="216" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[4,6]</text>
  <text x="416" y="216" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[4,6]（6 ≤ 4·2）</text>
  <text x="606" y="216" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="50" y="276" width="600" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="302" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">窗口 [1,2,5]：5 &gt; 1·2 ✗，所以只能保留 [1,2] 两个</text>
  <text x="350" y="324" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">删除元素数 = n − 最长平衡窗口长度</text>
</svg>
