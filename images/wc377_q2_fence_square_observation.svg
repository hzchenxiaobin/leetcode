<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">移除栅栏的正方形田地：本质是「选四条线」</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: field ===== -->
  <text x="265" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 田地示意（示例 1：m = 4, n = 3）</text>

  <!-- answer square highlight [y=1,3] x [x=1,3] -->
  <g filter="url(#sk)"><rect x="140" y="110" width="200" height="200" fill="#f9d774" fill-opacity="0.32"/></g>
  <g filter="url(#sk)"><rect x="145" y="115" width="190" height="190" fill="none" stroke="#c98a2b" stroke-width="2" stroke-dasharray="7 5" rx="2"/></g>

  <!-- fences to remove (dashed red) -->
  <path d="M 140 210 L 340 210" stroke="#b03a3a" stroke-width="2" stroke-dasharray="8 5" fill="none" filter="url(#sk)"/>
  <path d="M 240 110 L 240 410" stroke="#b03a3a" stroke-width="2" stroke-dasharray="8 5" fill="none" filter="url(#sk)"/>
  <!-- fence to keep (green) -->
  <path d="M 140 310 L 340 310" stroke="#4a8e4a" stroke-width="2.5" fill="none" filter="url(#sk)"/>

  <!-- outer border (cannot remove) -->
  <g filter="url(#sk)"><rect x="140" y="110" width="200" height="300" fill="none" stroke="#4a8edb" stroke-width="3.5" rx="2"/></g>

  <!-- in-field labels -->
  <text x="152" y="202" font-size="11" fill="#b03a3a" filter="url(#sk)">✂ 拆</text>
  <text x="250" y="345" font-size="11" fill="#b03a3a" filter="url(#sk)">✂ 拆</text>
  <text x="255" y="303" font-size="11" fill="#2e6e2e" filter="url(#sk)">留下 ✓</text>

  <!-- axis labels -->
  <text x="128" y="114" text-anchor="end" font-size="11" fill="#666" filter="url(#sk)">y=1</text>
  <text x="128" y="214" text-anchor="end" font-size="11" fill="#666" filter="url(#sk)">y=2</text>
  <text x="128" y="314" text-anchor="end" font-size="11" fill="#666" filter="url(#sk)">y=3</text>
  <text x="128" y="414" text-anchor="end" font-size="11" fill="#666" filter="url(#sk)">y=4</text>
  <text x="140" y="432" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">x=1</text>
  <text x="240" y="432" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">x=2</text>
  <text x="340" y="432" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">x=3</text>

  <!-- annotations right of field -->
  <text x="366" y="98" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">外围栅栏：不可移除</text>
  <path d="M 362 102 L 316 110" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="366" y="158" font-size="11" font-weight="bold" fill="#c98a2b" filter="url(#sk)">正方形田地</text>
  <text x="366" y="176" font-size="11" fill="#7a5415" filter="url(#sk)">[y=1,3] × [x=1,3]</text>
  <text x="366" y="194" font-size="11" fill="#7a5415" filter="url(#sk)">边长 d = 2</text>
  <path d="M 362 168 L 322 168" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <text x="366" y="244" font-size="11" fill="#b03a3a" filter="url(#sk)">✂ 拆掉 y=2 水平栅栏</text>
  <path d="M 362 240 L 328 214" stroke="#b03a3a" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <text x="366" y="294" font-size="11" fill="#2e6e2e" filter="url(#sk)">留下 y=3 水平栅栏</text>
  <path d="M 362 298 L 328 308" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="366" y="364" font-size="11" fill="#b03a3a" filter="url(#sk)">✂ 拆掉 x=2 垂直栅栏</text>
  <path d="M 362 368 L 248 384" stroke="#b03a3a" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- ===== Panel 2: abstraction ===== -->
  <text x="715" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 抽象：选两条水平线 + 两条垂直线</text>

  <!-- square region -->
  <g filter="url(#sk)"><rect x="630" y="170" width="100" height="100" fill="#f9d774" fill-opacity="0.32"/></g>
  <g filter="url(#sk)"><rect x="633" y="173" width="94" height="94" fill="none" stroke="#c98a2b" stroke-width="2" stroke-dasharray="7 5" rx="2"/></g>

  <!-- horizontal lines y=a (170), y=b (270) -->
  <path d="M 560 170 L 872 170" stroke="#4a8edb" stroke-width="3" fill="none" filter="url(#sk)"/>
  <path d="M 560 270 L 872 270" stroke="#4a8edb" stroke-width="3" fill="none" filter="url(#sk)"/>
  <!-- vertical lines x=c (630), x=e (730) -->
  <path d="M 630 120 L 630 322" stroke="#4a8e4a" stroke-width="3" fill="none" filter="url(#sk)"/>
  <path d="M 730 120 L 730 322" stroke="#4a8e4a" stroke-width="3" fill="none" filter="url(#sk)"/>

  <text x="548" y="166" text-anchor="end" font-size="12" fill="#2b6e9e" filter="url(#sk)">y = a</text>
  <text x="548" y="276" text-anchor="end" font-size="12" fill="#2b6e9e" filter="url(#sk)">y = b</text>
  <text x="630" y="344" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">x = c</text>
  <text x="730" y="344" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">x = e</text>

  <path d="M 888 175 L 888 262" stroke="#2b6e9e" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="800" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">b − a = d</text>
  <path d="M 634 356 L 724 356" stroke="#2e6e2e" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="679" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">e − c = d</text>

  <text x="680" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a2b" filter="url(#sk)">边长 d</text>
  <text x="680" y="232" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">正方形</text>

  <g filter="url(#sk)"><rect x="540" y="396" width="370" height="46" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="725" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">正方形 ⟺ b − a = e − c = d</text>
  <text x="725" y="434" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">（中间的栅栏一律拆掉，不构成限制）</text>

  <g filter="url(#sk)"><rect x="540" y="456" width="370" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="560" y="478" font-size="12" font-family="monospace" fill="#2b6e9e" filter="url(#sk)">H = {1, m} ∪ hFences（水平线）</text>
  <text x="560" y="500" font-size="12" font-family="monospace" fill="#2b6e9e" filter="url(#sk)">V = {1, n} ∪ vFences（垂直线）</text>

  <!-- ===== insight box ===== -->
  <g filter="url(#sk)"><rect x="56" y="552" width="828" height="88" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="576" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">关键洞察</text>
  <text x="76" y="600" font-size="11" fill="#444" filter="url(#sk)">· 「移除」是幌子：中间栅栏一律拆掉，任意（水平线对，垂直线对）都能围出矩形</text>
  <text x="76" y="622" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#sk)">· 正方形 ⟺ 两对线的差相等 ⟹ d ∈ S_h ∩ S_v，在两个对差集合的交里找最大</text>
</svg>
