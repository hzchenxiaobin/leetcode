<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两段式 —— Dijkstra 求 dist[]，再按 dist 升序 DP 计数</text>

  <!-- Stage labels -->
  <text x="140" y="54" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">阶段一 · Dijkstra（从节点 n）</text>
  <text x="430" y="54" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">阶段二 · 升序 DP 数路径</text>

  <!-- ===== Left column: Dijkstra ===== -->
  <rect x="55" y="62" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 建无向邻接表</text>
  <path d="M 140 90 L 140 98" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="102" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="116" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② dist[n]=0，其余 = ∞</text>
  <text x="140" y="131" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">最小堆压入 (0, n)</text>
  <path d="M 140 138 L 140 148" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="140,152 188,176 140,200 92,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="180" text-anchor="middle" font-size="11" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">堆非空?</text>
  <path d="M 140 200 L 140 212" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="211" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="25" y="216" width="230" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="234" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ 弹出堆顶 (d, u)</text>
  <text x="140" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">d &gt; dist[u] ⇒ 过期，跳过</text>
  <text x="140" y="264" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">邻居 v: d+w &lt; dist[v] ⇒ 更新入堆</text>

  <!-- loop back edge -->
  <path d="M 25 244 L 12 244 L 12 176 L 86 176" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- heap empty -> stage 2 -->
  <path d="M 188 176 L 248 176 L 248 120 L 326 120" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="253" y="168" font-size="9.5" fill="#b85450" filter="url(#rough2)">否（堆空）</text>
  <text x="253" y="112" font-size="9.5" fill="#b85450" filter="url(#rough2)">dist[] 就绪</text>

  <!-- ===== Right column: DP ===== -->
  <rect x="330" y="102" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="116" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">④ 节点按 dist 升序排序</text>
  <text x="430" y="131" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">（恰好 = 隐式 DAG 拓扑序）</text>
  <path d="M 430 138 L 430 147" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="345" y="151" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="169" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">⑤ dp[n] = 1，其余 0</text>
  <path d="M 430 179 L 430 192" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <polygon points="430,196 480,222 430,248 380,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="226" text-anchor="middle" font-size="11" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">还有节点?</text>
  <path d="M 430 248 L 430 260" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="440" y="259" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="315" y="264" width="230" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="283" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">⑥ 取节点 u（u = n 跳过）</text>
  <text x="430" y="298" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">∀ 邻居 v: dist[v] &lt; dist[u]</text>
  <text x="430" y="313" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">⇒ dp[u] = (dp[u]+dp[v]) % MOD</text>

  <!-- loop back edge -->
  <path d="M 315 294 L 302 294 L 302 222 L 376 222" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- no more nodes -> output -->
  <path d="M 480 222 L 536 222 L 536 340 L 526 340" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="494" y="214" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="330" y="324" width="196" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="428" y="344" text-anchor="middle" font-size="11.5" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">⑦ 返回 dp[1]（答案）</text>

  <!-- Bottom notes -->
  <rect x="28" y="374" width="225" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="140" y="391" text-anchor="middle" font-size="10" fill="#2b4c6e" filter="url(#rough2)">阶段一开销：O(E log V)</text>
  <rect x="310" y="374" width="225" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="422" y="391" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">阶段二开销：O(V log V + E)</text>
</svg>
