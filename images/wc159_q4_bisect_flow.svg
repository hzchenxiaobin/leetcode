<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次排序 + n 次二分 + 一维 DP</text>
  <text x="300" y="46" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">时间 O(n log n)，空间 O(n)</text>

  <rect x="70" y="60" width="460" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="86" y="80" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 打包并排序</text>
  <text x="86" y="98" font-size="9.5" fill="#555" filter="url(#rough2)">jobs = [(end, start, profit) …]，按 end 升序；排序键必须是结束时间</text>

  <path d="M 300 108 L 300 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="124" width="460" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="86" y="143" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">② 抽出 ends[] 与 dp[]</text>
  <text x="86" y="161" font-size="9.5" fill="#555" filter="url(#rough2)">ends 随之升序；dp = [0] × (n+1)，dp[0] = 0 作为「什么都没选」的哨兵</text>

  <path d="M 300 170 L 300 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="186" width="460" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text x="86" y="207" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ for i = 1 … n：枚举排序后的第 i 个工作</text>
  <text x="86" y="231" font-size="9.5" fill="#555" filter="url(#rough2)">p = upper_bound( ends[0 … i−1) , start_i )</text>
  <text x="104" y="247" font-size="9" fill="#777" filter="url(#rough2)">→ 第一个 end &gt; start_i 的下标，等于 end ≤ start_i 的个数 = 可接前缀长度</text>
  <text x="86" y="272" font-size="9.5" fill="#555" filter="url(#rough2)">dp[i] = max( dp[i−1], dp[p] + profit_i )</text>
  <text x="104" y="288" font-size="9" fill="#777" filter="url(#rough2)">→ 不要 i（继承前缀最优）或要 i（接在最优前缀 dp[p] 之后）</text>

  <path d="M 300 302 L 300 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="318" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="86" y="337" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">④ 返回 dp[n]</text>
  <text x="86" y="354" font-size="9.5" fill="#555" filter="url(#rough2)">即「所有工作都参与决策」时的最大报酬</text>

  <text x="300" y="390" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不变量：dp[i] 恒等于「只考虑前 i 个（按 end 升序）工作」时的最大报酬</text>
</svg>
