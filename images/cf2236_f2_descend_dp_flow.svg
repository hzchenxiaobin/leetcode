<svg xmlns="http://www.w3.org/2000/svg" width="720" height="524" viewBox="0 0 720 524"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 1 L 8 4.5 L 0 8 z" fill="#5a6b7a"/>
    </marker>
  </defs>

  <rect width="720" height="524" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：按指数值 v 从大到小背包，枚举“最大值层”</text>
  <path d="M 112 40 Q 360 47 608 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="360" y="60" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">状态 (s, W)：已用 s 个人，W = Σ已定指数 − 最大指数；再加一个“是否已开局”标志</text>

  <rect x="176" y="74" width="368" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="99" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">对每个 q | x 单独算 f_q（x 至多 6 个不同素因子）</text>
  <path d="M 360 114 L 360 136" stroke="#5a6b7a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="138" width="480" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="164" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">统计 C_v = #{ i : cᵢ ≥ v }，然后 v = M_q, M_q − 1, …, 1 逐个处理</text>
  <path d="M 214 180 L 214 206" stroke="#5a6b7a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 506 180 L 506 206" stroke="#5a6b7a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="208" width="306" height="118" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="201" y="232" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">尚未开局：还没有最大值</text>
  <text x="201" y="256" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">t = 0：这个指数值整体不用</text>
  <text x="201" y="280" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">t ≥ 1：在 v 处“开局”，v 就是最大值</text>
  <text x="201" y="304" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">W ← (t−1)·v，权重 C(C_v, t)</text>

  <rect x="366" y="208" width="306" height="118" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="519" y="232" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">已经开局：最大值 = m &gt; v</text>
  <text x="519" y="256" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">t = 0：不选，W 保持不变</text>
  <text x="519" y="280" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">t ≥ 0：再让 t 个人取指数 v</text>
  <text x="519" y="304" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">W ← W + t·v，权重 C(C_v − s, t)</text>

  <path d="M 201 326 L 201 352" stroke="#5a6b7a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 519 326 L 519 352" stroke="#5a6b7a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="354" width="420" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="381" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">v = 1 处理完：f_q = Σ_s dp[已开局][s][E_q]</text>

  <rect x="48" y="416" width="624" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="437" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">剪枝：s ≤ E_q + 1（因为 E_q ≥ 人数 − 1）、W ≤ E_q，超出直接丢弃</text>
  <text x="360" y="456" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">状态只有 O((E_q+2)²) 个，每个状态的转移数 ≤ E_q / v ⇒ 单素数不超过约 2·10⁴ 次运算</text>

  <text x="360" y="488" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">q | x 却在所有 aᵢ 中都不出现 ⇒ f_q = 0 ⇒ 整组答案 0（样例 2、4、5 正是如此）</text>
  <text x="360" y="510" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">而 E_q = 0 的素数不必跑这套 DP，直接用 f_q = 1 + Σᵢ cᵢ</text>
</svg>
