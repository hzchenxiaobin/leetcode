<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相交 ⟺ 某个坐标被走到第二次</text>

  <g filter="url(#rough2)">
    <rect x="20" y="44" width="290" height="290" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
    <text x="165" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">path = "NES"</text>
    <text x="165" y="86" text-anchor="middle" font-size="11" fill="#888">四个位置互不相同 → false</text>

    <circle cx="65" cy="170" r="1.8" fill="#c8c8c8"/><circle cx="105" cy="170" r="1.8" fill="#c8c8c8"/><circle cx="145" cy="170" r="1.8" fill="#c8c8c8"/><circle cx="185" cy="170" r="1.8" fill="#c8c8c8"/><circle cx="225" cy="170" r="1.8" fill="#c8c8c8"/>
    <circle cx="65" cy="210" r="1.8" fill="#c8c8c8"/><circle cx="105" cy="210" r="1.8" fill="#c8c8c8"/><circle cx="145" cy="210" r="1.8" fill="#c8c8c8"/><circle cx="185" cy="210" r="1.8" fill="#c8c8c8"/><circle cx="225" cy="210" r="1.8" fill="#c8c8c8"/>
    <circle cx="65" cy="250" r="1.8" fill="#c8c8c8"/><circle cx="105" cy="250" r="1.8" fill="#c8c8c8"/><circle cx="145" cy="250" r="1.8" fill="#c8c8c8"/><circle cx="185" cy="250" r="1.8" fill="#c8c8c8"/><circle cx="225" cy="250" r="1.8" fill="#c8c8c8"/>
    <circle cx="65" cy="290" r="1.8" fill="#c8c8c8"/><circle cx="105" cy="290" r="1.8" fill="#c8c8c8"/><circle cx="145" cy="290" r="1.8" fill="#c8c8c8"/><circle cx="185" cy="290" r="1.8" fill="#c8c8c8"/><circle cx="225" cy="290" r="1.8" fill="#c8c8c8"/>

    <path d="M 145 240 L 145 221" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 154 210 L 176 210" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 185 219 L 185 238" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <text x="136" y="234" text-anchor="end" font-size="12" font-weight="bold" fill="#555">N</text>
    <text x="165" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">E</text>
    <text x="196" y="232" text-anchor="start" font-size="12" font-weight="bold" fill="#555">S</text>

    <circle cx="145" cy="250" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="145" cy="210" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="185" cy="210" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="185" cy="250" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>

    <text x="145" y="272" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">(0,0)</text>
    <text x="145" y="286" text-anchor="middle" font-size="9.5" fill="#4a7a3a">起点</text>
    <text x="131" y="214" text-anchor="end" font-size="10.5" fill="#888">(0,1)</text>
    <text x="185" y="194" text-anchor="middle" font-size="10.5" fill="#888">(1,1)</text>
    <text x="211" y="254" text-anchor="start" font-size="10.5" fill="#888">(1,0)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="330" y="44" width="290" height="290" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
    <text x="475" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">path = "NESWW"</text>
    <text x="475" y="86" text-anchor="middle" font-size="11" fill="#b85450">第 4 步 W 重访起点 → true</text>

    <circle cx="395" cy="170" r="1.8" fill="#c8c8c8"/><circle cx="435" cy="170" r="1.8" fill="#c8c8c8"/><circle cx="475" cy="170" r="1.8" fill="#c8c8c8"/><circle cx="515" cy="170" r="1.8" fill="#c8c8c8"/><circle cx="555" cy="170" r="1.8" fill="#c8c8c8"/>
    <circle cx="395" cy="210" r="1.8" fill="#c8c8c8"/><circle cx="435" cy="210" r="1.8" fill="#c8c8c8"/><circle cx="475" cy="210" r="1.8" fill="#c8c8c8"/><circle cx="515" cy="210" r="1.8" fill="#c8c8c8"/><circle cx="555" cy="210" r="1.8" fill="#c8c8c8"/>
    <circle cx="395" cy="250" r="1.8" fill="#c8c8c8"/><circle cx="435" cy="250" r="1.8" fill="#c8c8c8"/><circle cx="475" cy="250" r="1.8" fill="#c8c8c8"/><circle cx="515" cy="250" r="1.8" fill="#c8c8c8"/><circle cx="555" cy="250" r="1.8" fill="#c8c8c8"/>
    <circle cx="395" cy="290" r="1.8" fill="#c8c8c8"/><circle cx="435" cy="290" r="1.8" fill="#c8c8c8"/><circle cx="475" cy="290" r="1.8" fill="#c8c8c8"/><circle cx="515" cy="290" r="1.8" fill="#c8c8c8"/><circle cx="555" cy="290" r="1.8" fill="#c8c8c8"/>

    <path d="M 475 240 L 475 221" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 484 210 L 506 210" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 515 219 L 515 238" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 507 250 L 488 250" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)"/>

    <text x="466" y="234" text-anchor="end" font-size="12" font-weight="bold" fill="#555">N</text>
    <text x="495" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">E</text>
    <text x="526" y="232" text-anchor="start" font-size="12" font-weight="bold" fill="#555">S</text>
    <text x="497" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">W</text>

    <circle cx="475" cy="250" r="14" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="475" cy="250" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="475" cy="210" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="515" cy="210" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="515" cy="250" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>

    <text x="475" y="274" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">(0,0)</text>
    <text x="475" y="288" text-anchor="middle" font-size="9.5" fill="#b85450">第 2 次到访！</text>
    <text x="461" y="214" text-anchor="end" font-size="10.5" fill="#888">(0,1)</text>
    <text x="515" y="194" text-anchor="middle" font-size="10.5" fill="#888">(1,1)</text>
    <text x="541" y="254" text-anchor="start" font-size="10.5" fill="#888">(1,0)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="20" y="352" width="620" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="36" y="374" font-size="11" fill="#3a4a66">「相交」与方向序列的形态、是否绕成闭环都无关，只问一件事：当前坐标是否出现过 —— 集合成员查询</text>
    <text x="36" y="394" font-size="11" fill="#555">哈希集合把单次查重从 O(n) 降到均摊 O(1)；起点 (0,0) 也是「走过的位置」，必须预先入集</text>
  </g>
</svg>
