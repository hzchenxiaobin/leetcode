<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [2, 5, 6, 8]，maxDiff = 2</text>
  <path d="M 185 38 Q 320 46 455 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="64" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5b84">① 一遍扫描染色：断口数即段号</text>

  <g filter="url(#sk)"><rect x="65" y="78" width="510" height="158" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="65" y="78" width="510" height="30" fill="#e8f0fe"/></g>
  <g filter="url(#sk)"><rect x="65" y="140" width="510" height="32" fill="#fce4ec" opacity="0.55"/></g>
  <g filter="url(#sk)"><path d="M 120 78 V 236 M 215 78 V 236 M 360 78 V 236 M 465 78 V 236 M 65 108 H 575 M 65 140 H 575 M 65 172 H 575 M 65 204 H 575" stroke="#bbb" stroke-width="1" fill="none"/></g>

  <text x="92" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">i</text>
  <text x="167" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">nums[i]</text>
  <text x="287" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">相邻差</text>
  <text x="412" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">断口？</text>
  <text x="520" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">group[i]</text>

  <text x="92" y="124" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="167" y="124" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="287" y="124" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="412" y="124" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="520" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">0</text>

  <text x="92" y="156" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="167" y="156" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="287" y="156" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">3 &gt; 2</text>
  <text x="412" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">是，断口</text>
  <text x="520" y="156" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>

  <text x="92" y="188" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="167" y="188" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="287" y="188" text-anchor="middle" font-size="11.5" fill="#2e6e2e">1 ≤ 2</text>
  <text x="412" y="188" text-anchor="middle" font-size="11" fill="#2e6e2e">否，同段</text>
  <text x="520" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>

  <text x="92" y="220" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="167" y="220" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="287" y="220" text-anchor="middle" font-size="11.5" fill="#2e6e2e">2 ≤ 2</text>
  <text x="412" y="220" text-anchor="middle" font-size="11" fill="#2e6e2e">否，同段</text>
  <text x="520" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>

  <text x="320" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">② 逐查询比对段号：answer = (group[u] == group[v])</text>

  <g filter="url(#sk)"><rect x="65" y="276" width="510" height="158" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="65" y="276" width="510" height="30" fill="#e6f4ea"/></g>
  <g filter="url(#sk)"><rect x="65" y="370" width="510" height="64" fill="#e6f4ea" opacity="0.5"/></g>
  <g filter="url(#sk)"><path d="M 235 276 V 434 M 340 276 V 434 M 445 276 V 434 M 65 306 H 575 M 65 338 H 575 M 65 370 H 575 M 65 402 H 575" stroke="#bbb" stroke-width="1" fill="none"/></g>

  <text x="150" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">查询 [u, v]</text>
  <text x="287" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">group[u]</text>
  <text x="392" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">group[v]</text>
  <text x="510" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">answer</text>

  <text x="150" y="324" text-anchor="middle" font-size="11" fill="#333">[0, 1]</text>
  <text x="287" y="324" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">0</text>
  <text x="392" y="324" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="510" y="324" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">false</text>

  <text x="150" y="356" text-anchor="middle" font-size="11" fill="#333">[0, 2]</text>
  <text x="287" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">0</text>
  <text x="392" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="510" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">false</text>

  <text x="150" y="388" text-anchor="middle" font-size="11" fill="#333">[1, 3]</text>
  <text x="287" y="388" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="392" y="388" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="510" y="388" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">true</text>

  <text x="150" y="420" text-anchor="middle" font-size="11" fill="#333">[2, 3]</text>
  <text x="287" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="392" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="510" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">true</text>

  <text x="320" y="458" text-anchor="middle" font-size="10.5" fill="#666">段 0 = {节点 0}，段 1 = {节点 1, 2, 3}，输出 [false, false, true, true]，与示例一致</text>
</svg>
