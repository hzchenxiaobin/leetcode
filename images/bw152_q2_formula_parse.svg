<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">getValue 的三步：切分 → 逐项求值 → 相加</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">公式固定为 "=X+Y"，X、Y 要么是单元格引用，要么是非负整数</text>
  <rect x="150" y="60" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="16" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">= A1 + B2</text>
  <path d="M 220 108 L 140 146" stroke="#666666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 108 L 420 146" stroke="#666666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">在第一个 '+' 处切开（下标 1 开始找）</text>
  <rect x="60" y="150" width="148" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="134" y="174" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">X = "A1"</text>
  <text x="134" y="196" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">首字符 'A' 不是数字</text>
  <text x="134" y="214" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">→ 查表，缺省 0</text>
  <text x="134" y="234" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">→ 得到 10 / 15</text>
  <path d="M 134 246 L 280 274" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="352" y="150" width="148" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="426" y="174" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">Y = "B2"</text>
  <text x="426" y="196" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">首字符 'B' 不是数字</text>
  <text x="426" y="214" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">→ 查表，缺省 0</text>
  <text x="426" y="234" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">→ 得到 10 / 15</text>
  <path d="M 426 246 L 280 274" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="180" y="278" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 10 + 15 = 25</text>
  <text x="280.0" y="358" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">操作数可能是纯数字（如 '=5+7'），用 isdigit(首个字符) 区分两种情形</text>
</svg>
