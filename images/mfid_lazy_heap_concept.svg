<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">懒删除堆：真值表管「现在」，堆管「历史」</text>

  <rect x="25" y="58" width="190" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">真值表 cnt（现在）</text>

  <rect x="55" y="98" width="130" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[2] = 0</text>
  <rect x="55" y="140" width="130" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[3] = 2</text>
  <text x="120" y="193" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每步 O(1) 直接改</text>

  <rect x="305" y="58" width="190" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">快照库 pq（历史）</text>

  <rect x="330" y="92" width="140" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="400" y="111" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">(3, 2)  ✗ 过期</text>

  <rect x="330" y="130" width="140" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(2, 3)  ✓ 堆顶之下</text>

  <rect x="330" y="168" width="140" height="28" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="187" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">(0, 2)  ✓ 不挡路</text>

  <path d="M 328 106 Q 240 92 188 108" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="196" y="122" width="128" height="46" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">对账：3 ≠ cnt[2]=0</text>
  <text x="260" y="158" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">过期 → 弹出！</text>

  <rect x="25" y="228" width="470" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">弹出过期堆顶后，露出的 (2,3) 与真值对上 → 顶即最大频次</text>
  <text x="260" y="270" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">只要 cnt[x]=c，堆中必留有最新快照 (c,x)，弹不丢</text>

  <rect x="25" y="298" width="470" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">懒删除 = 把删除成本摊到「真正挡路」的时刻再付</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">push 恰 n 次，pop ≤ n 次，总代价 O(n log n)</text>
</svg>
