<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="500" fill="#fafafa"/>

  <text x="200" y="20" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">BFS 分层扩张：一次把整层队列处理完</text>

  <!-- 开始 -->
  <ellipse cx="200" cy="38" rx="52" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="43" text-anchor="middle" font-size="12" fill="#2f5e22" filter="url(#rough2)">开始</text>
  <path d="M 200 55 L 200 72" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 读入 -->
  <rect x="50" y="74" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="62" y="94" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">n = grid.size()，距离直接写回 grid</text>
  <text x="62" y="110" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">grid[i][j] 从 0/1 变成「第几层」</text>
  <path d="M 200 118 L 200 134" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 起终点堵死 -->
  <polygon points="200,136 340,166 200,196 60,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="170" text-anchor="middle" font-size="10.5" fill="#7a5c18" filter="url(#rough2)">(0,0) 或 (n−1,n−1) 为 1 ？</text>
  <path d="M 340 166 L 388 166" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="158" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="392" y="150" width="112" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="448" y="171" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">返回 −1</text>

  <path d="M 200 196 L 200 212" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="208" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 初始化队列 -->
  <rect x="50" y="214" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="62" y="234" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">grid[0][0] = 1（起点算第 1 层）</text>
  <text x="62" y="250" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">q = deque([(0, 0)])</text>
  <path d="M 200 258 L 200 272" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 队列非空 -->
  <polygon points="200,274 330,304 200,334 70,304" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="308" text-anchor="middle" font-size="10.5" fill="#7a5c18" filter="url(#rough2)">q 非空 ？</text>
  <path d="M 330 304 L 388 304" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="296" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="392" y="288" width="112" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="448" y="309" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">返回 −1</text>

  <path d="M 200 334 L 200 350" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="346" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 出队 -->
  <rect x="50" y="352" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="62" y="372" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">pop (x, y)，d = grid[x][y]</text>
  <text x="62" y="392" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">若 (x, y) 就是终点 → 直接返回 d</text>
  <path d="M 200 408 L 200 422" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 扩展 8 邻居 -->
  <rect x="50" y="424" width="300" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="62" y="444" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">枚举 8 个方向 (nx, ny)</text>
  <text x="62" y="462" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">越界、为 1、已访问 → 跳过</text>
  <text x="62" y="480" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">否则 grid[nx][ny] = d + 1，入队</text>

  <!-- 循环回边 -->
  <path d="M 50 456 L 20 456 L 20 304 L 62 304" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="386" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">循环</text>

  <!-- 实现要点 -->
  <rect x="392" y="352" width="252" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="404" y="372" font-size="10" fill="#2f5e22" filter="url(#rough2)">入队时就写距离 / 标记，</text>
  <text x="404" y="390" font-size="10" fill="#2f5e22" filter="url(#rough2)">而不是等出队才标记：</text>
  <text x="404" y="408" font-size="10" fill="#2f5e22" filter="url(#rough2)">否则同一格被重复入队，</text>
  <text x="404" y="426" font-size="10" fill="#555" filter="url(#rough2)">队列膨胀到 O(n²) 级别。</text>
</svg>
