<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a6015"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：每一层只在两端二选一，中段缩成同款子问题</text>
  <path d="M 120 41 Q 390 48 660 41" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 第 1 层圆弧：两端 1 与 6 -->
  <path d="M 171 146 Q 381 -20 521 146" stroke="#446688" stroke-width="2.3" fill="none" filter="url(#rough2)"/>
  <!-- 第 2 层圆弧：两端 2 与 5 -->
  <path d="M 241 146 Q 346 66 451 146" stroke="#4a7a3a" stroke-width="2.3" fill="none" filter="url(#rough2)"/>

  <text x="588" y="72" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">第 1 层：a₁ 与 a₆</text>
  <text x="588" y="90" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">留 min(1, 3) = 1</text>
  <text x="588" y="118" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 2 层：a₂ 与 a₅</text>
  <text x="588" y="136" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">留 min(4, 6) = 4</text>

  <!-- 数组格子：a = 1 4 8 2 6 3，k = 3 -->
  <rect x="140" y="150" width="62" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="171" y="181" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <rect x="210" y="150" width="62" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="241" y="181" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>

  <rect x="280" y="150" width="62" height="46" rx="7" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="311" y="181" text-anchor="middle" font-size="19" fill="#8a8a8a" filter="url(#rough2)">8</text>

  <rect x="350" y="150" width="62" height="46" rx="7" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="381" y="181" text-anchor="middle" font-size="19" fill="#8a8a8a" filter="url(#rough2)">2</text>

  <rect x="420" y="150" width="62" height="46" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="451" y="181" text-anchor="middle" font-size="19" fill="#a14340" filter="url(#rough2)">6</text>

  <rect x="490" y="150" width="62" height="46" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="521" y="181" text-anchor="middle" font-size="19" fill="#a14340" filter="url(#rough2)">3</text>

  <text x="171" y="214" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">a₁ 留下</text>
  <text x="241" y="214" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">a₂ 留下</text>
  <text x="311" y="214" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">a₃ 中段</text>
  <text x="381" y="214" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">a₄ 中段</text>
  <text x="451" y="214" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">a₅ 被删</text>
  <text x="521" y="214" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">a₆ 被删</text>

  <text x="60" y="240" font-size="11.5" fill="#66788c" filter="url(#rough2)">样例 n=6, k=3：绿色 = 活到最后（恰好 k−1=2 个），粉色 = 该层被删掉的端点，灰色中段在 kk 降到 1 后继续被删</text>

  <!-- 左下：端点为什么安全 -->
  <rect x="40" y="256" width="340" height="146" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么端点一定能拖到最后一步</text>
  <text x="56" y="304" font-size="11.3" fill="#2f4a66" filter="url(#rough2)">a₁ 永远是第一个元素，只可能以</text>
  <text x="56" y="324" font-size="11.3" fill="#2f4a66" filter="url(#rough2)">「从右数第 k 个」的身份被删 ⇒ m−k+1=1</text>
  <text x="56" y="344" font-size="11.3" fill="#2f4a66" filter="url(#rough2)">⇒ m=k，即整局的最后一步；a_n 同理</text>
  <text x="56" y="364" font-size="11.3" fill="#2f4a66" filter="url(#rough2)">（只能是「从左数第 k 个」）。所以前 n−k</text>
  <text x="56" y="384" font-size="11.3" fill="#2f4a66" filter="url(#rough2)">步两端都不动，最后一步恰在两端里二选一。</text>

  <!-- 右下：为什么能递归 -->
  <rect x="400" y="256" width="340" height="146" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">为什么能缩成「中段 + 参数 k−1」</text>
  <text x="416" y="304" font-size="11.3" fill="#3c5e2e" filter="url(#rough2)">两端全程没动，所以整局的「从左数第 k 个」</text>
  <text x="416" y="324" font-size="11.3" fill="#3c5e2e" filter="url(#rough2)">= a₁ 加上中段的「从左数第 k−1 个」；</text>
  <text x="416" y="344" font-size="11.3" fill="#3c5e2e" filter="url(#rough2)">「从右数第 k 个」同理。于是前 n−k 步恰好</text>
  <text x="416" y="364" font-size="11.3" fill="#3c5e2e" filter="url(#rough2)">是中段 (n−2 个元素, 参数 k−1) 的一次完整</text>
  <text x="416" y="384" font-size="11.3" fill="#3c5e2e" filter="url(#rough2)">对局：它要做的步数正好也是 n−k。</text>

  <rect x="40" y="416" width="700" height="38" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390" y="440" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">答案 = Σaᵢ − Σ(每层两端较小值)；若某层发现「剩余长度 &lt; kk」，剩余中段整段留下</text>
</svg>
