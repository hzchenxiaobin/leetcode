<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：真相表管「现行」，候选堆管「历史」，查询时堆顶对账</text>

  <!-- 左：真相表面板 -->
  <rect x="32" y="48" width="260" height="192" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="70" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">哈希表 cur[7] —— 唯一真相</text>

  <rect x="62" y="82" width="200" height="20" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="162" y1="82" x2="162" y2="102" stroke="#8a8a8a" stroke-width="1" filter="url(#rough2)"/>
  <text x="112" y="97" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">userId</text>
  <text x="212" y="97" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">金额（现行）</text>

  <rect x="62" y="102" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="162" y1="102" x2="162" y2="130" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="112" y="121" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="212" y="121" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">8</text>
  <text x="250" y="121" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="62" y="130" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <line x1="162" y1="130" x2="162" y2="158" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="112" y="149" text-anchor="middle" font-size="11" fill="#a0433f" filter="url(#rough2)">2</text>
  <text x="212" y="149" text-anchor="middle" font-size="11" fill="#a0433f" filter="url(#rough2)">6</text>
  <text x="250" y="149" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <path d="M68,144 L256,144" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="162" y="184" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">增 / 删 / 改：全部 O(1) 哈希读写</text>
  <text x="162" y="204" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">removeBid 后真相立即消失</text>
  <text x="162" y="224" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">（堆里的旧条目沦为「陈旧」）</text>

  <!-- 中：交互箭头 -->
  <path d="M298,134 L342,134" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">写：入堆</text>
  <path d="M342,166 L298,166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="182" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">查：对账</text>

  <!-- 右：候选堆面板 -->
  <rect x="348" y="48" width="260" height="192" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="70" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">最大堆 hp[7] —— 候选池（只进不出）</text>

  <path d="M478,114 L418,146" stroke="#a08040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M478,114 L538,146" stroke="#a08040" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="438" y="84" width="80" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="478" y="103" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(8, 1)</text>
  <text x="478" y="136" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">堆顶 ✓ 对账成功</text>

  <rect x="383" y="146" width="70" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="418" y="165" text-anchor="middle" font-size="10.5" fill="#a0433f" filter="url(#rough2)">(6, 2)</text>
  <text x="418" y="192" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 用户 2 已删</text>

  <rect x="503" y="146" width="70" height="30" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="538" y="165" text-anchor="middle" font-size="10.5" fill="#a0433f" filter="url(#rough2)">(5, 1)</text>
  <text x="538" y="192" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 价已改成 8</text>

  <text x="478" y="222" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">堆顶 = 全部条目的字典序最大者</text>

  <!-- 底部三个要点框 -->
  <rect x="36" y="272" width="568" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="292" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">平局规则白送：堆按（金额, userId）字典序取最大</text>
  <text x="320" y="312" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">金额最高优先，金额并列时 userId 大者胜 —— 题目规则零特判</text>

  <rect x="36" y="332" width="568" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="352" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">懒删除：removeBid / 改价只改真相、不动堆</text>
  <text x="320" y="372" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">陈旧条目升至堆顶、对账识破后才弹出，每条至多弹一次</text>

  <rect x="36" y="392" width="568" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="412" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">⚠️ 对账条件是「存在且相等」：cur[u] == a</text>
  <text x="320" y="432" text-anchor="middle" font-size="10.5" fill="#a0433f" filter="url(#rough2)">不是「用户还在」—— 价改过同样陈旧；用户已删则查无此键</text>
</svg>
