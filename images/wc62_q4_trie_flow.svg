<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：建表插全部后缀键，查询沿 Trie 下降</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">插入键 = 后缀 + '{' + 整词；查询键 = suff + '{' + pref</text>

  <text x="28" y="66" font-size="11.5" fill="#446688" filter="url(#rough2)">建表：O(N·L²)，只做一次</text>
  <text x="326" y="66" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">查询：每次 O(L)，最多 10⁴ 次</text>

  <g filter="url(#rough2)">
    <rect x="28" y="74" width="252" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="28" y="152" width="252" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="28" y="230" width="252" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="28" y="308" width="252" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="326" y="74" width="266" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="326" y="152" width="266" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="326" y="230" width="266" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="326" y="308" width="266" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#2c3e50">
    <text x="40" y="94">① 枚举每个词 w 与它的下标 i</text>
    <text x="40" y="114" font-size="9.5" fill="#7a6a5a">下标递增取出，最后一次写入就是最大</text>
    <text x="40" y="172">② 枚举 w 的全部后缀 s = w[j:]</text>
    <text x="40" y="192" font-size="9.5" fill="#7a6a5a">j = 0..L，j = L 时是空串 → 键 {w</text>
    <text x="40" y="250">③ 把 s + '{' + w 插入 Trie</text>
    <text x="40" y="270" font-size="9.5" fill="#7a6a5a">沿途每个结点 weight ← i</text>
    <text x="40" y="328">④ 权重覆盖写：结点留存的就是</text>
    <text x="40" y="346" font-size="9.5" fill="#7a6a5a">「所有经过它的词」的最大下标</text>

    <text x="338" y="94">① 拼出查询键 suff + '{' + pref</text>
    <text x="338" y="114" font-size="9.5" fill="#3a5a30">'le' + '{' + 'ap' = le{ap</text>
    <text x="338" y="172">② 从根开始逐字符下降</text>
    <text x="338" y="192" font-size="9.5" fill="#3a5a30">每一步只花 O(1)，最多 7+1+7 步</text>
    <text x="338" y="250">③ 某一层没有对应子结点</text>
    <text x="338" y="270" font-size="9.5" fill="#8a3a36">→ 无此词，直接返回 -1</text>
    <text x="338" y="328">④ 走完 → 返回终点 weight，它就是</text>
    <text x="338" y="346" font-size="9.5" fill="#8a5a20">满足「前缀 + 后缀」的词中最大的下标</text>
  </g>

  <g stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 154 130 L 154 150" marker-end="url(#arr)"/>
    <path d="M 154 208 L 154 228" marker-end="url(#arr)"/>
    <path d="M 154 286 L 154 306" marker-end="url(#arr)"/>
    <path d="M 459 130 L 459 150" marker-end="url(#arr)"/>
    <path d="M 459 208 L 459 228" marker-end="url(#arr)"/>
    <path d="M 459 294 L 459 306" marker-end="url(#arr)"/>
  </g>

  <text x="310" y="390" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">建表把「二维匹配」提前摊平进 Trie；查询只剩一条从根到叶的单链走查</text>
</svg>
