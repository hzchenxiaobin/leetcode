<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：按行求和，再取最大</text>
  <path d="M 185 40 Q 320 48 455 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="120" y="56" width="400" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace" font-weight="bold" filter="url(#sk)">ans = max_i ( Σ_j accounts[i][j] )</text>

  <g font-size="12" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="120" y="118">银行 0</text>
    <text x="176" y="118">银行 1</text>
    <text x="232" y="118">银行 2</text>
  </g>
  <g font-size="12" fill="#888" text-anchor="end" filter="url(#sk)">
    <text x="86" y="155">客户 0</text>
    <text x="86" y="193">客户 1</text>
    <text x="86" y="231">客户 2</text>
  </g>

  <g filter="url(#sk)">
    <rect x="92" y="132" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="148" y="132" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="204" y="132" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="92" y="170" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="148" y="170" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="204" y="170" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="92" y="208" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="148" y="208" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="204" y="208" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="120" y="156">2</text>
    <text x="176" y="156">8</text>
    <text x="232" y="156">7</text>
    <text x="120" y="194">7</text>
    <text x="176" y="194">1</text>
    <text x="232" y="194">3</text>
    <text x="120" y="232">1</text>
    <text x="176" y="232">9</text>
    <text x="232" y="232">5</text>
  </g>

  <text x="425" y="124" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">各客户资产总量（行和）</text>

  <g filter="url(#sk)">
    <path d="M 264 151 C 285 149, 300 151, 322 151" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 264 189 C 285 187, 300 189, 322 189" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 264 227 C 285 225, 300 227, 322 227" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="330" y="132" width="190" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="425" y="156" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#sk)">2 + 8 + 7 = 17 ★</text>

  <g filter="url(#sk)">
    <rect x="330" y="170" width="190" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="425" y="194" text-anchor="middle" font-size="14" fill="#3a5a3a" filter="url(#sk)">7 + 1 + 3 = 11</text>

  <g filter="url(#sk)">
    <rect x="330" y="208" width="190" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="425" y="232" text-anchor="middle" font-size="14" fill="#3a5a3a" filter="url(#sk)">1 + 9 + 5 = 15</text>

  <g filter="url(#sk)">
    <path d="M 522 151 C 572 156, 578 248, 474 272" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="170" y="268" width="300" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="299" text-anchor="middle" font-size="15" fill="#b07818" font-weight="bold" font-family="monospace" filter="url(#sk)">ans = max(17, 11, 15) = 17 ✓</text>

  <g filter="url(#sk)">
    <rect x="40" y="336" width="560" height="28" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="355" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">行 = 客户（沿行求和），列 = 银行；一次遍历即可，无需排序或额外数据结构。</text>
</svg>
