<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">示例演算：nums = [2, 2, 3, 3, 3, 4]</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#888">cnt：2 出现 2 次、3 出现 3 次、4 出现 1 次；1 与 5 是空桶</text>

  <rect x="65" y="70" width="520" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold" fill="#8a6a20">
    <text x="120" y="92">v</text>
    <text x="230" y="92">cnt[v]</text>
    <text x="340" y="92">points[v]</text>
    <text x="450" y="92">f[v]</text>
    <text x="550" y="92">决策来源</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="65" y="106" width="520" height="32" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="4"/>
    <rect x="65" y="140" width="520" height="32" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="4"/>
    <rect x="65" y="174" width="520" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="65" y="208" width="520" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="65" y="242" width="520" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="120" y="127" fill="#555">0</text>
    <text x="230" y="127" fill="#555">0</text>
    <text x="340" y="127" fill="#555">0</text>
    <text x="450" y="127" fill="#555">0</text>
    <text x="550" y="127" fill="#aaa">初值</text>
    <text x="120" y="161" fill="#555">1</text>
    <text x="230" y="161" fill="#555">0</text>
    <text x="340" y="161" fill="#555">0</text>
    <text x="450" y="161" fill="#555">0</text>
    <text x="550" y="161" fill="#aaa">空桶，跳过</text>
    <text x="120" y="195" fill="#3a4a66">2</text>
    <text x="230" y="195" fill="#3a4a66">2</text>
    <text x="340" y="195" fill="#3a4a66">4</text>
    <text x="450" y="195" fill="#3a4a66">4</text>
    <text x="550" y="195" fill="#3a4a66">f[0] + 4</text>
    <text x="120" y="229" fill="#7a2f2b">3</text>
    <text x="230" y="229" fill="#7a2f2b">3</text>
    <text x="340" y="229" fill="#7a2f2b">9</text>
    <text x="450" y="229" fill="#7a2f2b">9</text>
    <text x="550" y="229" fill="#7a2f2b">f[1] + 9</text>
    <text x="120" y="263" fill="#3a5a30">4</text>
    <text x="230" y="263" fill="#3a5a30">1</text>
    <text x="340" y="263" fill="#3a5a30">4</text>
    <text x="450" y="263" fill="#3a5a30">9</text>
    <text x="545" y="263" fill="#3a5a30" font-size="10">max(9, f[2]+4)</text>
  </g>

  <path d="M 500 278 L 500 294" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="312" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">答案 f[4] = 9：把三个 3 一次取光，比「4 + 2」更划算</text>

  <rect x="80" y="326" width="460" height="52" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="98" y="348" font-size="10" fill="#666">v = 3 时取桶得 9，f[1] = 0，所以 f[3] = 9；</text>
  <text x="98" y="368" font-size="10" fill="#666">v = 4 时若取桶只能接 f[2] = 4，得 8，小于不取的 9，故最终为 9。</text>

  <text x="310" y="394" text-anchor="middle" font-size="9" fill="#aaa">注意 f 单调不减：跳过空桶不会让答案变差</text>
</svg>
