<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：[1,2,3]，k = 2，逐起点向右累或</text>

  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <rect x="40" y="48" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="120" y="48" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="200" y="48" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="280" y="48" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="360" y="48" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="68">起点 i</text><text x="160" y="68">j=0</text><text x="240" y="68">j=1</text>
    <text x="320" y="68">j=2</text><text x="405" y="68">该行最短</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="80" width="80" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="120" y="80" width="80" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="200" y="80" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="280" y="80" width="80" height="34" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
    <rect x="360" y="80" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="102">i=0</text><text x="160" y="102">1 ✗</text><text x="240" y="102">3 ✓</text>
    <text x="320" y="102">—</text><text x="405" y="102">2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="120" width="80" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="120" y="120" width="80" height="34" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
    <rect x="200" y="120" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="280" y="120" width="80" height="34" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
    <rect x="360" y="120" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="142">i=1</text><text x="160" y="142">—</text><text x="240" y="142">2 ✓</text>
    <text x="320" y="142">—</text><text x="405" y="142">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="160" width="80" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="120" y="160" width="80" height="34" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
    <rect x="200" y="160" width="80" height="34" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
    <rect x="280" y="160" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="360" y="160" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="182">i=2</text><text x="160" y="182">—</text><text x="240" y="182">—</text>
    <text x="320" y="182">3 ✓</text><text x="405" y="182">1</text>
  </g>

  <text x="60" y="222" font-size="12" fill="#446688" filter="url(#rough2)">「—」表示该起点下更短的窗口已命中，直接 break，不再向右扩展。</text>
  <rect x="40" y="238" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">三行最优值取 min{2, 1, 1} = 1</text>
  <rect x="40" y="284" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">每行只看第一个 ✓ 的格子，所以内层循环最坏也只跑满一行</text>
</svg>
