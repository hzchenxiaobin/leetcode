<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：[0,2,1,5,3,4] 的原地编码与解码（n = 6）</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 行一：原数组 -->
  <text x="80" y="82" text-anchor="end" font-size="12" font-weight="bold" fill="#446688">nums（原）</text>
  <g filter="url(#sk)"><rect x="92" y="56" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="120" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">0</text>
  <g filter="url(#sk)"><rect x="172" y="56" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="200" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="252" y="56" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="332" y="56" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="360" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">5</text>
  <g filter="url(#sk)"><rect x="412" y="56" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="440" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="492" y="56" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="520" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="120" y="114" text-anchor="middle" font-size="9.5" fill="#888">i=0</text>
  <text x="200" y="114" text-anchor="middle" font-size="9.5" fill="#888">i=1</text>
  <text x="280" y="114" text-anchor="middle" font-size="9.5" fill="#888">i=2</text>
  <text x="360" y="114" text-anchor="middle" font-size="9.5" fill="#888">i=3</text>
  <text x="440" y="114" text-anchor="middle" font-size="9.5" fill="#888">i=4</text>
  <text x="520" y="114" text-anchor="middle" font-size="9.5" fill="#888">i=5</text>

  <!-- 第一趟标签 -->
  <path d="M 76 106 L 76 158" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="92" y="130" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b6e9e">第一趟 · 编码（自左向右）</text>
  <text x="92" y="148" text-anchor="start" font-size="10.5" fill="#446688">nums[i] += 6 × (nums[nums[i]] % 6)</text>

  <!-- i=2 关键时刻标注 -->
  <g filter="url(#sk)">
    <rect x="330" y="118" width="290" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="475" y="135" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">⚠ i=2 时读 nums[1] = 8（已编码）</text>
  <text x="475" y="152" text-anchor="middle" font-size="10.5" fill="#444">8 % 6 = 2 取回原值，信息不丢失</text>

  <!-- 行二：编码后 -->
  <text x="80" y="188" text-anchor="end" font-size="12" font-weight="bold" fill="#7a5415">编码后</text>
  <g filter="url(#sk)"><rect x="92" y="162" width="56" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="120" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">0</text>
  <g filter="url(#sk)"><rect x="172" y="162" width="56" height="44" rx="6" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="200" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">8</text>
  <g filter="url(#sk)"><rect x="252" y="162" width="56" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="280" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">13</text>
  <g filter="url(#sk)"><rect x="332" y="162" width="56" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="360" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">29</text>
  <g filter="url(#sk)"><rect x="412" y="162" width="56" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="440" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">33</text>
  <g filter="url(#sk)"><rect x="492" y="162" width="56" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="520" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">22</text>
  <text x="120" y="222" text-anchor="middle" font-size="10" fill="#888">0+6·0</text>
  <text x="200" y="222" text-anchor="middle" font-size="10" fill="#b03a3a">2+6·1</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#888">1+6·2</text>
  <text x="360" y="222" text-anchor="middle" font-size="10" fill="#888">5+6·4</text>
  <text x="440" y="222" text-anchor="middle" font-size="10" fill="#888">3+6·5</text>
  <text x="520" y="222" text-anchor="middle" font-size="10" fill="#888">4+6·3</text>

  <!-- 第二趟标签 -->
  <path d="M 76 210 L 76 264" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="92" y="242" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2e6e2e">第二趟 · 解码（整除取高位）</text>
  <text x="92" y="260" text-anchor="start" font-size="10.5" fill="#4a7a3a">nums[i] //= 6</text>

  <!-- 行三：答案 -->
  <text x="80" y="294" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e">ans</text>
  <g filter="url(#sk)"><rect x="92" y="268" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="120" y="296" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">0</text>
  <g filter="url(#sk)"><rect x="172" y="268" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="200" y="296" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">1</text>
  <g filter="url(#sk)"><rect x="252" y="268" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="280" y="296" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="332" y="268" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="360" y="296" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">4</text>
  <g filter="url(#sk)"><rect x="412" y="268" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="440" y="296" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">5</text>
  <g filter="url(#sk)"><rect x="492" y="268" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="520" y="296" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="120" y="328" text-anchor="middle" font-size="9.5" fill="#888">ans[0]</text>
  <text x="200" y="328" text-anchor="middle" font-size="9.5" fill="#888">ans[1]</text>
  <text x="280" y="328" text-anchor="middle" font-size="9.5" fill="#888">ans[2]</text>
  <text x="360" y="328" text-anchor="middle" font-size="9.5" fill="#888">ans[3]</text>
  <text x="440" y="328" text-anchor="middle" font-size="9.5" fill="#888">ans[4]</text>
  <text x="520" y="328" text-anchor="middle" font-size="9.5" fill="#888">ans[5]</text>

  <text x="320" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">解码结果 [0, 1, 2, 4, 5, 3] —— 与官方输出完全一致 ✓</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="368" width="520" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">全程只用常数个临时变量：两趟扫描、零辅助数组</text>
  <text x="320" y="408" text-anchor="middle" font-size="11" fill="#444">低位 % 6 还原原值（不变式）· 高位 // 6 取出答案 —— O(1) 额外空间</text>
</svg>
