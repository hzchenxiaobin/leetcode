<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：s = "adaa"，chars = "d"，vals = [-1000] → v = [1, -1000, 1, 1]</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="70" y="60" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="82" text-anchor="middle">步骤 i</text>
    <rect x="150" y="60" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="190" y="82" text-anchor="middle">v[i]</text>
    <rect x="230" y="60" width="140" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="300" y="82" text-anchor="middle">max(cur, 0) + v[i]</text>
    <rect x="370" y="60" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="410" y="82" text-anchor="middle">cur</text>
    <rect x="450" y="60" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="490" y="82" text-anchor="middle">ans</text>
  </g>

  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="70" y="100" width="80" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="110" y="121" text-anchor="middle">0 · 'a'</text>
    <rect x="150" y="100" width="80" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="190" y="121" text-anchor="middle">1</text>
    <rect x="230" y="100" width="140" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="300" y="121" text-anchor="middle">max(0,0)+1</text>
    <rect x="370" y="100" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="410" y="121" text-anchor="middle">1</text>
    <rect x="450" y="100" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="490" y="121" text-anchor="middle">1</text>

    <rect x="70" y="138" width="80" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="110" y="159" text-anchor="middle">1 · 'd'</text>
    <rect x="150" y="138" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="190" y="159" text-anchor="middle">-1000</text>
    <rect x="230" y="138" width="140" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="300" y="159" text-anchor="middle">max(1,0)-1000</text>
    <rect x="370" y="138" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="410" y="159" text-anchor="middle">-999</text>
    <rect x="450" y="138" width="80" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="490" y="159" text-anchor="middle">1</text>

    <rect x="70" y="176" width="80" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="110" y="197" text-anchor="middle">2 · 'a'</text>
    <rect x="150" y="176" width="80" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="190" y="197" text-anchor="middle">1</text>
    <rect x="230" y="176" width="140" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="300" y="197" text-anchor="middle">舍弃 -999，取 0+1</text>
    <rect x="370" y="176" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="410" y="197" text-anchor="middle">1</text>
    <rect x="450" y="176" width="80" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="490" y="197" text-anchor="middle">1</text>

    <rect x="70" y="214" width="80" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="110" y="235" text-anchor="middle">3 · 'a'</text>
    <rect x="150" y="214" width="80" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="190" y="235" text-anchor="middle">1</text>
    <rect x="230" y="214" width="140" height="32" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2"/>
    <text x="300" y="235" text-anchor="middle">1 + 1</text>
    <rect x="370" y="214" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="410" y="235" text-anchor="middle">2</text>
    <rect x="450" y="214" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="490" y="235" text-anchor="middle" font-weight="bold" fill="#b85450">2</text>
  </g>

  <rect x="120" y="256" width="320" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最终 ans = 2，对应子串 "aa"（末尾两个 a）</text>
</svg>
