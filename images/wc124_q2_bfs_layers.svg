<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">多源 BFS：所有腐烂橘子同时入队，一层 = 一分钟</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">数字 = 该格变腐烂的分钟数（到最近腐烂源的曼哈顿距离）</text>

  <rect x="60" y="64" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="82" y="92" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="108" y="64" width="44" height="44" fill="#fff1e0" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="130" y="92" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="156" y="64" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="178" y="92" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="204" y="64" width="44" height="44" fill="#eef7e8" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="226" y="92" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="252" y="64" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="274" y="92" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>

  <rect x="60" y="112" width="44" height="44" fill="#fff1e0" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="82" y="140" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="108" y="112" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="130" y="140" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="156" y="112" width="44" height="44" fill="#eef7e8" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="178" y="140" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="204" y="112" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="226" y="140" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="252" y="112" width="44" height="44" fill="#eef7e8" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="274" y="140" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>

  <rect x="60" y="160" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="82" y="188" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="108" y="160" width="44" height="44" fill="#eef7e8" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="130" y="188" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="156" y="160" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="178" y="188" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="204" y="160" width="44" height="44" fill="#eef7e8" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="226" y="188" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="252" y="160" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="274" y="188" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>

  <rect x="60" y="208" width="44" height="44" fill="#eef7e8" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="82" y="236" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="108" y="208" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="130" y="236" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="156" y="208" width="44" height="44" fill="#eef7e8" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="178" y="236" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="204" y="208" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="226" y="236" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="252" y="208" width="44" height="44" fill="#fff1e0" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="274" y="236" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>

  <rect x="60" y="256" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="82" y="284" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="108" y="256" width="44" height="44" fill="#eef7e8" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="130" y="284" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="156" y="256" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="178" y="284" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="204" y="256" width="44" height="44" fill="#fff1e0" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="226" y="284" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="252" y="256" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="274" y="284" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="326" y="64" width="206" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="338" y="84" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">为什么必须「多源」？</text>
  <text x="338" y="103" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">单源逐个 BFS 会重复扫描，且要取</text>
  <text x="338" y="120" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">多源距离的最小值；把全部腐烂橘子</text>
  <text x="338" y="137" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">一次性入队，一次 BFS 就等价于求</text>
  <text x="338" y="152" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">所有源的最短距离。</text>

  <rect x="326" y="168" width="206" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="338" y="188" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">层数 = 分钟数</text>
  <text x="338" y="207" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">按层处理（记录当前队列长度），</text>
  <text x="338" y="224" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">每扩完一层 ans 加一。</text>

  <rect x="326" y="252" width="206" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="338" y="272" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">剩余新鲜 → -1</text>
  <text x="338" y="291" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">BFS 结束后还数得到新鲜橘子，说明</text>
  <text x="338" y="305" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">它们被空格隔断，永远烂不了。</text>
</svg>
