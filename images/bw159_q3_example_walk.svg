<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="330" fill="#fafafa"/>

  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,3,5,7]，k = 3</text>
  <text x="310" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">质数 pos = [0,1,2,3]，答案 4</text>
  <rect x="40" y="66" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="150" y="66" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">窗口最小值 s</text>
  <rect x="270" y="66" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">右端可选</text>
  <rect x="400" y="66" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="470.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">左端可选</text>
  <rect x="540" y="66" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="570.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">贡献</text>
  <rect x="40" y="96" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1（val=3）</text>
  <rect x="150" y="96" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="210.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="270" y="96" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">pos[2]-pos[1] = 1</text>
  <rect x="400" y="96" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="470.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">pos[0]-(-1) = 1</text>
  <rect x="540" y="96" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="570.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="40" y="126" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2（val=5）</text>
  <rect x="150" y="126" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="210.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="270" y="126" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">pos[3]-pos[2] = 1</text>
  <rect x="400" y="126" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="470.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">pos[1]-(-1) = 2</text>
  <rect x="540" y="126" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="570.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="40" y="156" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">3（val=7）</text>
  <rect x="150" y="156" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="210.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="270" y="156" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">4-pos[3] = 1</text>
  <rect x="400" y="156" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="470.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">pos[2]-pos[1] = 1</text>
  <rect x="540" y="156" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="570.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="40" y="200" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="222.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">e=2 时 [0,2] 的 max-min = 5-2 = 3 &lt;= 3 合法，两个左端点分别对应 [2,3,5] 与 [3,5]</text>
  <text x="310.0" y="242.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">e=3 时 s 只能从 2 开始（含 3 与 7 时 7-3 = 4 &gt; 3）</text>
  <text x="40" y="288" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">合计 1 + 2 + 1 = 4，与官方输出一致</text>
</svg>
