<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">稳定判定：只与左侧相邻的那一座山有关</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">height = [1, 2, 3, 4, 5]，threshold = 2</text>

  <rect x="40" y="96" width="64" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="112" y="96" width="64" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="184" y="96" width="64" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="256" y="96" width="64" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="328" y="96" width="64" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="400" y="96" width="64" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>

  <text x="72" y="118" text-anchor="middle" font-size="9.5" fill="#888">下标 0</text>
  <text x="144" y="118" text-anchor="middle" font-size="9.5" fill="#888">下标 1</text>
  <text x="216" y="118" text-anchor="middle" font-size="9.5" fill="#8a6a20">下标 2</text>
  <text x="288" y="118" text-anchor="middle" font-size="9.5" fill="#3a5a30">下标 3</text>
  <text x="360" y="118" text-anchor="middle" font-size="9.5" fill="#888">下标 4</text>
  <text x="432" y="118" text-anchor="middle" font-size="9.5" fill="#888">下标 5</text>

  <text x="72" y="140" text-anchor="middle" font-size="16" fill="#3a4a66" font-weight="bold">1</text>
  <text x="144" y="140" text-anchor="middle" font-size="16" fill="#8a3a36" font-weight="bold">2</text>
  <text x="216" y="140" text-anchor="middle" font-size="16" fill="#8a6a20" font-weight="bold">3</text>
  <text x="288" y="140" text-anchor="middle" font-size="16" fill="#3a5a30" font-weight="bold">4</text>
  <text x="360" y="140" text-anchor="middle" font-size="16" fill="#3a4a66" font-weight="bold">5</text>
  <text x="432" y="140" text-anchor="middle" font-size="16" fill="#3a4a66" font-weight="bold">6</text>

  <path d="M 76 92 Q 110 62 140 92" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="56" text-anchor="middle" font-size="10" fill="#b85450">左邻 height[0]</text>

  <path d="M 220 92 Q 254 62 284 92" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a">左邻 height[2]</text>

  <rect x="40" y="176" width="196" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="138" y="196" text-anchor="middle" font-size="10.5" fill="#8a3a36">height[0] = 1 ≤ 2</text>
  <text x="138" y="213" text-anchor="middle" font-size="10.5" fill="#8a3a36">→ 下标 1 不稳定 ✗</text>

  <rect x="252" y="176" width="196" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="350" y="196" text-anchor="middle" font-size="10.5" fill="#3a5a30">height[2] = 3 &gt; 2</text>
  <text x="350" y="213" text-anchor="middle" font-size="10.5" fill="#3a5a30">→ 下标 3 稳定 ✓</text>

  <rect x="40" y="244" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold">判定式：i ≥ 1 且 height[i−1] &gt; threshold ⟹ 下标 i 稳定</text>
  <text x="280" y="294" text-anchor="middle" font-size="10.5" fill="#555">只看 i−1 这一座，不看更左边的山；下标 0 没有左邻，恒不稳定</text>
  <text x="280" y="312" text-anchor="middle" font-size="10.5" fill="#555">严格大于：左邻高度恰好等于 threshold 时不算稳定</text>

  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#999">→ 答案只取决于「前一个元素是否超过阈值」，与后续山高无关</text>
</svg>
