<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">极差收窄：正确位定住 [lo, hi]，错误位在 v−1 / v+1 中挑</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">模板 A 的正确位 {-2, -3} → lo = -3，hi = -2；错误位 1 和 4 各有两个候选</text>
  <path d="M 60 132 L 500 132" stroke="#bbb" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="84" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">-3</text>
  <text x="148" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">-2</text>
  <text x="300" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="276" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="324" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="372" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="396" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="420" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <rect x="62" y="86" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84.0" y="107.32" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)"></text>
  <rect x="126" y="86" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148.0" y="107.32" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)"></text>
  <rect x="62" y="86" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="108" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">lo=-3</text>
  <rect x="126" y="86" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="108" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">hi=-2</text>
  <text x="276" y="72" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">1 → 0 ✓</text>
  <text x="396" y="72" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">4 → 3 ✓</text>
  <path d="M 276 92 L 276 126" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 396 92 L 396 126" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 84 160 L 372 160" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="176" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最终极差 = 3 - (-3) = 6</text>
  <rect x="36" y="196" width="488" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="216" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">选择规则（每个错误位独立决定）</text>
  <text x="48" y="234" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">若 v−1 ≥ lo → 选 v−1：既不改下限，又让上限最小</text>
  <text x="48" y="252" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">若 v−1 &lt; lo → 选 v+1：v−1 会拉低下限，v+1 更有机会留在 [lo, hi] 里</text>
  <rect x="36" y="270" width="236" height="62" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="290" text-anchor="start" font-size="10.5" fill="#666666" font-weight="bold" filter="url(#rough2)">为什么可以独立挑</text>
  <text x="48" y="307" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">极差只看最小值和最大值，</text>
  <text x="48" y="324" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">两个错误位不可能同时占两端。</text>
  <rect x="288" y="270" width="236" height="62" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="290" text-anchor="start" font-size="10.5" fill="#666666" font-weight="bold" filter="url(#rough2)">边界位同时越界时</text>
  <text x="300" y="307" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">hi−lo &lt; 2 才会出现（如 lo=hi），</text>
  <text x="300" y="324" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">两种选法极差相同，任取即可。</text>
  <text x="280" y="366" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">绿色 = 正确位固定不动；橙色 = 错误位翻转奇偶后的落点</text>
</svg>
