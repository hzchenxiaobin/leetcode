<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="580" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，first 只记首次、last 次次刷新</text>

  <!-- 开始 -->
  <ellipse cx="320" cy="58" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="63" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M320,76 V88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- A：isPrime 准备 -->
  <rect x="185" y="88" width="310" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="108" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">isPrime(x)：x &lt; 2 直接 false</text>
  <text x="320" y="127" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">否则试除 d = 2 … ⌊√x⌋（至多 9 步）</text>
  <path d="M320,136 V162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B：i < n ? -->
  <polygon points="244,196 320,162 396,196 320,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="201" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">i &lt; n ?</text>

  <!-- B 否 → 返回 -->
  <path d="M396,196 H470" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="188" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="470" y="178" width="140" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="540" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 last − first</text>

  <!-- B 是 ↓ -->
  <path d="M320,230 V262" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="331" y="252" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- C：isPrime(nums[i]) ? -->
  <polygon points="230,298 320,264 410,298 320,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="303" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">isPrime(nums[i]) ?</text>

  <!-- C 否 → 绕到 i++ -->
  <path d="M410,298 H566 V542 H390" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="290" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否（跳过）</text>

  <!-- C 是 ↓ -->
  <path d="M320,332 V374" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="331" y="360" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- D：first == -1 ? -->
  <polygon points="244,408 320,374 396,408 320,442" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="413" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">first == −1 ?</text>

  <!-- D 是 → first = i -->
  <path d="M244,408 H180" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="400" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="70" y="386" width="110" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="404" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">first = i</text>
  <text x="125" y="421" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">仅首次命中</text>

  <!-- D 否 → 绕到 last -->
  <path d="M396,408 H470 V476 H390" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="400" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- first = i → last = i -->
  <path d="M125,430 V476 H250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E2：last = i -->
  <rect x="250" y="456" width="140" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="474" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">last = i</text>
  <text x="320" y="490" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">每次命中都刷新</text>

  <!-- last → i++ -->
  <path d="M320,496 V524" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F：i++ -->
  <rect x="250" y="524" width="140" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="547" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">i = i + 1</text>

  <!-- F → B 回边 -->
  <path d="M250,542 H36 V196 H244" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="380" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下一轮</text>
</svg>
