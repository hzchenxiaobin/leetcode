<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arN" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#aaa"/>
    </marker>
  </defs>

  <rect width="920" height="470" fill="#fafafa"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = FFF —— Alice 轮轮出火龙 F</text>
  <path d="M 270 42 Q 460 50 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- column headers -->
  <text x="150" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">第 1 轮 · Alice: F</text>
  <text x="430" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">第 2 轮 · Alice: F</text>
  <text x="730" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">第 3 轮 · Alice: F</text>

  <!-- transfer arrows between columns -->
  <path d="M 205 92 Q 290 76 373 92" stroke="#aaa" stroke-width="1.6" fill="none" marker-end="url(#arN)" filter="url(#sk)"/>
  <text x="290" y="106" text-anchor="middle" font-size="9.5" fill="#888">每个状态 → 2 个非同招后继</text>
  <path d="M 485 92 Q 580 76 668 92" stroke="#aaa" stroke-width="1.6" fill="none" marker-end="url(#arN)" filter="url(#sk)"/>
  <text x="580" y="106" text-anchor="middle" font-size="9.5" fill="#888">同样每个状态 ×2 分裂</text>

  <!-- ===== Round 1 chips ===== -->
  <g filter="url(#sk)"><rect x="118" y="128" width="64" height="26" rx="6" fill="#fff" stroke="#999" stroke-width="1.3"/></g>
  <text x="150" y="145" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">F, d=0</text>
  <g filter="url(#sk)"><rect x="118" y="168" width="64" height="26" rx="6" fill="#fff" stroke="#999" stroke-width="1.3"/></g>
  <text x="150" y="185" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">W, d=+1</text>
  <g filter="url(#sk)"><rect x="118" y="208" width="64" height="26" rx="6" fill="#fff" stroke="#999" stroke-width="1.3"/></g>
  <text x="150" y="225" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">E, d=−1</text>
  <text x="150" y="256" text-anchor="middle" font-size="10" fill="#888">三招各 1 条</text>

  <!-- ===== Round 2 chips ===== -->
  <g filter="url(#sk)"><rect x="398" y="108" width="64" height="26" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="430" y="125" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">F, d=+1</text>
  <g filter="url(#sk)"><rect x="398" y="143" width="64" height="26" rx="6" fill="#fff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#2b5a88" font-weight="bold">W, d=+1</text>
  <g filter="url(#sk)"><rect x="398" y="178" width="64" height="26" rx="6" fill="#fff" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="430" y="195" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">E, d=0</text>
  <g filter="url(#sk)"><rect x="398" y="213" width="64" height="26" rx="6" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
  <text x="430" y="230" text-anchor="middle" font-size="11" fill="#999">W, d=0</text>
  <g filter="url(#sk)"><rect x="398" y="248" width="64" height="26" rx="6" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
  <text x="430" y="265" text-anchor="middle" font-size="11" fill="#999">F, d=−1</text>
  <g filter="url(#sk)"><rect x="398" y="283" width="64" height="26" rx="6" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
  <text x="430" y="300" text-anchor="middle" font-size="11" fill="#999">E, d=−1</text>
  <text x="430" y="330" text-anchor="middle" font-size="10" fill="#888">6 个状态 · 各 1 条</text>

  <!-- ===== Round 3 chips ===== -->
  <g filter="url(#sk)"><rect x="698" y="96" width="64" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="730" y="113" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">W, d=+2</text>
  <text x="772" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">← WFW</text>

  <g filter="url(#sk)"><rect x="698" y="126" width="64" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="730" y="143" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">F, d=+1</text>
  <text x="772" y="142" font-size="10" fill="#446688" font-weight="bold">← FWF</text>

  <g filter="url(#sk)"><rect x="698" y="156" width="64" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="730" y="173" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">W, d=+1</text>
  <text x="772" y="172" font-size="10" fill="#d6a040" font-weight="bold">← WEW</text>

  <g filter="url(#sk)"><rect x="698" y="186" width="64" height="26" rx="6" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
  <text x="730" y="203" text-anchor="middle" font-size="11" fill="#999">E, d=0 ×2</text>
  <g filter="url(#sk)"><rect x="698" y="216" width="64" height="26" rx="6" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
  <text x="730" y="233" text-anchor="middle" font-size="11" fill="#999">W, d=0 ×2</text>
  <g filter="url(#sk)"><rect x="698" y="246" width="64" height="26" rx="6" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
  <text x="730" y="263" text-anchor="middle" font-size="11" fill="#999">F, d=0 ×2</text>
  <g filter="url(#sk)"><rect x="698" y="276" width="64" height="26" rx="6" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
  <text x="730" y="293" text-anchor="middle" font-size="11" fill="#999">E, d=−1</text>
  <g filter="url(#sk)"><rect x="698" y="306" width="64" height="26" rx="6" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
  <text x="730" y="323" text-anchor="middle" font-size="11" fill="#999">F, d=−1</text>
  <g filter="url(#sk)"><rect x="698" y="336" width="64" height="26" rx="6" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
  <text x="730" y="353" text-anchor="middle" font-size="11" fill="#999">E, d=−2</text>
  <text x="730" y="384" text-anchor="middle" font-size="10" fill="#888">9 个状态 · 计数和 12 = 全部合法序列</text>

  <!-- ===== winning paths ===== -->
  <!-- FWF (blue): (F,0) -> (W,+1) -> (F,+1) -->
  <path d="M 186 141 Q 292 132 392 156" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 466 156 Q 582 142 692 139" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <!-- WFW (green): (W,+1) -> (F,+1) -> (W,+2) -->
  <path d="M 184 174 Q 286 136 392 121" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 466 121 Q 578 106 692 109" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <!-- WEW (orange): (W,+1) -> (E,0) -> (W,+1) -->
  <path d="M 184 188 Q 292 196 392 191" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 466 191 Q 580 178 692 169" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- ===== answer box ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="400" width="860" height="52" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="80" y="422" font-size="12.5" font-weight="bold" fill="#2e6e2e">答案 = 末轮 d ≥ 1 的计数和 = 1 + 1 + 1 = 3</text>
  <text x="80" y="443" font-size="10.5" fill="#666">d ≤ 0 的 9 条路径（平局或落后）一律不计入</text>
  <path d="M 520 417 L 550 417" stroke="#446688" stroke-width="2.5" filter="url(#sk)"/>
  <text x="556" y="421" font-size="10.5" fill="#446688" font-weight="bold">FWF</text>
  <path d="M 610 417 L 640 417" stroke="#4a7a3a" stroke-width="2.5" filter="url(#sk)"/>
  <text x="646" y="421" font-size="10.5" fill="#4a7a3a" font-weight="bold">WFW</text>
  <path d="M 700 417 L 730 417" stroke="#d6a040" stroke-width="2.5" filter="url(#sk)"/>
  <text x="736" y="421" font-size="10.5" fill="#8a6d1f" font-weight="bold">WEW</text>
</svg>
