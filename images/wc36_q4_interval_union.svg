<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：加粗 = 所有匹配区间的并集</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = "aaabbb"，words = ["aa", "b"]：重叠要合并，相邻也要合并</text>

  <g font-size="13" text-anchor="middle" fill="#3a4a66">
    <rect x="170" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="190" y="87" filter="url(#rough2)">a</text>
    <rect x="210" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="230" y="87" filter="url(#rough2)">a</text>
    <rect x="250" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="270" y="87" filter="url(#rough2)">a</text>
    <rect x="290" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="310" y="87" filter="url(#rough2)">b</text>
    <rect x="330" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="350" y="87" filter="url(#rough2)">b</text>
    <rect x="370" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="390" y="87" filter="url(#rough2)">b</text>
  </g>

  <g font-size="9.5" text-anchor="middle" fill="#999">
    <text x="190" y="114" filter="url(#rough2)">0</text>
    <text x="230" y="114" filter="url(#rough2)">1</text>
    <text x="270" y="114" filter="url(#rough2)">2</text>
    <text x="310" y="114" filter="url(#rough2)">3</text>
    <text x="350" y="114" filter="url(#rough2)">4</text>
    <text x="390" y="114" filter="url(#rough2)">5</text>
  </g>

  <text x="64" y="141" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">「aa」起于 0</text>
  <rect x="171" y="127" width="78" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <text x="64" y="169" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">「aa」起于 1</text>
  <rect x="211" y="155" width="78" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <text x="64" y="197" font-size="10.5" fill="#b85450" filter="url(#rough2)">「b」起于 3/4/5</text>
  <rect x="291" y="183" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="331" y="183" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="371" y="183" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <path d="M 280 212 L 280 236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="256" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">并集：[0,1] ∪ [1,2] ∪ [3,3] ∪ [4,4] ∪ [5,5] = [0,5]</text>
  <text x="280" y="274" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">[0,2] 与 [3,5] 首尾相接（3 = 2+1），所以只留一对标签</text>

  <rect x="160" y="288" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="12.5" fill="#2f5a26" filter="url(#rough2)">&lt;b&gt;aaabbb&lt;/b&gt;</text>

  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">对照 s = "abcxyz123"：中间隔着 "xyz"，两段不相邻</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">&lt;b&gt;abc&lt;/b&gt;xyz&lt;b&gt;123&lt;/b&gt;</text>
</svg>
