<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n = 1,234,567</text>
  <path d="M 200 38 Q 320 46 440 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="70" y="56" width="500" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <line x1="180" y1="56" x2="180" y2="86" stroke="#4a8edb" stroke-width="1.2"/>
    <line x1="390" y1="56" x2="390" y2="86" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="125" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">槽位 j</text>
  <text x="285" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">阈值 10^(3j)</text>
  <text x="480" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">贡献 n − 10^(3j) + 1</text>

  <!-- row j=1 -->
  <g filter="url(#sk2)">
    <rect x="70" y="86" width="500" height="32" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <line x1="180" y1="86" x2="180" y2="118" stroke="#9db8cc" stroke-width="1"/>
    <line x1="390" y1="86" x2="390" y2="118" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <text x="125" y="107" text-anchor="middle" font-size="13" fill="#444">1</text>
  <text x="285" y="107" text-anchor="middle" font-size="13" fill="#444">1,000</text>
  <text x="480" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1,233,568</text>

  <!-- row j=2 -->
  <g filter="url(#sk2)">
    <rect x="70" y="118" width="500" height="32" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <line x1="180" y1="118" x2="180" y2="150" stroke="#9db8cc" stroke-width="1"/>
    <line x1="390" y1="118" x2="390" y2="150" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <text x="125" y="139" text-anchor="middle" font-size="13" fill="#444">2</text>
  <text x="285" y="139" text-anchor="middle" font-size="13" fill="#444">1,000,000</text>
  <text x="480" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">234,568</text>

  <!-- row j=3 -->
  <g filter="url(#sk2)">
    <rect x="70" y="150" width="500" height="32" fill="#f4f4f4" stroke="#9db8cc" stroke-width="1"/>
    <line x1="180" y1="150" x2="180" y2="182" stroke="#9db8cc" stroke-width="1"/>
    <line x1="390" y1="150" x2="390" y2="182" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <text x="125" y="171" text-anchor="middle" font-size="13" fill="#999">3</text>
  <text x="285" y="171" text-anchor="middle" font-size="13" fill="#999">1,000,000,000</text>
  <text x="480" y="171" text-anchor="middle" font-size="12.5" fill="#999">p &gt; n → 不计（0）</text>

  <!-- sum row -->
  <g filter="url(#sk)">
    <rect x="70" y="182" width="500" height="38" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <line x1="390" y1="182" x2="390" y2="220" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="285" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">合计：1,233,568 + 234,568 =</text>
  <text x="480" y="207" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">1,468,136</text>

  <!-- cross check -->
  <g filter="url(#sk)">
    <rect x="70" y="240" width="500" height="80" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">交叉验证（Q1 的位数分段视角）</text>
  <text x="320" y="285" text-anchor="middle" font-size="12.5" fill="#2e6e2e">4~6 位共 999,000 个 × 1 ＋ 7 位共 234,568 个 × 2</text>
  <text x="320" y="307" text-anchor="middle" font-size="12.5" fill="#2e6e2e">= 999,000 + 469,136 = 1,468,136 ✓ 与槽位法一致</text>

  <!-- n = 1002 note -->
  <g filter="url(#sk2)">
    <rect x="70" y="340" width="500" height="40" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="365" text-anchor="middle" font-size="12.5" fill="#2b6e9e">n = 1002（示例 1）：只有槽位 1 计入，1002 − 1000 + 1 = 3 ✓</text>
</svg>
