<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">进阶：枚举到 √n 成对取因子</text>
  <path d="M 130 44 Q 260 52 390 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- left panel: n = 6 -->
  <g filter="url(#rough2)">
    <rect x="30" y="62" width="225" height="190" rx="10" fill="#fdfdfd" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="142" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506e" filter="url(#rough2)">n = 6</text>

  <g filter="url(#rough2)">
    <rect x="42" y="132" width="66" height="40" rx="6" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5,4"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="60" cy="152" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="60" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <circle cx="96" cy="152" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="96" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)">
    <circle cx="132" cy="152" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="132" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)">
    <circle cx="168" cy="152" r="14" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="168" y="157" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)">
    <circle cx="204" cy="152" r="14" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="204" y="157" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)">
    <circle cx="240" cy="152" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="240" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">6</text>

  <path d="M 60 134 Q 150 92 238 134" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 96 134 Q 113 110 129 134" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="75" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d ≤ √6 ≈ 2.45</text>
  <text x="186" y="196" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">n/d 自动获得</text>
  <text x="142" y="230" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">命中 d=1↔6、d=2↔3，两对全部到手</text>

  <!-- right panel: n = 4 -->
  <g filter="url(#rough2)">
    <rect x="285" y="62" width="205" height="190" rx="10" fill="#fdfdfd" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="387" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">n = 4（完全平方数）</text>

  <g filter="url(#rough2)">
    <circle cx="320" cy="152" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="320" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <circle cx="360" cy="152" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="360" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)">
    <circle cx="400" cy="152" r="14" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="400" y="157" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)">
    <circle cx="440" cy="152" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="440" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">4</text>

  <path d="M 320 134 Q 380 96 438 134" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 353 132 C 345 106 379 106 371 130" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="360" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">d = n/d = 2 重合</text>
  <text x="387" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">重合时只加一次！</text>
  <text x="387" y="230" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否则 nums[1]² 会被计入两遍</text>

  <!-- insight box -->
  <g filter="url(#rough2)">
    <rect x="40" y="280" width="440" height="96" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="60" y="304" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">O(√n) 约数枚举范式（n 大时必备）</text>
  <text x="60" y="328" font-size="12" fill="#444" filter="url(#rough2)">for d = 1 .. ⌊√n⌋：若 n % d == 0，累加 nums[d−1]² 与 nums[n/d−1]²（d ≠ n/d 时）</text>
  <text x="60" y="352" font-size="11" fill="#777" filter="url(#rough2)">本题 n ≤ 50，O(n) 与 O(√n) 无差别；当 n ~ 10⁹ 时只能 O(√n)。</text>
</svg>
