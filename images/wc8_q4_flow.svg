<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：预处理跳表 → 逐行 O(1) 跳跃</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把「逐词试放」的一次性模拟，换成「只对 n 种行首状态各算一次」</text>

  <g filter="url(#rough2)">
    <rect x="70" y="62" width="420" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="280" y="86" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">前置检查：存在 len(word) &gt; cols ？是 → 直接返回 0（永远放不进去）</text>

    <path d="M 280 100 L 280 118" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="70" y="120" width="420" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="139" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">预处理：对每个 i ∈ [0, n) 求 jump[i]</text>
    <text x="280" y="155" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">行内用滚动列指针 used 贪心塞词，放不下就停</text>

    <path d="M 280 162 L 280 180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="70" y="182" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="280" y="204" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">cur = 0，T = 0（cur 为下一行行首，T 为已放单词总数）</text>

    <path d="M 280 216 L 280 234" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="70" y="236" width="420" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="280" y="256" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">重复 rows 次：</text>
    <text x="280" y="272" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">k = jump[cur]　→　T += k　→　cur = (cur + k) mod n</text>
    <text x="280" y="287" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每行至少放下 1 个词，故 k ≥ 1，模拟必然推进</text>

    <path d="M 280 294 L 280 312" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="130" y="314" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="280" y="338" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 T // n（完整句子的遍数）</text>
  </g>

  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">时间 = 预处理 O(n · W) + 模拟 O(rows)，W 为一行最多单词数（W ≤ (cols+1)/2）</text>
  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">空间 = O(n)，只需存 n 个跳跃长度</text>
  <text x="280" y="412" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">进阶：rows 到 10¹⁸ 时，利用函数图「至多 n 步进环」把模拟再压到 O(n)</text>
</svg>
