<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">只有两个空隙 g1 = b−a，g2 = c−b 决定答案</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">排序后 x &lt; y &lt; z，中间石子 y 永远不会被拿起</text>

  <path d="M 60 110 L 500 110" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="96" y="76" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="196" y="76" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="376" y="76" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="114" y="100" fill="#446688">x</text>
    <text x="214" y="100" fill="#4a7a3a">y</text>
    <text x="394" y="100" fill="#8a6a20">z</text>
  </g>

  <path d="M 132 128 L 196 128" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 232 128 L 376 128" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="164" y="148" text-anchor="middle" font-size="11" fill="#8a3a36">g1 = y − x</text>
  <text x="304" y="148" text-anchor="middle" font-size="11" fill="#8a3a36">g2 = z − y</text>

  <rect x="40" y="176" width="230" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="198" font-size="12" fill="#3a5a30" font-weight="bold">最小步数 min_moves</text>
  <text x="56" y="222" font-size="10.5" fill="#555">g1 = g2 = 1 → 0（已经连续）</text>
  <text x="56" y="246" font-size="10.5" fill="#555">min(g1, g2) ≤ 2 → 1（塞进空隙）</text>
  <text x="56" y="270" font-size="10.5" fill="#555">否则 → 2（先靠近，再补齐）</text>
  <text x="56" y="300" font-size="10.5" fill="#888">最多只需 2 步即可收尾</text>

  <rect x="290" y="176" width="230" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="306" y="198" font-size="12" fill="#8a6a20" font-weight="bold">最大步数 max_moves</text>
  <text x="306" y="224" font-size="11" fill="#555">内部空位数 = (z − x) − 2</text>
  <text x="306" y="248" font-size="10.5" fill="#888">每步恰好填掉一个内部空位</text>
  <text x="306" y="272" font-size="10.5" fill="#888">故一步都不能浪费 → 全填满</text>
  <text x="306" y="300" font-size="10.5" fill="#8a6a20">max = z − x − 2</text>

  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#999">空隙 = 两颗石子之间未被占据的整数位置个数；端点石子只能挪进空隙，故空隙是唯一的“燃料”</text>
</svg>
