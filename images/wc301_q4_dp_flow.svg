<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：对数层 DP + 组合数合成</text>

  <ellipse cx="270" cy="62" rx="122" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="67" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">预处理 fact / invFact（到 n-1，O(n)）</text>

  <path d="M 270,82 L 270,92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="96" width="240" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="114" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">K = floor(log₂ M) + 1；g[v] ← 1（k = 1 层）</text>
  <text x="270" y="131" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans ← 0；k ← 1</text>

  <path d="M 270,140 L 270,148" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,152 392,180 270,208 148,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="185" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">k ≤ min(n, K) ?</text>

  <path d="M 392,180 L 414,180" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="402" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <ellipse cx="474" cy="180" rx="58" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="474" y="185" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>

  <path d="M 270,208 L 270,218" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="281" y="217" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <polygon points="270,222 382,250 270,278 158,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">k &gt; 1 ?</text>
  <text x="270" y="263" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（需要递推新层）</text>

  <path d="M 158,250 L 136,250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="147" y="242" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <rect x="14" y="224" width="122" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="75" y="242" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">g ← 按倍数递推</text>
  <text x="75" y="257" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">u → 2u, 3u, …</text>
  <text x="75" y="271" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（从 2u 起 ⇒ 严格）</text>

  <path d="M 75,276 L 75,310 L 176,310" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 270,278 L 270,288" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="281" y="287" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <rect x="180" y="290" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">S ← Σ g[v]（当前层链总数）</text>

  <path d="M 270,330 L 270,342" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="346" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="371" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">ans += C(n-1, k-1) × S</text>

  <path d="M 270,386 L 270,398" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="222" y="402" width="96" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="424" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">k++</text>

  <path d="M 222,419 L 40,419 L 40,180 L 144,180" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="410" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下一层</text>

  <rect x="420" y="290" width="130" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="485" y="312" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">层数 ≤ 14</text>
  <text x="485" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每层 O(M ln M)</text>
  <text x="485" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">预处理 O(n)</text>
  <text x="485" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">总计约 10^6 次加乘</text>
</svg>
