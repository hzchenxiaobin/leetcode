<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：特殊下标 = n 的因子</text>
  <path d="M 140 44 Q 260 52 380 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- nums row -->
  <text x="66" y="120" font-size="13" fill="#666" filter="url(#rough2)">nums =</text>

  <g filter="url(#rough2)">
    <rect x="110" y="96" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="137" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)">
    <rect x="170" y="96" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="197" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)">
    <rect x="230" y="96" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="257" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="290" y="96" width="54" height="36" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="317" y="120" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">19</text>
  <g filter="url(#rough2)">
    <rect x="350" y="96" width="54" height="36" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="377" y="120" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">18</text>
  <g filter="url(#rough2)">
    <rect x="410" y="96" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="437" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">3</text>

  <!-- index labels -->
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="137" y="152" filter="url(#rough2)">i=1</text>
    <text x="197" y="152" filter="url(#rough2)">i=2</text>
    <text x="257" y="152" filter="url(#rough2)">i=3</text>
    <text x="317" y="152" filter="url(#rough2)">i=4</text>
    <text x="377" y="152" filter="url(#rough2)">i=5</text>
    <text x="437" y="152" filter="url(#rough2)">i=6</text>
  </g>

  <!-- n % i row -->
  <text x="66" y="178" font-size="12" fill="#666" filter="url(#rough2)">n % i</text>
  <g font-size="13" text-anchor="middle">
    <text x="137" y="178" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="197" y="178" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="257" y="178" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="317" y="178" fill="#b85450" filter="url(#rough2)">2</text>
    <text x="377" y="178" fill="#b85450" filter="url(#rough2)">1</text>
    <text x="437" y="178" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  </g>

  <!-- special marks -->
  <text x="66" y="202" font-size="12" fill="#666" filter="url(#rough2)">特殊?</text>
  <g font-size="13" text-anchor="middle">
    <text x="137" y="202" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="197" y="202" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="257" y="202" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="317" y="202" fill="#b85450" filter="url(#rough2)">✗</text>
    <text x="377" y="202" fill="#b85450" filter="url(#rough2)">✗</text>
    <text x="437" y="202" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  </g>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="60" y="220" width="400" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="249" text-anchor="middle" font-size="15" font-weight="bold" fill="#33506e" filter="url(#rough2)">n % i == 0 ⟺ i 是 n 的因子（i | n）</text>

  <!-- two mini boxes -->
  <g filter="url(#rough2)">
    <rect x="60" y="284" width="192" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="156" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2a" filter="url(#rough2)">恒特殊：i = 1 与 i = n</text>
  <text x="156" y="323" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（1 和 n 总能整除 n）</text>

  <g filter="url(#rough2)">
    <rect x="268" y="284" width="192" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="364" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">n 为质数：仅下标 1、n 特殊</text>
  <text x="364" y="323" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">如 n = 5 → 特殊下标 {1, 5}</text>

  <!-- insight -->
  <g filter="url(#rough2)">
    <rect x="60" y="348" width="400" height="40" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="260" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Q1 最短路径</text>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">判据 n % i == 0 → 因子 → 单循环筛选累加平方，签到题 1 分钟拿下</text>
</svg>
