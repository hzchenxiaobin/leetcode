<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="432" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">字母板：坐标用公式 O(1) 算出，第 5 行只到第 0 列</text>
  <text x="320" y="50" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">board = ["abcde", "fghij", "klmno", "pqrst", "uvwxy", "z"]　起点是 (0, 0) 的 'a'</text>

  <g font-size="9.5" fill="#999" filter="url(#rough2)">
    <text x="92" y="70" text-anchor="middle">c=0</text>
    <text x="136" y="70" text-anchor="middle">c=1</text>
    <text x="180" y="70" text-anchor="middle">c=2</text>
    <text x="224" y="70" text-anchor="middle">c=3</text>
    <text x="268" y="70" text-anchor="middle">c=4</text>
    <text x="64" y="99" text-anchor="end">r=0</text>
    <text x="64" y="131" text-anchor="end">r=1</text>
    <text x="64" y="163" text-anchor="end">r=2</text>
    <text x="64" y="195" text-anchor="end">r=3</text>
    <text x="64" y="227" text-anchor="end">r=4</text>
    <text x="64" y="259" text-anchor="end">r=5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="114" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="158" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="202" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="246" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="70" y="110" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="114" y="110" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="158" y="110" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="202" y="110" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="246" y="110" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="70" y="142" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="114" y="142" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="158" y="142" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="202" y="142" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="246" y="142" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="70" y="174" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="114" y="174" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="158" y="174" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="202" y="174" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="246" y="174" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="70" y="206" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="114" y="206" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="158" y="206" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="202" y="206" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="246" y="206" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="70" y="238" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="114" y="238" width="44" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <rect x="158" y="238" width="44" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <rect x="202" y="238" width="44" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <rect x="246" y="238" width="44" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
  </g>

  <g font-size="13" fill="#33445c" text-anchor="middle" filter="url(#rough2)">
    <text x="92" y="97">a</text><text x="136" y="97">b</text><text x="180" y="97">c</text><text x="224" y="97">d</text><text x="268" y="97">e</text>
    <text x="92" y="129">f</text><text x="136" y="129">g</text><text x="180" y="129">h</text><text x="224" y="129">i</text><text x="268" y="129">j</text>
    <text x="92" y="161">k</text><text x="136" y="161">l</text><text x="180" y="161">m</text><text x="224" y="161">n</text><text x="268" y="161">o</text>
    <text x="92" y="193">p</text><text x="136" y="193">q</text><text x="180" y="193">r</text><text x="224" y="193">s</text><text x="268" y="193">t</text>
    <text x="92" y="225">u</text><text x="136" y="225">v</text><text x="180" y="225">w</text><text x="224" y="225">x</text><text x="268" y="225">y</text>
  </g>
  <text x="92" y="257" font-size="13" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">z</text>
  <g font-size="11" fill="#c0c0c0" text-anchor="middle" filter="url(#rough2)">
    <text x="136" y="257">✗</text><text x="180" y="257">✗</text><text x="224" y="257">✗</text><text x="268" y="257">✗</text>
  </g>

  <text x="70" y="288" font-size="10.5" fill="#b85450" filter="url(#rough2)">第 5 行的 c = 1..4 不存在（虚线格），</text>
  <text x="70" y="304" font-size="10.5" fill="#b85450" filter="url(#rough2)">整行只有 (5, 0) 的 'z' 一格 ← 唯一陷阱</text>

  <rect x="306" y="66" width="310" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="322" y="86" font-size="11" fill="#33445c" font-weight="bold" filter="url(#rough2)">① 坐标公式（无需建表）</text>
  <text x="322" y="108" font-size="12" fill="#33445c" filter="url(#rough2)">r = ⌊(ch − 'a') / 5⌋</text>
  <text x="322" y="126" font-size="12" fill="#33445c" filter="url(#rough2)">c = (ch − 'a') mod 5</text>
  <text x="322" y="146" font-size="9.5" fill="#556" filter="url(#rough2)">'l' = 11 = 2×5+1 → (2, 1)</text>
  <text x="322" y="160" font-size="9.5" fill="#556" filter="url(#rough2)">'z' = 25 = 5×5+0 → (5, 0)</text>

  <rect x="306" y="180" width="310" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="322" y="200" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 每段的最少代价</text>
  <text x="322" y="220" font-size="10" fill="#3a5a30" filter="url(#rough2)">|Δr| + |Δc| 条移动指令 + 1 条 '!'</text>
  <text x="322" y="240" font-size="9.5" fill="#556" filter="url(#rough2)">板上没有真障碍，曼哈顿距离就是最短步数</text>

  <rect x="306" y="264" width="310" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="322" y="284" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">③ 只有顺序会踩空</text>
  <text x="322" y="305" font-size="10" fill="#8a3a36" filter="url(#rough2)">先 D 再 L 去 z：会落在 (5, c&gt;0) ✗</text>
  <text x="322" y="323" font-size="10" fill="#8a3a36" filter="url(#rough2)">在 z 上先 R：会落在 (5, 1) ✗</text>
  <text x="322" y="341" font-size="9.5" fill="#556" filter="url(#rough2)">→ 要找一个"对所有起终点都安全"的顺序</text>

  <text x="320" y="386" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">所以本题不是「找最短路径」，而是「给最短路径挑一个合法的方向顺序」</text>
  <text x="320" y="408" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">总行动次数 = Σ(|Δr| + |Δc|) + n，凡是单调路径都达到这个下界</text>
</svg>
