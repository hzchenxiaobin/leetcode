<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：前缀一致 ⟺ 前缀最大值追上步数</text>

  <!-- 第 4 步：一致 ✓ -->
  <text x="60" y="88" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 4 步后 ✓</text>
  <rect x="170" y="64" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="188" y="88" text-anchor="middle" font-size="14" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="206" y="64" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="224" y="88" text-anchor="middle" font-size="14" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="242" y="64" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="14" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="278" y="64" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="296" y="88" text-anchor="middle" font-size="14" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="314" y="64" width="36" height="36" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="88" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="188" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="224" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="260" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="296" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="332" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="368" y="80" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">S₄ = {3,2,4,1}</text>
  <text x="368" y="100" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">max = 4 = 步数 ✓</text>
  <text x="60" y="138" font-size="11" fill="#666" filter="url(#rough2)">4 个互异位置都 ≤ 4 ⟹ 恰好凑齐 {1,2,3,4}（抽屉原理）</text>

  <!-- 第 2 步：不一致 ✗ -->
  <text x="60" y="204" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">第 2 步后 ✗</text>
  <rect x="170" y="180" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="188" y="204" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="206" y="180" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="204" text-anchor="middle" font-size="14" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="242" y="180" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="14" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="278" y="180" width="36" height="36" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="296" y="204" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <rect x="314" y="180" width="36" height="36" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="204" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="368" y="196" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">S₂ = {3,2}</text>
  <text x="368" y="216" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">max = 3 &gt; 2 ✗</text>
  <text x="60" y="242" font-size="11" fill="#666" filter="url(#rough2)">max &gt; 步数 ⟹ 前缀内必有空洞（位置 3 已亮，位置 1 还没亮）</text>

  <!-- 抽屉原理框 -->
  <rect x="60" y="258" width="440" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">i 个互异正整数、最大值恰为 i ⟺ 集合就是 {1, …, i}</text>
  <text x="280" y="301" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">排列 ⟹ 每步翻不同位置 ⟹ |Sᵢ| = i，最大值一个数字就够</text>

  <!-- 底部结论框 -->
  <rect x="60" y="328" width="440" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">一趟遍历维护 curMax，curMax == i 即计数</text>
  <text x="280" y="371" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">无需字符串、无需集合 —— O(n) 时间 / O(1) 空间</text>
</svg>
