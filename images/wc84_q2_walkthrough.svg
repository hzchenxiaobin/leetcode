<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="77" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="81" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：索引 2 的 source 对不上</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="310.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">s = "abcd"，indices = [0,2]，sources = ["ab","ec"]，targets = ["eee","ffff"]</text>
  <g filter="url(#rough2)"><rect x="80" y="92" width="590" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="115.0" y="112.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">索引</text>
  <text x="200.0" y="112.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">source</text>
  <text x="305.0" y="112.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">原串对应片段</text>
  <text x="415.0" y="112.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">是否匹配</text>
  <text x="570.0" y="112.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">处理</text>
  <g filter="url(#rough2)"><rect x="80" y="122" width="590" height="30" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="115.0" y="143.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="200.0" y="143.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ab</text>
  <text x="305.0" y="143.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"ab"</text>
  <text x="415.0" y="143.0" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 匹配</text>
  <text x="570.0" y="143.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">写入 eee，cur = 2</text>
  <g filter="url(#rough2)"><rect x="80" y="152" width="590" height="30" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="115.0" y="173.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="200.0" y="173.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ec</text>
  <text x="305.0" y="173.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"cd"</text>
  <text x="415.0" y="173.0" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 不匹配</text>
  <text x="570.0" y="173.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">跳过，cur 仍 2</text>
  <text x="310" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">收尾：s[cur..n) = "cd" 直接追加</text>
  <path d="M 310 252 Q 310.0 264.0 310 276" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="170" y="278" width="280" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="310" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">eee + cd = "eeecd"</text>
  <g filter="url(#rough2)"><rect x="80" y="336" width="470" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="315.0" y="358" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">关键：比对用的是原串 s 的片段，不是被前一次替换改过的串</text>
  </svg>