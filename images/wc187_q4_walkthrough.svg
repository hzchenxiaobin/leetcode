<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：mat = [[1,3,11],[2,4,6]]，k = 5</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第 1 行：dp = [0] ⊕ [1,3,11] ⇒ dp = [1,3,11]；再与 [2,4,6] 归并取前 5</text>

  <text x="176" y="72" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">row = [2, 4, 6]</text>
  <text x="98" y="148" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">dp =</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="176" y="80" width="66" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="248" y="80" width="66" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="320" y="80" width="66" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="209" y="100" font-size="12" fill="#3a5a30">2</text>
    <text x="281" y="100" font-size="12" fill="#3a5a30">4</text>
    <text x="353" y="100" font-size="12" fill="#3a5a30">6</text>
    <text x="142" y="102" font-size="14" fill="#999">＋</text>

    <rect x="104" y="124" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="104" y="176" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="104" y="228" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="136" y="148" font-size="12" fill="#3a4a66">1</text>
    <text x="136" y="200" font-size="12" fill="#3a4a66">3</text>
    <text x="136" y="252" font-size="12" fill="#3a4a66">11</text>

    <rect x="176" y="124" width="66" height="38" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="248" y="124" width="66" height="38" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="320" y="124" width="66" height="38" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="176" y="176" width="66" height="38" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="248" y="176" width="66" height="38" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="320" y="176" width="66" height="38" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="176" y="228" width="66" height="38" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="248" y="228" width="66" height="38" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="320" y="228" width="66" height="38" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <text x="194" y="149" font-size="13" fill="#333">3</text>
    <text x="266" y="149" font-size="13" fill="#333">5</text>
    <text x="338" y="149" font-size="13" fill="#333">7</text>
    <text x="194" y="201" font-size="13" fill="#333">5</text>
    <text x="266" y="201" font-size="13" fill="#333">7</text>
    <text x="338" y="201" font-size="13" fill="#333">9</text>
    <text x="194" y="253" font-size="13" fill="#333">13</text>
    <text x="266" y="253" font-size="13" fill="#333">15</text>
    <text x="338" y="253" font-size="13" fill="#333">17</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="386" y="98" width="168" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6"/>
    <text x="400" y="114" font-size="9.5" fill="#8a3a36">圆圈 = 第几次弹出堆顶</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="228" cy="137" r="8.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="228" y="140" text-anchor="middle" font-size="9.5" fill="#8a3a36">1</text>
    <circle cx="300" cy="137" r="8.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="300" y="140" text-anchor="middle" font-size="9.5" fill="#8a3a36">2</text>
    <circle cx="228" cy="189" r="8.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="228" y="192" text-anchor="middle" font-size="9.5" fill="#8a3a36">3</text>
    <circle cx="372" cy="137" r="8.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="372" y="140" text-anchor="middle" font-size="9.5" fill="#8a3a36">4</text>
    <circle cx="300" cy="189" r="8.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="300" y="192" text-anchor="middle" font-size="9.5" fill="#8a3a36">5</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#b85450">
    <text x="386" y="146">弹出顺序：3 → 5 → 5 → 7 → 7</text>
    <text x="386" y="166" fill="#8a3a36">第 5 个弹出的和就是答案</text>
    <text x="386" y="186" fill="#555">同值 5、7 各有 2 种组合，</text>
    <text x="386" y="202" fill="#555">按重数依次计数</text>
  </g>

  <rect x="88" y="290" width="384" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">dp 截断为前 5 小 = [3, 5, 5, 7, 7] ⇒ 答案 7</text>

  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">对应数组 [1,2]、[1,4]、[3,2]、[3,4]、[1,6]，第 5 小的和是 7</text>
  <text x="280" y="368" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">堆中只放「右邻居」与「下邻居」，弹出多少就补多少，不会漏也不会重</text>
</svg>
