<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">远离判定：arr2 排序后，只需检查 [x−d, x+d] 内有没有元素</text>

  <!-- 数轴 -->
  <g filter="url(#rough2)">
    <line x1="50" y1="140" x2="520" y2="140" stroke="#446688" stroke-width="2.2"/>
  </g>
  <!-- 窗口 [x-d, x+d] -->
  <g filter="url(#rough2)">
    <rect x="220" y="112" width="150" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
  </g>
  <text x="295" y="102" text-anchor="middle" font-size="12.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">窗口 [x−d, x+d]</text>
  <!-- x 位置 -->
  <g filter="url(#rough2)">
    <line x1="295" y1="126" x2="295" y2="176" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
  <text x="295" y="192" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">arr1[i] = x</text>

  <!-- arr2 元素 -->
  <g filter="url(#rough2)">
    <circle cx="90" cy="140" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="170" cy="140" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="260" cy="140" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="330" cy="140" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="450" cy="140" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="90" y="165">排好序的 arr2</text>
    <text x="260" y="120" font-weight="bold" fill="#b85450">窗口内!</text>
  </g>

  <!-- 二分动作 -->
  <g filter="url(#rough2)">
    <rect x="36" y="222" width="240" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22">
    <text x="156" y="244" text-anchor="middle" font-weight="bold">lower_bound(arr2, x − d)</text>
    <text x="156" y="264" text-anchor="middle">找第一个 ≥ x−d 的位置 j</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="300" y="222" width="240" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22">
    <text x="420" y="244" text-anchor="middle" font-weight="bold">检查 arr2[j] &gt; x + d ?</text>
    <text x="420" y="264" text-anchor="middle">是 → 窗口为空 → x 是远离元素</text>
  </g>
  <path d="M 276 248 L 296 248" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="292" width="504" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="288" y="315" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">排序后窗口内元素必连续，故「第一个 ≥ x−d 的元素」一旦 &gt; x+d，窗口内就没有任何元素</text>
</svg>
