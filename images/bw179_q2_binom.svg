<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="404" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">组合数演算：n = 3、pos = 2、k = 1 → 答案 4</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">a = 2（左侧两人），b = 0（右侧无人），逐项枚举 i</text>
  <rect x="36" y="62" width="488" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="82" text-anchor="start" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">参数</text>
  <text x="48" y="100" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">a = pos = 2，b = n − 1 − pos = 0，需要看到 k = 1 人</text>
  <text x="70" y="122" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="170" y="122" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">C(a, i)</text>
  <text x="290" y="122" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">C(b, k−i)</text>
  <text x="410" y="122" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">乘积</text>
  <text x="500" y="122" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">说明</text>
  <rect x="48" y="134" width="472" height="38" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="70" y="158" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="170" y="158" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">C(2,0) = 1</text>
  <text x="290" y="158" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">C(0,1) = 0</text>
  <text x="410" y="158" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="500" y="158" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">右侧不够人</text>
  <rect x="48" y="178" width="472" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="70" y="202" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="170" y="202" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">C(2,1) = 2</text>
  <text x="290" y="202" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">C(0,0) = 1</text>
  <text x="410" y="202" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="500" y="202" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">左侧出 1 人 ✓</text>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">Σ = 0 + 2 = 2</text>
  <rect x="36" y="244" width="488" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="264" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">别忘了 pos 本人的 2 种方向</text>
  <text x="48" y="282" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">pos 选 L 或 R 都不改变别人的可见性，也不影响自己被谁看到</text>
  <text x="48" y="300" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">所以答案 = Σ × 2 = 2 × 2 = 4</text>
  <rect x="36" y="312" width="488" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="332" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">组合数怎么快算</text>
  <text x="48" y="349" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">n ≤ 10^5：预处理阶乘 fact[] 与逆阶乘 inv_fact[]，C(n,k) = fact[n]·inv_fact[k]·inv_fact[n−k]</text>
  <text x="48" y="366" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">答案对 10^9+7 取模，求逆用费马小定理</text>
  <text x="280" y="386" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">示例 1（n=3, pos=1, k=0）：a=1,b=1，i=0 项 C(1,0)C(1,0)=1 → 答案 2</text>
</svg>
