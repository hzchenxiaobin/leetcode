<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="95"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">双哈希设计：下标 → 数字，数字 → 下标有序集合</text>

  <!-- idx2num -->
  <g filter="url(#rough2)">
    <rect x="56" y="64" width="180" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="146" y="90" text-anchor="middle" font-size="14" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">idx2num（哈希表）</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="100" y="118">1 → 20</text>
    <text x="100" y="140">2 → 10</text>
    <text x="100" y="162">3 → 10</text>
    <text x="100" y="184">5 → 10</text>
  </g>
  <text x="228" y="118" font-size="12" fill="#b85450" filter="url(#rough2)">← change 直接覆盖</text>

  <!-- num2idx -->
  <g filter="url(#rough2)">
    <rect x="324" y="64" width="196" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="422" y="90" text-anchor="middle" font-size="14" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">num2idx（数字 → 有序集合）</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="412" y="118">10 → {2, 3, 5}</text>
    <text x="412" y="140">20 → {1}</text>
  </g>
  <text x="422" y="172" font-size="12" fill="#4a7a3a" filter="url(#rough2)">find(10) 取集合首元素</text>
  <text x="422" y="190" font-size="12" fill="#4a7a3a" filter="url(#rough2)">= 最小下标 2</text>

  <!-- change 流程 -->
  <g filter="url(#rough2)">
    <rect x="120" y="252" width="320" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="277" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">change(index, number) 的两步维护</text>
  <path d="M 146 290 L 146 316" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="318" width="200" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="160" y="341" text-anchor="middle" font-size="12.5" fill="#7a2f2b" filter="url(#rough2)">① 若 index 原有旧数字 old：</text>
  <text x="160" y="360" text-anchor="middle" font-size="12.5" fill="#7a2f2b" filter="url(#rough2)">从 num2idx[old] 删掉 index</text>
  <path d="M 414 290 L 414 316" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="300" y="318" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="400" y="341" text-anchor="middle" font-size="12.5" fill="#1d3a17" filter="url(#rough2)">② idx2num[index] = number；</text>
  <text x="400" y="360" text-anchor="middle" font-size="12.5" fill="#1d3a17" filter="url(#rough2)">num2idx[number] 插入 index</text>
  <path d="M 236 346 L 296 346" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- 双向箭头连接两个结构 -->
  <path d="M 236 139 L 322 139" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="279" y="130" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">同一份数据的两种索引</text>
</svg>
