<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="55"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：以 right 结尾的合法子数组就是一个后缀区间</text>
  <text x="360" y="58" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">nums = [10, 5, 2, 6]，k = 100，此刻 right = 3</text>

  <rect x="190" y="86" width="232" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <rect x="120" y="96" width="68" height="60" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="5 4" rx="5" filter="url(#rough2)"/>
  <rect x="196" y="96" width="68" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <rect x="272" y="96" width="68" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <rect x="348" y="96" width="68" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>

  <text x="154" y="134" text-anchor="middle" font-size="20" fill="#9a9a9a" filter="url(#rough2)">10</text>
  <text x="230" y="134" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">5</text>
  <text x="306" y="134" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">2</text>
  <text x="382" y="134" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">6</text>

  <text x="154" y="78" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="230" y="78" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="306" y="78" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="382" y="78" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>

  <path d="M 128 106 L 180 146" stroke="#b85450" stroke-width="2.4" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 180 106 L 128 146" stroke="#b85450" stroke-width="2.4" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <text x="154" y="171" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">已移出窗口</text>
  <text x="306" y="171" text-anchor="middle" font-size="11.5" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">乘积 5 × 2 × 6 = 60 &lt; 100</text>

  <path d="M 230 184 L 230 192 L 382 192 L 382 184" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="306" y="212" text-anchor="middle" font-size="12" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">合法起点 left=1, 2, 3，共 right − left + 1 = 3 个</text>

  <rect x="60" y="232" width="600" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="258" text-anchor="middle" font-size="12.5" fill="#8a6415" filter="url(#rough2)">右端固定为 right 时，起点 x 越小乘积越大：x = left 已合法，x = left − 1 必然 ≥ k。</text>
  <text x="360" y="282" text-anchor="middle" font-size="12.5" fill="#8a6415" filter="url(#rough2)">合法的起点恰好是连续一段 [left, right]，所以「个数」无需枚举，直接算长度：</text>
  <text x="360" y="300" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">新增 = right − left + 1</text>

  <rect x="60" y="322" width="600" height="76" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="348" text-anchor="middle" font-size="12.5" fill="#2e4f70" filter="url(#rough2)">累加四个右端点的新增数：1 + 2 + 2 + 3 = 8，正是全部 8 个合法子数组。</text>
  <text x="360" y="372" text-anchor="middle" font-size="12.5" fill="#2e4f70" filter="url(#rough2)">每个子数组都被它唯一的右端点统计一次，不重不漏。</text>
</svg>
