<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="540" height="340" fill="#fafafa"/>
  <text x="270" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：s = &quot;abcacbd&quot;（n=7）</text>

  <g filter="url(#r)" font-size="11" font-family="monospace">
    <text x="24" y="62" fill="#446688" font-weight="bold">i</text>
    <text x="64" y="62" fill="#446688" font-weight="bold">s[i]</text>
    <text x="150" y="62" fill="#446688" font-weight="bold">s[n-1-i]</text>
    <text x="280" y="62" fill="#446688" font-weight="bold">下标对</text>
    <text x="410" y="62" fill="#446688" font-weight="bold">是否相等</text>

    <text x="24" y="88" fill="#333">0</text><text x="64" y="88" fill="#b85450" font-weight="bold">a</text><text x="150" y="88" fill="#b85450" font-weight="bold">d</text><text x="280" y="88" fill="#333">(0, 6)</text><text x="410" y="88" fill="#b03a3a" font-weight="bold">✗</text>
    <text x="24" y="114" fill="#333">1</text><text x="64" y="114" fill="#2e6e2e" font-weight="bold">b</text><text x="150" y="114" fill="#2e6e2e" font-weight="bold">b</text><text x="280" y="114" fill="#333">(1, 5)</text><text x="410" y="114" fill="#2e6e2e" font-weight="bold">✓ 返回 1</text>
  </g>

  <rect x="20" y="132" width="500" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#r)"/>
  <text x="35" y="157" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#r)">最小下标 i=1，后续无需再查 → 答案 1</text>

  <text x="270" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">另外两个关键情形</text>

  <rect x="20" y="214" width="242" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r)"/>
  <text x="141" y="238" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#r)">s = &quot;abc&quot;（奇数长度）</text>
  <text x="141" y="260" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">i=0: a vs c ✗</text>
  <text x="141" y="280" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">i=1: 中点 b vs b ✓（i==n-1-i）</text>
  <text x="141" y="302" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#r)">答案 1（中点必自匹配）</text>

  <rect x="278" y="214" width="242" height="104" rx="10" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4" filter="url(#r)"/>
  <text x="399" y="238" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold" filter="url(#r)">s = &quot;abcdab&quot;（偶数长度）</text>
  <text x="399" y="260" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">(0,5)a≠b (1,4)b≠a (2,3)c≠d</text>
  <text x="399" y="280" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">所有对称对都不相等</text>
  <text x="399" y="302" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold" filter="url(#r)">返回 -1</text>
</svg>
