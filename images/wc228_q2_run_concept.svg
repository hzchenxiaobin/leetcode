<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：同质子串不跨边界，长 k 游程贡献 k(k+1)/2</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 上框：观察 1 -->
  <g filter="url(#sk)">
    <rect x="30" y="54" width="580" height="196" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04348">观察 1：子串一旦跨过「字符变化的边界」，必含两种字符 ⇒ 非同质</text>

  <!-- 字符格 a b b c c c a a -->
  <g filter="url(#sk)" font-size="15">
    <rect x="129" y="92" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="177" y="92" width="46" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="225" y="92" width="46" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="273" y="92" width="46" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
    <rect x="321" y="92" width="46" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
    <rect x="369" y="92" width="46" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
    <rect x="417" y="92" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="465" y="92" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <text x="152" y="113" text-anchor="middle" fill="#2b6e9e">a</text>
    <text x="200" y="113" text-anchor="middle" fill="#2e6e2e">b</text>
    <text x="248" y="113" text-anchor="middle" fill="#2e6e2e">b</text>
    <text x="296" y="113" text-anchor="middle" fill="#7a5415">c</text>
    <text x="344" y="113" text-anchor="middle" fill="#7a5415">c</text>
    <text x="392" y="113" text-anchor="middle" fill="#7a5415">c</text>
    <text x="440" y="113" text-anchor="middle" fill="#2b6e9e">a</text>
    <text x="488" y="113" text-anchor="middle" fill="#2b6e9e">a</text>
  </g>

  <!-- 游程边界红线 -->
  <g filter="url(#sk)" stroke="#b85450" stroke-width="2.5">
    <path d="M 176 84 L 176 132" fill="none"/>
    <path d="M 272 84 L 272 132" fill="none"/>
    <path d="M 416 84 L 416 132" fill="none"/>
  </g>
  <g font-size="11" fill="#b85450">
    <text x="176" y="80" text-anchor="middle">≠</text>
    <text x="272" y="80" text-anchor="middle">≠</text>
    <text x="416" y="80" text-anchor="middle">≠</text>
  </g>

  <!-- 跨边界反例虚线圈 -->
  <g filter="url(#sk)">
    <rect x="172" y="86" width="200" height="44" rx="8" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/>
  </g>
  <text x="320" y="148" text-anchor="middle" font-size="12" fill="#a04348">虚线圈住的「bbcc」跨过 b→c 边界，含两种字符 ⇒ 非同质，永不可能被计入</text>

  <!-- 游程下括弧 -->
  <g filter="url(#sk)" fill="none" stroke-width="2">
    <path d="M 131 170 L 131 164 L 173 164 L 173 170" stroke="#4a8edb"/>
    <path d="M 179 170 L 179 164 L 269 164 L 269 170" stroke="#4a8e4a"/>
    <path d="M 275 170 L 275 164 L 413 164 L 413 170" stroke="#c98a2b"/>
    <path d="M 419 170 L 419 164 L 509 164 L 509 170" stroke="#4a8edb"/>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold">
    <text x="152" y="188" text-anchor="middle" fill="#2b6e9e">k=1 · 贡献 1</text>
    <text x="224" y="188" text-anchor="middle" fill="#2e6e2e">k=2 · 贡献 3</text>
    <text x="344" y="188" text-anchor="middle" fill="#7a5415">k=3 · 贡献 6</text>
    <text x="464" y="188" text-anchor="middle" fill="#2b6e9e">k=2 · 贡献 3</text>
  </g>

  <!-- 右侧合计小盒 -->
  <g filter="url(#sk)">
    <rect x="520" y="156" width="84" height="56" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="562" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04348">本题合计</text>
  <text x="562" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04348">1+3+6+3=13 ✓</text>

  <text x="320" y="232" text-anchor="middle" font-size="11.5" fill="#555">游程（run）= 极长同字符段；每个同质子串完整落在唯一游程内 ⇒ 按游程分类不重不漏</text>

  <!-- 下探箭头 -->
  <path d="M 320 250 L 320 268" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 下框：观察 2 -->
  <g filter="url(#sk)">
    <rect x="30" y="272" width="580" height="164" rx="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">观察 2：按右端点分类——以第 i 位结尾的同质子串恰有 i 个（以 ccc 为例）</text>

  <!-- ccc 三格 -->
  <g filter="url(#sk)" font-size="14">
    <rect x="90" y="308" width="44" height="28" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
    <rect x="136" y="308" width="44" height="28" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
    <rect x="182" y="308" width="44" height="28" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
    <text x="112" y="327" text-anchor="middle" fill="#7a5415">c</text>
    <text x="158" y="327" text-anchor="middle" fill="#7a5415">c</text>
    <text x="204" y="327" text-anchor="middle" fill="#7a5415">c</text>
  </g>

  <!-- 以各位结尾的子串堆叠 -->
  <g filter="url(#sk)" font-size="11" fill="#2b6e9e">
    <rect x="92" y="346" width="40" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="112" y="361" text-anchor="middle">"c"</text>
    <rect x="138" y="346" width="40" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="158" y="361" text-anchor="middle">"c"</text>
    <rect x="138" y="372" width="40" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="158" y="387" text-anchor="middle">"cc"</text>
    <rect x="184" y="346" width="40" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="204" y="361" text-anchor="middle">"c"</text>
    <rect x="184" y="372" width="40" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="204" y="387" text-anchor="middle">"cc"</text>
    <rect x="184" y="398" width="40" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="204" y="413" text-anchor="middle">"ccc"</text>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" fill="#a04348">
    <text x="243" y="360" text-anchor="middle">1 个</text>
    <text x="243" y="387" text-anchor="middle">2 个</text>
    <text x="243" y="414" text-anchor="middle">3 个</text>
  </g>

  <!-- 右侧公式推导 -->
  <text x="445" y="330" text-anchor="middle" font-size="12" fill="#333">以第 i 位结尾 ⇒ 左端点可取段内前 i 个位置</text>
  <text x="445" y="352" text-anchor="middle" font-size="12" fill="#333">⇒ 该位恰贡献 i 个同质子串</text>
  <text x="445" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">总数 = 1 + 2 + 3 = 6 = k(k+1)/2</text>
  <text x="445" y="408" text-anchor="middle" font-size="11.5" fill="#7a5415">对任意 k：1+2+…+k = k(k+1)/2（等差数列求和）</text>

  <!-- 底部橙条 -->
  <g filter="url(#sk)">
    <rect x="30" y="446" width="580" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="466" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">ans = Σ k(k+1)/2（逐游程求和，mod 1e9+7）：本题 1+3+6+3 = 13 ✓</text>
  <text x="320" y="484" text-anchor="middle" font-size="12" fill="#7a5415">不必显式切分游程——一趟增量扫描即可完成求和（见下图）</text>
</svg>
