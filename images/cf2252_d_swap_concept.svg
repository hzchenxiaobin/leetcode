<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="680" height="436" fill="#fafafa"/>
  <text x="340" y="32" font-size="18" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">核心观察：一次操作 = 同奇偶相邻差分的交换</text>
  <rect x="24" y="56" width="316" height="214" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="82" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">① 选 i，要求 a(i−1) 与 a(i+1) 同奇偶</text>
  <text x="40" y="106" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">② 记差分 s(j) = a(j+1) − a(j)</text>
  <text x="40" y="132" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">③ a(i)′ = a(i−1) − a(i) + a(i+1)</text>
  <text x="40" y="156" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">    ⇒ s(i−1)′ = s(i)，s(i)′ = s(i−1)</text>
  <text x="40" y="182" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">④ 合法 ⟺ s(i−1) + s(i) 为偶数</text>
  <text x="40" y="206" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">    ⟺ s(i−1) 与 s(i) 同奇偶</text>
  <text x="40" y="236" font-size="12.5" fill="#b85450" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">    也就是：恰好交换相邻两个差分</text>
  <rect x="352" y="56" width="304" height="214" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="82" font-size="12.5" fill="#4a7a3a" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">推论 1：差分的奇偶模式不变</text>
  <text x="368" y="108" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">⇒ 极大同奇偶段的位置固定</text>
  <text x="368" y="142" font-size="12.5" fill="#4a7a3a" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">推论 2：奇偶不同的相邻差分</text>
  <text x="368" y="168" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">永远无法交换 ⇒ 段内元素出不去</text>
  <text x="368" y="194" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">段外元素进不来</text>
  <text x="368" y="228" font-size="12.5" fill="#b85450" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">⇒ 每个段彼此独立，段内任意排列</text>
  <text x="340" y="300" font-size="13.5" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">样例数组 a 的差分条：竖线就是隔离墙</text>
  <rect x="36" y="318" width="56" height="38" rx="5" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="64.0" y="334" font-size="11" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">8</text>
  <text x="64.0" y="350" font-size="10" fill="#446688" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">偶</text>
  <rect x="100" y="318" width="56" height="38" rx="5" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="128.0" y="334" font-size="11" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">6</text>
  <text x="128.0" y="350" font-size="10" fill="#446688" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">偶</text>
  <rect x="164" y="318" width="56" height="38" rx="5" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="192.0" y="334" font-size="11" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">4</text>
  <text x="192.0" y="350" font-size="10" fill="#446688" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">偶</text>
  <rect x="228" y="318" width="56" height="38" rx="5" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="256.0" y="334" font-size="11" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">2</text>
  <text x="256.0" y="350" font-size="10" fill="#446688" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">偶</text>
  <rect x="292" y="318" width="56" height="38" rx="5" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="320.0" y="334" font-size="11" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">-115</text>
  <text x="320.0" y="350" font-size="10" fill="#b85450" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">奇</text>
  <rect x="356" y="318" width="56" height="38" rx="5" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="384.0" y="334" font-size="11" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">2</text>
  <text x="384.0" y="350" font-size="10" fill="#446688" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">偶</text>
  <rect x="420" y="318" width="56" height="38" rx="5" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="448.0" y="334" font-size="11" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">12</text>
  <text x="448.0" y="350" font-size="10" fill="#446688" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">偶</text>
  <rect x="484" y="318" width="56" height="38" rx="5" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="512.0" y="334" font-size="11" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">-6</text>
  <text x="512.0" y="350" font-size="10" fill="#446688" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">偶</text>
  <rect x="548" y="318" width="56" height="38" rx="5" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="576.0" y="334" font-size="11" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">-2</text>
  <text x="576.0" y="350" font-size="10" fill="#446688" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">偶</text>
  <polyline points="36,376 36,366 284,366 284,376" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160.0" y="396" font-size="12" fill="#446688" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">段 1：内部升序重排</text>
  <polyline points="356,376 356,366 604,366 604,376" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480.0" y="396" font-size="12" fill="#446688" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">段 2：内部升序重排</text>
  <text x="320.0" y="396" font-size="11" fill="#b85450" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">孤立的奇数差分</text>
  <text x="320.0" y="412" font-size="11" fill="#b85450" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">位置钉死</text>
</svg>
