<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">示例演算：mat = [[1,1],[9,9],[1,1]]，质数频次 19×8 领先</text>
  <path d="M 200 42 Q 360 50 520 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== left: grid ===== -->
  <text x="93" y="62" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="139" y="62" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="58" y="94" text-anchor="end" font-size="10" fill="#999">0</text>
  <text x="58" y="134" text-anchor="end" font-size="10" fill="#999">1</text>
  <text x="58" y="174" text-anchor="end" font-size="10" fill="#999">2</text>

  <g filter="url(#rough2)">
    <rect x="70" y="70" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="116" y="70" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="70" y="110" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="116" y="110" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="70" y="150" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="116" y="150" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="93" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">1</text>
  <text x="139" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">1</text>
  <text x="93" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">9</text>
  <text x="139" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">9</text>
  <text x="93" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">1</text>
  <text x="139" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">1</text>

  <g filter="url(#rough2)">
    <path d="M 168 110 L 194 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <text x="116" y="222" text-anchor="middle" font-size="11" fill="#666">3 行 × 2 列，值域 1~9</text>
  <text x="116" y="240" text-anchor="middle" font-size="11" fill="#666">6 个起点 × 8 个方向</text>

  <!-- ===== right: per-start table ===== -->
  <g filter="url(#rough2)">
    <rect x="200" y="60" width="72" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="272" y="60" width="418" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="236" y="78" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">起点</text>
  <text x="481" y="78" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">生成数（&gt; 10 的前缀数）</text>

  <!-- rows -->
  <g filter="url(#rough2)">
    <rect x="200" y="86" width="72" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="272" y="86" width="418" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="236" y="105" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">(0,0)</text>
  <text x="284" y="105" font-size="12.5" fill="#2e5b22" font-weight="bold">11,  19,  19,  191</text>

  <g filter="url(#rough2)">
    <rect x="200" y="114" width="72" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="272" y="114" width="418" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="236" y="133" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">(0,1)</text>
  <text x="284" y="133" font-size="12.5" fill="#2e5b22" font-weight="bold">19,  191,  19,  11</text>

  <g filter="url(#rough2)">
    <rect x="200" y="142" width="72" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="272" y="142" width="418" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="236" y="161" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">(1,0)</text>
  <text x="284" y="161" font-size="12.5" fill="#8a3a36" font-weight="bold">99,  91,  91,  91,  91</text>

  <g filter="url(#rough2)">
    <rect x="200" y="170" width="72" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="272" y="170" width="418" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="236" y="189" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">(1,1)</text>
  <text x="284" y="189" font-size="12.5" fill="#8a3a36" font-weight="bold">91,  91,  99,  91,  91</text>

  <g filter="url(#rough2)">
    <rect x="200" y="198" width="72" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="272" y="198" width="418" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="236" y="217" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">(2,0)</text>
  <text x="284" y="217" font-size="12.5" fill="#2e5b22" font-weight="bold">11,  19,  191,  19</text>

  <g filter="url(#rough2)">
    <rect x="200" y="226" width="72" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="272" y="226" width="418" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="236" y="245" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">(2,1)</text>
  <text x="284" y="245" font-size="12.5" fill="#2e5b22" font-weight="bold">11,  19,  19,  191</text>

  <text x="200" y="272" font-size="11" fill="#555">绿色行：全部为质数入账；红色行：99 = 9×11、91 = 7×13，全部出局</text>

  <!-- ===== tally ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="292" width="600" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="316" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">质数账本：19 × 8、191 × 4、11 × 4；合数拦截：99 × 2、91 × 8</text>
  <text x="360" y="340" text-anchor="middle" font-size="11.5" fill="#7a5415">19 的 8 次 = 8 个『先 1 后 9』的有向相邻对；反向拼出的 91 = 7×13 不计</text>
  <text x="360" y="366" text-anchor="middle" font-size="15" fill="#2e5b22" font-weight="bold">频次最高且唯一 ⇒ 返回 19 ✓</text>

  <!-- ===== bottom note ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="398" width="600" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="360" y="418" text-anchor="middle" font-size="11.5" fill="#2b4a66">合计生成 26 个 &gt; 10 的数：质数 16 个（19×8 + 191×4 + 11×4）+ 合数 10 个</text>
  <text x="360" y="436" text-anchor="middle" font-size="11.5" fill="#2b4a66">示例 3 检验并列规则：97、79、47、67 各 1 次 ⇒ 返回最大的 97</text>
</svg>
