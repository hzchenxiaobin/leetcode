<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="530" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">两遍单调栈（以 nums = [3, 1, 3, 2] 为例），栈中元素记「值₍下标₎」</text>
  <path d="M 120 38 Q 320 46 520 38" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="20" y="48" width="600" height="204" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">左扫（k: 0 → 3）：弹「真子掩码」，栈顶 = L[k]（最近的左侧阻断者）</text>
  <text x="320" y="86" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">阻断 = 非子掩码（⊄）或 相等（==）；弹栈条件 = 真子掩码（⊆ 且 ≠）</text>

  <text x="95" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">k=0 · 3</text>
  <g filter="url(#rough2)">
    <rect x="69" y="116" width="52" height="20" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="95" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3<tspan font-size="9" font-weight="normal" dy="3">0</tspan></text>
  <text x="95" y="158" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">栈空，直接入栈</text>
  <g filter="url(#rough2)">
    <rect x="65" y="212" width="60" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="95" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">L = −1</text>

  <text x="245" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">k=1 · 1</text>
  <g filter="url(#rough2)">
    <rect x="219" y="116" width="52" height="20" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="219" y="140" width="52" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="245" y="130" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3<tspan font-size="9" dy="3">0</tspan></text>
  <text x="245" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1<tspan font-size="9" font-weight="normal" dy="3">1</tspan></text>
  <text x="245" y="182" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3 ⊄ 1，不弹</text>
  <g filter="url(#rough2)">
    <rect x="215" y="212" width="60" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="245" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">L = 0</text>

  <text x="395" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">k=2 · 3</text>
  <g filter="url(#rough2)">
    <rect x="369" y="116" width="52" height="20" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="369" y="140" width="52" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="395" y="130" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3<tspan font-size="9" dy="3">0</tspan></text>
  <text x="395" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">3<tspan font-size="9" font-weight="normal" dy="3">2</tspan></text>
  <text x="395" y="176" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">弹 1₁（1 ⊂ 3 真子掩码）</text>
  <text x="395" y="191" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3₀ = 3 相等 → 阻断</text>
  <g filter="url(#rough2)">
    <rect x="365" y="212" width="60" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="395" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">L = 0</text>

  <text x="545" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">k=3 · 2</text>
  <g filter="url(#rough2)">
    <rect x="519" y="116" width="52" height="20" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="519" y="140" width="52" height="20" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="519" y="164" width="52" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="545" y="130" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3<tspan font-size="9" dy="3">0</tspan></text>
  <text x="545" y="154" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3<tspan font-size="9" dy="3">2</tspan></text>
  <text x="545" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2<tspan font-size="9" font-weight="normal" dy="3">3</tspan></text>
  <text x="545" y="206" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3 ⊄ 2，不弹</text>
  <g filter="url(#rough2)">
    <rect x="515" y="212" width="60" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="545" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">L = 2</text>

  <g filter="url(#rough2)">
    <rect x="20" y="264" width="600" height="204" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">右扫（k: 3 → 0）：弹「子掩码」（含相等），栈顶 = R[k]（最近的右侧阻断者）</text>
  <text x="320" y="302" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">阻断 = 仅非子掩码（⊄）；相等是子掩码，不阻断、照弹</text>

  <text x="95" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">k=3 · 2</text>
  <g filter="url(#rough2)">
    <rect x="69" y="332" width="52" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="95" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2<tspan font-size="9" font-weight="normal" dy="3">3</tspan></text>
  <text x="95" y="374" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">栈空，直接入栈</text>
  <g filter="url(#rough2)">
    <rect x="65" y="428" width="60" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="95" y="444" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">R = 4</text>

  <text x="245" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">k=2 · 3</text>
  <g filter="url(#rough2)">
    <rect x="219" y="332" width="52" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="245" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3<tspan font-size="9" font-weight="normal" dy="3">2</tspan></text>
  <text x="245" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">弹 2₃（2 ⊆ 3）</text>
  <text x="245" y="390" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">栈弹空</text>
  <g filter="url(#rough2)">
    <rect x="215" y="428" width="60" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="245" y="444" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">R = 4</text>

  <text x="395" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">k=1 · 1</text>
  <g filter="url(#rough2)">
    <rect x="369" y="332" width="52" height="20" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="369" y="356" width="52" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="395" y="346" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3<tspan font-size="9" dy="3">2</tspan></text>
  <text x="395" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1<tspan font-size="9" font-weight="normal" dy="3">1</tspan></text>
  <text x="395" y="398" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3 ⊄ 1，不弹</text>
  <g filter="url(#rough2)">
    <rect x="365" y="428" width="60" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="395" y="444" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">R = 2</text>

  <text x="545" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">k=0 · 3</text>
  <g filter="url(#rough2)">
    <rect x="519" y="332" width="52" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="545" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3<tspan font-size="9" font-weight="normal" dy="3">0</tspan></text>
  <text x="545" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">弹 1₁、弹 3₂</text>
  <text x="545" y="390" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">（3 ⊆ 3，相等也弹）</text>
  <g filter="url(#rough2)">
    <rect x="515" y="428" width="60" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="545" y="444" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">R = 4</text>

  <g filter="url(#rough2)">
    <rect x="20" y="482" width="600" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="504" text-anchor="middle" font-size="11.5" fill="#a04040" filter="url(#rough2)">弹栈安全性：m 被 p 弹出 ⟹ p 能阻断 m 能阻断的一切后续位置，且 p 更近 → 栈顶永远是「最近阻断者」</text>
</svg>
