<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 2 演算：列头 = nums2[j]·k</text>

  <rect x="207" y="44" width="96" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="62" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">6 = 2 × 3</text>
  <rect x="317" y="44" width="96" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="62" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">12 = 4 × 3</text>

  <rect x="90" y="88" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="108" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">x = nums1[i]</text>
  <rect x="200" y="88" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="108" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">x mod 6</text>
  <rect x="310" y="88" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="108" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">x mod 12</text>
  <rect x="420" y="88" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="108" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans 累计</text>

  <rect x="90" y="120" width="110" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="145" y="145" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="200" y="120" width="110" height="42" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="255" y="145" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">1 ✗</text>
  <rect x="310" y="120" width="110" height="42" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="365" y="145" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">1 ✗</text>
  <rect x="420" y="120" width="100" height="42" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="470" y="145" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>

  <rect x="90" y="162" width="110" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="145" y="187" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="200" y="162" width="110" height="42" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="255" y="187" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">2 ✗</text>
  <rect x="310" y="162" width="110" height="42" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="365" y="187" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">2 ✗</text>
  <rect x="420" y="162" width="100" height="42" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="470" y="187" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>

  <rect x="90" y="204" width="110" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="145" y="229" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="200" y="204" width="110" height="42" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="255" y="229" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">4 ✗</text>
  <rect x="310" y="204" width="110" height="42" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="365" y="229" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">4 ✗</text>
  <rect x="420" y="204" width="100" height="42" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="470" y="229" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>

  <rect x="90" y="246" width="110" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="271" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="200" y="246" width="110" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="255" y="271" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 ✓</text>
  <rect x="310" y="246" width="110" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="365" y="271" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 ✓</text>
  <rect x="420" y="246" width="100" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="271" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">前 3 行 x = 1, 2, 4 都小于 6（更小于 12）：余数就是 x 自身，必然非 0</text>
  <text x="280" y="356" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最后一行 12 mod 6 = 0 且 12 mod 12 = 0 → ans + 2 → 返回 2</text>
  <text x="280" y="382" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">两个 ✓ 恰对应数对 (3, 0) 与 (3, 1)</text>
</svg>
