<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="336" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">易错反例：频次多重集相同 ≠ 接近</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">只比较「排序后的频次」是最典型的 WA：aab vs aac</text>

  <!-- ============ word1 = aab ============ -->
  <text x="40" y="68" font-size="12" fill="#333" filter="url(#rough2)">word1 = aab</text>

  <rect x="140" y="48" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="176" y="48" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="193" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="212" y="48" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="69" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b</text>

  <rect x="330" y="48" width="44" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="63" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="378" y="48" width="44" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="63" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <rect x="330" y="70" width="44" height="24" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="352" y="87" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="378" y="70" width="44" height="24" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="400" y="87" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="64" font-size="10.5" fill="#666" filter="url(#rough2)">多重集 {1,2}</text>

  <!-- ============ word2 = aac ============ -->
  <text x="40" y="136" font-size="12" fill="#333" filter="url(#rough2)">word2 = aac</text>

  <rect x="140" y="116" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157" y="137" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="176" y="116" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="193" y="137" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="212" y="116" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="229" y="137" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">c</text>

  <rect x="330" y="116" width="44" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="131" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="378" y="116" width="44" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="131" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">c</text>
  <rect x="330" y="138" width="44" height="24" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="352" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="378" y="138" width="44" height="24" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="400" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="132" font-size="10.5" fill="#666" filter="url(#rough2)">多重集 {1,2}</text>

  <!-- ============ 两条验收 ============ -->
  <rect x="40" y="172" width="480" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">√ 正频次多重集：{1,2} = {1,2} —— 相同</text>

  <rect x="40" y="214" width="480" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">× 字符集合：{a,b} ≠ {a,c} —— 不同 → 答案 false</text>

  <!-- ============ 为什么造不出 c ============ -->
  <rect x="40" y="258" width="480" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">b 想变成 c？操作 2 要求两个字符都在场——</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">c 从未在场就永远进不来；b 离了场也回不去</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">字符类既造不出、也删不掉</text>
</svg>
