<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">字符对模型：a 记 +1、b 记 −1、其他记 0</text>

  <!-- 字符串条 -->
  <g filter="url(#rough2)">
    <rect x="70" y="56" width="60" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="136" y="56" width="60" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="202" y="56" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="268" y="56" width="60" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="334" y="56" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="400" y="56" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="466" y="56" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="18" fill="#333" text-anchor="middle">
    <text x="100" y="85">a</text><text x="166" y="85">a</text>
    <text x="232" y="85">b</text><text x="298" y="85">a</text>
    <text x="364" y="85">b</text><text x="430" y="85">b</text><text x="496" y="85">b</text>
  </g>
  <text x="56" y="85" font-size="12" fill="#888" text-anchor="end" filter="url(#rough2)">s =</text>

  <!-- 映射箭头 -->
  <g filter="url(#rough2)">
    <path d="M 100 106 L 100 126" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 166 106 L 166 126" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 232 106 L 232 126" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 298 106 L 298 126" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 364 106 L 364 126" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 430 106 L 430 126" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 496 106 L 496 126" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- 数值条 (a,b)=(b,a)：b=+1, a=−1 -->
  <g filter="url(#rough2)">
    <rect x="70" y="132" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="136" y="132" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="202" y="132" width="60" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="268" y="132" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="334" y="132" width="60" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="400" y="132" width="60" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="466" y="132" width="60" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <text x="100" y="158">−1</text><text x="166" y="158">−1</text>
    <text x="232" y="158">+1</text><text x="298" y="158">−1</text>
    <text x="364" y="158">+1</text><text x="430" y="158">+1</text><text x="496" y="158">+1</text>
  </g>
  <text x="56" y="158" font-size="11.5" fill="#666" text-anchor="end" filter="url(#rough2)">v =</text>

  <!-- 最优区间 -->
  <path d="M 268 190 Q 382 208 496 190" stroke="#b85450" fill="none" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="382" y="226" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">最优子串 "babbb"：−1 +1 +1 +1 = ... 等下，区间含 1 个 a（−1）与 4 个 b（+1）</text>
  <text x="382" y="244" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">区间和 = 4×(+1) + 1×(−1) = 3 = 波动值 ✓</text>

  <!-- 说明框 -->
  <rect x="50" y="262" width="460" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">波动(t) = cnt(a) − cnt(b)（a 是最大频、b 是最小频）</text>
  <text x="280" y="303" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">枚举 26×25 个有序对 (a,b)，每个对跑一遍「受限 Kadane」</text>
  <text x="280" y="318" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">约束：子段至少含一个 b（最小频字符必须在子串中出现！）</text>

  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">其他字符记 0：子串可以包含它们而不改变频差（不是"跳过"）</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠ 无约束 Kadane 会算出"全 b 子串"= cnt(b) − 0，但那不是波动（b 频次为 0 不算）</text>
</svg>
