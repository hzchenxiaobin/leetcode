<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例走查：逐元素判定 与 计数公式，两个视角</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== Panel 1: per-element view ====== -->
  <text x="48" y="66" font-size="12.5" font-weight="bold" fill="#446688">视角一：逐元素判定 —— nums = [-3, 3, 3, 90]</text>
  <text x="48" y="86" font-size="10.5" fill="#888">第一趟：mn = −3，mx = 90；第二趟逐个判定 −3 &lt; x &lt; 90</text>

  <g filter="url(#sk)">
    <rect x="200" y="96" width="58" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="266" y="96" width="58" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="332" y="96" width="58" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="398" y="96" width="58" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="16" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="229" y="122" fill="#b85450">-3</text>
    <text x="295" y="122" fill="#333">3</text>
    <text x="361" y="122" fill="#333">3</text>
    <text x="427" y="122" fill="#d6a040">90</text>
  </g>
  <g font-size="10.5" text-anchor="middle" font-family="monospace">
    <text x="229" y="150" fill="#b85450" font-weight="bold">x = mn ✗</text>
    <text x="295" y="150" fill="#2e6e2e" font-weight="bold">✓</text>
    <text x="361" y="150" fill="#2e6e2e" font-weight="bold">✓</text>
    <text x="427" y="150" fill="#d6a040" font-weight="bold">x = mx ✗</text>
  </g>
  <g filter="url(#sk)">
    <rect x="170" y="162" width="340" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="340" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">cnt = 2：两个 3 都计入（数的是元素个数，不是不同值个数）</text>

  <path d="M 30 210 L 650 210" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#sk)"/>

  <!-- ====== Panel 2: formula view ====== -->
  <text x="48" y="238" font-size="12.5" font-weight="bold" fill="#446688">视角二：计数公式 —— 答案 = n − c(mn) − c(mx)（要求 mn &lt; mx）</text>
  <text x="48" y="256" font-size="10.5" fill="#888">c(v) 记值 v 的出现次数；满足判定的元素恰是「非 min 非 max」的那一部分</text>

  <!-- table -->
  <g filter="url(#sk)">
    <rect x="100" y="266" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="240" y="266" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="290" y="266" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="350" y="266" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="410" y="266" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>

    <rect x="100" y="292" width="140" height="28" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="240" y="292" width="50" height="28" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="290" y="292" width="60" height="28" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="350" y="292" width="60" height="28" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="410" y="292" width="170" height="28" fill="#fff" stroke="#999" stroke-width="1"/>

    <rect x="100" y="320" width="140" height="28" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="240" y="320" width="50" height="28" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="290" y="320" width="60" height="28" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="350" y="320" width="60" height="28" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="410" y="320" width="170" height="28" fill="#fff" stroke="#999" stroke-width="1"/>

    <rect x="100" y="348" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="240" y="348" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="290" y="348" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="350" y="348" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="410" y="348" width="170" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#2b4a6e" text-anchor="middle" font-family="monospace">
    <text x="170" y="283">用例</text>
    <text x="265" y="283">n</text>
    <text x="320" y="283">c(mn)</text>
    <text x="380" y="283">c(mx)</text>
    <text x="495" y="283">n − c(mn) − c(mx)</text>
  </g>
  <g font-size="11.5" text-anchor="middle" font-family="monospace" fill="#333">
    <text x="170" y="310">[11,7,2,15]</text>
    <text x="265" y="310">4</text>
    <text x="320" y="310">1</text>
    <text x="380" y="310">1</text>
    <text x="495" y="310" fill="#2e6e2e" font-weight="bold">2 ✓</text>

    <text x="170" y="338">[-3,3,3,90]</text>
    <text x="265" y="338">4</text>
    <text x="320" y="338">1</text>
    <text x="380" y="338">1</text>
    <text x="495" y="338" fill="#2e6e2e" font-weight="bold">2 ✓</text>

    <text x="170" y="366">[6,6,6]</text>
    <text x="265" y="366">3</text>
    <text x="320" y="366">3</text>
    <text x="380" y="366">3</text>
    <text x="495" y="366" fill="#a04038" font-weight="bold">−3 ✗</text>
  </g>

  <!-- trap callout -->
  <g filter="url(#sk)">
    <rect x="70" y="394" width="540" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="340" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038">陷阱：全相等时 mn == mx，「min 端」与「max 端」重合，同一批元素被扣两次</text>
  <text x="340" y="436" text-anchor="middle" font-size="11" fill="#444">[6,6,6] 代入公式得 3 − 3 − 3 = −3，一个荒谬的负数</text>
  <text x="340" y="456" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">修正：写 max(0, ·) 或先特判 mn == mx 返回 0 —— 正确答案 0 ✓</text>
</svg>
