<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两步分解：先向右落石（＝未来的重力），再顺时针旋转 90°</text>

  <!-- 原始 -->
  <text x="106" y="62" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">原始 box（m×n）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="74" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="76" y="74" width="32" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="112" y="74" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="148" y="74" width="32" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="110" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="76" y="110" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="112" y="110" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="148" y="110" width="32" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="56" y="95">#</text><text x="92" y="95">.</text><text x="128" y="95">*</text><text x="164" y="95">.</text>
    <text x="56" y="131">#</text><text x="92" y="131">#</text><text x="128" y="131">*</text><text x="164" y="131">.</text>
  </g>

  <path d="M 196 110 L 244 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="100" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">向右落石</text>

  <!-- 落石后 -->
  <text x="316" y="62" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">落石后（右＝未来的下方）</text>
  <g filter="url(#rough2)">
    <rect x="250" y="74" width="32" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="286" y="74" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="322" y="74" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="358" y="74" width="32" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="250" y="110" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="286" y="110" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="322" y="110" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="358" y="110" width="32" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="266" y="95">.</text><text x="302" y="95" fill="#2f5226">#</text><text x="338" y="95">*</text><text x="374" y="95">.</text>
    <text x="266" y="131">#</text><text x="302" y="131">#</text><text x="338" y="131">*</text><text x="374" y="131">.</text>
  </g>
  <text x="316" y="166" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">第一行的石头右滑一格（绿框）</text>

  <path d="M 402 110 L 446 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="100" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">旋转 90°</text>

  <!-- 旋转后 -->
  <text x="530" y="62" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">结果（n×m）</text>
  <g filter="url(#rough2)">
    <rect x="470" y="74" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="506" y="74" width="32" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="470" y="110" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="506" y="110" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="470" y="146" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="506" y="146" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="470" y="182" width="32" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="506" y="182" width="32" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="486" y="95">#</text><text x="522" y="95">.</text>
    <text x="486" y="131">#</text><text x="522" y="131">#</text>
    <text x="486" y="167">*</text><text x="522" y="167">*</text>
    <text x="486" y="203">.</text><text x="522" y="203">.</text>
  </g>

  <!-- 说明 -->
  <rect x="40" y="250" width="270" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="272" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">顺时针 90°：行倒序＋转置</text>
  <text x="56" y="290" font-size="11" fill="#3a4a66" filter="url(#rough2)">Python 里一句 zip(*box[::-1])；</text>
  <text x="56" y="306" font-size="11" fill="#3a4a66" filter="url(#rough2)">C++ 里 res[j][m−1−i] = box[i][j]。</text>

  <rect x="330" y="250" width="250" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="346" y="272" font-size="11" fill="#2f5226" font-weight="bold" filter="url(#rough2)">为什么"右"是未来的"下"？</text>
  <text x="346" y="290" font-size="11" fill="#2f5226" filter="url(#rough2)">旋转把第 i 行竖起来变成第 m−1−i 行，</text>
  <text x="346" y="306" font-size="11" fill="#2f5226" filter="url(#rough2)">原行号越大越靠上，列号越大越靠下。</text>

  <text x="310" y="352" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">两步次序可交换：先转再落与先落后转得到同一结果；但先落石只需在原行内双指针，代码更短</text>
</svg>
