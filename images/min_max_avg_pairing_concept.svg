<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：逐轮「掐头去尾」= 排序后第 k 小配第 k 大</text>
  <path d="M 200 44 Q 470 52 740 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- pairing arcs -->
  <g filter="url(#sk)" fill="none" stroke-width="2">
    <path d="M 220 176 Q 470 -48 720 176" stroke="#446688"/>
    <path d="M 320 176 Q 470 12 620 176" stroke="#4a7a3a"/>
    <path d="M 420 176 Q 470 72 520 176" stroke="#d6a040"/>
  </g>
  <!-- arc label chips -->
  <g filter="url(#sk2)" font-size="13" text-anchor="middle">
    <rect x="415" y="52" width="110" height="24" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="470" y="69" fill="#2b4a70">(a₀ + a₅)/2</text>
    <rect x="415" y="82" width="110" height="24" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="470" y="99" fill="#3a5a2e">(a₁ + a₄)/2</text>
    <rect x="415" y="112" width="110" height="24" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="470" y="129" fill="#7a5415">(a₂ + a₃)/2</text>
  </g>

  <!-- sorted cells: smaller half (blue) / larger half (orange) -->
  <g filter="url(#sk2)">
    <rect x="175" y="176" width="90" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="275" y="176" width="90" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="375" y="176" width="90" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="475" y="176" width="90" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="575" y="176" width="90" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="675" y="176" width="90" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk2)" font-size="16" font-weight="bold" text-anchor="middle">
    <text x="220" y="209" fill="#2b4a70">a₀</text>
    <text x="320" y="209" fill="#2b4a70">a₁</text>
    <text x="420" y="209" fill="#2b4a70">a₂</text>
    <text x="520" y="209" fill="#7a5415">a₃</text>
    <text x="620" y="209" fill="#7a5415">a₄</text>
    <text x="720" y="209" fill="#7a5415">a₅</text>
  </g>
  <g filter="url(#sk2)" font-size="12" text-anchor="middle" fill="#888">
    <text x="220" y="250">第1小</text>
    <text x="320" y="250">第2小</text>
    <text x="420" y="250">第3小</text>
    <text x="520" y="250">第3大</text>
    <text x="620" y="250">第2大</text>
    <text x="720" y="250">第1大</text>
  </g>
  <path d="M 180 266 Q 320 274 460 266" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="320" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk2)">i 端：依次是第 1, 2, 3 小</text>
  <path d="M 480 266 Q 620 274 760 266" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="620" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk2)">j 端：依次是第 1, 2, 3 大</text>
  <g filter="url(#sk2)">
    <path d="M 260 316 L 336 316" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
    <text x="298" y="334" text-anchor="middle" font-size="12" fill="#446688">i 每轮 +1</text>
    <path d="M 680 316 L 604 316" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
    <text x="642" y="334" text-anchor="middle" font-size="12" fill="#b85450">j 每轮 −1</text>
  </g>

  <!-- callout: sorted invariant -->
  <g filter="url(#sk)">
    <rect x="70" y="352" width="800" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="92" y="378" font-size="13.5" font-weight="bold" fill="#7a5415">「掐头去尾」的过程可以完全省略</text>
  <text x="92" y="402" font-size="12" fill="#444">第 1 轮移除全局最小 a₀ 与全局最大 a₅；剩下的 {a₁, …, a₄} 仍然保持升序</text>
  <text x="92" y="424" font-size="12" fill="#444">于是第 2 轮移除 a₁ 与 a₄ …… 第 k 轮恰好移除「第 k 小 + 第 k 大」——配对关系从头到尾确定</text>
  <text x="92" y="446" font-size="12" font-weight="bold" fill="#b03a3a">根本不必执行删除：排序后直接从两端读出全部 n/2 对</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="70" y="468" width="800" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="470" y="500" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a70">ans = min { ( a[i] + a[n−1−i] ) / 2 }，其中 0 ≤ i &lt; n/2</text>
  <text x="470" y="524" text-anchor="middle" font-size="12" fill="#555">n/2 对平均值里取最小；对撞双指针 i、j 一趟即可读完全部配对</text>
</svg>
