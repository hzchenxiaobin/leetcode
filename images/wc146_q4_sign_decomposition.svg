<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：绝对值 = 8 个线性式的最大值</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把 max 与 max 交换顺序，内层就变成互不干扰的「取最大 / 取最小」</text>

  <g filter="url(#rough2)">
    <rect x="66" y="62" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="141" y="85" text-anchor="middle" font-size="11" fill="#2f4a66">|a_i − a_j|</text>
    <text x="232" y="85" text-anchor="middle" font-size="14" fill="#666">+</text>
    <rect x="246" y="62" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="321" y="85" text-anchor="middle" font-size="11" fill="#2f4a66">|b_i − b_j|</text>
    <text x="412" y="85" text-anchor="middle" font-size="14" fill="#666">+</text>
    <rect x="426" y="62" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="501" y="85" text-anchor="middle" font-size="11" fill="#2f4a66">|i − j|</text>
  </g>

  <text x="320" y="118" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">|u| = max(u, −u)，三项各展开一次 ⇒ 共 2³ = 8 个线性组合</text>
  <path d="M 320 126 L 320 146" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="36" y="154" width="138" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="105" y="171" fill="#3a5a30">(+,+,+)</text>
    <text x="105" y="186" fill="#333">a + b + i</text>

    <rect x="188" y="154" width="138" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="257" y="171" fill="#3a5a30">(+,+,−)</text>
    <text x="257" y="186" fill="#333">a + b − i</text>

    <rect x="340" y="154" width="138" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="409" y="171" fill="#3a5a30">(+,−,+)</text>
    <text x="409" y="186" fill="#333">a − b + i</text>

    <rect x="492" y="154" width="112" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="548" y="171" fill="#3a5a30">(+,−,−)</text>
    <text x="548" y="186" fill="#333">a − b − i</text>
  </g>

  <text x="320" y="216" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">↑ 固定 σ₁ = +1 的 4 个组合（保留它们就够）</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" opacity="0.75">
    <rect x="36" y="226" width="138" height="38" fill="#f0f0f0" stroke="#aaa" stroke-width="1.1" rx="6" stroke-dasharray="4 3"/>
    <text x="105" y="242" fill="#888">(−,−,−)</text>
    <text x="105" y="256" fill="#999">−(a + b + i)</text>

    <rect x="188" y="226" width="138" height="38" fill="#f0f0f0" stroke="#aaa" stroke-width="1.1" rx="6" stroke-dasharray="4 3"/>
    <text x="257" y="242" fill="#888">(−,−,+)</text>
    <text x="257" y="256" fill="#999">−(a + b − i)</text>

    <rect x="340" y="226" width="138" height="38" fill="#f0f0f0" stroke="#aaa" stroke-width="1.1" rx="6" stroke-dasharray="4 3"/>
    <text x="409" y="242" fill="#888">(−,+,−)</text>
    <text x="409" y="256" fill="#999">−(a − b + i)</text>

    <rect x="492" y="226" width="112" height="38" fill="#f0f0f0" stroke="#aaa" stroke-width="1.1" rx="6" stroke-dasharray="4 3"/>
    <text x="548" y="242" fill="#888">(−,+,+)</text>
    <text x="548" y="256" fill="#999">−(a − b − i)</text>
  </g>

  <text x="320" y="284" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">σ 与 −σ 只差「把 i、j 互换」，取值相同 ⇒ 8 个组合砍半为 4 个</text>

  <rect x="40" y="296" width="560" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="318" font-size="11" fill="#7a5c18" font-weight="bold" filter="url(#rough2)">关键恒等式</text>
  <text x="60" y="340" font-size="11" fill="#333" filter="url(#rough2)">max(i,j) E(i,j) = max(σ) [ max(i) f_σ(i) − min(j) f_σ(j) ]</text>
  <text x="60" y="360" font-size="10" fill="#555" filter="url(#rough2)">其中 f_σ(i) = σ₁·arr1[i] + σ₂·arr2[i] + σ₃·i，内层 max 与 min 各自独立 ⇒ 一趟扫描即可</text>

  <text x="320" y="398" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">于是 O(n²) 的枚举被压成 4 趟扫描：O(n)</text>
</svg>
