<svg xmlns="http://www.w3.org/2000/svg" width="620" height="520" viewBox="0 0 620 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="520" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：先备好杨辉三角，再逐位「数块跳块」</text>
  <path d="M 130 36 Q 310 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="110" y="48" width="340" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#sk)">预计算杨辉三角 C[0..n][0..n]</text>
  <text x="280" y="90" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">C[i][j] = C[i−1][j−1] + C[i−1][j] —— 标签里的「DP」即此表</text>

  <g filter="url(#sk)">
    <path d="M 280 104 L 280 116" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="110" y="120" width="340" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="141" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#sk)">h ← column（'H' 个数），v ← row（'V' 个数），ans ← 空串</text>

  <g filter="url(#sk)">
    <path d="M 280 154 L 280 166" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="280,170 392,210 280,250 168,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#sk)">h &gt; 0 且 v &gt; 0 ？</text>

  <g filter="url(#sk)">
    <path d="M 392 210 L 421 210" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="401" y="201" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="426" y="180" width="186" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="519" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">补齐剩余同种字符</text>
  <text x="519" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">ans += 'H'×h + 'V'×v</text>
  <text x="519" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">返回 ans ✓</text>

  <g filter="url(#sk)">
    <path d="M 280 250 L 280 262" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="290" y="260" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="150" y="266" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="286" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">block ← C[h−1+v][v]</text>
  <text x="280" y="306" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">（首字符填 'H' 的串数）</text>

  <g filter="url(#sk)">
    <path d="M 280 314 L 280 324" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="280,328 360,366 280,404 200,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">k ≤ block ？</text>

  <g filter="url(#sk)">
    <path d="M 200 366 L 174 366" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="186" y="356" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="30" y="342" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="100" y="364" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">ans += 'H'；h−−</text>
  <text x="100" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">k 不变（H 块内）</text>

  <g filter="url(#sk)">
    <path d="M 360 366 L 386 366" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="368" y="356" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="390" y="342" width="190" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="485" y="364" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04040" filter="url(#sk)">k ← k − block；ans += 'V'</text>
  <text x="485" y="386" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">v−−（跳过整个 H 块）</text>

  <g filter="url(#sk)">
    <path d="M 100 398 L 100 470" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
    <path d="M 485 398 L 485 470 L 26 470 L 26 210 L 162 210" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="15" y="350" text-anchor="middle" font-size="10.5" fill="#888" transform="rotate(-90 15 350)" filter="url(#sk)">回到条件判断</text>

  <text x="310" y="500" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">n = row + column ≤ 30：预计算约 465 次加法 + 主循环至多 30 步，全程 O(n²)</text>
</svg>
