<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 348" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="348" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">排序后把每个数抬到「前一个数 + 1」</text>
  <text x="30" y="70" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">排序后</text>
  <rect x="40" y="82" width="72" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="110" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="128" y="82" width="72" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="110" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="216" y="82" width="72" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="252" y="110" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="304" y="82" width="72" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="110" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="392" y="82" width="72" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="110" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="480" y="82" width="72" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="516" y="110" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="30" y="168" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">调整后</text>
  <rect x="40" y="180" width="72" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="208" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 76 130 L 76 176" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="128" y="180" width="72" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="208" text-anchor="middle" font-size="16" fill="#a9761f" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 164 130 L 164 176" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="216" y="180" width="72" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="252" y="208" text-anchor="middle" font-size="16" fill="#a9761f" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 252 130 L 252 176" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="304" y="180" width="72" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="208" text-anchor="middle" font-size="16" fill="#a9761f" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 340 130 L 340 176" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">+2</text>
  <rect x="392" y="180" width="72" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="208" text-anchor="middle" font-size="16" fill="#a9761f" font-weight="bold" filter="url(#rough2)">5</text>
  <path d="M 428 130 L 428 176" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">+2</text>
  <rect x="480" y="180" width="72" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="516" y="208" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <path d="M 516 130 L 516 176" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">代价累加 0+1+1+2+2+0 = 6，与题目答案一致</text>
  <text x="300" y="308" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">橙色格是被抬高的元素，只增不减</text>
  <text x="300" y="330" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">关键：抬到「前一个数 + 1」是恰好不撞车的最小值</text>
</svg>
