<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：流式遍历 × 值域线段树</text>

  <!-- 左列：流程 -->
  <rect x="36" y="48" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="136" y="69" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 取 x = nums[i]</text>

  <path d="M136,82 L136,102" stroke="#446688" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="36" y="104" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="136" y="125" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② L = max(1, x−k)，R = x−1</text>

  <path d="M136,138 L136,158" stroke="#446688" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="36" y="160" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="136" y="181" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">③ best = 区间查询 max(dp[L..R])</text>

  <path d="M136,194 L136,214" stroke="#446688" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="36" y="216" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="136" y="237" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">④ cur = best + 1</text>

  <path d="M136,250 L136,270" stroke="#446688" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="36" y="272" width="200" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="136" y="291" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">⑤ 单点更新 dp[x] ← max(dp[x], cur)</text>
  <text x="136" y="309" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">ans ← max(ans, cur)</text>

  <!-- 循环回边 -->
  <path d="M36,296 L20,296 Q12,296 12,288 L12,73 Q12,65 20,65 L32,65" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="22" y="180" font-size="10.5" fill="#b85450" filter="url(#rough2)" transform="rotate(-90 22 180)">i = 0 … n−1</text>

  <!-- 右列：线段树（值域 1..8） -->
  <text x="385" y="58" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">值域线段树（示意 V = 8）</text>

  <!-- 树边 -->
  <path d="M385,84 L320,124 M385,84 L450,124" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M320,124 L287,164 M320,124 L352,164 M450,124 L417,164 M450,124 L482,164" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M287,164 L273,204 M287,164 L301,204 M352,164 L338,204 M352,164 L366,204 M417,164 L403,204 M417,164 L431,204 M482,164 L468,204 M482,164 L496,204" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <!-- 根 -->
  <rect x="364" y="72" width="42" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="87" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[1,8]</text>
  <!-- 层2 -->
  <rect x="299" y="112" width="42" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="127" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[1,4]</text>
  <rect x="429" y="112" width="42" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="127" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[5,8]</text>
  <!-- 层3 -->
  <rect x="266" y="152" width="42" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="167" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[1,2]</text>
  <rect x="331" y="152" width="42" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="167" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[3,4]</text>
  <rect x="396" y="152" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="417" y="167" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">[5,6]</text>
  <rect x="461" y="152" width="42" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="482" y="167" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[7,8]</text>
  <!-- 层4 叶子 -->
  <rect x="259" y="192" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="273" y="206" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="287" y="192" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="206" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="324" y="192" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="206" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="352" y="192" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="206" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="389" y="192" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="403" y="206" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">5</text>
  <rect x="417" y="192" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="431" y="206" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">6</text>
  <rect x="454" y="192" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="468" y="206" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">7</text>
  <rect x="482" y="192" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="496" y="206" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">8</text>

  <!-- 查询说明箭头 -->
  <text x="385" y="234" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">查询 [5,7]：整块 [5,6] + 散点 7，只碰 O(log V) 个节点</text>

  <!-- 更新示意 -->
  <rect x="300" y="250" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="268" text-anchor="middle" font-size="11" fill="#8f3a34" filter="url(#rough2)">更新 dp[5]：叶子 5 取 max 后，</text>
  <text x="400" y="285" text-anchor="middle" font-size="11" fill="#8f3a34" filter="url(#rough2)">沿祖先链 [5,6]→[5,8]→[1,8] 重新聚合</text>

  <!-- 不变式框 -->
  <rect x="30" y="336" width="460" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">不变式：处理 nums[i] 之前，树上 dp[v] = nums[0..i−1] 中以值 v 结尾的最长长度</text>
  <text x="260" y="380" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">→ 查询窗口 [x−k, x−1] 得到的 best 必来自下标更早的前驱，顺序约束免费达成</text>
</svg>
