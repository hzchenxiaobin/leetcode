<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="57"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">排序 + 分界扫描：枚举下标 i，候选 x = n − i</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">升序排序后「≥ x 的元素」必是一段后缀；后缀长度 = x ⟺ 分界下标 i = n − x</text>

  <!-- 正例 -->
  <text x="40" y="74" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">✓ [0,4,3,0,4] → 排序 [0,0,3,4,4]（n = 5）</text>

  <g filter="url(#r)">
    <rect x="90" y="86" width="62" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="162" y="86" width="62" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="234" y="86" width="62" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="306" y="86" width="62" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="378" y="86" width="62" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="121" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">0</text>
  <text x="193" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">0</text>
  <text x="265" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">3</text>
  <text x="337" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">4</text>
  <text x="409" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">4</text>
  <text x="121" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">i=0</text>
  <text x="193" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">i=1</text>
  <text x="265" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">i=2</text>
  <text x="337" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">i=3</text>
  <text x="409" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">i=4</text>

  <g filter="url(#r)">
    <line x1="229" y1="80" x2="229" y2="150" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
  <text x="166" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#r)">前缀都 &lt; 3</text>
  <text x="233" y="164" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#r)">分界 i=2</text>
  <text x="345" y="164" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#r)">后缀恰好 3 个 ≥ 3</text>

  <text x="40" y="186" font-size="11.5" fill="#333" filter="url(#r)">x = n − i = 5 − 2 = 3：nums[2] = 3 ≥ 3 ✓ 且 nums[1] = 0 &lt; 3 ✓ → <tspan font-weight="bold" fill="#2e6e2e">返回 3</tspan></text>

  <!-- 反例 -->
  <text x="40" y="214" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">✗ [3,6,7,7,0] → 排序 [0,3,6,7,7]（n = 5）</text>

  <g filter="url(#r)">
    <rect x="90" y="224" width="62" height="42" rx="4" fill="#f4f1ea" stroke="#b3aa99" stroke-width="1.3"/>
    <rect x="162" y="224" width="62" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="234" y="224" width="62" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="306" y="224" width="62" height="42" rx="4" fill="#f4f1ea" stroke="#b3aa99" stroke-width="1.3"/>
    <rect x="378" y="224" width="62" height="42" rx="4" fill="#f4f1ea" stroke="#b3aa99" stroke-width="1.3"/>
  </g>
  <text x="121" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">0</text>
  <text x="193" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a" filter="url(#r)">3</text>
  <text x="265" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#r)">6</text>
  <text x="337" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">7</text>
  <text x="409" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">7</text>
  <text x="121" y="280" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">i=0</text>
  <text x="193" y="280" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">i=1</text>
  <text x="265" y="280" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">i=2</text>
  <text x="337" y="280" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">i=3</text>
  <text x="409" y="280" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">i=4</text>

  <text x="265" y="296" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#r)">候选 i = 2（x = 3）</text>
  <text x="40" y="316" font-size="11" fill="#444" filter="url(#r)">nums[2] = 6 ≥ 3 ✓，但 nums[1] = 3 不满足 &lt; 3（红框）→ 实际 4 个 ≥ 3 ≠ 3，此分界作废</text>
  <text x="40" y="336" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#r)">每个 i 都被否决 → 不存在特征值 → 返回 −1</text>

  <!-- 命中条件 -->
  <g filter="url(#r)">
    <rect x="30" y="352" width="560" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="50" y="376" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#r)">命中条件（i 从 0 到 n−1，候选 x = n − i）：</text>
  <text x="50" y="398" font-size="12" fill="#555" filter="url(#r)">nums[i] ≥ x 且（i = 0 或 nums[i−1] &lt; x）⟺ 恰好 x 个元素 ≥ x，命中即返回 x</text>
</svg>
