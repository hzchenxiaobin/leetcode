<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="370" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "abbbabbbcabbbabbbc"（n = 18）</text>

  <text x="211" y="45" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">前半 = "abbbabbbc"</text>
  <text x="409" y="45" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">后半 = "abbbabbbc"</text>

  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <rect x="112" y="50" width="22" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="123" y="69" fill="#333" filter="url(#rough2)">a</text>
    <rect x="134" y="50" width="22" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="145" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="156" y="50" width="22" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="167" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="178" y="50" width="22" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="189" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="200" y="50" width="22" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="211" y="69" fill="#333" filter="url(#rough2)">a</text>
    <rect x="222" y="50" width="22" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="233" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="244" y="50" width="22" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="255" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="266" y="50" width="22" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="277" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="288" y="50" width="22" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="299" y="69" fill="#333" filter="url(#rough2)">c</text>

    <rect x="310" y="50" width="22" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="321" y="69" fill="#333" filter="url(#rough2)">a</text>
    <rect x="332" y="50" width="22" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="343" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="354" y="50" width="22" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="365" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="376" y="50" width="22" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="387" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="398" y="50" width="22" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="409" y="69" fill="#333" filter="url(#rough2)">a</text>
    <rect x="420" y="50" width="22" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="431" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="442" y="50" width="22" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="453" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="464" y="50" width="22" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="475" y="69" fill="#333" filter="url(#rough2)">b</text>
    <rect x="486" y="50" width="22" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="497" y="69" fill="#333" filter="url(#rough2)">c</text>
  </g>

  <path d="M 112 82 H 508" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 112 82 V 88 H 310 V 82" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 310 82 V 88 H 508 V 82" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="310" y="104" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">两段完全相同 ⇒ 周期 L = 9，t = 2</text>

  <text x="24" y="126" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">区间</text>
  <text x="105" y="126" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">子串结构</text>
  <text x="300" y="126" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">最优编码</text>
  <text x="520" y="126" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">长度</text>

  <path d="M 20 132 H 596" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 154 H 596" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 176 H 596" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 198 H 596" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 220 H 596" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="24" y="148" font-size="10.5" fill="#333" filter="url(#rough2)">[0,4)</text>
  <text x="105" y="148" font-size="10.5" fill="#333" filter="url(#rough2)">"abbb"（无周期）</text>
  <text x="300" y="148" font-size="10.5" fill="#333" filter="url(#rough2)">"abbb"</text>
  <text x="520" y="148" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>

  <text x="24" y="170" font-size="10.5" fill="#333" filter="url(#rough2)">[0,8)</text>
  <text x="105" y="170" font-size="10.5" fill="#333" filter="url(#rough2)">"abbb" × 2，t = 2</text>
  <text x="300" y="170" font-size="10.5" fill="#333" filter="url(#rough2)">"2[abbb]"（7 &lt; 8）</text>
  <text x="520" y="170" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>

  <text x="24" y="192" font-size="10.5" fill="#333" filter="url(#rough2)">[0,9)</text>
  <text x="105" y="192" font-size="10.5" fill="#333" filter="url(#rough2)">"2[abbb]" + "c"</text>
  <text x="300" y="192" font-size="10.5" fill="#333" filter="url(#rough2)">"2[abbb]c"</text>
  <text x="520" y="192" font-size="10.5" fill="#333" filter="url(#rough2)">8</text>

  <text x="24" y="214" font-size="10.5" fill="#333" filter="url(#rough2)">[9,18)</text>
  <text x="105" y="214" font-size="10.5" fill="#333" filter="url(#rough2)">同前半，结构一致</text>
  <text x="300" y="214" font-size="10.5" fill="#333" filter="url(#rough2)">"2[abbb]c"</text>
  <text x="520" y="214" font-size="10.5" fill="#333" filter="url(#rough2)">8</text>

  <rect x="18" y="220" width="580" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="24" y="236" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">[0,18)</text>
  <text x="105" y="236" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">两半相同，t = 2（拼接 16）</text>
  <text x="300" y="236" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">"2[2[abbb]c]"</text>
  <text x="520" y="236" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">11</text>

  <rect x="48" y="262" width="524" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="66" y="284" font-size="10" fill="#3a5a30" filter="url(#rough2)">内层 [0,9) 先压缩成 "2[abbb]c"（长度 8），外层才能用 2[ … ] 得 11；</text>
  <text x="66" y="304" font-size="10" fill="#3a5a30" filter="url(#rough2)">若外层直接包原串 "2[abbbabbbc]" 则是 12，若只在 k=9 拼接则 16。</text>

  <path d="M 310 322 V 336" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="354" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">答案 "2[2[abbb]c]"，长度 11（原串 18）</text>
</svg>
