<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">第 2 天的正难则反：把每条边"倒着建"</text>
  <path d="M 290 42 Q 470 50 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: day-1 forward edges ===== -->
  <g filter="url(#sk)">
    <rect x="48" y="64" width="404" height="202" rx="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="250" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">第 1 天：正向建边 → 求 d₁</text>

  <g filter="url(#sk)">
    <ellipse cx="140" cy="166" rx="30" ry="18" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="140" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">a</text>
  <g filter="url(#sk)">
    <ellipse cx="310" cy="166" rx="30" ry="18" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="310" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">b</text>

  <path d="M 168 154 Q 225 124 282 154" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="225" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">×r</text>
  <path d="M 282 178 Q 225 208 168 178" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="225" y="216" text-anchor="middle" font-size="12" fill="#888">×1/r</text>

  <text x="250" y="248" text-anchor="middle" font-size="10.5" fill="#444">从初始货币出发 BFS，走 a→b 乘 r</text>
  <text x="250" y="258" text-anchor="middle" font-size="10.5" fill="#444">算的是「1.0 初始 → 能变多少 b」</text>

  <!-- ===== Panel 2: day-2 inverted edges ===== -->
  <g filter="url(#sk)">
    <rect x="488" y="64" width="404" height="202" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="690" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">第 2 天：反向建边 → 求 f₂</text>

  <g filter="url(#sk)">
    <ellipse cx="580" cy="166" rx="30" ry="18" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="580" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">a</text>
  <g filter="url(#sk)">
    <ellipse cx="750" cy="166" rx="30" ry="18" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="750" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">b</text>

  <path d="M 608 154 Q 665 124 722 154" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="665" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">×1/r</text>
  <path d="M 722 178 Q 665 208 608 178" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="665" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">×r</text>

  <text x="690" y="248" text-anchor="middle" font-size="10.5" fill="#444">同样从初始货币出发 BFS（方向调头、汇率取倒数）</text>
  <text x="690" y="258" text-anchor="middle" font-size="10.5" fill="#444">g[c] = 1.0 单位 c 能换回的初始货币数量</text>

  <!-- ===== Equivalence box ===== -->
  <g filter="url(#sk)">
    <rect x="48" y="288" width="844" height="100" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="70" y="312" font-size="12.5" font-weight="bold" fill="#7a5415">两种等价说法</text>
  <text x="70" y="336" font-size="11.5" fill="#444">① 反向建边后 BFS：g[c] 直接就是 f₂(c)——反向图上 initial→c 的每一步，对应真实第 2 天里 c 退回 initial 的一步；</text>
  <text x="70" y="358" font-size="11.5" fill="#444">② 正向建边 BFS 得 g₂[c]（1.0 初始 → 多少 c），则 f₂(c) = 1 / g₂[c]。无矛盾保证 ⇒ 路径乘积唯一，两式必然一致。</text>
  <text x="70" y="380" font-size="10.5" fill="#888">★ 因为"无矛盾"，任意路径乘积相同 ⇒ 一次 BFS 首次赋值即终值，不需要 Dijkstra / Bellman-Ford</text>

  <!-- ===== Code symmetry box ===== -->
  <g filter="url(#sk)">
    <rect x="48" y="408" width="844" height="124" rx="10" fill="#fdfdfd" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="70" y="432" font-size="12.5" font-weight="bold" fill="#2b2b2b">代码对称美：同一个 BFS 函数，只交换 r 与 1/r</text>
  <g font-family="monospace">
    <text x="70" y="458" font-size="11.5" fill="#2b6e9e">d₁ = bfs(pairs1, rates1, invert=False)   # a→(b, r),  b→(a, 1/r)</text>
    <text x="70" y="480" font-size="11.5" fill="#2e6e2e">f₂ = bfs(pairs2, rates2, invert=True)    # a→(b, 1/r), b→(a, r)</text>
    <text x="70" y="502" font-size="11.5" fill="#b03a3a" font-weight="bold">ans = max(d₁[c] * f₂[c] for c in 两表都有的货币)</text>
  </g>
  <text x="70" y="524" font-size="10.5" fill="#888">★ 第 2 天若不反向建边，就得对每个第 1 天可达货币 c 各跑一次 BFS：O((n+m)·m)，也能过但不够优雅</text>
</svg>
