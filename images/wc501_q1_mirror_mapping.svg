<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">连接逆序数组：一趟循环，两个下标映射</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 映射公式框 -->
  <g filter="url(#sk)"><rect x="30" y="140" width="140" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="100" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">ans[i] = nums[i]</text>
  <text x="100" y="181" text-anchor="middle" font-size="10.5" fill="#666">前半 · 原序照抄</text>

  <g filter="url(#sk)"><rect x="470" y="140" width="140" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="540" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">ans[i+n] = nums[n−1−i]</text>
  <text x="540" y="181" text-anchor="middle" font-size="10.5" fill="#666">后半 · 镜像逆序</text>

  <!-- nums 行 -->
  <text x="150" y="98" text-anchor="end" font-size="13" font-weight="bold" fill="#446688">nums</text>
  <text x="200" y="64" text-anchor="middle" font-size="10" fill="#888">nums[0]</text>
  <g filter="url(#sk)"><rect x="172" y="70" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="200" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="280" y="64" text-anchor="middle" font-size="10" fill="#888">nums[1]</text>
  <g filter="url(#sk)"><rect x="252" y="70" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="360" y="64" text-anchor="middle" font-size="10" fill="#888">nums[2]</text>
  <g filter="url(#sk)"><rect x="332" y="70" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="360" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">3</text>

  <!-- 照抄箭头（蓝） -->
  <path d="M 200 118 C 175 185, 135 235, 121 294" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <path d="M 280 118 C 258 190, 215 240, 191 294" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <path d="M 360 118 C 342 190, 295 240, 261 294" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="103" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">照抄</text>

  <!-- 镜像箭头（绿） -->
  <path d="M 362 118 C 368 195, 350 245, 332 294" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <path d="M 285 118 C 305 195, 372 245, 398 294" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <path d="M 205 118 C 245 185, 435 235, 468 294" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="490" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">镜像</text>

  <!-- 中缝 -->
  <path d="M 295 262 L 295 378" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 5" fill="none" filter="url(#sk)"/>
  <text x="295" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">中缝</text>

  <!-- ans 行 -->
  <text x="78" y="328" text-anchor="end" font-size="13" font-weight="bold" fill="#2b2b2b">ans</text>
  <g filter="url(#sk)"><rect x="92" y="300" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="120" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="162" y="300" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="190" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="232" y="300" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="260" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="302" y="300" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="330" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><rect x="372" y="300" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="400" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="442" y="300" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="470" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="120" y="366" text-anchor="middle" font-size="10" fill="#888">ans[0]</text>
  <text x="190" y="366" text-anchor="middle" font-size="10" fill="#888">ans[1]</text>
  <text x="260" y="366" text-anchor="middle" font-size="10" fill="#888">ans[2]</text>
  <text x="330" y="366" text-anchor="middle" font-size="10" fill="#888">ans[3]</text>
  <text x="400" y="366" text-anchor="middle" font-size="10" fill="#888">ans[4]</text>
  <text x="470" y="366" text-anchor="middle" font-size="10" fill="#888">ans[5]</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="388" width="520" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">位置 i 与 2n−1−i 下标和恒为 2n−1（关于中缝对称）</text>
  <text x="320" y="424" text-anchor="middle" font-size="11" fill="#444">⇒ ans[i] = ans[2n−1−i]，答案必为回文，可当自检断言</text>
</svg>
