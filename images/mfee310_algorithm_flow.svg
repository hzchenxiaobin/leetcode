<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一遍计数 + 升序取最，两遍扫描零特判</text>
  <path d="M 110 44 Q 340 52 570 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="170" y="58" width="340" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="82" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">第一遍：for x in nums: cnt[x]++</text>
  <text x="340" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">奇数也照计不误——读取时只看偶下标，白计无副作用</text>

  <g filter="url(#sk)"><path d="M 340 118 L 340 142" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="190" y="148" width="300" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">第二遍：v = 0 起步，步长 2</text>

  <g filter="url(#sk)"><path d="M 340 192 L 340 216" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="340,222 440,266 340,310 240,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="340" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">cnt[v] &gt; best ?</text>
  <text x="340" y="280" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">(严格大于，不是 ≥)</text>

  <g filter="url(#sk)"><path d="M 440 266 L 478 266" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="459" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>

  <g filter="url(#sk)"><rect x="484" y="242" width="176" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="572" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">best = cnt[v]</text>
  <text x="572" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = v</text>

  <g filter="url(#sk)"><path d="M 572 292 L 572 330 L 432 330 L 432 348" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><path d="M 340 310 L 340 348" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="356" y="332" text-anchor="start" font-size="12" font-weight="bold" fill="#a03a3a" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><rect x="252" y="354" width="180" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="342" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">v += 2</text>

  <g filter="url(#sk)"><path d="M 342 398 L 342 420" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="342,426 442,462 342,498 242,462" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="342" y="459" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">v ≤ 10⁵ ?</text>
  <text x="342" y="477" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">偶数下标还没扫完</text>

  <g filter="url(#sk)"><path d="M 242 462 L 120 462 L 120 266 L 232 266" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="126" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#sk)">是</text>
  <text x="126" y="394" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">回到取最判定</text>

  <g filter="url(#sk)"><path d="M 442 462 L 500 462" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="470" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#a03a3a" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><rect x="506" y="438" width="154" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="583" y="458" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 ans</text>
  <text x="583" y="476" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">无偶数时保持 -1</text>
</svg>
