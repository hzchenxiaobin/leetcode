<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：代价函数是凸的，最优回文紧贴中位数</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">以 a = [10,12,13,14,15] 为例画 f(t) = Σ|aᵢ − t|：折线在每个数组元素处拐折，谷底在中位数</text>

  <path d="M 60 330 L 590 330" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 64 336 L 64 70" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="78" y="82" font-size="11" fill="#555">f(t)</text>
  <text x="572" y="348" font-size="11" fill="#555">t</text>

  <path d="M 80 224 L 140 268 L 200 295 L 230 299 L 260 295 L 290 282 L 410 194" stroke="#4a8edb" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 410 194 L 500 128" stroke="#4a8edb" stroke-width="1.6" stroke-dasharray="6,4" fill="none" filter="url(#sk)"/>
  <text x="428" y="180" font-size="11" fill="#4a8edb">继续上翘 ↗</text>

  <g filter="url(#sk)">
    <line x1="140" y1="330" x2="140" y2="336" stroke="#777" stroke-width="1.2"/>
    <line x1="200" y1="330" x2="200" y2="336" stroke="#777" stroke-width="1.2"/>
    <line x1="230" y1="330" x2="230" y2="336" stroke="#777" stroke-width="1.2"/>
    <line x1="260" y1="330" x2="260" y2="336" stroke="#777" stroke-width="1.2"/>
    <line x1="290" y1="330" x2="290" y2="336" stroke="#777" stroke-width="1.2"/>
  </g>
  <text x="140" y="348" text-anchor="middle" font-size="10" fill="#777">10</text>
  <text x="200" y="348" text-anchor="middle" font-size="10" fill="#777">12</text>
  <text x="230" y="348" text-anchor="middle" font-size="10" fill="#777">13</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#777">14</text>
  <text x="290" y="348" text-anchor="middle" font-size="10" fill="#777">15</text>

  <path d="M 230 330 L 230 299" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <circle cx="230" cy="299" r="3.5" fill="#b85450" filter="url(#sk)"/>
  <text x="230" y="364" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36">m = 13</text>
  <text x="230" y="381" text-anchor="middle" font-size="10" fill="#8a3a36">中位数（f 的谷底）</text>

  <path d="M 110 330 L 110 246" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#sk)"/>
  <circle cx="110" cy="246" r="4" fill="#eeeeea" stroke="#999" stroke-width="1.6" filter="url(#sk)"/>
  <text x="110" y="232" text-anchor="middle" font-size="10" fill="#777">9</text>
  <text x="110" y="364" text-anchor="middle" font-size="11" fill="#888">回文 9</text>

  <path d="M 170 330 L 170 282" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="3,3" fill="none" filter="url(#sk)"/>
  <circle cx="170" cy="282" r="5.5" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.4" filter="url(#sk)"/>
  <text x="170" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">11</text>
  <text x="170" y="364" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">p− = 11</text>

  <path d="M 500 330 L 500 128" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="3,3" fill="none" filter="url(#sk)"/>
  <circle cx="500" cy="128" r="5.5" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.4" filter="url(#sk)"/>
  <text x="500" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">22</text>
  <text x="500" y="364" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">p+ = 22</text>

  <g filter="url(#sk)"><rect x="66" y="64" width="222" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="177" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">f 在 (−∞, m] 上不增</text>
  <text x="177" y="106" text-anchor="middle" font-size="11.5" fill="#444">左侧：目标越靠近 m 越便宜</text>

  <g filter="url(#sk)"><rect x="330" y="64" width="244" height="54" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="452" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">f 在 [m, +∞) 上不减</text>
  <text x="452" y="106" text-anchor="middle" font-size="11.5" fill="#444">右侧：离 m 越远的回文只会更贵</text>

  <g filter="url(#sk)"><rect x="60" y="396" width="520" height="58" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="420" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">最优回文目标 ∈ { p−, p+ }：中位数两侧各取最近的回文即可支配其余</text>
  <text x="320" y="442" text-anchor="middle" font-size="11.5" fill="#666">而 [1, 2×10⁹] 内总共只有约 1.2×10⁵ 个回文 → 干脆全部枚举、逐个算代价</text>
</svg>
