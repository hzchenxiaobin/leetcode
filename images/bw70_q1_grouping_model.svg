<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">买二送一：降序排列后每 3 件一组，组内最便宜免费</text>

  <!-- 排序序列 -->
  <text x="280" y="64" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">cost 降序排序（7 个糖果示例）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="80" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="128" y="80" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="196" y="80" width="60" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="272" y="80" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="340" y="80" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="408" y="80" width="60" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="476" y="80" width="60" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="90" y="106">9</text>
    <text x="158" y="106">7</text>
    <text x="226" y="106">6</text>
    <text x="302" y="106">5</text>
    <text x="370" y="106">3</text>
    <text x="438" y="106">2</text>
    <text x="506" y="106">2</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="90" y="140">付</text>
    <text x="158" y="140">付</text>
    <text x="226" y="140">免费</text>
    <text x="302" y="140">付</text>
    <text x="370" y="140">付</text>
    <text x="438" y="140">免费</text>
    <text x="506" y="140">付（凑不成组）</text>
  </g>

  <!-- 分组括线 -->
  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="2">
    <path d="M 60 150 L 60 162 L 256 162 L 256 150"/>
    <path d="M 272 150 L 272 162 L 468 162 L 468 150"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#446688" text-anchor="middle">
    <text x="158" y="180">第 1 组（下标 0,1,2）</text>
    <text x="370" y="180">第 2 组（下标 3,4,5）</text>
  </g>

  <!-- 免费条件说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="200" width="440" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="224" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)" text-anchor="middle">免费糖果的价格 ≤ 所购两件中较便宜者</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="248">降序后第 3 件 ≤ 前 2 件的最小值，天然满足；</text>
    <text x="280" y="266">组内免费名额留给最便宜的（组内第 3 件）才最省</text>
  </g>

  <text x="280" y="304" font-size="12.5" fill="#666" filter="url(#rough2)" text-anchor="middle">n mod 3 余 1 或 2：剩下的糖果没有免费资格，只能原价买</text>
  <text x="280" y="324" font-size="12.5" fill="#666" filter="url(#rough2)" text-anchor="middle">示例开销 = 9 + 7 + 5 + 3 + 2 = 26</text>
</svg>
