<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：官方操作序列的状态变迁</text>

  <g filter="url(#rough2)">
    <rect x="26" y="42" width="508" height="34" fill="#fff" stroke="#666" stroke-width="1.2" rx="6"/>
    <rect x="26" y="76" width="508" height="34" fill="#fff" stroke="#666" stroke-width="1.2" rx="6"/>
    <rect x="26" y="110" width="508" height="34" fill="#fff" stroke="#666" stroke-width="1.2" rx="6"/>
    <rect x="26" y="144" width="508" height="34" fill="#fff" stroke="#666" stroke-width="1.2" rx="6"/>
    <rect x="26" y="178" width="508" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <rect x="26" y="212" width="508" height="34" fill="#fff" stroke="#666" stroke-width="1.2" rx="6"/>
    <rect x="26" y="246" width="508" height="34" fill="#fff" stroke="#666" stroke-width="1.2" rx="6"/>
    <rect x="26" y="280" width="508" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5">
    <text x="40" y="63" fill="#333">addScore(1,73)</text><text x="400" y="63" fill="#777">{1:73}</text>
    <text x="40" y="97" fill="#333">addScore(2,56)</text><text x="400" y="97" fill="#777">{1:73, 2:56}</text>
    <text x="40" y="131" fill="#333">addScore(3,39)</text><text x="400" y="131" fill="#777">{1:73, 2:56, 3:39}</text>
    <text x="40" y="165" fill="#333">addScore(4,51)　addScore(5,4)</text><text x="380" y="165" fill="#777">{…, 4:51, 5:4}</text>
    <text x="40" y="199" fill="#8a6a20" font-weight="bold">top(1)</text><text x="400" y="199" fill="#8a6a20" font-weight="bold">73 ← 最大值 73</text>
    <text x="40" y="233" fill="#333">reset(1)　reset(2)</text><text x="400" y="233" fill="#777">{1:0, 2:0, 3:39, 4:51, 5:4}</text>
    <text x="40" y="267" fill="#333">addScore(2,51)</text><text x="400" y="267" fill="#777">{1:0, 2:51, 3:39, 4:51, 5:4}</text>
    <text x="40" y="301" fill="#3a5a30" font-weight="bold">top(3)</text><text x="380" y="301" fill="#3a5a30" font-weight="bold">141 = 51 + 51 + 39 ← 前 3 大求和</text>
  </g>

  <rect x="46" y="330" width="468" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">两个 51 并列都被计入；reset 后玩家保留 0 分键，仍算「在榜」</text>
</svg>
