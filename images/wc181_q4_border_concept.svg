<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心概念：边界（border）与 π 的定义</text>
  <path d="M 120 36 Q 280 46 440 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 示例：ababab -->
  <text x="62" y="98" font-size="13" fill="#555" filter="url(#rough2)">s =</text>

  <rect x="100" y="72" width="44" height="42" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="144" y="72" width="44" height="42" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="188" y="72" width="44" height="42" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="232" y="72" width="44" height="42" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="276" y="72" width="44" height="42" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="320" y="72" width="44" height="42" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="122" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <text x="166" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <text x="210" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <text x="254" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <text x="298" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <text x="342" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>

  <!-- 前缀括号（蓝） -->
  <text x="166" y="46" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">真前缀 s[0:4] = “abab”</text>
  <path d="M 100 66 L 100 54 L 232 54 L 232 66" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 后缀括号（绿） -->
  <path d="M 188 120 L 188 132 L 320 132 L 320 120" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="254" y="150" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后缀 s[2:6] = “abab”</text>

  <!-- 重叠标记（橙虚线） -->
  <rect x="185" y="69" width="95" height="48" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="11.5" fill="#a07828" filter="url(#rough2)">中段 “ab” 被前后缀共用 —— 题目允许重叠</text>

  <!-- 结果框 -->
  <path d="M 368 99 L 394 99" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="72" width="140" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a4a20" filter="url(#rough2)">π[5] = 4</text>
  <text x="470" y="114" text-anchor="middle" font-size="12.5" fill="#5a4a20" filter="url(#rough2)">答案 “abab”</text>

  <!-- 嵌套边界链 -->
  <text x="40" y="204" font-size="13" font-weight="bold" fill="#444" filter="url(#rough2)">嵌套性：长边界的内部还藏着短边界</text>

  <rect x="50" y="222" width="140" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="249" text-anchor="middle" font-size="12.5" fill="#2c4258" filter="url(#rough2)">长 4：“abab”</text>

  <path d="M 194 244 L 244 244" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="219" y="236" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">π[3] = 2</text>

  <rect x="250" y="222" width="140" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="249" text-anchor="middle" font-size="12.5" fill="#2f5a22" filter="url(#rough2)">长 2：“ab”</text>

  <path d="M 394 244 L 444 244" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="419" y="236" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">π[1] = 0</text>

  <rect x="450" y="222" width="100" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="249" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">长 0：（无）</text>

  <text x="50" y="294" font-size="11.5" fill="#555" filter="url(#rough2)">“ababab” 的全部边界长度沿 π 链回溯：π[5]=4 → π[3]=2 → π[1]=0</text>
  <text x="50" y="314" font-size="11.5" fill="#555" filter="url(#rough2)">链上每个正值都是一个快乐前缀：“abab” 与 “ab”</text>

  <!-- 定义框 -->
  <rect x="40" y="335" width="480" height="90" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12.5" fill="#2c4258" filter="url(#rough2)">π[i]：子串 s[0..i] 的最长边界长度（真前缀 = 后缀）</text>
  <text x="280" y="386" text-anchor="middle" font-size="12.5" fill="#2c4258" filter="url(#rough2)">取 i = n−1：π[n−1] = 整个串的最长快乐前缀长度</text>
  <text x="280" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4258" filter="url(#rough2)">定义即答案 —— 问题化为「如何 O(n) 求出 π」</text>
</svg>
