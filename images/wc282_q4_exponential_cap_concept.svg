<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 492"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="492" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：单胎圈耗时指数增长 —— 长段必败给换胎</text>

  <!-- 换胎小图 -->
  <ellipse cx="100" cy="88" rx="24" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="92" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">旧胎</text>
  <path d="M128,88 L176,88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="74" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">换胎</text>
  <text x="152" y="108" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">changeTime 秒</text>
  <ellipse cx="204" cy="88" rx="24" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="92" text-anchor="middle" font-size="9.5" fill="#2e5b2e" filter="url(#rough2)">新胎</text>
  <text x="152" y="126" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">同款也行 ⇒ 计时清零</text>

  <!-- 提示框 -->
  <rect x="340" y="58" width="262" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="471" y="78" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">r ≥ 2 ⇒ 每圈至少翻倍</text>
  <text x="471" y="96" text-anchor="middle" font-size="9" fill="#7a5415" filter="url(#rough2)">第 x 圈耗时 f·r^(x−1)，指数级膨胀</text>

  <!-- 换胎成本线 -->
  <path d="M60,183 L600,183" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="66" y="176" font-size="10" fill="#b85450" filter="url(#rough2)">changeTime + f ≤ 2×10⁵（换胎 + 同款新胎跑第 1 圈）</text>

  <!-- 柱状图 -->
  <rect x="70" y="358" width="20" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="98" y="352" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="126" y="344" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="154" y="334" width="20" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="182" y="322" width="20" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="308" width="20" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="238" y="292" width="20" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="266" y="274" width="20" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="294" y="254" width="20" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="322" y="240" width="20" height="126" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="228" width="20" height="138" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="378" y="218" width="20" height="148" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="406" y="210" width="20" height="156" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="434" y="208" width="20" height="162" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="462" y="204" width="20" height="166" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="490" y="201" width="20" height="169" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="518" y="199" width="20" height="171" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="546" y="197" width="20" height="173" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="574" y="135" width="20" height="235" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- 数值标签 -->
  <text x="80" y="352" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="192" y="316" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">16</text>
  <text x="332" y="234" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">512</text>
  <text x="472" y="198" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">16384</text>
  <text x="556" y="193" text-anchor="middle" font-size="8" fill="#2e5b2e" filter="url(#rough2)">131072</text>
  <text x="584" y="130" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">262144</text>
  <text x="584" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="566" y="152" text-anchor="end" font-size="8.5" fill="#b85450" filter="url(#rough2)">连跑必劣于换新胎</text>

  <!-- 横轴 -->
  <path d="M60,370 L600,370" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="80" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">1</text>
  <text x="108" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">2</text>
  <text x="136" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">3</text>
  <text x="164" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">4</text>
  <text x="192" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">5</text>
  <text x="220" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">6</text>
  <text x="248" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">7</text>
  <text x="276" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">8</text>
  <text x="304" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">9</text>
  <text x="332" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">10</text>
  <text x="360" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">11</text>
  <text x="388" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">12</text>
  <text x="416" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">13</text>
  <text x="444" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">14</text>
  <text x="472" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">15</text>
  <text x="500" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">16</text>
  <text x="528" y="384" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">17</text>
  <text x="556" y="384" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">18</text>
  <text x="584" y="384" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">19</text>
  <text x="330" y="398" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">同一条轮胎连续跑的第 x 圈</text>
  <text x="330" y="410" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">（柱高仅为示意；数值按 (f, r) = (1, 2) 标注：第 x 圈 = 2^(x−1)）</text>

  <!-- 结论 -->
  <rect x="60" y="420" width="540" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">结论：连续第 19 圈耗时 ≥ 2^18 = 262144 &gt; 2×10⁵，必劣于换新胎</text>
  <text x="330" y="458" text-anchor="middle" font-size="10" fill="#2e5b2e" filter="url(#rough2)">⇒ 最优解每段 ≤ 18 圈：只需 best[x]（x ≤ min(numLaps, 18)）+ 分段 DP</text>
</svg>
