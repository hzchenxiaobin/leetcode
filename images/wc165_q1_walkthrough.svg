<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：第 5 手落下时 diag[A] 恰好到 3</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">moves = [[0,0],[2,0],[1,1],[2,1],[2,2]]，编号 = 落子顺序</text>

  <g filter="url(#rough2)">
    <rect x="50" y="110" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="120" y="110" width="70" height="70" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <rect x="190" y="110" width="70" height="70" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <rect x="50" y="180" width="70" height="70" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <rect x="120" y="180" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="190" y="180" width="70" height="70" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <rect x="50" y="250" width="70" height="70" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <rect x="120" y="250" width="70" height="70" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <rect x="190" y="250" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
  </g>

  <text x="59" y="128" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="87" y="168" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">X</text>
  <text x="129" y="198" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="157" y="238" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">X</text>
  <text x="59" y="268" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="87" y="308" text-anchor="middle" font-size="22" fill="#b85450" font-weight="bold" filter="url(#rough2)">O</text>
  <text x="129" y="268" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="157" y="308" text-anchor="middle" font-size="22" fill="#b85450" font-weight="bold" filter="url(#rough2)">O</text>
  <text x="199" y="268" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="227" y="308" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">X</text>

  <text x="155" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">绿色三格 = A 的主对角线</text>

  <text x="290" y="100" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">计数轨迹（只列被改动的那几个）</text>

  <text x="290" y="128" font-size="10" fill="#444" filter="url(#rough2)">① A (0,0)   row0=1 col0=1 diag=1</text>
  <text x="290" y="154" font-size="10" fill="#444" filter="url(#rough2)">② B (2,0)   row2=1 col0=1</text>
  <text x="290" y="180" font-size="10" fill="#444" filter="url(#rough2)">③ A (1,1)   row1=1 col1=1 diag=2 anti=1</text>
  <text x="290" y="206" font-size="10" fill="#444" filter="url(#rough2)">④ B (2,1)   row2=2 col1=2</text>

  <rect x="286" y="214" width="252" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="232" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">⑤ A (2,2)   diag=3  ← 命中，返回 “A”</text>

  <text x="290" y="266" font-size="10" fill="#555" filter="url(#rough2)">diag[A] 0 → 1 → 2 → 3：主对角线</text>
  <text x="290" y="282" font-size="10" fill="#555" filter="url(#rough2)">(0,0) (1,1) (2,2) 三格全归 A</text>
  <text x="290" y="308" font-size="10" fill="#555" filter="url(#rough2)">第 5 手刚落子，游戏即刻结束，</text>
  <text x="290" y="324" font-size="10" fill="#555" filter="url(#rough2)">剩下的 4 个空格不再有人落子</text>

  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">对照暴力：扫 8 条线 × 3 格 = 24 次比较；计数法每手只比较 4 个整数</text>
</svg>
