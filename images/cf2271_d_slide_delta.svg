<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>

  <text x="350" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">窗口右移一格：只有「离开的 s」与「进入的 s+m」会变</text>
  <text x="350" y="54" text-anchor="middle" font-size="12.5" fill="#7a7a7a" filter="url(#rough2)">f(s+1) − f(s) = cov(s+m) − cov(s)，cov(x) 表示位置 x 是否被感染</text>

  <!-- 位置格子：1..11 -->
  <g filter="url(#rough2)">
    <rect x="60" y="130" width="48" height="30" rx="5" fill="#f1f1f1" stroke="#bbbbbb" stroke-width="1.5"/>
    <rect x="112" y="130" width="48" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="164" y="130" width="48" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="216" y="130" width="48" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="268" y="130" width="48" height="30" rx="5" fill="#f1f1f1" stroke="#bbbbbb" stroke-width="1.5"/>
    <rect x="320" y="130" width="48" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="372" y="130" width="48" height="30" rx="5" fill="#f1f1f1" stroke="#bbbbbb" stroke-width="1.5"/>
    <rect x="424" y="130" width="48" height="30" rx="5" fill="#f1f1f1" stroke="#bbbbbb" stroke-width="1.5"/>
    <rect x="476" y="130" width="48" height="30" rx="5" fill="#f1f1f1" stroke="#bbbbbb" stroke-width="1.5"/>
    <rect x="528" y="130" width="48" height="30" rx="5" fill="#f1f1f1" stroke="#bbbbbb" stroke-width="1.5"/>
    <rect x="580" y="130" width="48" height="30" rx="5" fill="#f1f1f1" stroke="#bbbbbb" stroke-width="1.5"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333">
    <text x="84" y="151" filter="url(#rough2)">1</text>
    <text x="136" y="151" filter="url(#rough2)">2</text>
    <text x="188" y="151" filter="url(#rough2)">3</text>
    <text x="240" y="151" filter="url(#rough2)">4</text>
    <text x="292" y="151" filter="url(#rough2)">5</text>
    <text x="344" y="151" filter="url(#rough2)">6</text>
    <text x="396" y="151" filter="url(#rough2)">7</text>
    <text x="448" y="151" filter="url(#rough2)">8</text>
    <text x="500" y="151" filter="url(#rough2)">9</text>
    <text x="552" y="151" filter="url(#rough2)">10</text>
    <text x="604" y="151" filter="url(#rough2)">11</text>
  </g>
  <text x="640" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">绿色 = 感染</text>

  <!-- 窗口 A -->
  <rect x="158" y="88" width="216" height="34" rx="8" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="266" y="110" text-anchor="middle" font-size="12.5" fill="#33517a" filter="url(#rough2)">窗口 A：起点 s，m = 4</text>

  <!-- 窗口 B -->
  <rect x="210" y="190" width="216" height="34" rx="8" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="318" y="212" text-anchor="middle" font-size="12.5" fill="#a0761e" filter="url(#rough2)">窗口 B：起点 s+1</text>

  <!-- 离开 / 进入 标记 -->
  <path d="M188,163 L188,174" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="188" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">离开 s = 3</text>
  <path d="M396,163 L396,174" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">进入 s+m = 7</text>
  <text x="188" y="246" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">cov(3) = 1 ⇒ 贡献 −1</text>
  <text x="470" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">cov(7) = 0 ⇒ 贡献 0</text>

  <!-- 公式框 -->
  <rect x="40" y="256" width="620" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="280" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">d(s) = cov(s+m) − cov(s) ∈ { −1, 0, +1 }</text>
  <text x="350" y="301" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">本例 d = 0 − 1 = −1：f 从 3 掉到 2；若两端都没感染则 d = 0，f 不变</text>

  <!-- 结论框 -->
  <rect x="40" y="326" width="620" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="350" text-anchor="middle" font-size="13" fill="#a0761e" filter="url(#rough2)">每次一步只走 1 ⇒ f 的取值不会跳变，可达集合是连续的 [0, max f]</text>
  <text x="350" y="370" text-anchor="middle" font-size="12" fill="#8d6a1f" filter="url(#rough2)">所以答案存在 ⟺ k ≤ max f(s)；样例 2 里 max f = 2 &lt; k = 3，故输出 −1</text>
</svg>
