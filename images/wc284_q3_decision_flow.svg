<svg xmlns="http://www.w3.org/2000/svg" width="620" height="555" viewBox="0 0 620 555" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#556" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="620" height="555" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">决策流程：三个小特判 + 一个通用式</text>
  <path d="M 160 44 Q 310 54 460 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 起点 -->
  <g filter="url(#sk)">
    <rect x="160" y="54" width="140" height="40" rx="10" fill="#f4f4ee" stroke="#555" stroke-width="1.8"/>
  </g>
  <text x="230" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">输入 nums, k</text>
  <path d="M 230 94 L 230 110" stroke="#556" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- k=0? -->
  <g filter="url(#sk)">
    <polygon points="230,114 300,146 230,178 160,146" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="230" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">k = 0 ?</text>
  <path d="M 300 146 L 420 146" stroke="#556" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="345" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="424" y="124" width="150" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="499" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 nums[0]</text>
  <path d="M 230 178 L 230 198" stroke="#556" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="242" y="194" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">否</text>

  <!-- n=1? -->
  <g filter="url(#sk)">
    <polygon points="230,202 310,238 230,274 150,238" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="230" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">n = 1 ?</text>
  <path d="M 310 238 L 380 238" stroke="#556" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="342" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="384" y="212" width="196" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="482" y="232" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">k 为奇 → 返回 −1</text>
  <text x="482" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">k 为偶 → 返回 nums[0]</text>
  <text x="482" y="286" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">（−1 只在 n=1 且 k 奇时出现）</text>
  <path d="M 230 274 L 230 296" stroke="#556" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="242" y="292" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">否</text>

  <!-- k=1? -->
  <g filter="url(#sk)">
    <polygon points="230,300 300,332 230,364 160,332" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="230" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">k = 1 ?</text>
  <path d="M 300 332 L 380 332" stroke="#556" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="342" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="384" y="310" width="150" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="459" y="331" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 nums[1]</text>
  <text x="459" y="348" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">（n ≥ 2 上面已保证）</text>
  <path d="M 230 364 L 230 384" stroke="#556" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="242" y="380" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">否</text>

  <!-- 通用式 -->
  <g filter="url(#sk)">
    <rect x="90" y="388" width="280" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="230" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">通用式（k ≥ 2，n ≥ 2）</text>
  <text x="230" y="430" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">best = max(nums[0 .. min(k−2, n−1)])</text>
  <text x="230" y="448" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">若 k &lt; n：best = max(best, nums[k])</text>
  <text x="230" y="466" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">上界必须 clamp 到 n：k 可达 10⁹</text>
  <path d="M 230 476 L 230 490" stroke="#556" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="160" y="494" width="140" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="230" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 best</text>
</svg>
