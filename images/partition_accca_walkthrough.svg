<svg xmlns="http://www.w3.org/2000/svg" width="520" height="470" viewBox="0 0 520 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ao" markerWidth="7.5" markerHeight="7.5" refX="5.5" refY="3.75" orient="auto">
      <path d="M0,0 L7.5,3.75 L0,7.5 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="520" height="470" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15.5" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">示例 1 演算：s = accca, k = 2，把 s[2] 改成 b</text>
  <path d="M 150 40 Q 260 47 370 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="70" y="76" font-size="11" fill="#666" filter="url(#sk)">原串：</text>
  <rect x="140" y="58" width="44" height="36" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="184" y="58" width="44" height="36" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="228" y="58" width="44" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <rect x="272" y="58" width="44" height="36" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="316" y="58" width="44" height="36" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <text x="162" y="81" text-anchor="middle" font-size="14" fill="#666" filter="url(#sk)">a</text>
  <text x="206" y="81" text-anchor="middle" font-size="14" fill="#666" filter="url(#sk)">c</text>
  <text x="250" y="81" text-anchor="middle" font-size="14" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">c</text>
  <text x="294" y="81" text-anchor="middle" font-size="14" fill="#666" filter="url(#sk)">c</text>
  <text x="338" y="81" text-anchor="middle" font-size="14" fill="#666" filter="url(#sk)">a</text>
  <path d="M 250 52 L 250 56" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <text x="404" y="72" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">改 → b</text>

  <text x="70" y="150" font-size="11" fill="#666" filter="url(#sk)">改后：</text>
  <rect x="134" y="130" width="98" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <rect x="234" y="130" width="98" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <rect x="334" y="130" width="48" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="162" y="155" text-anchor="middle" font-size="14" fill="#33506e" font-weight="bold" filter="url(#sk)">a</text>
  <text x="206" y="155" text-anchor="middle" font-size="14" fill="#33506e" font-weight="bold" filter="url(#sk)">c</text>
  <text x="250" y="155" text-anchor="middle" font-size="14" fill="#2f5a25" font-weight="bold" filter="url(#sk)">b</text>
  <text x="294" y="155" text-anchor="middle" font-size="14" fill="#2f5a25" font-weight="bold" filter="url(#sk)">c</text>
  <text x="338" y="155" text-anchor="middle" font-size="14" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">a</text>
  <text x="183" y="186" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#sk)">段 1：{a,c}</text>
  <text x="283" y="186" text-anchor="middle" font-size="10.5" fill="#2f5a25" font-weight="bold" filter="url(#sk)">段 2：{b,c}</text>
  <text x="358" y="186" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">段 3：{a}</text>
  <text x="140" y="212" font-size="10.5" fill="#666" filter="url(#sk)">不修改时 {a,c} ≤ 2 种字符，整串 1 段；修改让边界在 i=2、i=4 提前出现</text>

  <rect x="46" y="228" width="428" height="27" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="76" y="246" font-size="11" fill="#33506e" font-weight="bold" filter="url(#sk)">i</text>
  <text x="130" y="246" font-size="11" fill="#33506e" font-weight="bold" filter="url(#sk)">字符</text>
  <text x="228" y="246" font-size="11" fill="#33506e" font-weight="bold" filter="url(#sk)">动作</text>
  <text x="352" y="246" font-size="11" fill="#33506e" font-weight="bold" filter="url(#sk)">mask</text>
  <text x="434" y="246" font-size="11" fill="#33506e" font-weight="bold" filter="url(#sk)">计数</text>

  <rect x="46" y="259" width="428" height="24" rx="4" fill="none" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <text x="76" y="276" font-size="11" fill="#333" filter="url(#sk)">0</text>
  <text x="130" y="276" font-size="11" fill="#333" filter="url(#sk)">a</text>
  <text x="228" y="276" font-size="11" fill="#333" filter="url(#sk)">并入（|mask|=0 &lt; 2）</text>
  <text x="352" y="276" font-size="11" fill="#446688" filter="url(#sk)">{a}</text>
  <text x="434" y="276" font-size="11" fill="#333" filter="url(#sk)">—</text>

  <rect x="46" y="287" width="428" height="24" rx="4" fill="none" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <text x="76" y="304" font-size="11" fill="#333" filter="url(#sk)">1</text>
  <text x="130" y="304" font-size="11" fill="#333" filter="url(#sk)">c</text>
  <text x="228" y="304" font-size="11" fill="#333" filter="url(#sk)">并入（|mask|=1 &lt; 2）</text>
  <text x="352" y="304" font-size="11" fill="#446688" filter="url(#sk)">{a,c}</text>
  <text x="434" y="304" font-size="11" fill="#333" filter="url(#sk)">—</text>

  <rect x="46" y="315" width="428" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="76" y="332" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">2</text>
  <text x="130" y="332" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">c→b</text>
  <text x="228" y="332" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">改字！b∉mask 且 |mask|=2=k ⇒ 开新段</text>
  <text x="352" y="332" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">{b}</text>
  <text x="434" y="332" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">+1</text>

  <rect x="46" y="343" width="428" height="24" rx="4" fill="none" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <text x="76" y="360" font-size="11" fill="#333" filter="url(#sk)">3</text>
  <text x="130" y="360" font-size="11" fill="#333" filter="url(#sk)">c</text>
  <text x="228" y="360" font-size="11" fill="#333" filter="url(#sk)">并入（|mask|=1 &lt; 2）</text>
  <text x="352" y="360" font-size="11" fill="#2f5a25" filter="url(#sk)">{b,c}</text>
  <text x="434" y="360" font-size="11" fill="#333" filter="url(#sk)">—</text>

  <rect x="46" y="371" width="428" height="24" rx="4" fill="none" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <text x="76" y="388" font-size="11" fill="#333" filter="url(#sk)">4</text>
  <text x="130" y="388" font-size="11" fill="#333" filter="url(#sk)">a</text>
  <text x="228" y="388" font-size="11" fill="#333" filter="url(#sk)">a∉mask 且 |mask|=2=k ⇒ 开新段</text>
  <text x="352" y="388" font-size="11" fill="#446688" filter="url(#sk)">{a}</text>
  <text x="434" y="388" font-size="11" fill="#333" font-weight="bold" filter="url(#sk)">+1</text>

  <rect x="46" y="399" width="428" height="24" rx="4" fill="none" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <text x="76" y="416" font-size="11" fill="#333" filter="url(#sk)">5</text>
  <text x="130" y="416" font-size="11" fill="#333" filter="url(#sk)">末端</text>
  <text x="228" y="416" font-size="11" fill="#333" filter="url(#sk)">dfs 返回 1：最后一段收尾</text>
  <text x="352" y="416" font-size="11" fill="#999" filter="url(#sk)">—</text>
  <text x="434" y="416" font-size="11" fill="#333" font-weight="bold" filter="url(#sk)">+1</text>

  <rect x="46" y="431" width="428" height="28" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="260" y="450" text-anchor="middle" font-size="12.5" fill="#2f5a25" font-weight="bold" filter="url(#sk)">合计 1 + 1 + 1 = 3，与官方答案一致 ✓</text>
</svg>
