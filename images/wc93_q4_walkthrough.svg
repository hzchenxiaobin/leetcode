<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="680" height="390" fill="#fafafa"/>

  <text x="22" y="32" font-size="16" fill="#333" filter="url(#rough2)">示例演算：target=100，startFuel=10，站点 [10,60] [20,30] [30,30] [60,40]</text>

  <rect x="24" y="48" width="632" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="44" y="69" font-size="12" fill="#2c4a63" filter="url(#rough2)">处理</text>
  <text x="150" y="69" font-size="12" fill="#2c4a63" filter="url(#rough2)">pos / gas</text>
  <text x="300" y="69" font-size="12" fill="#2c4a63" filter="url(#rough2)">fuel 变化</text>
  <text x="470" y="69" font-size="12" fill="#2c4a63" filter="url(#rough2)">堆内油量</text>
  <text x="590" y="69" font-size="12" fill="#2c4a63" filter="url(#rough2)">ans</text>

  <rect x="24" y="82" width="632" height="36" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="44" y="105" font-size="12" fill="#444" filter="url(#rough2)">站 1</text>
  <text x="150" y="105" font-size="12" fill="#444" filter="url(#rough2)">10 / 60</text>
  <text x="300" y="105" font-size="12" fill="#444" filter="url(#rough2)">10 − 10 = 0</text>
  <text x="470" y="105" font-size="12" fill="#444" filter="url(#rough2)">{60}</text>
  <text x="596" y="105" font-size="12" fill="#444" filter="url(#rough2)">0</text>

  <rect x="24" y="120" width="632" height="36" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="44" y="143" font-size="12" fill="#444" filter="url(#rough2)">站 2</text>
  <text x="150" y="143" font-size="12" fill="#444" filter="url(#rough2)">20 / 30</text>
  <text x="300" y="143" font-size="12" fill="#444" filter="url(#rough2)">0 − 10 = −10 → 弹出 60，变 50</text>
  <text x="470" y="143" font-size="12" fill="#444" filter="url(#rough2)">{30}</text>
  <text x="596" y="143" font-size="12" fill="#444" filter="url(#rough2)">1</text>

  <rect x="24" y="158" width="632" height="36" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="44" y="181" font-size="12" fill="#444" filter="url(#rough2)">站 3</text>
  <text x="150" y="181" font-size="12" fill="#444" filter="url(#rough2)">30 / 30</text>
  <text x="300" y="181" font-size="12" fill="#444" filter="url(#rough2)">50 − 10 = 40</text>
  <text x="470" y="181" font-size="12" fill="#444" filter="url(#rough2)">{30, 30}</text>
  <text x="596" y="181" font-size="12" fill="#444" filter="url(#rough2)">1</text>

  <rect x="24" y="196" width="632" height="36" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="44" y="219" font-size="12" fill="#444" filter="url(#rough2)">站 4</text>
  <text x="150" y="219" font-size="12" fill="#444" filter="url(#rough2)">60 / 40</text>
  <text x="300" y="219" font-size="12" fill="#444" filter="url(#rough2)">40 − 30 = 10</text>
  <text x="470" y="219" font-size="12" fill="#444" filter="url(#rough2)">{40, 30, 30}</text>
  <text x="596" y="219" font-size="12" fill="#444" filter="url(#rough2)">1</text>

  <rect x="24" y="234" width="632" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="44" y="257" font-size="12" fill="#8a6410" filter="url(#rough2)">终点</text>
  <text x="150" y="257" font-size="12" fill="#8a6410" filter="url(#rough2)">100</text>
  <text x="300" y="257" font-size="12" fill="#8a6410" filter="url(#rough2)">10 − 40 = −30 → 弹出 40，变 10</text>
  <text x="470" y="257" font-size="12" fill="#8a6410" filter="url(#rough2)">{30, 30}</text>
  <text x="596" y="257" font-size="12" fill="#8a6410" filter="url(#rough2)">2</text>

  <text x="24" y="300" font-size="13" fill="#333" filter="url(#rough2)">最终 fuel = 10 ≥ 0，最少加油 2 次：在 10 英里处加 60，在 60 英里处加 40</text>

  <rect x="24" y="314" width="300" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="174" y="336" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">对比：DP 解法 dp[i] = 加 i 次油的最远距离</text>
  <text x="174" y="356" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">同样得到 2，但复杂度 O(n²) 而非 O(n log n)</text>

  <rect x="344" y="314" width="312" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="336" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">注意：堆里存的是「已路过、尚未加」的油</text>
  <text x="500" y="356" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">每站只入堆一次，弹出即代表「补记加油」</text>
</svg>
