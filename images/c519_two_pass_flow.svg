<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">两遍扫描:先全体行左移,再全体列上移</text>
  <text x="320" y="54" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">顺序固定「先行后列」,两种移位不可交换(题目规定)</text>

  <!-- grid -->
  <text x="86" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">grid</text>
  <rect x="40" y="96" width="24" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="66" y="96" width="24" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="92" y="96" width="24" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="40" y="118" width="24" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="66" y="118" width="24" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="92" y="118" width="24" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="40" y="140" width="24" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="66" y="140" width="24" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="92" y="140" width="24" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="86" y="180" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">输入</text>

  <!-- 箭头1 -->
  <path d="M 126 128 L 258 128" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="192" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">第一遍:每行左移</text>
  <text x="192" y="150" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">tmp[i][j] =</text>
  <text x="192" y="164" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">grid[i][(j+rowShift[i]) % n]</text>

  <!-- tmp -->
  <text x="309" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">tmp</text>
  <rect x="270" y="96" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="296" y="96" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="322" y="96" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="334" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="270" y="118" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="296" y="118" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="322" y="118" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="334" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="270" y="140" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="296" y="140" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="322" y="140" width="24" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="334" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="309" y="180" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">行移位后</text>

  <!-- 箭头2 -->
  <path d="M 356 128 L 488 128" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="422" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第二遍:每列上移</text>
  <text x="422" y="150" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ans[i][j] =</text>
  <text x="422" y="164" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">tmp[(i+colShift[j]) % n][j]</text>

  <!-- ans -->
  <text x="538" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">ans</text>
  <rect x="500" y="96" width="24" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="512" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="526" y="96" width="24" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="538" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="552" y="96" width="24" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="564" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="500" y="118" width="24" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="512" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="526" y="118" width="24" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="538" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="552" y="118" width="24" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="564" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <rect x="500" y="140" width="24" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="512" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="526" y="140" width="24" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="538" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="552" y="140" width="24" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="564" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="538" y="180" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">输出</text>

  <!-- 警告框 -->
  <rect x="40" y="212" width="560" height="124" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="240" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠ 若合成一遍:ans[i][j] = grid[r][…],来源行 r = (i+colShift[j]) % n</text>
  <text x="58" y="266" font-size="11" fill="#555" filter="url(#rough2)">生效的行移位是 rowShift[r] 而非 rowShift[i] —— 列移位搬的是「已行移位的行」</text>
  <text x="58" y="290" font-size="11" fill="#555" filter="url(#rough2)">例(示例 2):ans[0][0] ← tmp[2][0] = 7,这一格的行移位用 rowShift[2] = 0</text>
  <text x="58" y="314" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">两遍扫描天然规避此坑,比赛首选</text>
</svg>
