<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 366" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="366" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">回溯骨架：剪枝 → 终点判定 → 标记 → 递归 → 撤销</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">标记借用障碍值 −1，恢复时用 saved 存回原值（起点是 1）</text>
  <rect x="40" y="66" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="160.0" y="88.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dfs(r, c, todo)</text>
  <rect x="40" y="122" width="240" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="160.0" y="142.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">越界 或 grid == −1 ?</text>
  <rect x="40" y="176" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="160.0" y="196.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">grid == 2（终点）?</text>
  <rect x="40" y="230" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="160.0" y="250.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">标记 −1，四向递归 todo−1</text>
  <rect x="40" y="284" width="240" height="34" fill="#f3e8fd" stroke="#7a5ea8" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="160.0" y="304.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">恢复原值，返回累加和</text>
  <path d="M 160 102 L 160 120" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 160 156 L 160 174" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 160 210 L 160 228" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 160 264 L 160 282" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="136" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">return 0</text>
  <text x="300" y="190" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">return todo == 0</text>
  <path d="M 282 139 L 292 139" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 282 193 L 292 193" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="250" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">四个方向各算一次</text>
  <text x="300" y="270" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">任何一条分支失败都只是加 0</text>
  <rect x="300" y="296" width="236" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="310" y="316.5" font-size="10.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">恢复现场必须有：多条路径共用同一网格</text>
</svg>
