<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">乘积的不同质因数 = 各元素质因数的「并集」</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- element boxes -->
  <text x="230" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">逐元素单独分解（试除只需枚举到 √nums[i] ≤ √1000 ≈ 32）</text>
  <g filter="url(#sk)">
    <rect x="46" y="80" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="110" y="80" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="174" y="80" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="238" y="80" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="302" y="80" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="366" y="80" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="72" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">2</text>
  <text x="136" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">4</text>
  <text x="200" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">3</text>
  <text x="264" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">7</text>
  <text x="328" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">10</text>
  <text x="392" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">6</text>
  <g filter="url(#sk)">
    <text x="72" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2</text>
    <text x="136" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2×2</text>
    <text x="200" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a">3</text>
    <text x="264" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a">7</text>
    <text x="328" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2×5</text>
    <text x="392" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2×3</text>
  </g>

  <!-- arrows down to union set -->
  <g filter="url(#sk)">
    <path d="M 72 138 Q 72 168 128 184" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <path d="M 136 138 Q 136 162 150 180" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <path d="M 200 138 Q 200 164 176 182" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <path d="M 264 138 Q 264 166 208 184" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <path d="M 328 138 Q 328 164 232 182" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <path d="M 392 138 Q 392 170 256 186" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="340" y="152" text-anchor="middle" font-size="10" fill="#888">质因子丢进哈希集合（重数自动丢弃）</text>

  <!-- union set -->
  <g filter="url(#sk)">
    <ellipse cx="192" cy="238" rx="118" ry="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="192" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">并集（set 去重）</text>
  <g filter="url(#sk)">
    <ellipse cx="130" cy="246" rx="21" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <ellipse cx="170" cy="252" rx="21" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <ellipse cx="210" cy="252" rx="21" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <ellipse cx="250" cy="246" rx="21" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="130" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">2</text>
  <text x="170" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">3</text>
  <text x="210" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">5</text>
  <text x="250" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">7</text>
  <text x="192" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回集合大小 = 4 ✓</text>

  <!-- right: product warning -->
  <g filter="url(#sk)">
    <rect x="440" y="80" width="212" height="108" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="546" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">校验（不是算法步骤）</text>
  <text x="546" y="126" text-anchor="middle" font-size="11" fill="#444">P = 2·4·3·7·10·6 = 10080</text>
  <text x="546" y="146" text-anchor="middle" font-size="11" fill="#444">= 2⁵ · 3² · 5 · 7</text>
  <text x="546" y="170" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">不同质因数恰为 {2,3,5,7}</text>

  <g filter="url(#sk)">
    <rect x="440" y="206" width="212" height="120" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="546" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">⚠ 别真去算乘积！</text>
  <text x="546" y="252" text-anchor="middle" font-size="10.5" fill="#555">n = 10⁴ 时 P ≤ 1000^(10⁴)</text>
  <text x="546" y="270" text-anchor="middle" font-size="10.5" fill="#555">= 10^30000，约 3 万位的大数</text>
  <text x="546" y="290" text-anchor="middle" font-size="10.5" fill="#555">64 位整数只装得下 19 位，</text>
  <text x="546" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">分解大数更是天文开销</text>

  <!-- key insight -->
  <g filter="url(#sk)">
    <rect x="40" y="344" width="600" height="62" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="58" y="368" font-size="12" font-weight="bold" fill="#2b2b2b">关键观察（算术基本定理）：某质数 p 只要出现在任一 nums[i] 的分解里，就出现在乘积 P 的分解里；</text>
  <text x="58" y="390" font-size="11.5" fill="#444">「种类」是并集、「重数」才累加——题目只问种类，于是「分解大乘积」被降为「分解一堆小数」。</text>
</svg>
