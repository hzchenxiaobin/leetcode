<svg xmlns="http://www.w3.org/2000/svg" width="660" height="372" viewBox="0 0 660 372" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="660" height="372" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：rectangles = [[4,8],[3,6],[10,20],[15,30]]</text>
  <path d="M 130 40 Q 330 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header row -->
  <g filter="url(#sk)" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3">
    <rect x="26" y="58" width="38" height="30" rx="4"/>
    <rect x="66" y="58" width="64" height="30" rx="4"/>
    <rect x="132" y="58" width="86" height="30" rx="4"/>
    <rect x="220" y="58" width="86" height="30" rx="4"/>
    <rect x="308" y="58" width="98" height="30" rx="4"/>
    <rect x="408" y="58" width="78" height="30" rx="4"/>
    <rect x="488" y="58" width="64" height="30" rx="4"/>
    <rect x="554" y="58" width="80" height="30" rx="4"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="45" y="77">步骤</text>
    <text x="98" y="77">矩形</text>
    <text x="175" y="77">g=gcd(w,h)</text>
    <text x="263" y="77">(w/g, h/g)</text>
    <text x="357" y="77">入组前 count</text>
    <text x="447" y="77">ans 增加</text>
    <text x="520" y="77">累计 ans</text>
    <text x="594" y="77">count 更新后</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)" fill="#ffffff" stroke="#b9b3a8" stroke-width="1.1">
    <rect x="26" y="90" width="38" height="42" rx="4"/>
    <rect x="66" y="90" width="64" height="42" rx="4"/>
    <rect x="132" y="90" width="86" height="42" rx="4"/>
    <rect x="220" y="90" width="86" height="42" rx="4"/>
    <rect x="308" y="90" width="98" height="42" rx="4"/>
    <rect x="408" y="90" width="78" height="42" rx="4" fill="#fef6e6" stroke="#d6a040"/>
    <rect x="488" y="90" width="64" height="42" rx="4"/>
    <rect x="554" y="90" width="80" height="42" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="45" y="116" font-size="14" font-weight="bold" fill="#555">①</text>
    <text x="98" y="116" font-size="12" font-family="monospace" fill="#333">[4,8]</text>
    <text x="175" y="116" font-size="12" font-family="monospace" fill="#333">4</text>
    <text x="263" y="116" font-size="12" font-weight="bold" font-family="monospace" fill="#7a5415">(1,2)</text>
    <text x="357" y="116" font-size="12" font-family="monospace" fill="#333">0</text>
    <text x="447" y="116" font-size="12.5" font-weight="bold" font-family="monospace" fill="#c98a2b">+0</text>
    <text x="520" y="116" font-size="12.5" font-weight="bold" font-family="monospace" fill="#2e6e2e">0</text>
    <text x="594" y="116" font-size="10.5" font-family="monospace" fill="#666">{(1,2):1}</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#sk)" fill="#fdfcf7" stroke="#b9b3a8" stroke-width="1.1">
    <rect x="26" y="134" width="38" height="42" rx="4"/>
    <rect x="66" y="134" width="64" height="42" rx="4"/>
    <rect x="132" y="134" width="86" height="42" rx="4"/>
    <rect x="220" y="134" width="86" height="42" rx="4"/>
    <rect x="308" y="134" width="98" height="42" rx="4"/>
    <rect x="408" y="134" width="78" height="42" rx="4" fill="#fef6e6" stroke="#d6a040"/>
    <rect x="488" y="134" width="64" height="42" rx="4"/>
    <rect x="554" y="134" width="80" height="42" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="45" y="160" font-size="14" font-weight="bold" fill="#555">②</text>
    <text x="98" y="160" font-size="12" font-family="monospace" fill="#333">[3,6]</text>
    <text x="175" y="160" font-size="12" font-family="monospace" fill="#333">3</text>
    <text x="263" y="160" font-size="12" font-weight="bold" font-family="monospace" fill="#7a5415">(1,2)</text>
    <text x="357" y="160" font-size="12" font-family="monospace" fill="#333">1</text>
    <text x="447" y="160" font-size="12.5" font-weight="bold" font-family="monospace" fill="#c98a2b">+1</text>
    <text x="520" y="160" font-size="12.5" font-weight="bold" font-family="monospace" fill="#2e6e2e">1</text>
    <text x="594" y="160" font-size="10.5" font-family="monospace" fill="#666">{(1,2):2}</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#sk)" fill="#ffffff" stroke="#b9b3a8" stroke-width="1.1">
    <rect x="26" y="178" width="38" height="42" rx="4"/>
    <rect x="66" y="178" width="64" height="42" rx="4"/>
    <rect x="132" y="178" width="86" height="42" rx="4"/>
    <rect x="220" y="178" width="86" height="42" rx="4"/>
    <rect x="308" y="178" width="98" height="42" rx="4"/>
    <rect x="408" y="178" width="78" height="42" rx="4" fill="#fef6e6" stroke="#d6a040"/>
    <rect x="488" y="178" width="64" height="42" rx="4"/>
    <rect x="554" y="178" width="80" height="42" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="45" y="204" font-size="14" font-weight="bold" fill="#555">③</text>
    <text x="98" y="204" font-size="12" font-family="monospace" fill="#333">[10,20]</text>
    <text x="175" y="204" font-size="12" font-family="monospace" fill="#333">10</text>
    <text x="263" y="204" font-size="12" font-weight="bold" font-family="monospace" fill="#7a5415">(1,2)</text>
    <text x="357" y="204" font-size="12" font-family="monospace" fill="#333">2</text>
    <text x="447" y="204" font-size="12.5" font-weight="bold" font-family="monospace" fill="#c98a2b">+2</text>
    <text x="520" y="204" font-size="12.5" font-weight="bold" font-family="monospace" fill="#2e6e2e">3</text>
    <text x="594" y="204" font-size="10.5" font-family="monospace" fill="#666">{(1,2):3}</text>
  </g>

  <!-- row 4 -->
  <g filter="url(#sk)" fill="#fdfcf7" stroke="#b9b3a8" stroke-width="1.1">
    <rect x="26" y="222" width="38" height="42" rx="4"/>
    <rect x="66" y="222" width="64" height="42" rx="4"/>
    <rect x="132" y="222" width="86" height="42" rx="4"/>
    <rect x="220" y="222" width="86" height="42" rx="4"/>
    <rect x="308" y="222" width="98" height="42" rx="4"/>
    <rect x="408" y="222" width="78" height="42" rx="4" fill="#fdf1e3" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="488" y="222" width="64" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="554" y="222" width="80" height="42" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="45" y="248" font-size="14" font-weight="bold" fill="#555">④</text>
    <text x="98" y="248" font-size="12" font-family="monospace" fill="#333">[15,30]</text>
    <text x="175" y="248" font-size="12" font-family="monospace" fill="#333">15</text>
    <text x="263" y="248" font-size="12" font-weight="bold" font-family="monospace" fill="#7a5415">(1,2)</text>
    <text x="357" y="248" font-size="12" font-family="monospace" fill="#333">3</text>
    <text x="447" y="248" font-size="12.5" font-weight="bold" font-family="monospace" fill="#c98a2b">+3</text>
    <text x="520" y="248" font-size="13" font-weight="bold" font-family="monospace" fill="#2e6e2e">6</text>
    <text x="594" y="248" font-size="10.5" font-family="monospace" fill="#666">{(1,2):4}</text>
  </g>

  <!-- bottom banner -->
  <g filter="url(#sk)">
    <rect x="26" y="274" width="608" height="44" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="330" y="295" text-anchor="middle" font-size="13.5" font-weight="bold" font-family="monospace" fill="#7a5415">ans = 0+1+2+3 = 6 = C(4,2) = 4×3/2 ✓</text>
  <text x="330" y="312" text-anchor="middle" font-size="10.5" fill="#888">四个矩形尺寸各异，但宽高比均为 1:2，GCD 归一化后落入同一组</text>

  <text x="330" y="344" text-anchor="middle" font-size="10.5" fill="#999">每一步 ans += 入组前 count：新矩形与组内每个已有矩形恰好配成一对</text>
</svg>
