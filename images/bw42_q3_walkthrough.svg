<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="45"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算："000110" 的 0 会师过程</text>

  <!-- 行 1 -->
  <text x="80" y="72" font-size="14" fill="#446688" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="160" y="56" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="194" y="56" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="56" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="56" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="296" y="56" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="330" y="56" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="177" y="76">0</text><text x="211" y="76">0</text><text x="245" y="76">0</text>
    <text x="279" y="76" fill="#2d5a22">1</text><text x="313" y="76" fill="#2d5a22">1</text><text x="347" y="76">0</text>
  </g>
  <text x="420" y="76" font-size="12" fill="#888" filter="url(#rough2)">p=0，z=3</text>

  <path d="M 280 92 L 280 108" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="104" font-size="11" fill="#d6a040" filter="url(#rough2)">右边的 0 左移会师</text>

  <!-- 行 2 -->
  <text x="80" y="140" font-size="14" fill="#446688" filter="url(#rough2)">会师后</text>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="160" y="124" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="194" y="124" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="228" y="124" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="262" y="124" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="296" y="124" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="330" y="124" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="177" y="144">0</text><text x="211" y="144">0</text><text x="245" y="144">0</text>
    <text x="279" y="144" fill="#2d5a22">1</text><text x="313" y="144" fill="#2d5a22">1</text><text x="347" y="144" fill="#2d5a22">1</text>
  </g>
  <text x="420" y="144" font-size="12" fill="#888" filter="url(#rough2)">三个 0 相邻</text>

  <path d="M 280 160 L 280 176" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="172" font-size="11" fill="#4a7a3a" filter="url(#rough2)">两轮 00→10 合并</text>

  <!-- 行 3 -->
  <text x="80" y="208" font-size="14" fill="#446688" filter="url(#rough2)">最终</text>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="160" y="192" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="194" y="192" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="228" y="192" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="262" y="192" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="296" y="192" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="330" y="192" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="177" y="212" fill="#2d5a22">1</text><text x="211" y="212" fill="#2d5a22">1</text>
    <text x="245" y="212" fill="#b85450" font-weight="bold">0</text>
    <text x="279" y="212" fill="#2d5a22">1</text><text x="313" y="212" fill="#2d5a22">1</text><text x="347" y="212" fill="#2d5a22">1</text>
  </g>
  <text x="420" y="212" font-size="12" fill="#b85450" filter="url(#rough2)">0 在 p+z−1 = 2</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="90" y="248" width="380" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="270" font-size="14" fill="#2d5a22" text-anchor="middle" font-weight="bold" filter="url(#rough2)">"000110" → "111011" ✓（与官方示例一致）</text>

  <g filter="url(#rough2)">
    <rect x="110" y="290" width="340" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="307" font-size="12" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">前缀 1 不动 + 唯一 0 推到 p+z−1，两步构造 O(n)</text>
</svg>
