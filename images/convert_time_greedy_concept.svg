<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：分钟差 → 贪心选大币</text>
  <path d="M 180 42 Q 320 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- current / correct -->
  <g filter="url(#sk)">
    <rect x="40" y="56" width="190" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="135" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">current = "02:30"</text>
  <text x="135" y="98" text-anchor="middle" font-size="12" fill="#555" font-family="monospace">= 150 分钟</text>

  <g filter="url(#sk)">
    <rect x="410" y="56" width="190" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="505" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">correct = "04:35"</text>
  <text x="505" y="98" text-anchor="middle" font-size="12" fill="#555" font-family="monospace">= 275 分钟</text>

  <g filter="url(#sk)">
    <rect x="265" y="60" width="110" height="26" rx="13" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">diff = 125</text>
  <path d="M 240 102 L 400 102" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="120" text-anchor="middle" font-size="11" fill="#888">分钟差 ≥ 0（约束 current ≤ correct）</text>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="130" y="130" width="380" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="320" y="151" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace" font-weight="bold">diff = (H₂−H₁)×60 + (M₂−M₁) ∈ [0, 1439]</text>

  <!-- coins -->
  <text x="320" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">一步操作 = 投一枚「硬币」，共 4 种币值</text>
  <g filter="url(#sk)">
    <rect x="40" y="200" width="130" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="105" y="229" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">+60 分钟</text>
  <g filter="url(#sk)">
    <rect x="185" y="200" width="130" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="250" y="229" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">+15 分钟</text>
  <g filter="url(#sk)">
    <rect x="330" y="200" width="130" height="46" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="395" y="229" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">+5 分钟</text>
  <g filter="url(#sk)">
    <rect x="475" y="200" width="130" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="540" y="229" text-anchor="middle" font-size="16" font-weight="bold" fill="#a03a36">+1 分钟</text>

  <!-- chain note -->
  <g filter="url(#sk)">
    <rect x="80" y="262" width="480" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="281" text-anchor="middle" font-size="12.5" fill="#555">60 = 4×15，15 = 3×5，5 = 5×1 —— 币值构成<tspan font-weight="bold" fill="#b85450">整除链</tspan></text>
  <text x="320" y="299" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">→ 每次取「不超过剩余量」的最大币值，操作数最少</text>

  <!-- greedy loop -->
  <g filter="url(#sk)">
    <rect x="150" y="318" width="340" height="60" rx="8" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <text x="320" y="338" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">ops = 0</text>
  <text x="320" y="354" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">for d in [60, 15, 5, 1]:</text>
  <text x="320" y="370" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">    ops += diff / d;   diff %= d</text>
</svg>
