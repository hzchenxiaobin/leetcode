<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：一对括号把表达式刚性切成四段 a(b+c)d</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#666">以 247+38 的最优方案 2(47+38) = 170 为例</text>

  <!-- row 0: original expression cells -->
  <text x="72" y="106" font-size="12" fill="#888">原式</text>
  <g filter="url(#sk2)">
    <rect x="130" y="78" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="78" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="242" y="78" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="298" y="78" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="354" y="78" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="410" y="78" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="153" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" font-family="monospace">2</text>
  <text x="209" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" font-family="monospace">4</text>
  <text x="265" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" font-family="monospace">7</text>
  <text x="321" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a5e2e" font-family="monospace">+</text>
  <text x="377" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" font-family="monospace">3</text>
  <text x="433" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" font-family="monospace">8</text>
  <text x="153" y="138" text-anchor="middle" font-size="10" fill="#446688">num1</text>
  <text x="321" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a">'+'</text>
  <text x="405" y="138" text-anchor="middle" font-size="10" fill="#446688">num2</text>
  <path d="M 175 92 Q 180 78 186 78" stroke="none"/>

  <!-- transition arrow -->
  <path d="M 320 146 L 320 164" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="158" font-size="10.5" fill="#888">左括号在 '+' 左侧 · 右括号在 '+' 右侧</text>

  <!-- row 1: parenthesized with big red parens -->
  <g filter="url(#sk2)">
    <rect x="130" y="170" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="170" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="242" y="170" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="298" y="170" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="354" y="170" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="410" y="170" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="153" y="199" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" font-family="monospace">2</text>
  <text x="209" y="199" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">4</text>
  <text x="265" y="199" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">7</text>
  <text x="321" y="199" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a5e2e" font-family="monospace">+</text>
  <text x="377" y="199" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">3</text>
  <text x="433" y="199" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">8</text>
  <!-- big red parens -->
  <path d="M 180 166 Q 168 193 180 220" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <path d="M 462 166 Q 474 193 462 220" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#sk)"/>

  <!-- segment brackets under row 1 -->
  <path d="M 130 224 L 130 234 L 176 234 L 176 224" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="153" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">a = "2"</text>
  <text x="153" y="266" text-anchor="middle" font-size="10.5" fill="#2b4a6e" font-family="monospace">A = 2</text>

  <path d="M 186 224 L 186 234 L 456 234 L 456 224" stroke="#c98a2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="321" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">b = "47" · c = "38"（括号内，均非空）</text>
  <text x="321" y="266" text-anchor="middle" font-size="10.5" fill="#7a5415" font-family="monospace">B + C = 47 + 38 = 85</text>

  <path d="M 462 224 L 462 234 L 516 234 L 516 224" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="489" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#767676">d = ε 空</text>
  <text x="489" y="266" text-anchor="middle" font-size="10.5" fill="#767676" font-family="monospace">D = 1</text>

  <!-- value formula -->
  <g filter="url(#sk2)">
    <rect x="90" y="286" width="460" height="58" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">val = A × (B + C) × D = 2 × (47 + 38) × 1</text>
  <text x="320" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22" font-family="monospace">= 170 ✓ 最小</text>

  <!-- note box -->
  <g filter="url(#sk2)">
    <rect x="40" y="362" width="560" height="94" rx="8" fill="#f4f7fb" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="60" y="384" font-size="12" fill="#2b4a6e">1. b、c 必须非空：左括号不能紧贴 '+'（否则出现 num1(+…），右括号同理。</text>
  <text x="60" y="406" font-size="12" fill="#2b4a6e">2. a、d 可空：空段表示「不出现」，按乘法单位元取 1，而不是 0 —— (999+999)=1998。</text>
  <text x="60" y="428" font-size="12" fill="#2b4a6e">3. 相邻数字并置即相乘，所以加一对括号后必然是三因子乘积 a(b+c)d。</text>
  <text x="60" y="446" font-size="12" fill="#2b4a6e">4. 切分自由度只有 (i, j) 两个点，组合 ≤ 5×5 = 25 ⇒ 直接枚举。</text>
</svg>
