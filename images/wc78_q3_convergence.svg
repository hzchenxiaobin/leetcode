<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">收敛性：m 越大，答案越快逼近 1（纵轴为对数刻度）</text>
  <text x="360" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">误差 1 − dp[m][m] 近似指数衰减，每 10 个 m 单位降到约 0.58 倍；m ≈ 179 时已跌破 1e−5</text>
  <rect x="100.0" y="92.0" width="540" height="176" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 100 92.0 L 640 92.0" stroke="#e8eaee" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="92" y="96.0" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">1e-1</text>
  <path d="M 100 127.2 L 640 127.2" stroke="#e8eaee" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="92" y="131.2" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">1e-2</text>
  <path d="M 100 162.4 L 640 162.4" stroke="#e8eaee" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="92" y="166.4" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">1e-3</text>
  <path d="M 100 197.6 L 640 197.6" stroke="#e8eaee" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="92" y="201.6" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">1e-4</text>
  <path d="M 100 232.8 L 640 232.8" stroke="#e8eaee" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="92" y="236.8" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">1e-5</text>
  <path d="M 100 268.0 L 640 268.0" stroke="#e8eaee" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="92" y="272.0" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">1e-6</text>
  <path d="M 100.0 268 L 100.0 274" stroke="#8a9ab0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="100.0" y="290" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">40</text>
  <path d="M 227.1 268 L 227.1 274" stroke="#8a9ab0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="227.1" y="290" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">80</text>
  <path d="M 354.1 268 L 354.1 274" stroke="#8a9ab0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="354.1" y="290" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">120</text>
  <path d="M 481.2 268 L 481.2 274" stroke="#8a9ab0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="481.2" y="290" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">160</text>
  <path d="M 608.2 268 L 608.2 274" stroke="#8a9ab0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="608.2" y="290" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">200</text>

  <path d="M 100 268 L 650 268" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 268 L 100 84" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="638" y="310" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">m（剩余量，1 格 = 25ml）</text>
  <text x="52" y="84" font-size="10" fill="#666" filter="url(#rough2)">误差</text>

  <polyline points="100.0,114.2 131.8,123.3 163.5,132.3 195.3,141.1 227.1,149.8 258.8,158.4 290.6,166.9 322.4,175.4 354.1,183.8 385.9,192.1 417.6,200.5 449.4,208.8 481.2,217.1 512.9,225.3 544.7,233.5 576.5,241.7 608.2,249.9 640.0,258.1" fill="none" stroke="#446688" stroke-width="2.2" stroke-linejoin="round" filter="url(#rough2)"/>
  <circle cx="100.0" cy="114.2" r="3" fill="#446688" filter="url(#rough2)"/>
  <circle cx="354.1" cy="183.8" r="3" fill="#446688" filter="url(#rough2)"/>
  <circle cx="608.2" cy="249.9" r="3" fill="#446688" filter="url(#rough2)"/>

  <path d="M 100 232.8 L 640 232.8" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <path d="M 582.8 243.4 L 582.8 268" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <circle cx="582.8" cy="243.4" r="4.5" fill="#d6a040" stroke="#8a6d1f" stroke-width="1.4" filter="url(#rough2)"/>

  <rect x="40" y="318" width="204" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142" y="340" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">蓝色折线 = 误差 1 − dp[m][m]</text>
  <text x="142" y="360" text-anchor="middle" font-size="9.5" fill="#5a6a86" filter="url(#rough2)">纵轴对数刻度，越往下误差越小</text>

  <rect x="258" y="318" width="204" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="340" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">红色虚线 = 1e−5 容差线</text>
  <text x="360" y="360" text-anchor="middle" font-size="9.5" fill="#a85a55" filter="url(#rough2)">折线在虚线下方时，输出 1.0 也算对</text>

  <rect x="476" y="318" width="204" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="578" y="340" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">橙色点是 m = 192（n = 4800）</text>
  <text x="578" y="360" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">此处误差 5.0e−6，取 m &gt; 192 直接返回 1.0</text>
</svg>
