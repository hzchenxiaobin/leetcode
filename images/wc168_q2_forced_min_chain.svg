<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：最小值 x 必须当一个集合的首元素</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">含 x 的 k 个连续整数不可能比 x 更小，所以只能是 x, x+1, …, x+k−1</text>

  <text x="114" y="82" font-size="10" fill="#666" filter="url(#rough2)">剩余多重集（按值计数，k = 3）</text>

  <rect x="106" y="88" width="212" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" opacity="0.55" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="114" y="96" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="182" y="96" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="250" y="96" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="318" y="96" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="386" y="96" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="144" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a4a66">1</text>
    <text x="212" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a4a66">2</text>
    <text x="280" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20">3</text>
    <text x="348" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a30">4</text>
    <text x="416" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a30">5</text>
    <text x="144" y="134" text-anchor="middle" font-size="9.5" fill="#666">×1</text>
    <text x="212" y="134" text-anchor="middle" font-size="9.5" fill="#666">×2</text>
    <text x="280" y="134" text-anchor="middle" font-size="9.5" fill="#666">×3</text>
    <text x="348" y="134" text-anchor="middle" font-size="9.5" fill="#666">×2</text>
    <text x="416" y="134" text-anchor="middle" font-size="9.5" fill="#666">×1</text>
  </g>

  <text x="106" y="168" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">x = 1 唯一可能：{1, 2, 3}（必须整组取出）</text>

  <path d="M 280 180 L 280 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="196" font-size="10" fill="#666" filter="url(#rough2)">cnt[1] = 1 ⇒ 每个值各扣 1 份</text>

  <text x="114" y="226" font-size="10" fill="#666" filter="url(#rough2)">扣减之后（问题规模缩小，且仍等价）：</text>

  <g filter="url(#rough2)">
    <rect x="114" y="234" width="60" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" stroke-dasharray="4 3"/>
    <rect x="182" y="234" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="250" y="234" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="318" y="234" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="386" y="234" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="144" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#aaa">1</text>
    <text x="212" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a4a66">2</text>
    <text x="280" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20">3</text>
    <text x="348" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a30">4</text>
    <text x="416" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a30">5</text>
    <text x="144" y="272" text-anchor="middle" font-size="9.5" fill="#aaa">×0</text>
    <text x="212" y="272" text-anchor="middle" font-size="9.5" fill="#666">×1</text>
    <text x="280" y="272" text-anchor="middle" font-size="9.5" fill="#666">×2</text>
    <text x="348" y="272" text-anchor="middle" font-size="9.5" fill="#666">×2</text>
    <text x="416" y="272" text-anchor="middle" font-size="9.5" fill="#666">×1</text>
  </g>

  <text x="114" y="298" font-size="10" fill="#666" filter="url(#rough2)">下一轮 x = 2 → {2,3,4}，再下一轮 x = 3 → {3,4,5}，全部扣空 ⇒ true</text>

  <rect x="35" y="310" width="490" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="330" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">贪心为什么正确</text>
  <text x="50" y="350" font-size="10" fill="#555" filter="url(#rough2)">① 剩余元素都不小于 x ⇒ 含 x 的集合最小元只能是 x，首元素被钉死</text>
  <text x="50" y="368" font-size="10" fill="#555" filter="url(#rough2)">② 集合内 k 个数互不相同 ⇒ c 份 x 必须开 c 个新集合，各扣 c 份</text>
  <text x="50" y="382" font-size="10" fill="#555" filter="url(#rough2)">③ 强制组取走后剩余问题等价 ⇒ 贪心无后效性，不需要回溯搜索</text>
</svg>
