<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">前两块一旦切定，后面每一步都被唯一决定</text>

  <!-- 字符串格子 -->
  <g filter="url(#rough2)">
    <text x="30" y="66" font-size="12" fill="#666">num</text>
    <rect x="70" y="48" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="87" y="70" text-anchor="middle" font-size="14" fill="#8a3020">1</text>
    <rect x="108" y="48" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="125" y="70" text-anchor="middle" font-size="14" fill="#8a3020">1</text>
    <rect x="146" y="48" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="163" y="70" text-anchor="middle" font-size="14" fill="#8a6a10">0</text>
    <rect x="184" y="48" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="201" y="70" text-anchor="middle" font-size="14" fill="#2f4a66">1</text>
    <rect x="222" y="48" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="239" y="70" text-anchor="middle" font-size="14" fill="#2f4a66">1</text>
    <rect x="260" y="48" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="277" y="70" text-anchor="middle" font-size="14" fill="#2f4a66">1</text>
    <rect x="298" y="48" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="315" y="70" text-anchor="middle" font-size="14" fill="#2f4a66">1</text>

    <path d="M142,88 L142,104" stroke="#b85450" stroke-width="2"/>
    <text x="142" y="120" text-anchor="middle" font-size="11" fill="#8a3020">第 1 刀</text>
    <path d="M180,88 L180,104" stroke="#b85450" stroke-width="2"/>
    <text x="192" y="120" text-anchor="middle" font-size="11" fill="#8a3020">第 2 刀</text>
  </g>

  <!-- 前两块 -->
  <g filter="url(#rough2)">
    <rect x="70" y="136" width="72" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="106" y="164" text-anchor="middle" font-size="15" fill="#8a3020">11</text>
    <text x="106" y="196" text-anchor="middle" font-size="11" fill="#8a3020">f[0]</text>

    <rect x="152" y="136" width="72" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="188" y="164" text-anchor="middle" font-size="15" fill="#8a3020">0</text>
    <text x="188" y="196" text-anchor="middle" font-size="11" fill="#8a3020">f[1]</text>

    <text x="252" y="164" font-size="13" fill="#666">→ 之后必须依次是</text>

    <rect x="356" y="136" width="52" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="382" y="164" text-anchor="middle" font-size="14" fill="#2f5527">11</text>
    <rect x="416" y="136" width="52" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="442" y="164" text-anchor="middle" font-size="14" fill="#2f5527">11</text>
    <text x="410" y="196" text-anchor="middle" font-size="11" fill="#2f5527">11 + 0 = 11，11 + 11 = 22（已无剩余）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="216" width="400" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="240" text-anchor="middle" font-size="12" fill="#2f4a66">枚举前两块：长度各 1..10，值 &lt; 2³¹ 且多位数不以 0 开头</text>
    <text x="260" y="262" text-anchor="middle" font-size="12" fill="#2f4a66">约 100 种组合 × O(L) 次贪心匹配 → 极小搜索量</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="288" width="400" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="312" text-anchor="middle" font-size="12" fill="#7a5a10">贪心唯一性：每步的目标值 need = f[i-1] + f[i-2] 是确定的</text>
    <text x="260" y="334" text-anchor="middle" font-size="12" fill="#7a5a10">切成 &lt; need 的块只能继续加长，&gt; need 只能回溯</text>
  </g>
</svg>
