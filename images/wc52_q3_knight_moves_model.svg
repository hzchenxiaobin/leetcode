<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">骑士的 8 种走法：分母恒为 8</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">出界不是「少一个选项」，而是该分支的概率直接归零</text>

  <g filter="url(#rough2)" stroke="#999" stroke-width="1.1">
    <rect x="150" y="96" width="42" height="42" fill="#ffffff"/>
    <rect x="192" y="96" width="42" height="42" fill="#ffffff"/>
    <rect x="234" y="96" width="42" height="42" fill="#ffffff"/>
    <rect x="276" y="96" width="42" height="42" fill="#ffffff"/>
    <rect x="150" y="138" width="42" height="42" fill="#ffffff"/>
    <rect x="192" y="138" width="42" height="42" fill="#ffffff"/>
    <rect x="234" y="138" width="42" height="42" fill="#ffffff"/>
    <rect x="276" y="138" width="42" height="42" fill="#ffffff"/>
    <rect x="150" y="180" width="42" height="42" fill="#ffffff"/>
    <rect x="192" y="180" width="42" height="42" fill="#ffffff"/>
    <rect x="234" y="180" width="42" height="42" fill="#ffffff"/>
    <rect x="276" y="180" width="42" height="42" fill="#ffffff"/>
    <rect x="150" y="222" width="42" height="42" fill="#ffffff"/>
    <rect x="192" y="222" width="42" height="42" fill="#ffffff"/>
    <rect x="234" y="222" width="42" height="42" fill="#ffffff"/>
    <rect x="276" y="222" width="42" height="42" fill="#ffffff"/>
  </g>

  <rect x="150" y="96" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <rect x="192" y="180" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="234" y="138" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <text x="171" y="126" text-anchor="middle" font-size="24" fill="#8a6a20" filter="url(#rough2)">♞</text>

  <path d="M 171 121 L 213 205" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 171 121 L 255 163" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 171 121 L 255 79" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 171 121 L 213 37" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 171 121 L 129 205" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 171 121 L 87 163" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 171 121 L 129 37" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 171 121 L 87 79" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="229" y="216" font-size="11" fill="#3a5a30" filter="url(#rough2)">1/8</text>
  <text x="283" y="146" font-size="11" fill="#3a5a30" filter="url(#rough2)">1/8</text>
  <text x="34" y="196" font-size="10" fill="#b85450" filter="url(#rough2)">出界 → 0</text>

  <rect x="332" y="96" width="208" height="168" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="348" y="118" font-size="11" fill="#33445f" font-weight="bold" filter="url(#rough2)">从格子 (r, c) 出发一步</text>
  <text x="348" y="142" font-size="10.5" fill="#445566" filter="url(#rough2)">8 个候选方向，各占 1/8</text>
  <text x="348" y="166" font-size="10.5" fill="#445566" filter="url(#rough2)">界内 m 个 → 存活概率 m/8</text>
  <text x="348" y="190" font-size="10.5" fill="#445566" filter="url(#rough2)">角格 m = 2，边格 m = 3 或 4</text>
  <text x="348" y="214" font-size="10.5" fill="#445566" filter="url(#rough2)">内部格 m = 8，单步存活概率 1</text>
  <text x="348" y="242" font-size="10.5" fill="#b85450" filter="url(#rough2)">越界的 8 − m 个方向：贡献 0</text>

  <line x1="58" y1="284" x2="94" y2="284" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="288" font-size="10" fill="#445566" filter="url(#rough2)">界内：加 1/8</text>
  <line x1="228" y1="284" x2="264" y2="284" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="270" y="288" font-size="10" fill="#445566" filter="url(#rough2)">出界：加 0，骑士立刻停下</text>

  <rect x="40" y="304" width="500" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="326" font-size="11" fill="#8a6a20" filter="url(#rough2)">⚠ 常见错误：分母写成「合法方向数 m」会得到条件概率，答案被系统性高估。</text>
  <text x="56" y="348" font-size="11" fill="#8a6a20" filter="url(#rough2)">正确做法：分母永远固定为 8，越界分支的贡献记 0。</text>
</svg>
