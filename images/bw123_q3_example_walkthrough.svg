<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 走查：nums = [−1, 3, 2, 4, 5]，k = 3 → 答案 11</text>

  <rect x="20" y="38" width="520" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="104" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">v</text>
  <text x="186" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">pref = S[j]</text>
  <text x="300" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">查 v−k / v+k</text>
  <text x="430" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">候选和 pref+v−S[i]</text>
  <text x="514" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ans</text>

  <g filter="url(#rough2)">
    <rect x="20" y="66" width="520" height="30" fill="#fff" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="96" width="520" height="30" fill="#fbfdff" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="126" width="520" height="30" fill="#e6f4ea" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="156" width="520" height="30" fill="#fff" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="186" width="520" height="30" fill="#e6f4ea" stroke="#e2e2e2" stroke-width="1"/>
  </g>

  <g font-size="10.5" fill="#333" filter="url(#rough2)">
    <text x="52" y="85" text-anchor="middle">0</text><text x="104" y="85" text-anchor="middle">−1</text>
    <text x="186" y="85" text-anchor="middle">0</text>
    <text x="300" y="85" text-anchor="middle">2 / −4 都没有</text>
    <text x="430" y="85" text-anchor="middle">—</text><text x="514" y="85" text-anchor="middle">−∞</text>

    <text x="52" y="115" text-anchor="middle">1</text><text x="104" y="115" text-anchor="middle">3</text>
    <text x="186" y="115" text-anchor="middle">−1</text>
    <text x="300" y="115" text-anchor="middle">0 / 6 都没有</text>
    <text x="430" y="115" text-anchor="middle">—</text><text x="514" y="115" text-anchor="middle">−∞</text>

    <text x="52" y="145" text-anchor="middle">2</text><text x="104" y="145" text-anchor="middle">2</text>
    <text x="186" y="145" text-anchor="middle">2</text>
    <text x="300" y="145" text-anchor="middle">−1 ✓（S=0）</text>
    <text x="430" y="145" text-anchor="middle">2+2−0 = 4</text>
    <text x="514" y="145" text-anchor="middle" fill="#4a7a3a">4</text>

    <text x="52" y="175" text-anchor="middle">3</text><text x="104" y="175" text-anchor="middle">4</text>
    <text x="186" y="175" text-anchor="middle">4</text>
    <text x="300" y="175" text-anchor="middle">1 / 7 都没有</text>
    <text x="430" y="175" text-anchor="middle">—</text><text x="514" y="175" text-anchor="middle">4</text>

    <text x="52" y="205" text-anchor="middle">4</text><text x="104" y="205" text-anchor="middle">5</text>
    <text x="186" y="205" text-anchor="middle">8</text>
    <text x="300" y="205" text-anchor="middle">2 ✓（S=2）</text>
    <text x="430" y="205" text-anchor="middle">8+5−2 = 11</text>
    <text x="514" y="205" text-anchor="middle" fill="#4a7a3a">11</text>
  </g>

  <text x="280" y="240" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 2 步命中 nums[0] = −1：好子数组 [−1,3,2]，和 4；第 4 步命中 nums[2] = 2：好子数组 [2,4,5]，和 11</text>
  <text x="280" y="262" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两处命中都来自「v − k」方向；「v + k」方向在示例 3 里才会用到（如 nums[i] 比 nums[j] 大 k）</text>

  <rect x="40" y="276" width="480" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">每个值只需记住「最小的那个前缀和」，所以哈希表只存一个数，不必存列表</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#a08a50" filter="url(#rough2)">同一值重复出现时取较小前缀和更新即可</text>
</svg>
