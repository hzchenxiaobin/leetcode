<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="396" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">演算示例：a = 756 = 2² × 3³ × 7</text>
  <text x="300" y="48" text-anchor="middle" font-size="10.5" fill="#888">数位从 9 到 2 逐个尝试，能整除就除到底（while），记录顺序为降序</text>

  <g filter="url(#rough2)">
    <rect x="40" y="62" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="118" y="81" text-anchor="middle" font-size="11" fill="#3a4a66">候选数位 d</text>
    <text x="248" y="81" text-anchor="middle" font-size="11" fill="#3a4a66">当前 a（除之前 → 除之后）</text>
    <text x="418" y="81" text-anchor="middle" font-size="11" fill="#3a4a66">a % d == 0 ?</text>
    <text x="516" y="81" text-anchor="middle" font-size="11" fill="#3a4a66">记录</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="40" y="94" width="520" height="26" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1" rx="4"/>
    <text x="118" y="112" text-anchor="middle" fill="#333">9</text>
    <text x="248" y="112" text-anchor="middle" fill="#333">756 → 84</text>
    <text x="418" y="112" text-anchor="middle" fill="#4a7a3a">✓（84 % 9 ≠ 0 停）</text>
    <text x="516" y="112" text-anchor="middle" fill="#8a6a20" font-weight="bold">9</text>

    <rect x="40" y="120" width="520" height="26" fill="#fafafa" stroke="#cfd8e3" stroke-width="1.1" rx="4"/>
    <text x="118" y="138" text-anchor="middle" fill="#333">8</text>
    <text x="248" y="138" text-anchor="middle" fill="#888">84 → 84</text>
    <text x="418" y="138" text-anchor="middle" fill="#b85450">✗</text>
    <text x="516" y="138" text-anchor="middle" fill="#888">—</text>

    <rect x="40" y="146" width="520" height="26" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1" rx="4"/>
    <text x="118" y="164" text-anchor="middle" fill="#333">7</text>
    <text x="248" y="164" text-anchor="middle" fill="#333">84 → 12</text>
    <text x="418" y="164" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="516" y="164" text-anchor="middle" fill="#8a6a20" font-weight="bold">7</text>

    <rect x="40" y="172" width="520" height="26" fill="#fafafa" stroke="#cfd8e3" stroke-width="1.1" rx="4"/>
    <text x="118" y="190" text-anchor="middle" fill="#333">6</text>
    <text x="248" y="190" text-anchor="middle" fill="#333">12 → 2</text>
    <text x="418" y="190" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="516" y="190" text-anchor="middle" fill="#8a6a20" font-weight="bold">6</text>

    <rect x="40" y="198" width="520" height="26" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1" rx="4"/>
    <text x="118" y="216" text-anchor="middle" fill="#333">5, 4</text>
    <text x="248" y="216" text-anchor="middle" fill="#888">2 → 2</text>
    <text x="418" y="216" text-anchor="middle" fill="#b85450">✗ ✗</text>
    <text x="516" y="216" text-anchor="middle" fill="#888">—</text>

    <rect x="40" y="224" width="520" height="26" fill="#fafafa" stroke="#cfd8e3" stroke-width="1.1" rx="4"/>
    <text x="118" y="242" text-anchor="middle" fill="#333">3</text>
    <text x="248" y="242" text-anchor="middle" fill="#888">2 → 2</text>
    <text x="418" y="242" text-anchor="middle" fill="#b85450">✗</text>
    <text x="516" y="242" text-anchor="middle" fill="#888">—</text>

    <rect x="40" y="250" width="520" height="26" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1" rx="4"/>
    <text x="118" y="268" text-anchor="middle" fill="#333">2</text>
    <text x="248" y="268" text-anchor="middle" fill="#333">2 → 1</text>
    <text x="418" y="268" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="516" y="268" text-anchor="middle" fill="#8a6a20" font-weight="bold">2</text>
  </g>

  <text x="300" y="298" text-anchor="middle" font-size="10.5" fill="#555">结束时 a = 1（余数非 1 则无解）；记录序列 [9, 7, 6, 2] 是降序</text>

  <g filter="url(#rough2)">
    <rect x="70" y="310" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="170" y="330" text-anchor="middle" font-size="10.5" fill="#8a6a20">反转 → 2, 6, 7, 9</text>
    <text x="170" y="347" text-anchor="middle" font-size="10.5" fill="#8a6a20">拼成 b = 2679</text>
  </g>

  <path d="M 274 333 L 312 333" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="316" y="310" width="216" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="424" y="330" text-anchor="middle" font-size="10.5" fill="#3a5a30">校验 2 × 6 × 7 × 9 = 756 ✓</text>
    <text x="424" y="347" text-anchor="middle" font-size="10.5" fill="#3a5a30">另解 3479 / 3667 同为 4 位但更大</text>
  </g>

  <text x="300" y="382" text-anchor="middle" font-size="10" fill="#666">同为 4 位时比较首位：2679 的首位 2 最小 ⇒ 把大数位排在末尾（即反转降序记录）最优</text>
</svg>
