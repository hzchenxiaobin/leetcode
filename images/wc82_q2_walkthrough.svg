<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：ages = [20, 30, 100, 110, 120]</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5 个人，很年轻的收不到请求，年长的只能往回发</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="122" y="62" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5"/>
    <text x="148" y="82" fill="#8a3a36">20</text>
    <rect x="188" y="62" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5"/>
    <text x="214" y="82" fill="#8a3a36">30</text>
    <rect x="254" y="62" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5"/>
    <text x="280" y="82" fill="#8a6a20">100</text>
    <rect x="320" y="62" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="346" y="82" fill="#3a5a30">110</text>
    <rect x="386" y="62" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="412" y="82" fill="#3a5a30">120</text>
  </g>

  <g stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)">
    <path d="M 346 92 L 346 112 L 286 112" marker-end="url(#arr)"/>
    <path d="M 412 92 L 412 140 L 286 140" marker-end="url(#arr)"/>
  </g>
  <text x="316" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">110 → 100</text>
  <text x="352" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">120 → 100, 110</text>

  <g filter="url(#rough2)">
    <rect x="44" y="152" width="464" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="44" y="256" width="464" height="21" fill="#e6f4ea" opacity="0.8"/>
    <rect x="44" y="278" width="464" height="21" fill="#e6f4ea" opacity="0.8"/>
  </g>

  <g font-size="10" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="168">a</text>
    <text x="152" y="168">freq[a]</text>
    <text x="228" y="168">lo</text>
    <text x="330" y="168">pref 区间人数</text>
    <text x="412" y="168">减自己</text>
    <text x="482" y="168">贡献</text>
  </g>

  <g font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="196">20</text>
    <text x="152" y="196">1</text>
    <text x="228" y="196">18</text>
    <text x="330" y="196">1</text>
    <text x="412" y="196">0</text>
    <text x="482" y="196">0</text>

    <text x="80" y="218">30</text>
    <text x="152" y="218">1</text>
    <text x="228" y="218">23</text>
    <text x="330" y="218">1</text>
    <text x="412" y="218">0</text>
    <text x="482" y="218">0</text>

    <text x="80" y="240">100</text>
    <text x="152" y="240">1</text>
    <text x="228" y="240">58</text>
    <text x="330" y="240">1</text>
    <text x="412" y="240">0</text>
    <text x="482" y="240">0</text>

    <text x="80" y="274">110</text>
    <text x="152" y="274">1</text>
    <text x="228" y="274">63</text>
    <text x="330" y="274">2</text>
    <text x="412" y="274">1</text>
    <text x="482" y="274" fill="#3a5a30">1</text>

    <text x="80" y="296">120</text>
    <text x="152" y="296">1</text>
    <text x="228" y="296">68</text>
    <text x="330" y="296">3</text>
    <text x="412" y="296">2</text>
    <text x="482" y="296" fill="#3a5a30">2</text>
  </g>

  <g stroke="#ccc" stroke-width="1" filter="url(#rough2)">
    <path d="M 44 202 L 508 202" fill="none"/>
    <path d="M 44 224 L 508 224" fill="none"/>
    <path d="M 44 246 L 508 246" fill="none"/>
    <path d="M 44 300 L 508 300" fill="none"/>
  </g>
  <path d="M 44 310 L 508 310" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <g font-size="11" fill="#444" filter="url(#rough2)">
    <text x="80" y="328" text-anchor="middle">合计</text>
    <text x="482" y="328" text-anchor="middle" fill="#3a5a30" font-weight="bold">3</text>
  </g>

  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">对 [16,16]：a = 16，lo = 16，区间 2 人，减自己 1 人 → 2 × 1 = 2</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">对 [16,17,18]：a = 17 收到 16、a = 18 收到 17 → 合计 2</text>
  <text x="280" y="392" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">注意 20/30/100 三行都是 0：它们没有更年轻且在区间内的同龄人</text>
</svg>
