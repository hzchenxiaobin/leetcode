<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">贪心：每步取不超过剩余值的最大斐波那契数</text>

  <!-- 斐波那契阶梯 -->
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <rect x="36"  y="270" width="66" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="69" y="292">1</text>
    <rect x="110" y="246" width="66" height="58" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="143" y="280">2</text>
    <rect x="184" y="218" width="66" height="86" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="217" y="264">3</text>
    <rect x="258" y="184" width="66" height="120" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="291" y="248">5</text>
    <rect x="332" y="140" width="66" height="164" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="365" y="226">8</text>
    <rect x="406" y="84"  width="66" height="220" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="439" y="198">13</text>
    <rect x="480" y="60" width="60" height="244" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/><text x="510" y="188" font-size="12">21</text>
  </g>
  <text x="69" y="322" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">F₂=F₁=1</text>

  <!-- k=19 的贪心路线 -->
  <path d="M 439 84 L 439 56" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="439" cy="86" r="26" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 420 220 C 380 218, 330 196, 296 162" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="291" cy="150" r="26" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 274 178 C 220 232, 140 244, 86 254" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="69" cy="256" r="24" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#b85450" filter="url(#rough2)">
    <text x="439" y="74" text-anchor="middle">19 → 取 13</text>
    <text x="291" y="140" text-anchor="middle">余 6 → 取 5</text>
    <text x="69" y="232" text-anchor="middle">余 1 → 取 1</text>
  </g>

  <!-- 关键引理 -->
  <g filter="url(#rough2)">
    <rect x="36" y="46" width="488" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <text x="280" y="68" fill="#4a7a3a">x &lt; F(m+1) = F(m) + F(m−1)，取走 F(m) 后剩余 x − F(m) &lt; F(m−1)</text>
    <text x="280" y="88" fill="#4a7a3a">→ 下一项至多 F(m−2)：下标逐级跳空，永不重复、永不相邻</text>
  </g>
</svg>
