<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">逐字符映射：只有 “.” 需要一分为三</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">字符之间没有依赖，答案就是 n 个独立映射结果的拼接</text>

  <text x="150" y="106" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">输入 address</text>
  <text x="432" y="240" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">输出 ans</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="20">
    <rect x="199" y="118" width="50" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="224" y="149" fill="#2f4460">1</text>

    <rect x="255" y="118" width="50" height="46" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="149" fill="#8a6a20">.</text>

    <rect x="311" y="118" width="50" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="336" y="149" fill="#2f4460">2</text>
  </g>

  <g filter="url(#rough2)" stroke="#777" stroke-width="1.3" fill="none">
    <path d="M 224 170 L 168 240" marker-end="url(#arr)"/>
    <path d="M 280 170 L 224 240" marker-end="url(#arr)"/>
    <path d="M 280 170 L 280 240" marker-end="url(#arr)"/>
    <path d="M 280 170 L 336 240" marker-end="url(#arr)"/>
    <path d="M 336 170 L 392 240" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="20">
    <rect x="143" y="250" width="50" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="168" y="281" fill="#2f4460">1</text>

    <rect x="199" y="250" width="50" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="224" y="281" fill="#3a5a30">[</text>

    <rect x="255" y="250" width="50" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="281" fill="#3a5a30">.</text>

    <rect x="311" y="250" width="50" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="336" y="281" fill="#3a5a30">]</text>

    <rect x="367" y="250" width="50" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="392" y="281" fill="#2f4460">2</text>
  </g>

  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">映射规则：c ≠ ‘.’ 时原样输出 1 个字符；c = ‘.’ 时输出 3 个字符 “[”, “.”, “]”</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">有效 IPv4 恰有 3 个点 ⇒ 输出长度恒为 n + 2 × 3 = n + 6</text>
</svg>
