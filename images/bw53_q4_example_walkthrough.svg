<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums1 = [1,0,3]，nums2 = [5,3,4]</text>

  <!-- dp 表 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="150" y="58">n = 3，状态 8 个</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="46" y="72" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/><text x="106" y="94">mask（二进制）</text>
    <rect x="166" y="72" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/><text x="201" y="94">k</text>
    <rect x="236" y="72" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/><text x="291" y="94">dp[mask]</text>

    <rect x="46" y="106" width="120" height="34" fill="#e6f4ea" stroke="#b5d4b0" rx="6"/><text x="106" y="128">000（初始）</text>
    <rect x="166" y="106" width="70" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="201" y="128">0</text>
    <rect x="236" y="106" width="110" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="291" y="128">0</text>

    <rect x="46" y="140" width="120" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="106" y="162">001（b₀=5）</text>
    <rect x="166" y="140" width="70" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="201" y="162">1</text>
    <rect x="236" y="140" width="110" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="291" y="162">1^5 = 4</text>

    <rect x="46" y="174" width="120" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="106" y="196">010（b₁=3）</text>
    <rect x="166" y="174" width="70" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="201" y="196">1</text>
    <rect x="236" y="174" width="110" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="291" y="196">1^3 = 2</text>

    <rect x="46" y="208" width="120" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="106" y="230">100（b₂=4）</text>
    <rect x="166" y="208" width="70" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="201" y="230">1</text>
    <rect x="236" y="208" width="110" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="291" y="230">1^4 = 5</text>

    <rect x="46" y="242" width="120" height="34" fill="#fff8e1" stroke="#d6a040" rx="6"/><text x="106" y="264">011 / 101 / 110</text>
    <rect x="166" y="242" width="70" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="201" y="264">2</text>
    <rect x="236" y="242" width="110" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="291" y="264">7 / 8 / 6</text>

    <rect x="46" y="276" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/><text x="106" y="298">111（全部）</text>
    <rect x="166" y="276" width="70" height="34" fill="#fafafa" stroke="#ddd" rx="6"/><text x="201" y="298">3</text>
    <rect x="236" y="276" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/><text x="291" y="298" font-weight="bold">8 ✓</text>
  </g>

  <!-- 右侧：k=2 层与末层转移 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="366" y="72" width="176" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="454" y="94" text-anchor="middle" font-weight="bold" fill="#7a5c1e">k = 2 层（i = 1）</text>
    <text x="454" y="116" text-anchor="middle" font-size="12.5">dp[011] = dp[001] + 0^3 = 4+3 = 7</text>
    <text x="454" y="134" text-anchor="middle" font-size="12.5">dp[011] = dp[010] + 0^5 = 2+5 = 7</text>
    <text x="454" y="152" text-anchor="middle" font-size="12.5" fill="#666">→ dp[011] = 7</text>
    <text x="454" y="176" text-anchor="middle" font-size="12.5">dp[101] = min(4+4, 5+5) = 8</text>
    <text x="454" y="194" text-anchor="middle" font-size="12.5">dp[110] = min(2+6, 5+3) = 6</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="366" y="214" width="176" height="122" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
    <text x="454" y="238" text-anchor="middle" font-weight="bold" fill="#8a3a36">k = 3 层（i = 2，答案）</text>
    <text x="454" y="260" text-anchor="middle" font-size="12.5">dp[111] = dp[011] + 3^4</text>
    <text x="454" y="278" text-anchor="middle" font-size="12.5">= dp[101] + 3^3</text>
    <text x="454" y="296" text-anchor="middle" font-size="12.5">= dp[110] + 3^5</text>
    <text x="454" y="322" text-anchor="middle" font-size="12.5" font-weight="bold">= min(7+7, 8+0, 6+6) = 8 ✓</text>
  </g>
  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">最优重排：nums2 = [5,4,3]，代价 (1^5)+(0^4)+(3^3) = 4+4+0 = 8</text>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">表中 k=2 层的正确值：dp[011] = 7，dp[101] = 8，dp[110] = 6</text>
</svg>
