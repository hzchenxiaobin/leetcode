<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,3,2] 的三层 dp（末层求和 = 4）</text>

  <!-- table frame -->
  <g filter="url(#rough2)">
    <!-- header -->
    <rect x="40" y="48" width="46" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="63" y="67" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">i</text>
    <rect x="86" y="48" width="86" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="129" y="67" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">Δ / t_max</text>
    <rect x="172" y="48" width="38" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="210" y="48" width="38" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="248" y="48" width="38" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="286" y="48" width="38" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="191" y="67" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">s=0</text>
    <text x="229" y="67" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">s=1</text>
    <text x="267" y="67" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">s=2</text>
    <text x="305" y="67" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">s=3</text>

    <!-- row i=0 -->
    <rect x="40" y="76" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="63" y="97" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">0</text>
    <rect x="86" y="76" width="86" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1"/>
    <text x="129" y="97" text-anchor="middle" font-size="9.5" fill="#557">初始：首位任取</text>
    <rect x="172" y="76" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="210" y="76" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="248" y="76" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="286" y="76" width="38" height="34" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="191" y="97" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <text x="229" y="97" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <text x="267" y="97" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <text x="305" y="97" text-anchor="middle" font-size="10" fill="#999">—</text>

    <!-- row i=1 -->
    <rect x="40" y="110" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="63" y="131" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <rect x="86" y="110" width="86" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1"/>
    <text x="129" y="128" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">Δ=+1</text>
    <text x="129" y="140" text-anchor="middle" font-size="9" fill="#557">t_max=s−1</text>
    <rect x="172" y="110" width="38" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="210" y="110" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="248" y="110" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="286" y="110" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="191" y="131" text-anchor="middle" font-size="11" fill="#8a2f2a" font-weight="bold">0</text>
    <text x="229" y="131" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <text x="267" y="131" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">2</text>
    <text x="305" y="131" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">3</text>

    <!-- row i=2 -->
    <rect x="40" y="144" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="63" y="165" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">2</text>
    <rect x="86" y="144" width="86" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1"/>
    <text x="129" y="162" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Δ=−1</text>
    <text x="129" y="174" text-anchor="middle" font-size="9" fill="#557">t_max=s</text>
    <rect x="172" y="144" width="38" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="210" y="144" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="248" y="144" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="286" y="144" width="38" height="34" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="191" y="165" text-anchor="middle" font-size="11" fill="#8a2f2a" font-weight="bold">0</text>
    <text x="229" y="165" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <text x="267" y="165" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">3</text>
    <text x="305" y="165" text-anchor="middle" font-size="10" fill="#999">—</text>
  </g>

  <!-- dead-state annotation -->
  <g filter="url(#rough2)">
    <path d="M 191 146 C 191 186, 120 178, 78 196" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="60" y="212" font-size="9.5" fill="#b85450" font-weight="bold">死状态：t_max = −1 &lt; 0</text>
    <text x="60" y="225" font-size="9" fill="#888">nums 涨了，arr1 不动 → 无解</text>
  </g>

  <!-- sum annotation -->
  <g filter="url(#rough2)">
    <rect x="240" y="196" width="84" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="282" y="216" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">Σ = 4 ✓</text>
    <path d="M 267 178 L 272 192" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- right panel: the 4 pairs -->
  <g filter="url(#rough2)">
    <rect x="352" y="76" width="188" height="212" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="446" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">末层每个 s 对应的数组对</text>
    <text x="446" y="122" text-anchor="middle" font-size="9.5" fill="#557">s = 1（1 种）：</text>
    <text x="446" y="136" text-anchor="middle" font-size="9.5" fill="#2c4258" font-weight="bold">([0,1,1], [2,2,1])</text>
    <text x="446" y="160" text-anchor="middle" font-size="9.5" fill="#557">s = 2（3 种）：</text>
    <text x="446" y="174" text-anchor="middle" font-size="9.5" fill="#2c4258" font-weight="bold">([0,1,2], [2,2,0])</text>
    <text x="446" y="188" text-anchor="middle" font-size="9.5" fill="#2c4258" font-weight="bold">([0,2,2], [2,1,0])</text>
    <text x="446" y="202" text-anchor="middle" font-size="9.5" fill="#2c4258" font-weight="bold">([1,2,2], [1,1,0])</text>
    <text x="446" y="230" text-anchor="middle" font-size="9" fill="#888">s = 3 不可行：</text>
    <text x="446" y="244" text-anchor="middle" font-size="9" fill="#888">nums[2] = 2 放不下 arr1[2] = 3</text>
    <text x="446" y="258" text-anchor="middle" font-size="9" fill="#888">（arr2 = −1 &lt; 0 违反非负）</text>
    <text x="446" y="280" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">与示例 1 的四对完全一致 ✓</text>
  </g>

  <!-- squeezed-window note -->
  <g filter="url(#rough2)">
    <rect x="352" y="300" width="188" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="446" y="322" text-anchor="middle" font-size="10" fill="#8a6a1a" font-weight="bold">i = 1 的挤压最直观</text>
    <text x="446" y="340" text-anchor="middle" font-size="9.5" fill="#557">Δ=+1 把窗口整体压低一位</text>
    <text x="446" y="354" text-anchor="middle" font-size="9.5" fill="#557">而 s=3 恰好收下整层前缀和</text>
    <text x="446" y="368" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1+1+1 = 3</text>
  </g>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="24" y="396" width="512" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="416" text-anchor="middle" font-size="10.5" fill="#2c4258" font-weight="bold">转移只读上一层、写本层：两组数组交替滚动即可，空间 O(V) 与 n 无关</text>
    <text x="280" y="434" text-anchor="middle" font-size="10.5" fill="#444">[5,5,5,5] 同法算出 126 = C(9,4)——全相等时 DP 退化为非减序列计数，闭式见「相关题目与扩展」</text>
  </g>
</svg>
