<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [2, 3, 5, 3, 2, 1]，答案 3</text>

  <!-- r=3 高亮带 -->
  <rect x="8" y="212" width="584" height="44" rx="8" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>

  <!-- r=0 -->
  <text x="14" y="73" font-size="11" fill="#333" filter="url(#rough2)">r = 0</text>
  <text x="14" y="88" font-size="11" fill="#d6a040" filter="url(#rough2)">x = 2</text>
  <rect x="96" y="58" width="42" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="117" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="142" y="58" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="163" y="82" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">3</text>
  <rect x="188" y="58" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="209" y="82" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">5</text>
  <rect x="234" y="58" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="255" y="82" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">3</text>
  <rect x="280" y="58" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="301" y="82" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">2</text>
  <rect x="326" y="58" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="347" y="82" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="390" y="73" font-size="10.5" fill="#666" filter="url(#rough2)">空窗口 ⇒ 无冲突</text>
  <text x="390" y="89" font-size="10.5" fill="#333" filter="url(#rough2)">窗口 [2]，ans = 1</text>

  <!-- r=1 -->
  <text x="14" y="127" font-size="11" fill="#333" filter="url(#rough2)">r = 1</text>
  <text x="14" y="142" font-size="11" fill="#d6a040" filter="url(#rough2)">x = 3</text>
  <rect x="96" y="112" width="42" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="142" y="112" width="42" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="163" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="188" y="112" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="209" y="136" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">5</text>
  <rect x="234" y="112" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="255" y="136" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">3</text>
  <rect x="280" y="112" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="301" y="136" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">2</text>
  <rect x="326" y="112" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="347" y="136" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="390" y="127" font-size="10.5" fill="#666" filter="url(#rough2)">无 a + b = 3，也无 a 与 a + 3 同在</text>
  <text x="390" y="143" font-size="10.5" fill="#333" filter="url(#rough2)">窗口 [2, 3]，ans = 2</text>

  <!-- r=2 -->
  <text x="14" y="181" font-size="11" fill="#333" filter="url(#rough2)">r = 2</text>
  <text x="14" y="196" font-size="11" fill="#d6a040" filter="url(#rough2)">x = 5</text>
  <rect x="96" y="166" width="42" height="36" rx="4" fill="#ececec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="117" y="190" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <rect x="142" y="166" width="42" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="188" y="166" width="42" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="209" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="234" y="166" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="255" y="190" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">3</text>
  <rect x="280" y="166" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="301" y="190" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">2</text>
  <rect x="326" y="166" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="347" y="190" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="390" y="181" font-size="10.5" fill="#b85450" filter="url(#rough2)">2 + 3 = 5 ✗（形态 A）</text>
  <text x="390" y="197" font-size="10.5" fill="#333" filter="url(#rough2)">移出 2 ⇒ 窗口 [3, 5]，ans = 2</text>

  <!-- r=3 -->
  <text x="14" y="235" font-size="11" fill="#333" filter="url(#rough2)">r = 3</text>
  <text x="14" y="250" font-size="11" fill="#d6a040" filter="url(#rough2)">x = 3</text>
  <rect x="96" y="220" width="42" height="36" rx="4" fill="#ececec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="117" y="244" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <rect x="142" y="220" width="42" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="188" y="220" width="42" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="209" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="234" y="220" width="42" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="255" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="280" y="220" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="301" y="244" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">2</text>
  <rect x="326" y="220" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="347" y="244" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="390" y="235" font-size="10.5" fill="#666" filter="url(#rough2)">数对和 8 / 6 / 8 均不是窗口内元素</text>
  <text x="390" y="251" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">窗口 [3, 5, 3]，ans = 3 ★</text>

  <!-- r=4 -->
  <text x="14" y="289" font-size="11" fill="#333" filter="url(#rough2)">r = 4</text>
  <text x="14" y="304" font-size="11" fill="#d6a040" filter="url(#rough2)">x = 2</text>
  <rect x="96" y="274" width="42" height="36" rx="4" fill="#ececec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="117" y="298" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <rect x="142" y="274" width="42" height="36" rx="4" fill="#ececec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="163" y="298" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <rect x="188" y="274" width="42" height="36" rx="4" fill="#ececec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="209" y="298" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">5</text>
  <rect x="234" y="274" width="42" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="280" y="274" width="42" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="301" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="326" y="274" width="42" height="36" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="347" y="298" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="390" y="289" font-size="10.5" fill="#b85450" filter="url(#rough2)">3 + 2 = 5 ✗（形态 B），移 3 后仍 ✗</text>
  <text x="390" y="305" font-size="10.5" fill="#333" filter="url(#rough2)">移出 3、5 ⇒ 窗口 [3, 2]，ans = 3</text>

  <!-- r=5 -->
  <text x="14" y="343" font-size="11" fill="#333" filter="url(#rough2)">r = 5</text>
  <text x="14" y="358" font-size="11" fill="#d6a040" filter="url(#rough2)">x = 1</text>
  <rect x="96" y="328" width="42" height="36" rx="4" fill="#ececec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="117" y="352" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <rect x="142" y="328" width="42" height="36" rx="4" fill="#ececec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="163" y="352" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <rect x="188" y="328" width="42" height="36" rx="4" fill="#ececec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="209" y="352" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">5</text>
  <rect x="234" y="328" width="42" height="36" rx="4" fill="#ececec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="255" y="352" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <rect x="280" y="328" width="42" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301" y="352" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="326" y="328" width="42" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="347" y="352" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="390" y="343" font-size="10.5" fill="#b85450" filter="url(#rough2)">2 + 1 = 3 ✗（形态 B）</text>
  <text x="390" y="359" font-size="10.5" fill="#333" filter="url(#rough2)">移出 3 ⇒ 窗口 [2, 1]，ans = 3</text>

  <!-- 图例 -->
  <rect x="96" y="384" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="396" font-size="10.5" fill="#333" filter="url(#rough2)">窗口内</text>
  <rect x="178" y="384" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="396" font-size="10.5" fill="#333" filter="url(#rough2)">新加入 x</text>
  <rect x="280" y="384" width="14" height="14" rx="3" fill="#ececec" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="396" font-size="10.5" fill="#333" filter="url(#rough2)">已移出</text>
  <rect x="372" y="384" width="14" height="14" rx="3" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="392" y="396" font-size="10.5" fill="#333" filter="url(#rough2)">未进入</text>

  <text x="300" y="428" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">任何长度 4 的子数组都含互异下标的 2、3、5 且 2 + 3 = 5 ⇒ 不存在更长的有效子数组</text>
</svg>
