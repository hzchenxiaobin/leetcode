<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：tasks = [[1,3],[2,4],[10,11],[10,12],[8,9]]</text>
  <path d="M 150 38 Q 330 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">按 d = m − a 降序（稳定排序）后依次执行</text>

  <g filter="url(#sk)">
    <rect x="60" y="62" width="560" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <path d="M 170 62 L 170 292 M 250 62 L 250 292 M 350 62 L 350 292 M 450 62 L 450 292 M 540 62 L 540 292" stroke="#446688" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="60" y="62" width="560" height="230" rx="4" fill="none" stroke="#446688" stroke-width="1.6"/>
    <path d="M 60 124 L 620 124 M 60 158 L 620 158 M 60 192 L 620 192 M 60 226 L 620 226 M 60 260 L 620 260" stroke="#cccccc" stroke-width="1"/>
    <rect x="60" y="260" width="560" height="32" rx="4" fill="#e6f4ea"/>
    <rect x="60" y="260" width="560" height="32" rx="4" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#2b4a66" text-anchor="middle" filter="url(#sk)">
    <text x="115" y="80">任务 [a, m]</text>
    <text x="210" y="80">d = m−a</text>
    <text x="300" y="80">执行前 cur</text>
    <text x="400" y="80">补水 m−cur</text>
    <text x="495" y="80">ans 累计</text>
    <text x="580" y="80">执行后 cur</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#444" filter="url(#sk)">
    <text x="115" y="112">[1, 3]</text>
    <text x="210" y="112" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="300" y="112">0</text>
    <text x="400" y="112" fill="#b07818" font-weight="bold">3</text>
    <text x="495" y="112" fill="#b07818" font-weight="bold">3</text>
    <text x="580" y="112">2</text>

    <text x="115" y="146">[2, 4]</text>
    <text x="210" y="146" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="300" y="146">2</text>
    <text x="400" y="146" fill="#b07818" font-weight="bold">2</text>
    <text x="495" y="146" fill="#b07818" font-weight="bold">5</text>
    <text x="580" y="146">2</text>

    <text x="115" y="180">[10, 12]</text>
    <text x="210" y="180" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="300" y="180">2</text>
    <text x="400" y="180" fill="#b07818" font-weight="bold">10</text>
    <text x="495" y="180" fill="#b07818" font-weight="bold">15</text>
    <text x="580" y="180">2</text>

    <text x="115" y="214">[10, 11]</text>
    <text x="210" y="214" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="300" y="214">2</text>
    <text x="400" y="214" fill="#b07818" font-weight="bold">9</text>
    <text x="495" y="214" fill="#b07818" font-weight="bold">24</text>
    <text x="580" y="214">1</text>

    <text x="115" y="248">[8, 9]</text>
    <text x="210" y="248" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="300" y="248">1</text>
    <text x="400" y="248" fill="#b07818" font-weight="bold">8</text>
    <text x="495" y="248" fill="#b85450" font-weight="bold" font-size="13.5">32</text>
    <text x="580" y="248">1</text>
  </g>
  <text x="340" y="281" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">返回 ans = 32（最少初始能量）</text>

  <g filter="url(#sk)">
    <rect x="55" y="304" width="570" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="329" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">公式验证：E = max(0+3, 1+4, 3+12, 13+11, 23+9) = max(3, 5, 15, 24, 32) = 32 ✓</text>

  <g filter="url(#sk)">
    <rect x="55" y="354" width="570" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="340" y="373" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">每轮：水位 cur 低于门槛 m 就"补水"（计入 ans），补完再扣 a</text>
  <text x="340" y="392" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">累计补水量：0 → 3 → 5 → 15 → 24 → 32，恰为初始能量</text>

  <g filter="url(#sk)">
    <rect x="55" y="416" width="570" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="340" y="434" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">前三个任务 d = 2（稳定排序保持原相对顺序），后两个 d = 1</text>
  <text x="340" y="452" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">d 相同的任务先后无所谓 —— 交换它们需求不变</text>
</svg>
