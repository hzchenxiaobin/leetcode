<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">签名同时保证了两个方向都是单射</text>
  <rect x="40" y="56" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170.0" y="78.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">pattern = "ab"</text>
  <text x="170.0" y="98.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">签名 = [0, 1]</text>
  <rect x="40" y="148" width="260" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170.0" y="170.55" text-anchor="middle" font-size="13" fill="#8d3b37" filter="url(#rough2)">word = "aa"</text>
  <text x="170.0" y="190.55" text-anchor="middle" font-size="13" fill="#8d3b37" filter="url(#rough2)">签名 = [0, 0]</text>
  <rect x="40" y="240" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170.0" y="262.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">word = "xy"</text>
  <text x="170.0" y="282.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">签名 = [0, 1]</text>
  <text x="330" y="84" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">若只要求「pattern → word」方向的映射，</text>
  <text x="330" y="106" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">a → a、b → a 也成立，但这不是双射。</text>
  <text x="330" y="176" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">签名 [0, 0] ≠ [0, 1]，直接排除 aa，</text>
  <text x="330" y="198" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">等价于「同一个字母不能对应两个源字母」。</text>
  <rect x="330" y="240" width="280" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470.0" y="269.2" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">双向映射都一致 ⇔ 签名相同</text>
  <text x="470.0" y="289.2" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">所以只比较签名就够</text>
  <text x="24" y="336" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">长度相同是前提：题面保证 words[i].length == pattern.length</text>
</svg>
