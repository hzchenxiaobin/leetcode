<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">移除子树 v 后，谁还留在场上？</text>
  <path d="M 220 42 Q 470 50 720 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: example 2 tree, query v = 3 ===== -->
  <text x="235" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">示例 2 的树，查询 v = 3（移除虚线圈住的子树）</text>

  <!-- edges -->
  <g stroke="#8a8a8a" stroke-width="1.4" fill="none">
    <path d="M 235 100 L 165 165" filter="url(#sk)"/>
    <path d="M 235 100 L 315 165" stroke="#446688" stroke-width="2.6" filter="url(#sk)"/>
    <path d="M 165 195 L 115 255" filter="url(#sk)"/>
    <path d="M 165 195 L 225 255" filter="url(#sk)"/>
    <path d="M 315 195 L 285 255" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3" filter="url(#sk)"/>
    <path d="M 315 195 L 385 255" filter="url(#sk)"/>
    <path d="M 115 285 L 65 345" filter="url(#sk)"/>
    <path d="M 115 285 L 165 345" filter="url(#sk)"/>
  </g>

  <!-- removed subtree dashed circle -->
  <g filter="url(#sk2)">
    <ellipse cx="285" cy="272" rx="30" ry="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3"/>
  </g>
  <!-- node 3 with X -->
  <g filter="url(#sk2)"><circle cx="285" cy="272" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="285" y="277" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <g filter="url(#sk2)"><path d="M 262 250 L 306 293 M 306 250 L 262 293" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="285" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v = 3 被移除</text>

  <!-- ancestors (spine) green: 5, 9 -->
  <g filter="url(#sk2)"><circle cx="235" cy="122" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="235" y="127" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">5</text>
  <g filter="url(#sk2)"><circle cx="315" cy="180" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="315" y="185" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">9</text>

  <!-- sibling-subtree blue: 8,2,1,4,6 -->
  <g filter="url(#sk2)"><circle cx="165" cy="180" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="165" y="185" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">8</text>
  <g filter="url(#sk2)"><circle cx="115" cy="272" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="115" y="277" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <g filter="url(#sk2)"><circle cx="225" cy="272" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="225" y="277" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <g filter="url(#sk2)"><circle cx="65" cy="360" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="65" y="365" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <g filter="url(#sk2)"><circle cx="165" cy="360" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="165" y="365" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">6</text>

  <!-- sibling orange: 7 -->
  <g filter="url(#sk2)"><circle cx="385" cy="272" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="385" y="277" text-anchor="middle" font-size="13" fill="#a0752a" font-weight="bold">7</text>

  <!-- depth ruler -->
  <g font-size="10" fill="#999">
    <text x="428" y="126" text-anchor="end">深度 0</text>
    <text x="428" y="184" text-anchor="end">深度 1</text>
    <text x="428" y="276" text-anchor="end">深度 2</text>
    <text x="428" y="364" text-anchor="end">深度 3</text>
  </g>
  <path d="M 436 118 L 436 360" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)"/>

  <!-- annotations -->
  <g filter="url(#sk)">
    <rect x="30" y="415" width="440" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="46" y="437" font-size="11.5" fill="#2e6e2e" font-weight="bold">祖先（脊柱 5→9）：幸存，最深为 9，深度 1</text>
  <text x="46" y="458" font-size="11.5" fill="#2e6e2e">f(x) = depth(x) + height(x) = 子树 x 内最深叶子的深度</text>

  <g filter="url(#sk)">
    <rect x="30" y="483" width="440" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="46" y="505" font-size="11.5" fill="#a0752a" font-weight="bold">各层「姐妹」：v 的姐妹 7 → f(7) = 2+0 = 2；</text>
  <text x="46" y="526" font-size="11.5" fill="#a0752a">更高分叉：根处姐妹 8 → f(8) = 1+2 = 3 ★ 最深幸存叶</text>

  <g filter="url(#sk)">
    <rect x="30" y="551" width="440" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="46" y="573" font-size="11.5" fill="#b85450" font-weight="bold">G(3) = max( 深度0, 深度1, f(7)=2, f(8)=3 ) = 3</text>
  <text x="46" y="594" font-size="11.5" fill="#b85450">移除子树(3) 后剩余高度 = 3（路径 5→8→2→4）✓</text>

  <!-- arrows from groups to boxes -->
  <path d="M 200 400 Q 160 408 150 413" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 300 400 Q 260 460 240 481" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- ===== Right: definition panel ===== -->
  <g filter="url(#sk)">
    <rect x="510" y="72" width="400" height="180" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="530" y="98" font-size="13" font-weight="bold" fill="#2b6e9e">两个方向的基本量（各一趟遍历）</text>
  <text x="530" y="124" font-size="11.5" fill="#444">depth(u)：根到 u 的边数，根为 0 —— 自顶向下传</text>
  <text x="530" y="146" font-size="11.5" fill="#444">height(u)：子树 u 的高度，叶子为 0 —— 自底向上汇</text>
  <text x="530" y="172" font-size="12.5" fill="#b03a3a" font-weight="bold" font-family="monospace">f(u) = depth(u) + height(u)</text>
  <text x="530" y="196" font-size="11.5" fill="#666">= 子树 u 内最深叶子的深度（以根为基准）</text>
  <text x="530" y="222" font-size="11.5" fill="#666">★ 二叉树里每个孩子至多一个「姐妹」，这是</text>
  <text x="530" y="240" font-size="11.5" fill="#666">  递推能做到 O(1) 每节点的关键</text>

  <g filter="url(#sk)">
    <rect x="510" y="272" width="400" height="132" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="530" y="298" font-size="13" font-weight="bold" fill="#2e6e2e">幸存者刻画（引理 1）</text>
  <text x="530" y="324" font-size="11.5" fill="#444">移除 subtree(v) 后，剩余树仍以根为根，</text>
  <text x="530" y="346" font-size="11.5" fill="#444">节点集恰为 v 的所有非后代。</text>
  <text x="530" y="372" font-size="12.5" fill="#2e6e2e" font-weight="bold" font-family="monospace">G(v) = max{ depth(u) : u ∉ subtree(v) }</text>
  <text x="530" y="394" font-size="11.5" fill="#666">= 剩余高度 = 所求 answer(v)</text>

  <g filter="url(#sk)">
    <rect x="510" y="424" width="400" height="118" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="530" y="450" font-size="12" font-weight="bold" fill="#2b2b2b">非后代的三个来源（引理 3）</text>
  <text x="530" y="476" font-size="11.5" fill="#444">设 a = parent(v)，则幸存者 =</text>
  <text x="530" y="498" font-size="11.5" fill="#2e6e2e">① a 之外的一切（更高层，递归结构）</text>
  <text x="530" y="520" font-size="11.5" fill="#a0752a">② a 本身（无姐妹时它变叶，深度 depth(a)）</text>
  <text x="530" y="542" font-size="11.5" fill="#446688">③ 姐妹 s 的整棵子树（最深叶深度 f(s)）</text>

  <!-- bottom hint -->
  <text x="710" y="586" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">三来源逐层向上嵌套 →</text>
  <text x="710" y="606" text-anchor="middle" font-size="12" fill="#7a5415">「自顶向下累积」即可 O(1) 每节点（见下图）</text>
  <path d="M 710 560 Q 710 570 710 578" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
</svg>
