<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：先算前缀和，再对每个 j 建集合、扫右侧</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1 在唯一的 j 上命中；示例 2 的两个 j 都不成立</text>

  <g filter="url(#rough2)">
    <rect x="30" y="60" width="560" height="30" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="44" y="80" font-size="10.5" fill="#333">示例 1  nums = [1,2,1,2,1,2,1]    pre = [0,1,3,4,6,7,9,10]，n = 7</text>

    <rect x="30" y="96" width="560" height="30" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="44" y="116" font-size="10.5" fill="#333">示例 2  nums = [1,2,1,2,1,2,1,2]  pre = [0,1,3,4,6,7,9,10,12]，n = 8</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="138" width="560" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="158" text-anchor="middle" font-size="10.5" fill="#3a4a66">j 的取值</text>
    <text x="245" y="158" text-anchor="middle" font-size="10.5" fill="#3a4a66">左集合 C(j)</text>
    <text x="430" y="158" text-anchor="middle" font-size="10.5" fill="#3a4a66">右侧扫描 k</text>
    <text x="545" y="158" text-anchor="middle" font-size="10.5" fill="#3a4a66">结论</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="168" width="560" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="80" y="190" text-anchor="middle" font-size="9.8" fill="#3a5a30">示例1 · j=3</text>
    <text x="245" y="190" text-anchor="middle" font-size="9.8" fill="#333">i=1：1 = 4−3 ⇒ C={1}</text>
    <text x="430" y="190" text-anchor="middle" font-size="9.6" fill="#333">k=5：v=1，S4=1 ✓</text>
    <text x="545" y="190" text-anchor="middle" font-size="10" fill="#2f4f28" font-weight="bold">true</text>

    <rect x="30" y="204" width="560" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="80" y="226" text-anchor="middle" font-size="9.8" fill="#555">示例2 · j=3</text>
    <text x="245" y="226" text-anchor="middle" font-size="9.8" fill="#333">i=1：1 = 4−3 ⇒ C={1}</text>
    <text x="430" y="226" text-anchor="middle" font-size="9.6" fill="#333">k=5：v=1，S4=3 ✗</text>
    <text x="545" y="226" text-anchor="middle" font-size="10" fill="#777">继续</text>

    <rect x="30" y="240" width="560" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="80" y="262" text-anchor="middle" font-size="9.8" fill="#555">示例2 · j=3（续）</text>
    <text x="245" y="262" text-anchor="middle" font-size="9.8" fill="#777">（同一个 j）</text>
    <text x="430" y="262" text-anchor="middle" font-size="9.6" fill="#333">k=6：v=2=S4 但 2∉C</text>
    <text x="545" y="262" text-anchor="middle" font-size="10" fill="#777">继续</text>

    <rect x="30" y="276" width="560" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="80" y="298" text-anchor="middle" font-size="9.8" fill="#8a6a20">示例2 · j=4</text>
    <text x="245" y="298" text-anchor="middle" font-size="9.8" fill="#8a6a20">∅（1 ≠ 3，3 ≠ 2）</text>
    <text x="430" y="298" text-anchor="middle" font-size="9.6" fill="#8a6a20">空集，不扫</text>
    <text x="545" y="298" text-anchor="middle" font-size="10" fill="#8a6a20">跳过</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="320" width="560" height="44" rx="8" fill="#f0f4ff" stroke="#446688" stroke-width="1.3"/>
    <text x="44" y="339" font-size="10.5" fill="#3a4a66">示例 1 命中 (i,j,k) = (1,3,5)：四段各是 [1]，和都为 1。</text>
    <text x="44" y="356" font-size="10.5" fill="#3a4a66">示例 2 的 j 只取 3、4（n−4 = 4），两处都不命中 ⇒ 返回 false。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="370" width="560" height="26" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="44" y="388" font-size="10" fill="#777">被丢弃的三个元素不参与求和：四段和相等才是合法切法。</text>
  </g>
</svg>
