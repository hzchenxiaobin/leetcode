<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="680" height="540" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟计数 → 两种排序 → 拼表补零</text>
  <path d="M 180 36 Q 340 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="50" y="62" width="400" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="70" y="86" font-size="12.5" font-weight="bold" fill="#2b4a6e">① 一趟扫描计数 — O(n)</text>
  <text x="70" y="108" font-size="11" fill="#444">丢弃姓名；foods ← 所有餐品去重</text>
  <text x="70" y="128" font-size="11" fill="#444">cnt[int(桌号)][餐品] += 1</text>

  <path d="M 250 138 L 250 154" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="50" y="158" width="400" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="70" y="180" font-size="12.5" font-weight="bold" fill="#2e5a24">② 定列序 — O(F log F)</text>
  <text x="70" y="202" font-size="11" fill="#444">foods 按字典序排序；表头 = ["Table"] + foods</text>

  <path d="M 250 220 L 250 236" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="50" y="240" width="400" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="70" y="262" font-size="12.5" font-weight="bold" fill="#8a6415">③ 定行序 — O(T log T)</text>
  <text x="70" y="284" font-size="11" fill="#444">桌号转 int，按数值升序排列</text>

  <path d="M 250 302 L 250 318" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- Step 4 -->
  <g filter="url(#sk)">
    <rect x="50" y="322" width="400" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="70" y="346" font-size="12.5" font-weight="bold" fill="#2b4a6e">④ 拼表 — O(T·F)（输出规模）</text>
  <text x="70" y="368" font-size="11" fill="#444">每桌一行：[str(桌号)] + 各餐品计数</text>
  <text x="70" y="388" font-size="11" fill="#444">未点过的餐品格子填 "0"</text>

  <path d="M 250 398 L 250 414" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="250" cy="444" rx="112" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="250" y="449" text-anchor="middle" font-size="12.5" fill="#2e5a24" font-weight="bold">返回点菜展示表 ✓</text>

  <!-- 右侧：桌号排序陷阱 -->
  <path d="M 452 271 Q 466 262 472 236" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="476" y="158" width="184" height="150" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4"/>
  </g>
  <text x="568" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3830">⚠ 桌号排序陷阱</text>
  <text x="568" y="206" text-anchor="middle" font-size="10.5" fill="#444">桌号以字符串给出</text>
  <text x="568" y="226" text-anchor="middle" font-size="10.5" fill="#444">字典序 "10"&lt;"3"&lt;"5" ✗</text>
  <text x="568" y="246" text-anchor="middle" font-size="10.5" fill="#444">数值序 3&lt;5&lt;10 ✓</text>
  <text x="568" y="266" text-anchor="middle" font-size="10.5" fill="#444">必须转 int 排序，</text>
  <text x="568" y="284" text-anchor="middle" font-size="10.5" fill="#444">输出时再转回 str</text>

  <!-- 右侧：复杂度 -->
  <g filter="url(#sk)">
    <rect x="476" y="322" width="184" height="96" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>
  </g>
  <text x="568" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">复杂度</text>
  <text x="568" y="366" text-anchor="middle" font-size="10.5" fill="#444">时间 O(n + F log F + T·F)</text>
  <text x="568" y="386" text-anchor="middle" font-size="10.5" fill="#444">空间 O(T·F)</text>
  <text x="568" y="406" text-anchor="middle" font-size="10" fill="#888">T·F 为输出规模下界</text>

  <text x="340" y="505" text-anchor="middle" font-size="10" fill="#888">n = 订单数 ≤ 5×10⁴　　T = 不同桌号 ≤ 500　　F = 不同餐品 ≤ n</text>
</svg>
