<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：双向计数（按下标，不按值去重）</text>

  <!-- 第一行：answer1 -->
  <text x="42" y="73" font-size="13" fill="#446688" filter="url(#rough2)">answer1</text>
  <g filter="url(#rough2)">
    <rect x="110" y="52" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="150" y="52" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="190" y="52" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="230" y="52" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="270" y="52" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="128" y="73" text-anchor="middle" font-size="13" fill="#333">4</text>
    <text x="168" y="73" text-anchor="middle" font-size="13" fill="#1c3a1c">3</text>
    <text x="208" y="73" text-anchor="middle" font-size="13" fill="#1c3a1c">2</text>
    <text x="248" y="73" text-anchor="middle" font-size="13" fill="#1c3a1c">3</text>
    <text x="288" y="73" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="128" y="100" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
    <text x="168" y="100" text-anchor="middle" font-size="13" fill="#4a7a3a">✓</text>
    <text x="208" y="100" text-anchor="middle" font-size="13" fill="#4a7a3a">✓</text>
    <text x="248" y="100" text-anchor="middle" font-size="13" fill="#4a7a3a">✓</text>
    <text x="288" y="100" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
  </g>
  <text x="330" y="80" font-size="12" fill="#555" filter="url(#rough2)">是否 ∈ s2 = {2,3,5,6}？</text>
  <text x="330" y="97" font-size="12" fill="#7a5a10" filter="url(#rough2)">计 3 个 ✓ → answer1 = 3</text>

  <!-- 第二行：answer2 -->
  <text x="42" y="153" font-size="13" fill="#446688" filter="url(#rough2)">answer2</text>
  <g filter="url(#rough2)">
    <rect x="110" y="132" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="150" y="132" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="190" y="132" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="230" y="132" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="270" y="132" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="310" y="132" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="128" y="153" text-anchor="middle" font-size="13" fill="#1c3a1c">2</text>
    <text x="168" y="153" text-anchor="middle" font-size="13" fill="#1c3a1c">2</text>
    <text x="208" y="153" text-anchor="middle" font-size="13" fill="#333">5</text>
    <text x="248" y="153" text-anchor="middle" font-size="13" fill="#1c3a1c">2</text>
    <text x="288" y="153" text-anchor="middle" font-size="13" fill="#1c3a1c">3</text>
    <text x="328" y="153" text-anchor="middle" font-size="13" fill="#333">6</text>
    <text x="128" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a">✓</text>
    <text x="168" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a">✓</text>
    <text x="208" y="180" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
    <text x="248" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a">✓</text>
    <text x="288" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a">✓</text>
    <text x="328" y="180" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
  </g>
  <text x="370" y="160" font-size="12" fill="#555" filter="url(#rough2)">是否 ∈ s1 = {1,2,3,4}？</text>
  <text x="370" y="177" font-size="12" fill="#7a5a10" filter="url(#rough2)">计 4 个 ✓ → answer2 = 4</text>

  <!-- 强调框 -->
  <rect x="60" y="215" width="440" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="235" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">nums1 里的两个 3 都查得 ✓：重复值各贡献一次</text>
  <text x="280" y="253" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">若误算成交集大小 len(s1∩s2) = 2 就错了！</text>

  <text x="280" y="300" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">返回 [answer1, answer2] = [3, 4]</text>
</svg>
