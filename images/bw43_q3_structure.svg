<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">目标结构（n = 5 的答案）：数字 1 只出现一次，i 出现两次且间距恰为 i</text>

  <!-- 距离弧线 -->
  <path d="M75,146 Q259,20 443,146" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="259" y="52" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">距离 = 5</text>
  <path d="M213,146 Q305,78 397,146" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="305" y="106" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">距离 = 4</text>
  <path d="M121,146 Q167,104 213,146" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="167" y="126" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">距离 = 3</text>
  <path d="M351,146 Q374,118 397,146" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="399" y="126" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- 序列格子：9 个，44 宽 -->
  <g filter="url(#rough2)">
    <rect x="53" y="146" width="44" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="75" y="175" text-anchor="middle" font-size="17" fill="#8a6d3b">5</text>
    <rect x="99" y="146" width="44" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="121" y="175" text-anchor="middle" font-size="17" fill="#4a7a3a">3</text>
    <rect x="145" y="146" width="44" height="46" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
    <text x="167" y="175" text-anchor="middle" font-size="17" fill="#777">1</text>
    <rect x="191" y="146" width="44" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="213" y="175" text-anchor="middle" font-size="17" fill="#446688">4</text>
    <rect x="237" y="146" width="44" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="259" y="175" text-anchor="middle" font-size="17" fill="#4a7a3a">3</text>
    <rect x="283" y="146" width="44" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="305" y="175" text-anchor="middle" font-size="17" fill="#8a6d3b">5</text>
    <rect x="329" y="146" width="44" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="351" y="175" text-anchor="middle" font-size="17" fill="#b85450">2</text>
    <rect x="375" y="146" width="44" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="397" y="175" text-anchor="middle" font-size="17" fill="#446688">4</text>
    <rect x="421" y="146" width="44" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="443" y="175" text-anchor="middle" font-size="17" fill="#b85450">2</text>
  </g>
  <!-- 下标 -->
  <g filter="url(#rough2)" font-size="10" fill="#aaa" text-anchor="middle">
    <text x="75" y="204">0</text>
    <text x="121" y="204">1</text>
    <text x="167" y="204">2</text>
    <text x="213" y="204">3</text>
    <text x="259" y="204">4</text>
    <text x="305" y="204">5</text>
    <text x="351" y="204">6</text>
    <text x="397" y="204">7</text>
    <text x="443" y="204">8</text>
  </g>

  <text x="260" y="240" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">序列长度 = 2n − 1 = 9；下标之差 |j − i| 就是「距离」</text>
  <text x="260" y="270" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1 只出现一次（灰色），2..n 每个数恰好两次</text>
  <text x="260" y="302" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">字典序最大 ⇒ 尽早、尽量大地填左边的空位</text>
  <text x="260" y="334" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">题面保证有解：搜索总能走到底，回溯只为纠正「贪大」的选择</text>
</svg>
