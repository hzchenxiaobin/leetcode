<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：red = 2, blue = 4</text>
  <path d="M 330 42 Q 470 50 610 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: red-top ===== -->
  <text x="470" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">方案① 红顶：奇数行用红，偶数行用蓝</text>

  <!-- step rows: [row label, need, color, result] -->
  <g font-size="12">
    <!-- row 1 -->
    <g filter="url(#sk2)"><circle cx="270" cy="108" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="270" y="113" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">R</text>
    <text x="300" y="113" font-size="12" fill="#444">行1：需 1 红 ✓（red: 2 → 1）</text>
    <!-- row 2 -->
    <g filter="url(#sk2)"><circle cx="256" cy="146" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="256" y="151" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">B</text>
    <g filter="url(#sk2)"><circle cx="286" cy="146" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="286" y="151" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">B</text>
    <text x="316" y="151" font-size="12" fill="#444">行2：需 2 蓝 ✓（blue: 4 → 2）</text>
    <!-- row 3 fail -->
    <g filter="url(#sk2)" opacity="0.5"><circle cx="242" cy="184" r="14" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3"/></g>
    <g filter="url(#sk2)" opacity="0.5"><circle cx="271" cy="184" r="14" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3"/></g>
    <g filter="url(#sk2)" opacity="0.5"><circle cx="300" cy="184" r="14" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3"/></g>
    <text x="330" y="189" font-size="12" fill="#b03a3a" font-weight="bold">行3：需 3 红 ✗（red 仅剩 1）→ 停止</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="620" y="120" width="240" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="740" y="148" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">方案① 最大高度</text>
  <text x="740" y="176" text-anchor="middle" font-size="24" fill="#b03a3a" font-weight="bold">h = 2</text>

  <!-- ===== Panel B: blue-top ===== -->
  <text x="470" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">方案② 蓝顶：奇数行用蓝，偶数行用红</text>

  <g font-size="12">
    <!-- row 1 -->
    <g filter="url(#sk2)"><circle cx="270" cy="280" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="270" y="285" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">B</text>
    <text x="300" y="285" font-size="12" fill="#444">行1：需 1 蓝 ✓（blue: 4 → 3）</text>
    <!-- row 2 -->
    <g filter="url(#sk2)"><circle cx="256" cy="318" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="256" y="323" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">R</text>
    <g filter="url(#sk2)"><circle cx="286" cy="318" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="286" y="323" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">R</text>
    <text x="316" y="323" font-size="12" fill="#444">行2：需 2 红 ✓（red: 2 → 0）</text>
    <!-- row 3 ok -->
    <g filter="url(#sk2)"><circle cx="242" cy="356" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="242" y="361" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">B</text>
    <g filter="url(#sk2)"><circle cx="271" cy="356" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="271" y="361" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">B</text>
    <g filter="url(#sk2)"><circle cx="300" cy="356" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="300" y="361" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">B</text>
    <text x="330" y="361" font-size="12" fill="#444">行3：需 3 蓝 ✓（blue: 3 → 0）</text>
    <!-- row 4 fail -->
    <g filter="url(#sk2)" opacity="0.5"><circle cx="228" cy="394" r="14" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3"/></g>
    <g filter="url(#sk2)" opacity="0.5"><circle cx="257" cy="394" r="14" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3"/></g>
    <g filter="url(#sk2)" opacity="0.5"><circle cx="286" cy="394" r="14" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3"/></g>
    <g filter="url(#sk2)" opacity="0.5"><circle cx="315" cy="394" r="14" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3"/></g>
    <text x="345" y="399" font-size="12" fill="#b03a3a" font-weight="bold">行4：需 4 红 ✗（red 仅剩 0）→ 停止</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="620" y="300" width="240" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="740" y="328" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">方案② 最大高度</text>
  <text x="740" y="356" text-anchor="middle" font-size="24" fill="#2b6e9e" font-weight="bold">h = 3</text>

  <!-- ===== Final answer ===== -->
  <path d="M 470 428 L 470 448" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="270" y="452" width="400" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/>
  </g>
  <text x="470" y="480" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">答案 = max(2, 3) = 3</text>

  <!-- ===== Final triangle picture ===== -->
  <text x="470" y="536" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">最优三角形（蓝顶方案）：</text>
  <!-- row1 blue -->
  <g filter="url(#sk2)"><circle cx="470" cy="566" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <!-- row2 red -->
  <g filter="url(#sk2)"><circle cx="448" cy="606" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/></g>
  <g filter="url(#sk2)"><circle cx="492" cy="606" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/></g>
  <!-- row3 blue -->
  <g filter="url(#sk2)"><circle cx="426" cy="646" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <g filter="url(#sk2)"><circle cx="470" cy="646" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <g filter="url(#sk2)"><circle cx="514" cy="646" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <!-- side annotation -->
  <text x="580" y="572" font-size="11" fill="#446688">行1：1 蓝</text>
  <text x="580" y="612" font-size="11" fill="#b85450">行2：2 红</text>
  <text x="580" y="652" font-size="11" fill="#446688">行3：3 蓝</text>
  <text x="700" y="612" font-size="12" fill="#2e6e2e" font-weight="bold">共用蓝 1+3=4 个 ✓</text>
  <text x="700" y="634" font-size="12" fill="#2e6e2e" font-weight="bold">共用红 2 个 ✓</text>
  <!-- left annotation -->
  <text x="330" y="612" font-size="11" fill="#888">相邻行颜色不同</text>
  <text x="330" y="630" font-size="11" fill="#888">每行内部同色</text>
</svg>
