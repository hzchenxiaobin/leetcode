<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="340" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">单组数据 O(n log²n) 算法流程</text>
  <rect x="24" y="58" width="156" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="102.0" y="83" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">读入 a₁ … aₙ</text>
  <text x="102.0" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">O(n)</text>
  <rect x="212" y="58" width="210" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="317.0" y="83" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">分治 NTT 求乘积</text>
  <text x="317.0" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">E(x) = ∏ (1 + aᵢx)</text>
  <rect x="454" y="58" width="162" height="58" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="535.0" y="83" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">A_m = e_m · e_(n−m)</text>
  <text x="535.0" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">一次卷积 / 线性</text>
  <rect x="454" y="176" width="162" height="58" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="535.0" y="201" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">前缀 S_m</text>
  <text x="535.0" y="220" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">S_m = Σ (n−2j)A_j</text>
  <rect x="212" y="176" width="210" height="58" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="317.0" y="201" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">μ_m 与累加</text>
  <text x="317.0" y="220" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">μ_m = (2m+1)A_m − 2S_m</text>
  <rect x="24" y="176" width="156" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="102.0" y="201" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">× 2/(n(n+1))</text>
  <text x="102.0" y="220" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">输出答案</text>
  <line x1="180" y1="87" x2="208" y2="87" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <line x1="422" y1="87" x2="450" y2="87" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <line x1="535" y1="116" x2="535" y2="172" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <line x1="454" y1="205" x2="426" y2="205" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <line x1="212" y1="205" x2="184" y2="205" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <rect x="110" y="256" width="420" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="278" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">答案 = 2/(n(n+1)) · Σ m!(n−m)!·μ_m</text>
  <text x="320" y="312" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">多测总 Σn ≤ 2×10⁵；每测一次分治 NTT，其余线性扫描</text>
  <text x="320" y="331" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">NTT 模数 998244353，原根 3</text>
</svg>