<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：整除条件换向 —— 先滤 k，再查 x/k 的约数</text>
  <text x="280" y="50" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">下标对 → 值对：两张频次表折叠重复值，去重省枚举、计数乘回频次</text>

  <rect x="155" y="60" width="250" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">判定：nums2[j]·k 整除 nums1[i]？</text>

  <path d="M 280 94 L 280 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="108" font-size="11" fill="#666" filter="url(#rough2)">等价改写（引理 1）</text>

  <rect x="40" y="118" width="230" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="137" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 先过滤：k | x ？</text>
  <text x="155" y="155" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">不成立 → 与谁都配不成，整支剪掉</text>

  <rect x="290" y="118" width="230" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="137" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 再配对：nums2[j] | y</text>
  <text x="405" y="155" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">令 y = x/k，枚举 y 的约数 d，查 cnt2[d]</text>

  <path d="M 405 164 L 405 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="186" width="150" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="205" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">示例：x = 12, k = 3</text>
  <text x="115" y="222" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">→ y = 4</text>

  <path d="M 190 208 L 208 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="214" y="190" width="36" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="207" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="232" y="228" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">cnt2=0 ✗</text>

  <rect x="258" y="190" width="36" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="207" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="276" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cnt2=1 ✓</text>

  <rect x="302" y="190" width="36" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="207" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="320" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cnt2=1 ✓</text>

  <text x="276" y="182" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">y = 4 的约数（试除 d ≤ √y，白得对称约数 y/d）</text>

  <path d="M 348 208 L 364 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="370" y="186" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">命中 2、4</text>
  <text x="445" y="222" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贡献 cnt1[12] × 2</text>

  <rect x="70" y="298" width="420" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="323" text-anchor="middle" font-size="13.5" fill="#446688" filter="url(#rough2)">ans = Σ (去重 x, k | x)  cnt1[x] · Σ (d | x/k)  cnt2[d]</text>

  <text x="280" y="360" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">试除上界 √(x/k)：k 越大枚举越省；答案上界 n·m = 10¹⁰，必须 long long</text>
  <text x="280" y="382" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">（示例：nums2 = [2,4] → cnt2 = {2:1, 4:1}，nums1 无重复值）</text>
</svg>
