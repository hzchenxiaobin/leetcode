<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描 + 哈希集合查重</text>

  <!-- 步骤 1：开始 -->
  <rect x="200" y="52" width="160" height="34" rx="16" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="13" fill="#2b3a4e" filter="url(#rough2)">开始：seen = 空集合</text>

  <path d="M 280 86 L 280 108" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2：循环判定 -->
  <polygon points="280,108 380,140 280,172 180,140" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#6b5416" filter="url(#rough2)">i &lt; n−1 ？</text>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#6b5416" filter="url(#rough2)">nums[i]+nums[i+1]</text>

  <path d="M 380 140 L 452 140" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="412" y="132" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <path d="M 280 172 L 280 196" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="190" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <!-- 步骤 3：查重 -->
  <polygon points="280,196 366,224 280,252 194,224" fill="#fce4ec"
           stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#7a3230" filter="url(#rough2)">和 ∈ seen ？</text>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#7a3230" filter="url(#rough2)">(已出现过)</text>

  <path d="M 194 224 L 120 224" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="216" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="36" y="206" width="84" height="36" rx="6" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="228" text-anchor="middle" font-size="13" fill="#7a3230" font-weight="bold" filter="url(#rough2)">返回 true</text>

  <path d="M 280 252 L 280 276" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="270" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 步骤 4：入集 -->
  <rect x="196" y="278" width="168" height="34" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#2e4d26" filter="url(#rough2)">seen.insert(和)；i++，回到判定</text>

  <!-- 步骤 5：结束 -->
  <path d="M 452 140 L 470 140 L 470 300 L 364 300" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <rect x="392" y="206" width="120" height="34" rx="16" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="228" text-anchor="middle" font-size="13" fill="#2b3a4e" filter="url(#rough2)">返回 false</text>
  <path d="M 452 174 L 452 206" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 注记 -->
  <text x="290" y="330" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n−1 个长度为 2 的子数组，每个 O(1) 判定，总 O(n)</text>
</svg>
