<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察一：把 SUM 与 XOR 按二进制位拆开</text>

  <!-- 左侧：三个数的位阵 -->
  <text x="78" y="96" text-anchor="end" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="78" y="138" text-anchor="end" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="78" y="180" text-anchor="end" font-size="13" fill="#2b2b2b" filter="url(#rough2)">6</text>

  <text x="119" y="66" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">权 4</text>
  <text x="179" y="66" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">权 2</text>
  <text x="239" y="66" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">权 1</text>

  <!-- 3 = 0 1 1 -->
  <rect x="96" y="74" width="46" height="36" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="156" y="74" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <rect x="216" y="74" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="119" y="98" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <text x="179" y="98" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="239" y="98" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1</text>

  <!-- 5 = 1 0 1 -->
  <rect x="96" y="116" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <rect x="156" y="116" width="46" height="36" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="216" y="116" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="119" y="140" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="179" y="140" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <text x="239" y="140" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1</text>

  <!-- 6 = 1 1 0 -->
  <rect x="96" y="158" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <rect x="156" y="158" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <rect x="216" y="158" width="46" height="36" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="119" y="182" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="179" y="182" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="239" y="182" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>

  <text x="179" y="212" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">每列 1 的个数 c = 2, 2, 2</text>
  <text x="60" y="234" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">SUM = 3 + 5 + 6 = 14</text>
  <text x="60" y="258" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">XOR = 3 ⊕ 5 ⊕ 6 = 0</text>

  <!-- 右侧：逐位贡献表 -->
  <text x="424" y="72" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">权重</text>
  <text x="512" y="72" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">该位个数 c</text>
  <text x="612" y="72" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">Σ 的贡献</text>
  <text x="700" y="72" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">⊕ 的贡献</text>
  <line x1="410" y1="80" x2="732" y2="80" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="424" y="104" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="512" y="104" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="612" y="104" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">8</text>
  <text x="700" y="104" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">0</text>

  <text x="424" y="128" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="512" y="128" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="612" y="128" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="700" y="128" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">0</text>

  <text x="424" y="152" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="512" y="152" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="612" y="152" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="700" y="152" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">0</text>
  <line x1="410" y1="166" x2="732" y2="166" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="571" y="188" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">每行 Σ ≥ ⊕，差值恰为 2^k</text>
  <path d="M 571 196 L 571 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="50" y="274" width="660" height="176" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="298" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">① 逐位看：SUM 在第 k 位贡献 c_k·2^k，c_k 是段里第 k 位为 1 的元素个数</text>
  <text x="70" y="324" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">② XOR 只保留奇偶，第 k 位只贡献 (c_k mod 2)·2^k</text>
  <text x="70" y="350" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">③ 于是恒有 XOR ≤ SUM；取等 ⟺ 每一位上至多一个元素取到 1</text>
  <text x="70" y="376" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">④ 换成位运算：段内任意两数 a &amp; b = 0（称这样的段为“位不交段”）</text>
  <text x="70" y="402" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">⑤ a_i &lt; 2^20 ⇒ 位不交段里最多 20 个非零元素（每个至少占 1 位且互不相交）</text>
  <text x="70" y="428" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">⑥ 所以从右端点往左扫，至多 20 个非零元素就必然撞上冲突 —— 优化的起点</text>
</svg>
