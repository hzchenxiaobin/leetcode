<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：单遍扫描 + 一次判定</text>
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#888">时间 O(|s|)，额外空间 O(1)</text>

  <rect x="150" y="58" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="81" text-anchor="middle" font-size="11" fill="#3a4a66">初始化：lines = 1，cur = 0</text>

  <path d="M 260 94 L 260 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="112" width="260" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#3a5a30">读下一个字符，w = widths[c − 'a']</text>

  <path d="M 260 150 L 260 164" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,166 400,204 260,242 120,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="209" text-anchor="middle" font-size="11" fill="#8a6a20">cur + w &gt; 100 ?</text>

  <path d="M 400 204 L 432 204 L 432 238" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="197" font-size="10" fill="#b85450">Yes</text>

  <path d="M 260 242 L 260 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="256" font-size="10" fill="#4a7a3a">No</text>

  <rect x="336" y="244" width="166" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="419" y="262" text-anchor="middle" font-size="10.5" fill="#8a3a36">换行：lines += 1</text>
  <text x="419" y="279" text-anchor="middle" font-size="10.5" fill="#8a3a36">cur = w（当前字符归新行）</text>

  <rect x="120" y="264" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="210" y="291" text-anchor="middle" font-size="10.5" fill="#3a5a30">cur += w（本行继续放）</text>

  <path d="M 210 308 L 210 330 L 419 330 L 419 288" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 314 330 L 314 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="314,354 444,392 314,430 184,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="314" y="397" text-anchor="middle" font-size="11" fill="#8a6a20">还有字符？</text>

  <path d="M 184 392 L 70 392 L 70 131 L 124 131" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="80" y="384" font-size="10" fill="#b85450">Yes → 继续循环</text>

  <path d="M 314 430 L 314 442" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="444" width="290" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="315" y="466" text-anchor="middle" font-size="11" fill="#3a4a66">结束，返回 [lines, cur]</text>
</svg>
