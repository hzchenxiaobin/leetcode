<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6e9e"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e6e2e"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：最优对必含端点（0 号或 n−1 号）</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- houses: colors = [1,1,1,6,1,1,1] -->
  <!-- house boxes: w=56 h=40, gap=6, start x=106, y=96 -->
  <g filter="url(#sk2)">
    <rect x="106" y="96" width="56" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.4"/>
    <rect x="168" y="96" width="56" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="230" y="96" width="56" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="292" y="96" width="56" height="40" rx="4" fill="#fbe4ec" stroke="#b8548a" stroke-width="2.4"/>
    <rect x="354" y="96" width="56" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="416" y="96" width="56" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="478" y="96" width="56" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="134" y="121">1</text>
    <text x="196" y="121">1</text>
    <text x="258" y="121">1</text>
    <text x="320" y="121" fill="#a03a6a">6</text>
    <text x="382" y="121">1</text>
    <text x="444" y="121">1</text>
    <text x="506" y="121">1</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="134" y="150">0</text>
    <text x="196" y="150">1</text>
    <text x="258" y="150">2</text>
    <text x="320" y="150">3</text>
    <text x="382" y="150">4</text>
    <text x="444" y="150">5</text>
    <text x="506" y="150">6</text>
  </g>
  <text x="134" y="88" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">端点① colors[0]</text>
  <text x="506" y="88" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">端点② colors[n−1]</text>

  <!-- arrow: scan from house 0 toward right, first different color at j=3 -->
  <path d="M 134 162 Q 180 196 314 200" stroke="#2b6e9e" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arB)"/>
  <!-- arrow: scan from house 6 toward left, first different color at i=3 -->
  <path d="M 506 162 Q 460 196 326 200" stroke="#2e6e2e" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>

  <g filter="url(#sk)">
    <rect x="76" y="218" width="264" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#2b6e9e">
    <text x="92" y="240" font-weight="bold">候选一（配左端点）</text>
    <text x="92" y="258" font-family="monospace">j = 最大下标, colors[j] ≠ colors[0]</text>
    <text x="92" y="274" font-family="monospace">距离 = j − 0 = 3</text>
  </g>

  <g filter="url(#sk)">
    <rect x="368" y="218" width="264" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#2e6e2e">
    <text x="384" y="240" font-weight="bold">候选二（配右端点）</text>
    <text x="384" y="258" font-family="monospace">i = 最小下标, colors[i] ≠ colors[n−1]</text>
    <text x="384" y="274" font-family="monospace">距离 = n−1−i = 6−3 = 3</text>
  </g>

  <g filter="url(#sk)">
    <rect x="140" y="304" width="360" height="52" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="328" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">ans = max(j, n−1−i) = max(3, 3)</text>
  <text x="320" y="348" text-anchor="middle" font-size="18" fill="#7a5415" font-weight="bold">= 3 ✓</text>
</svg>
