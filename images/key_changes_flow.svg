<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="77" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：线性扫描计数</text>
  <path d="M 200 40 Q 320 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start -->
  <g filter="url(#sk)">
    <rect x="250" y="58" width="140" height="36" rx="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">ans = 0, i = 1</text>

  <path d="M 320 94 L 320 118" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Loop diamond -->
  <g filter="url(#sk)">
    <path d="M 320 120 L 410 155 L 320 190 L 230 155 Z" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">i &lt; n ？</text>
  <text x="320" y="168" text-anchor="middle" font-size="11" fill="#7a5415">（还有相邻对）</text>

  <path d="M 410 155 L 470 155 L 470 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="455" y="147" text-anchor="middle" font-size="11" fill="#888">否</text>

  <path d="M 320 190 L 320 214" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="206" font-size="11" fill="#888">是</text>

  <!-- Compare diamond -->
  <g filter="url(#sk)">
    <path d="M 320 216 L 415 252 L 320 288 L 225 252 Z" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">lower(s[i]) ≠</text>
  <text x="320" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">lower(s[i−1]) ？</text>

  <!-- Yes: increment -->
  <path d="M 225 252 L 140 252 L 140 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="186" y="244" text-anchor="middle" font-size="11" fill="#a04a5a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="75" y="330" width="130" height="34" rx="8" fill="#fce8ec" stroke="#b8546a" stroke-width="1.5"/>
  </g>
  <text x="140" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a5a">ans += 1</text>

  <!-- No: skip -->
  <path d="M 415 252 L 500 252 L 500 347 L 215 347" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="462" y="244" text-anchor="middle" font-size="11" fill="#2e6e2e">否</text>

  <!-- i++ -->
  <path d="M 140 364 L 140 380 L 255 380" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="255" y="366" width="110" height="28" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="310" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">i += 1，回到判断</text>
  <path d="M 365 380 L 470 380 L 470 348" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Return -->
  <g filter="url(#sk)">
    <rect x="500" y="330" width="110" height="36" rx="18" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="555" y="353" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">return ans</text>
  <text x="528" y="322" text-anchor="middle" font-size="11" fill="#888">扫描结束</text>
</svg>
