<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="440" fill="#fafafa"/>

  <text x="250" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">排序 + 去重 + 双指针（k &gt; 0）</text>

  <rect x="90" y="44" width="340" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">① 把 nums 升序排序</text>

  <rect x="90" y="106" width="340" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">② 特判 k == 0（频次分支）</text>

  <rect x="90" y="168" width="340" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">③ 去重，得到唯一值数组 u</text>

  <rect x="90" y="230" width="340" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">④ i 从左往右固定，j 右移直到</text>
  <text x="260" y="273" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">u[j] − u[i] ≥ k</text>

  <rect x="90" y="304" width="340" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">⑤ 若 u[j] − u[i] == k：ans++</text>
  <text x="260" y="347" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">然后 i++，j 不回退</text>

  <rect x="90" y="376" width="340" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">⑥ 返回 ans</text>

  <path d="M260,86 L260,104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,148 L260,166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,210 L260,228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,284 L260,302" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,358 L260,374" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="452" y="94" width="190" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="547" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k == 0：答案 =</text>
  <text x="547" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">出现次数 ≥ 2 的</text>
  <text x="547" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不同值的个数</text>
  <path d="M430,127 L450,127" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="452" y="258" width="190" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="547" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j 只向右移动，</text>
  <text x="547" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">扫一遍共 O(m) 次</text>
  <path d="M430,262 L450,272" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="452" y="326" width="190" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="547" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每个数只当一次</text>
  <text x="547" y="366" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">「较小值」，不重复</text>
  <path d="M430,338 L450,346" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
