<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：把「顾客集合」编码成位掩码 mask 做状压 DP</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">每种数字的库存互相独立 → 逐种数字决策：把它的库存「整份拆给」mask 的某个子集</text>

  <!-- left: numbers -->
  <g filter="url(#r)">
    <rect x="70" y="90" width="180" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="70" y="158" width="180" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="70" y="226" width="180" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="14" text-anchor="middle" filter="url(#r)">
    <text x="160" y="114" fill="#33517a">数字 1：库存 cnt=3</text>
    <text x="160" y="182" fill="#33517a">数字 2：库存 cnt=2</text>
    <text x="160" y="250" fill="#33517a">数字 5：库存 cnt=4</text>
    <text x="160" y="310" fill="#888">（≤ 50 种数字）</text>
  </g>

  <!-- middle: subset assignment -->
  <g filter="url(#r)">
    <rect x="330" y="90" width="200" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="330" y="158" width="200" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="13.5" text-anchor="middle" filter="url(#r)">
    <text x="430" y="114" fill="#3a5c2c">把数字 1 的库存分给</text>
    <text x="430" y="134" fill="#3a5c2c">顾客子集 {0, 2} = mask 101</text>
    <text x="430" y="182" fill="#7a5b1e">把数字 2 的库存分给</text>
    <text x="430" y="202" fill="#7a5b1e">顾客子集 {1} = mask 010</text>
  </g>
  <path d="M 254 118 L 324 118" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 254 186 L 324 186" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- right: customers -->
  <g filter="url(#r)">
    <rect x="580" y="86" width="70" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="580" y="142" width="70" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="580" y="198" width="70" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#r)">
    <text x="615" y="107" fill="#b85450">顾客 0</text>
    <text x="615" y="126" fill="#b85450">q=2</text>
    <text x="615" y="163" fill="#b85450">顾客 1</text>
    <text x="615" y="182" fill="#b85450">q=2</text>
    <text x="615" y="219" fill="#b85450">顾客 2</text>
    <text x="615" y="238" fill="#b85450">q=1</text>
  </g>
  <path d="M 532 110 L 576 106" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 532 190 L 576 168" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 532 118 L 576 216" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- condition box -->
  <g filter="url(#r)">
    <rect x="70" y="300" width="580" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="360" y="329" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#r)">可行条件：子集 demand 之和 ≤ 该数字库存（同一种数字不能拆库存喂两个顾客组）</text>
</svg>
