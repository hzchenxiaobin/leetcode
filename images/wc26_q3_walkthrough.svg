<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="680" height="340" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：isConnected = [[1,1,0],[1,1,0],[0,0,1]]</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">只遍历上三角的 3 条候选边</text>

  <rect x="50" y="62" width="580" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">步骤</text>
  <text x="240" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">检查的边 (i, j)</text>
  <text x="400" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">find 结果</text>
  <text x="530" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">动作</text>
  <text x="605" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt</text>

  <rect x="50" y="92" width="580" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始</text>
  <text x="240" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">parent = [0,1,2]</text>
  <text x="400" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">—</text>
  <text x="530" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 个省</text>
  <text x="605" y="113" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>

  <rect x="50" y="126" width="580" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">isConnected[1][0] = 1</text>
  <text x="400" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">find(1)=1, find(0)=0</text>
  <text x="530" y="147" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">合并 {0,1}</text>
  <text x="605" y="147" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>

  <rect x="50" y="160" width="580" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="240" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">isConnected[2][0] = 0</text>
  <text x="400" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">不调用</text>
  <text x="530" y="181" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">跳过</text>
  <text x="605" y="181" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>

  <rect x="50" y="194" width="580" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="215" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="240" y="215" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">isConnected[2][1] = 0</text>
  <text x="400" y="215" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">不调用</text>
  <text x="530" y="215" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">跳过</text>
  <text x="605" y="215" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>

  <path d="M 150 62 L 150 228" fill="none" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 330 62 L 330 228" fill="none" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 470 62 L 470 228" fill="none" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 575 62 L 575 228" fill="none" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <rect x="60" y="252" width="560" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="276" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">只有一次成功合并，故 cnt = 3 − 1 = 2</text>
  <text x="340" y="298" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">即 {0,1} 与 {2} 两个省份，与官方示例输出 2 一致</text>
</svg>
