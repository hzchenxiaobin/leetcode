<svg xmlns="http://www.w3.org/2000/svg" width="720" height="672" viewBox="0 0 720 672" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.9"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.9"/>
    </marker>
  </defs>
  <rect width="720" height="672" fill="#fdfcf7"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：d₁、d₂ 跑正图，d₃ 跑反图，枚举 x 取最小</text>
  <path d="M 170 44 Q 360 54 550 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 图结构 ===== -->
  <!-- 普通边（灰细） -->
  <path d="M 340 258 Q 235 258 160 280" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <path d="M 340 245 Q 235 235 158 264" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="240" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#777" filter="url(#sk)">3</text>
  <text x="240" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#777" filter="url(#sk)">4</text>
  <path d="M 345 194 L 552 168" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="452" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#777" filter="url(#sk)">2</text>

  <!-- x=0 方案：红虚线 1→0 与 0→5 -->
  <path d="M 401 88 L 178 116" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="290" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">3</text>
  <path d="M 172 135 L 478 343" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="405" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">6</text>

  <!-- x=1 方案：蓝粗 0→2、2→1、1→4、4→5 -->
  <path d="M 148 141 L 141 250" stroke="#446688" stroke-width="2.6" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="120" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">2</text>
  <path d="M 158 258 L 403 92" stroke="#446688" stroke-width="2.6" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="296" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <path d="M 438 90 L 550 150" stroke="#446688" stroke-width="2.6" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="505" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">5</text>
  <path d="M 562 182 L 508 340" stroke="#446688" stroke-width="2.6" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="560" y="265" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>

  <!-- 节点 -->
  <g filter="url(#sk)">
    <ellipse cx="150" cy="120" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="150" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">0</text>
  <text x="150" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">src1</text>

  <g filter="url(#sk)">
    <ellipse cx="420" cy="80" rx="22" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="420" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="420" y="46" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">src2</text>

  <g filter="url(#sk)">
    <ellipse cx="140" cy="270" rx="22" ry="22" fill="#fdfdfd" stroke="#888" stroke-width="1.6"/>
  </g>
  <text x="140" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#555" filter="url(#sk)">2</text>

  <g filter="url(#sk)">
    <ellipse cx="355" cy="205" rx="22" ry="22" fill="#fdfdfd" stroke="#888" stroke-width="1.6"/>
  </g>
  <text x="355" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#555" filter="url(#sk)">3</text>

  <g filter="url(#sk)">
    <ellipse cx="570" cy="160" rx="22" ry="22" fill="#fdfdfd" stroke="#888" stroke-width="1.6"/>
  </g>
  <text x="570" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#555" filter="url(#sk)">4</text>

  <g filter="url(#sk)">
    <ellipse cx="500" cy="360" rx="22" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="500" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#8c3a36" filter="url(#sk)">5</text>
  <text x="500" y="400" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">dest</text>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <rect x="55" y="315" width="230" height="62" rx="10" fill="#f4f4ee" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="170" y="336" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">蓝粗：x=1 方案 0→2→1→4→5 = 9</text>
  <text x="170" y="354" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">红虚：x=0 方案 {1→0, 0→5} = 9</text>
  <text x="170" y="371" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">灰细：其余边（含 2→3 双重边）</text>

  <!-- ===== 表格 ===== -->
  <text x="360" y="425" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#33475e" filter="url(#sk)">枚举所有汇合点 x：d₁(x) + d₂(x) + d₃(x)</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="95" y="438" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="155" y="438" width="105" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="260" y="438" width="105" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="365" y="438" width="105" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="470" y="438" width="160" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="125" y="458" fill="#33475e">x</text>
    <text x="207" y="458" fill="#33475e">d₁(x) 蓝</text>
    <text x="312" y="458" fill="#2e6e2e">d₂(x) 绿</text>
    <text x="417" y="458" fill="#7a5415">d₃(x) 橙</text>
    <text x="550" y="458" fill="#33475e">三段和</text>
  </g>

  <!-- 数据行 -->
  <g filter="url(#sk)">
    <rect x="95" y="468" width="535" height="31" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="95" y="499" width="535" height="31" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="95" y="530" width="535" height="31" fill="#fdfdfd" stroke="#bbb" stroke-width="1.2"/>
    <rect x="95" y="561" width="535" height="31" fill="#fdfdfd" stroke="#bbb" stroke-width="1.2"/>
    <rect x="95" y="592" width="535" height="31" fill="#fdfdfd" stroke="#bbb" stroke-width="1.2"/>
    <rect x="95" y="623" width="535" height="31" fill="#fdfdfd" stroke="#bbb" stroke-width="1.2"/>
    <line x1="155" y1="468" x2="155" y2="654" stroke="#ccc" stroke-width="1"/>
    <line x1="260" y1="468" x2="260" y2="654" stroke="#ccc" stroke-width="1"/>
    <line x1="365" y1="468" x2="365" y2="654" stroke="#ccc" stroke-width="1"/>
    <line x1="470" y1="468" x2="470" y2="654" stroke="#ccc" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#sk)">
    <text x="125" y="488" font-weight="bold" fill="#2e6e2e">0</text><text x="207" y="488" fill="#333">0</text><text x="312" y="488" fill="#333">3</text><text x="417" y="488" fill="#333">6</text><text x="550" y="488" font-weight="bold" fill="#b85450">9 ★</text>
    <text x="125" y="519" font-weight="bold" fill="#2e6e2e">1</text><text x="207" y="519" fill="#333">3</text><text x="312" y="519" fill="#333">0</text><text x="417" y="519" fill="#333">6</text><text x="550" y="519" font-weight="bold" fill="#b85450">9 ★</text>
    <text x="125" y="550" fill="#333">2</text><text x="207" y="550" fill="#333">2</text><text x="312" y="550" fill="#333">5</text><text x="417" y="550" fill="#333">6</text><text x="550" y="550" fill="#333">13</text>
    <text x="125" y="581" fill="#333">3</text><text x="207" y="581" fill="#333">5</text><text x="312" y="581" fill="#333">8</text><text x="417" y="581" fill="#333">3</text><text x="550" y="581" fill="#333">16</text>
    <text x="125" y="612" fill="#333">4</text><text x="207" y="612" fill="#333">7</text><text x="312" y="612" fill="#333">5</text><text x="417" y="612" fill="#333">1</text><text x="550" y="612" fill="#333">13</text>
    <text x="125" y="643" fill="#333">5</text><text x="207" y="643" fill="#333">6</text><text x="312" y="643" fill="#333">6</text><text x="417" y="643" fill="#333">0</text><text x="550" y="643" fill="#333">12</text>
  </g>
</svg>
