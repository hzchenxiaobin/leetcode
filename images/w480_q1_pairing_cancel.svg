<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">配对视角：第 i 小 与 第 i 大 配对相减</text>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">例：nums = [1,3,5,7,9]，k = 3（2k &gt; n，两端窗口重叠）</text>

  <path d="M148 162 C148 90, 372 90, 372 162" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">9 − 1 = 8</text>
  <path d="M204 162 C204 122, 316 122, 316 162" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">7 − 3 = 4</text>

  <rect x="230" y="164" width="60" height="46" rx="6" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="124" y="168" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="168" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="168" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="292" y="168" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="348" y="168" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="191" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="204" y="191" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="260" y="191" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="316" y="191" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="372" y="191" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>

  <path d="M124 210 L124 220 L284 220 L284 210" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="238" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">最小 k=3 个：1+3+5 = 9</text>

  <path d="M236 230 L236 240 L396 240 L396 230" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="258" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#rough2)">最大 k=3 个：5+7+9 = 21</text>

  <rect x="55" y="272" width="410" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">中间的 5 同时落在两个窗口里，做差时相互抵消</text>
  <text x="260" y="322" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">答案 = (9−1) + (7−3) + (5−5) = 12</text>
</svg>
