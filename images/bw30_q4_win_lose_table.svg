<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    前 18 项胜负表：必败态差 2、3 交替
  </text>

  <!-- 表格两行：i 与状态 -->
  <g filter="url(#rough2)" font-size="12">
    <text x="58" y="82" text-anchor="end" fill="#666">i</text>
    <text x="58" y="118" text-anchor="end" fill="#666">状态</text>
  </g>
  <g filter="url(#rough2)" font-size="12">
    <!-- i 行 -->
    <text x="90" y="82" text-anchor="middle" fill="#666">0</text>
    <text x="116" y="82" text-anchor="middle" fill="#666">1</text>
    <text x="142" y="82" text-anchor="middle" fill="#666">2</text>
    <text x="168" y="82" text-anchor="middle" fill="#666">3</text>
    <text x="194" y="82" text-anchor="middle" fill="#666">4</text>
    <text x="220" y="82" text-anchor="middle" fill="#666">5</text>
    <text x="246" y="82" text-anchor="middle" fill="#666">6</text>
    <text x="272" y="82" text-anchor="middle" fill="#666">7</text>
    <text x="298" y="82" text-anchor="middle" fill="#666">8</text>
    <text x="324" y="82" text-anchor="middle" fill="#666">9</text>
    <text x="350" y="82" text-anchor="middle" fill="#666">10</text>
    <text x="376" y="82" text-anchor="middle" fill="#666">11</text>
    <text x="402" y="82" text-anchor="middle" fill="#666">12</text>
    <text x="428" y="82" text-anchor="middle" fill="#666">13</text>
    <text x="454" y="82" text-anchor="middle" fill="#666">14</text>
    <text x="480" y="82" text-anchor="middle" fill="#666">…</text>
  </g>
  <g filter="url(#rough2)" font-size="12">
    <!-- 必败 L -->
    <rect x="78" y="92" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <rect x="130" y="92" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <rect x="208" y="92" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <rect x="260" y="92" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <rect x="338" y="92" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <!-- 必胜 W -->
    <rect x="104" y="92" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="156" y="92" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="182" y="92" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="234" y="92" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="286" y="92" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="312" y="92" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="364" y="92" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="390" y="92" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="416" y="92" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="442" y="92" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="468" y="92" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <!-- 文本 -->
    <text x="90" y="109" text-anchor="middle" fill="#b85450">L</text>
    <text x="116" y="109" text-anchor="middle" fill="#2f5a24">W</text>
    <text x="142" y="109" text-anchor="middle" fill="#b85450">L</text>
    <text x="168" y="109" text-anchor="middle" fill="#2f5a24">W</text>
    <text x="194" y="109" text-anchor="middle" fill="#2f5a24">W</text>
    <text x="220" y="109" text-anchor="middle" fill="#b85450">L</text>
    <text x="246" y="109" text-anchor="middle" fill="#2f5a24">W</text>
    <text x="272" y="109" text-anchor="middle" fill="#b85450">L</text>
    <text x="298" y="109" text-anchor="middle" fill="#2f5a24">W</text>
    <text x="324" y="109" text-anchor="middle" fill="#2f5a24">W</text>
    <text x="350" y="109" text-anchor="middle" fill="#b85450">L</text>
    <text x="376" y="109" text-anchor="middle" fill="#2f5a24">W</text>
    <text x="402" y="109" text-anchor="middle" fill="#2f5a24">W</text>
    <text x="428" y="109" text-anchor="middle" fill="#2f5a24">W</text>
    <text x="454" y="109" text-anchor="middle" fill="#2f5a24">W</text>
    <text x="480" y="109" text-anchor="middle" fill="#2f5a24">…</text>
  </g>

  <!-- 官方示例标注 -->
  <g filter="url(#rough2)">
    <path d="M 142 74 L 142 60" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 272 74 L 272 60" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 350 74 L 350 60" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="142" y="54" text-anchor="middle" fill="#b85450">n=2 输</text>
    <text x="272" y="54" text-anchor="middle" fill="#b85450">n=7 输</text>
    <text x="350" y="54" text-anchor="middle" fill="#b85450">n=10 输</text>
  </g>

  <!-- 必败态序列说明 -->
  <rect x="60" y="150" width="400" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">必败态（P 态）序列</text>
  <text x="260" y="192" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0, 2, 5, 7, 10, 12, 15, 17, 20, 22, …</text>

  <!-- 差分说明 -->
  <g filter="url(#rough2)" font-size="13">
    <text x="120" y="234" fill="#666">0</text>
    <text x="152" y="234" fill="#666">→(+2)</text>
    <text x="196" y="234" fill="#666">2</text>
    <text x="228" y="234" fill="#666">→(+3)</text>
    <text x="272" y="234" fill="#666">5</text>
    <text x="304" y="234" fill="#666">→(+2)</text>
    <text x="348" y="234" fill="#666">7</text>
    <text x="380" y="234" fill="#666">→(+3)</text>
    <text x="424" y="234" fill="#666">10</text>
  </g>

  <!-- 关键验证 -->
  <rect x="60" y="258" width="400" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    抽查 n=8：拿 1 → 7(L) ⇒ W；n=17：拿 1,4,9,16
  </text>
  <text x="260" y="302" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    分别到 16, 13, 8, 1，全为 W ⇒ n=17 必败（示例 5 ✓）
  </text>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">
    DP 打表即可，规律仅作交叉验证
  </text>
</svg>
