<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：一趟遍历建聚合表</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">creators = [alice, bob, alice, chris]，ids = [one, two, three, four]，views = [5, 10, 5, 4]</text>

  <!-- header row -->
  <rect x="40" y="62" width="40" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="79" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">i</text>
  <rect x="80" y="62" width="170" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="79" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">三元组 (c, id, v)</text>
  <rect x="250" y="62" width="100" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="79" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">tot[c]（后）</text>
  <rect x="350" y="62" width="130" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="415" y="79" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">best[c]（后）</text>
  <rect x="480" y="62" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="506" y="79" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">maxPop</text>

  <!-- row 0 -->
  <rect x="40" y="88" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="80" y="88" width="170" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(alice, one, 5)</text>
  <rect x="250" y="88" width="100" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">alice = 5</text>
  <rect x="350" y="88" width="130" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="415" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(5, "one")</text>
  <rect x="480" y="88" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="506" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>

  <!-- row 1 -->
  <rect x="40" y="118" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="137" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="118" width="170" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="137" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(bob, two, 10)</text>
  <rect x="250" y="118" width="100" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="137" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">bob = 10</text>
  <rect x="350" y="118" width="130" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="415" y="137" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(10, "two")</text>
  <rect x="480" y="118" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="506" y="137" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>

  <!-- row 2: key step, highlighted -->
  <rect x="40" y="148" width="40" height="32" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="60" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="80" y="148" width="170" height="32" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="165" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(alice, three, 5)</text>
  <rect x="250" y="148" width="100" height="32" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="300" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">alice = 10</text>
  <rect x="350" y="148" width="130" height="32" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="415" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(5, "one") 保持</text>
  <rect x="480" y="148" width="52" height="32" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="506" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>

  <!-- row 3 -->
  <rect x="40" y="180" width="40" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="80" y="180" width="170" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="165" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(chris, four, 4)</text>
  <rect x="250" y="180" width="100" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">chris = 4</text>
  <rect x="350" y="180" width="130" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="415" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(4, "four")</text>
  <rect x="480" y="180" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="506" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>

  <!-- annotation for row 2 -->
  <path d="M330,228 C370,222 415,205 432,184" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">关键步：5 == 5 平票，"three" &gt; "one"</text>
  <text x="270" y="251" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">字典序更大 → best 不换（只拿当前记录比较，无需回看）</text>

  <!-- conclusion box -->
  <rect x="48" y="268" width="464" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历结束 maxPop = 10：tot[alice] = tot[bob] = 10 并列最高，全收</text>
  <text x="280" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = [["alice","one"], ["bob","two"]] ✓</text>
</svg>
