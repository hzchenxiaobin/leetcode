<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：余数轴上的一次性配对</text>

  <rect x="190" y="44" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">预处理：c[p] = P_p mod k</text>
  <text x="280" y="76" text-anchor="middle" font-size="10" fill="#446688">w[t] = 2·nums[t] mod k</text>

  <path d="M 280 84 L 280 108" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="108" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">first[q] / last[q]：每个余数的首末位置</text>
  <text x="280" y="140" text-anchor="middle" font-size="10.5" fill="#446688">occ[δ]：w_t ≡ δ 的位置表（天然有序）</text>

  <path d="M 280 148 L 280 164 L 135 164 L 135 186" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 148 L 280 164 L 415 164 L 415 186" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="186" width="190" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">零取反分支（r = 0）</text>
  <text x="135" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a">ans ← max(ans, last[q] − first[q])</text>

  <rect x="320" y="186" width="190" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="206" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">一次取反：枚举 (a, δ)</text>
  <text x="415" y="224" text-anchor="middle" font-size="10" fill="#8a6d1a">first[a] 存在 × occ[δ] 非空，共 ≤ k² 对</text>

  <path d="M 415 234 L 415 258" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="258" width="190" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="276" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">二分：t* = occ[δ] 中 ≥ first[a]</text>
  <text x="415" y="291" text-anchor="middle" font-size="10.5" fill="#8a6d1a">的最小位置（不存在则跳过）</text>

  <path d="M 415 298 L 415 322" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="415,322 527,352 415,382 303,352" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">last[b] &gt; t* ？</text>
  <text x="415" y="364" text-anchor="middle" font-size="9.5" fill="#b85450">其中 b = (a + δ) mod k</text>

  <path d="M 415 382 L 415 408" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="400" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="320" y="408" width="190" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="424" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans ← max(ans, last[b] − first[a])</text>
  <text x="415" y="440" text-anchor="middle" font-size="9.5" fill="#4a7a3a">左端 first[a]、取反 t*、右端 last[b]</text>

  <path d="M 527 352 L 545 352" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="547" y="356" font-size="9.5" fill="#999">否</text>

  <path d="M 135 234 L 135 408" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="408" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="432" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 ans</text>

  <path d="M 320 428 L 210 428" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="464" text-anchor="middle" font-size="10" fill="#999">时间 O(n + k² log n)，空间 O(n + k)；k ≤ 3000 时 k² ≤ 9×10⁶</text>
</svg>
