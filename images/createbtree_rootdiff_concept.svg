<svg xmlns="http://www.w3.org/2000/svg" width="560" height="410" viewBox="0 0 560 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="410" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：val 即主键 + 根是「从未当过 child」的节点</text>
  <path d="M 140 38 Q 280 48 420 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input edge chips -->
  <text x="86" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">descriptions（任意顺序）</text>
  <g filter="url(#sk)" stroke="#8a8a8a" stroke-width="1.5" fill="#f6f8fb">
    <rect x="24" y="72"  width="124" height="22" rx="6"/>
    <rect x="24" y="100" width="124" height="22" rx="6"/>
    <rect x="24" y="128" width="124" height="22" rx="6"/>
  </g>
  <g filter="url(#sk)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="86" y="87">[20,15,1]</text>
    <text x="86" y="115">[50,20,1]</text>
    <text x="86" y="143">[80,19,1]</text>
  </g>

  <!-- arrow chips -> map -->
  <g filter="url(#sk)">
    <path d="M 148 108 H 178" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  </g>
  <text x="163" y="100" text-anchor="middle" font-size="10" fill="#3a3a3a" filter="url(#sk)">O(1)</text>

  <!-- hash map box -->
  <g filter="url(#sk)">
    <rect x="182" y="60" width="168" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="266" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">nodes：val → 节点</text>
  <g filter="url(#sk)">
    <rect x="194" y="107" width="142" height="17" rx="4" fill="#fff8e1"/>
    <rect x="194" y="125" width="142" height="17" rx="4" fill="#fff8e1"/>
  </g>
  <g filter="url(#sk)" font-size="11.5" fill="#333" text-anchor="start">
    <text x="200" y="100">50 → ●</text>
    <text x="200" y="119" font-weight="bold" fill="#7a5415">20 → ●（边 ①）</text>
    <text x="200" y="137" font-weight="bold" fill="#7a5415">15 → ●（边 ①）</text>
    <text x="200" y="154">17 → ●</text>
    <text x="200" y="172">80 → ●</text>
    <text x="200" y="190">19 → ●</text>
  </g>

  <!-- right note A -->
  <g filter="url(#sk)">
    <rect x="366" y="60" width="170" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="451" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">先查后建（懒建节点）</text>
  <text x="451" y="95"  text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">缺 → new TreeNode(val)</text>
  <text x="451" y="112" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">有 → 复用同一对象</text>

  <!-- right note B -->
  <g filter="url(#sk)">
    <rect x="366" y="136" width="170" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="451" y="155" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a1e" filter="url(#sk)">连指针（O(1)）</text>
  <text x="451" y="172" text-anchor="middle" font-size="10.5" fill="#2b4a1e" filter="url(#sk)">isLeft=1 → p.left = c</text>
  <text x="451" y="189" text-anchor="middle" font-size="10.5" fill="#2b4a1e" filter="url(#sk)">isLeft=0 → p.right = c</text>

  <!-- divider -->
  <g filter="url(#sk)">
    <path d="M 30 214 H 530" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="5 4"/>
  </g>

  <!-- set difference picture -->
  <g filter="url(#sk)">
    <rect x="36" y="228" width="344" height="116" rx="10" fill="#ffffff" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="52" y="248" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">nodes 键集合（6 个）</text>
  <g filter="url(#sk)">
    <rect x="124" y="254" width="244" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4"/>
  </g>
  <text x="246" y="270" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">children（5 个）</text>
  <g filter="url(#sk)" stroke="#b85450" stroke-width="1.5" fill="#ffffff">
    <rect x="136" y="276" width="38" height="24" rx="5"/>
    <rect x="186" y="276" width="38" height="24" rx="5"/>
    <rect x="236" y="276" width="38" height="24" rx="5"/>
    <rect x="160" y="302" width="38" height="24" rx="5"/>
    <rect x="210" y="302" width="38" height="24" rx="5"/>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" fill="#b85450" text-anchor="middle">
    <text x="155" y="292">15</text>
    <text x="205" y="292">17</text>
    <text x="255" y="292">20</text>
    <text x="179" y="318">80</text>
    <text x="229" y="318">19</text>
  </g>
  <g filter="url(#sk)">
    <rect x="52" y="276" width="38" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
  </g>
  <text x="71" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a1e" filter="url(#sk)">50</text>
  <text x="71" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a1e" filter="url(#sk)">★ 根</text>
  <text x="71" y="318" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">唯一 ∉ children</text>

  <!-- why unique -->
  <g filter="url(#sk)">
    <rect x="396" y="234" width="140" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="466" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">为什么差集唯一？</text>
  <text x="466" y="274" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">n 节点 = n−1 边 + 1</text>
  <text x="466" y="291" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">每条边恰贡献 1 个 child</text>
  <text x="466" y="308" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">⇒ children 恰好覆盖</text>
  <text x="466" y="325" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">除根外的全部节点</text>

  <!-- conclusion strip -->
  <g filter="url(#sk)">
    <rect x="36" y="354" width="500" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="286" y="379" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a1e" filter="url(#sk)">根 = nodes − children，差集恰一个元素 —— 一次扫描定根</text>
</svg>
