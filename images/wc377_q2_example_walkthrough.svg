<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：对差展开 → 集合求交 → 最大公共边长</text>
  <path d="M 200 44 Q 470 52 740 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left column: example 1 ===== -->
  <text x="36" y="76" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">示例 1：m=4, n=3，hFences=[2,3]，vFences=[2]</text>

  <text x="36" y="100" font-size="11" fill="#555" filter="url(#sk)">水平 H = {1, 2, 3, 4}，共 6 对：</text>

  <g filter="url(#sk)"><rect x="36" y="106" width="66" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="69" y="127" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(1,2)→1</text>
  <g filter="url(#sk)"><rect x="102" y="106" width="66" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="135" y="127" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(1,3)→2</text>
  <g filter="url(#sk)"><rect x="168" y="106" width="66" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="201" y="127" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(1,4)→3</text>
  <g filter="url(#sk)"><rect x="36" y="144" width="66" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="69" y="165" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(2,3)→1</text>
  <g filter="url(#sk)"><rect x="102" y="144" width="66" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="135" y="165" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(2,4)→2</text>
  <g filter="url(#sk)"><rect x="168" y="144" width="66" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="201" y="165" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(3,4)→1</text>

  <path d="M 240 140 L 260 140" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="266" y="106" width="178" height="70" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="282" y="130" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">S_h =</text>
  <g filter="url(#sk)"><rect x="334" y="114" width="26" height="26" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="347" y="132" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="364" y="114" width="26" height="26" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="377" y="132" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="394" y="114" width="26" height="26" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="407" y="132" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">3</text>
  <text x="434" y="132" font-size="13" fill="#2e6e2e" filter="url(#sk)">…</text>
  <text x="282" y="162" font-size="10" fill="#666" filter="url(#sk)">最大差恰为 m − 1 = 3</text>

  <text x="36" y="200" font-size="11" fill="#555" filter="url(#sk)">垂直 V = {1, 2, 3}，共 3 对：</text>

  <g filter="url(#sk)"><rect x="36" y="206" width="66" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="69" y="227" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(1,2)→1</text>
  <g filter="url(#sk)"><rect x="102" y="206" width="66" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="135" y="227" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(1,3)→2</text>
  <g filter="url(#sk)"><rect x="168" y="206" width="66" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="201" y="227" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(2,3)→1</text>

  <path d="M 240 222 L 260 222" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="266" y="200" width="178" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="282" y="226" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">S_v =</text>
  <g filter="url(#sk)"><rect x="334" y="208" width="26" height="26" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="347" y="226" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="364" y="208" width="26" height="26" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="377" y="226" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">2</text>

  <g filter="url(#sk)"><rect x="36" y="262" width="408" height="54" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="56" y="284" font-size="12" fill="#7a5415" filter="url(#sk)">S_h ∩ S_v = {1, 2}</text>
  <text x="56" y="304" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">最大公共边长 best = 2</text>

  <g filter="url(#sk)"><rect x="36" y="330" width="408" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="240" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">面积 = best² = 2² = 4 ✓</text>

  <!-- ===== Right column: example 2 ===== -->
  <text x="490" y="76" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">示例 2：m=6, n=7，hFences=[2]，vFences=[4]</text>

  <text x="490" y="100" font-size="11" fill="#555" filter="url(#sk)">水平 H = {1, 2, 6}，共 3 对：</text>

  <g filter="url(#sk)"><rect x="490" y="106" width="62" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="521" y="127" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(1,2)→1</text>
  <g filter="url(#sk)"><rect x="556" y="106" width="62" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="587" y="127" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(2,6)→4</text>
  <g filter="url(#sk)"><rect x="622" y="106" width="62" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="653" y="127" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(1,6)→5</text>

  <path d="M 660 122 L 678 122" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="686" y="102" width="186" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="700" y="128" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">S_h =</text>
  <g filter="url(#sk)"><rect x="756" y="110" width="26" height="24" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="769" y="126" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="786" y="110" width="26" height="24" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="799" y="126" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="816" y="110" width="26" height="24" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="829" y="126" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">5</text>

  <text x="490" y="172" font-size="11" fill="#555" filter="url(#sk)">垂直 V = {1, 4, 7}，共 3 对：</text>

  <g filter="url(#sk)"><rect x="490" y="178" width="62" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="521" y="199" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(1,4)→3</text>
  <g filter="url(#sk)"><rect x="556" y="178" width="62" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="587" y="199" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(4,7)→3</text>
  <g filter="url(#sk)"><rect x="622" y="178" width="62" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="653" y="199" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">(1,7)→6</text>

  <path d="M 660 194 L 678 194" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="686" y="174" width="186" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="700" y="200" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">S_v =</text>
  <g filter="url(#sk)"><rect x="756" y="182" width="26" height="24" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="769" y="198" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="786" y="182" width="26" height="24" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="799" y="198" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">6</text>

  <g filter="url(#sk)"><rect x="490" y="232" width="414" height="54" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="510" y="254" font-size="12" fill="#7a5415" filter="url(#sk)">S_h ∩ S_v = ∅（空集）</text>
  <text x="510" y="274" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">无公共边长 → 无法形成正方形</text>

  <g filter="url(#sk)"><rect x="490" y="300" width="414" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="697" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">返回 −1 ✓</text>

  <!-- ===== bottom: example 3, modulo ===== -->
  <g filter="url(#sk)"><rect x="56" y="388" width="828" height="110" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="412" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 3（自造，专测取模）：m = n = 10⁹，hFences = vFences = [5×10⁸]</text>
  <text x="76" y="436" font-size="11" fill="#444" filter="url(#sk)">H = V = {1, 5×10⁸, 10⁹}，对差 = {5×10⁸−1, 5×10⁸, 10⁹−1} → best = 10⁹ − 1</text>
  <text x="76" y="460" font-size="11" fill="#444" filter="url(#sk)">面积 = (10⁹−1)² = 999999998000000001 ≈ 10¹⁸（32 位 int 必炸，long long 才存得下）</text>
  <text x="76" y="484" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#sk)">→ 输出 999999998000000001 mod (10⁹ + 7) = 64</text>
</svg>
