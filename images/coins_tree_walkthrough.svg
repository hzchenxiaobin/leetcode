<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 496"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="496" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1 演算：链 0→1→2→3，coins = [10, 10, 3, 3]，k = 5</text>
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">自底向上合并：叶子 3 先算；表中给出关键的 j = 0 / j = 1 两列</text>

  <!-- chain nodes -->
  <rect x="36" y="68" width="90" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="81" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">0</text>
  <text x="81" y="110" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">coins = 10</text>

  <rect x="170" y="68" width="90" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="215" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">1</text>
  <text x="215" y="110" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">coins = 10</text>

  <rect x="304" y="68" width="90" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="349" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">2</text>
  <text x="349" y="110" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">coins = 3</text>

  <rect x="438" y="68" width="90" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="483" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">3</text>
  <text x="483" y="110" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">coins = 3</text>

  <path d="M 126 94 L 170 94" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 94 L 304 94" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 394 94 L 438 94" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- method badges -->
  <rect x="36" y="126" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="81" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">选① · +5</text>

  <rect x="170" y="126" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="215" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">选① · +5</text>

  <rect x="304" y="126" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="349" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#99741c" filter="url(#rough2)">选② · +1</text>

  <rect x="438" y="126" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="483" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#99741c" filter="url(#rough2)">选② · +0</text>

  <!-- halving propagation -->
  <path d="M 349 152 C 349 186, 483 186, 483 152" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="204" text-anchor="middle" font-size="11" fill="#99741c" filter="url(#rough2)">② 的代价子孙付：节点 3 的金币 3 → ⌊3/2⌋ = 1</text>

  <!-- dp table header -->
  <rect x="36" y="212" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="212" width="192" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="212" width="128" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="452" y="212" width="88" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">节点</text>
  <text x="228" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">dp[·][0]</text>
  <text x="388" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">dp[·][1]</text>
  <text x="496" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">j=0 最优</text>

  <!-- row: node 3 -->
  <rect x="36" y="238" width="96" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="238" width="192" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="238" width="128" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="452" y="238" width="88" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="84" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3（叶）</text>
  <text x="228" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(3−5, 1) = 1</text>
  <text x="388" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(1−5, 0) = 0</text>
  <text x="496" y="264" text-anchor="middle" font-size="12" fill="#99741c" font-weight="bold" filter="url(#rough2)">②</text>

  <!-- row: node 2 -->
  <rect x="36" y="282" width="96" height="44" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="282" width="192" height="44" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="282" width="128" height="44" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="452" y="282" width="88" height="44" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="84" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="228" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(−2+1, 1+0) = 1</text>
  <text x="388" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(−4+0, 0) = 0</text>
  <text x="496" y="308" text-anchor="middle" font-size="12" fill="#99741c" font-weight="bold" filter="url(#rough2)">②</text>

  <!-- row: node 1 -->
  <rect x="36" y="326" width="96" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="326" width="192" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="326" width="128" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="452" y="326" width="88" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="84" y="352" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="228" y="352" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(5+1, 5+0) = 6</text>
  <text x="388" y="352" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(0+0, 2+0) = 2</text>
  <text x="496" y="352" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">①</text>

  <!-- row: node 0 (highlight) -->
  <rect x="36" y="370" width="96" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="370" width="192" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="370" width="128" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="452" y="370" width="88" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">0（根）</text>
  <text x="228" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">max(5+6, 5+2) = 11</text>
  <text x="388" y="396" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">—</text>
  <text x="496" y="396" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① ✓</text>

  <!-- answer strip -->
  <rect x="36" y="426" width="504" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="449" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">答案 = dp[0][0] = 11：节点 0、1 选①（各 +5），节点 2、3 选②（+1、+0）</text>

  <text x="280" y="482" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">注意节点 1：j=0 时选①、j=1 时选② —— 同一节点不同状态最优方法不同 ⟹ 不能独立贪心</text>
</svg>
