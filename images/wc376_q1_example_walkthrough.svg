<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：grid = [[9,1,7],[8,9,2],[3,4,6]]，n = 3</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 3x3 矩阵 -->
  <g filter="url(#sk)"><rect x="56" y="66" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/></g>
  <text x="76" y="91" text-anchor="middle" font-size="14" fill="#8a3030" font-weight="bold">9</text>
  <g filter="url(#sk)"><rect x="96" y="66" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="116" y="91" text-anchor="middle" font-size="14" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="136" y="66" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="156" y="91" text-anchor="middle" font-size="14" fill="#2b6e9e">7</text>
  <g filter="url(#sk)"><rect x="56" y="106" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="76" y="131" text-anchor="middle" font-size="14" fill="#2b6e9e">8</text>
  <g filter="url(#sk)"><rect x="96" y="106" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/></g>
  <text x="116" y="131" text-anchor="middle" font-size="14" fill="#8a3030" font-weight="bold">9</text>
  <g filter="url(#sk)"><rect x="136" y="106" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="156" y="131" text-anchor="middle" font-size="14" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="56" y="146" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="76" y="171" text-anchor="middle" font-size="14" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="96" y="146" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="116" y="171" text-anchor="middle" font-size="14" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="136" y="146" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="156" y="171" text-anchor="middle" font-size="14" fill="#2b6e9e">6</text>

  <text x="116" y="214" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">两个 9 在场（红）</text>
  <text x="116" y="232" text-anchor="middle" font-size="12" fill="#888">5 不在场 → 缺席者</text>

  <!-- 摊平入桶箭头 -->
  <path d="M 196 116 L 252 116" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="224" y="104" text-anchor="middle" font-size="11" fill="#555">摊平·入桶</text>

  <!-- cnt 桶 -->
  <text x="445" y="74" text-anchor="middle" font-size="12" fill="#555">入桶后的 cnt[v]（v = 1..9）</text>

  <g filter="url(#sk)"><rect x="268" y="88" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="288" y="113" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="308" y="88" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="328" y="113" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="348" y="88" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="368" y="113" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="388" y="88" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="408" y="113" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="428" y="88" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/></g>
  <text x="448" y="113" text-anchor="middle" font-size="15" fill="#8a3030" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="468" y="88" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="488" y="113" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="508" y="88" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="528" y="113" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="548" y="88" width="40" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/></g>
  <text x="568" y="113" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="588" y="88" width="40" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="4"/></g>
  <text x="608" y="113" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">2</text>

  <!-- v 标签 -->
  <text x="288" y="146" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="328" y="146" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="368" y="146" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="408" y="146" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="448" y="146" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">5</text>
  <text x="488" y="146" text-anchor="middle" font-size="11" fill="#888">6</text>
  <text x="528" y="146" text-anchor="middle" font-size="11" fill="#888">7</text>
  <text x="568" y="146" text-anchor="middle" font-size="11" fill="#888">8</text>
  <text x="608" y="146" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">9</text>

  <!-- 判定标注 -->
  <path d="M 448 132 L 448 172" stroke="#b85450" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="448" y="190" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">b = 5：空桶 ⇒ 缺失</text>

  <path d="M 608 132 L 608 172" stroke="#4a8e4a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="608" y="190" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">a = 9：两颗 ⇒ 重复</text>

  <!-- 示例1一行 -->
  <g filter="url(#sk)"><rect x="56" y="252" width="540" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="326" y="270" text-anchor="middle" font-size="12" fill="#2b6e9e">示例 1 回看：grid = [[1,3],[2,2]]，值域 1..4</text>
  <text x="326" y="286" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">cnt = [1, 2, 1, 0] ⇒ a = 2, b = 4 → 返回 [2, 4]</text>

  <!-- 结论 -->
  <g filter="url(#sk)"><rect x="56" y="318" width="540" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="326" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">按序查桶：空桶定 b，双球定 a —— 返回 [a, b] = [9, 5] ✓</text>
  <text x="326" y="362" text-anchor="middle" font-size="12" fill="#444">两遍扫描各 O(n²)；桶长 m + 1 = n² + 1（下标 0 恒空置）</text>
</svg>
