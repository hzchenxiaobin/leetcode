<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66707a"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一个 diff 数组承载两张频率表，三遍扫描</text>

  <!-- ===== pipeline ===== -->
  <rect x="40" y="48" width="160" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">① 遍历 s</text>
  <text x="120" y="92" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">diff[c−'a'] + 1</text>

  <path d="M 204 78 L 234 78" stroke="#66707a" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>

  <rect x="240" y="48" width="160" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">② 遍历 t</text>
  <text x="320" y="92" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">diff[c−'a'] − 1</text>

  <path d="M 404 78 L 434 78" stroke="#66707a" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>

  <rect x="440" y="48" width="160" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">③ 遍历 26 格</text>
  <text x="520" y="92" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">ans += |diff[i]|</text>

  <path d="M 604 78 L 630 78" stroke="#66707a" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>

  <rect x="636" y="56" width="74" height="44" rx="22" fill="#fafafa" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="673" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- ===== diff array snapshot ===== -->
  <text x="40" y="142" font-size="11" fill="#888" filter="url(#rough2)">diff 数组快照（s = "leetcode"，t = "coats"）：diff[c] = cntS[c] − cntT[c]</text>

  <g font-size="9.5" fill="#888" text-anchor="middle">
    <rect x="40"  y="158" width="54" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="67"  y="176" filter="url(#rough2)">a</text>
    <rect x="104" y="158" width="54" height="52" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="131" y="176" filter="url(#rough2)">c</text>
    <rect x="168" y="158" width="54" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="195" y="176" filter="url(#rough2)">d</text>
    <rect x="232" y="158" width="54" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="259" y="176" filter="url(#rough2)">e</text>
    <rect x="296" y="158" width="54" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="323" y="176" filter="url(#rough2)">l</text>
    <rect x="360" y="158" width="54" height="52" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="387" y="176" filter="url(#rough2)">o</text>
    <rect x="424" y="158" width="54" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="451" y="176" filter="url(#rough2)">s</text>
    <rect x="488" y="158" width="54" height="52" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="515" y="176" filter="url(#rough2)">t</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="67"  y="202" fill="#b85450" filter="url(#rough2)">−1</text>
    <text x="131" y="202" fill="#999" filter="url(#rough2)">0</text>
    <text x="195" y="202" fill="#33506b" filter="url(#rough2)">+1</text>
    <text x="259" y="202" fill="#33506b" filter="url(#rough2)">+3</text>
    <text x="323" y="202" fill="#33506b" filter="url(#rough2)">+1</text>
    <text x="387" y="202" fill="#999" filter="url(#rough2)">0</text>
    <text x="451" y="202" fill="#b85450" filter="url(#rough2)">−1</text>
    <text x="515" y="202" fill="#999" filter="url(#rough2)">0</text>
  </g>

  <!-- complexity note -->
  <rect x="565" y="152" width="145" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="637" y="174" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">复杂度</text>
  <g font-size="10.5" fill="#555" text-anchor="middle">
    <text x="637" y="196" filter="url(#rough2)">时间 O(n+m+26)</text>
    <text x="637" y="214" filter="url(#rough2)">空间 O(26) = O(1)</text>
    <text x="637" y="236" font-size="9.5" fill="#888" filter="url(#rough2)">已达理论下界</text>
  </g>

  <!-- captions -->
  <text x="40" y="244" font-size="10.5" fill="#555" filter="url(#rough2)">正差 = s 多 → 补 t；负差 = t 多 → 补 s；0 → 不动</text>
  <text x="40" y="272" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">ans = |−1| + |+1| + |+3| + |+1| + |−1| = 1+1+3+1+1 = 7</text>
  <text x="40" y="298" font-size="9.5" fill="#888" filter="url(#rough2)">一个数组当两张频率表用：s 走 +1、t 走 −1，省一半内存与代码量</text>
</svg>
