<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：反转丢弃前导零 ⇔ 原数的尾随零永久丢失</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 320 58 L 320 318" stroke="#d0d0d0" stroke-width="1.2" stroke-dasharray="5 5" fill="none"/>

  <!-- 左列：末位非零 -->
  <text x="170" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">✓ 末位非零（526）：完全可逆</text>
  <text x="95" y="102" text-anchor="end" font-size="11" fill="#666">num</text>
  <g filter="url(#sk)">
    <rect x="103" y="76" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="149" y="76" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="195" y="76" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="124" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">5</text>
  <text x="170" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">2</text>
  <text x="216" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">6</text>
  <path d="M 170 122 L 170 140" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="136" font-size="11" fill="#666">反转</text>
  <text x="95" y="172" text-anchor="end" font-size="11" fill="#666">R(num)</text>
  <g filter="url(#sk)">
    <rect x="103" y="146" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="149" y="146" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="195" y="146" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="124" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">6</text>
  <text x="170" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">2</text>
  <text x="216" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">5</text>
  <text x="243" y="172" font-size="11" fill="#4a7a3a">无丢失</text>
  <path d="M 170 192 L 170 210" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="206" font-size="11" fill="#666">再反转</text>
  <text x="95" y="242" text-anchor="end" font-size="11" fill="#666">R(R(num))</text>
  <g filter="url(#sk)">
    <rect x="103" y="216" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="149" y="216" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="195" y="216" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="124" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">5</text>
  <text x="170" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">2</text>
  <text x="216" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">6</text>
  <text x="243" y="242" font-size="12" font-weight="bold" fill="#4a7a3a">= num ✓</text>
  <text x="170" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a">两次反转后 526 = 526</text>
  <g filter="url(#sk)">
    <rect x="95" y="284" width="150" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="170" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">返回 true</text>

  <!-- 右列：末位为零 -->
  <text x="485" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">✗ 末位为零（1800）：信息丢失</text>
  <text x="387" y="102" text-anchor="end" font-size="11" fill="#666">num</text>
  <g filter="url(#sk)">
    <rect x="395" y="76" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="441" y="76" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="487" y="76" width="42" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="533" y="76" width="42" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="416" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">1</text>
  <text x="462" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">8</text>
  <text x="508" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040">0</text>
  <text x="554" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040">0</text>
  <text x="581" y="102" font-size="11" fill="#d6a040">←尾随零</text>
  <path d="M 485 122 L 485 140" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="497" y="136" font-size="11" fill="#666">反转</text>
  <text x="387" y="172" text-anchor="end" font-size="11" fill="#666">R(num)=81</text>
  <g filter="url(#sk)">
    <rect x="395" y="146" width="42" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="441" y="146" width="42" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="487" y="146" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="533" y="146" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="416" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">0</text>
  <text x="462" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">0</text>
  <text x="508" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">8</text>
  <text x="554" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">1</text>
  <g filter="url(#sk)">
    <path d="M 401 152 L 431 180" stroke="#b85450" stroke-width="2.2" fill="none"/>
    <path d="M 431 152 L 401 180" stroke="#b85450" stroke-width="2.2" fill="none"/>
    <path d="M 447 152 L 477 180" stroke="#b85450" stroke-width="2.2" fill="none"/>
    <path d="M 477 152 L 447 180" stroke="#b85450" stroke-width="2.2" fill="none"/>
  </g>
  <text x="581" y="166" font-size="10" fill="#b85450">←前导零</text>
  <text x="581" y="180" font-size="10" fill="#b85450">被丢弃</text>
  <path d="M 485 192 L 485 210" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="497" y="206" font-size="11" fill="#666">再反转</text>
  <text x="387" y="242" text-anchor="end" font-size="11" fill="#666">R(R(num))=18</text>
  <g filter="url(#sk)">
    <rect x="442" y="216" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="488" y="216" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="463" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">1</text>
  <text x="509" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">8</text>
  <text x="485" y="276" text-anchor="middle" font-size="11" fill="#b85450">两次反转后 18 ≠ 1800</text>
  <g filter="url(#sk)">
    <rect x="410" y="284" width="150" height="34" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="485" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">返回 false</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)">
    <rect x="70" y="334" width="500" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">R(R(num)) = num 剥离尾随零后的结果</text>
  <text x="320" y="369" text-anchor="middle" font-size="11" fill="#666">两次反转能否还原，只取决于末位是否为 0；num = 0 是唯一例外</text>
</svg>
