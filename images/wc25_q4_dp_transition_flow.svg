<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">状态转移：dp(l, r, k) 的两类决策</text>

  <rect x="180" y="52" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="72" text-anchor="middle" font-size="14" fill="#223" filter="url(#rough2)">dp(l, r, k)</text>
  <text x="330" y="90" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">区间 [l, r]，右端外挂 k 个与 boxes[r] 同色</text>

  <path d="M330,98 V130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="330,132 470,180 330,228 190,180" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">boxes[r] == boxes[r-1]</text>
  <text x="330" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">？</text>

  <path d="M470,180 H604 V76 H486" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="150" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是：r--, k++</text>
  <text x="482" y="166" font-size="11" fill="#666" filter="url(#rough2)">吸收同色尾段</text>

  <path d="M330,228 V252" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M330,244 H176 V266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M330,244 H486 V266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="240" font-size="12" fill="#666" filter="url(#rough2)">否</text>

  <rect x="40" y="270" width="272" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="294" font-size="13" fill="#2f5a25" filter="url(#rough2)">① 立刻消掉右端这一整段</text>
  <text x="56" y="322" font-size="13" fill="#333" filter="url(#rough2)">(k+1)² + dp(l, r-1, 0)</text>

  <rect x="348" y="270" width="272" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="364" y="294" font-size="13" fill="#8d2f2b" filter="url(#rough2)">② 留到左边同色的 i 处合并</text>
  <text x="364" y="322" font-size="12" fill="#333" filter="url(#rough2)">dp(l, i, k+1) + dp(i+1, r-1, 0)</text>

  <path d="M176,346 V372" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M486,346 V372" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="330" y="392" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">dp(l, r, k) = max( ① , ② )</text>
  <text x="330" y="414" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">空区间 l &gt; r 返回 0；k 的上界小于 n，故记忆化用 O(n³) 空间</text>
</svg>
