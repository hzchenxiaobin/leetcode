<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算 [2, 6]：S = 8 → 答案 = ⌈8/2⌉ = 4 次</text>
  <path d="M 160 38 Q 320 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始数组 -->
  <text x="24" y="76" font-size="12.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">初始数组</text>
  <g filter="url(#sk)">
    <rect x="150" y="56" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="206" y="56" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="262" y="56" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="318" y="56" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="374" y="56" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="150" y="92" width="48" height="18" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="206" y="92" width="48" height="18" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="262" y="92" width="48" height="18" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="318" y="92" width="48" height="18" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="374" y="92" width="48" height="18" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b">
    <text x="174" y="77" filter="url(#sk)">2</text>
    <text x="230" y="77" filter="url(#sk)">3</text>
    <text x="286" y="77" filter="url(#sk)">4</text>
    <text x="342" y="77" filter="url(#sk)">5</text>
    <text x="398" y="77" filter="url(#sk)">6</text>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a05a20">
    <text x="174" y="106" filter="url(#sk)">f=1</text>
    <text x="230" y="106" filter="url(#sk)">f=1</text>
    <text x="286" y="106" filter="url(#sk)">f=2</text>
    <text x="342" y="106" filter="url(#sk)">f=2</text>
    <text x="398" y="106" filter="url(#sk)">f=2</text>
  </g>
  <text x="470" y="78" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">S = 1+1+2+2+2 = 8</text>

  <!-- 四次操作 -->
  <g font-size="10" font-weight="bold" fill="#b85450" text-anchor="middle">
    <text x="174" y="116" filter="url(#sk)">÷4</text>
    <text x="342" y="116" filter="url(#sk)">÷4</text>
    <text x="286" y="168" filter="url(#sk)">÷4</text>
    <text x="398" y="168" filter="url(#sk)">÷4</text>
    <text x="230" y="220" filter="url(#sk)">÷4</text>
    <text x="286" y="220" filter="url(#sk)">÷4</text>
    <text x="342" y="272" filter="url(#sk)">÷4</text>
    <text x="398" y="272" filter="url(#sk)">÷4</text>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b4a6b">
    <text x="26" y="140" filter="url(#sk)">第 1 次</text>
    <text x="84" y="140" font-weight="normal" fill="#666" filter="url(#sk)">选 2 和 5</text>
    <text x="26" y="192" filter="url(#sk)">第 2 次</text>
    <text x="84" y="192" font-weight="normal" fill="#666" filter="url(#sk)">选 4 和 6</text>
    <text x="26" y="244" filter="url(#sk)">第 3 次</text>
    <text x="84" y="244" font-weight="normal" fill="#666" filter="url(#sk)">选 3 和 1</text>
    <text x="26" y="296" filter="url(#sk)">第 4 次</text>
    <text x="84" y="296" font-weight="normal" fill="#666" filter="url(#sk)">选 1 和 1</text>
  </g>
  <!-- 第1次 [0,3,4,1,6]，变化 0,3 -->
  <g filter="url(#sk)">
    <rect x="150" y="122" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="206" y="122" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="262" y="122" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="318" y="122" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="374" y="122" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#2b4a6b">
    <text x="174" y="144" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">0</text>
    <text x="230" y="144" filter="url(#sk)">3</text>
    <text x="286" y="144" filter="url(#sk)">4</text>
    <text x="342" y="144" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="398" y="144" filter="url(#sk)">6</text>
  </g>
  <!-- 第2次 [0,3,1,1,1]，变化 2,4 -->
  <g filter="url(#sk)">
    <rect x="150" y="174" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="206" y="174" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="262" y="174" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="318" y="174" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="374" y="174" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#2b4a6b">
    <text x="174" y="196" filter="url(#sk)">0</text>
    <text x="230" y="196" filter="url(#sk)">3</text>
    <text x="286" y="196" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="342" y="196" filter="url(#sk)">1</text>
    <text x="398" y="196" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">1</text>
  </g>
  <!-- 第3次 [0,0,0,1,1]，变化 1,2 -->
  <g filter="url(#sk)">
    <rect x="150" y="226" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="206" y="226" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="262" y="226" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="318" y="226" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="374" y="226" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#2b4a6b">
    <text x="174" y="248" filter="url(#sk)">0</text>
    <text x="230" y="248" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">0</text>
    <text x="286" y="248" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">0</text>
    <text x="342" y="248" filter="url(#sk)">1</text>
    <text x="398" y="248" filter="url(#sk)">1</text>
  </g>
  <!-- 第4次 [0,0,0,0,0]，变化 3,4 -->
  <g filter="url(#sk)">
    <rect x="150" y="278" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="206" y="278" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="262" y="278" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="318" y="278" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="374" y="278" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#2b4a6b">
    <text x="174" y="300" filter="url(#sk)">0</text>
    <text x="230" y="300" filter="url(#sk)">0</text>
    <text x="286" y="300" filter="url(#sk)">0</text>
    <text x="342" y="300" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">0</text>
    <text x="398" y="300" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">0</text>
  </g>
  <text x="450" y="300" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">全部归零 ✓</text>

  <!-- 对账框 -->
  <g filter="url(#sk)">
    <rect x="40" y="332" width="560" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">名额对账：2 用 1 次、3 用 1 次、4 / 5 / 6 各用 2 次</text>
  <text x="320" y="386" text-anchor="middle" font-size="13" fill="#a05a20" filter="url(#sk)">总名额 S = 8 = 2 × 4 → 每次操作两个名额，零浪费</text>
  <text x="320" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#a05a20" filter="url(#sk)">⌈S/2⌉ = 4 与实际操作数一致 ✓</text>
</svg>
