<svg xmlns="http://www.w3.org/2000/svg" width="640" height="515" viewBox="0 0 640 515" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="515" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">两遍扫描：先建极值表，再逐栋夹逼判定</text>
  <path d="M 200 40 Q 320 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="210" y="56" width="220" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">输入：n 与 buildings（m 栋，坐标唯一）</text>

  <g filter="url(#sk)"><path d="M 320 92 L 320 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="95" y="112" width="450" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="320" y="133" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5b84">① 初始化四张极值表（O(n)）</text>
  <text x="320" y="152" text-anchor="middle" font-size="11" fill="#444">rowMin / colMin ← +∞，rowMax / colMax ← −∞（长度 n+1 的数组，下标即坐标）</text>

  <g filter="url(#sk)"><path d="M 320 166 L 320 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="95" y="186" width="450" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="207" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">② 第一遍扫描：建表（O(m)）</text>
  <text x="320" y="226" text-anchor="middle" font-size="11" fill="#444">对每栋 (x, y)：用 y 刷新 rowMin[x]、rowMax[x]，用 x 刷新 colMin[y]、colMax[y]</text>

  <g filter="url(#sk)"><path d="M 320 240 L 320 256" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="95" y="260" width="450" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="320" y="281" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5b84">③ 第二遍扫描：判定（O(m)）</text>
  <text x="320" y="300" text-anchor="middle" font-size="11" fill="#444">对每栋 (x, y)：检查 rowMin[x] &lt; y &lt; rowMax[x] 且 colMin[y] &lt; x &lt; colMax[y]</text>

  <g filter="url(#sk)"><path d="M 320 314 L 320 330" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="320,334 475,372 320,410 165,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">四个严格不等式</text>
  <text x="320" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">都成立？</text>

  <g filter="url(#sk)"><path d="M 475 372 L 503 372" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/></g>
  <text x="489" y="362" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="507" y="354" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="562" y="377" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">ans += 1</text>

  <g filter="url(#sk)"><path d="M 165 372 L 137 372" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)"/></g>
  <text x="151" y="362" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">否</text>
  <g filter="url(#sk)"><rect x="23" y="354" width="110" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="78" y="377" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">跳过该建筑</text>

  <g filter="url(#sk)"><path d="M 562 392 Q 562 440 406 463" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)"/></g>
  <g filter="url(#sk)"><path d="M 78 392 Q 78 440 234 463" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)"/></g>

  <g filter="url(#sk)"><rect x="240" y="446" width="160" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">④ 返回 ans</text>

  <text x="320" y="502" text-anchor="middle" font-size="11" fill="#666">总时间 O(n + m)，空间 O(n)；哈希表版时间 / 空间均与 n 无关（O(m)）</text>
</svg>
