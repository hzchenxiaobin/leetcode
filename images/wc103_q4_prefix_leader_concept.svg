<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="336" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">预处理：每个前缀的领先者</text>
  <text x="80" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=0</text>
  <rect x="40" y="70" width="80" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="93.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">投给 0</text>
  <rect x="40" y="140" width="80" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="165.4" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="168" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=5</text>
  <rect x="128" y="70" width="80" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168.0" y="93.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">投给 1</text>
  <rect x="128" y="140" width="80" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168.0" y="165.4" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="256" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=10</text>
  <rect x="216" y="70" width="80" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256.0" y="93.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">投给 1</text>
  <rect x="216" y="140" width="80" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256.0" y="165.4" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="344" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=15</text>
  <rect x="304" y="70" width="80" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344.0" y="93.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">投给 0</text>
  <rect x="304" y="140" width="80" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344.0" y="165.4" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="432" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=20</text>
  <rect x="392" y="70" width="80" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432.0" y="93.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">投给 0</text>
  <rect x="392" y="140" width="80" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432.0" y="165.4" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="520" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=25</text>
  <rect x="480" y="70" width="80" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="93.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">投给 1</text>
  <rect x="480" y="140" width="80" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="165.4" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="608" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=30</text>
  <rect x="568" y="70" width="80" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="608.0" y="93.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">投给 0</text>
  <rect x="568" y="140" width="80" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="608.0" y="165.4" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="24" y="94" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">票</text>
  <text x="24" y="164" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">领先</text>
  <rect x="60" y="214" width="560" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="240.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">q(t)：二分最后一个 times[i] ≤ t，返回 lead[i]</text>
  <text x="330" y="292" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">查询 t=12 → i=2 → lead[2]=1；t=15 → i=3 → lead[3]=1</text>
  <text x="330" y="320" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">平票时归最近得票的候选人：t=25 时 1 与 0 同为 2 票，1 刚得票，故领先</text>
</svg>
