<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：车队位置 ≡ 领队的匀速线 —— 追上车队 = 与领队线求交</text>
  <path d="M 110 36 Q 320 44 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 坐标轴 -->
  <path d="M 80 400 L 612 400" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 80 400 L 80 66" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="588" y="420" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">t（秒）</text>
  <text x="58" y="240" font-size="11" fill="#666" filter="url(#sk)" transform="rotate(-90 58 240)">位置（米）</text>

  <!-- 时间刻度与参考虚线 -->
  <path d="M 480 398 L 480 133" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 520 398 L 520 125" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <text x="480" y="416" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">t=20</text>
  <text x="522" y="416" text-anchor="start" font-size="10" fill="#888" filter="url(#sk)">t=22</text>

  <!-- 三条轨迹线（实线 = 实际轨迹） -->
  <path d="M 80 215 L 600 106" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 80 299 L 480 131" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 80 400 L 520 123" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <!-- 幻影线（若不发生合并的假想延长） -->
  <path d="M 480 131 L 600 81" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <path d="M 520 123 L 600 72" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <!-- 车队段：Y 并入后贴着 Z 的线（橙粗） -->
  <path d="M 480 131 L 520 123" stroke="#d6a040" stroke-width="4.5" fill="none" filter="url(#sk)"/>

  <!-- 起点标记与车名 -->
  <circle cx="80" cy="400" r="3.5" fill="#b85450" filter="url(#sk)"/>
  <circle cx="80" cy="299" r="3.5" fill="#4a7a3a" filter="url(#sk)"/>
  <circle cx="80" cy="215" r="3.5" fill="#446688" filter="url(#sk)"/>
  <text x="74" y="404" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">X(0, 3)</text>
  <text x="74" y="303" text-anchor="end" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">Y(24, 2)</text>
  <text x="74" y="219" text-anchor="end" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">Z(44, 1)</text>
  <text x="284" y="160" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">领队（最慢）</text>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <rect x="100" y="74" width="216" height="58" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1.2"/>
  </g>
  <path d="M 112 90 L 128 90" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="134" y="94" font-size="10.5" fill="#333" filter="url(#sk)">实线：实际轨迹</text>
  <path d="M 112 104 L 128 104" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <text x="134" y="108" font-size="10.5" fill="#333" filter="url(#sk)">灰虚线：幻影线（假设不合并）</text>
  <path d="M 112 118 L 128 118" stroke="#d6a040" stroke-width="3.5" fill="none" filter="url(#sk)"/>
  <text x="134" y="122" font-size="10.5" fill="#333" filter="url(#sk)">橙粗：车队段（Y 并入后）</text>

  <!-- 关键点 -->
  <circle cx="480" cy="131" r="5" fill="#b85450" filter="url(#sk)"/>
  <text x="472" y="127" text-anchor="end" font-size="10.5" fill="#a04a48" filter="url(#sk)">t=20：Y 追上 Z 并入车队（速度降为 1）</text>
  <circle cx="520" cy="123" r="5.5" fill="#4a7a3a" filter="url(#sk)"/>
  <text x="530" y="142" text-anchor="start" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">t=22：X 追上车队</text>
  <text x="530" y="157" text-anchor="start" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">res[X] = 22</text>
  <!-- 幻影交点 -->
  <path d="M 556 94 L 564 102 M 564 94 L 556 102" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="552" y="91" text-anchor="end" font-size="10" fill="#a04a48" filter="url(#sk)">幻影交点 t=24——Y 早已并入车队</text>

  <!-- 中部注释 -->
  <text x="330" y="372" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">Y 并入后，贴着领队 Z 的匀速线前进（橙粗段）</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="30" y="432" width="580" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e" filter="url(#sk)">车队位置 ≡ 领队匀速线：pos(t) = p_Z + s_Z · t（对一切 t ≥ 0 成立，与何时合并无关）</text>
  <text x="320" y="468" text-anchor="middle" font-size="11" fill="#33455e" filter="url(#sk)">⇒ 追车队 = 与领队线求交：τ(X, Z) = (44 − 0) / (3 − 1) = 22 —— 无需 Y 的任何信息</text>
</svg>
