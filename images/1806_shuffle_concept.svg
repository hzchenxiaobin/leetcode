<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：一步操作 = 一次完美洗牌（同一个固定置换 σ）</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="390" y="49" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <rect x="520" y="49" width="13" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
  </g>
  <text x="409" y="60" font-size="10.5" fill="#446688">前半（j &lt; n/2）</text>
  <text x="539" y="60" font-size="10.5" fill="#4a7a3a">后半（j ≥ n/2）</text>

  <!-- half background tints -->
  <g filter="url(#sk)">
    <rect x="144" y="74" width="204" height="46" rx="8" fill="#e8f0fe" opacity="0.45"/>
    <rect x="348" y="74" width="204" height="46" rx="8" fill="#e6f4ea" opacity="0.45"/>
  </g>

  <!-- index labels -->
  <text x="140" y="74" text-anchor="end" font-size="10" fill="#999">下标 j</text>
  <g font-size="9.5" fill="#999" text-anchor="middle">
    <text x="173" y="74">0</text><text x="223" y="74">1</text><text x="273" y="74">2</text><text x="323" y="74">3</text>
    <text x="373" y="74">4</text><text x="423" y="74">5</text><text x="473" y="74">6</text><text x="523" y="74">7</text>
  </g>

  <!-- row A: before -->
  <text x="78" y="101" text-anchor="middle" font-size="11.5" fill="#555">操作前 perm</text>
  <g filter="url(#sk)">
    <rect x="150" y="80" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="200" y="80" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="250" y="80" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="80" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="350" y="80" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="400" y="80" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="450" y="80" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="500" y="80" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="173" y="102" fill="#446688">0</text><text x="223" y="102" fill="#446688">1</text>
    <text x="273" y="102" fill="#446688">2</text><text x="323" y="102" fill="#446688">3</text>
    <text x="373" y="102" fill="#4a7a3a">4</text><text x="423" y="102" fill="#4a7a3a">5</text>
    <text x="473" y="102" fill="#4a7a3a">6</text><text x="523" y="102" fill="#4a7a3a">7</text>
  </g>

  <!-- arrows j -> sigma(j) -->
  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)">
    <path d="M 173,118 L 173,168" marker-end="url(#arb)"/>
    <path d="M 223,118 Q 271,146 321,168" marker-end="url(#arb)"/>
    <path d="M 273,118 Q 346,146 421,168" marker-end="url(#arb)"/>
    <path d="M 323,118 Q 421,146 519,168" marker-end="url(#arb)"/>
  </g>
  <g stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)">
    <path d="M 373,118 Q 298,146 227,168" marker-end="url(#arg)"/>
    <path d="M 423,118 Q 348,146 277,168" marker-end="url(#arg)"/>
    <path d="M 473,118 Q 471,146 429,168" marker-end="url(#arg)"/>
    <path d="M 523,118 L 523,168" marker-end="url(#arg)"/>
  </g>

  <!-- row B: after -->
  <text x="78" y="193" text-anchor="middle" font-size="11.5" fill="#555">操作后 arr</text>
  <g filter="url(#sk)">
    <rect x="150" y="172" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="200" y="172" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="250" y="172" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="172" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="350" y="172" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="400" y="172" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="450" y="172" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="500" y="172" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="173" y="194" fill="#446688">0</text><text x="223" y="194" fill="#4a7a3a">4</text>
    <text x="273" y="194" fill="#446688">1</text><text x="323" y="194" fill="#4a7a3a">5</text>
    <text x="373" y="194" fill="#446688">2</text><text x="423" y="194" fill="#4a7a3a">6</text>
    <text x="473" y="194" fill="#446688">3</text><text x="523" y="194" fill="#4a7a3a">7</text>
  </g>
  <g font-size="9.5" fill="#999" text-anchor="middle">
    <text x="173" y="220">0</text><text x="223" y="220">1</text><text x="273" y="220">2</text><text x="323" y="220">3</text>
    <text x="373" y="220">4</text><text x="423" y="220">5</text><text x="473" y="220">6</text><text x="523" y="220">7</text>
  </g>
  <text x="340" y="238" text-anchor="middle" font-size="11" fill="#555">偶数位依次放前半，奇数位依次放后半 —— 前、后半完美交错（这就是一次完美洗牌）</text>

  <!-- formula panel -->
  <g filter="url(#sk)">
    <rect x="60" y="252" width="560" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">元素 j 一步后的去向 σ(j)</text>
  <text x="340" y="294" text-anchor="middle" font-size="11.5" fill="#444">j &lt; n/2：σ(j) = 2j（去偶数位）　　j ≥ n/2：σ(j) = 2j − n + 1（去奇数位）</text>
  <text x="340" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">统一：σ(j) ≡ 2j (mod n−1)，且 σ(0) = 0、σ(n−1) = n−1（两个不动点）</text>

  <!-- bottom callout -->
  <g filter="url(#sk)">
    <rect x="60" y="352" width="560" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">每一步执行的都是同一个 σ：t 步后，初始位于 j 的元素在 σ^t(j) 处</text>
  <text x="340" y="398" text-anchor="middle" font-size="11.5" fill="#444">perm 回到初始 ⟺ 每个元素都回家 ⟺ σ^t = 恒等映射</text>
  <text x="340" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">答案 = σ 的阶 = 各不相交圈长的最小公倍数</text>
</svg>
