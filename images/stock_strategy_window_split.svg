<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：一次修改只动窗口，利润 = base − old + cur</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array of days: window [2,6), k=4, first 2 -> 0, last 2 -> 1 -->
  <text x="340" y="76" text-anchor="middle" font-size="12" fill="#888">以 n=8、k=4、窗口起点 l=2 为例</text>

  <!-- prices row -->
  <g filter="url(#sk)">
    <rect x="120" y="92" width="440" height="34" rx="4" fill="none" stroke="#c9c9c9" stroke-width="1"/>
    <line x1="230" y1="92" x2="230" y2="126" stroke="#c9c9c9"/>
    <line x1="340" y1="92" x2="340" y2="126" stroke="#c9c9c9"/>
    <line x1="450" y1="92" x2="450" y2="126" stroke="#c9c9c9"/>
    <line x1="175" y1="92" x2="175" y2="126" stroke="#e5e5e5"/>
    <line x1="285" y1="92" x2="285" y2="126" stroke="#e5e5e5"/>
    <line x1="395" y1="92" x2="395" y2="126" stroke="#e5e5e5"/>
    <line x1="505" y1="92" x2="505" y2="126" stroke="#e5e5e5"/>
  </g>
  <text x="105" y="114" text-anchor="end" font-size="12" fill="#666">prices</text>
  <text x="147" y="114" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">p₀</text>
  <text x="202" y="114" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">p₁</text>
  <text x="257" y="114" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">p₂</text>
  <text x="312" y="114" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">p₃</text>
  <text x="367" y="114" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">p₄</text>
  <text x="422" y="114" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">p₅</text>
  <text x="477" y="114" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">p₆</text>
  <text x="532" y="114" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">p₇</text>

  <!-- window highlight box -->
  <g filter="url(#sk)">
    <rect x="234" y="86" width="212" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="340" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10">修改窗口 [l, l+k) = [2, 6)</text>

  <!-- strategy row -->
  <g filter="url(#sk)">
    <rect x="120" y="142" width="440" height="34" rx="4" fill="none" stroke="#c9c9c9" stroke-width="1"/>
    <line x1="230" y1="142" x2="230" y2="176" stroke="#c9c9c9"/>
    <line x1="340" y1="142" x2="340" y2="176" stroke="#c9c9c9"/>
    <line x1="450" y1="142" x2="450" y2="176" stroke="#c9c9c9"/>
    <line x1="175" y1="142" x2="175" y2="176" stroke="#e5e5e5"/>
    <line x1="285" y1="142" x2="285" y2="176" stroke="#e5e5e5"/>
    <line x1="395" y1="142" x2="395" y2="176" stroke="#e5e5e5"/>
    <line x1="505" y1="142" x2="505" y2="176" stroke="#e5e5e5"/>
  </g>
  <text x="105" y="164" text-anchor="end" font-size="12" fill="#666">strategy</text>
  <text x="147" y="164" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">s₀</text>
  <text x="202" y="164" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">s₁</text>
  <text x="257" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" font-family="monospace">0</text>
  <text x="312" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" font-family="monospace">0</text>
  <text x="367" y="164" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" font-family="monospace">1</text>
  <text x="422" y="164" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" font-family="monospace">1</text>
  <text x="477" y="164" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">s₆</text>
  <text x="532" y="164" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">s₇</text>
  <text x="285" y="196" text-anchor="middle" font-size="10.5" fill="#b85450">前 k/2 个 ← 改为 0（持有）</text>
  <text x="395" y="196" text-anchor="middle" font-size="10.5" fill="#2e6e2e">后 k/2 个 ← 改为 1（卖出）</text>

  <!-- outside unchanged labels -->
  <g filter="url(#sk)">
    <path d="M 155 216 Q 150 232 148 244" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 525 216 Q 530 232 532 244" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="148" y="262" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">窗口外：sᵢ·pᵢ 不变</text>
  <text x="532" y="262" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">贡献恒为 base 的一部分</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="90" y="286" width="500" height="116" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="314" text-anchor="middle" font-size="14" fill="#2b2b2b" font-family="monospace">利润(l) = base − old(l) + cur(l)</text>
  <text x="340" y="340" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">old(l) = Σ sᵢ·pᵢ（i ∈ 窗口，原策略贡献）</text>
  <text x="340" y="362" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" font-family="monospace">cur(l) = Σ pᵢ（i ∈ 后 k/2 天）—— 与原 strategy 无关！</text>
  <text x="340" y="388" text-anchor="middle" font-size="11" fill="#888">0×p = 0 全消掉，1×p = p 全保留，新贡献只看价格</text>
</svg>
