<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n = 10 与 n = 205（遇 0 即断）</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- panel A: n = 10 -->
  <rect x="45" y="54" width="550" height="176" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="70" y="80" text-anchor="start" font-size="13.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">例 1：n = 10（L = 2）</text>

  <g filter="url(#sk)">
    <rect x="70" y="94" width="42" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="116" y="94" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="91" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#33517a" filter="url(#sk)">1</text>
  <text x="137" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>
  <path d="M 122 104 L 152 128" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="137" y="152" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">i=1</text>
  <text x="91" y="152" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">i=0</text>

  <text x="200" y="104" text-anchor="start" font-size="12" fill="#6a5530" filter="url(#sk)">阶段一（位数 &lt; 2 的全收）：9^1 = 9</text>
  <text x="200" y="128" text-anchor="start" font-size="12" fill="#6a5530" filter="url(#sk)">i=0：d = 1 → (1−1)·9^1 = 0，贴住 1 继续</text>
  <text x="200" y="152" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">i=1：d = 0 → 贴不住，break ✗</text>
  <text x="200" y="182" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">合计：9 + 0 = 9 ✓（n 含 0，不补 1）</text>
  <text x="200" y="204" text-anchor="start" font-size="10.5" fill="#999" filter="url(#sk)">验证：1..10 删零得 1,2,…,9,1，不同值恰 9 个</text>

  <!-- panel B: n = 205 -->
  <rect x="45" y="248" width="550" height="200" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="70" y="274" text-anchor="start" font-size="13.5" font-weight="bold" fill="#33517a" filter="url(#sk)">例 2：n = 205（L = 3，上界中间藏 0）</text>

  <g filter="url(#sk)">
    <rect x="70" y="288" width="42" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="116" y="288" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="162" y="288" width="42" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="91" y="315" text-anchor="middle" font-size="18" font-weight="bold" fill="#33517a" filter="url(#sk)">2</text>
  <text x="137" y="315" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>
  <path d="M 122 298 L 152 322" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="183" y="315" text-anchor="middle" font-size="18" font-weight="bold" fill="#33517a" filter="url(#sk)">5</text>
  <text x="91" y="346" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">i=0</text>
  <text x="137" y="346" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">i=1</text>
  <text x="183" y="346" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">i=2</text>

  <text x="235" y="298" text-anchor="start" font-size="12" fill="#446688" filter="url(#sk)">阶段一（位数 &lt; 3）：9 + 81 = 90</text>
  <text x="235" y="322" text-anchor="start" font-size="12" fill="#446688" filter="url(#sk)">i=0：d = 2 → (2−1)·9^2 = 81</text>
  <text x="250" y="340" text-anchor="start" font-size="10.5" fill="#666" filter="url(#sk)">（首位填 1，后两位各 9 种自由）</text>
  <text x="235" y="364" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">i=1：d = 0 → 贴不住，break ✗（第 i=2 位再也不看）</text>
  <text x="235" y="392" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">合计：90 + 81 = 171 ✓</text>
  <text x="235" y="414" text-anchor="start" font-size="10.5" fill="#999" filter="url(#sk)">对拍：1..205 中无零数确有 171 个</text>

  <text x="320" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6520" filter="url(#sk)">两例共同点：贴上界一旦撞上 0 就收工，剩下的交给阶段一</text>
</svg>
