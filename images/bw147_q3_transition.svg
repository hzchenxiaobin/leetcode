<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="372" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">转移：把新元素 x 接在「以 u 结尾、上次差值 ≥ |x−u|」之后</text>

  <rect x="30" y="58" width="176" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="118" y="82" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">已处理的旧元素</text>
  <text filter="url(#rough2)" x="118" y="102" text-anchor="middle" font-size="10.6" fill="#555">以值 u 结尾的子序列</text>
  <text filter="url(#rough2)" x="118" y="118" text-anchor="middle" font-size="10.6" fill="#555">末段差值 d' ∈ [d, 300]</text>

  <path d="M 210 91 L 268 91" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="239" y="82" text-anchor="middle" font-size="9.8" fill="#666">查表</text>

  <rect x="272" y="58" width="176" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="360" y="82" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">suf[u][d] + 1</text>
  <text filter="url(#rough2)" x="360" y="102" text-anchor="middle" font-size="10.6" fill="#555">O(1) 拿到"d' ≥ d 的最优"</text>
  <text filter="url(#rough2)" x="360" y="118" text-anchor="middle" font-size="10.6" fill="#555">d = |x − u|</text>

  <path d="M 452 91 L 500 91" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="30" y="140" width="520" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="290" y="160" text-anchor="middle" font-size="11.6" fill="#8a6a20" font-weight="bold">f[x][d] = max( f[x][d], 1 + max_{u : |x−u| = d} suf[u][d] )</text>
  <text filter="url(#rough2)" x="290" y="180" text-anchor="middle" font-size="10.4" fill="#666">固定 x 后枚举 u = 1..300，一次元素只产生 300 个候选（每个候选一个确定的 d）</text>

  <rect x="30" y="206" width="250" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="155" y="228" text-anchor="middle" font-size="11.3" fill="#8a3a36" font-weight="bold">阶段一：只算候选，不写表</text>
  <text filter="url(#rough2)" x="155" y="248" text-anchor="middle" font-size="10.3" fill="#555">cand[d] = best over u</text>
  <text filter="url(#rough2)" x="155" y="266" text-anchor="middle" font-size="10.3" fill="#555">所有读取都基于"旧"的 suf</text>
  <text filter="url(#rough2)" x="155" y="284" text-anchor="middle" font-size="10.3" fill="#555">避免同一元素被自己续用</text>

  <path d="M 284 249 L 320 249" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="324" y="206" width="226" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="437" y="228" text-anchor="middle" font-size="11.3" fill="#3a4a66" font-weight="bold">阶段二：写回 row x</text>
  <text filter="url(#rough2)" x="437" y="248" text-anchor="middle" font-size="10.3" fill="#555">f[x][d] = max(f[x][d], cand[d])</text>
  <text filter="url(#rough2)" x="437" y="266" text-anchor="middle" font-size="10.3" fill="#555">再从 d=300 到 0 重算 suf[x][·]</text>
  <text filter="url(#rough2)" x="437" y="284" text-anchor="middle" font-size="10.3" fill="#555">只动一行，代价 O(300)</text>

  <rect x="30" y="304" width="520" height="52" fill="#eef3f8" stroke="#8899aa" stroke-width="1.2" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="46" y="324" font-size="10.8" fill="#444">为什么按「值」合并是安全的：延续只取决于「末端值 u」与「末段差值 d'」。</text>
  <text filter="url(#rough2)" x="46" y="344" font-size="10.8" fill="#444">所以每个 (u, d') 只留最长的一条即可；处理顺序仍按原数组下标。</text>
</svg>
