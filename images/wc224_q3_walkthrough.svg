<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：matrix = [[0,0,1],[1,1,1],[1,0,1]]（示例 1）</text>

  <!-- ===== Row 0 ===== -->
  <rect x="36" y="44" width="588" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="74" font-size="12.5" fill="#2c4a6e" filter="url(#rough2)">第 0 行 [0, 0, 1] → heights = [0, 0, 1] → 降序 [1, 0, 0]</text>
  <rect x="56" y="88" width="132" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="107" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">j=0：1×1 = 1</text>
  <rect x="200" y="88" width="168" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="107" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">j=1：h=0 → break</text>
  <text x="596" y="107" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">ans：0 → 1</text>

  <!-- ===== Row 1 ===== -->
  <rect x="36" y="142" width="588" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="172" font-size="12.5" fill="#2c4a6e" filter="url(#rough2)">第 1 行 [1, 1, 1] → heights = [1, 1, 2] → 降序 [2, 1, 1]</text>
  <rect x="56" y="186" width="96" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="205" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">2×1 = 2</text>
  <rect x="164" y="186" width="96" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="205" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">1×2 = 2</text>
  <rect x="272" y="186" width="110" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327" y="205" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">1×3 = 3</text>
  <text x="596" y="205" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">ans：1 → 3</text>

  <!-- ===== Row 2 (answer) ===== -->
  <rect x="36" y="240" width="588" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="56" y="270" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">第 2 行 [1, 0, 1] → heights = [2, 0, 3] → 降序 [3, 2, 0]</text>
  <rect x="56" y="284" width="96" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="303" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">3×1 = 3</text>
  <rect x="164" y="284" width="110" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="219" y="303" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">2×2 = 4 ★</text>
  <rect x="286" y="284" width="168" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="303" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">j=2：h=0 → break</text>
  <text x="596" y="303" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">ans：3 → 4</text>
  <text x="56" y="328" font-size="10" fill="#666" filter="url(#rough2)">高 3 列与高 2 列原本不相邻——重排 + 排序才拼出 2×2</text>

  <!-- ===== Summary ===== -->
  <rect x="36" y="352" width="588" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a4a1a" filter="url(#rough2)">逐行取最大：1 → 3 → 4</text>
  <text x="330" y="408" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">最终答案：4 ✓</text>
  <text x="330" y="426" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每行候选都对应一个可行的列排列（引理 1），全局最优被封顶（引理 2）</text>
</svg>
