<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">单个单词的查询流程：走一步看一步，命中即停</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">外层：sentence.split(' ') 逐词处理；内层：沿 Trie 逐字符下降</text>

  <g filter="url(#rough2)">
    <rect x="170" y="60" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="8"/>
    <text x="280" y="82" text-anchor="middle" font-size="11.5" fill="#2f4666">取一个单词 word，cur = root，i = 0</text>

    <rect x="170" y="118" width="220" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.7" rx="8"/>
    <text x="280" y="140" text-anchor="middle" font-size="11.5" fill="#2f4666">cur = cur.child(word[i])，i += 1</text>

    <polygon points="280,170 362,205 280,240 198,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
    <text x="280" y="202" text-anchor="middle" font-size="11" fill="#7a5a10">cur 是终结节点？</text>
    <text x="280" y="218" text-anchor="middle" font-size="10" fill="#a07a20">(isEnd)</text>

    <polygon points="280,258 352,292 280,326 208,292" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
    <text x="280" y="288" text-anchor="middle" font-size="10.5" fill="#8a3a36">还有字符，且</text>
    <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#8a3a36">子节点存在？</text>

    <rect x="392" y="186" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8"/>
    <text x="462" y="202" text-anchor="middle" font-size="10.5" fill="#3c5c30">替换为前缀</text>
    <text x="462" y="216" text-anchor="middle" font-size="10.5" fill="#3c5c30">word[0 .. i)</text>

    <rect x="40" y="274" width="130" height="36" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="8"/>
    <text x="105" y="297" text-anchor="middle" font-size="11" fill="#555">保留原词</text>

    <rect x="30" y="356" width="250" height="32" fill="#f2f2f2" stroke="#aaa" stroke-width="1.4" rx="8"/>
    <text x="46" y="377" font-size="10.5" fill="#555">最后：所有结果用空格连接，返回字符串</text>
  </g>

  <g filter="url(#rough2)" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="280" y1="94" x2="280" y2="114"/>
    <line x1="280" y1="152" x2="280" y2="168"/>
    <line x1="362" y1="205" x2="390" y2="205"/>
    <line x1="280" y1="240" x2="280" y2="254"/>
    <line x1="208" y1="292" x2="174" y2="292"/>
    <path d="M 280 326 L 280 344 L 540 344 L 540 140 L 394 140"/>
  </g>

  <g filter="url(#rough2)" font-size="10">
    <text x="362" y="200" fill="#4a7a3a">是</text>
    <text x="186" y="284" fill="#b85450">否</text>
    <text x="290" y="338" fill="#4a7a3a">是（继续下降）</text>
    <text x="404" y="160" fill="#888">走完仍非终结 ⇒ 保留原词</text>
  </g>
</svg>
