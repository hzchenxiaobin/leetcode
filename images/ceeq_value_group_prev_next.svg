<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">按值分组：最近的同值必是环形「前驱 / 后继」</text>

  <!-- 环形回绕箭头 -->
  <path d="M 560,104 C 480,50 170,50 98,102" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="327" y="56" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">环形：下标 6 之后接回 0</text>
  <text x="327" y="86" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums = [1, 3, 1, 4, 1, 3, 2]（n = 7）</text>

  <!-- 环形数组 7 格，y=112 -->
  <rect x="90" y="112" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="117" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <rect x="158" y="112" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="185" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="226" y="112" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="253" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>

  <rect x="294" y="112" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="321" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>

  <rect x="362" y="112" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="389" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="389" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>

  <rect x="430" y="112" width="54" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="457" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="457" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5 ← q</text>

  <rect x="498" y="112" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="525" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="525" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6</text>

  <!-- 查询指示箭头 -->
  <path d="M 457,176 C 457,196 390,198 345,212" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="196" font-size="12" fill="#d6a040" filter="url(#rough2)">查询 q = 5</text>

  <text x="62" y="206" font-size="12" fill="#888" filter="url(#rough2)">按值分组（哈希表 pos）：</text>

  <!-- 值 1 组 -->
  <rect x="60" y="216" width="164" height="72" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="238" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">值 1：v = [0, 2, 4]</text>
  <rect x="80" y="248" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="120" y="248" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="160" y="248" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- 值 3 组（查询所在，重点框） -->
  <rect x="240" y="216" width="200" height="120" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="340" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">值 3：v = [1, 5]（q 所在组）</text>
  <rect x="282" y="250" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="358" y="250" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="302" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">prev</text>
  <text x="378" y="296" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">q（idx = 1）</text>
  <text x="340" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">next = v[(1+1) % 2] = v[0] = 1</text>

  <!-- 值 4 / 值 2 组 -->
  <rect x="460" y="216" width="150" height="56" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="535" y="238" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">值 4：v = [3]</text>
  <text x="535" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">长度 1 ⇒ answer = −1</text>

  <rect x="460" y="282" width="150" height="56" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="535" y="304" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">值 2：v = [6]</text>
  <text x="535" y="324" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">长度 1 ⇒ answer = −1</text>

  <!-- 底部公式框 -->
  <rect x="60" y="352" width="520" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="378" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">环上距离：rd(i, j) = min( |i − j| , n − |i − j| )</text>
  <text x="320" y="406" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">answer(q) = min( rd(q, prev), rd(q, next) )；|v| = 1 时为 −1</text>
</svg>
