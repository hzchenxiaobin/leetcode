<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="404" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：第 n 行 = 第 n-1 行 拼接 取反(第 n-1 行)</text>
  <text x="320" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">展开规则 0 → 01、1 → 10：第一位不变，第二位取反</text>
  <text x="232" y="113" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">第 2 行</text>
  <rect x="246" y="92" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263.0" y="114" text-anchor="middle" font-size="14" fill="#2f3f5c" filter="url(#rough2)">0</text>
  <rect x="282" y="92" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299.0" y="114" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="232" y="165" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">第 3 行</text>
  <rect x="246" y="144" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263.0" y="166" text-anchor="middle" font-size="14" fill="#2f3f5c" filter="url(#rough2)">0</text>
  <rect x="282" y="144" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299.0" y="166" text-anchor="middle" font-size="14" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="318" y="144" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335.0" y="166" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="354" y="144" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371.0" y="166" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">0</text>
  <text x="232" y="217" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">第 4 行</text>
  <rect x="246" y="196" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263.0" y="218" text-anchor="middle" font-size="14" fill="#2f3f5c" filter="url(#rough2)">0</text>
  <rect x="282" y="196" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299.0" y="218" text-anchor="middle" font-size="14" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="318" y="196" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335.0" y="218" text-anchor="middle" font-size="14" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="354" y="196" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371.0" y="218" text-anchor="middle" font-size="14" fill="#2f3f5c" filter="url(#rough2)">0</text>
  <rect x="390" y="196" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407.0" y="218" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="426" y="196" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="443.0" y="218" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">0</text>
  <rect x="462" y="196" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="479.0" y="218" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">0</text>
  <rect x="498" y="196" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515.0" y="218" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">1</text>
  <path d="M 246 236 L 246 243 L 388 243 L 388 236" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 390 236 L 390 243 L 532 243 L 532 236" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="318" y="262" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">前半 = 第 3 行</text>
  <text x="462" y="262" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">后半 = 取反(第 3 行)</text>
  <rect x="54" y="284" width="532" height="104" fill="#f5f7fb" stroke="#9aa7bb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="70" y="308" text-anchor="start" font-size="11" fill="#3f4f66" filter="url(#rough2)">① 每个字符 c 展开成 c 与 1-c：0→01，1→10</text>
  <text x="70" y="332" text-anchor="start" font-size="11" fill="#3f4f66" filter="url(#rough2)">② 整行展开后按「第 1 位 / 第 2 位」分组，正好是 父行 + 父行取反</text>
  <text x="70" y="356" text-anchor="start" font-size="11" fill="#3f4f66" filter="url(#rough2)">③ 所以第 n-1 行是第 n 行的前缀 → 答案只与 k 有关，与 n 无关</text>
  <text x="70" y="380" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">④ 看 k 落在前半还是后半：前半同父，后半取反</text>
</svg>
