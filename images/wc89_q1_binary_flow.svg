<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="560" height="430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">二分查找流程：每轮砍掉不含峰顶的一半</text>
  <rect x="180" y="62" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="86.5" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">lo = 0, hi = n - 1</text>
  <path d="M 280 102 L 280 122" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 280 124 L 420 158 L 280 192 L 140 158 Z" stroke="#d6a040" stroke-width="1.6" fill="#fff8e1" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">lo &lt; hi ?</text>
  <text x="280" y="174" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)"></text>
  <path d="M 420 158 L 500 158" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="452" y="148" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="496" y="138" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="524" y="155" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">返回</text>
  <text x="524" y="169.3" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">lo</text>
  <path d="M 500 158 L 424 158" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4 3" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 280 192 L 280 214" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="294" y="208" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <rect x="178" y="214" width="204" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="238.3" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">mid = (lo + hi) / 2</text>
  <path d="M 280 254 L 280 274" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 280 276 L 420 310 L 280 344 L 140 310 Z" stroke="#d6a040" stroke-width="1.6" fill="#fff8e1" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">arr[mid] &lt;</text>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">arr[mid + 1] ?</text>
  <path d="M 140 310 L 62 310" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="104" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是（上坡）</text>
  <rect x="8" y="292" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="37" y="307.3" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">lo = mid</text>
  <text x="37" y="320.3" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+ 1</text>
  <path d="M 420 310 L 498 310" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="456" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否（下坡）</text>
  <rect x="496" y="292" width="58" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="525" y="313.8" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">hi = mid</text>
  <path d="M 37 292 L 37 74 L 176 74" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 525 292 L 525 74 L 384 74" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="300" y="400" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">循环退出时 lo == hi，唯一满足「比右邻居小、比左邻居大」的下标就是峰顶</text>
</svg>
