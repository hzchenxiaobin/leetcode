<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b0722a"/></marker>
  </defs>
  <rect width="620" height="440" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：包裹可拆分 ⇒ 唯一约束是「总容量 ≥ 总数」</text>
  <path d="M 150 38 Q 310 46 470 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- packages row -->
  <text x="70" y="68" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#r)">包裹（同一包裹的苹果可拆散）</text>
  <g filter="url(#r)">
    <rect x="70" y="76" width="56" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="138" y="76" width="56" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="206" y="76" width="56" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#2e6e2e" font-weight="bold" filter="url(#r)">
    <text x="98" y="103">1</text>
    <text x="166" y="103">3</text>
    <text x="234" y="103">2</text>
  </g>
  <text x="166" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#r)">apple，总数 S = 1 + 3 + 2 = 6</text>

  <!-- flow arrows -->
  <path d="M 98 130 Q 100 178 106 224" stroke="#b0722a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#r)"/>
  <path d="M 166 130 Q 158 180 148 224" stroke="#b0722a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#r)"/>
  <path d="M 234 130 Q 216 178 198 224" stroke="#b0722a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#r)"/>
  <text x="420" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b0722a" filter="url(#r)">苹果自由流动 ⇒</text>
  <text x="420" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b0722a" filter="url(#r)">不必模拟怎么装，只看总量够不够</text>

  <!-- boxes row -->
  <text x="70" y="222" font-size="13" font-weight="bold" fill="#446688" filter="url(#r)">箱子（按容量降序）</text>
  <g filter="url(#r)">
    <rect x="70" y="232" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <rect x="138" y="232" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <rect x="206" y="232" width="56" height="44" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
    <rect x="274" y="232" width="56" height="44" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
    <rect x="342" y="232" width="56" height="44" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#2b4a6e" font-weight="bold" filter="url(#r)">
    <text x="98" y="259">5</text>
    <text x="166" y="259">4</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#777" filter="url(#r)">
    <text x="234" y="259">3</text>
    <text x="302" y="259">2</text>
    <text x="370" y="259">1</text>
  </g>
  <text x="98" y="294" text-anchor="middle" font-size="11.5" fill="#b0722a" filter="url(#r)">累计 5 &lt; 6 ↻</text>
  <text x="166" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">累计 9 ≥ 6 ✓ 停</text>
  <text x="302" y="294" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#r)">更小的箱子——不取</text>

  <!-- right panel -->
  <g filter="url(#r)">
    <rect x="445" y="228" width="150" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="520" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">选前 2 个最大的</text>
  <text x="520" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">5 + 4 = 9</text>
  <text x="520" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">9 ≥ S = 6 ✓</text>

  <!-- formula box -->
  <g filter="url(#r)">
    <rect x="55" y="316" width="510" height="48" rx="10" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="310" y="345" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#r)">箱子集合 T 可行 ⇔ Σ capacity[T] ≥ S（与包裹怎么拆无关）</text>

  <!-- conclusion callout -->
  <g filter="url(#r)">
    <rect x="40" y="378" width="540" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="62" y="400" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">贪心：按容量降序，从最大的箱子开始取，累计 ≥ S 立即停</text>
  <text x="62" y="420" font-size="12" fill="#444" filter="url(#r)">同样取 k 个 ⇒ 取最大的 k 个总容量最大，名额最省——这就是贪心交换依据</text>
</svg>
