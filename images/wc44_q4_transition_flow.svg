<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#444"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="#fafafa"/>

  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：倒序 DP 求最小花费，再贪心重建字典序最小路径</text>
  <path d="M 150 44 Q 470 52 790 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- ① 初始化 -->
  <rect x="270" y="78" width="400" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">① 初始化：dp[N] = coins[N]</text>
  <text x="470" y="122" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">若 coins[N] = −1 则 dp[N] = +∞（终点不可落脚）</text>

  <path d="M 470 134 L 470 150" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ② 倒序枚举 -->
  <rect x="270" y="154" width="400" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">② 倒序枚举 i = N−1 → 1（跳过 coins[i] = −1）</text>

  <path d="M 470 206 L 470 218" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 转移菱形 -->
  <polygon points="470,222 620,268 470,314 320,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5a10" filter="url(#rough2)">dp[i] = coins[i] +</text>
  <text x="470" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5a10" filter="url(#rough2)">min dp[j]（窗口 B 个）</text>

  <!-- 左分支：coins[i] = -1 -->
  <path d="M 320 268 L 274 268" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="296" y="260" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="40" y="242" width="230" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="265" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">coins[i] = −1</text>
  <text x="155" y="285" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">dp[i] 保持 +∞，跳过该点</text>

  <path d="M 470 314 L 470 326" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 无解菱形 -->
  <polygon points="470,330 620,376 470,422 320,376" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">dp[1] = +∞ ?</text>

  <path d="M 320 376 L 274 376" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="296" y="368" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="40" y="350" width="230" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="373" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">无可达路径</text>
  <text x="155" y="393" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">直接返回空数组 []</text>

  <path d="M 470 422 L 470 434" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="482" y="432" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- ③ 重建 -->
  <rect x="150" y="438" width="640" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">③ 贪心重建：cur = 1，路径 = [1]</text>
  <text x="470" y="488" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">窗口内从小到大找第一个 j，满足 dp[j] + coins[cur] = dp[cur]</text>
  <text x="470" y="510" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">cur ← j，把 j 加入路径，直到 cur = N，返回路径（1-based）</text>

  <text x="470" y="552" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">时间复杂度 O(n · maxJump) = O(10⁵)，空间 O(n)；贪心取最小下标保证字典序最小</text>
</svg>
