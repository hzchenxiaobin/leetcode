<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：单趟扫描维护字典序最大的 (d², area)</text>

  <!-- 示例 1 -->
  <text x="40" y="62" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：[[9,3],[8,6]] —— 主键 d² 分胜负</text>

  <g filter="url(#rough2)">
    <rect x="40" y="72" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="130" y="72" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="260" y="72" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="340" y="72" width="170" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="510" y="72" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">
    <text x="85" y="90" text-anchor="middle">矩形</text>
    <text x="195" y="90" text-anchor="middle">d² = l²+w²</text>
    <text x="300" y="90" text-anchor="middle">area</text>
    <text x="425" y="90" text-anchor="middle">与 best 比较</text>
    <text x="575" y="90" text-anchor="middle">best (d², area)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="100" width="90" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="130" y="100" width="130" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="260" y="100" width="80" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="340" y="100" width="170" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="510" y="100" width="130" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#444" filter="url(#rough2)">
    <text x="85" y="121" text-anchor="middle">[9,3]</text>
    <text x="195" y="121" text-anchor="middle">81+9 = 90</text>
    <text x="300" y="121" text-anchor="middle">27</text>
    <text x="425" y="121" text-anchor="middle">90 &gt; −1 → 更新</text>
    <text x="575" y="121" text-anchor="middle">(90, 27)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="134" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="130" y="134" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="260" y="134" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="340" y="134" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="510" y="134" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">
    <text x="85" y="155" text-anchor="middle">[8,6]</text>
    <text x="195" y="155" text-anchor="middle">64+36 = 100</text>
    <text x="300" y="155" text-anchor="middle">48</text>
    <text x="425" y="155" text-anchor="middle">100 &gt; 90 → 更新</text>
    <text x="575" y="155" text-anchor="middle">(100, 48)</text>
  </g>

  <text x="40" y="196" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">扫描结束 → 返回 bestArea = 48 ✓</text>

  <!-- 示例 2 -->
  <text x="40" y="230" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">示例 2：[[3,4],[4,3]] —— 平局走次键</text>

  <g filter="url(#rough2)">
    <rect x="40" y="240" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="130" y="240" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="260" y="240" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="340" y="240" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="510" y="240" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">
    <text x="85" y="258" text-anchor="middle">矩形</text>
    <text x="195" y="258" text-anchor="middle">d² = l²+w²</text>
    <text x="300" y="258" text-anchor="middle">area</text>
    <text x="425" y="258" text-anchor="middle">与 best 比较</text>
    <text x="575" y="258" text-anchor="middle">best (d², area)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="268" width="90" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="130" y="268" width="130" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="260" y="268" width="80" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="340" y="268" width="170" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="510" y="268" width="130" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#444" filter="url(#rough2)">
    <text x="85" y="289" text-anchor="middle">[3,4]</text>
    <text x="195" y="289" text-anchor="middle">9+16 = 25</text>
    <text x="300" y="289" text-anchor="middle">12</text>
    <text x="425" y="289" text-anchor="middle">25 &gt; −1 → 更新</text>
    <text x="575" y="289" text-anchor="middle">(25, 12)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="302" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="130" y="302" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="260" y="302" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="340" y="302" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="510" y="302" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">
    <text x="85" y="323" text-anchor="middle">[4,3]</text>
    <text x="195" y="323" text-anchor="middle">16+9 = 25</text>
    <text x="300" y="323" text-anchor="middle">12</text>
    <text x="425" y="323" text-anchor="middle">平局：area 12 ≯ 12</text>
    <text x="575" y="323" text-anchor="middle">(25, 12) 不变</text>
  </g>

  <text x="40" y="362" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">平局分支未改写 best → 返回 12 ✓</text>

  <!-- 底部备注 -->
  <g filter="url(#rough2)">
    <rect x="40" y="378" width="600" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="396" text-anchor="middle" font-size="11.5" fill="#2b5a88" filter="url(#rough2)">哨兵 bestD² = −1 保证第一个矩形必然写入；n = 1 时直接返回其面积</text>
  <text x="340" y="414" text-anchor="middle" font-size="11.5" fill="#2b5a88" filter="url(#rough2)">多个矩形 (d², area) 完全并列时面积必相等，取谁都不影响答案</text>
</svg>
