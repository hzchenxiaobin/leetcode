<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：保住 'a' 前缀，第一个非 'a' 段整体减一</text>
  <path d="M 100 44 Q 320 52 540 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="68" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#sk)">以 s = "acbbc" 为例：i = 1 是第一个非 'a'，操作区间从 i 开始尽量向右延伸</text>

  <g filter="url(#sk)">
    <rect x="198" y="86" width="44" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="248" y="86" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="298" y="86" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="348" y="86" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="398" y="86" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="243" y="80" width="204" height="52" rx="10" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7,5"/>
  </g>
  <text x="220" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e24" filter="url(#sk)">a</text>
  <text x="270" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">c</text>
  <text x="320" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">b</text>
  <text x="370" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">b</text>
  <text x="420" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">c</text>
  <text x="455" y="110" font-size="12" fill="#8a6415" filter="url(#sk)">操作区间 [1,4]</text>

  <text x="220" y="144" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">0</text>
  <text x="270" y="144" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">1</text>
  <text x="320" y="144" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">2</text>
  <text x="370" y="144" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">3</text>
  <text x="420" y="144" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">4</text>

  <path d="M 270 136 L 270 154" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 136 L 320 154" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 370 136 L 370 154" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 420 136 L 420 154" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="270" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415" filter="url(#sk)">b</text>
  <text x="320" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415" filter="url(#sk)">a</text>
  <text x="370" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415" filter="url(#sk)">a</text>
  <text x="420" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415" filter="url(#sk)">b</text>

  <text x="320" y="200" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">结果 <tspan font-weight="bold" fill="#2e5e24">a</tspan><tspan font-weight="bold" fill="#8a6415">baab</tspan> = abaab —— 前缀 'a' 纹丝不动，段内各减一</text>

  <path d="M 60 216 Q 320 224 580 216" stroke="#cfcfc5" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <text x="320" y="240" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">为什么遇到 'a' 必须停？—— 'a' 的前驱是 'z'，减一反而变大</text>

  <g filter="url(#sk)">
    <rect x="252" y="254" width="44" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="312" y="254" width="44" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="372" y="254" width="44" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="274" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">c</text>
  <text x="334" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">b</text>
  <text x="394" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">a</text>

  <path d="M 274 294 L 274 310" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 334 294 L 334 310" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 394 294 L 394 310" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="274" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">b ✓</text>
  <text x="334" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">a ✓</text>
  <text x="394" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">z ✗</text>

  <text x="445" y="270" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">把 'a' 拉进区间</text>
  <text x="445" y="288" font-size="11.5" fill="#b85450" filter="url(#sk)">该位变 'z'，当场变大</text>

  <g filter="url(#sk)">
    <rect x="24" y="346" width="188" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="226" y="346" width="188" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="428" y="346" width="188" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="118" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e24" filter="url(#sk)">'a' 前缀动不得</text>
  <text x="118" y="386" text-anchor="middle" font-size="11" fill="#2e5e24" filter="url(#sk)">已是最小字母，覆盖即产出 'z'</text>
  <text x="320" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">非 'a' 段整体减一</text>
  <text x="320" y="386" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#sk)">每个字符严格变小，越延伸越好</text>
  <text x="522" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">遇 'a' 立即停</text>
  <text x="522" y="386" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">a − 1 = z，不降反升</text>

  <text x="320" y="418" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">贪心区间 = [第一个非 'a' 下标 i，从 i 起的极大非 'a' 段右端 j]</text>
</svg>
