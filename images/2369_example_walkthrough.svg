<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [4,4,4,5,6] 逐格填 dp</text>
  <path d="M 170 40 Q 340 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums row, colored by final partition: [4,4] blue, [4,5,6] orange -->
  <text x="110" y="79" text-anchor="end" font-size="12.5" fill="#444" filter="url(#sk)">nums：</text>
  <g filter="url(#sk)"><rect x="118" y="56" width="52" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="144" y="80" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="176" y="56" width="52" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="202" y="80" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="234" y="56" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="260" y="80" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="292" y="56" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="318" y="80" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="350" y="56" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="376" y="80" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#sk)">6</text>
  <text x="144" y="104" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">0</text>
  <text x="202" y="104" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">1</text>
  <text x="260" y="104" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">2</text>
  <text x="318" y="104" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">3</text>
  <text x="376" y="104" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">4</text>

  <!-- segment legend -->
  <g filter="url(#sk)"><rect x="440" y="56" width="214" height="48" rx="8" fill="#fbfaf5" stroke="#bbb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="452" y="66" width="14" height="12" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="474" y="77" font-size="10.5" fill="#444" filter="url(#sk)">末段① [4,4]</text>
  <g filter="url(#sk)"><rect x="452" y="84" width="14" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="474" y="95" font-size="10.5" fill="#444" filter="url(#sk)">末段③ [4,5,6]</text>

  <!-- dp row -->
  <text x="86" y="191" text-anchor="end" font-size="12.5" fill="#444" filter="url(#sk)">dp：</text>
  <g filter="url(#sk)"><rect x="94" y="166" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="120" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">T</text>
  <g filter="url(#sk)"><rect x="156" y="166" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="182" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04040" filter="url(#sk)">F</text>
  <g filter="url(#sk)"><rect x="218" y="166" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="244" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">T</text>
  <g filter="url(#sk)"><rect x="280" y="166" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="306" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">T</text>
  <g filter="url(#sk)"><rect x="342" y="166" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="368" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04040" filter="url(#sk)">F</text>
  <g filter="url(#sk)"><rect x="404" y="166" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="430" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">T</text>
  <text x="120" y="220" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">dp[0]</text>
  <text x="182" y="220" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">dp[1]</text>
  <text x="244" y="220" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">dp[2]</text>
  <text x="306" y="220" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">dp[3]</text>
  <text x="368" y="220" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">dp[4]</text>
  <text x="430" y="220" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">dp[5]</text>

  <!-- transition arrows above dp row -->
  <g filter="url(#sk)">
    <path d="M 120 162 Q 182 134 244 162" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="152" y="131" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① [4,4] ✓</text>
  <g filter="url(#sk)">
    <path d="M 120 162 Q 213 112 306 162" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="268" y="131" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② [4,4,4] ✓</text>
  <text x="368" y="149" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">断档！</text>
  <text x="368" y="163" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#sk)">末段 [4,5]✗ [4,4,5]✗</text>
  <text x="182" y="240" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">长 1 无段</text>

  <!-- key relay arrow below dp row -->
  <g filter="url(#sk)">
    <path d="M 244 208 Q 337 264 430 208" stroke="#d6a040" stroke-width="2.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="337" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#sk)">③ [4,5,6] ✓（接力 dp[2]）</text>

  <!-- reading guide panel -->
  <g filter="url(#sk)"><rect x="472" y="128" width="186" height="150" rx="10" fill="#fbfaf5" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="565" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">读表要点</text>
  <text x="484" y="176" font-size="10.5" fill="#444" filter="url(#sk)">dp[1]=F：长度 1 无段</text>
  <text x="484" y="198" font-size="10.5" fill="#444" filter="url(#sk)">dp[4]=F：末段全落空，断档</text>
  <text x="484" y="220" font-size="10.5" fill="#444" filter="url(#sk)">dp[5] 经 ③ 接力 dp[2]</text>
  <text x="484" y="242" font-size="10.5" fill="#444" filter="url(#sk)">链 0→2→5 存活 ⇒ true</text>

  <!-- verdict box -->
  <g filter="url(#sk)"><rect x="40" y="298" width="600" height="70" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="340" y="324" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">回溯：dp[5] ←③[4,5,6]— dp[2] ←①[4,4]— dp[0]</text>
  <text x="340" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">划分 = [4,4] + [4,5,6] ⇒ 返回 true ✓</text>

  <!-- insight box -->
  <g filter="url(#sk)"><rect x="40" y="382" width="600" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="340" y="406" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">DP 与贪心的分野：dp[4] 断档不代表全盘皆输——</text>
  <text x="340" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">只要存在一条从 dp[0] 到 dp[n] 的可行链，答案就是 true</text>

  <text x="340" y="462" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">i=5 的转移接到两格之外的 dp[2]——这正是 DP 保留全部分支换来的回报</text>
</svg>
