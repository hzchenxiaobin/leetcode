<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：顺序压栈 1…n+1，遇 'I' 或末尾才弹出</text>
  <path d="M 110 40 Q 280 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><rect x="170" y="60" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16"/></g>
  <text x="250" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">开始：ans 空 · 栈空</text>
  <path d="M 250 92 L 250 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- push -->
  <g filter="url(#sk)"><rect x="148" y="114" width="204" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/></g>
  <text x="250" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">push 数字 i+1</text>
  <text x="250" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">i = 0 … n（注意含 n，共 n+1 个数字）</text>
  <path d="M 250 158 L 250 174" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- 判断菱形 -->
  <g filter="url(#sk)"><polygon points="250,178 362,220 250,262 138,220" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="250" y="214" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a10" filter="url(#sk)">i == n 或</text>
  <text x="250" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a10" filter="url(#sk)">pattern[i] == 'I' ？</text>

  <!-- 否：'D' 右侧回环 -->
  <path d="M 362 220 L 448 220 L 448 136 L 358 136" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="503" y="164" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否（'D'）</text>
  <text x="503" y="180" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">数字滞留栈中</text>

  <!-- 是：向下 -->
  <text x="262" y="278" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <path d="M 250 262 L 250 284" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- 弹栈 -->
  <g filter="url(#sk)"><rect x="142" y="288" width="216" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/></g>
  <text x="250" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a10" filter="url(#sk)">整栈弹出，逐个接到 ans 尾</text>
  <text x="250" y="323" text-anchor="middle" font-size="10" fill="#8a6a10" filter="url(#sk)">（栈顶先出 = 倒序 = 段反转）</text>

  <!-- 左侧回环：i < n -->
  <path d="M 142 309 L 70 309 L 70 136 L 142 136" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text transform="rotate(-90 58 224)" x="58" y="224" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">i &lt; n：下一个 i</text>

  <!-- 结束分支 -->
  <text x="262" y="342" font-size="10.5" fill="#8a3a36" filter="url(#sk)">i == n</text>
  <path d="M 250 330 L 250 348" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="172" y="352" width="156" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="16"/></g>
  <text x="250" y="373" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#sk)">返回 ans ✓</text>

  <!-- 右下角：栈性质注记 -->
  <g filter="url(#sk)"><rect x="428" y="286" width="118" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/></g>
  <text x="487" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">栈 = 后进先出</text>
  <text x="487" y="328" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">压入顺序 4, 5</text>
  <text x="487" y="346" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">弹出顺序 5, 4</text>
  <text x="487" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">弹出天然倒序</text>
  <text x="487" y="380" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">＝ 'D' 段反转</text>
</svg>
