<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">改 word[i]：新字符总能同时躲开两侧的 ±1 禁止带</text>

  <!-- 原串片段 l ? r -->
  <g filter="url(#rough2)">
    <rect x="130" y="50" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="258" y="50" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <rect x="386" y="50" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="152" y="79" text-anchor="middle" font-size="17" fill="#333">b</text>
    <text x="280" y="79" text-anchor="middle" font-size="17" fill="#b85450">?</text>
    <text x="408" y="79" text-anchor="middle" font-size="17" fill="#333">y</text>
    <text x="152" y="110" text-anchor="middle" font-size="11" fill="#888">word[i−1]</text>
    <text x="280" y="110" text-anchor="middle" font-size="11" fill="#b85450">word[i] 待改</text>
    <text x="408" y="110" text-anchor="middle" font-size="11" fill="#888">word[i+1]</text>
  </g>

  <!-- 两侧禁止带 -->
  <g filter="url(#rough2)">
    <text x="60" y="152" font-size="12" fill="#b85450">左邻禁止带：</text>
    <rect x="146" y="138" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="176" y="138" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="206" y="138" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="161" y="156" text-anchor="middle" font-size="12" fill="#7a3030">a</text>
    <text x="191" y="156" text-anchor="middle" font-size="12" fill="#7a3030">b</text>
    <text x="221" y="156" text-anchor="middle" font-size="12" fill="#7a3030">c</text>
    <text x="60" y="192" font-size="12" fill="#d6a040">右邻禁止带：</text>
    <rect x="146" y="178" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="176" y="178" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="206" y="178" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="161" y="196" text-anchor="middle" font-size="12" fill="#7a5a10">x</text>
    <text x="191" y="196" text-anchor="middle" font-size="12" fill="#7a5a10">y</text>
    <text x="221" y="196" text-anchor="middle" font-size="12" fill="#7a5a10">z</text>
    <text x="250" y="172" font-size="12" fill="#555">每侧至多 3 个，</text>
    <text x="250" y="188" font-size="12" fill="#555">两侧合计 ≤ 6 &lt; 26</text>
  </g>

  <!-- 字母表条 -->
  <text x="60" y="245" font-size="12" fill="#555" filter="url(#rough2)">26 个字母：</text>
  <g filter="url(#rough2)">
    <text x="35" y="272" font-size="12" fill="#333" text-anchor="middle" text-decoration="line-through">a</text>
    <text x="54" y="272" font-size="12" fill="#333" text-anchor="middle" text-decoration="line-through">b</text>
    <text x="73" y="272" font-size="12" fill="#333" text-anchor="middle" text-decoration="line-through">c</text>
    <text x="92" y="272" font-size="12" fill="#333" text-anchor="middle">d</text>
    <text x="111" y="272" font-size="12" fill="#333" text-anchor="middle">e</text>
    <text x="130" y="272" font-size="12" fill="#333" text-anchor="middle">f</text>
    <ellipse cx="149" cy="268" rx="12" ry="14" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="149" y="272" font-size="12" fill="#1c3a1c" text-anchor="middle" font-weight="bold">g</text>
    <text x="168" y="272" font-size="12" fill="#333" text-anchor="middle">h</text>
    <text x="187" y="272" font-size="12" fill="#333" text-anchor="middle">i</text>
    <text x="206" y="272" font-size="12" fill="#333" text-anchor="middle">j</text>
    <text x="225" y="272" font-size="12" fill="#333" text-anchor="middle">k</text>
    <text x="244" y="272" font-size="12" fill="#333" text-anchor="middle">l</text>
    <text x="263" y="272" font-size="12" fill="#333" text-anchor="middle">m</text>
    <text x="282" y="272" font-size="12" fill="#333" text-anchor="middle">n</text>
    <text x="301" y="272" font-size="12" fill="#333" text-anchor="middle">o</text>
    <text x="320" y="272" font-size="12" fill="#333" text-anchor="middle">p</text>
    <text x="339" y="272" font-size="12" fill="#333" text-anchor="middle">q</text>
    <text x="358" y="272" font-size="12" fill="#333" text-anchor="middle">r</text>
    <text x="377" y="272" font-size="12" fill="#333" text-anchor="middle">s</text>
    <text x="396" y="272" font-size="12" fill="#333" text-anchor="middle">t</text>
    <text x="415" y="272" font-size="12" fill="#333" text-anchor="middle">u</text>
    <text x="434" y="272" font-size="12" fill="#333" text-anchor="middle">v</text>
    <text x="453" y="272" font-size="12" fill="#333" text-anchor="middle">w</text>
    <text x="472" y="272" font-size="12" fill="#333" text-decoration="line-through">x</text>
    <text x="491" y="272" font-size="12" fill="#333" text-anchor="middle" text-decoration="line-through">y</text>
    <text x="510" y="272" font-size="12" fill="#333" text-anchor="middle" text-decoration="line-through">z</text>
  </g>
  <text x="35" y="296" font-size="11" fill="#b85450" filter="url(#rough2)">红色划掉：与 b 冲突</text>
  <text x="200" y="296" font-size="11" fill="#d6a040" filter="url(#rough2)">黄色划掉：与 y 冲突</text>
  <text x="368" y="296" font-size="11" fill="#4a7a3a" filter="url(#rough2)">g：两侧都安全，闭眼选它</text>

  <rect x="70" y="310" width="420" height="32" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="331" text-anchor="middle" font-size="13" fill="#1c3a1c" filter="url(#rough2)">一次修改同时安抚 (i−1,i) 与 (i,i+1) 两对</text>
</svg>
