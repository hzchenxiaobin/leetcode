<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：parent = [-1,0,0,0]，nums = [2,1,2,1]，k = 3</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">三个叶子都挂在根 0 下；根一旦被选，叶子全不能选</text>
  <ellipse cx="280" cy="92" rx="26" ry="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <ellipse cx="150" cy="190" rx="24" ry="24" fill="#f2f2f2" stroke="#999999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="194" text-anchor="middle" font-size="12" fill="#999999" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 280 118 L 150 166" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="280" cy="190" rx="24" ry="24" fill="#f2f2f2" stroke="#999999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#999999" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 280 118 L 280 166" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="410" cy="190" rx="24" ry="24" fill="#f2f2f2" stroke="#999999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="194" text-anchor="middle" font-size="12" fill="#999999" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 280 118 L 410 166" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="240" text-anchor="middle" font-size="9.5" fill="#888">nums=1</text>
  <text x="280" y="240" text-anchor="middle" font-size="9.5" fill="#888">nums=2</text>
  <text x="410" y="240" text-anchor="middle" font-size="9.5" fill="#888">nums=1</text>
  <rect x="24" y="258" width="166" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="107" y="282" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">选根 0：值 2</text>
  <text x="107" y="295" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">叶子全禁 → 和 ≡ 2 ≠ 0</text>
  <text x="107" y="308" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不计数</text>
  <rect x="198" y="258" width="166" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="281" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">不选根，选 {1,2}：1+2 = 3</text>
  <text x="281" y="295" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3 % 3 = 0 ✓</text>
  <text x="281" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">有效</text>
  <rect x="372" y="258" width="166" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">不选根，选 {2,3}：2+1 = 3</text>
  <text x="455" y="295" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3 % 3 = 0 ✓</text>
  <text x="455" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">有效</text>
  <rect x="24" y="338" width="514" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="281" y="357" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">其余组合（{1}、{2}、{3}、{1,3}）余数都不为 0 → 答案 2</text>
</svg>
