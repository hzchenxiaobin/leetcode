<svg xmlns="http://www.w3.org/2000/svg" width="640" height="494" viewBox="0 0 640 494" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="494" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例 1 演算：三桶两两配对，6 个名字逐一落地</text>
  <path d="M 110 36 Q 320 45 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 分桶结果 -->
  <g filter="url(#sk)"><rect x="40" y="46" width="170" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="125" y="77" text-anchor="middle" font-size="12" fill="#33455e">S_c = { <tspan fill="#b85450" font-weight="bold">offee</tspan> }</text>
  <g filter="url(#sk)"><rect x="235" y="46" width="170" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="320" y="77" text-anchor="middle" font-size="12" fill="#2e5e2e">S_d = { onuts }</text>
  <g filter="url(#sk)"><rect x="430" y="46" width="170" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="515" y="77" text-anchor="middle" font-size="12" fill="#7a5415">S_t = { ime, <tspan fill="#b85450" font-weight="bold">offee</tspan> }</text>

  <text x="320" y="116" text-anchor="middle" font-size="11.5" fill="#a04a48">⚠ offee 同时在 c、t 两桶 ⇒ (c,t) 对 |S_c ∩ S_t| = 1，把 S_c 侧清零</text>

  <!-- 计数表 -->
  <g filter="url(#sk)"><rect x="30" y="126" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="106" y="126" width="118" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="224" y="126" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="364" y="126" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="504" y="126" width="106" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="68" y="144" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">字母对</text>
  <text x="165" y="144" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">S_a ∩ S_b</text>
  <text x="294" y="144" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">S_a ∖ S_b</text>
  <text x="434" y="144" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">S_b ∖ S_a</text>
  <text x="557" y="144" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">有效对 ×2</text>

  <g filter="url(#sk)"><rect x="30" y="154" width="580" height="40" fill="#e6f4ea" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="30" y="194" width="580" height="40" fill="#fce4ec" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="30" y="234" width="580" height="40" fill="#e6f4ea" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><path d="M 106 154 L 106 274 M 224 154 L 224 274 M 364 154 L 364 274 M 504 154 L 504 274 M 30 194 L 610 194 M 30 234 L 610 234" stroke="#446688" stroke-width="1" fill="none"/></g>

  <text x="68" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">(c, d)</text>
  <text x="165" y="171" text-anchor="middle" font-size="11.5" fill="#33455e">∅</text>
  <text x="165" y="185" text-anchor="middle" font-size="10" fill="#666">0 个</text>
  <text x="294" y="171" text-anchor="middle" font-size="11.5" fill="#33455e">{offee}</text>
  <text x="294" y="185" text-anchor="middle" font-size="10" fill="#666">1 个</text>
  <text x="434" y="171" text-anchor="middle" font-size="11.5" fill="#33455e">{onuts}</text>
  <text x="434" y="185" text-anchor="middle" font-size="10" fill="#666">1 个</text>
  <text x="557" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">1·1×2 = 2</text>

  <text x="68" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">(c, t)</text>
  <text x="165" y="211" text-anchor="middle" font-size="11.5" fill="#33455e">{offee}</text>
  <text x="165" y="225" text-anchor="middle" font-size="10" fill="#666">1 个</text>
  <text x="294" y="211" text-anchor="middle" font-size="11.5" fill="#33455e">∅</text>
  <text x="294" y="225" text-anchor="middle" font-size="10" fill="#a04a48">0 个 ← 被清零</text>
  <text x="434" y="211" text-anchor="middle" font-size="11.5" fill="#33455e">{ime}</text>
  <text x="434" y="225" text-anchor="middle" font-size="10" fill="#666">1 个</text>
  <text x="557" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48">0×1×2 = 0</text>

  <text x="68" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">(d, t)</text>
  <text x="165" y="251" text-anchor="middle" font-size="11.5" fill="#33455e">∅</text>
  <text x="165" y="265" text-anchor="middle" font-size="10" fill="#666">0 个</text>
  <text x="294" y="251" text-anchor="middle" font-size="11.5" fill="#33455e">{onuts}</text>
  <text x="294" y="265" text-anchor="middle" font-size="10" fill="#666">1 个</text>
  <text x="434" y="251" text-anchor="middle" font-size="11.5" fill="#33455e">{ime, offee}</text>
  <text x="434" y="265" text-anchor="middle" font-size="10" fill="#666">2 个</text>
  <text x="557" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">1·2×2 = 4</text>

  <g filter="url(#sk)"><rect x="30" y="274" width="580" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="320" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">合计 ans = 2 + 0 + 4 = 6</text>

  <!-- 6 个有效名字 -->
  <g filter="url(#sk)"><rect x="30" y="318" width="390" height="140" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="225" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">6 个有效公司名（newA newB）</text>
  <text x="60" y="364" font-size="11.5" font-weight="bold" fill="#2e5e2e">doffee conuts</text>
  <text x="60" y="377" font-size="10" fill="#666">← (coffee, donuts)</text>
  <text x="245" y="364" font-size="11.5" font-weight="bold" fill="#2e5e2e">conuts doffee</text>
  <text x="245" y="377" font-size="10" fill="#666">← (donuts, coffee)</text>
  <text x="60" y="398" font-size="11.5" font-weight="bold" fill="#2e5e2e">tonuts dime</text>
  <text x="60" y="411" font-size="10" fill="#666">← (donuts, time)</text>
  <text x="245" y="398" font-size="11.5" font-weight="bold" fill="#2e5e2e">tonuts doffee</text>
  <text x="245" y="411" font-size="10" fill="#666">← (donuts, toffee)</text>
  <text x="60" y="432" font-size="11.5" font-weight="bold" fill="#2e5e2e">dime tonuts</text>
  <text x="60" y="445" font-size="10" fill="#666">← (time, donuts)</text>
  <text x="245" y="432" font-size="11.5" font-weight="bold" fill="#2e5e2e">doffee tonuts</text>
  <text x="245" y="445" font-size="10" fill="#666">← (toffee, donuts)</text>

  <!-- 3 对无效 -->
  <g filter="url(#sk)"><rect x="440" y="318" width="170" height="140" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="525" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04a48">3 对全灭</text>
  <text x="525" y="366" text-anchor="middle" font-size="11" fill="#a04a48">(coffee, time)</text>
  <text x="525" y="384" text-anchor="middle" font-size="11" fill="#a04a48">(coffee, toffee)</text>
  <text x="525" y="402" text-anchor="middle" font-size="11" fill="#a04a48">(time, toffee)</text>
  <text x="525" y="430" text-anchor="middle" font-size="10.5" fill="#a04a48">前两个撞出 toffee；</text>
  <text x="525" y="446" text-anchor="middle" font-size="10.5" fill="#a04a48">后一个同首字母 t</text>

  <text x="320" y="482" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">ans = 2 + 0 + 4 = 6 ✓</text>
</svg>
