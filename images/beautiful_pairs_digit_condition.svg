<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">美丽下标对：i 的首位 与 j 的末位 互质</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array nums = [2,5,1,4] -->
  <g filter="url(#sk)">
    <rect x="150" y="58" width="70" height="40" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
    <rect x="230" y="58" width="70" height="40" rx="6" fill="#dbe9f7" stroke="#4a8edb" stroke-width="2"/>
    <rect x="310" y="58" width="70" height="40" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
    <rect x="390" y="58" width="70" height="40" rx="6" fill="#dff0e2" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="185" y="84" text-anchor="middle" font-size="16" fill="#555555">2</text>
  <text x="265" y="84" text-anchor="middle" font-size="16" fill="#2b6e9e" font-weight="bold">5</text>
  <text x="345" y="84" text-anchor="middle" font-size="16" fill="#555555">1</text>
  <text x="425" y="84" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold">4</text>
  <text x="185" y="117" text-anchor="middle" font-size="11" fill="#999999">下标 0</text>
  <text x="265" y="117" text-anchor="middle" font-size="11" fill="#2b6e9e">i = 1</text>
  <text x="345" y="117" text-anchor="middle" font-size="11" fill="#999999">下标 2</text>
  <text x="425" y="117" text-anchor="middle" font-size="11" fill="#2e6e2e">j = 3</text>

  <!-- arrows down to extraction boxes -->
  <path d="M 265 124 Q 205 150 190 170" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 425 124 Q 478 150 492 170" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- extraction boxes -->
  <g filter="url(#sk)">
    <rect x="70" y="176" width="230" height="66" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="185" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">nums[i] = 5 → 首位 5</text>
  <text x="185" y="226" text-anchor="middle" font-size="11" fill="#2b6e9e">while (x ≥ 10) x /= 10</text>

  <g filter="url(#sk)">
    <rect x="340" y="176" width="230" height="66" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="455" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">nums[j] = 4 → 末位 4</text>
  <text x="455" y="226" text-anchor="middle" font-size="11" fill="#2e6e2e">b = x mod 10</text>

  <!-- arrows to gcd boxes -->
  <path d="M 200 246 Q 250 268 288 288" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 246 Q 390 268 352 288" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- gcd results -->
  <g filter="url(#sk)">
    <rect x="60" y="292" width="270" height="50" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="195" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">gcd(5, 4) = 1 → (1, 3) 是美丽对 ✓</text>
  <text x="195" y="332" text-anchor="middle" font-size="11" fill="#2e6e2e">互质 = 没有大于 1 的公因数</text>

  <g filter="url(#sk)">
    <rect x="350" y="292" width="250" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="475" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">gcd(2, 4) = 2 → (0, 3) 不是 ✗</text>
  <text x="475" y="332" text-anchor="middle" font-size="11" fill="#b85450">2 和 4 有公因数 2</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="354" width="560" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="320" y="377" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">首位、末位都只有 1~9 九种取值（末位非零由约束保证）→ 互质关系只有 9×9</text>
</svg>
