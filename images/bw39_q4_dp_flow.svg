<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">算法流程：dp[mask] = 用「前 i 种数字」能否恰好覆盖顾客集合 mask</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">每来一种新数字（库存 cnt），枚举 mask 的补集转移：can[mask] |= can[mask ^ sub] 且 sum(sub) ≤ cnt</text>

  <!-- stage boxes -->
  <g filter="url(#r)">
    <rect x="60" y="80" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="265" y="80" width="150" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="470" y="80" width="150" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#r)">
    <text x="135" y="108" fill="#33517a">统计频次</text>
    <text x="135" y="130" fill="#33517a">Counter(nums)</text>
    <text x="340" y="108" fill="#3a5c2c">预处理 subSum[mask]</text>
    <text x="340" y="130" fill="#3a5c2c">= mask 的需求和</text>
    <text x="545" y="108" fill="#7a5b1e">逐数字转移</text>
    <text x="545" y="130" fill="#7a5b1e">枚举子集 O(3^m)</text>
  </g>
  <path d="M 214 115 L 261 115" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 419 115 L 466 115" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- transfer detail -->
  <g filter="url(#r)">
    <rect x="60" y="185" width="560" height="150" rx="10" fill="#f6f8f4" stroke="#8aa07c" stroke-width="1.6"/>
  </g>
  <g font-size="13" fill="#444" filter="url(#r)">
    <text x="80" y="215">对每种数字（库存 cnt），倒序枚举 mask：</text>
    <text x="100" y="240">for sub ⊆ mask：若 subSum[sub] ≤ cnt 且 dp[mask ^ sub] 已为 true</text>
    <text x="130" y="265">→ dp[mask] = true（这种数字接下子集 sub，之前的数字负责其余顾客）</text>
    <text x="80" y="295">初始 dp[0] = true；最终答案 = dp[(1&lt;&lt;m)−1]</text>
    <text x="80" y="320">倒序保证每种数字只被用一次（0-1 背包式滚动）</text>
  </g>

  <!-- complexity -->
  <g filter="url(#r)">
    <rect x="60" y="352" width="560" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="375" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#r)">复杂度 O(50 × 3^10) ≈ 3×10^5 次子集枚举，m ≤ 10 是复杂度的命门</text>
</svg>
