<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="580" height="392" fill="#fafafa"/>
<text x="290" y="30" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" filter="url(#roughs)">以 c 为中心：按 c 的邻居切成分支，分支内计数、分支间配对</text>
<ellipse cx="290" cy="92" rx="26" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="290" y="97" text-anchor="middle" font-size="16" fill="#26343f" font-weight="normal" filter="url(#roughs)">c</text>
<ellipse cx="140" cy="176" rx="24" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="140" y="181" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">v₁</text>
<ellipse cx="290" cy="176" rx="24" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="290" y="181" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">v₃</text>
<ellipse cx="440" cy="176" rx="24" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="440" y="181" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">v₂</text>
<path d="M268,110 L156,156" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<path d="M290,116 L290,154" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<path d="M312,110 L424,156" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<ellipse cx="86" cy="254" rx="20" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
<text x="86" y="259" text-anchor="middle" font-size="13" fill="#26343f" font-weight="normal" filter="url(#roughs)">a₁</text>
<ellipse cx="186" cy="254" rx="20" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
<text x="186" y="259" text-anchor="middle" font-size="13" fill="#26343f" font-weight="normal" filter="url(#roughs)">a₂</text>
<ellipse cx="440" cy="254" rx="20" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
<text x="440" y="259" text-anchor="middle" font-size="13" fill="#26343f" font-weight="normal" filter="url(#roughs)">b₁</text>
<path d="M130,194 L96,234" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
<path d="M156,194 L178,234" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
<path d="M440,198 L440,234" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
<rect x="46" y="292" width="150" height="50" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="121" y="313" text-anchor="middle" font-size="13" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">cnt₁ = 2</text>
<text x="121" y="332" text-anchor="middle" font-size="11" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">a₁、a₂ 达标</text>
<rect x="222" y="292" width="136" height="50" rx="9" fill="#f2f2f2" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
<text x="290" y="313" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" filter="url(#roughs)">cnt₃ = 0</text>
<text x="290" y="332" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" filter="url(#roughs)">无达标节点</text>
<rect x="384" y="292" width="150" height="50" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
<text x="459" y="313" text-anchor="middle" font-size="13" fill="#7a2f2c" font-weight="normal" filter="url(#roughs)">cnt₂ = 1</text>
<text x="459" y="332" text-anchor="middle" font-size="11" fill="#7a2f2c" font-weight="normal" filter="url(#roughs)">b₁ 达标</text>
<text x="290" y="372" text-anchor="middle" font-size="13" fill="#446688" font-weight="normal" filter="url(#roughs)">count[c] = Σ_{i&amp;lt;j} cnt_i·cnt_j = 2×1 + 2×0 + 0×1 = 2</text>
</svg>
