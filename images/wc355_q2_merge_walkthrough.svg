<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 555" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="800" height="555" fill="#fdfcf7"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [2, 3, 7, 9, 3] —— cur 一路涨到 21</text>
  <path d="M 150 42 Q 400 50 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- column headers -->
  <text x="75" y="62" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#sk)">步骤</text>
  <text x="100" y="62" font-size="11.5" font-weight="bold" fill="#555" filter="url(#sk)">数组</text>
  <text x="420" y="62" font-size="11.5" font-weight="bold" fill="#555" filter="url(#sk)">比较与动作</text>
  <text x="693" y="62" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#sk)">cur</text>
  <text x="100" y="77" font-size="10" fill="#777" filter="url(#sk)">橙框 = 当前 i ｜ 绿 = 已并入 cur 的块 ｜ 灰 = 被遗弃 ｜ 蓝 = 未扫到</text>

  <!-- index labels -->
  <g font-size="9.5" fill="#999" filter="url(#sk)">
    <text x="118" y="90" text-anchor="middle">0</text>
    <text x="154" y="90" text-anchor="middle">1</text>
    <text x="190" y="90" text-anchor="middle">2</text>
    <text x="226" y="90" text-anchor="middle">3</text>
    <text x="262" y="90" text-anchor="middle">4</text>
  </g>

  <!-- ============ row : init ============ -->
  <text x="75" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">初始</text>
  <g filter="url(#sk)">
    <rect x="100" y="98" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="136" y="98" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="172" y="98" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="208" y="98" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="244" y="98" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="13" filter="url(#sk)">
    <text x="118" y="119" text-anchor="middle" fill="#2b4a6e">2</text>
    <text x="154" y="119" text-anchor="middle" fill="#2b4a6e">3</text>
    <text x="190" y="119" text-anchor="middle" fill="#2b4a6e">7</text>
    <text x="226" y="119" text-anchor="middle" fill="#2b4a6e">9</text>
    <text x="262" y="119" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3</text>
  </g>
  <text x="420" y="111" font-size="11.5" fill="#444" filter="url(#sk)">cur = nums[4] = 3</text>
  <text x="420" y="125" font-size="10.5" fill="#777" filter="url(#sk)">初始块 = {3}（下标 4）</text>
  <g filter="url(#sk)"><rect x="655" y="98" width="76" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="693" y="119" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>

  <!-- ============ row : i=3 reset ============ -->
  <text x="75" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">i=3</text>
  <g filter="url(#sk)">
    <rect x="100" y="158" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="136" y="158" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="172" y="158" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="208" y="158" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="244" y="158" width="36" height="32" rx="4" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <g font-size="13" filter="url(#sk)">
    <text x="118" y="179" text-anchor="middle" fill="#2b4a6e">2</text>
    <text x="154" y="179" text-anchor="middle" fill="#2b4a6e">3</text>
    <text x="190" y="179" text-anchor="middle" fill="#2b4a6e">7</text>
    <text x="226" y="179" text-anchor="middle" fill="#2b2b2b" font-weight="bold">9</text>
    <text x="262" y="179" text-anchor="middle" fill="#999">3</text>
  </g>
  <text x="420" y="171" font-size="11.5" fill="#444" filter="url(#sk)">nums[3] = 9 与 cur = 3 比较</text>
  <text x="420" y="185" font-size="11" font-weight="bold" fill="#8f3a36" filter="url(#sk)">9 &gt; 3：吞不下 → 重置 cur = 9（块 = {9}）</text>
  <g filter="url(#sk)"><rect x="655" y="158" width="76" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="693" y="179" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3a36" filter="url(#sk)">9</text>

  <!-- ============ row : i=2 absorb ============ -->
  <text x="75" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">i=2</text>
  <g filter="url(#sk)">
    <rect x="100" y="218" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="136" y="218" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="172" y="218" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="208" y="218" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="244" y="218" width="36" height="32" rx="4" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <g font-size="13" filter="url(#sk)">
    <text x="118" y="239" text-anchor="middle" fill="#2b4a6e">2</text>
    <text x="154" y="239" text-anchor="middle" fill="#2b4a6e">3</text>
    <text x="190" y="239" text-anchor="middle" fill="#2b2b2b" font-weight="bold">7</text>
    <text x="226" y="239" text-anchor="middle" fill="#2e6e2e" font-weight="bold">9</text>
    <text x="262" y="239" text-anchor="middle" fill="#999">3</text>
  </g>
  <text x="420" y="231" font-size="11.5" fill="#444" filter="url(#sk)">nums[2] = 7 与 cur = 9 比较</text>
  <text x="420" y="245" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">7 ≤ 9：吸收 → cur = 7 + 9 = 16（块 = {7,9}）</text>
  <g filter="url(#sk)"><rect x="655" y="218" width="76" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="693" y="239" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">16</text>

  <!-- ============ row : i=1 absorb ============ -->
  <text x="75" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">i=1</text>
  <g filter="url(#sk)">
    <rect x="100" y="278" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="136" y="278" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="172" y="278" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="208" y="278" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="244" y="278" width="36" height="32" rx="4" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <g font-size="13" filter="url(#sk)">
    <text x="118" y="299" text-anchor="middle" fill="#2b4a6e">2</text>
    <text x="154" y="299" text-anchor="middle" fill="#2b2b2b" font-weight="bold">3</text>
    <text x="190" y="299" text-anchor="middle" fill="#2e6e2e" font-weight="bold">7</text>
    <text x="226" y="299" text-anchor="middle" fill="#2e6e2e" font-weight="bold">9</text>
    <text x="262" y="299" text-anchor="middle" fill="#999">3</text>
  </g>
  <text x="420" y="291" font-size="11.5" fill="#444" filter="url(#sk)">nums[1] = 3 与 cur = 16 比较</text>
  <text x="420" y="305" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3 ≤ 16：吸收 → cur = 19（块 = {3,7,9}）</text>
  <g filter="url(#sk)"><rect x="655" y="278" width="76" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="693" y="299" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">19</text>

  <!-- ============ row : i=0 absorb ============ -->
  <text x="75" y="359" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">i=0</text>
  <g filter="url(#sk)">
    <rect x="100" y="338" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="136" y="338" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="172" y="338" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="208" y="338" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="244" y="338" width="36" height="32" rx="4" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <g font-size="13" filter="url(#sk)">
    <text x="118" y="359" text-anchor="middle" fill="#2b2b2b" font-weight="bold">2</text>
    <text x="154" y="359" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="190" y="359" text-anchor="middle" fill="#2e6e2e" font-weight="bold">7</text>
    <text x="226" y="359" text-anchor="middle" fill="#2e6e2e" font-weight="bold">9</text>
    <text x="262" y="359" text-anchor="middle" fill="#999">3</text>
  </g>
  <text x="420" y="351" font-size="11.5" fill="#444" filter="url(#sk)">nums[0] = 2 与 cur = 19 比较</text>
  <text x="420" y="365" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2 ≤ 19：吸收 → cur = 21（块 = {2,3,7,9}）</text>
  <g filter="url(#sk)"><rect x="655" y="338" width="76" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="693" y="359" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">21</text>

  <!-- ============ row : return ============ -->
  <text x="75" y="419" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回</text>
  <g filter="url(#sk)">
    <rect x="100" y="398" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="136" y="398" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="172" y="398" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="208" y="398" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="244" y="398" width="36" height="32" rx="4" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <g font-size="13" font-weight="bold" filter="url(#sk)">
    <text x="118" y="419" text-anchor="middle" fill="#2e6e2e">2</text>
    <text x="154" y="419" text-anchor="middle" fill="#2e6e2e">3</text>
    <text x="190" y="419" text-anchor="middle" fill="#2e6e2e">7</text>
    <text x="226" y="419" text-anchor="middle" fill="#2e6e2e">9</text>
    <text x="262" y="419" text-anchor="middle" fill="#999">3</text>
  </g>
  <text x="420" y="411" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">cur 全程严格递增：3 → 9 → 16 → 19 → 21</text>
  <text x="420" y="425" font-size="11" fill="#2e6e2e" filter="url(#sk)">最终块 {2,3,7,9} 之和 = 21，与官方输出一致 ✓</text>
  <g filter="url(#sk)"><rect x="649" y="395" width="88" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="693" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">21</text>

  <!-- ============ bottom notes ============ -->
  <g filter="url(#sk)"><rect x="40" y="452" width="380" height="94" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="58" y="474" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 复核：nums = [5, 3, 3]</text>
  <text x="58" y="493" font-size="10.5" fill="#444" filter="url(#sk)">cur = 3 →（3 ≤ 3）cur = 6 →（5 ≤ 6）cur = 11，返回 11 ✓</text>
  <text x="58" y="509" font-size="10.5" fill="#444" filter="url(#sk)">注意条件是 ≤ 而非 &lt; —— 相等也允许合并</text>
  <text x="58" y="525" font-size="10.5" fill="#93762c" filter="url(#sk)">末尾的 3 起步，左边的 3、5 依次被吸收</text>

  <g filter="url(#sk)"><rect x="440" y="452" width="320" height="94" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="458" y="474" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">对比官方解释</text>
  <text x="458" y="493" font-size="10.5" fill="#444" filter="url(#sk)">官方从左往右挑了 3 次操作凑出 21；</text>
  <text x="458" y="509" font-size="10.5" fill="#444" filter="url(#sk)">贪心不挑操作顺序——从右往左一趟，</text>
  <text x="458" y="525" font-size="10.5" fill="#444" filter="url(#sk)">每个元素只判定一次，O(n) 出答案。</text>
</svg>
