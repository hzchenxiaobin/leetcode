<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="372" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">逆序回填：j 一直追在 k 右边，待读的原值不会被踩</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888">下图是 arr = [1,0,2,3,0,4,5,0] 回填到 k = 4、j = 6 的瞬间</text>

  <!-- 指针 -->
  <text x="320" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k = 4（读）</text>
  <path d="M 320 76 L 320 96" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="444" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j = 6（写）</text>
  <path d="M 444 76 L 444 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 格 0..4：待读 -->
  <rect x="44" y="100" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="72" y="128" text-anchor="middle" font-size="16" fill="#33562a" filter="url(#rough2)">1</text>
  <rect x="106" y="100" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="134" y="128" text-anchor="middle" font-size="16" fill="#33562a" filter="url(#rough2)">0</text>
  <rect x="168" y="100" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="128" text-anchor="middle" font-size="16" fill="#33562a" filter="url(#rough2)">2</text>
  <rect x="230" y="100" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="258" y="128" text-anchor="middle" font-size="16" fill="#33562a" filter="url(#rough2)">3</text>
  <rect x="292" y="100" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="128" text-anchor="middle" font-size="16" fill="#33562a" filter="url(#rough2)">0</text>

  <!-- 格 5..6：待覆盖 -->
  <rect x="354" y="100" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="382" y="128" text-anchor="middle" font-size="15" fill="#bfa06a" filter="url(#rough2)">4</text>
  <rect x="416" y="100" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="444" y="128" text-anchor="middle" font-size="15" fill="#bfa06a" filter="url(#rough2)">5</text>

  <!-- 格 7：已写好 -->
  <rect x="478" y="100" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="506" y="128" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">4</text>

  <!-- 区域标注 -->
  <path d="M 44 156 L 348 156" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="196" y="174" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">待读区：原值必须保住</text>
  <path d="M 354 156 L 472 156" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="413" y="174" text-anchor="middle" font-size="9.5" fill="#a07d2a" filter="url(#rough2)">待覆盖</text>
  <path d="M 478 156 L 534 156" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="506" y="174" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">已写好</text>

  <rect x="44" y="190" width="532" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="212" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">记 S(k) = 前 k+1 个元素展开后占的位置数（0 记 2，其余记 1）。</text>
  <text x="60" y="232" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">回填到 k 时恰有 j = S(k) − 1；又 S(k) ≥ k + 1，所以 j ≥ k。</text>
  <text x="60" y="252" font-size="10.5" fill="#555" filter="url(#rough2)">等号只在 arr[0..k] 全非 0 时成立 —— 那是「自己写自己」，不会丢数据。</text>

  <rect x="44" y="280" width="176" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="58" y="302" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 正扫求 i、cnt</text>
  <text x="58" y="322" font-size="9.5" fill="#5b6b83" filter="url(#rough2)">cnt 首次 ≥ n 就停</text>
  <path d="M 224 308 L 238 308" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="280" width="176" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="254" y="302" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">② j = n−1，k = i−1</text>
  <text x="254" y="322" font-size="9.5" fill="#5b6b83" filter="url(#rough2)">cnt &gt; n 时先补写一个 0</text>
  <path d="M 420 308 L 434 308" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="436" y="280" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="302" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">③ 回填到 k &lt; 0</text>
  <text x="450" y="322" font-size="9.5" fill="#5b6b83" filter="url(#rough2)">每步 j、k 一起左移</text>

  <text x="310" y="360" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">两个指针同向（从右到左）同步移动，是「就地」成立的核心原因</text>
</svg>
