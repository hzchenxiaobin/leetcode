<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：3 格判定窗口 + 严格大于</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 判定窗口虚线框 -->
  <g filter="url(#sk)"><rect x="204" y="56" width="232" height="108" rx="10" fill="none" stroke="#4a8edb" stroke-width="1.3" stroke-dasharray="7,5"/></g>
  <text x="120" y="52" font-size="12" font-weight="bold" fill="#2b6e9e">判定窗口（3 格）</text>
  <path d="M 196 50 L 210 56" stroke="#4a8edb" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 峰标记 -->
  <g filter="url(#sk)"><polygon points="320,40 311,55 329,55" fill="#b85450"/></g>
  <text x="338" y="52" font-size="13" font-weight="bold" fill="#b85450">峰 ✓</text>

  <!-- 数组格子 m = [1,2,3,2,1] -->
  <g filter="url(#sk)"><rect x="140" y="68" width="64" height="46" rx="4" fill="#f0efea" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="172" y="98" text-anchor="middle" font-size="15" fill="#888">1</text>

  <g filter="url(#sk)"><rect x="214" y="68" width="64" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="246" y="98" text-anchor="middle" font-size="15" fill="#2b6e9e">2</text>

  <g filter="url(#sk)"><rect x="288" y="68" width="64" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="320" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#a06a10">3</text>

  <g filter="url(#sk)"><rect x="362" y="68" width="64" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="394" y="98" text-anchor="middle" font-size="15" fill="#2b6e9e">2</text>

  <g filter="url(#sk)"><rect x="436" y="68" width="64" height="46" rx="4" fill="#f0efea" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="468" y="98" text-anchor="middle" font-size="15" fill="#888">1</text>

  <!-- 下标注记 -->
  <text x="172" y="128" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="246" y="128" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">i−1</text>
  <text x="320" y="128" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold">i</text>
  <text x="394" y="128" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">i+1</text>
  <text x="468" y="128" text-anchor="middle" font-size="11" fill="#999">n−1</text>

  <text x="172" y="150" text-anchor="middle" font-size="11" fill="#999">首元素 · 不算峰</text>
  <text x="468" y="150" text-anchor="middle" font-size="11" fill="#999">尾元素 · 不算峰</text>

  <!-- 窗口内比较 -->
  <text x="283" y="150" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" font-family="monospace">2 &lt; 3 ✓</text>
  <text x="357" y="150" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" font-family="monospace">3 &gt; 2 ✓</text>

  <!-- 两个要点框 -->
  <g filter="url(#sk)"><rect x="40" y="185" width="280" height="76" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="56" y="209" font-size="13" font-weight="bold" fill="#2b6e9e">① 首尾天然排除</text>
  <text x="56" y="230" font-size="12" fill="#444">首尾只有一侧邻居，题目规定不算峰</text>
  <text x="56" y="250" font-size="12" fill="#444">→ 枚举范围直接收缩成 [1, n−2]</text>

  <g filter="url(#sk)"><rect x="345" y="185" width="255" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="360" y="209" font-size="13" font-weight="bold" fill="#b85450">② 严格大于，等值不算</text>
  <text x="360" y="230" font-size="12" fill="#444">[2,4,4]：中间 4 不严格大于右邻 4</text>
  <text x="360" y="250" font-size="12" fill="#444">→ 两个比较都必须用严格不等号</text>

  <!-- 结论公式框 -->
  <g filter="url(#sk)"><rect x="60" y="290" width="520" height="52" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="320" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans = { i | 1 ≤ i ≤ n−2,  m[i−1] &lt; m[i] &gt; m[i+1] }</text>
  <text x="320" y="332" text-anchor="middle" font-size="11" fill="#555">各下标判定相互独立 → 一趟扫描；相邻两峰至少差 2 → 至多 ⌊(n−1)/2⌋ 个峰</text>
</svg>
