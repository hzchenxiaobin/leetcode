<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    一遍扫描：sum / min / max 同时维护
  </text>

  <!-- 工资数组 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="90" y="76" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="150" y="76" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="210" y="76" width="60" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <rect x="270" y="76" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6"/>
    <rect x="330" y="76" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="120" y="105" text-anchor="middle" fill="#446688">4000</text>
    <text x="180" y="105" text-anchor="middle" fill="#446688">3000</text>
    <text x="240" y="105" text-anchor="middle" fill="#b85450">1000</text>
    <text x="300" y="105" text-anchor="middle" fill="#8a6a1a">2000</text>
    <text x="360" y="105" text-anchor="middle" fill="#446688">5000</text>
  </g>
  <text x="240" y="62" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">salary（元素互不相同）</text>

  <!-- 三个统计量的标签箭头 -->
  <g filter="url(#rough2)">
    <path d="M 240 128 C 220 160, 170 168, 128 182" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>
    <path d="M 300 128 C 330 158, 390 166, 428 182" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>
    <path d="M 270 128 C 268 170, 264 190, 262 208" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="14">
    <rect x="70" y="188" width="116" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="128" y="210" text-anchor="middle" fill="#b85450">mn = 1000</text>
    <rect x="384" y="188" width="116" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="442" y="210" text-anchor="middle" fill="#8a6a1a">mx = 5000</text>
    <rect x="196" y="214" width="132" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="262" y="236" text-anchor="middle" fill="#2f5a24">sum = 15000</text>
  </g>

  <!-- 公式框 -->
  <rect x="86" y="272" width="348" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">
    (sum − mn − mx) / (n − 2)
  </text>
  <text x="260" y="326" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">
    = (15000 − 1000 − 5000) / 3 = 3000
  </text>
</svg>
