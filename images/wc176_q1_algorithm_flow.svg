<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：只在 i−− 与 j++ 之间切换</text>
  <text x="290" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每一步都吃掉一整段格子，两个下标都不回退</text>

  <g filter="url(#rough2)">
    <rect x="180" y="64" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="17"/>
    <text x="290" y="86" text-anchor="middle" font-size="11.5" fill="#2f4a6a">i = m−1, j = 0, ans = 0</text>
  </g>
  <path d="M 290 98 L 290 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="290,122 410,162 290,202 170,162" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="290" y="158" text-anchor="middle" font-size="12" fill="#2f4a6a">i ≥ 0 且 j &lt; n ?</text>
  </g>
  <path d="M 410 162 L 438 162" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="153" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="442" y="144" width="116" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="500" y="167" text-anchor="middle" font-size="11.5" fill="#31592a">返回 ans</text>
  </g>

  <path d="M 290 202 L 290 228" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="220" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <polygon points="290,230 405,270 290,310 175,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="290" y="266" text-anchor="middle" font-size="12" fill="#8a6a20">grid[i][j] &lt; 0 ?</text>
  </g>

  <path d="M 290 310 L 290 332" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="326" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="175" y="334" width="230" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="290" y="352" text-anchor="middle" font-size="11" fill="#8a3a36">ans += n − j（本行后缀全负）</text>
    <text x="290" y="368" text-anchor="middle" font-size="11" fill="#8a3a36">i −= 1（本行结算完毕）</text>
  </g>

  <path d="M 405 270 L 440 270" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="261" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="444" y="252" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="504" y="275" text-anchor="middle" font-size="11.5" fill="#31592a">j += 1</text>
  </g>

  <path d="M 290 376 L 290 406" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 504 288 L 504 406 L 292 406" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 290 406 L 56 406 L 56 162 L 164 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="428" font-size="10" fill="#777" filter="url(#rough2)">回到循环判断</text>
  <text x="470" y="428" font-size="10" fill="#777" filter="url(#rough2)">两条分支汇合后再判一次</text>

  <text x="290" y="454" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">i 每轮减一、j 每轮加一，总步数 ≤ m + n，额外空间 O(1)</text>
</svg>
