<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">算法流程：对每个单词做 O(L) 归一化</text>
  <rect x="70" y="56" width="460" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300.0" y="83.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">计算 pattern 的签名（首次出现编号）</text>
  <path d="M300 102 L300 120" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="70" y="126" width="460" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300.0" y="153.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">枚举 words 中的每个单词 w</text>
  <path d="M300 172 L300 190" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="70" y="196" width="460" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300.0" y="223.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">计算 w 的签名（同为首次出现编号）</text>
  <path d="M300 242 L300 260" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="70" y="266" width="460" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300.0" y="293.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">签名逐位相等 → 收入答案</text>
  <rect x="70" y="330" width="460" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300.0" y="357.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">返回答案列表（顺序任意）</text>
  <text x="300" y="392" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">总时间 O(|words| · L)，空间 O(L)</text>
</svg>
