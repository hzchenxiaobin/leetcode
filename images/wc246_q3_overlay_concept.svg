<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：整岛判定 —— 逐格对照 grid1，一损俱损</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- grid labels -->
  <text x="195" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">grid1（底图）</text>
  <text x="485" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">grid2（待判岛）</text>

  <!-- grid1 : land=#e8f0fa/#4a8edb, water=#f2f2f0/#bbb -->
  <g filter="url(#sk)" font-family="monospace">
    <!-- row 0 -->
    <rect x="110" y="90" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="144" y="90" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="178" y="90" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="212" y="90" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="246" y="90" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <!-- row 1 -->
    <rect x="110" y="124" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="144" y="124" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="178" y="124" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="212" y="124" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="246" y="124" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <!-- row 2 -->
    <rect x="110" y="158" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="144" y="158" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="178" y="158" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="212" y="158" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="246" y="158" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <!-- row 3 -->
    <rect x="110" y="192" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="144" y="192" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="178" y="192" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="212" y="192" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="246" y="192" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <!-- row 4 -->
    <rect x="110" y="226" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="144" y="226" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="178" y="226" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="212" y="226" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="246" y="226" width="34" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <!-- grid1 values -->
  <g font-family="monospace" font-size="10.5" text-anchor="middle">
    <text x="127" y="112" fill="#555">1</text><text x="161" y="112" fill="#555">1</text><text x="195" y="112" fill="#555">1</text><text x="229" y="112" fill="#999">0</text><text x="263" y="112" fill="#999">0</text>
    <text x="127" y="146" fill="#999">0</text><text x="161" y="146" fill="#555">1</text><text x="195" y="146" fill="#555">1</text><text x="229" y="146" fill="#555">1</text><text x="263" y="146" fill="#555">1</text>
    <text x="127" y="180" fill="#999">0</text><text x="161" y="180" fill="#999">0</text><text x="195" y="180" fill="#999">0</text><text x="229" y="180" fill="#999">0</text><text x="263" y="180" fill="#999">0</text>
    <text x="127" y="214" fill="#555">1</text><text x="161" y="214" fill="#999">0</text><text x="195" y="214" fill="#999">0</text><text x="229" y="214" fill="#999">0</text><text x="263" y="214" fill="#999">0</text>
    <text x="127" y="248" fill="#555">1</text><text x="161" y="248" fill="#555">1</text><text x="195" y="248" fill="#999">0</text><text x="229" y="248" fill="#555">1</text><text x="263" y="248" fill="#555">1</text>
  </g>

  <!-- check arrow grid2 -> grid1 -->
  <g filter="url(#sk)">
    <path d="M 396 175 L 290 175" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="340" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">逐格核对</text>
  <text x="343" y="198" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">grid1[i][j] == 1 ?</text>

  <!-- grid2 : sub=#eaf6ee/#4a8e4a, doomed=#fdecea/#b85450, water=#f2f2f0/#bbb -->
  <g filter="url(#sk)">
    <!-- row 0 : island A x3 + water x2 -->
    <rect x="400" y="90" width="34" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="434" y="90" width="34" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="468" y="90" width="34" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="502" y="90" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="536" y="90" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <!-- row 1 : water x2 + island A x3 -->
    <rect x="400" y="124" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="434" y="124" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="468" y="124" width="34" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="502" y="124" width="34" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="536" y="124" width="34" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <!-- row 2 : water + island B(mismatch) + water x3 -->
    <rect x="400" y="158" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="434" y="158" width="34" height="34" fill="#fdecea" stroke="#b85450" stroke-width="2.4"/>
    <rect x="468" y="158" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="502" y="158" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="536" y="158" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <!-- row 3 : island C + water + island D(mismatch + ok) + water -->
    <rect x="400" y="192" width="34" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="434" y="192" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="468" y="192" width="34" height="34" fill="#fdecea" stroke="#b85450" stroke-width="2.4"/>
    <rect x="502" y="192" width="34" height="34" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <rect x="536" y="192" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <!-- row 4 : water + island E + water + island D + water -->
    <rect x="400" y="226" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="434" y="226" width="34" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="468" y="226" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="502" y="226" width="34" height="34" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <rect x="536" y="226" width="34" height="34" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <!-- grid2 island verdicts -->
  <g text-anchor="middle" font-weight="bold">
    <text x="519" y="151" font-size="14" fill="#2e6e2e">✓</text>
    <text x="451" y="180" font-size="15" fill="#b03a3a">×</text>
    <text x="417" y="219" font-size="14" fill="#2e6e2e">✓</text>
    <text x="485" y="219" font-size="15" fill="#b03a3a">×</text>
    <text x="519" y="219" font-size="14" fill="#b03a3a">✗</text>
    <text x="451" y="253" font-size="14" fill="#2e6e2e">✓</text>
  </g>

  <!-- verdict legend -->
  <g filter="url(#sk)">
    <rect x="110" y="285" width="270" height="80" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="400" y="285" width="270" height="80" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="245" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">✓ 全岛每格对上 → 子岛屿</text>
  <text x="245" y="330" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">grid2 岛的每格 (i,j)：grid1[i][j] = 1</text>
  <text x="245" y="350" text-anchor="middle" font-size="10.5" fill="#444">本例 3 座绿岛计入答案</text>
  <text x="535" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">✗ 一格失配 → 整岛作废</text>
  <text x="535" y="330" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">× 格：grid2 = 1 但 grid1 = 0</text>
  <text x="535" y="350" text-anchor="middle" font-size="10.5" fill="#444">作废岛也必须整座沉完（见流程图）</text>

  <!-- lemma strip -->
  <g filter="url(#sk)">
    <rect x="110" y="380" width="560" height="52" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="390" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">无需给 grid1 的岛编号</text>
  <text x="390" y="421" text-anchor="middle" font-size="10.5" fill="#444">grid2 岛四连通 → 相邻覆盖格在 grid1 中也相邻 → 自动同属一座 grid1 岛（引理 1）</text>
</svg>
