<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>

  <rect width="620" height="490" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">算法流程：统计 → 单单词特判 → 整除分配 → 拼接</text>

  <!-- ① 统计 -->
  <g filter="url(#r)">
    <rect x="180" y="50" width="300" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="330" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a66" filter="url(#r)">① 一次遍历 text</text>
  <text x="330" y="92" text-anchor="middle" font-size="11" fill="#555" filter="url(#r)">空格 → spaces++；连续字母段 → 收集为单词</text>

  <g filter="url(#r)">
    <line x1="330" y1="106" x2="330" y2="128" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- ② 判定菱形 -->
  <g filter="url(#r)">
    <polygon points="330,128 452,176 330,224 208,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="330" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#r)">② 单词数 n = 1 ？</text>
  <text x="330" y="190" text-anchor="middle" font-size="10" fill="#8a6a30" filter="url(#r)">（没有间隔）</text>

  <!-- 是：右侧特判分支 -->
  <g filter="url(#r)">
    <line x1="452" y1="176" x2="486" y2="176" stroke="#b85450" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="466" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="490" y="146" width="118" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="549" y="166" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#r)">全部空格追加到</text>
  <text x="549" y="182" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#r)">唯一单词末尾</text>
  <text x="549" y="198" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#r)">（避免除零）</text>

  <!-- 否：向下 -->
  <g filter="url(#r)">
    <line x1="330" y1="224" x2="330" y2="248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="340" y="242" text-anchor="start" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">否</text>

  <!-- ③ 整除分配 -->
  <g filter="url(#r)">
    <rect x="180" y="252" width="300" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="330" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a66" filter="url(#r)">③ 整除分配</text>
  <text x="330" y="294" text-anchor="middle" font-size="11" fill="#555" filter="url(#r)">gap = n−1；per = spaces / gap；extra = spaces % gap</text>

  <g filter="url(#r)">
    <line x1="330" y1="308" x2="330" y2="330" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- ④ 拼接 -->
  <g filter="url(#r)">
    <rect x="180" y="334" width="300" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="330" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">④ 拼接</text>
  <text x="330" y="371" text-anchor="middle" font-size="11" fill="#555" filter="url(#r)">单词之间各插入 per 个空格</text>

  <g filter="url(#r)">
    <line x1="330" y1="378" x2="330" y2="400" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- ⑤ 补余 -->
  <g filter="url(#r)">
    <rect x="180" y="404" width="300" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="330" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">⑤ 末尾补余</text>
  <text x="330" y="441" text-anchor="middle" font-size="11" fill="#555" filter="url(#r)">追加 extra 个空格后返回</text>

  <!-- 右侧答疑框 -->
  <g filter="url(#r)">
    <rect x="486" y="252" width="122" height="132" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="547" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4a66" filter="url(#r)">为什么不怕除零？</text>
  <text x="496" y="296" text-anchor="start" font-size="10" fill="#555" filter="url(#r)">n = 1 已被 ② 特判</text>
  <text x="496" y="312" text-anchor="start" font-size="10" fill="#555" filter="url(#r)">此后 gap = n−1 ≥ 1</text>
  <text x="547" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4a66" filter="url(#r)">间隔会不会是 0？</text>
  <text x="496" y="360" text-anchor="start" font-size="10" fill="#555" filter="url(#r)">题面保证相邻单词</text>
  <text x="496" y="376" text-anchor="start" font-size="10" fill="#555" filter="url(#r)">≥ 1 空格 → per ≥ 1</text>

  <text x="310" y="470" text-anchor="middle" font-size="11" fill="#666" filter="url(#r)">自检：len(结果) == len(text)（长度守恒）；spaces ≥ n−1 → per ≥ 1</text>
</svg>
