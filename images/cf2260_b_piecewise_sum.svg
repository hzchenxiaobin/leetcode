<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：先定「转折点」，再分段求和</text>
  <text x="380" y="52" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">全部计算在一趟线性扫描内完成，无数组、无排序</text>

  <rect x="210" y="64" width="340" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="91" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">读入 x, y, k（多测，共 t 组）</text>
  <path d="M 380 108 L 380 122" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="124" width="340" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="151" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">d = y − x（常数差）</text>
  <path d="M 380 168 L 380 180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="380,184 484,214 380,244 276,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="219" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">d = 0 ?</text>

  <path d="M 486 214 L 540 214" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="506" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="546" y="192" width="180" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="636" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">每月整除，输出 0</text>
  <text x="636" y="229" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">b ≡ 0 (mod a)</text>

  <path d="M 380 246 L 380 262" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="260" font-size="12" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="205" y="266" width="350" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="293" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">m = min(k, max(0, d − x + 1))</text>
  <path d="M 380 310 L 380 324" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="205" y="326" width="350" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="353" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">i = 0..m−1：累加 d mod (x + i)</text>
  <path d="M 380 370 L 380 384" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="205" y="386" width="350" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="413" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">累加 (k − m) × d（后缀整段）</text>
  <path d="M 380 430 L 380 444" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="278" y="446" width="204" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="473" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出 ans</text>

  <text x="575" y="340" font-size="11" fill="#8a6015" filter="url(#rough2)">循环次数 m ≤ d − x + 1 ≤ y</text>
  <text x="575" y="358" font-size="11" fill="#8a6015" filter="url(#rough2)">由 Σy ≤ 10^6 保证总量可控</text>
  <text x="575" y="406" font-size="11" fill="#3c5e2e" filter="url(#rough2)">(k − m) × d 可达 10^18</text>
  <text x="575" y="424" font-size="11" fill="#3c5e2e" filter="url(#rough2)">必须 long long / int64</text>
</svg>
