<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：left = 47，right = 85</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">区间里共 39 个候选，抽 9 个走查；全部位都整除才收录</text>

  <g filter="url(#rough2)">
    <rect x="24" y="72" width="512" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="68" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">x</text>
    <text x="300" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">逐位检查（从末位取起）</text>
    <text x="486" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">结论</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="24" y="102" width="512" height="28" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="68" y="121" fill="#666">47</text>
    <text x="300" y="121" fill="#333">47 % 7 = 5 ≠ 0</text>
    <text x="486" y="121" fill="#b85450">✗ 淘汰</text>

    <rect x="24" y="130" width="512" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="68" y="149" fill="#3a5a30" font-weight="bold">48</text>
    <text x="300" y="149" fill="#3a5a30" font-weight="bold">48 % 8 = 0；48 % 4 = 0</text>
    <text x="486" y="149" fill="#4a7a3a" font-weight="bold">✓ 收录</text>

    <rect x="24" y="158" width="512" height="28" fill="#ffffff" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="68" y="177" fill="#666">49</text>
    <text x="300" y="177" fill="#333">49 % 9 = 4 ≠ 0</text>
    <text x="486" y="177" fill="#b85450">✗ 淘汰</text>

    <rect x="24" y="186" width="512" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="68" y="205" fill="#8a3a36">50</text>
    <text x="300" y="205" fill="#8a3a36">末位 d = 0，含零直接出局</text>
    <text x="486" y="205" fill="#b85450" font-weight="bold">✗ 淘汰</text>

    <rect x="24" y="214" width="512" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="68" y="233" fill="#3a5a30" font-weight="bold">55</text>
    <text x="300" y="233" fill="#3a5a30" font-weight="bold">55 % 5 = 0；55 % 5 = 0</text>
    <text x="486" y="233" fill="#4a7a3a" font-weight="bold">✓ 收录</text>

    <rect x="24" y="242" width="512" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="68" y="261" fill="#3a5a30" font-weight="bold">66</text>
    <text x="300" y="261" fill="#3a5a30" font-weight="bold">66 % 6 = 0；66 % 6 = 0</text>
    <text x="486" y="261" fill="#4a7a3a" font-weight="bold">✓ 收录</text>

    <rect x="24" y="270" width="512" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="68" y="289" fill="#3a5a30" font-weight="bold">77</text>
    <text x="300" y="289" fill="#3a5a30" font-weight="bold">77 % 7 = 0；77 % 7 = 0</text>
    <text x="486" y="289" fill="#4a7a3a" font-weight="bold">✓ 收录</text>

    <rect x="24" y="298" width="512" height="28" fill="#ffffff" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="68" y="317" fill="#666">81</text>
    <text x="300" y="317" fill="#333">81 % 1 = 0；81 % 8 = 1 ≠ 0</text>
    <text x="486" y="317" fill="#b85450">✗ 淘汰</text>

    <rect x="24" y="326" width="512" height="28" fill="#ffffff" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="68" y="345" fill="#666">85</text>
    <text x="300" y="345" fill="#333">85 % 5 = 0；85 % 8 = 5 ≠ 0</text>
    <text x="486" y="345" fill="#b85450">✗ 淘汰</text>
  </g>

  <rect x="24" y="366" width="512" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">答案：[48, 55, 66, 77]（4 个，顺序与枚举顺序一致）</text>

  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 81、85 都是「首位能整除、末位不能整除」：一位不通过就必须整数淘汰</text>
</svg>
