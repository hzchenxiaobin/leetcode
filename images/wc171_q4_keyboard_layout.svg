<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="760" height="420" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">键盘布局：字母坐标 = (行, 列)，距离 = |Δ行| + |Δ列|</text>
  <text x="380" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">A=(0,0)   B=(0,1)   P=(2,3)   Z=(4,1)　—— 前 4 行各 6 个字母，末行只有 Y、Z</text>
  <text x="83" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-weight="normal" filter="url(#rough2)">0</text>
  <text x="129" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-weight="normal" filter="url(#rough2)">1</text>
  <text x="175" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-weight="normal" filter="url(#rough2)">2</text>
  <text x="221" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="267" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-weight="normal" filter="url(#rough2)">4</text>
  <text x="313" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-weight="normal" filter="url(#rough2)">5</text>
  <text x="50" y="117" text-anchor="end" font-size="10" fill="#aaa" font-weight="normal" filter="url(#rough2)">0</text>
  <text x="50" y="157" text-anchor="end" font-size="10" fill="#aaa" font-weight="normal" filter="url(#rough2)">1</text>
  <text x="50" y="197" text-anchor="end" font-size="10" fill="#aaa" font-weight="normal" filter="url(#rough2)">2</text>
  <text x="50" y="237" text-anchor="end" font-size="10" fill="#aaa" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="50" y="277" text-anchor="end" font-size="10" fill="#aaa" font-weight="normal" filter="url(#rough2)">4</text>
  <rect x="60" y="92" width="42" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="81" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">A</text>
  <rect x="106" y="92" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="127" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">B</text>
  <rect x="152" y="92" width="42" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="173" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">C</text>
  <rect x="198" y="92" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="219" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">D</text>
  <rect x="244" y="92" width="42" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">E</text>
  <rect x="290" y="92" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="311" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">F</text>
  <rect x="60" y="132" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="81" y="158" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">G</text>
  <rect x="106" y="132" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="127" y="158" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">H</text>
  <rect x="152" y="132" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="173" y="158" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">I</text>
  <rect x="198" y="132" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="219" y="158" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">J</text>
  <rect x="244" y="132" width="42" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265" y="158" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">K</text>
  <rect x="290" y="132" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="311" y="158" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">L</text>
  <rect x="60" y="172" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="81" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">M</text>
  <rect x="106" y="172" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="127" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">N</text>
  <rect x="152" y="172" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="173" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">O</text>
  <rect x="198" y="172" width="42" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="219" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">P</text>
  <rect x="244" y="172" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">Q</text>
  <rect x="290" y="172" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="311" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">R</text>
  <rect x="60" y="212" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="81" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">S</text>
  <rect x="106" y="212" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="127" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">T</text>
  <rect x="152" y="212" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="173" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">U</text>
  <rect x="198" y="212" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="219" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">V</text>
  <rect x="244" y="212" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">W</text>
  <rect x="290" y="212" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="311" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">X</text>
  <rect x="60" y="252" width="42" height="36" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="81" y="278" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">Y</text>
  <rect x="106" y="252" width="42" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="127" y="278" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">Z</text>
  <rect x="380" y="92" width="340" height="182" rx="8" fill="#f4f7fb" stroke="#8ba3c0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="118" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">两个坐标之间的距离（曼哈顿距离）</text>
  <text x="400" y="144" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">d((r1,c1),(r2,c2)) = |r1−r2| + |c1−c2|</text>
  <text x="400" y="176" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">d(C,A) = |0−0| + |2−0| = 2</text>
  <text x="400" y="198" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">d(K,E) = |1−0| + |4−4| = 1</text>
  <text x="400" y="220" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">d(P,Z) = |2−4| + |3−1| = 4</text>
  <text x="400" y="252" text-anchor="start" font-size="11" fill="#888" font-weight="normal" filter="url(#rough2)">蓝：C→A　橙：K→E　绿：P→Z</text>
  <rect x="60" y="302" width="660" height="90" rx="10" fill="#ffffff" stroke="#b9c9a8" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="330" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">起手零代价：手指 1 落在 word[0]，手指 2 可停在任意字母，甚至留到最后才用</text>
  <text x="80" y="356" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">所以初值取 dp[j] = 0（对全部 26 个 j），而不是只给 word[0] 对应的 j 置 0</text>
  <text x="80" y="380" text-anchor="start" font-size="12" fill="#888" font-weight="normal" filter="url(#rough2)">注意末行只有 Y=(4,0)、Z=(4,1)，坐标公式 row=i//6、col=i%6 依然成立</text>
</svg>
