<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 走查：nums1=[1,2,3,6]，nums2=[2,3,4,5]</text>

  <!-- 第 1 步 -->
  <text x="70" y="64" font-size="13" fill="#666" filter="url(#rough2)">第 1 步：1 &lt; 2 → i 右移</text>
  <g filter="url(#rough2)">
    <rect x="170" y="78" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="218" y="78" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="266" y="78" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="314" y="78" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="194" y="98">1</text><text x="242" y="98">2</text><text x="290" y="98">3</text><text x="338" y="98">6</text>
  </g>
  <text x="70" y="99" font-size="12" fill="#666" filter="url(#rough2)">nums1：</text>
  <g filter="url(#rough2)">
    <rect x="170" y="130" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="218" y="130" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="266" y="130" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="314" y="130" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="194" y="150">2</text><text x="242" y="150">3</text><text x="290" y="150">4</text><text x="338" y="150">5</text>
  </g>
  <text x="70" y="151" font-size="12" fill="#666" filter="url(#rough2)">nums2：</text>
  <path d="M 194 74 L 194 56" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="50" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j 指向 2</text>
  <path d="M 194 172 L 194 182" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="196" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i 指向 1（更小，i++）</text>

  <!-- 第 2 步 -->
  <text x="70" y="232" font-size="13" fill="#666" filter="url(#rough2)">第 2 步：2 == 2 → 相等，返回 2</text>
  <g filter="url(#rough2)">
    <rect x="170" y="246" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="218" y="246" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="266" y="246" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="314" y="246" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="194" y="266">1</text><text x="242" y="266" fill="#2d5a22" font-weight="bold">2</text><text x="290" y="266">3</text><text x="338" y="266">6</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="170" y="298" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="218" y="298" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="266" y="298" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="314" y="298" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="194" y="318" fill="#2d5a22" font-weight="bold">2</text><text x="242" y="318">3</text><text x="290" y="318">4</text><text x="338" y="318">5</text>
  </g>
  <path d="M 242 242 L 242 226" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="248" y="222" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <path d="M 194 340 L 194 352" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="366" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="380" y="280" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">两个绿色格子指到</text>
  <text x="380" y="300" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">同一个值 → 答案 2</text>

  <!-- 小结 -->
  <rect x="40" y="326" width="120" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#2d5a22" text-anchor="middle">
    <text x="100" y="346">每轮至少一个</text>
    <text x="100" y="360">指针前进 O(n+m)</text>
  </g>
</svg>
