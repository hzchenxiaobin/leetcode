<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">区间覆盖 = 跳跃游戏：每段只看最远终点</text>
  <text x="300.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">reach[s] = 所有以 s 起点的片段中的最大终点</text>
  <rect x="30.0" y="150.0" width="46.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="53.0" y="174.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="53.0" y="210.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="80.0" y="150.0" width="46.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="103.0" y="174.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="103.0" y="210.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="130.0" y="150.0" width="46.0" height="40.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="153.0" y="174.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="153.0" y="210.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="180.0" y="150.0" width="46.0" height="40.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="203.0" y="174.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="203.0" y="210.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="230.0" y="150.0" width="46.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="253.0" y="174.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="253.0" y="210.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="280.0" y="150.0" width="46.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="303.0" y="174.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="303.0" y="210.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="330.0" y="150.0" width="46.0" height="40.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="353.0" y="174.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="353.0" y="210.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="380.0" y="150.0" width="46.0" height="40.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="403.0" y="174.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="403.0" y="210.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="430.0" y="150.0" width="46.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="453.0" y="174.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="453.0" y="210.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">8</text>
  <rect x="480.0" y="150.0" width="46.0" height="40.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="503.0" y="174.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="503.0" y="210.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">9</text>
  <rect x="530.0" y="150.0" width="46.0" height="40.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="553.0" y="174.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="553.0" y="210.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">10</text>
  <text x="25.0" y="138.0" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">reach[]（起点 → 最远终点）</text>
  <path d="M 79 146 C 79 108 129 108 129 146" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="104.0" y="104.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">① [0,2]</text>
  <path d="M 129 144 C 200 84 300 84 372 144" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="250.0" y="80.0" font-size="9" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">② 从 1 跳到 9</text>
  <path d="M 379 144 C 400 116 440 116 452 144" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="415.0" y="112.0" font-size="9" fill="#b85450" text-anchor="middle" filter="url(#rough2)">③ 补到 10</text>
  <rect x="30.0" y="244.0" width="250.0" height="44.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155.0" y="269.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">每轮：farthest = max(reach[i])</text>
  <rect x="300.0" y="244.0" width="260.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430.0" y="269.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i == cur 时结算：cur = farthest，ans++</text>
  <text x="25.0" y="316.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">若结算时 farthest &lt;= cur，说明区间断裂，返回 -1。</text>
</svg>
