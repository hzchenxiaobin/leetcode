<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">先用长度剪枝：L = B·y 必须 ≤ N = A·x</text>
  <rect x="50" y="60" width="190" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145.0" y="106.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">N = A × x</text>
  <text x="145.0" y="144" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">a*x 的长度（long long）</text>
  <rect x="280" y="60" width="190" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="375.0" y="106.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">L = B × y</text>
  <text x="375.0" y="144" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b*y 的长度（long long）</text>
  <path d="M145,152 L260,196" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M375,152 L260,196" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="160" y="196" width="200" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="228.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">L > N ? → false</text>
  <path d="M260,252 L260,276" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="276" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="300.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">否则逐起点比较</text>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">x, y 最大 1e9，乘法必须用 long long（N、L 可达 1e11）</text>
</svg>
