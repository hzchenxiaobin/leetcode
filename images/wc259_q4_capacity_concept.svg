<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：n &lt; 8k 把搜索空间关进"小盒子"</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== Section 1: frequency filter ====== -->
  <text x="48" y="64" font-size="12.5" font-weight="bold" fill="#446688">① 容量过滤：频次 &lt; k 的字符根本进不了答案（例：s = "letsleetcode"，k = 2）</text>

  <g filter="url(#sk)">
    <line x1="62" y1="150" x2="520" y2="150" stroke="#555" stroke-width="1.6"/>
    <rect x="72" y="124" width="40" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="136" y="98" width="40" height="52" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="200" y="124" width="40" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="264" y="137" width="40" height="13" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="328" y="137" width="40" height="13" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="392" y="137" width="40" height="13" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="456" y="137" width="40" height="13" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="92" y="141">l</text><text x="156" y="128">e</text><text x="220" y="141">t</text>
    <text x="284" y="148" fill="#b85450">s</text><text x="348" y="148" fill="#b85450">c</text>
    <text x="412" y="148" fill="#b85450">o</text><text x="476" y="148" fill="#b85450">d</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#4a7a3a" font-weight="bold">
    <text x="92" y="118">2</text><text x="156" y="92">4</text><text x="220" y="118">2</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#b85450" font-weight="bold">
    <text x="284" y="130">✗1</text><text x="348" y="130">✗1</text>
    <text x="412" y="130">✗1</text><text x="476" y="130">✗1</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 62 124 L 520 124" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="7,5" fill="none"/>
  </g>
  <text x="524" y="128" font-size="11" font-weight="bold" fill="#b8860b">门槛 k = 2</text>
  <g filter="url(#sk)">
    <rect x="540" y="78" width="118" height="82" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="599" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">候选 = {e, l, t}</text>
  <text x="599" y="116" text-anchor="middle" font-size="10.5" fill="#555">容量 = ⌊freq / k⌋</text>
  <text x="599" y="132" text-anchor="middle" font-size="10.5" fill="#555">e : 2，l : 1，t : 1</text>
  <text x="599" y="150" text-anchor="middle" font-size="10" fill="#888">总容量 4 ≤ ⌊n/k⌋</text>

  <!-- ====== Section 2: two hard bounds ====== -->
  <text x="48" y="192" font-size="12.5" font-weight="bold" fill="#446688">② 两个硬上界（都由 n &lt; min(2001, 8k) 锁死）</text>
  <g filter="url(#sk)">
    <rect x="56" y="204" width="278" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="356" y="204" width="268" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="195" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">答案长度：|seq|·k ≤ n &lt; 8k</text>
  <text x="195" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">⟹ |seq| ≤ 7</text>
  <text x="490" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24">候选字母表：每个频次 ≥ k</text>
  <text x="490" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">⟹ 个数 ≤ ⌊n/k⌋ ≤ 7</text>
  <g filter="url(#sk)">
    <rect x="56" y="258" width="568" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">合法序列总数 ≤ 1+7+42+210+840+2520+5040+5040 = 13700（容量打标签计数，见 §5 证明）</text>

  <!-- ====== Section 3: prefix closure ====== -->
  <text x="48" y="322" font-size="12.5" font-weight="bold" fill="#446688">③ 前缀封闭性：合法 ⇒ 删去末尾字符仍合法</text>
  <g filter="url(#sk)">
    <rect x="80" y="340" width="88" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="210" y="340" width="88" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="340" y="340" width="88" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="470" y="340" width="88" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <path d="M 172 358 L 204 358" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
    <path d="M 302 358 L 334 358" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
    <path d="M 432 358 L 464 358" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="124" y="363">"let"</text><text x="254" y="363">"le"</text>
    <text x="384" y="363">"l"</text><text x="514" y="363">""</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#888">
    <text x="188" y="334">删尾</text><text x="318" y="334">删尾</text><text x="448" y="334">删尾</text>
  </g>
  <text x="124" y="392" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">letlet ⊆ s ✓</text>
  <text x="254" y="392" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">lele ⊆ s ✓</text>
  <text x="384" y="392" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ll ⊆ s ✓</text>
  <text x="514" y="392" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">根</text>

  <g filter="url(#sk)">
    <rect x="56" y="408" width="568" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="340" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">seq'*k 是 seq*k 的子序列（每个副本删末字符）⇒ 传递性 ⇒ 合法性保持</text>
  <text x="340" y="446" text-anchor="middle" font-size="11" fill="#555">合法序列构成一棵以空串为根的树 ⟹ 从 "" 出发按层 BFS，非法前缀整棵子树剪掉</text>
</svg>
