<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="400" fill="#fafafa"/>

  <text x="26" y="34" font-size="18" fill="#333" filter="url(#rough2)">差分模型：a 是「b 的某个排列」的前缀和</text>

  <rect x="24" y="54" width="346" height="128" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="80" font-size="14" fill="#2f4f6f" filter="url(#rough2)">① 差分可任意重排</text>
  <text x="42" y="106" font-size="12.5" fill="#333" filter="url(#rough2)">b 只是被打乱的多重集</text>
  <text x="42" y="132" font-size="12.5" fill="#333" filter="url(#rough2)">排列成 c：c_1 = a_1，c_i = a_i − a_{i−1}</text>
  <text x="42" y="158" font-size="12.5" fill="#333" filter="url(#rough2)">于是 a_i = c_1 + … + c_i（前缀和）</text>

  <rect x="394" y="54" width="362" height="128" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="412" y="80" font-size="14" fill="#3a5f2c" filter="url(#rough2)">② 两个硬约束</text>
  <text x="412" y="106" font-size="12.5" fill="#333" filter="url(#rough2)">每一步都要 a_i ≥ 1（不能掉到 0）</text>
  <text x="412" y="132" font-size="12.5" fill="#333" filter="url(#rough2)">a_n = c_1 + … + c_n = Σb，与排列无关</text>
  <text x="412" y="158" font-size="12.5" fill="#b85450" filter="url(#rough2)">⇒ Σb &lt; 1 时不可能有解</text>

  <text x="64" y="212" font-size="12.5" fill="#666" filter="url(#rough2)">c：b 的一种排列（样例 3）</text>

  <rect x="64" y="222" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="97" y="247" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="144" y="222" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="247" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="224" y="222" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="257" y="247" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="304" y="222" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="337" y="247" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="384" y="222" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="417" y="247" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="464" y="222" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="497" y="247" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">−3</text>

  <path d="M97,264 L97,302" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M177,264 L177,302" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M257,264 L257,302" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M337,264 L337,302" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M417,264 L417,302" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M497,264 L497,302" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="64" y="306" width="66" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="97" y="331" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="144" y="306" width="66" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="177" y="331" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="224" y="306" width="66" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="257" y="331" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="304" y="306" width="66" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="337" y="331" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="384" y="306" width="66" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="417" y="331" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <rect x="464" y="306" width="66" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="497" y="331" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>

  <text x="556" y="230" font-size="12.5" fill="#666" filter="url(#rough2)">逐步累加：</text>
  <text x="556" y="254" font-size="12.5" fill="#666" filter="url(#rough2)">a_i = c_1 + … + c_i</text>
  <text x="556" y="286" font-size="12.5" fill="#666" filter="url(#rough2)">a 可以上下波动，</text>
  <text x="556" y="310" font-size="12.5" fill="#666" filter="url(#rough2)">但每个位置都要 ≥ 1</text>
  <text x="556" y="342" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">末尾 a_n = Σb 钉死</text>

  <text x="64" y="382" font-size="12.5" fill="#b85450" filter="url(#rough2)">关键：排列自由度只体现在 c 的顺序上，a 的末项永远是 Σb。</text>
</svg>
