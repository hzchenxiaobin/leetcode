<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：裂项相消——总分只由首尾决定</text>
  <text x="270" y="46" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">示例 1 的最优路径：(0,1) → (2,1) → (2,2)，总分 9</text>

  <!-- start tag -->
  <text x="228" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">起点</text>

  <!-- grid 4x4, origin (150,84), cell 52x44 -->
  <g filter="url(#rough2)">
    <rect x="150" y="84" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="202" y="84" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="254" y="84" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="306" y="84" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="150" y="128" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="202" y="128" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="254" y="128" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="306" y="128" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="150" y="172" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="202" y="172" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="254" y="172" width="52" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="306" y="172" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="150" y="216" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="202" y="216" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="254" y="216" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="306" y="216" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)">
    <text x="176" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">9</text>
    <text x="228" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">5</text>
    <text x="280" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">7</text>
    <text x="332" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
    <text x="176" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">8</text>
    <text x="228" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">9</text>
    <text x="280" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">6</text>
    <text x="332" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
    <text x="176" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">6</text>
    <text x="228" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040">7</text>
    <text x="280" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">14</text>
    <text x="332" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
    <text x="176" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
    <text x="228" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">5</text>
    <text x="280" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
    <text x="332" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  </g>

  <!-- jump arc 1: (0,1) -> (2,1), down -->
  <path d="M 198 100 Q 130 145 196 188" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="146" y="140" text-anchor="end" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">下跳 +2</text>
  <text x="146" y="156" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">(7 − 5)</text>

  <!-- jump arc 2: (2,1) -> (2,2), right -->
  <path d="M 240 186 Q 254 168 268 186" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="254" y="171" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+7</text>

  <!-- tags below grid -->
  <text x="222" y="278" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">中转（被抵消）</text>
  <text x="285" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">终点</text>

  <!-- total -->
  <text x="254" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">总分 = 14 − 5 = 9</text>

  <!-- right panel: legend + formula -->
  <g filter="url(#rough2)">
    <rect x="384" y="88" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <rect x="384" y="110" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2"/>
    <rect x="384" y="132" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2"/>
  </g>
  <g filter="url(#rough2)">
    <text x="404" y="98" font-size="11.5" fill="#333">起点 5</text>
    <text x="404" y="120" font-size="11.5" fill="#333">中转 7</text>
    <text x="404" y="142" font-size="11.5" fill="#333">终点 14</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="378" y="162" width="160" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="458" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">(7−5) + (14−7)</text>
    <text x="458" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">= 14 − 5 = 9</text>
    <text x="458" y="230" text-anchor="middle" font-size="10" fill="#446688">中间的 7 一加一减</text>
    <text x="458" y="246" text-anchor="middle" font-size="10" fill="#446688">成对抵消！</text>
    <text x="458" y="280" text-anchor="middle" font-size="10.5" fill="#888">绕行、直达、走几步</text>
    <text x="458" y="296" text-anchor="middle" font-size="10.5" fill="#888">总分都 = 终点 − 起点</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="40" y="330" width="460" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">任意路径的总得分 = 终点值 − 起点值（中间项裂项相消）</text>
  <text x="270" y="380" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">问题坍缩：枚举终点 (i,j)，配「左上区域去掉自身的最小值」当起点</text>
</svg>
