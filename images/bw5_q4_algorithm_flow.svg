<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：Kahn 分层 BFS</text>

  <rect x="150" y="52" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 建邻接表 + 统计入度</text>

  <rect x="150" y="116" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 入度为 0 的课全部入队</text>
  <path d="M 280 96 L 280 112" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- while 循环 -->
  <polygon points="280,182 380,222 280,262 180,222" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">队列非空？</text>
  <text x="280" y="236" text-anchor="middle" font-size="12" fill="#7a2e2a" filter="url(#rough2)">（每轮 = 一学期）</text>
  <path d="M 280 160 L 280 178" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="420" y="196" width="120" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="217" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">semesters++，本层</text>
  <text x="480" y="234" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">课程全部出队</text>
  <path d="M 382 222 L 416 222" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="214" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 480 196 C 480 168, 390 152, 322 174" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="166" font-size="12" fill="#7a5c1e" filter="url(#rough2)">后继入度减 1，归零则入队</text>

  <rect x="60" y="196" width="100" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="217" text-anchor="middle" font-size="12" fill="#7a2e2a" filter="url(#rough2)">退出循环</text>
  <text x="110" y="234" text-anchor="middle" font-size="12" fill="#7a2e2a" filter="url(#rough2)">（队空）</text>
  <path d="M 178 222 L 164 222" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="214" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="280,290 360,322 280,354 200,322" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="327" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">taken == n ?</text>
  <path d="M 280 264 L 280 286" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="420" y="302" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="327" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">return 学期数</text>
  <path d="M 362 322 L 416 322" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="60" y="302" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="327" text-anchor="middle" font-size="13" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">return −1（有环）</text>
  <path d="M 198 322 L 184 322" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="314" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
</svg>
