    <rect x="380" y="86" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="80" y="105" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">i</text>
  <text x="140" y="105" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">target[i]</text>
  <text x="220" y="105" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">prev</text>
  <text x="320" y="105" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">失配判定</text>
  <text x="410" y="105" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">ans</text>

