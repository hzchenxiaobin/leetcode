<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="620" height="470" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：target ＝ "10111"</text>
  <path d="M 170 38 Q 310 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="310" y="60" text-anchor="middle" font-size="12" fill="#666">从左到右扫描，prev 为当前实值；失配即发起一次后缀翻转</text>

  <text x="310" y="78" text-anchor="middle" font-size="11" fill="#666">演算表（prev ＝ 处理 i 之前的当前实值）</text>

  <g filter="url(#sk)">
    <rect x="60" y="86" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="100" y="86" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
