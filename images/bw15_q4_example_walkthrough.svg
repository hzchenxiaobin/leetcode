<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例演算：grid = [[1,2,3],[4,5,6],[7,8,9]] → 13</text>

  <!-- 第 0 行 -->
  <text x="60" y="80" font-size="13" fill="#666" filter="url(#rough2)">第 0 行 dp：</text>
  <g text-anchor="middle">
    <rect x="150" y="66" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="178" y="92" font-size="14" fill="#333" filter="url(#rough2)">1</text>
    <rect x="210" y="66" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="238" y="92" font-size="14" fill="#333" filter="url(#rough2)">2</text>
    <rect x="270" y="66" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="298" y="92" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  </g>
  <text x="380" y="92" font-size="13" fill="#888" filter="url(#rough2)">← 直接取 grid 第 0 行</text>

  <!-- 第 1 行 -->
  <text x="60" y="160" font-size="13" fill="#666" filter="url(#rough2)">第 1 行 dp：</text>
  <g text-anchor="middle">
    <rect x="150" y="146" width="56" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="178" y="172" font-size="14" fill="#333" filter="url(#rough2)">6</text>
    <rect x="210" y="146" width="56" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="238" y="172" font-size="14" fill="#333" filter="url(#rough2)">6</text>
    <rect x="270" y="146" width="56" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="298" y="172" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  </g>
  <text x="380" y="162" font-size="12" fill="#4a7a3a" filter="url(#rough2)">min1=1（列0），min2=2</text>
  <text x="380" y="180" font-size="12" fill="#666" filter="url(#rough2)">4+2, 5+1, 6+1</text>
  <text x="178" y="200" font-size="11" fill="#8a6a20" filter="url(#rough2)">j=0 是冠军列，被迫用 min2</text>

  <!-- 第 2 行 -->
  <text x="60" y="240" font-size="13" fill="#666" filter="url(#rough2)">第 2 行 dp：</text>
  <g text-anchor="middle">
    <rect x="150" y="226" width="56" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="178" y="252" font-size="15" fill="#333" filter="url(#rough2)">13</text>
    <rect x="210" y="226" width="56" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="238" y="252" font-size="14" fill="#333" filter="url(#rough2)">14</text>
    <rect x="270" y="226" width="56" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="298" y="252" font-size="14" fill="#333" filter="url(#rough2)">15</text>
  </g>
  <text x="380" y="242" font-size="12" fill="#4a7a3a" filter="url(#rough2)">min1=6（列0），min2=6（列1）</text>
  <text x="380" y="260" font-size="12" fill="#666" filter="url(#rough2)">7+6, 8+6, 9+6</text>
  <text x="238" y="280" font-size="11" fill="#8a6a20" filter="url(#rough2)">并列最小 6 来自不同列，规则照常</text>

  <!-- 答案 -->
  <rect x="150" y="306" width="250" height="56" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="275" y="330" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">答案 = min(13, 14, 15) = 13</text>
  <text x="275" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">路径 [1,5,7]，列序列 0 → 1 → 0</text>

  <rect x="440" y="306" width="190" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="535" y="328" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">每行两趟 O(n)：求 min1/min2</text>
  <text x="535" y="348" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">一趟 + 整行转移一趟 → O(n²)</text>
</svg>
