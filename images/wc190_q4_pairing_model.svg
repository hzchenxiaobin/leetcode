<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold"
        filter="url(#rough2)">配对模型：两个子序列逐位相乘再求和</text>
  <text x="300" y="52" text-anchor="middle" font-size="11.5" fill="#777"
        filter="url(#rough2)">被选中的元素对必须“下标同时严格递增”，其余元素直接丢弃</text>

  <text x="42" y="98" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">nums1</text>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="90" y="78" width="62" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="121" y="104" fill="#2f4058">2</text>
    <rect x="160" y="78" width="62" height="38" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="191" y="104" fill="#999">1</text>
    <rect x="230" y="78" width="62" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="261" y="104" fill="#2f4058">−2</text>
    <rect x="300" y="78" width="62" height="38" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="331" y="104" fill="#999">5</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="121" y="130">a₁</text><text x="191" y="130">a₂</text>
    <text x="261" y="130">a₃</text><text x="331" y="130">a₄</text>
  </g>

  <path d="M 121 138 L 121 190" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 261 138 L 261 190" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="262" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">红线只连“被选中”的元素对</text>

  <text x="42" y="212" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">nums2</text>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="90" y="192" width="62" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="121" y="218" fill="#31512a">3</text>
    <rect x="160" y="192" width="62" height="38" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="191" y="218" fill="#999">0</text>
    <rect x="230" y="192" width="62" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="261" y="218" fill="#31512a">−6</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="121" y="244">b₁</text><text x="191" y="244">b₂</text><text x="261" y="244">b₃</text>
  </g>

  <rect x="380" y="88" width="192" height="150" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="112" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">本例配对</text>
  <text x="396" y="136" font-size="11" fill="#555" filter="url(#rough2)">2 × 3 = 6</text>
  <text x="396" y="158" font-size="11" fill="#555" filter="url(#rough2)">(−2) × (−6) = 12</text>
  <path d="M 396 172 L 556 172" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 3"
        filter="url(#rough2)"/>
  <text x="396" y="196" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">点积 = 6 + 12 = 18</text>
  <text x="396" y="222" font-size="9.5" fill="#999" filter="url(#rough2)">长度相同、顺序不变 ⇒ 合法</text>

  <rect x="60" y="272" width="480" height="120" rx="10" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="296" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">状态定义</text>
  <text x="78" y="320" font-size="11" fill="#444" filter="url(#rough2)">f[i][j]：只用 nums1 的前 i 个数、nums2 的前 j 个数，</text>
  <text x="78" y="340" font-size="11" fill="#444" filter="url(#rough2)">各取一个非空等长子序列时的最大点积。</text>
  <text x="78" y="366" font-size="10.5" fill="#777" filter="url(#rough2)">每一对 (aᵢ, bⱼ) 要么配对，要么至少有一侧被跳过 —— 于是得到三条转移。</text>
  <text x="300" y="410" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">子序列配对 ⇔ 从左到右依次“匹配”若干对，跳过其余元素</text>
</svg>
