<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">候选表：T 严格递增的支配链 + 二分查询</text>

  <!-- 支配弹栈 -->
  <text x="150" y="64" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">插入 i 前：弹掉被支配候选</text>
  <g filter="url(#rough2)">
    <rect x="50" y="80" width="72" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="128" y="80" width="72" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="206" y="80" width="72" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="300" y="80" width="72" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="86" y="101" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">T=10</text>
  <text x="164" y="101" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">T=16</text>
  <text x="242" y="101" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">T=18</text>
  <text x="336" y="101" text-anchor="middle" font-size="11" fill="#2d5a1f" filter="url(#rough2)">新 T=15</text>
  <path d="M 282 60 Q 250 66 230 78" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="64" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">16、18 ≥ 15 → 弹出</text>

  <g filter="url(#rough2)">
    <rect x="50" y="140" width="72" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="128" y="140" width="72" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="206" y="140" width="72" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="86" y="161" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">T=0</text>
  <text x="164" y="161" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">T=10</text>
  <text x="242" y="161" text-anchor="middle" font-size="11" fill="#2d5a1f" filter="url(#rough2)">T=15</text>
  <path d="M 336 116 Q 300 128 250 140" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">插入后：表内 T 仍严格递增（下标也递增 → 新候选支配旧的高门槛者）</text>

  <!-- 二分查询 -->
  <text x="150" y="238" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">查询：pre[i] 落在哪个门槛左侧？</text>
  <line x1="60" y1="282" x2="500" y2="282" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="120" cy="282" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="230" cy="282" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="340" cy="282" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="450" cy="282" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="120" y="270" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">T=0</text>
  <text x="230" y="270" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">T=10</text>
  <text x="340" y="270" text-anchor="middle" font-size="11" fill="#2d5a1f" filter="url(#rough2)">T=15</text>
  <text x="450" y="270" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">T=24</text>
  <path d="M 380 252 L 348 274" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="400" y="248" font-size="12" fill="#2d5a1f" filter="url(#rough2)">pre[i] = 22</text>
  <text x="340" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">↑ 二分命中最大 T[j] ≤ pre[i]（upper_bound − 1）</text>
  <text x="340" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">j 下标最大 → dp 最大 &amp; last 最小，双优对齐</text>

  <!-- 警示 -->
  <rect x="60" y="344" width="440" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠ 查询只二分、绝不弹表：弹掉的候选对未来仍可能最优</text>
  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">（反例 [5,1,1,1,1,1]：查询期弹栈版输出 1，正解 2）</text>
</svg>
