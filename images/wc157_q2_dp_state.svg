<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">dp[x]：以数值 x 结尾的最长定差子序列长度</text>
  <text x="290" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">差值固定为 d ⇒ 前驱只能是 x − d，所以状态按「值」索引，与下标无关</text>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="58" y="72" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="88" y="100" fill="#2c4a6b" font-weight="bold">1</text>
    <rect x="160" y="72" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="190" y="100" fill="#2c4a6b" font-weight="bold">3</text>
    <rect x="262" y="72" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="292" y="100" fill="#2c4a6b" font-weight="bold">5</text>
    <rect x="364" y="72" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="394" y="100" fill="#2c4a6b" font-weight="bold">7</text>
    <rect x="466" y="72" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="496" y="100" fill="#8a3a36" font-weight="bold">9</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#3a5a30">
    <text x="88" y="132">dp = 1</text>
    <text x="190" y="132">dp = 2</text>
    <text x="292" y="132">dp = 3</text>
    <text x="394" y="132">dp = 4</text>
    <text x="496" y="132" fill="#8a3a36">dp = 5</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 120 94 L 156 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)"/>
    <path d="M 222 94 L 258 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)"/>
    <path d="M 324 94 L 360 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)"/>
    <path d="M 426 94 L 462 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#7a6a40">
    <text x="138" y="86">+d</text>
    <text x="240" y="86">+d</text>
    <text x="342" y="86">+d</text>
    <text x="444" y="86">+d</text>
  </g>

  <text x="290" y="158" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">链沿数值轴每步加 d 首尾相扣，长度就是链上节点个数</text>

  <rect x="60" y="176" width="460" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="204" text-anchor="middle" font-size="13.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[a] = dp[a − d] + 1</text>
  <text x="290" y="226" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">查不到 a − d 时视作 0，于是 dp[a] = 1，a 自成一条链</text>

  <rect x="60" y="252" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="274" font-size="10.5" fill="#2c4a6b" filter="url(#rough2)">扫描顺序 = arr 的下标顺序：先查 a − d 的旧答案，再写回 a</text>
  <text x="78" y="294" font-size="9.5" fill="#555" filter="url(#rough2)">dp 值随扫描单调不减，所以同值再次出现时直接覆盖不会丢掉更优解</text>

  <rect x="60" y="318" width="460" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="338" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">值域有界（|a|, |d| ≤ 10^4）时，可用 40001 长的数组加偏移 20000 代替哈希表</text>
  <text x="78" y="356" font-size="9.5" fill="#555" filter="url(#rough2)">哈希表版空间只与不同取值数有关，数组版常数更小但空间随值域固定</text>
</svg>
