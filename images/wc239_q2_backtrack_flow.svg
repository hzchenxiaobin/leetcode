<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="540" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">回溯流程：枚举首段 → 按期望值逐段精确匹配</text>

  <!-- B1 枚举首段终点 -->
  <rect x="120" y="44" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="62" text-anchor="middle" font-size="12" fill="#2b4b6b" filter="url(#rough2)">枚举首段终点 end</text>
  <text x="230" y="78" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0 ≤ end ≤ n−2（至少留 1 个字符）</text>
  <path d="M 230 84 L 230 96" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- B2 首段数值 -->
  <rect x="120" y="98" width="220" height="32" rx="6" fill="#fdfdfd" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="118" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#555" filter="url(#rough2)">first = 10×first + s[end]</text>
  <path d="M 230 130 L 230 142" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- B3 调用 dfs -->
  <rect x="120" y="144" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="165" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#2b4b6b" filter="url(#rough2)">调用 dfs(pos=end+1, expect=first−1)</text>
  <path d="M 230 178 L 230 190" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- D1: pos == n ? -->
  <polygon points="230,190 325,222 230,254 135,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="226" text-anchor="middle" font-size="12" font-family="monospace" fill="#b27a10" filter="url(#rough2)">pos == n ?</text>
  <path d="M 325 222 L 356 222" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="340" y="214" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <rect x="356" y="202" width="144" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return true ✔</text>
  <text x="428" y="236" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">整串恰好匹配完</text>
  <path d="M 230 254 L 230 266" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="241" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- B4 逐位累加 -->
  <rect x="120" y="268" width="220" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="288" text-anchor="middle" font-size="11" font-family="monospace" fill="#2b4b6b" filter="url(#rough2)">逐位累加 val = 10×val + s[end]</text>
  <path d="M 230 300 L 230 312" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- D2: val == expect ? -->
  <polygon points="230,312 325,344 230,376 135,344" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="348" text-anchor="middle" font-size="12" font-family="monospace" fill="#2b4b6b" filter="url(#rough2)">val == expect ?</text>
  <path d="M 325 344 L 356 344" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="340" y="336" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <!-- R1 递归 -->
  <rect x="356" y="314" width="144" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="330" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#2b4b6b" filter="url(#rough2)">递归 dfs(end+1,</text>
  <text x="428" y="345" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#2b4b6b" filter="url(#rough2)">expect−1)</text>
  <text x="428" y="362" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">成功即 true；失败继续延长</text>
  <path d="M 428 314 L 428 290 L 346 290" stroke="#888888" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="388" y="283" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">失败回溯</text>
  <path d="M 230 376 L 230 388" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="241" y="384" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- D3: val > expect ? -->
  <polygon points="230,388 325,420 230,452 135,420" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="424" text-anchor="middle" font-size="12" font-family="monospace" fill="#b27a10" filter="url(#rough2)">val &gt; expect ?</text>
  <path d="M 325 420 L 356 420" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="340" y="412" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <!-- R2 break -->
  <rect x="356" y="398" width="144" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="416" text-anchor="middle" font-size="10.5" fill="#b27a10" filter="url(#rough2)">break：val 只增不减</text>
  <text x="428" y="432" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">本层失败，回溯上一层</text>
  <!-- 否：延长终点回环 -->
  <path d="M 135 420 L 80 420 L 80 284 L 116 284" stroke="#888888" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="124" y="410" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <text x="70" y="262" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">val &lt; expect：延长终点继续累加</text>

  <!-- 底部失败汇总 -->
  <rect x="80" y="466" width="360" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="484" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">dfs 本层所有终点失败 → 返回 false，回溯上一层（或换首段）</text>
  <text x="260" y="502" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">所有首段终点均失败 → return false</text>

  <text x="260" y="528" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">expect = −1（首段为 0）时，任何 val ≥ 0 都大于 expect → 扫第一个字符即剪枝</text>
</svg>
