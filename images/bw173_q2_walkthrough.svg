<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333">演算：nums = [2,2,3,1]，k = 4</text>

  <rect x="40" y="50" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="78" font-size="12" fill="#446688">r = 2</text>
  <text x="120" y="78" font-size="12" fill="#333">窗口 [0,2] = 2,2,3</text>
  <text x="290" y="78" font-size="12" fill="#333">sum = 5 ≥ 4</text>
  <text x="400" y="78" font-size="12" fill="#333">ans = 3</text>

  <rect x="40" y="106" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="134" font-size="12" fill="#d6a040">r = 3</text>
  <text x="120" y="134" font-size="12" fill="#333">加入 1 → 窗口 [0,3]</text>
  <text x="290" y="134" font-size="12" fill="#333">sum = 2+3+1 = 6</text>
  <text x="400" y="134" font-size="12" fill="#333">先不更新</text>

  <rect x="40" y="162" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="190" font-size="12" fill="#b85450">收缩 ×3</text>
  <text x="120" y="190" font-size="12" fill="#333">放弃 2 → sum=4 ≥ 4，l=1</text>
  <text x="330" y="190" font-size="12" fill="#333">放弃 2 → sum=4 ≥ 4，l=2</text>
  <text x="470" y="190" font-size="12" fill="#666">…</text>

  <rect x="40" y="218" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="54" y="246" font-size="12" fill="#4a7a3a">停止收缩</text>
  <text x="120" y="246" font-size="12" fill="#333">放弃 3 后 sum=1 &lt; 4，窗口定格 [2,3] = [3,1]</text>
  <text x="400" y="246" font-size="12" fill="#333">ans = 2</text>

  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#888">每个 r 结束时 [l, r] 是以 r 结尾的最短达标窗口</text>
</svg>
