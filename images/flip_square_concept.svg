<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/></marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">垂直翻转 = 行序倒置：第 i 行 ↔ 第 k−1−i 行</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部列括注（左网格） -->
  <g filter="url(#sk)">
    <path d="M 56 94 L 56 86 L 190 86 L 190 94" fill="none" stroke="#2b6e9e" stroke-width="1.4"/>
  </g>
  <text x="123" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">列 y..y+k−1（k 列）</text>

  <!-- 左侧行括注（左网格） -->
  <g filter="url(#sk)">
    <path d="M 50 138 L 42 138 L 42 252 L 50 252" fill="none" stroke="#2e6e2e" stroke-width="1.4"/>
  </g>
  <text x="36" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" transform="rotate(-90 36 195)">行 x..x+k−1（k 行）</text>

  <!-- 翻转前网格 4x4，单元格 46x38，起点 (56,100) -->
  <g filter="url(#sk)">
    <!-- 区域外：白 -->
    <rect x="56"  y="100" width="46" height="38" fill="#ffffff" stroke="#aaaaaa" rx="3"/>
    <rect x="102" y="100" width="46" height="38" fill="#ffffff" stroke="#aaaaaa" rx="3"/>
    <rect x="148" y="100" width="46" height="38" fill="#ffffff" stroke="#aaaaaa" rx="3"/>
    <rect x="194" y="100" width="46" height="38" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <!-- 区域内（行 1..3 × 列 0..2）：橙 -->
    <rect x="56"  y="138" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="102" y="138" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="148" y="138" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="194" y="138" width="46" height="38" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="56"  y="176" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="102" y="176" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="148" y="176" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="194" y="176" width="46" height="38" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="56"  y="214" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="102" y="214" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="148" y="214" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="194" y="214" width="46" height="38" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#444">
    <text x="79"  y="123">1</text><text x="125" y="123">2</text><text x="171" y="123">3</text><text x="217" y="123">4</text>
    <text x="79"  y="161">5</text><text x="125" y="161">6</text><text x="171" y="161">7</text><text x="217" y="161">8</text>
    <text x="79"  y="199">9</text><text x="125" y="199">10</text><text x="171" y="199">11</text><text x="217" y="199">12</text>
    <text x="79"  y="237">13</text><text x="125" y="237">14</text><text x="171" y="237">15</text><text x="217" y="237">16</text>
  </g>
  <text x="148" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">翻转前</text>

  <!-- 中间翻转箭头 -->
  <g filter="url(#sk)">
    <path d="M 252 176 L 384 176" stroke="#b03a3a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="318" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">垂直翻转</text>
  <text x="318" y="198" text-anchor="middle" font-size="12" fill="#b03a3a">↕ 行序倒置</text>

  <!-- 右网格括注 -->
  <g filter="url(#sk)">
    <path d="M 396 94 L 396 86 L 530 86 L 530 94" fill="none" stroke="#2b6e9e" stroke-width="1.4"/>
  </g>
  <text x="463" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">区域内 3 行倒序排列</text>

  <!-- 翻转后网格 -->
  <g filter="url(#sk)">
    <rect x="396" y="100" width="46" height="38" fill="#ffffff" stroke="#aaaaaa" rx="3"/>
    <rect x="442" y="100" width="46" height="38" fill="#ffffff" stroke="#aaaaaa" rx="3"/>
    <rect x="488" y="100" width="46" height="38" fill="#ffffff" stroke="#aaaaaa" rx="3"/>
    <rect x="534" y="100" width="46" height="38" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="396" y="138" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="442" y="138" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="488" y="138" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="534" y="138" width="46" height="38" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="396" y="176" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="442" y="176" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="488" y="176" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="534" y="176" width="46" height="38" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="396" y="214" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="442" y="214" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="488" y="214" width="46" height="38" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="534" y="214" width="46" height="38" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#444">
    <text x="419" y="123">1</text><text x="465" y="123">2</text><text x="511" y="123">3</text><text x="557" y="123">4</text>
    <text x="419" y="161" fill="#a05a10" font-weight="bold">13</text><text x="465" y="161" fill="#a05a10" font-weight="bold">14</text><text x="511" y="161" fill="#a05a10" font-weight="bold">15</text><text x="557" y="161">8</text>
    <text x="419" y="199">9</text><text x="465" y="199">10</text><text x="511" y="199">11</text><text x="557" y="199">12</text>
    <text x="419" y="237" fill="#a05a10" font-weight="bold">5</text><text x="465" y="237" fill="#a05a10" font-weight="bold">6</text><text x="511" y="237" fill="#a05a10" font-weight="bold">7</text><text x="557" y="237">16</text>
  </g>
  <text x="463" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">翻转后</text>

  <!-- 绿色：区域外说明 -->
  <g filter="url(#sk)">
    <path d="M 534 260 L 534 266 L 580 266 L 580 260" fill="none" stroke="#2e6e2e" stroke-width="1.4"/>
  </g>
  <text x="557" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">区域外：不动</text>

  <!-- 底部说明框 -->
  <g filter="url(#sk)">
    <rect x="70" y="306" width="500" height="60" rx="9" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="320" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">只有 k×k 正方形内的格子参与翻转（橙色 → 加粗）</text>
  <text x="320" y="350" text-anchor="middle" font-size="12" fill="#555">区域内：行序倒置、列内数值不动；区域外（右侧列、上下行）：原样保留（绿色）</text>
</svg>
