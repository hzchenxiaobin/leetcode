<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：双指针一次扫描，触发即冲刷</text>

  <!-- start -->
  <rect x="195" y="44" width="170" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：i = 0，comp = []</text>

  <path d="M 280 78 L 280 94" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer diamond -->
  <polygon points="280,96 375,130 280,164 185,130" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="135" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 375 130 L 423 130" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="399" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="425" y="112" width="115" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="482" y="135" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 comp</text>

  <path d="M 280 164 L 280 190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="182" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- take char -->
  <rect x="190" y="192" width="180" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="215" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c = word[i]，j = i</text>

  <path d="M 280 228 L 280 238" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner diamond -->
  <polygon points="280,240 400,282 280,324 160,282" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j &lt; n</text>
  <text x="280" y="286" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">word[j] == c</text>
  <text x="280" y="304" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j − i &lt; 9 ?</text>

  <!-- yes: eat, loop back -->
  <path d="M 160 282 L 132 282" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="35" y="264" width="95" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="82" y="287" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j += 1</text>

  <path d="M 82 264 C 82 230, 150 238, 214 256" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="232" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">继续吃</text>

  <!-- no: flush -->
  <path d="M 280 324 L 280 350" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="342" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否（触发冲刷）</text>

  <rect x="180" y="352" width="200" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">追加 (j − i) 与 c</text>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i = j（跳到下一段开头）</text>

  <!-- back to outer loop -->
  <path d="M 180 376 C 90 376, 82 170, 176 134" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="256" font-size="10.5" fill="#446688" filter="url(#rough2)">回到</text>
  <text x="96" y="270" font-size="10.5" fill="#446688" filter="url(#rough2)">外层</text>

  <!-- annotation -->
  <rect x="330" y="416" width="215" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="437" y="434" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">三种触发：封顶 9 / 换字符 / 到末尾</text>
  <text x="437" y="451" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">len = j − i ∈ [1, 9] 恒成立</text>
</svg>
