<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="424" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1 演算：n = 7，queries = [0, 3, 5]</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">建表：pos[1] = [0,2,4]　pos[3] = [1,5]　pos[4] = [3]　pos[2] = [6]</text>

  <!-- 查询 0 -->
  <rect x="50" y="60" width="540" height="96" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="66" y="76" width="98" height="28" rx="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="95" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">查询 0（q=0）</text>
  <text x="180" y="88" font-size="12" fill="#333" filter="url(#rough2)">值 1 → v = [0, 2, 4]，m = 3，idx = 0</text>
  <text x="180" y="108" font-size="12" fill="#333" filter="url(#rough2)">prev = v[(0−1+3)%3] = 4（环绕到表尾），next = v[1] = 2</text>
  <text x="180" y="128" font-size="12" fill="#4a7a3a" filter="url(#rough2)">rd(0,4) = min(4,3) = 3　rd(0,2) = min(2,5) = 2</text>
  <rect x="496" y="92" width="78" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="535" y="113" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 查询 1 -->
  <rect x="50" y="168" width="540" height="72" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="66" y="184" width="98" height="28" rx="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="203" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">查询 1（q=3）</text>
  <text x="180" y="196" font-size="12" fill="#333" filter="url(#rough2)">值 4 → v = [3]，m = 1：没有其他同值下标</text>
  <text x="180" y="216" font-size="12" fill="#b85450" filter="url(#rough2)">无需二分，直接判 −1</text>
  <rect x="496" y="188" width="78" height="32" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="535" y="209" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- 查询 2 -->
  <rect x="50" y="252" width="540" height="96" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="66" y="268" width="98" height="28" rx="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="287" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">查询 2（q=5）</text>
  <text x="180" y="280" font-size="12" fill="#333" filter="url(#rough2)">值 3 → v = [1, 5]，m = 2，idx = 1</text>
  <text x="180" y="300" font-size="12" fill="#333" filter="url(#rough2)">prev = v[0] = 1，next = v[(1+1)%2] = 1（m=2，二者同一元素）</text>
  <text x="180" y="320" font-size="12" fill="#4a7a3a" filter="url(#rough2)">rd(5,1) = min(4,3) = 3，即沿环 5 → 6 → 0 → 1 绕行 3 步</text>
  <rect x="496" y="284" width="78" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="535" y="305" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 最终答案 -->
  <rect x="50" y="362" width="540" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="390" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 answer = [2, −1, 3]</text>
</svg>
