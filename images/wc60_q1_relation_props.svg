<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="330" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">相似关系的三条性质：自反 ✓　对称 ✓　传递 ✗</text>
  <text x="300" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">判定只查「直接相似」，不沿 pairs 走连通块</text>

  <g filter="url(#rough2)">
    <rect x="18" y="62" width="176" height="208" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <rect x="212" y="62" width="176" height="208" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <rect x="406" y="62" width="176" height="208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
  </g>

  <text x="106" y="86" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 自身相似</text>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="38" y="124" width="62" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="69" y="143" fill="#333">great</text>
    <text x="106" y="144" font-size="12" fill="#666">=</text>
    <rect x="114" y="124" width="62" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="145" y="143" fill="#333">great</text>
  </g>
  <text x="106" y="184" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">w1 = w2 直接通过</text>
  <text x="106" y="202" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">与 pairs 内容无关</text>
  <text x="106" y="240" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="300" y="86" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 对称</text>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="222" y="126" width="62" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="253" y="145" fill="#333">great</text>
    <rect x="316" y="126" width="62" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="347" y="145" fill="#333">fine</text>
  </g>
  <path d="M 290 134 L 310 134" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 148 L 290 148" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="184" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">一条 [a, b] 给出两个方向</text>
  <text x="300" y="202" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">插入时直接存双向键</text>
  <text x="300" y="240" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="494" y="86" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 不传递</text>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="424" y="102" width="60" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="454" y="119" fill="#333">great</text>
    <rect x="424" y="144" width="60" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="454" y="161" fill="#333">fine</text>
    <rect x="424" y="186" width="60" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="454" y="203" fill="#333">good</text>
  </g>
  <path d="M 454 126 L 454 142" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 454 168 L 454 184" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="137" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">pair</text>
  <text x="492" y="179" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">pair</text>
  <path d="M 490 112 C 542 126 542 186 492 200" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="546" y="160" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="494" y="240" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">不要求闭包</text>

  <text x="300" y="300" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">整句相似 ⟺ 每个位置都相似：逐位独立、无状态 ⇒ 建一次池，逐位 O(1) 查表</text>
</svg>
