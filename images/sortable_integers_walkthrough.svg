<svg xmlns="http://www.w3.org/2000/svg" width="680" height="572" viewBox="0 0 680 572" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="572" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3, 1, 2, 5, 4, 4]，n = 6</text>
  <path d="M 190 38 Q 340 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="58" text-anchor="middle" font-size="12" fill="#444">s = [1, 2, 3, 4, 4, 5]，因数 1、2、3、6 逐一判定：块 ⟷ s 的对应块</text>

  <!-- k=1 -->
  <g filter="url(#sk)">
    <rect x="36" y="74" width="608" height="92" rx="10" fill="#fbfbf8" stroke="#cfcfcf" stroke-width="1.2"/>
  </g>
  <text x="62" y="116" font-size="15" font-weight="bold" fill="#446688">k = 1</text>
  <text x="62" y="136" font-size="9.5" fill="#888">单元素块</text>
  <g filter="url(#sk)">
    <rect x="128" y="98" width="150" height="32" rx="6" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="203" y="118" text-anchor="middle" font-size="12" fill="#b03a3a">[3] ≠ s 块 [1]</text>
  <text x="296" y="118" font-size="10.5" fill="#666">逐块多重集：{3} ≠ {1}，首块即失败</text>
  <g filter="url(#sk)">
    <rect x="492" y="96" width="134" height="44" rx="6" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="559" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">不可排序 ✗</text>
  <text x="559" y="132" text-anchor="middle" font-size="9.5" fill="#a66">等价于数组本身有序</text>

  <!-- k=2 -->
  <g filter="url(#sk)">
    <rect x="36" y="178" width="608" height="92" rx="10" fill="#fbfbf8" stroke="#cfcfcf" stroke-width="1.2"/>
  </g>
  <text x="62" y="220" font-size="15" font-weight="bold" fill="#446688">k = 2</text>
  <text x="62" y="240" font-size="9.5" fill="#888">3 个块</text>
  <g filter="url(#sk)">
    <rect x="128" y="202" width="178" height="32" rx="6" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="217" y="222" text-anchor="middle" font-size="12" fill="#b03a3a">[3, 1] ≠ [1, 2]</text>
  <text x="322" y="222" font-size="10.5" fill="#666">块 0 多重集 {1,3} ≠ {1,2} ✗</text>
  <g filter="url(#sk)">
    <rect x="492" y="200" width="134" height="44" rx="6" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="559" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">不可排序 ✗</text>
  <text x="559" y="236" text-anchor="middle" font-size="9.5" fill="#a66">值没分对块</text>

  <!-- k=3 -->
  <g filter="url(#sk)">
    <rect x="36" y="282" width="608" height="92" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="62" y="324" font-size="15" font-weight="bold" fill="#2e6e2e">k = 3</text>
  <text x="62" y="344" font-size="9.5" fill="#567">2 个块</text>
  <g filter="url(#sk)">
    <rect x="128" y="298" width="166" height="32" rx="6" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="211" y="318" text-anchor="middle" font-size="11.5" fill="#2e6e2e">[3,1,2] ⟲ [1,2,3] ✓</text>
  <g filter="url(#sk)">
    <rect x="306" y="298" width="166" height="32" rx="6" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="389" y="318" text-anchor="middle" font-size="11.5" fill="#2e6e2e">[5,4,4] ⟲ [4,4,5] ✓</text>
  <text x="128" y="356" font-size="10.5" fill="#2e6e2e">两块：多重集相同 ✓，环形下降数各为 1（3&gt;1 与 5&gt;4）✓ → 都能旋转成 s 的块</text>
  <g filter="url(#sk)">
    <rect x="492" y="304" width="134" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="559" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">可排序 ✓</text>
  <text x="559" y="340" text-anchor="middle" font-size="9.5" fill="#567">ans += 3</text>

  <!-- k=6 -->
  <g filter="url(#sk)">
    <rect x="36" y="386" width="608" height="92" rx="10" fill="#fbfbf8" stroke="#cfcfcf" stroke-width="1.2"/>
  </g>
  <text x="62" y="428" font-size="15" font-weight="bold" fill="#446688">k = 6</text>
  <text x="62" y="448" font-size="9.5" fill="#888">整块</text>
  <g filter="url(#sk)">
    <rect x="128" y="402" width="196" height="32" rx="6" fill="#fffdf3" stroke="#7aa87a" stroke-width="1.4"/>
  </g>
  <text x="226" y="422" text-anchor="middle" font-size="11.5" fill="#4a6a4a">多重集 ✓（= 全体元素）</text>
  <text x="340" y="422" font-size="10.5" fill="#b03a3a">但环形下降：3&gt;1、5&gt;4、4&gt;3（首尾）= 3 个 ✗</text>
  <g filter="url(#sk)">
    <rect x="492" y="408" width="134" height="44" rx="6" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="559" y="427" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">不可排序 ✗</text>
  <text x="559" y="444" text-anchor="middle" font-size="9.5" fill="#a66">下降点过多</text>

  <!-- 结论 -->
  <g filter="url(#sk)">
    <rect x="36" y="496" width="608" height="56" rx="8" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="519" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">可排序整数集合 = { 3 }，返回 3</text>
  <text x="340" y="540" text-anchor="middle" font-size="10.5" fill="#667">k = 1、2、6 分别败于：多重集不同 / 多重集不同 / 环形下降过多</text>
</svg>
