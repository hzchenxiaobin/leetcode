<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [51, 71, 17, 24, 42] 单趟扫描</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row bands -->
  <g filter="url(#sk)">
    <rect x="50" y="94" width="540" height="38" fill="#ffffff" stroke="#b9c8d8" stroke-width="1"/>
    <rect x="50" y="132" width="540" height="38" fill="#ffffff" stroke="#b9c8d8" stroke-width="1"/>
    <rect x="50" y="170" width="540" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="50" y="208" width="540" height="38" fill="#ffffff" stroke="#b9c8d8" stroke-width="1"/>
    <rect x="50" y="246" width="540" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>

  <!-- header band -->
  <g filter="url(#sk)">
    <rect x="50" y="62" width="540" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>

  <!-- column separators (full height) -->
  <g filter="url(#sk)">
    <path d="M 115 62 L 115 284" stroke="#8fa5bb" stroke-width="1" fill="none"/>
    <path d="M 200 62 L 200 284" stroke="#8fa5bb" stroke-width="1" fill="none"/>
    <path d="M 300 62 L 300 284" stroke="#8fa5bb" stroke-width="1" fill="none"/>
    <path d="M 440 62 L 440 284" stroke="#8fa5bb" stroke-width="1" fill="none"/>
    <path d="M 530 62 L 530 284" stroke="#8fa5bb" stroke-width="1" fill="none"/>
  </g>

  <!-- header texts -->
  <text x="82" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">x</text>
  <text x="157" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">最大数位 d</text>
  <text x="250" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">旧 best[d]</text>
  <text x="370" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">候选和 x + best[d]</text>
  <text x="485" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">新 best[d]</text>
  <text x="560" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">ans</text>

  <!-- row 1: x=51 -->
  <text x="82" y="118" text-anchor="middle" font-size="12" fill="#333">51</text>
  <text x="157" y="118" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="250" y="118" text-anchor="middle" font-size="11.5" fill="#999">0（桶空）</text>
  <text x="370" y="118" text-anchor="middle" font-size="11.5" fill="#999">—（跳过）</text>
  <text x="485" y="118" text-anchor="middle" font-size="12" fill="#333">51</text>
  <text x="560" y="118" text-anchor="middle" font-size="12" fill="#333">-1</text>

  <!-- row 2: x=71 -->
  <text x="82" y="156" text-anchor="middle" font-size="12" fill="#333">71</text>
  <text x="157" y="156" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="250" y="156" text-anchor="middle" font-size="11.5" fill="#999">0（桶空）</text>
  <text x="370" y="156" text-anchor="middle" font-size="11.5" fill="#999">—（跳过）</text>
  <text x="485" y="156" text-anchor="middle" font-size="12" fill="#333">71</text>
  <text x="560" y="156" text-anchor="middle" font-size="12" fill="#333">-1</text>

  <!-- row 3: x=17 (highlight green) -->
  <text x="82" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">17</text>
  <text x="157" y="194" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="250" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">71</text>
  <text x="370" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">17 + 71 = 88</text>
  <text x="485" y="194" text-anchor="middle" font-size="11.5" fill="#333">71（不变）</text>
  <text x="560" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">88</text>

  <!-- row 4: x=24 -->
  <text x="82" y="232" text-anchor="middle" font-size="12" fill="#333">24</text>
  <text x="157" y="232" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="250" y="232" text-anchor="middle" font-size="11.5" fill="#999">0（桶空）</text>
  <text x="370" y="232" text-anchor="middle" font-size="11.5" fill="#999">—（跳过）</text>
  <text x="485" y="232" text-anchor="middle" font-size="12" fill="#333">24</text>
  <text x="560" y="232" text-anchor="middle" font-size="12" fill="#333">88</text>

  <!-- row 5: x=42 (highlight orange) -->
  <text x="82" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">42</text>
  <text x="157" y="270" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="250" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">24</text>
  <text x="370" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">42 + 24 = 66</text>
  <text x="485" y="270" text-anchor="middle" font-size="12" fill="#333">42</text>
  <text x="560" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">88</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="312" width="560" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#7a5415">同一趟完成「分组 + 取极值」：无需存储整桶、无需排序，空间 O(1)</text>
  <text x="320" y="358" text-anchor="middle" font-size="11.5" fill="#7a5415">桶 4 的候选 66 未能超过 88；best[7] 始终保持 71（17 &lt; 71），最终返回 88</text>
</svg>
