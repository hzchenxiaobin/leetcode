<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：三个例子的窗口与取值</text>
  <rect x="26" y="82" width="168" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="117" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">[9,2,6,1] / "0101"</text>
  <rect x="206" y="82" width="250" height="62" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="331" y="110" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">块 {1}：窗口 [0,1]，11−2=9</text>
  <text x="331" y="123" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">块 {3}：窗口 [2,3]，7−1=6</text>
  <rect x="468" y="82" width="66" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="501" y="118" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">15</text>
  <rect x="26" y="164" width="168" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="199" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">[5,1,4] / "001"</text>
  <rect x="206" y="164" width="250" height="62" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="331" y="192" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">块 {2}：窗口 [1,2]</text>
  <text x="331" y="205" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">5−1=4</text>
  <rect x="468" y="164" width="66" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="501" y="200" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <rect x="26" y="246" width="168" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="281" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">[9,3,5] / "011"</text>
  <rect x="206" y="246" width="250" height="62" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="331" y="274" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">块 {1,2}：窗口 [0,2]</text>
  <text x="331" y="287" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">17−3=14</text>
  <rect x="468" y="246" width="66" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="501" y="282" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">14</text>
  <rect x="26" y="330" width="508" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">答案分别是 15、4、14，与题面一致</text>
  <text x="280.0" y="364" text-anchor="middle" font-size="10" fill="#999">第三例中块从下标 1 开始，窗口含下标 0，故可以丢掉最小的 3</text>
</svg>
