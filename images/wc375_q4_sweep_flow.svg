<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">一次线性扫描：维护 reach = 已见值的最远 last，遇块尾就翻倍</text>
  <path d="M 150 36 Q 470 45 790 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== main flow (center column) ===== -->
  <g filter="url(#sk)"><ellipse cx="490" cy="84" rx="52" ry="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="490" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">开始</text>

  <path d="M 490 106 L 490 124" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="340" y="124" width="300" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="490" y="147" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 预处理（O(n)）</text>
  <text x="490" y="169" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">last[v] ← 值 v 的最右出现下标（哈希表）</text>

  <path d="M 490 182 L 490 200" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="340" y="200" width="300" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="490" y="227" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">② 初始化：reach = 0，ans = 1</text>

  <path d="M 490 244 L 490 262" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop frame -->
  <g filter="url(#sk)"><rect x="330" y="262" width="330" height="302" rx="10" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/></g>
  <text x="490" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888" filter="url(#sk)">对 i = 0, 1, …, n−2 循环</text>

  <g filter="url(#sk)"><rect x="365" y="298" width="250" height="50" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="490" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">reach ← max(reach, last[nums[i]])</text>

  <path d="M 490 348 L 490 366" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="490,366 600,408 490,450 380,408" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="490" y="413" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">i == reach ?</text>

  <path d="M 490 450 L 490 468" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="503" y="464" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>

  <g filter="url(#sk)"><rect x="365" y="468" width="250" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="490" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans ← ans × 2 mod (10⁹+7)</text>
  <text x="490" y="512" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">间隙 i+1 可切：方案翻倍</text>

  <!-- no branch loops back (left) -->
  <path d="M 380 408 C 356 408 356 330 365 326" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="368" y="400" text-anchor="end" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <!-- yes branch loops back (right) -->
  <path d="M 615 497 C 644 497 644 332 615 328" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="652" y="415" text-anchor="middle" font-size="9.5" fill="#888" transform="rotate(-90 652 415)" filter="url(#sk)">i ← i+1，继续</text>

  <!-- exit -->
  <path d="M 490 564 L 490 582" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="500" y="578" font-size="9.5" fill="#888" filter="url(#sk)">i 到 n−1 退出</text>

  <g filter="url(#sk)"><rect x="340" y="582" width="300" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="490" y="605" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">④ 返回 ans</text>
  <text x="490" y="624" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#sk)">ans = 2^c（c 为可切间隙数 = m−1）</text>

  <!-- ===== right column ===== -->
  <g filter="url(#sk)"><rect x="690" y="110" width="230" height="215" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="805" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">为什么 i == reach ⇒ 可切</text>
  <g font-size="10.5" fill="#444" text-anchor="middle">
    <text x="805" y="158" filter="url(#sk)">已见值（first ≤ i）：</text>
    <text x="805" y="176" filter="url(#sk)">last(v) ≤ reach = i</text>
    <text x="805" y="200" filter="url(#sk)">未见值：first(v) &gt; i，</text>
    <text x="805" y="218" filter="url(#sk)">区间不跨越 i+1</text>
    <text x="805" y="242" filter="url(#sk)">⇒ 没有任何值区间</text>
    <text x="805" y="260" filter="url(#sk)">同时包含 i 与 i+1</text>
    <text x="805" y="284" filter="url(#sk)">⇒ 间隙 i+1 是块间间隙</text>
    <text x="805" y="308" filter="url(#sk)">⇒ 可切 ✓，方案 ×2</text>
  </g>

  <g filter="url(#sk)"><rect x="690" y="355" width="230" height="170" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="805" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">复杂度与等价写法</text>
  <g font-size="11" fill="#444" text-anchor="middle">
    <text x="805" y="403" filter="url(#sk)">时间 O(n) · 空间 O(n)</text>
    <text x="805" y="427" font-size="10.5" filter="url(#sk)">等价：数出块数 m，</text>
    <text x="805" y="447" font-weight="bold" fill="#7a5415" filter="url(#sk)">ans = 2^(m−1) mod p</text>
    <text x="805" y="467" font-size="10" fill="#888" filter="url(#sk)">（快速幂 = 本场 Q2 模板）</text>
    <text x="805" y="491" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">翻倍写法连快速幂都省了</text>
  </g>

  <!-- ===== left column ===== -->
  <g filter="url(#sk)"><rect x="60" y="110" width="230" height="135" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="175" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">快照：扫描到 i = 6</text>
  <g font-size="9" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="75" y="142" width="22" height="20" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g><text x="86" y="156" fill="#2b6e9e" filter="url(#sk)">2</text>
    <g filter="url(#sk)"><rect x="100" y="142" width="22" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g><text x="111" y="156" fill="#2e6e2e" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="125" y="142" width="22" height="20" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g><text x="136" y="156" fill="#2b6e9e" filter="url(#sk)">2</text>
    <g filter="url(#sk)"><rect x="150" y="142" width="22" height="20" rx="3" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/></g><text x="161" y="156" fill="#7a5415" filter="url(#sk)">3</text>
    <g filter="url(#sk)"><rect x="175" y="142" width="22" height="20" rx="3" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/></g><text x="186" y="156" fill="#7a5415" filter="url(#sk)">3</text>
    <g filter="url(#sk)"><rect x="200" y="142" width="22" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g><text x="211" y="156" fill="#b85450" filter="url(#sk)">4</text>
    <g filter="url(#sk)"><rect x="225" y="142" width="22" height="20" rx="3" fill="#f0ede4" stroke="#999" stroke-width="1"/></g><text x="236" y="156" fill="#777" filter="url(#sk)">5</text>
    <g filter="url(#sk)"><rect x="250" y="142" width="22" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g><text x="261" y="156" fill="#b85450" filter="url(#sk)">4</text>
  </g>
  <path d="M 200 166 L 200 172 L 270 172 L 270 166" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="235" y="186" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">reach = 7</text>
  <text x="175" y="208" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">i = 6 ≠ 7 → 不能切</text>
  <text x="175" y="228" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">下轮 i = 7 命中块尾 ✓</text>

  <g filter="url(#sk)"><rect x="60" y="285" width="230" height="130" rx="8" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="175" y="309" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#sk)">细节：reach 无需重置</text>
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="175" y="331" filter="url(#sk)">块尾之后，下一位 i+1</text>
    <text x="175" y="349" filter="url(#sk)">的值至少把 reach 拉到</text>
    <text x="175" y="367" filter="url(#sk)">≥ i+1（last ≥ 下标自身）</text>
    <text x="175" y="385" filter="url(#sk)">reach 单调不减，</text>
    <text x="175" y="403" filter="url(#sk)">重置与否结果相同</text>
  </g>

  <g filter="url(#sk)"><rect x="60" y="455" width="230" height="110" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="175" y="479" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">读题提醒</text>
  <g font-size="10" fill="#444" text-anchor="middle">
    <text x="175" y="501" filter="url(#sk)">「不存在两个子数组含</text>
    <text x="175" y="519" filter="url(#sk)">相同数字」= 同值必须同段</text>
    <text x="175" y="537" filter="url(#sk)">不是「每段内互不相同」；</text>
    <text x="175" y="555" filter="url(#sk)">子数组连续且覆盖全数组</text>
  </g>
</svg>
