<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1：相似边连成两个连通块</text>

  <!-- 大分量 -->
  <g filter="url(#rough2)">
    <rect x="34" y="54" width="300" height="196" rx="14" fill="#e8f0fe" fill-opacity="0.55"
          stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4"/>

    <ellipse cx="110" cy="120" rx="46" ry="30" fill="#fff" stroke="#446688" stroke-width="2"/>
    <text x="110" y="126" text-anchor="middle" font-size="13" fill="#2f4a66">tars</text>

    <ellipse cx="250" cy="120" rx="46" ry="30" fill="#fff" stroke="#446688" stroke-width="2"/>
    <text x="250" y="126" text-anchor="middle" font-size="13" fill="#2f4a66">rats</text>

    <ellipse cx="180" cy="210" rx="46" ry="30" fill="#fff" stroke="#446688" stroke-width="2"/>
    <text x="180" y="216" text-anchor="middle" font-size="13" fill="#2f4a66">arts</text>

    <path d="M156,116 L204,116" stroke="#4a7a3a" stroke-width="2"/>
    <text x="180" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">交换 0,2</text>
    <path d="M232,146 L198,184" stroke="#4a7a3a" stroke-width="2"/>
    <text x="230" y="176" font-size="10" fill="#4a7a3a">交换 1,2</text>
    <path d="M96,146 L148,192" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="72" y="182" font-size="10" fill="#b85450">不相似但同组</text>
  </g>

  <!-- 孤立点 -->
  <g filter="url(#rough2)">
    <ellipse cx="420" cy="150" rx="52" ry="32" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="420" y="156" text-anchor="middle" font-size="13" fill="#8a3020">star</text>
    <text x="420" y="206" text-anchor="middle" font-size="11" fill="#8a3020">与其它三词差异 ≥ 3</text>
    <text x="420" y="226" text-anchor="middle" font-size="11" fill="#8a3020">自成一组</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="270" width="380" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="292" text-anchor="middle" font-size="12" fill="#7a5a10">{tars, rats, arts} 与 {star} 共 2 组</text>
    <text x="260" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a">并查集合并 2 条相似边 → groups 从 4 降到 2</text>
  </g>
</svg>
