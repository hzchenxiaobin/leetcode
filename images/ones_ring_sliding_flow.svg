<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="780" height="620" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：长度 t 的环形定长滑动窗口</text>
  <path d="M 220 42 Q 390 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 步骤 1 -->
  <g filter="url(#rough2)">
    <rect x="220" y="58" width="340" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="390" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#33455c" filter="url(#rough2)">统计 t = sum(nums)</text>
  <text x="390" y="99" text-anchor="middle" font-size="11" fill="#556" filter="url(#rough2)">定长窗口的长度由 1 的个数自己决定</text>

  <path d="M 390 110 L 390 128" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <g filter="url(#rough2)">
    <polygon points="390,134 520,182 390,230 260,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="390" y="176" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#rough2)">t == 0 或 t == n ？</text>
  <text x="390" y="194" text-anchor="middle" font-size="10.5" fill="#a67c1e" filter="url(#rough2)">（无 1 / 全 1）</text>

  <path d="M 520 182 L 566 182" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="542" y="174" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="570" y="156" width="170" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="655" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">return 0</text>
  <text x="655" y="197" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">已聚齐，无需交换</text>

  <path d="M 390 230 L 390 250" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="246" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 初始窗口 -->
  <g filter="url(#rough2)">
    <rect x="210" y="254" width="360" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="390" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#33455c" filter="url(#rough2)">初始窗口 s = 0：ones ← nums[0..t−1] 的 1 数</text>
  <text x="390" y="296" text-anchor="middle" font-size="11" fill="#556" filter="url(#rough2)">best ← ones（勿初始化为 0）</text>

  <path d="M 390 306 L 390 324" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <g filter="url(#rough2)">
    <rect x="210" y="328" width="360" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="390" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#33455c" filter="url(#rough2)">滑动起点 s = 1 … n−1</text>

  <path d="M 390 372 L 390 390" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 滑动更新 -->
  <g filter="url(#rough2)">
    <rect x="190" y="394" width="400" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="390" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#33455c" filter="url(#rough2)">进 nums[(s+t−1) mod n] · 出 nums[s−1]</text>
  <text x="390" y="440" text-anchor="middle" font-size="12" fill="#556" filter="url(#rough2)">ones ← ones + 进 − 出</text>
  <text x="390" y="458" text-anchor="middle" font-size="12" fill="#556" filter="url(#rough2)">best ← max(best, ones)</text>

  <!-- 循环回边 -->
  <path d="M 190 430 L 150 430 L 150 350 L 206 350" stroke="#888" stroke-width="1.5" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="396" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">s+1 ↺</text>

  <!-- 环形说明框 -->
  <path d="M 590 430 L 604 430" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="608" y="394" width="152" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="684" y="416" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">取模实现环形</text>
  <text x="684" y="436" text-anchor="middle" font-size="10.5" fill="#8a6a2a" filter="url(#rough2)">下标越过 n−1 自动回绕</text>
  <text x="684" y="454" text-anchor="middle" font-size="10.5" fill="#8a6a2a" filter="url(#rough2)">覆盖跨首尾的窗口</text>

  <path d="M 390 466 L 390 488" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="482" font-size="11" fill="#4a7a3a" filter="url(#rough2)">s 扫完</text>

  <!-- 输出 -->
  <g filter="url(#rough2)">
    <rect x="220" y="492" width="340" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="390" y="514" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">return t − best</text>
  <text x="390" y="533" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">min 窗内 0 数 = t − max 窗内 1 数</text>

  <text x="390" y="582" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">等价写法：把 nums 拼成两倍长，对起点 0..n−1 做线性定长滑窗</text>
</svg>
