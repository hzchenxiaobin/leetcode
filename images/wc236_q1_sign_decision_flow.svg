<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="700" height="520" fill="#fafafa"/>
  <text x="350" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描，两个短路判定</text>
  <path d="M 200 36 Q 350 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="130" y="50" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="220" y="71" text-anchor="middle" font-size="12.5" fill="#33517a" font-weight="bold">开始：neg ← 0</text>

  <path d="M 220 84 L 220 104" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="220,108 300,140 220,172 140,140" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="220" y="145" text-anchor="middle" font-size="12" fill="#2b2b2b">还有元素 x？</text>
  <path d="M 220 172 L 220 207" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="230" y="194" font-size="11" fill="#666">是</text>
  <path d="M 300 140 Q 328 138 356 122" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="312" y="128" font-size="11" fill="#666">否</text>

  <g filter="url(#sk)">
    <polygon points="450,87 540,120 450,153 360,120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="450" y="116" text-anchor="middle" font-size="11.5" fill="#2b2b2b">遍历结束：</text>
  <text x="450" y="132" text-anchor="middle" font-size="11.5" fill="#2b2b2b">neg 是奇数？</text>
  <path d="M 450 153 L 450 174" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="458" y="168" font-size="11" fill="#666">是(奇)</text>
  <path d="M 540 120 L 561 120" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="542" y="110" font-size="11" fill="#666">否(偶)</text>

  <g filter="url(#sk)">
    <rect x="370" y="176" width="160" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="563" y="100" width="132" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="450" y="194" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">奇数个负数</text>
  <text x="450" y="210" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">→ 返回 −1</text>
  <text x="629" y="118" text-anchor="middle" font-size="12" fill="#2e5a24" font-weight="bold">偶数个负数</text>
  <text x="629" y="134" text-anchor="middle" font-size="12" fill="#2e5a24" font-weight="bold">→ 返回 ＋1</text>

  <g filter="url(#sk)">
    <polygon points="220,213 300,245 220,277 140,245" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="220" y="250" text-anchor="middle" font-size="12" fill="#2b2b2b">x ＝ 0 ？</text>
  <path d="M 300 245 L 366 246" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="312" y="236" font-size="11" fill="#666">是</text>
  <path d="M 220 277 L 220 317" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="230" y="300" font-size="11" fill="#666">否</text>

  <g filter="url(#sk)">
    <rect x="370" y="228" width="160" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="450" y="246" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">返回 0</text>
  <text x="450" y="262" text-anchor="middle" font-size="11.5" fill="#8f3830">乘积必为 0，后面不用看</text>

  <g filter="url(#sk)">
    <polygon points="220,323 300,355 220,387 140,355" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="220" y="360" text-anchor="middle" font-size="12" fill="#2b2b2b">x ＜ 0 ？</text>
  <path d="M 220 387 L 220 409" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="230" y="402" font-size="11" fill="#666">是</text>
  <path d="M 140 355 L 60 355" stroke="#8a7a4a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="112" y="347" font-size="11" fill="#666">否</text>

  <g filter="url(#sk)">
    <rect x="130" y="413" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="220" y="434" text-anchor="middle" font-size="12.5" fill="#2e5a24" font-weight="bold">neg ← neg ＋ 1</text>

  <path d="M 130 430 L 60 430" stroke="#8a7a4a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 60 430 L 60 140 L 130 140" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <circle cx="60" cy="355" r="3" fill="#8a7a4a" filter="url(#sk)"/>
  <text x="95" y="132" text-anchor="middle" font-size="10" fill="#999">取下一个</text>

  <g filter="url(#sk)">
    <rect x="130" y="470" width="440" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="350" y="486" text-anchor="middle" font-size="11.5" fill="#8a6415" font-weight="bold">「零短路」：遇 0 立即返回 0，后面元素无需再看</text>
  <text x="350" y="502" text-anchor="middle" font-size="11.5" fill="#8a6415">一趟扫描、O(1) 状态：只有负数改变 neg，正数只是「路过」</text>
</svg>
