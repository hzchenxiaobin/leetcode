<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：删除一个元素，右侧角色全体翻转</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">交替和只看子数组内的相对位置：删点左侧角色不变，右侧 +/− 互换</text>

  <!-- 删除前 -->
  <text x="36" y="82" font-size="13" fill="#446688" filter="url(#rough2)">删除前</text>
  <rect x="120" y="60" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="60" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="232" y="60" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="288" y="60" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="344" y="60" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="204" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <text x="260" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="316" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <text x="372" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="36" y="112" font-size="12" fill="#666" filter="url(#rough2)">角色</text>
  <text x="148" y="112" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="204" y="112" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="260" y="112" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="316" y="112" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="372" y="112" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">+</text>

  <!-- 删除标记 -->
  <rect x="176" y="60" width="56" height="36" rx="4" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 182,66 L 226,90" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 226,66 L 182,90" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="204" y="126" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">删 a₁ = −1（夹在子数组中间）</text>

  <!-- 删除后 -->
  <text x="36" y="192" font-size="13" fill="#446688" filter="url(#rough2)">删除后</text>
  <rect x="120" y="170" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="170" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="232" y="170" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="288" y="170" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="148" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="204" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <text x="316" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="36" y="222" font-size="12" fill="#666" filter="url(#rough2)">角色</text>
  <text x="148" y="222" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="204" y="222" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="260" y="222" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="316" y="222" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">−</text>

  <!-- 翻转注解 -->
  <text x="376" y="182" font-size="12" fill="#d6a040" filter="url(#rough2)">4：+ → −</text>
  <text x="376" y="200" font-size="12" fill="#d6a040" filter="url(#rough2)">−1：− → +</text>
  <text x="376" y="218" font-size="12" fill="#d6a040" filter="url(#rough2)">5：+ → −</text>
  <text x="376" y="240" font-size="12" fill="#8a6d1f" filter="url(#rough2)">右侧全部翻转</text>

  <!-- 拼接处强调 -->
  <ellipse cx="176" cy="188" rx="9" ry="26" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">拼接处：3 与 4 在新数组中相邻，角色 + 接 −，仍然交替延续</text>

  <!-- 结论框 -->
  <rect x="60" y="276" width="440" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">DP 视角 =「跳一步转移」：删点恰为 i−1 时，</text>
  <text x="280" y="324" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i 直接接在以 i−2 结尾的段后面（角色相邻）</text>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g₀[i] = f₁[i−2] + aᵢ ， g₁[i] = f₀[i−2] − aᵢ</text>
</svg>
