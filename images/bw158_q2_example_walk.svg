<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="330" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">示例 1 用 2 笔，示例 2 用 3 笔</text>
  <rect x="40" y="66" width="170" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="125.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例</text>
  <rect x="210" y="66" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">交易 1</text>
  <rect x="310" y="66" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">交易 2</text>
  <rect x="410" y="66" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="455.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">交易 3</text>
  <rect x="500" y="66" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="530.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">合计</text>
  <rect x="40" y="98" width="170" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="125.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1: [1,7,9,8,2], k=2</text>
  <rect x="210" y="98" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[0,2] 9-1=8</text>
  <rect x="310" y="98" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[3,4] 8-2=6</text>
  <rect x="410" y="98" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">-</text>
  <rect x="500" y="98" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">14</text>
  <rect x="40" y="130" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="125.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2: [12,16,19,...], k=3</text>
  <rect x="210" y="130" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[0,2] 19-12=7</text>
  <rect x="310" y="130" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[3,4] 19-8=11</text>
  <rect x="410" y="130" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[5,6] 19-1=18</text>
  <rect x="500" y="130" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">36</text>
  <rect x="40" y="190" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="212.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">示例 1 的最优解只用了 2 笔，没有把 k 用满：说明「至多 k 笔」不是「恰好 k 笔」</text>
  <text x="300.0" y="232.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">dp 的 max(dp_j[i-1], cand) 正好实现了「可以少用一笔」</text>
  <text x="40" y="290" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">若强制恰好 k 笔，示例 1 反而无法达到 14</text>
</svg>
