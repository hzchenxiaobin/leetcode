<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：排序后连续三个一组，只查首尾差</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="40" y="62" width="185" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="132" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 任意两差 ≤ k</text>
  <text x="132" y="103" text-anchor="middle" font-size="12" fill="#2b6e9e">⟺ 极差 ≤ k，比一次</text>

  <g filter="url(#sk)"><rect x="240" y="62" width="185" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="332" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 答案任意一个</text>
  <text x="332" y="103" text-anchor="middle" font-size="12" fill="#2b6e9e">构造与判定可以合一</text>

  <g filter="url(#sk)"><rect x="440" y="62" width="165" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="522" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">③ n 是 3 的倍数</text>
  <text x="522" y="103" text-anchor="middle" font-size="12" fill="#2b6e9e">步长 3 切，永不越界</text>

  <path d="M 132 116 L 132 148" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 332 116 L 332 148" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 522 116 L 522 148" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="75" y="152" width="490" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="320" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">排序 → 每 3 个连续绑一组 → 查 a[i+2] − a[i] ≤ k</text>
  <text x="320" y="198" text-anchor="middle" font-size="12" fill="#444">排序后组内最小、最大恰是首尾两个格子，一次比较收工</text>

  <path d="M 320 210 L 320 238" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="75" y="242" width="490" height="56" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">一票否决：任一组首尾差 &gt; k ⟹ 无解，返回 []</text>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="#444">这不是启发式猜测，而是定理 —— 见「正确性证明」计数论证</text>

  <g filter="url(#sk)"><rect x="40" y="314" width="565" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="322" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">顺序三分组要么直接是答案，要么证明答案不存在 —— O(n log n) 收工</text>
</svg>
