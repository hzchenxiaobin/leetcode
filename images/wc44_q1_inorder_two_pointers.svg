<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">BST 中序有序 ⇒ 双指针夹逼</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">中序序列严格递增，问题变成「有序数组中找和为 k 的两数」</text>

  <g filter="url(#rough2)">
    <rect x="109" y="82" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="135" y="108" text-anchor="middle" font-size="13" fill="#3a4a66">2</text>
    <rect x="167" y="82" width="52" height="40" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <text x="193" y="108" text-anchor="middle" font-size="13" fill="#555">3</text>
    <rect x="225" y="82" width="52" height="40" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <text x="251" y="108" text-anchor="middle" font-size="13" fill="#555">4</text>
    <rect x="283" y="82" width="52" height="40" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <text x="309" y="108" text-anchor="middle" font-size="13" fill="#555">5</text>
    <rect x="341" y="82" width="52" height="40" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <text x="367" y="108" text-anchor="middle" font-size="13" fill="#555">6</text>
    <rect x="399" y="82" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="425" y="108" text-anchor="middle" font-size="13" fill="#3a4a66">7</text>
  </g>

  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 135 132 L 135 158" marker-end="url(#arr)"/>
    <path d="M 425 132 L 425 158" marker-end="url(#arr)"/>
  </g>
  <text x="135" y="176" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">L</text>
  <text x="425" y="176" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">R</text>

  <rect x="55" y="196" width="450" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="220" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">a[L] + a[R] == k　→　找到，返回 true</text>
  <text x="72" y="244" font-size="10.5" fill="#555" filter="url(#rough2)">a[L] + a[R] &lt;  k　→　L++（和偏小，只能换更大的左端）</text>
  <text x="72" y="268" font-size="10.5" fill="#555" filter="url(#rough2)">a[L] + a[R] &gt;  k　→　R−−（和偏大，只能换更小的右端）</text>
  <text x="72" y="292" font-size="10.5" fill="#b85450" filter="url(#rough2)">L ≥ R　→　两端相遇，无解，返回 false</text>

  <rect x="55" y="318" width="450" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="340" font-size="10" fill="#3a5a30" filter="url(#rough2)">k = 9：2 + 7 = 9 → 一步命中，返回 true</text>
  <text x="72" y="362" font-size="10" fill="#555" filter="url(#rough2)">k = 28：2+7=9 &lt; 28 → L 一路右移，与 R 相遇仍未命中 → false</text>
</svg>
