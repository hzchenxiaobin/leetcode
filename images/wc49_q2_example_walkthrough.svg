<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：dictionary = [“hello”, “leetcode”]</text>
  <path d="M 128 42 Q 320 52 512 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="20" y="70" width="600" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="11.5" font-weight="bold" fill="#8a6a30" filter="url(#rough2)">
    <text x="76" y="95" text-anchor="middle">查询词</text>
    <text x="162" y="95" text-anchor="middle">长度</text>
    <text x="310" y="95" text-anchor="middle">Trie 上实际走的路径</text>
    <text x="476" y="95" text-anchor="middle">改道点</text>
    <text x="572" y="95" text-anchor="middle">结果</text>
  </g>

  <!-- row separators -->
  <g filter="url(#rough2)">
    <rect x="20" y="110" width="600" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="20" y="158" width="600" height="48" rx="6" fill="#f2f6fc" stroke="#9ab0c8" stroke-width="1.2"/>
    <rect x="20" y="206" width="600" height="48" rx="6" fill="#f2f6fc" stroke="#9ab0c8" stroke-width="1.2"/>
    <rect x="20" y="254" width="600" height="48" rx="6" fill="#f2f6fc" stroke="#9ab0c8" stroke-width="1.2"/>
    <path d="M 132 70 L 132 302" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 192 70 L 192 302" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 428 70 L 428 302" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 524 70 L 524 302" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- row 1 -->
  <text x="76" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">hhllo</text>
  <text x="162" y="139" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="200" y="139" font-size="10.5" fill="#333" filter="url(#rough2)"><tspan>h → </tspan><tspan fill="#b85450" font-weight="bold">e</tspan><tspan> → l → l → o</tspan></text>
  <text x="476" y="139" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">pos 1：h → e</text>
  <text x="572" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">true</text>

  <!-- row 2 -->
  <text x="76" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">hello</text>
  <text x="162" y="187" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="200" y="187" font-size="10.5" fill="#333" filter="url(#rough2)">h → e → l → l → o（到词尾）</text>
  <text x="476" y="187" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">没有改道</text>
  <text x="572" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">false</text>

  <!-- row 3 -->
  <text x="76" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">hell</text>
  <text x="162" y="235" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4 ✗</text>
  <text x="200" y="235" font-size="10.5" fill="#333" filter="url(#rough2)">h → e → l → l（停在非词尾）</text>
  <text x="476" y="235" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="572" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">false</text>

  <!-- row 4 -->
  <text x="76" y="283" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">leetcoded</text>
  <text x="162" y="283" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">9 ✗</text>
  <text x="200" y="283" font-size="10.5" fill="#333" filter="url(#rough2)">l→e→e→t→c→o→d→e 后无孩子</text>
  <text x="476" y="283" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="572" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">false</text>

  <!-- notes -->
  <rect x="24" y="320" width="592" height="112" rx="10" fill="#f4f0fa" stroke="#7a5aa0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="344" text-anchor="middle" font-size="11" fill="#4a4a4a" filter="url(#rough2)">① hell（4）与 leetcoded（9）长度都与字典词不同 → 长度这一条就否掉</text>
  <text x="320" y="368" text-anchor="middle" font-size="11" fill="#4a4a4a" filter="url(#rough2)">② hello 一路走到词尾，但 changed 仍为 false：一个字母都没换，不算</text>
  <text x="320" y="392" text-anchor="middle" font-size="11" fill="#4a4a4a" filter="url(#rough2)">③ 只有 hhllo 在 pos=1 改道一次并恰好走完 → 唯一返回 true</text>
  <text x="320" y="416" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">红色即改道点；改道之后仍须与查询词逐位对齐，对不齐就回溯</text>
</svg>
