<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：建树 + 在线查询</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">单次查询 O(M)，M = 最长单词</text>
  <rect x="120.0" y="62.0" width="320.0" height="46.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="81.5" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">构造：每个 word 反转后插入 Trie</text>
  <text x="280.0" y="95.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">记录 M = max |word|</text>
  <path d="M 280.0 108.0 L 280.0 126.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="126.0" width="320.0" height="44.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="151.4" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">query(c)：buf 队首插入 c，超过 M 则队尾弹出</text>
  <path d="M 280.0 170.0 L 280.0 188.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="188.0" width="320.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="213.4" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cur = root；按 buf 从新到旧逐字符下走</text>
  <path d="M 280.0 232.0 L 280.0 250.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="250.0" width="320.0" height="44.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="275.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">无孩子 → false；走到词尾 → true</text>
  <text x="25.0" y="330.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每步都要检查词尾（单词可能互为前缀）。</text>
</svg>
