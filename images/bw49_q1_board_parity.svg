  <rect x="404" y="200" width="146" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="477" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">h3 → 8+3=11 奇 → 白 (true)</text>
  <rect x="404" y="240" width="146" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="477" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c7 → 3+7=10 偶 → 黑 (false)</text>
