<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 的树：三条旅行路径唯一，叠加出频次</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 树的边 -->
  <g filter="url(#sk)">
    <path d="M 95 135 L 190 210" stroke="#999" stroke-width="2" fill="none"/>
    <path d="M 190 210 L 285 120" stroke="#999" stroke-width="2" fill="none"/>
    <path d="M 190 210 L 285 300" stroke="#999" stroke-width="2" fill="none"/>
  </g>

  <!-- 旅行① 0→1→3（蓝） -->
  <g filter="url(#sk)">
    <path d="M 109 159 L 163 202" stroke="#4a8edb" stroke-width="2.4" fill="none" marker-end="url(#arb)"/>
    <path d="M 202 235 L 259 289" stroke="#4a8edb" stroke-width="2.4" fill="none" marker-end="url(#arb)"/>
  </g>
  <!-- 旅行② 2→1（绿） -->
  <g filter="url(#sk)">
    <path d="M 273 145 L 216 199" stroke="#4a8e4a" stroke-width="2.4" fill="none" marker-end="url(#arg)"/>
  </g>
  <!-- 旅行③ 2→1→3（橙） -->
  <g filter="url(#sk)">
    <path d="M 259 131 L 202 185" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#aro)"/>
    <path d="M 216 221 L 273 275" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#aro)"/>
  </g>

  <!-- 节点 -->
  <g filter="url(#sk)"><circle cx="95" cy="135" r="22" fill="#ffffff" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="95" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">0</text>
  <text x="68" y="140" text-anchor="end" font-size="11" fill="#666">价 2</text>

  <g filter="url(#sk)"><circle cx="190" cy="210" r="22" fill="#ffffff" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="190" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="190" y="252" text-anchor="middle" font-size="11" fill="#666">价 2</text>

  <g filter="url(#sk)"><circle cx="285" cy="120" r="22" fill="#ffffff" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="285" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="285" y="86" text-anchor="middle" font-size="11" fill="#666">价 10</text>

  <g filter="url(#sk)"><circle cx="285" cy="300" r="22" fill="#ffffff" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="285" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>
  <text x="285" y="342" text-anchor="middle" font-size="11" fill="#666">价 6</text>

  <!-- 左下注释 -->
  <g filter="url(#sk)"><rect x="50" y="350" width="255" height="44" rx="8" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="66" y="369" font-size="10.5" fill="#666">彩色箭头 = 对应旅行的行进方向；</text>
  <text x="66" y="387" font-size="10.5" fill="#666">一条边可被多条旅行共用</text>

  <!-- 右侧：旅行列表 -->
  <text x="478" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">三条旅行（路径唯一）</text>
  <g filter="url(#sk)"><rect x="350" y="88" width="265" height="34" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="365" y="110" font-size="12" font-weight="bold" fill="#2b6e9e">① [0,3]：路径 0 → 1 → 3</text>
  <g filter="url(#sk)"><rect x="350" y="130" width="265" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="365" y="152" font-size="12" font-weight="bold" fill="#2e6e2e">② [2,1]：路径 2 → 1</text>
  <g filter="url(#sk)"><rect x="350" y="172" width="265" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="365" y="194" font-size="12" font-weight="bold" fill="#7a5415">③ [2,3]：路径 2 → 1 → 3</text>

  <!-- 频次 -->
  <g filter="url(#sk)"><rect x="350" y="226" width="265" height="64" rx="8" fill="#f0ede4" stroke="#999" stroke-width="1.4"/></g>
  <text x="365" y="248" font-size="11" fill="#555">频次 freq[v]：v 被路径经过的次数</text>
  <text x="365" y="274" font-size="13" font-weight="bold" fill="#2e6e2e">freq = [1, 3, 2, 2]</text>

  <!-- 总价 -->
  <g filter="url(#sk)"><rect x="350" y="302" width="265" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="365" y="324" font-size="11" fill="#7a3a44">未减半总价 total = Σ price·freq</text>
  <text x="365" y="350" font-size="13" font-weight="bold" fill="#b03a3a">2 + 6 + 20 + 12 = 40</text>
</svg>
