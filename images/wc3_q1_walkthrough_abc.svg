<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect x="-8" y="-8" width="576" height="416" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "abc"，t = "ahbgdc"</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只看 t[j] 与 s[i] 是否相等：相等则 i 前进，否则只跳过 j</text>

  <g>
    <rect x="78" y="76" width="400" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="108" y="95" filter="url(#rough2)">j</text>
    <text x="173" y="95" filter="url(#rough2)">t[j]</text>
    <text x="243" y="95" filter="url(#rough2)">s[i]</text>
    <text x="318" y="95" filter="url(#rough2)">相等？</text>
    <text x="418" y="95" filter="url(#rough2)">i 更新后</text>
  </g>

  <g font-size="11" text-anchor="middle">
    <text x="108" y="123" fill="#444" filter="url(#rough2)">0</text>
    <text x="173" y="123" fill="#444" filter="url(#rough2)">a</text>
    <text x="243" y="123" fill="#8a6a20" filter="url(#rough2)">a</text>
    <text x="318" y="123" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="418" y="123" fill="#3a5a30" filter="url(#rough2)">i = 1</text>

    <text x="108" y="151" fill="#444" filter="url(#rough2)">1</text>
    <text x="173" y="151" fill="#444" filter="url(#rough2)">h</text>
    <text x="243" y="151" fill="#8a6a20" filter="url(#rough2)">b</text>
    <text x="318" y="151" fill="#8a3a36" filter="url(#rough2)">✗</text>
    <text x="418" y="151" fill="#666" filter="url(#rough2)">i = 1（不变）</text>

    <text x="108" y="179" fill="#444" filter="url(#rough2)">2</text>
    <text x="173" y="179" fill="#444" filter="url(#rough2)">b</text>
    <text x="243" y="179" fill="#8a6a20" filter="url(#rough2)">b</text>
    <text x="318" y="179" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="418" y="179" fill="#3a5a30" filter="url(#rough2)">i = 2</text>

    <text x="108" y="207" fill="#444" filter="url(#rough2)">3</text>
    <text x="173" y="207" fill="#444" filter="url(#rough2)">g</text>
    <text x="243" y="207" fill="#8a6a20" filter="url(#rough2)">c</text>
    <text x="318" y="207" fill="#8a3a36" filter="url(#rough2)">✗</text>
    <text x="418" y="207" fill="#666" filter="url(#rough2)">i = 2（不变）</text>

    <text x="108" y="235" fill="#444" filter="url(#rough2)">4</text>
    <text x="173" y="235" fill="#444" filter="url(#rough2)">d</text>
    <text x="243" y="235" fill="#8a6a20" filter="url(#rough2)">c</text>
    <text x="318" y="235" fill="#8a3a36" filter="url(#rough2)">✗</text>
    <text x="418" y="235" fill="#666" filter="url(#rough2)">i = 2（不变）</text>

    <text x="108" y="263" fill="#444" filter="url(#rough2)">5</text>
    <text x="173" y="263" fill="#444" filter="url(#rough2)">c</text>
    <text x="243" y="263" fill="#8a6a20" filter="url(#rough2)">c</text>
    <text x="318" y="263" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="418" y="263" fill="#3a5a30" filter="url(#rough2)">i = 3 = |s|</text>
  </g>

  <g fill="none" stroke="#446688" stroke-width="1.2">
    <path d="M 78 104 L 478 104" filter="url(#rough2)"/>
    <path d="M 78 132 L 478 132" filter="url(#rough2)"/>
    <path d="M 78 160 L 478 160" filter="url(#rough2)"/>
    <path d="M 78 188 L 478 188" filter="url(#rough2)"/>
    <path d="M 78 216 L 478 216" filter="url(#rough2)"/>
    <path d="M 78 244 L 478 244" filter="url(#rough2)"/>
    <path d="M 78 272 L 478 272" filter="url(#rough2)"/>
    <path d="M 78 76 L 78 272" filter="url(#rough2)"/>
    <path d="M 138 76 L 138 272" filter="url(#rough2)"/>
    <path d="M 208 76 L 208 272" filter="url(#rough2)"/>
    <path d="M 278 76 L 278 272" filter="url(#rough2)"/>
    <path d="M 358 76 L 358 272" filter="url(#rough2)"/>
    <path d="M 478 76 L 478 272" filter="url(#rough2)"/>
  </g>

  <rect x="78" y="76" width="400" height="28" fill="none" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="78" y="104" width="400" height="28" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <rect x="78" y="132" width="400" height="28" fill="#ffffff" opacity="0.75" filter="url(#rough2)"/>
  <rect x="78" y="160" width="400" height="28" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <rect x="78" y="188" width="400" height="28" fill="#ffffff" opacity="0.75" filter="url(#rough2)"/>
  <rect x="78" y="216" width="400" height="28" fill="#ffffff" opacity="0.75" filter="url(#rough2)"/>
  <rect x="78" y="244" width="400" height="28" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>

  <rect x="60" y="292" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="74" y="311" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">反例走查：s = "axc"，t = "ahbgdc"</text>
  <text x="74" y="330" font-size="10" fill="#555" filter="url(#rough2)">j = 0 命中 a → i = 1；此后 t 中再无 x，j 扫到 6 时 i = 1 &lt; 3 → 返回 false</text>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">命中 3 次即 i = 3，与 t 的剩余长度无关：到 j = 5 就提前结束</text>
</svg>
