<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b0722a"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
  </defs>
  <rect width="620" height="560" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">算法流程：一趟建表（计数）→ 一趟查询（取最优）</text>
  <path d="M 160 36 Q 310 44 460 36" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- Phase 1 label -->
  <g filter="url(#r)"><rect x="24" y="54" width="110" height="26" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="79" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">阶段一：建表</text>

  <!-- P1 step 1 -->
  <g filter="url(#r)"><rect x="170" y="50" width="280" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="310" y="72" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#r)">遍历每个字符串 arr[k]，枚举其全部子串</text>
  <path d="M 310 84 L 310 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>

  <!-- P1 step 2 -->
  <g filter="url(#r)"><rect x="190" y="102" width="240" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="310" y="124" text-anchor="middle" font-size="12.5" fill="#7a5a1e" filter="url(#r)">集合 set 去重：同一字符串只留一份</text>
  <path d="M 310 136 L 310 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>

  <!-- P1 step 3 -->
  <g filter="url(#r)"><rect x="210" y="154" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="310" y="176" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#r)">对 set 中每个子串 t：cnt[t] += 1</text>
  <path d="M 410 171 L 452 171" stroke="#b0722a" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <text x="476" y="175" text-anchor="middle" font-size="11" fill="#b0722a" filter="url(#r)">回到</text>
  <text x="476" y="190" text-anchor="middle" font-size="11" fill="#b0722a" filter="url(#r)">下一个串</text>

  <!-- Phase 2 label -->
  <g filter="url(#r)"><rect x="24" y="218" width="110" height="26" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="79" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">阶段二：查询</text>

  <!-- P2 step 1 -->
  <g filter="url(#r)"><rect x="170" y="214" width="280" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="310" y="236" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#r)">再遍历 arr[k]，枚举其每个子串 t</text>
  <path d="M 310 248 L 310 264" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#r)"/>

  <!-- diamond -->
  <g filter="url(#r)"><polygon points="310,268 386,302 310,336 234,302" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="310" y="307" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">cnt[t] = 1 ?</text>

  <!-- yes branch -->
  <text x="394" y="296" font-size="12.5" font-weight="bold" fill="#b0722a" filter="url(#r)">是</text>
  <path d="M 386 302 L 424 302" stroke="#b0722a" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <g filter="url(#r)"><rect x="428" y="276" width="170" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="513" y="298" text-anchor="middle" font-size="12" fill="#7a3230" filter="url(#r)">t 是非公共子串候选</text>
  <text x="513" y="318" text-anchor="middle" font-size="12" fill="#7a3230" filter="url(#r)">按 (长度, 字典序) 取更小者</text>

  <!-- no branch -->
  <text x="310" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#888" filter="url(#r)">否（其他字符串也含有 t，跳过）</text>
  <path d="M 310 366 L 310 386" stroke="#aaa" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>

  <!-- collect -->
  <g filter="url(#r)"><rect x="210" y="388" width="200" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="310" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">answer[k] ← 最优候选或 ""</text>

  <!-- compare key box -->
  <g filter="url(#r)"><rect x="110" y="448" width="400" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="310" y="473" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">比较键：先比长度 |t|，再比字典序 t —— 枚举起点顺序 ≠ 字典序！</text>

  <!-- bottom note -->
  <g filter="url(#r)"><rect x="40" y="504" width="540" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="62" y="523" font-size="12" fill="#444" filter="url(#r)">两趟都是纯枚举 + 哈希：时间 O(n·L³) ≈ 8×10⁵，空间 O(n·L³) 个字符（约 2.1 万个子串）。</text>
  <text x="62" y="541" font-size="12" fill="#444" filter="url(#r)">若按长度从小到大枚举，找到第一个有候选的长度即可停（向上封闭性保证，见题解 §5 引理 2）。</text>
</svg>
