<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">正向两路分叉 vs 反向唯一前驱</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">坐标只增不减，所以「谁更大」就暴露了最后一步是谁被加大</text>

  <!-- 左侧：正向分叉 -->
  <rect x="26" y="64" width="278" height="286" fill="#f4f7ff" stroke="#9bb0d0" stroke-width="1.2" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="165" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">正向：每点 2 条出边</text>

  <rect x="127" y="98" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="165" y="117" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">(x, y)</text>

  <path d="M 150 126 L 112 166" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 126 L 218 166" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="67" y="170" width="86" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="110" y="189" text-anchor="middle" font-size="10.5" fill="#334" filter="url(#rough2)">(x, x+y)</text>
  <rect x="177" y="170" width="86" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="220" y="189" text-anchor="middle" font-size="10.5" fill="#334" filter="url(#rough2)">(x+y, y)</text>

  <path d="M 98 198 L 82 238" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 122 198 L 140 238" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 208 198 L 196 238" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 232 198 L 258 238" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="242" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="77" y="259" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">…</text>
  <rect x="110" y="242" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="139" y="259" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">…</text>
  <rect x="172" y="242" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="201" y="259" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">…</text>
  <rect x="234" y="242" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="263" y="259" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">…</text>

  <text x="165" y="296" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">第 k 层最多 2^k 个候选点</text>
  <text x="165" y="318" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">剪枝后状态数仍可达 tx·ty ≈ 1e18</text>
  <text x="165" y="338" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">枚举路径必然爆炸，需要换方向</text>

  <!-- 右侧：反向唯一 -->
  <rect x="336" y="64" width="278" height="286" fill="#f5fbf5" stroke="#9cc08f" stroke-width="1.2" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="475" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">反向：前驱唯一</text>

  <rect x="421" y="98" width="108" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="117" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">(tx, ty)</text>
  <text x="399" y="148" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">设 tx &gt; ty</text>

  <path d="M 475 126 L 475 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="483" y="152" font-size="9.5" fill="#666" filter="url(#rough2)">减掉较小者 ty</text>

  <rect x="413" y="172" width="124" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="191" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">(tx − ty, ty)</text>

  <path d="M 475 200 L 475 238" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="350" y="242" width="250" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="362" y="264" font-size="10" fill="#3a5a30" filter="url(#rough2)">tx &gt; ty ⇒ 最后一步必是给它加 y</text>
  <text x="362" y="286" font-size="10" fill="#3a5a30" filter="url(#rough2)">前驱只有 (tx − ty, ty) 一个</text>
  <text x="362" y="308" font-size="10" fill="#3a5a30" filter="url(#rough2)">回走一条链，全程没有分支</text>

  <text x="320" y="378" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">结论：从终点倒推 —— 路径唯一，且可整批减（取模）</text>
</svg>
