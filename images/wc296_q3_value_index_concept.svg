<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="940" height="600" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：互不相同 ⇒ 「值 → 下标」倒排索引</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A : before ===== -->
  <g filter="url(#sk)">
    <rect x="62" y="52" width="368" height="172" rx="10" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="246" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">操作前</text>
  <g filter="url(#sk)">
    <rect x="88" y="80" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="160" y="80" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="232" y="80" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="304" y="80" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="119" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">1</text>
  <text x="191" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">2</text>
  <text x="263" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">4</text>
  <text x="335" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">6</text>
  <text x="119" y="136" text-anchor="middle" font-size="11" fill="#888">下标 0</text>
  <text x="191" y="136" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="263" y="136" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="335" y="136" text-anchor="middle" font-size="11" fill="#888">3</text>
  <path d="M 119 142 L 119 166" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <path d="M 191 142 L 191 166" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <path d="M 263 142 L 263 166" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <path d="M 335 142 L 335 166" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <g filter="url(#sk)">
    <rect x="91" y="170" width="56" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="163" y="170" width="56" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="235" y="170" width="56" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="307" y="170" width="56" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="119" y="191" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">1→0</text>
  <text x="191" y="191" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">2→1</text>
  <text x="263" y="191" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">4→2</text>
  <text x="335" y="191" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">6→3</text>
  <text x="246" y="216" text-anchor="middle" font-size="11" fill="#777">pos：值 → 下标（双射）</text>

  <!-- ===== transition arrow ===== -->
  <path d="M 438 138 L 498 138" stroke="#3a3a3a" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="468" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">操作 [4,7]</text>
  <text x="468" y="160" text-anchor="middle" font-size="10" fill="#777">idx = pos[4]</text>
  <text x="468" y="174" text-anchor="middle" font-size="10" fill="#777">= 2</text>

  <!-- ===== Panel B : after ===== -->
  <g filter="url(#sk)">
    <rect x="508" y="52" width="368" height="172" rx="10" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="692" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">执行 [4,7] 后</text>
  <g filter="url(#sk)">
    <rect x="534" y="80" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="606" y="80" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="678" y="80" width="62" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="750" y="80" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="565" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">1</text>
  <text x="637" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">2</text>
  <text x="709" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">7</text>
  <text x="781" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">6</text>
  <text x="565" y="136" text-anchor="middle" font-size="11" fill="#888">下标 0</text>
  <text x="637" y="136" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="709" y="136" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="781" y="136" text-anchor="middle" font-size="11" fill="#888">3</text>
  <path d="M 565 142 L 565 166" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <path d="M 637 142 L 637 166" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <path d="M 709 142 L 709 166" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <path d="M 781 142 L 781 166" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <g filter="url(#sk)">
    <rect x="537" y="170" width="56" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="609" y="170" width="56" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="681" y="170" width="56" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="753" y="170" width="56" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="565" y="191" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">1→0</text>
  <text x="637" y="191" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">2→1</text>
  <text x="709" y="191" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">7→2</text>
  <text x="781" y="191" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">6→3</text>
  <text x="709" y="217" text-anchor="middle" font-size="10" fill="#b85450">旧键 4→2 已删除</text>

  <!-- ===== explanation box ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="248" width="800" height="190" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="92" y="278" font-size="14" font-weight="bold" fill="#2b2b2b">为什么每次替换只需 O(1)？</text>
  <text x="92" y="306" font-size="12" fill="#444">① 互不相同（每步删一加一也不破坏，见正文引理 1）⇒ 任一时刻「值 → 下标」是双射——值就是身份证</text>
  <text x="92" y="332" font-size="12" fill="#444">② from 一定存在 ⇒ 查询必命中；to 一定不存在 ⇒ 写入不覆盖任何键——增删永不冲突</text>
  <text x="92" y="358" font-size="12" fill="#444">③ 每步「查 idx → 改 nums[idx] → 删 from、加 to」，一删一增，pos 恒有 n 个键，始终是数组的实时镜像</text>
  <text x="92" y="384" font-size="12" fill="#444">④ 替换是原地换值，其余元素纹丝不动——被线性扫描卡住的「找值」被压成 O(1)</text>
  <text x="92" y="418" font-size="12" fill="#b85450" font-weight="bold">坑位预告：旧值会被删掉又「复活」（换到新下标），索引必须逐步同步——见示例演算图</text>

  <!-- ===== formula strip ===== -->
  <g filter="url(#sk)">
    <rect x="110" y="474" width="160" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="330" y="474" width="190" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="600" y="474" width="190" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="190" y="499" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">建索引 O(n)</text>
  <text x="305" y="499" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">+</text>
  <text x="425" y="499" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">m 次操作 × O(1)</text>
  <path d="M 545 494 L 592 494" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="695" y="499" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">总计 O(n + m)</text>
  <text x="820" y="499" text-anchor="middle" font-size="11" fill="#888">n, m ≤ 1e5</text>
</svg>
