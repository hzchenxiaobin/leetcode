<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 505" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="505" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [−1, 3, 5, 1, 4, 2, −9]，target = 6</text>
  <text x="320" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">cur = 自上次剪断起的元素和；seen = 见过的相对前缀（含虚拟 0）；判定：cur − 6 ∈ seen ？</text>

  <g filter="url(#rough2)">
    <rect x="20" y="170" width="600" height="30" fill="#fff8e1"/>
    <rect x="20" y="230" width="600" height="30" fill="#fff8e1"/>

    <rect x="20" y="54" width="600" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="38" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">i</text>
    <text x="76" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">x</text>
    <text x="123" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">cur</text>
    <text x="180" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">cur − 6</text>
    <text x="236" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">命中？</text>
    <text x="351" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">seen（检查后）</text>
    <text x="530" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">动作</text>

    <line x1="56" y1="54" x2="56" y2="290" stroke="#ccc" stroke-width="1"/>
    <line x1="96" y1="54" x2="96" y2="290" stroke="#ccc" stroke-width="1"/>
    <line x1="150" y1="54" x2="150" y2="290" stroke="#ccc" stroke-width="1"/>
    <line x1="210" y1="54" x2="210" y2="290" stroke="#ccc" stroke-width="1"/>
    <line x1="262" y1="54" x2="262" y2="290" stroke="#ccc" stroke-width="1"/>
    <line x1="440" y1="54" x2="440" y2="290" stroke="#ccc" stroke-width="1"/>
    <line x1="20" y1="110" x2="620" y2="110" stroke="#ccc" stroke-width="1"/>
    <line x1="20" y1="140" x2="620" y2="140" stroke="#ccc" stroke-width="1"/>
    <line x1="20" y1="170" x2="620" y2="170" stroke="#ccc" stroke-width="1"/>
    <line x1="20" y1="200" x2="620" y2="200" stroke="#ccc" stroke-width="1"/>
    <line x1="20" y1="230" x2="620" y2="230" stroke="#ccc" stroke-width="1"/>
    <line x1="20" y1="260" x2="620" y2="260" stroke="#ccc" stroke-width="1"/>
    <rect x="20" y="54" width="600" height="236" fill="none" stroke="#999" stroke-width="1.2"/>

    <text x="38" y="99" text-anchor="middle" font-size="11.5" fill="#777">0</text>
    <text x="76" y="99" text-anchor="middle" font-size="11.5" fill="#333">−1</text>
    <text x="123" y="99" text-anchor="middle" font-size="11.5" fill="#333">−1</text>
    <text x="180" y="99" text-anchor="middle" font-size="11.5" fill="#333">−7</text>
    <text x="236" y="99" text-anchor="middle" font-size="11.5" fill="#333">否</text>
    <text x="351" y="99" text-anchor="middle" font-size="11.5" fill="#333">{0, −1}</text>
    <text x="530" y="99" text-anchor="middle" font-size="11.5" fill="#333">加入 seen，继续</text>

    <text x="38" y="129" text-anchor="middle" font-size="11.5" fill="#777">1</text>
    <text x="76" y="129" text-anchor="middle" font-size="11.5" fill="#333">3</text>
    <text x="123" y="129" text-anchor="middle" font-size="11.5" fill="#333">2</text>
    <text x="180" y="129" text-anchor="middle" font-size="11.5" fill="#333">−4</text>
    <text x="236" y="129" text-anchor="middle" font-size="11.5" fill="#333">否</text>
    <text x="351" y="129" text-anchor="middle" font-size="11.5" fill="#333">{0, −1, 2}</text>
    <text x="530" y="129" text-anchor="middle" font-size="11.5" fill="#333">加入 seen，继续</text>

    <text x="38" y="159" text-anchor="middle" font-size="11.5" fill="#777">2</text>
    <text x="76" y="159" text-anchor="middle" font-size="11.5" fill="#333">5</text>
    <text x="123" y="159" text-anchor="middle" font-size="11.5" fill="#333">7</text>
    <text x="180" y="159" text-anchor="middle" font-size="11.5" fill="#333">1</text>
    <text x="236" y="159" text-anchor="middle" font-size="11.5" fill="#333">否</text>
    <text x="351" y="159" text-anchor="middle" font-size="11.5" fill="#333">{0, −1, 2, 7}</text>
    <text x="530" y="159" text-anchor="middle" font-size="11.5" fill="#333">加入 seen，继续</text>

    <text x="38" y="189" text-anchor="middle" font-size="11.5" fill="#777">3</text>
    <text x="76" y="189" text-anchor="middle" font-size="11.5" fill="#333">1</text>
    <text x="123" y="189" text-anchor="middle" font-size="11.5" fill="#333">8</text>
    <text x="180" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">2 ✓</text>
    <text x="236" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是！</text>
    <text x="351" y="189" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">剪断重置 → {0}</text>
    <text x="530" y="189" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✂ 选中 [5,1]，ans = 1</text>

    <text x="38" y="219" text-anchor="middle" font-size="11.5" fill="#777">4</text>
    <text x="76" y="219" text-anchor="middle" font-size="11.5" fill="#333">4</text>
    <text x="123" y="219" text-anchor="middle" font-size="11.5" fill="#333">4</text>
    <text x="180" y="219" text-anchor="middle" font-size="11.5" fill="#333">−2</text>
    <text x="236" y="219" text-anchor="middle" font-size="11.5" fill="#333">否</text>
    <text x="351" y="219" text-anchor="middle" font-size="11.5" fill="#333">{0, 4}</text>
    <text x="530" y="219" text-anchor="middle" font-size="11.5" fill="#333">加入 seen，继续</text>

    <text x="38" y="249" text-anchor="middle" font-size="11.5" fill="#777">5</text>
    <text x="76" y="249" text-anchor="middle" font-size="11.5" fill="#333">2</text>
    <text x="123" y="249" text-anchor="middle" font-size="11.5" fill="#333">6</text>
    <text x="180" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">0 ✓</text>
    <text x="236" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是！</text>
    <text x="351" y="249" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">剪断重置 → {0}</text>
    <text x="530" y="249" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✂ 选中 [4,2]，ans = 2</text>

    <text x="38" y="279" text-anchor="middle" font-size="11.5" fill="#777">6</text>
    <text x="76" y="279" text-anchor="middle" font-size="11.5" fill="#333">−9</text>
    <text x="123" y="279" text-anchor="middle" font-size="11.5" fill="#333">−9</text>
    <text x="180" y="279" text-anchor="middle" font-size="11.5" fill="#333">−15</text>
    <text x="236" y="279" text-anchor="middle" font-size="11.5" fill="#333">否</text>
    <text x="351" y="279" text-anchor="middle" font-size="11.5" fill="#333">{0, −9}</text>
    <text x="530" y="279" text-anchor="middle" font-size="11.5" fill="#333">加入 seen，继续</text>

    <path d="M 20 200 L 620 200" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none"/>
    <text x="612" y="196" text-anchor="middle" font-size="13" fill="#b85450">✂</text>
    <path d="M 20 260 L 620 260" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none"/>
    <text x="612" y="256" text-anchor="middle" font-size="13" fill="#b85450">✂</text>

    <rect x="130" y="308" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="329" text-anchor="middle" font-size="12" fill="#333">−1</text>
    <rect x="170" y="308" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="329" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="210" y="308" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="230" y="329" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="250" y="308" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="270" y="329" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="290" y="308" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="310" y="329" text-anchor="middle" font-size="12" fill="#333">4</text>
    <rect x="330" y="308" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="350" y="329" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="370" y="308" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="390" y="329" text-anchor="middle" font-size="12" fill="#333">−9</text>

    <path d="M 290 304 L 290 346" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none"/>
    <path d="M 370 304 L 370 346" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none"/>

    <text x="240" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">[5,1] 和为 6</text>
    <text x="340" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">[4,2] 和为 6</text>
    <text x="320" y="392" text-anchor="middle" font-size="10.5" fill="#b85450">候选 [3,5,1,4,2,−9]（和也为 6）跨越剪断点 → 不合法，被正确舍弃</text>

    <rect x="30" y="406" width="580" height="56" rx="8" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6 4"/>
    <text x="320" y="428" text-anchor="middle" font-size="11" fill="#555">⚠️ 若剪断后不清空 seen：i = 6 时（全局口径）5 − 6 = −1 命中旧前缀，把上述候选计入 → 错答 3</text>
    <text x="320" y="450" text-anchor="middle" font-size="11" fill="#555">清空 seen = 丢掉剪断点之前的所有前缀 —— 「不重叠」约束在代码里的化身</text>

    <text x="320" y="488" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d28">扫描结束：ans = 2 ✓　（单次扫描，O(n) 时间 / O(n) 空间）</text>
  </g>
</svg>
