<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按位周期计数：C(9, 2) —— 0..9 中第 2 位为 1 的个数</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 i 位随整数递增以 2^i 为周期循环：先 2^(i−1) 个 0、再 2^(i−1) 个 1</text>

  <text x="78" y="84" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">num：</text>
  <text x="78" y="124" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">第 2 位：</text>

  <!-- num 行 -->
  <rect x="83" y="64" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="129" y="64" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="149" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="175" y="64" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="195" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="221" y="64" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="241" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="267" y="64" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="287" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="313" y="64" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="359" y="64" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="379" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="405" y="64" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="425" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="451" y="64" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="471" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <rect x="497" y="64" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="517" y="84" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>

  <!-- 第 2 位取值行 -->
  <rect x="83" y="104" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="124" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="129" y="104" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="149" y="124" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="175" y="104" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <rect x="221" y="104" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="241" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <rect x="267" y="104" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="287" y="124" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="313" y="104" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="124" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="359" y="104" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="379" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <rect x="405" y="104" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <rect x="451" y="104" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="471" y="124" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="497" y="104" width="40" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="517" y="124" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- 分块括号 -->
  <path d="M 83 142 V 150 H 261 V 142" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="172" y="166" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">完整周期 ①（2 个 1）</text>
  <path d="M 267 142 V 150 H 445 V 142" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="356" y="166" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">完整周期 ②（2 个 1）</text>
  <path d="M 451 142 V 150 H 537 V 142" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="494" y="166" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">零头 r = 2：全在 0 段</text>

  <!-- 公式框 -->
  <rect x="50" y="186" width="520" height="92" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="210" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">C(num, i) = ⌊n / 2^i⌋ × 2^(i−1) + max(0, n mod 2^i − 2^(i−1))</text>
  <text x="310" y="232" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">n = num + 1（统计 0..num，0 不贡献价格但让周期从 0 对齐）</text>
  <text x="310" y="254" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">完整周期 ⌊n / 2^i⌋ 块 × 每块 2^(i−1) 个 1；零头先补 0 段，多出的才是 1</text>

  <!-- 结果框 -->
  <rect x="50" y="296" width="520" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">本例：C(9, 2) = ⌊10/4⌋ × 2 + max(0, 10 mod 4 − 2) = 4</text>
  <text x="310" y="342" text-anchor="middle" font-size="10.5" fill="#3a5f2e" filter="url(#rough2)">第 2 位为 1 的数：2、3、6、7（上表中绿色格子）</text>
  <text x="310" y="364" text-anchor="middle" font-size="10.5" fill="#3a5f2e" filter="url(#rough2)">acc(num) = Σ C(num, i)，i = x, 2x, 3x, …（计费位逐位求和）</text>
</svg>
