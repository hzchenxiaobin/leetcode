<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <rect x="40" y="40" width="480" height="192" fill="none" stroke="#aaa" stroke-width="1.2" stroke-dasharray="6 5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="62" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1　arr = [3,3,3,3,5,5,5,2,2,7]，n = 10，要删 ≥ 5</text>

  <rect x="60" y="70" width="104" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="70" width="104" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="70" width="104" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="70" width="118" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="86" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">值</text>
  <text x="222" y="86" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">频率</text>
  <text x="332" y="86" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">累计删</text>
  <text x="449" y="86" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">判断</text>

  <rect x="60" y="98" width="104" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="98" width="104" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="98" width="104" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="98" width="118" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="117" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="222" y="117" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">4</text>
  <text x="332" y="117" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">4</text>
  <text x="449" y="117" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">4 &lt; 5 继续</text>

  <rect x="60" y="126" width="104" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="126" width="104" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="126" width="104" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="126" width="118" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="112" y="145" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="222" y="145" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="332" y="145" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">7</text>
  <text x="449" y="145" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">7 ≥ 5 停</text>

  <rect x="60" y="154" width="104" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="154" width="104" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="154" width="104" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="154" width="118" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="173" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="222" y="173" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="332" y="173" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">9</text>
  <text x="449" y="173" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">无需再看</text>

  <rect x="60" y="182" width="104" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="182" width="104" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="182" width="104" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="182" width="118" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="201" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="222" y="201" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="332" y="201" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">10</text>
  <text x="449" y="201" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">无需再看</text>

  <text x="60" y="227" font-size="10" fill="#666" filter="url(#rough2)">降序频率 [4, 3, 2, 1] 前缀和 4 → 7 跨过 5，故 k = 2</text>

  <rect x="40" y="250" width="480" height="152" fill="none" stroke="#aaa" stroke-width="1.2" stroke-dasharray="6 5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="272" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2　arr = [7,7,7,7,7,7]，n = 6，要删 ≥ 3</text>

  <rect x="60" y="284" width="104" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="284" width="104" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="284" width="104" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="284" width="118" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="300" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">值</text>
  <text x="222" y="300" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">频率</text>
  <text x="332" y="300" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">累计删</text>
  <text x="449" y="300" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">判断</text>

  <rect x="60" y="312" width="104" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="312" width="104" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="312" width="104" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="312" width="118" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="112" y="332" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">7</text>
  <text x="222" y="332" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">6</text>
  <text x="332" y="332" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">6</text>
  <text x="449" y="332" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">6 ≥ 3 停</text>

  <text x="60" y="372" font-size="10" fill="#666" filter="url(#rough2)">只有一种值：选它一次就删掉全部 6 个，k = 1（不是 0）</text>
</svg>
