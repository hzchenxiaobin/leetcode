<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：mainTank = 9, additionalTank = 2 → 110 km</text>
  <path d="M 150 44 Q 320 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)" fill="#e8f0fe" stroke="#446688" stroke-width="1.5">
    <rect x="45" y="62" width="180" height="38" rx="3"/>
    <rect x="225" y="62" width="110" height="38" rx="3"/>
    <rect x="335" y="62" width="100" height="38" rx="3"/>
    <rect x="435" y="62" width="95" height="38" rx="3"/>
    <rect x="530" y="62" width="75" height="38" rx="3"/>
  </g>
  <text x="135" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">阶段</text>
  <text x="280" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">主油箱</text>
  <text x="385" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">副油箱</text>
  <text x="482" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">本次里程</text>
  <text x="567" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">累计</text>

  <!-- table rows -->
  <g filter="url(#sk)" fill="#ffffff" stroke="#999999" stroke-width="1.2">
    <rect x="45" y="100" width="180" height="46"/>
    <rect x="225" y="100" width="110" height="46"/>
    <rect x="335" y="100" width="100" height="46"/>
    <rect x="435" y="100" width="95" height="46"/>
    <rect x="530" y="100" width="75" height="46"/>
  </g>
  <text x="135" y="128" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">初始</text>
  <text x="280" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">9</text>
  <text x="385" y="128" text-anchor="middle" font-size="13" fill="#2e5e24" filter="url(#sk)">2</text>
  <text x="482" y="128" text-anchor="middle" font-size="13" fill="#8a6415" filter="url(#sk)">—</text>
  <text x="567" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">0</text>

  <g filter="url(#sk)" fill="#f6f9fd" stroke="#999999" stroke-width="1.2">
    <rect x="45" y="146" width="180" height="46"/>
    <rect x="225" y="146" width="110" height="46"/>
    <rect x="335" y="146" width="100" height="46"/>
    <rect x="435" y="146" width="95" height="46"/>
    <rect x="530" y="146" width="75" height="46"/>
  </g>
  <text x="135" y="174" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">第 1 轮：耗 5 → 补 1</text>
  <text x="280" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">9 → 4 → <tspan fill="#2e5e24">5</tspan></text>
  <text x="385" y="174" text-anchor="middle" font-size="13" fill="#2e5e24" filter="url(#sk)">2 → 1</text>
  <text x="482" y="174" text-anchor="middle" font-size="13" fill="#8a6415" filter="url(#sk)">+50</text>
  <text x="567" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">50</text>

  <g filter="url(#sk)" fill="#ffffff" stroke="#999999" stroke-width="1.2">
    <rect x="45" y="192" width="180" height="46"/>
    <rect x="225" y="192" width="110" height="46"/>
    <rect x="335" y="192" width="100" height="46"/>
    <rect x="435" y="192" width="95" height="46"/>
    <rect x="530" y="192" width="75" height="46"/>
  </g>
  <text x="135" y="220" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">第 2 轮：耗 5 → 补 1</text>
  <text x="280" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">5 → 0 → <tspan fill="#2e5e24">1</tspan></text>
  <text x="385" y="220" text-anchor="middle" font-size="13" fill="#2e5e24" filter="url(#sk)">1 → 0</text>
  <text x="482" y="220" text-anchor="middle" font-size="13" fill="#8a6415" filter="url(#sk)">+50</text>
  <text x="567" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">100</text>

  <g filter="url(#sk)" fill="#f6f9fd" stroke="#999999" stroke-width="1.2">
    <rect x="45" y="238" width="180" height="46"/>
    <rect x="225" y="238" width="110" height="46"/>
    <rect x="335" y="238" width="100" height="46"/>
    <rect x="435" y="238" width="95" height="46"/>
    <rect x="530" y="238" width="75" height="46"/>
  </g>
  <text x="135" y="266" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">收尾：零头 1 升耗尽</text>
  <text x="280" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">1 → 0</text>
  <text x="385" y="266" text-anchor="middle" font-size="13" fill="#2e5e24" filter="url(#sk)">0</text>
  <text x="482" y="266" text-anchor="middle" font-size="13" fill="#8a6415" filter="url(#sk)">+10</text>
  <text x="567" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">110</text>

  <!-- annotation -->
  <path d="M 280 288 Q 280 298 280 304" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="45" y="308" width="560" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">第 1 轮补回的 1 升让主油箱重新凑满 5 升 → m = 9 才能转移两次</text>

  <!-- formula check -->
  <g filter="url(#sk)">
    <rect x="45" y="362" width="560" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">公式验证：t = min(2, ⌊(9−1)/4⌋) = 2</text>
  <text x="320" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">总里程 = 10 × (9 + 2) = 110 km ✓</text>
</svg>
