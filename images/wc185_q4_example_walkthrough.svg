    <rect x="66" y="430" width="44" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.2"/>
    <rect x="66" y="460" width="44" height="30" fill="#f0f0f0" stroke="#888" stroke-width="1.2"/>
    <rect x="110" y="400" width="48" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.3"/>
