    <rect x="110" y="430" width="48" height="30" fill="#fce4ec" stroke="#e8c8c4" stroke-width="1.2"/>
    <rect x="158" y="430" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <rect x="110" y="460" width="48" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1"/>
    <rect x="158" y="460" width="48" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1"/>
    <rect x="106" y="426" width="104" height="38" rx="6" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3"/>
  </g>
  <text x="88" y="390" text-anchor="middle" font-size="9.5" fill="#555">j \ v</text>
  <text x="134" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">v=1</text>
  <text x="182" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">v=2</text>
  <text x="88" y="420" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">j=1</text>
  <text x="88" y="450" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">j=2</text>
  <text x="88" y="480" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">j=3</text>
  <text x="134" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1</text>
  <text x="182" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">4</text>
  <text x="134" y="450" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="182" y="451" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3830">3</text>
  <text x="134" y="480" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="182" y="480" text-anchor="middle" font-size="12" fill="#aaa">0</text>

  <!-- 层间箭头 -->
  <g filter="url(#sk)">
    <path d="M 136 198 L 136 220" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrD)"/>
    <path d="M 136 346 L 136 368" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrD)"/>
    <path d="M 208 138 C 260 142, 300 148, 344 152" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrD)"/>
    <path d="M 208 283 C 260 276, 300 262, 344 252" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrD)"/>
    <path d="M 208 445 C 260 438, 300 420, 344 402" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrD)"/>
  </g>
  <text x="148" y="214" font-size="10" fill="#888">填第 2 位</text>
  <text x="148" y="362" font-size="10" fill="#888">填第 3 位</text>

  <!-- ===== 右：逐层要点面板 ===== -->
  <g filter="url(#sk)">
    <rect x="350" y="76" width="544" height="414" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5,4"/>
    <rect x="366" y="108" width="512" height="70" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
    <rect x="366" y="190" width="512" height="102" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
    <rect x="366" y="304" width="512" height="102" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
    <rect x="366" y="416" width="512" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="622" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">逐层演算要点（绿 = 安全来源，红 = 刷新来源）</text>

  <text x="382" y="131" font-size="11.5" font-weight="bold" fill="#2b4a6e">i = 1　f[1][1][v] = 1：单元素数组 [1]、[2]，首元素必刷新</text>
  <text x="382" y="155" font-size="10.5" fill="#666">代价 1、最大值 v ∈ {1, 2} 各 1 个方案</text>

  <text x="382" y="213" font-size="11.5" font-weight="bold" fill="#2b2b2b">i = 2　两路转移：</text>
  <text x="382" y="236" font-size="11" fill="#2e5a24">安全：f[2][1][v] = f[1][1][v]·v →（v=1: 1，v=2: 2）</text>
  <text x="382" y="259" font-size="11" fill="#8f3830">刷新：f[2][2][2] = P[1][1] = f[1][1][1] = 1 → [1,2]</text>
  <text x="382" y="281" font-size="10" fill="#666">（[1] 的末位补 2，刷新到新最大 2；代价 2 的其余格子为 0）</text>

  <text x="382" y="327" font-size="11.5" font-weight="bold" fill="#2b2b2b">i = 3　答案格 f[3][2][2] 的两路来源：</text>
  <text x="382" y="350" font-size="11" fill="#2e5a24">安全：f[2][2][2] × v = 1 × 2 = 2（[1,2] 末位补 1 或 2）</text>
  <text x="382" y="373" font-size="11" fill="#8f3830">刷新：P[1][1] = f[2][1][1] = 1（[1,1] 末位刷新到 2）</text>
  <text x="382" y="396" font-size="12.5" font-weight="bold" fill="#2b2b2b">f[3][2][2] = 2 + 1 = 3</text>

  <text x="382" y="438" font-size="11.5" font-weight="bold" fill="#2e5a24">答案 = f[3][2][1] + f[3][2][2] = 0 + 3 = 3，三个方案：</text>
  <g filter="url(#sk)">
    <rect x="500" y="448" width="26" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="528" y="448" width="26" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="556" y="448" width="26" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="620" y="448" width="26" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="648" y="448" width="26" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="676" y="448" width="26" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="740" y="448" width="26" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="768" y="448" width="26" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="796" y="448" width="26" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="513" y="463" text-anchor="middle" font-size="10" font-weight="bold" fill="#8f3830">1</text>
  <text x="541" y="463" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6e">1</text>
  <text x="569" y="463" text-anchor="middle" font-size="10" font-weight="bold" fill="#8f3830">2</text>
  <text x="633" y="463" text-anchor="middle" font-size="10" font-weight="bold" fill="#8f3830">1</text>
  <text x="661" y="463" text-anchor="middle" font-size="10" font-weight="bold" fill="#8f3830">2</text>
  <text x="689" y="463" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6e">1</text>
  <text x="753" y="463" text-anchor="middle" font-size="10" font-weight="bold" fill="#8f3830">1</text>
  <text x="781" y="463" text-anchor="middle" font-size="10" font-weight="bold" fill="#8f3830">2</text>
  <text x="809" y="463" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6e">2</text>
  <text x="382" y="485" font-size="9.5" fill="#444">k = 3 一行全 0：值域 {1,2} 撑不起 3 个严格递增的记录（同示例 2）</text>

  <!-- 底部图例 -->
  <g filter="url(#sk)">
    <rect x="66" y="504" width="10" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
