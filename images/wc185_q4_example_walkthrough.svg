<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#999" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="920" height="540" fill="#fafafa"/>
  <text x="460" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：n = 3, m = 2, k = 2 —— 逐层填表，答案 3</text>
  <path d="M 250 38 Q 460 46 670 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左：三张 DP 表 ===== -->
