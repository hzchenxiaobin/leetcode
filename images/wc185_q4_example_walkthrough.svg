  <text x="88" y="242" text-anchor="middle" font-size="9.5" fill="#555">j \ v</text>
  <text x="134" y="242" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">v=1</text>
  <text x="182" y="242" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">v=2</text>
  <text x="88" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">j=1</text>
  <text x="88" y="302" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">j=2</text>
  <text x="88" y="332" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">j=3</text>
  <text x="134" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830">1</text>
  <text x="182" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
  <text x="134" y="302" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="182" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24">1</text>
  <text x="134" y="332" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="182" y="332" text-anchor="middle" font-size="12" fill="#aaa">0</text>

  <!-- i=3 表 -->
  <g filter="url(#sk)">
    <rect x="66" y="372" width="44" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.2"/>
    <rect x="110" y="372" width="48" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.2"/>
    <rect x="158" y="372" width="48" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.2"/>
