  </g>
  <text x="88" y="94" text-anchor="middle" font-size="9.5" fill="#555">j \ v</text>
  <text x="134" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">v=1</text>
  <text x="182" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">v=2</text>
