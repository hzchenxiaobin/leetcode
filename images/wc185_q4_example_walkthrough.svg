  <text x="136" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">i = 2</text>
  <text x="136" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">i = 3</text>

  <!-- i=1 表 -->
