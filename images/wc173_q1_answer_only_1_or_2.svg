<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">关键观察：答案只可能是 1 或 2</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888">字符串只含 'a'、'b' 两种字母 —— 全部同种字母组成的子序列必定是回文</text>

  <g filter="url(#rough2)" font-size="20" text-anchor="middle" font-weight="bold">
    <rect x="139" y="68" width="50" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="197" y="68" width="50" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="255" y="68" width="50" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="313" y="68" width="50" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="371" y="68" width="50" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="164" y="97" fill="#8a6a20">b</text>
    <text x="222" y="97" fill="#3a5a30">a</text>
    <text x="280" y="97" fill="#3a5a30">a</text>
    <text x="338" y="97" fill="#8a6a20">b</text>
    <text x="396" y="97" fill="#8a6a20">b</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="164" y="126">0</text>
    <text x="222" y="126">1</text>
    <text x="280" y="126">2</text>
    <text x="338" y="126">3</text>
    <text x="396" y="126">4</text>
  </g>
  <text x="470" y="97" font-size="10" fill="#666" filter="url(#rough2)">s = "baabb"</text>

  <path d="M 222 112 L 222 142 L 158 142 L 158 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 338 112 L 338 142 L 405 142 L 405 168" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="172" width="230" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="192" font-size="10.5" fill="#3a5a30" font-weight="bold">第 1 步：取全部 'a'（下标 1,2）</text>
  <text x="56" y="211" font-size="10" fill="#555">子序列 "aa" 是回文，删掉后剩 "bbb"</text>
  <text x="56" y="227" font-size="10" fill="#888">全同字符 → 天然对称，无需任何配对</text>

  <rect x="290" y="172" width="230" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="306" y="192" font-size="10.5" fill="#8a6a20" font-weight="bold">第 2 步：取全部 'b'（0,3,4）</text>
  <text x="306" y="211" font-size="10" fill="#555">不管 a 是否先被删光，"b" 们仍是回文</text>
  <text x="306" y="227" font-size="10" fill="#888">两步一定能清空 ⇒ 答案上界为 2</text>

  <rect x="40" y="256" width="230" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="276" font-size="10.5" fill="#3a4a66" font-weight="bold">上界：答案 ≤ 2（与 n 无关）</text>
  <text x="56" y="295" font-size="10" fill="#555">n = 1000 也只需最多 2 次删除</text>

  <rect x="290" y="256" width="230" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="306" y="276" font-size="10.5" fill="#8a3a36" font-weight="bold">下界：非空串答案 ≥ 1</text>
  <text x="306" y="295" font-size="10" fill="#555">0 次操作只能对应空串</text>

  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">s 本身回文 → 1；否则 → 2（只差一次双指针判定）</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">例："ababa" → 1，"abb" → 2，"baabb" → 2，与「最长回文子序列」无关</text>
</svg>
