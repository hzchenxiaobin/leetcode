<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每条边的合法朝向是唯一的</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">删掉一条边，树分成含 0 与不含 0 两块；不含 0 的那块必须把这条边指向 0 一侧</text>

  <text x="190" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">原图：箭头 = 当前方向</text>
  <text x="560" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">目标：所有路线指向 0</text>

  <!-- 左侧：原图（0→1、1→3、4→5 需翻转；2→3、4→0 保留） -->
  <path d="M 167.6 248.9 L 121.4 198.1" stroke="#b85450" stroke-width="2.2" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 108 168 L 108 131" stroke="#b85450" stroke-width="2.2" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 198 112 L 127 112" stroke="#4a7a3a" stroke-width="2.2" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 238 262 L 199 262" stroke="#4a7a3a" stroke-width="2.2" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 268.2 248.7 L 308.8 204.3" stroke="#b85450" stroke-width="2.2" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="180" cy="262" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="108" cy="186" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="108" cy="112" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="216" cy="112" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="256" cy="262" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="322" cy="190" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#333">
    <text x="180" y="267" filter="url(#rough2)">0</text>
    <text x="108" y="191" filter="url(#rough2)">1</text>
    <text x="108" y="117" filter="url(#rough2)">3</text>
    <text x="216" y="117" filter="url(#rough2)">2</text>
    <text x="256" y="267" filter="url(#rough2)">4</text>
    <text x="322" y="195" filter="url(#rough2)">5</text>
  </g>

  <text x="190" y="312" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">红 = 背离 0，必须翻转</text>
  <text x="190" y="330" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">绿 = 已指向 0，保持不变</text>

  <!-- 右侧：改向后的同一棵树 -->
  <path d="M 478 204 L 535 246.5" stroke="#b85450" stroke-width="2.2" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 478 130 L 478 167" stroke="#b85450" stroke-width="2.2" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 568 112 L 496 112" stroke="#4a7a3a" stroke-width="2.2" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 626 262 L 570 262" stroke="#4a7a3a" stroke-width="2.2" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 676.3 203.4 L 641.1 248.8" stroke="#b85450" stroke-width="2.2" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="550" cy="262" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="478" cy="186" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="478" cy="112" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="586" cy="112" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="626" cy="262" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="692" cy="190" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#333">
    <text x="550" y="267" filter="url(#rough2)">0</text>
    <text x="478" y="191" filter="url(#rough2)">1</text>
    <text x="478" y="117" filter="url(#rough2)">3</text>
    <text x="586" y="117" filter="url(#rough2)">2</text>
    <text x="626" y="267" filter="url(#rough2)">4</text>
    <text x="692" y="195" filter="url(#rough2)">5</text>
  </g>

  <text x="560" y="312" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">正好改了 3 条：0→1、1→3、4→5</text>
  <text x="560" y="330" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">其余 2 条无需改动，答案 = 3</text>

  <!-- 底部结论框 -->
  <rect x="60" y="350" width="600" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="374" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么「直接计数」就是最优？</text>
  <text x="78" y="396" font-size="10.5" fill="#555" filter="url(#rough2)">目标方向由树的拓扑唯一确定 ⇒ 需翻转集合必为「原方向背离 0」的边集 F，|F| 是任何合法方案的下界。</text>
  <text x="78" y="416" font-size="10.5" fill="#555" filter="url(#rough2)">把 F 中的边全部翻转，其余边不动 ⇒ 每个点沿唯一路径走向 0，可行 ⇒ 下界可达到，答案恰为 |F|。</text>
  <text x="78" y="436" font-size="10.5" fill="#555" filter="url(#rough2)">于是问题化为：在原方向上，数出「从离 0 近的一端指向离 0 远的一端」的边有几条。</text>
</svg>
