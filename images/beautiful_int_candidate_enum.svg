<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="392" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">候选族：前缀 + 1，尾部清零</text>
  <text x="260" y="45" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">c_i = (⌊n/10^i⌋ + 1) × 10^i（以 n = 467、target = 6 为例）</text>

  <!-- legend -->
  <rect x="60" y="58" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="84" y="70" font-size="10.5" fill="#555" filter="url(#rough2)">保持的高位</text>
  <rect x="200" y="58" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="224" y="70" font-size="10.5" fill="#555" filter="url(#rough2)">前缀+1 产生的位</text>
  <rect x="345" y="58" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="369" y="70" font-size="10.5" fill="#555" filter="url(#rough2)">清零的尾 i 位</text>

  <!-- row i=0 -->
  <text x="45" y="115" font-size="11.5" fill="#333" filter="url(#rough2)">i = 0：(467+1)×1</text>
  <rect x="240" y="94" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="276" y="94" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="312" y="94" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="328" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="400" y="116" font-size="11.5" fill="#b85450" filter="url(#rough2)">位和 18 ✗</text>

  <!-- row i=1 -->
  <text x="45" y="177" font-size="11.5" fill="#333" filter="url(#rough2)">i = 1：(46+1)×10</text>
  <rect x="240" y="156" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="276" y="156" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="292" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="312" y="156" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="328" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="400" y="178" font-size="11.5" fill="#b85450" filter="url(#rough2)">位和 11 ✗</text>

  <!-- row i=2 (answer) -->
  <rect x="35" y="204" width="455" height="44" rx="6" fill="#e6f4ea" opacity="0.6" filter="url(#rough2)"/>
  <text x="45" y="239" font-size="11.5" fill="#333" filter="url(#rough2)">i = 2：(4+1)×100</text>
  <rect x="240" y="218" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="256" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="276" y="218" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="292" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="312" y="218" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="328" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="400" y="240" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">位和 5 ✓</text>
  <text x="400" y="258" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">← 答案 x = 33</text>

  <!-- row i=3 -->
  <text x="45" y="301" font-size="11.5" fill="#333" filter="url(#rough2)">i = 3：(0+1)×1000</text>
  <rect x="240" y="280" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="256" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="276" y="280" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="292" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="312" y="280" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="328" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="348" y="280" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="364" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="404" y="302" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">位和 1 ✓</text>
  <text x="404" y="320" font-size="10.5" fill="#888" filter="url(#rough2)">（可行但更大）</text>

  <!-- bottom notes -->
  <rect x="30" y="334" width="225" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="352" text-anchor="middle" font-size="10.8" fill="#333" filter="url(#rough2)">① c_i 单调不减（相邻差 ≥ 0）</text>
  <text x="142" y="369" text-anchor="middle" font-size="10.8" fill="#333" filter="url(#rough2)">→ 从低到高首个可行即最优</text>

  <rect x="265" y="334" width="225" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="352" text-anchor="middle" font-size="10.8" fill="#333" filter="url(#rough2)">② 前缀+1 自带进位链</text>
  <text x="377" y="369" text-anchor="middle" font-size="10.8" fill="#333" filter="url(#rough2)">如 n=4699 → c_2 = 4700</text>
</svg>
