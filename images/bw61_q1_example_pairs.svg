<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="62"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [3,2,1,5,4]，k = 2</text>

  <!-- 数组下标 -->
  <g filter="url(#rough2)">
    <rect x="80" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="128" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="176" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="224" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="272" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="104" y="92">3</text><text x="152" y="92">2</text>
    <text x="200" y="92">1</text><text x="248" y="92">5</text>
    <text x="296" y="92">4</text>
  </g>
  <text x="350" y="92" font-size="13" fill="#888" filter="url(#rough2)">→ 计数后每值恰 1 个</text>

  <!-- 桶 1..6 -->
  <g filter="url(#rough2)">
    <rect x="80" y="150" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="128" y="150" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="176" y="150" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="224" y="150" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="272" y="150" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="320" y="150" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="104" y="171">cnt1=1</text><text x="152" y="171">cnt2=1</text>
    <text x="200" y="171">cnt3=1</text><text x="248" y="171">cnt5=1</text>
    <text x="296" y="171">cnt4=1</text><text x="344" y="171">cnt6=0</text>
  </g>
  <text x="200" y="140" font-size="12" fill="#888" filter="url(#rough2)">桶下标（值 v）：</text>

  <!-- 三条命中配对 -->
  <path d="M 104 188 C 118 225, 190 225, 200 188" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="232" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">1↔3 ✓</text>
  <path d="M 152 188 C 168 210, 282 210, 296 188" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="214" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2↔4 ✓</text>
  <path d="M 200 188 C 220 200, 236 200, 248 190" fill="none" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="182" font-size="12" fill="#d6a040" filter="url(#rough2)">3↔5 ✓</text>
  <path d="M 296 188 C 312 198, 330 198, 344 188" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="360" y="205" font-size="12" fill="#b85450" filter="url(#rough2)">4↔6：cnt[6]=0 ✗</text>

  <!-- 结论框 -->
  <rect x="80" y="258" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="14" fill="#2d5a22" filter="url(#rough2)">ans = 1×1 + 1×1 + 1×1 + 1×0 = 3</text>
  <text x="280" y="303" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">对应数对 (3,1)、(3,5)、(2,4)</text>

  <text x="280" y="352" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">示例 1 同理：cnt[1]=2, cnt[2]=2，k=1 ⇒ 2×2 = 4</text>
</svg>
