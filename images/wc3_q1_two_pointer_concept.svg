<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect x="-8" y="-8" width="576" height="396" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">双指针贪心：t 上顺序扫描，s 只能向后推进</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = "abc"，t = "ahbgdc"：命中即前进，绝不回头</text>

  <text x="100" y="114" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="100" y="226" text-anchor="end" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">s</text>

  <g>
    <rect x="127" y="88" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="179" y="88" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="231" y="88" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="283" y="88" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="335" y="88" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="387" y="88" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="150" y="114" fill="#3a5a30" filter="url(#rough2)">a</text>
    <text x="202" y="114" fill="#3a4a66" filter="url(#rough2)">h</text>
    <text x="254" y="114" fill="#3a5a30" filter="url(#rough2)">b</text>
    <text x="306" y="114" fill="#3a4a66" filter="url(#rough2)">g</text>
    <text x="358" y="114" fill="#3a4a66" filter="url(#rough2)">d</text>
    <text x="410" y="114" fill="#3a5a30" filter="url(#rough2)">c</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#999">
    <text x="150" y="146" filter="url(#rough2)">0</text>
    <text x="202" y="146" filter="url(#rough2)">1</text>
    <text x="254" y="146" filter="url(#rough2)">2</text>
    <text x="306" y="146" filter="url(#rough2)">3</text>
    <text x="358" y="146" filter="url(#rough2)">4</text>
    <text x="410" y="146" filter="url(#rough2)">5</text>
  </g>

  <g>
    <rect x="201" y="200" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="257" y="200" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="313" y="200" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold" fill="#8a6a20">
    <text x="224" y="226" filter="url(#rough2)">a</text>
    <text x="280" y="226" filter="url(#rough2)">b</text>
    <text x="336" y="226" filter="url(#rough2)">c</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#999">
    <text x="224" y="258" filter="url(#rough2)">0</text>
    <text x="280" y="258" filter="url(#rough2)">1</text>
    <text x="336" y="258" filter="url(#rough2)">2</text>
  </g>

  <g fill="none" stroke="#4a7a3a" stroke-width="1.8">
    <path d="M 150 130 C 150 168, 222 162, 222 198" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 254 130 C 254 168, 278 164, 278 198" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 410 130 C 410 178, 338 168, 338 198" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <rect x="58" y="272" width="444" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="290" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">贪心不变量：i 之前的 s 字符已全部匹配，且匹配位置严格递增</text>
  <text x="72" y="306" font-size="10" fill="#555" filter="url(#rough2)">早匹配 → 留给后续字符的 t 后缀更长 → 越不可能错过后面的字符</text>

  <rect x="58" y="326" width="444" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="350" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">不等时只移动 j（跳过 t 里的多余字符）；i 走到 |s| 就是 true</text>
</svg>
