<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">DFS 流程：先结算，再把 (mn, mx) 传给两个孩子</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">按值传递，兄弟分支互不影响</text>
  <rect x="150.0" y="64.0" width="260.0" height="38.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="86.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dfs(u, mn, mx)</text>
  <path d="M 280.0 102.0 L 280.0 120.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="120.0" width="320.0" height="44.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="145.4" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans = max(ans, mx - u.val, u.val - mn)</text>
  <path d="M 280.0 164.0 L 280.0 182.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="182.0" width="260.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="200.5" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">nmn = min(mn, u.val)</text>
  <text x="280.0" y="214.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">nmx = max(mx, u.val)</text>
  <path d="M 280.0 226.0 L 280.0 244.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="244.0" width="260.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="267.4" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dfs(left, nmn, nmx)；dfs(right, ...)</text>
  <text x="25.0" y="314.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">进入时用父路径极值结算，天然满足「祖先 ≠ 自己」。</text>
</svg>
