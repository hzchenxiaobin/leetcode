  <text x="448" y="127" text-anchor="middle" font-size="13" fill="#333">9</text>
  <text x="488" y="127" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="528" y="127" text-anchor="middle" font-size="13" fill="#333">7</text>
  <text x="568" y="127" text-anchor="middle" font-size="13" fill="#333">5</text>
