    <rect x="350" y="104" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="390" y="104" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="430" y="104" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
