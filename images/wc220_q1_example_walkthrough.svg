  <text x="548" y="163" text-anchor="middle" font-size="11" fill="#8a6415">2-块</text>

  <text x="330" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">n = 13，13 mod 3 = 1 → 前 9 位每 3 一块，末 4 位拆 2 + 2</text>

  <path d="M 330 202 L 330 216" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="348" y="214" text-anchor="start" font-size="11" fill="#446688">join('-')</text>

