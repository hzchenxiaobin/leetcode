<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：number = "--17-5 229 35-39475 "</text>
  <path d="M 210 36 Q 330 44 450 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="650" y="50" text-anchor="end" font-size="10.5" fill="#999">· 表示空格，红色 = 待删除</text>

  <g filter="url(#sk)">
    <rect x="80" y="56" width="500" height="30" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <text x="330" y="76" text-anchor="middle" font-size="13" fill="#333">number = "<tspan fill="#b85450">--</tspan>17<tspan fill="#b85450">-</tspan>5<tspan fill="#b85450">·</tspan>229<tspan fill="#b85450">·</tspan>35<tspan fill="#b85450">-</tspan>39475<tspan fill="#b85450">·</tspan>"</text>

  <path d="M 330 88 L 330 100" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="348" y="98" text-anchor="start" font-size="11" fill="#446688">过滤：只保留数字</text>

  <g filter="url(#sk)">
    <rect x="70" y="104" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="110" y="104" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="150" y="104" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
