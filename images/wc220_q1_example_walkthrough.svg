  <text x="540" y="245" text-anchor="middle" font-size="13" fill="#333">75</text>

  <text x="330" y="292" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24">返回 "175-229-353-94-75" ✓</text>

  <g filter="url(#sk)">
    <rect x="70" y="312" width="520" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="330" y="340" text-anchor="middle" font-size="12" fill="#2e5a24">机械按 3 切到底 → "175-229-353-947-5"，末块孤 1，非法 ✗</text>
  <text x="330" y="364" text-anchor="middle" font-size="12" fill="#2e5a24">提前停在剩 4 位拆 2+2 → "175-229-353-94-75"，两个 2-块恰好合法 ✓</text>
</svg>
