    <path d="M 314 146 Q 368 152 422 146" stroke="#446688" stroke-width="1.3" fill="none"/>
    <path d="M 434 146 Q 468 151 502 146" stroke="#d6a040" stroke-width="1.3" fill="none"/>
    <path d="M 514 146 Q 548 151 582 146" stroke="#d6a040" stroke-width="1.3" fill="none"/>
  </g>
  <text x="88" y="127" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="128" y="127" text-anchor="middle" font-size="13" fill="#333">7</text>
  <text x="168" y="127" text-anchor="middle" font-size="13" fill="#333">5</text>
