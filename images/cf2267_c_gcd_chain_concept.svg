<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="440" fill="#fafafa"/>

  <text x="430" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：x 沿整除链单调下降，链的终点决定能整堆扫走哪些堆</text>
  <path d="M 96 40 Q 430 47 764 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 整除链：210 -> 70 -> 35 -> 7 -->
  <rect x="60" y="86" width="100" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="117" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">210</text>

  <path d="M 164 110 L 242 110" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="203" y="101" text-anchor="middle" font-size="12" fill="#6a6a6a" filter="url(#rough2)">取 70</text>

  <rect x="250" y="86" width="100" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="117" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">70</text>

  <path d="M 354 110 L 432 110" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="393" y="101" text-anchor="middle" font-size="12" fill="#6a6a6a" filter="url(#rough2)">取 105</text>

  <rect x="440" y="86" width="100" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="117" text-anchor="middle" font-size="17" fill="#8a6015" filter="url(#rough2)">35</text>

  <path d="M 544 110 L 622 110" stroke="#d6a040" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="583" y="101" text-anchor="middle" font-size="12" fill="#6a6a6a" filter="url(#rough2)">取 42</text>

  <rect x="630" y="86" width="100" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="680" y="117" text-anchor="middle" font-size="17" fill="#8c3b38" filter="url(#rough2)">7</text>

  <!-- 每个节点下的 S(r) -->
  <text x="110" y="160" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">S = 0</text>
  <text x="300" y="160" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">S = 70</text>
  <text x="490" y="160" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">S = 175</text>
  <text x="680" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3b38" filter="url(#rough2)">S = 217</text>
  <text x="110" y="178" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">(4 堆都取不动)</text>
  <text x="300" y="178" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">只含 70</text>
  <text x="490" y="178" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">70 + 105</text>
  <text x="680" y="178" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">70 + 105 + 42</text>

  <path d="M 60 198 Q 430 205 800 198" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="8 6" fill="none" filter="url(#rough2)"/>

  <!-- 下半部分：r = 7 时的整除判定 -->
  <text x="60" y="226" font-size="13" fill="#2b2b2b" filter="url(#rough2)">停在 r = 7 时，各堆能否被整堆取光：</text>

  <rect x="60" y="240" width="80" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="263" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">105</text>
  <rect x="152" y="240" width="80" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="192" y="263" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">70</text>
  <rect x="244" y="240" width="80" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="263" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">42</text>
  <rect x="336" y="240" width="80" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="376" y="263" text-anchor="middle" font-size="14" fill="#8c3b38" filter="url(#rough2)">30</text>

  <text x="100" y="296" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">✓ 取光</text>
  <text x="192" y="296" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">✓ 取光</text>
  <text x="284" y="296" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">✓ 取光</text>
  <text x="376" y="296" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">✗ 留下</text>

  <rect x="446" y="222" width="384" height="112" rx="10" fill="none" stroke="#a9a9a9" stroke-width="1.3"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="462" y="246" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">r = 7：105、70、42 都能整堆取光</text>
  <text x="462" y="268" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">217 = 105 + 70 + 42；30 与 7 互质，取不动</text>
  <text x="462" y="290" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">r | a_i ⟺ r | b_i（b_i = gcd(a_i, x)，且 r | x）</text>
  <text x="462" y="312" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">答案 = max{ S(r) : r ∈ R，r ≥ 2 }</text>

  <text x="430" y="366" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">每次 g = gcd(值, x) 都是当前 x 的约数，所以 x 只会在约数链上往下走，可达值不超过 180 个</text>
  <text x="430" y="392" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">链越深，"r 的倍数" 这个集合越大，收益只增不减 ⇒ 枚举每个可达 r 再取最大即可</text>
  <text x="430" y="418" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">（先取 105 会停在 x=105，只能拿 105；所以要把所有可达 r 都比一遍，不能只顺着一条链走）</text>
</svg>
