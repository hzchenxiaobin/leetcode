<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：mat = [[1,2,3],[4,5,6],[7,8,9]]</text>
  <text x="270" y="43" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">格内小字是输出序号；偶数 d 反向取，奇数 d 正向取</text>

  <g filter="url(#rough2)">
    <!-- i = 0 : d = 0,1,2 -->
    <rect x="60" y="80" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="124" y="80" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="188" y="80" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <!-- i = 1 -->
    <rect x="60" y="144" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="124" y="144" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="188" y="144" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <!-- i = 2 -->
    <rect x="60" y="208" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="124" y="208" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="188" y="208" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="18" text-anchor="middle" font-weight="bold" fill="#3a4a66">
    <text x="92" y="124">1</text>
    <text x="156" y="124" fill="#8a5a20">2</text>
    <text x="220" y="124">3</text>
    <text x="92" y="188" fill="#8a5a20">4</text>
    <text x="156" y="188">5</text>
    <text x="220" y="188" fill="#8a5a20">6</text>
    <text x="92" y="252">7</text>
    <text x="156" y="252" fill="#8a5a20">8</text>
    <text x="220" y="252" fill="#3a5a30">9</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#b85450" font-weight="bold">
    <text x="68" y="98">1</text>
    <text x="132" y="98">2</text>
    <text x="196" y="98">6</text>
    <text x="68" y="162">3</text>
    <text x="132" y="162">5</text>
    <text x="196" y="162">7</text>
    <text x="68" y="226">4</text>
    <text x="132" y="226">8</text>
    <text x="196" y="226">9</text>
  </g>

  <text x="270" y="292" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每个格子的红字 = 它是输出数组中的第几个元素</text>

  <g filter="url(#rough2)">
    <rect x="276" y="84" width="240" height="150" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="10" opacity="0.96"/>
    <text x="290" y="106" font-size="11" fill="#444" font-weight="bold">逐条拼接：</text>
    <text x="290" y="130" font-size="10.5" fill="#3a4a66">d = 0（偶）→ 1</text>
    <text x="290" y="152" font-size="10.5" fill="#8a5a20">d = 1（奇）→ 2, 4</text>
    <text x="290" y="174" font-size="10.5" fill="#3a4a66">d = 2（偶）→ 7, 5, 3</text>
    <text x="290" y="196" font-size="10.5" fill="#8a5a20">d = 3（奇）→ 6, 8</text>
    <text x="290" y="218" font-size="10.5" fill="#3a4a66">d = 4（偶）→ 9</text>
  </g>

  <text x="270" y="318" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">输出数组（长度 m · n = 9）</text>

  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="62" y="330" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="110" y="330" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="158" y="330" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="206" y="330" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="254" y="330" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="302" y="330" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="350" y="330" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="398" y="330" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="446" y="330" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="84" y="359" fill="#3a4a66">1</text>
    <text x="132" y="359" fill="#8a5a20">2</text>
    <text x="180" y="359" fill="#8a5a20">4</text>
    <text x="228" y="359" fill="#3a4a66">7</text>
    <text x="276" y="359" fill="#3a4a66">5</text>
    <text x="324" y="359" fill="#3a4a66">3</text>
    <text x="372" y="359" fill="#8a5a20">6</text>
    <text x="420" y="359" fill="#8a5a20">8</text>
    <text x="468" y="359" fill="#3a5a30">9</text>
  </g>

  <g filter="url(#rough2)" font-size="8.5" text-anchor="middle" fill="#aaa">
    <text x="84" y="388">0</text>
    <text x="132" y="388">1</text>
    <text x="180" y="388">2</text>
    <text x="228" y="388">3</text>
    <text x="276" y="388">4</text>
    <text x="324" y="388">5</text>
    <text x="372" y="388">6</text>
    <text x="420" y="388">7</text>
    <text x="468" y="388">8</text>
  </g>

  <text x="270" y="418" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">蓝 = d 偶数（先出最下方的格子），黄 = d 奇数（先出最上方的格子），每格恰好一次</text>
</svg>
