<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="590" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：从左到右贪心，每个 '?' 只试 a / b / c</text>

  <g filter="url(#rough2)">
    <rect x="185" y="48" width="130" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">开始</text>

    <path d="M 250 86 C 250 94 250 100 250 106" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="140" y="110" width="220" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="137" text-anchor="middle" font-size="12.5" fill="#2b4a66">i = 0 … n−1 从左到右扫描</text>

    <path d="M 250 154 C 250 160 250 166 250 170" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <polygon points="250,174 360,216 250,258 140,216" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">s[i] == '?'</text>

    <path d="M 360 216 L 443 216" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="398" y="208" text-anchor="middle" font-size="11" fill="#555">否</text>

    <rect x="445" y="194" width="155" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="522" y="221" text-anchor="middle" font-size="12" fill="#3a5a3a">跳过，原字符不动</text>

    <path d="M 522 194 C 522 155 470 130 366 130" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)"/>
    <text x="494" y="152" font-size="10.5" fill="#888">看下一位 i+1</text>

    <path d="M 250 258 C 250 268 250 276 250 280" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="260" y="274" font-size="11" fill="#555">是</text>

    <rect x="130" y="284" width="240" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="311" text-anchor="middle" font-size="12.5" fill="#b07818">依次尝试 c ∈ {'a','b','c'}</text>

    <path d="M 250 328 C 250 336 250 342 250 346" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <polygon points="250,350 372,398 250,446 128,398" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="393" text-anchor="middle" font-size="12" fill="#b07818">左邻 ≠ c 且</text>
    <text x="250" y="411" text-anchor="middle" font-size="12" fill="#b07818">右邻 ≠ c ？</text>

    <rect x="405" y="374" width="215" height="48" rx="6" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="512" y="394" text-anchor="middle" font-size="10" fill="#b07818">边界短路：i==0 无左邻，</text>
    <text x="512" y="410" text-anchor="middle" font-size="10" fill="#b07818">i==n−1 无右邻 → 自动成立</text>

    <path d="M 128 398 L 108 398" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="118" y="390" text-anchor="middle" font-size="10" fill="#555">否</text>

    <rect x="3" y="376" width="100" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="53" y="403" text-anchor="middle" font-size="11.5" fill="#b85450">试下一个 c</text>

    <path d="M 53 376 C 53 330 95 306 124 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)"/>

    <path d="M 250 446 C 250 456 250 464 250 468" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="260" y="462" font-size="11" fill="#555">是</text>

    <rect x="130" y="472" width="240" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="250" y="499" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a3a">填入 s[i] = c，break</text>

    <path d="M 250 516 C 250 524 250 530 250 534" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="140" y="538" width="220" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="563" text-anchor="middle" font-size="12" fill="#2b4a66">i++ 继续；扫描结束返回 s</text>
  </g>
</svg>
