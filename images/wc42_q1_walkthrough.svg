<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：nums = [1, 2, 2, 4]</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">n = 4，x = 4 ⊕ 5 = 1，low = 1；按第 0 位分两个桶</text>

  <rect x="30" y="62" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="90" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="275" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">计算</text>
  <text x="460" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">结果</text>

  <line x1="150" y1="62" x2="150" y2="318" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="400" y1="62" x2="400" y2="318" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="30" y="90" width="500" height="38" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="114" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">① 理想集</text>
  <text x="275" y="114" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1 ⊕ 2 ⊕ 3 ⊕ 4</text>
  <text x="460" y="114" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">4</text>

  <rect x="30" y="128" width="500" height="38" fill="#f7f9fc" stroke="#dddddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="152" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">② nums</text>
  <text x="275" y="152" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1 ⊕ 2 ⊕ 2 ⊕ 4</text>
  <text x="460" y="152" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">5</text>

  <rect x="30" y="166" width="500" height="38" fill="#fff8e1" stroke="#e0c27a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="190" text-anchor="middle" font-size="10.5" fill="#6a4a10" filter="url(#rough2)">③ 合并 x</text>
  <text x="275" y="190" text-anchor="middle" font-size="10.5" fill="#6a4a10" filter="url(#rough2)">4 ⊕ 5</text>
  <text x="460" y="190" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0b001</text>

  <rect x="30" y="204" width="500" height="38" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="228" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">④ 桶 bit=1</text>
  <text x="275" y="228" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1 ⊕ 3 ⊕ 1</text>
  <text x="460" y="228" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">a = 3</text>

  <rect x="30" y="242" width="500" height="38" fill="#f7f9fc" stroke="#dddddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="266" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">⑤ 桶 bit=0</text>
  <text x="275" y="266" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2 ⊕ 4 ⊕ 2 ⊕ 2 ⊕ 4</text>
  <text x="460" y="266" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">b = 2</text>

  <rect x="30" y="280" width="500" height="38" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="304" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">⑥ 判定</text>
  <text x="275" y="304" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3 不在 nums，2 在 nums</text>
  <text x="460" y="304" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[2, 3]</text>

  <rect x="120" y="330" width="320" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 [2, 3]：2 重复、3 缺失</text>
</svg>
