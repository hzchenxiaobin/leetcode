<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">省时账本：硬磨 nums[v]+1 秒 vs 一键清零 2 秒</text>

  <!-- 路线 A：硬磨 -->
  <rect x="18" y="44" width="232" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="66" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">路线 A · 硬磨（不碰清零）</text>

  <rect x="32" y="78" width="30" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="66" y="78" width="30" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="78" width="30" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="134" y="78" width="30" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="180" y="78" width="58" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="47" y="95" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">−1</text>
  <text x="81" y="95" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">−1</text>
  <text x="115" y="95" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">⋯</text>
  <text x="149" y="95" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">−1</text>
  <text x="209" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">标记</text>

  <text x="134" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">nums[v] 次减 1 + 1 次标记</text>
  <text x="134" y="144" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">成本 = nums[v] + 1 秒</text>

  <!-- 路线 B：清零 -->
  <rect x="270" y="44" width="232" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="386" y="66" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">路线 B · 一键清零（本题灵魂）</text>

  <rect x="288" y="78" width="86" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="396" y="78" width="86" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="331" y="95" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">清零→0</text>
  <text x="439" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">标记</text>

  <path d="M374,91 L396,91" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="386" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 次清零 + 1 次标记（标记必须更晚）</text>
  <text x="386" y="144" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">成本 = 2 秒，净省 nums[v] − 1 秒</text>

  <!-- 基准账本框 -->
  <rect x="18" y="168" width="484" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="190" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">基准账：total = Σnums + n（全硬磨 + n 次标记）</text>
  <text x="34" y="210" font-size="12" fill="#333" filter="url(#rough2)">每启用一个清零：total −= (nums[v] − 1)，目标把 total 压到 ≤ x</text>
  <text x="34" y="228" font-size="12" fill="#333" filter="url(#rough2)">清零只能打在满足 changeIndices[s] = v 的秒上 → 每个下标一份「候选资格」</text>

  <!-- 警示框 -->
  <rect x="18" y="244" width="484" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="266" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ nums[v] = 0：清零倒赔 1 秒（净省 −1），跳过；nums[v] = 1：净省 0，白忙</text>
  <text x="34" y="288" font-size="12" fill="#b85450" filter="url(#rough2)">nums[i] 高达 10^9，硬磨不现实——清零是大值的唯一出路，这就是 II 升为困难的原因</text>

  <!-- 结论框 -->
  <rect x="18" y="310" width="484" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="335" font-size="12.5" fill="#446688" filter="url(#rough2)">⇒ 问题变形：挑一个「清零集合」，在名额约束下让 total 最小（名额约束见下图）</text>
</svg>
