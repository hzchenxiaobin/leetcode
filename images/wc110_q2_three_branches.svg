<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 362" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="362" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">rangeSumBST(node) 的三个分支</text>
  <rect x="96" y="48" width="328" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12.5" fill="#333333" filter="url(#rough2)">空节点 / 当前 node</text>
  <path d="M 260 84 L 260 104" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="146" y="104" width="228" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">low ≤ val ≤ high ?</text>
  <path d="M 146 138 L 96 176" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 374 138 L 424 176" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="24" y="176" width="148" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">val 计入答案</text>
  <text x="98" y="218" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">左右子树都递归</text>
  <text x="98" y="238" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（剪不掉）</text>
  <rect x="20" y="288" width="200" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">val < low</text>
  <text x="120" y="328" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">只递归右子树</text>
  <rect x="300" y="176" width="208" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="198" text-anchor="middle" font-size="12" fill="#a9761f" font-weight="bold" filter="url(#rough2)">val > high</text>
  <text x="404" y="218" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">只递归左子树</text>
  <rect x="300" y="288" width="208" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="308" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">合法区间内</text>
  <text x="404" y="328" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">val + 左 + 右 三处相加</text>
</svg>
