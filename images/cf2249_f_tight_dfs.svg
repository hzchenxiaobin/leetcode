<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#fafafa"/>
  <text x="28" y="34" font-size="17" fill="#22333b" filter="url(#rough2)">构造：在 tight 状态上 DFS，遇到重复顶点就回溯换分支</text>
  <text x="28" y="58" font-size="13" fill="#666" filter="url(#rough2)">只允许走“前缀是最短路”的状态；用 used 禁止重复顶点</text>
  <line x1="74" y1="150" x2="176" y2="96" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="70" y1="168" x2="110" y2="228" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="128" y1="236" x2="218" y2="244" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="232" y1="234" x2="288" y2="174" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="214" y1="232" x2="190" y2="104" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="140" y1="232" x2="180" y2="110" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="290" y1="160" x2="198" y2="100" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="62" cy="152" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="62" y="156.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <circle cx="186" cy="90" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="186" y="94.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <circle cx="116" cy="242" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="116" y="246.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">5</text>
  <circle cx="232" cy="250" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="232" y="254.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <circle cx="300" cy="168" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="172.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <text x="40" y="200" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">起点</text>
  <text x="196" y="68" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">终点</text>
  <text x="360" y="200" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" filter="url(#rough2)">D = 4（偶）</text>
  <text x="360" y="224" font-size="11.5" fill="#555" text-anchor="start" font-weight="normal" filter="url(#rough2)">边长 (1,4) (1,5) (2,3)</text>
  <text x="360" y="244" font-size="11.5" fill="#555" text-anchor="start" font-weight="normal" filter="url(#rough2)">(2,4) (3,4) (3,5)</text>
  <text x="470" y="92" font-size="12.5" fill="#b85450" text-anchor="start" font-weight="normal" filter="url(#rough2)">沿 BFS 父亲：1→4→2→3→4（4 重复）✗</text>
  <rect x="480" y="108" width="46" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="503" y="131" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <line x1="528" y1="125" x2="550" y2="125" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" opacity="1.0" filter="url(#rough2)"/>
  <rect x="554" y="108" width="46" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="577" y="131" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <line x1="602" y1="125" x2="624" y2="125" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" opacity="1.0" filter="url(#rough2)"/>
  <rect x="628" y="108" width="46" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="651" y="131" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <line x1="676" y1="125" x2="698" y2="125" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" opacity="1.0" filter="url(#rough2)"/>
  <rect x="702" y="108" width="46" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="725" y="131" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <line x1="750" y1="125" x2="772" y2="125" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" opacity="1.0" filter="url(#rough2)"/>
  <rect x="776" y="108" width="46" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="799" y="131" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <text x="470" y="196" font-size="12.5" fill="#4a7a3a" text-anchor="start" font-weight="normal" filter="url(#rough2)">换分支：1→5→3→2→4（简单）✓</text>
  <rect x="480" y="212" width="46" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="503" y="235" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <line x1="528" y1="229" x2="550" y2="229" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" opacity="1.0" filter="url(#rough2)"/>
  <rect x="554" y="212" width="46" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="577" y="235" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">5</text>
  <line x1="602" y1="229" x2="624" y2="229" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" opacity="1.0" filter="url(#rough2)"/>
  <rect x="628" y="212" width="46" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="651" y="235" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <line x1="676" y1="229" x2="698" y2="229" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" opacity="1.0" filter="url(#rough2)"/>
  <rect x="702" y="212" width="46" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="725" y="235" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <line x1="750" y1="229" x2="772" y2="229" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" opacity="1.0" filter="url(#rough2)"/>
  <rect x="776" y="212" width="46" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="799" y="235" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <text x="470" y="272" font-size="11.5" fill="#777" text-anchor="start" font-weight="normal" filter="url(#rough2)">层号  0    1    2    3    4</text>
  <rect x="28" y="296" width="824" height="126" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="324" font-size="12.5" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">tight(x,p)：d(起点→x，奇偶 p) = 当前层数，且 d(x→终点，剩余奇偶) = 剩余层数</text>
  <text x="44" y="352" font-size="12.5" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">DFS 只在 tight 状态间转移；终点只允许最后一步进入，其余顶点用 used 标记禁止重访</text>
  <text x="44" y="380" font-size="12.5" fill="#4a7a3a" text-anchor="start" font-weight="normal" filter="url(#rough2)">引理 2 保证存在长度 D 的简单路径，且其每条前缀都是最短路 ⇒ DFS 一定能搜到它</text>
  <text x="44" y="404" font-size="12" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">实测回溯极少：tight 图只有 2n 个状态，绝大多数时刻第一条分支就成功</text>
</svg>
