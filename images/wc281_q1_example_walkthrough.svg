<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：num = 30 → 14 个</text>
  <path d="M 150 38 Q 300 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Legend -->
  <rect x="470" y="16" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="492" y="28" font-size="11" fill="#444" filter="url(#rough2)">数字和为偶</text>
  <rect x="566" y="16" width="14" height="14" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="588" y="28" font-size="11" fill="#444" filter="url(#rough2)">奇</text>

  <!-- Row 1: 1..10 -->
  <g filter="url(#rough2)">
    <rect x="36" y="56" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="82" y="56" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="128" y="56" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="174" y="56" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="220" y="56" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="266" y="56" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="312" y="56" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="358" y="56" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="404" y="56" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="450" y="56" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="59" y="72">1</text><text x="59" y="86" font-size="8.5" fill="#999">和 1</text>
    <text x="105" y="72" font-weight="bold" fill="#2e6e2e">2</text><text x="105" y="86" font-size="8.5" fill="#4a7a3a">和 2 ✓</text>
    <text x="151" y="72">3</text><text x="151" y="86" font-size="8.5" fill="#999">和 3</text>
    <text x="197" y="72" font-weight="bold" fill="#2e6e2e">4</text><text x="197" y="86" font-size="8.5" fill="#4a7a3a">和 4 ✓</text>
    <text x="243" y="72">5</text><text x="243" y="86" font-size="8.5" fill="#999">和 5</text>
    <text x="289" y="72" font-weight="bold" fill="#2e6e2e">6</text><text x="289" y="86" font-size="8.5" fill="#4a7a3a">和 6 ✓</text>
    <text x="335" y="72">7</text><text x="335" y="86" font-size="8.5" fill="#999">和 7</text>
    <text x="381" y="72" font-weight="bold" fill="#2e6e2e">8</text><text x="381" y="86" font-size="8.5" fill="#4a7a3a">和 8 ✓</text>
    <text x="427" y="72">9</text><text x="427" y="86" font-size="8.5" fill="#999">和 9</text>
    <text x="473" y="72">10</text><text x="473" y="86" font-size="8.5" fill="#999">和 1</text>
  </g>
  <text x="530" y="72" font-size="11" fill="#2e6e2e" filter="url(#rough2)">1~10：</text>
  <text x="530" y="88" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">4 个</text>

  <!-- Row 2: 11..20 -->
  <g filter="url(#rough2)">
    <rect x="36" y="104" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="82" y="104" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="128" y="104" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="174" y="104" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="220" y="104" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="266" y="104" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="312" y="104" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="358" y="104" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="404" y="104" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="450" y="104" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="59" y="120" font-weight="bold" fill="#2e6e2e">11</text><text x="59" y="134" font-size="8.5" fill="#4a7a3a">和 2 ✓</text>
    <text x="105" y="120">12</text><text x="105" y="134" font-size="8.5" fill="#999">和 3</text>
    <text x="151" y="120" font-weight="bold" fill="#2e6e2e">13</text><text x="151" y="134" font-size="8.5" fill="#4a7a3a">和 4 ✓</text>
    <text x="197" y="120">14</text><text x="197" y="134" font-size="8.5" fill="#999">和 5</text>
    <text x="243" y="120" font-weight="bold" fill="#2e6e2e">15</text><text x="243" y="134" font-size="8.5" fill="#4a7a3a">和 6 ✓</text>
    <text x="289" y="120">16</text><text x="289" y="134" font-size="8.5" fill="#999">和 7</text>
    <text x="335" y="120" font-weight="bold" fill="#2e6e2e">17</text><text x="335" y="134" font-size="8.5" fill="#4a7a3a">和 8 ✓</text>
    <text x="381" y="120">18</text><text x="381" y="134" font-size="8.5" fill="#999">和 9</text>
    <text x="427" y="120" font-weight="bold" fill="#2e6e2e">19</text>
    <text x="427" y="134" font-size="8.5" fill="#4a7a3a">和 10 ✓</text>
    <text x="473" y="120" font-weight="bold" fill="#2e6e2e">20</text><text x="473" y="134" font-size="8.5" fill="#4a7a3a">和 2 ✓</text>
  </g>
  <text x="530" y="120" font-size="11" fill="#2e6e2e" filter="url(#rough2)">11~20：</text>
  <text x="530" y="136" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6 个</text>

  <!-- Row 3: 21..30 -->
  <g filter="url(#rough2)">
    <rect x="36" y="152" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="82" y="152" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="128" y="152" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="174" y="152" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="220" y="152" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="266" y="152" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="312" y="152" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="358" y="152" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="404" y="152" width="46" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="450" y="152" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="59" y="168">21</text><text x="59" y="182" font-size="8.5" fill="#999">和 3</text>
    <text x="105" y="168" font-weight="bold" fill="#2e6e2e">22</text><text x="105" y="182" font-size="8.5" fill="#4a7a3a">和 4 ✓</text>
    <text x="151" y="168">23</text><text x="151" y="182" font-size="8.5" fill="#999">和 5</text>
    <text x="197" y="168" font-weight="bold" fill="#2e6e2e">24</text><text x="197" y="182" font-size="8.5" fill="#4a7a3a">和 6 ✓</text>
    <text x="243" y="168">25</text><text x="243" y="182" font-size="8.5" fill="#999">和 7</text>
    <text x="289" y="168" font-weight="bold" fill="#2e6e2e">26</text><text x="289" y="182" font-size="8.5" fill="#4a7a3a">和 8 ✓</text>
    <text x="335" y="168">27</text><text x="335" y="182" font-size="8.5" fill="#999">和 9</text>
    <text x="381" y="168" font-weight="bold" fill="#2e6e2e">28</text><text x="381" y="182" font-size="8.5" fill="#4a7a3a">和 10 ✓</text>
    <text x="427" y="168">29</text><text x="427" y="182" font-size="8.5" fill="#999">和 11</text>
    <text x="473" y="168" font-weight="bold" fill="#8a6d1f">30</text><text x="473" y="182" font-size="8.5" fill="#d6a040">和 3 ✗</text>
  </g>
  <text x="530" y="168" font-size="11" fill="#2e6e2e" filter="url(#rough2)">21~30：</text>
  <text x="530" y="184" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">4 个</text>

  <!-- Carry callout -->
  <rect x="36" y="204" width="460" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="266" y="221" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠ 注意 17 ✓ → 18 ✗ → 19 ✓ → 20 ✓：19 与 20 相邻都是绿</text>
  <text x="266" y="237" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">进位使数字和 10→2，奇偶不翻转 —— 这正是奇数打头配对失效的地方</text>

  <!-- Pair counting box -->
  <rect x="36" y="256" width="460" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="266" y="277" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">配对清点：{2,3} {4,5} {6,7} … {28,29} 共 14 对，每对恰 1 个绿</text>
  <text x="266" y="296" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">首对 {0,1} 的绿是 0 本身，不在 [1,30] 内 → 不计；30 自身 ds=3 奇 → 不加分</text>

  <!-- Formula verification box -->
  <rect x="36" y="320" width="460" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="266" y="342" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">O(1) 公式验证：num = 30（偶），ds(30) = 3（奇）</text>
  <text x="266" y="363" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">ans = 30 / 2 − 1 = 14 ✓（与逐格清点 4 + 6 + 4 = 14 一致）</text>

  <!-- Bottom note -->
  <rect x="36" y="388" width="460" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="266" y="407" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">反直觉点：19（奇数）数字和 10 为偶；10（偶数）数字和 1 为奇</text>
</svg>
