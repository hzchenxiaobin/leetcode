<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：命中 target 与"越过" target</text>
  <path d="M 270 40 Q 470 48 670 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: example 1, true ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="58" width="860" height="220" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="64" y="86" font-size="14" font-weight="bold" fill="#2e6e2e">示例 1：grid = [[1,4],[2,3]] → true</text>

  <!-- 2x2 grid, cell 54, origin (110,106) -->
  <g filter="url(#sk)"><rect x="110" y="106" width="54" height="54" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="164" y="106" width="54" height="54" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="110" y="160" width="54" height="54" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="164" y="160" width="54" height="54" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
  <text x="137" y="140" text-anchor="middle" font-size="17" fill="#333">1</text>
  <text x="191" y="140" text-anchor="middle" font-size="17" fill="#333">4</text>
  <text x="137" y="194" text-anchor="middle" font-size="17" fill="#333">2</text>
  <text x="191" y="194" text-anchor="middle" font-size="17" fill="#333">3</text>
  <path d="M 86 160 L 246 160" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <text x="96" y="100" font-size="11" fill="#888">行0</text>
  <text x="96" y="230" font-size="11" fill="#888">行1</text>

  <!-- prefix track -->
  <text x="300" y="112" font-size="12" font-weight="bold" fill="#2b6e9e">total = 1+4+2+3 = 10（偶数）→ target = 5</text>
  <text x="300" y="140" font-size="12" fill="#444" font-family="monospace">行前缀扫描：pref = rowSum[0] = 1+4 = 5</text>
  <g filter="url(#sk)"><ellipse cx="392" cy="164" rx="46" ry="17" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="392" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">pref = 5 ✓</text>
  <path d="M 300 152 L 342 158" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arG)"/>
  <text x="300" y="200" font-size="12" fill="#444">pref == target → 第 0 行后水平切分：上半 5，下半 2+3 = 5</text>
  <text x="300" y="224" font-size="13" font-weight="bold" fill="#2e6e2e">两非空部分和相等 → 返回 true ✓</text>
  <text x="300" y="252" font-size="11" fill="#888">注：m = 2 时水平切点只有 1 个（第 0 行后）；这里恰好命中</text>

  <!-- ===== Panel B: example 2, false ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="296" width="860" height="238" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="64" y="324" font-size="14" font-weight="bold" fill="#8e3a36">示例 2：grid = [[1,3],[2,4]] → false</text>

  <!-- 2x2 grid, cell 54, origin (110,344) -->
  <g filter="url(#sk)"><rect x="110" y="344" width="54" height="54" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="164" y="344" width="54" height="54" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="110" y="398" width="54" height="54" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="164" y="398" width="54" height="54" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="4"/></g>
  <text x="137" y="378" text-anchor="middle" font-size="17" fill="#333">1</text>
  <text x="191" y="378" text-anchor="middle" font-size="17" fill="#333">3</text>
  <text x="137" y="432" text-anchor="middle" font-size="17" fill="#333">2</text>
  <text x="191" y="432" text-anchor="middle" font-size="17" fill="#333">4</text>
  <path d="M 86 398 L 246 398" stroke="#c98a2b" stroke-width="2.2" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <path d="M 164 320 L 164 478" stroke="#c98a2b" stroke-width="2.2" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <text x="252" y="392" font-size="11" fill="#c98a2b" font-weight="bold">水平切点：上半 = 1+3 = 4 ≠ 5 ✗</text>
  <text x="96" y="496" font-size="11" fill="#c98a2b" font-weight="bold">垂直切点：左半 = 1+2 = 3 ≠ 5 ✗</text>

  <!-- number line showing jump over target -->
  <text x="330" y="360" font-size="12" font-weight="bold" fill="#2b6e9e">total = 10 → target = 5，但前缀"跳过"了 5：</text>
  <g filter="url(#sk)">
    <path d="M 360 400 L 700 400" stroke="#888" stroke-width="1.6" fill="none"/>
  </g>
  <g filter="url(#sk)"><circle cx="390" cy="400" r="5" fill="#4a8e4a"/></g>
  <text x="390" y="386" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">4</text>
  <text x="390" y="422" text-anchor="middle" font-size="10" fill="#888">行前缀</text>
  <g filter="url(#sk)"><circle cx="470" cy="400" r="5" fill="#4a8e4a"/></g>
  <text x="470" y="386" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">3</text>
  <text x="470" y="422" text-anchor="middle" font-size="10" fill="#888">列前缀</text>
  <g filter="url(#sk)"><path d="M 530 394 L 530 406 M 536 394 L 536 406" stroke="#b85450" stroke-width="2"/></g>
  <text x="533" y="386" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <text x="533" y="422" text-anchor="middle" font-size="10" fill="#b85450">target</text>
  <g filter="url(#sk)"><circle cx="660" cy="400" r="5" fill="#b85450"/></g>
  <text x="660" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <text x="660" y="422" text-anchor="middle" font-size="10" fill="#888">补满全矩阵</text>
  <path d="M 396 400 Q 533 372 652 398" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="330" y="452" font-size="12" fill="#444">前缀严格递增：4 →（下一行）10，3 →（下一列）10，直接越过 5</text>
  <text x="330" y="478" font-size="12" fill="#444">且切满所有行/列会让另一部分为空，不是合法切点</text>
  <text x="330" y="506" font-size="13" font-weight="bold" fill="#8e3a36">两个方向都无切点命中 target → 返回 false ✗</text>
</svg>
