<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="800" height="700" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一趟双指针，能匹配就匹配</text>
  <path d="M 250 40 Q 400 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <rect x="170" y="52" width="240" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">输入 s（长 n）、t（长 m）</text>
  <path d="M 290 92 L 290 108" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="170" y="112" width="240" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="133" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">i = 0，j = 0</text>
  <text x="290" y="152" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（j 同时记录已匹配前缀长度）</text>
  <path d="M 290 162 L 290 178" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：越界？ -->
  <polygon points="290,184 414,238 290,292 166,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="233" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#rough2)">i &lt; n 且</text>
  <text x="290" y="253" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">j &lt; m ?</text>
  <path d="M 414 238 L 552 238" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="556" y="214" width="180" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="646" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">返回 m − j</text>
  <text x="646" y="252" text-anchor="middle" font-size="10.5" fill="#8e3030" filter="url(#rough2)">（最少追加字符数）</text>
  <text x="646" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8e5db8" filter="url(#rough2)">j 即 k*（贪心最优，见 §5）</text>
  <path d="M 290 292 L 290 324" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="316" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 判定 2：字符相等？ -->
  <polygon points="290,330 420,384 290,438 160,384" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="389" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">s[i] == t[j] ?</text>
  <path d="M 290 438 L 290 460" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="454" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 420 384 L 570 384 L 570 560 L 402 560" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="495" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- j++ -->
  <rect x="185" y="464" width="210" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="491" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">j++（匹配 t[j]，前缀推进）</text>
  <path d="M 290 508 L 290 532" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="185" y="536" width="210" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="563" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">i++（s 前进，永不回退）</text>
  <path d="M 185 558 L 80 558 L 80 238 L 156 238" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="398" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">继续</text>
  <text x="88" y="414" font-size="10" fill="#4a7a3a" filter="url(#rough2)">循环</text>

  <!-- 底部说明 -->
  <rect x="110" y="612" width="580" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="636" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">i、j 都只前进不回退：总步数 ≤ n + m ⇒ 时间 O(n + m)，额外空间 O(1)</text>
  <text x="400" y="658" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">「能匹配就匹配」由交换论证保证不劣 —— 详见题解 §5 引理 1</text>
</svg>
