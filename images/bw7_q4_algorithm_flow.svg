<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="181"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：加源点 → 排序 → Kruskal</text>

  <!-- 步骤 1 -->
  <rect x="100" y="50" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#2a4a68" filter="url(#rough2)">① 建边集：井边 (wells[i], 0, i+1) + 管道边</text>
  <text x="280" y="87" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">共 n + m 条边，节点 0..n</text>

  <path d="M 280 94 L 280 114" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="100" y="116" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">② 全部边按费用升序排序</text>

  <path d="M 280 156 L 280 176" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="100" y="178" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="203" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">③ 初始化并查集 fa[i] = i</text>

  <path d="M 280 218 L 280 238" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 4：循环 -->
  <rect x="70" y="240" width="420" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="13" fill="#8c3a34" filter="url(#rough2)">④ 逐边考察 (c,u,v)：find(u) ≠ find(v) 则</text>
  <text x="280" y="286" text-anchor="middle" font-size="12.5" fill="#8c3a34" filter="url(#rough2)">合并、total += c、used++；used == n 时终止</text>

  <path d="M 280 300 L 280 316" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="200" y="318" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="12.5" fill="#2a4a68" font-weight="bold" filter="url(#rough2)">⑤ 返回 total</text>
</svg>
