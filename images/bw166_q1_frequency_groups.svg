<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="390" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按频率分桶：一个频率 = 一个频率组，取字符最多的桶</text>
  <text x="290" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = "aaabbbccdddde"   频率：a=3, b=3, c=2, d=4, e=1</text>
  <rect x="60" y="166" width="56" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="88" y="262" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">频率 3</text>
  <text x="88" y="290" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="156" y="166" width="56" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="184" y="262" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">频率 3</text>
  <text x="184" y="290" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="252" y="200" width="56" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">频率 2</text>
  <text x="280" y="290" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="348" y="132" width="56" height="136" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="376" y="262" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">频率 4</text>
  <text x="376" y="290" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="444" y="234" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="472" y="262" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">频率 1</text>
  <text x="472" y="290" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">e</text>
  <path d="M 44 268 L 540 268" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="52" y="310" width="116" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="330" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k=1  {e}</text>
  <text x="110" y="350" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">组大小 1</text>
  <rect x="184" y="310" width="116" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="242" y="330" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k=2  {c}</text>
  <text x="242" y="350" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">组大小 1</text>
  <rect x="316" y="310" width="116" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="374" y="330" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">k=3  {a,b}</text>
  <text x="374" y="350" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">组大小 2  ← 最大</text>
  <rect x="448" y="310" width="116" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="506" y="330" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k=4  {d}</text>
  <text x="506" y="350" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">组大小 1</text>
</svg>
