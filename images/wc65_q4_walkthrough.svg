<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="370" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 走查：intervals = [[1,3], [1,4], [2,5], [3,5]]</text>
  <text x="330" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序后（e 升序，同 e 按 s 降序）：[1,3] → [1,4] → [3,5] → [2,5]</text>

  <rect x="16" y="64" width="636" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="67" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">区间</text>
  <text x="243" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">条件判定</text>
  <text x="448" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">贪心动作</text>
  <text x="567" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">(a, b)</text>
  <text x="629" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">ans</text>

  <rect x="16" y="94" width="636" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="16" y="140" width="636" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="16" y="186" width="636" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="16" y="232" width="636" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>

  <path d="M 118 64 V 278 M 368 64 V 278 M 528 64 V 278 M 606 64 V 278" stroke="#b8b8b8" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="67" y="113" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">① [1, 3]</text>
  <text x="243" y="110" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">s ≤ a: 1 ≤ −1 否</text>
  <text x="243" y="126" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">s ≤ b: 1 ≤ −1 否 ⇒ 情况 3</text>
  <text x="448" y="113" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">取 e−1, e = 2, 3</text>
  <text x="567" y="113" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">(2, 3)</text>
  <text x="629" y="113" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>

  <text x="67" y="159" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">② [1, 4]</text>
  <text x="243" y="156" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">s ≤ a: 1 ≤ 2 是</text>
  <text x="243" y="172" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">⇒ 情况 1</text>
  <text x="448" y="159" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">跳过（已含 2, 3）</text>
  <text x="567" y="159" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">(2, 3)</text>
  <text x="629" y="159" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>

  <text x="67" y="205" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">③ [3, 5]</text>
  <text x="243" y="202" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">s ≤ a: 3 ≤ 2 否</text>
  <text x="243" y="218" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">s ≤ b: 3 ≤ 3 是 ⇒ 情况 2</text>
  <text x="448" y="205" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">取 e = 5</text>
  <text x="567" y="205" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">(3, 5)</text>
  <text x="629" y="205" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>

  <text x="67" y="251" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">④ [2, 5]</text>
  <text x="243" y="248" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">s ≤ a: 2 ≤ 3 是</text>
  <text x="243" y="264" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">⇒ 情况 1</text>
  <text x="448" y="251" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">跳过（已含 3, 5）</text>
  <text x="567" y="251" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">(3, 5)</text>
  <text x="629" y="251" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>

  <text x="330" y="304" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">答案 ans = 3，选点 {2, 3, 5}：每个区间恰含 2 个点（官方示例的 {2, 3, 4} 同样最优）</text>
  <text x="330" y="326" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">③ 之后 b = 5 已等于区间右端点，④ 因 s = 2 ≤ a = 3 直接命中情况 1</text>
  <text x="330" y="350" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">同 e 按 s 降序：右端点相同的首个区间被满足后 a ≥ s，后面的更窄区间必然跳过，a、b 不会退化成同一点</text>
</svg>
