<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：三组输入的两路计算</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header -->
  <text x="90" y="76" text-anchor="middle" font-size="12" fill="#888">celsius</text>
  <text x="235" y="76" text-anchor="middle" font-size="12" fill="#888">开氏路 + 273.15</text>
  <text x="435" y="76" text-anchor="middle" font-size="12" fill="#888">华氏路 ×1.8 + 32</text>
  <text x="580" y="76" text-anchor="middle" font-size="12" fill="#888">返回 [K, F]</text>

  <!-- row 1: 36.50 -->
  <g filter="url(#sk)"><rect x="40" y="90" width="100" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="90" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a94" font-family="monospace">36.50</text>
  <text x="235" y="110" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">36.50 + 273.15</text>
  <text x="235" y="127" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" font-family="monospace">= 309.65</text>
  <text x="435" y="110" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">36.50×1.8 = 65.70 → +32</text>
  <text x="435" y="127" text-anchor="middle" font-size="12" fill="#8a5f14" font-weight="bold" font-family="monospace">= 97.70</text>
  <path d="M 500 112 L 526 112" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="530" y="94" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="585" y="117" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" font-family="monospace">[309.65, 97.70]</text>

  <!-- row 2: 122.11 -->
  <g filter="url(#sk)"><rect x="40" y="158" width="100" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="90" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a94" font-family="monospace">122.11</text>
  <text x="235" y="178" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">122.11 + 273.15</text>
  <text x="235" y="195" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" font-family="monospace">= 395.26</text>
  <text x="435" y="178" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">122.11×1.8 = 219.798 → +32</text>
  <text x="435" y="195" text-anchor="middle" font-size="12" fill="#8a5f14" font-weight="bold" font-family="monospace">= 251.798</text>
  <path d="M 500 180 L 526 180" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="530" y="162" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="585" y="185" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" font-family="monospace">[395.26, 251.798]</text>
  <text x="452" y="216" text-anchor="middle" font-size="10" fill="#b03a3a">↑ 三位小数：1.8=9/5 的分母 5 与百分位组合出的尾数</text>

  <!-- row 3: 0 boundary -->
  <g filter="url(#sk)"><rect x="40" y="232" width="100" height="44" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="90" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a" font-family="monospace">0</text>
  <text x="90" y="269" text-anchor="middle" font-size="9" fill="#b85450">下边界</text>
  <text x="235" y="252" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">0 + 273.15</text>
  <text x="235" y="269" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" font-family="monospace">= 273.15</text>
  <text x="435" y="252" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">0×1.8 = 0 → +32</text>
  <text x="435" y="269" text-anchor="middle" font-size="12" fill="#8a5f14" font-weight="bold" font-family="monospace">= 32.00</text>
  <path d="M 500 254 L 526 254" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="530" y="236" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="585" y="259" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" font-family="monospace">[273.15, 32.00]</text>
  <text x="235" y="292" text-anchor="middle" font-size="10" fill="#b03a3a">输入为 0 ≠ 输出为 0：0K 是绝对零度，别特判</text>

  <!-- top boundary row -->
  <g filter="url(#sk)"><rect x="40" y="306" width="100" height="44" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="90" y="327" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a" font-family="monospace">1000</text>
  <text x="90" y="343" text-anchor="middle" font-size="9" fill="#b85450">上边界</text>
  <text x="235" y="326" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">1000 + 273.15</text>
  <text x="235" y="343" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" font-family="monospace">= 1273.15</text>
  <text x="435" y="326" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">1000×1.8 = 1800 → +32</text>
  <text x="435" y="343" text-anchor="middle" font-size="12" fill="#8a5f14" font-weight="bold" font-family="monospace">= 1832.00</text>
  <path d="M 500 328 L 526 328" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="530" y="310" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="585" y="333" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" font-family="monospace">[1273.15, 1832]</text>

  <!-- summary -->
  <g filter="url(#sk)"><rect x="60" y="374" width="520" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">251.798 与 251.79800 等价：判题按容差比数值，不要求小数位数</text>
  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#888">全程 double，误差 ~10⁻¹³ ≪ 容差 10⁻⁵</text>
</svg>
