<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="26" y="34" font-size="18" fill="#333" filter="url(#rough2)">样例 3 走查：b = {−3, 4, 2, −1, 1, 0}，Σb = 3</text>

  <rect x="36" y="60" width="708" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="82" text-anchor="middle" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">步 i</text>
  <text x="160" y="82" text-anchor="middle" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">v = a_(i−1)</text>
  <text x="278" y="82" text-anchor="middle" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">need = 1 − v</text>
  <text x="470" y="82" text-anchor="middle" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">剩余中最小的可行 c</text>
  <text x="690" y="82" text-anchor="middle" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">a_i = v + c</text>

  <rect x="36" y="102" width="708" height="32" rx="3" fill="#ffffff" filter="url(#rough2)"/>
  <text x="62" y="124" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="124" text-anchor="middle" font-size="13.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="278" y="124" text-anchor="middle" font-size="13.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="400" y="124" text-anchor="middle" font-size="13" fill="#a5761f" filter="url(#rough2)">1（a_1 取最小正整数）</text>
  <text x="690" y="124" text-anchor="middle" font-size="13.5" fill="#a5761f" filter="url(#rough2)">1</text>

  <rect x="36" y="142" width="708" height="32" rx="3" fill="#f4f7fb" filter="url(#rough2)"/>
  <text x="62" y="164" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="164" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="278" y="164" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="430" y="164" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="690" y="164" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="36" y="182" width="708" height="32" rx="3" fill="#ffffff" filter="url(#rough2)"/>
  <text x="62" y="204" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="204" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="278" y="204" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="430" y="204" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="690" y="204" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">3</text>

  <rect x="36" y="222" width="708" height="32" rx="3" fill="#f4f7fb" filter="url(#rough2)"/>
  <text x="62" y="244" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="244" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="278" y="244" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="430" y="244" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="690" y="244" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="36" y="262" width="708" height="32" rx="3" fill="#ffffff" filter="url(#rough2)"/>
  <text x="62" y="284" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="160" y="284" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="278" y="284" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="415" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4（−3 &lt; need，跳过）</text>
  <text x="690" y="284" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">6</text>

  <rect x="36" y="302" width="708" height="32" rx="3" fill="#f4f7fb" filter="url(#rough2)"/>
  <text x="62" y="324" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="160" y="324" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="278" y="324" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">−5</text>
  <text x="430" y="324" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">−3</text>
  <text x="690" y="324" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <text x="40" y="372" font-size="12.5" fill="#333" filter="url(#rough2)">输出 a = 1 1 3 2 6 3，与官方样例一致；末项 a_6 = Σb = 3。</text>
  <text x="40" y="398" font-size="12.5" fill="#333" filter="url(#rough2)">第 5 步是最容易写错的地方：need = −1 时 −3 仍不可选，必须先拿 4 把 v 抬上去。</text>
  <text x="40" y="424" font-size="12.5" fill="#b85450" filter="url(#rough2)">若把它改成「先挑负的」，a_5 = −1 立刻违反 a_i ≥ 1。</text>
</svg>
