<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="111"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">桶放置：单词尾部的数字，就是它在原句中的位置</text>

  <!-- 打乱的输入词 -->
  <text x="46" y="66" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">打乱的句子：</text>
  <g filter="url(#rough2)">
    <rect x="50" y="78" width="86" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="166" y="78" width="118" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="314" y="78" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="424" y="78" width="66" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">
    <text x="93" y="101">is<tspan fill="#b85450">2</tspan></text>
    <text x="225" y="101">sentence<tspan fill="#b85450">4</tspan></text>
    <text x="354" y="101">This<tspan fill="#b85450">1</tspan></text>
    <text x="457" y="101">a<tspan fill="#b85450">3</tspan></text>
  </g>

  <!-- 落桶箭头 -->
  <g filter="url(#rough2)">
    <path d="M 93 118 C 93 160, 128 168, 122 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 225 118 C 225 158, 170 170, 158 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 354 118 C 354 162, 320 170, 314 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 457 118 C 457 158, 452 170, 446 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 桶 -->
  <text x="46" y="238" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">按位置入桶：</text>
  <g filter="url(#rough2)">
    <rect x="120" y="212" width="72" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="200" y="212" width="72" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="280" y="212" width="72" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="360" y="212" width="110" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="156" y="240">This</text><text x="236" y="240">is</text>
    <text x="316" y="240">a</text><text x="415" y="240">sentence</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#999" filter="url(#rough2)">
    <text x="156" y="254">桶 1</text><text x="236" y="254">桶 2</text>
    <text x="316" y="254">桶 3</text><text x="415" y="254">桶 4</text>
  </g>

  <!-- 说明 -->
  <rect x="40" y="286" width="235" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="308" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">读尾字符：w[-1] 是 '1'…'9'，</text>
  <text x="56" y="326" font-size="11" fill="#3a4a66" filter="url(#rough2)">掐掉尾巴，放 slot[int(w[-1]) − 1]。</text>

  <rect x="285" y="286" width="235" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="301" y="308" font-size="11" fill="#2f5226" font-weight="bold" filter="url(#rough2)">单词数 ≤ 9，编号恰好 1..cnt，</text>
  <text x="301" y="326" font-size="11" fill="#2f5226" filter="url(#rough2)">无需排序，直接按下标放桶再拼接。</text>
</svg>
