<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一趟扫描，每台设备一次比较</text>
  <path d="M 190 36 Q 320 44 450 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><rect x="255" y="54" width="130" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="320" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">开始：tested = 0</text>
  <path d="M 320 88 L 320 108" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 还有设备吗 -->
  <g filter="url(#sk)"><polygon points="320,112 420,152 320,192 220,152" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="320" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">i &lt; n ?</text>
  <text x="320" y="167" text-anchor="middle" font-size="10" fill="#2b6e9e" filter="url(#sk)">（还有设备吗）</text>

  <path d="M 420 152 L 491 152" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="452" y="144" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="495" y="134" width="115" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="552" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 tested</text>

  <path d="M 320 192 L 320 218" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="210" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">是</text>

  <!-- 判定 -->
  <g filter="url(#sk)"><polygon points="320,222 430,262 320,302 210,262" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="320" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">b[i] &gt; tested ?</text>
  <text x="320" y="277" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">（有效电量 &gt; 0 ?）</text>

  <path d="M 210 262 L 175 262" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="191" y="253" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="55" y="244" width="115" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="112" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">tested++</text>

  <path d="M 430 262 L 466 262" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="447" y="253" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="470" y="244" width="115" height="36" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.3"/></g>
  <text x="527" y="267" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">跳过（不计数）</text>

  <!-- 汇合到 i++ -->
  <path d="M 112 280 C 112 318 190 326 276 326" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 527 280 C 527 318 450 326 364 326" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="260" y="328" width="120" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="320" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">i++，下一台</text>

  <!-- 回到循环开头 -->
  <path d="M 320 362 L 320 384 L 30 384 L 30 152 L 212 152" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="170" y="377" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">回到循环开头</text>

  <text x="620" y="392" text-anchor="end" font-size="11" fill="#888" filter="url(#sk)">时间 O(n) · 空间 O(1)</text>
</svg>
