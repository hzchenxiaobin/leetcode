<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">间隔拆分：长度为 g 的间隔至少要切几段</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">段数 p = ⌈g / D⌉，只需新增 p − 1 个站；把所有间隔的需求加起来就是 need(D)</text>

  <path d="M 90 96 L 470 96" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="90" cy="96" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="470" cy="96" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="118" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">A</text>
  <text x="470" y="118" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">B</text>
  <path d="M 90 78 L 470 78" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">原间隔 g = B − A</text>

  <path d="M 90 148 L 470 148" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="90" cy="148" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="470" cy="148" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="216.7" cy="148" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="343.3" cy="148" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 216.7 160 L 216.7 170" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 343.3 160 L 343.3 170" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216.7" y="184" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">新站 1</text>
  <text x="343.3" y="184" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">新站 2</text>
  <text x="153" y="168" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">g/3</text>
  <text x="280" y="168" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">g/3</text>
  <text x="407" y="168" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">g/3</text>
  <text x="470" y="168" text-anchor="end" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">p = 3 段</text>

  <rect x="58" y="204" width="444" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="74" y="223" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">每段长度 g/p ≤ D ⇔ p ≥ g/D ⇔ p = ⌈g/D⌉（取最小的整数）</text>
  <text x="74" y="240" font-size="10" fill="#555" filter="url(#rough2)">于是 need(D) = Σ_i ( ⌈g_i / D⌉ − 1 )，把 K 个站按需分配即可</text>

  <rect x="96" y="258" width="368" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <path d="M 96 282 L 464 282" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 168 258 L 168 346" stroke="#446688" stroke-width="1" fill="none" opacity="0.5" filter="url(#rough2)"/>
  <path d="M 252 258 L 252 346" stroke="#446688" stroke-width="1" fill="none" opacity="0.5" filter="url(#rough2)"/>
  <path d="M 348 258 L 348 346" stroke="#446688" stroke-width="1" fill="none" opacity="0.5" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#3a4a66" text-anchor="middle" font-weight="bold">
    <text x="132" y="276" filter="url(#rough2)">间隔 g</text>
    <text x="210" y="276" filter="url(#rough2)">目标 D</text>
    <text x="300" y="276" filter="url(#rough2)">段数 ⌈g/D⌉</text>
    <text x="406" y="276" filter="url(#rough2)">新增站 p−1</text>
  </g>
  <g font-size="9.5" fill="#555" text-anchor="middle">
    <text x="132" y="299" filter="url(#rough2)">10</text>
    <text x="210" y="299" filter="url(#rough2)">5</text>
    <text x="300" y="299" filter="url(#rough2)">2</text>
    <text x="406" y="299" filter="url(#rough2)">1</text>
    <text x="132" y="319" filter="url(#rough2)">10</text>
    <text x="210" y="319" filter="url(#rough2)">4</text>
    <text x="300" y="319" filter="url(#rough2)">3</text>
    <text x="406" y="319" filter="url(#rough2)">2</text>
    <text x="132" y="339" filter="url(#rough2)">10</text>
    <text x="210" y="339" filter="url(#rough2)">2.5</text>
    <text x="300" y="339" filter="url(#rough2)">4</text>
    <text x="406" y="339" filter="url(#rough2)">3</text>
  </g>

  <rect x="58" y="356" width="444" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="72" y="370" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">下界陷阱：总跨度 / 总段数只是下界，不能当答案——新站只能塞进自己所属的间隔，</text>
  <text x="72" y="384" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">答案由最长的间隔决定：如 [0,1,10]、K = 1，10/3 ≈ 3.33 只是下界，真实答案是 4.5。</text>
</svg>
