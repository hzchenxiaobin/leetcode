<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：逆向下落 —— 数 k−1 二进制里 1 的个数</text>

  <!-- A: 初始化 -->
  <rect x="160" y="44" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">j = k − 1（转 0-indexed），cnt = 0</text>
  <path d="M 260 76 L 260 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- B: 菱形 -->
  <polygon points="260,88 328,116 260,144 192,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">j == 0？</text>

  <!-- 是 → 返回 -->
  <path d="M 328 116 L 362 116" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="345" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="364" y="94" width="148" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="438" y="112" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">返回 chr('a' + cnt)</text>
  <text x="438" y="128" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">= 'a' + popcount(k−1)</text>

  <!-- 否 ↓ -->
  <path d="M 260 144 L 260 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="272" y="156" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- C: 末位判定 -->
  <rect x="130" y="160" width="260" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">cnt += j &amp; 1（末位是 1 = 该层落后半段，记 +1）</text>
  <path d="M 260 188 L 260 200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- D: 砍位下落 -->
  <rect x="130" y="202" width="260" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">j &gt;&gt;= 1（砍掉末位，下落一层）</text>

  <!-- 回环 -->
  <path d="M 130 216 C 92 216 92 116 190 116" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="52" y="162" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">每圈剥掉</text>
  <text x="52" y="176" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">一个二进制位</text>

  <!-- 右侧注 -->
  <text x="455" y="220" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">共 O(log k) 圈</text>

  <!-- 底部等价说明 -->
  <rect x="105" y="264" width="310" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">等价一行：ans = 'a' + popcount(k−1)</text>
  <text x="260" y="322" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">内置位计数：C++ __builtin_popcount / Python (k−1).bit_count()</text>
</svg>
