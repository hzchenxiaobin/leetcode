<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 338"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="338" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">双指针：typed 的字符只有「对位」与「长按」两种解释</text>
  <text x="60" y="62" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">name = "alex"</text>
  <rect x="60" y="74" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <rect x="116" y="74" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">l</text>
  <rect x="172" y="74" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">e</text>
  <rect x="228" y="74" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">x</text>
  <text x="60" y="146" text-anchor="start" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">typed = "aaleex"</text>
  <rect x="60" y="158" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82.0" y="180.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <rect x="116" y="158" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138.0" y="180.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <rect x="172" y="158" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194.0" y="180.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">l</text>
  <rect x="228" y="158" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250.0" y="180.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">e</text>
  <rect x="284" y="158" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306.0" y="180.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">e</text>
  <rect x="340" y="158" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362.0" y="180.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">x</text>
  <path d="M 142 108 L 142 156" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 198 108 L 198 156" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 254 108 L 366 156" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 108 L 422 156" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">绿色 = 长按多出来的重复字符，直接由 typed[j] == typed[j-1] 消化</text>
  <rect x="60" y="252" width="250" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="275.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">规则一：name[i] == typed[j] → 双指针前进</text>
  <rect x="340" y="252" width="260" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="275.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">规则二：typed[j] == typed[j-1] → 跳过 j</text>
  <text x="330" y="318" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">两条规则之外的一切情况都判 false：多出的字符既非长按、也对不上 name</text>
</svg>
