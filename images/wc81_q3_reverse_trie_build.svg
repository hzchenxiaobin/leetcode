<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">逆序插入 Trie：后缀关系 → 前缀关系</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">rev(time)=emit，rev(me)=em，rev(bell)=lleb</text>

  <text x="80" y="124" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">root</text>
  <circle cx="80" cy="160" r="20" fill="#eeeeee" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>

  <path d="M 96 146 L 162 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 96 174 L 162 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="180" cy="86" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="180" y="91" text-anchor="middle" font-size="12" fill="#3a4a66">e</text>
    <path d="M 200 86 L 248 86" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <circle cx="270" cy="86" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="270" y="91" text-anchor="middle" font-size="12" fill="#3a4a66">m</text>
    <path d="M 290 86 L 338 86" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <circle cx="360" cy="86" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="360" y="91" text-anchor="middle" font-size="12" fill="#3a4a66">i</text>
    <path d="M 380 86 L 428 86" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <circle cx="450" cy="86" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="450" y="91" text-anchor="middle" font-size="12" fill="#3a5a30">t</text>

    <circle cx="180" cy="234" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="180" y="239" text-anchor="middle" font-size="12" fill="#8a6a20">l</text>
    <path d="M 200 234 L 248 234" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <circle cx="270" cy="234" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="270" y="239" text-anchor="middle" font-size="12" fill="#8a6a20">l</text>
    <path d="M 290 234 L 338 234" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <circle cx="360" cy="234" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="360" y="239" text-anchor="middle" font-size="12" fill="#8a6a20">e</text>
    <path d="M 380 234 L 428 234" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <circle cx="450" cy="234" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="450" y="239" text-anchor="middle" font-size="12" fill="#3a5a30">b</text>
  </g>

  <circle cx="270" cy="86" r="27" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="196" y="126" width="176" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="284" y="143" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">m 是 em 的终点，</text>
  <text x="284" y="158" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">但它有子节点 i ⇒ 非叶子</text>

  <text x="480" y="78" font-size="9" fill="#3a5a30" filter="url(#rough2)">叶子</text>
  <text x="480" y="92" font-size="9" fill="#3a5a30" filter="url(#rough2)">深度 4</text>
  <text x="480" y="106" font-size="9" fill="#3a5a30" filter="url(#rough2)">+1 = 5</text>
  <text x="480" y="226" font-size="9" fill="#3a5a30" filter="url(#rough2)">叶子</text>
  <text x="480" y="240" font-size="9" fill="#3a5a30" filter="url(#rough2)">深度 4</text>
  <text x="480" y="254" font-size="9" fill="#3a5a30" filter="url(#rough2)">+1 = 5</text>

  <rect x="40" y="290" width="480" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="309" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">插入：for w in words: for ch in reversed(w): 沿子节点下行，缺边则新建节点</text>
  <text x="56" y="325" font-size="9.5" fill="#666" filter="url(#rough2)">time 建出 e-m-i-t；me 只复用 e、m（不新建），bell 在 root 下另起 l-l-e-b 分支</text>

  <rect x="40" y="346" width="480" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="366" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">叶子（无子节点）⇔ 该单词不是任何其它单词的后缀 ⇒ 必须独占 len+1</text>
  <text x="56" y="384" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">DFS(root, depth=0)，遇到叶子就累加 depth + 1</text>
  <text x="56" y="402" font-size="9.5" fill="#666" filter="url(#rough2)">内点 m 被叶子 t 延伸覆盖，答案只看叶子：5 + 5 = 10</text>
</svg>
