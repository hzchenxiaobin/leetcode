<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="350" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：第 r 行里球只横移一格</text>
  <path d="M 150 44 Q 350 52 550 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="350" y="66" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">一块 1 让球向右下滑一格，一块 -1 让球向左下滑一格；每层只影响相邻两格</text>

  <!-- panel 1: aligned boards -->
  <g filter="url(#rough2)">
    <rect x="20" y="82" width="208" height="192" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="124" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ 同向：斜坡连续</text>
  <g filter="url(#rough2)">
    <rect x="60" y="124" width="64" height="64" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="124" y="124" width="64" height="64" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <path d="M 60 124 L 124 188" stroke="#446688" stroke-width="2.2" fill="none"/>
    <path d="M 124 124 L 188 188" stroke="#446688" stroke-width="2.2" fill="none"/>
  </g>
  <text x="108" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="172" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <circle cx="70" cy="112" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 82 118 L 176 182" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="124" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">两块 1 在角点共线</text>
  <text x="124" y="230" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">球顺势滑进下一列</text>
  <text x="124" y="256" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下一行第 c+1 列</text>

  <!-- panel 2: V shape -->
  <g filter="url(#rough2)">
    <rect x="244" y="82" width="208" height="192" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="348" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 异向：V 形卡住</text>
  <g filter="url(#rough2)">
    <rect x="284" y="124" width="64" height="64" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="348" y="124" width="64" height="64" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <path d="M 284 124 L 348 188" stroke="#446688" stroke-width="2.2" fill="none"/>
    <path d="M 412 124 L 348 188" stroke="#b85450" stroke-width="2.2" fill="none"/>
    <circle cx="348" cy="188" r="5" fill="#b85450" stroke="#b85450"/>
  </g>
  <text x="332" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="396" y="118" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">-1</text>
  <circle cx="294" cy="112" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 306 118 L 342 180" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="348" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 与 -1 在角点汇成 V</text>
  <text x="348" y="230" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">球卡在谷底，出不来</text>
  <text x="348" y="256" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">即 grid[r][nc] ≠ g</text>

  <!-- panel 3: wall -->
  <g filter="url(#rough2)">
    <rect x="468" y="82" width="208" height="192" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="572" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 挡板指向箱壁</text>
  <g filter="url(#rough2)">
    <rect x="508" y="124" width="64" height="64" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <path d="M 508 124 L 572 188" stroke="#446688" stroke-width="2.2" fill="none"/>
    <path d="M 572 108 L 572 252" stroke="#8a8a8a" stroke-width="4" fill="none"/>
  </g>
  <text x="556" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="592" y="130" font-size="10" fill="#8a8a8a" filter="url(#rough2)">箱壁</text>
  <circle cx="518" cy="112" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 530 118 L 566 180" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="572" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">出口落在箱子外面</text>
  <text x="572" y="230" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">nc 越界，同样卡住</text>
  <text x="572" y="256" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">即 nc &lt; 0 或 nc ≥ n</text>

  <!-- rule box -->
  <g filter="url(#rough2)">
    <rect x="36" y="292" width="628" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="350" y="317" text-anchor="middle" font-size="13" fill="#8a6a10" filter="url(#rough2)">nc = c + grid[r][c]；卡住 ⟺ nc 越界，或 grid[r][nc] ≠ grid[r][c]</text>

  <g filter="url(#rough2)">
    <rect x="36" y="346" width="628" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="350" y="368" text-anchor="middle" font-size="12" fill="#34557e" filter="url(#rough2)">行号严格加 1 → 路径唯一、不回头；每层只查两格 → 不必建图</text>
  <text x="350" y="388" text-anchor="middle" font-size="12" fill="#34557e" filter="url(#rough2)">所以「模拟」本身就够快：O(m·n)，空间 O(1)</text>

  <text x="350" y="424" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">同一行内这个映射是单射：两球既不会落进同一列，也不会交换次序</text>
  <text x="350" y="450" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">于是 n 颗球可以各走各的，逐球独立模拟即可（见 §5 引理 3）</text>
</svg>
