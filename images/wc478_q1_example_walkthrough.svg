<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="24" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例演算：排序 → 阈值 t = a[n−k] → 数出严格小于 t 的个数</text>

  <!-- 行 1：nums=[3,1,2], k=1 -->
  <text x="36" y="77" font-size="12.5" fill="#333" filter="url(#rough2)">① nums = [3,1,2]，k = 1</text>
  <rect x="290" y="56" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="342" y="56" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="394" y="56" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="414" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="414" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">t</text>
  <rect x="548" y="56" width="80" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="588" y="77" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 2</text>
  <text x="36" y="110" font-size="11.5" fill="#666" filter="url(#rough2)">t = a[2] = 3，严格小于 t 的有 2 个（1 和 2）</text>

  <!-- 行 2：nums=[5,5,5], k=2 -->
  <text x="36" y="175" font-size="12.5" fill="#333" filter="url(#rough2)">② nums = [5,5,5]，k = 2</text>
  <rect x="290" y="154" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="175" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="342" y="154" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="362" y="175" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="394" y="154" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="175" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="362" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">t</text>
  <rect x="548" y="154" width="80" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="588" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 0</text>
  <text x="36" y="208" font-size="11.5" fill="#666" filter="url(#rough2)">t = a[1] = 5，严格小于 t 的有 0 个 → 全员不合格</text>

  <!-- 行 3：nums=[2,2,1,3], k=1 -->
  <text x="36" y="273" font-size="12.5" fill="#333" filter="url(#rough2)">③ nums = [2,2,1,3]，k = 1</text>
  <rect x="268" y="252" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="273" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="320" y="252" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="273" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="372" y="252" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="273" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="424" y="252" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="444" y="273" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="444" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">t</text>
  <rect x="548" y="252" width="80" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="588" y="273" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 3</text>
  <text x="36" y="306" font-size="11.5" fill="#666" filter="url(#rough2)">t = a[3] = 3，严格小于 t 的有 3 个（1、2、2）</text>

  <!-- 行 4：nums=[2,2,1,3], k=2 -->
  <text x="36" y="371" font-size="12.5" fill="#333" filter="url(#rough2)">④ nums = [2,2,1,3]，k = 2</text>
  <rect x="268" y="350" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="371" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="320" y="350" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="371" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="372" y="350" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="392" y="371" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="424" y="350" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="371" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="392" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">t</text>
  <rect x="548" y="350" width="80" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="588" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 1</text>
  <text x="36" y="404" font-size="11.5" fill="#666" filter="url(#rough2)">t = a[2] = 2，严格小于 t 的只有 1 个；两个 2 都不合格</text>

  <!-- 底部提示 -->
  <rect x="90" y="422" width="480" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">与阈值 t 相等的元素一律不合格——比较必须用「严格小于」</text>
</svg>
