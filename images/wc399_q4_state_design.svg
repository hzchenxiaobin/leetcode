<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：区间对外的全部接口 = 左右端点各 1 个 bit</text>
  <text x="280" y="49" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">把打家劫舍的「前缀依赖 DP」改造成「区间可合并」信息，单点修改只重算叶→根 O(log n) 个节点</text>

  <rect x="30" y="62" width="205" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="84" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">暴力：每个查询重跑一遍 O(n) DP</text>
  <text x="132" y="104" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">总 O(nq) = 5·10⁴ × 5·10⁴ = 2.5×10⁹ 超时</text>

  <path d="M 240 90 L 266 90" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="272" y="62" width="258" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="401" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">改造：区间信息可拼接 → 上线段树</text>
  <text x="401" y="104" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">改动一个叶子，只影响它到根的 O(log n) 个祖先</text>

  <text x="42" y="152" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">区间 [l .. r] 只需暴露端点状态：</text>
  <rect x="42" y="162" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="59" y="181" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">a?</text>
  <rect x="80" y="162" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="118" y="162" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="156" y="162" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="173" y="181" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">b?</text>

  <text x="42" y="212" font-size="11" fill="#666" filter="url(#rough2)">a、b ∈ {0, 1}：0 = 端点强制不选，1 = 端点可选</text>
  <text x="42" y="230" font-size="11" fill="#666" filter="url(#rough2)">跨过拼接缝的相邻约束只有一条边，</text>
  <text x="42" y="247" font-size="11" fill="#666" filter="url(#rough2)">区间内部怎么选，外界无需知道</text>

  <rect x="262" y="150" width="130" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">f00（a=0, b=0）</text>
  <text x="327" y="187" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">左端不选 · 右端不选</text>

  <rect x="398" y="150" width="130" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">f01（a=0, b=1）</text>
  <text x="463" y="187" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">左端不选 · 右端可选</text>

  <rect x="262" y="202" width="130" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327" y="222" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">f10（a=1, b=0）</text>
  <text x="327" y="239" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">左端可选 · 右端不选</text>

  <rect x="398" y="202" width="130" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="463" y="222" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">f11（a=1, b=1）</text>
  <text x="463" y="239" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">两端都可选 ← 查询答案位</text>

  <rect x="30" y="262" width="500" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">叶子（单元素 x）：f00 = f01 = f10 = 0，f11 = max(0, x)</text>
  <text x="280" y="299" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">左右端点是同一个元素——端点一旦被强制不选，这个元素就彻底出局，四值里没有 −∞</text>

  <rect x="30" y="322" width="500" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">为什么不能只存一个「区间最优值」？</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[2,3] 最优 3（占用右端）⊕ [2] 最优 2（占用左端）= 5 ✗ 拼接缝上相邻，非法！</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">真实答案 2+2 = 4 ✓ —— 最优值不携带「端点是否被占用」，必须按端点状态拆成 4 份保管</text>
</svg>
