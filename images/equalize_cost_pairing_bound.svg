<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：固定终值 T 后，批发次数 p = min(⌊S/2⌋, S−d)</text>
  <text x="270" y="46" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">示例 2 nums=[2,3,3,3,5]，取 T=5 → 缺口 g=[3,2,2,2,0]，S=9，d=3</text>

  <!-- gap bars: unit cells -->
  <g filter="url(#rough2)">
    <rect x="70" y="102" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="70" y="128" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="70" y="154" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="145" y="128" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="145" y="154" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="220" y="128" width="42" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="220" y="154" width="42" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="295" y="128" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="295" y="154" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)">
    <text x="91" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">①</text>
    <text x="91" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">②</text>
    <text x="91" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">③</text>
    <text x="166" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">①</text>
    <text x="166" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">④</text>
    <text x="241" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">②</text>
    <text x="241" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">④</text>
    <text x="316" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">③</text>
    <text x="316" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">零售</text>
  </g>
  <path d="M52,180 L415,180" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="91" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
    <text x="166" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
    <text x="241" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
    <text x="316" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
    <text x="391" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">5</text>
    <text x="91" y="212" text-anchor="middle" font-size="10" fill="#999">g=3</text>
    <text x="166" y="212" text-anchor="middle" font-size="10" fill="#999">g=2</text>
    <text x="241" y="212" text-anchor="middle" font-size="10" fill="#999">g=2</text>
    <text x="316" y="212" text-anchor="middle" font-size="10" fill="#999">g=2</text>
    <text x="391" y="212" text-anchor="middle" font-size="10" fill="#999">g=0</text>
  </g>

  <g filter="url(#rough2)">
    <text x="270" y="232" text-anchor="middle" font-size="10.5" fill="#555">批发 ①=(0,1) ②=(0,2) ③=(0,3) ④=(1,2)，零售 ×1 落在元素 3</text>
    <text x="270" y="247" text-anchor="middle" font-size="10.5" fill="#555">—— 4 次批发各落在两个不同元素上，合法性只是把缺口格「配平」</text>
  </g>

  <!-- bottleneck boxes -->
  <g filter="url(#rough2)">
    <rect x="40" y="258" width="225" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="290" y="258" width="215" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="152" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">瓶颈① 总量</text>
    <text x="152" y="298" text-anchor="middle" font-size="11" fill="#333">每次批发消耗 2 格缺口</text>
    <text x="152" y="316" text-anchor="middle" font-size="11" fill="#333">→ p ≤ ⌊S/2⌋ = ⌊9/2⌋ = 4</text>
    <text x="397" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">瓶颈② 独裁</text>
    <text x="397" y="298" text-anchor="middle" font-size="11" fill="#333">最大缺口没法和自己配对</text>
    <text x="397" y="316" text-anchor="middle" font-size="11" fill="#333">→ p ≤ S−d = 9−3 = 6</text>
  </g>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="40" y="356" width="465" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="272" y="383" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p = min(⌊S/2⌋, S−d) = min(4, 6) = 4 → C(5) = 4×1 + 1×2 = <tspan font-weight="bold" fill="#b85450">6 ✓</tspan></text>

  <text x="270" y="424" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">示例 1 [4,1]：g=[3,0]，S−d=0 → p=0，被迫全零售 3×5=15 —— 独裁瓶颈一手遮天</text>
</svg>
