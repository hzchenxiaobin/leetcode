<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">「x 能除尽 s」= s 由 x 原样重复若干次拼成</text>
  <text x="280" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">注意：不是「x 是 s 的子串」，而是整块重复</text>
  <text x="40" y="88" font-size="11" fill="#3a4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">x = ABC</text>
  <rect x="120" y="70" width="88" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="164" y="93.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">ABC</text>
  <rect x="216" y="70" width="88" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="93.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">ABC</text>
  <rect x="312" y="70" width="88" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="356" y="93.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">ABC</text>
  <text x="408" y="94" font-size="11" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">= ABCABCABC</text>
  <text x="40" y="158" font-size="11" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">能除尽 ✓</text>
  <rect x="120" y="140" width="88" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="164" y="163.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">ABC</text>
  <rect x="208" y="140" width="88" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="252" y="163.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">ABC</text>
  <rect x="296" y="140" width="88" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="163.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">ABC</text>
  <text x="40" y="214" font-size="11" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">不能除尽 ✗</text>
  <rect x="120" y="196" width="88" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="164" y="219.7" font-size="13" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">ABC</text>
  <rect x="208" y="196" width="88" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="252" y="219.7" font-size="13" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">AB</text>
  <text x="320" y="220" font-size="10.5" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">长度不是 |x| 的整数倍 → 直接不行</text>
  <rect x="60" y="250" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="268.5" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">因此候选答案 x 必须是 str1 与 str2 的共同前缀，</text>
  <text x="280" y="285" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">且 |x| 同时整除两个串的长度 → |x| 只能是 gcd 的因子</text>
</svg>
