<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">对拍矩阵：26 种位移差独立排队，各查 max ≤ k</text>

  <!-- 差值矩阵 -->
  <text x="280" y="62" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">s = "input"，t = "ouput"：逐位差 d[i] = (t[i] − s[i]) mod 26</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="74" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="130" y="74" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="190" y="74" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="250" y="74" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="310" y="74" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="100" y="96">i→o</text><text x="160" y="96">n→u</text><text x="220" y="96">p→p</text>
    <text x="280" y="96">u→u</text><text x="340" y="96">t→t</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#b85450" text-anchor="middle" font-weight="bold">
    <text x="100" y="128">d=6</text><text x="160" y="128">d=7</text><text x="220" y="128">d=0</text>
    <text x="280" y="128">d=0</text><text x="340" y="128">d=0</text>
  </g>

  <!-- 计数桶 -->
  <text x="280" y="166" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">按余数分桶：cnt[6] = 1，cnt[7] = 1，其余为 0（d=0 无需操作）</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="100" y="180" width="80" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="140" y="202">余数 6</text>
    <text x="140" y="224">最大操作号 6</text>
    <rect x="240" y="180" width="80" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="280" y="202">余数 7</text>
    <text x="280" y="224">最大操作号 7</text>
    <rect x="380" y="180" width="80" height="56" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="6"/>
    <text x="420" y="202">余数 1..5</text>
    <text x="420" y="224">cnt = 0 跳过</text>
  </g>
  <text x="280" y="262" font-size="14" fill="#b85450" filter="url(#rough2)" text-anchor="middle" font-weight="bold">max(6, 7) = 7 ≤ k = 9 ⟹ true</text>

  <!-- 反例 -->
  <text x="280" y="294" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">反例：s = "abc"，t = "bcd"，k = 10</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="110" y="306" width="340" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="280" y="326">cnt[1] = 3 ⟹ 最大操作号 1 + 26×2 = 53 &gt; 10 ⟹ false</text>
  </g>

  <text x="280" y="364" font-size="12" fill="#7a7a7a" text-anchor="middle" filter="url(#rough2)">不同余数的操作号天然互不相同（mod 26 不同），彼此不冲突</text>
</svg>
