<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="300" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：O(n) 一次计数</text>
  <rect x="50" y="56" width="200" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150.0" y="86.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">mid = nums[n/2]</text>
  <path d="M250,82 L296,82" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="296" y="56" width="174" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="383.0" y="86.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">统计 mid 出现次数</text>
  <path d="M383,108 L383,146" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="296" y="146" width="174" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="383.0" y="176.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">count == 1 ?</text>
  <path d="M296,172 L250,172" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="50" y="146" width="200" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150.0" y="176.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 true / false</text>
  <rect x="50" y="218" width="420" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="236" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">n 为奇数，mid 唯一；值域 1..100 也可以开桶计数，但直接扫描最简单。</text>
</svg>
