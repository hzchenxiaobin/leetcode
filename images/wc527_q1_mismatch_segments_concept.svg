<svg xmlns="http://www.w3.org/2000/svg" width="620" height="390" viewBox="0 0 620 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="620" height="390" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：失配下标的「极大连续段」</text>
  <path d="M 170 38 Q 310 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="310" y="58" text-anchor="middle" font-size="12" fill="#666">s1 ＝ "earth"，s2 ＝ "empty"，n ＝ 5</text>

  <text x="175" y="84" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="227" y="84" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="279" y="84" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="331" y="84" text-anchor="middle" font-size="11" fill="#999">3</text>
  <text x="383" y="84" text-anchor="middle" font-size="11" fill="#999">4</text>

  <g filter="url(#sk)">
    <rect x="151" y="90" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="203" y="90" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="255" y="90" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="307" y="90" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="359" y="90" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="151" y="130" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="203" y="130" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="255" y="130" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="307" y="130" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="359" y="130" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <text x="143" y="112" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">s1</text>
  <text x="143" y="152" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">s2</text>
  <text x="175" y="112" text-anchor="middle" font-size="14" fill="#333">e</text>
  <text x="227" y="112" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="279" y="112" text-anchor="middle" font-size="14" fill="#333">r</text>
  <text x="331" y="112" text-anchor="middle" font-size="14" fill="#333">t</text>
  <text x="383" y="112" text-anchor="middle" font-size="14" fill="#333">h</text>
  <text x="175" y="152" text-anchor="middle" font-size="14" fill="#333">e</text>
  <text x="227" y="152" text-anchor="middle" font-size="14" fill="#333">m</text>
  <text x="279" y="152" text-anchor="middle" font-size="14" fill="#333">p</text>
  <text x="331" y="152" text-anchor="middle" font-size="14" fill="#333">t</text>
  <text x="383" y="152" text-anchor="middle" font-size="14" fill="#333">y</text>

  <g filter="url(#sk)">
    <rect x="200" y="84" width="104" height="86" fill="none" stroke="#d6a040" stroke-width="2.5" rx="6"/>
    <rect x="356" y="84" width="54" height="86" fill="none" stroke="#d6a040" stroke-width="2.5" rx="6"/>
  </g>
  <text x="252" y="192" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">片段 [1,2] → ["ar","mp"]</text>
  <text x="383" y="192" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">[4,4] → ["h","y"]</text>

  <g filter="url(#sk)">
    <rect x="20" y="212" width="280" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="320" y="212" width="280" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="160" y="238" text-anchor="middle" font-size="13" fill="#8f3830" font-weight="bold">① 区间内每个下标都失配</text>
  <text x="160" y="260" text-anchor="middle" font-size="12" fill="#8f3830">a ≠ m，r ≠ p；h ≠ y</text>
  <text x="160" y="282" text-anchor="middle" font-size="11" fill="#8f3830">红色格子必须连成一片，无空隙</text>
  <text x="460" y="238" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">② 两侧不能再扩展</text>
  <text x="460" y="260" text-anchor="middle" font-size="12" fill="#2e5a24">左边 e ＝ e 截断；右边 t ＝ t 截断片段 A</text>
  <text x="460" y="282" text-anchor="middle" font-size="11" fill="#2e5a24">片段 B 右抵末端 n−1：越界也算「极大」</text>

  <path d="M 252 212 Q 252 202 245 196" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 383 212 Q 383 204 383 196" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="20" y="316" width="580" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="310" y="340" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">极大失配段 ＝ 内部全红、边界全绿（或越界）</text>
  <text x="310" y="362" text-anchor="middle" font-size="12" fill="#8a6415">→ 扫描时找到「失配起点」，右扩到首个匹配位即收割一段，指针跳到段后继续</text>
</svg>
