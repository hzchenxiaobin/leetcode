<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="384" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">word = "aabbccdd"，k = 7：dp 逐段推进</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">四段长度全是 2，每段可取 1 或 2；只统计总和 s ≤ 6 的方案</text>

  <rect x="34" y="60" width="492" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="96" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">已处理段数</text>
  <text x="182" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">s=1</text>
  <text x="238" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">s=2</text>
  <text x="294" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">s=3</text>
  <text x="350" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">s=4</text>
  <text x="406" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">s=5</text>
  <text x="462" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">s=6</text>

  <rect x="34" y="94" width="492" height="28" fill="#fafafa" stroke="#d8d8d8" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="96" y="113" text-anchor="middle" font-size="10" fill="#555">0 段</text>
  <text x="182" y="113" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="238" y="113" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="294" y="113" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="350" y="113" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="406" y="113" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="462" y="113" text-anchor="middle" font-size="10" fill="#888">0</text>

  <rect x="34" y="126" width="492" height="28" fill="#fafafa" stroke="#d8d8d8" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="96" y="145" text-anchor="middle" font-size="10" fill="#555">1 段（aa）</text>
  <text x="182" y="145" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="238" y="145" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="294" y="145" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="350" y="145" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="406" y="145" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="462" y="145" text-anchor="middle" font-size="10" fill="#888">0</text>

  <rect x="34" y="158" width="492" height="28" fill="#fafafa" stroke="#d8d8d8" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="96" y="177" text-anchor="middle" font-size="10" fill="#555">2 段（aa bb）</text>
  <text x="182" y="177" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="238" y="177" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="294" y="177" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="350" y="177" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="406" y="177" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="462" y="177" text-anchor="middle" font-size="10" fill="#888">0</text>

  <rect x="34" y="190" width="492" height="28" fill="#fafafa" stroke="#d8d8d8" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="96" y="209" text-anchor="middle" font-size="10" fill="#555">3 段（aa bb cc）</text>
  <text x="182" y="209" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="238" y="209" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="294" y="209" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="350" y="209" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="406" y="209" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="462" y="209" text-anchor="middle" font-size="10" fill="#333">1</text>

  <rect x="34" y="222" width="492" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="96" y="241" text-anchor="middle" font-size="10" fill="#8a6a20">4 段（全部）</text>
  <text x="182" y="241" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="238" y="241" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="294" y="241" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="350" y="241" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">1</text>
  <text x="406" y="241" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">4</text>
  <text x="462" y="241" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">6</text>

  <rect x="34" y="262" width="492" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#3a5a30">短串总数 bad = 1 + 4 + 6 = 11（分别对应总长 4、5、6）</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#555">含义：4 段全取 1（1 种）；恰 1 段取 2（C(4,1)=4）；恰 2 段取 2（C(4,2)=6）</text>

  <rect x="34" y="310" width="492" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">总数 Π c_i = 2^4 = 16　⇒　答案 = 16 − 11 = 5</text>
  <text x="280" y="344" text-anchor="middle" font-size="9.5" fill="#888">与示例 1 输出的 5 一致；若 k = 8，则只能全取 2，bad = 15，答案 1</text>

  <text x="280" y="370" text-anchor="middle" font-size="9.5" fill="#888">注意 s 只列到 k−1 = 6：总和 ≥ 7 的原串本来就合法，不参与「短串」统计</text>
</svg>
