  <text x="278" y="354" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">共享段越长越好 → 对每一行、每一列分别求「长度 ≥ 2 的最大子段和」</text>
  <text x="280.0" y="404" text-anchor="middle" font-size="10" fill="#999">单个公共格的情况需单独处理：只允许内部格（非边界），取最大值即可</text>
