<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 走查：停在哪儿，就取谁的 best</text>

  <!-- 顶部：插入后的 Trie 主链 -->
  <rect x="40" y="52" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="69" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">root</text>
  <path d="M 82 65 L 106 65" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="94" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">d</text>
  <rect x="110" y="52" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>
  <path d="M 152 65 L 176 65" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">c</text>
  <rect x="180" y="52" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <path d="M 222 65 L 246 65" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="234" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <rect x="250" y="52" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <path d="M 292 65 L 316 65" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="58" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">a / x</text>
  <rect x="320" y="52" width="40" height="26" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="340" y="69" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⋯</text>
  <text x="440" y="69" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">节点下 best：</text>
  <text x="440" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">root/d/c/b 均为 (3,1)</text>

  <!-- 行 1：查询 "cd" -->
  <rect x="20" y="128" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="43" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"cd"</text>
  <path d="M 68 141 L 80 141" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="84" y="128" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"dc"</text>
  <rect x="160" y="128" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">root</text>
  <path d="M 206 141 L 220 141" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="213" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">d</text>
  <rect x="224" y="128" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>
  <path d="M 262 141 L 276 141" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="269" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">c</text>
  <rect x="280" y="128" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="298" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">c</text>
  <text x="330" y="145" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 字符用尽，停在 c</text>
  <text x="490" y="145" text-anchor="end" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 1</text>

  <!-- 行 2：查询 "bcd" -->
  <rect x="20" y="190" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="43" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"bcd"</text>
  <path d="M 68 203 L 80 203" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="84" y="190" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"dcb"</text>
  <rect x="160" y="190" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">root</text>
  <path d="M 206 203 L 220 203" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="213" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">d</text>
  <rect x="224" y="190" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>
  <path d="M 262 203 L 276 203" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="269" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">c</text>
  <rect x="280" y="190" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <path d="M 318 203 L 332 203" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <rect x="336" y="190" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="354" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <text x="382" y="207" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 停在 b</text>
  <text x="490" y="207" text-anchor="end" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 1</text>

  <!-- 行 3：查询 "xyz"（空后缀陷阱） -->
  <rect x="20" y="252" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="43" y="269" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"xyz"</text>
  <path d="M 68 265 L 80 265" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="84" y="252" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="269" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"zyx"</text>
  <rect x="160" y="252" width="44" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="182" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">root</text>
  <path d="M 206 265 L 220 265" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="213" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">z</text>
  <rect x="224" y="252" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="262" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 无出边</text>
  <text x="312" y="269" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">空后缀 → 停在根，取 best[root]</text>
  <text x="490" y="269" text-anchor="end" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = 1</text>

  <rect x="20" y="296" width="480" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">「走不动」也有答案：停在原地取当前节点的 best；根的 best=(3,1) 专为空后缀兜底</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">例 2 "acbfgh"：h,g,f 可走、b 处断 → 停 f：best=(8,0) → ans=0（后缀 fgh 长 3，赢过更短的词）</text>
</svg>
