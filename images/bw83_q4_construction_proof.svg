<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">不可得序列的构造：每组取「收尾面」，再补尾部缺失面 v</text>

  <!-- 组与收尾位置 -->
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="72"  y="60" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="60" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="60" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="216" y="60" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="264" y="60" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="312" y="60" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="360" y="60" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="60" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="456" y="60" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="96"  y="85">4</text><text x="144" y="85">2</text><text x="192" y="85">1</text>
    <text x="240" y="85">2</text><text x="288" y="85" fill="#8a6d1f" font-weight="bold">3</text>
    <text x="336" y="85">3</text><text x="384" y="85">2</text><text x="432" y="85">4</text><text x="480" y="85" fill="#8a6d1f" font-weight="bold">1</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#8a6d1f" text-anchor="middle">
    <text x="288" y="116">v₁ = 3（组1收尾）</text>
    <text x="480" y="116">v₂ = 1（组2收尾）</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="84" y="150">e₁</text><text x="468" y="150">e₂</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 288 126 L 288 158" stroke="#d6a040" stroke-width="1.5" fill="none"/>
    <path d="M 480 126 L 480 158" stroke="#d6a040" stroke-width="1.5" fill="none"/>
  </g>
  <text x="140" y="150" font-size="12" fill="#446688" filter="url(#rough2)">组边界：e₁ &lt; e₂ 是各组「刚好集齐」的位置</text>

  <!-- 匹配被迫右移 -->
  <g filter="url(#rough2)">
    <rect x="56" y="176" width="448" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="200" text-anchor="middle" font-size="13" fill="#1a2b45" filter="url(#rough2)">匹配 (v₁, v₂, v)：v₁ 在组 1 内首次出现恰在 e₁ ⇒ p₁ ≥ e₁；</text>
  <text x="280" y="222" text-anchor="middle" font-size="13" fill="#1a2b45" filter="url(#rough2)">v₂ 在组 2 内首次出现恰在 e₂ ⇒ p₂ ≥ e₂；于是 p₃ &gt; e₂。</text>

  <!-- 尾部缺失 -->
  <g filter="url(#rough2)">
    <rect x="492" y="52" width="40" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <text x="512" y="76" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">尾部</text>
  <text x="512" y="94" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">缺 v</text>
  <path d="M 286 244 L 500 130" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="90" y="258" width="380" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="286" text-anchor="middle" font-size="13.5" fill="#7a2f2b" filter="url(#rough2)">p₃ 落在 e₂ 之后，但 v 在 e₂ 之后根本没出现 → 匹配失败</text>

  <g filter="url(#rough2)">
    <rect x="60" y="322" width="440" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="345" text-anchor="middle" font-size="12.5" fill="#1d3a17" filter="url(#rough2)">反向：g 组存在 ⇒ 任意长度 g 的序列都能逐组各取一个位置拼出。</text>
  <text x="280" y="366" text-anchor="middle" font-size="12.5" fill="#1d3a17" filter="url(#rough2)">两个方向合并：答案恰为 g+1（完整证明见正文 §5）。</text>
</svg>
