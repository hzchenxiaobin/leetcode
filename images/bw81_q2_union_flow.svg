<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="85"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">并查集合并过程：按大小合并，根上直接挂分量大小</text>

  <!-- 步骤 1 初始 -->
  <text x="140" y="62" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">① 初始：fa[i]=i，sz[i]=1</text>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <circle cx="60" cy="98" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="60" y="102">0</text>
    <circle cx="100" cy="98" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="100" y="102">1</text>
    <circle cx="140" cy="98" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="140" y="102">2</text>
    <circle cx="180" cy="98" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="102">3</text>
    <circle cx="220" cy="98" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="220" y="102">4</text>
    <circle cx="60" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="60" y="154">5</text>
    <circle cx="100" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="100" y="154">6</text>
  </g>
  <text x="160" y="154" font-size="11.5" fill="#888" filter="url(#rough2)">7 个分量，各 sz=1</text>

  <!-- 步骤 2 合并边 -->
  <text x="420" y="62" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">② 逐边 merge（示例 2 的 5 条边）</text>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="310" y="74" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="420" y="94" text-anchor="middle">(0,2)：合并 → {0,2}，sz=2</text>
    <rect x="310" y="108" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="420" y="128" text-anchor="middle">(0,5)：合并 → {0,2,5}，sz=3</text>
    <rect x="310" y="142" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="420" y="162" text-anchor="middle">(2,4)：合并 → {0,2,4,5}，sz=4</text>
    <rect x="310" y="176" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="420" y="196" text-anchor="middle">(1,6)：合并 → {1,6}，sz=2</text>
    <rect x="310" y="210" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="420" y="230" text-anchor="middle">(5,4)：同分量，跳过（成环）</text>
  </g>

  <!-- 步骤 3 统计 -->
  <text x="280" y="266" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">③ 只扫 i == find(i) 的根，累加 C(sz,2)</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="40" y="280" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="280" y="302" text-anchor="middle" font-weight="bold">same = C(4,2) + C(2,2) + C(1,2) = 6 + 1 + 0 = 7</text>
    <rect x="40" y="320" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="280" y="342" text-anchor="middle" font-weight="bold" fill="#d6a040">答案 = n(n−1)/2 − same = 21 − 7 = 14</text>
  </g>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">sz 只在合并时维护在「新根」上；非根节点的 sz 是旧值，因此统计必须先判根再取值</text>
</svg>
