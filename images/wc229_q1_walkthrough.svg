<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="341" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：word1 = "ab"，word2 = "pqrs" → "apbqrs"</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- word1 行：a b + 两个越界虚线格 -->
  <text x="112" y="70" text-anchor="end" font-size="13" fill="#7a5415" font-weight="bold">word1 (n₁=2)</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="124" y="48" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="168" y="48" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="212" y="48" width="44" height="34" rx="4" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5,4"/>
    <rect x="256" y="48" width="44" height="34" rx="4" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="146" y="70" text-anchor="middle" fill="#2b6e9e">a</text>
    <text x="190" y="70" text-anchor="middle" fill="#2b6e9e">b</text>
    <text x="234" y="70" text-anchor="middle" fill="#b85450">∅</text>
    <text x="278" y="70" text-anchor="middle" fill="#b85450">∅</text>
  </g>

  <!-- k 下标行 -->
  <g font-size="11" fill="#666" font-family="monospace">
    <text x="146" y="98" text-anchor="middle">k=0</text>
    <text x="190" y="98" text-anchor="middle">k=1</text>
    <text x="234" y="98" text-anchor="middle">k=2</text>
    <text x="278" y="98" text-anchor="middle">k=3</text>
  </g>

  <!-- word2 行：p q r s -->
  <text x="112" y="128" text-anchor="end" font-size="13" fill="#7a5415" font-weight="bold">word2 (n₂=4)</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="124" y="106" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="168" y="106" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="212" y="106" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="256" y="106" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <text x="146" y="128" text-anchor="middle" fill="#2e6e2e">p</text>
    <text x="190" y="128" text-anchor="middle" fill="#2e6e2e">q</text>
    <text x="234" y="128" text-anchor="middle" fill="#2e6e2e">r</text>
    <text x="278" y="128" text-anchor="middle" fill="#2e6e2e">s</text>
  </g>

  <!-- 右侧提示 -->
  <g filter="url(#sk)">
    <rect x="330" y="60" width="270" height="76" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.1"/>
  </g>
  <text x="465" y="84" text-anchor="middle" font-size="12" fill="#7a5415">k=0,1：交叠段，两 if 都触发</text>
  <text x="465" y="104" text-anchor="middle" font-size="12" fill="#7a5415">k=2,3：word1 越界（∅），</text>
  <text x="465" y="124" text-anchor="middle" font-size="12" fill="#7a5415">只剩 word2 的 if 触发</text>

  <!-- 演算表 -->
  <g filter="url(#sk)">
    <rect x="60" y="152" width="520" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#2b6e9e" font-weight="bold" font-family="monospace">
    <text x="100" y="169" text-anchor="middle">k</text>
    <text x="220" y="169" text-anchor="middle">word1[k]</text>
    <text x="380" y="169" text-anchor="middle">word2[k]</text>
    <text x="520" y="169" text-anchor="middle">res 累积</text>
  </g>

  <!-- 行1：k=0 交叠段 -->
  <g filter="url(#sk)">
    <rect x="60" y="178" width="520" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="100" y="200" text-anchor="middle" fill="#333">0</text>
    <text x="220" y="200" text-anchor="middle" fill="#2e6e2e">a ✓</text>
    <text x="380" y="200" text-anchor="middle" fill="#2e6e2e">p ✓</text>
    <text x="520" y="200" text-anchor="middle" fill="#333" font-weight="bold">ap</text>
  </g>

  <!-- 行2：k=1 交叠段 -->
  <g filter="url(#sk)">
    <rect x="60" y="212" width="520" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="100" y="234" text-anchor="middle" fill="#333">1</text>
    <text x="220" y="234" text-anchor="middle" fill="#2e6e2e">b ✓</text>
    <text x="380" y="234" text-anchor="middle" fill="#2e6e2e">q ✓</text>
    <text x="520" y="234" text-anchor="middle" fill="#333" font-weight="bold">apbq</text>
  </g>

  <!-- 行3：k=2 剩余段 -->
  <g filter="url(#sk)">
    <rect x="60" y="246" width="520" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="100" y="268" text-anchor="middle" fill="#333">2</text>
    <text x="220" y="268" text-anchor="middle" fill="#b85450">越界，跳过</text>
    <text x="380" y="268" text-anchor="middle" fill="#2e6e2e">r ✓</text>
    <text x="520" y="268" text-anchor="middle" fill="#333" font-weight="bold">apbqr</text>
  </g>

  <!-- 行4：k=3 剩余段 -->
  <g filter="url(#sk)">
    <rect x="60" y="280" width="520" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="100" y="302" text-anchor="middle" fill="#333">3</text>
    <text x="220" y="302" text-anchor="middle" fill="#b85450">越界，跳过</text>
    <text x="380" y="302" text-anchor="middle" fill="#2e6e2e">s ✓</text>
    <text x="520" y="302" text-anchor="middle" fill="#333" font-weight="bold">apbqrs</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <rect x="92" y="326" width="16" height="13" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
    <rect x="340" y="326" width="16" height="13" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="114" y="337" font-size="11" fill="#555">交叠段：k &lt; min(n1,n2)，+2 字符/轮</text>
  <text x="362" y="337" font-size="11" fill="#555">剩余段：k ≥ min(n1,n2)，+1 字符/轮</text>

  <!-- 结果条 -->
  <g filter="url(#sk)">
    <rect x="150" y="352" width="340" height="56" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="374" text-anchor="middle" font-size="12" fill="#7a5415">word1 先取尽 → word2 尾巴 "rs" 直接接上</text>
  <text x="320" y="398" text-anchor="middle" font-size="18" fill="#7a5415" font-weight="bold" font-family="monospace">apbqrs ✓</text>
</svg>
