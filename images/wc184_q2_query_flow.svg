<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">算法流程：初始化 + 每次查询三步走</text>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#888">每次查询 1 次 query + 2 次 update，各 O(log(n+m))</text>

  <!-- init box -->
  <rect x="170" y="60" width="300" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">初始化：N = n + m，建 BIT</text>
  <text x="320" y="108" text-anchor="middle" font-size="10.5" fill="#555">pos[v] = n + v，update(n + v, +1)，v = 1..m</text>
  <text x="158" y="96" font-size="10" fill="#999" text-anchor="end">O(m log N)</text>

  <path d="M 320 124 L 320 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="228,180 320,148 412,180 320,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="184" text-anchor="middle" font-size="11.5" fill="#7a5415">还有查询？（i &lt; n）</text>

  <!-- no branch -->
  <path d="M 228 180 L 198 180" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <rect x="56" y="158" width="140" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="126" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 ans</text>

  <!-- yes branch -->
  <path d="M 320 212 L 320 240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="231" font-size="11" font-weight="bold" fill="#4a7a3a">是：v = queries[i]</text>

  <!-- step 1 -->
  <rect x="140" y="240" width="360" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">① 查位次：ans[i] = query(pos[v]) − 1</text>
  <text x="130" y="269" font-size="10" fill="#999" text-anchor="end">O(log N)</text>
  <path d="M 320 288 L 320 308" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="140" y="308" width="360" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="337" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">② 清旧位：update(pos[v], −1)</text>
  <text x="130" y="337" font-size="10" fill="#999" text-anchor="end">O(log N)</text>
  <path d="M 320 356 L 320 376" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="140" y="376" width="360" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="405" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">③ 置新位：pos[v] = n − i，update(pos[v], +1)</text>
  <text x="130" y="405" font-size="10" fill="#999" text-anchor="end">O(log N)</text>

  <!-- loop back -->
  <path d="M 500 400 L 560 400 L 560 180 L 418 180" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="572" y="296" font-size="11" font-weight="bold" fill="#4a7a3a">i++</text>

  <!-- pitfall note -->
  <text x="320" y="448" text-anchor="middle" font-size="10.5" fill="#b85450">⚠ 三步顺序固定：先查（减 1）→ 再清旧位 → 后置新位，混用必错</text>
</svg>
