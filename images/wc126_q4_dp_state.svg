<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">堆数由区间长度模 k−1 唯一确定</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每次合并让堆数减少 k−1，所以 p ≡ len (mod k−1)</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <text x="30.0" y="74.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">k = 3 时，把一段石头合并到「最少堆数」：</text>
  <rect x="30" y="92" width="124" height="108" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="92.0" y="150.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="92.0" y="118.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3 堆 → 1 堆</text>
  <text x="92.0" y="142.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">len = 3</text>
  <text x="92.0" y="166.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">p = (3-1)%2+1 = 1</text>
  <rect x="162" y="92" width="124" height="108" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="224.0" y="150.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="224.0" y="118.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4 堆 → 2 堆</text>
  <text x="224.0" y="142.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">len = 4</text>
  <text x="224.0" y="166.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">p = (4-1)%2+1 = 2</text>
  <rect x="294" y="92" width="124" height="108" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="356.0" y="150.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="356.0" y="118.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5 堆 → 1 堆</text>
  <text x="356.0" y="142.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">len = 5</text>
  <text x="356.0" y="166.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">p = (5-1)%2+1 = 1</text>
  <rect x="426" y="92" width="124" height="108" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="488.0" y="150.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="488.0" y="118.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6 堆 → 2 堆</text>
  <text x="488.0" y="142.0" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">len = 6</text>
  <text x="488.0" y="166.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">p = (6-1)%2+1 = 2</text>
  <text x="30.0" y="226.0" font-size="13" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">正确的取值：p_min(len) = (len - 1) mod (k-1) + 1</text>
  <text x="30.0" y="250.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">例：len = 4，k = 3 → p = 3 mod 2 + 1 = 2 堆</text>
  <rect x="30" y="272" width="520" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="293.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">dp[i][j] 只需记录「合并到 p_min 堆」的最小成本，不必记录任意堆数</text>
  <text x="40.0" y="309.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">若要合成 1 堆，最后一次合并吃 k 堆：左边 1 堆（前缀 [i,m]，m−i 是 k−1 的倍数）</text>
  <text x="40.0" y="325.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">右边 k−1 堆，而 k−1 恰好是后缀 [m+1,j] 的最小堆数 → 转移只枚举 m</text>
</svg>
