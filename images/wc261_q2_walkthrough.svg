<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
  </defs>

  <rect width="900" height="470" fill="#fafafa"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：rolls = [1,5,6]，mean = 3，n = 4 —— M = 9 → [3,2,2,2]</text>
  <path d="M 230 42 Q 450 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="60" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">七个格子：3 个已知 ＋ 4 个缺失；平均值 3 ⇒ 总和 21，缺失部分必须恰好凑出 9</text>

  <!-- rolls strip -->
  <text x="46" y="106" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">全部 7 格：</text>
  <g filter="url(#rough2)">
    <rect x="150" y="84" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="194" y="84" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="238" y="84" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="304" y="84" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3"/>
    <rect x="348" y="84" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3"/>
    <rect x="392" y="84" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3"/>
    <rect x="436" y="84" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3"/>
  </g>
  <text x="172" y="106" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <text x="216" y="106" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">5</text>
  <text x="260" y="106" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">6</text>
  <text x="326" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">?</text>
  <text x="370" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">?</text>
  <text x="414" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">?</text>
  <text x="458" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">?</text>

  <g filter="url(#rough2)">
    <path d="M 150 126 L 150 134 L 282 134 L 282 126" fill="none" stroke="#446688" stroke-width="1.4"/>
    <path d="M 304 126 L 304 134 L 480 134 L 480 126" fill="none" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="216" y="150" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">m = 3 个已知 · S = 12</text>
  <text x="392" y="150" text-anchor="middle" font-size="10.5" fill="#a67c1e" filter="url(#rough2)">n = 4 个缺失 · 和须为 M</text>

  <text x="740" y="98" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">mean = 3</text>
  <text x="740" y="116" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">T = 3 × 7 = 21</text>

  <!-- computation panel -->
  <g filter="url(#rough2)">
    <rect x="40" y="170" width="420" height="140" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="194" font-size="12.5" font-weight="bold" fill="#666" filter="url(#rough2)">逐步计算（先判后构）</text>
  <text x="60" y="220" font-size="12" fill="#446688" filter="url(#rough2)">① T = mean × (n+m) = 3 × 7 = 21</text>
  <text x="60" y="244" font-size="12" fill="#446688" filter="url(#rough2)">② S = 1 + 5 + 6 = 12</text>
  <text x="60" y="268" font-size="12" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">③ M = T − S = 21 − 12 = 9</text>
  <text x="60" y="292" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">④ 判定：4 ≤ 9 ≤ 24 = 6n ✓ 可构造</text>

  <!-- construction panel -->
  <g filter="url(#rough2)">
    <rect x="490" y="170" width="370" height="140" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="510" y="194" font-size="12.5" font-weight="bold" fill="#666" filter="url(#rough2)">商余均摊构造</text>
  <text x="510" y="220" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⑤ q = ⌊9/4⌋ = 2，r = 9 mod 4 = 1</text>
  <g filter="url(#rough2)">
    <rect x="510" y="232" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="552" y="232" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="594" y="232" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="636" y="232" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="528" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="570" y="254" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="612" y="254" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="654" y="254" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="528" y="282" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">垫高 q+1</text>
  <text x="612" y="282" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">基线 q（n−r = 3 个）</text>
  <text x="510" y="302" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">3+2+2+2 = 9 = M ✓　·　(12+9) ÷ 7 = 3 = mean ✓</text>

  <!-- bottom cards -->
  <g filter="url(#rough2)">
    <rect x="35" y="330" width="270" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="315" y="330" width="270" height="118" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="595" y="330" width="270" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="170" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：M = 6n → 全取基线</text>
  <text x="52" y="378" font-size="10.5" fill="#333" filter="url(#rough2)">rolls = [3,2,4,3]，mean = 4，n = 2</text>
  <text x="52" y="398" font-size="10.5" fill="#333" filter="url(#rough2)">M = 24 − 12 = 12 = 6n → q = 6，r = 0</text>
  <text x="52" y="418" font-size="10.5" fill="#333" filter="url(#rough2)">答案 [6,6]：r = 0，没有垫高名额</text>

  <text x="450" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">示例 3：M 越上界 → 无解</text>
  <text x="332" y="378" font-size="10.5" fill="#333" filter="url(#rough2)">rolls = [1,2,3,4]，mean = 6，n = 4</text>
  <text x="332" y="398" font-size="10.5" fill="#333" filter="url(#rough2)">M = 48 − 10 = 38 &gt; 24 = 6n</text>
  <text x="332" y="418" font-size="10.5" fill="#333" filter="url(#rough2)">返回 []：缺失部分全 6 也追不上</text>

  <text x="730" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例 4：n = 1 退化</text>
  <text x="612" y="378" font-size="10.5" fill="#333" filter="url(#rough2)">rolls = [1]，mean = 3，n = 1</text>
  <text x="612" y="398" font-size="10.5" fill="#333" filter="url(#rough2)">M = 6 − 1 = 5 → q = 5，r = 0</text>
  <text x="612" y="418" font-size="10.5" fill="#333" filter="url(#rough2)">答案 [5]：单个骰子直接取 M</text>

  <text x="450" y="464" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">构造自由度极大：[1,2,3,3]、[2,3,2,2] 等同样合法 —— 商余分配给出的是「最均匀」的一组</text>
</svg>
