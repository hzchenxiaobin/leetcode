<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：山谷 +1、山峰 −1，同天同时生效</text>

  <text x="46" y="62" font-size="12" fill="#333" font-weight="bold">arr = [1,6,3,4,3,5] 的条形图（首尾永不改动）</text>

  <g filter="url(#rough2)" stroke-width="1.6">
    <rect x="70"  y="228" width="50" height="52" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="130" y="100" width="50" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="190" y="196" width="50" height="84" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/>
    <rect x="250" y="180" width="50" height="100" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="310" y="196" width="50" height="84" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/>
    <rect x="370" y="148" width="50" height="132" fill="#e8f0fe" stroke="#446688" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="95"  y="288" fill="#3a4a66">1</text>
    <text x="155" y="288" fill="#8a3a36">6</text>
    <text x="215" y="288" fill="#3a5a30">3</text>
    <text x="275" y="288" fill="#3a4a66">4</text>
    <text x="335" y="288" fill="#3a5a30">3</text>
    <text x="395" y="288" fill="#3a4a66">5</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 155 92 L 155 66" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none"/>
    <path d="M 215 188 L 215 160" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none"/>
    <path d="M 335 188 L 335 160" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" font-weight="bold">
    <text x="155" y="58" fill="#8a3a36">峰：&gt; 两邻 → 6−1=5</text>
    <text x="215" y="152" fill="#3a5a30">谷：&lt; 两邻 → 3+1=4</text>
    <text x="335" y="152" fill="#3a5a30">谷 → 3+1=4</text>
  </g>
  <text x="475" y="140" font-size="10" fill="#777" filter="url(#rough2)">4 夹在 3 与 3 之间：</text>
  <text x="475" y="154" font-size="10" fill="#777" filter="url(#rough2)">是峰 → 4−1=3</text>
  <text x="475" y="168" font-size="10" fill="#777" filter="url(#rough2)">（第一天它也变！）</text>

  <rect x="40" y="304" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">第 1 天（基于昨日快照同时判定）：[1,5,4,3,4,5]；势能 V: 12 → 8</text>
</svg>
