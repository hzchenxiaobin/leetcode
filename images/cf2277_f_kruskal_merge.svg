<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 570" width="860" height="570"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="570" fill="#fafafa"/>

  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 t 从大到小激活：K(u) 就是激活瞬间的连通块</text>
  <path d="M 120 42 Q 430 49 740 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ===== 左：原树 + K 集合 ===== -->
  <text x="230" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">原树（点上标 t 值）</text>

  <rect x="112" y="150" width="300" height="272" rx="16" fill="#e8f0fe" fill-opacity="0.5"
        stroke="#446688" stroke-width="1.6" stroke-dasharray="8 5" filter="url(#rough2)"/>
  <text x="126" y="170" font-size="11" fill="#2f4a66" filter="url(#rough2)">K(a) = {a,b,c,d,e}</text>

  <rect x="272" y="248" width="128" height="164" rx="12" fill="#e6f4ea" fill-opacity="0.85"
        stroke="#4a7a3a" stroke-width="1.7" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="336" y="402" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">K(c)={c,e}</text>

  <rect x="116" y="252" width="132" height="150" rx="12" fill="#fff8e1" fill-opacity="0.9"
        stroke="#d6a040" stroke-width="1.7" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="196" y="396" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">K(b)={b,d}</text>

  <path d="M 96 186 L 200 186" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 218 200 L 186 258" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 228 200 L 292 258" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 176 284 L 146 344" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 306 284 L 348 344" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="76" cy="186" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="76" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">m</text>
  <text x="76" y="160" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">t=1</text>

  <circle cx="216" cy="186" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="216" y="163" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">t=2</text>

  <circle cx="176" cy="276" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="281" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">b</text>
  <text x="148" y="262" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">t=3</text>

  <circle cx="306" cy="276" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="281" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">c</text>
  <text x="332" y="262" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">t=4</text>

  <circle cx="140" cy="356" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="361" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">d</text>
  <text x="140" y="386" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">t=5</text>

  <circle cx="354" cy="356" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="354" y="361" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">e</text>
  <text x="354" y="386" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">t=6</text>

  <text x="230" y="446" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">K(e) ⊂ K(c) ⊂ K(a) ⊂ K(m) = V，两两嵌套或不相交</text>

  <!-- 分隔 -->
  <path d="M 442 66 Q 446 260 442 452" stroke="#c8c8c8" stroke-width="1.4" stroke-dasharray="5 6" fill="none" filter="url(#rough2)"/>

  <!-- ===== 右：Kruskal 树 ===== -->
  <text x="650" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Kruskal 合并树（边权 = 该边对子树内所有 r 的贡献）</text>

  <path d="M 560 152 L 560 194" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 546 224 L 512 274" stroke="#4a7a3a" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 574 224 L 620 274" stroke="#4a7a3a" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 498 308 L 478 344" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 634 308 L 664 344" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="560" cy="134" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="560" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">m</text>

  <circle cx="560" cy="212" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="560" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>

  <circle cx="500" cy="292" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="500" y="297" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">b</text>

  <circle cx="632" cy="292" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="632" y="297" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">c</text>

  <circle cx="472" cy="362" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="472" y="367" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">d</text>

  <circle cx="670" cy="362" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="670" y="367" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">e</text>

  <text x="566" y="178" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">total−S(a)</text>
  <text x="448" y="262" font-size="10.5" fill="#8a6015" filter="url(#rough2)">total−S(b)</text>
  <text x="642" y="256" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">total−S(c)</text>
  <text x="446" y="342" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">total−S(d)</text>
  <text x="678" y="342" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">total−S(e)</text>
  <text x="470" y="98" font-size="11" fill="#2f4a66" filter="url(#rough2)">边旁数字 = W(x→v) = total − S(v)</text>

  <text x="650" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">x 到任一 r∈K(c) 的第一条边都是同一条 ⇒ 贡献是常数</text>

  <!-- ===== 结论 ===== -->
  <rect x="60" y="466" width="740" height="88" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="430" y="494" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">ans[r] = total + Σ_{x 为 r 的 Kruskal 真祖辈} W(x → K(c) 中 x 唯一的邻居)</text>
  <text x="430" y="524" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">每条 Kruskal 边的贡献对整棵子树相同 ⇒ 只做一次前缀和：pref[c] = pref[x] + w[c]，O(n α(n))</text>
  <text x="430" y="546" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">其中 W 是「切掉这条边后 x 侧的点权和」，即 total − S(v)（v 为 x 的子节点）或 S(x)（v 是 x 的父亲）</text>
</svg>
