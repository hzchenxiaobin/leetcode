<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：orders = [[10,5,0],[15,2,1],[25,1,1],[30,4,0]]</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">双堆视角逐步走查：买堆·大顶（记号 价格×数量），卖堆·小顶</text>

  <!-- Header -->
  <rect x="15" y="56" width="590" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="37" y="73">步骤</text>
    <text x="109" y="73">到达订单</text>
    <text x="244" y="73">撮合动作</text>
    <text x="384" y="73">买堆（大顶）</text>
    <text x="494" y="73">卖堆（小顶）</text>
    <text x="577" y="73">积压量</text>
  </g>

  <!-- Row separators -->
  <g filter="url(#rough2)" stroke="#ccc" stroke-width="1">
    <path d="M 59 82 L 59 314"/>
    <path d="M 159 82 L 159 314"/>
    <path d="M 329 82 L 329 314"/>
    <path d="M 439 82 L 439 314"/>
    <path d="M 549 82 L 549 314"/>
  </g>

  <!-- Row 1 -->
  <rect x="15" y="82" width="590" height="58" fill="#fdfdfd" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="37" y="116" font-size="12" fill="#446688" font-weight="bold">①</text>
    <text x="109" y="116" font-size="10.5" fill="#446688" font-weight="bold">buy 10×5</text>
    <text x="244" y="104" font-size="10" fill="#555">卖堆为空，无对手方</text>
    <text x="244" y="122" font-size="10" fill="#555">直接入买堆</text>
    <text x="384" y="116" font-size="10.5" fill="#333">10×5</text>
    <text x="494" y="116" font-size="10.5" fill="#aaa">—</text>
    <text x="577" y="116" font-size="12" fill="#333" font-weight="bold">5</text>
  </g>

  <!-- Row 2 -->
  <rect x="15" y="140" width="590" height="58" fill="#fdfdfd" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="37" y="174" font-size="12" fill="#446688" font-weight="bold">②</text>
    <text x="109" y="174" font-size="10.5" fill="#4a7a3a" font-weight="bold">sell 15×2</text>
    <text x="244" y="162" font-size="10" fill="#555">顶买 10 ＜ 15，不成交</text>
    <text x="244" y="180" font-size="10" fill="#555">入卖堆</text>
    <text x="384" y="174" font-size="10.5" fill="#333">10×5</text>
    <text x="494" y="174" font-size="10.5" fill="#333">15×2</text>
    <text x="577" y="174" font-size="12" fill="#333" font-weight="bold">7</text>
  </g>

  <!-- Row 3 -->
  <rect x="15" y="198" width="590" height="58" fill="#fdfdfd" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="37" y="232" font-size="12" fill="#446688" font-weight="bold">③</text>
    <text x="109" y="232" font-size="10.5" fill="#4a7a3a" font-weight="bold">sell 25×1</text>
    <text x="244" y="220" font-size="10" fill="#555">顶买 10 ＜ 25，不成交</text>
    <text x="244" y="238" font-size="10" fill="#555">入卖堆</text>
    <text x="384" y="232" font-size="10.5" fill="#333">10×5</text>
    <text x="494" y="224" font-size="10.5" fill="#333">15×2（顶）</text>
    <text x="494" y="242" font-size="10.5" fill="#333">25×1</text>
    <text x="577" y="232" font-size="12" fill="#333" font-weight="bold">8</text>
  </g>

  <!-- Row 4 (highlighted) -->
  <rect x="15" y="256" width="590" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="37" y="290" font-size="12" fill="#b85450" font-weight="bold">④</text>
    <text x="109" y="290" font-size="10.5" fill="#b85450" font-weight="bold">buy 30×4</text>
    <text x="244" y="272" font-size="10" fill="#555">15 ≤ 30 → 配 2 笔</text>
    <text x="244" y="289" font-size="10" fill="#555">25 ≤ 30 → 配 1 笔</text>
    <text x="244" y="306" font-size="10" fill="#d6a040" font-weight="bold">剩 1 笔入买堆</text>
    <text x="384" y="282" font-size="10.5" fill="#333">10×5</text>
    <text x="384" y="300" font-size="10.5" fill="#b85450" font-weight="bold">30×1（新）</text>
    <text x="494" y="290" font-size="10.5" fill="#aaa">—（清空）</text>
    <text x="577" y="290" font-size="12" fill="#b85450" font-weight="bold">6</text>
  </g>

  <!-- Result box -->
  <rect x="15" y="326" width="590" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终积压 = 买堆（5 + 1 笔）+ 卖堆（0 笔）= 6 → 答案 6</text>

  <!-- Note -->
  <text x="310" y="386" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 ④ 步的 4 笔买入只需 2 次批量撮合（每次配 min(amount, 顶数量) 笔），远快于 4 次单笔循环</text>
</svg>
