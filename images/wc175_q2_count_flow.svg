<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：两趟计数 + 26 次求和</text>
  <text x="360" y="52" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">diff[c] = cntT[c] − cntS[c]，只把为正的桶累加</text>

  <rect x="70" y="72" width="330" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="94" font-size="11.5" fill="#2f4560" font-weight="bold" filter="url(#rough2)">① 扫描 t：把每个字母记进桶</text>
  <text x="86" y="114" font-size="10" fill="#3a4a66" filter="url(#rough2)">diff[ch − 'a'] += 1</text>

  <path d="M 235 124 L 235 137" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="140" width="330" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="162" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 扫描 s：从同样的桶里扣掉</text>
  <text x="86" y="182" font-size="10" fill="#7a6020" filter="url(#rough2)">diff[ch − 'a'] −= 1</text>

  <path d="M 235 192 L 235 205" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="208" width="330" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="230" font-size="11.5" fill="#2f5a26" font-weight="bold" filter="url(#rough2)">③ 遍历 26 个桶，只累加正值</text>
  <text x="86" y="250" font-size="10" fill="#3a5a30" filter="url(#rough2)">if diff[c] &gt; 0: ans += diff[c]</text>

  <path d="M 235 260 L 235 273" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="276" width="190" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="302" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 ans（最少步骤数）</text>

  <rect x="428" y="72" width="272" height="52" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="444" y="94" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">桶的下标就是字母</text>
  <text x="444" y="114" font-size="9.5" fill="#666" filter="url(#rough2)">ch − 'a' 落在 0..25，数组长 26</text>

  <rect x="428" y="140" width="272" height="52" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="444" y="162" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">为什么只累加正值？</text>
  <text x="444" y="182" font-size="9.5" fill="#666" filter="url(#rough2)">diff &gt; 0 即 t 在这字母上多出来了</text>

  <rect x="428" y="208" width="272" height="52" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="444" y="230" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">等价写法</text>
  <text x="444" y="250" font-size="9.5" fill="#666" filter="url(#rough2)">因 Σ diff[c] = 0，故 ans = ½ Σ |diff[c]|</text>

  <rect x="40" y="330" width="640" height="120" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="352" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">以 s = leetcode、t = practice 为例，diff 数组（只画出出现过的字母）</text>

  <rect x="56" y="362" width="50" height="50" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="81" y="382" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">a</text>
  <text x="81" y="404" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">+1</text>

  <rect x="116" y="362" width="50" height="50" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="141" y="382" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">c</text>
  <text x="141" y="404" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">+1</text>

  <rect x="176" y="362" width="50" height="50" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="201" y="382" text-anchor="middle" font-size="10" fill="#2f4560" filter="url(#rough2)">d</text>
  <text x="201" y="404" text-anchor="middle" font-size="13" fill="#2f4560" font-weight="bold" filter="url(#rough2)">−1</text>

  <rect x="236" y="362" width="50" height="50" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="261" y="382" text-anchor="middle" font-size="10" fill="#2f4560" filter="url(#rough2)">e</text>
  <text x="261" y="404" text-anchor="middle" font-size="13" fill="#2f4560" font-weight="bold" filter="url(#rough2)">−2</text>

  <rect x="296" y="362" width="50" height="50" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="321" y="382" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">i</text>
  <text x="321" y="404" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">+1</text>

  <rect x="356" y="362" width="50" height="50" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="381" y="382" text-anchor="middle" font-size="10" fill="#2f4560" filter="url(#rough2)">l</text>
  <text x="381" y="404" text-anchor="middle" font-size="13" fill="#2f4560" font-weight="bold" filter="url(#rough2)">−1</text>

  <rect x="416" y="362" width="50" height="50" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="441" y="382" text-anchor="middle" font-size="10" fill="#2f4560" filter="url(#rough2)">o</text>
  <text x="441" y="404" text-anchor="middle" font-size="13" fill="#2f4560" font-weight="bold" filter="url(#rough2)">−1</text>

  <rect x="476" y="362" width="50" height="50" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="501" y="382" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">p</text>
  <text x="501" y="404" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">+1</text>

  <rect x="536" y="362" width="50" height="50" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="561" y="382" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">r</text>
  <text x="561" y="404" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">+1</text>

  <rect x="596" y="362" width="50" height="50" rx="5" fill="#f5f5f5" stroke="#aaa" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="621" y="382" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">t</text>
  <text x="621" y="404" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="56" y="434" font-size="9.5" fill="#666" filter="url(#rough2)">红：diff &gt; 0，t 多出来，共 5 个 ⇒ 答案 5；蓝：diff &lt; 0，t 缺少，正好接收</text>
</svg>
