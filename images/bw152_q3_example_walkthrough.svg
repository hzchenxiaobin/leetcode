<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">示例 1 演算：每层统计 (H1, m1, H2)，再逐词扫自己的路径</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">words = ["jump","run","run","jump","run"]，k = 2</text>
  <text x="20" y="76" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">深度</text>
  <text x="96" y="76" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">该层前缀</text>
  <text x="232" y="76" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">H1</text>
  <text x="282" y="76" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">m1</text>
  <text x="330" y="76" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">H2</text>
  <text x="392" y="76" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">bestFree</text>
  <rect x="16" y="86" width="528" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="20" y="105" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">1</text>
  <text x="96" y="105" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">j:2, r:3</text>
  <text x="232" y="105" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">3</text>
  <text x="282" y="105" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">1</text>
  <text x="330" y="105" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">2</text>
  <text x="392" y="105" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="16" y="120" width="528" height="28" fill="#f4f7fd" stroke="#446688" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="20" y="139" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">2</text>
  <text x="96" y="139" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">ju:2, ru:3</text>
  <text x="232" y="139" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">3</text>
  <text x="282" y="139" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">1</text>
  <text x="330" y="139" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">2</text>
  <text x="392" y="139" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="16" y="154" width="528" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="20" y="173" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">3</text>
  <text x="96" y="173" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">jum:2, run:3</text>
  <text x="232" y="173" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">3</text>
  <text x="282" y="173" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">1</text>
  <text x="330" y="173" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">2</text>
  <text x="392" y="173" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="16" y="188" width="528" height="28" fill="#f4f7fd" stroke="#446688" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="20" y="207" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">4</text>
  <text x="96" y="207" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">jump:2</text>
  <text x="232" y="207" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">2</text>
  <text x="282" y="207" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">1</text>
  <text x="330" y="207" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">-1</text>
  <text x="392" y="207" text-anchor="start" font-size="10" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="16" y="236" width="528" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">删下标 0 的 jump（长度 4）：逐层看自己的前缀与同层其它前缀</text>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">d=1..3：r 分支计数 3 ≥ k ⇒ 可行；d=4：jump−1 = 1 &lt; k，且无其它 4 长前缀</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ answer[0] = 3（与官方输出一致）</text>
  <rect x="16" y="314" width="528" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">删下标 1 的 run（长度 3）：d ≤ 3 都可行，而 d=4 &gt; |w_i|</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">bestFree[4] = 4（jump 还剩两个）⇒ answer[1] = 4</text>
  <text x="280" y="374" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">这正是「② 不能漏」的地方</text>
  <text x="280.0" y="408" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">最终 answer = [3,4,4,3,4]，与官方输出完全一致</text>
</svg>
