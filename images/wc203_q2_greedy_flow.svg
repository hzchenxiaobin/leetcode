<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：排序后从索引 n 起隔位取数</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 主流程 -->
  <rect x="110" y="55" width="140" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="79" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 piles（3n 堆）</text>

  <path d="M 180 95 L 180 106" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="110" y="110" width="140" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">升序排序</text>

  <path d="M 180 150 L 180 161" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="110" y="165" width="140" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n = len(piles) // 3</text>

  <path d="M 180 205 L 180 216" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="110" y="220" width="140" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="244" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = n，ans = 0</text>

  <path d="M 180 260 L 180 271" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="180,275 255,315 180,355 105,315" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">i &lt; 3n ?</text>

  <!-- 是：循环体 -->
  <text x="193" y="371" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 180 355 L 180 374" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="105" y="380" width="150" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="398" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans += piles[i]</text>
  <text x="180" y="415" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i += 2</text>

  <!-- 回到判断 -->
  <path d="M 180 424 L 180 446 L 44 446 L 44 315 L 99 315" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="112" y="462" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">循环 n 次</text>

  <!-- 否：返回 -->
  <text x="262" y="303" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 255 315 L 312 315" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="318" y="295" width="264" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="313" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>
  <text x="450" y="329" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">= 第 2、4、…、2n 名之和</text>

  <!-- 右侧注记 -->
  <rect x="318" y="120" width="264" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">循环恰好 n 次</text>
  <text x="450" y="158" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i = n, n+2, …, 3n−2（共 n 项）</text>
  <text x="450" y="176" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">再 +2 得 3n，越界退出</text>

  <rect x="318" y="205" width="264" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">不显式模拟轮次</text>
  <text x="450" y="244" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">「每轮选哪 3 堆」只是证明里的存在性</text>
  <text x="450" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">代码只定位你拿的下标即可</text>

  <rect x="318" y="360" width="264" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="381" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">Python 一行</text>
  <text x="450" y="400" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">sum(piles[len(piles)//3::2])</text>
</svg>
