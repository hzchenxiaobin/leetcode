<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：孤独性只由两个一维计数决定</text>
  <text x="260" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1：三个 B 所在的行、列都只有它自己</text>

  <!-- 3x3 网格 -->
  <rect x="98" y="78" width="40" height="40" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="105" text-anchor="middle" font-size="15" fill="#b0b0b0" filter="url(#rough2)">W</text>
  <rect x="142" y="78" width="40" height="40" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="105" text-anchor="middle" font-size="15" fill="#b0b0b0" filter="url(#rough2)">W</text>
  <rect x="186" y="78" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">B</text>

  <rect x="98" y="122" width="40" height="40" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="149" text-anchor="middle" font-size="15" fill="#b0b0b0" filter="url(#rough2)">W</text>
  <rect x="142" y="122" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="149" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">B</text>
  <rect x="186" y="122" width="40" height="40" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="149" text-anchor="middle" font-size="15" fill="#b0b0b0" filter="url(#rough2)">W</text>

  <rect x="98" y="166" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="193" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">B</text>
  <rect x="142" y="166" width="40" height="40" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="193" text-anchor="middle" font-size="15" fill="#b0b0b0" filter="url(#rough2)">W</text>
  <rect x="186" y="166" width="40" height="40" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="193" text-anchor="middle" font-size="15" fill="#b0b0b0" filter="url(#rough2)">W</text>

  <!-- 行计数 -->
  <text x="248" y="72" font-size="9" fill="#667" filter="url(#rough2)">行计数</text>
  <rect x="238" y="84" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="252" y="101" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="238" y="128" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="252" y="145" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="238" y="172" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="252" y="189" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>

  <!-- 列计数 -->
  <text x="80" y="232" text-anchor="end" font-size="9" fill="#667" filter="url(#rough2)">列计数</text>
  <rect x="104" y="214" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="118" y="231" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="148" y="214" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="162" y="231" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="192" y="214" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="206" y="231" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>

  <!-- 条件框 -->
  <rect x="300" y="72" width="196" height="166" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="314" y="94" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">黑格 (i, j) 的判定</text>
  <text x="314" y="118" font-size="10" fill="#555" filter="url(#rough2)">picture[i][j] == 'B'</text>
  <text x="314" y="138" font-size="10" fill="#555" filter="url(#rough2)">且 rowCnt[i] == 1</text>
  <text x="314" y="158" font-size="10" fill="#555" filter="url(#rough2)">且 colCnt[j] == 1</text>
  <path d="M 314 172 L 482 172" stroke="#8899bb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="314" y="192" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">→ 是孤独像素，ans + 1</text>
  <text x="314" y="214" font-size="9.5" fill="#888" filter="url(#rough2)">其余情况一律不计</text>

  <!-- 结论框 -->
  <rect x="40" y="248" width="440" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="270" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">为什么能从 O(mn(m+n)) 降到 O(mn)</text>
  <text x="56" y="292" font-size="10.5" fill="#555" filter="url(#rough2)">「同行/同列还有没有别的黑格」被同一个格子反复查询，预统计一次即可 O(1) 回答。</text>
  <text x="56" y="312" font-size="10.5" fill="#555" filter="url(#rough2)">第二遍只对 rowCnt[i] == 1 的行做判定，其余行整行剪枝。</text>
  <text x="56" y="332" font-size="10.5" fill="#555" filter="url(#rough2)">时间 O(mn)，空间 O(m + n)，不需要哈希表（下标即键）。</text>

  <text x="260" y="370" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 1 的答案：3 个 B 全部同时满足 rowCnt = 1 与 colCnt = 1</text>
</svg>
