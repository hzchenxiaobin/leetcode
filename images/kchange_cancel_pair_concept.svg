<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：抵消对浪费 2 步，改一个少数方向字符恰赚 2</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 前缀字符串 ===== -->
  <g filter="url(#sk)">
    <rect x="210" y="92" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="290" y="92" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="370" y="92" width="56" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="450" y="92" width="56" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="530" y="92" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="238" y="119" text-anchor="middle" font-size="17" fill="#2e5e2e" font-weight="bold">N</text>
  <text x="318" y="119" text-anchor="middle" font-size="17" fill="#2e5e2e" font-weight="bold">N</text>
  <text x="398" y="119" text-anchor="middle" font-size="17" fill="#a04038" font-weight="bold">S</text>
  <text x="478" y="119" text-anchor="middle" font-size="17" fill="#a04038" font-weight="bold">S</text>
  <text x="558" y="119" text-anchor="middle" font-size="17" fill="#3a5a80" font-weight="bold">E</text>
  <text x="640" y="119" font-size="12" fill="#666">← 某个前缀，L = 5</text>

  <!-- 抵消对弧线 -->
  <path d="M 238 88 Q 308 48 398 88" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" filter="url(#sk)"/>
  <path d="M 318 88 Q 398 28 478 88" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="308" y="56" text-anchor="middle" font-size="11" fill="#a04038">抵消对①</text>
  <text x="408" y="34" text-anchor="middle" font-size="11" fill="#a04038">抵消对②</text>

  <!-- ===== y 轴 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="162" width="820" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="80" y="188" font-size="13" font-weight="bold" fill="#2f4f6f">y 轴（南北）：N 与 S 逐对相消</text>
  <text x="80" y="212" font-size="12" fill="#444">2 对抵消：w₁ = min(cN, cS) = 2，净位移 y = 2 − 2 = 0</text>
  <text x="80" y="234" font-size="12" fill="#a04038">这 4 步走了却回到原地，全部白费（浪费 2 × w₁ = 4 步）</text>

  <!-- ===== x 轴 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="260" width="820" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="80" y="286" font-size="13" font-weight="bold" fill="#2e6e2e">x 轴（东西）：无抵消</text>
  <text x="80" y="310" font-size="12" fill="#444">w₂ = min(cE, cW) = 0，净位移 x = 1 − 0 = +1，1 步有效</text>

  <!-- ===== 距离公式 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="344" width="820" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="80" y="370" font-size="13" font-weight="bold" fill="#8a6515">距离 = L − 2(w₁ + w₂) = L − 2w</text>
  <text x="80" y="398" font-size="13" fill="#8a6515" font-weight="bold">本例：5 − 2 × 2 = 1</text>

  <!-- ===== 修改的威力 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="434" width="820" height="150" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="80" y="460" font-size="13" font-weight="bold" fill="#a04038">修改的威力：少数方向 → 同轴多数方向，一次救回一整对</text>
  <text x="80" y="486" font-size="12" fill="#444">把一个 'S' 改成 'N'：净位移从 cN − cS 变为 (cN+1) − (cS−1)，恰好 +2</text>
  <text x="80" y="510" font-size="12" fill="#444">任何单次修改的收益 ≤ 2（新旧位移向量的 L₁ 差至多 2，三角不等式）</text>
  <text x="80" y="534" font-size="12" fill="#444">k = 2：两个 'S' 都改成 'N'，y 净位移 +4</text>
  <text x="80" y="560" font-size="13" fill="#a04038" font-weight="bold">距离 = 5 − 4 + 2×2 = 5 = L，触及上界（前缀长度），封顶！</text>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="602" width="820" height="42" rx="10" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/>
  </g>
  <text x="470" y="629" text-anchor="middle" font-size="14" fill="#5a3a7a" font-weight="bold">f(L) = L − 2w + 2·min(k, w) = L − 2·max(0, w − k)</text>
</svg>
