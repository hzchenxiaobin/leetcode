<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b8548a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="640" height="350" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">反证法：不含端点的最优对总能被"拉得更长"</text>
  <path d="M 140 40 Q 320 50 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- abstract house row: 0 ... i ... j ... n-1 -->
  <g filter="url(#sk2)">
    <rect x="80"  y="70" width="52" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.4"/>
    <rect x="146" y="70" width="52" height="38" rx="4" fill="#f0f0ec" stroke="#999" stroke-width="1.2"/>
    <rect x="212" y="70" width="52" height="38" rx="4" fill="#f0f0ec" stroke="#999" stroke-width="1.2"/>
    <rect x="278" y="70" width="52" height="38" rx="4" fill="#fbe4ec" stroke="#b8548a" stroke-width="2.4"/>
    <rect x="352" y="70" width="52" height="38" rx="4" fill="#fbe4ec" stroke="#b8548a" stroke-width="2.4"/>
    <rect x="426" y="70" width="52" height="38" rx="4" fill="#f0f0ec" stroke="#999" stroke-width="1.2"/>
    <rect x="492" y="70" width="52" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="106" y="94" fill="#2b6e9e">0</text>
    <text x="172" y="94">·</text>
    <text x="238" y="94">·</text>
    <text x="304" y="94" fill="#a03a6a">i</text>
    <text x="378" y="94" fill="#a03a6a">j</text>
    <text x="452" y="94">·</text>
    <text x="518" y="94" fill="#2b6e9e">n−1</text>
  </g>
  <text x="341" y="60" text-anchor="middle" font-size="11" fill="#a03a6a" font-weight="bold">设 (i, j) 为最优对：i ≥ 1 且 j ≤ n−2</text>

  <!-- extension dashed arrows -->
  <path d="M 378 116 Q 300 138 168 128" stroke="#b8548a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="262" y="146" text-anchor="middle" font-size="11" fill="#a03a6a">colors[j] ≠ colors[0] ⇒ (0, j) 距离 j &gt; j−i</text>
  <path d="M 304 116 Q 382 152 512 134" stroke="#c98a2b" stroke-width="1.6" fill="none" stroke-dasharray="5 4" filter="url(#sk)" marker-end="url(#arO)"/>
  <text x="392" y="162" text-anchor="middle" font-size="11" fill="#8a6415">colors[i] ≠ colors[n−1] ⇒ (i, n−1) 距离更长</text>

  <!-- case boxes -->
  <g filter="url(#sk)">
    <rect x="56" y="188" width="528" height="112" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="320" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">逐一分类（colors[i] ≠ colors[j] 是前提）：</text>
  <g font-size="12" fill="#555">
    <text x="76" y="234">① colors[j] ≠ colors[0] → (0, j) 合法且更远，与最优性矛盾 ✗</text>
    <text x="76" y="256">② colors[j] = colors[0]，则 colors[i] ≠ colors[0]：</text>
    <text x="96" y="276">②a colors[n−1] ≠ colors[i] → (i, n−1) 合法且更远，矛盾 ✗</text>
    <text x="96" y="296">②b colors[n−1] = colors[i] → colors[0] ≠ colors[n−1]，(0, n−1) 合法且更远，矛盾 ✗</text>
  </g>

  <g filter="url(#sk)">
    <rect x="170" y="312" width="300" height="28" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="331" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">∴ 最优对必含端点 0 或 n−1 ∎</text>
</svg>
