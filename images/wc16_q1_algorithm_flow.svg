<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 478" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="478" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次线性扫描，遇到 D 段就整体翻转</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">指针 i 只前进不回退，每段 D 恰好被翻转一次</text>

  <rect x="170" y="58" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">res = [1, 2, …, n]，i = 0</text>

  <path d="M 280 92 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,106 390,136 280,166 170,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">s[i] == 'I' ?</text>
  <text x="280" y="148" text-anchor="middle" font-size="9.5" fill="#a08040" filter="url(#rough2)">（i 未越界时）</text>

  <path d="M 390 136 L 410 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="129" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="410" y="118" width="126" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="473" y="141" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">i += 1</text>

  <path d="M 280 166 L 280 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="180" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="140" y="186" width="280" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">j = i；while (j &lt; n−1 且 s[j] == 'D') j += 1</text>

  <path d="M 280 224 L 280 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="240" width="280" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="259" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">翻转 res[i..j]（共 j−i+1 个数）</text>
  <text x="280" y="274" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">然后令 i = j（跳过整段 D）</text>

  <path d="M 280 282 L 280 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,302 380,330 280,358 180,330" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">i &lt; n−1 ?</text>

  <path d="M 180 330 L 92 330 L 92 136 L 166 136" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 280 358 L 280 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="372" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="170" y="378" width="220" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">return res</text>

  <path d="M 473 154 L 473 330 L 382 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="86" y="426" width="388" height="38" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="443" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i 单调递增，扫描 O(n) 步；翻转的元素总数 ≤ n，故总时间 O(n)</text>
  <text x="280" y="457" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">空间 O(n)（结果数组 + 常数变量）</text>
</svg>
