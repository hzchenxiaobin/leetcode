<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">交换论证：把标记推迟到最晚出现秒不吃亏</text>
  <text x="260" y="46" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">下标 2 在 changeIndices = [2,2,2,2,3,2,2,1] 中出现于秒 1,2,3,4,6,7</text>

  <!-- 方案 A：秒 6 标记 -->
  <text x="40" y="76" font-size="12.5" fill="#666" filter="url(#rough2)">方案 A（某个可行方案，标记在秒 6）：</text>

  <rect x="40" y="86" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="90" y="86" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="140" y="86" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="190" y="86" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="240" y="86" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="290" y="86" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="340" y="86" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="390" y="86" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="63" y="109" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="113" y="109" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="163" y="109" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="213" y="109" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="263" y="109" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3</text>
  <text x="313" y="109" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">标2★</text>
  <text x="363" y="109" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">减1↓</text>
  <text x="413" y="109" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>

  <text x="63" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒1</text>
  <text x="113" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒2</text>
  <text x="163" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒3</text>
  <text x="213" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒4</text>
  <text x="263" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒5</text>
  <text x="313" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒6</text>
  <text x="363" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒7</text>
  <text x="413" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒8</text>

  <!-- 交换箭头 -->
  <path d="M313,146 C313,166 363,166 363,146" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="338" y="176" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">交换这两秒的操作</text>

  <!-- 方案 B：秒 7 标记 -->
  <text x="40" y="204" font-size="12.5" fill="#666" filter="url(#rough2)">方案 B（等价可行，标记在最晚出现秒 7）：</text>

  <rect x="40" y="214" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="90" y="214" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="140" y="214" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="190" y="214" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="240" y="214" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="290" y="214" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="340" y="214" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="390" y="214" width="46" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="63" y="237" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="113" y="237" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="163" y="237" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="213" y="237" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="263" y="237" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3</text>
  <text x="313" y="237" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">减1↓</text>
  <text x="363" y="237" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">标2★</text>
  <text x="413" y="237" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>

  <text x="313" y="264" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒6</text>
  <text x="363" y="264" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒7</text>

  <!-- 说明框 -->
  <rect x="36" y="282" width="448" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="302" font-size="12" fill="#333" filter="url(#rough2)">① nums 只减不增：第 6 秒已清零 ⇒ 第 7 秒仍是 0，晚标记依然合法</text>
  <text x="52" y="320" font-size="12" fill="#333" filter="url(#rough2)">② 被换到秒 6 的「减 1」只是提前：减 1 只需早于该下标自己的标记</text>

  <rect x="36" y="340" width="448" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="360" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 逐个下标做这样的交换 ⇒ 只需检验一种方案：</text>
  <text x="52" y="377" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每个下标都推迟到「前 t 秒内的最晚出现秒」标记</text>
</svg>
