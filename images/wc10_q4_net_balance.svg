<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">第一步：把交易流水压成每个人的净额</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1：transactions = [[0,1,10], [2,0,5]]，即 #0 给 #1 十元、#2 给 #0 五元</text>

  <rect x="28" y="66" width="232" height="152" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="90" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">交易流水（历史）</text>
  <rect x="42" y="100" width="204" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="144" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">#0 → #1 ： 10 元</text>
  <rect x="42" y="152" width="204" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="144" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">#2 → #0 ： 5 元</text>

  <path d="M 268 142 L 314 142" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="291" y="132" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">按 ID 归并</text>

  <rect x="320" y="66" width="212" height="152" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="334" y="90" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">净额＝收到 − 付出</text>
  <rect x="334" y="104" width="58" height="52" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="363" y="124" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">#0</text>
  <text x="363" y="146" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">−5</text>
  <rect x="400" y="104" width="58" height="52" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="429" y="124" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">#1</text>
  <text x="429" y="146" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">+10</text>
  <rect x="466" y="104" width="58" height="52" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="495" y="124" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">#2</text>
  <text x="495" y="146" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">−5</text>

  <rect x="28" y="240" width="504" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="264" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">对每笔 [from, to, amount]：bal[from] −= amount，bal[to] += amount</text>
  <text x="44" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">正整数 = 收得太多、应当付出；负整数 = 付得太多、应当收回。所有净额之和恒为 0。</text>

  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">结算只取决于净额：谁曾经给谁多少钱，已经不重要了。</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 1 的净额是 #0 = −5、#1 = +10、#2 = −5，共 3 个非零项、总和为 0</text>
</svg>
