<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：每学期 = 拓扑序的一「层」</text>

  <!-- 例 1 的 DAG -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="96" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="320" cy="96" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="230" cy="210" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="140" y="101">1</text><text x="320" y="101">2</text><text x="230" y="215">3</text>
  </g>
  <path d="M 160 110 L 210 192" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 110 L 250 192" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="140" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="middle">先修课</text>
  <text x="230" y="252" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="middle">1、2 → 3</text>

  <!-- 学期分层框 -->
  <rect x="52" y="66" width="150" height="70" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>
  <rect x="272" y="66" width="150" height="70" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>
  <rect x="158" y="182" width="144" height="60" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>
  <text x="76" y="58" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 1 学期</text>
  <text x="296" y="58" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 1 学期</text>
  <text x="182" y="256" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 2 学期</text>

  <!-- 关键结论框 -->
  <rect x="60" y="292" width="440" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="14" fill="#7a5c1e" filter="url(#rough2)">每学期恰把「入度归零」的课全部上掉 →</text>
  <text x="280" y="342" text-anchor="middle" font-size="14" fill="#7a5c1e" filter="url(#rough2)">学期数 = 分层拓扑的最大层数 =</text>
  <text x="280" y="366" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">DAG 最长路径（按边数）的长度</text>
</svg>
