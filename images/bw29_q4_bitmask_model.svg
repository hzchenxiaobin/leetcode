<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    状态设计：已修课程集合 mask → 最少学期
  </text>

  <!-- mask 位表示 -->
  <text x="120" y="74" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">mask 的二进制位</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="60" y="86" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="102" y="86" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="144" y="86" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="186" y="86" width="42" height="42" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="81" y="103" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="123" y="103" text-anchor="middle" fill="#446688">1</text>
    <text x="165" y="103" text-anchor="middle" fill="#446688">0</text>
    <text x="207" y="103" text-anchor="middle" fill="#999">1</text>
    <text x="81" y="120" text-anchor="middle" fill="#2f5a24" font-size="11">课1</text>
    <text x="123" y="120" text-anchor="middle" fill="#446688" font-size="11">课2</text>
    <text x="165" y="120" text-anchor="middle" fill="#446688" font-size="11">课3</text>
    <text x="207" y="120" text-anchor="middle" fill="#999" font-size="11">课4</text>
  </g>
  <text x="120" y="152" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">= 已修 {1, 2, 4}，值 0b1011</text>

  <!-- dp 定义框 -->
  <rect x="286" y="72" width="204" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="388" y="98" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">dp[mask] = 修完集合</text>
  <text x="388" y="118" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">mask 的最少学期数</text>

  <!-- 无后效性示意 -->
  <g filter="url(#rough2)">
    <path d="M 120 168 C 150 190, 210 190, 240 200" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 388 142 C 370 166, 320 184, 296 196" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 三条到达路径汇于同一状态 -->
  <g filter="url(#rough2)">
    <circle cx="90" cy="248" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="170" cy="272" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="250" cy="248" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="330" cy="272" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="90" y="252" text-anchor="middle" fill="#446688">{2}</text>
    <text x="170" y="276" text-anchor="middle" fill="#446688">{2,3}</text>
    <text x="250" y="252" text-anchor="middle" fill="#446688">{3}</text>
    <text x="330" y="276" text-anchor="middle" fill="#b85450">{1,2,3}</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 104 238 C 200 210, 280 230, 316 258" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 184 264 C 230 270, 280 272, 310 272" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 264 258 C 290 268, 306 270, 314 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="330" y="306" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">dp 只看「修了哪些」</text>
  <text x="330" y="324" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">与到达路径无关（无后效性）</text>

  <!-- 规模标注 -->
  <rect x="404" y="232" width="98" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="453" y="256" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">n ≤ 15</text>
  <text x="453" y="276" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">状态 2¹⁵</text>
  <text x="453" y="296" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">= 32768</text>
</svg>
