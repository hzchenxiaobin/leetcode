<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">超长木材只需切一刀：(x−k) + k</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 原始两根木材 -->
  <g filter="url(#sk)">
    <rect x="60" y="60" width="400" height="34" rx="4" fill="#fff3dd" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="290" y="82" text-anchor="middle" font-size="13" fill="#8a6a2a">木材 x（超长，x &gt; k）</text>
  <g filter="url(#sk)">
    <rect x="480" y="60" width="110" height="34" rx="4" fill="#fff3dd" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="535" y="82" text-anchor="middle" font-size="12" fill="#8a6a2a">m ≤ k</text>
  <path d="M 148 56 l 5 9 l -7 9 l 6 9 l -4 11" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <text x="130" y="50" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">切一刀</text>

  <!-- 箭头：切前 → 切后 -->
  <path d="M 100 98 L 100 130" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 305 98 L 305 130" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 535 98 L 535 130" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 切后三段 -->
  <g filter="url(#sk)">
    <rect x="60" y="138" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="100" y="158" text-anchor="middle" font-size="12" fill="#2e6e2e">x−k</text>
  <g filter="url(#sk)">
    <rect x="150" y="138" width="310" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="305" y="158" text-anchor="middle" font-size="12" fill="#2b5a88">k</text>
  <g filter="url(#sk)">
    <rect x="480" y="138" width="110" height="30" rx="4" fill="#fff3dd" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="535" y="158" text-anchor="middle" font-size="12" fill="#8a6a2a">m</text>

  <!-- 箭头：切段 → 卡车 -->
  <path d="M 100 172 L 100 186" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 305 172 L 305 186" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 535 172 L 535 186" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 三辆卡车 -->
  <g filter="url(#sk)">
    <rect x="55" y="190" width="60" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="25" y="202" width="150" height="36" rx="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="60" cy="244" r="8" fill="#4a4a4a"/>
    <circle cx="140" cy="244" r="8" fill="#4a4a4a"/>
  </g>
  <text x="100" y="226" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">装 x−k</text>
  <text x="100" y="266" text-anchor="middle" font-size="10" fill="#888">限长 ≤ k</text>

  <g filter="url(#sk)">
    <rect x="260" y="190" width="120" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="230" y="202" width="150" height="36" rx="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="265" cy="244" r="8" fill="#4a4a4a"/>
    <circle cx="345" cy="244" r="8" fill="#4a4a4a"/>
  </g>
  <text x="305" y="226" text-anchor="middle" font-size="12" fill="#2b5a88" font-weight="bold">装 k</text>
  <text x="305" y="266" text-anchor="middle" font-size="10" fill="#888">限长 ≤ k</text>

  <g filter="url(#sk)">
    <rect x="465" y="190" width="110" height="14" rx="3" fill="#fff3dd" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="435" y="202" width="150" height="36" rx="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="470" cy="244" r="8" fill="#4a4a4a"/>
    <circle cx="550" cy="244" r="8" fill="#4a4a4a"/>
  </g>
  <text x="510" y="226" text-anchor="middle" font-size="12" fill="#8a6a2a" font-weight="bold">装 m</text>
  <text x="510" y="266" text-anchor="middle" font-size="10" fill="#888">限长 ≤ k</text>

  <!-- 成本公式 -->
  <g filter="url(#sk)">
    <rect x="185" y="280" width="270" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="303" text-anchor="middle" font-size="14" font-weight="bold" fill="#a03a34">最小成本 = (x−k) × k</text>

  <!-- 底部注释 -->
  <g filter="url(#sk)">
    <rect x="40" y="332" width="560" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="349" text-anchor="middle" font-size="11" fill="#888">3 辆卡车 · 每辆至多装 1 段（长 ≤ k）⇒ 至多 3 段 ⇒ 至多切一刀</text>
</svg>
