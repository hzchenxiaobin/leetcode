<svg xmlns="http://www.w3.org/2000/svg" width="760" height="398" viewBox="0 0 760 398"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="398" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四组官方样例的走查：答案由 z 与两个端点唯一决定</text>
  <path d="M 158 40 Q 380 47 602 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="36" y="58" width="688" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">数组 a</text>
  <text x="252" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">z</text>
  <text x="306" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a₀</text>
  <text x="360" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">aₙ₋₁</text>
  <text x="504" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">命中分支</text>
  <text x="682" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 行 1 -->
  <rect x="36" y="98" width="688" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="125" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">0 0</text>
  <text x="252" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="306" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="360" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="504" y="125" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">两端本来就 easy &gt;&gt; 0 次</text>
  <text x="682" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>

  <!-- 行 2 -->
  <rect x="36" y="146" width="688" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="173" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">0 1</text>
  <text x="252" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="306" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="360" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="504" y="173" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">z &lt; 2，凑不出两个 easy</text>
  <text x="682" y="174" text-anchor="middle" font-size="16" font-weight="bold" fill="#a14340" filter="url(#rough2)">−1</text>

  <!-- 行 3 -->
  <rect x="36" y="194" width="688" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="221" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">1 0 0 1 0 0</text>
  <text x="252" y="221" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="306" y="221" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="360" y="221" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="504" y="221" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">恰一端 hard &gt;&gt; 换一次即可</text>
  <text x="682" y="222" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>

  <!-- 行 4 -->
  <rect x="36" y="242" width="688" height="44" rx="5" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="269" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">1 0 0 1 1</text>
  <text x="252" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="306" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="360" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="504" y="269" text-anchor="middle" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">两端都 hard &gt;&gt; 两个 0 各搬一次</text>
  <text x="682" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">2</text>

  <!-- 说明 -->
  <rect x="36" y="300" width="688" height="82" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="52" y="322" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第 4 组的具体操作（官方 Note 给的就是这个）：</text>
  <text x="52" y="344" font-size="12" fill="#2f4a66" filter="url(#rough2)">1 0 0 1 1  →(swap 1,2) 0 1 0 1 1  →(swap 3,5) 0 1 1 1 0，恰好两次。</text>
  <text x="52" y="368" font-size="12" fill="#446688" filter="url(#rough2)">注意 z = 4 与 z = 2 都可能落在同一档：决定答案的是「坏的端点有几个」，不是 z 的大小。</text>
</svg>
