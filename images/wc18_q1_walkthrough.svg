<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="410" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：把每个字母翻译成行号，再看行号是否唯一</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">words = ["Hello", "Alaska", "Dad", "Peace"]　（蓝=第1行　绿=第2行）</text>

  <text x="60" y="76" font-size="11.5" fill="#666" font-weight="bold" filter="url(#rough2)">单词</text>
  <text x="178" y="76" font-size="11.5" fill="#666" font-weight="bold" filter="url(#rough2)">逐字母行号（字母 : 行）</text>
  <text x="490" y="76" font-size="11.5" fill="#666" font-weight="bold" filter="url(#rough2)">结论</text>

  <rect x="36" y="88" width="590" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="118" font-size="12.5" fill="#333" filter="url(#rough2)">Hello</text>
  <text x="178" y="118" font-size="12" filter="url(#rough2)"><tspan fill="#4a7a3a">H:2</tspan><tspan fill="#446688" x="218">e:1</tspan><tspan fill="#4a7a3a" x="258">l:2</tspan><tspan fill="#4a7a3a" x="298">l:2</tspan><tspan fill="#446688" x="338">o:1</tspan></text>
  <path d="M 212 123 L 248 123" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="490" y="118" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">✗ 跨行，丢弃</text>

  <rect x="36" y="140" width="590" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="170" font-size="12.5" fill="#333" filter="url(#rough2)">Alaska</text>
  <text x="178" y="170" font-size="12" fill="#4a7a3a" filter="url(#rough2)">A:2　l:2　a:2　s:2　k:2　a:2</text>
  <text x="490" y="170" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">✓ 保留</text>

  <rect x="36" y="192" width="590" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="222" font-size="12.5" fill="#333" filter="url(#rough2)">Dad</text>
  <text x="178" y="222" font-size="12" fill="#4a7a3a" filter="url(#rough2)">D:2　a:2　d:2</text>
  <text x="490" y="222" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">✓ 保留</text>

  <rect x="36" y="244" width="590" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="274" font-size="12.5" fill="#333" filter="url(#rough2)">Peace</text>
  <text x="178" y="274" font-size="12" filter="url(#rough2)"><tspan fill="#446688">P:1</tspan><tspan fill="#446688" x="218">e:1</tspan><tspan fill="#4a7a3a" x="258">a:2</tspan><tspan fill="#4a7a3a" x="298">c:2</tspan><tspan fill="#446688" x="338">e:1</tspan></text>
  <path d="M 252 279 L 288 279" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="490" y="274" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">✗ 跨行，丢弃</text>

  <rect x="60" y="306" width="540" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="330" font-size="11" fill="#2f4f6f" filter="url(#rough2)">Hello 在第 2 个字符 e 处就与基准 H（第 2 行）不一致 → 立即 break，无需扫完整个单词</text>
  <text x="78" y="352" font-size="11" fill="#2f4f6f" filter="url(#rough2)">Alaska / Dad 全部字符同色（行号唯一）→ 通过；判定只看「行号集合」的大小是否为 1</text>

  <text x="330" y="398" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">输出 ["Alaska", "Dad"]，与输入顺序一致 ✓</text>
</svg>
