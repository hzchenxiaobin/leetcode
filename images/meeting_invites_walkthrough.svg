<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：长环案（示例 3）与二元环案（示例 1）</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: example 3 ===== -->
  <text x="255" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">示例 3：favorite = [3,0,1,4,1] → 4（长环独占）</text>

  <!-- graph arrows -->
  <path d="M 111 163 Q 135 138 166 126" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 207 108 Q 240 104 273 108" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 309 128 Q 345 138 369 157" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 366 186 Q 240 224 114 186" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 385 239 L 385 199" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- cycle nodes -->
  <g font-size="12.5" font-weight="bold">
    <g filter="url(#sk)"><circle cx="95" cy="175" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="95" y="180" text-anchor="middle" fill="#8a6a1a">0</text>
    <g filter="url(#sk)"><circle cx="185" cy="112" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="185" y="117" text-anchor="middle" fill="#8a6a1a">3</text>
    <g filter="url(#sk)"><circle cx="295" cy="112" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="295" y="117" text-anchor="middle" fill="#8a6a1a">4</text>
    <g filter="url(#sk)"><circle cx="385" cy="175" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="385" y="180" text-anchor="middle" fill="#8a6a1a">1</text>
  </g>
  <g filter="url(#sk)"><circle cx="385" cy="258" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="385" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">2</text>

  <!-- kahn steps -->
  <g font-family="monospace" font-size="11.5" fill="#444">
    <text x="66" y="300">indeg = [1,2,0,1,1]   队列 = [2]</text>
    <text x="66" y="322">剥 2 → favorite=1：depth[1] = 1，indeg[1]：2→1</text>
    <text x="66" y="344">队列空，剩余 {0,1,3,4}</text>
    <text x="66" y="366">环 0→3→4→1→0，L = 4 → maxCycle = 4</text>
    <text x="66" y="388">答案 = max(4, 0) = 4</text>
  </g>

  <!-- result box A -->
  <g filter="url(#sk)">
    <rect x="60" y="404" width="395" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="76" y="426" font-size="12" font-weight="bold" fill="#8a6a1a">答案 4：座次 0-3-4-1（环序）✓</text>
  <text x="76" y="446" font-size="10.5" fill="#888">员工 2 想坐 1 旁边，但 1 的两个邻位已被 0 与 4 占满</text>
  <text x="76" y="460" font-size="10.5" fill="#b85450">depth[1] = 1 成为废数据 —— 长环独占，挂链上不了桌</text>

  <!-- ===== Panel B: example 1 ===== -->
  <text x="710" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">示例 1：favorite = [2,2,1,2] → 3（二元环拼链）</text>

  <!-- graph arrows -->
  <path d="M 611 142 Q 668 130 724 142" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 724 158 Q 668 170 611 158" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 635 245 Q 680 205 727 166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 818 244 Q 790 205 760 169" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- pair nodes -->
  <g font-size="12.5" font-weight="bold">
    <g filter="url(#sk)"><circle cx="590" cy="150" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="590" y="155" text-anchor="middle" fill="#8a6a1a">1</text>
    <g filter="url(#sk)"><circle cx="745" cy="150" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="745" y="155" text-anchor="middle" fill="#8a6a1a">2</text>
  </g>
  <text x="667" y="192" text-anchor="middle" font-size="10" fill="#888">互为 favorite</text>

  <!-- fan nodes -->
  <g filter="url(#sk)"><circle cx="620" cy="258" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="620" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">0</text>
  <g filter="url(#sk)"><circle cx="830" cy="258" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="830" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">3</text>

  <!-- kahn steps -->
  <g font-family="monospace" font-size="11.5" fill="#444">
    <text x="520" y="300">indeg = [0,1,3,0]   队列 = [0, 3]</text>
    <text x="520" y="322">剥 0 → favorite=2：depth[2] = 1</text>
    <text x="520" y="344">剥 3 → favorite=2：depth[2] = max(1, 1) = 1</text>
    <text x="520" y="366">队列空，剩余 {1,2}：二元环，L = 2</text>
    <text x="520" y="388">sum2 = 2 + depth[1] + depth[2] = 3</text>
  </g>
  <text x="538" y="344" font-size="10.5" font-weight="bold" fill="#b85450">↑ 取 max 不累加</text>

  <!-- result box B -->
  <g filter="url(#sk)">
    <rect x="510" y="404" width="400" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="526" y="426" font-size="12" font-weight="bold" fill="#2e6e2e">答案 3：座次 0-1-2 ✓（换 1-2-3 亦可）</text>
  <text x="526" y="446" font-size="10.5" fill="#888">0 与 3 都喜欢 2，但 2 的自由邻位只能挂一条链</text>
  <text x="526" y="460" font-size="10.5" fill="#4a7a3a">depth[2] = 1 恰是挂链长，直接进贡献公式</text>

  <!-- ===== compare box ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="496" width="850" height="96" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="522" font-size="13" font-weight="bold" fill="#2b2b2b">对照</text>
  <text x="80" y="546" font-size="11.5" fill="#444">同一个 Kahn 过程服务两种统计：长环案只看「剩余节点构成的环长」；二元环案额外用上 depth。</text>
  <text x="80" y="568" font-size="11.5" fill="#444">两案的队列都只剥了「没人喜欢的人」—— 剩余结构的形态差异（4-环 vs 2-环）决定统计方式。</text>
  <text x="80" y="590" font-size="11.5" fill="#7a2828">赛场节奏：先画 ρ 形图 → 立刻看出「环长 2 特殊」→ 套 Kahn 剥链模板，10 分钟内可落笔。</text>
</svg>
