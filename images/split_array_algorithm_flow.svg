<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="900" height="700" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟计数，频次超 2 立即否决</text>
  <path d="M 250 44 Q 450 52 650 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <rect x="375" y="56" width="150" height="42" rx="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">开始</text>
  <path d="M 450 98 L 450 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="340" y="118" width="220" height="44" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="145" text-anchor="middle" font-size="13" fill="#333">cnt[1..100] = 0（值域数组）</text>
  <path d="M 450 162 L 450 178" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- 取元素 -->
  <rect x="330" y="182" width="240" height="44" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="209" text-anchor="middle" font-size="13" fill="#333">取 nums 的下一个元素 x</text>
  <path d="M 450 226 L 450 242" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- 计数 -->
  <rect x="355" y="246" width="190" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">++cnt[x]</text>
  <path d="M 450 290 L 450 308" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- 判断 1 -->
  <polygon points="450,312 560,356 450,400 340,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="361" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">cnt[x] &gt; 2 ?</text>
  <path d="M 560 356 L 651 356" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="600" y="348" text-anchor="middle" font-size="12" fill="#b85450">是</text>
  <rect x="655" y="333" width="160" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="735" y="361" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">return false</text>
  <path d="M 450 400 L 450 424" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="466" y="417" font-size="12" fill="#666">否</text>

  <!-- 判断 2 -->
  <polygon points="450,428 555,472 450,516 345,472" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="477" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">还有元素 ?</text>
  <path d="M 450 516 L 450 538" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="466" y="532" font-size="12" fill="#666">否</text>
  <rect x="365" y="542" width="170" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">return true</text>

  <!-- 回环 -->
  <path d="M 345 472 L 255 472 Q 245 472 245 462 L 245 214 Q 245 204 255 204 L 324 204" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="295" y="462" text-anchor="middle" font-size="12" fill="#666">是（继续）</text>

  <!-- 走查 -->
  <rect x="70" y="610" width="760" height="76" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="94" y="638" font-size="12.5" fill="#444">走查 [1,1,2,2,3,4]：频次 1:2、2:2、3:1、4:1，最大频次 2 → 从绿色出口 return true</text>
  <text x="94" y="664" font-size="12.5" fill="#444">走查 [1,1,1,1]：扫到第 3 个 1 时 cnt[1] = 3 &gt; 2 → 从红色出口立即 return false（提前剪枝）</text>
</svg>
