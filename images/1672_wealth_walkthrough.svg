<svg xmlns="http://www.w3.org/2000/svg" width="540" height="340" viewBox="0 0 540 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="540" height="340" fill="#fafafa"/>
  <text x="270" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：accounts = [[1,5],[7,3],[3,5]]</text>
  <text x="270" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">打擂台：逐行求和，边算边维护最大值</text>

  <g filter="url(#r)">
    <rect x="30" y="62" width="480" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="52" y="95" font-size="13" fill="#333" font-family="monospace" filter="url(#r)">① 客户 0：1 + 5 = 6</text>
  <text x="488" y="95" text-anchor="end" font-size="12" fill="#446688" font-family="monospace" filter="url(#r)">ans：0 → 6</text>

  <g filter="url(#r)">
    <path d="M 270 118 L 270 126" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#r)">
    <rect x="30" y="130" width="480" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="52" y="163" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace" filter="url(#r)">② 客户 1：7 + 3 = 10</text>
  <text x="488" y="163" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold" font-family="monospace" filter="url(#r)">ans：6 → 10，新最大！</text>

  <g filter="url(#r)">
    <path d="M 270 186 L 270 194" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#r)">
    <rect x="30" y="198" width="480" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="52" y="231" font-size="13" fill="#333" font-family="monospace" filter="url(#r)">③ 客户 2：3 + 5 = 8</text>
  <text x="488" y="231" text-anchor="end" font-size="12" fill="#446688" font-family="monospace" filter="url(#r)">8 &lt; 10，ans 不变</text>

  <g filter="url(#r)">
    <path d="M 270 254 L 270 264" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#r)">
    <rect x="105" y="268" width="330" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="270" y="298" text-anchor="middle" font-size="15" fill="#b07818" font-weight="bold" font-family="monospace" filter="url(#r)">返回 ans = 10 ✓</text>
</svg>
