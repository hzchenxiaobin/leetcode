<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：nums = [2,3,1,3,2]</text>

  <!-- 输入 -->
  <g filter="url(#rough2)">
    <rect x="40" y="54" width="480" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#555" text-anchor="middle">
    <text x="88" y="81">2</text><text x="208" y="81">3</text><text x="328" y="81">1</text><text x="448" y="81">3</text><text x="518" y="81">2</text>
  </g>
  <path d="M 88 100 C 88 116, 88 124, 88 138" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 208 100 C 208 120, 220 132, 232 140" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 328 100 C 328 122, 340 132, 352 140" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 448 100 C 448 116, 448 124, 448 138" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 频率表 -->
  <g filter="url(#rough2)">
    <rect x="40" y="142" width="480" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#2d5a22" text-anchor="middle">
    <text x="88" y="166">freq[2]=2</text><text x="208" y="166">freq[3]=2</text><text x="328" y="166">freq[1]=1</text>
    <text x="448" y="166">freq[3]=2</text><text x="518" y="166">freq[2]=2</text>
    <text x="88" y="184" font-size="11">键 (2,−2)</text><text x="208" y="184" font-size="11">键 (2,−3)</text>
    <text x="328" y="184" font-size="11">键 (1,−1)</text><text x="448" y="184" font-size="11">键 (2,−3)</text><text x="518" y="184" font-size="11">键 (2,−2)</text>
  </g>

  <path d="M 280 194 C 280 208, 280 216, 280 226" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="216" font-size="12.5" fill="#446688" filter="url(#rough2)">按键升序</text>

  <!-- 输出 -->
  <g filter="url(#rough2)">
    <rect x="40" y="230" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#446688" text-anchor="middle">
    <text x="88" y="257">1</text><text x="208" y="257">3</text><text x="328" y="257">3</text><text x="448" y="257">2</text><text x="518" y="257">2</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#999" text-anchor="middle">
    <text x="88" y="270">(1,−1)</text><text x="268" y="270">(2,−3) 组内降序：3 在 2 前</text><text x="483" y="270">(2,−2)</text>
  </g>

  <text x="280" y="304" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">输出 [1, 3, 3, 2, 2]：频率 1 → 频率 2；同频的 3 与 2 按 −val 升序（即 3 先）</text>
</svg>
