<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">好序列的充要判据：|b| ≥ min(b) + 1</text>
  <path d="M 165 44 Q 380 52 600 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">每次操作恰好删 1 个元素，而终态必须非空</text>

  <rect x="34" y="84" width="330" height="176" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="199" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">必要性：操作次数上界</text>
  <text x="54" y="138" font-size="12.5" fill="#333" filter="url(#rough2)">设 |b| = m，共做 k 次操作</text>
  <text x="54" y="164" font-size="12.5" fill="#333" filter="url(#rough2)">每次恰好删 1 个 ⇒ k ≤ m − 1</text>
  <text x="54" y="190" font-size="12.5" fill="#333" filter="url(#rough2)">存活元素 p 恰被覆盖 b_p 次</text>
  <text x="54" y="216" font-size="12.5" fill="#333" filter="url(#rough2)">⇒ b_p ≤ k ≤ m − 1</text>
  <text x="54" y="246" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">得 m ≥ min(b) + 1</text>

  <text x="380" y="178" text-anchor="middle" font-size="24" fill="#b85450" filter="url(#rough2)">⇔</text>

  <rect x="396" y="84" width="330" height="176" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="561" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">充分性：留下最小值</text>
  <text x="416" y="138" font-size="12.5" fill="#333" filter="url(#rough2)">取 p 满足 b_p = d = min(b)</text>
  <text x="416" y="164" font-size="12.5" fill="#333" filter="url(#rough2)">重复 d 轮：删掉离 p 最近的邻居</text>
  <text x="416" y="190" font-size="12.5" fill="#333" filter="url(#rough2)">区间只剩 p 与目标，p 恰减 d 次</text>
  <text x="416" y="216" font-size="12.5" fill="#333" filter="url(#rough2)">p 归零后，余下正数逐个单点删</text>
  <text x="416" y="246" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">终态 [0]，长度 m 保住</text>

  <rect x="34" y="286" width="692" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="312" font-size="13.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">一条不等式统一两种情形</text>
  <text x="58" y="338" font-size="12.5" fill="#333" filter="url(#rough2)">含 0：min = 0，m ≥ 1 自动成立 —— 把正数单点删光即可</text>
  <text x="58" y="364" font-size="12.5" fill="#333" filter="url(#rough2)">全正：必须 m ≥ min(b) + 1，例如 [2,2,2] 好、[2,2] 不好</text>

  <text x="380" y="412" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">题名里的 Sequence Decreasing 只是包装，与序列是否单调无关</text>
</svg>
