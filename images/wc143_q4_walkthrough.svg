<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：!(&amp;(f,t)) 的栈变化</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">(!,F) 表示「运算符 ! 累计值 F」；栈自底向顶书写</text>

  <rect x="30" y="58" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="72" y="74" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">字符</text>
  <text x="222" y="74" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="430" y="74" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">栈（底 → 顶）</text>

  <rect x="30" y="250" width="500" height="48" fill="#fdf0f2" stroke="none" filter="url(#rough2)"/>

  <line x1="30" y1="82" x2="530" y2="82" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="106" x2="530" y2="106" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="130" x2="530" y2="130" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="154" x2="530" y2="154" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="178" x2="530" y2="178" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="202" x2="530" y2="202" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="226" x2="530" y2="226" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="250" x2="530" y2="250" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="274" x2="530" y2="274" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="298" x2="530" y2="298" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="112" y1="58" x2="112" y2="298" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="334" y1="58" x2="334" y2="298" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <g font-size="11" text-anchor="middle" fill="#444" filter="url(#rough2)">
    <text x="72" y="101" font-weight="bold">!</text>
    <text x="72" y="125">(</text>
    <text x="72" y="149" font-weight="bold">&amp;</text>
    <text x="72" y="173">(</text>
    <text x="72" y="197" font-weight="bold">f</text>
    <text x="72" y="221">,</text>
    <text x="72" y="245" font-weight="bold">t</text>
    <text x="72" y="269" font-weight="bold">)</text>
    <text x="72" y="293" font-weight="bold">)</text>
  </g>

  <g font-size="10" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="222" y="101">压入 (!, false)</text>
    <text x="222" y="125">忽略</text>
    <text x="222" y="149">压入 (&amp;, true)</text>
    <text x="222" y="173">忽略</text>
    <text x="222" y="197">并入 &amp;：true AND false</text>
    <text x="222" y="221">忽略</text>
    <text x="222" y="245">并入 &amp;：false AND true</text>
    <text x="222" y="269" fill="#8a3a36">弹出 (&amp;,F) 交给 ! 取反</text>
    <text x="222" y="293" fill="#8a3a36">弹出 (!,T)，栈空 ⇒ 答案</text>
  </g>

  <g font-size="11" text-anchor="middle" fill="#3a4a66" filter="url(#rough2)">
    <text x="430" y="101">(!,F)</text>
    <text x="430" y="125">(!,F)</text>
    <text x="430" y="149">(!,F)  (&amp;,T)</text>
    <text x="430" y="173">(!,F)  (&amp;,T)</text>
    <text x="430" y="197">(!,F)  (&amp;,F)</text>
    <text x="430" y="221">(!,F)  (&amp;,F)</text>
    <text x="430" y="245">(!,F)  (&amp;,F)</text>
    <text x="430" y="269" fill="#b85450" font-weight="bold">(!,T)</text>
    <text x="430" y="293" fill="#b85450" font-weight="bold">空</text>
  </g>

  <rect x="66" y="310" width="428" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="84" y="330" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">为什么第 8 步就得到 true？</text>
  <text x="84" y="348" font-size="10" fill="#555" filter="url(#rough2)">'!' 只有一个子式，所以归并时直接覆盖：acc = NOT false = true；</text>
  <text x="84" y="366" font-size="10" fill="#555" filter="url(#rough2)">第 9 步弹栈后栈为空，说明整式已结算，true 即最终答案。</text>
</svg>
