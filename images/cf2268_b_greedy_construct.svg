<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">构造：每个偶权位置只有 2 个坏 gap，所以能一次全救活</text>
  <path d="M 96 46 Q 380 54 664 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">设 gap = s_(i−1) ⊕ s_i：a′_i = a_i ⊕ gap，要它落在 {0,3,6,9,12,15} 里</text>

  <text x="56" y="96" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">gap 的 8 种取值（例：a_i = 3，则坏 gap 是 3⊕5 = 6 与 3⊕10 = 9）</text>
  <rect x="56" y="108" width="62" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="87" y="134" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="136" y="108" width="62" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="167" y="134" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <rect x="216" y="108" width="62" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="247" y="134" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <rect x="296" y="108" width="62" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="327" y="134" text-anchor="middle" font-size="15" fill="#8d3a36" filter="url(#rough2)">6</text>
  <path d="M 302 112 L 352 144 M 352 112 L 302 144" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="376" y="108" width="62" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="407" y="134" text-anchor="middle" font-size="15" fill="#8d3a36" filter="url(#rough2)">9</text>
  <path d="M 382 112 L 432 144 M 432 112 L 382 144" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="456" y="108" width="62" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="487" y="134" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">10</text>
  <rect x="536" y="108" width="62" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="567" y="134" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">12</text>
  <rect x="616" y="108" width="62" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="647" y="134" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">15</text>

  <text x="380" y="170" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">8 个 gap 里只有 2 个会让 a_i ⊕ gap 变成 5 或 10（偶权但不是 3 的倍数），其余 6 个都合格</text>

  <rect x="30" y="184" width="700" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="210" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">依次定 s_1, s_2, …, s_(n−1)（s_0 = 0 已知）</text>
  <text x="52" y="238" font-size="12.5" fill="#333" filter="url(#rough2)">① i = 1 … n−2：只需让位置 i 变好，禁 s_i ∈ {s_(i−1)⊕a_i⊕5, s_(i−1)⊕a_i⊕10}，8 − 2 = 6 个可选</text>
  <text x="52" y="264" font-size="12.5" fill="#333" filter="url(#rough2)">② i = n−1：要同时照顾位置 n−1 与位置 n（因 s_n = 0），禁忌至多 4 个 ⇒ 仍剩 ≥ 4 个可选，绝不会空</text>
  <text x="52" y="290" font-size="12.5" fill="#333" filter="url(#rough2)">③ 奇权位置：随便取 s_i 即可，它本来就救不回来，也不妨碍任何别的段</text>
  <text x="52" y="318" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">每步都有 ≥ 4 个合法选择 ⇒ 所有偶权位置可以同时变成 All-Meat</text>

  <rect x="30" y="348" width="700" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">答案 = popcount(a_i) 为偶数的位置个数</text>
  <text x="380" y="402" text-anchor="middle" font-size="11.5" fill="#5d6b58" filter="url(#rough2)">上界由奇权不变量给出，下界由上述贪心构造给出，两者相等</text>
</svg>
