<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#fafafa"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">一趟扫描：四个计数器 + 逐前缀取最大</text>
  <path d="M 280 42 Q 450 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="260" y="62" width="380" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="450" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">开始</text>
  <text x="450" y="106" text-anchor="middle" font-size="12" fill="#444">cN = cS = cE = cW = 0，ans = 0</text>

  <path d="M 450 118 L 450 134" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- 计数 -->
  <g filter="url(#sk)">
    <rect x="260" y="140" width="380" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="450" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f6f">读入下一个字符 s[i]</text>
  <text x="450" y="186" text-anchor="middle" font-size="12" fill="#444">对应方向计数器 +1（O(1) 增量维护）</text>

  <path d="M 450 200 L 450 216" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- w -->
  <g filter="url(#sk)">
    <rect x="260" y="222" width="380" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="450" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f6f">计算抵消对个数</text>
  <text x="450" y="268" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">w = min(cN,cS) + min(cE,cW)</text>

  <path d="M 450 282 L 450 298" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- 更新答案 -->
  <g filter="url(#sk)">
    <rect x="200" y="304" width="500" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="450" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6515">用当前前缀的最优值更新答案</text>
  <text x="450" y="358" text-anchor="middle" font-size="13" fill="#8a6515" font-weight="bold" font-family="monospace">ans = max(ans, (i+1) − 2w + 2·min(k, w))</text>

  <path d="M 450 376 L 450 394" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- 判断 -->
  <g filter="url(#sk)">
    <polygon points="450,400 560,446 450,492 340,446" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="450" y="451" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">读完整个串？</text>

  <!-- 是 → 返回 -->
  <path d="M 450 492 L 450 514" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="462" y="508" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="310" y="520" width="280" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="450" y="544" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 ans（全程最大距离）</text>
  <text x="450" y="564" text-anchor="middle" font-size="11" fill="#666">每个字符进循环体一次，时间 O(n)</text>

  <!-- 否 → 回环 -->
  <path d="M 340 446 L 150 446 Q 140 446 140 430 L 140 170 Q 140 170 158 170 L 254 170" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arO)"/>
  <text x="300" y="434" font-size="12" fill="#a04038" font-weight="bold">否</text>

  <!-- 侧注 -->
  <g filter="url(#sk)">
    <rect x="660" y="304" width="210" height="110" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="676" y="330" font-size="11" font-weight="bold" fill="#555">等价形式：</text>
  <text x="676" y="352" font-size="11" fill="#555" font-family="monospace">f(L) = L − 2·max(0, w−k)</text>
  <text x="676" y="376" font-size="11" fill="#555">k ≥ w 时 f = L，触及上界</text>
  <text x="676" y="398" font-size="11" fill="#555">（前缀长度，封顶）</text>

  <text x="450" y="620" text-anchor="middle" font-size="11" fill="#888">空间 O(1)：仅 4 个计数器 + 常数个标量</text>
</svg>
