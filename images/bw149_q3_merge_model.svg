<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">移动会议 i：把 gap[i] + len(i) + gap[i+1] 连成一片</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只动一个会议，所以只会影响它左右两段空档；其余空档原封不动</text>

  <text x="46" y="82" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">原布局</text>
  <g filter="url(#rough2)">
    <rect x="60" y="92" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="200" y="92" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <rect x="330" y="92" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="130" y="98" width="70" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="260" y="98" width="70" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="95" y="112" fill="#3a4a66" filter="url(#rough2)">会议 i−1</text>
    <text x="230" y="112" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">会议 i</text>
    <text x="365" y="112" fill="#3a4a66" filter="url(#rough2)">会议 i+1</text>
    <text x="165" y="112" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">gap[i]</text>
    <text x="295" y="112" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">gap[i+1]</text>
  </g>

  <path d="M 230 132 L 230 158" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="46" y="182" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">移走会议 i 后（顺序允许改变，会议可停到任意空档）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="192" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="330" y="192" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="130" y="192" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="95" y="212" fill="#3a4a66" filter="url(#rough2)">会议 i−1</text>
    <text x="365" y="212" fill="#3a4a66" filter="url(#rough2)">会议 i+1</text>
    <text x="230" y="212" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">空余 = gap[i] + len(i) + gap[i+1]</text>
  </g>

  <path d="M 230 226 L 230 250" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="46" y="254" width="270" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="274" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">情形 A：别处有空档装得下 len(i)</text>
  <text x="60" y="292" font-size="10.5" fill="#555" filter="url(#rough2)">存在 j ∉ {i, i+1} 使 gap[j] ≥ len(i)：</text>
  <text x="60" y="309" font-size="10.5" fill="#555" filter="url(#rough2)">把会议 i 塞进 gap[j]，合并段保持完整。</text>
  <text x="60" y="320" font-size="10" fill="#4a7a3a" filter="url(#rough2)">候选值 = gap[i] + len(i) + gap[i+1]</text>

  <rect x="334" y="254" width="240" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="348" y="274" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">情形 B：没有空档装得下</text>
  <text x="348" y="292" font-size="10.5" fill="#555" filter="url(#rough2)">只好把会议 i 贴进合并段的一端，</text>
  <text x="348" y="309" font-size="10.5" fill="#555" filter="url(#rough2)">吃掉 len(i)，剩下的连续空余就是</text>
  <text x="348" y="320" font-size="10" fill="#8a6a20" filter="url(#rough2)">候选值 = gap[i] + gap[i+1]</text>

  <text x="310" y="337" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">“能不能装下”只需看除 gap[i]、gap[i+1] 之外的最大空档，前后缀最大值 O(1) 查询</text>
</svg>
