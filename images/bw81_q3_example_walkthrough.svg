<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [3,2,4,6] → 7</text>

  <!-- 二进制展开 -->
  <text x="280" y="62" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">四个数的二进制展开（位 2 | 位 1 | 位 0）：</text>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <rect x="180" y="74" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="280" y="95">3 = 0 1 1</text>
    <rect x="180" y="108" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="280" y="129">2 = 0 1 0</text>
    <rect x="180" y="142" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="280" y="163">4 = 1 0 0</text>
    <rect x="180" y="176" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="280" y="197">6 = 1 1 0</text>
  </g>

  <!-- 各位计数 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="40" y="224" width="480" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="130" y="244">位 2：4、6 → 2 个 1</text>
    <text x="280" y="244">位 1：3、2、6 → 3 个 1</text>
    <text x="430" y="244">位 0：3 → 1 个 1</text>
    <rect x="40" y="254" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="130" y="274">偶数 → 清一个</text>
    <text x="280" y="274" fill="#4a7a3a" font-weight="bold">奇数 → 直接为 1</text>
    <text x="430" y="274" fill="#4a7a3a" font-weight="bold">奇数 → 直接为 1</text>
  </g>

  <!-- 具体操作 -->
  <g filter="url(#rough2)">
    <rect x="40" y="292" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="280" y="310" text-anchor="middle">官方解之一：取 x = 4、i = 3：nums[3] = 6 AND (6 XOR 4) = 6 AND 2 = 110 AND 010 = 010 = 2</text>
    <text x="280" y="330" text-anchor="middle" font-weight="bold" fill="#4a7a3a">位 2 的 1 从 2 个变 1 个 → 3 XOR 2 XOR 4 XOR 2 = 011 XOR 010 XOR 100 XOR 010 = 111₂ = 7 ✓</text>
  </g>
  <text x="280" y="356" font-size="12.5" fill="#888" filter="url(#rough2)" text-anchor="middle">示例 2：nums = [1,2,3,9,2]，按位 OR = 1011₂ = 11，一次操作都不用做（各 1 位数恰为奇数）</text>
  <text x="280" y="374" font-size="12.5" fill="#888" filter="url(#rough2)" text-anchor="middle">注意答案 11 &gt; 9 = max(nums)：答案与单个元素大小无关，只由「哪些位出现过 1」决定</text>
</svg>
