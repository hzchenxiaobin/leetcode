<svg xmlns="http://www.w3.org/2000/svg" width="640" height="355" viewBox="0 0 640 355" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="355" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n = 1002 与 n = 998</text>
  <path d="M 180 38 Q 320 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- zone labels -->
  <text x="195" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1 ~ 999：不足四位，无逗号</text>
  <text x="465" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">≥ 1000：标准格式带逗号</text>

  <!-- zones -->
  <g filter="url(#sk)">
    <rect x="55" y="70" width="280" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="345" y="70" width="240" height="54" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>

  <!-- number line -->
  <path d="M 65 92 L 575 92" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <g stroke="#3a3a3a" stroke-width="1.3" filter="url(#sk)">
    <line x1="100" y1="86" x2="100" y2="98"/>
    <line x1="160" y1="86" x2="160" y2="98"/>
    <line x1="225" y1="86" x2="225" y2="98"/>
    <line x1="290" y1="86" x2="290" y2="98"/>
    <line x1="390" y1="86" x2="390" y2="98"/>
    <line x1="470" y1="86" x2="470" y2="98"/>
    <line x1="550" y1="86" x2="550" y2="98"/>
  </g>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="100" y="116">…</text>
    <text x="160" y="116">997</text>
    <text x="225" y="116">998</text>
    <text x="290" y="116">999</text>
    <text x="390" y="116">1000</text>
    <text x="470" y="116">1001</text>
    <text x="550" y="116">1002</text>
  </g>

  <!-- formatted numbers -->
  <text x="195" y="160" text-anchor="middle" font-size="13" fill="#2e6e2e">997 998 999（直接写，无逗号）</text>
  <g font-size="15" font-family="monospace" font-weight="bold">
    <text x="372" y="168" text-anchor="middle" fill="#2b6e9e">1</text>
    <text x="381" y="168" text-anchor="middle" fill="#b85450">,</text>
    <text x="399" y="168" text-anchor="middle" fill="#2b6e9e">000</text>
    <text x="452" y="168" text-anchor="middle" fill="#2b6e9e">1</text>
    <text x="461" y="168" text-anchor="middle" fill="#b85450">,</text>
    <text x="479" y="168" text-anchor="middle" fill="#2b6e9e">001</text>
    <text x="532" y="168" text-anchor="middle" fill="#2b6e9e">1</text>
    <text x="541" y="168" text-anchor="middle" fill="#b85450">,</text>
    <text x="559" y="168" text-anchor="middle" fill="#2b6e9e">002</text>
  </g>
  <g fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#sk)">
    <ellipse cx="381" cy="163" rx="5.5" ry="8"/>
    <ellipse cx="461" cy="163" rx="5.5" ry="8"/>
    <ellipse cx="541" cy="163" rx="5.5" ry="8"/>
  </g>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="150" y="192" width="340" height="50" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">逗号总数 = 3 个数 × 1 = 3 ✓</text>
  <text x="320" y="234" text-anchor="middle" font-size="11" fill="#888">= 1002 − 999，即 [1000, 1002] 的整数个数</text>

  <!-- divider -->
  <path d="M 100 260 Q 320 268 540 260" stroke="#cccccc" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- mini case: n = 998 -->
  <g filter="url(#sk)">
    <rect x="80" y="280" width="100" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="130" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">n = 998</text>
  <path d="M 186 303 L 214 303" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="222" y="280" width="200" height="46" rx="8" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.3"/>
  </g>
  <text x="322" y="308" text-anchor="middle" font-size="13" fill="#555">[1000, 998] 为空区间</text>
  <path d="M 428 303 L 456 303" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="464" y="280" width="130" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="529" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">答案 0 ✓</text>
</svg>
