  <text x="320" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">总和 = 5 + 7 + 5 = 17</text>

  <!-- 洞察框 -->
  <rect x="48" y="384" width="560" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="403" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">若第一组在 7 上闭合（如 [2,3,5,7]…），值和都是 19；把 7 藏进组内、在 5 上闭合 → 17</text>
  <text x="328" y="423" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">「最小化」的本质：为每一次闭合挑最便宜的组尾（组内其余元素全部免费）</text>
