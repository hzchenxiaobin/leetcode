<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="430" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把 5000 个单词按「下一个待匹配字符」分桶</text>
  <text x="350" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">扫描 s 时，只有当前字符对应的那个桶会被推进</text>

  <rect x="170" y="64" width="360" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="350" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">每条记录 = (单词下标 i，已匹配长度 p)</text>
  <text x="350" y="98" text-anchor="middle" font-size="10" fill="#5a6a86" filter="url(#rough2)">下一步需要的字符是 words[i][p]</text>

  <path d="M 350 106 L 350 128" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="130" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="350" y="152" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">按 words[i][p] 放进 26 个桶之一</text>

  <path d="M 350 164 L 350 174 L 106 174 L 106 184" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="188" width="108" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="106" y="206" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">bucket['a']</text>
  <rect x="174" y="188" width="108" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="228" y="206" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">bucket['b']</text>
  <rect x="296" y="188" width="108" height="26" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="350" y="206" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">bucket['c']</text>
  <rect x="418" y="188" width="108" height="26" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="472" y="206" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">bucket['d']</text>
  <rect x="540" y="188" width="108" height="26" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="594" y="206" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">bucket['e']</text>

  <rect x="52" y="214" width="108" height="112" fill="#fdf2f4" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="66" y="234" font-size="10" fill="#8a3b38" filter="url(#rough2)">a (0,0)</text>
  <text x="66" y="256" font-size="10" fill="#8a3b38" filter="url(#rough2)">acd (2,0)</text>
  <text x="66" y="278" font-size="10" fill="#8a3b38" filter="url(#rough2)">ace (3,0)</text>

  <rect x="174" y="214" width="108" height="112" fill="#f1f8f2" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="188" y="234" font-size="10" fill="#3a5a30" filter="url(#rough2)">bb (1,0)</text>

  <rect x="296" y="214" width="108" height="112" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="350" y="274" text-anchor="middle" font-size="11" fill="#bbbbbb" filter="url(#rough2)">—</text>
  <rect x="418" y="214" width="108" height="112" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="472" y="274" text-anchor="middle" font-size="11" fill="#bbbbbb" filter="url(#rough2)">—</text>
  <rect x="540" y="214" width="108" height="112" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="594" y="274" text-anchor="middle" font-size="11" fill="#bbbbbb" filter="url(#rough2)">—</text>

  <text x="106" y="344" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">读入 'a'：只弹它</text>

  <rect x="60" y="364" width="580" height="44" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="14" filter="url(#rough2)"/>
  <text x="350" y="382" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">桶 = 所有单词的「待办清单」：一个词没做完就一直挂着</text>
  <text x="350" y="398" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">每条记录总共只前进 |w| 次，总推进量 ≤ 2.5×10⁵，与 |s| 无关</text>
</svg>
