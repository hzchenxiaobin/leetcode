<svg xmlns="http://www.w3.org/2000/svg" width="660" height="350" viewBox="0 0 660 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="350" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：出度恒为 1，轨迹是一条链</text>
  <path d="M 180 40 Q 330 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：ρ 形轨迹 -->
  <text x="180" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">ρ 形：尾巴 + 环（重访即停）</text>

  <g filter="url(#sk)">
    <ellipse cx="85" cy="100" rx="17" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="85" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">0</text>
  <text x="52" y="84" font-size="11" fill="#888">尾巴</text>

  <g filter="url(#sk)">
    <ellipse cx="150" cy="170" rx="17" ry="15" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="150" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <ellipse cx="250" cy="130" rx="17" ry="15" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="250" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <g filter="url(#sk)">
    <ellipse cx="300" cy="200" rx="17" ry="15" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="300" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">4</text>
  <g filter="url(#sk)">
    <ellipse cx="205" cy="245" rx="17" ry="15" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="205" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">5</text>
  <text x="242" y="180" font-size="11" fill="#888">环</text>

  <path d="M 94 112 Q 116 146 138 161" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 166 162 Q 206 143 234 135" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 264 140 Q 292 166 299 185" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 285 212 Q 253 242 223 244" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 192 237 Q 148 216 146 187" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="98" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">重访 → 停</text>

  <!-- 右：越界轨迹 -->
  <text x="480" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">或：飞出定义域（越界即停）</text>

  <g filter="url(#sk)">
    <rect x="380" y="85" width="200" height="180" rx="10" fill="#f7f9f2" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="7 5"/>
  </g>
  <text x="480" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8edb">下标域 [0, n)</text>

  <g filter="url(#sk)">
    <ellipse cx="420" cy="135" rx="17" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="420" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">0</text>
  <g filter="url(#sk)">
    <ellipse cx="478" cy="180" rx="17" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="478" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <g filter="url(#sk)">
    <ellipse cx="538" cy="225" rx="17" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="538" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">6</text>

  <path d="M 429 146 Q 452 165 463 170" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 488 192 Q 510 210 521 216" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 552 233 Q 585 248 616 255" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="610" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">越界 → 停</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)">
    <rect x="40" y="280" width="580" height="54" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="330" y="303" text-anchor="middle" font-size="13" fill="#7a5415">鸽笼原理：重访即停 ⇒ n 个下标每个至多执行一次</text>
  <text x="330" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">⇒ 循环至多 n+1 轮，线性模拟 O(n) 必然停机</text>
</svg>
