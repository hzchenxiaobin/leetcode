<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：孤点计数 + 倍数枚举建并查集</text>
  <text x="260" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">总复杂度 O(T log T + n)，与值域 10^9 无关</text>

  <rect x="120" y="60" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">T = threshold，并查集开 1 .. T</text>

  <path d="M 260 100 L 260 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="124" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="149" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">标记 present：nums 中 ≤ T 的值</text>

  <path d="M 260 164 L 260 184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="188" width="340" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">for 每个 present 的 v：for mul = v, 2v, 3v … ≤ T</text>
  <text x="260" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">union(v, mul) —— mul 不必出现在 nums 里</text>

  <path d="M 260 240 L 260 260" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="104" y="264" width="312" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">ans = #{x &gt; T} + #{find(x) : x ≤ T 且 present}</text>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">大值直接计数，小值按不同根去重</text>

  <path d="M 260 316 L 260 336" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="160" y="340" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="444" y="214" font-size="9" fill="#999" filter="url(#rough2)">≈ 2.4M 次 union</text>
</svg>
