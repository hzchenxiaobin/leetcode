<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：链 + 一条弦 ⇒「环 + 两条尾巴」</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- region labels -->
  <text x="120" y="68" text-anchor="middle" font-size="13" fill="#2b5d85">左尾巴 [1, x−1]</text>
  <text x="320" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">环 [x, y]：环长 C = d + 1</text>
  <text x="524" y="68" text-anchor="middle" font-size="13" fill="#2b5d85">右尾巴 [y+1, n]</text>

  <!-- cycle tint -->
  <g filter="url(#sk)">
    <rect x="230" y="84" width="190" height="64" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>

  <!-- chain edges -->
  <path d="M 86 116 L 99 116" stroke="#666" stroke-width="1.6" filter="url(#sk)"/>
  <path d="M 131 116 L 234 116" stroke="#666" stroke-width="1.6" filter="url(#sk)"/>
  <path d="M 266 116 L 284 116" stroke="#666" stroke-width="1.6" filter="url(#sk)"/>
  <path d="M 316 116 L 384 116" stroke="#666" stroke-width="1.6" filter="url(#sk)"/>
  <path d="M 416 116 L 554 116" stroke="#666" stroke-width="1.6" filter="url(#sk)"/>
  <text x="180" y="108" text-anchor="middle" font-size="15" fill="#888">…</text>
  <text x="350" y="108" text-anchor="middle" font-size="15" fill="#888">…</text>
  <text x="486" y="108" text-anchor="middle" font-size="15" fill="#888">…</text>

  <!-- chain nodes -->
  <g filter="url(#sk)">
    <ellipse cx="70" cy="116" rx="16" ry="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <ellipse cx="115" cy="116" rx="16" ry="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <ellipse cx="250" cy="116" rx="16" ry="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <ellipse cx="300" cy="116" rx="16" ry="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <ellipse cx="400" cy="116" rx="16" ry="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <ellipse cx="570" cy="116" rx="16" ry="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="70" y="121" text-anchor="middle" font-size="13" fill="#2b5d85">1</text>
  <text x="115" y="121" text-anchor="middle" font-size="13" fill="#2b5d85">2</text>
  <text x="250" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">x</text>
  <text x="300" y="121" text-anchor="middle" font-size="13" fill="#2e6e2e">x+1</text>
  <text x="400" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">y</text>
  <text x="570" y="121" text-anchor="middle" font-size="13" fill="#2b5d85">n</text>

  <!-- chord -->
  <path d="M 250 132 Q 325 200 396 133" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="325" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a5a">弦 x–y：1 步</text>
  <text x="325" y="230" text-anchor="middle" font-size="12" fill="#2e6e2e">环上两点：两个方向取较短</text>

  <!-- route 1: direct -->
  <g filter="url(#sk)">
    <rect x="40" y="258" width="272" height="118" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="176" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5d85">① 直走（不过弦）</text>
  <g filter="url(#sk)">
    <ellipse cx="100" cy="322" rx="5.5" ry="5.5" fill="#446688"/>
    <ellipse cx="252" cy="322" rx="5.5" ry="5.5" fill="#446688"/>
  </g>
  <path d="M 112 322 L 240 322" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="100" y="344" text-anchor="middle" font-size="12" fill="#2b5d85">i</text>
  <text x="252" y="344" text-anchor="middle" font-size="12" fill="#2b5d85">j</text>
  <text x="176" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5d85">t = j − i</text>

  <!-- route 2: via chord -->
  <g filter="url(#sk)">
    <rect x="328" y="258" width="272" height="118" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="464" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5d85">② 绕弦（恰过一次）</text>
  <g filter="url(#sk)">
    <ellipse cx="365" cy="316" rx="5.5" ry="5.5" fill="#446688"/>
    <ellipse cx="438" cy="316" rx="5.5" ry="5.5" fill="#4a8e4a"/>
    <ellipse cx="512" cy="316" rx="5.5" ry="5.5" fill="#4a8e4a"/>
    <ellipse cx="575" cy="316" rx="5.5" ry="5.5" fill="#446688"/>
  </g>
  <path d="M 377 316 L 428 316" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 438 326 Q 475 350 506 325" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <path d="M 522 316 L 564 316" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="365" y="340" text-anchor="middle" font-size="12" fill="#2b5d85">i</text>
  <text x="438" y="340" text-anchor="middle" font-size="12" fill="#2e6e2e">x</text>
  <text x="512" y="340" text-anchor="middle" font-size="12" fill="#2e6e2e">y</text>
  <text x="575" y="340" text-anchor="middle" font-size="12" fill="#2b5d85">j</text>
  <text x="464" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5d85">W = |i−x| + 1 + |j−y|</text>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="90" y="392" width="460" height="42" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="320" y="419" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06b1a">d(i, j) = min( j − i ， |i−x| + 1 + |j−y| )</text>

  <text x="320" y="462" text-anchor="middle" font-size="13" fill="#2e6e2e">与 Q2 同一闭式！新意全在计数：基线按纯链 n−k，受益点对从 t 桶搬进 W 桶</text>
</svg>
