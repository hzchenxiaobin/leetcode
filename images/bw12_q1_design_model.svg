<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：按 id 定位用哈希，top(K) 用部分选择</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">三个操作的诉求正交——各配各的数据结构</text>

  <g filter="url(#rough2)">
    <rect x="60" y="66" width="200" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <rect x="80" y="88" width="160" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="6"/>
    <rect x="80" y="126" width="160" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="6"/>
    <rect x="80" y="164" width="160" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="6"/>
    <rect x="80" y="202" width="160" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="160" y="108" fill="#333">playerId 1 → 0（已重置）</text>
    <text x="160" y="146" fill="#333">playerId 2 → 51</text>
    <text x="160" y="184" fill="#333">playerId 4 → 51</text>
    <text x="160" y="222" fill="#333">playerId 3 → 39 …</text>
  </g>
  <text x="160" y="258" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">scores 哈希表</text>

  <g filter="url(#rough2)">
    <path d="M 268 128 L 322 128" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 268 188 L 322 188" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
  </g>
  <text x="296" y="118" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">values 全倒出</text>

  <g filter="url(#rough2)">
    <rect x="330" y="70" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="376" y="70" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="422" y="70" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="468" y="70" width="46" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="353" y="92" fill="#3a5a30">51</text>
    <text x="399" y="92" fill="#3a5a30">51</text>
    <text x="445" y="92" fill="#8a6a20">39</text>
    <text x="491" y="92" fill="#777">4</text>
  </g>
  <text x="420" y="122" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">nth_element / 排序切片：前 K 大分隔到头部</text>

  <g filter="url(#rough2)">
    <rect x="330" y="160" width="184" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="422" y="182" fill="#8a6a20" font-weight="bold">top(3) = 51 + 51 + 39 = 141</text>
    <text x="422" y="200" fill="#8a6a20">（并列的 51 都计入，多重集语义）</text>
  </g>

  <rect x="40" y="270" width="480" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="280" y="291" fill="#3a5a30" font-weight="bold">addScore / reset：哈希表单点读写，O(1)</text>
    <text x="280" y="309" fill="#3a5a30">top：全部 value 倒出后部分排序求和，O(m)（m = 玩家数 ≤ 10⁴）</text>
    <text x="280" y="326" fill="#777">调用至多 1000 次 → 简单方案已绰绰有余，无需平衡树</text>
  </g>
</svg>
