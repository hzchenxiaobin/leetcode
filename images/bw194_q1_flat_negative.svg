<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3：等值平台既非峰也非谷，答案可为负</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [6,5,2,5,5,3,6]</text>

  <polyline points="90,134 152,160 214,238 276,160 338,160 400,212 462,134" fill="none" stroke="#aaaaaa" stroke-width="1.8" filter="url(#rough2)"/>

  <ellipse cx="307" cy="160" rx="58" ry="24" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="307" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">平台 5,5：5&gt;5 与 5&lt;5 都不成立 ✗</text>

  <circle cx="90" cy="134" r="7" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <circle cx="152" cy="160" r="7" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="214" cy="238" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="276" cy="160" r="7" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="338" cy="160" r="7" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="400" cy="212" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="462" cy="134" r="7" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <text x="214" y="266" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">▼</text>
  <text x="400" y="240" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">▼</text>

  <text x="112" y="190" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5&lt;2 ✗</text>

  <text x="68" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">边界</text>
  <text x="486" y="118" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">边界</text>

  <text x="46" y="318" font-size="10.5" fill="#888" filter="url(#rough2)">下标</text>
  <text x="90" y="318" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="152" y="318" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="214" y="318" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="276" y="318" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="338" y="318" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="400" y="318" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="462" y="318" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>

  <text x="46" y="336" font-size="10.5" fill="#888" filter="url(#rough2)">值</text>
  <text x="90" y="336" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="152" y="336" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="214" y="336" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="276" y="336" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="338" y="336" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="400" y="336" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="462" y="336" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">6</text>

  <rect x="40" y="350" width="480" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="368" font-size="10.5" fill="#333" filter="url(#rough2)">无峰：峰值和 = 0；谷：nums[2]=2 与 nums[5]=3，谷值和 = 5</text>
  <text x="56" y="384" font-size="10.5" fill="#555" filter="url(#rough2)">答案 = 0 − 5 = −5 —— 差值可为负，ans 从 0 起步、int 即可</text>
</svg>
