<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="410" fill="#fafafa"/>
  <text x="330" y="24" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">贪心：候选 = 左端 ≤ p 的区间，选右端最远的一跳</text>

  <!-- ===== 场景 1：进入 ===== -->
  <text x="330" y="50" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 进入段 [1,4]：cur=0 &lt; s=1 ⟹ p = 1</text>

  <!-- x(v) = 70 + v*52 -->
  <path d="M62,140 L598,140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" stroke="#666" stroke-width="1.2">
    <line x1="70" y1="135" x2="70" y2="145"/><line x1="122" y1="135" x2="122" y2="145"/>
    <line x1="174" y1="135" x2="174" y2="145"/><line x1="226" y1="135" x2="226" y2="145"/>
    <line x1="278" y1="135" x2="278" y2="145"/><line x1="330" y1="135" x2="330" y2="145"/>
    <line x1="382" y1="135" x2="382" y2="145"/><line x1="434" y1="135" x2="434" y2="145"/>
    <line x1="486" y1="135" x2="486" y2="145"/><line x1="538" y1="135" x2="538" y2="145"/>
    <line x1="590" y1="135" x2="590" y2="145"/>
  </g>
  <g font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="158">0</text><text x="122" y="158">1</text><text x="174" y="158">2</text>
    <text x="226" y="158">3</text><text x="278" y="158">4</text><text x="330" y="158">5</text>
    <text x="382" y="158">6</text><text x="434" y="158">7</text><text x="486" y="158">8</text>
    <text x="538" y="158">9</text><text x="590" y="158">10</text>
  </g>

  <!-- 目标段 -->
  <rect x="122" y="150" width="156" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="382" y="150" width="156" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="174" text-anchor="middle" font-size="10" fill="#8a9a8a" filter="url(#rough2)">空隙 (4,6)：不用覆盖</text>

  <!-- 可用区间（三层） -->
  <rect x="122" y="82" width="156" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="78" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">[1,4] 候选</text>
  <rect x="122" y="98" width="260" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">[1,6] ← 右端最远，选它</text>
  <rect x="226" y="112" width="208" height="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">[3,7]：左端 3 &gt; p=1，暂不候选</text>

  <!-- p 标线 -->
  <line x1="122" y1="72" x2="122" y2="148" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="122" y="66" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">p=1</text>

  <!-- 跳跃弧线 -->
  <path d="M122,136 Q252,126 380,134" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="474" y="130" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cur 1→6，顺手伸进段 2！</text>

  <text x="330" y="196" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">选 [1,6]：cnt=1，cur=6 —— 白嫖了段 2 的 [6,6]</text>

  <!-- ===== 场景 2：推进 ===== -->
  <text x="330" y="224" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② 推进段 [6,9]：cur=6 ≥ s=6 ⟹ p = cur = 6</text>

  <path d="M62,312 L598,312" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" stroke="#666" stroke-width="1.2">
    <line x1="70" y1="307" x2="70" y2="317"/><line x1="122" y1="307" x2="122" y2="317"/>
    <line x1="174" y1="307" x2="174" y2="317"/><line x1="226" y1="307" x2="226" y2="317"/>
    <line x1="278" y1="307" x2="278" y2="317"/><line x1="330" y1="307" x2="330" y2="317"/>
    <line x1="382" y1="307" x2="382" y2="317"/><line x1="434" y1="307" x2="434" y2="317"/>
    <line x1="486" y1="307" x2="486" y2="317"/><line x1="538" y1="307" x2="538" y2="317"/>
    <line x1="590" y1="307" x2="590" y2="317"/>
  </g>
  <g font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="330">0</text><text x="122" y="330">1</text><text x="174" y="330">2</text>
    <text x="226" y="330">3</text><text x="278" y="330">4</text><text x="330" y="330">5</text>
    <text x="382" y="330">6</text><text x="434" y="330">7</text><text x="486" y="330">8</text>
    <text x="538" y="330">9</text><text x="590" y="330">10</text>
  </g>

  <!-- 目标段 -->
  <rect x="122" y="322" width="156" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="382" y="322" width="156" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- 可用区间 -->
  <rect x="122" y="250" width="260" height="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="252" y="246" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">[1,6] 已用</text>
  <rect x="226" y="266" width="208" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="262" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">[3,7] 候选（右端 7）</text>
  <rect x="382" y="282" width="156" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="278" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">[6,9] ← 右端最远</text>

  <!-- p 标线 -->
  <line x1="382" y1="242" x2="382" y2="320" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="382" y="236" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">p=cur=6</text>

  <!-- 跳跃弧线 -->
  <path d="M382,308 Q460,298 534,306" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="556" y="302" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cur 6→9</text>

  <text x="330" y="356" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">选 [6,9]：cnt=2，cur=9 = e₂，两段只花 2 个区间</text>
  <text x="330" y="388" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">候选集随 p 单调扩大 → 排序指针 + 大顶堆，每个区间进出各一次</text>
</svg>
