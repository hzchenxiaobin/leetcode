<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 366" width="780" height="366"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="780" height="366" fill="#fafafa"/>

  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：官方第 7 组（n = 5）自底向上的 g_u 与 m_u</text>
  <path d="M 76 35 Q 390 41 704 35" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 树：1-2,1-3,2-4,3-5 -->
  <path d="M 170 70 L 104 178" stroke="#8fa3b8" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 170 70 L 246 178" stroke="#8fa3b8" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 104 178 L 74 286" stroke="#8fa3b8" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 246 178 L 288 286" stroke="#8fa3b8" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <circle cx="170" cy="70" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="76" text-anchor="middle" font-size="14" fill="#8c3a37" filter="url(#rough2)">1</text>
  <text x="170" y="40" text-anchor="middle" font-size="10" fill="#8c3a37" filter="url(#rough2)">a=0 b=12</text>

  <circle cx="104" cy="178" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="104" y="184" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="80" y="170" text-anchor="end" font-size="10" fill="#2f4a66" filter="url(#rough2)">a=0 b=6</text>

  <circle cx="246" cy="178" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="246" y="184" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="272" y="172" font-size="10" fill="#2f4a66" filter="url(#rough2)">a=1 b=9</text>

  <circle cx="74" cy="286" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="74" y="292" text-anchor="middle" font-size="14" fill="#3c6330" filter="url(#rough2)">4</text>
  <text x="74" y="320" text-anchor="middle" font-size="10" fill="#3c6330" filter="url(#rough2)">a=2 b=3</text>

  <circle cx="288" cy="286" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="288" y="292" text-anchor="middle" font-size="14" fill="#3c6330" filter="url(#rough2)">5</text>
  <text x="288" y="320" text-anchor="middle" font-size="10" fill="#3c6330" filter="url(#rough2)">a=3 b=4</text>

  <!-- 表头 -->
  <text x="352" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">u</text>
  <text x="430" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">A = Σ a_c</text>
  <text x="524" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">g_u</text>
  <text x="636" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">孩子可变?</text>
  <text x="726" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">m_u</text>
  <path d="M 340 74 L 764 74" stroke="#446688" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 行：叶子 4 -->
  <text x="352" y="100" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="430" y="100" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="524" y="100" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">gcd(3) = 3</text>
  <text x="636" y="100" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">叶子</text>
  <text x="726" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">2</text>

  <!-- 行：叶子 5 -->
  <text x="352" y="132" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="430" y="132" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="524" y="132" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">gcd(4) = 4</text>
  <text x="636" y="132" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">叶子</text>
  <text x="726" y="132" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">3</text>

  <!-- 行：2 -->
  <text x="352" y="164" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="430" y="164" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">a4 = 2</text>
  <text x="524" y="164" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">gcd(6, 2) = 2</text>
  <text x="636" y="164" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">否</text>
  <text x="726" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">4</text>

  <!-- 行：3 -->
  <text x="352" y="196" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="430" y="196" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">a5 = 3</text>
  <text x="524" y="196" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">gcd(9, 3) = 3</text>
  <text x="636" y="196" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">否</text>
  <text x="726" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">7</text>

  <!-- 行：根 1 -->
  <rect x="342" y="206" width="420" height="28" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="352" y="226" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="430" y="226" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">a2+a3 = 1</text>
  <text x="524" y="226" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">gcd(12,1,2,3) = 1</text>
  <text x="636" y="226" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">是</text>
  <text x="726" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">11</text>

  <!-- 合计 -->
  <rect x="342" y="242" width="420" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="430" y="262" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">总和 = 11 + 4 + 7 + 2 + 3</text>
  <text x="700" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">27</text>

  <text x="346" y="302" font-size="11" fill="#2f4a66" filter="url(#rough2)">孩子 c 可变 ⇔ g_c &lt; b_c；不可变时它只有 a_c 这一个取值，不进入 gcd</text>
  <text x="346" y="324" font-size="11" fill="#8a6015" filter="url(#rough2)">根：g₁ = gcd(12, a₂+a₃, g₂, g₃) = gcd(12, 1, 2, 3) = 1 ⇒ m₁ = 11</text>
</svg>
