<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="-10" y="-10" width="740" height="450" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">示例演算：s = "abcd"，t = "bcdf"，maxCost = 3</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">代价数组 cost = [1, 1, 1, 2]，窗口和一旦超过 3 就弹出左端</text>

  <!-- 代价数组 -->
  <text x="50" y="84" text-anchor="end" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">cost</text>
  <rect x="60" y="64" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="86" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="124" y="64" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="86" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="188" y="64" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="86" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="252" y="64" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="86" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="84" y="110" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">a→b</text>
  <text x="148" y="110" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">b→c</text>
  <text x="212" y="110" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">c→d</text>
  <text x="276" y="110" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">d→f</text>

  <!-- 表格 -->
  <rect x="40" y="126" width="640" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="145" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="145" y="145" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">right</text>
  <text x="230" y="145" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">窗口</text>
  <text x="318" y="145" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">sum</text>
  <text x="378" y="145" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="655" y="145" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 第 1 行 -->
  <rect x="40" y="154" width="640" height="40" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="179" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">1</text>
  <text x="145" y="179" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">0</text>
  <text x="230" y="179" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">[a]</text>
  <text x="318" y="179" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">1</text>
  <text x="378" y="179" font-size="10.5" fill="#555555" filter="url(#rough2)">加入 cost[0] = 1，sum = 1 ≤ 3</text>
  <text x="655" y="179" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 第 2 行 -->
  <rect x="40" y="194" width="640" height="40" fill="#fafafa" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="219" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">2</text>
  <text x="145" y="219" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">1</text>
  <text x="230" y="219" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">[a,b]</text>
  <text x="318" y="219" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">2</text>
  <text x="378" y="219" font-size="10.5" fill="#555555" filter="url(#rough2)">加入 cost[1] = 1，sum = 2 ≤ 3</text>
  <text x="655" y="219" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 第 3 行 -->
  <rect x="40" y="234" width="640" height="40" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="259" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">3</text>
  <text x="145" y="259" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">2</text>
  <text x="230" y="259" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">[a,b,c]</text>
  <text x="318" y="259" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="378" y="259" font-size="10.5" fill="#555555" filter="url(#rough2)">加入 cost[2] = 1，sum = 3 用满预算</text>
  <text x="655" y="259" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- 第 4 行 -->
  <rect x="40" y="274" width="640" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="299" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">4</text>
  <text x="145" y="299" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">3</text>
  <text x="230" y="299" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">[c,d]</text>
  <text x="318" y="299" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="378" y="299" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">加入 cost[3] = 2 得 5 &gt; 3，弹出 a、b</text>
  <text x="655" y="299" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- 说明框 -->
  <rect x="40" y="330" width="640" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="352" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">right = 3 时窗口 [a,b,c,d] 的代价和 1+1+1+2 = 5 &gt; 3，连续弹出 a、b 后窗口退化为 [c,d]，和回到 3</text>
  <text x="56" y="374" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">最终 ans = 3：窗口 [a,b,c] 把预算恰好用满，长度 3 已经是本示例的上界</text>

  <text x="360" y="415" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">注意：预算判断是 ≤，sum 正好等于 maxCost 仍合法，示例 1 的答案正好卡在 3</text>
</svg>
