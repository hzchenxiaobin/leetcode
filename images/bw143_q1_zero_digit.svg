<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">从 n 起逐个尝试：10 个连续整数内必有 10 的倍数</text>

  <!-- 候选数 11..20 -->
  <g filter="url(#rough2)">
    <rect x="52" y="62" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="98" y="62" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="144" y="62" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="190" y="62" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="236" y="62" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="282" y="62" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="328" y="62" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="374" y="62" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="420" y="62" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="466" y="62" width="42" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="73" y="84">11</text>
    <text x="119" y="84">12</text>
    <text x="165" y="84">13</text>
    <text x="211" y="84">14</text>
    <text x="257" y="84">15</text>
    <text x="303" y="84">16</text>
    <text x="349" y="84">17</text>
    <text x="395" y="84">18</text>
    <text x="441" y="84">19</text>
    <text x="487" y="84" font-weight="bold" fill="#b85450">20</text>
  </g>

  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">↓ 各自数位乘积</text>
  <g font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="73" y="140">1</text>
    <text x="119" y="140">2</text>
    <text x="165" y="140">3</text>
    <text x="211" y="140">4</text>
    <text x="257" y="140">5</text>
    <text x="303" y="140">6</text>
    <text x="349" y="140">7</text>
    <text x="395" y="140">8</text>
    <text x="441" y="140">9</text>
    <text x="487" y="140" font-weight="bold" fill="#b85450">0</text>
  </g>

  <path d="M 487 148 C 487 172, 460 176, 430 186" stroke="#d6a040" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="188" width="330" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="315" y="217" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">含数位 0 ⇒ 数位乘积 = 0 ⇒ 被任意 t 整除</text>

  <rect x="150" y="248" width="330" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="315" y="275" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">所以答案 ≤ n + 9，枚举最多 10 次</text>

  <text x="280" y="318" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">蓝色：普通候选　橙色：必然合法的 10 的倍数</text>
</svg>
