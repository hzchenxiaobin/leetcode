<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">数据结构设计：三个视角 → 三个有序容器 + 价格索引</text>

  <!-- avail 容器 -->
  <g filter="url(#rough2)">
    <rect x="46" y="70" width="216" height="190" fill="#fff" stroke="#446688" stroke-width="2" rx="12"/>
  </g>
  <text x="154" y="94" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">avail[movie]</text>
  <text x="154" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">movie → 有序集合 (price, shop)</text>
  <g filter="url(#rough2)">
    <rect x="66" y="122" width="176" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="66" y="152" width="176" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="66" y="182" width="176" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="76" y="140">(4, 商店1) ← 最小端</text>
    <text x="76" y="170">(5, 商店0)</text>
    <text x="76" y="200">(5, 商店2)</text>
  </g>
  <text x="154" y="228" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">search：取最小端前 5 个</text>
  <text x="154" y="244" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">同价时第二键自动按商店排序</text>

  <!-- rented 容器 -->
  <g filter="url(#rough2)">
    <rect x="300" y="70" width="216" height="190" fill="#fff" stroke="#b85450" stroke-width="2" rx="12"/>
  </g>
  <text x="408" y="94" text-anchor="middle" font-size="13" fill="#a0392f" font-weight="bold" filter="url(#rough2)">rented</text>
  <text x="408" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">有序集合 (price, shop, movie)</text>
  <g filter="url(#rough2)">
    <rect x="320" y="122" width="176" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="320" y="152" width="176" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="330" y="140">(5, 商店0, 电影1)</text>
    <text x="330" y="170">(7, 商店1, 电影2)</text>
  </g>
  <text x="408" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">report：取最小端前 5 个</text>
  <text x="408" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">三级键：价格→商店→电影</text>
  <text x="408" y="242" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ 同商店可有多部同价电影，</text>
  <text x="408" y="254" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">第三级键不可省</text>

  <!-- 拷贝在两容器间迁移 -->
  <path d="M 266 140 L 314 140" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="290" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">rent</text>
  <path d="M 314 176 L 266 176" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">drop</text>

  <!-- priceOf 索引 -->
  <g filter="url(#rough2)">
    <rect x="120" y="290" width="320" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="12"/>
  </g>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">priceOf[(shop, movie)] → price（哈希表）</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">rent / drop 只有 (shop, movie)，价格靠它一步反查；每店每片至多一份 → 键唯一</text>
  <path d="M 154 262 L 210 288" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 408 262 L 350 288" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部复杂度 -->
  <g filter="url(#rough2)">
    <rect x="46" y="368" width="470" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8"/>
  </g>
  <text x="280" y="386" text-anchor="middle" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">构造 O(E log E)；search/report 取前 5 只需读最小端；rent/drop 两次删插 O(log E)。</text>
  <text x="280" y="402" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">每份拷贝同一时刻恰在 avail 与 rented 之一 —— 迁移即租借状态的切换。</text>
</svg>
