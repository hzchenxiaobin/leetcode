<svg xmlns="http://www.w3.org/2000/svg" width="760" height="462" viewBox="0 0 760 462" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="462" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：逐天入堆 → 清腐烂 → 吃堆顶</text>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">apples=[1,2,3,5,2]，days=[3,2,1,4,2] → 腐烂日=[3,3,3,7,6]；堆用 {腐烂日:数量} 表示（Day 从 0 计）</text>

  <!-- highlight row backgrounds: Day3 orange, Day4 green -->
  <g filter="url(#rough2)">
    <rect x="31" y="195" width="648" height="33" fill="#fff8e1"/>
    <rect x="31" y="228" width="648" height="33" fill="#e6f4ea"/>
  </g>

  <!-- table frame -->
  <g filter="url(#rough2)">
    <rect x="30" y="66" width="650" height="294" rx="4" fill="none" stroke="#446688" stroke-width="1.8"/>
    <rect x="30" y="66" width="650" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g stroke="#b9c8dd" stroke-width="1" filter="url(#rough2)">
    <path d="M 80 66 V 360"/>
    <path d="M 198 66 V 360"/>
    <path d="M 316 66 V 360"/>
    <path d="M 412 66 V 360"/>
    <path d="M 628 66 V 360"/>
    <path d="M 30 129 H 680"/>
    <path d="M 30 162 H 680"/>
    <path d="M 30 195 H 680"/>
    <path d="M 30 228 H 680"/>
    <path d="M 30 261 H 680"/>
    <path d="M 30 294 H 680"/>
    <path d="M 30 327 H 680"/>
  </g>

  <!-- header -->
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#34557e" filter="url(#rough2)">
    <text x="55" y="85">Day</text>
    <text x="139" y="85">新入堆</text>
    <text x="257" y="85">清腐烂</text>
    <text x="364" y="85">吃堆顶</text>
    <text x="520" y="85">吃后的堆 {rot:cnt}</text>
    <text x="655" y="85">ans</text>
  </g>

  <!-- rows -->
  <g text-anchor="middle" font-size="12" filter="url(#rough2)">
    <text x="55" y="118" fill="#333">0</text>
    <text x="139" y="118" fill="#34557e" font-family="monospace">(3,1)</text>
    <text x="257" y="118" fill="#999">—</text>
    <text x="364" y="118" fill="#333">吃 (3)</text>
    <text x="520" y="118" fill="#333" font-family="monospace">{}</text>
    <text x="655" y="118" fill="#333" font-weight="bold">1</text>

    <text x="55" y="151" fill="#333">1</text>
    <text x="139" y="151" fill="#34557e" font-family="monospace">(3,2)</text>
    <text x="257" y="151" fill="#999">—</text>
    <text x="364" y="151" fill="#333">吃 (3)</text>
    <text x="520" y="151" fill="#333" font-family="monospace">{3:1}</text>
    <text x="655" y="151" fill="#333" font-weight="bold">2</text>

    <text x="55" y="184" fill="#333">2</text>
    <text x="139" y="184" fill="#34557e" font-family="monospace">(3,3)</text>
    <text x="257" y="184" fill="#999">—</text>
    <text x="364" y="184" fill="#333">吃 (3)</text>
    <text x="520" y="184" fill="#333" font-family="monospace">{3:3}</text>
    <text x="655" y="184" fill="#333" font-weight="bold">3</text>

    <text x="55" y="217" fill="#333">3</text>
    <text x="139" y="217" fill="#34557e" font-family="monospace">(7,5)</text>
    <text x="257" y="217" fill="#b85450" font-weight="bold">清 3:3</text>
    <text x="364" y="217" fill="#333">吃 (7)</text>
    <text x="520" y="217" fill="#333" font-family="monospace">{7:4}</text>
    <text x="655" y="217" fill="#333" font-weight="bold">4</text>

    <text x="55" y="250" fill="#333">4</text>
    <text x="139" y="250" fill="#34557e" font-family="monospace">(6,2)</text>
    <text x="257" y="250" fill="#999">—</text>
    <text x="364" y="250" fill="#2e6e2e" font-weight="bold">吃 (6)</text>
    <text x="520" y="250" fill="#333" font-family="monospace">{6:1, 7:4}</text>
    <text x="655" y="250" fill="#333" font-weight="bold">5</text>

    <text x="55" y="283" fill="#333">5</text>
    <text x="139" y="283" fill="#999">—</text>
    <text x="257" y="283" fill="#999">—</text>
    <text x="364" y="283" fill="#333">吃 (6)</text>
    <text x="520" y="283" fill="#333" font-family="monospace">{7:4}</text>
    <text x="655" y="283" fill="#333" font-weight="bold">6</text>

    <text x="55" y="316" fill="#333">6</text>
    <text x="139" y="316" fill="#999">—</text>
    <text x="257" y="316" fill="#999">—</text>
    <text x="364" y="316" fill="#333">吃 (7)</text>
    <text x="520" y="316" fill="#333" font-family="monospace">{7:3}</text>
    <text x="655" y="316" fill="#333" font-weight="bold">7</text>

    <text x="55" y="349" fill="#333">7</text>
    <text x="139" y="349" fill="#999">—</text>
    <text x="257" y="349" fill="#b85450" font-weight="bold">清 7:3</text>
    <text x="364" y="349" fill="#999">堆空</text>
    <text x="520" y="349" fill="#333" font-family="monospace">{}</text>
    <text x="655" y="349" fill="#333" font-weight="bold">7</text>
  </g>

  <!-- bottom notes -->
  <g filter="url(#rough2)">
    <rect x="30" y="378" width="330" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="195" y="398" text-anchor="middle" font-size="11" fill="#8a6a10" filter="url(#rough2)">Day3（橙）：腐烂日 3 ≤ d=3，先清空存量再吃，</text>
  <text x="195" y="416" text-anchor="middle" font-size="11" fill="#8a6a10" filter="url(#rough2)">「清腐烂」必须严格在「吃」之前</text>
  <g filter="url(#rough2)">
    <rect x="372" y="378" width="358" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="551" y="398" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Day4（绿）：新批 rot=6 &lt; 存量 7，堆顶自动切换，</text>
  <text x="551" y="416" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每天吃的都是最快腐烂的批次 → 共 7 个 ✓</text>

  <text x="380" y="452" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">n=5，但 Day5~7 仍继续吃——循环条件是「d&lt;n 或 堆非空」</text>
</svg>
