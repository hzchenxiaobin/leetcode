<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Z-box 复用：Z 数组为什么是 O(n)</text>
  <path d="M 200 38 Q 330 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="330" y="62" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">w ＝ "aabaaab"（n ＝ 7）；算完 z[3] ＝ 2 后最右 Z-box 为 [l, r) ＝ [3, 5)，接着计算 i ＝ 4</text>

  <!-- callout labels above cells -->
  <text x="242" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">镜像 i − l ＝ 1</text>
  <text x="374" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">i ＝ 4</text>
  <path d="M 248 84 Q 308 68 366 84" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- string cells -->
  <g filter="url(#rough2)">
    <rect x="176" y="88" width="44" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="220" y="88" width="44" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="264" y="88" width="44" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="308" y="88" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="352" y="88" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="396" y="88" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="440" y="88" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="198" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="242" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="286" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="330" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="374" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="418" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="462" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="198" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="242" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="286" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="330" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="374" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="418" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="462" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">6</text>

  <!-- overlays -->
  <rect x="220" y="86" width="44" height="40" rx="4" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="352" y="86" width="44" height="40" rx="4" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- brackets -->
  <path d="M 220 148 L 220 154 L 264 154 L 264 148" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="242" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">免费复用 z[1]</text>
  <path d="M 308 148 L 308 154 L 396 154 L 396 148" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="352" y="170" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">Z-box [3, 5) ＝ 前缀 "aa"</text>
  <path d="M 396 148 L 396 154 L 484 154 L 484 148" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="440" y="170" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">box 外扩张区</text>

  <!-- trace box -->
  <rect x="40" y="190" width="580" height="64" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a66" filter="url(#rough2)">计算 z[4]：起步 min(r − i, z[i − l]) ＝ min(1, z[1]) ＝ 1（免 1 次比较）</text>
  <text x="330" y="234" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">box 外扩张：w[5]＝w[1] ✓、w[6]＝w[2] ✓，2 次成功 → z[4] ＝ 3，r 由 5 右移至 7</text>

  <!-- amortized box -->
  <rect x="40" y="266" width="580" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">均摊：扩张期每成功比较一次 ⟺ r 恰好右移一格；r 单调不降且 ≤ n</text>
  <text x="330" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 成功比较总数 ≤ n；每个 i 至多再付 1 次失败比较 → 总比较 ≤ 2n</text>
  <text x="330" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">故预处理 O(n)，加上枚举 O(n/k)，本题整体 O(n)</text>

  <!-- pseudo code -->
  <rect x="40" y="356" width="580" height="62" rx="9" fill="#fffdf6" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="376" font-size="11" fill="#333" filter="url(#rough2)">if i &lt; r:  z[i] ＝ min(r − i, z[i − l])      # box 内免费复用镜像值</text>
  <text x="60" y="393" font-size="11" fill="#333" filter="url(#rough2)">while i+z[i] &lt; n and w[z[i]] == w[i+z[i]]:  z[i] ＋＝ 1   # 越出 r 才逐字比较</text>
  <text x="60" y="410" font-size="11" fill="#333" filter="url(#rough2)">if i+z[i] &gt; r:  l, r ＝ i, i+z[i]          # 维护最右 Z-box，r 只增不减</text>
</svg>
