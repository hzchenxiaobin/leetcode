<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="396" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：最小化 OR ＝ 找数值最小的「可行掩码」v</text>
  <text x="320" y="40" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">v 可行 ⟺ 每一行都存在 x ⊆ v（x | v == v）· 左图 8 位示意，本题 17 位</text>

  <!-- mask strip: 8 cells, high(4, decided) + current b3 + low(3, free) -->
  <text x="159" y="58" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↑ 当前位 b 试 0</text>
  <rect x="42" y="64" width="26" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="68" y="64" width="26" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="94" y="64" width="26" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="120" y="64" width="26" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="146" y="64" width="26" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="159" y="85" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <rect x="172" y="64" width="26" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="198" y="64" width="26" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="211" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="224" y="64" width="26" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="55" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">b7</text>
  <text x="81" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">b6</text>
  <text x="107" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">b5</text>
  <text x="133" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">b4</text>
  <text x="159" y="112" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">b</text>
  <text x="185" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="211" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="237" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <text x="160" y="130" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">检查掩码 mask ＝ ans | ((1&lt;&lt;b)−1)：</text>
  <text x="160" y="145" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">高位已定 ＋ 当前位 0 ＋ 低位全 1（自由位的最宽容解释）</text>

  <!-- row 1 -->
  <rect x="42" y="156" width="286" height="44" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="182" font-size="11" fill="#333" filter="url(#rough2)">行 1</text>
  <rect x="92" y="165" width="32" height="26" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="108" y="182" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">20</text>
  <rect x="128" y="165" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="144" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="164" y="165" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="206" y="182" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 有子罩 5, 3</text>

  <!-- row 2 -->
  <rect x="42" y="208" width="286" height="44" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="234" font-size="11" fill="#333" filter="url(#rough2)">行 2</text>
  <rect x="92" y="217" width="32" height="26" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="108" y="234" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">16</text>
  <rect x="128" y="217" width="32" height="26" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="234" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">64</text>
  <rect x="164" y="217" width="32" height="26" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="234" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">9</text>
  <text x="206" y="234" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 断供（全无子罩）</text>

  <!-- conclusion -->
  <rect x="42" y="260" width="286" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="277" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">行 2 断供 → bit b 必须置 1</text>
  <text x="185" y="292" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">ans |= 1 &lt;&lt; b</text>

  <!-- right callouts -->
  <rect x="346" y="64" width="252" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="86" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">两种问法等价</text>
  <text x="472" y="105" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">min（每行选一的 OR）</text>
  <text x="472" y="122" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">＝ min 可行掩码（§5 引理 1）</text>

  <rect x="346" y="150" width="252" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="172" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">子罩单调性</text>
  <text x="472" y="191" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">v ⊆ v′ 且 P(v) ⟹ P(v′)</text>
  <text x="472" y="208" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">→ 低位全设 1 的检查不漏解</text>

  <rect x="346" y="234" width="252" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="472" y="256" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">高位 → 低位逐位确定</text>
  <text x="472" y="275" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">17 轮，每轮尽量保 0</text>
  <text x="472" y="290" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">「能不能不要我？能省则省」</text>

  <!-- bottom note -->
  <rect x="42" y="310" width="556" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="332" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">一轮检查 ＝ O(m·n)：每行 any(x | mask == mask)，行内命中即停、整行断供即停</text>
  <text x="320" y="352" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">总复杂度 O(17 · m·n) ≤ 1.7×10⁶（以 m·n ≤ 10⁵ 兜底，别按 m、n 各 10⁵ 相乘误估）</text>
  <text x="320" y="372" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">绿格 ＝ 是子罩 ✓ · 灰格 ＝ 非子罩 ✗</text>
</svg>
