<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：右端逐格推进，够 k 对就收缩到刚跌破</text>
  <path d="M 160 44 Q 340 52 520 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="225" y="54" width="230" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="340" y="74" text-anchor="middle" font-size="12" fill="#2b2b2b">left = 0，pairs = 0，ans = 0，cnt = {}</text>
  <g filter="url(#sk)"><path d="M 340 84 V 98" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="95" y="102" width="520" height="266" rx="12" fill="none" stroke="#9a9a92" stroke-width="1.3" stroke-dasharray="8 6"/></g>
  <text x="112" y="124" font-size="12.5" font-weight="bold" fill="#777">for right = 0 … n−1</text>

  <g filter="url(#sk)"><rect x="225" y="134" width="310" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="380" y="153" text-anchor="middle" font-size="12" fill="#2b2b2b">x = nums[right]</text>
  <text x="380" y="171" text-anchor="middle" font-size="12" fill="#2b2b2b">pairs += cnt[x]；cnt[x] += 1</text>
  <g filter="url(#sk)"><path d="M 380 180 V 194" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><polygon points="380,198 468,234 380,270 292,234" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="380" y="239" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">pairs ≥ k ?</text>

  <g filter="url(#sk)"><path d="M 292 234 H 252" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <text x="271" y="226" text-anchor="middle" font-size="11" fill="#b85450">是</text>

  <g filter="url(#sk)"><rect x="100" y="208" width="145" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="172" y="227" text-anchor="middle" font-size="10.5" fill="#2b2b2b">cnt[nums[left]] −= 1</text>
  <text x="172" y="243" text-anchor="middle" font-size="10.5" fill="#2b2b2b">pairs −= cnt[nums[left]]</text>
  <text x="172" y="259" text-anchor="middle" font-size="10.5" fill="#2b2b2b">left += 1</text>
  <g filter="url(#sk)"><path d="M 172 208 V 190 H 374" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="255" y="184" text-anchor="middle" font-size="9.5" fill="#777">继续判断（可能连缩多步）</text>

  <g filter="url(#sk)"><path d="M 380 270 V 284" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <text x="391" y="281" font-size="11" fill="#4a7a3a">否</text>

  <g filter="url(#sk)"><rect x="215" y="288" width="330" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="380" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">ans += left</text>
  <text x="380" y="324" text-anchor="middle" font-size="10.5" fill="#4a7a3a">以 right 结尾的好子数组恰有 left 个（起点 0 … left−1）</text>

  <g filter="url(#sk)"><path d="M 545 310 H 606 V 157 H 542" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="578" y="302" text-anchor="middle" font-size="10" fill="#777">下一 right</text>

  <g filter="url(#sk)"><path d="M 380 332 V 370" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><rect x="250" y="374" width="260" height="30" rx="8" fill="#f7f7f4" stroke="#b8b8ae" stroke-width="1.4"/></g>
  <text x="380" y="394" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">return ans</text>

  <g filter="url(#sk)"><rect x="95" y="422" width="520" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="355" y="441" text-anchor="middle" font-size="11" fill="#7a5415">⚠ 收缩顺序：先 cnt[nums[left]] −−，再 pairs −= cnt[nums[left]]</text>
  <text x="355" y="459" text-anchor="middle" font-size="10.5" fill="#7a5415">被移除元素只与「仍在窗口内」的同值成对 —— 顺序写反必错</text>
</svg>
