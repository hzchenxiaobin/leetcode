<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect x="-6" y="-6" width="572" height="452" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次循环只有三种去向</text>

  <ellipse cx="280" cy="54" rx="66" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">输入 c ≥ 0</text>

  <path d="M 280 72 L 280 92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="94" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="115" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">a ← 0，b ← ⌊√c⌋（整数开方）</text>

  <path d="M 280 128 L 280 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,152 350,180 280,208 210,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">a ≤ b ?</text>

  <path d="M 350 180 L 428 180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="172" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="430" y="164" width="108" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="484" y="184" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">返回 false</text>

  <path d="M 280 208 L 280 230" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="224" font-size="10" fill="#888" filter="url(#rough2)">是</text>

  <rect x="180" y="232" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">s ← a² + b²</text>

  <path d="M 280 264 L 280 286" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,288 350,316 280,344 210,316" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">s = c ?</text>

  <path d="M 210 316 L 152 316" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="308" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <rect x="42" y="300" width="108" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="96" y="320" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 true</text>

  <path d="M 280 344 L 280 366" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,368 350,396 280,424 210,396" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">s &lt; c ?</text>

  <path d="M 210 396 L 152 396" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <rect x="42" y="380" width="108" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="96" y="400" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">a += 1</text>

  <path d="M 350 396 L 428 396" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="430" y="380" width="108" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="484" y="400" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">b −= 1</text>

  <path d="M 42 396 L 18 396 L 18 180 L 202 180" stroke="#888" stroke-width="1.4" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="150" font-size="10" fill="#888" filter="url(#rough2)">回到循环开头</text>
</svg>
