<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">答案空间只有 36 个数：按「位数 + 首位」枚举</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">长度 L 的顺次数共 10−L 个；长度 1 的 1–9 全小于 low，只需看 L = 2..9</text>

  <rect x="44" y="58" width="44" height="24" fill="#e8e8e8" stroke="#777" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="74" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">位 L</text>
  <rect x="92" y="58" width="404" height="24" fill="#e8e8e8" stroke="#777" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="74" font-size="10.5" fill="#444" filter="url(#rough2)">该位数下全部顺次数（首位 d = 1 … 10−L）</text>
  <rect x="500" y="58" width="68" height="24" fill="#e8e8e8" stroke="#777" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="534" y="74" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">个数</text>

  <rect x="44" y="88" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="106" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">2</text>
  <rect x="92" y="88" width="404" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="106" font-size="11" fill="#2f3f5c" filter="url(#rough2)">12  23  34  45  56  67  78  89</text>
  <rect x="500" y="88" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="534" y="106" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">8</text>

  <rect x="44" y="122" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="140" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">3</text>
  <rect x="92" y="122" width="404" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="140" font-size="11" fill="#2f3f5c" filter="url(#rough2)">123  234  345  456  567  678  789</text>
  <rect x="500" y="122" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="534" y="144" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">7</text>

  <rect x="44" y="156" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="174" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">4</text>
  <rect x="92" y="156" width="404" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="174" font-size="11" fill="#2f3f5c" filter="url(#rough2)">1234  2345  3456  4567  5678  6789</text>
  <rect x="500" y="156" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="534" y="174" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">6</text>

  <rect x="44" y="190" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="208" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">5</text>
  <rect x="92" y="190" width="404" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="208" font-size="11" fill="#2f3f5c" filter="url(#rough2)">12345  23456  34567  45678  56789</text>
  <rect x="500" y="190" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="534" y="208" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">5</text>

  <rect x="44" y="224" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="242" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">6</text>
  <rect x="92" y="224" width="404" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="242" font-size="11" fill="#2f3f5c" filter="url(#rough2)">123456  234567  345678  456789</text>
  <rect x="500" y="224" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="534" y="242" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">4</text>

  <rect x="44" y="258" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="276" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">7</text>
  <rect x="92" y="258" width="404" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="276" font-size="11" fill="#2f3f5c" filter="url(#rough2)">1234567  2345678  3456789</text>
  <rect x="500" y="258" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="534" y="276" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">3</text>

  <rect x="44" y="292" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="310" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">8</text>
  <rect x="92" y="292" width="404" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="310" font-size="11" fill="#2f3f5c" filter="url(#rough2)">12345678  23456789</text>
  <rect x="500" y="292" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="534" y="310" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>

  <rect x="44" y="326" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="344" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">9</text>
  <rect x="92" y="326" width="404" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="104" y="344" font-size="11" fill="#2f3f5c" filter="url(#rough2)">123456789</text>
  <rect x="500" y="326" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="534" y="344" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>

  <path d="M 92 372 L 568 372" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="300" y="390" text-anchor="middle" font-size="10.5" fill="#666">8 + 7 + 6 + 5 + 4 + 3 + 2 + 1 = 36 个；造完它们共 156 次乘加，与输入规模无关</text>
</svg>
