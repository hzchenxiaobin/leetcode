<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：哈希表逐步演化（示例 2）</text>

  <!-- 表格：操作 / parent 检查 / 结果 / 表状态 -->
  <g filter="url(#rough2)">
    <rect x="30" y="50" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="30" y="84" width="500" height="34" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="30" y="118" width="500" height="34" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="30" y="152" width="500" height="34" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="30" y="186" width="500" height="34" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="30" y="220" width="500" height="34" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <!-- 列分隔线 -->
    <line x1="230" y1="50" x2="230" y2="254" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="350" y1="50" x2="350" y2="254" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="130" y="71" text-anchor="middle" font-weight="bold" fill="#2a4a68">操作</text>
    <text x="290" y="71" text-anchor="middle" font-weight="bold" fill="#2a4a68">parent 检查</text>
    <text x="440" y="71" text-anchor="middle" font-weight="bold" fill="#2a4a68">返回</text>

    <text x="130" y="105" text-anchor="middle">create("/leet", 1)</text>
    <text x="290" y="105" text-anchor="middle" fill="#4a7a3a">空串（顶层）✓</text>
    <text x="440" y="105" text-anchor="middle" fill="#2d5a22" font-weight="bold">true</text>

    <text x="130" y="139" text-anchor="middle">create("/leet/code", 2)</text>
    <text x="290" y="139" text-anchor="middle" fill="#4a7a3a">"/leet" 存在 ✓</text>
    <text x="440" y="139" text-anchor="middle" fill="#2d5a22" font-weight="bold">true</text>

    <text x="130" y="173" text-anchor="middle">get("/leet/code")</text>
    <text x="290" y="173" text-anchor="middle" fill="#888">—</text>
    <text x="440" y="173" text-anchor="middle" fill="#2d5a22" font-weight="bold">2</text>

    <text x="130" y="207" text-anchor="middle">create("/c/d", 1)</text>
    <text x="290" y="207" text-anchor="middle" fill="#b85450">"/c" 不存在 ✗</text>
    <text x="440" y="207" text-anchor="middle" fill="#b85450" font-weight="bold">false</text>

    <text x="130" y="241" text-anchor="middle">get("/c")</text>
    <text x="290" y="241" text-anchor="middle" fill="#888">—</text>
    <text x="440" y="241" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
  </g>

  <!-- 底部两个要点 -->
  <rect x="30" y="272" width="255" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="158" y="294" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">顶层路径（如 /leet）的 parent 是空串</text>
  <text x="158" y="314" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">视为「根总是存在」，直接放行</text>

  <rect x="295" y="272" width="255" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="422" y="294" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">只查直接父一层即可</text>
  <text x="422" y="314" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">表中永远没有「孤儿路径」</text>
</svg>
