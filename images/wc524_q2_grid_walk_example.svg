<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例走查：撞已访问停 / 出界停 / 第一步就停</text>

  <!-- 左例：2×2 环 -->
  <text x="190" y="58" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">grid = [["R","D"],["U","L"]]</text>

  <rect x="110" y="86" width="58" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="139" y="121" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">R</text>
  <text x="115" y="98" font-size="8.5" fill="#888" filter="url(#rough2)">(0,0)</text>
  <rect x="168" y="86" width="58" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="197" y="121" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">D</text>
  <text x="173" y="98" font-size="8.5" fill="#888" filter="url(#rough2)">(0,1)</text>
  <rect x="110" y="144" width="58" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="139" y="179" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">U</text>
  <text x="115" y="156" font-size="8.5" fill="#888" filter="url(#rough2)">(1,0)</text>
  <rect x="168" y="144" width="58" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="197" y="179" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">L</text>
  <text x="173" y="156" font-size="8.5" fill="#888" filter="url(#rough2)">(1,1)</text>

  <!-- 路径箭头 -->
  <path d="M148,103 L160,103" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="154" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <path d="M211,125 L211,136" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="221" y="135" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <path d="M188,187 L176,187" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="182" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- 未执行的 U：绕到左侧的红虚线 -->
  <path d="M104,173 C78,173 78,115 104,115" stroke="#b85450" stroke-width="1.8" fill="none"
        stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="44" y="138" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">U 撞</text>
  <text x="44" y="152" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">已访问</text>

  <rect x="95" y="216" width="110" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">答案 [1,0]</text>

  <!-- 右例：1×3 直冲出界 -->
  <text x="485" y="58" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">grid = [["R","R","R"]]</text>

  <rect x="395" y="86" width="58" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="424" y="121" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">R</text>
  <text x="400" y="98" font-size="8.5" fill="#888" filter="url(#rough2)">(0,0)</text>
  <rect x="453" y="86" width="58" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="482" y="121" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">R</text>
  <text x="458" y="98" font-size="8.5" fill="#888" filter="url(#rough2)">(0,1)</text>
  <rect x="511" y="86" width="58" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="540" y="121" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">R</text>
  <text x="516" y="98" font-size="8.5" fill="#888" filter="url(#rough2)">(0,2)</text>

  <path d="M445,103 L459,103" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="453" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <path d="M503,103 L517,103" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="511" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <path d="M572,115 L604,115" stroke="#b85450" stroke-width="1.8" fill="none"
        stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="588" y="103" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">出界</text>

  <rect x="430" y="216" width="110" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="485" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">答案 [0,2]</text>

  <!-- 底部：1×1 特例 -->
  <rect x="268" y="272" width="58" height="58" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="297" y="307" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">D</text>
  <text x="273" y="284" font-size="8.5" fill="#888" filter="url(#rough2)">(0,0)</text>

  <path d="M297,334 L297,362" stroke="#b85450" stroke-width="1.8" fill="none"
        stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="297" y="378" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">第一步就出界</text>

  <text x="365" y="288" font-size="11.5" fill="#446688" filter="url(#rough2)">grid = [["D"]]（1×1 特例）</text>
  <text x="365" y="308" font-size="11.5" fill="#446688" filter="url(#rough2)">任何方向的第一步都出界，</text>
  <text x="365" y="328" font-size="11.5" fill="#446688" filter="url(#rough2)">只访问过起点，答案就是 [0,0]。</text>

  <rect x="60" y="396" width="520" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="414" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">走过的格子染绿；红虚线 = 被拦下、不执行的移动</text>
</svg>
