<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>
  <text x="360" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 全程走查：n = 5，到达顺序 3 → 1 → 2 → 5 → 4</text>

  <text x="180" y="44" font-size="11" fill="#446688" filter="url(#rough2)">蓝底 = 已缓存</text>
  <text x="320" y="44" font-size="11" fill="#8a6d1f" filter="url(#rough2)">橙框 = 本次写入</text>
  <text x="470" y="44" font-size="11" fill="#b85450" filter="url(#rough2)">红虚线框 = 洞（ptr 停留处）</text>

  <!-- 表头 -->
  <rect x="40" y="56" width="650" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="72" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">步骤</text>
  <text x="135" y="72" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">insert</text>
  <text x="340" y="72" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">槽位存储</text>
  <text x="214" y="86" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="276" y="86" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2</text>
  <text x="338" y="86" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">3</text>
  <text x="400" y="86" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">4</text>
  <text x="462" y="86" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">5</text>
  <text x="544" y="72" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">ptr（前→后）</text>
  <text x="638" y="72" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">返回列表</text>

  <!-- 行背景 -->
  <rect x="40" y="90" width="650" height="52" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="142" width="650" height="52" fill="#fdfdf8" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="194" width="650" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="246" width="650" height="52" fill="#fdfdf8" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="298" width="650" height="52" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- 列分隔线 -->
  <path d="M92,56 L92,350" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M178,56 L178,350" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M502,56 L502,350" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M586,56 L586,350" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 第 1 行：insert(3, ccccc) -->
  <text x="66" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(3, ccccc)</text>
  <rect x="186" y="98" width="56" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="248" y="98" width="56" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="310" y="98" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="338" y="120" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">ccccc</text>
  <rect x="372" y="98" width="56" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="434" y="98" width="56" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="544" y="121" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1 → 1</text>
  <text x="638" y="121" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[ ]</text>

  <!-- 第 2 行：insert(1, aaaaa) -->
  <text x="66" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="135" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, aaaaa)</text>
  <rect x="186" y="150" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="214" y="172" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">aaaaa</text>
  <rect x="248" y="150" width="56" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="310" y="150" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="172" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">ccccc</text>
  <rect x="372" y="150" width="56" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="434" y="150" width="56" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="544" y="173" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 → 2</text>
  <text x="638" y="173" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">[aaaaa]</text>

  <!-- 第 3 行：insert(2, bbbbb)，连带交付块 3 -->
  <text x="66" y="225" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="135" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2, bbbbb)</text>
  <rect x="186" y="202" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="214" y="224" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">aaaaa</text>
  <rect x="248" y="202" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="276" y="224" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">bbbbb</text>
  <rect x="310" y="202" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="224" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">ccccc</text>
  <rect x="372" y="202" width="56" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="434" y="202" width="56" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="544" y="225" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 → 4</text>
  <text x="638" y="225" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[bbbbb, ccccc]</text>

  <!-- 第 4 行：insert(5, eeeee) -->
  <text x="66" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="135" y="277" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(5, eeeee)</text>
  <rect x="186" y="254" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="214" y="276" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">aaaaa</text>
  <rect x="248" y="254" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="276" y="276" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">bbbbb</text>
  <rect x="310" y="254" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="276" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">ccccc</text>
  <rect x="372" y="254" width="56" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="434" y="254" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="462" y="276" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">eeeee</text>
  <text x="544" y="277" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">4 → 4</text>
  <text x="638" y="277" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[ ]</text>

  <!-- 第 5 行：insert(4, ddddd)，一口气交付 4、5 -->
  <text x="66" y="329" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="135" y="329" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(4, ddddd)</text>
  <rect x="186" y="306" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="214" y="328" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">aaaaa</text>
  <rect x="248" y="306" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="276" y="328" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">bbbbb</text>
  <rect x="310" y="306" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="328" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">ccccc</text>
  <rect x="372" y="306" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="328" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">ddddd</text>
  <rect x="434" y="306" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="462" y="328" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">eeeee</text>
  <text x="544" y="329" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 → 6</text>
  <text x="638" y="329" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[ddddd, eeeee]</text>

  <!-- 脚注 -->
  <text x="360" y="372" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">ptr 轨迹 1 → 2 → 4 → 6：只前进、总位移恰为 5 = n → 收割循环总共只转 5 圈，均摊每次 O(1)</text>
  <text x="360" y="392" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">第 3 步是精髓：只写入块 2，却连带唤醒早已缓存的块 3 一起交付——乱序缓冲的全部价值</text>
</svg>
