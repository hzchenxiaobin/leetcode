<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="24" y="28" font-size="15" fill="#444" text-anchor="start" font-weight="bold" filter="url(#rough2)">算法流程：二维前缀和 + 二分答案</text>

  <rect x="120" y="44" width="360" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="300" y="67" font-size="11.2" fill="#3a4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">步骤 1：建二维前缀和 pre，O(mn)</text>
  <path d="M 300 80 L 300 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="12" y="98" width="576" height="294" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="6 5" rx="12" filter="url(#rough2)"/>
  <text x="26" y="118" font-size="10.5" fill="#777" text-anchor="start" filter="url(#rough2)">二分循环：至多 ⌊log₂ min(m,n)⌋ + 1 轮</text>

  <rect x="100" y="126" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="300" y="148" font-size="11.2" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">步骤 2：mid = (lo + hi) / 2，判定边长 mid</text>
  <text x="506" y="137" font-size="9.5" fill="#777" text-anchor="start" filter="url(#rough2)">回到步骤 2</text>
  <path d="M 300 160 L 300 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="180" width="460" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="84" y="201" font-size="10.8" fill="#3a5a30" text-anchor="start" font-weight="bold" filter="url(#rough2)">步骤 3：check(mid) —— 枚举每个右下角 (r,c)</text>
  <text x="84" y="221" font-size="10.8" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">容斥 O(1) 求 mid×mid 子方阵和，任一 ≤ threshold 即 true</text>
  <path d="M 300 238 L 300 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,258 400,292 300,326 200,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="296" font-size="11" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">check 为真？</text>

  <path d="M 400 292 L 418 292" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="409" y="284" font-size="9.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">是</text>
  <rect x="420" y="270" width="138" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="290" font-size="10.8" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">ans = mid</text>
  <text x="430" y="307" font-size="10.8" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">lo = mid + 1</text>

  <path d="M 200 292 L 182 292" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="191" y="284" font-size="9.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">否</text>
  <rect x="22" y="270" width="158" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="34" y="290" font-size="10.8" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">hi = mid − 1</text>
  <text x="34" y="307" font-size="10.8" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">ans 保持不变</text>

  <path d="M 489 314 L 489 338" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 101 314 L 101 358 L 136 358" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 520 358 L 572 358 L 572 143 L 504 143" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="340" width="380" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="330" y="362" font-size="10.8" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">lo ≤ hi ？继续下一轮 : 跳出循环</text>

  <path d="M 300 376 L 300 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="412" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="300" y="434" font-size="11.2" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">输出 ans（最大可行边长）</text>

  <text x="300" y="466" font-size="10.5" fill="#777" text-anchor="middle" font-weight="bold" filter="url(#rough2)">时间 O(mn log min(m,n))，空间 O(mn)</text>
</svg>
