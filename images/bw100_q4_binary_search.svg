<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">二分答案：判定可行的时间构成前缀</text>

  <!-- 数轴 -->
  <path d="M 60 150 L 470 150" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="138" width="250" height="24" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="310" y="138" width="160" height="24" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="185" y="155" text-anchor="middle" font-size="12" fill="#8c3a36">修不完 ✗</text>
    <text x="390" y="155" text-anchor="middle" font-size="12" fill="#2f5527">修得完 ✓</text>
    <text x="310" y="132" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">答案 ans</text>
  </g>

  <!-- 二分指针 -->
  <g filter="url(#rough2)">
    <path d="M 90 190 L 90 168" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
    <text x="90" y="208" text-anchor="middle" font-size="13" fill="#446688">lo</text>
    <path d="M 440 190 L 440 168" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
    <text x="440" y="208" text-anchor="middle" font-size="13" fill="#446688">hi</text>
    <path d="M 265 224 L 265 176" stroke="#d6a040" stroke-width="2" marker-end="url(#arrB)"/>
    <text x="265" y="242" text-anchor="middle" font-size="13" fill="#a07518">mid</text>
  </g>
  <text x="265" y="266" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">可行 → hi = mid；不可行 → lo = mid + 1</text>

  <!-- 单调性说明 -->
  <rect x="60" y="284" width="400" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">cap(t) = Σᵢ ⌊√(t/rᵢ)⌋ 随 t 单调不减</text>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">→ { t : cap(t) ≥ cars } 是一段前缀闭合区间</text>
</svg>
