<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="330" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">示例：三组特殊等价字符串</text>
  <text x="150" y="70" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-style="" filter="url(#rough2)">组 1</text>
  <rect x="60" y="86" width="180" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="114.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">abcd</text>
  <rect x="60" y="148" width="180" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="176.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">cdab</text>
  <rect x="60" y="210" width="180" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="238.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">cbad</text>
  <text x="350" y="70" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" font-style="" filter="url(#rough2)">组 2</text>
  <rect x="260" y="86" width="180" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="114.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">xyzz</text>
  <rect x="260" y="148" width="180" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="176.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">zzxy</text>
  <text x="550" y="70" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" font-style="" filter="url(#rough2)">组 3</text>
  <rect x="460" y="86" width="180" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550.0" y="114.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">zzyx</text>
  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="normal" font-style="" filter="url(#rough2)">注意：zzxy 与 zzyx 签名不同（"xz|yz" vs "yz|xz"），不是等价类</text>
</svg>
