<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="336" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">同一个词，三张表分别用三种键</text>
  <rect x="40" y="54" width="150" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="78" text-anchor="middle" font-size="11" fill="#33475b" font-weight="bold" filter="url(#rough2)">wordlist 中的词</text>
  <text x="40" y="134" text-anchor="start" font-size="10.5" fill="#666666" filter="url(#rough2)">原词（第 1 级）</text>
  <rect x="210" y="112" width="120" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">KiTe</text>
  <path d="M 180 126 L 208 129" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="192" text-anchor="start" font-size="10.5" fill="#666666" filter="url(#rough2)">小写（第 2 级）</text>
  <rect x="210" y="170" width="120" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">kite</text>
  <path d="M 180 126 L 208 187" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="250" text-anchor="start" font-size="10.5" fill="#666666" filter="url(#rough2)">元音归一（第 3 级）</text>
  <rect x="210" y="228" width="120" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">kata</text>
  <path d="M 180 126 L 208 245" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="112" width="170" height="144" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="136" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">三张表都存</text>
  <text x="445" y="158" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">「第一个出现的词」</text>
  <text x="445" y="184" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">用 setdefault /</text>
  <text x="445" y="202" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">emplace 保留首次</text>
  <text x="445" y="228" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">= 题目要求的</text>
  <text x="445" y="246" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">「第一个匹配项」</text>
  <rect x="40" y="276" width="490" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="303" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">元音集合只有 a e i o u，y 不算元音</text>
</svg>
