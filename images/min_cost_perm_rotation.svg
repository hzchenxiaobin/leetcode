<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">分数是环形的 → 旋转不变 → 不妨固定 perm[0] = 0</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="66" text-anchor="middle" font-size="11" fill="#888">示例 nums = [1, 0, 2]，下同</text>

  <!-- ===== Panel A: two rotated rings ===== -->
  <text x="230" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 排列 A = [0,1,2]，排成环</text>
  <text x="650" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 排列 B = [2,0,1]（A 旋转一格）</text>

  <!-- Ring A: center (230,215), nodes: top=0, right-bottom=1, left-bottom=2 -->
  <g font-size="13">
    <!-- edges -->
    <path d="M 273 190 Q 300 240 268 268" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 243 283 Q 230 300 217 283" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 192 268 Q 160 240 187 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <!-- edge labels -->
    <text x="302" y="243" font-size="10" fill="#7a2828" font-weight="bold">|0−nums[1]|=0</text>
    <text x="150" y="316" font-size="10" fill="#7a2828" font-weight="bold">|2−nums[0]|=1</text>
    <text x="88" y="222" font-size="10" fill="#7a2828" font-weight="bold">|1−nums[2]|=1</text>
    <!-- nodes -->
    <g filter="url(#sk)"><circle cx="230" cy="146" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="230" y="151" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <g filter="url(#sk)"><circle cx="258" cy="272" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="258" y="277" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <g filter="url(#sk)"><circle cx="202" cy="272" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="202" y="277" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
  </g>
  <g filter="url(#sk)">
    <rect x="168" y="336" width="124" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="230" y="356" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">score = 0+1+1 = 2</text>

  <!-- equals sign -->
  <text x="440" y="225" text-anchor="middle" font-size="30" font-weight="bold" fill="#b85450" filter="url(#sk)">=</text>
  <text x="440" y="252" text-anchor="middle" font-size="10" fill="#888">分数相同！</text>

  <!-- Ring B: center (650,215), nodes: top=2, right-bottom=0, left-bottom=1 -->
  <g font-size="13">
    <path d="M 693 190 Q 720 240 688 268" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
    <path d="M 663 283 Q 650 300 637 283" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
    <path d="M 612 268 Q 580 240 607 190" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
    <text x="722" y="243" font-size="10" fill="#7a2828" font-weight="bold">|2−nums[0]|=1</text>
    <text x="570" y="316" font-size="10" fill="#7a2828" font-weight="bold">|1−nums[2]|=1</text>
    <text x="508" y="222" font-size="10" fill="#7a2828" font-weight="bold">|0−nums[1]|=0</text>
    <g filter="url(#sk)"><circle cx="650" cy="146" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="650" y="151" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2</text>
    <g filter="url(#sk)"><circle cx="678" cy="272" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="678" y="277" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <g filter="url(#sk)"><circle cx="622" cy="272" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="622" y="277" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <g filter="url(#sk)">
    <rect x="588" y="336" width="124" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="650" y="356" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">score = 1+0+1 = 2</text>

  <!-- right note -->
  <g filter="url(#sk)">
    <rect x="818" y="140" width="104" height="196" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="870" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">环形相邻对</text>
  <text x="870" y="186" text-anchor="middle" font-size="10" fill="#444">{(0,1),</text>
  <text x="870" y="202" text-anchor="middle" font-size="10" fill="#444">(1,2),</text>
  <text x="870" y="218" text-anchor="middle" font-size="10" fill="#444">(2,0)}</text>
  <text x="870" y="244" text-anchor="middle" font-size="10" fill="#888">旋转只是</text>
  <text x="870" y="258" text-anchor="middle" font-size="10" fill="#888">重排求和</text>
  <text x="870" y="272" text-anchor="middle" font-size="10" fill="#888">顺序，边集</text>
  <text x="870" y="286" text-anchor="middle" font-size="10" fill="#888">完全相同</text>
  <text x="870" y="316" text-anchor="middle" font-size="10" fill="#7a2828" font-weight="bold">∴ 分数不变</text>

  <!-- ===== Panel B: lexicographic argument ===== -->
  <text x="470" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">③ 字典序论证：答案必以 0 开头</text>
  <g filter="url(#sk)">
    <rect x="60" y="422" width="820" height="112" rx="8" fill="#f3ecfa" stroke="#7a5aa0" stroke-width="1.3"/>
  </g>
  <text x="84" y="448" font-size="12" fill="#444">1. 任取一个最低分排列 P，把 P 旋转使 0 到首位，得 P′ —— 由①，P′ 仍是最低分；</text>
  <text x="84" y="474" font-size="12" fill="#444">2. 字典序比较先看首位：所有 [0, ...] 形排列，字典序 <font fill="#b85450" font-weight="bold">严格小于</font> 任何 [k, ...]（k &gt; 0）形排列；</text>
  <text x="84" y="500" font-size="12" fill="#444">3. 若字典序最小的最低分排列 Q 不以 0 开头，则它的「0 开头旋转」Q′ 分数同为最低、且 Q′ &lt; Q，矛盾；</text>
  <text x="84" y="524" font-size="12" fill="#2e6e2e" font-weight="bold">∴ 字典序最小的最低分排列一定以 0 开头，只需在 perm[0] = 0 的前提下求解。</text>

  <!-- ===== Panel C: conclusion ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="556" width="820" height="76" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="582" font-size="12" font-weight="bold" fill="#2b2b2b">固定起点后的问题形态</text>
  <text x="80" y="604" font-size="11" fill="#444">排列 = 从 0 出发、依次经过每个数恰好一次的路径 + 一条「闭环边」回到 0 —— 即带权哈密顿环（TSP 型）</text>
  <text x="80" y="622" font-size="11" fill="#7a2828">n ≤ 14，正是状压 DP（bitmask）的经典规模：O(2ⁿ·n²) ≈ 3.2×10⁶</text>
</svg>
