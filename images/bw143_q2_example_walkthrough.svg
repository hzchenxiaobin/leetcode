<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [1,4,5]，k = 1，numOperations = 2</text>

  <!-- 表头 -->
  <g font-size="11.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="66">目标 x</text>
    <text x="160" y="66">窗口内元素</text>
    <text x="272" y="66">c(x)</text>
    <text x="326" y="66">f(x)</text>
    <text x="398" y="66">c − f</text>
    <text x="482" y="66">min(c, f+m)</text>
  </g>
  <path d="M 34 76 L 526 76" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行 1：x=1 -->
  <rect x="44" y="86" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1}</text>
  <text x="272" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="326" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="398" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="482" y="106" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>

  <!-- 行 2：x=3 -->
  <rect x="44" y="126" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{4}</text>
  <text x="272" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="326" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="398" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="482" y="146" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>

  <!-- 行 3：x=4 -->
  <rect x="44" y="166" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="70" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">{4,5}</text>
  <text x="272" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="326" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="398" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="482" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 行 4：x=5 -->
  <rect x="44" y="206" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="160" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{4,5}</text>
  <text x="272" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="326" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="398" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="482" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>

  <!-- 行 5：x=6 -->
  <rect x="44" y="246" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="160" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{5}</text>
  <text x="272" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="326" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="398" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="482" y="266" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>

  <path d="M 34 288 L 526 288" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">最大值出现在 x = 4 或 x = 5：min(2, 1+2) = 2</text>
</svg>
