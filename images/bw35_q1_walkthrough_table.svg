<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：arr = [1, 4, 2, 5, 3]，n = 5</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="50" y="56" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#446688" text-anchor="middle" font-weight="bold">
    <text x="84" y="78">i</text>
    <text x="148" y="78">arr[i]</text>
    <text x="222" y="78">L=i+1</text>
    <text x="296" y="78">R=n−i</text>
    <text x="386" y="78">c_i</text>
    <text x="476" y="78">贡献</text>
  </g>

  <!-- 5 行数据 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <rect x="50" y="92" width="460" height="32" fill="none" stroke="#888" stroke-width="1" rx="3"/>
    <text x="84" y="113">0</text>
    <text x="148" y="113">1</text>
    <text x="222" y="113">1</text>
    <text x="296" y="113">5</text>
    <rect x="352" y="96" width="66" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="386" y="113">3</text>
    <text x="476" y="113">1×3=3</text>

    <rect x="50" y="124" width="460" height="32" fill="none" stroke="#888" stroke-width="1" rx="3"/>
    <text x="84" y="145">1</text>
    <text x="148" y="145">4</text>
    <text x="222" y="145">2</text>
    <text x="296" y="145">4</text>
    <rect x="352" y="128" width="66" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="386" y="145">4</text>
    <text x="476" y="145">4×4=16</text>

    <rect x="50" y="156" width="460" height="32" fill="none" stroke="#888" stroke-width="1" rx="3"/>
    <text x="84" y="177">2</text>
    <text x="148" y="177">2</text>
    <text x="222" y="177">3</text>
    <text x="296" y="177">3</text>
    <rect x="352" y="160" width="66" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="386" y="177">5</text>
    <text x="476" y="177">2×5=10</text>

    <rect x="50" y="188" width="460" height="32" fill="none" stroke="#888" stroke-width="1" rx="3"/>
    <text x="84" y="209">3</text>
    <text x="148" y="209">5</text>
    <text x="222" y="209">4</text>
    <text x="296" y="209">2</text>
    <rect x="352" y="192" width="66" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="386" y="209">4</text>
    <text x="476" y="209">5×4=20</text>

    <rect x="50" y="220" width="460" height="32" fill="none" stroke="#888" stroke-width="1" rx="3"/>
    <text x="84" y="241">4</text>
    <text x="148" y="241">3</text>
    <text x="222" y="241">5</text>
    <text x="296" y="241">1</text>
    <rect x="352" y="224" width="66" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="386" y="241">3</text>
    <text x="476" y="241">3×3=9</text>
  </g>

  <!-- 总计 -->
  <g filter="url(#rough2)">
    <rect x="50" y="260" width="460" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <text x="280" y="285" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 3 + 16 + 10 + 20 + 9 = 58 ✓</text>

  <!-- 底部注解 -->
  <g filter="url(#rough2)">
    <rect x="70" y="316" width="420" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
  </g>
  <text x="280" y="345" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">抽验 i=2：含它的奇长度子数组为 [2]、[1,4,2]、</text>
  <text x="280" y="358" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[4,2,5]、[2,5,3]、[1,4,2,5,3]，恰 5 个 ✓</text>
</svg>
