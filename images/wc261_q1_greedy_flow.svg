<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="780" height="520" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一趟扫描 —— 遇 X 开窗跳 3，遇 O 前进 1</text>
  <path d="M 180 42 Q 390 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- left note card -->
  <g filter="url(#rough2)">
    <rect x="40" y="58" width="195" height="88" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="137" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">扫描要点</text>
  <text x="52" y="97" font-size="10.5" fill="#444" filter="url(#rough2)">· 遇 'X'：ans+1，i += 3</text>
  <text x="52" y="114" font-size="10.5" fill="#444" filter="url(#rough2)">· 遇 'O'：i += 1</text>
  <text x="52" y="131" font-size="10.5" fill="#444" filter="url(#rough2)">· i 每步至少 +1 → 单趟 O(n)</text>

  <!-- right note card -->
  <g filter="url(#rough2)">
    <rect x="555" y="50" width="195" height="100" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="652" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">右边界钳制</text>
  <text x="567" y="90" font-size="10.5" fill="#444" filter="url(#rough2)">· 最左 X 落在 i &gt; n−3 时</text>
  <text x="567" y="107" font-size="10.5" fill="#444" filter="url(#rough2)">· [i, i+2] 越界 → 取 [n−3, n−1]</text>
  <text x="567" y="124" font-size="10.5" fill="#444" filter="url(#rough2)">· 仍一次操作盖到串尾</text>
  <text x="567" y="141" font-size="10.5" fill="#444" filter="url(#rough2)">· 计数不变，零特判</text>

  <!-- return box -->
  <g filter="url(#rough2)">
    <rect x="555" y="175" width="195" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="652" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">返回 ans</text>
  <text x="652" y="216" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">全部 X 变 O 的最少操作数</text>

  <!-- box A -->
  <g filter="url(#rough2)">
    <rect x="265" y="62" width="230" height="36" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="380" y="85" text-anchor="middle" font-size="12.5" fill="#2b4666" filter="url(#rough2)">初始化：i ← 0，ans ← 0</text>
  <path d="M 380 98 L 380 114" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <g filter="url(#rough2)">
    <polygon points="380,118 520,162 380,206 240,162" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="380" y="167" text-anchor="middle" font-size="12.5" fill="#2b4666" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M 520 162 Q 545 166 553 196" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="532" y="152" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <path d="M 380 206 L 380 224" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="220" font-size="11" fill="#888" filter="url(#rough2)">是</text>

  <!-- diamond 2 -->
  <g filter="url(#rough2)">
    <polygon points="380,228 520,272 380,316 240,272" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="380" y="277" text-anchor="middle" font-size="12.5" fill="#2b4666" filter="url(#rough2)">s[i] == 'X' ?</text>
  <path d="M 380 316 L 380 334" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="330" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <path d="M 520 272 L 552 272" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="530" y="262" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- box X -->
  <g filter="url(#rough2)">
    <rect x="265" y="338" width="230" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="380" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">ans += 1，i += 3</text>
  <text x="380" y="380" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">窗口 [i, i+2] 三格一并搞定</text>

  <!-- box O -->
  <g filter="url(#rough2)">
    <rect x="558" y="248" width="165" height="48" rx="8" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.5"/>
  </g>
  <text x="640" y="268" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">i += 1</text>
  <text x="640" y="285" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">'O' 无需操作</text>

  <!-- loop back -->
  <path d="M 380 402 L 380 448" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <path d="M 640 296 L 640 448" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <path d="M 640 448 L 110 448 L 110 162 L 232 162" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="468" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">当前位置处理完 → 回到循环头，直至 i ≥ n</text>

  <text x="390" y="500" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每步 i 至少 +1、至多 +3 —— 时间 O(n)；只动下标不动串 —— 空间 O(1)</text>
</svg>
