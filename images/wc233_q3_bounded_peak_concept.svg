<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：固定峰值 x，「山峰形」数组让总和最小</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">以 n=8, index=3, 峰值 x=4 为例：每个位置都取到下界 max(1, x − |index − j|)</text>

  <!-- Peak annotation -->
  <text x="250" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">峰值 x = 4（下标 index = 3）</text>
  <path d="M 250 82 L 250 142" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="76" y="144">0</text>
    <text x="134" y="144">1</text>
    <text x="192" y="144">2</text>
    <text x="250" y="144">3</text>
    <text x="308" y="144">4</text>
    <text x="366" y="144">5</text>
    <text x="424" y="144">6</text>
    <text x="482" y="144">7</text>
  </g>

  <!-- mountain cells -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="50" y="150" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="76" y="175" fill="#333">1</text>
    <rect x="108" y="150" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="134" y="175" fill="#333">2</text>
    <rect x="166" y="150" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="192" y="175" fill="#333">3</text>
    <rect x="224" y="150" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="250" y="175" fill="#b85450">4</text>
    <rect x="282" y="150" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="308" y="175" fill="#333">3</text>
    <rect x="340" y="150" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="366" y="175" fill="#333">2</text>
    <rect x="398" y="150" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="424" y="175" fill="#333">1</text>
    <rect x="456" y="150" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="482" y="175" fill="#333">1</text>
  </g>

  <!-- distance from index -->
  <text x="40" y="206" font-size="9.5" fill="#888" text-anchor="end" filter="url(#rough2)">d =</text>
  <g filter="url(#rough2)" font-size="9.5" fill="#888" text-anchor="middle">
    <text x="76" y="206">3</text>
    <text x="134" y="206">2</text>
    <text x="192" y="206">1</text>
    <text x="250" y="206">0</text>
    <text x="308" y="206">1</text>
    <text x="366" y="206">2</text>
    <text x="424" y="206">3</text>
    <text x="482" y="206">4 &gt; x−1 触底</text>
  </g>

  <!-- side brackets -->
  <path d="M 50 216 L 50 226 L 218 226 L 218 216" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 282 216 L 282 226 L 450 226 L 450 216" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 456 216 L 456 226 L 508 226 L 508 216" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- side labels -->
  <text x="134" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 左 cnt=3：完整下降 3+2+1 = 6</text>
  <text x="366" y="244" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 右下降段 3+2+1 = 6</text>
  <text x="482" y="260" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 铺平 +1</text>

  <!-- min sum box -->
  <rect x="90" y="272" width="380" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">minSum(4) = 峰 4 + 左 6 + 右 (6+1) = 17</text>

  <!-- formulas -->
  <text x="280" y="328" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">完整下降（cnt ≤ x−1）：sideSum = cnt·x − cnt·(cnt+1)/2</text>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">触底铺平（cnt &gt; x−1）：sideSum = (x−1)·x/2 + (cnt − (x−1))</text>

  <!-- key insight box -->
  <rect x="44" y="358" width="472" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 相邻差 ≤ 1 逐格连锁：每远离峰值一步最多降 1 → nums[j] ≥ x − |index−j|</text>
  <text x="280" y="394" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 与正整数下限取 max，山峰形逐点取到 → 固定 x 的最小和；x 越大总和越大 → 二分最大可行 x</text>
</svg>
