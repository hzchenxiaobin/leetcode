<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="65" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">双指针合并两步：l 与 r 相向而行</text>
  <path d="M 170.0 44 Q 320.0 54 470.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="320.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">行 [1, 0, 0, 1] → [0, 1, 1, 0]</text>
  <g filter="url(#rough2)"><rect x="210" y="96" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="236.0" y="125.92" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="280" y="96" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="306.0" y="125.92" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="350" y="96" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="376.0" y="125.92" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="420" y="96" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="446.0" y="125.92" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <text x="236.0" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">l</text>
  <text x="446.0" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">r</text>
  <path d="M 274 68 Q 332.0 68.0 390 68" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="320" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">第 1 轮：l=0，r=3</text>
  <text x="320" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">a = 1−old[0] = 0，b = 1−old[3] = 0</text>
  <text x="320" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">res[0] = b = 0，res[3] = a = 0</text>
  <g filter="url(#rough2)"><rect x="210" y="220" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="236.0" y="249.92000000000002" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="280" y="220" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="306.0" y="249.92000000000002" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="350" y="220" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="376.0" y="249.92000000000002" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="420" y="220" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="446.0" y="249.92000000000002" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">0</text>
  <text x="320" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">第 2 轮：l=1，r=2（此处 l &lt; r）</text>
  <text x="320" y="310" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">a = 1−old[1] = 1，b = 1−old[2] = 1</text>
  <g filter="url(#rough2)"><rect x="210" y="324" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="236.0" y="353.92" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="280" y="324" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="306.0" y="353.92" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="350" y="324" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="376.0" y="353.92" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="420" y="324" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="446.0" y="353.92" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#rough2)">0</text>
  <text x="320" y="396" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">l 越过 r 即结束；若长度奇数，l = r 时把该格取反即可</text>
  </svg>