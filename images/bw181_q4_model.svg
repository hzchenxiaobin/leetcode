<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">模型：从「全体正偶数」里挖掉子数组中的偶数</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">nums 严格递增 ⇒ 被挖掉的偶数是子数组内的一段连续片段</text>
  <text x="30" y="88" text-anchor="start" font-size="11" fill="#333">偶数序列 2, 4, 6, 8, 10, 12, 14, 16, …</text>
  <rect x="30" y="100" width="58" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="59" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="59" y="160" text-anchor="middle" font-size="9.5" fill="#888">剩余</text>
  <rect x="96" y="100" width="58" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125" y="128" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="125" y="160" text-anchor="middle" font-size="9.5" fill="#888">移除</text>
  <rect x="162" y="100" width="58" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="191" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="191" y="160" text-anchor="middle" font-size="9.5" fill="#888">剩余</text>
  <rect x="228" y="100" width="58" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="257" y="128" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">8</text>
  <text x="257" y="160" text-anchor="middle" font-size="9.5" fill="#888">移除</text>
  <rect x="294" y="100" width="58" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="323" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="323" y="160" text-anchor="middle" font-size="9.5" fill="#888">剩余</text>
  <rect x="360" y="100" width="58" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="389" y="128" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">12</text>
  <text x="389" y="160" text-anchor="middle" font-size="9.5" fill="#888">移除</text>
  <rect x="426" y="100" width="58" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="455" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">14</text>
  <text x="455" y="160" text-anchor="middle" font-size="9.5" fill="#888">剩余</text>
  <rect x="492" y="100" width="58" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="521" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">16</text>
  <text x="521" y="160" text-anchor="middle" font-size="9.5" fill="#888">剩余</text>
  <rect x="30" y="186" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">nums[l..r] 里的偶数 = {4, 8, 12} → 剩余 2, 6, 10, 14, 16, …</text>
  <rect x="30" y="238" width="236" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="148" y="265" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k = 1 → 2</text>
  <text x="148" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k = 2 → 6</text>
  <rect x="294" y="238" width="236" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="412" y="265" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">k = 3 → 10</text>
  <text x="412" y="279" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">k = 4 → 14</text>
  <text x="30" y="332" text-anchor="start" font-size="10.5" fill="#555">关键：第 k 个剩余偶数 ≤ 2·(k + 子数组长度)，答案只有 O(log) 级候选</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">被移除的偶数一定落在 nums[l..r] 的数值范围里；子数组越长，偏移越大</text>
</svg>
