<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="372" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">峰顶把山脉数组劈成两段：左段单调升、右段单调降</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">arr = [1, 3, 5, 7, 9, 6, 4, 2]，峰顶下标 4；比较 arr[mid] 与 arr[mid+1] 即可判定方向</text>
  <rect x="66" y="248" width="34" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="83" y="240" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="83" y="286" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <rect x="110" y="208" width="34" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="127" y="200" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="127" y="286" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <rect x="154" y="168" width="34" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="171" y="160" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="171" y="286" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <rect x="198" y="128" width="34" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="215" y="120" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="215" y="286" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <rect x="242" y="88" width="34" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="259" y="80" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="259" y="286" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <rect x="286" y="148" width="34" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="303" y="140" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="303" y="286" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <rect x="330" y="188" width="34" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="347" y="180" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="347" y="286" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>
  <rect x="374" y="228" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="391" y="220" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="391" y="286" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7</text>
  <path d="M 70 108 L 70 96 L 240 96 L 240 108" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="155" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">上坡：arr[i] &lt; arr[i+1]</text>
  <path d="M 250 108 L 250 96 L 420 96 L 420 108" stroke="#446688" stroke-width="1.6" fill="none" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="335" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">下坡：arr[i] &gt; arr[i+1]</text>
  <path d="M 259 68 L 259 54" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">峰顶</text>
  <line x1="60" y1="268" x2="560" y2="268" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="84" y="300" width="452" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="96" y="320" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">二分不变式：答案（峰顶下标）永远落在闭区间 [lo, hi] 内</text>
  <text x="96" y="341" text-anchor="start" font-size="11" fill="#3a3a3a" filter="url(#rough2)">arr[mid] &lt; arr[mid+1] → 仍在上坡，峰顶在 mid 右侧 → lo = mid + 1；否则 hi = mid</text>
</svg>
