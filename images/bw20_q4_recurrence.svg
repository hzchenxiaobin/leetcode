<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="188"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">递推链条与闭式：f(n) = f(n−1) · n · (2n−1) = (2n)! / 2ⁿ</text>

  <!-- 递推链 -->
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="30" y="64" width="92" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="76" y="83">f(1) = 1</text>
    <text x="76" y="101" font-size="11" fill="#446688">1 对只有 1 序</text>

    <path d="M 122 86 L 152 86" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <text x="137" y="76" font-size="11" fill="#446688">×2×3</text>

    <rect x="154" y="64" width="92" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="200" y="83">f(2) = 6</text>
    <text x="200" y="101" font-size="11" fill="#4a7a3a">C(4,2) = 6</text>

    <path d="M 246 86 L 276 86" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <text x="261" y="76" font-size="11" fill="#446688">×3×5</text>

    <rect x="278" y="64" width="92" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="324" y="83">f(3) = 90</text>
    <text x="324" y="101" font-size="11" fill="#4a7a3a">6! = 720</text>

    <path d="M 370 86 L 400 86" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <text x="385" y="76" font-size="11" fill="#446688">×4×7</text>

    <rect x="402" y="64" width="128" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="466" y="83">f(4) = 2520</text>
    <text x="466" y="101" font-size="11" fill="#7a5c1e">8!/2⁴ = 2520</text>
  </g>

  <!-- 通项推导 -->
  <rect x="40" y="140" width="480" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">f(n) = ∏ᵢ₌₁ⁿ i·(2i−1) = n! · (2n−1)!! = (2n)! / 2ⁿ</text>
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">连乘里 2i−1 恰是所有不超过 2n 的奇数之积（双阶乘）</text>
  <text x="280" y="202" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">n! × (2n)!/(2ⁿ·n!) 约分后只剩 (2n)!/2ⁿ</text>

  <!-- 取模实现 -->
  <text x="280" y="242" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">取模实现：为什么递推最稳</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="256" width="225" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <rect x="295" y="256" width="225" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="152" y="278" fill="#446688" font-weight="bold">闭式 (2n)!/2ⁿ 直接算</text>
    <text x="152" y="298" fill="#333">分子要算 1000! 的模值</text>
    <text x="152" y="316" fill="#333">除以 2ⁿ 得用乘法逆元</text>
    <text x="152" y="334" fill="#333">（2 对 10⁹+7 有逆元）</text>
    <text x="407" y="278" fill="#2d5a22" font-weight="bold">递推 f(i) = f(i−1)·i·(2i−1)</text>
    <text x="407" y="298" fill="#333">每步只乘两个小因子</text>
    <text x="407" y="316" fill="#333">先各自取模再相乘</text>
    <text x="407" y="334" fill="#2d5a22" font-weight="bold">n = 500 也能秒算</text>
  </g>
  <rect x="40" y="364" width="480" height="12" fill="none" filter="url(#rough2)"/>
</svg>
