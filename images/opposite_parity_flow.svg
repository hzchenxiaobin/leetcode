<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：倒序一趟，先查后插</text>
  <path d="M 180 38 Q 320 48 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <ellipse cx="320" cy="66" rx="44" ry="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="320" y="71" text-anchor="middle" font-size="13" fill="#2e6e2e">开始</text>
  <path d="M 320 86 L 320 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="190" y="104" width="260" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="126" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace">cntOdd = cntEven = 0；i = n − 1</text>
  <path d="M 320 140 L 320 154" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <polygon points="320,160 408,198 320,236 232,198" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="320" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">i &lt; 0 ?</text>
  <text x="214" y="190" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 232 198 L 202 198" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="86" y="180" width="112" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="142" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 ans</text>
  <text x="330" y="252" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <path d="M 320 236 L 320 256" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <polygon points="320,262 424,298 320,334 216,298" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="320" y="303" text-anchor="middle" font-size="13" fill="#2b6e9e">nums[i] 是偶数 ?</text>
  <text x="224" y="288" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">偶</text>
  <path d="M 216 298 L 202 298" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="430" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">奇</text>
  <path d="M 424 298 L 438 298" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- even branch -->
  <g filter="url(#sk)">
    <rect x="42" y="274" width="158" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="121" y="294" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">① ans[i] = cntOdd</text>
  <text x="121" y="312" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">② cntEven += 1</text>

  <!-- odd branch -->
  <g filter="url(#sk)">
    <rect x="442" y="274" width="158" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="521" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace">① ans[i] = cntEven</text>
  <text x="521" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace">② cntOdd += 1</text>

  <!-- merge to i decrement -->
  <path d="M 121 324 L 121 373 L 281 373" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 521 324 L 521 373 L 359 373" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="287" y="358" width="66" height="30" rx="8" fill="#fdfcf7" stroke="#888" stroke-width="1.4"/>
  </g>
  <text x="320" y="377" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">i −= 1</text>

  <!-- loop back -->
  <path d="M 353 373 L 612 373 L 612 198 L 416 198" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="513" y="190" text-anchor="middle" font-size="11" fill="#888">回到 i &lt; 0 ?</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="42" y="404" width="556" height="34" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="425" text-anchor="middle" font-size="12" fill="#7a5415">先查（对面计数器）后插（本方计数器）：作答瞬间计数器恰为「严格右侧」全体</text>
</svg>
