<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：两例对照</text>

  <!-- 例 1：[3,1,5,4,2], k=2 -->
  <text x="46" y="68" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">例 1：k = 2</text>
  <rect x="46" y="80" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="102" y="80" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="158" y="80" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="214" y="80" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="270" y="80" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="72" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="128" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="184" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="240" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="296" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="352" y="92" font-size="12" fill="#666" filter="url(#rough2)">← 扫描方向</text>
  <text x="352" y="110" font-size="12" fill="#666" filter="url(#rough2)">1、2 各首次出现</text>
  <rect x="400" y="84" width="86" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="443" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4 次</text>

  <!-- 例 2：[3,2,5,3,1], k=3 -->
  <text x="46" y="168" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">例 2：k = 3</text>
  <rect x="46" y="180" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="102" y="180" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="158" y="180" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="214" y="180" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="270" y="180" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="72" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="128" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="184" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="240" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="296" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="352" y="192" font-size="12" fill="#666" filter="url(#rough2)">重复的 3 只标记一次</text>
  <text x="352" y="210" font-size="12" fill="#666" filter="url(#rough2)">第一个 3 在 i=3 就够</text>
  <rect x="400" y="184" width="86" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="443" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4 次</text>

  <!-- 底部要点 -->
  <rect x="36" y="250" width="448" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 = 最靠左的「已集齐」位置 i 对应的 n − i</text>
  <text x="260" y="292" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">值 &gt; k 的元素永远无用，跳过即可（1 ≤ nums[i] ≤ n）</text>
</svg>
