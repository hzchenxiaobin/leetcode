<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例 2 演算：t = 15 时终点还隔在另一个连通块里</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">数字是平台高度；水位每涨 1，就新增若干可踩的格子，连通块随之合并</text>

  <text x="48" y="78" font-size="10.5" fill="#666" filter="url(#rough2)">grid（5 × 5，值为 0..24 的排列）</text>

  <rect x="48" y="86" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="57" y="106" font-size="11" fill="#2f3f5c" filter="url(#rough2)">0</text>
  <rect x="104" y="86" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="106" font-size="11" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="160" y="86" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="169" y="106" font-size="11" fill="#2f3f5c" filter="url(#rough2)">2</text>
  <rect x="216" y="86" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="225" y="106" font-size="11" fill="#2f3f5c" filter="url(#rough2)">3</text>
  <rect x="272" y="86" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="281" y="106" font-size="11" fill="#2f3f5c" filter="url(#rough2)">4</text>

  <rect x="48" y="142" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="57" y="162" font-size="11" fill="#8a3a36" filter="url(#rough2)">24</text>
  <rect x="104" y="142" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="162" font-size="11" fill="#8a3a36" filter="url(#rough2)">23</text>
  <rect x="160" y="142" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="162" font-size="11" fill="#8a3a36" filter="url(#rough2)">22</text>
  <rect x="216" y="142" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="162" font-size="11" fill="#8a3a36" filter="url(#rough2)">21</text>
  <rect x="272" y="142" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="281" y="162" font-size="11" fill="#2f3f5c" filter="url(#rough2)">5</text>

  <rect x="48" y="198" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="57" y="218" font-size="11" fill="#33552a" filter="url(#rough2)">12</text>
  <rect x="104" y="198" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="218" font-size="11" fill="#33552a" filter="url(#rough2)">13</text>
  <rect x="160" y="198" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="169" y="218" font-size="11" fill="#33552a" filter="url(#rough2)">14</text>
  <rect x="216" y="198" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="225" y="218" font-size="11" fill="#33552a" filter="url(#rough2)">15</text>
  <rect x="272" y="198" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="281" y="218" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">16</text>

  <rect x="48" y="254" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="57" y="274" font-size="11" fill="#33552a" filter="url(#rough2)">11</text>
  <rect x="104" y="254" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="274" font-size="11" fill="#8a3a36" filter="url(#rough2)">17</text>
  <rect x="160" y="254" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="274" font-size="11" fill="#8a3a36" filter="url(#rough2)">18</text>
  <rect x="216" y="254" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="274" font-size="11" fill="#8a3a36" filter="url(#rough2)">19</text>
  <rect x="272" y="254" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="274" font-size="11" fill="#8a3a36" filter="url(#rough2)">20</text>

  <rect x="48" y="310" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="57" y="330" font-size="11" fill="#33552a" filter="url(#rough2)">10</text>
  <rect x="104" y="310" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="330" font-size="11" fill="#33552a" filter="url(#rough2)">9</text>
  <rect x="160" y="310" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="169" y="330" font-size="11" fill="#33552a" filter="url(#rough2)">8</text>
  <rect x="216" y="310" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="225" y="330" font-size="11" fill="#33552a" filter="url(#rough2)">7</text>
  <rect x="272" y="310" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="281" y="330" font-size="11" fill="#33552a" filter="url(#rough2)">6</text>

  <path d="M 76 114 L 300 114 L 300 226 L 76 226 L 76 338 L 300 338"
        stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="7 5"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 262 338 L 296 338" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="76" cy="114" rx="8" ry="8" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="300" cy="338" rx="8" ry="8" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="136" font-size="8.5" fill="#446688" filter="url(#rough2)">S</text>
  <text x="308" y="354" font-size="8.5" fill="#b85450" filter="url(#rough2)">E</text>

  <text x="360" y="92" font-size="10.5" font-weight="bold" fill="#444" filter="url(#rough2)">t = 15 时的连通情况</text>
  <text x="360" y="112" font-size="9.5" fill="#446688" filter="url(#rough2)">块 A = {0,1,2,3,4,5}：顶行 + 第 2 行右端</text>
  <text x="360" y="130" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">块 B = {6,…,15}：左下角 + 整个底边</text>
  <text x="360" y="148" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">终点 (4,4) = 6 ∈ B，起点 ∈ A → 不通</text>
  <text x="360" y="168" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">t = 16：格 16 加入，A 与 B 合并</text>
  <text x="360" y="186" font-size="9.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">→ 首次连通 = 16 = 答案</text>

  <rect x="360" y="204" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="382" y="215" font-size="9.5" fill="#555" filter="url(#rough2)">高度 ≤ 5 的 A 块（t = 15 已淹没）</text>
  <rect x="360" y="228" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="382" y="239" font-size="9.5" fill="#555" filter="url(#rough2)">6 ≤ 高度 ≤ 15 的 B 块</text>
  <rect x="360" y="252" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="382" y="263" font-size="9.5" fill="#555" filter="url(#rough2)">第 16 步才淹没的桥（高度 16）</text>
  <rect x="360" y="276" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="382" y="287" font-size="9.5" fill="#555" filter="url(#rough2)">高度 ≥ 17，t = 15 时踩不到</text>

  <text x="360" y="314" font-size="9.5" fill="#666" filter="url(#rough2)">红色虚线：一条瓶颈为 16 的路线，</text>
  <text x="360" y="330" font-size="9.5" fill="#666" filter="url(#rough2)">max = 16 出现在 6 → 16 那一跳。</text>

  <rect x="40" y="384" width="560" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="404" font-size="10" fill="#7a2f2c" filter="url(#rough2)">路线 0→1→2→3→4→5→16→15→14→13→12→11→10→9→8→7→6 的瓶颈是 16；</text>
  <text x="56" y="422" font-size="10" fill="#7a2f2c" filter="url(#rough2)">而 t = 15 时起点与终点分属两块，故 16 既是上界也是下界 → 答案为 16。</text>
  <text x="56" y="440" font-size="9.5" fill="#8a5a56" filter="url(#rough2)">（若只看「最短路径」而不看瓶颈，会误以为很快就能到右下角。）</text>
</svg>
