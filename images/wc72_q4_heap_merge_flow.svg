<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：n-1 条有序链的 k 路归并（小根堆）</text>

  <!-- ① 初始化 -->
  <rect x="110" y="52" width="500" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="78" font-size="12" fill="#2d4a66" filter="url(#rough2)">① 初始化：把 n-1 条链的链首 (0, j)，j = 1..n-1，压入小根堆</text>
  <text x="128" y="100" font-size="11.5" fill="#2d4a66" filter="url(#rough2)">堆内元素 ≤ n-1 个，堆顶 = 所有链首中的最小分数</text>

  <path d="M360,116 L360,148" stroke="#666" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 循环 -->
  <rect x="110" y="150" width="500" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="176" font-size="12" fill="#8a6420" filter="url(#rough2)">② 重复 k-1 轮：弹出堆顶 (i, j)，它是当前未弹出的最小分数</text>
  <text x="128" y="199" font-size="11.5" fill="#8a6420" filter="url(#rough2)">若 i+1 &lt; j，把同列下一个 (i+1, j) 压回堆；否则该列已耗尽</text>
  <text x="128" y="222" font-size="11.5" fill="#8a6420" filter="url(#rough2)">每轮 O(log n)，出堆顺序就是全部分数的升序</text>

  <!-- 自环 -->
  <path d="M110,182 C60,170 60,214 108,212" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="196" text-anchor="middle" font-size="9.5" fill="#b85450"
        transform="rotate(-90 86 196)" filter="url(#rough2)">k−1 轮</text>

  <path d="M360,238 L360,266" stroke="#666" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 返回 -->
  <rect x="110" y="268" width="500" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="128" y="294" font-size="12" fill="#3a5a30" filter="url(#rough2)">③ 返回堆顶 (i, j)，答案为 [arr[i], arr[j]]</text>
  <text x="128" y="316" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">前 k-1 次出堆已弹掉更小的分数，此时堆顶就是第 k 小</text>

  <!-- 底部示例 -->
  <rect x="30" y="340" width="660" height="102" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="366" font-size="12" fill="#8a3b38" filter="url(#rough2)">arr = [1,2,3,5]，k = 3：初始堆 { 1/5(0,3), 1/3(0,2), 1/2(0,1) }</text>
  <text x="48" y="390" font-size="12" fill="#8a3b38" filter="url(#rough2)">第 1 轮：弹出 1/5(0,3) → 压入 2/5(1,3)；第 2 轮：弹出 1/3(0,2) → 压入 2/3(1,2)</text>
  <text x="48" y="414" font-size="12" fill="#8a3b38" filter="url(#rough2)">两轮已满 k-1 = 2，堆顶 2/5 ⇒ 返回 [2, 5]</text>
</svg>
