<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">演算：s = "hello"，从左到右累加相邻差</text>

  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <rect x="40" y="48" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="110" y="48" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="180" y="48" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="260" y="48" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="380" y="48" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="67">i</text><text x="145" y="67">字符</text><text x="220" y="67">ASCII</text>
    <text x="320" y="67">|差|（与前一个）</text><text x="425" y="67">累计</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="76" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="110" y="76" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="180" y="76" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="260" y="76" width="120" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="380" y="76" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="95">1</text><text x="145" y="95">e</text><text x="220" y="95">101</text>
    <text x="320" y="95">|101 − 104| = 3</text><text x="425" y="95">3</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="108" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="110" y="108" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="180" y="108" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="260" y="108" width="120" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="380" y="108" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="127">2</text><text x="145" y="127">l</text><text x="220" y="127">108</text>
    <text x="320" y="127">|108 − 101| = 7</text><text x="425" y="127">10</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="140" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="110" y="140" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="180" y="140" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="260" y="140" width="120" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="380" y="140" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="159">3</text><text x="145" y="159">l</text><text x="220" y="159">108</text>
    <text x="320" y="159">|108 − 108| = 0</text><text x="425" y="159">10</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="172" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="110" y="172" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="180" y="172" width="80" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="260" y="172" width="120" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="380" y="172" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="191">4</text><text x="145" y="191">o</text><text x="220" y="191">111</text>
    <text x="320" y="191">|111 − 108| = 3</text><text x="425" y="191">13</text>
  </g>
  <text x="440" y="220" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最后一格即答案</text>

  <rect x="40" y="238" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="259" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">答案 13；四条相邻差之和 3 + 7 + 0 + 3 = 13</text>
  <rect x="40" y="278" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="299" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">i 从 1 开始，避免访问 s[−1]；n = 2 时恰有一条边</text>
</svg>
