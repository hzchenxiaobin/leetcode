<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一次 O(n) 预处理，每查询 O(log n)</text>
  <path d="M 160 42 Q 340 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="40" y="58" width="600" height="120" rx="10" fill="#f4f6f8" stroke="#8a97a5" stroke-width="1.3"/></g>
  <text x="340" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#sk)">① 预处理：shrink-while-bad 滑窗（同 Q1，把中间量存下来）</text>
  <g filter="url(#sk)" font-size="11.5" fill="#444">
    <text x="70" y="106">for b = 0 .. n−1：入窗 (s[b]=='0' ? zeros : ones)++</text>
    <text x="70" y="126">    while (zeros &gt; k <tspan fill="#b03a3a" font-weight="bold">&amp;&amp;</tspan> ones &gt; k) 出窗左端</text>
    <text x="70" y="146">    L[b] = left；p[b] = b − left + 1；S[b] = S[b−1] + p[b]</text>
    <text x="70" y="166" font-size="10.5" fill="#33506b">→ 得到 L 数组（单调不降）与前缀和 S</text>
  </g>

  <g filter="url(#sk)"><path d="M 340 180 L 340 202" stroke="#c98a2b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="40" y="206" width="600" height="58" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="340" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 查询 [l, r]：二分找最小 m ∈ [l, r+1) 使 L[m] ≥ l</text>
  <text x="340" y="252" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">（L 单调不降 ⟹ 谓词「L[b] ≥ l」随 b 单调 ⟹ 可二分）</text>

  <g filter="url(#sk)"><path d="M 340 264 Q 250 280 190 290" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><path d="M 340 264 Q 430 280 490 290" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="40" y="294" width="290" height="92" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="185" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">左区 b ∈ [l, m−1]</text>
  <text x="185" y="340" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">L[b] &lt; l，贡献 b − l + 1</text>
  <text x="185" y="360" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">T(m−l) = (m−l)(m−l+1)/2</text>
  <text x="185" y="378" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">等差数列求和，乘法用 long long</text>

  <g filter="url(#sk)"><rect x="350" y="294" width="290" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="495" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b" filter="url(#sk)">右区 b ∈ [m, r]</text>
  <text x="495" y="340" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">L[b] ≥ l，贡献 p[b]</text>
  <text x="495" y="360" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">S[r] − S[m−1]</text>
  <text x="495" y="378" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#sk)">前缀和作差，m=0 时 S[−1] 记为 0</text>

  <g filter="url(#sk)"><path d="M 185 386 Q 260 400 330 404" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><path d="M 495 386 Q 420 400 350 404" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="180" y="408" width="320" height="44" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="340" y="436" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a" filter="url(#sk)">ans = T(m−l) + S[r] − S[m−1]</text>

  <text x="340" y="462" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">总计 O(n + q log n)，额外空间 O(n)</text>
</svg>
