<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 翻负数 → 处理剩余次数的奇偶</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">n ≤ 10^4，排序后一遍扫描足够</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="150" y="66" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="89.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">升序排序 nums</text>
  <path d="M 290.0 104.0 L 290.0 128.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="128" width="340" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="151.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i = 0..n-1：若 nums[i] &lt; 0 且 k &gt; 0 → 取反，k--</text>
  <path d="M 290.0 166.0 L 290.0 190.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="190" width="280" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="213.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">sum = 所有元素之和</text>
  <path d="M 290.0 228.0 L 290.0 252.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="290,252 390,278 290,304 190,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290.0" y="283.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">剩余 k 是奇数？</text>
  <path d="M 390.0 278.0 L 434.0 278.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440.0" y="282.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="440" y="258" width="126" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="503.0" y="282.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">sum −= 2·min(nums)</text>
  <path d="M 290.0 304.0 L 290.0 326.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="298.0" y="320.0" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">否（偶数）直接返回</text>
  <rect x="440" y="320" width="126" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="503.0" y="342.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 sum</text>
</svg>
