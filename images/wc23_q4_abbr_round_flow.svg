<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="404" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">算法流程：逐层 p 分桶，桶内独苗定稿，撞车的留到下一层</text>

  <!-- 初始化 -->
  <rect x="150" y="38" width="220" height="28" rx="8" fill="#f0f4ff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">初始化：全部串未定稿，层号 p ← 1</text>
  <path d="M 260 66 L 260 86" stroke="#446688" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- 层循环 -->
  <rect x="150" y="88" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">第 p 层：所有未定稿串都用同一前缀长度 p</text>
  <path d="M 260 118 L 260 138" stroke="#446688" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- 判定 A -->
  <rect x="150" y="140" width="220" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="157" text-anchor="middle" font-size="10" font-weight="bold" fill="#b27a10" filter="url(#rough2)">这个串还能缩得更短吗？</text>
  <text x="260" y="173" text-anchor="middle" font-size="9.5" fill="#b27a10" filter="url(#rough2)">p ≤ L − 2 且 len(abbr) &lt; L</text>

  <path d="M 150 161 L 128 161" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="136" y="154" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="8" y="142" width="118" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="67" y="158" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">落定为原串</text>
  <text x="67" y="172" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">res[i] = words[i]</text>

  <path d="M 260 182 L 260 202" stroke="#446688" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="272" y="196" font-size="9" fill="#2e6e2e" filter="url(#rough2)">是</text>

  <!-- 入桶 -->
  <rect x="130" y="204" width="260" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">abbr = w[0:p] + str(L−p−1) + w[L−1]</text>
  <text x="260" y="236" text-anchor="middle" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">按 abbr 丢进哈希桶（桶内即同层互撞的候选）</text>

  <path d="M 260 244 L 260 264" stroke="#446688" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- 判定 B -->
  <rect x="150" y="266" width="220" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">桶里只有它自己吗？</text>
  <text x="260" y="299" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">|bucket[abbr]| == 1 ?</text>

  <path d="M 150 287 L 128 287" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="136" y="280" text-anchor="middle" font-size="9" fill="#2e6e2e" filter="url(#rough2)">是</text>
  <rect x="8" y="268" width="118" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="67" y="284" text-anchor="middle" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">定稿 = 该缩写</text>
  <text x="67" y="298" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">这就是最短答案</text>

  <path d="M 370 287 L 392 287" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="381" y="280" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="394" y="268" width="118" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="453" y="284" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">保持未定稿</text>
  <text x="453" y="298" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">下一层 p += 1</text>

  <!-- 回边 -->
  <path d="M 453 268 L 453 103 L 374 103" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="470" y="180" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)" transform="rotate(90 470 180)">下一层</text>

  <path d="M 260 308 L 260 328" stroke="#446688" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <rect x="150" y="330" width="220" height="30" rx="8" fill="#f0f4ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="349" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">全部定稿 ⇒ 按原下标输出 res</text>

  <text x="260" y="380" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">关键不变量：未定稿串的层号恰等于轮次 ⇒ 任何一轮里的比较都发生在同一层，绝不跨层</text>
  <text x="260" y="396" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">复杂度：层数 ≤ maxL，每层 O(n·L) 建串 + 哈希 ⇒ 总计 O(n·L²)，空间 O(n·L)</text>
</svg>
