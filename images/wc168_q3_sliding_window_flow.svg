<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">定长滑窗 + 频次哈希表：一趟扫描得到答案</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">窗口长度恒为 minSize，distinct 用 26 格计数维护，进出各 O(1)</text>

  <rect x="165" y="56" width="230" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">cnt[26]=0，distinct=0，freq={}，best=0</text>

  <path d="M280,86 V100" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,102 384,136 280,170 176,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">i &lt; n ?</text>
  <text x="292" y="186" text-anchor="start" font-size="11" fill="#3d6b2f" filter="url(#rough2)">是</text>
  <text x="394" y="130" text-anchor="start" font-size="11" fill="#8c3b36" filter="url(#rough2)">否</text>

  <path d="M280,170 V188" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="132" y="190" width="296" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">右端入窗：cnt[s[i]]++，0→1 则 distinct++</text>

  <path d="M280,220 V234" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="124" y="236" width="312" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">若 i ≥ minSize：左端字符 s[i-minSize] 出窗</text>
  <text x="280" y="270" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">cnt[出窗]--，由 1 变 0 则 distinct--</text>

  <path d="M280,282 V296" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,298 412,336 280,374 148,336" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">i ≥ minSize-1</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">且 distinct ≤ maxLetters ?</text>

  <text x="134" y="328" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">是</text>
  <path d="M148,336 H121 V404" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="26" y="406" width="190" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="121" y="424" text-anchor="middle" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">freq[窗口]++</text>
  <text x="121" y="441" text-anchor="middle" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">best = max(best, 该频次)</text>

  <text x="426" y="328" text-anchor="middle" font-size="11" fill="#8c3b36" filter="url(#rough2)">否</text>
  <path d="M412,336 H446 V404" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="376" y="406" width="140" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="428" text-anchor="middle" font-size="11" fill="#8c3b36" filter="url(#rough2)">跳过：不入表</text>
  <text x="446" y="444" text-anchor="middle" font-size="10" fill="#a5675f" filter="url(#rough2)">distinct 超限</text>

  <path d="M121,450 V470" stroke="#777" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M446,450 V470 H20 V136 H174" stroke="#777" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M384,136 H528 V501 H502" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="312" y="484" width="190" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="407" y="506" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">return best</text>
</svg>
