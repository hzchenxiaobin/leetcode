<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：值域二分，找最小 x 使 count(x) ≥ k</text>
  <text x="320" y="44" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">coins = [2, 5]，k = 7：count(x) = ⌊x/2⌋ + ⌊x/5⌋ − ⌊x/10⌋ 的台阶图</text>

  <rect x="330" y="58" width="280" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="80" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">count 单调不减 ⟹ 「≥ k」前缀成立，可二分</text>

  <!-- 坐标轴 -->
  <path d="M75,325 V70" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M60,310 H618" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="85" y="62" font-size="11" fill="#666" filter="url(#rough2)">count(x)</text>
  <text x="556" y="300" font-size="11" fill="#666" filter="url(#rough2)">金额 x</text>

  <!-- 台阶折线：count 只在倍数处上升 -->
  <path d="M75,310 H149 V282 H223 V254 H260 V226 H297 V198 H371 V170 H445 V142 H519 V114 H593 V86"
        stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- 阈值线 k=7 与答案落点 -->
  <path d="M75,114 H519" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7,5" fill="none" filter="url(#rough2)"/>
  <text x="128" y="106" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">k = 7</text>
  <path d="M519,114 V306" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>
  <circle cx="519" cy="114" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="532" y="99" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = 12</text>
  <path d="M530,103 L522,109" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="487" y="162" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">count(11) = 6</text>
  <text x="536" y="136" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">count(12) = 7 ✓</text>

  <!-- 刻度 -->
  <text x="75" y="326" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="149" y="326" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="223" y="326" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="297" y="326" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="371" y="326" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">8</text>
  <text x="445" y="326" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">10</text>
  <text x="519" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">12</text>
  <text x="593" y="326" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">14</text>
  <text x="63" y="118" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">7</text>

  <!-- 结论框 -->
  <rect x="48" y="352" width="560" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="371" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">台阶只在「某枚硬币的倍数」处上升（此处为 2, 4, 5, 6, 8, 10, 12, …）</text>
  <text x="328" y="390" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⟹ 最小达标 x 本身就是可制造金额，二分返回值即答案，无需再对齐</text>

  <rect x="48" y="412" width="560" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="431" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">二分区间 [1, k·min(coins)]：min(coins) 的前 k 个倍数互不相同且 ≤ k·min(coins)</text>
  <text x="328" y="450" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">故右端必满足 count ≥ k，答案落在区间内（本例 hi = 7 × 2 = 14）</text>
</svg>
