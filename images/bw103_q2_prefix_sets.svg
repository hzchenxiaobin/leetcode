<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：前缀集合逐步扩张，计数到 2 即“转正”</text>

  <!-- 4 列：i = 0..3 -->
  <g filter="url(#rough2)" font-size="13">
    <text x="95" y="62" text-anchor="middle" fill="#666">i=0</text>
    <text x="215" y="62" text-anchor="middle" fill="#666">i=1</text>
    <text x="335" y="62" text-anchor="middle" fill="#666">i=2</text>
    <text x="455" y="62" text-anchor="middle" fill="#666">i=3</text>

    <!-- A 前缀集合 -->
    <ellipse cx="95" cy="100" rx="42" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="95" y="98" text-anchor="middle" font-size="12" fill="#2f4a66">{1}</text>
    <text x="95" y="112" text-anchor="middle" font-size="10" fill="#666">A 前缀</text>
    <ellipse cx="215" cy="100" rx="42" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="215" y="98" text-anchor="middle" font-size="12" fill="#2f4a66">{1,3}</text>
    <text x="215" y="112" text-anchor="middle" font-size="10" fill="#666">A 前缀</text>
    <ellipse cx="335" cy="100" rx="42" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="335" y="98" text-anchor="middle" font-size="12" fill="#2f4a66">{1,2,3}</text>
    <text x="335" y="112" text-anchor="middle" font-size="10" fill="#666">A 前缀</text>
    <ellipse cx="455" cy="100" rx="42" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="455" y="98" text-anchor="middle" font-size="12" fill="#2f4a66">{1,2,3,4}</text>
    <text x="455" y="112" text-anchor="middle" font-size="10" fill="#666">A 前缀</text>

    <!-- B 前缀集合 -->
    <ellipse cx="95" cy="170" rx="42" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="95" y="168" text-anchor="middle" font-size="12" fill="#2f5527">{3}</text>
    <text x="95" y="182" text-anchor="middle" font-size="10" fill="#666">B 前缀</text>
    <ellipse cx="215" cy="170" rx="42" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="215" y="168" text-anchor="middle" font-size="12" fill="#2f5527">{1,3}</text>
    <text x="215" y="182" text-anchor="middle" font-size="10" fill="#666">B 前缀</text>
    <ellipse cx="335" cy="170" rx="42" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="335" y="168" text-anchor="middle" font-size="12" fill="#2f5527">{1,2,3}</text>
    <text x="335" y="182" text-anchor="middle" font-size="10" fill="#666">B 前缀</text>
    <ellipse cx="455" cy="170" rx="42" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="455" y="168" text-anchor="middle" font-size="12" fill="#2f5527">{1,2,3,4}</text>
    <text x="455" y="182" text-anchor="middle" font-size="10" fill="#666">B 前缀</text>

    <!-- 交集计数 -->
    <rect x="65" y="216" width="60" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="95" y="235" text-anchor="middle" fill="#8c3a36" font-size="13">C=0</text>
    <rect x="185" y="216" width="60" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="215" y="235" text-anchor="middle" fill="#8c3a36" font-size="13">C=2</text>
    <rect x="305" y="216" width="60" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="335" y="235" text-anchor="middle" fill="#8c3a36" font-size="13">C=3</text>
    <rect x="425" y="216" width="60" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="455" y="235" text-anchor="middle" fill="#8c3a36" font-size="13">C=4</text>
  </g>

  <!-- 说明 -->
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="60" y="266" width="400" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="76" y="288" fill="#7a5a10">值 x 在 A、B 中各出现一次（排列），合计恰两次；</text>
    <text x="76" y="308" fill="#7a5a10">cnt[x] 自增到 2 的那一步，正是 x 首次落入两侧前缀的时刻。</text>
  </g>
</svg>
