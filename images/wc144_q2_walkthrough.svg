<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 484" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="620" height="484" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：3 条预订 → 差分 → 前缀和</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">n = 5，bookings = [[1,2,10], [2,3,20], [2,5,25]]</text>

  <text x="44" y="76" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 每条预订拆成两个事件</text>
  <text x="56" y="98" font-size="10" fill="#555" filter="url(#rough2)">[1,2,10]   diff[1] += 10 ,  diff[3] -= 10</text>
  <text x="56" y="118" font-size="10" fill="#555" filter="url(#rough2)">[2,3,20]   diff[2] += 20 ,  diff[4] -= 20</text>
  <text x="56" y="138" font-size="10" fill="#555" filter="url(#rough2)">[2,5,25]   diff[2] += 25 ,  diff[6] -= 25</text>

  <text x="44" y="170" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 叠加后的差分数组（6 = n+1 那格也记了账）</text>

  <rect x="60" y="180" width="52" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="86" y="196" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">diff[1]</text>
  <text x="86" y="214" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">10</text>

  <rect x="120" y="180" width="52" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="196" text-anchor="middle" font-size="9" fill="#5a8a48" filter="url(#rough2)">diff[2]</text>
  <text x="146" y="214" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">45</text>

  <rect x="180" y="180" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="206" y="196" text-anchor="middle" font-size="9" fill="#a86058" filter="url(#rough2)">diff[3]</text>
  <text x="206" y="214" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">-10</text>

  <rect x="240" y="180" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="266" y="196" text-anchor="middle" font-size="9" fill="#a86058" filter="url(#rough2)">diff[4]</text>
  <text x="266" y="214" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">-20</text>

  <rect x="300" y="180" width="52" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="326" y="196" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">diff[5]</text>
  <text x="326" y="214" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>

  <rect x="360" y="180" width="52" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="386" y="196" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">diff[6]</text>
  <text x="386" y="214" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">-25</text>

  <text x="424" y="200" font-size="9" fill="#888" filter="url(#rough2)">+20 与 +25 都在</text>
  <text x="424" y="216" font-size="9" fill="#888" filter="url(#rough2)">diff[2] 叠加成 45</text>

  <text x="60" y="240" font-size="9.5" fill="#888" filter="url(#rough2)">diff[6] 是「第 5 个航班之后撤销 +25」，只为前缀和收尾服务，不进答案</text>

  <text x="44" y="268" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">③ 前缀和一趟扫出答案</text>

  <rect x="60" y="276" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="295" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i</text>
  <text x="190" y="295" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">diff[i]</text>
  <text x="325" y="295" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">cur = 累加值</text>
  <text x="480" y="295" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">ans[i-1]</text>

  <rect x="60" y="304" width="500" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="95" y="323" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="190" y="323" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">+10</text>
  <text x="325" y="323" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0 + 10 = 10</text>
  <text x="480" y="323" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">10</text>

  <rect x="60" y="332" width="500" height="28" fill="#f7fbf8" stroke="#ccc" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="95" y="351" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="190" y="351" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">+45</text>
  <text x="325" y="351" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">10 + 45 = 55</text>
  <text x="480" y="351" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">55</text>

  <rect x="60" y="360" width="500" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="95" y="379" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="190" y="379" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">-10</text>
  <text x="325" y="379" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">55 - 10 = 45</text>
  <text x="480" y="379" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">45</text>

  <rect x="60" y="388" width="500" height="28" fill="#f7fbf8" stroke="#ccc" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="95" y="407" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="190" y="407" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">-20</text>
  <text x="325" y="407" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">45 - 20 = 25</text>
  <text x="480" y="407" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">25</text>

  <rect x="60" y="416" width="500" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="95" y="435" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="190" y="435" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="325" y="435" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">25 + 0 = 25</text>
  <text x="480" y="435" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">25</text>

  <path d="M 130 282 L 130 444" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 250 282 L 250 444" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 400 282 L 400 444" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="310" y="466" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">答案 [10, 55, 45, 25, 25]，与官方输出一致</text>
</svg>
