<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 392" width="620" height="392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="392" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">后车更快就会追上并「粘」成车队，车队速度 = 队内最慢车</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">target = 12；每辆车的自由到达时间 t = (target − position) / speed</text>
  <line x1="70" y1="210" x2="570" y2="210" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="564" y="236" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">target = 12</text>
  <path d="M 570 120 L 570 206" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="469.7" y="164" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486.7" y="183.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">10</text>
  <text x="486.7" y="156" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">v=2</text>
  <text x="486.7" y="228" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=1</text>
  <rect x="386.3" y="164" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="403.3" y="183.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">8</text>
  <text x="403.3" y="156" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">v=4</text>
  <text x="403.3" y="228" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=1</text>
  <rect x="261.3" y="164" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278.3" y="183.1" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">5</text>
  <text x="278.3" y="156" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">v=1</text>
  <text x="278.3" y="228" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=7</text>
  <rect x="178" y="164" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="183.1" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">3</text>
  <text x="195" y="156" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">v=3</text>
  <text x="195" y="228" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=7</text>
  <rect x="53" y="164" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="183.1" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">0</text>
  <text x="70" y="156" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">v=1</text>
  <text x="70" y="228" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=12</text>
  <path d="M 466.7 300 L 466.7 312 L 423.3 312 L 423.3 300" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="445" y="330" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">车队 ①（t = 1）</text>
  <path d="M 258.3 300 L 258.3 312 L 215 312 L 215 300" stroke="#446688" stroke-width="1.6" fill="none" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="236.7" y="330" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">车队 ②（t = 7）</text>
  <text x="70" y="330" text-anchor="start" font-size="10.5" fill="#c08a20" font-weight="bold" filter="url(#rough2)">车队 ③（t = 12）</text>
  <rect x="40" y="60" width="400" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="78" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">10 号（v=2）与 8 号（v=4）同时到达终点 → 合并；</text>
  <text x="50" y="92.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">3 号虽然更快，但被 5 号挡住，只能按 v=1 走 → 合并。</text>
  <rect x="470" y="60" width="126" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="533" y="86.4" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">车队数</text>
  <text x="533" y="103.7" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">= 3</text>
</svg>
