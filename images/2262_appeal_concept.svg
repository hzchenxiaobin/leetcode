  <text x="94" y="174" text-anchor="end" font-size="11" font-weight="bold" fill="#a07820" filter="url(#rough2)">0</text>
  <text x="94" y="212" text-anchor="end" font-size="11" font-weight="bold" fill="#a07820" filter="url(#rough2)">1</text>
  <text x="94" y="250" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <text x="94" y="288" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <text x="94" y="326" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">4</text>

  <rect x="105" y="150" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="143" y="150" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
