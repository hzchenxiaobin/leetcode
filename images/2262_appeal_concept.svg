  <rect x="219" y="54" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="257" y="54" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="79" text-anchor="middle" font-size="18" fill="#446688" filter="url(#rough2)">a</text>
  <text x="162" y="79" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <text x="200" y="79" text-anchor="middle" font-size="18" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <text x="238" y="79" text-anchor="middle" font-size="18" fill="#b07800" filter="url(#rough2)">c</text>
  <text x="276" y="79" text-anchor="middle" font-size="18" fill="#446688" filter="url(#rough2)">a</text>
  <text x="124" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="162" y="106" text-anchor="middle" font-size="10" font-weight="bold" fill="#a07820" filter="url(#rough2)">1</text>
  <text x="200" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="238" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="276" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="162" y="124" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">↑ i = 1 的 'b'</text>

  <text x="94" y="144" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">j \ k</text>
  <text x="124" y="144" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <text x="162" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#a07820" filter="url(#rough2)">1</text>
  <text x="200" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#a07820" filter="url(#rough2)">2</text>
