  <rect x="257" y="150" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <rect x="105" y="188" width="38" height="38" rx="4" fill="#f0f0f0" stroke="#d8d8d8" filter="url(#rough2)"/>
  <rect x="143" y="188" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="181" y="188" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="219" y="188" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="257" y="188" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <rect x="105" y="226" width="38" height="38" rx="4" fill="#f0f0f0" stroke="#d8d8d8" filter="url(#rough2)"/>
  <rect x="143" y="226" width="38" height="38" rx="4" fill="#f0f0f0" stroke="#d8d8d8" filter="url(#rough2)"/>
  <rect x="181" y="226" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="219" y="226" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="257" y="226" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="105" y="264" width="38" height="38" rx="4" fill="#f0f0f0" stroke="#d8d8d8" filter="url(#rough2)"/>
  <rect x="143" y="264" width="38" height="38" rx="4" fill="#f0f0f0" stroke="#d8d8d8" filter="url(#rough2)"/>
  <rect x="181" y="264" width="38" height="38" rx="4" fill="#f0f0f0" stroke="#d8d8d8" filter="url(#rough2)"/>
  <rect x="219" y="264" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="257" y="264" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="105" y="302" width="38" height="38" rx="4" fill="#f0f0f0" stroke="#d8d8d8" filter="url(#rough2)"/>
  <rect x="143" y="302" width="38" height="38" rx="4" fill="#f0f0f0" stroke="#d8d8d8" filter="url(#rough2)"/>
  <rect x="181" y="302" width="38" height="38" rx="4" fill="#f0f0f0" stroke="#d8d8d8" filter="url(#rough2)"/>
  <rect x="219" y="302" width="38" height="38" rx="4" fill="#f0f0f0" stroke="#d8d8d8" filter="url(#rough2)"/>
  <rect x="257" y="302" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="162" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">+1</text>
  <text x="200" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">+1</text>
  <text x="238" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">+1</text>
  <text x="276" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">+1</text>
  <text x="162" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">+1</text>
  <text x="200" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">+1</text>
  <text x="238" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">+1</text>
  <text x="276" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">+1</text>

  <rect x="318" y="158" width="184" height="158" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="184" font-size="12" fill="#333" filter="url(#rough2)">焦点：i = 1 的 'b'</text>
  <text x="330" y="206" font-size="12" fill="#333" filter="url(#rough2)">last = −1（左侧无 b）</text>
  <text x="330" y="228" font-size="12" fill="#333" filter="url(#rough2)">左端 j ∈ {0, 1}，共 2 个</text>
  <text x="330" y="250" font-size="12" fill="#333" filter="url(#rough2)">右端 k ∈ {1, 2, 3, 4}，共 4 个</text>
  <path d="M 330 260 L 490 260" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="410" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07820" filter="url(#rough2)">贡献 = 2 × 4 = 8</text>

  <text x="260" y="374" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">每个子串的引力 = 其中各字符「首次出现位置」的个数</text>
  <text x="260" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">总引力 = Σ (i − last[s[i]]) × (n − i)</text>
  <text x="260" y="418" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（0 ≤ i &lt; n，last 为 s[i] 左侧最近同字符下标，无则 −1）</text>
</svg>
