<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：按括号对的层数奇偶分组</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888">一对括号层数相同 ⇒ 必然同进 A 或同进 B，A、B 都是 VPS</text>

  <text x="86" y="100" text-anchor="end" font-size="10" fill="#777">seq</text>
  <text x="86" y="140" text-anchor="end" font-size="10" fill="#777">层数</text>
  <text x="86" y="172" text-anchor="end" font-size="10" fill="#777">分组</text>

  <g filter="url(#rough2)">
    <rect x="96" y="76" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="118" y="100" text-anchor="middle" font-size="17" fill="#33475f">(</text>
    <rect x="148" y="76" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="170" y="100" text-anchor="middle" font-size="17" fill="#33502a">(</text>
    <rect x="200" y="76" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="222" y="100" text-anchor="middle" font-size="17" fill="#33502a">)</text>
    <rect x="252" y="76" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="274" y="100" text-anchor="middle" font-size="17" fill="#33502a">(</text>
    <rect x="304" y="76" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="326" y="100" text-anchor="middle" font-size="17" fill="#33502a">)</text>
    <rect x="356" y="76" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="378" y="100" text-anchor="middle" font-size="17" fill="#33475f">)</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <text x="118" y="126">i=0</text><text x="170" y="126">i=1</text><text x="222" y="126">i=2</text>
    <text x="274" y="126">i=3</text><text x="326" y="126">i=4</text><text x="378" y="126">i=5</text>
  </g>

  <g filter="url(#rough2)" font-size="12" fill="#444" text-anchor="middle">
    <text x="118" y="144">1</text><text x="170" y="144">2</text><text x="222" y="144">2</text>
    <text x="274" y="144">2</text><text x="326" y="144">2</text><text x="378" y="144">1</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="96" y="152" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="118" y="172" fill="#33475f">A / 0</text>
    <rect x="148" y="152" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="248" y="172" fill="#33502a">B / 1（第 2 层，共 4 个字符）</text>
    <rect x="356" y="152" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="378" y="172" fill="#33475f">A / 0</text>
  </g>

  <text x="280" y="200" text-anchor="middle" font-size="10" fill="#555">结果 A = "()"（深度 1），B = "()()"（深度 1），max = 1 = ⌈2/2⌉</text>

  <rect x="60" y="212" width="440" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="76" y="234" font-size="11" fill="#8a6a20" font-weight="bold">下界：任何划分都有 max(depth) ≥ ⌈d/2⌉（d 为整串深度）</text>
  <text x="76" y="254" font-size="10" fill="#555">取一条最深的嵌套链，它有 d 对两两嵌套的括号，分给两组后</text>
  <text x="76" y="270" font-size="10" fill="#555">鸽巢原理保证某组拿到 ≥ ⌈d/2⌉ 对，且它们在子序列中仍嵌套。</text>

  <rect x="60" y="298" width="440" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="76" y="320" font-size="11" fill="#3a5a30" font-weight="bold">本构造恰好达到下界</text>
  <text x="76" y="340" font-size="10" fill="#555">A 内层数落在 1,3,5,… ⇒ depth(A) ≤ ⌈d/2⌉；B 落在 2,4,6,… ⇒ depth(B) ≤ ⌊d/2⌋，</text>
  <text x="76" y="354" font-size="10" fill="#555">故 max = ⌈d/2⌉，与下界相等，方案最优。</text>

  <text x="280" y="384" text-anchor="middle" font-size="9.5" fill="#999">蓝色 = 奇数层 → A，绿色 = 偶数层 → B</text>
</svg>
