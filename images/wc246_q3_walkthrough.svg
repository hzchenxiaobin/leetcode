<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：grid2 的 5 座岛逐个核对 → 3 座子岛屿</text>
  <path d="M 120 42 Q 340 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- axis labels -->
  <g font-family="monospace" font-size="9" fill="#999" text-anchor="middle">
    <text x="90" y="76">0</text><text x="130" y="76">1</text><text x="170" y="76">2</text><text x="210" y="76">3</text><text x="250" y="76">4</text>
  </g>
  <g font-family="monospace" font-size="9" fill="#999" text-anchor="end">
    <text x="60" y="104">0</text><text x="60" y="144">1</text><text x="60" y="184">2</text><text x="60" y="224">3</text><text x="60" y="264">4</text>
  </g>

  <!-- grid2 cells -->
  <g filter="url(#sk)">
    <!-- row 0 -->
    <rect x="70" y="80" width="40" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="110" y="80" width="40" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="150" y="80" width="40" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="190" y="80" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="230" y="80" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <!-- row 1 -->
    <rect x="70" y="120" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="110" y="120" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="150" y="120" width="40" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="190" y="120" width="40" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="230" y="120" width="40" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <!-- row 2 -->
    <rect x="70" y="160" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="110" y="160" width="40" height="40" fill="#fdecea" stroke="#b85450" stroke-width="2.4"/>
    <rect x="150" y="160" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="190" y="160" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="230" y="160" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <!-- row 3 -->
    <rect x="70" y="200" width="40" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="110" y="200" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="150" y="200" width="40" height="40" fill="#fdecea" stroke="#b85450" stroke-width="2.4"/>
    <rect x="190" y="200" width="40" height="40" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <rect x="230" y="200" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <!-- row 4 -->
    <rect x="70" y="240" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="110" y="240" width="40" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="150" y="240" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="190" y="240" width="40" height="40" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <rect x="230" y="240" width="40" height="40" fill="#f2f2f0" stroke="#bbb" stroke-width="1.2"/>
  </g>

  <!-- mismatch corner marks -->
  <text x="146" y="171" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a">×</text>
  <text x="186" y="211" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a">×</text>

  <!-- island badges -->
  <g filter="url(#sk)">
    <circle cx="90" cy="100" r="11" fill="#fff" stroke="#4a8e4a" stroke-width="1.8"/>
    <circle cx="130" cy="180" r="11" fill="#fff" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="90" cy="220" r="11" fill="#fff" stroke="#4a8e4a" stroke-width="1.8"/>
    <circle cx="170" cy="220" r="11" fill="#fff" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="130" cy="260" r="11" fill="#fff" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">
    <text x="90" y="104">1</text>
    <text x="130" y="184">2</text>
    <text x="90" y="224">3</text>
    <text x="170" y="224">4</text>
    <text x="130" y="264">5</text>
  </g>

  <!-- ledger rows -->
  <g filter="url(#sk)">
    <rect x="330" y="84" width="310" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="330" y="134" width="310" height="44" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
    <rect x="330" y="184" width="310" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="330" y="234" width="310" height="44" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
    <rect x="330" y="284" width="310" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <circle cx="352" cy="106" r="11" fill="#fff" stroke="#4a8e4a" stroke-width="1.8"/>
    <circle cx="352" cy="156" r="11" fill="#fff" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="352" cy="206" r="11" fill="#fff" stroke="#4a8e4a" stroke-width="1.8"/>
    <circle cx="352" cy="256" r="11" fill="#fff" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="352" cy="306" r="11" fill="#fff" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">
    <text x="352" y="110">1</text>
    <text x="352" y="160">2</text>
    <text x="352" y="210">3</text>
    <text x="352" y="260">4</text>
    <text x="352" y="310">5</text>
  </g>
  <text x="374" y="103" font-size="11" fill="#2b2b2b">6 格连成一片（行 0–1）</text>
  <text x="374" y="119" font-size="9.5" fill="#666" font-family="monospace">每格对照 grid1 均为 1</text>
  <text x="626" y="111" text-anchor="end" font-size="13" font-weight="bold" fill="#2e6e2e">✓ +1</text>

  <text x="374" y="153" font-size="11" fill="#2b2b2b">单格岛 (2,1)</text>
  <text x="374" y="169" font-size="9.5" fill="#666" font-family="monospace">grid1[2][1] = 0 → 失配</text>
  <text x="626" y="161" text-anchor="end" font-size="13" font-weight="bold" fill="#b03a3a">✗ +0</text>

  <text x="374" y="203" font-size="11" fill="#2b2b2b">单格岛 (3,0)</text>
  <text x="374" y="219" font-size="9.5" fill="#666" font-family="monospace">grid1[3][0] = 1</text>
  <text x="626" y="211" text-anchor="end" font-size="13" font-weight="bold" fill="#2e6e2e">✓ +1</text>

  <text x="374" y="253" font-size="11" fill="#2b2b2b">3 格：(3,2)(3,3)(4,3)</text>
  <text x="374" y="269" font-size="9.5" fill="#666" font-family="monospace">grid1[3][2] = 0 → 一损俱损</text>
  <text x="626" y="261" text-anchor="end" font-size="13" font-weight="bold" fill="#b03a3a">✗ +0</text>

  <text x="374" y="303" font-size="11" fill="#2b2b2b">单格岛 (4,1)</text>
  <text x="374" y="319" font-size="9.5" fill="#666" font-family="monospace">grid1[4][1] = 1</text>
  <text x="626" y="311" text-anchor="end" font-size="13" font-weight="bold" fill="#2e6e2e">✓ +1</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="70" y="346" width="250" height="64" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="195" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">答案 count = 3</text>
  <text x="195" y="394" text-anchor="middle" font-size="11" fill="#444">= ①+③+⑤ 三座子岛屿</text>

  <g filter="url(#sk)">
    <rect x="350" y="346" width="290" height="64" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="495" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">④ 的 (3,3)(4,3) 虽各自对上，</text>
  <text x="495" y="392" text-anchor="middle" font-size="11" fill="#b03a3a">但判定单位是整座岛 → 仍不计入</text>
</svg>
