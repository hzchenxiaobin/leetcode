<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">判定条件：dx² + dy² ≤ r²，全程整数、无开方</text>

  <!-- 圆 -->
  <circle cx="250" cy="210" r="105" fill="#e8f0fe" fill-opacity="0.45" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <!-- 半径标注 -->
  <line x1="250" y1="210" x2="337" y2="153" stroke="#446688" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="308" y="196" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">半径 r</text>

  <!-- 圆心 O -->
  <circle cx="250" cy="210" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="222" y="232" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">O (xj, yj)</text>

  <!-- 点 P -->
  <circle cx="310" cy="150" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="322" y="142" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">P (xi, yi)</text>

  <!-- 直角三角形：dx / dy -->
  <line x1="250" y1="210" x2="310" y2="210" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="310" y1="210" x2="310" y2="150" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="303" y="203" width="8" height="8" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="228" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">dx</text>
  <text x="318" y="184" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">dy</text>
  <line x1="250" y1="210" x2="310" y2="150" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="252" y="164" font-size="12" fill="#b85450" filter="url(#rough2)">斜边 = 距离</text>

  <!-- 边界点示例 -->
  <circle cx="355" cy="210" r="6" fill="#d6a040" filter="url(#rough2)"/>
  <text x="366" y="228" font-size="12" fill="#7a5c1e" filter="url(#rough2)">边界点也算 ✓（取 ≤）</text>

  <!-- 公式面板 -->
  <rect x="410" y="70" width="130" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22" text-anchor="middle">
    <text x="475" y="94" font-weight="bold">判定：</text>
    <text x="475" y="116">dx² + dy² ≤ r²</text>
    <text x="475" y="140">（均为非负，平方</text>
    <text x="475" y="158">不改变大小关系）</text>
  </g>

  <!-- 反例警示 -->
  <rect x="40" y="300" width="480" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="323" text-anchor="middle" font-size="13" fill="#8a3a34" filter="url(#rough2)">✗ 错误写法：sqrt(dx²+dy²) ≤ r（浮点误差会让边界点翻转）</text>

  <rect x="40" y="344" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">坐标 ≤ 500 时 dx²+dy² ≤ 5×10⁵，int 即可；复杂度 O(n·q) = 2.5×10⁵ 次整数运算</text>
</svg>
