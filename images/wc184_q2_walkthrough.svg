  <text x="316" y="432" font-size="10.5" fill="#446688">P = [1,2,3,4,5]</text>

  <!-- summary box -->
  <rect x="60" y="442" width="560" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="465" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">每步按坐标升序读出占据标记 ⇒ 恰为真实排列 P（与暴力模拟逐位一致）</text>
  <text x="340" y="485" text-anchor="middle" font-size="11" fill="#555">最终 ans = [2,1,2,1] ✓　末态占据位 {1,2,4,8,9} 升序读出 [1,2,3,4,5] = P ✓</text>
</svg>
