<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 515" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="515" fill="#fafafa"/>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">示例演算：queries = [3,1,2,1]，m = 5 → ans = [2,1,2,1]</text>
  <text x="340" y="44" text-anchor="middle" font-size="10.5" fill="#888">n = 4，数值 v 初始占 n+v；橙格 = 本次查询的 v，× = 已清空旧位，· = 预留空位，绿格计入前缀</text>

  <!-- ===================== row 0: i=0, v=3 ===================== -->
  <text x="44" y="88" font-size="10.5" font-weight="bold" fill="#666">i=0</text>
  <text x="44" y="106" font-size="13" font-weight="bold" fill="#d6a040">v=3</text>
  <path d="M 100 77 L 100 72 L 422 72 L 422 77" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="261" y="67" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">query(7) = 3</text>
  <g>
    <rect x="100" y="78" width="46" height="34" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="146" y="78" width="46" height="34" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="192" y="78" width="46" height="34" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="238" y="78" width="46" height="34" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="284" y="78" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="330" y="78" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="376" y="78" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <rect x="422" y="78" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="468" y="78" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  </g>
  <g text-anchor="middle">
    <text x="123" y="100" font-size="12" fill="#d6a040">·</text>
    <text x="169" y="100" font-size="12" fill="#d6a040">·</text>
    <text x="215" y="100" font-size="12" fill="#d6a040">·</text>
    <text x="261" y="100" font-size="12" fill="#d6a040">·</text>
    <text x="307" y="101" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
    <text x="353" y="101" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="399" y="101" font-size="13.5" font-weight="bold" fill="#b07818">3</text>
    <text x="445" y="101" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="491" y="101" font-size="13" font-weight="bold" fill="#2e6e2e">5</text>
  </g>
  <g font-size="8.5" fill="#999" text-anchor="middle">
    <text x="123" y="126">1</text><text x="169" y="126">2</text><text x="215" y="126">3</text><text x="261" y="126">4</text>
    <text x="307" y="126">5</text><text x="353" y="126">6</text><text x="399" y="126">7</text><text x="445" y="126">8</text><text x="491" y="126">9</text>
  </g>
  <text x="530" y="100" font-size="12.5" font-weight="bold" fill="#b85450">ans = 3 − 1 = 2</text>
  <text x="100" y="144" font-size="10.5" fill="#999">清位 7 → 置位 4（落点 n−i=4）</text>
  <text x="316" y="144" font-size="10.5" fill="#446688">P = [3,1,2,4,5]</text>

  <!-- ===================== row 1: i=1, v=1 ===================== -->
  <text x="44" y="184" font-size="10.5" font-weight="bold" fill="#666">i=1</text>
  <text x="44" y="202" font-size="13" font-weight="bold" fill="#d6a040">v=1</text>
  <path d="M 100 173 L 100 168 L 330 168 L 330 173" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="215" y="163" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">query(5) = 2</text>
  <g>
    <rect x="100" y="174" width="46" height="34" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="146" y="174" width="46" height="34" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="192" y="174" width="46" height="34" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="238" y="174" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="284" y="174" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <rect x="330" y="174" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="376" y="174" width="46" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="422" y="174" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="468" y="174" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  </g>
  <g text-anchor="middle">
    <text x="123" y="196" font-size="12" fill="#d6a040">·</text>
    <text x="169" y="196" font-size="12" fill="#d6a040">·</text>
    <text x="215" y="196" font-size="12" fill="#d6a040">·</text>
    <text x="261" y="197" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="307" y="197" font-size="13.5" font-weight="bold" fill="#b07818">1</text>
    <text x="353" y="197" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="399" y="197" font-size="13" font-weight="bold" fill="#b85450">×</text>
    <text x="445" y="197" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="491" y="197" font-size="13" font-weight="bold" fill="#2e6e2e">5</text>
  </g>
  <g font-size="8.5" fill="#999" text-anchor="middle">
    <text x="123" y="222">1</text><text x="169" y="222">2</text><text x="215" y="222">3</text><text x="261" y="222">4</text>
    <text x="307" y="222">5</text><text x="353" y="222">6</text><text x="399" y="222">7</text><text x="445" y="222">8</text><text x="491" y="222">9</text>
  </g>
  <text x="530" y="196" font-size="12.5" font-weight="bold" fill="#b85450">ans = 2 − 1 = 1</text>
  <text x="100" y="240" font-size="10.5" fill="#999">清位 5 → 置位 3（落点 n−i=3）</text>
  <text x="316" y="240" font-size="10.5" fill="#446688">P = [1,3,2,4,5]</text>

  <!-- ===================== row 2: i=2, v=2 ===================== -->
  <text x="44" y="280" font-size="10.5" font-weight="bold" fill="#666">i=2</text>
  <text x="44" y="298" font-size="13" font-weight="bold" fill="#d6a040">v=2</text>
  <path d="M 100 269 L 100 264 L 376 264 L 376 269" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="238" y="259" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">query(6) = 3</text>
  <g>
    <rect x="100" y="270" width="46" height="34" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="146" y="270" width="46" height="34" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="192" y="270" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="238" y="270" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="284" y="270" width="46" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="330" y="270" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <rect x="376" y="270" width="46" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="422" y="270" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="468" y="270" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  </g>
  <g text-anchor="middle">
    <text x="123" y="292" font-size="12" fill="#d6a040">·</text>
    <text x="169" y="292" font-size="12" fill="#d6a040">·</text>
    <text x="215" y="293" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
    <text x="261" y="293" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="307" y="293" font-size="13" font-weight="bold" fill="#b85450">×</text>
    <text x="353" y="293" font-size="13.5" font-weight="bold" fill="#b07818">2</text>
    <text x="399" y="293" font-size="13" font-weight="bold" fill="#b85450">×</text>
    <text x="445" y="293" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="491" y="293" font-size="13" font-weight="bold" fill="#2e6e2e">5</text>
  </g>
  <g font-size="8.5" fill="#999" text-anchor="middle">
    <text x="123" y="318">1</text><text x="169" y="318">2</text><text x="215" y="318">3</text><text x="261" y="318">4</text>
    <text x="307" y="318">5</text><text x="353" y="318">6</text><text x="399" y="318">7</text><text x="445" y="318">8</text><text x="491" y="318">9</text>
  </g>
  <text x="530" y="292" font-size="12.5" font-weight="bold" fill="#b85450">ans = 3 − 1 = 2</text>
  <text x="100" y="336" font-size="10.5" fill="#999">清位 6 → 置位 2（落点 n−i=2）</text>
  <text x="316" y="336" font-size="10.5" fill="#446688">P = [2,1,3,4,5]</text>

  <!-- ===================== row 3: i=3, v=1 ===================== -->
  <text x="44" y="376" font-size="10.5" font-weight="bold" fill="#666">i=3</text>
  <text x="44" y="394" font-size="13" font-weight="bold" fill="#d6a040">v=1</text>
  <path d="M 100 365 L 100 360 L 238 360 L 238 365" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="169" y="355" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">query(3) = 2</text>
  <g>
    <rect x="100" y="366" width="46" height="34" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="146" y="366" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="192" y="366" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <rect x="238" y="366" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="284" y="366" width="46" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="330" y="366" width="46" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="376" y="366" width="46" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <rect x="422" y="366" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="468" y="366" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  </g>
  <g text-anchor="middle">
    <text x="123" y="388" font-size="12" fill="#d6a040">·</text>
    <text x="169" y="389" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="215" y="389" font-size="13.5" font-weight="bold" fill="#b07818">1</text>
    <text x="261" y="389" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="307" y="389" font-size="13" font-weight="bold" fill="#b85450">×</text>
    <text x="353" y="389" font-size="13" font-weight="bold" fill="#b85450">×</text>
    <text x="399" y="389" font-size="13" font-weight="bold" fill="#b85450">×</text>
    <text x="445" y="389" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="491" y="389" font-size="13" font-weight="bold" fill="#2e6e2e">5</text>
  </g>
