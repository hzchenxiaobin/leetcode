    <text x="123" y="414">1</text><text x="169" y="414">2</text><text x="215" y="414">3</text><text x="261" y="414">4</text>
    <text x="307" y="414">5</text><text x="353" y="414">6</text><text x="399" y="414">7</text><text x="445" y="414">8</text><text x="491" y="414">9</text>
