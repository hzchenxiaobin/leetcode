<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：排序定名次，下标负责回填</text>
  <path d="M 120 40 Q 360 50 600 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="14" y="82" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#sk)">score</text>
  <text x="14" y="98" font-size="10" fill="#7a7a7a" filter="url(#sk)">原数组</text>

  <g filter="url(#sk)">
    <rect x="86" y="64" width="112" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="212" y="64" width="112" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="338" y="64" width="112" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="464" y="64" width="112" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="590" y="64" width="112" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="142" y="94" text-anchor="middle" font-size="14" fill="#2b4a6e">10</text>
  <text x="268" y="94" text-anchor="middle" font-size="14" fill="#2b4a6e">3</text>
  <text x="394" y="94" text-anchor="middle" font-size="14" fill="#2b4a6e">8</text>
  <text x="520" y="94" text-anchor="middle" font-size="14" fill="#2b4a6e">9</text>
  <text x="646" y="94" text-anchor="middle" font-size="14" fill="#2b4a6e">4</text>
  <text x="142" y="126" text-anchor="middle" font-size="10" fill="#8a8a8a">i=0</text>
  <text x="268" y="126" text-anchor="middle" font-size="10" fill="#8a8a8a">i=1</text>
  <text x="394" y="126" text-anchor="middle" font-size="10" fill="#8a8a8a">i=2</text>
  <text x="520" y="126" text-anchor="middle" font-size="10" fill="#8a8a8a">i=3</text>
  <text x="646" y="126" text-anchor="middle" font-size="10" fill="#8a8a8a">i=4</text>

  <path d="M 360 134 L 360 166" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="372" y="154" font-size="11" fill="#446688" filter="url(#sk)">按得分降序排序</text>

  <text x="14" y="196" font-size="11.5" fill="#8a6415" font-weight="bold" filter="url(#sk)">降序</text>
  <text x="14" y="212" font-size="10" fill="#7a7a7a" filter="url(#sk)">(得分, 下标)</text>

  <g filter="url(#sk)">
    <rect x="86" y="176" width="112" height="48" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="212" y="176" width="112" height="48" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="338" y="176" width="112" height="48" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="464" y="176" width="112" height="48" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="590" y="176" width="112" height="48" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="142" y="198" text-anchor="middle" font-size="13" fill="#8a6415">10 · i0</text>
  <text x="268" y="198" text-anchor="middle" font-size="13" fill="#8a6415">9 · i3</text>
  <text x="394" y="198" text-anchor="middle" font-size="13" fill="#8a6415">8 · i2</text>
  <text x="520" y="198" text-anchor="middle" font-size="13" fill="#8a6415">4 · i4</text>
  <text x="646" y="198" text-anchor="middle" font-size="13" fill="#8a6415">3 · i1</text>
  <text x="142" y="216" text-anchor="middle" font-size="10" fill="#a8873c">rank 1</text>
  <text x="268" y="216" text-anchor="middle" font-size="10" fill="#a8873c">rank 2</text>
  <text x="394" y="216" text-anchor="middle" font-size="10" fill="#a8873c">rank 3</text>
  <text x="520" y="216" text-anchor="middle" font-size="10" fill="#a8873c">rank 4</text>
  <text x="646" y="216" text-anchor="middle" font-size="10" fill="#a8873c">rank 5</text>

  <path d="M 360 226 L 360 254" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="372" y="245" font-size="11" fill="#8f3830" filter="url(#sk)">rank ≤ 3 发奖牌，否则写数字</text>

  <text x="14" y="290" font-size="11.5" fill="#2e5a24" font-weight="bold" filter="url(#sk)">answer</text>
  <text x="14" y="306" font-size="10" fill="#7a7a7a" filter="url(#sk)">回填原下标</text>

  <g filter="url(#sk)">
    <rect x="86" y="266" width="112" height="52" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="212" y="266" width="112" height="52" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="338" y="266" width="112" height="52" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="464" y="266" width="112" height="52" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="590" y="266" width="112" height="52" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="142" y="290" text-anchor="middle" font-size="10.5" fill="#2e5a24">Gold</text>
  <text x="142" y="305" text-anchor="middle" font-size="10" fill="#2e5a24">Medal</text>
  <text x="268" y="290" text-anchor="middle" font-size="10.5" fill="#2e5a24">Silver</text>
  <text x="268" y="305" text-anchor="middle" font-size="10" fill="#2e5a24">Medal</text>
  <text x="394" y="290" text-anchor="middle" font-size="10.5" fill="#2e5a24">Bronze</text>
  <text x="394" y="305" text-anchor="middle" font-size="10" fill="#2e5a24">Medal</text>
  <text x="520" y="297" text-anchor="middle" font-size="14" fill="#2e5a24">"4"</text>
  <text x="646" y="297" text-anchor="middle" font-size="14" fill="#2e5a24">"5"</text>

  <g filter="url(#sk)">
    <rect x="86" y="340" width="616" height="72" rx="9" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5,4"/>
  </g>
  <text x="104" y="364" font-size="11.5" fill="#4a5a6e">· 名次 = 降序排列中的位置（从 1 开始），互不相同 → 名次也互不相同</text>
  <text x="104" y="386" font-size="11.5" fill="#4a5a6e">· 排序带走下标，就能把「名次」写回原来的位置 ans[idx] = 名次</text>
  <text x="104" y="405" font-size="11.5" fill="#4a5a6e">· 时间 O(n log n) 排序主导，空间 O(n) 存下标与答案</text>
</svg>
