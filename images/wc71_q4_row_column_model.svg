<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：棋盘 = 行模式 ⊕ 列模式</text>
  <text x="330" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">交换只重排位置，两类行 / 列的模式集合完全不变</text>

  <text x="70" y="76" font-size="10" fill="#666" filter="url(#rough2)">C_j</text>
  <text x="26" y="106" font-size="10" fill="#666" filter="url(#rough2)">R_i</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#3a5a30" font-weight="bold">
    <rect x="70" y="84" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="112" y="84" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="154" y="84" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="196" y="84" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="91" y="101">0</text>
    <text x="133" y="101">1</text>
    <text x="175" y="101">1</text>
    <text x="217" y="101">0</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#3a5a30" font-weight="bold">
    <rect x="26" y="112" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="26" y="148" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="26" y="184" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="26" y="220" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="44" y="135">0</text>
    <text x="44" y="171">0</text>
    <text x="44" y="207">1</text>
    <text x="44" y="243">1</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="70" y="112" width="42" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="112" y="112" width="42" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="112" width="42" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="112" width="42" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="70" y="148" width="42" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="112" y="148" width="42" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="148" width="42" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="148" width="42" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="70" y="184" width="42" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="112" y="184" width="42" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="184" width="42" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="184" width="42" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="70" y="220" width="42" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="112" y="220" width="42" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="220" width="42" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="220" width="42" height="36" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="91" y="135" fill="#3a4a66">0</text>
    <text x="133" y="135" fill="#ffffff">1</text>
    <text x="175" y="135" fill="#ffffff">1</text>
    <text x="217" y="135" fill="#3a4a66">0</text>
    <text x="91" y="171" fill="#3a4a66">0</text>
    <text x="133" y="171" fill="#ffffff">1</text>
    <text x="175" y="171" fill="#ffffff">1</text>
    <text x="217" y="171" fill="#3a4a66">0</text>
    <text x="91" y="207" fill="#ffffff">1</text>
    <text x="133" y="207" fill="#3a4a66">0</text>
    <text x="175" y="207" fill="#3a4a66">0</text>
    <text x="217" y="207" fill="#ffffff">1</text>
    <text x="91" y="243" fill="#ffffff">1</text>
    <text x="133" y="243" fill="#3a4a66">0</text>
    <text x="175" y="243" fill="#3a4a66">0</text>
    <text x="217" y="243" fill="#ffffff">1</text>
  </g>

  <text x="26" y="278" font-size="10" fill="#666" filter="url(#rough2)">R_i = b[i][0]：行 i 的整体取值</text>
  <text x="26" y="294" font-size="10" fill="#666" filter="url(#rough2)">C_j = b[0][j] ⊕ b[0][0]：列 j 的相对取值</text>

  <text x="26" y="326" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">A =</text>
  <text x="26" y="362" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">~A =</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="62" y="312" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="90" y="312" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="118" y="312" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="146" y="312" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="75" y="329" fill="#3a5a30">0</text>
    <text x="103" y="329" fill="#3a5a30">1</text>
    <text x="131" y="329" fill="#3a5a30">0</text>
    <text x="159" y="329" fill="#3a5a30">1</text>
    <rect x="62" y="344" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="90" y="344" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="118" y="344" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="146" y="344" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="75" y="361" fill="#8a3a36">1</text>
    <text x="103" y="361" fill="#8a3a36">0</text>
    <text x="131" y="361" fill="#8a3a36">1</text>
    <text x="159" y="361" fill="#8a3a36">0</text>
  </g>
  <path d="M 181 324 Q 198 334 182 344" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="204" y="340" font-size="9.5" fill="#a07a20" filter="url(#rough2)">逐位取反</text>

  <rect x="286" y="76" width="348" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="100" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">b[i][j] = R_i ⊕ C_j</text>
  <text x="300" y="124" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">R_i 只有 0 / 1 两种取值</text>
  <text x="300" y="146" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">→ 任意两行：要么全同，要么逐位取反</text>
  <text x="300" y="170" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">棋盘 ⟺ R_i = i%2 ⊕ t 交替（t ∈ {0,1}）</text>

  <rect x="286" y="200" width="348" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="224" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">可行判据（异或不变量）</text>
  <text x="300" y="250" font-size="11" fill="#6b4f10" filter="url(#rough2)">b[i][j] ⊕ b[i][0] ⊕ b[0][j] ⊕ b[0][0] = 0</text>
  <text x="300" y="272" font-size="10" fill="#8a6a20" filter="url(#rough2)">对所有 i, j 成立 ⟺ 不存在「第三类行」</text>

  <rect x="286" y="300" width="348" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="324" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">出现第三类行 / 列</text>
  <text x="300" y="348" font-size="10" fill="#a04844" filter="url(#rough2)">怎么交换都消不掉 → 直接返回 -1</text>
</svg>
