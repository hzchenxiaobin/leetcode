<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">翻折配对：恰有一半子集点亮该位</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="13" fill="#555">nums = [5, 1, 6]：取元素 x = 1（其 bit 0 为 1），按「是否含 1」把 8 个子集配成 4 对</text>

  <text x="125" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">不含 1 的子集</text>
  <text x="385" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">含 1 的子集</text>

  <!-- Pair row 1: {} vs {1} -->
  <g filter="url(#sk)">
    <rect x="40" y="94" width="170" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="300" y="94" width="170" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="54" y="112" font-size="12" font-weight="bold" fill="#2e6e2e">{ }</text>
  <text x="54" y="130" font-size="11" fill="#2e6e2e">XOR = 0 = 000₂</text>
  <text x="314" y="112" font-size="12" font-weight="bold" fill="#8a6415">{1}</text>
  <text x="314" y="130" font-size="11" fill="#8a6415">XOR = 1 = 001₂</text>
  <circle cx="186" cy="116" r="9" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="186" y="120" text-anchor="middle" font-size="11" fill="#777777">0</text>
  <circle cx="446" cy="116" r="9" fill="#b85450" stroke="#8f3f39" stroke-width="1.2" filter="url(#sk)"/>
  <text x="446" y="120" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">1</text>
  <path d="M 214 116 L 296 116" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="255" y="108" text-anchor="middle" font-size="11" fill="#3a3a3a">⊕1</text>

  <!-- Pair row 2: {5} vs {5,1} -->
  <g filter="url(#sk)">
    <rect x="40" y="148" width="170" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="300" y="148" width="170" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="54" y="166" font-size="12" font-weight="bold" fill="#2e6e2e">{5}</text>
  <text x="54" y="184" font-size="11" fill="#2e6e2e">XOR = 5 = 101₂</text>
  <text x="314" y="166" font-size="12" font-weight="bold" fill="#8a6415">{5,1}</text>
  <text x="314" y="184" font-size="11" fill="#8a6415">XOR = 4 = 100₂</text>
  <circle cx="186" cy="170" r="9" fill="#b85450" stroke="#8f3f39" stroke-width="1.2" filter="url(#sk)"/>
  <text x="186" y="174" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">1</text>
  <circle cx="446" cy="170" r="9" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="446" y="174" text-anchor="middle" font-size="11" fill="#777777">0</text>
  <path d="M 214 170 L 296 170" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="255" y="162" text-anchor="middle" font-size="11" fill="#3a3a3a">⊕1</text>

  <!-- Pair row 3: {6} vs {1,6} -->
  <g filter="url(#sk)">
    <rect x="40" y="202" width="170" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="300" y="202" width="170" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="54" y="220" font-size="12" font-weight="bold" fill="#2e6e2e">{6}</text>
  <text x="54" y="238" font-size="11" fill="#2e6e2e">XOR = 6 = 110₂</text>
  <text x="314" y="220" font-size="12" font-weight="bold" fill="#8a6415">{1,6}</text>
  <text x="314" y="238" font-size="11" fill="#8a6415">XOR = 7 = 111₂</text>
  <circle cx="186" cy="224" r="9" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="186" y="228" text-anchor="middle" font-size="11" fill="#777777">0</text>
  <circle cx="446" cy="224" r="9" fill="#b85450" stroke="#8f3f39" stroke-width="1.2" filter="url(#sk)"/>
  <text x="446" y="228" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">1</text>
  <path d="M 214 224 L 296 224" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="255" y="216" text-anchor="middle" font-size="11" fill="#3a3a3a">⊕1</text>

  <!-- Pair row 4: {5,6} vs {5,1,6} -->
  <g filter="url(#sk)">
    <rect x="40" y="256" width="170" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="300" y="256" width="170" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="54" y="274" font-size="12" font-weight="bold" fill="#2e6e2e">{5,6}</text>
  <text x="54" y="292" font-size="11" fill="#2e6e2e">XOR = 3 = 011₂</text>
  <text x="314" y="274" font-size="12" font-weight="bold" fill="#8a6415">{5,1,6}</text>
  <text x="314" y="292" font-size="11" fill="#8a6415">XOR = 2 = 010₂</text>
  <circle cx="186" cy="278" r="9" fill="#b85450" stroke="#8f3f39" stroke-width="1.2" filter="url(#sk)"/>
  <text x="186" y="282" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">1</text>
  <circle cx="446" cy="278" r="9" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="446" y="282" text-anchor="middle" font-size="11" fill="#777777">0</text>
  <path d="M 214 278 L 296 278" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="255" y="270" text-anchor="middle" font-size="11" fill="#3a3a3a">⊕1</text>

  <text x="320" y="322" text-anchor="middle" font-size="12" fill="#555">每对两个异或值恰差一个 x：bit 0 必然一 0 一 1（互补），其余位无所谓</text>

  <g filter="url(#sk)">
    <rect x="40" y="336" width="290" height="48" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="185" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">点亮 bit 0 的子集 = 4 = 2ⁿ⁻¹</text>
  <text x="185" y="374" text-anchor="middle" font-size="11" fill="#2b6e9e">只要该位至少出现一次，恒是一半</text>

  <g filter="url(#sk)">
    <rect x="350" y="336" width="250" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="475" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">ans = OR × 2ⁿ⁻¹</text>
  <text x="475" y="374" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 7 × 4 = 28 ✓</text>
</svg>
