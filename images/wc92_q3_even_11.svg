<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="330" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">偶数位回文数一定是 11 的倍数，只有 11 本身是质数</text>

  <text x="40" y="70" font-size="13" fill="#333" filter="url(#rough2)">以四位回文 abba 为例：</text>
  <rect x="40" y="84" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="68" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <rect x="96" y="84" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="124" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <rect x="152" y="84" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <rect x="208" y="84" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="236" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>

  <text x="40" y="162" font-size="13" fill="#333" filter="url(#rough2)">按位展开：1000a + 100b + 10b + a = 1001a + 110b</text>
  <text x="40" y="190" font-size="13" fill="#4a7a3a" filter="url(#rough2)">= 11 × (91a + 10b)　⇒　abba 必被 11 整除</text>

  <rect x="40" y="206" width="560" height="94" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="230" font-size="12" fill="#d6a040" filter="url(#rough2)">同一套论证对任意偶数位长成立（对称位系数是 10^k + 1，总被 11 整除）</text>
  <text x="58" y="252" font-size="12" fill="#333" filter="url(#rough2)">因此：位数 ≥ 2 的偶数位回文数全是合数，只有 2 位数里的 11 是质数。</text>
  <text x="58" y="274" font-size="12" fill="#b85450" filter="url(#rough2)">⇒ 搜索时可以直接跳过所有偶数长度（长度 2 单独特判为 11）。</text>
  <text x="58" y="292" font-size="11" fill="#666" filter="url(#rough2)">这就是为什么 13 的答案是 101，而不是 22、33、44 这些回文数。</text>
</svg>
