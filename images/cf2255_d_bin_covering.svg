<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 z" fill="#7a8fa6"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">归约成「分物品」：T 件 2 的幂，分给 n 个需求为 a_i 的箱子</text>
  <text x="360" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第 j 秒选中元素 i ⟺ 把物品 2^(T−j) 放进箱子 i；T 件物品必须全部放出，箱子可以溢出</text>

  <text x="70" y="80" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">T = 4 的物品</text>

  <g filter="url(#rough2)">
    <rect x="20" y="88" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="18"/>
    <text x="70" y="111" text-anchor="middle" font-size="12.5" fill="#333">2³ = 8</text>
    <rect x="20" y="136" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="18"/>
    <text x="70" y="159" text-anchor="middle" font-size="12.5" fill="#333">2² = 4</text>
    <rect x="20" y="184" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="18"/>
    <text x="70" y="207" text-anchor="middle" font-size="12.5" fill="#333">2¹ = 2</text>
    <rect x="20" y="232" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="18"/>
    <text x="70" y="255" text-anchor="middle" font-size="12.5" fill="#333">2⁰ = 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="430" y="88" width="250" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="446" y="108" font-size="11.5" fill="#333">箱子 a = 7</text>
    <text x="446" y="126" font-size="9.6" fill="#666">分到 8（溢出 1，合法）</text>

    <rect x="430" y="152" width="250" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="446" y="172" font-size="11.5" fill="#333">箱子 a = 2</text>
    <text x="446" y="190" font-size="9.6" fill="#666">分到 4（溢出 2）</text>

    <rect x="430" y="216" width="250" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="446" y="236" font-size="11.5" fill="#333">箱子 a = 1</text>
    <text x="446" y="254" font-size="9.6" fill="#666">分到 2（溢出 1）</text>
  </g>

  <path d="M 124 106 L 426 110" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 124 154 L 426 172" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 124 202 L 426 236" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 124 250 C 270 300 330 130 426 116" stroke="#b85450" stroke-width="1.7" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="290" y="292" font-size="10" fill="#b85450" filter="url(#rough2)">红色虚线：1 已无处可去，塞进已满的箱子白白浪费（Σ 物品 = 2^T − 1）</text>

  <g filter="url(#rough2)">
    <rect x="20" y="308" width="660" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="9"/>
    <text x="36" y="330" font-size="11.5" font-weight="bold" fill="#333">LPT 贪心（判定核心）</text>
    <text x="36" y="349" font-size="9.6" fill="#555">把物品从大到小处理，每次给「当前剩余需求最大」的箱子；若存在可行分配，则该贪心可行（交换论证，见正文引理 3）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="20" y="370" width="660" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9"/>
    <text x="36" y="392" font-size="11.5" font-weight="bold" fill="#333">于是 T 可行 ⟺ 上述分配让所有箱子都达到 a_i</text>
    <text x="36" y="411" font-size="9.6" fill="#555">T &lt; n 必然不可行（每个箱子至少要 1 件物品）；可行性关于 T 单调（多出的物品随便塞给谁都不影响）</text>
  </g>
</svg>
