<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">不变量：每个元素的奇偶性永不变，总和守恒</text>
  <path d="M 260 42 Q 470 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A -->
  <text x="70" y="74" font-size="13" font-weight="bold" fill="#2b6e9e">① 一次操作到底改变了什么</text>

  <text x="92" y="120" text-anchor="end" font-size="12" fill="#888" font-weight="bold">nums =</text>
  <g filter="url(#sk)"><rect x="105" y="92" width="72" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="141" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">8</text>
  <text x="141" y="154" text-anchor="middle" font-size="10" fill="#2b6e9e">偶</text>
  <g filter="url(#sk)"><rect x="195" y="92" width="72" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="231" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">5</text>
  <text x="231" y="154" text-anchor="middle" font-size="10" fill="#7a5415">奇</text>
  <g filter="url(#sk)"><rect x="285" y="92" width="72" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="321" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">12</text>
  <text x="321" y="154" text-anchor="middle" font-size="10" fill="#2b6e9e">偶</text>
  <g filter="url(#sk)"><rect x="375" y="92" width="72" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="411" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">9</text>
  <text x="411" y="154" text-anchor="middle" font-size="10" fill="#7a5415">奇</text>
  <g filter="url(#sk)"><rect x="465" y="92" width="72" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="501" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">6</text>
  <text x="501" y="154" text-anchor="middle" font-size="10" fill="#2b6e9e">偶</text>

  <g filter="url(#sk)"><rect x="620" y="86" width="280" height="118" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="640" y="110" font-size="12" font-weight="bold" fill="#2e6e2e">操作改不掉的两样东西</text>
  <text x="640" y="134" font-size="11" fill="#444">✓ 每个元素的奇偶性（±2 不改奇偶）</text>
  <text x="640" y="156" font-size="11" fill="#444">✓ 全体元素的总和（+2 与 −2 抵消）</text>
  <text x="640" y="180" font-size="10" fill="#888">改变的只有：每个元素的具体取值</text>

  <!-- Panel B -->
  <text x="70" y="216" font-size="13" font-weight="bold" fill="#5a3a7a">② 一次操作 = 把 2 个单位从 j 搬到 i</text>

  <text x="70" y="250" font-size="11" fill="#888" font-weight="bold">操作前</text>
  <g filter="url(#sk)"><rect x="90" y="258" width="72" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="126" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">5</text>
  <g filter="url(#sk)"><rect x="310" y="258" width="72" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="346" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">8</text>
  <path d="M 172 281 L 300 281" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="236" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">搬运 2 个单位</text>
  <text x="126" y="326" text-anchor="middle" font-size="10" fill="#7a5415">下标 j（−2）</text>
  <text x="346" y="326" text-anchor="middle" font-size="10" fill="#2b6e9e">下标 i（+2）</text>

  <text x="560" y="250" font-size="11" fill="#888" font-weight="bold">操作后</text>
  <g filter="url(#sk)"><rect x="560" y="258" width="72" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="596" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">3</text>
  <g filter="url(#sk)"><rect x="780" y="258" width="72" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="816" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">10</text>
  <text x="596" y="326" text-anchor="middle" font-size="10" fill="#2e6e2e">5−2=3，仍是奇数 ✓</text>
  <text x="816" y="326" text-anchor="middle" font-size="10" fill="#2e6e2e">8+2=10，仍是偶数 ✓</text>

  <text x="470" y="356" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold" font-family="monospace">nums[i] += 2，nums[j] −= 2（i ≠ j）</text>

  <text x="70" y="390" font-size="11" fill="#2e6e2e">✓ 被搬运的 2 不带奇偶信息：奇数可以送给偶数，反之亦然</text>
  <text x="70" y="414" font-size="11" fill="#2e6e2e">✓ 但每个元素自己的奇偶永不变 → 配对必须「奇配奇、偶配偶」</text>

  <!-- Panel C -->
  <g filter="url(#sk)"><rect x="60" y="436" width="820" height="124" rx="8" fill="#fffdf3" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="80" y="462" font-size="12" font-weight="bold" fill="#2b2b2b">推论：拆成两个独立的匹配子问题</text>
  <text x="80" y="486" font-size="11" fill="#444">1. nums 的每个奇数必须对上 target 的某个奇数（多重集意义），偶数同理</text>
  <text x="80" y="508" font-size="11" fill="#444">2. 先按奇偶分流，再在类内做「排序配对」</text>
  <text x="80" y="530" font-size="11" fill="#7a2828">3. 题目保证可达的隐藏条件：Σnums = Σtarget，且两者奇数个数相等（两条不变量的逆用）</text>
</svg>
