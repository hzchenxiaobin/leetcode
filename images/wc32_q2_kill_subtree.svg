<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">杀掉一个进程 = 删掉以它为根的整棵子树</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">pid = [1, 3, 10, 5]，ppid = [3, 0, 5, 3]，kill = 5</text>

  <path d="M 268 100 L 182 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 292 100 L 378 148" stroke="#c98a2a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 190 L 390 236" stroke="#c98a2a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="253" y="62" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="280" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">ppid = 0（根，存活）</text>

  <rect x="143" y="150" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="170" y="174" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="148" y="205" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">兄弟，存活</text>

  <rect x="363" y="150" width="54" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="174" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">5</text>
  <text x="428" y="172" font-size="9.5" fill="#a8761c" filter="url(#rough2)">← kill</text>

  <rect x="363" y="238" width="54" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="262" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">10</text>
  <text x="428" y="262" font-size="9.5" fill="#a8761c" filter="url(#rough2)">子进程，连带被杀</text>

  <rect x="60" y="296" width="440" height="48" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="78" y="310" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="102" y="323" font-size="10" fill="#555" filter="url(#rough2)">被杀：kill 自身 + 全部后代</text>
  <rect x="306" y="310" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="330" y="323" font-size="10" fill="#555" filter="url(#rough2)">存活：祖先与兄弟</text>

  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">传播方向只有「父 → 子」，所以从 kill 出发沿 children 边做一次遍历即可</text>
</svg>
