<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：稳定条件 ⟺ 前缀差 P[r] − P[l] ＝ 2v</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="70" text-anchor="middle" font-size="13" fill="#666">对长度 ≥ 3 的子数组 capacity[l..r]，设首尾公共值为 v：</text>

  <g filter="url(#sk)">
    <rect x="148" y="82" width="56" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="212" y="82" width="60" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="280" y="82" width="48" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="336" y="82" width="60" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="404" y="82" width="56" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="176" y="110" fill="#2b6e9e">v</text>
    <text x="242" y="110" fill="#2e5e22" font-size="12.5">a[l+1]</text>
    <text x="304" y="110" fill="#2e5e22">⋯</text>
    <text x="366" y="110" fill="#2e5e22" font-size="12.5">a[r−1]</text>
    <text x="432" y="110" fill="#2b6e9e">v</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#999">
    <text x="176" y="140">l</text>
    <text x="242" y="140">l+1</text>
    <text x="304" y="140">⋯</text>
    <text x="366" y="140">r−1</text>
    <text x="432" y="140">r</text>
  </g>

  <path d="M 230 148 Q 190 160 172 170" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 380 148 Q 420 160 438 170" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="55" y="174" width="255" height="52" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="330" y="174" width="255" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="182" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">① 首尾相等</text>
  <text x="182" y="215" text-anchor="middle" font-size="13" fill="#2b6e9e">a[l] ＝ a[r] ＝ v</text>
  <text x="457" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">② 内部之和等于 v</text>
  <text x="457" y="215" text-anchor="middle" font-size="13" fill="#2e5e22">a[l+1] ＋ ⋯ ＋ a[r−1] ＝ v</text>

  <g filter="url(#sk)">
    <rect x="70" y="244" width="500" height="86" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="268" text-anchor="middle" font-size="13" fill="#333">由 ②：内部和 ＝ P[r] − P[l+1]，而 P[l+1] ＝ P[l] ＋ v</text>
  <text x="320" y="292" text-anchor="middle" font-size="13" fill="#333">代入 ②：P[r] − P[l] − v ＝ v</text>
  <text x="320" y="316" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b85450">⟹ P[r] − P[l] ＝ 2v</text>

  <g filter="url(#sk)">
    <rect x="40" y="348" width="560" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">稳定 ⟺ 首尾同值 v 且 P[r] − P[l] ＝ 2v</text>
  <text x="320" y="398" text-anchor="middle" font-size="12.5" fill="#7a5415">条件只挂在两端 (a[l], P[l]) 与 (a[r], P[r]) 上，与中间元素无关</text>
  <text x="320" y="422" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">⟹ 统计问题变成「同值组内，前缀差恰为 2v 的数对」</text>
</svg>
