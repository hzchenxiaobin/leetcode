<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：slices = [1,2,3,4,5,6]，n = 2，答案 10</text>

  <!-- 情形一: 链 [2,3,4,5,6] -->
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold">
    <text x="196" y="70" text-anchor="middle">情形一（弃首块 1）：链 [2, 3, 4, 5, 6]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="84" width="44" height="40" fill="#eeeeee" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="110" y="84" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="160" y="84" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="210" y="84" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="260" y="84" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="82" y="109">1</text>
    <text x="132" y="109">2</text>
    <text x="182" y="109">3</text>
    <text x="232" y="109" font-weight="bold" fill="#2d5a22">4</text>
    <text x="282" y="109">5</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="82" y="126">不在链中</text>
    <text x="132" y="126">可选</text>
    <text x="182" y="126">被 4 隔开</text>
    <text x="232" y="126">选 ✓</text>
    <text x="282" y="126">被 4 隔开</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="300" y="84" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="322" y="109" font-weight="bold" fill="#2d5a22">6</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="322" y="126">选 ✓</text>
  </g>
  <text x="196" y="152" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">链上选 2 个不相邻：最优 {4, 6} = 10（中间隔着 5）</text>

  <!-- 情形二: 链 [1,2,3,4,5] -->
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold">
    <text x="196" y="196" text-anchor="middle">情形二（弃尾块 6）：链 [1, 2, 3, 4, 5]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="210" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="110" y="210" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="160" y="210" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="210" y="210" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="260" y="210" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="82" y="235">1</text>
    <text x="132" y="235">2</text>
    <text x="182" y="235" font-weight="bold" fill="#2d5a22">3</text>
    <text x="232" y="235">4</text>
    <text x="282" y="235" font-weight="bold" fill="#2d5a22">5</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="82" y="252">可选</text>
    <text x="132" y="252">被 3 隔开</text>
    <text x="182" y="252">选 ✓</text>
    <text x="232" y="252">被隔开</text>
    <text x="282" y="252">选 ✓</text>
  </g>
  <text x="196" y="278" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">链上选 2 个不相邻：最优 {3, 5} = 8</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="380" y="170" width="150" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22">
    <text x="455" y="198" text-anchor="middle" font-weight="bold">两情形取最大</text>
    <text x="455" y="226" text-anchor="middle">情形一：10</text>
    <text x="455" y="250" text-anchor="middle">情形二：8</text>
    <text x="455" y="278" text-anchor="middle" font-weight="bold" fill="#8a3833">答案 = 10</text>
  </g>
</svg>
