<svg xmlns="http://www.w3.org/2000/svg" width="640" height="404" viewBox="0 0 640 404" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="404" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：arr = [2,1,3,5,4,6,7]，k = 2</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="11.5" fill="#888">换擂 → cnt 重置为 1；卫冕 → cnt += 1；cnt 达到 k 立即返回擂主</text>

  <!-- header -->
  <g font-size="11" font-weight="bold" fill="#777" text-anchor="middle">
    <text x="78" y="76">轮次</text>
    <text x="170" y="76">擂主 cur</text>
    <text x="290" y="76">挑战者 arr[i]</text>
    <text x="400" y="76">胜者</text>
    <text x="478" y="76">连胜 cnt</text>
    <text x="558" y="76">备注</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="84" width="560" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="78" y="109" font-weight="bold" fill="#555">1</text>
    <text x="170" y="109" font-weight="bold" fill="#2b6e9e">2</text>
    <text x="290" y="109" font-weight="bold" fill="#b8641e">1</text>
    <text x="400" y="109" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="478" y="109" fill="#444">1</text>
    <text x="558" y="109" font-size="11" fill="#666">2 卫冕</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="134" width="560" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="78" y="159" font-weight="bold" fill="#555">2</text>
    <text x="170" y="159" font-weight="bold" fill="#2b6e9e">2</text>
    <text x="290" y="159" font-weight="bold" fill="#b8641e">3</text>
    <text x="400" y="159" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="478" y="159" fill="#444">1</text>
    <text x="558" y="159" font-size="11" fill="#7a5415">3 &gt; 2，换擂</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="184" width="560" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="78" y="209" font-weight="bold" fill="#555">3</text>
    <text x="170" y="209" font-weight="bold" fill="#2b6e9e">3</text>
    <text x="290" y="209" font-weight="bold" fill="#b8641e">5</text>
    <text x="400" y="209" font-weight="bold" fill="#2e6e2e">5</text>
    <text x="478" y="209" fill="#444">1</text>
    <text x="558" y="209" font-size="11" fill="#7a5415">5 &gt; 3，换擂</text>
  </g>

  <!-- row 4: winner -->
  <g filter="url(#sk)">
    <rect x="40" y="234" width="560" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="78" y="259" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="170" y="259" font-weight="bold" fill="#2b6e9e">5</text>
    <text x="290" y="259" font-weight="bold" fill="#b8641e">4</text>
    <text x="400" y="259" font-weight="bold" fill="#2e6e2e">5</text>
    <text x="478" y="259" font-weight="bold" fill="#2e6e2e">2 = k ✓</text>
    <text x="558" y="259" font-size="11.5" font-weight="bold" fill="#2e6e2e">★ 赢家 5！</text>
  </g>

  <!-- example 2 panel -->
  <g filter="url(#sk)">
    <rect x="40" y="286" width="560" height="64" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="320" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">示例 2：arr = [3,2,1]，k = 10（k ≫ n）</text>
  <text x="320" y="324" text-anchor="middle" font-size="11" fill="#7a5415">第 1 轮 3 vs 2、第 2 轮 3 vs 1 —— 扫完 n−1 = 2 轮后 cur = 3 = max(arr)；</text>
  <text x="320" y="340" text-anchor="middle" font-size="11" fill="#7a5415">第二圈起 3 永恒卫冕，连胜终会到 10 → 直接返回 3，不必模拟 10 轮。</text>

  <!-- result strip -->
  <g filter="url(#sk)">
    <rect x="40" y="360" width="560" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">示例 1 返回 5 ✓　　扫描结束仍未达 k ⇒ 返回 cur = max(arr)</text>
</svg>
