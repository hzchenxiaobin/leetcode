<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">模型：排序 → 前缀和阶梯 → 二分找「最后一个 ≤ q」的柱子</text>

  <!-- ===== ① sorted nums ===== -->
  <text x="40" y="54" font-size="12" fill="#4a7a3a" font-weight="bold">① 排序：nums = [4,5,2,1] → [1, 2, 4, 5]（升序）</text>

  <g filter="url(#rough2)">
    <rect x="70" y="64" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="93" y="90" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
    <rect x="120" y="64" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="143" y="90" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">2</text>
    <rect x="170" y="64" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="193" y="90" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">4</text>
    <rect x="220" y="64" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="243" y="90" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">5</text>
  </g>

  <g filter="url(#rough2)">
    <text x="300" y="78" font-size="12" fill="#666">累加方向 →</text>
    <text x="300" y="98" font-size="11" fill="#888">每步至少 +1，阶梯只升不降</text>
  </g>

  <!-- accumulation arrows -->
  <g filter="url(#rough2)">
    <path d="M 93 108 Q 93 128 108 148" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/>
    <path d="M 143 108 Q 143 132 152 148" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/>
    <path d="M 193 108 Q 193 132 196 148" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/>
    <path d="M 243 108 Q 243 132 240 148" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/>
  </g>

  <!-- ===== ② prefix sums ===== -->
  <text x="40" y="142" font-size="12" fill="#446688" font-weight="bold">② 前缀和 pre[k]（k = 0..4）：</text>

  <g filter="url(#rough2)">
    <rect x="70" y="150" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="98" y="172" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
    <text x="98" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a">pre[0]=空</text>

    <rect x="132" y="150" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="160" y="172" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
    <text x="160" y="188" text-anchor="middle" font-size="10" fill="#446688">pre[1]</text>

    <rect x="194" y="150" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="222" y="172" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
    <text x="222" y="188" text-anchor="middle" font-size="10" fill="#446688">pre[2]</text>

    <rect x="256" y="150" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="284" y="172" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">7</text>
    <text x="284" y="188" text-anchor="middle" font-size="10" fill="#446688">pre[3]</text>

    <rect x="318" y="150" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="346" y="172" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">12</text>
    <text x="346" y="188" text-anchor="middle" font-size="10" fill="#446688">pre[4]</text>
  </g>

  <g filter="url(#rough2)">
    <text x="400" y="168" font-size="11.5" fill="#666">pre[k] = 前 k 小之和</text>
    <text x="400" y="186" font-size="11.5" fill="#666">= 长度 k 的最小可能和</text>
  </g>

  <!-- ===== ③ staircase + threshold ===== -->
  <text x="40" y="222" font-size="12" fill="#b85450" font-weight="bold">③ pre 画成阶梯柱：queries[i] = 10 画一条红线，红线下的最后一根柱即答案</text>

  <!-- threshold line: q=10, baseline y=406, 15px per unit -> y = 406-150 = 256 -->
  <line x1="60" y1="256" x2="470" y2="256" stroke="#b85450" stroke-width="2" stroke-dasharray="7,4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="474" y="240" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="512" y="260" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">q = 10</text>
  </g>

  <!-- baseline -->
  <line x1="60" y1="406" x2="470" y2="406" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- bars: baseline 406, scale 15px/unit; x=84,164,244,324,404 width 52 -->
  <g filter="url(#rough2)">
    <!-- k=0: height 0 -->
    <text x="110" y="400" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
    <!-- k=1: 15 -->
    <rect x="164" y="391" width="52" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="190" y="386" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- k=2: 45 -->
    <rect x="244" y="361" width="52" height="45" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="270" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
    <!-- k=3: 105, top 301, below line 256 ✓ -->
    <rect x="324" y="301" width="52" height="105" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3"/>
    <text x="350" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
    <text x="350" y="358" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">✓</text>
    <!-- k=4: 180, top 226, above line ✗ -->
    <rect x="404" y="226" width="52" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3"/>
    <text x="430" y="221" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">12</text>
    <text x="430" y="290" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- k labels -->
  <g filter="url(#rough2)">
    <text x="110" y="422" text-anchor="middle" font-size="11" fill="#888">k=0</text>
    <text x="190" y="422" text-anchor="middle" font-size="11" fill="#888">k=1</text>
    <text x="270" y="422" text-anchor="middle" font-size="11" fill="#888">k=2</text>
    <text x="350" y="422" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">k=3</text>
    <text x="430" y="422" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k=4</text>
  </g>

  <!-- answer annotation -->
  <path d="M 350 292 Q 350 272 350 260" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <g filter="url(#rough2)">
    <text x="118" y="282" font-size="12" fill="#4a7a3a" font-weight="bold">红线下的最后一根柱：k = 3</text>
    <text x="118" y="300" font-size="12" fill="#4a7a3a" font-weight="bold">→ answer = 3</text>
    <text x="118" y="330" font-size="10.5" fill="#888">阶梯严格递增 ⇒「pre[k] ≤ q」的 k</text>
    <text x="118" y="346" font-size="10.5" fill="#888">连成前缀段 {0,…,K} ⇒ 二分找 K</text>
  </g>
</svg>
