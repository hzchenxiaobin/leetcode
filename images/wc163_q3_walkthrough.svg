<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [3, 6, 5, 1, 8]</text>
  <text x="360" y="52" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">每行是处理完该元素后的 dp；−∞ 表示该余数还不可达</text>

  <!-- 表头 -->
  <rect x="40" y="78" width="640" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="103" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">元素 v</text>
  <text x="177" y="103" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">v mod 3</text>
  <text x="300" y="103" text-anchor="middle" font-size="13.5" fill="#446688" filter="url(#rough2)">dp[0]</text>
  <text x="450" y="103" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">dp[1]</text>
  <text x="602" y="103" text-anchor="middle" font-size="13.5" fill="#b8860b" filter="url(#rough2)">dp[2]</text>

  <!-- 数据行 -->
  <rect x="40" y="116" width="640" height="40" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="156" width="640" height="40" fill="#f4f7fb" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="196" width="640" height="40" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="236" width="640" height="40" fill="#f4f7fb" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="276" width="640" height="40" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="316" width="640" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <path d="M130,78 L130,356" fill="none" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M225,78 L225,356" fill="none" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M375,78 L375,356" fill="none" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M525,78 L525,356" fill="none" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="85" y="142" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">初始</text>
  <text x="177" y="142" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">—</text>
  <text x="300" y="142" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="450" y="142" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">−∞</text>
  <text x="602" y="142" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">−∞</text>

  <text x="85" y="182" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="177" y="182" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <text x="300" y="182" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="450" y="182" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">−∞</text>
  <text x="602" y="182" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">−∞</text>

  <text x="85" y="222" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="177" y="222" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <text x="300" y="222" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <text x="450" y="222" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">−∞</text>
  <text x="602" y="222" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">−∞</text>

  <text x="85" y="262" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="177" y="262" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">2</text>
  <text x="300" y="262" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <text x="450" y="262" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">−∞</text>
  <text x="602" y="262" text-anchor="middle" font-size="15" fill="#b8860b" filter="url(#rough2)">14</text>

  <text x="85" y="302" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="177" y="302" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="300" y="302" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">15</text>
  <text x="450" y="302" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">10</text>
  <text x="602" y="302" text-anchor="middle" font-size="15" fill="#b8860b" filter="url(#rough2)">14</text>

  <text x="85" y="342" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="177" y="342" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">2</text>
  <text x="300" y="342" text-anchor="middle" font-size="17" fill="#b85450" filter="url(#rough2)">18</text>
  <text x="450" y="342" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">22</text>
  <text x="602" y="342" text-anchor="middle" font-size="15" fill="#b8860b" filter="url(#rough2)">23</text>

  <text x="360" y="384" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">最后一行 dp[0] = 18 = 3 + 6 + 1 + 8，正是可被 3 整除的最大和</text>
  <text x="360" y="408" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">贪心校验：总和 23 ≡ 2，删去最小的 ≡2 元素 5，得 23 − 5 = 18</text>
</svg>
