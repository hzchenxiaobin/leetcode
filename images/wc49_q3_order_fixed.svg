<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="300" fill="#fafafa" filter="url(#rough2)"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">砍伐顺序由树高唯一确定 ⇒ 总步数 = 各段最短路之和</text>

  <!-- 起点 -->
  <rect x="40" y="76" width="62" height="50" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="71" y="107" text-anchor="middle" font-size="16" fill="#8a6d1f" filter="url(#rough2)">S</text>

  <!-- 按高度升序的树 -->
  <rect x="138" y="76" width="62" height="50" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="169" y="107" text-anchor="middle" font-size="16" fill="#33602a" filter="url(#rough2)">2</text>

  <rect x="236" y="76" width="62" height="50" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="267" y="107" text-anchor="middle" font-size="16" fill="#33602a" filter="url(#rough2)">3</text>

  <rect x="334" y="76" width="62" height="50" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="365" y="107" text-anchor="middle" font-size="16" fill="#33602a" filter="url(#rough2)">4</text>

  <rect x="432" y="76" width="62" height="50" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="463" y="107" text-anchor="middle" font-size="16" fill="#33602a" filter="url(#rough2)">5</text>

  <rect x="530" y="76" width="62" height="50" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="561" y="107" text-anchor="middle" font-size="16" fill="#33602a" filter="url(#rough2)">6</text>

  <!-- 段间箭头 -->
  <path d="M104,101 L132,101" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M202,101 L230,101" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M300,101 L328,101" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M398,101 L426,101" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M496,101 L524,101" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 每段距离 -->
  <text x="118" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">d₁</text>
  <text x="216" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">d₂</text>
  <text x="314" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">d₃</text>
  <text x="412" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">d₄</text>
  <text x="510" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">d₅</text>

  <text x="71" y="152" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">起点</text>

  <!-- 结论 -->
  <rect x="60" y="178" width="520" height="52" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="15" fill="#2c4a63" filter="url(#rough2)">总步数 = d₁ + d₂ + d₃ + d₄ + d₅ + ⋯ （每段独立取最短路）</text>

  <text x="320" y="258" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">树格始终可通行，图是静态的 ⇒ 段与段之间没有耦合，逐段 BFS 即最优</text>
  <text x="320" y="282" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">高度两两不同 ⇒ 升序排列唯一，砍伐顺序没有任何选择余地</text>
</svg>
