<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="680" height="445" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：中序遍历 BST = 递增序列，最小差必在相邻两项</text>
  <path d="M 120 38 Q 340 46 560 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- ===== BST: root 4, children 2 / 6, 2's children 1 / 3 ===== -->
  <g filter="url(#r)" stroke="#7a8a9a" stroke-width="1.5" fill="none">
    <line x1="230" y1="104" x2="150" y2="186"/>
    <line x1="230" y1="104" x2="320" y2="186"/>
    <line x1="150" y1="194" x2="95" y2="276"/>
    <line x1="150" y1="194" x2="205" y2="276"/>
  </g>
  <g filter="url(#r)" font-size="10" fill="#aaa">
    <text x="166" y="146">左</text>
    <text x="288" y="146">右</text>
  </g>
  <g filter="url(#r)">
    <circle cx="230" cy="90" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="150" cy="190" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="320" cy="190" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="95" cy="290" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="205" cy="290" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#r)" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="230" y="96" fill="#8a6a1a">4</text>
    <text x="150" y="196" fill="#2b4a6e">2</text>
    <text x="320" y="196" fill="#2b4a6e">6</text>
    <text x="95" y="296" fill="#2e6e2e">1</text>
    <text x="205" y="296" fill="#2e6e2e">3</text>
  </g>
  <text x="40" y="60" font-size="11" fill="#666" filter="url(#r)">root</text>

  <!-- ===== right panel: why adjacent only ===== -->
  <g filter="url(#r)">
    <rect x="392" y="62" width="258" height="212" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="521" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">为什么只看相邻两项？</text>
  <g filter="url(#r)" font-size="11.5" fill="#333">
    <text x="410" y="112">中序：左子树 → 根 → 右子树</text>
    <text x="410" y="134">BST 性质 ⇒ 序列单调递增</text>
    <text x="410" y="156">对任意 i &lt; j：</text>
  </g>
  <g filter="url(#r)" font-size="11" font-family="monospace" fill="#2e6e2e">
    <text x="418" y="180">a[j] − a[i] = 中间各段间隙之和</text>
    <text x="418" y="202">            ≥ a[i+1] − a[i]</text>
  </g>
  <line x1="410" y1="216" x2="632" y2="216" stroke="#446688" stroke-width="1" filter="url(#r)"/>
  <text x="521" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">答案 = min(相邻差)</text>
  <text x="521" y="260" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">跨层节点对一定不更优</text>

  <!-- arrow tree -> inorder strip -->
  <path d="M 230 316 L 230 336" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>
  <text x="240" y="330" font-size="11" font-weight="bold" fill="#666" filter="url(#r)">中序遍历</text>

  <!-- ===== inorder strip ===== -->
  <text x="70" y="352" font-size="10.5" fill="#888" filter="url(#r)">中序序列（严格递增）</text>
  <g filter="url(#r)">
    <rect x="70" y="358" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="160" y="358" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="250" y="358" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="340" y="358" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="430" y="358" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#r)" font-size="16" text-anchor="middle" font-weight="bold">
    <text x="98" y="386" fill="#2e6e2e">1</text>
    <text x="188" y="386" fill="#2e6e2e">2</text>
    <text x="278" y="386" fill="#2e6e2e">3</text>
    <text x="368" y="386" fill="#8a6a1a">4</text>
    <text x="458" y="386" fill="#2e6e2e">6</text>
  </g>
  <g filter="url(#r)" font-size="9" fill="#999" text-anchor="middle">
    <text x="98" y="412">a1</text><text x="188" y="412">a2</text><text x="278" y="412">a3</text>
    <text x="368" y="412">a4</text><text x="458" y="412">a5</text>
  </g>

  <!-- gaps -->
  <g filter="url(#r)" stroke="#b85450" stroke-width="1.6" fill="none">
    <path d="M 128 378 L 158 378"/>
    <path d="M 218 378 L 248 378"/>
    <path d="M 308 378 L 338 378"/>
    <path d="M 398 378 L 428 378"/>
  </g>
  <g filter="url(#r)" font-size="12.5" font-weight="bold" fill="#b85450" text-anchor="middle">
    <text x="143" y="370">1</text>
    <text x="233" y="370">1</text>
    <text x="323" y="370">1</text>
    <text x="413" y="370">2</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#r)">
    <rect x="70" y="420" width="540" height="0.8" fill="#ccc"/>
  </g>
  <text x="70" y="436" font-size="11" fill="#444" filter="url(#r)">4 个相邻间隙 = 1, 1, 1, 2，最小值为 1  ⇒  getMinimumDifference = 1</text>
</svg>
