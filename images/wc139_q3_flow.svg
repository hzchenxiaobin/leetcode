<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">从最低位向高位做列加法</text>
  <text x="280" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">carry 可能为 −1，所以循环条件要包含 carry ≠ 0</text>
  <rect x="140" y="66" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="93" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">i、j 指向两数组末尾，carry = 0</text>
  <path d="M 280 112 L 280 136" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="136" width="320" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="161.5" font-size="11" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">total = carry + arr1[i] + arr2[j]</text>
  <text x="280" y="178.5" font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">（越界的位置按 0 计）</text>
  <path d="M 280 196 L 280 220" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="220" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="243.5" font-size="11" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">digit = total &amp; 1，压入低位</text>
  <text x="280" y="260.5" font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">carry = −(total − digit) / 2</text>
  <path d="M 280 276 L 280 296" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="296" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316.8" font-size="10.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">i、j 左移，直到都越界且 carry = 0</text>
  <text x="60" y="250" font-size="16" fill="#888" text-anchor="start" filter="url(#rough2)">→</text>
  <rect x="30" y="300" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="318.6" font-size="10" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">去掉前导零</text>
</svg>
