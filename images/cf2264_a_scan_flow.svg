<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="#fafafa"/>

  <text x="420" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次线性扫描，不真的反转</text>
  <path d="M 170 40 Q 420 47 670 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 读入 -->
  <rect x="350" y="56" width="180" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="82" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读入 n 与排列 p</text>
  <path d="M 440 98 V 118" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 收集 S -->
  <rect x="316" y="118" width="248" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="144" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">收集 S = { i | p[i] ≠ i }（i 递增）</text>
  <path d="M 440 160 V 176" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1 -->
  <polygon points="440,176 550,210 440,244 330,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="215" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">S 为空？</text>

  <path d="M 330 210 H 196 V 268" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="200" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是（已排好）</text>

  <rect x="120" y="268" width="152" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="295" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 YES</text>

  <path d="M 440 244 V 262" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="258" font-size="11" fill="#66788c" filter="url(#rough2)">否</text>

  <!-- 初值 -->
  <rect x="330" y="262" width="220" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="288" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">last ← n+1（当作 +∞）</text>
  <path d="M 440 304 V 322" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2 -->
  <polygon points="440,322 566,360 440,398 314,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="357" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">有 p[i] ≥ last</text>
  <text x="440" y="373" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">（出现上升或相等）</text>

  <path d="M 566 360 H 700" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="628" y="348" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">是 ⇒ 不是递减</text>

  <rect x="702" y="336" width="150" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="777" y="365" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 NO</text>

  <path d="M 440 398 V 448" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="424" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">否：全程严格递减</text>

  <rect x="340" y="448" width="200" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="476" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 YES</text>

  <!-- 小提示 -->
  <rect x="652" y="90" width="204" height="180" rx="9" fill="#fafafa" stroke="#9aa8b6" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="668" y="113" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">小提示</text>
  <text x="668" y="138" font-size="10.5" fill="#66788c" filter="url(#rough2)">• S 为空时直接 YES：</text>
  <text x="668" y="156" font-size="10.5" fill="#66788c" filter="url(#rough2)">　取 m = 1，反转单个</text>
  <text x="668" y="174" font-size="10.5" fill="#66788c" filter="url(#rough2)">　元素等于什么都没做。</text>
  <text x="668" y="198" font-size="10.5" fill="#66788c" filter="url(#rough2)">• 全程只比较相邻两个</text>
  <text x="668" y="216" font-size="10.5" fill="#66788c" filter="url(#rough2)">　错位值，空间 O(1)。</text>
  <text x="668" y="240" font-size="10.5" fill="#66788c" filter="url(#rough2)">• 不需要排序、二分，</text>
  <text x="668" y="258" font-size="10.5" fill="#66788c" filter="url(#rough2)">　也不需要真去反转。</text>

  <text x="440" y="520" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">复杂度：每组 O(n)，t = 500 组、n = 100 时总操作量只有 5 × 10⁴。</text>
</svg>
