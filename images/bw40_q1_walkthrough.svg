<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="330" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：枚举重复次数 k，从 1 递增直到 word^k 不再出现</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">sequence = ababc，word = ab：ab ✓（k=1）→ abab ✓（k=2）→ ababab ✗ 长度超出，答案 2</text>

  <!-- row k=1 -->
  <g font-size="13" fill="#555" filter="url(#r)">
    <text x="120" y="100">k = 1：ab</text>
  </g>
  <g filter="url(#r)">
    <rect x="220" y="78" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="276" y="78" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="332" y="78" width="52" height="44" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
    <rect x="388" y="78" width="52" height="44" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
    <rect x="444" y="78" width="52" height="44" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="246" y="106" fill="#4a7a3a">a</text>
    <text x="302" y="106" fill="#4a7a3a">b</text>
    <text x="358" y="106" fill="#aaa">a</text>
    <text x="414" y="106" fill="#aaa">b</text>
    <text x="470" y="106" fill="#aaa">c</text>
  </g>
  <text x="560" y="106" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#r)">✓ 出现</text>

  <!-- row k=2 -->
  <g font-size="13" fill="#555" filter="url(#r)">
    <text x="120" y="172">k = 2：abab</text>
  </g>
  <g filter="url(#r)">
    <rect x="220" y="150" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="276" y="150" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="332" y="150" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="388" y="150" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="444" y="150" width="52" height="44" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="246" y="178" fill="#4a7a3a">a</text>
    <text x="302" y="178" fill="#4a7a3a">b</text>
    <text x="358" y="178" fill="#4a7a3a">a</text>
    <text x="414" y="178" fill="#4a7a3a">b</text>
    <text x="470" y="178" fill="#aaa">c</text>
  </g>
  <text x="560" y="178" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#r)">✓ 出现</text>

  <!-- row k=3 -->
  <g font-size="13" fill="#555" filter="url(#r)">
    <text x="120" y="244">k = 3：ababab</text>
  </g>
  <g filter="url(#r)">
    <rect x="220" y="222" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="276" y="222" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="332" y="222" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="388" y="222" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="444" y="222" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="500" y="222" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="246" y="250" fill="#4a7a3a">a</text>
    <text x="302" y="250" fill="#4a7a3a">b</text>
    <text x="358" y="250" fill="#4a7a3a">a</text>
    <text x="414" y="250" fill="#4a7a3a">b</text>
    <text x="470" y="250" fill="#b85450">?</text>
    <text x="526" y="250" fill="#b85450">?</text>
  </g>
  <text x="560" y="250" font-size="14" font-weight="bold" fill="#b85450" filter="url(#r)">✗ 放不下</text>

  <text x="340" y="308" text-anchor="middle" font-size="13.5" fill="#3a5c2c" filter="url(#r)">单调性：word^k 出现 ⇒ word^(k−1) 必出现，故从 1 递增枚举、首次失败即停，答案 2</text>
</svg>
