<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：s = "bccb" 的填表顺序</text>

  <g filter="url(#rough2)">
    <rect x="150" y="42" width="58" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="179" y="66" text-anchor="middle" font-size="15" fill="#334">b</text>
    <rect x="216" y="42" width="58" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="245" y="66" text-anchor="middle" font-size="15" fill="#334">c</text>
    <rect x="282" y="42" width="58" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="311" y="66" text-anchor="middle" font-size="15" fill="#334">c</text>
    <rect x="348" y="42" width="58" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="377" y="66" text-anchor="middle" font-size="15" fill="#334">b</text>

    <text x="179" y="90" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="245" y="90" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="311" y="90" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="377" y="90" text-anchor="middle" font-size="10" fill="#888">3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="104" width="480" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="95" y="123" text-anchor="middle" font-size="10" fill="#334a66">区间</text>
    <text x="225" y="123" text-anchor="middle" font-size="10" fill="#334a66">子串 / 端点</text>
    <text x="385" y="123" text-anchor="middle" font-size="10" fill="#334a66">转移式</text>
    <text x="495" y="123" text-anchor="middle" font-size="10" fill="#334a66">f</text>

    <rect x="40" y="132" width="480" height="28" fill="#ffffff" stroke="#d5dde8" stroke-width="1.2"/>
    <text x="95" y="151" text-anchor="middle" font-size="10" fill="#555">[0,1]</text>
    <text x="188" y="151" text-anchor="middle" font-size="10" fill="#555">bc</text>
    <text x="258" y="151" text-anchor="middle" font-size="9.5" fill="#b85450">不同</text>
    <text x="385" y="151" text-anchor="middle" font-size="9.5" fill="#555">1 + 1 − 0 = 2</text>
    <text x="495" y="151" text-anchor="middle" font-size="10" font-weight="bold" fill="#334a66">2</text>

    <rect x="40" y="160" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="95" y="179" text-anchor="middle" font-size="10" fill="#555">[1,2]</text>
    <text x="188" y="179" text-anchor="middle" font-size="10" fill="#555">cc</text>
    <text x="258" y="179" text-anchor="middle" font-size="9.5" fill="#4a7a3a">相同，内部无 c</text>
    <text x="385" y="179" text-anchor="middle" font-size="9.5" fill="#555">2·0 + 2 = 2</text>
    <text x="495" y="179" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a20">2</text>

    <rect x="40" y="188" width="480" height="28" fill="#ffffff" stroke="#d5dde8" stroke-width="1.2"/>
    <text x="95" y="207" text-anchor="middle" font-size="10" fill="#555">[2,3]</text>
    <text x="188" y="207" text-anchor="middle" font-size="10" fill="#555">cb</text>
    <text x="258" y="207" text-anchor="middle" font-size="9.5" fill="#b85450">不同</text>
    <text x="385" y="207" text-anchor="middle" font-size="9.5" fill="#555">1 + 1 − 0 = 2</text>
    <text x="495" y="207" text-anchor="middle" font-size="10" font-weight="bold" fill="#334a66">2</text>

    <rect x="40" y="216" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="95" y="235" text-anchor="middle" font-size="10" fill="#555">[0,2]</text>
    <text x="188" y="235" text-anchor="middle" font-size="10" fill="#555">bcc</text>
    <text x="258" y="235" text-anchor="middle" font-size="9.5" fill="#b85450">不同</text>
    <text x="385" y="235" text-anchor="middle" font-size="9.5" fill="#555">2 + 2 − f[1][1] = 3</text>
    <text x="495" y="235" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a20">3</text>

    <rect x="40" y="244" width="480" height="28" fill="#ffffff" stroke="#d5dde8" stroke-width="1.2"/>
    <text x="95" y="263" text-anchor="middle" font-size="10" fill="#555">[1,3]</text>
    <text x="188" y="263" text-anchor="middle" font-size="10" fill="#555">ccb</text>
    <text x="258" y="263" text-anchor="middle" font-size="9.5" fill="#b85450">不同</text>
    <text x="385" y="263" text-anchor="middle" font-size="9.5" fill="#555">2 + 2 − f[2][2] = 3</text>
    <text x="495" y="263" text-anchor="middle" font-size="10" font-weight="bold" fill="#334a66">3</text>

    <rect x="40" y="272" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="95" y="292" text-anchor="middle" font-size="10" fill="#3a5a30">[0,3]</text>
    <text x="188" y="292" text-anchor="middle" font-size="10" fill="#3a5a30">bccb</text>
    <text x="258" y="292" text-anchor="middle" font-size="9.5" fill="#4a7a3a">相同，内部无 b</text>
    <text x="385" y="292" text-anchor="middle" font-size="9.5" fill="#3a5a30">2·f[1][2] + 2 = 6</text>
    <text x="495" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a30">6</text>
  </g>

  <text x="280" y="324" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">长度 1 的四个区间各贡献 1（单字符回文），是递推的基态</text>

  <g filter="url(#rough2)">
    <rect x="40" y="340" width="480" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#334a66">答案 f[0][3] = 6 = { b, c, bb, cc, bcb, bccb }</text>
    <text x="280" y="382" text-anchor="middle" font-size="9.5" fill="#777">"bcb" 可由下标 (0,1,3) 或 (0,2,3) 实现，但字符串相同只算一个</text>
  </g>

  <text x="280" y="420" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">端点相同的区间只有 [1,2] 与 [0,3]，其余都走「容斥」分支</text>
</svg>
