<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次排序，一次线性求和</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">答案 = 所有元素到中位数的绝对差之和</text>

  <rect x="40" y="70" width="140" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="110" y="95" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 排序</text>
  <text x="110" y="113" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">O(n log n)</text>

  <rect x="210" y="70" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="95" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 取中位数</text>
  <text x="280" y="113" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">m = nums[n / 2]</text>

  <rect x="380" y="70" width="140" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="95" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 累加绝对差</text>
  <text x="450" y="113" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">O(n)</text>

  <path d="M 184 98 L 205 98" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 354 98 L 375 98" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 128 L 280 153" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="158" width="360" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">ans = Σ |nums[i] − m|，返回 ans</text>
  <text x="280" y="201" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">中间量用 long long：单个差值可达 20 亿</text>

  <path d="M 200 216 L 158 233" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 216 L 402 233" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="238" width="230" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="155" y="259" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">偶数长度同样正确</text>
  <text x="155" y="277" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">m 取 nums[n/2−1] 或 nums[n/2]</text>
  <text x="155" y="294" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">两者给出同一个最小值</text>

  <rect x="290" y="238" width="230" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="405" y="259" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">等价写法：两头配对</text>
  <text x="405" y="277" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">l = 0, r = n − 1</text>
  <text x="405" y="294" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ans += a[r] − a[l]，再向中间收拢</text>

  <rect x="40" y="322" width="480" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="343" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">时间 O(n log n)：排序主导，取中位数与求和各 O(n)</text>
  <text x="58" y="362" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">空间 O(log n)：排序递归栈（Python 的 Timsort 最坏 O(n)）</text>

  <text x="280" y="392" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">进阶：用 nth_element / quickselect 找中位数，期望时间可降到 O(n)</text>
</svg>
