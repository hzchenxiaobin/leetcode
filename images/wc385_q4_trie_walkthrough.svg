<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="600" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">示例 1：Trie 逐步生长（绿字＝cnt，红字＝本次累加）</text>
  <path d="M 160 44 Q 340 52 520 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== panel borders ===== -->
  <g filter="url(#rough2)">
    <rect x="14" y="56" width="324" height="258" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.4"/>
    <rect x="342" y="56" width="324" height="258" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.4"/>
    <rect x="14" y="322" width="324" height="258" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.4"/>
    <rect x="342" y="322" width="324" height="258" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.4"/>
  </g>

  <!-- ===== panel 1: "a" ===== -->
  <text x="30" y="82" font-size="13" font-weight="bold" fill="#446688">① word＝"a"，border＝{1}</text>
  <g filter="url(#rough2)">
    <circle cx="70" cy="170" r="12" fill="#fffdf6" stroke="#888" stroke-width="1.5"/>
    <circle cx="170" cy="170" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <path d="M 82 170 L 154 170" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="120" y="158" text-anchor="middle" font-size="12" fill="#446688">a</text>
  <text x="170" y="175" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="186" y="156" font-size="11" fill="#4a7a3a" font-weight="bold">cnt=0</text>
  <text x="30" y="122" font-size="11" fill="#b85450" font-weight="bold">查询 d=1 "a"：cnt＝0 → ＋0</text>
  <text x="30" y="212" font-size="11" fill="#7a5415">插入后 cnt[a]＝1（下方绿字）</text>
  <text x="30" y="236" font-size="11" fill="#4a7a3a">新 Trie：root→a(1)</text>
  <g filter="url(#rough2)">
    <rect x="30" y="252" width="290" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="175" y="272" text-anchor="middle" font-size="12" fill="#2e5b22" font-weight="bold">ans ＝ 0</text>

  <!-- ===== panel 2: "aba" ===== -->
  <text x="358" y="82" font-size="13" font-weight="bold" fill="#446688">② word＝"aba"，border＝{1,3}</text>
  <g filter="url(#rough2)">
    <circle cx="60" cy="180" r="12" fill="#fffdf6" stroke="#888" stroke-width="1.5"/>
    <circle cx="150" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="240" cy="140" r="14" fill="#fffdf6" stroke="#999" stroke-width="1.5"/>
    <circle cx="330" cy="140" r="14" fill="#fffdf6" stroke="#999" stroke-width="1.5"/>
    <path d="M 71 174 L 138 146" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 164 140 L 224 140" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 254 140 L 314 140" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="105" y="146" text-anchor="middle" font-size="12" fill="#446688">a</text>
  <text x="202" y="128" text-anchor="middle" font-size="12" fill="#446688">b</text>
  <text x="287" y="128" text-anchor="middle" font-size="12" fill="#446688">a</text>
  <text x="150" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="240" y="145" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="330" y="145" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="166" y="126" font-size="11" fill="#4a7a3a" font-weight="bold">cnt=1</text>
  <text x="358" y="122" font-size="11" fill="#b85450" font-weight="bold">查询 d=1 "a"：cnt＝1 → ＋1</text>
  <text x="358" y="172" font-size="11" fill="#b85450">查询 d=3 "aba"：新建 → ＋0</text>
  <text x="358" y="196" font-size="11" fill="#7a5415">插入后 cnt[aba]＝1</text>
  <g filter="url(#rough2)">
    <rect x="358" y="252" width="290" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="503" y="272" text-anchor="middle" font-size="12" fill="#2e5b22" font-weight="bold">ans ＝ 0 ＋ 1 ＝ 1</text>

  <!-- ===== panel 3: "ababa" ===== -->
  <text x="30" y="348" font-size="13" font-weight="bold" fill="#446688">③ word＝"ababa"，border＝{1,3,5}</text>
  <g filter="url(#rough2)">
    <circle cx="56" cy="440" r="12" fill="#fffdf6" stroke="#888" stroke-width="1.5"/>
    <circle cx="120" cy="410" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="184" cy="410" r="14" fill="#fffdf6" stroke="#999" stroke-width="1.5"/>
    <circle cx="248" cy="410" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="248" cy="470" r="14" fill="#fffdf6" stroke="#999" stroke-width="1.5"/>
    <circle cx="248" cy="525" r="14" fill="#fffdf6" stroke="#999" stroke-width="1.5"/>
    <path d="M 66 433 L 108 417" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 134 410 L 168 410" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 198 410 L 232 410" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 248 424 L 248 454" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 248 484 L 248 509" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="88" y="412" text-anchor="middle" font-size="12" fill="#446688">a</text>
  <text x="161" y="398" text-anchor="middle" font-size="12" fill="#446688">b</text>
  <text x="216" y="398" text-anchor="middle" font-size="12" fill="#446688">a</text>
  <text x="285" y="435" text-anchor="middle" font-size="12" fill="#446688">b</text>
  <text x="285" y="492" text-anchor="middle" font-size="12" fill="#446688">a</text>
  <text x="120" y="415" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="184" y="415" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="248" y="415" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="248" y="475" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="248" y="530" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="136" y="396" font-size="11" fill="#4a7a3a" font-weight="bold">cnt=1</text>
  <text x="264" y="396" font-size="11" fill="#4a7a3a" font-weight="bold">cnt=1</text>
  <text x="30" y="386" font-size="11" fill="#b85450" font-weight="bold">d=1 "a"：＋1；d=3 "aba"：＋1</text>
  <text x="30" y="508" font-size="11" fill="#b85450">d=5 "ababa"：新建 → ＋0</text>
  <text x="30" y="532" font-size="11" fill="#7a5415">插入后 cnt[ababa]＝1</text>
  <g filter="url(#rough2)">
    <rect x="30" y="544" width="290" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="175" y="563" text-anchor="middle" font-size="12" fill="#2e5b22" font-weight="bold">ans ＝ 1 ＋ 1 ＋ 1 ＝ 3</text>

  <!-- ===== panel 4: "aa" ===== -->
  <text x="358" y="348" font-size="13" font-weight="bold" fill="#446688">④ word＝"aa"，border＝{1,2}</text>
  <g filter="url(#rough2)">
    <circle cx="70" cy="420" r="12" fill="#fffdf6" stroke="#888" stroke-width="1.5"/>
    <circle cx="160" cy="390" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="250" cy="390" r="14" fill="#fffdf6" stroke="#999" stroke-width="1.5"/>
    <circle cx="250" cy="465" r="14" fill="#fffdf6" stroke="#999" stroke-width="1.5"/>
    <path d="M 80 414 L 148 397" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 174 390 L 234 390" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 160 404 L 235 456" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="112" y="388" text-anchor="middle" font-size="12" fill="#446688">a</text>
  <text x="212" y="378" text-anchor="middle" font-size="12" fill="#446688">b</text>
  <text x="175" y="438" text-anchor="middle" font-size="12" fill="#446688">a</text>
  <text x="160" y="395" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="250" y="395" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="250" y="470" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="176" y="376" font-size="11" fill="#4a7a3a" font-weight="bold">cnt=1</text>
  <text x="358" y="388" font-size="11" fill="#b85450" font-weight="bold">查询 d=1 "a"：cnt＝1 → ＋1</text>
  <text x="358" y="440" font-size="11" fill="#b85450">查询 d=2 "aa"：新建 → ＋0</text>
  <text x="358" y="464" font-size="11" fill="#7a5415">插入后 cnt[aa]＝1</text>
  <text x="358" y="492" font-size="11" fill="#555">（上方主干即 ②③ 生长出的</text>
  <text x="358" y="510" font-size="11" fill="#555">root→a→b→…；"aa" 走 a 分叉）</text>
  <g filter="url(#rough2)">
    <rect x="358" y="544" width="290" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="503" y="563" text-anchor="middle" font-size="12" fill="#2e5b22" font-weight="bold">ans ＝ 3 ＋ 1 ＝ 4 ✓</text>
</svg>
