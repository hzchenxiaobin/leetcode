<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="510" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#333" filter="url(#rough2)">进阶 O(n²)：分界线只单向移动，两个前缀最大值干掉内层 k 循环</text>
  <path d="M 100 34 Q 340 42 580 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 切分点轴 -->
  <text x="340" y="56" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">D(k) = 左和 − 右和，k 每右移一步增加 2·value[k+1] &gt; 0 ⇒ D 严格递增</text>

  <g font-size="10.5" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="130" y="80">−6</text>
    <text x="190" y="80">−3</text>
    <text x="250" y="80">−1</text>
    <text x="310" y="80">0</text>
    <text x="370" y="80">+2</text>
    <text x="430" y="80">+5</text>
    <text x="490" y="80">+8</text>
    <text x="550" y="80">+12</text>
  </g>
  <g filter="url(#rough2)">
    <circle cx="130" cy="100" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="190" cy="100" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="250" cy="100" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="310" cy="100" r="13" fill="#e6f4ea" stroke="#446688" stroke-width="2.6"/>
    <circle cx="370" cy="100" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="430" cy="100" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="490" cy="100" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="550" cy="100" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#777" filter="url(#rough2)">
    <text x="130" y="128">k=l</text>
    <text x="190" y="128">·</text>
    <text x="250" y="128">·</text>
    <text x="310" y="128">·</text>
    <text x="370" y="128">·</text>
    <text x="430" y="128">·</text>
    <text x="490" y="128">·</text>
    <text x="550" y="128">k=r−1</text>
  </g>

  <!-- 平局点标注 -->
  <path d="M 318 84 Q 356 60 400 58" stroke="#8a6d1f" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="470" y="56" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">D=0 平局点：两区都包含它，max 自然覆盖</text>

  <!-- A 区 / B 区括线 -->
  <path d="M 117 142 L 117 150 L 323 150 L 323 142" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="220" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">A 区（D≤0，留左）：候选 = 左和 + dp[l][k] —— 是一段前缀</text>
  <path d="M 297 178 L 297 186 L 563 186 L 563 178" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="430" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">B 区（D≥0，留右）：候选 = 右和 + dp[k+1][r] —— 是一段后缀</text>

  <!-- 左面板：固定 l，r 增大 -->
  <g filter="url(#rough2)">
    <rect x="20" y="218" width="312" height="158" rx="8" fill="#f4f9f4" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="176" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">固定 l，让 r 增大 ⇒ A 区右端 ka 右移</text>

  <g filter="url(#rough2)">
    <rect x="42" y="254" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="70" y="254" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="98" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="126" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="154" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="182" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="210" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="238" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="292" y="268" font-size="10" fill="#888" filter="url(#rough2)">r 小</text>

  <g filter="url(#rough2)">
    <rect x="42" y="282" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="70" y="282" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="98" y="282" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="126" y="282" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="154" y="282" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="182" y="282" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="210" y="282" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="238" y="282" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="42" y="310" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="70" y="310" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="98" y="310" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="126" y="310" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="154" y="310" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="182" y="310" width="24" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="210" y="310" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="238" y="310" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="292" y="324" font-size="10" fill="#888" filter="url(#rough2)">r 大</text>
  <path d="M 250 348 Q 270 342 290 346" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#rough2)"/>
  <text x="176" y="358" text-anchor="middle" font-size="9.8" fill="#2e6e2e" filter="url(#rough2)">右和随 r 变大 ⇒ 窗口只扩不缩</text>

  <text x="176" y="374" text-anchor="middle" font-size="9.8" fill="#333" filter="url(#rough2)">新 k 进窗口时更新 runA = max(runA, dp[l][k] + pre[k+1])</text>

  <!-- 右面板：固定 r，l 减小 -->
  <g filter="url(#rough2)">
    <rect x="348" y="218" width="312" height="158" rx="8" fill="#f4f7fa" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="504" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">固定 r，让 l 减小 ⇒ B 区左端 kb 左移</text>

  <g filter="url(#rough2)">
    <rect x="370" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="398" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="426" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="454" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="482" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="510" y="254" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="538" y="254" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="566" y="254" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="362" y="268" font-size="10" fill="#888" filter="url(#rough2)">l 大</text>

  <g filter="url(#rough2)">
    <rect x="370" y="282" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="398" y="282" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="426" y="282" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="454" y="282" width="24" height="20" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <rect x="482" y="282" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="510" y="282" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="538" y="282" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="566" y="282" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="370" y="310" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="398" y="310" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="426" y="310" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="454" y="310" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="482" y="310" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="510" y="310" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="538" y="310" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="566" y="310" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="362" y="324" font-size="10" fill="#888" filter="url(#rough2)">l 小</text>
  <path d="M 430 348 Q 410 342 390 346" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#rough2)"/>
  <text x="504" y="358" text-anchor="middle" font-size="9.8" fill="#2b4a66" filter="url(#rough2)">左和随 l 减小而变大 ⇒ 窗口只扩不缩</text>

  <text x="504" y="374" text-anchor="middle" font-size="9.8" fill="#333" filter="url(#rough2)">新 k 进窗口时更新 runB[r] = max(runB[r], dp[k+1][r] − pre[k+1])</text>

  <!-- 底部：循环次序与复杂度 -->
  <g filter="url(#rough2)">
    <rect x="20" y="390" width="424" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="232" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">循环次序（保证依赖就绪）</text>
  <text x="232" y="434" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">外层 l 从 n−1 递减：算 dp[l][r] 时用到的 dp[k+1][r]</text>
  <text x="232" y="450" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">（k+1 &gt; l）早在更大的 l 轮算好；</text>
  <text x="232" y="466" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">内层 r 从 l+1 递增：dp[l][k]（k &lt; r）</text>
  <text x="232" y="482" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">是本轮更早的 r，也已就绪</text>

  <g filter="url(#rough2)">
    <rect x="460" y="390" width="200" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="560" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">复杂度</text>
  <text x="560" y="438" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">指针 p 每 l 一根，q[r] 每 r 一根</text>
  <text x="560" y="454" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">全程各自单向移动 ⇒ 总步数 O(n²)</text>
  <text x="560" y="476" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">n = 500 时 Python 仅 ~0.1 秒</text>
</svg>
