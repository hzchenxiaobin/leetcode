<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="610" height="540" fill="#fafafa"/>

  <!-- 开始 -->
  <ellipse cx="280" cy="44" rx="52" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="49" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 280 66 L 280 82" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 预计算列最大值 -->
  <rect x="170" y="86" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">预计算每列最大值 colMax[j]</text>
  <path d="M 280 128 L 280 144" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 复制矩阵 -->
  <rect x="170" y="148" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">answer = matrix 的副本</text>
  <path d="M 280 190 L 280 206" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取下一格 -->
  <rect x="170" y="210" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取下一格 (i, j)</text>
  <path d="M 280 252 L 280 280" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="280,284 370,338 280,392 190,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">answer[i][j] == −1 ?</text>

  <text x="378" y="330" font-size="13" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 370 338 L 410 338" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 替换框 -->
  <rect x="414" y="316" width="155" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="491" y="333" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">替换 answer[i][j]</text>
  <text x="491" y="350" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">= colMax[j]</text>

  <!-- 替换框汇合到主干 -->
  <path d="M 491 360 C 491 412 480 424 458 424 L 294 424" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="290" y="404" font-size="13" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 280 392 L 280 418" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 汇合点 -->
  <circle cx="280" cy="424" r="4" fill="#446688" filter="url(#rough2)"/>

  <!-- 回边：还有格子 -->
  <path d="M 280 424 L 118 424 Q 98 424 98 404 L 98 251 Q 98 231 118 231 L 164 231" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="300" font-size="12" fill="#666" filter="url(#rough2)">未遍历完</text>

  <!-- 遍历完成 → 返回 -->
  <path d="M 280 424 L 280 460" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="448" font-size="12" fill="#666" filter="url(#rough2)">遍历完成</text>

  <ellipse cx="280" cy="486" rx="58" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="491" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">返回 answer</text>
</svg>
