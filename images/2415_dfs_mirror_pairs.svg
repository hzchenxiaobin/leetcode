<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">解法二：镜像成对 DFS —— dfs(u, v, d) 同时走两个对称位</text>
  <path d="M 130 44 Q 340 52 550 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><path d="M 200 127 L 140 170" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 200 127 L 260 170" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 135 202 L 105 238" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 135 202 L 165 238" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 265 202 L 235 238" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 265 202 L 295 238" stroke="#446688" stroke-width="1.6" fill="none"/></g>

  <g filter="url(#sk)"><circle cx="200" cy="110" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="200" y="115" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="135" cy="185" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="135" y="190" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">u=3</text>
  <g filter="url(#sk)"><circle cx="265" cy="185" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="265" y="190" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">v=5</text>

  <g filter="url(#sk)"><circle cx="105" cy="255" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="105" y="260" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">u.L</text>
  <g filter="url(#sk)"><circle cx="170" cy="255" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="170" y="260" text-anchor="middle" font-size="10.5" fill="#a03a3a" filter="url(#sk)">u.R</text>
  <g filter="url(#sk)"><circle cx="230" cy="255" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="230" y="260" text-anchor="middle" font-size="10.5" fill="#a03a3a" filter="url(#sk)">v.L</text>
  <g filter="url(#sk)"><circle cx="295" cy="255" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="295" y="260" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">v.R</text>

  <g filter="url(#sk)"><path d="M 152 180 Q 200 162 248 180" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-start="url(#arrR)" marker-end="url(#arrR)"/></g>
  <text x="200" y="154" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">d=1 奇 ⟹ swap(u,v)</text>

  <g filter="url(#sk)"><path d="M 105 274 Q 200 330 295 274" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-start="url(#arrG)" marker-end="url(#arrG)"/></g>
  <text x="200" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">dfs(u.L, v.R, d+1)：外侧配对</text>

  <g filter="url(#sk)"><path d="M 170 274 Q 200 292 230 274" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 4" marker-start="url(#arrR)" marker-end="url(#arrR)"/></g>
  <text x="200" y="350" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">dfs(u.R, v.L, d+1)：内侧配对</text>

  <g filter="url(#sk)"><rect x="42" y="368" width="316" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="200" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">入口：dfs(root-&gt;left, root-&gt;right, 1)</text>
  <text x="200" y="414" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">d 奇：swap(u-&gt;val, v-&gt;val)</text>
  <text x="200" y="436" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">u 为空即返回（完美树 u、v 同生同灭）</text>

  <g filter="url(#sk)"><rect x="378" y="62" width="262" height="180" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="509" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">为什么恰好覆盖整层？</text>
  <text x="509" y="112" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">每次调用站在「层内第 i 个」u 与</text>
  <text x="509" y="130" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">「倒数第 i 个」v 两个镜像位上</text>
  <text x="509" y="156" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">递归 (u.L, v.R)、(u.R, v.L) 恰好把</text>
  <text x="509" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">下一层的「2i, 2i+1 ↔ 倒数」配对续上</text>
  <text x="509" y="200" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">每对对称节点恰好被访问一次，</text>
  <text x="509" y="218" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">交换在「路过」时顺带完成——</text>
  <text x="509" y="236" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">与 LC 101 对称二叉树同一套遍历</text>

  <g filter="url(#sk)"><rect x="378" y="262" width="262" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="509" y="286" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">空间 O(log n)：栈深 = 树高</text>
  <text x="509" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">n ≤ 2^14 ⟹ 树高 ≤ 13，栈深 ≤ 14</text>
  <text x="509" y="330" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">不用队列存「最宽一层」≈ n/2 个节点</text>

  <g filter="url(#sk)"><rect x="378" y="368" width="262" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="509" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">前提：完美二叉树</text>
  <text x="509" y="414" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">左右子树形状严格镜像，配对才不落空；</text>
  <text x="509" y="432" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">任意二叉树上此法失效，</text>
  <text x="509" y="450" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">BFS 逐层反转仍然成立（见延伸思考）</text>
</svg>
