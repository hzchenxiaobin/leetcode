<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="960" height="545" fill="#fdfcf7"/>

  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：一次交换是对合，补前导零恢复对称——「或」塌缩成单向</text>
  <path d="M 200 42 Q 480 50 760 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 左上：数值层面不对称 ============ -->
  <rect x="60" y="62" width="400" height="132" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="260" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">坑：裸数值层面，30 → 3 是单向的</text>

  <g font-size="13">
    <rect x="92" y="102" width="52" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="118" y="122" text-anchor="middle" fill="#2b4a6e" font-weight="bold">30</text>
    <path d="M 152 116 L 210 116" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
    <text x="181" y="108" text-anchor="middle" font-size="9.5" fill="#2b6e9e">换 3 和 0</text>
    <rect x="216" y="102" width="78" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" filter="url(#sk)"/>
    <text x="255" y="122" text-anchor="middle" fill="#2e6e2e" font-weight="bold">"03"=3</text>

    <rect x="330" y="102" width="52" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="356" y="122" text-anchor="middle" fill="#2b4a6e" font-weight="bold">3</text>
    <path d="M 330 116 C 300 108, 290 118, 298 116" stroke="#b85450" stroke-width="0" fill="none" filter="url(#sk)"/>
    <text x="388" y="120" font-size="20" fill="#b03a3a" font-weight="bold">✗</text>
  </g>
  <text x="118" y="152" font-size="10.5" fill="#666">只有一位，换不动 ←</text>
  <text x="76" y="176" font-size="11" fill="#444">数值不同长 ⇒ 对称性被前导 0 打破：</text>
  <text x="76" y="186" font-size="11" fill="#b03a3a" font-weight="bold">「x 变 y 或 y 变 x」看似必须双向判定</text>

  <!-- ============ 右上：补零串对称恢复 ============ -->
  <rect x="500" y="62" width="400" height="132" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="700" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">修法：全部补前导 0 到定长 7 位，对称恢复</text>

  <g font-size="13" font-family="'Comic Sans MS','Courier New',monospace">
    <rect x="528" y="104" width="120" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="588" y="124" text-anchor="middle" fill="#2b4a6e" font-weight="bold">0000030</text>
    <path d="M 656 116 L 716 116" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
    <path d="M 716 128 L 656 128" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
    <text x="686" y="100" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-weight="bold">换第 5,6 位</text>
    <rect x="722" y="104" width="120" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="782" y="124" text-anchor="middle" fill="#2b4a6e" font-weight="bold">0000003</text>
  </g>
  <text x="516" y="152" font-size="11" fill="#444">位数对齐 ⇒ 同两位再换一次就还原（对合），</text>
  <text x="516" y="168" font-size="11" fill="#2e6e2e" font-weight="bold">x 一步到 y ⟺ y 一步到 x，双向等价</text>
  <text x="516" y="184" font-size="10.5" fill="#888">nums[i] ≤ 10⁶ ⇒ 位数 ≤ 7，统一补到 7 位</text>

  <!-- ============ 中部：S(x) 定义与判定塌缩 ============ -->
  <rect x="60" y="212" width="840" height="108" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <text x="76" y="236" font-size="12.5" fill="#7a5415" font-weight="bold">定义变体集合：S(x) = {x} ∪ {x 的一次交换变体}（7 位补零串生成、数值化、去重）</text>
  <g font-size="12">
    <rect x="92" y="250" width="64" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="124" y="268" text-anchor="middle" fill="#2b4a6e" font-weight="bold">12</text>
    <path d="M 164 263 L 196 263" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <rect x="202" y="250" width="310" height="26" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#sk)"/>
    <text x="357" y="268" text-anchor="middle" fill="#7a5415">S(12) = {12, 21, 102, 120, 1002, …}</text>
  </g>
  <text x="540" y="256" font-size="12.5" fill="#7a5415" font-weight="bold">判定塌缩：近似相等 ⟺ y ∈ S(x)（只需查一个方向！）</text>
  <text x="540" y="274" font-size="10.5" fill="#444">或条件两半由对称性等价 —— 哈希计数的前提</text>
  <text x="76" y="300" font-size="11" fill="#444">「含自身」这一项覆盖零次操作（相等即近似相等）；去重保证每个数对至多计一次</text>

  <!-- ============ 下部：三个观察框 ============ -->
  <rect x="60" y="338" width="262" height="128" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="76" y="360" font-size="12" fill="#2b6e9e" font-weight="bold">观察 1：swap 是对合</text>
  <g font-size="10.5" fill="#444">
    <text x="76" y="382">σ(i,j) ∘ σ(i,j) = id</text>
    <text x="76" y="400">同样两位再换一次就还原，</text>
    <text x="76" y="418">「换回来」零拷贝复用同一串：</text>
    <text x="76" y="436">换 → 数值化入 S → 换回</text>
    <text x="76" y="456" fill="#b03a3a" font-weight="bold">不换回 = 叠成两步交换，答案算大</text>
  </g>

  <rect x="349" y="338" width="262" height="128" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="365" y="360" font-size="12" fill="#2e6e2e" font-weight="bold">观察 2：补零修复对称</text>
  <g font-size="10.5" fill="#444">
    <text x="365" y="382">数值层 30→3 单向；串层</text>
    <text x="365" y="400">"0000030"⇄"0000003" 双向。</text>
    <text x="365" y="418">统一定长 7 位 = 统一交换</text>
    <text x="365" y="436">位置空间（C(7,2)=21 种）</text>
    <text x="365" y="456" fill="#2e6e2e" font-weight="bold">位数差异被前导 0 抹平</text>
  </g>

  <rect x="638" y="338" width="262" height="128" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4" filter="url(#sk)"/>
  <text x="654" y="360" font-size="12" fill="#5a3a7a" font-weight="bold">观察 3：先查后插一趟计数</text>
  <g font-size="10.5" fill="#444">
    <text x="654" y="382">seen 记之前的原值次数，</text>
    <text x="654" y="400">ans += Σ seen[v], v ∈ S(x)，</text>
    <text x="654" y="418">然后 seen[x] += 1。</text>
    <text x="654" y="436">两数之和模板：键从一个</text>
    <text x="654" y="456" fill="#5a3a7a" font-weight="bold">target 扩成一个变体集合</text>
  </g>

  <!-- 底部反例条 -->
  <rect x="60" y="484" width="840" height="42" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="480" y="502" text-anchor="middle" font-size="11" fill="#666">反例警戒：[213, 132] → 0 —— S(213) ∩ S(132) ∋ {123, 312, 231} 交集非空，</text>
  <text x="480" y="518" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">但互不为对方的一步变体（三循环需两步）：判据是 y ∈ S(x)，不是集合相交</text>
</svg>
