<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums ＝ [1, 1, 1]，k ＝ 2</text>
  <text x="300" y="48" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">先查询 cnt[pre − k]，再把 pre 计入 cnt —— 顺序保证子数组非空</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="40" y="62" width="540" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="68"  y="83" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">j</text>
    <text x="131" y="83" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">pre</text>
    <text x="209" y="83" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">pre − k</text>
    <text x="298" y="83" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">cnt[pre − k]</text>
    <text x="374" y="83" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">ans</text>
    <text x="492" y="83" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">插入后 cnt</text>
  </g>

  <!-- row j=0 -->
  <g filter="url(#rough2)">
    <rect x="40" y="94" width="540" height="34" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1" rx="3"/>
    <text x="68"  y="116" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="131" y="116" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="209" y="116" text-anchor="middle" font-size="12" fill="#999">—</text>
    <text x="298" y="116" text-anchor="middle" font-size="12" fill="#999">—</text>
    <text x="374" y="116" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="492" y="116" text-anchor="middle" font-size="11" fill="#666">{0: 1}</text>
  </g>

  <!-- row j=1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="128" width="540" height="34" fill="#f7f9fc" stroke="#cfd8e3" stroke-width="1.1" rx="3"/>
    <text x="68"  y="150" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="131" y="150" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="209" y="150" text-anchor="middle" font-size="12" fill="#333">−1</text>
    <text x="298" y="150" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="374" y="150" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="492" y="150" text-anchor="middle" font-size="11" fill="#666">{0: 1, 1: 1}</text>
  </g>

  <!-- row j=2 : hit -->
  <g filter="url(#rough2)">
    <rect x="40" y="162" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="68"  y="184" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="131" y="184" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="209" y="184" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="298" y="184" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1 ✔</text>
    <text x="374" y="184" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="492" y="184" text-anchor="middle" font-size="11" fill="#666">{0: 1, 1: 1, 2: 1}</text>
  </g>

  <!-- row j=3 : hit -->
  <g filter="url(#rough2)">
    <rect x="40" y="196" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="68"  y="218" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="131" y="218" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="209" y="218" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="298" y="218" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">1 ✔</text>
    <text x="374" y="218" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">2</text>
    <text x="492" y="218" text-anchor="middle" font-size="11" fill="#666">{0: 1, 1: 1, 2: 1, 3: 1}</text>
  </g>

  <!-- grid verticals -->
  <g filter="url(#rough2)">
    <line x1="96"  y1="62" x2="96"  y2="230" stroke="#cfd8e3" stroke-width="1"/>
    <line x1="166" y1="62" x2="166" y2="230" stroke="#cfd8e3" stroke-width="1"/>
    <line x1="252" y1="62" x2="252" y2="230" stroke="#cfd8e3" stroke-width="1"/>
    <line x1="344" y1="62" x2="344" y2="230" stroke="#cfd8e3" stroke-width="1"/>
    <line x1="404" y1="62" x2="404" y2="230" stroke="#cfd8e3" stroke-width="1"/>
  </g>

  <text x="40" y="254" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">两次命中 ⟺ 恰好两个子数组的和为 2 ⟹ ans ＝ 2</text>

  <!-- subarray A -->
  <g filter="url(#rough2)">
    <rect x="140" y="266" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <text x="162" y="289" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="186" y="266" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <text x="208" y="289" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="232" y="266" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="254" y="289" text-anchor="middle" font-size="15" fill="#999">1</text>

    <text x="162" y="316" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="208" y="316" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="254" y="316" text-anchor="middle" font-size="10" fill="#999">2</text>

    <text x="300" y="289" font-size="12" fill="#4a7a3a">i ＝ 0, j ＝ 2　nums[0..1] 和 ＝ 2</text>
  </g>

  <!-- subarray B -->
  <g filter="url(#rough2)">
    <rect x="140" y="336" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="162" y="359" text-anchor="middle" font-size="15" fill="#999">1</text>
    <rect x="186" y="336" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5"/>
    <text x="208" y="359" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="232" y="336" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5"/>
    <text x="254" y="359" text-anchor="middle" font-size="15" fill="#333">1</text>

    <text x="162" y="386" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="208" y="386" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="254" y="386" text-anchor="middle" font-size="10" fill="#999">2</text>

    <text x="300" y="359" font-size="12" fill="#d6a040">i ＝ 1, j ＝ 3　nums[1..2] 和 ＝ 2</text>
  </g>
</svg>
