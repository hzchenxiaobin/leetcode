<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描维护前两大</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个 x 只可能触发「降级」「更新次大」「跳过」三种动作之一</text>

  <rect x="120" y="56" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="79" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">mx1 = mx2 = −1</text>

  <path d="M 230 92 L 230 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="106" font-size="9.5" fill="#888" filter="url(#rough2)">对每个 x 重复此判断</text>


  <polygon points="230,112 306,148 230,184 154,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="152" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">x ≥ mx1 ?</text>

  <path d="M 306 148 L 342 148" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="350" y="124" width="196" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="448" y="144" text-anchor="middle" font-size="11.5" fill="#3a5a2a" filter="url(#rough2)">mx2 = mx1</text>
  <text x="448" y="163" text-anchor="middle" font-size="11.5" fill="#3a5a2a" filter="url(#rough2)">mx1 = x（旧最大降级）</text>

  <path d="M 230 184 L 230 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="200" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <polygon points="230,210 300,242 230,274 160,242" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="246" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">x &gt; mx2 ?</text>

  <path d="M 160 242 L 126 242" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="143" y="235" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="16" y="218" width="104" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="68" y="248" text-anchor="middle" font-size="11.5" fill="#3a5a2a" filter="url(#rough2)">mx2 = x</text>

  <path d="M 230 274 L 230 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="290" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <rect x="150" y="300" width="160" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="230" y="322" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">不更新，跳过</text>

  <path d="M 230 334 L 230 366" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="368" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="393" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">返回 (mx1 − 1) × (mx2 − 1)</text>

  <text x="280" y="428" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不变式：mx1 ≥ mx2 ≥ 已扫描的其余元素，且 mx1、mx2 来自不同下标</text>
</svg>
