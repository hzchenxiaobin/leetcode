<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">暴力视角：两个交换独立，共 2×2 = 4 种可达状态</text>

  <!-- 状态树 -->
  <g filter="url(#rough2)">
    <!-- 根 -->
    <rect x="280" y="52" width="80" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="320" y="74" text-anchor="middle" font-size="14" fill="#333">"abcd"</text>

    <!-- 第一层：swap(0,2) 与否 -->
    <path d="M 300 86 C 240 104, 190 112, 150 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 340 86 C 400 104, 450 112, 490 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="180" y="104" font-size="11" fill="#888">不动</text>
    <text x="446" y="104" font-size="11" fill="#888">swap(0,2)</text>

    <rect x="100" y="124" width="80" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="140" y="145" text-anchor="middle" font-size="13.5" fill="#333">abcd</text>
    <rect x="460" y="124" width="80" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="500" y="145" text-anchor="middle" font-size="13.5" fill="#333">cbad</text>

    <!-- 第二层 -->
    <path d="M 130 156 C 110 172, 90 180, 70 190" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 150 156 C 170 172, 190 180, 210 190" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 490 156 C 470 172, 450 180, 430 190" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 510 156 C 530 172, 550 180, 570 190" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <rect x="30" y="192" width="80" height="32" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.4"/>
    <text x="70" y="213" text-anchor="middle" font-size="13.5" fill="#333">abcd</text>
    <rect x="170" y="192" width="80" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="210" y="213" text-anchor="middle" font-size="13.5" fill="#4a7a3a">adcb</text>
    <rect x="390" y="192" width="80" height="32" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.4"/>
    <text x="430" y="213" text-anchor="middle" font-size="13.5" fill="#333">cbad</text>
    <rect x="530" y="192" width="80" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="570" y="213" text-anchor="middle" font-size="13.5" fill="#4a7a3a">cdab</text>

    <text x="70" y="242" text-anchor="middle" font-size="10.5" fill="#888">不动+不动</text>
    <text x="210" y="242" text-anchor="middle" font-size="10.5" fill="#888">不动+swap(1,3)</text>
    <text x="430" y="242" text-anchor="middle" font-size="10.5" fill="#888">swap02+不动</text>
    <text x="570" y="242" text-anchor="middle" font-size="10.5" fill="#888">swap02+swap13</text>
  </g>

  <!-- 对比 -->
  <g filter="url(#rough2)">
    <rect x="80" y="262" width="480" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="320" y="281" text-anchor="middle" font-size="12.5" fill="#4a7a3a">s2 = "cdab" 出现在第 4 种状态 → true（示例 1）</text>
    <text x="320" y="298" text-anchor="middle" font-size="12.5" fill="#b85450">s2 = "dacb"：4 种状态全不含 → false（示例 2，dacb 的 d 在奇轨道却要占偶轨道）</text>
  </g>

  <g filter="url(#rough2)">
    <text x="320" y="332" text-anchor="middle" font-size="12.5" fill="#333">轨道视角一眼判定：{a,c}↔{c,a} ✓ 且 {b,d}↔{d,b} ✓ → true，无需枚举</text>
    <text x="320" y="352" text-anchor="middle" font-size="11.5" fill="#888">枚举 4 状态是长度 4 的巧合；轨道多重集判定对任意长度成立（→ Q2）</text>
  </g>
</svg>
