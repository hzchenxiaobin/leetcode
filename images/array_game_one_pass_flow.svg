<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="22" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">单趟扫描流程：O(n) 时间，与 k 无关</text>
  <path d="M 180 32 Q 320 40 460 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="210" y="44" width="220" height="34" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="320" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">cur = arr[0]，cnt = 0，i = 1</text>
  <path d="M 320 78 V 92" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- diamond L: loop condition -->
  <g filter="url(#sk)">
    <polygon points="320,96 415,130 320,164 225,130" fill="#ffffff" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="135" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">i ≤ n−1 ？</text>

  <!-- no: exit with max -->
  <path d="M 415 130 H 520 V 152" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="462" y="122" font-size="11.5" font-weight="bold" fill="#666">否</text>
  <g filter="url(#sk)">
    <rect x="430" y="152" width="180" height="48" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="520" y="173" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">返回 cur</text>
  <text x="520" y="190" text-anchor="middle" font-size="10.5" fill="#7a5415">（= max(arr)，必为赢家）</text>

  <!-- yes: compare -->
  <path d="M 320 164 V 186" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="333" y="179" font-size="11.5" font-weight="bold" fill="#666">是</text>
  <g filter="url(#sk)">
    <polygon points="320,190 415,224 320,258 225,224" fill="#ffffff" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="229" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">arr[i] &gt; cur ？</text>

  <!-- yes: new champion -->
  <path d="M 225 224 H 130 V 259" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="168" y="216" font-size="11.5" font-weight="bold" fill="#666">是</text>
  <g filter="url(#sk)">
    <rect x="40" y="259" width="180" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="130" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">cur = arr[i]（换擂）</text>
  <text x="130" y="296" text-anchor="middle" font-size="10.5" fill="#2b6e9e">cnt = 1（新擂主首胜）</text>

  <!-- no: defend -->
  <path d="M 415 224 H 510 V 259" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="456" y="216" font-size="11.5" font-weight="bold" fill="#666">否</text>
  <g filter="url(#sk)">
    <rect x="420" y="259" width="180" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="510" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">cnt += 1</text>
  <text x="510" y="296" text-anchor="middle" font-size="10.5" fill="#2e6e2e">（擂主卫冕成功）</text>

  <!-- converge -->
  <path d="M 130 307 V 322 H 314" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
  <path d="M 510 307 V 322 H 326" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
  <path d="M 320 322 V 332" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- diamond B: streak check -->
  <g filter="url(#sk)">
    <polygon points="320,338 405,372 320,406 235,372" fill="#ffffff" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="377" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">cnt == k ？</text>

  <!-- yes: winner -->
  <path d="M 405 372 H 510 V 399" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="450" y="364" font-size="11.5" font-weight="bold" fill="#666">是</text>
  <g filter="url(#sk)">
    <rect x="420" y="399" width="180" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="510" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 cur</text>
  <text x="510" y="437" text-anchor="middle" font-size="10.5" fill="#2e6e2e">（k 连胜达成，游戏结束）</text>

  <!-- no: advance i -->
  <path d="M 320 406 V 428" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="333" y="422" font-size="11.5" font-weight="bold" fill="#666">否</text>
  <g filter="url(#sk)">
    <rect x="270" y="428" width="100" height="30" rx="8" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
  </g>
  <text x="320" y="447" text-anchor="middle" font-size="12" fill="#444">i += 1</text>

  <!-- loop back -->
  <path d="M 270 443 H 26 V 130 H 217" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="100" y="437" font-size="10" fill="#999">下一轮</text>

  <text x="320" y="482" text-anchor="middle" font-size="10.5" fill="#999">循环体至多执行 n−1 次 —— 无论 k 有多大</text>
</svg>
