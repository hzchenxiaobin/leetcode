<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">每秒把 t 位内存扣给"剩余较多"的一条；t 从 1 起逐秒 +1</text>

  <!-- 内存条 1 -->
  <text x="52" y="86" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">内存条 1</text>
  <text x="52" y="104" font-size="10.5" fill="#888" filter="url(#rough2)">初始 8 位</text>
  <g filter="url(#rough2)">
    <rect x="150" y="70" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="270" y="70" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <text x="210" y="95" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第 3 秒 −3</text>
  <text x="370" y="95" text-anchor="middle" font-size="12" fill="#943029" font-weight="bold" filter="url(#rough2)">第 5 秒 −5</text>
  <text x="478" y="95" font-size="11" fill="#943029" font-weight="bold" filter="url(#rough2)">剩 0</text>

  <!-- 内存条 2 -->
  <text x="52" y="176" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">内存条 2</text>
  <text x="52" y="194" font-size="10.5" fill="#888" filter="url(#rough2)">初始 11 位</text>
  <g filter="url(#rough2)">
    <rect x="150" y="160" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="190" y="160" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="270" y="160" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="430" y="160" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <text x="170" y="185" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="230" y="185" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第 2 秒</text>
  <text x="350" y="185" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第 4 秒 −4</text>
  <text x="450" y="185" text-anchor="middle" font-size="10.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">剩4</text>

  <!-- 时间轴 -->
  <path d="M 60 250 L 500 250" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="10.5" text-anchor="middle" fill="#666" filter="url(#rough2)">
    <text x="80" y="272">t=1</text><text x="150" y="272">t=2</text><text x="230" y="272">t=3</text>
    <text x="320" y="272">t=4</text><text x="410" y="272">t=5</text>
  </g>
  <g filter="url(#rough2)">
    <circle cx="80" cy="250" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="150" cy="250" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="230" cy="250" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="320" cy="250" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="410" cy="250" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="480" cy="250" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="480" y="272" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=6</text>

  <!-- 崩溃说明 -->
  <rect x="60" y="296" width="440" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="76" y="320" font-size="12" fill="#943029" font-weight="bold" filter="url(#rough2)">第 6 秒：条 1 剩 0、条 2 剩 4，max = 4 &lt; 6</text>
  <text x="76" y="342" font-size="11.5" fill="#943029" filter="url(#rough2)">两条都付不起第 6 秒的账单 → 程序崩溃，返回 [6, 0, 4]</text>
</svg>
