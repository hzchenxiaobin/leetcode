<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：两趟增量扫描，桶乘积被摊到每个左端点上</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">窗口只扩不缩 → seen[26] + 计数器 d 每步 O(1)；d 最大 26，桶即数组下标</text>

  <!-- Step 1 -->
  <rect x="56" y="64" width="528" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="88" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">阶段一：预处理 right 表（对每个起点 p）</text>
  <text x="76" y="112" font-size="11" fill="#444" filter="url(#rough2)">p 从 0 到 n−1：k 从 p 向右扫到 n−1，并入 s[k] 时若未见过则 d++</text>
  <text x="76" y="134" font-size="11" fill="#444" filter="url(#rough2)">right[p][d] += 1　→　right[p][d] = R_p(d)：以 p 开头、恰 d 个不同字符的子串数</text>
  <text x="76" y="160" font-size="10.5" fill="#888" filter="url(#rough2)">共 n(n+1)/2 步；表大小 n×27，与 j 的扫描顺序无关，一次算完</text>

  <path d="M320,180 L320,196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="56" y="204" width="528" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="228" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">阶段二：枚举边界 j，向左扫左端点 i</text>
  <text x="76" y="252" font-size="11" fill="#444" filter="url(#rough2)">j 从 0 到 n−2：i 从 j 向左扫到 0，并入 s[i] 时若未见过则 d++（d = distinct(s[i..j])）</text>
  <text x="76" y="274" font-size="11" fill="#444" filter="url(#rough2)">ans += right[j+1][d]　←　把 L 侧每个 i 的贡献摊进对应桶</text>
  <text x="76" y="300" font-size="10.5" fill="#888" filter="url(#rough2)">等价于 Σ_j Σ_d L_j(d)·R_(j+1)(d)：L 侧不显式建桶，边扫边消费 right 表</text>

  <path d="M320,320 L320,336" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="56" y="344" width="528" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="367" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="320" y="385" text-anchor="middle" font-size="10.5" fill="#8a6a1a" filter="url(#rough2)">时间 O(n²)，空间 O(26n)；n = 2000 时约 4×10⁶ 次基本操作</text>

  <text x="320" y="424" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">顺序陷阱：阶段二的每一步都要读 right[j+1]，因此 right 表必须先完整算好</text>
</svg>
