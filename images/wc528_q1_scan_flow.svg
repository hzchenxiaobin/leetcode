<svg xmlns="http://www.w3.org/2000/svg" width="680" height="552" viewBox="0 0 680 552" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="680" height="552" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：固定左端点，右端点逐个右扩</text>
  <path d="M 128 38 Q 340 46 552 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <ellipse cx="300" cy="58" rx="96" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="240,120 300,96 360,120 300,144" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="460" y="104" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="150" y="164" width="300" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="200" y="216" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="245,294 300,270 355,294 300,318" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="120" y="340" width="360" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <polygon points="222,450 300,424 378,450 300,476" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="62" y="434" width="126" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="150" y="496" width="300" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>

  <text x="300" y="63" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">开始：ans ← 0</text>
  <text x="300" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">l ＜ n ?</text>
  <text x="535" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">返回 ans</text>
  <text x="300" y="186" text-anchor="middle" font-size="13" fill="#2e5a24" filter="url(#rough2)">cur_and ← cur_min ← nums[l]</text>
  <text x="300" y="236" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">r ← l</text>
  <text x="300" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">r ＜ n ?</text>
  <text x="300" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#rough2)">右端点右扩一格</text>
  <text x="300" y="382" text-anchor="middle" font-size="12.5" fill="#8a6415" filter="url(#rough2)">cur_and ← cur_and AND nums[r]</text>
  <text x="300" y="401" text-anchor="middle" font-size="12.5" fill="#8a6415" filter="url(#rough2)">cur_min ← min(cur_min, nums[r])</text>
  <text x="300" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">cur_and ＝ cur_min ?</text>
  <text x="125" y="455" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">ans ← ans ＋ 1</text>
  <text x="300" y="517" text-anchor="middle" font-size="12.5" fill="#2e5a24" filter="url(#rough2)">r ← r ＋ 1，回到内层判定</text>

  <path d="M 300 77 L 300 92" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 120 L 456 120" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="408" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 300 144 L 300 162" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="158" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 300 198 L 300 214" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 246 L 300 268" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 245 294 L 120 294 L 120 120 L 236 120" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="128" y="286" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">否：l ← l ＋ 1，回外层</text>
  <path d="M 300 318 L 300 338" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="332" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 300 408 L 300 422" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 222 450 L 192 450" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="207" y="442" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 300 476 L 300 494" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="488" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <path d="M 125 466 L 125 512 L 146 512" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 450 512 L 500 512 L 500 294 L 358 294" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="514" y="424" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">内层继续</text>
</svg>
