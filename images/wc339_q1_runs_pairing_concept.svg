<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：平衡子串 = 相邻 (0 段, 1 段) 配对，贡献 2·min(a,b)</text>

  <!-- string cells: "01000111", w=44, x=76+44i, y=48 -->
  <rect x="76" y="48" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">0</text>
  <rect x="120" y="48" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="48" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">0</text>
  <rect x="208" y="48" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">0</text>
  <rect x="252" y="48" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">0</text>
  <rect x="296" y="48" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <rect x="340" y="48" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <rect x="384" y="48" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>

  <!-- underline "01" (cells 0-1) -->
  <path d="M 80 92 H 160" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- highlight box over cells 2..7 -->
  <rect x="160" y="42" width="274" height="52" fill="none" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="66" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⭐ 000111（长 6）</text>
  <text x="442" y="82" font-size="10.5" fill="#a08030" filter="url(#rough2)">0 段末尾 + 1 段开头</text>

  <!-- run boxes -->
  <rect x="80" y="124" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0×1</text>
  <text x="98" y="155" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">a=1</text>
  <rect x="124" y="124" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1×1</text>
  <text x="142" y="155" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">b=1</text>
  <rect x="168" y="124" width="124" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0×3</text>
  <text x="230" y="155" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">a=3</text>
  <rect x="300" y="124" width="124" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="362" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1×3</text>
  <text x="362" y="155" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">b=3</text>

  <!-- dashed connectors cells -> runs -->
  <path d="M 98 96 V 120" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 142 96 V 120" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 96 V 120" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 362 96 V 120" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pair chips -->
  <rect x="56" y="206" width="128" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="120" y="234" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">2·min(1,1) = 2</text>
  <rect x="180" y="206" width="248" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="304" y="234" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">2·min(3,3) = 6 ⭐</text>

  <!-- arrows runs -> chips -->
  <path d="M 98 164 Q 100 186 105 202" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 142 164 Q 140 186 135 202" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 164 Q 244 186 258 202" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 362 164 Q 354 186 350 202" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- note boxes -->
  <rect x="40" y="268" width="236" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="158" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 反方向无效</text>
  <text x="158" y="308" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">相邻 (1 段, 0 段)（如 "10"）</text>
  <text x="158" y="324" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">不满足「所有 0 在 1 之前」</text>
  <rect x="296" y="268" width="224" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="408" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 取法</text>
  <text x="408" y="308" text-anchor="middle" font-size="10.5" fill="#3a5a2a" filter="url(#rough2)">0 段末尾 x 个 0 +</text>
  <text x="408" y="324" text-anchor="middle" font-size="10.5" fill="#3a5a2a" filter="url(#rough2)">1 段开头 x 个 1，x = min(a,b)</text>

  <!-- summary -->
  <rect x="118" y="364" width="324" height="30" rx="15" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = max{ 2·min(a,b) } = max(2, 6) = 6 ⭐</text>
</svg>
