<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">隔板法：e 个相同的质数 p 分给 n 个位置（每格可空）= C(e+n−1, n−1)</text>

  <!-- 三个位置框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="60" width="110" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="115" y="100" text-anchor="middle" font-size="14" fill="#446688">位置 1</text>
    <rect x="205" y="60" width="110" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="260" y="100" text-anchor="middle" font-size="14" fill="#4a7a3a">位置 2</text>
    <rect x="350" y="60" width="110" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="405" y="100" text-anchor="middle" font-size="14" fill="#8a6d3b">位置 3</text>
  </g>
  <text x="115" y="152" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">p⁰（放 1）</text>
  <text x="260" y="152" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">p¹</text>
  <text x="405" y="152" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">p³（放 8 若 p=2）</text>
  <text x="260" y="180" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">例：e = 4 个 p 分给 n = 3 个位置 → (0, 1, 3)</text>

  <!-- 星与隔板 -->
  <text x="60" y="226" font-size="14" fill="#333" filter="url(#rough2)">写成一行：</text>
  <g filter="url(#rough2)">
    <ellipse cx="160" cy="221" rx="8" ry="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="180" cy="221" rx="8" ry="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="200" cy="221" rx="8" ry="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="220" cy="221" rx="8" ry="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="238" y="202" width="7" height="40" fill="#4a7a3a" transform="rotate(4,241,222)"/>
    <rect x="262" y="202" width="7" height="40" fill="#4a7a3a" transform="rotate(-3,265,222)"/>
  </g>
  <text x="180" y="252" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">e = 4 个星</text>
  <text x="252" y="252" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">n−1 = 2 块隔板</text>
  <text x="330" y="226" font-size="13" fill="#333" filter="url(#rough2)">→ (0,1,3) 的另一个写法</text>

  <rect x="90" y="276" width="340" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">方案数 = C(e+n−1, n−1) = C(6, 2) = 15</text>

  <text x="260" y="344" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">星与隔板共 e+n−1 个符号，任选 n−1 个位置放隔板即一种分配</text>
</svg>
