<svg xmlns="http://www.w3.org/2000/svg" width="680" height="445" viewBox="0 0 680 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="445" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：cost1=3, cost2=2, costBoth=1, need1=3, need2=2</text>
  <path d="M 180 38 Q 340 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="57" text-anchor="middle" font-size="11.5" fill="#444">z = 捆绑（类型3）个数，其余不足部分用单品恰好补齐</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="50" y="72" width="80" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="130" y="72" width="160" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="290" y="72" width="160" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="450" y="72" width="180" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="90" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">z</text>
  <text x="210" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">类型1 个数</text>
  <text x="370" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">类型2 个数</text>
  <text x="540" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">总花费</text>

  <!-- row z=0 -->
  <g filter="url(#sk)">
    <rect x="50" y="106" width="80" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="130" y="106" width="160" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="290" y="106" width="160" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="450" y="106" width="180" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="90" y="128" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="210" y="128" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="370" y="128" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="540" y="128" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">3×3+2×2 = 13</text>

  <!-- row z=1 -->
  <g filter="url(#sk)">
    <rect x="50" y="140" width="80" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="130" y="140" width="160" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="290" y="140" width="160" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="450" y="140" width="180" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="90" y="162" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="210" y="162" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="370" y="162" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="540" y="162" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">6+2+1 = 9</text>

  <!-- row z=2 = m -->
  <g filter="url(#sk)">
    <rect x="50" y="174" width="80" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="130" y="174" width="160" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="290" y="174" width="160" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="450" y="174" width="180" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="90" y="196" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">2 = m</text>
  <text x="210" y="196" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="370" y="196" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="540" y="196" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">3+0+2 = 5</text>

  <!-- row z=3 = M (answer) -->
  <g filter="url(#sk)">
    <rect x="50" y="208" width="80" height="36" fill="#f5e0e0" stroke="#b85450" stroke-width="2"/>
    <rect x="130" y="208" width="160" height="36" fill="#f5e0e0" stroke="#b85450" stroke-width="2"/>
    <rect x="290" y="208" width="160" height="36" fill="#f5e0e0" stroke="#b85450" stroke-width="2"/>
    <rect x="450" y="208" width="180" height="36" fill="#f5e0e0" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="90" y="231" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">3 = M</text>
  <text x="210" y="231" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="370" y="231" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="540" y="231" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold" font-family="monospace">0+0+3 = 3 ★</text>

  <text x="340" y="266" text-anchor="middle" font-size="11.5" fill="#555">捆绑最便宜（1 &lt; 3、2），段1、段2 斜率均为负 → 一路把 z 推到 M，全买捆绑，答案 3</text>

  <!-- trap box -->
  <g filter="url(#sk)">
    <rect x="40" y="286" width="600" height="142" rx="8" fill="#fff8e1" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="60" y="310" font-size="13" font-weight="bold" fill="#b03a3a">陷阱案例：漏掉候选 M 就会答错</text>
  <text x="60" y="332" font-size="12" fill="#444" font-family="monospace">cost1=1, cost2=100, costBoth=90, need1=5, need2=10</text>
  <text x="60" y="354" font-size="12" fill="#444" font-family="monospace">cost(0)   = 5×1 + 10×100         = 1005</text>
  <text x="60" y="376" font-size="12" fill="#444" font-family="monospace">cost(m=5) = 0 + 5×100 + 5×90     =  950</text>
  <text x="60" y="398" font-size="12" fill="#b03a3a" font-weight="bold" font-family="monospace">cost(M=10)= 0 + 0 + 10×90        =  900 ✓ 最优</text>
  <text x="60" y="420" font-size="11.5" fill="#555">捆绑（90）比类型2 单品（100）便宜 → 宁可浪费 5 个类型1 额度，也要把 z 推到 M</text>
</svg>
