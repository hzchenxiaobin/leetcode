<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例走查：num = 430043，k = 2，答案 2</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="70" y="52" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="52" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="202" y="52" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="278" y="52" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="404" y="52" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95" y="72">起点</text>
    <text x="161" y="72">子串</text>
    <text x="237" y="72">数值 v</text>
    <text x="338" y="72">430043 mod v</text>
    <text x="444" y="72">计数</text>
  </g>

  <!-- 行数据 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="90" width="50" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="126" y="90" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="202" y="90" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="278" y="90" width="120" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="404" y="90" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="95" y="112">i=0</text><text x="161" y="112">"43"</text><text x="237" y="112">43</text>
    <text x="338" y="112">0</text><text x="444" y="112" fill="#2d5a22" font-weight="bold">✅ +1</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="130" width="50" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="126" y="130" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="202" y="130" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="278" y="130" width="120" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="404" y="130" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="95" y="152">i=1</text><text x="161" y="152">"30"</text><text x="237" y="152">30</text>
    <text x="338" y="152">13</text><text x="444" y="152" fill="#8a3a36">❌</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="170" width="50" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="126" y="170" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="202" y="170" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="278" y="170" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="404" y="170" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="95" y="192">i=2</text><text x="161" y="192">"00"</text><text x="237" y="192">0</text>
    <text x="338" y="192">除数非法</text><text x="444" y="192" fill="#8a3a36">❌</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="210" width="50" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="126" y="210" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="202" y="210" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="278" y="210" width="120" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="404" y="210" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="95" y="232">i=3</text><text x="161" y="232">"04"</text><text x="237" y="232">4</text>
    <text x="338" y="232">3</text><text x="444" y="232" fill="#8a3a36">❌</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="250" width="50" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="126" y="250" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="202" y="250" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="278" y="250" width="120" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="404" y="250" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="95" y="272">i=4</text><text x="161" y="272">"43"</text><text x="237" y="272">43</text>
    <text x="338" y="272">0</text><text x="444" y="272" fill="#2d5a22" font-weight="bold">✅ +1</text>
  </g>

  <!-- 结论 -->
  <rect x="140" y="304" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">k 美丽值 = 2 ✓（"43" 出现两次各计一次）</text>
</svg>
