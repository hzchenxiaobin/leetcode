<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">状态压缩：只关心“子序列最后一个数的奇偶”</text>

  <!-- 两个状态节点 -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="180" height="90" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="150" y="102" text-anchor="middle" font-size="15" fill="#446688">best[0]</text>
    <text x="150" y="126" text-anchor="middle" font-size="12" fill="#555">最后停在“偶数值”的</text>
    <text x="150" y="146" text-anchor="middle" font-size="12" fill="#555">访问子序列的最大得分</text>

    <rect x="280" y="70" width="180" height="90" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="370" y="102" text-anchor="middle" font-size="15" fill="#b85450">best[1]</text>
    <text x="370" y="126" text-anchor="middle" font-size="12" fill="#555">最后停在“奇数值”的</text>
    <text x="370" y="146" text-anchor="middle" font-size="12" fill="#555">访问子序列的最大得分</text>
  </g>

  <!-- 转移箭头 -->
  <g filter="url(#rough2)">
    <path d="M 246 96 C 268 90, 272 90, 292 96" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="270" y="82" text-anchor="middle" font-size="11.5" fill="#4a7a3a">偶→偶</text>
    <path d="M 276 132 C 258 138, 252 138, 236 132" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="254" y="152" text-anchor="middle" font-size="11.5" fill="#4a7a3a">奇→奇：不扣分</text>
    <text x="150" y="176" font-size="11.5" fill="#4a7a3a">同奇偶转移免费 ↺</text>

    <path d="M 240 104 C 276 84, 284 84, 296 100" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)"/>
    <path d="M 280 132 C 244 154, 236 154, 224 138" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)"/>
    <text x="268" y="66" font-size="11.5" fill="#b85450">奇偶切换 −x</text>
  </g>

  <!-- 转移公式 -->
  <g filter="url(#rough2)">
    <rect x="36" y="188" width="448" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="260" y="216" text-anchor="middle" font-size="13.5" fill="#8a6d1f">处理新元素 nums[i]（奇偶为 p）时：</text>
    <text x="260" y="246" text-anchor="middle" font-size="14" fill="#333">gain = nums[i] + max( best[p] , best[p⊕1] − x )</text>
    <text x="260" y="272" text-anchor="middle" font-size="12.5" fill="#555">上一站同为 p：白拿 nums[i]，不扣分</text>
    <text x="260" y="294" text-anchor="middle" font-size="12.5" fill="#555">上一站奇偶不同：跨状态转移，扣 x</text>
    <text x="260" y="322" text-anchor="middle" font-size="12.5" fill="#b85450">best[p] = max(best[p], gain)；best[p⊕1] 不动</text>
  </g>
</svg>
