<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：两个例子走一遍</text>
  <path d="M 170 40 Q 340 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left panel: a=12, b=6 ===== -->
  <g filter="url(#sk)">
    <rect x="35" y="62" width="295" height="300" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="182" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">a = 12, b = 6</text>
  <text x="182" y="114" text-anchor="middle" font-size="13" fill="#3a3a3a" filter="url(#sk)">g = gcd(12, 6) = 6，枚举 i ≤ √6 ≈ 2.45</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="55" y="130" width="70" height="28" rx="4" fill="#fdfcf7" stroke="#446688" stroke-width="1.2"/>
    <rect x="125" y="130" width="70" height="28" rx="4" fill="#fdfcf7" stroke="#446688" stroke-width="1.2"/>
    <rect x="195" y="130" width="115" height="28" rx="4" fill="#fdfcf7" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="90" y="149" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold" filter="url(#sk)">i</text>
  <text x="160" y="149" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold" filter="url(#sk)">6 % i</text>
  <text x="252" y="149" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold" filter="url(#sk)">计入因子</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="55" y="160" width="70" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="125" y="160" width="70" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="195" y="160" width="115" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="90" y="179" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <text x="160" y="179" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">0 ✓</text>
  <text x="252" y="179" text-anchor="middle" font-size="12" fill="#3a5a2e" filter="url(#sk)">1 和 6</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="55" y="190" width="70" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="125" y="190" width="70" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="195" y="190" width="115" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="90" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <text x="160" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">0 ✓</text>
  <text x="252" y="209" text-anchor="middle" font-size="12" fill="#3a5a2e" filter="url(#sk)">2 和 3</text>

  <!-- row 3: stop -->
  <g filter="url(#sk)">
    <rect x="55" y="220" width="70" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="125" y="220" width="70" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="195" y="220" width="115" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="90" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <text x="160" y="239" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#sk)">—</text>
  <text x="252" y="239" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#sk)">3×3 &gt; 6，停</text>

  <text x="182" y="278" text-anchor="middle" font-size="13" fill="#3a3a3a" filter="url(#sk)">因子对：(1,6)、(2,3)</text>
  <text x="182" y="302" text-anchor="middle" font-size="13" fill="#3a3a3a" filter="url(#sk)">1、2、3、6 都不是成对重复</text>
  <g filter="url(#sk)">
    <rect x="90" y="316" width="185" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="182" y="339" text-anchor="middle" font-size="14" fill="#a06a10" font-weight="bold" filter="url(#sk)">答案 = 2 + 2 = 4 ✓</text>

  <!-- ===== right panel: a=25, b=30 ===== -->
  <g filter="url(#sk)">
    <rect x="350" y="62" width="295" height="300" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="497" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a5a2e" filter="url(#sk)">a = 25, b = 30</text>
  <text x="497" y="114" text-anchor="middle" font-size="13" fill="#3a3a3a" filter="url(#sk)">g = gcd(25, 30) = 5，枚举 i ≤ √5 ≈ 2.24</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="370" y="130" width="70" height="28" rx="4" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="440" y="130" width="70" height="28" rx="4" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="510" y="130" width="115" height="28" rx="4" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="405" y="149" text-anchor="middle" font-size="12" fill="#3a5a2e" font-weight="bold" filter="url(#sk)">i</text>
  <text x="475" y="149" text-anchor="middle" font-size="12" fill="#3a5a2e" font-weight="bold" filter="url(#sk)">5 % i</text>
  <text x="567" y="149" text-anchor="middle" font-size="12" fill="#3a5a2e" font-weight="bold" filter="url(#sk)">计入因子</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="370" y="160" width="70" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="440" y="160" width="70" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="510" y="160" width="115" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="405" y="179" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <text x="475" y="179" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">0 ✓</text>
  <text x="567" y="179" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">1 和 5</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="370" y="190" width="70" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="440" y="190" width="70" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="510" y="190" width="115" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="405" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <text x="475" y="209" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#sk)">1 ✗</text>
  <text x="567" y="209" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#sk)">跳过</text>

  <!-- row 3: stop -->
  <g filter="url(#sk)">
    <rect x="370" y="220" width="70" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="440" y="220" width="70" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="510" y="220" width="115" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="405" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <text x="475" y="239" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#sk)">—</text>
  <text x="567" y="239" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#sk)">3×3 &gt; 5，停</text>

  <text x="497" y="278" text-anchor="middle" font-size="13" fill="#3a3a3a" filter="url(#sk)">因子对：仅 (1,5)</text>
  <text x="497" y="302" text-anchor="middle" font-size="13" fill="#3a3a3a" filter="url(#sk)">5 不是平方数，无重复计数</text>
  <g filter="url(#sk)">
    <rect x="405" y="316" width="185" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="497" y="339" text-anchor="middle" font-size="14" fill="#a06a10" font-weight="bold" filter="url(#sk)">答案 = 2 ✓</text>

  <!-- bottom note -->
  <text x="340" y="392" text-anchor="middle" font-size="12" fill="#7a7a7a" filter="url(#sk)">⚠ 若 g 是完全平方数（如 g = 36，i = 6），因子对 (6,6) 只能计 1 次</text>
  <text x="340" y="412" text-anchor="middle" font-size="12" fill="#7a7a7a" filter="url(#sk)">⇒ 计数时判断 i × i == g：是则 +1，否则 +2</text>
</svg>
