<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="350" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三个示例的演算走查</text>
  <rect x="28" y="74" width="96" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="100" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">[3,5]</text>
  <text x="76" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">输入</text>
  <rect x="136" y="74" width="176" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="224" y="100" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">S=8, n=2, 平均值 4</text>
  <text x="224" y="120" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">下界 x0=5</text>
  <rect x="324" y="74" width="152" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="100" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">试值</text>
  <text x="400" y="120" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">5 在数组中 → 6 不在</text>
  <rect x="488" y="74" width="64" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="520" y="112" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="28" y="154" width="96" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="180" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">[-1,1,2]</text>
  <text x="76" y="200" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">输入</text>
  <rect x="136" y="154" width="176" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="224" y="180" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">S=2, n=3, 平均值 0.667</text>
  <text x="224" y="200" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">下界 x0=1</text>
  <rect x="324" y="154" width="152" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="180" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">试值</text>
  <text x="400" y="200" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1 在、2 在、3 不在</text>
  <rect x="488" y="154" width="64" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="520" y="192" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="28" y="234" width="96" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="260" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">[4,-1]</text>
  <text x="76" y="280" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">输入</text>
  <rect x="136" y="234" width="176" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="224" y="260" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">S=3, n=2, 平均值 1.5</text>
  <text x="224" y="280" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">下界 x0=2</text>
  <rect x="324" y="234" width="152" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="260" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">试值</text>
  <text x="400" y="280" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2 不在</text>
  <rect x="488" y="234" width="64" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="520" y="272" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="290" y="330" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">三种情形：起点被占用 / 连续被占用 / 起点直接可用</text>
</svg>
