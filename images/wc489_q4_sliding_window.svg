<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="474" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">观察一：合法左端点构成区间 [L(r), r]，且 L(r) 随 r 单调不减</text>
  <path d="M 90 38 Q 320 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ① 收缩演示 -->
  <text x="320" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 固定 r=3、k=1（nums = [5,4,5,6]）：收缩左端点直到极差合法</text>

  <rect x="150" y="76" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="76" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="76" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="76" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="222" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="272" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="322" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="172" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="222" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="272" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="322" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="356" y="97" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">←r</text>

  <!-- 红色括号：L=0 时整段不合法 -->
  <path d="M 150 140 L 150 152 L 344 152 L 344 140" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="247" y="170" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">L=0：极差 = max 6 − min 4 = 2 &gt; k=1 ✗</text>

  <!-- L 右移箭头 -->
  <path d="M 190 180 Q 228 196 258 204" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="132" y="196" font-size="10.5" fill="#d6a040" filter="url(#rough2)">L 只向右移</text>

  <!-- 绿色括号：L=2 时合法 -->
  <path d="M 250 212 L 250 224 L 344 224 L 344 212" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="297" y="242" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">L=2：极差 = 6 − 5 = 1 ≤ k ✓</text>

  <!-- ② 单调队列 -->
  <text x="320" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 单调队列 O(1) 均摊维护窗口 max / min（示意为窗口 [2,3] 时刻）</text>

  <rect x="55" y="278" width="265" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="298" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">maxD（存下标，值递减）</text>
  <rect x="70" y="306" width="56" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="132" y="306" width="56" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6 (3)</text>
  <text x="160" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5 (2)</text>
  <text x="200" y="324" font-size="10" fill="#446688" filter="url(#rough2)">← 队头 = max</text>

  <rect x="340" y="278" width="265" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="298" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">minD（存下标，值递增）</text>
  <rect x="355" y="306" width="56" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="417" y="306" width="56" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="383" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5 (2)</text>
  <text x="445" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6 (3)</text>
  <text x="485" y="324" font-size="10" fill="#2e6e2e" filter="url(#rough2)">← 队头 = min</text>

  <text x="320" y="360" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">r 入队时从队尾弹出被覆盖者；L 右移时仅当 front == L 才从队头弹出</text>

  <!-- ③ 关键单调性 -->
  <rect x="45" y="374" width="550" height="90" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="396" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">③ 关键单调性（双指针的根基）</text>
  <text x="65" y="418" font-size="11.5" fill="#444" filter="url(#rough2)">固定 r：f(l) = max(nums[l..r]) − min(nums[l..r]) 随 l 减小单调不减</text>
  <text x="65" y="438" font-size="11.5" fill="#444" filter="url(#rough2)">⟹ 合法左端点恰为连续区间 [L(r), r]，且 L(r) 单调不减</text>
  <text x="65" y="454" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">⟹ L 与 r 都只前进：总移动 O(n) → 滑动窗口均摊 O(1)</text>
</svg>
