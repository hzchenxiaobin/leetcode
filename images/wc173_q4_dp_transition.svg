<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">状态设计与转移：枚举最后一天的起点 k</text>
  <text x="320" y="54" text-anchor="middle" font-size="11" fill="#888">dp[j][i] = 前 i 项工作恰好分给 j 天的最小总难度</text>

  <rect x="70" y="70" width="500" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="86" y="92" font-size="11" fill="#3a4a66">边界：dp[0][0] = 0，其余 dp[0][i&gt;0] = ∞；答案 dp[d][n]</text>
  <text x="86" y="112" font-size="11" fill="#3a4a66">约束：每天至少一项 ⇒ 只枚举合法的 k ∈ [j-1, i-1]</text>

  <rect x="70" y="136" width="500" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="158" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">dp[j][i] = min over k of ( dp[j-1][k] + max(a[k .. i-1]) )</text>
  <text x="320" y="174" text-anchor="middle" font-size="10" fill="#777">前 k 项由前 j-1 天完成，第 j 天完成 k 到 i-1 这段</text>

  <text x="278" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k</text>
  <text x="410" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i</text>
  <path d="M 278 208 L 278 216" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 410 208 L 410 216" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="190" y="220" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="212" y="243" fill="#334">7</text>
    <rect x="234" y="220" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="256" y="243" fill="#334">1</text>
    <rect x="278" y="220" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="300" y="243" fill="#334">7</text>
    <rect x="322" y="220" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="344" y="243" fill="#334">1</text>
    <rect x="366" y="220" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="388" y="243" fill="#334">7</text>
    <rect x="410" y="220" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="432" y="243" fill="#666">1</text>
  </g>

  <path d="M 190 268 L 190 276 L 278 276 L 278 268" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="234" y="294" text-anchor="middle" font-size="10.5" fill="#3a4a66">dp[j-1][k]</text>

  <path d="M 278 268 L 278 276 L 410 276 L 410 268" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="344" y="294" text-anchor="middle" font-size="10.5" fill="#3a5a30">第 j 天，代价 = 段内最大 = 7</text>

  <text x="432" y="294" text-anchor="middle" font-size="10" fill="#888">尚未安排</text>

  <rect x="70" y="312" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="86" y="333" font-size="10.5" fill="#3a5a30" font-weight="bold">实现技巧：固定 i，令 k 从 i-1 递减到 j-1，边扫边更新 max</text>
  <text x="86" y="352" font-size="10" fill="#555">这样每个 (j, i) 只需 O(n) 而不是 O(n²) 求区间最大值，</text>
  <text x="86" y="368" font-size="10" fill="#555">总复杂度 O(d·n²) = 10 × 9×10⁴ ≈ 9×10⁵ 次运算，轻松通过。</text>
</svg>
