<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="392" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [10, 20, 10, 19, 10, 20]，答案为 5</text>
  <text filter="url(#rough2)" x="290" y="45" text-anchor="middle" font-size="11" fill="#888">最有价值的一步是 i=3（19）：用差值 9 接在"差值 10"之后，差值序列开始下降</text>

  <g filter="url(#rough2)">
    <rect x="24" y="58" width="532" height="28" fill="#dde5ee" stroke="#446688" stroke-width="1.2" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="10.6" font-weight="bold" fill="#334">
    <text x="34" y="77">i / x</text>
    <text x="120" y="77">候选 u（d = |x−u|）</text>
    <text x="300" y="77">suf[u][d]</text>
    <text x="392" y="77">写回 f[x][d]</text>
    <text x="500" y="77">ans</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="88" width="532" height="34" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="24" y="124" width="532" height="34" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="24" y="160" width="532" height="34" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="24" y="196" width="532" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="24" y="232" width="532" height="34" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="24" y="268" width="532" height="34" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="10.4" fill="#333">
    <text x="34" y="110">0 / 10</text>
    <text x="120" y="110" fill="#888">无前驱（首个元素）</text>
    <text x="300" y="110" fill="#888">—</text>
    <text x="392" y="110" fill="#888">f 全为 0</text>
    <text x="500" y="110">1</text>

    <text x="34" y="146">1 / 20</text>
    <text x="120" y="146">10（d = 10）</text>
    <text x="300" y="146">suf[10][10] = 1</text>
    <text x="392" y="146">f[20][10] = 2</text>
    <text x="500" y="146">2</text>

    <text x="34" y="182">2 / 10</text>
    <text x="120" y="182">20（d = 10）</text>
    <text x="300" y="182">suf[20][10] = 2</text>
    <text x="392" y="182">f[10][10] = 3</text>
    <text x="500" y="182">3</text>

    <text x="34" y="218" font-weight="bold">3 / 19</text>
    <text x="120" y="218" fill="#3a5a30">10（d = 9）　20（d = 1）</text>
    <text x="300" y="218" fill="#3a5a30">suf[10][9] = 3</text>
    <text x="392" y="218" fill="#3a5a30" font-weight="bold">f[19][9] = 4</text>
    <text x="500" y="218" fill="#3a5a30" font-weight="bold">4</text>

    <text x="34" y="254">4 / 10</text>
    <text x="120" y="254">19（d = 9）</text>
    <text x="300" y="254">suf[19][9] = 4</text>
    <text x="392" y="254">f[10][9] = 5</text>
    <text x="500" y="254">5</text>

    <text x="34" y="290">5 / 20</text>
    <text x="120" y="290">19（d = 1）　10（d = 10）</text>
    <text x="300" y="290">suf[19][1] = 4</text>
    <text x="380" y="290">f[20][1] = 5（持平）</text>
    <text x="500" y="290">5</text>
  </g>

  <text filter="url(#rough2)" x="34" y="330" font-size="11" fill="#333" font-weight="bold">取出的最优子序列：</text>

  <g filter="url(#rough2)">
    <rect x="196" y="314" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="238" y="314" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="280" y="314" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="322" y="314" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="364" y="314" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold" fill="#3a5a30">
    <text x="215" y="332">10</text>
    <text x="257" y="332">20</text>
    <text x="299" y="332">10</text>
    <text x="341" y="332">19</text>
    <text x="383" y="332">10</text>
  </g>
  <g filter="url(#rough2)" font-size="9.6" text-anchor="middle" fill="#888">
    <text x="236" y="356">10</text>
    <text x="278" y="356">10</text>
    <text x="320" y="356">9</text>
    <text x="362" y="356">9</text>
  </g>
  <text filter="url(#rough2)" x="412" y="332" font-size="10.6" fill="#555">差值 10 ≥ 10 ≥ 9 ≥ 9</text>
  <text filter="url(#rough2)" x="412" y="352" font-size="10.6" fill="#555">非递增 ✓，长度 5</text>

  <text filter="url(#rough2)" x="290" y="382" text-anchor="middle" font-size="10" fill="#999">注意 i=5 处 20 也能接到 19 后面（d=1），但长度仍是 5；等长的子序列只保留更长的那条</text>
</svg>
