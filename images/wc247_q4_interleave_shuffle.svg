<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">从递推到闭式：兄弟子树的序列可以自由交错（多项式系数）</text>
  <path d="M 210 38 Q 470 48 730 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">0 号建好后剩 sz(0)−1 = 4 个空位；两棵子树内部顺序固定后，彼此任意穿插</text>

  <!-- decomposition -->
  <g filter="url(#sk)">
    <rect x="80" y="78" width="44" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="190" y="72" width="170" height="56" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="400" y="72" width="170" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="102" y="106" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <text x="102" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">根先建</text>
  <text x="275" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6b2f" filter="url(#sk)">子树①：1 → 3</text>
  <text x="275" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">sz = 2 · 内部方案 dp = 1</text>
  <text x="485" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5518" filter="url(#sk)">子树②：2 → 4</text>
  <text x="485" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">sz = 2 · 内部方案 dp = 1</text>
  <g stroke="#8a8a8a" stroke-width="1.8" fill="none">
    <path d="M 128 88 Q 158 76 184 90" marker-end="url(#arr)" filter="url(#sk)"/>
    <path d="M 128 114 C 210 165, 330 160, 394 114" marker-end="url(#arr)" filter="url(#sk)"/>
  </g>
  <text x="612" y="88" font-size="12.5" fill="#444" filter="url(#sk)">交错数 = 多项式系数</text>
  <text x="612" y="110" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">4! / (2!·2!) = C(4,2) = 6</text>
  <text x="612" y="132" font-size="12" fill="#555" filter="url(#sk)">总方案 = 交错数 × 内部方案 = 6 × 1 × 1</text>

  <!-- 6 interleaving rows -->
  <!-- rows: y start 168, row height 26, gap 8 -->
  <g filter="url(#sk)">
    <rect x="115" y="168" width="30" height="26" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="115" y="202" width="30" height="26" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="115" y="236" width="30" height="26" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="115" y="270" width="30" height="26" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="115" y="304" width="30" height="26" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="115" y="338" width="30" height="26" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="130" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <text x="130" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <text x="130" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <text x="130" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <text x="130" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <text x="130" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">0</text>

  <!-- row labels -->
  <text x="95" y="186" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">①</text>
  <text x="95" y="220" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">②</text>
  <text x="95" y="254" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">③</text>
  <text x="95" y="288" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">④</text>
  <text x="95" y="322" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">⑤</text>
  <text x="95" y="356" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">⑥</text>

  <!-- value boxes: x = 155,195,235,275 ; green for 1,3 ; orange for 2,4 -->
  <g filter="url(#sk)">
    <!-- row 1: 1 3 2 4 -->
    <rect x="155" y="168" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="195" y="168" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="235" y="168" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="275" y="168" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <!-- row 2: 1 2 3 4 -->
    <rect x="155" y="202" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="195" y="202" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="235" y="202" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="275" y="202" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <!-- row 3: 1 2 4 3 -->
    <rect x="155" y="236" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="195" y="236" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="235" y="236" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="275" y="236" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <!-- row 4: 2 1 3 4 -->
    <rect x="155" y="270" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="195" y="270" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="235" y="270" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="275" y="270" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <!-- row 5: 2 1 4 3 -->
    <rect x="155" y="304" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="195" y="304" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="235" y="304" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="275" y="304" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <!-- row 6: 2 4 1 3 -->
    <rect x="155" y="338" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="195" y="338" width="34" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="235" y="338" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="275" y="338" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <!-- values -->
  <g font-size="13" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="172" y="186">1</text><text x="212" y="186">3</text><text x="252" y="186">2</text><text x="292" y="186">4</text>
    <text x="172" y="220">1</text><text x="212" y="220">2</text><text x="252" y="220">3</text><text x="292" y="220">4</text>
    <text x="172" y="254">1</text><text x="212" y="254">2</text><text x="252" y="254">4</text><text x="292" y="254">3</text>
    <text x="172" y="288">2</text><text x="212" y="288">1</text><text x="252" y="288">3</text><text x="292" y="288">4</text>
    <text x="172" y="322">2</text><text x="212" y="322">1</text><text x="252" y="322">4</text><text x="292" y="322">3</text>
    <text x="172" y="356">2</text><text x="212" y="356">4</text><text x="252" y="356">1</text><text x="292" y="356">3</text>
  </g>

  <!-- right note -->
  <g filter="url(#sk)">
    <rect x="350" y="175" width="530" height="172" rx="10" fill="#f4faf4" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="372" y="204" font-size="12.5" fill="#444" filter="url(#sk)">绿色块内部保持 1 在 3 前；橙色块内部保持 2 在 4 前</text>
  <text x="372" y="230" font-size="12.5" fill="#444" filter="url(#sk)">两块之间没有任何先后约束 → 可以任意穿插</text>
  <text x="372" y="256" font-size="12.5" fill="#444" filter="url(#sk)">固定各块内部顺序后，穿插方式恰有 6 种（左图）</text>
  <text x="372" y="282" font-size="12.5" fill="#444" filter="url(#sk)">每棵子树内部又有 dp[c] 种排法 —— 自底向上递归</text>
  <text x="372" y="308" font-size="12.5" fill="#444" filter="url(#sk)">叶子 dp = 1（0! = 1，空积为 1），一路卷到根</text>
  <text x="372" y="334" font-size="12" font-weight="bold" fill="#2f6b2f" filter="url(#sk)">dp[0] = 4!/(2!·2!) × dp[1] × dp[2] = 6 × 1 × 1 = 6 ✓</text>

  <!-- recurrence box -->
  <g filter="url(#sk)">
    <rect x="60" y="425" width="395" height="165" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="80" y="452" font-size="14" font-weight="bold" fill="#2f6b2f" filter="url(#sk)">自底向上递推</text>
  <text x="80" y="480" font-size="13.5" font-weight="bold" fill="#333" filter="url(#sk)">dp[u] = (sz[u]−1)! / ∏ sz[c]! × ∏ dp[c]</text>
  <text x="80" y="506" font-size="11.5" fill="#555" filter="url(#sk)">分子：去掉 u 后剩余位置的排列数</text>
  <text x="80" y="528" font-size="11.5" fill="#555" filter="url(#sk)">分母：每个孩子的子树看作一个「块」，块内顺序由 dp[c] 补回</text>
  <text x="80" y="550" font-size="11.5" fill="#555" filter="url(#sk)">叶子：dp = 1，sz = 1</text>
  <text x="80" y="574" font-size="11.5" fill="#555" filter="url(#sk)">本例：dp[1] = 1!/(1!)·1 = 1，dp[2] = 1</text>

  <!-- closed form box -->
  <g filter="url(#sk)">
    <rect x="490" y="425" width="390" height="165" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="510" y="452" font-size="14" font-weight="bold" fill="#7a5518" filter="url(#sk)">层层展开 → 闭式（望远镜求积）</text>
  <text x="510" y="480" font-size="14" font-weight="bold" fill="#333" filter="url(#sk)">dp[0] = n! / ∏ sz[v]</text>
  <text x="510" y="506" font-size="11.5" fill="#555" filter="url(#sk)">每个节点 v 在分母中恰贡献一次 sz[v]</text>
  <text x="510" y="528" font-size="11.5" fill="#555" filter="url(#sk)">分子逐层约减，最外层只剩 n!</text>
  <text x="510" y="552" font-size="12.5" font-weight="bold" fill="#7a5518" filter="url(#sk)">本例：5! / (5·2·2·1·1) = 120/20 = 6 ✓</text>
  <text x="510" y="576" font-size="11.5" fill="#555" filter="url(#sk)">只需求出全部 sz，一次逆元即可，无需 dp 数组</text>
</svg>
