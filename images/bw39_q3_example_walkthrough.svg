<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="330" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：a = 16，b = 9，x = 7，forbidden = {1,6,2,14,5,17,4}</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">正向跳一步太远（0→16），再回跳 9 恰好落在家：2 步方案 0 → 16 → 7</text>

  <!-- number line -->
  <path d="M 70 170 L 630 170" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <!-- ticks -->
  <g filter="url(#r)">
    <circle cx="110" cy="170" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="270" cy="170" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="470" cy="170" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <circle cx="560" cy="170" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="110" y="150" fill="#446688">0</text>
    <text x="270" y="150" fill="#b85450">7（家）</text>
    <text x="470" y="150" fill="#4a7a3a">16</text>
    <text x="560" y="150" fill="#b85450">17（禁区）</text>
  </g>

  <!-- jump arcs -->
  <path d="M 118 162 Q 290 70 462 162" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="290" y="86" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#r)">前跳 +16（第 1 步）</text>
  <path d="M 462 178 Q 366 240 280 178" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="366" y="252" text-anchor="middle" font-size="13" fill="#a67c1e" filter="url(#r)">后跳 −9（第 2 步）</text>

  <!-- BFS layers -->
  <g filter="url(#r)">
    <rect x="80" y="272" width="520" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="298" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#r)">BFS 第 0 层 {(0,→)} → 第 1 层 {(16,→)} → 第 2 层 {(32,→), (7,←), …} 命中 x，返回 2</text>
</svg>
