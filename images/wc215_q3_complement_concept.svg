<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">正难则反：从两端删除 ⟺ 在中间保留</text>
  <text x="360" y="45" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">被删的永远是「前缀 + 后缀」——直接凑两端组合难，不如保中间：找和为 total − x 的最长连续段</text>

  <!-- 数组格子（示例 3：nums = [3,2,20,1,1,3]，x = 10） -->
  <path d="M163,76 L60,76" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="110" y="66" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">左删 l = 2</text>

  <path d="M370,76 L498,76" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="434" y="66" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">右删 r = 3</text>

  <rect x="42" y="88" width="70" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="77" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="121" y="88" width="70" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="88" width="70" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="235" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">20</text>
  <rect x="279" y="88" width="70" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="314" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="358" y="88" width="70" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="437" y="88" width="70" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="116" y="160" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">前缀和 3 + 2 = 5</text>
  <text x="235" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">中间 20 = target</text>
  <text x="393" y="160" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">后缀和 1 + 1 + 3 = 5</text>

  <!-- 等价关系 -->
  <rect x="42" y="178" width="466" height="56" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="200" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">删除和 = 5 + 5 = 10 = x ⟺ 保留和 = 30 − 10 = 20 = total − x</text>
  <text x="275" y="221" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">删除顺序无关：先左后右、先右后左，删除总和都不变</text>

  <rect x="526" y="178" width="154" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="603" y="199" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 3 数据</text>
  <text x="603" y="219" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">total = 30，x = 10</text>

  <!-- 目标翻转 -->
  <rect x="42" y="252" width="200" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="272" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">最小化操作数 l + r</text>
  <text x="142" y="291" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删掉的元素越少越好</text>

  <text x="272" y="282" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">⟺</text>

  <rect x="302" y="252" width="206" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最大化保留段长度</text>
  <text x="405" y="291" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">n − (l + r) 越大越好</text>

  <!-- 结论 -->
  <rect x="42" y="318" width="638" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="361" y="340" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">转化后：找和恰为 target = 20 的最长连续子数组，长度 L → 答案 = n − L</text>
  <text x="361" y="362" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">本例 L = 1（[20]），答案 = 6 − 1 = 5，与示例 3 输出一致；target &lt; 0 或找不到 → −1</text>
</svg>
