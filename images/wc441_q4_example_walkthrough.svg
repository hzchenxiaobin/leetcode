<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">示例演算：l = 10, r = 20 → f(20) − f(9) = 11 − 9 = 2</text>

  <!-- 左表：10~15 -->
  <rect x="30" y="52" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="48" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="89" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">和 s</text>
  <text x="135" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">积 p</text>
  <text x="182" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">p % s</text>
  <text x="238" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">美丽?</text>

  <rect x="30" y="82" width="240" height="30" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="89" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="182" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="238" y="102" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="30" y="112" width="240" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="89" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="135" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="182" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="238" y="132" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="30" y="142" width="240" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>
  <text x="89" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="135" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="182" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="238" y="162" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="30" y="172" width="240" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13</text>
  <text x="89" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="135" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="182" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="238" y="192" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="30" y="202" width="240" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14</text>
  <text x="89" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="135" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="182" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="238" y="222" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="30" y="232" width="240" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>
  <text x="89" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="135" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="182" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="238" y="252" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 右表：16~20 -->
  <rect x="290" y="52" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="308" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="349" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">和 s</text>
  <text x="395" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">积 p</text>
  <text x="442" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">p % s</text>
  <text x="498" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">美丽?</text>

  <rect x="290" y="82" width="240" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">16</text>
  <text x="349" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="395" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="442" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="498" y="102" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="290" y="112" width="240" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">17</text>
  <text x="349" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="395" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="442" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="498" y="132" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="290" y="142" width="240" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">18</text>
  <text x="349" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="395" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="442" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="498" y="162" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="290" y="172" width="240" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">19</text>
  <text x="349" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="395" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="442" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="498" y="192" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="290" y="202" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="308" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">20</text>
  <text x="349" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="395" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="442" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="498" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 前缀相减 -->
  <rect x="40" y="300" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="322" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">f(9) = 9</text>
  <text x="110" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1~9 全美丽（积 = 和）</text>

  <path d="M 182,328 L 210,328" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="214" y="300" width="160" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="294" y="322" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">f(20) = 11</text>
  <text x="294" y="342" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">= 9 + 10 + 20</text>

  <path d="M 376,328 L 404,328" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="408" y="300" width="112" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="464" y="322" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans = 2</text>
  <text x="464" y="342" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">= 11 − 9</text>

  <!-- 底部注释 -->
  <rect x="40" y="386" width="480" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">11~19 全灭：积 = 个位数字 x &lt; 和 = x + 1，且积 ≠ 0 → 必不整除</text>

  <rect x="40" y="440" width="480" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="466" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">10 与 20：含数位 0 → 积 = 0 → 0 能被任何数位和整除 → 必美丽</text>
</svg>
