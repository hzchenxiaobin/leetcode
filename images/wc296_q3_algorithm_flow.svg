<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="52" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：建索引 → 逐操作「查、改、同步」</text>
  <path d="M 260 44 Q 470 52 680 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== start ===== -->
  <g filter="url(#sk)">
    <ellipse cx="320" cy="78" rx="52" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="320" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">开始</text>
  <path d="M 320 102 L 320 126" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- ===== build index ===== -->
  <g filter="url(#sk)">
    <rect x="190" y="130" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="320" y="159" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">建倒排索引 pos[v] = i</text>
  <text x="475" y="159" font-size="11" fill="#888">一遍 O(n)，互异 ⇒ 无键冲突</text>
  <path d="M 320 178 L 320 204" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- ===== decision ===== -->
  <g filter="url(#sk)">
    <polygon points="320,208 456,248 320,288 184,248" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">还有未处理的</text>
  <text x="320" y="261" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">操作吗？</text>

  <!-- ===== no branch ===== -->
  <path d="M 456 248 L 608 248" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="508" y="238" text-anchor="middle" font-size="12" fill="#777">否</text>
  <g filter="url(#sk)">
    <ellipse cx="700" cy="248" rx="62" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="700" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">返回 nums</text>

  <!-- ===== yes branch ===== -->
  <path d="M 320 288 L 320 322" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="332" y="310" font-size="12" fill="#777">是（取出 from, to）</text>

  <!-- ===== step 1: lookup ===== -->
  <g filter="url(#sk)">
    <rect x="190" y="326" width="260" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="320" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">idx ← pos[from]</text>
  <text x="475" y="354" font-size="11" fill="#888">查询 O(1)，from 保证必命中</text>
  <path d="M 320 372 L 320 398" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- ===== step 2: write ===== -->
  <g filter="url(#sk)">
    <rect x="190" y="402" width="260" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="320" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">nums[idx] ← to</text>
  <text x="475" y="430" font-size="11" fill="#888">原地换值，其余元素不动</text>
  <path d="M 320 448 L 320 474" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- ===== step 3: sync ===== -->
  <g filter="url(#sk)">
    <rect x="190" y="478" width="260" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="320" y="506" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3030">删 pos[from]，加 pos[to]=idx</text>
  <text x="475" y="506" font-size="11" fill="#888">一删一增，恒 n 个键</text>

  <!-- ===== loop back ===== -->
  <path d="M 320 524 L 320 556 L 122 556 L 122 248 L 180 248" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="8 5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="576" font-size="12" fill="#b85450" font-weight="bold">回到判断，处理下一个操作（共 m 次）</text>

  <!-- ===== invariant box ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="586" width="800" height="42" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="90" y="604" font-size="12" font-weight="bold" fill="#2b2b2b">不变量：pos 恒为当前数组的「值 → 下标」双射</text>
  <text x="90" y="621" font-size="11" fill="#555">互异性（引理 1）⇒ 双射存在；每步同步（引理 2）⇒ 镜像保持。时间 O(n+m)，空间 O(n)</text>
</svg>
