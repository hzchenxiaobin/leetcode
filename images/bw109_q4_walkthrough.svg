<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：n = 10，x = 2（物品 1、4、9）</text>

  <!-- 初始 -->
  <g filter="url(#rough2)">
    <text x="60" y="64" font-size="12.5" fill="#555">初始：dp[0]=1，其余为 0</text>
    <g>
      <rect x="60" y="76" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
      <text x="83" y="98" text-anchor="middle" font-size="12.5" fill="#1d5c1a">1</text>
      <text x="83" y="124" text-anchor="middle" font-size="10" fill="#888">s=0</text>
      <rect x="106" y="76" width="46" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
      <text x="129" y="98" text-anchor="middle" font-size="12.5" fill="#333">0</text>
      <text x="129" y="124" text-anchor="middle" font-size="10" fill="#888">1</text>
      <rect x="152" y="76" width="46" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
      <text x="175" y="98" text-anchor="middle" font-size="12.5" fill="#333">0</text>
      <text x="175" y="124" text-anchor="middle" font-size="10" fill="#888">2</text>
      <rect x="198" y="76" width="46" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
      <text x="221" y="98" text-anchor="middle" font-size="12.5" fill="#333">0</text>
      <text x="221" y="124" text-anchor="middle" font-size="10" fill="#888">3</text>
      <rect x="244" y="76" width="46" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
      <text x="267" y="98" text-anchor="middle" font-size="12.5" fill="#333">0</text>
      <text x="267" y="124" text-anchor="middle" font-size="10" fill="#888">4</text>
      <rect x="290" y="76" width="46" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
      <text x="313" y="98" text-anchor="middle" font-size="12.5" fill="#333">0</text>
      <text x="313" y="124" text-anchor="middle" font-size="10" fill="#888">5</text>
      <rect x="336" y="76" width="46" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
      <text x="359" y="98" text-anchor="middle" font-size="12.5" fill="#333">0</text>
      <text x="359" y="124" text-anchor="middle" font-size="10" fill="#888">…</text>
      <rect x="382" y="76" width="46" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
      <text x="405" y="98" text-anchor="middle" font-size="12.5" fill="#333">0</text>
      <text x="405" y="124" text-anchor="middle" font-size="10" fill="#888">10</text>
    </g>
  </g>

  <!-- 加入物品 1 -->
  <g filter="url(#rough2)">
    <text x="60" y="152" font-size="12.5" fill="#4a7a3a">加入 1²=1：dp[1] += dp[0] → dp[1]=1</text>
    <rect x="106" y="162" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="129" y="184" text-anchor="middle" font-size="12.5" fill="#1d5c1a">1</text>
  </g>

  <!-- 加入物品 4 -->
  <g filter="url(#rough2)">
    <text x="60" y="216" font-size="12.5" fill="#4a7a3a">加入 2²=4（倒序）：dp[5] += dp[1]，dp[4] += dp[0]</text>
    <rect x="244" y="226" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="267" y="248" text-anchor="middle" font-size="12.5" fill="#1d5c1a">1</text>
    <rect x="290" y="226" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="313" y="248" text-anchor="middle" font-size="12.5" fill="#1d5c1a">1</text>
  </g>

  <!-- 加入物品 9 -->
  <g filter="url(#rough2)">
    <text x="60" y="280" font-size="12.5" fill="#4a7a3a">加入 3²=9（倒序）：dp[10] += dp[1]，dp[13] 越界不算</text>
    <rect x="382" y="290" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="405" y="312" text-anchor="middle" font-size="12.5" fill="#b85450">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="316" width="448" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" fill-opacity="0.5"/>
    <text x="260" y="338" text-anchor="middle" font-size="12.5" fill="#8a6d1f">dp[10] = 1（方案 {1², 3²}），输出 1 ✓</text>
  </g>
</svg>
