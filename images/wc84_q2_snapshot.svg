<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="69" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">所有替换基于原串，一次扫描拼出结果</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="310.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">s = "abcd"，操作 0 改 a→eee，操作 2 改 cd→ffff</text>
  <g filter="url(#rough2)"><rect x="190" y="92" width="48" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="214.0" y="120.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="250" y="92" width="48" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="274.0" y="120.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="310" y="92" width="48" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="334.0" y="120.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)"><rect x="370" y="92" width="48" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="394.0" y="120.56" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">d</text>
  <text x="214.0" y="150" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">0</text>
  <text x="274.0" y="150" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="334.0" y="150" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="394.0" y="150" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="188" y="158" width="52" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="214.0" y="175" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">索引 0</text>
  <g filter="url(#rough2)"><rect x="308" y="158" width="112" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="364.0" y="175" text-anchor="middle" font-size="10.5" fill="#2e5e22" filter="url(#rough2)">索引 2</text>
  <text x="320" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">索引 0 的 "a" 与 sources[0] 相同 ⇒ 换成 eee；索引 2 的 "cd" ⇒ 换成 ffff</text>
  <text x="320" y="223" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">中间的 s[1] = "b" 未被任何操作覆盖，原样保留</text>
  <g filter="url(#rough2)"><rect x="70" y="236" width="140" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="140" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#rough2)">eee</text>
  <text x="140" y="274" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#rough2)">= targets[0]</text>
  <g filter="url(#rough2)"><rect x="250" y="236" width="140" height="46" rx="6" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.6"/></g>
  <text x="320" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#555" filter="url(#rough2)">b</text>
  <text x="320" y="274" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">= 原串未覆盖段</text>
  <g filter="url(#rough2)"><rect x="430" y="236" width="140" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="500" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">ffff</text>
  <text x="500" y="274" text-anchor="middle" font-size="10" fill="#2e5e22" filter="url(#rough2)">= targets[1]</text>
  <text x="225" y="258" text-anchor="middle" font-size="16" font-weight="bold" fill="#666" filter="url(#rough2)">+</text>
  <text x="405" y="258" text-anchor="middle" font-size="16" font-weight="bold" fill="#666" filter="url(#rough2)">+</text>
  <path d="M 320 284 Q 320.0 294.0 320 304" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="180" y="306" width="280" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="320" y="334" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">eeebffff</text>
  <g filter="url(#rough2)"><rect x="90" y="360" width="460" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320.0" y="382" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">替换操作互不影响：拼接时永远从原串 s 里取未被覆盖的片段</text>
  </svg>