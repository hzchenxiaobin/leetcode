<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算 nums = [5,2,3,1]：过期条目被校验拦下</text>
  <path d="M 130 36 Q 320 44 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始 -->
  <text x="40" y="66" font-size="12.5" font-weight="bold" fill="#666">初始</text>
  <g filter="url(#sk)">
    <rect x="40" y="76" width="56" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="68" y="99" text-anchor="middle" font-size="13.5" fill="#2b2b2b">5</text>
  <g filter="url(#sk)">
    <rect x="100" y="76" width="56" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="128" y="99" text-anchor="middle" font-size="13.5" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="160" y="76" width="56" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="188" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">3</text>
  <g filter="url(#sk)">
    <rect x="220" y="76" width="56" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="248" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">1</text>
  <path d="M 68 116 Q 98 132 128 116" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="98" y="148" text-anchor="middle" font-size="11" fill="#666">7</text>
  <path d="M 128 116 Q 158 132 188 116" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="158" y="148" text-anchor="middle" font-size="11" fill="#666">5</text>
  <path d="M 188 116 Q 218 132 248 116" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="218" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">4 ← 最小</text>
  <g filter="url(#sk)">
    <rect x="310" y="62" width="300" height="94" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="460" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">堆：(4, 2) (5, 1) (7, 0)</text>
  <text x="460" y="108" text-anchor="middle" font-size="11.5" fill="#7a5415">3 个相邻对按现和入堆</text>
  <text x="460" y="132" text-anchor="middle" font-size="11.5" fill="#7a5415">bad = 2（5&gt;2 与 3&gt;1）</text>
  <path d="M 262 94 L 306 94" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 第 1 轮 -->
  <text x="40" y="190" font-size="12.5" font-weight="bold" fill="#666">第 1 轮</text>
  <text x="96" y="190" font-size="11.5" fill="#666">弹 (4, 2)：校验通过 → 合并 (3,1)</text>
  <g filter="url(#sk)">
    <rect x="40" y="200" width="56" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="68" y="223" text-anchor="middle" font-size="13.5" fill="#2b2b2b">5</text>
  <g filter="url(#sk)">
    <rect x="100" y="200" width="56" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="128" y="223" text-anchor="middle" font-size="13.5" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="160" y="200" width="56" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="188" y="223" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="224" y="223" font-size="11" fill="#2e6e2e">← 3+1</text>
  <path d="M 68 240 Q 98 256 128 240" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="98" y="272" text-anchor="middle" font-size="11" fill="#666">7</text>
  <path d="M 128 240 Q 158 256 188 240" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="160" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">6 ← 补推</text>
  <g filter="url(#sk)">
    <rect x="310" y="186" width="300" height="102" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="460" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">堆：(5, 1) (6, 1) (7, 0)</text>
  <text x="380" y="234" font-size="11.5" fill="#b85450" font-weight="bold">(5, 1) 已过期！</text>
  <text x="460" y="256" text-anchor="middle" font-size="11.5" fill="#7a5415">下标 1 处的右邻从 3 换成了 4，</text>
  <text x="460" y="274" text-anchor="middle" font-size="11.5" fill="#7a5415">现和是 2+4=6 ≠ 5</text>
  <text x="40" y="296" font-size="11.5" fill="#666">bad = 1（只剩 5&gt;2）</text>

  <!-- 第 2 轮 -->
  <text x="40" y="330" font-size="12.5" font-weight="bold" fill="#666">第 2 轮</text>
  <text x="96" y="330" font-size="11.5" fill="#666">先弹 (5, 1)：2+4=6 ≠ 5 → 丢弃</text>
  <g filter="url(#sk)">
    <rect x="310" y="318" width="300" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="460" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">校验拦下过期条目 (5, 1)</text>
  <text x="460" y="356" text-anchor="middle" font-size="11.5" fill="#b85450">→ 丢弃，继续弹堆</text>
  <text x="40" y="368" font-size="12.5" font-weight="bold" fill="#666">再弹 (6, 1)</text>
  <text x="130" y="368" font-size="11.5" fill="#666">校验通过 → 合并 (2,4)</text>
  <g filter="url(#sk)">
    <rect x="40" y="380" width="56" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="68" y="403" text-anchor="middle" font-size="13.5" fill="#2b2b2b">5</text>
  <g filter="url(#sk)">
    <rect x="100" y="380" width="56" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="128" y="403" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">6</text>
  <text x="164" y="403" font-size="11" fill="#2e6e2e">← 2+4</text>
  <g filter="url(#sk)">
    <rect x="310" y="380" width="300" height="46" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="460" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">bad = 0（5 ≤ 6）</text>
  <text x="460" y="418" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">→ 非递减，停机！</text>

  <!-- 结论 -->
  <g filter="url(#sk)">
    <rect x="30" y="456" width="580" height="76" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="486" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">两次合并后数组非递减 → 答案 ops = 2（与示例一致）</text>
  <text x="320" y="512" text-anchor="middle" font-size="11.5" fill="#2e6e2e">校验不是防御性编程：过期条目一旦抢在真正的最小对之前被采纳，执行链就整体跑偏</text>
</svg>
