<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次计数 + 一次按奇偶累加</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">时间 O(n)，空间 O(|Σ|)，|Σ| ≤ 52（大写 26 + 小写 26）</text>

  <rect x="110" y="64" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 统计频次：cnt[c] ← cnt[c] + 1</text>
  <text x="280" y="100" text-anchor="middle" font-size="9" fill="#6a7a96" filter="url(#rough2)">'A' 与 'a' 属于两个不同字符，分开计数</text>

  <path d="M 280 108 L 280 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="90" y="126" width="380" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">② ans ← ans + 2 × (cnt[c] ÷ 2 向下取整)</text>
  <text x="280" y="167" text-anchor="middle" font-size="9.5" fill="#6a7a96" filter="url(#rough2)">每个字符能放进回文的最大偶数用量，成对摆在左右两侧</text>

  <path d="M 280 180 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="90" y="198" width="380" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 若 ans &lt; n（说明还有落单字符）</text>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">ans ← ans + 1，挑一个落单字符放到正中心</text>

  <path d="M 280 254 L 280 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="292" y="266" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="140" y="272" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="299" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">④ 返回 ans</text>

  <path d="M 470 153 L 510 153 L 510 294 L 424 294" stroke="#999" stroke-width="1.3" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="490" y="144" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">否</text>
  <text x="510" y="128" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">全偶数</text>

  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">落单字符不管有多少个，中心都只有 1 个位置，所以最多 +1</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">若全部频次都是偶数，则 ans 已等于 n，绝不能 +1（否则超过 s 的长度）</text>
</svg>
