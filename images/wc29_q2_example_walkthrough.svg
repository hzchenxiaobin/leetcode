<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,4,3,2]，n = 2</text>

  <text x="75" y="76" font-size="10" fill="#888" filter="url(#rough2)">排序后</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="160" y="54" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="186" y="76" fill="#3a5a30">1</text>
    <rect x="220" y="54" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="246" y="76" fill="#3a5a30">2</text>
    <rect x="280" y="54" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="306" y="76" fill="#8a6a20">3</text>
    <rect x="340" y="54" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="366" y="76" fill="#8a6a20">4</text>
  </g>
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.6" fill="none">
    <path d="M 160 96 L 160 102 L 272 102 L 272 96"/>
    <path d="M 280 96 L 280 102 L 392 102 L 392 96"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="112" width="480" height="144" fill="#fff" stroke="#777" stroke-width="1.4" rx="6"/>
    <rect x="41" y="221" width="478" height="34" fill="#e6f4ea" stroke="none"/>
    <line x1="40" y1="148" x2="520" y2="148" stroke="#777" stroke-width="1.2"/>
    <line x1="190" y1="112" x2="190" y2="256" stroke="#bbb" stroke-width="1"/>
    <line x1="430" y1="112" x2="430" y2="256" stroke="#bbb" stroke-width="1"/>
    <line x1="40" y1="220" x2="520" y2="220" stroke="#777" stroke-width="1"/>
    <line x1="40" y1="256" x2="520" y2="256" stroke="#4a7a3a" stroke-width="2"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="115" y="134" font-weight="bold">分法</text>
    <text x="310" y="134" font-weight="bold">各对取得的较小者</text>
    <text x="475" y="134" font-weight="bold">总和</text>

    <text x="115" y="170">(1,4) (2,3)</text>
    <text x="310" y="170">1 + 2</text>
    <text x="475" y="170">3</text>

    <text x="115" y="206">(1,3) (2,4)</text>
    <text x="310" y="206">1 + 2</text>
    <text x="475" y="206">3</text>

    <text x="115" y="242" fill="#3a5a30">(1,2) (3,4)</text>
    <text x="310" y="242" fill="#3a5a30">1 + 3</text>
    <text x="475" y="242" fill="#3a5a30" font-weight="bold">4 ← 最优</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="272" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="280" y="297" text-anchor="middle" font-size="10.5" fill="#3a5a30">最优分法即相邻配对，答案 = 偶数下标之和 a₀ + a₂ = 1 + 3 = 4</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#666" text-anchor="middle">
    <text x="280" y="342">另一组示例 [6,2,6,5,1,2]：排序得 1,2,2,5,6,6</text>
    <text x="280" y="364">相邻配对 (1,2)(2,5)(6,6) → 1 + 2 + 6 = 9</text>
  </g>
</svg>
