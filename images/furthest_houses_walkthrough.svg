<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6e9e"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e6e2e"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：一次遍历，两个候选取 max</text>
  <path d="M 160 40 Q 320 50 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Example 1: [1,1,1,6,1,1,1] -->
  <text x="320" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">示例 1：colors = [1,1,1,6,1,1,1]</text>
  <g filter="url(#sk2)">
    <rect x="106" y="84" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="168" y="84" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="230" y="84" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="292" y="84" width="56" height="34" rx="4" fill="#fbe4ec" stroke="#b8548a" stroke-width="2.2"/>
    <rect x="354" y="84" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="416" y="84" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="478" y="84" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="134" y="106">1</text><text x="196" y="106">1</text><text x="258" y="106">1</text>
    <text x="320" y="106" fill="#a03a6a">6</text>
    <text x="382" y="106">1</text><text x="444" y="106">1</text><text x="506" y="106">1</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="134" y="130">0</text><text x="196" y="130">1</text><text x="258" y="130">2</text>
    <text x="320" y="130">3</text><text x="382" y="130">4</text><text x="444" y="130">5</text><text x="506" y="130">6</text>
  </g>
  <g font-size="12" fill="#444" font-family="monospace">
    <text x="106" y="152" fill="#2b6e9e">colors[0]=1 → 从右向左第一个 ≠1 在 j=3，候选一 = 3</text>
    <text x="106" y="170" fill="#2e6e2e">colors[6]=1 → 从左向右第一个 ≠1 在 i=3，候选二 = 6−3 = 3</text>
    <text x="106" y="188" fill="#7a5415" font-weight="bold">ans = max(3, 3) = 3</text>
  </g>

  <!-- Example 2: [1,8,3,8,3] -->
  <text x="320" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">示例 2：colors = [1,8,3,8,3]</text>
  <g filter="url(#sk2)">
    <rect x="150" y="238" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="212" y="238" width="56" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="274" y="238" width="56" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="336" y="238" width="56" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
    <rect x="398" y="238" width="56" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="178" y="260">1</text><text x="240" y="260">8</text><text x="302" y="260">3</text>
    <text x="364" y="260">8</text><text x="426" y="260">3</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="178" y="284">0</text><text x="240" y="284">1</text><text x="302" y="284">2</text>
    <text x="364" y="284">3</text><text x="426" y="284">4</text>
  </g>
  <path d="M 426 292 Q 340 316 214 310" stroke="#2b6e9e" stroke-width="1.7" fill="none" filter="url(#sk)" marker-end="url(#arB)"/>
  <text x="320" y="322" text-anchor="middle" font-size="11" fill="#2b6e9e" font-family="monospace">colors[0]=1 → 第一个 ≠1 在 j=4，候选一 = 4</text>
  <path d="M 240 292 Q 300 336 372 330" stroke="#2e6e2e" stroke-width="1.7" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>
  <text x="320" y="350" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">colors[4]=3 → 第一个 ≠3 在 i=1，候选二 = 4−1 = 3</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="180" y="366" width="280" height="40" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="392" text-anchor="middle" font-size="16" fill="#7a5415" font-weight="bold">ans = max(4, 3) = 4 ✓</text>
</svg>
