<svg xmlns="http://www.w3.org/2000/svg" width="940" height="590" viewBox="0 0 940 590" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="590" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：f(t) 关于 t 单调不减 —— 删的边只多不少，分量只增不减</text>
  <path d="M 240 42 Q 470 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左侧：阶梯函数图（示例 2 数据） ===== -->
  <g filter="url(#sk)">
    <line x1="110" y1="470" x2="620" y2="470" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="110" y1="470" x2="110" y2="90" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <g font-size="13" fill="#555" filter="url(#sk)">
    <text x="110" y="494" text-anchor="middle">0</text>
    <text x="230" y="494" text-anchor="middle">2</text>
    <text x="350" y="494" text-anchor="middle">4</text>
    <text x="600" y="494" text-anchor="end">时间 t →</text>
    <text x="96" y="415" text-anchor="end">1</text>
    <text x="96" y="335" text-anchor="end">2</text>
    <text x="96" y="255" text-anchor="end">3</text>
    <text x="126" y="84">连通分量数 f(t)</text>
  </g>

  <!-- 阶梯曲线 -->
  <g filter="url(#sk)">
    <line x1="110" y1="410" x2="230" y2="410" stroke="#446688" stroke-width="3"/>
    <line x1="230" y1="410" x2="230" y2="330" stroke="#446688" stroke-width="3"/>
    <line x1="230" y1="330" x2="350" y2="330" stroke="#446688" stroke-width="3"/>
    <line x1="350" y1="330" x2="350" y2="250" stroke="#446688" stroke-width="3"/>
    <line x1="350" y1="250" x2="596" y2="250" stroke="#446688" stroke-width="3"/>
  </g>
  <!-- 开/闭点：删除条件含等号，闭点在上方 -->
  <g filter="url(#sk)">
    <circle cx="230" cy="410" r="6" fill="#fdfcf7" stroke="#446688" stroke-width="2"/>
    <circle cx="230" cy="330" r="6" fill="#446688"/>
    <circle cx="350" cy="330" r="6" fill="#fdfcf7" stroke="#446688" stroke-width="2"/>
    <circle cx="350" cy="250" r="8" fill="#b85450"/>
  </g>

  <!-- k 阈值线 -->
  <g filter="url(#sk)">
    <line x1="110" y1="250" x2="342" y2="250" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5"/>
  </g>
  <text x="118" y="240" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">k = 3</text>

  <!-- 答案竖线 -->
  <g filter="url(#sk)">
    <line x1="350" y1="250" x2="350" y2="470" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5"/>
  </g>
  <text x="350" y="516" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">答案 t = 4</text>

  <!-- 跳变点提示框 -->
  <g filter="url(#sk)">
    <rect x="128" y="120" width="252" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <path d="M 240 186 Q 230 250 231 320" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="254" y="146" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#sk)">跳变发生在 t = time 处</text>
  <text x="254" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">删除条件是 time ≤ t，含等号！</text>

  <!-- 答案提示框 -->
  <g filter="url(#sk)">
    <rect x="420" y="130" width="186" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <path d="M 430 178 Q 400 210 360 242" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="513" y="156" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">f(t) ≥ k 首次成立</text>
  <text x="513" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">此处的 t 即答案</text>

  <text x="365" y="548" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">以示例 2 为例：n=3，边 (0,1,time=2)、(1,2,time=4)。f 是阶梯函数，答案只会出现在 0 或某条边的 time 上</text>

  <!-- ===== 右侧：单调性的红利 ===== -->
  <text x="780" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">单调性带来两个红利</text>

  <g filter="url(#sk)">
    <rect x="650" y="98" width="268" height="106" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="666" y="124" font-size="13" font-weight="bold" fill="#8a6a1a">① 可以二分答案</text>
  <text x="666" y="150" font-size="12" fill="#444">在互异时间上二分最小可行的 t，</text>
  <text x="666" y="172" font-size="12" fill="#444">每次 check 用并查集数分量数</text>
  <text x="666" y="194" font-size="11" fill="#888">O(m log m)，但每个 mid 重建 DSU</text>

  <g filter="url(#sk)">
    <rect x="650" y="222" width="268" height="122" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="666" y="248" font-size="13" font-weight="bold" fill="#2e6e2e">② 可以倒序一趟（推荐）</text>
  <text x="666" y="274" font-size="12" fill="#444">从「全部删光」出发，按 time 从大到小</text>
  <text x="666" y="296" font-size="12" fill="#444">把边加回来，分量数只降不升，</text>
  <text x="666" y="318" font-size="12" fill="#444">候选 t 一路压低，压不动为止</text>
  <text x="666" y="338" font-size="11" fill="#888">一趟扫描：逆向 Kruskal</text>

  <g filter="url(#sk)">
    <rect x="650" y="362" width="268" height="94" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="666" y="388" font-size="13" font-weight="bold" fill="#b85450">必然有解</text>
  <text x="666" y="414" font-size="12" fill="#444">t ≥ 最大 time 时全图散成 n 个点，</text>
  <text x="666" y="436" font-size="12" fill="#444">而 k ≤ n 恒成立 → 答案必存在</text>

  <g filter="url(#sk)">
    <rect x="650" y="472" width="268" height="82" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="666" y="498" font-size="13" font-weight="bold" fill="#2b6e9e">小剪刀涂鸦</text>
  <text x="666" y="524" font-size="12" fill="#444">每剪断一条关键边，分量 +1</text>
  <text x="666" y="544" font-size="12" fill="#444">（环边剪了也白剪，不变）</text>
</svg>
