<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrRStart" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3 演算：第 2 行「read」vs 第 2 列「lead」</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">按行优先检查镜像格：(0,0) … (1,3) 全部通过，第 9 步在 (2,0) 处分叉</text>

  <!-- 列标签 -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <text x="109" y="78" fill="#888">col0</text>
    <text x="155" y="78" fill="#888">col1</text>
    <text x="201" y="78" fill="#4a7a3a" font-weight="bold">col2</text>
    <text x="247" y="78" fill="#888">col3</text>
  </g>
  <!-- 行标签 -->
  <g filter="url(#rough2)" font-size="9" text-anchor="end">
    <text x="78" y="113" fill="#888">row0</text>
    <text x="78" y="159" fill="#888">row1</text>
    <text x="78" y="205" fill="#446688" font-weight="bold">row2</text>
    <text x="78" y="251" fill="#888">row3</text>
  </g>

  <!-- 网格：ball / area / read / lady -->
  <g filter="url(#rough2)">
    <rect x="86" y="84" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="132" y="84" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="178" y="84" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="224" y="84" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>

    <rect x="86" y="130" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="132" y="130" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="178" y="130" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="224" y="130" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>

    <rect x="86" y="176" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="132" y="176" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="178" y="176" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="224" y="176" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>

    <rect x="86" y="222" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="132" y="222" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="178" y="222" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="224" y="222" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>

  <!-- 主对角线 -->
  <path d="M 86 84 L 270 268" stroke="#bbb" stroke-width="1.1" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 镜像对 (0,2) ↔ (2,0)：虚线引导 + 双向箭头（画在字母之下） -->
  <path d="M 201 107 L 178 130" stroke="#e0a0a0" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 109 199 L 132 176" stroke="#e0a0a0" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 175 133 L 135 173" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arrR)" marker-start="url(#arrRStart)" filter="url(#rough2)"/>

  <!-- 字母 -->
  <g filter="url(#rough2)" font-size="17" text-anchor="middle" font-weight="bold" fill="#3a4a66">
    <text x="109" y="118">b</text><text x="155" y="118">a</text><text x="201" y="118">l</text><text x="247" y="118">l</text>
    <text x="109" y="164">a</text><text x="155" y="164">r</text><text x="201" y="164">e</text><text x="247" y="164">a</text>
    <text x="109" y="210">r</text><text x="155" y="210">e</text><text x="201" y="210">a</text><text x="247" y="210">d</text>
    <text x="109" y="256">l</text><text x="155" y="256">a</text><text x="201" y="256">d</text><text x="247" y="256">y</text>
  </g>

  <!-- 冲突标记 -->
  <g filter="url(#rough2)" font-size="12" font-weight="bold" fill="#b85450">
    <text x="206" y="98">✗</text>
    <text x="114" y="190">✗</text>
  </g>

  <!-- 网格下方说明 -->
  <text x="178" y="292" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">第 2 行 read（蓝）　与　第 2 列 lead（绿）</text>
  <text x="178" y="308" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">首字符一个 'r' 一个 'l'，立刻分叉</text>

  <!-- 右侧进度 -->
  <rect x="292" y="84" width="242" height="184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#5a4a20">
    <text x="306" y="108" font-size="11" font-weight="bold" fill="#8a6a20">按行优先的检查进度</text>
    <text x="306" y="127" fill="#3a5a30">i=0　b a l l　4 格全过 ✓</text>
    <text x="306" y="146" fill="#3a5a30">i=1　a r e a　4 格全过 ✓</text>
    <text x="306" y="165">i=2　j=0：words[2][0]='r'</text>
    <text x="306" y="184">　　　镜像 words[0][2]='l'</text>
    <text x="306" y="203" fill="#8a3a36">→ 不等，立即 return false</text>
    <text x="306" y="222">只比较了 9 个字符，</text>
    <text x="306" y="241">无需构造完整的第 2 列</text>
  </g>

  <!-- 结论 -->
  <rect x="48" y="318" width="464" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#3a5a30">
    <text x="64" y="340" font-size="10.5">判定只需逐格镜像比对：一旦分叉立即返回，无需构造任何列字符串</text>
    <text x="64" y="360" font-size="10.5">最坏 O(m) 次字符比较（m 为总字符数），额外空间 O(1)</text>
  </g>
</svg>
