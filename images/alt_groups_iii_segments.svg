<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：坏边把环切成若干「交替段」，查询坍缩成段长计数</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="28" y="58" width="122" height="52" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="40" y="78" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 坏边（同色相邻）</text>
  <text x="40" y="98" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 好边（异色相邻）</text>

  <!-- ===== ring of tiles: colors = [0,0,1,0,1,1] ===== -->
  <!-- tile 0 (red) -->
  <g filter="url(#rough2)">
    <rect x="243" y="38" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="316.6" y="80.5" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="316.6" y="165.5" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="243" y="208" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="169.4" y="165.5" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="169.4" y="80.5" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="260" y="60" fill="#b85450">0</text>
    <text x="333.6" y="102.5" fill="#b85450">0</text>
    <text x="333.6" y="187.5" fill="#446688">1</text>
    <text x="260" y="230" fill="#b85450">0</text>
    <text x="186.4" y="187.5" fill="#446688">1</text>
    <text x="186.4" y="102.5" fill="#446688">1</text>
  </g>
  <g font-size="10" fill="#888888" text-anchor="middle" filter="url(#rough2)">
    <text x="284" y="44">i=0</text>
    <text x="357.6" y="86.5">i=1</text>
    <text x="357.6" y="171.5">i=2</text>
    <text x="284" y="214">i=3</text>
    <text x="152.4" y="171.5">i=4</text>
    <text x="152.4" y="86.5">i=5</text>
  </g>

  <!-- edge marks -->
  <g filter="url(#rough2)">
    <circle cx="296.8" cy="76.3" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="186.4" cy="140" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="296.8" y="81.3" fill="#b85450">✗</text>
    <text x="186.4" y="145" fill="#b85450">✗</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">
    <text x="333.6" y="145">✓</text>
    <text x="296.8" y="208.8">✓</text>
    <text x="223.2" y="208.8">✓</text>
    <text x="223.2" y="81.3">✓</text>
  </g>
  <text x="296.8" y="62" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">e0</text>
  <text x="347" y="136" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">e1</text>
  <text x="296.8" y="194" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">e2</text>
  <text x="223.2" y="194" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">e3</text>
  <text x="170" y="126" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">e4</text>
  <text x="223.2" y="62" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">e5</text>

  <!-- cut arrow -->
  <path d="M 260 250 L 260 272" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="264" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">在坏边 e0、e4 处剪开 →</text>

  <!-- ===== segments ===== -->
  <text x="134" y="281" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">长 4 的交替段（瓷砖 1~4）</text>
  <g filter="url(#rough2)">
    <rect x="55" y="286" width="158" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="68" y="295" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="102" y="295" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="136" y="295" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="170" y="295" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="82" y="313" fill="#b85450">0</text>
    <text x="116" y="313" fill="#446688">1</text>
    <text x="150" y="313" fill="#b85450">0</text>
    <text x="184" y="313" fill="#446688">1</text>
  </g>

  <text x="365" y="281" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">长 2 的交替段（瓷砖 5、0）</text>
  <g filter="url(#rough2)">
    <rect x="320" y="286" width="90" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="334" y="295" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="368" y="295" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="348" y="313" fill="#446688">1</text>
    <text x="382" y="313" fill="#b85450">0</text>
  </g>

  <!-- ===== formula box ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="352" width="440" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="260" y="376" font-size="11.5" fill="#a07820" text-anchor="middle" filter="url(#rough2)">段长计数：cnt[2] = 1，cnt[4] = 1（其余为 0）</text>
  <text x="260" y="402" font-size="12.5" font-weight="bold" fill="#a07820" text-anchor="middle" filter="url(#rough2)">answer(L) = Σ_{len ≥ L} cnt[len] · (len − L + 1)</text>
  <text x="260" y="430" font-size="11.5" fill="#a07820" text-anchor="middle" filter="url(#rough2)">L = 3：cnt[2] 贡献 0，cnt[4] 贡献 4 − 3 + 1 = 2 → 答案 2 ✓</text>
</svg>
