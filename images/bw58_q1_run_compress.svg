<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">游程压缩：每个同字符段至多保留前两个</text>

  <!-- 原串 -->
  <text x="60" y="66" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">s = "aaabaaaa"</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="78" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="94"  y="78" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="128" y="78" width="34" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="162" y="78" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="196" y="78" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="230" y="78" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="264" y="78" width="34" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="298" y="78" width="34" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="77" y="104">a</text><text x="111" y="104">a</text><text x="145" y="104">a</text>
    <text x="179" y="104">b</text><text x="213" y="104">a</text><text x="247" y="104">a</text>
    <text x="281" y="104">a</text><text x="315" y="104">a</text>
  </g>
  <text x="110" y="142" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">游程 1：aaa（留 2 删 1）</text>
  <text x="262" y="142" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">游程 2：aaaa（留 2 删 2）</text>

  <!-- 删除箭头 -->
  <path d="M 145 124 L 145 168" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 281 124 L 281 168" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 315 124 L 315 168" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果串 -->
  <text x="60" y="192" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">ans = "aabaa"</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="200" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="94"  y="200" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="128" y="200" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="162" y="200" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="196" y="200" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="77" y="226">a</text><text x="111" y="226">a</text><text x="145" y="226">b</text>
    <text x="179" y="226">a</text><text x="213" y="226">a</text>
  </g>

  <rect x="60" y="258" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11.5" fill="#8a6a1f" filter="url(#rough2)">好字符串 ⇔ 每个游程长度 ≤ 2；删除最少 ⇔ 每段保留前两个</text>
</svg>
