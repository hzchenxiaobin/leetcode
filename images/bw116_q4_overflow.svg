<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="77"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">上界速查：Σ d(l, i)² 最坏 ≈ n³/3，取模后必须精确维护中间量</text>

  <g filter="url(#rough2)">
    <!-- 左：上界图 -->
    <text x="86" y="62" font-size="12.5" fill="#446688">最坏情形：元素互不相同</text>
    <rect x="56" y="76" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="71" y="92" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <rect x="90" y="76" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="105" y="92" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <rect x="124" y="76" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="139" y="92" text-anchor="middle" font-size="10.5" fill="#333">3</text>
    <rect x="158" y="76" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="173" y="92" text-anchor="middle" font-size="10.5" fill="#333">…</text>

    <text x="86" y="126" font-size="12" fill="#555">d(l, i) = i − l + 1</text>
    <text x="86" y="148" font-size="12" fill="#555">Σ_l d² = Σ k² ≈ n³/3</text>
    <text x="86" y="176" font-size="12" fill="#b85450">n = 10⁵ 时 ≈ 3×10¹⁴</text>
    <text x="86" y="198" font-size="12" fill="#b85450">必须 64 位（long long）</text>

    <!-- 右：取模策略 -->
    <rect x="250" y="56" width="238" height="164" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="369" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a">维护策略</text>
    <text x="266" y="110" font-size="12" fill="#555">S（当前行的平方和）：精确 64 位</text>
    <text x="266" y="134" font-size="12" fill="#555">　S ≤ n·n² ≈ 10¹⁵ &lt; 2⁶³</text>
    <text x="266" y="162" font-size="12" fill="#555">T（区间和查询）：模意义下做</text>
    <text x="266" y="184" font-size="12" fill="#555">　ΔS = 2T + (i−j) 也在模意义</text>
    <text x="266" y="208" font-size="12" fill="#555">　ans 每步 += S 后立即取模</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="240" width="460" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.55"/>
    <text x="58" y="266" font-size="13" fill="#d6a040">为什么 S 不取模也安全？</text>
    <text x="58" y="290" font-size="12.5" fill="#555">每行 S ≤ Σ_{l≤i} (i−l+1)² ≤ Σ_{k=1}^{n} k² ≈ n³/3 ≈ 3.3×10¹⁴，64 位绰绰有余；</text>
    <text x="58" y="314" font-size="12.5" fill="#555">2T + (i−j) 若在模意义下计算，S 也随之在模意义下递推——两种写法都对，别混用即可</text>
  </g>
</svg>
