<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="290" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">演算：weights 与三个单词</text>

  <rect x="36" y="48" width="490" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="70" font-size="11" fill="#333">"abcd"：5 + 3 + 12 + 14 = 34 → 34 % 26 = 8 → 'r'</text>
  <text x="50" y="86" font-size="10" fill="#666">权重来自 weights[a]=5, weights[b]=3, weights[c]=12, weights[d]=14</text>

  <rect x="36" y="104" width="490" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="126" font-size="11" fill="#333">"def"：14 + 1 + 2 = 17 → 17 % 26 = 17 → 'i'</text>
  <text x="50" y="142" font-size="10" fill="#666">'z' 往前 17 位：z(0) y(1) … i(17)</text>

  <rect x="36" y="160" width="490" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="182" font-size="11" fill="#333">"xyz"：7 + 7 + 2 = 16 → 16 % 26 = 16 → 'j'</text>
  <text x="50" y="198" font-size="10" fill="#666">weights[x]=7 是第 24 个字母的权重，别和字符 x 混淆</text>

  <rect x="36" y="216" width="490" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="238" font-size="12" fill="#333">拼接结果："rij"</text>
  <text x="50" y="256" font-size="10" fill="#666">三个字符分别对应三个单词，顺序不能乱</text>
</svg>
