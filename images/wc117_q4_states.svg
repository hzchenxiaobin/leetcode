<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 368"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="368" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">后序遍历向上返回三种状态</text>
  <rect x="40" y="56" width="150" height="190" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="96" text-anchor="middle" font-size="26" fill="#33475b" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="115" y="126" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">未覆盖</text>
  <text x="115" y="156" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">子树其余节点都已覆盖，</text>
  <text x="115" y="176" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">自己在等父节点来覆盖</text>
  <rect x="212" y="56" width="150" height="190" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="287" y="96" text-anchor="middle" font-size="26" fill="#33475b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="287" y="126" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">有摄像头</text>
  <text x="287" y="156" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">本节点装了摄像头，</text>
  <text x="287" y="176" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">可覆盖父、自身、直接子</text>
  <rect x="384" y="56" width="150" height="190" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="459" y="96" text-anchor="middle" font-size="26" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="459" y="126" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">已覆盖</text>
  <text x="459" y="156" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">已被孩子的摄像头覆盖，</text>
  <text x="459" y="176" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">自己没有摄像头</text>
  <rect x="40" y="262" width="490" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="289" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">空节点固定返回 2（不需要被覆盖）</text>
  <rect x="40" y="316" width="490" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="341" text-anchor="middle" font-size="11.5" fill="#33475b" filter="url(#rough2)">根若返回 0 → 再补一个摄像头</text>
</svg>
