<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：并查集（DSU）数连通块</text>

  <rect x="185" y="46" width="310" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">初始化 parent[i] = i，size[i] = 1，cnt = n</text>
  <path d="M 340 86 L 340 104" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="106" width="310" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">枚举 i = 0..n−1，j = 0..i−1，isConnected[i][j] = 1</text>
  <path d="M 340 146 L 340 164" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="166" width="310" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ri = find(i)，rj = find(j)（沿 parent 上溯到根）</text>
  <path d="M 340 206 L 340 224" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="340,226 512,264 340,302 168,264" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ri ≠ rj ?</text>

  <path d="M 176 288 L 150 318" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="130" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="52" y="320" width="228" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="166" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">把小树挂到大树下：</text>
  <text x="166" y="357" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">parent[小根] = 大根，cnt −= 1</text>

  <path d="M 504 288 L 528 318" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="546" y="292" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="404" y="320" width="228" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="518" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">已属同一省份</text>
  <text x="518" y="357" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">直接跳过，cnt 不变</text>
</svg>
