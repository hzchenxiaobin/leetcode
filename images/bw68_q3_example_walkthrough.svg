<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 演算：s = "))()))"，locked = "010100"</text>

  <!-- 表头：字符 -->
  <g font-size="12" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="128" y="56">i=0</text><text x="176" y="56">i=1</text><text x="224" y="56">i=2</text>
    <text x="272" y="56">i=3</text><text x="320" y="56">i=4</text><text x="368" y="56">i=5</text>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <rect x="105" y="64" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="153" y="64" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="201" y="64" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="249" y="64" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="297" y="64" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="345" y="64" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="128" y="84" fill="#8a6d1a">)</text><text x="176" y="84" fill="#2b3d52">)</text><text x="224" y="84" fill="#8a6d1a">)</text>
    <text x="272" y="84" fill="#2b3d52">(</text><text x="320" y="84" fill="#8a6d1a">)</text><text x="368" y="84" fill="#8a6d1a">)</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="128" y="106">通配</text><text x="176" y="106">锁定</text><text x="224" y="106">通配</text>
    <text x="272" y="106">锁定</text><text x="320" y="106">通配</text><text x="368" y="106">通配</text>
  </g>

  <!-- 区间行 -->
  <text x="52" y="140" font-size="12" fill="#446688" filter="url(#rough2)">[lo,hi]</text>
  <g font-size="12.5" text-anchor="middle" filter="url(#rough2)">
    <rect x="105" y="116" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="153" y="116" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="201" y="116" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="249" y="116" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="297" y="116" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="345" y="116" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="128" y="136">[0,1]</text><text x="176" y="136">[0,0]</text><text x="224" y="136">[0,1]</text>
    <text x="272" y="136">[1,2]</text><text x="320" y="136">[0,3]</text><text x="368" y="136">[0,4]</text>
  </g>

  <!-- 说明 -->
  <rect x="55" y="168" width="410" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12.5" fill="#2b3d52" filter="url(#rough2)">i=0：通配取 ')' 会使前缀 −1，截回 lo=0（须取 '('）</text>
  <text x="260" y="210" text-anchor="middle" font-size="12.5" fill="#2b3d52" filter="url(#rough2)">i=1：锁定 ')' 恰与前面配对，区间收窄到 [0,0]</text>
  <text x="260" y="228" text-anchor="middle" font-size="12.5" fill="#2b3d52" filter="url(#rough2)">全程 hi ≥ lo ≥ 0，未触发判死</text>

  <!-- 结论 -->
  <path d="M 260 236 C 260 252, 260 258, 260 268" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="272" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="13.5" fill="#2e4d24" filter="url(#rough2)">末尾 lo = 0（n=6 偶）→ true</text>

  <rect x="75" y="320" width="370" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#7a3b37" filter="url(#rough2)">对应方案：()(()) —— 通配取 ( ( ( )，锁定位原样</text>
</svg>
