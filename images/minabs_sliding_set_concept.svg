<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：固定右端点 j，有序集合维护「距离 ≥ x 的左前缀」</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: original array, j = 3 -->
  <text x="190" y="74" font-size="13" font-weight="bold" fill="#446688">① 扫描右端点 j = 3（x = 1，nums = [5, 3, 2, 10, 15]）</text>
  <g filter="url(#sk)">
    <rect x="190" y="84" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="268" y="84" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="346" y="84" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-dasharray="4 3" stroke-width="2.2"/>
    <rect x="424" y="84" width="56" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="502" y="84" width="56" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="218" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">5</text>
  <text x="296" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="374" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <text x="452" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">10</text>
  <text x="530" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#777">15</text>
  <text x="218" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">下标 0</text>
  <text x="296" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">下标 1</text>
  <text x="374" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a">下标 2 = j−x</text>
  <text x="452" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">j = 3</text>
  <text x="530" y="140" text-anchor="middle" font-size="10" fill="#999">未到</text>
  <text x="60" y="103" font-size="11" fill="#4a7a3a" font-weight="bold">已入集合</text>
  <text x="60" y="120" font-size="10" fill="#4a7a3a">i ≤ j−x</text>
  <text x="374" y="162" text-anchor="middle" font-size="10" fill="#7a5415">本轮新插入</text>

  <!-- arrow: green elements flow into ordered set -->
  <path d="M 300 172 Q 260 210 240 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
  <text x="238" y="210" font-size="11" fill="#4a7a3a" text-anchor="middle">按值排序插入</text>

  <!-- Row 2: ordered set -->
  <text x="190" y="196" font-size="13" font-weight="bold" fill="#2e6e2e">② 有序集合 S：左前缀按值排序</text>
  <g filter="url(#sk)">
    <rect x="190" y="240" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="268" y="240" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="346" y="240" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="218" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <text x="296" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="374" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">5</text>
  <text x="430" y="263" font-size="11" fill="#555">值序：2 ≤ 3 ≤ 5，</text>
  <text x="430" y="281" font-size="11" fill="#555">插入 / 查询都只要 O(log n)</text>

  <!-- arrow: j queries the set -->
  <path d="M 452 166 Q 452 200 420 232" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)"/>
  <text x="476" y="208" font-size="11" fill="#b85450" font-weight="bold">查询 nums[j]=10 的前驱 / 后继</text>

  <!-- Row 3: pred / succ answer -->
  <text x="190" y="312" font-size="13" font-weight="bold" fill="#b07818">③ 查询结果：前驱 5，后继不存在（S 中最大才 5）</text>
  <g filter="url(#sk)">
    <rect x="190" y="322" width="120" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="330" y="322" width="120" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="250" y="340" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">前驱（≤10 最大）</text>
  <text x="250" y="355" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5，差 |10−5| = 5</text>
  <text x="390" y="340" text-anchor="middle" font-size="11" fill="#b07818" font-weight="bold">后继（≥10 最小）</text>
  <text x="390" y="355" text-anchor="middle" font-size="12.5" fill="#333">不存在，跳过</text>
  <text x="480" y="340" font-size="11" fill="#555">ans = min(ans, 5)</text>
  <text x="480" y="358" font-size="11" fill="#555">j 前已得 ans = 1，不变</text>

  <!-- why this covers all pairs -->
  <path d="M 320 372 L 320 396" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="40" y="402" width="560" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="424" text-anchor="middle" font-size="11.5" fill="#7a5415">任意合法对 (i, j)（j − i ≥ x）都会在「扫描到 j、集合已含 i」的时刻被查到</text>
  <text x="320" y="443" text-anchor="middle" font-size="11.5" fill="#7a5415">而与 nums[j] 差值最小的候选，必落在有序集合里的前驱或后继两个位置上</text>

  <!-- takeaway -->
  <g filter="url(#sk)">
    <rect x="40" y="466" width="560" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="320" y="491" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">套路：下标约束「左移一步、右进一个」→ 在线维护有序集合 + 前驱后继查询</text>
</svg>
