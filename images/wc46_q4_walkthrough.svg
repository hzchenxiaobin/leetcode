<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">s = "abca" 的区间 DP 表与还原过程</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">按区间长度递增填写，只填上三角 j ≥ i</text>

  <text x="289" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="343" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="397" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=2</text>
  <text x="451" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=3</text>
  <text x="248" y="112" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="248" y="156" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="248" y="200" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="248" y="244" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>

  <rect x="262" y="86" width="54" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="289" y="114" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="316" y="86" width="54" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="343" y="114" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">2</text>
  <rect x="370" y="86" width="54" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="397" y="114" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <rect x="424" y="86" width="54" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="451" y="114" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="262" y="130" width="54" height="44" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="316" y="130" width="54" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="343" y="158" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="370" y="130" width="54" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="397" y="158" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="424" y="130" width="54" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="451" y="158" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>

  <rect x="262" y="174" width="54" height="44" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="316" y="174" width="54" height="44" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="370" y="174" width="54" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="397" y="202" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="424" y="174" width="54" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="451" y="202" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">2</text>

  <rect x="262" y="218" width="54" height="44" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="316" y="218" width="54" height="44" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="370" y="218" width="54" height="44" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="424" y="218" width="54" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="451" y="246" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 478 240 L 506 240 L 506 108 L 482 108" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="512" y="176" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">共享的</text>
  <text x="512" y="192" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">那一次</text>

  <rect x="30" y="86" width="200" height="176" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="110" font-size="10" fill="#555" filter="url(#rough2)">填写顺序：len = 1, 2, 3, 4</text>
  <text x="46" y="134" font-size="10" fill="#8a6a20" filter="url(#rough2)">橙色：目标 dp[0][3]</text>
  <text x="46" y="156" font-size="10" fill="#3a5a30" filter="url(#rough2)">绿色：参与转移的两项</text>
  <line x1="46" y1="170" x2="214" y2="170" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="46" y="194" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">dp[0][3] = dp[1][2] + dp[3][3]</text>
  <text x="46" y="218" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">= 2 + 1 = 3</text>
  <text x="46" y="242" font-size="9.5" fill="#777" filter="url(#rough2)">k = 3 与 0 号位同为 "a"</text>

  <rect x="262" y="290" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="272" y="312" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="308" y="290" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="318" y="312" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="354" y="290" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="364" y="312" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="400" y="290" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="312" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <text x="60" y="311" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">第 1 次：涂 a，覆盖 0..3</text>

  <rect x="262" y="330" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="272" y="352" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="308" y="330" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="318" y="352" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">b</text>
  <rect x="354" y="330" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="364" y="352" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="400" y="330" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="352" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <text x="60" y="351" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">第 2 次：涂 b，覆盖 1</text>

  <rect x="262" y="370" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="272" y="392" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="308" y="370" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="318" y="392" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">b</text>
  <rect x="354" y="370" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="364" y="392" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">c</text>
  <rect x="400" y="370" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="392" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <text x="60" y="391" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">第 3 次：涂 c，覆盖 2</text>

  <text x="60" y="428" font-size="10.5" fill="#555" filter="url(#rough2)">三次涂色依次覆盖 0..3、1、2，得到 "abca"</text>
  <text x="60" y="450" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">共 3 次，与 dp[0][3] = 3 完全一致</text>
</svg>
