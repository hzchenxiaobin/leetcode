<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：和矩阵的行与列都非递减</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两个非递减序列的笛卡尔和 ⇒ 一个行列都不递减的「杨氏矩阵」</text>

  <text x="176" y="72" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">row[j] ↓</text>
  <text x="172" y="99" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">dp[i] +</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="176" y="80" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="242" y="80" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="308" y="80" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="206" y="99" font-size="12" fill="#3a5a30">2</text>
    <text x="272" y="99" font-size="12" fill="#3a5a30">4</text>
    <text x="338" y="99" font-size="12" fill="#3a5a30">6</text>

    <rect x="64" y="124" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="64" y="176" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="64" y="228" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="92" y="146" font-size="12" fill="#3a4a66">1</text>
    <text x="92" y="198" font-size="12" fill="#3a4a66">3</text>
    <text x="92" y="250" font-size="12" fill="#3a4a66">11</text>

    <rect x="132" y="124" width="60" height="34" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="198" y="124" width="60" height="34" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="264" y="124" width="60" height="34" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="132" y="176" width="60" height="34" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="198" y="176" width="60" height="34" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="264" y="176" width="60" height="34" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="132" y="228" width="60" height="34" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="198" y="228" width="60" height="34" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <rect x="264" y="228" width="60" height="34" fill="#f4f6fb" stroke="#667799" stroke-width="1.3" rx="5"/>
    <text x="162" y="146" font-size="12.5" fill="#333">3</text>
    <text x="228" y="146" font-size="12.5" fill="#333">5</text>
    <text x="294" y="146" font-size="12.5" fill="#333">7</text>
    <text x="162" y="198" font-size="12.5" fill="#333">5</text>
    <text x="228" y="198" font-size="12.5" fill="#333">7</text>
    <text x="294" y="198" font-size="12.5" fill="#333">9</text>
    <text x="162" y="250" font-size="12.5" fill="#333">13</text>
    <text x="228" y="250" font-size="12.5" fill="#333">15</text>
    <text x="294" y="250" font-size="12.5" fill="#333">17</text>
  </g>

  <rect x="336" y="124" width="204" height="138" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#3a4a66">
    <text x="350" y="146" font-weight="bold" font-size="11">为什么能上堆？</text>
    <text x="350" y="168">• 每行右走：和只增不减</text>
    <text x="350" y="188">• 每列下走：和只增不减</text>
    <text x="350" y="208">• 所以第 k 小必在</text>
    <text x="362" y="224">堆顶「按序」被弹出</text>
    <text x="350" y="246" fill="#555">这正是 378 题的套路</text>
  </g>

  <rect x="48" y="284" width="464" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#6a5a20">
    <text x="64" y="306" font-size="11" font-weight="bold">截断引理：每轮只保留前 k 小</text>
    <text x="64" y="326" font-size="10">前 k 名之外的和 ≥ 第 k 名，加上任何行元素后仍输给前 k 名中的对应项。</text>
    <text x="64" y="340" font-size="10">所以截断不改变最终答案，规模永远被 k = 200 卡住。</text>
  </g>

  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每行一次 k 路归并：时间 O(m·k·log k)，空间 O(k)</text>
</svg>
