<svg xmlns="http://www.w3.org/2000/svg" width="660" height="414" viewBox="0 0 660 414"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="660" height="414" fill="#fafafa"/>

  <!-- ===== 演算 ①  s = 100010 ===== -->
  <text x="40" y="28" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算 ①：s = 100010（n = 6，Z = 4，O = 2，d = 2）</text>

  <g filter="url(#rough2)">
    <rect x="140" y="42" width="44" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="190" y="42" width="96" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="292" y="42" width="44" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="342" y="42" width="44" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="15" font-weight="bold" filter="url(#rough2)">
    <text x="162" y="68" text-anchor="middle" fill="#a0761e">1</text>
    <text x="238" y="68" text-anchor="middle" fill="#33517a">000</text>
    <text x="314" y="68" text-anchor="middle" fill="#a0761e">1</text>
    <text x="364" y="68" text-anchor="middle" fill="#33517a">0</text>
  </g>
  <g font-size="11" fill="#888" filter="url(#rough2)">
    <text x="162" y="95" text-anchor="middle">1 段</text>
    <text x="238" y="95" text-anchor="middle">0 段</text>
    <text x="314" y="95" text-anchor="middle">1 段</text>
    <text x="364" y="95" text-anchor="middle">0 段</text>
  </g>
  <text x="404" y="60" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">p = 2（0 段数），q = 2（1 段数）</text>
  <text x="404" y="78" font-size="11.5" fill="#666" filter="url(#rough2)">最长交替子序列 = 取每段一个字符 = 4</text>

  <!-- 表格 -->
  <g filter="url(#rough2)">
    <rect x="50" y="104" width="562" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="50" y="130" width="562" height="26" fill="#ffffff" stroke="#b9c4d4" stroke-width="1.2"/>
    <rect x="50" y="156" width="562" height="26" fill="#fbfbfd" stroke="#b9c4d4" stroke-width="1.2"/>
    <rect x="50" y="182" width="562" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="11" fill="#33517a" font-weight="bold" filter="url(#rough2)">
    <text x="80" y="121" text-anchor="middle">t</text>
    <text x="168" y="121" text-anchor="middle">|d − t| ≤ 1</text>
    <text x="314" y="121" text-anchor="middle">取 a ≤ p、b ≤ q，a − b = t</text>
    <text x="457" y="121" text-anchor="middle">m(t)</text>
    <text x="562" y="121" text-anchor="middle">保留串</text>
  </g>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="80" y="147" text-anchor="middle">−1</text>
    <text x="168" y="147" text-anchor="middle">|2 − (−1)| = 3 ✗</text>
    <text x="314" y="147" text-anchor="middle">不可行</text>
    <text x="457" y="147" text-anchor="middle">m = −∞</text>
    <text x="562" y="147" text-anchor="middle">—</text>
    <text x="80" y="173" text-anchor="middle">0</text>
    <text x="168" y="173" text-anchor="middle">|2 − 0| = 2 ✗</text>
    <text x="314" y="173" text-anchor="middle">不可行</text>
    <text x="457" y="173" text-anchor="middle">m = −∞</text>
    <text x="562" y="173" text-anchor="middle">—</text>
  </g>
  <g font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">
    <text x="80" y="201" text-anchor="middle">1</text>
    <text x="168" y="201" text-anchor="middle">|2 − 1| = 1 ✓</text>
    <text x="314" y="201" text-anchor="middle">b = min(2, 2 − 1) = 1，a = 2</text>
    <text x="457" y="201" text-anchor="middle">2 · 1 + 1 = 3</text>
    <text x="562" y="201" text-anchor="middle">"010"</text>
  </g>
  <text x="50" y="232" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 = n − best = 6 − 3 = 3　（删 s[0]=1、s[2]=0、s[3]=0，删除序 0 → 1 → 0）</text>

  <!-- ===== 演算 ②  s = 011110 ===== -->
  <text x="40" y="264" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算 ②：s = 011110（n = 6，Z = 2，O = 4，d = −2）</text>

  <g filter="url(#rough2)">
    <rect x="170" y="278" width="40" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="216" y="278" width="104" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="326" y="278" width="40" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="15" font-weight="bold" filter="url(#rough2)">
    <text x="190" y="303" text-anchor="middle" fill="#33517a">0</text>
    <text x="268" y="303" text-anchor="middle" fill="#a0761e">1111</text>
    <text x="346" y="303" text-anchor="middle" fill="#33517a">0</text>
  </g>
  <g font-size="11" fill="#888" filter="url(#rough2)">
    <text x="190" y="329" text-anchor="middle">0 段</text>
    <text x="268" y="329" text-anchor="middle">1 段</text>
    <text x="346" y="329" text-anchor="middle">0 段</text>
  </g>
  <text x="392" y="295" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">p = 2，q = 1</text>
  <text x="392" y="313" font-size="11.5" fill="#666" filter="url(#rough2)">只有 t = −1 也才勉强可行</text>

  <text x="40" y="352" font-size="12" fill="#333" filter="url(#rough2)">t = −1：|−2 − (−1)| = 1 ✓　⇒　a = min(p, q − 1) = min(2, 0) = 0，b = a + 1 = 1</text>
  <text x="40" y="374" font-size="12" fill="#333" filter="url(#rough2)">只能保留 1 个字符（"1"），删 5 个：3 个 1 与 2 个 0，删除序 0 → 1 → 0 → 1 → 0</text>
  <text x="40" y="398" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 = 6 − 1 = 5 ✓ 与官方输出一致</text>
</svg>
