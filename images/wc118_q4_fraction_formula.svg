<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="352" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0.5(25) 为什么等于 52/99</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">把无限循环写成等比级数，再用整数通分 —— 全程无浮点</text>
  <text x="30" y="68" font-size="12.5" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">循环小数 = 有限部分 + 等比级数</text>
  <rect x="40" y="84" width="130" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="105.0" y="115.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0.5</text>
  <text x="188" y="116" font-size="18" fill="#666" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+</text>
  <rect x="214" y="84" width="170" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="299.0" y="114.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0.0252525…</text>
  <text x="402" y="116" font-size="18" fill="#666" text-anchor="middle" font-weight="bold" filter="url(#rough2)">=</text>
  <rect x="430" y="84" width="100" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="480.0" y="115.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">52/99</text>
  <text x="330" y="164" font-size="11.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">25/1000 × (1 + 1/100 + 1/100^2 + …)</text>
  <path d="M 330 172 L 476 142" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="30" y="196" width="500" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="217.5" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">等比级数求和：1 + q + q^2 + … = 1 / (1 − q)，其中 q = 10^(−l_r)</text><text x="40" y="234.175" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">于是循环部分 = R / (10^l_n · (10^l_r − 1))</text>
  <rect x="30" y="272" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="293.5" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">通分后的单一分数</text><text x="40" y="310.175" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">x = [ (I · 10^l_n + N) · (10^l_r − 1) + R ] / [ 10^l_n · (10^l_r − 1) ]</text>
</svg>
