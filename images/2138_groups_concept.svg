<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：等间距切片，末组是唯一的「短组」</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== Section 1: original string cells ====== -->
  <text x="48" y="74" font-size="12.5" font-weight="bold" fill="#446688">① 原串 s：n = 10 个字符，下标 0…9</text>
  <g filter="url(#sk)">
    <rect x="150" y="84" width="38" height="38" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="188" y="84" width="38" height="38" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="226" y="84" width="38" height="38" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="264" y="84" width="38" height="38" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="302" y="84" width="38" height="38" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="340" y="84" width="38" height="38" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="378" y="84" width="38" height="38" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="416" y="84" width="38" height="38" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="454" y="84" width="38" height="38" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="492" y="84" width="38" height="38" fill="#fff" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#333">
    <text x="169" y="108">a</text><text x="207" y="108">b</text><text x="245" y="108">c</text>
    <text x="283" y="108">d</text><text x="321" y="108">e</text><text x="359" y="108">f</text>
    <text x="397" y="108">g</text><text x="435" y="108">h</text><text x="473" y="108">i</text>
    <text x="511" y="108">j</text>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#999">
    <text x="169" y="134">0</text><text x="207" y="134">1</text><text x="245" y="134">2</text>
    <text x="283" y="134">3</text><text x="321" y="134">4</text><text x="359" y="134">5</text>
    <text x="397" y="134">6</text><text x="435" y="134">7</text><text x="473" y="134">8</text>
    <text x="511" y="134">9</text>
  </g>

  <!-- ====== Section 2: groups ====== -->
  <text x="48" y="170" font-size="12.5" font-weight="bold" fill="#446688">② 步长 k = 3 逐组切片：前 ⌊n/k⌋ = 3 组恰好满，末组只剩 r = 1 个</text>
  <g filter="url(#sk)">
    <rect x="152" y="182" width="110" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="266" y="182" width="110" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="380" y="182" width="110" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="494" y="182" width="36" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="532" y="182" width="34" height="38" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5,3"/>
    <rect x="568" y="182" width="34" height="38" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5,3"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" font-weight="bold">
    <text x="207" y="206">abc</text>
    <text x="321" y="206">def</text>
    <text x="435" y="206">ghi</text>
    <text x="512" y="206">j</text>
    <text x="549" y="206" fill="#b8860b" font-style="italic">x</text>
    <text x="585" y="206" fill="#b8860b" font-style="italic">x</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#666">
    <text x="207" y="238">第 0 组</text>
    <text x="321" y="238">第 1 组</text>
    <text x="435" y="238">第 2 组</text>
    <text x="551" y="238" fill="#b85450" font-weight="bold">第 3 组（末组）</text>
  </g>
  <path d="M 545 60 Q 600 110 566 176" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="612" y="86" font-size="11" fill="#b85450" font-weight="bold">补 fill ×2</text>
  <path d="M 532 174 L 532 250" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#sk)"/>
  <text x="532" y="260" text-anchor="middle" font-size="9.5" fill="#888">n = 10 串尾，补位越过它</text>

  <!-- ====== Section 3: formulas ====== -->
  <g filter="url(#sk)">
    <rect x="48" y="272" width="584" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="296" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">第 i 组 = s[ i·k : min((i+1)·k, n) ]，前 ⌊n/k⌋ 组截断不生效、长度恰 k</text>
  <text x="340" y="318" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">组数 m = ⌈n/k⌉ = ⌈10/3⌉ = 4；末组含 r = n mod k = 1 个原字符</text>
  <text x="340" y="340" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" font-family="monospace">填充量 = (k − n mod k) mod k = (3 − 1) mod 3 = 2</text>

  <!-- ====== callout ====== -->
  <g filter="url(#sk)">
    <rect x="55" y="362" width="570" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">负取模技巧：填充量 = (−n) mod k（最小非负剩余）</text>
  <text x="340" y="404" text-anchor="middle" font-size="11.5" fill="#444">Python 写 fill * (-n % k)（整除时自动为 0）；C++ 的 % 向零取整，须写 (k − n % k) % k</text>
</svg>
