<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：解析 → 弹栈到 depth → 挂到栈顶</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">一次线性扫描，栈大小恰好等于当前深度</text>
  <rect x="150.0" y="62.0" width="260.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="83.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i = 0，栈空，root = null</text>
  <path d="M 280.0 98.0 L 280.0 116.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130.0" y="116.0" width="300.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="139.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">数 '-' → depth；读数字 → val</text>
  <path d="M 280.0 156.0 L 280.0 174.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130.0" y="174.0" width="300.0" height="40.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="197.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">while 栈大小 &gt; depth：弹栈</text>
  <path d="M 280.0 214.0 L 280.0 232.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="232.0" width="340.0" height="48.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="252.5" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">栈空 → 设为根；否则栈顶为父节点</text>
  <text x="280.0" y="266.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">左孩子空则挂左，否则挂右</text>
  <path d="M 280.0 280.0 L 280.0 298.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="298.0" width="260.0" height="36.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="319.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">入栈；i 前进</text>
  <path d="M 450 192 C 500 190 500 134 432 134" stroke="#78909c" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="25.0" y="350.0" font-size="10" fill="#333" text-anchor="start" filter="url(#rough2)">最后弹出栈内的回溯信息即可返回 root。</text>
</svg>
