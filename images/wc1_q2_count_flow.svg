<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两次线性扫描定答案</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第一遍只填频次表，第二遍只做「读表 + 比较」，两遍互不干扰</text>

  <rect x="150" y="66" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">第一遍：遍历全串，cnt[ch − 'a'] += 1</text>

  <path d="M 280 112 L 280 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="142" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">第二遍：i 从 0 扫到 n − 1，读 cnt[s[i]]</text>

  <path d="M 280 188 L 280 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,218 410,259 280,300 150,259" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="255" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">cnt[c] = 1 ?</text>
  <text x="280" y="274" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">c = s[i]</text>

  <path d="M 410 259 L 424 259" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="417" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="428" y="239" width="114" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="485" y="264" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">return i</text>
  <text x="485" y="300" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（此时 i 已最小）</text>

  <path d="M 280 300 L 280 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="318" font-size="10" fill="#8a3a36" filter="url(#rough2)">否</text>
  <rect x="150" y="328" width="260" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">i += 1，回到第二遍继续查表</text>

  <path d="M 150 349 L 110 349 L 110 165 L 146 165" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="262" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">while i &lt; n</text>

  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">第二遍扫完仍未命中 ⇒ 全串没有唯一字符，返回 −1</text>
</svg>
