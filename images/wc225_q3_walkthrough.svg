<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：matrix = [[5,2],[1,6]]</text>
  <path d="M 200 40 Q 340 50 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: original matrix -->
  <text x="75" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">matrix</text>
  <g filter="url(#sk)">
    <rect x="52" y="88" width="46" height="42" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <rect x="98" y="88" width="46" height="42" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <rect x="52" y="130" width="46" height="42" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <rect x="98" y="130" width="46" height="42" rx="4" fill="#fff1d6" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="75" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#444">5</text>
  <text x="121" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#444">2</text>
  <text x="75" y="157" text-anchor="middle" font-size="18" font-weight="bold" fill="#444">1</text>
  <text x="121" y="157" text-anchor="middle" font-size="18" font-weight="bold" fill="#a06a20">6</text>
  <text x="121" y="195" text-anchor="middle" font-size="10.5" fill="#888">元素 ≤ 10⁶ &lt; 2²⁰</text>
  <text x="121" y="211" text-anchor="middle" font-size="10.5" fill="#a06a20">橙色格 = matrix[1][1]</text>

  <!-- middle: prefix xor table with sentinels -->
  <text x="330" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">P：前缀异或表（带 0 哨兵）</text>
  <g filter="url(#sk)">
    <rect x="250" y="85" width="54" height="46" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="304" y="85" width="54" height="46" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="358" y="85" width="54" height="46" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="250" y="131" width="54" height="46" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="304" y="131" width="54" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="358" y="131" width="54" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="250" y="177" width="54" height="46" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="304" y="177" width="54" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="358" y="177" width="54" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="277" y="113" text-anchor="middle" font-size="14" fill="#999">0</text>
  <text x="331" y="113" text-anchor="middle" font-size="14" fill="#999">0</text>
  <text x="385" y="113" text-anchor="middle" font-size="14" fill="#999">0</text>
  <text x="277" y="159" text-anchor="middle" font-size="14" fill="#999">0</text>
  <text x="331" y="159" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b4a6e">5</text>
  <text x="385" y="159" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b4a6e">7</text>
  <text x="277" y="205" text-anchor="middle" font-size="14" fill="#999">0</text>
  <text x="331" y="205" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b4a6e">4</text>
  <text x="385" y="205" text-anchor="middle" font-size="17" font-weight="bold" fill="#b03a3a">0</text>

  <g filter="url(#sk)">
    <path d="M 385 172 L 385 190" stroke="#666666" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 332 200 L 356 200" stroke="#666666" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 336 164 L 368 190" stroke="#666666" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <text x="330" y="252" text-anchor="middle" font-size="12" fill="#2b2b2b">P[2][2] = P[1][2] ⊕ P[2][1] ⊕ P[1][1] ⊕ matrix[1][1]</text>
  <text x="330" y="276" text-anchor="middle" font-size="13" font-weight="bold"><tspan fill="#2b4a6e">= 7 ⊕ 4 ⊕ 5 ⊕ </tspan><tspan fill="#a06a20">6</tspan><tspan fill="#b03a3a"> = 0 ✓</tspan></text>

  <!-- right: sorted target values -->
  <g filter="url(#sk)">
    <rect x="460" y="85" width="200" height="225" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="560" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">全部目标值（降序）</text>
  <text x="475" y="136" text-anchor="start" font-size="11.5" fill="#333">第 1 大 = 7（坐标 (0,1)）</text>
  <text x="475" y="162" text-anchor="start" font-size="11.5" fill="#333">第 2 大 = 5（坐标 (0,0)）</text>
  <text x="475" y="188" text-anchor="start" font-size="11.5" fill="#333">第 3 大 = 4（坐标 (1,0)）</text>
  <g filter="url(#sk)">
    <rect x="470" y="200" width="180" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="478" y="218" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b03a3a">第 4 大 = 0（坐标 (1,1)）</text>
  <text x="560" y="252" text-anchor="middle" font-size="10.5" fill="#555">示例 1~4 即 k = 1..4</text>
  <text x="560" y="268" text-anchor="middle" font-size="10.5" fill="#555">答案依次为 7 / 5 / 4 / 0</text>
  <text x="560" y="292" text-anchor="middle" font-size="10" fill="#888">相同的值按重数各占一名</text>

  <!-- takeaway -->
  <g filter="url(#sk)">
    <rect x="40" y="322" width="610" height="72" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="345" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">一次 O(mn) 递推 → mn 个目标值全部到手</text>
  <text x="345" y="370" text-anchor="middle" font-size="11.5" fill="#444">再排序（或堆 / 计数）取第 k 大；P[a+1][b+1] 即坐标 (a,b) 的目标值</text>
  <text x="345" y="386" text-anchor="middle" font-size="11" fill="#888">（哨兵使下标整体偏移 1）</text>
</svg>
