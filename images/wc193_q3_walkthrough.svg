<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例 3 演算：bloomDay = [7,7,7,7,12,7,7]，m = 2，k = 3</text>
  <text x="320" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">x = 已盛开，_ = 未盛开；格下小字 run = 当前连续段已开朵数，凑满 k = 3 就清零成束</text>

  <text x="56" y="70" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">bloomDay</text>
  <text x="131" y="70" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="189" y="70" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="247" y="70" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="305" y="70" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="363" y="70" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">12</text>
  <text x="421" y="70" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="479" y="70" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>

  <text x="56" y="104" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">7 天后</text>
  <rect x="104" y="78" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="78" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="78" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="278" y="78" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="336" y="78" width="54" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="394" y="78" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="452" y="78" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="131" y="100" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="189" y="100" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="247" y="100" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="305" y="100" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="363" y="100" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">_</text>
  <text x="421" y="100" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="479" y="100" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>

  <text x="131" y="118" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">1</text>
  <text x="189" y="118" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">2</text>
  <text x="247" y="118" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">3</text>
  <text x="305" y="118" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">1</text>
  <text x="363" y="118" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">0</text>
  <text x="421" y="118" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">1</text>
  <text x="479" y="118" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">2</text>

  <line x1="333" y1="74" x2="333" y2="126" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="333" y="136" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">断开</text>

  <text x="56" y="178" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">12 天后</text>
  <rect x="104" y="152" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="152" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="152" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="278" y="152" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="336" y="152" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="394" y="152" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="452" y="152" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="131" y="174" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="189" y="174" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="247" y="174" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="305" y="174" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="363" y="174" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="421" y="174" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="479" y="174" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">x</text>

  <text x="131" y="192" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">1</text>
  <text x="189" y="192" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">2</text>
  <text x="247" y="192" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">3</text>
  <text x="305" y="192" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">1</text>
  <text x="363" y="192" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">2</text>
  <text x="421" y="192" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">3</text>
  <text x="479" y="192" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">1</text>

  <rect x="40" y="210" width="560" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="230" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">第 7 天：盛开段长度 [4, 2] ⇒ ⌊4/3⌋ + ⌊2/3⌋ = 1 + 0 = 1 束 &lt; m = 2</text>
  <text x="56" y="247" font-size="9.8" fill="#666" filter="url(#rough2)">右边那 2 朵虽然盛开，但不足 k = 3 朵，凑不成一束，只能作废</text>

  <rect x="40" y="266" width="560" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="286" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">第 12 天：盛开段长度 [7] ⇒ ⌊7/3⌋ = 2 束 ≥ m = 2，可行</text>
  <text x="56" y="303" font-size="9.8" fill="#666" filter="url(#rough2)">7 朵全开，从下标 0 起连取两组 3 朵：{0,1,2} 与 {3,4,5}，剩下 1 朵不用</text>

  <text x="320" y="326" text-anchor="middle" font-size="9.8" fill="#888" filter="url(#rough2)">二分过程（值域 [7, 12]）</text>
  <path d="M 320 332 L 320 344" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="348" width="528" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="72" y="366" font-size="10.2" fill="#334" filter="url(#rough2)">mid = 9 → 1 束 &lt; 2，不可行 ⇒ lo = 10</text>
  <text x="72" y="381" font-size="10.2" fill="#334" filter="url(#rough2)">mid = 11 → 1 束 &lt; 2，不可行 ⇒ lo = 12；lo = hi 收敛，返回 12</text>

  <text x="320" y="416" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">check 只需知道「哪些花已开」，与具体收集方式无关 ⇒ 顺序扫一遍即可</text>
</svg>
