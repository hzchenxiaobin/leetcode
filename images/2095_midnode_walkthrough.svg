<svg xmlns="http://www.w3.org/2000/svg" width="720" height="475" viewBox="0 0 720 475" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="475" fill="#fdfcf7"/>
  <text x="360" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：[1,3,4,7,1,2,6]（n = 7，中间节点下标 ⌊7/2⌋ = 3）</text>
  <text x="360" y="44" text-anchor="middle" font-size="11" fill="#888">循环恰执行 ⌊n/2⌋ = 3 轮；第 ④ 次检查失败退出，slow 停在前驱上</text>

  <!-- top chain -->
  <g filter="url(#sk)">
    <rect x="36" y="48" width="58" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="112" y="48" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="188" y="48" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="264" y="48" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="340" y="48" width="58" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="416" y="48" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="492" y="48" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="568" y="48" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
  </g>
  <text x="65" y="72" text-anchor="middle" font-size="9" fill="#446688" filter="url(#sk)">dummy</text>
  <text x="141" y="72" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1</text>
  <text x="217" y="72" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">3</text>
  <text x="293" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">4</text>
  <text x="369" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038" filter="url(#sk)">7</text>
  <text x="445" y="72" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1</text>
  <text x="521" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a15" filter="url(#sk)">2</text>
  <text x="597" y="72" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">6</text>
  <g stroke="#3a3a3a" stroke-width="1.4">
    <path d="M 96 67 L 108 67" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 172 67 L 184 67" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 248 67 L 260 67" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 324 67 L 336 67" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 400 67 L 412 67" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 476 67 L 488 67" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 552 67 L 564 67" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle" filter="url(#sk)">
    <text x="65" y="100">−1</text><text x="141" y="100">0</text><text x="217" y="100">1</text>
    <text x="293" y="100" font-weight="bold" fill="#446688">2</text>
    <text x="369" y="100" font-weight="bold" fill="#a04038">3</text>
    <text x="445" y="100">4</text>
    <text x="521" y="100" font-weight="bold" fill="#9a6a15">5</text>
    <text x="597" y="100">6</text>
  </g>
  <text x="293" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">slow（终）</text>
  <text x="521" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a15" filter="url(#sk)">fast（终）</text>

  <!-- step table -->
  <g filter="url(#sk)">
    <rect x="36" y="132" width="648" height="24" fill="#f2f2ee"/>
    <rect x="36" y="234" width="648" height="26" fill="#fff8e1"/>
    <rect x="36" y="260" width="648" height="26" fill="#fce4ec"/>
  </g>
  <g stroke="#999" stroke-width="1">
    <path d="M 36 132 L 684 132" filter="url(#sk)"/>
    <path d="M 36 156 L 684 156" filter="url(#sk)"/>
    <path d="M 36 182 L 684 182" filter="url(#sk)"/>
    <path d="M 36 208 L 684 208" filter="url(#sk)"/>
    <path d="M 36 234 L 684 234" filter="url(#sk)"/>
    <path d="M 36 260 L 684 260" filter="url(#sk)"/>
    <path d="M 36 286 L 684 286" filter="url(#sk)"/>
    <path d="M 36 132 L 36 286" filter="url(#sk)"/>
    <path d="M 90 132 L 90 286" filter="url(#sk)"/>
    <path d="M 180 132 L 180 286" filter="url(#sk)"/>
    <path d="M 360 132 L 360 286" filter="url(#sk)"/>
    <path d="M 440 132 L 440 286" filter="url(#sk)"/>
    <path d="M 560 132 L 560 286" filter="url(#sk)"/>
    <path d="M 684 132 L 684 286" filter="url(#sk)"/>
  </g>
  <g font-size="10.5" font-weight="bold" fill="#555" text-anchor="middle" filter="url(#sk)">
    <text x="63" y="148">检查</text>
    <text x="135" y="148">fast 下标</text>
    <text x="270" y="148">next / next.next</text>
    <text x="400" y="148">进循环？</text>
    <text x="500" y="148">slow / fast 变为</text>
    <text x="622" y="148">备注</text>
  </g>
  <g font-size="10.5" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="63" y="174">①</text><text x="135" y="174">−1（dummy）</text><text x="270" y="174">0 / 1</text>
    <text x="400" y="174" font-weight="bold" fill="#2e6e2e">✓</text><text x="500" y="174">0 / 1</text><text x="622" y="174"></text>
    <text x="63" y="200">②</text><text x="135" y="200">1</text><text x="270" y="200">2 / 3</text>
    <text x="400" y="200" font-weight="bold" fill="#2e6e2e">✓</text><text x="500" y="200">1 / 3</text><text x="622" y="200"></text>
    <text x="63" y="226">③</text><text x="135" y="226">3</text><text x="270" y="226">4 / 5</text>
    <text x="400" y="226" font-weight="bold" fill="#2e6e2e">✓</text><text x="500" y="226">2 / 5</text><text x="622" y="226"></text>
    <text x="63" y="252">④</text><text x="135" y="252">5</text><text x="270" y="252">6 / ∅</text>
    <text x="400" y="252" font-weight="bold" fill="#a04038">✗ 退出</text><text x="500" y="252">2 / 5（不动）</text><text x="622" y="252">条件在此失败</text>
    <text x="63" y="278" font-weight="bold" fill="#a04038">删除</text><text x="135" y="278" font-weight="bold" fill="#446688">slow = 2</text>
    <text x="270" y="278">—</text><text x="400" y="278">—</text>
    <text x="500" y="278" font-weight="bold" fill="#a04038">跳过下标 3</text><text x="622" y="278">接回下标 4</text>
  </g>

  <!-- final chain -->
  <g filter="url(#sk)">
    <rect x="36" y="352" width="58" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="112" y="352" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="188" y="352" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="264" y="352" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="340" y="352" width="58" height="38" rx="6" fill="#f2f2ee" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="416" y="352" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="492" y="352" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="568" y="352" width="58" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
  </g>
  <text x="65" y="376" text-anchor="middle" font-size="9" fill="#446688" filter="url(#sk)">dummy</text>
  <text x="141" y="376" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1</text>
  <text x="217" y="376" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">3</text>
  <text x="293" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">4</text>
  <text x="369" y="376" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#sk)">7</text>
  <text x="445" y="376" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1</text>
  <text x="521" y="376" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">2</text>
  <text x="597" y="376" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">6</text>
  <g stroke="#3a3a3a" stroke-width="1.4">
    <path d="M 96 371 L 108 371" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 172 371 L 184 371" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 248 371 L 260 371" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 324 371 L 336 371" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 400 371 L 412 371" stroke="#bbb" stroke-dasharray="3 3" filter="url(#sk)"/>
    <path d="M 476 371 L 488 371" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 552 371 L 564 371" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle" filter="url(#sk)">
    <text x="65" y="404">−1</text><text x="141" y="404">0</text><text x="217" y="404">1</text>
    <text x="293" y="404">2</text><text x="369" y="404">3</text><text x="445" y="404">4</text>
    <text x="521" y="404">5</text><text x="597" y="404">6</text>
  </g>
  <path d="M 293 350 C 293 330, 369 330, 369 350" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="331" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">跳过下标 3</text>
  <text x="360" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">删除后：[1,3,4,1,2,6] —— 只改动了下标 2 节点的一根 next 指针</text>
</svg>
