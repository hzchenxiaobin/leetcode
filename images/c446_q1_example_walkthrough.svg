<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#fdfcf7"/>
  <text x="330" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：5 步执行，下标 1 被跳过</text>
  <path d="M 150 33 Q 330 40 510 33" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 上方跳转弧线 -->
  <path d="M 90 66 C 90 40, 274 40, 274 64" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8edb">jump +2</text>
  <path d="M 366 66 C 366 44, 458 44, 458 64" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="412" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8edb">jump +1</text>

  <!-- 指令格子 -->
  <g filter="url(#sk)">
    <rect x="50" y="70" width="80" height="76" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="90" y="88" text-anchor="middle" font-size="10.5" fill="#666">i = 0</text>
  <text x="90" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">jump</text>
  <text x="90" y="130" text-anchor="middle" font-size="10.5" fill="#4a8edb">values[0] = +2</text>

  <g filter="url(#sk)">
    <rect x="142" y="70" width="80" height="76" rx="6" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
  <text x="182" y="88" text-anchor="middle" font-size="10.5" fill="#999999">i = 1</text>
  <text x="182" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#999999">add</text>
  <text x="182" y="130" text-anchor="middle" font-size="10" fill="#999999">被跳过 · 未执行</text>

  <g filter="url(#sk)">
    <rect x="234" y="70" width="80" height="76" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="274" y="88" text-anchor="middle" font-size="10.5" fill="#666">i = 2</text>
  <text x="274" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">add</text>
  <text x="274" y="130" text-anchor="middle" font-size="10.5" fill="#2e6e2e">values[2] = +3</text>

  <g filter="url(#sk)">
    <rect x="326" y="70" width="80" height="76" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="366" y="88" text-anchor="middle" font-size="10.5" fill="#666">i = 3</text>
  <text x="366" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">jump</text>
  <text x="366" y="130" text-anchor="middle" font-size="10.5" fill="#4a8edb">values[3] = +1</text>

  <g filter="url(#sk)">
    <rect x="418" y="70" width="80" height="76" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="458" y="88" text-anchor="middle" font-size="10.5" fill="#666">i = 4</text>
  <text x="458" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">add</text>
  <text x="458" y="130" text-anchor="middle" font-size="10.5" fill="#2e6e2e">values[4] = −2</text>

  <g filter="url(#sk)">
    <rect x="510" y="70" width="80" height="76" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="550" y="88" text-anchor="middle" font-size="10.5" fill="#666">i = 5</text>
  <text x="550" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">jump</text>
  <text x="550" y="130" text-anchor="middle" font-size="10.5" fill="#4a8edb">values[5] = −3</text>

  <!-- 下方执行弧线 -->
  <path d="M 274 146 C 274 178, 366 178, 366 148" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">add +3 → score 3</text>
  <path d="M 458 146 C 458 180, 550 180, 550 148" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="504" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">add −2 → score 1</text>
  <path d="M 550 146 C 550 252, 274 252, 274 150" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="412" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">jump −3 → 重访 2，停！</text>

  <!-- 得分演化 -->
  <g filter="url(#sk)">
    <rect x="55" y="288" width="100" height="34" rx="8" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="105" y="309" text-anchor="middle" font-size="12" font-family="monospace" fill="#444">score = 0</text>
  <path d="M 155 305 L 203 305" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="180" y="298" text-anchor="middle" font-size="9.5" fill="#888">执行 i=2</text>
  <g filter="url(#sk)">
    <rect x="205" y="288" width="100" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="255" y="309" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e6e2e">score = 3</text>
  <path d="M 305 305 L 353 305" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="298" text-anchor="middle" font-size="9.5" fill="#888">执行 i=4</text>
  <g filter="url(#sk)">
    <rect x="355" y="288" width="100" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="405" y="309" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e6e2e">score = 1</text>
  <path d="M 455 305 L 503 305" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="480" y="298" text-anchor="middle" font-size="9.5" fill="#b85450">重访停</text>
  <g filter="url(#sk)">
    <rect x="505" y="288" width="100" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="555" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 1 ✓</text>

  <!-- 底部注记 -->
  <g filter="url(#sk)">
    <rect x="40" y="340" width="580" height="48" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="330" y="360" text-anchor="middle" font-size="12" fill="#7a5415">注意：下标 1 被 jump 跨过，从未执行 ⇒ 不贡献得分</text>
  <text x="330" y="378" text-anchor="middle" font-size="12" fill="#7a5415">「被跨过」≠「已执行」——若后续跳到 1，它仍会正常执行</text>
</svg>
