<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 436" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="14"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
  </defs>
  <rect width="660" height="436" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#r)">进阶：不相交对的计数只依赖三个区域</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">D_m = 被 m 整除的元素下标集合，c_m = |D_m|；先数「放宽到整除」的对，再用 Möbius 收紧到「恰好相等」</text>

  <!-- venn -->
  <ellipse cx="240" cy="210" rx="140" ry="100" fill="#e8f0fe" fill-opacity="0.5" filter="url(#r)"/>
  <ellipse cx="420" cy="210" rx="140" ry="100" fill="#e6f4ea" fill-opacity="0.5" filter="url(#r)"/>
  <ellipse cx="240" cy="210" rx="140" ry="100" fill="none" stroke="#446688" stroke-width="2" filter="url(#r)"/>
  <ellipse cx="420" cy="210" rx="140" ry="100" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#r)"/>

  <text x="185" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">D<tspan font-size="9" dy="3">A</tspan><tspan dy="-3">（c</tspan><tspan font-size="9" dy="3">A</tspan><tspan dy="-3"> 个）</tspan></text>
  <text x="475" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">D<tspan font-size="9" dy="3">B</tspan><tspan dy="-3">（c</tspan><tspan font-size="9" dy="3">B</tspan><tspan dy="-3"> 个）</tspan></text>

  <g filter="url(#r)" text-anchor="middle">
    <text x="190" y="196" font-size="10.5" fill="#34507a">只被 A 整除</text>
    <text x="190" y="214" font-size="10.5" fill="#34507a">b = c<tspan font-size="8" dy="2">A</tspan><tspan dy="-2"> − a 个</tspan></text>
    <text x="190" y="234" font-size="11" font-weight="bold" fill="#34507a">各 2 选 ⇒ 2<tspan font-size="8.5" dy="-4">b</tspan></text>
    <text x="330" y="188" font-size="10.5" fill="#7a5415">同时被 A、B 整除</text>
    <text x="330" y="206" font-size="10.5" fill="#7a5415">a = c<tspan font-size="8" dy="2">lcm(A,B)</tspan><tspan dy="-2"> 个</tspan></text>
    <text x="330" y="226" font-size="11" font-weight="bold" fill="#a07520">各 3 选 ⇒ 3<tspan font-size="8.5" dy="-4">a</tspan></text>
    <text x="330" y="244" font-size="9.5" fill="#a07520">（S1 / S2 / 都不进）</text>
    <text x="470" y="196" font-size="10.5" fill="#2e6e2e">只被 B 整除</text>
    <text x="470" y="214" font-size="10.5" fill="#2e6e2e">c = c<tspan font-size="8" dy="2">B</tspan><tspan dy="-2"> − a 个</tspan></text>
    <text x="470" y="234" font-size="11" font-weight="bold" fill="#2e6e2e">各 2 选 ⇒ 2<tspan font-size="8.5" dy="-4">c</tspan></text>
  </g>
  <text x="330" y="332" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">其余元素：只能都不进 —— 对计数无贡献</text>

  <!-- formula box -->
  <rect x="30" y="348" width="600" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r)"/>
  <text x="330" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07520" filter="url(#r)">Pair(A,B) = 3<tspan font-size="9" dy="-4">a</tspan><tspan dy="4">·2</tspan><tspan font-size="9" dy="-4">b</tspan><tspan dy="4">·2</tspan><tspan font-size="9" dy="-4">c</tspan><tspan dy="4"> − 2</tspan><tspan font-size="9" dy="-4">cB</tspan><tspan dy="4"> − 2</tspan><tspan font-size="9" dy="-4">cA</tspan><tspan dy="4"> + 1　（容斥：总数 − S1 空 − S2 空 + 双空）</tspan></text>
  <text x="330" y="402" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#r)">答案 = Σ<tspan font-size="9" dy="3">A,B</tspan><tspan dy="-3"> W(A,B)·Pair(A,B)，W(A,B) = Σ</tspan><tspan font-size="9" dy="3">g | gcd(A,B)</tspan><tspan dy="-3"> μ(A/g)·μ(B/g) —— n 退出复杂度</tspan></text>
</svg>
