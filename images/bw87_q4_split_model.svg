<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">交易二分：先亏后赚的最坏顺序</text>

  <!-- 亏损交易 -->
  <g filter="url(#rough2)">
    <rect x="56" y="52" width="220" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
  </g>
  <text x="166" y="76" text-anchor="middle" font-size="13.5" fill="#7a2f2b" font-weight="bold" filter="url(#rough2)">亏损交易：cashback &lt; cost</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="166" y="98">每做一笔，钱数下降 d = cost − cashback &gt; 0</text>
    <text x="166" y="120">d₁ + d₂ + … = 总要亏掉的钱 Σloss</text>
    <text x="166" y="140">（顺序不影响终态，只影响中途最低点）</text>
  </g>

  <!-- 盈利交易 -->
  <g filter="url(#rough2)">
    <rect x="292" y="52" width="220" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="402" y="76" text-anchor="middle" font-size="13.5" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">盈利交易：cashback ≥ cost</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="402" y="98">每做一笔，钱数不降反可能升</text>
    <text x="402" y="120">只会缓解紧张，不会制造新低谷</text>
    <text x="402" y="140">唯一代价：动手瞬间要凑出 cost</text>
  </g>

  <!-- 资金曲线 -->
  <text x="280" y="182" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">最坏顺序下的一维资金曲线（先亏损块，后盈利块）</text>
  <path d="M 80 220 L 500 220" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="70" y="224" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">钱</text>
  <path d="M 80 260 L 520 260" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="70" y="264" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">0</text>

  <path d="M 100 208 L 180 208 L 216 244 L 268 236 L 320 272 L 372 252 L 420 200 L 470 168" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 100 208 L 180 208 L 216 244 L 268 236 L 320 272" stroke="#b85450" stroke-width="0" fill="#fce4ec" opacity="0.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="96" y="150" width="224" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6"/>
  </g>
  <text x="208" y="167" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">亏损块：只降不升，谷底越来越深</text>
  <g filter="url(#rough2)">
    <rect x="336" y="150" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6"/>
  </g>
  <text x="436" y="167" text-anchor="middle" font-size="12" fill="#1d3a17" filter="url(#rough2)">盈利块：只升不降</text>

  <!-- 峰值标注 -->
  <g filter="url(#rough2)">
    <ellipse cx="420" cy="200" rx="5" ry="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <path d="M 420 160 L 420 188" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="452" y="192" font-size="12" fill="#d6a040" filter="url(#rough2)">盈利块里</text>
  <text x="452" y="208" font-size="12" fill="#d6a040" filter="url(#rough2)">最贵的一笔</text>

  <g filter="url(#rough2)">
    <rect x="60" y="300" width="448" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="284" y="324">「任意顺序都能完成」= 按最坏顺序也够用：</text>
    <text x="284" y="346">所有亏损排前面把钱包压到最低；盈利交易排后面，</text>
    <text x="284" y="368">让「最贵的一笔动手费」出现在钱包最瘪的时刻</text>
    <text x="284" y="390">→ 需要的钱 = Σloss + max(亏损块最大 cashback, 盈利块最大 cost)</text>
  </g>
</svg>
