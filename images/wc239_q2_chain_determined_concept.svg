<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：首段数值确定整条链（以 s = "10009998" 为例）</text>
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">相邻数值差恰为 1 且降序 → 第 k 段数值必为 v−(k−1)（v 为首段数值）</text>

  <!-- 首段 "100" -->
  <rect x="88" y="58" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="130" y="58" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="172" y="58" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="107" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">1</text>
  <text x="149" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">0</text>
  <text x="191" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">0</text>

  <!-- 第二段 "099" -->
  <rect x="220" y="58" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="262" y="58" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="304" y="58" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="239" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">0</text>
  <text x="281" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">9</text>
  <text x="323" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">9</text>

  <!-- 第三段 "98" -->
  <rect x="352" y="58" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="394" y="58" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="371" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">9</text>
  <text x="413" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">8</text>

  <!-- 分组括线 -->
  <path d="M 88 100 Q 149 110 210 100" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 220 100 Q 281 110 342 100" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 352 100 Q 392 110 432 100" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 分组数值标注 -->
  <text x="149" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">首段 v = 100</text>
  <text x="281" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">v − 1 = 99</text>
  <text x="392" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">v − 2 = 98</text>

  <!-- 数值链 -->
  <rect x="90" y="140" width="104" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="142" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">v = 100</text>
  <path d="M 196 159 L 220 159" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="209" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="226" y="140" width="110" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="281" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">v−1 = 99</text>
  <path d="M 338 159 L 362 159" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="351" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="368" y="140" width="110" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="423" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">v−2 = 98</text>
  <text x="490" y="164" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">…</text>

  <!-- 左：前导零说明 -->
  <rect x="36" y="192" width="222" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#b27a10" filter="url(#rough2)">前导零：同一数值多种写法</text>
  <text x="147" y="233" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">99 =「99」=「099」=「0099」</text>
  <text x="147" y="250" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">同一起点多个终点都等于 expect，</text>
  <text x="147" y="265" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">一个失败，还要继续试更长的</text>

  <!-- 右：搜索空间说明 -->
  <rect x="278" y="192" width="206" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="381" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">搜索空间坍缩</text>
  <text x="381" y="233" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">全部切分方案 2^(n−1) 种</text>
  <text x="381" y="250" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">→ 只枚举 n−1 个首段终点，</text>
  <text x="381" y="265" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">后续按链逐段精确匹配</text>

  <!-- 底部结论 -->
  <rect x="60" y="282" width="400" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">首段定全链：后续只需精确匹配 v−1、v−2、… 直到串尾</text>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">至少两段、匹配到串尾 → true；某段接不上 → 该首段失败，回溯换下一个</text>
</svg>
