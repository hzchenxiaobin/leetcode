<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">T 钉死 + 'a' 基线：word 上的三类位置</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">例：str1 = T F F F F F T，str2 = baab，L = n+m−1 = 10</text>

  <!-- word 格子：0..3 与 6..9 被 T 钉死，4..5 自由 -->
  <rect x="60" y="66" width="176" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="66" width="88" height="38" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="66" width="176" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="82" y="90">b</text><text x="126" y="90">a</text>
    <text x="170" y="90">a</text><text x="214" y="90">b</text>
    <text x="258" y="90" fill="#4a7a3a">a</text>
    <text x="302" y="90" fill="#4a7a3a">a</text>
    <text x="346" y="90">b</text><text x="390" y="90">a</text>
    <text x="434" y="90">a</text><text x="478" y="90">b</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#666" text-anchor="middle">
    <text x="148" y="112">T 窗口钉死（蓝色）</text>
    <text x="280" y="112">自由位 → 'a' 基线（虚线）</text>
    <text x="412" y="112">T 窗口钉死（蓝色）</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#999" text-anchor="middle">
    <text x="82" y="60">0</text><text x="126" y="60">1</text>
    <text x="170" y="60">2</text><text x="214" y="60">3</text>
    <text x="258" y="60">4</text><text x="302" y="60">5</text>
    <text x="346" y="60">6</text><text x="390" y="60">7</text>
    <text x="434" y="60">8</text><text x="478" y="60">9</text>
  </g>

  <!-- str1 行：窗口起点 0..6 -->
  <g filter="url(#rough2)">
    <rect x="60" y="136" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="104" y="136" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="148" y="136" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="192" y="136" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="236" y="136" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="280" y="136" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="324" y="136" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="82" y="156" text-anchor="middle" font-size="13" fill="#333">T</text>
    <text x="126" y="156" text-anchor="middle" font-size="13" fill="#333">F</text>
    <text x="170" y="156" text-anchor="middle" font-size="13" fill="#333">F</text>
    <text x="214" y="156" text-anchor="middle" font-size="13" fill="#333">F</text>
    <text x="258" y="156" text-anchor="middle" font-size="13" fill="#333">F</text>
    <text x="302" y="156" text-anchor="middle" font-size="13" fill="#333">F</text>
    <text x="346" y="156" text-anchor="middle" font-size="13" fill="#333">T</text>
  </g>
  <text x="430" y="156" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">str1：每个 i 对应</text>
  <text x="430" y="171" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">word 的滑窗 [i, i+m−1]</text>

  <!-- 窗口1 弧线：安全 -->
  <path d="M104,178 v14 h176 v-14" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="192" y="208" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">窗口1 [1,4]：固定位已失配 → 永远安全</text>

  <!-- 窗口3 弧线：待打破 -->
  <path d="M214,218 v14 h232 v-14" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">窗口3 [3,6]：基线下完全对齐 → 待打破（needy）</text>
  <text x="330" y="268" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">它的自由位只有 4、5 → 最右自由位 5 = 最后机会</text>
  <path d="M330,254 L302,108" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 底部两条要点 -->
  <rect x="40" y="288" width="480" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">关键引理：待打破窗口在自由位的对齐字母必为 'a'</text>
  <text x="280" y="326" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">所以「放任意 ≠ 'a' 的字母」都能打破它 —— 贪心有了统一的抓手</text>

  <rect x="40" y="348" width="480" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">扫描一路 'a'，只在最后机会被迫抬升</text>
  <text x="280" y="383" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">抬升位置尽量晚、字母尽量小 → 字典序最小</text>
</svg>
