<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：原点附近的骑士距离表（目标 (5,5)）</text>

  <!-- 列标 -->
  <text y="58" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)"><tspan x="132">-2</tspan><tspan x="176">-1</tspan><tspan x="220">0</tspan><tspan x="264">1</tspan><tspan x="308">2</tspan><tspan x="352">3</tspan><tspan x="396">4</tspan><tspan x="440">5</tspan><tspan x="484">6</tspan></text>
  <text x="120" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">x →</text>

  <!-- 行 y=5 -->
  <text x="98" y="89" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">y=5</text>
  <rect x="418" y="70" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text y="92" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="132">3</tspan><tspan x="176">4</tspan><tspan x="220">3</tspan><tspan x="264">4</tspan><tspan x="308">3</tspan><tspan x="352">4</tspan><tspan x="396">3</tspan><tspan x="440" fill="#d6a040" font-weight="bold">4</tspan><tspan x="484">5</tspan></text>

  <!-- 行 y=4 -->
  <text x="98" y="123" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">y=4</text>
  <rect x="330" y="104" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text y="126" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="132">2</tspan><tspan x="176">3</tspan><tspan x="220">2</tspan><tspan x="264">3</tspan><tspan x="308">2</tspan><tspan x="352" fill="#4a7a3a" font-weight="bold">3</tspan><tspan x="396">4</tspan><tspan x="440">3</tspan><tspan x="484">4</tspan></text>

  <!-- 行 y=3 -->
  <text x="98" y="157" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">y=3</text>
  <text y="160" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="132">3</tspan><tspan x="176">2</tspan><tspan x="220">3</tspan><tspan x="264">2</tspan><tspan x="308">3</tspan><tspan x="352">2</tspan><tspan x="396">3</tspan><tspan x="440">4</tspan><tspan x="484">3</tspan></text>

  <!-- 行 y=2 -->
  <text x="98" y="191" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">y=2</text>
  <rect x="374" y="172" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text y="194" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="132">4</tspan><tspan x="176">1</tspan><tspan x="220">2</tspan><tspan x="264">1</tspan><tspan x="308">4</tspan><tspan x="352">3</tspan><tspan x="396" fill="#4a7a3a" font-weight="bold">2</tspan><tspan x="440">3</tspan><tspan x="484">4</tspan></text>

  <!-- 行 y=1 -->
  <text x="98" y="225" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">y=1</text>
  <rect x="286" y="206" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text y="228" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="132">1</tspan><tspan x="176">2</tspan><tspan x="220">3</tspan><tspan x="264">2</tspan><tspan x="308" fill="#4a7a3a" font-weight="bold">1</tspan><tspan x="352">2</tspan><tspan x="396">3</tspan><tspan x="440">4</tspan><tspan x="484">3</tspan></text>

  <!-- 行 y=0 -->
  <text x="98" y="259" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">y=0</text>
  <rect x="198" y="240" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text y="262" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="132">2</tspan><tspan x="176">3</tspan><tspan x="220" fill="#446688" font-weight="bold">0</tspan><tspan x="264">3</tspan><tspan x="308">2</tspan><tspan x="352">3</tspan><tspan x="396">2</tspan><tspan x="440">3</tspan><tspan x="484">4</tspan></text>

  <!-- 行 y=-1 -->
  <text x="98" y="293" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">y=-1</text>
  <circle cx="308" cy="291" r="13" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text y="296" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="132">1</tspan><tspan x="176">2</tspan><tspan x="220">3</tspan><tspan x="264">2</tspan><tspan x="308">1</tspan><tspan x="352">2</tspan><tspan x="396">3</tspan><tspan x="440">4</tspan><tspan x="484">3</tspan></text>

  <!-- 行 y=-2 -->
  <text x="98" y="327" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">y=-2</text>
  <text y="330" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="132">4</tspan><tspan x="176">1</tspan><tspan x="220">2</tspan><tspan x="264">1</tspan><tspan x="308">4</tspan><tspan x="352">3</tspan><tspan x="396">2</tspan><tspan x="440">3</tspan><tspan x="484">4</tspan></text>

  <!-- 路径箭头 -->
  <path d="M 220 274 Q 260 250 296 232" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 240 Q 350 215 382 200" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 396 206 Q 366 160 342 130" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 352 122 Q 380 96 408 86" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="354" width="220" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="344" y="376" font-size="11.5" fill="#4a7a3a" font-weight="bold">路径（4 步）：(0,0) → (2,1)</text>
  <text x="344" y="394" font-size="11.5" fill="#4a7a3a">→ (4,2) → (3,4) → (5,5) ✓</text>
  <text x="344" y="416" font-size="11" fill="#555">查表：起点 0，沿途 1、2、3、4</text>

  <rect x="30" y="354" width="280" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="376" font-size="11.5" fill="#333" font-weight="bold">红线圈的 (2,-1)：d = 1</text>
  <text x="44" y="394" font-size="11" fill="#555">(1,1) 的两步路径必须经过它或 (-1,2)，</text>
  <text x="44" y="412" font-size="11" fill="#555">这就是搜索盒要向下留 2 格余量的原因。</text>
</svg>
