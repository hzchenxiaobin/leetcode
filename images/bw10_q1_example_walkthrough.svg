<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：示例 1 的指针推进轨迹</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="63" font-size="11.5" fill="#3a4a66" font-weight="bold">步</text>
  <text x="120" y="63" font-size="11.5" fill="#3a4a66" font-weight="bold">(i, j, k)</text>
  <text x="250" y="63" font-size="11.5" fill="#3a4a66" font-weight="bold">三元组</text>
  <text x="410" y="63" font-size="11.5" fill="#3a4a66" font-weight="bold">动作</text>

  <!-- 六行 -->
  <rect x="30" y="74" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="94" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="94" font-size="11.5" fill="#333" filter="url(#rough2)">(0,0,0)</text>
  <text x="250" y="94" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1, 1, 1)</text>
  <text x="410" y="94" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全等 → 收集 1 ✓</text>

  <rect x="30" y="106" width="500" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="126" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="126" font-size="11.5" fill="#333" filter="url(#rough2)">(1,1,1)</text>
  <text x="250" y="126" font-size="11.5" fill="#333" filter="url(#rough2)">(2, 2, 3)</text>
  <text x="410" y="126" font-size="11.5" fill="#555" filter="url(#rough2)">mn=2 → i++ j++</text>

  <rect x="30" y="138" width="500" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="158" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="120" y="158" font-size="11.5" fill="#333" filter="url(#rough2)">(2,2,1)</text>
  <text x="250" y="158" font-size="11.5" fill="#333" filter="url(#rough2)">(3, 5, 3)</text>
  <text x="410" y="158" font-size="11.5" fill="#555" filter="url(#rough2)">mn=3 → i++ k++（两个！）</text>

  <rect x="30" y="170" width="500" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="190" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="120" y="190" font-size="11.5" fill="#333" filter="url(#rough2)">(3,2,2)</text>
  <text x="250" y="190" font-size="11.5" fill="#333" filter="url(#rough2)">(4, 5, 4)</text>
  <text x="410" y="190" font-size="11.5" fill="#555" filter="url(#rough2)">mn=4 → i++ k++</text>

  <rect x="30" y="202" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="222" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="120" y="222" font-size="11.5" fill="#333" filter="url(#rough2)">(4,2,3)</text>
  <text x="250" y="222" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(5, 5, 5)</text>
  <text x="410" y="222" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全等 → 收集 5 ✓</text>

  <rect x="30" y="234" width="500" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="254" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="120" y="254" font-size="11.5" fill="#333" filter="url(#rough2)">(5,3,4)</text>
  <text x="250" y="254" font-size="11.5" fill="#333" filter="url(#rough2)">arr1 越界</text>
  <text x="410" y="254" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">结束 → [1, 5]</text>

  <!-- 说明 -->
  <rect x="30" y="286" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="46" y="308" font-size="11.5" fill="#d6a040" font-weight="bold">易错点聚焦（步骤 3）：</text>
  <text x="46" y="328" font-size="11" fill="#555">arr1 与 arr3 同指最小值 3，必须同时推进 i 和 k；只推一个的话下一轮 (4,5,3) 依旧不全等、</text>
  <text x="46" y="346" font-size="11" fill="#555">j 原地不动，指针间互相「等」对方，白跑空转甚至死循环。</text>

  <rect x="30" y="362" width="240" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="46" y="384" font-size="11.5" fill="#4a7a3a" font-weight="bold">输出顺序天然升序</text>
  <text x="46" y="404" font-size="11" fill="#555">收集值 1 &lt; 5，来自指针单调右移</text>

  <rect x="290" y="362" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="306" y="384" font-size="11.5" fill="#3a4a66" font-weight="bold">总推进 ≤ n1+n2+n3</text>
  <text x="306" y="404" font-size="11" fill="#555">本例 5+3+5=13 次判等内完成</text>
</svg>
