<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="960" height="545" fill="#fdfcf7"/>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：对换距离决定命中 —— nums = [1023, 2310, 2130, 213]</text>
  <path d="M 170 42 Q 480 52 790 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 卡片 j=0 ============ -->
  <rect x="55" y="62" width="214" height="332" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="55" y="62" width="214" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="162" y="82" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">j=0 · x = 1023</text>
  <g font-size="10.5" fill="#444">
    <text x="68" y="112" font-weight="bold">S(x) 关键变体：</text>
    <rect x="68" y="122" width="64" height="22" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.1" filter="url(#sk)"/>
    <text x="100" y="137" text-anchor="middle" fill="#7a5415" font-weight="bold">2013</text>
    <text x="140" y="137">一步</text>
    <rect x="68" y="152" width="64" height="22" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.1" filter="url(#sk)"/>
    <text x="100" y="167" text-anchor="middle" fill="#7a5415" font-weight="bold">2310</text>
    <text x="140" y="167">两步</text>
    <rect x="68" y="182" width="64" height="22" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.1" filter="url(#sk)"/>
    <text x="100" y="197" text-anchor="middle" fill="#7a5415" font-weight="bold">213</text>
    <text x="140" y="197">两步·前导 0</text>
    <text x="68" y="226">（|S| ≤ 463，其余从略）</text>
    <text x="68" y="262" font-weight="bold">命中 seen：</text>
    <text x="68" y="282" fill="#888">—（哈希表还是空的）</text>
  </g>
  <rect x="68" y="304" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="108" y="325" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">ans = 0</text>

  <!-- ============ 卡片 j=1 ============ -->
  <rect x="292" y="62" width="214" height="332" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="292" y="62" width="214" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="399" y="82" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">j=1 · x = 2310</text>
  <g font-size="10.5" fill="#444">
    <text x="305" y="112" font-weight="bold">S(x) 关键变体：</text>
    <rect x="305" y="122" width="64" height="22" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.1" filter="url(#sk)"/>
    <text x="337" y="137" text-anchor="middle" fill="#7a5415" font-weight="bold">2130</text>
    <text x="377" y="137">一步</text>
    <rect x="305" y="152" width="64" height="22" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
    <text x="337" y="167" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1023</text>
    <text x="377" y="167" fill="#2e6e2e" font-weight="bold">两步 ★</text>
    <rect x="305" y="182" width="64" height="22" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.1" filter="url(#sk)"/>
    <text x="337" y="197" text-anchor="middle" fill="#7a5415" font-weight="bold">213</text>
    <text x="377" y="197">两步·前导 0</text>
    <text x="305" y="226">2310 → 3210 → 0213 = 213</text>
    <text x="305" y="262" font-weight="bold">命中 seen：</text>
    <text x="305" y="282" fill="#2e6e2e" font-weight="bold">seen[1023] = 1 ✓</text>
  </g>
  <rect x="305" y="304" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="345" y="325" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">ans = 1</text>

  <!-- ============ 卡片 j=2 ============ -->
  <rect x="529" y="62" width="214" height="332" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="529" y="62" width="214" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="636" y="82" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">j=2 · x = 2130</text>
  <g font-size="10.5" fill="#444">
    <text x="542" y="112" font-weight="bold">S(x) 关键变体：</text>
    <rect x="542" y="122" width="64" height="22" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
    <text x="574" y="137" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2310</text>
    <text x="614" y="137" fill="#2e6e2e" font-weight="bold">一步 ★</text>
    <rect x="542" y="152" width="64" height="22" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.1" filter="url(#sk)"/>
    <text x="574" y="167" text-anchor="middle" fill="#b03a3a" font-weight="bold">1023</text>
    <text x="614" y="167" fill="#b03a3a">✗ 4-循环</text>
    <rect x="542" y="182" width="64" height="22" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.1" filter="url(#sk)"/>
    <text x="574" y="197" text-anchor="middle" fill="#b03a3a" font-weight="bold">213</text>
    <text x="614" y="197" fill="#b03a3a">✗ 4-循环</text>
    <text x="542" y="226">4-循环最少 3 个对换，超出两次</text>
    <text x="542" y="262" font-weight="bold">命中 seen：</text>
    <text x="542" y="282" fill="#2e6e2e" font-weight="bold">seen[2310] = 1 ✓</text>
  </g>
  <rect x="542" y="304" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="582" y="325" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">ans = 2</text>

  <!-- ============ 卡片 j=3 ============ -->
  <rect x="766" y="62" width="214" height="332" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="766" y="62" width="214" height="30" rx="8" fill="#fff1e0" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="873" y="82" text-anchor="middle" font-size="12.5" fill="#8a5a10" font-weight="bold">j=3 · x = 213</text>
  <g font-size="10.5" fill="#444">
    <text x="779" y="112" font-weight="bold">S(x) 关键变体：</text>
    <rect x="779" y="122" width="70" height="22" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.1" filter="url(#sk)"/>
    <text x="814" y="137" text-anchor="middle" fill="#7a5415" font-weight="bold">123/231/312</text>
    <text x="855" y="137">一步</text>
    <rect x="779" y="152" width="64" height="22" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
    <text x="811" y="167" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1023</text>
    <text x="849" y="167" fill="#2e6e2e" font-weight="bold">两步·补零 ★</text>
    <rect x="779" y="182" width="64" height="22" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
    <text x="811" y="197" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2310</text>
    <text x="849" y="197" fill="#2e6e2e" font-weight="bold">两步·补零 ★</text>
    <text x="779" y="226" fill="#b03a3a" font-weight="bold">⚠ 裸串两步出不了 3 位数，</text>
    <text x="779" y="244">全靠补零串上换到前导 0 区</text>
    <text x="779" y="262" font-weight="bold">命中 seen：</text>
    <text x="779" y="282" fill="#2e6e2e" font-weight="bold">seen[1023]=1、seen[2310]=1 ✓</text>
  </g>
  <rect x="779" y="304" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <text x="819" y="325" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">ans = 4</text>

  <!-- 底部总结条 -->
  <rect x="55" y="410" width="925" height="120" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <g font-size="11" fill="#444">
    <text x="76" y="436" font-weight="bold" fill="#7a5415">两个看点：</text>
    <text x="76" y="460">① 未命中的 (1023,2130)、(2130,213)：补零串互差 4-循环——最少 3 个对换，超出「至多两次」，示例答案 4 恰好排除它们 ✓</text>
    <text x="76" y="484">② (1023,213) 的真实操作在 1023 那侧（1023 → 2013 → 0213）；从 213 这侧查 seen 靠的是补零闭包与对称性——「短侧也能查到长侧的可达」。</text>
    <text x="76" y="508" fill="#7a5415" font-weight="bold">该对还可行「一边一次」在 123 会合（1+1 分摊）——塌缩进单向判定，算法无需任何特判。</text>
  </g>
</svg>
