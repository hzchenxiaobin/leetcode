<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">配对存在性：k 与 −k 必须同时出现</text>
  <path d="M 180 40 Q 340 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- red dashed arc: 10 searching for -10 -->
  <g filter="url(#sk)">
    <path d="M 600 216 Q 330 -30 60 216" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none"/>
  </g>
  <text x="330" y="94" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold" filter="url(#sk)">✗ −10 不在数组 → 10 落选</text>

  <!-- green arc: -7 pairs with 7 -->
  <g filter="url(#sk)">
    <path d="M 141 218 Q 330 42 519 218" stroke="#4a8e4a" stroke-width="2.5" fill="none"/>
  </g>
  <text x="330" y="132" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">k = 7 ✓ 最大配对</text>

  <!-- blue small arc: -1 pairs with 1 -->
  <g filter="url(#sk)">
    <path d="M 303 220 Q 330 158 357 220" stroke="#4a8edb" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>
  </g>
  <text x="330" y="186" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">k = 1</text>

  <!-- number line -->
  <g filter="url(#sk)">
    <line x1="40" y1="230" x2="640" y2="230" stroke="#8a8a8a" stroke-width="1.6"/>
    <line x1="330" y1="224" x2="330" y2="236" stroke="#8a8a8a" stroke-width="1.4"/>
  </g>
  <text x="330" y="264" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0</text>

  <!-- element points -->
  <g filter="url(#sk)"><circle cx="141" cy="230" r="7" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <g filter="url(#sk)"><circle cx="303" cy="230" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <g filter="url(#sk)"><circle cx="357" cy="230" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <g filter="url(#sk)"><circle cx="492" cy="230" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <g filter="url(#sk)"><circle cx="519" cy="230" r="7" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <g filter="url(#sk)"><circle cx="600" cy="230" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <g filter="url(#sk)"><circle cx="60" cy="230" r="7" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3 2"/></g>

  <text x="141" y="254" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">−7</text>
  <text x="303" y="254" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">−1</text>
  <text x="357" y="254" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">1</text>
  <text x="492" y="254" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">6</text>
  <text x="519" y="254" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">7</text>
  <text x="600" y="254" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#sk)">10</text>
  <text x="60" y="254" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#sk)">−10?</text>

  <!-- bottom left box: hash set approach -->
  <g filter="url(#sk)">
    <rect x="40" y="288" width="300" height="92" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="190" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">哈希集合做法</text>
  <text x="56" y="332" font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">S = set(nums)</text>
  <text x="56" y="350" font-size="11" fill="#444" filter="url(#sk)">对每个正数 x：x∈S 且 −x∈S ⟹ 候选</text>
  <text x="56" y="370" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">ans = max(候选) = 7</text>

  <!-- bottom right box: why 7 -->
  <g filter="url(#sk)">
    <rect x="356" y="288" width="284" height="92" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="498" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">为什么答案是 7</text>
  <text x="372" y="332" font-size="11" fill="#444" filter="url(#sk)">k=1 与 k=7 都配对成功</text>
  <text x="372" y="350" font-size="11" fill="#444" filter="url(#sk)">10、6 没有相反数，直接落选</text>
  <text x="372" y="370" font-size="11" fill="#7a5415" font-weight="bold" filter="url(#sk)">所有候选中最大者 = 7</text>
</svg>
