<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="430" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：按结束时间排序后逐个转移</text>
  <text x="350" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">start = [1,2,3,4,6]，end = [3,5,10,6,9]，profit = [20,20,100,70,60]</text>

  <rect x="40" y="62" width="620" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <g font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="62" y="81" text-anchor="middle">i</text>
    <text x="100" y="81">工作 (end, start, profit)</text>
    <text x="352" y="81" text-anchor="middle">p(i)</text>
    <text x="432" y="81" text-anchor="middle">dp[i−1]</text>
    <text x="528" y="81" text-anchor="middle">dp[p] + profit</text>
    <text x="640" y="81" text-anchor="middle">dp[i]</text>
  </g>

  <g font-size="10" fill="#555" filter="url(#rough2)">
    <text x="62" y="112" text-anchor="middle">1</text>
    <text x="100" y="112">(3, 1, 20)</text>
    <text x="352" y="112" text-anchor="middle">0</text>
    <text x="432" y="112" text-anchor="middle">0</text>
    <text x="528" y="112" text-anchor="middle">0 + 20 = 20</text>
    <text x="640" y="112" text-anchor="middle">20</text>

    <text x="62" y="144" text-anchor="middle">2</text>
    <text x="100" y="144">(5, 2, 20)</text>
    <text x="352" y="144" text-anchor="middle">0</text>
    <text x="432" y="144" text-anchor="middle">20</text>
    <text x="528" y="144" text-anchor="middle">0 + 20 = 20</text>
    <text x="640" y="144" text-anchor="middle">20</text>

    <text x="62" y="176" text-anchor="middle">3</text>
    <text x="100" y="176">(6, 4, 70)</text>
    <text x="352" y="176" text-anchor="middle">1</text>
    <text x="432" y="176" text-anchor="middle">20</text>
    <text x="528" y="176" text-anchor="middle">20 + 70 = 90</text>
    <text x="640" y="176" text-anchor="middle">90</text>

    <text x="62" y="208" text-anchor="middle">4</text>
    <text x="100" y="208">(9, 6, 60)</text>
    <text x="352" y="208" text-anchor="middle">3</text>
    <text x="432" y="208" text-anchor="middle">90</text>
    <text x="528" y="208" text-anchor="middle">90 + 60 = 150</text>
    <text x="640" y="208" text-anchor="middle">150</text>
  </g>

  <rect x="40" y="220" width="620" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <g font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">
    <text x="62" y="238" text-anchor="middle">5</text>
    <text x="100" y="238">(10, 3, 100)</text>
    <text x="352" y="238" text-anchor="middle">1</text>
    <text x="432" y="238" text-anchor="middle">150</text>
    <text x="528" y="238" text-anchor="middle">20 + 100 = 120</text>
    <text x="640" y="238" text-anchor="middle">150</text>
  </g>

  <text x="350" y="266" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第 5 行说明：接下最后一份工作只能拿 120 &lt; 150，所以 dp[5] 直接继承 dp[4]</text>

  <rect x="60" y="284" width="580" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="76" y="306" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">排序后 ends = [3, 5, 6, 9, 10]；p(i) 用 upper_bound 在 ends[0 … i−1) 上求，二分区间不含 i 自己</text>
  <text x="76" y="326" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">第 4 行：start = 6，ends 中 ≤ 6 的有 3 个 → p = 3，dp[3] = 90，接上 60 得 150</text>
  <text x="76" y="346" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">最优方案：(1,3,20) + (4,6,70) + (6,9,60) = 150，首尾恰好相接，不重叠</text>

  <text x="350" y="392" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">答案 dp[5] = 150，与官方示例输出一致</text>
</svg>
