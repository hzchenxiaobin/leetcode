<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">把房间与钥匙看成有向图：问 0 号能否到达所有点</text>

  <!-- 可达链 -->
  <g filter="url(#rough2)">
    <rect x="34" y="86" width="86" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="77" y="112" text-anchor="middle" font-size="13" fill="#2f5527">房间 0</text>
    <text x="77" y="134" text-anchor="middle" font-size="11" fill="#2f5527">钥匙 {1}</text>

    <rect x="150" y="86" width="86" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="193" y="112" text-anchor="middle" font-size="13" fill="#2f5527">房间 1</text>
    <text x="193" y="134" text-anchor="middle" font-size="11" fill="#2f5527">钥匙 {2}</text>

    <rect x="266" y="86" width="86" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="309" y="112" text-anchor="middle" font-size="13" fill="#2f5527">房间 2</text>
    <text x="309" y="134" text-anchor="middle" font-size="11" fill="#2f5527">钥匙 {3}</text>

    <rect x="382" y="86" width="86" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="425" y="112" text-anchor="middle" font-size="13" fill="#2f4a66">房间 3</text>
    <text x="425" y="134" text-anchor="middle" font-size="11" fill="#2f4a66">钥匙 {}</text>

    <path d="M124,117 L146,117" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M240,117 L262,117" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M356,117 L378,117" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <text x="98" y="76" font-size="11" fill="#4a7a3a">从 0 出发</text>
  </g>

  <!-- 不可达示例 -->
  <g filter="url(#rough2)">
    <text x="260" y="190" text-anchor="middle" font-size="13" fill="#333">反例：rooms = [[1,3],[3,0,1],[2],[0]]</text>
    <rect x="60" y="206" width="80" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="100" y="238" text-anchor="middle" font-size="12" fill="#2f5527">0</text>
    <rect x="190" y="206" width="80" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="230" y="238" text-anchor="middle" font-size="12" fill="#2f5527">1</text>
    <rect x="320" y="206" width="80" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="360" y="238" text-anchor="middle" font-size="12" fill="#8a3020">2</text>

    <path d="M140,220 L186,220" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M186,246 L144,246" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M310,233 L274,233" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr2)"/>
    <text x="352" y="284" text-anchor="middle" font-size="11" fill="#8a3020">2 的钥匙 {2} 只能开自己，无人可达 → false</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="296" width="380" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="316" text-anchor="middle" font-size="12" fill="#7a5a10">BFS / DFS 求可达点个数，等于 n 即 true</text>
  </g>
</svg>
