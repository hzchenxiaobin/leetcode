<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="960" height="620" fill="#fafafa"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1, 1, 2, 1] 的 3 种分割逐一判定</text>
  <path d="M 300 44 Q 480 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 列头 -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="152" y="70" fill="#555" filter="url(#sk)">分割 (i, j)</text>
    <text x="465" y="70" fill="#2b5a88" filter="url(#sk)">条件 A：nums1 是 nums2 前缀？</text>
    <text x="770" y="70" fill="#9a6a1a" filter="url(#sk)">条件 B：nums2 是 nums3 前缀？</text>
    <text x="920" y="70" fill="#555" filter="url(#sk)">美丽？</text>
  </g>

  <!-- ===== 行 1：(i,j)=(1,2) ===== -->
  <text x="60" y="114" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">(i, j) = (1, 2)</text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="60" y="124" width="46" height="34" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/></g>
    <text x="83" y="147" fill="#2b5a88" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="106" y="124" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="129" y="147" fill="#9a6a1a" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="152" y="124" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/></g>
    <text x="175" y="147" fill="#2e6e2e" filter="url(#sk)">2</text>
    <g filter="url(#sk)"><rect x="198" y="124" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/></g>
    <text x="221" y="147" fill="#2e6e2e" filter="url(#sk)">1</text>
  </g>
  <path d="M 106 120 L 106 162" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <path d="M 152 120 L 152 162" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="60" y="178" font-size="10" fill="#888" filter="url(#sk)">nums1=[1]  nums2=[1]  nums3=[2, 1]</text>
  <g filter="url(#sk)"><rect x="300" y="102" width="330" height="100" rx="8" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/></g>
  <text x="316" y="130" font-size="12" fill="#444" filter="url(#sk)">j = 2 ≥ 2i = 2  ✓</text>
  <text x="316" y="156" font-size="12" fill="#444" filter="url(#sk)">lcp[0][1] = 1 ≥ i = 1  ✓</text>
  <text x="316" y="186" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">⇒ A 成立</text>
  <g filter="url(#sk)"><rect x="650" y="102" width="240" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="666" y="130" font-size="12" fill="#444" filter="url(#sk)">lcp[1][2] = 0 &lt; j−i = 1  ✗</text>
  <text x="666" y="156" font-size="11" fill="#888" filter="url(#sk)">（[1] 不是 [2,1] 的前缀）</text>
  <text x="666" y="186" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">⇒ B 不成立</text>
  <g filter="url(#sk)"><circle cx="920" cy="152" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="920" y="161" text-anchor="middle" font-size="21" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>

  <!-- ===== 行 2：(i,j)=(1,3) ===== -->
  <text x="60" y="284" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">(i, j) = (1, 3)</text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="60" y="294" width="46" height="34" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/></g>
    <text x="83" y="317" fill="#2b5a88" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="106" y="294" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="129" y="317" fill="#9a6a1a" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="152" y="294" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="175" y="317" fill="#9a6a1a" filter="url(#sk)">2</text>
    <g filter="url(#sk)"><rect x="198" y="294" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/></g>
    <text x="221" y="317" fill="#2e6e2e" filter="url(#sk)">1</text>
  </g>
  <path d="M 106 290 L 106 332" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <path d="M 198 290 L 198 332" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="60" y="348" font-size="10" fill="#888" filter="url(#sk)">nums1=[1]  nums2=[1, 2]  nums3=[1]</text>
  <g filter="url(#sk)"><rect x="300" y="272" width="330" height="100" rx="8" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/></g>
  <text x="316" y="300" font-size="12" fill="#444" filter="url(#sk)">j = 3 ≥ 2i = 2  ✓</text>
  <text x="316" y="326" font-size="12" fill="#444" filter="url(#sk)">lcp[0][1] = 1 ≥ i = 1  ✓</text>
  <text x="316" y="356" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">⇒ A 成立</text>
  <g filter="url(#sk)"><rect x="650" y="272" width="240" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="666" y="300" font-size="12" fill="#444" filter="url(#sk)">lcp[1][3] = 1 &lt; j−i = 2  ✗</text>
  <text x="666" y="326" font-size="11" fill="#888" filter="url(#sk)">（[1,2] 只匹配到 1 位就断）</text>
  <text x="666" y="356" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">⇒ B 不成立</text>
  <g filter="url(#sk)"><circle cx="920" cy="322" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="920" y="331" text-anchor="middle" font-size="21" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>

  <!-- ===== 行 3：(i,j)=(2,3) ===== -->
  <text x="60" y="454" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">(i, j) = (2, 3)</text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="60" y="464" width="46" height="34" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/></g>
    <text x="83" y="487" fill="#2b5a88" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="106" y="464" width="46" height="34" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/></g>
    <text x="129" y="487" fill="#2b5a88" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="152" y="464" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="175" y="487" fill="#9a6a1a" filter="url(#sk)">2</text>
    <g filter="url(#sk)"><rect x="198" y="464" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/></g>
    <text x="221" y="487" fill="#2e6e2e" filter="url(#sk)">1</text>
  </g>
  <path d="M 152 460 L 152 502" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <path d="M 198 460 L 198 502" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="60" y="518" font-size="10" fill="#888" filter="url(#sk)">nums1=[1, 1]  nums2=[2]  nums3=[1]</text>
  <g filter="url(#sk)"><rect x="300" y="442" width="330" height="100" rx="8" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/></g>
  <text x="316" y="470" font-size="12" fill="#444" filter="url(#sk)">j = 3 &lt; 2i = 4  ✗（装不下）</text>
  <text x="316" y="496" font-size="12" fill="#444" filter="url(#sk)">lcp[0][2] = 0 &lt; i = 2  ✗（内容也不符）</text>
  <text x="316" y="526" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">⇒ A 不成立（双败）</text>
  <g filter="url(#sk)"><rect x="650" y="442" width="240" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="666" y="470" font-size="12" fill="#444" filter="url(#sk)">lcp[2][3] = 0 &lt; j−i = 1  ✗</text>
  <text x="666" y="496" font-size="11" fill="#888" filter="url(#sk)">（[2] 不是 [1] 的前缀）</text>
  <text x="666" y="526" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">⇒ B 不成立</text>
  <g filter="url(#sk)"><circle cx="920" cy="492" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="920" y="501" text-anchor="middle" font-size="21" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>

  <!-- ===== 底部总结 ===== -->
  <g filter="url(#sk)"><rect x="250" y="560" width="460" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="480" y="590" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">成立 2 个 ⇒ 答案 = 2 ✓</text>
  <text x="730" y="588" font-size="11" fill="#888" filter="url(#sk)">B 三连败；A 在 i=1 一票通吃 j=2, 3</text>
</svg>
