<svg xmlns="http://www.w3.org/2000/svg" width="620" height="440" viewBox="0 0 620 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：count(129) − count(119) = 12 − 11 = 1</text>
  <text x="310" y="47" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">定长 n = 3，条件 d₀ − d₁ + d₂ = 0；等长串的字典序 = 数值序，贴界比较</text>

  <!-- root -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="540" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="310" y="84" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">count(129)：数 ≤ 129 的 3 位串中 d₀ − d₁ + d₂ = 0 的个数（首位可填 0）</text>
  </g>

  <path d="M 150 96 L 135 120" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 330 96 L 350 120" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- level 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="122" width="190" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="135" y="142" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">d₀ = 0（&lt; 1，后两位自由）</text>
    <rect x="270" y="122" width="310" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="425" y="142" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">d₀ = 1（= 1，贴界，d₁ 的 up = 2）</text>
  </g>

  <path d="M 100 152 L 90 176" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 152 L 300 176" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 420 152 L 435 176" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 520 152 L 555 176" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- level 2 -->
  <g filter="url(#sk)">
    <rect x="30" y="178" width="205" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="132" y="198" text-anchor="middle" font-size="10.5" fill="#2f5d24">−d₁ + d₂ = 0 ⇒ d₁ = d₂</text>
    <text x="132" y="214" text-anchor="middle" font-size="10.5" fill="#2f5d24">10 串：000, 011, …, 099</text>
    <text x="132" y="232" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">→ 数 0, 11, …, 99（0 是伪影）</text>

    <rect x="250" y="178" width="110" height="64" rx="8" fill="#f3f3f3" stroke="#999" stroke-width="1.4"/>
    <text x="305" y="200" text-anchor="middle" font-size="10.5" fill="#666">d₁ = 0：</text>
    <text x="305" y="216" text-anchor="middle" font-size="10.5" fill="#b03a3a">d₂ = −1 ✗</text>
    <text x="305" y="234" text-anchor="middle" font-size="10.5" fill="#666">0 串</text>

    <rect x="375" y="178" width="110" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="430" y="200" text-anchor="middle" font-size="10.5" fill="#33506b">d₁ = 1：</text>
    <text x="430" y="216" text-anchor="middle" font-size="10.5" fill="#33506b">d₂ = 0 → 110 ✓</text>
    <text x="430" y="234" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">1 串</text>

    <rect x="500" y="178" width="110" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="555" y="200" text-anchor="middle" font-size="10.5" fill="#33506b">d₁ = 2（贴界）：</text>
    <text x="555" y="216" text-anchor="middle" font-size="10.5" fill="#33506b">d₂ = 1 → 121 ✓</text>
    <text x="555" y="234" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">1 串</text>
  </g>

  <!-- level 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="266" width="300" height="38" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="190" y="290" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">count(129) = 10 + 0 + 1 + 1 = 12</text>

    <rect x="366" y="256" width="234" height="58" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="483" y="277" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">count(119)：d₀ = 1 时 up(d₁) 缩为 1</text>
    <text x="483" y="293" text-anchor="middle" font-size="10.5" fill="#8a6d1a">只剩 d₁ = 1（贴界，d₂ = 0 → 110）</text>
    <text x="483" y="309" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">⇒ 10 + 1 = 11</text>
  </g>

  <!-- final -->
  <g filter="url(#sk)">
    <rect x="40" y="338" width="540" height="60" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="310" y="362" text-anchor="middle" font-size="13.5" fill="#b03a3a" font-weight="bold">答案 = 12 − 11 = 1 → [120, 129] 中只有 121 平衡</text>
    <text x="310" y="384" text-anchor="middle" font-size="11" fill="#7a4a48">两次 count 都把全零串（数 0）多算了 1 次，作差自动抵消；伪影只许这样消，不能只在一边减</text>
  </g>
</svg>
