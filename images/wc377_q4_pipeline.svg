<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：建图 Floyd → Trie 识别子串 → 前缀 DP</text>
  <path d="M 210 46 Q 470 54 730 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Row 1 ===== -->
  <g filter="url(#sk)"><rect x="40" y="68" width="270" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="175" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 离散化规则串</text>
  <text x="175" y="114" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">original/changed 中的串编号，至多 200 个</text>

  <path d="M 314 100 L 336 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="342" y="68" width="270" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="477" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 建有向图（串为节点）</text>
  <text x="477" y="114" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">边 x→y 权 cost[j]，重边取 min</text>

  <path d="M 616 100 L 638 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="644" y="68" width="256" height="64" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="772" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">③ Floyd 全源最短路</text>
  <text x="772" y="114" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">dist[u][v]，O(200³) ≈ 8×10⁶</text>

  <path d="M 470 132 L 470 156" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Row 2: Trie ===== -->
  <g filter="url(#sk)"><rect x="140" y="160" width="660" height="120" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="470" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">④ 建 Trie：识别 source / target 中「哪些子串是图节点」</text>
  <!-- mini trie -->
  <g filter="url(#sk)"><circle cx="300" cy="240" r="14" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="300" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">r</text>
  <g filter="url(#sk)"><circle cx="390" cy="214" r="13" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="390" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">b</text>
  <g filter="url(#sk)"><circle cx="445" cy="240" r="13" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="445" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><circle cx="500" cy="214" r="13" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="500" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">f</text>
  <g filter="url(#sk)"><circle cx="555" cy="240" r="13" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="555" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">g</text>
  <g filter="url(#sk)"><circle cx="610" cy="214" r="13" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="610" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">t</text>
  <path d="M 312 235 L 378 217" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 308 250 L 435 245" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 312 232 L 490 218" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 310 247 L 545 243" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 313 230 L 600 218" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 402 218 L 440 231" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="445" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#sk)">…d★</text>
  <text x="470" y="268" text-anchor="middle" font-size="0" fill="#2e6e2e" filter="url(#sk)"> </text>
  <text x="770" y="222" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">终点标记 ★ = 图节点编号</text>
  <text x="770" y="244" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">插入总长 ≤ 2×10⁵</text>
  <text x="770" y="266" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">把子串匹配摊到每步 O(1)</text>

  <path d="M 470 280 L 470 304" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Row 3: DP ===== -->
  <g filter="url(#sk)"><rect x="110" y="308" width="720" height="110" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="470" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">⑤ 前缀 DP：dp[i] = 把前缀 source[0..i-1] 变成 target[0..i-1] 的最小成本</text>
  <text x="130" y="358" font-size="12" fill="#2b6e9e" filter="url(#sk)">· 转移 A（自由位）：source[i] == target[i] → dp[i+1] = min(dp[i+1], dp[i])</text>
  <text x="130" y="382" font-size="12" fill="#2b6e9e" filter="url(#sk)">· 转移 B（区间跳转）：双游标沿 Trie 下探，深度 L 时 source 侧、target 侧都到终点 u, v</text>
  <text x="130" y="406" font-size="12" fill="#2b6e9e" filter="url(#sk)">   → dp[i+L] = min(dp[i+L], dp[i] + dist[u][v])；任一游标走死立即 break</text>

  <path d="M 470 418 L 470 440" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== decision ===== -->
  <g filter="url(#sk)"><polygon points="470,448 574,490 470,532 366,490" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="470" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">dp[n] == ∞ ？</text>
  <text x="470" y="504" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">（有位不可达）</text>

  <path d="M 574 490 L 644 490" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="606" y="480" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="652" y="468" width="130" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="717" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">返回 −1</text>

  <path d="M 366 490 L 300 490" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="336" y="480" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="88" y="468" width="208" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="192" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 dp[n]</text>

  <!-- ===== bottom notes ===== -->
  <g filter="url(#sk)"><rect x="56" y="548" width="828" height="76" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="572" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">实现要点</text>
  <text x="76" y="594" font-size="11" fill="#444" filter="url(#sk)">· 两种转移不是二选一：即使 source[i] == target[i]，从 i 切一条区间仍可能更优，两条都要试</text>
  <text x="76" y="616" font-size="11" fill="#444" filter="url(#sk)">· n ≤ 1000 → DP 每个 i 至多下探 n 步，总步数 ≤ n² = 10⁶；Floyd 8×10⁶ 主导，全程 ~10⁷ 稳过</text>
</svg>
