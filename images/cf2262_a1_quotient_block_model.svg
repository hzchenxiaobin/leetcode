<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心：固定 k，⌊x/k⌋ 在每个长度 k 的块上取常值</text>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">取 n=12、k=4、a₄=1：商等于 1 的整块 [4,7] 必须排除，其余块任取</text>

  <!-- 数字 0..11 -->
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="61" y="108">0</text><text x="105" y="108">1</text><text x="149" y="108">2</text><text x="193" y="108">3</text>
    <text x="237" y="108">4</text><text x="281" y="108">5</text><text x="325" y="108">6</text><text x="369" y="108">7</text>
    <text x="413" y="108">8</text><text x="457" y="108">9</text><text x="501" y="108">10</text><text x="545" y="108">11</text>
  </g>

  <!-- 商为 0 的块：可用 -->
  <g filter="url(#rough2)">
    <rect x="40" y="118" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="84" y="118" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="128" y="118" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="172" y="118" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>

  <!-- 商为 1 的块：禁用 -->
  <g filter="url(#rough2)">
    <rect x="216" y="118" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="260" y="118" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="304" y="118" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="348" y="118" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
  </g>

  <!-- 商为 2 的块：可用 -->
  <g filter="url(#rough2)">
    <rect x="392" y="118" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="436" y="118" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="480" y="118" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="524" y="118" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>

  <text x="303" y="96" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">a₄ = 1 ⇒ 整块禁用</text>
  <path d="M 303 100 L 303 114" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- 块的分区括号式标注 -->
  <path d="M 44 166 L 44 174 L 210 174 L 210 166" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="127" y="190" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">商 0：x ∈ [0,3]</text>

  <path d="M 220 166 L 220 174 L 386 174 L 386 166" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="303" y="190" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">商 1 = a₄：x ∈ [4,7]</text>

  <path d="M 396 166 L 396 174 L 562 174 L 562 166" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="479" y="190" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">商 2：x ∈ [8,11]</text>

  <!-- 结论框 -->
  <rect x="40" y="212" width="560" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="234" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">⌊y/k⌋ = a_k  ⟺  a_k·k ≤ y ≤ a_k·k + k − 1</text>
  <text x="56" y="254" font-size="11" fill="#3a4a66" filter="url(#rough2)">所以每个 k 只贡献一段长 k 的「禁用区间」，落在 [0,n−1] 之外的部分直接丢掉</text>
  <text x="56" y="274" font-size="11" fill="#3a4a66" filter="url(#rough2)">不同 k 的禁用区间会互相重叠 —— 用差分数组求并集，而不是逐段枚举</text>

  <!-- 底部两个要点 -->
  <rect x="40" y="298" width="270" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="320" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">任何合法 B 都 ⊆ 可用集 U</text>
  <text x="54" y="340" font-size="10.5" fill="#555" filter="url(#rough2)">若 y ∈ B 落在禁用块里，则 ⌊y/k⌋ = a_k，</text>
  <text x="54" y="358" font-size="10.5" fill="#555" filter="url(#rough2)">MEX 不可能等于 a_k，矛盾</text>

  <rect x="330" y="298" width="270" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="344" y="320" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">取 B = U 本身就是一组解</text>
  <text x="344" y="340" font-size="10.5" fill="#555" filter="url(#rough2)">缺的商值由「原解 A 里的见证元素」补上，</text>
  <text x="344" y="358" font-size="10.5" fill="#555" filter="url(#rough2)">而见证元素一定也在 U 里（题面保证有解）</text>
</svg>
