<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fafafa"/>

  <text x="450" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">线段树 + 懒标记：区间修改打标签，查询时把标签沿路径推下去</text>

  <!-- 数组 -->
  <text x="60" y="76" font-size="14" fill="#666" filter="url(#rough2)">数组</text>
  <g filter="url(#rough2)">
    <rect x="112" y="58" width="46" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="162" y="58" width="46" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="212" y="58" width="46" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="262" y="58" width="46" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="312" y="58" width="46" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="362" y="58" width="46" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="135" y="80" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">a₁</text>
  <text x="185" y="80" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">a₂</text>
  <text x="235" y="80" text-anchor="middle" font-size="13" fill="#8a6420" filter="url(#rough2)">a₃</text>
  <text x="285" y="80" text-anchor="middle" font-size="13" fill="#8a6420" filter="url(#rough2)">a₄</text>
  <text x="335" y="80" text-anchor="middle" font-size="13" fill="#8a6420" filter="url(#rough2)">a₅</text>
  <text x="385" y="80" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">a₆</text>
  <text x="285" y="112" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">[l, r]</text>

  <!-- 修改标签 -->
  <path d="M412,74 L556,74" fill="none" stroke="#b85450" stroke-width="1.9" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="562" y="52" width="286" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="705" y="72" text-anchor="middle" font-size="13.5" fill="#8f3a36" filter="url(#rough2)">类型 1/2/3：只改值，不追加</text>
  <text x="705" y="90" text-anchor="middle" font-size="12.5" fill="#8f3a36" filter="url(#rough2)">标签 T_op 打在 O(log n) 个覆盖节点上</text>

  <!-- 树结构 -->
  <circle cx="240" cy="170" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="166" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">根</text>
  <text x="240" y="182" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">T_self</text>

  <path d="M224,194 L172,232" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M256,194 L308,232" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="158" cy="258" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="263" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">T₁</text>
  <circle cx="322" cy="258" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="263" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">T₂</text>

  <path d="M146,278 L120,312" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M170,278 L196,312" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M310,278 L284,312" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M334,278 L360,312" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="92" y="318" width="58" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="168" y="318" width="58" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="256" y="318" width="58" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="332" y="318" width="58" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="121" y="336" text-anchor="middle" font-size="12" fill="#3f6633" filter="url(#rough2)">(a, info)</text>
  <text x="197" y="336" text-anchor="middle" font-size="12" fill="#3f6633" filter="url(#rough2)">(a, info)</text>
  <text x="285" y="336" text-anchor="middle" font-size="12" fill="#3f6633" filter="url(#rough2)">(a, info)</text>
  <text x="361" y="336" text-anchor="middle" font-size="12" fill="#3f6633" filter="url(#rough2)">(a, info)</text>
  <text x="121" y="350" text-anchor="middle" font-size="10.5" fill="#3f6633" filter="url(#rough2)">叶子 = 位置</text>
  <text x="197" y="350" text-anchor="middle" font-size="10.5" fill="#3f6633" filter="url(#rough2)">叶子 = 位置</text>
  <text x="285" y="350" text-anchor="middle" font-size="10.5" fill="#3f6633" filter="url(#rough2)">叶子 = 位置</text>
  <text x="361" y="350" text-anchor="middle" font-size="10.5" fill="#3f6633" filter="url(#rough2)">叶子 = 位置</text>

  <!-- 全局追加标签 -->
  <rect x="470" y="150" width="380" height="86" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="660" y="174" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">每个操作结束后：整棵树追加「当前值」</text>
  <text x="660" y="198" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">标签 T_self 直接落在根上 ⇒ O(1)，先改值再追加</text>
  <text x="660" y="222" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">未覆盖的位置值不变，追加的值也正好是原值</text>

  <path d="M470,196 L272,196" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 点查询 -->
  <rect x="470" y="262" width="380" height="96" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="660" y="286" text-anchor="middle" font-size="14" fill="#8a6420" filter="url(#rough2)">类型 4 查询 p：从根沿 p 的路径 push 标签</text>
  <text x="660" y="310" text-anchor="middle" font-size="12.5" fill="#8a6420" filter="url(#rough2)">标签按「先老后新」的顺序作用到叶子状态上</text>
  <text x="660" y="334" text-anchor="middle" font-size="12.5" fill="#8a6420" filter="url(#rough2)">答案 = 叶子 info 里的 m（非空最大子段和）</text>

  <path d="M330,170 L462,290" fill="none" stroke="#d6a040" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="60" y="404" font-size="13" fill="#666" filter="url(#rough2)">标签只需存一张 3 项的表：a = -1 / 0 / 1 时，（操作后的值，追加序列的 (s,p,q,m)）</text>
  <text x="60" y="428" font-size="13" fill="#666" filter="url(#rough2)">合成两个标签也是 O(1)：逐项把 B 作用在 A 的结果上</text>
</svg>
