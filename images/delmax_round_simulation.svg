<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="380" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：grid = [[1,2,4],[3,3,1]]</text>
  <path d="M 190 42 Q 340 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="452" y="56" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="532" y="56" width="14" height="14" rx="3" fill="#efefef" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="606" y="56" width="14" height="14" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="470" y="67" font-size="10" fill="#888">本轮删除</text>
  <text x="550" y="67" font-size="10" fill="#888">已删除</text>
  <text x="624" y="67" font-size="10" fill="#888">剩余</text>

  <!-- Stage 1 -->
  <g filter="url(#sk)">
    <rect x="35" y="84" width="190" height="190" rx="10" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2"/>
  </g>
  <text x="130" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">第 1 轮</text>
  <g filter="url(#sk)">
    <rect x="64" y="120" width="40" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="110" y="120" width="40" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="156" y="120" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="64" y="160" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="110" y="160" width="40" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="156" y="160" width="40" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="84" y="143" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="130" y="143" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="176" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">4</text>
  <text x="84" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">3</text>
  <text x="130" y="183" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="176" y="183" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="130" y="224" text-anchor="middle" font-size="11" fill="#444">删 {4,3}，本轮 max = 4</text>
  <text x="130" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ans = 4</text>

  <g filter="url(#sk)">
    <path d="M 227 179 L 243 179" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- Stage 2 -->
  <g filter="url(#sk)">
    <rect x="245" y="84" width="190" height="190" rx="10" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2"/>
  </g>
  <text x="340" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">第 2 轮</text>
  <g filter="url(#sk)">
    <rect x="274" y="120" width="40" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="320" y="120" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="366" y="120" width="40" height="36" rx="4" fill="#efefef" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="274" y="160" width="40" height="36" rx="4" fill="#efefef" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="320" y="160" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="366" y="160" width="40" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="294" y="143" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="340" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">2</text>
  <text x="386" y="143" text-anchor="middle" font-size="14" fill="#b0b0b0">4</text>
  <text x="294" y="183" text-anchor="middle" font-size="14" fill="#b0b0b0">3</text>
  <text x="340" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">3</text>
  <text x="386" y="183" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="340" y="224" text-anchor="middle" font-size="11" fill="#444">删 {2,3}，本轮 max = 3</text>
  <text x="340" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ans = 7</text>

  <g filter="url(#sk)">
    <path d="M 437 179 L 453 179" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- Stage 3 -->
  <g filter="url(#sk)">
    <rect x="455" y="84" width="190" height="190" rx="10" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2"/>
  </g>
  <text x="550" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">第 3 轮</text>
  <g filter="url(#sk)">
    <rect x="484" y="120" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="530" y="120" width="40" height="36" rx="4" fill="#efefef" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="576" y="120" width="40" height="36" rx="4" fill="#efefef" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="484" y="160" width="40" height="36" rx="4" fill="#efefef" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="530" y="160" width="40" height="36" rx="4" fill="#efefef" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="576" y="160" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
  </g>
  <text x="504" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">1</text>
  <text x="550" y="143" text-anchor="middle" font-size="14" fill="#b0b0b0">2</text>
  <text x="596" y="143" text-anchor="middle" font-size="14" fill="#b0b0b0">4</text>
  <text x="504" y="183" text-anchor="middle" font-size="14" fill="#b0b0b0">3</text>
  <text x="550" y="183" text-anchor="middle" font-size="14" fill="#b0b0b0">3</text>
  <text x="596" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">1</text>
  <text x="550" y="224" text-anchor="middle" font-size="11" fill="#444">删 {1,1}，本轮 max = 1</text>
  <text x="550" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ans = 8</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="200" y="294" width="280" height="50" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="340" y="316" text-anchor="middle" font-size="13" fill="#444">最终答案 = 4 + 3 + 1</text>
  <text x="340" y="337" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">= 8 ✓</text>

  <text x="340" y="366" text-anchor="middle" font-size="10" fill="#888">第 2 行两个 3 并列最大，第 1 轮任删其一（图中删左边的 3），不影响每轮删除的「值」</text>
</svg>
