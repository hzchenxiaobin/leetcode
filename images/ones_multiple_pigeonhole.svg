<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">终止性：k+1 个全 1 数 vs k 种余数 —— 鸽笼原理</text>
  <text x="320" y="50" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">设 gcd(k,10)=1 且前 k 步都没命中 0：k 个非零余数挤 k−1 个笼子，必有两步同余</text>

  <!-- 第一行：全 1 数 -->
  <g filter="url(#sk)">
    <rect x="60" y="72" width="64" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="132" y="72" width="64" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="204" y="72" width="40" height="30" rx="4" fill="none" stroke="#7a8aa0" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect x="252" y="72" width="64" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="324" y="72" width="64" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="396" y="72" width="40" height="30" rx="4" fill="none" stroke="#7a8aa0" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect x="444" y="72" width="64" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="92" y="92" text-anchor="middle" font-size="12" fill="#33506b">R(1)</text>
    <text x="164" y="92" text-anchor="middle" font-size="12" fill="#33506b">R(2)</text>
    <text x="224" y="92" text-anchor="middle" font-size="11" fill="#7a8aa0">...</text>
    <text x="284" y="92" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">R(i)</text>
    <text x="356" y="92" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">R(j)</text>
    <text x="416" y="92" text-anchor="middle" font-size="11" fill="#7a8aa0">...</text>
    <text x="476" y="92" text-anchor="middle" font-size="12" fill="#33506b">R(k+1)</text>
    <text x="530" y="92" font-size="11.5" fill="#666">共 k+1 个</text>
  </g>

  <!-- 映射箭头 -->
  <g filter="url(#sk)" stroke="#bbb" stroke-width="1.3" fill="none">
    <path d="M 92 104 L 85 160"/>
    <path d="M 164 104 L 130 160"/>
    <path d="M 476 104 L 400 160"/>
  </g>
  <g filter="url(#sk)" stroke="#b85450" stroke-width="2" fill="none">
    <path d="M 284 104 L 268 160" marker-end="url(#arr)"/>
    <path d="M 356 104 L 276 160" marker-end="url(#arr)"/>
  </g>

  <!-- 第二行：余数笼子 -->
  <g filter="url(#sk)">
    <rect x="65" y="164" width="40" height="30" rx="4" fill="#eef2f6" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="112" y="164" width="40" height="30" rx="4" fill="#eef2f6" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="159" y="164" width="40" height="30" rx="4" fill="#eef2f6" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="206" y="164" width="36" height="30" rx="4" fill="none" stroke="#7a8aa0" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect x="248" y="164" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="298" y="164" width="36" height="30" rx="4" fill="none" stroke="#7a8aa0" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect x="340" y="164" width="40" height="30" rx="4" fill="#eef2f6" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="388" y="164" width="40" height="30" rx="4" fill="#eef2f6" stroke="#7a8aa0" stroke-width="1.2"/>
    <text x="85" y="184" text-anchor="middle" font-size="11" fill="#556">1</text>
    <text x="132" y="184" text-anchor="middle" font-size="11" fill="#556">2</text>
    <text x="179" y="184" text-anchor="middle" font-size="11" fill="#556">3</text>
    <text x="224" y="184" text-anchor="middle" font-size="11" fill="#7a8aa0">...</text>
    <text x="270" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s</text>
    <text x="316" y="184" text-anchor="middle" font-size="11" fill="#7a8aa0">...</text>
    <text x="360" y="184" text-anchor="middle" font-size="11" fill="#556">k−2</text>
    <text x="408" y="184" text-anchor="middle" font-size="11" fill="#556">k−1</text>
    <text x="460" y="184" font-size="11.5" fill="#b03a3a" font-weight="bold">撞车了！R(i) ≡ R(j) (mod k)，i &lt; j</text>
    <text x="460" y="201" font-size="10.5" fill="#888">（非零余数只有 k−1 种笼子）</text>
  </g>

  <!-- 差的形状 -->
  <g filter="url(#sk)">
    <text x="30" y="248" font-size="12.5" fill="#33506b" font-weight="bold">R(j) − R(i) =</text>
    <rect x="140" y="228" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="170" y="228" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="228" width="34" height="30" rx="4" fill="none" stroke="#7a8aa0" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect x="238" y="228" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="272" y="228" width="26" height="30" rx="4" fill="#eef2f6" stroke="#7a8aa0" stroke-width="1.5"/>
    <rect x="302" y="228" width="26" height="30" rx="4" fill="#eef2f6" stroke="#7a8aa0" stroke-width="1.5"/>
    <rect x="332" y="228" width="34" height="30" rx="4" fill="none" stroke="#7a8aa0" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect x="370" y="228" width="26" height="30" rx="4" fill="#eef2f6" stroke="#7a8aa0" stroke-width="1.5"/>
    <text x="153" y="248" text-anchor="middle" font-size="12" fill="#33506b">1</text>
    <text x="183" y="248" text-anchor="middle" font-size="12" fill="#33506b">1</text>
    <text x="217" y="248" text-anchor="middle" font-size="11" fill="#7a8aa0">...</text>
    <text x="251" y="248" text-anchor="middle" font-size="12" fill="#33506b">1</text>
    <text x="285" y="248" text-anchor="middle" font-size="12" fill="#556">0</text>
    <text x="315" y="248" text-anchor="middle" font-size="12" fill="#556">0</text>
    <text x="349" y="248" text-anchor="middle" font-size="11" fill="#7a8aa0">...</text>
    <text x="383" y="248" text-anchor="middle" font-size="12" fill="#556">0</text>
    <text x="198" y="274" text-anchor="middle" font-size="10.5" fill="#33506b">j−i 个 1</text>
    <text x="324" y="274" text-anchor="middle" font-size="10.5" fill="#556">i 个 0</text>
    <text x="412" y="243" font-size="12.5" fill="#33506b" font-weight="bold">= R(j−i) × 10^i</text>
    <text x="412" y="261" font-size="10.5" fill="#888">k 整除这个差</text>
  </g>

  <!-- 推导 -->
  <g filter="url(#sk)">
    <rect x="60" y="296" width="520" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="319" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">k | R(j−i) × 10^i，而 gcd(10, k) = 1 → 10^i 可逆 → k | R(j−i)</text>
    <text x="320" y="341" text-anchor="middle" font-size="11.5" fill="#7a6a3a">即早在第 j−i 步（1 ≤ j−i ≤ k）就该命中 r = 0，与「前 k 步未命中」矛盾 ∎</text>
  </g>

  <!-- 推论 -->
  <g filter="url(#sk)">
    <rect x="60" y="376" width="520" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="320" y="394" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">推论：有解 ⟺ gcd(k,10) = 1（2|k 或 5|k 则无解）</text>
    <text x="320" y="411" text-anchor="middle" font-size="11.5" fill="#2f5d24">有解时答案位数 ≤ k → 循环上界取 k 就够了</text>
  </g>
</svg>
