<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="372" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：grid 为 3×3，k = 1（N = 9）</text>

  <!-- 旧数组 -->
  <text x="44" y="72" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">旧</text>
  <rect x="64" y="54" width="342" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <path d="M 102 54 L 102 80 M 140 54 L 140 80 M 178 54 L 178 80 M 216 54 L 216 80 M 254 54 L 254 80 M 292 54 L 292 80 M 330 54 L 330 80 M 368 54 L 368 80" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="83" y="49" text-anchor="middle" font-size="8" fill="#8aa0c0" filter="url(#rough2)">0</text>
  <text x="121" y="49" text-anchor="middle" font-size="8" fill="#8aa0c0" filter="url(#rough2)">1</text>
  <text x="159" y="49" text-anchor="middle" font-size="8" fill="#8aa0c0" filter="url(#rough2)">2</text>
  <text x="197" y="49" text-anchor="middle" font-size="8" fill="#8aa0c0" filter="url(#rough2)">3</text>
  <text x="235" y="49" text-anchor="middle" font-size="8" fill="#8aa0c0" filter="url(#rough2)">4</text>
  <text x="273" y="49" text-anchor="middle" font-size="8" fill="#8aa0c0" filter="url(#rough2)">5</text>
  <text x="311" y="49" text-anchor="middle" font-size="8" fill="#8aa0c0" filter="url(#rough2)">6</text>
  <text x="349" y="49" text-anchor="middle" font-size="8" fill="#8aa0c0" filter="url(#rough2)">7</text>
  <text x="387" y="49" text-anchor="middle" font-size="8" fill="#8aa0c0" filter="url(#rough2)">8</text>
  <text x="83" y="72" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="121" y="72" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="159" y="72" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="197" y="72" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">4</text>
  <text x="235" y="72" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">5</text>
  <text x="273" y="72" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">6</text>
  <text x="311" y="72" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">7</text>
  <text x="349" y="72" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">8</text>
  <text x="387" y="72" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">9</text>

  <!-- 映射线：每个元素整体右移一位 -->
  <path d="M 83 82 L 121 110 M 121 82 L 159 110 M 159 82 L 197 110 M 197 82 L 235 110 M 235 82 L 273 110 M 273 82 L 311 110 M 311 82 L 349 110 M 349 82 L 387 110"
        stroke="#9aa8b8" stroke-width="1" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 387 82 L 83 110" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 4"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="178" y="90" width="108" height="14" fill="#fafafa" filter="url(#rough2)"/>
  <text x="232" y="100" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">下标 8 → 0：回绕</text>

  <!-- 新数组 -->
  <text x="44" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">新</text>
  <rect x="64" y="112" width="342" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <path d="M 102 112 L 102 138 M 140 112 L 140 138 M 178 112 L 178 138 M 216 112 L 216 138 M 254 112 L 254 138 M 292 112 L 292 138 M 330 112 L 330 138 M 368 112 L 368 138" stroke="#4a7a3a" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="83" y="130" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">9</text>
  <text x="121" y="130" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="159" y="130" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="197" y="130" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="235" y="130" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="273" y="130" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="311" y="130" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">6</text>
  <text x="349" y="130" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">7</text>
  <text x="387" y="130" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">8</text>
  <text x="83" y="150" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">0</text>
  <text x="121" y="150" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">1</text>
  <text x="159" y="150" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">2</text>
  <text x="197" y="150" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">3</text>
  <text x="235" y="150" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">4</text>
  <text x="273" y="150" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">5</text>
  <text x="311" y="150" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">6</text>
  <text x="349" y="150" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">7</text>
  <text x="387" y="150" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">8</text>

  <!-- 右侧说明 -->
  <rect x="424" y="54" width="176" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="512" y="76" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">元素整体右移一格</text>
  <text x="512" y="94" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">下标 8 溢出后回到 0</text>

  <!-- 迁移结果网格 -->
  <text x="124" y="178" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">迁移结果（3×3）</text>
  <rect x="64" y="186" width="120" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <path d="M 104 186 L 104 270 M 144 186 L 144 270 M 64 214 L 184 214 M 64 242 L 184 242" stroke="#4a7a3a" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <text x="84" y="205" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">9</text>
  <text x="124" y="205" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="164" y="205" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="84" y="233" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="124" y="233" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="164" y="233" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="84" y="261" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">6</text>
  <text x="124" y="261" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">7</text>
  <text x="164" y="261" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">8</text>

  <!-- 映射表 -->
  <text x="430" y="178" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">逐格映射（t 为新下标，s 为来源下标）</text>
  <rect x="300" y="188" width="60" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="200" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">t</text>
  <rect x="360" y="188" width="140" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="200" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">s = (t − 1 + 9) mod 9</text>
  <rect x="500" y="188" width="60" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="200" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">res</text>

  <text x="330" y="219" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">0</text>
  <text x="430" y="219" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(0 − 1 + 9) mod 9 = 8</text>
  <text x="530" y="219" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="330" y="234" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="430" y="234" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(1 − 1 + 9) mod 9 = 0</text>
  <text x="530" y="234" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="249" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <text x="430" y="249" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(2 − 1 + 9) mod 9 = 1</text>
  <text x="530" y="249" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="264" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <text x="430" y="264" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(3 − 1 + 9) mod 9 = 2</text>
  <text x="530" y="264" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <text x="330" y="279" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">4</text>
  <text x="430" y="279" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(4 − 1 + 9) mod 9 = 3</text>
  <text x="530" y="279" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">4</text>
  <text x="330" y="294" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">5</text>
  <text x="430" y="294" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(5 − 1 + 9) mod 9 = 4</text>
  <text x="530" y="294" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">5</text>
  <text x="330" y="309" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">6</text>
  <text x="430" y="309" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(6 − 1 + 9) mod 9 = 5</text>
  <text x="530" y="309" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">6</text>
  <text x="330" y="324" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">7</text>
  <text x="430" y="324" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(7 − 1 + 9) mod 9 = 6</text>
  <text x="530" y="324" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">7</text>
  <text x="330" y="339" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">8</text>
  <text x="430" y="339" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(8 − 1 + 9) mod 9 = 7</text>
  <text x="530" y="339" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">8</text>

  <text x="310" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">右移一格后重新按行填回：原来的 9 跑到 (0,0)，其余每个数都往后挪了一格</text>
</svg>
