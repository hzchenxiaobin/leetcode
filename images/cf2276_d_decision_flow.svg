<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：只需度数统计，O(n + m)</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">读入时累加每个点的度数，之后做两次判断即可</text>

  <rect x="150" y="62" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#3a4a66">读入 n, m 与 m 条边 → 统计 deg[v]</text>

  <path d="M 280 96 L 280 116" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,120 400,152 280,184 160,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="10.5" fill="#8a6a20">存在 deg[v] == 0 ？</text>
  <text x="280" y="166" text-anchor="middle" font-size="9.5" fill="#9a7a30">（有孤立点）</text>

  <path d="M 400 152 L 442 152" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="145" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="386" y="176" width="158" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="465" y="194" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">Brain Melt</text>
  <text x="465" y="210" text-anchor="middle" font-size="9" fill="#a06a66">孤立点永远没有异色邻居</text>

  <path d="M 280 184 L 280 208" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="200" font-size="9.5" fill="#666" filter="url(#rough2)">否</text>

  <polygon points="280,212 420,248 280,284 140,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="10.5" fill="#8a6a20">m == n − 1 且 max deg == n − 1 ？</text>
  <text x="280" y="262" text-anchor="middle" font-size="9.5" fill="#9a7a30">（即：整张图就是星形图）</text>

  <path d="M 420 248 L 452 248" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="241" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="450" y="226" width="94" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="497" y="243" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">2</text>
  <text x="497" y="259" text-anchor="middle" font-size="9" fill="#5a7a4a">中心一色 + 叶子反色</text>

  <path d="M 280 284 L 280 308" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="300" font-size="9.5" fill="#666" filter="url(#rough2)">否</text>
  <rect x="196" y="312" width="168" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">Many</text>
  <text x="280" y="345" text-anchor="middle" font-size="9" fill="#5a7a4a">存在非平凡的合法划分，至少 4 种</text>

  <rect x="34" y="368" width="492" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="50" y="388" font-size="10" fill="#8a3a36">为什么没有 "1"：反色对称 ⇒ 合法染色数恒为偶数；而没有孤立点时它至少是 2</text>
  <text x="50" y="406" font-size="10" fill="#8a3a36">所以输出集合实际只有 {Brain Melt, 2, Many}，样例里也不会出现 1</text>
</svg>
