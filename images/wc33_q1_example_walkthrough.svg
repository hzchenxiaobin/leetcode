<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,3,2,2,5,2,3,7]，cnt = {1:1, 2:3, 3:2, 5:1, 7:1}</text>

  <!-- 表头 -->
  <rect x="60" y="58" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="81" text-anchor="middle" font-size="11" fill="#334" font-weight="bold" filter="url(#rough2)">值 x</text>
  <text x="185" y="81" text-anchor="middle" font-size="11" fill="#334" font-weight="bold" filter="url(#rough2)">cnt[x]</text>
  <text x="285" y="81" text-anchor="middle" font-size="11" fill="#334" font-weight="bold" filter="url(#rough2)">cnt[x+1]</text>
  <text x="395" y="81" text-anchor="middle" font-size="11" fill="#334" font-weight="bold" filter="url(#rough2)">候选长度</text>
  <text x="495" y="81" text-anchor="middle" font-size="11" fill="#334" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 数据行 -->
  <rect x="60" y="94" width="480" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="117" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="185" y="117" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="285" y="117" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="395" y="117" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 + 3 = 4</text>
  <text x="495" y="117" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>

  <rect x="60" y="130" width="480" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="153" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="185" y="153" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="285" y="153" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="395" y="153" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">3 + 2 = 5 ⭐</text>
  <text x="495" y="153" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="60" y="166" width="480" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="189" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="185" y="189" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="285" y="189" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">0（无 4）</text>
  <text x="395" y="189" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">无效</text>
  <text x="495" y="189" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>

  <rect x="60" y="202" width="480" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="185" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="285" y="225" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">0（无 6）</text>
  <text x="395" y="225" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">无效</text>
  <text x="495" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>

  <rect x="60" y="238" width="480" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="261" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="185" y="261" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="285" y="261" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">0（无 8）</text>
  <text x="395" y="261" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">无效</text>
  <text x="495" y="261" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>

  <!-- 竖线 -->
  <path d="M 140 58 V 274" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 230 58 V 274" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 340 58 V 274" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 450 58 V 274" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="60" y="292" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="313" text-anchor="middle" font-size="11" fill="#2f5a26" filter="url(#rough2)">取全部 3 个 2 与全部 2 个 3 → 子序列 [3,2,2,2,3]（原序保持），长度 5</text>
  <text x="300" y="331" text-anchor="middle" font-size="11" fill="#2f5a26" filter="url(#rough2)">其余候选要么更短（4），要么不存在 x+1，故答案 ans = 5</text>

  <text x="280" y="376" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⭐ 只遍历出现的键（5 个），而不是值域跨度（1…7）</text>
</svg>
