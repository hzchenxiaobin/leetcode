<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "a1b2c3d4e" → "abbdcfdhe"</text>

  <!-- 原串 -->
  <text x="34" y="82" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">原串：</text>
  <g filter="url(#rough2)">
    <rect x="70" y="56" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="116" y="56" width="40" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="162" y="56" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="208" y="56" width="40" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="254" y="56" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="56" width="40" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="346" y="56" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="392" y="56" width="40" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="438" y="56" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="90" y="82">a</text><text x="136" y="82">1</text><text x="182" y="82">b</text>
    <text x="228" y="82">2</text><text x="274" y="82">c</text><text x="320" y="82">3</text>
    <text x="366" y="82">d</text><text x="412" y="82">4</text><text x="458" y="82">e</text>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#999" filter="url(#rough2)">
    <text x="90" y="108">0</text><text x="136" y="108">1</text><text x="182" y="108">2</text>
    <text x="228" y="108">3</text><text x="274" y="108">4</text><text x="320" y="108">5</text>
    <text x="366" y="108">6</text><text x="412" y="108">7</text><text x="458" y="108">8</text>
  </g>
  <text x="508" y="82" font-size="10" fill="#888" filter="url(#rough2)">下标</text>

  <!-- 逐对替换表 -->
  <text x="34" y="140" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">奇数下标逐对替换：</text>
  <g filter="url(#rough2)">
    <rect x="40" y="150" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="40" y="176" width="480" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="40" y="200" width="480" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="40" y="224" width="480" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="58" y="167">i</text><text x="130" y="167">s[i−1]</text><text x="220" y="167">s[i]</text>
    <text x="330" y="167">计算（字符码相加）</text><text x="478" y="167">替换为</text>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="58" y="193">1</text><text x="130" y="193">'a' (97)</text><text x="220" y="193">'1'→1</text>
    <text x="330" y="193">97 + 1 = 98</text><text x="478" y="193">'b'</text>
    <text x="58" y="217">3</text><text x="130" y="217">'b' (98)</text><text x="220" y="217">'2'→2</text>
    <text x="330" y="217">98 + 2 = 100</text><text x="478" y="217">'d'</text>
    <text x="58" y="241">5</text><text x="130" y="241">'c' (99)</text><text x="220" y="241">'3'→3</text>
    <text x="330" y="241">99 + 3 = 102</text><text x="478" y="241">'f'</text>
    <text x="58" y="265">7</text><text x="130" y="265">'d' (100)</text><text x="220" y="265">'4'→4</text>
    <text x="330" y="265">100 + 4 = 104</text><text x="478" y="265">'h'</text>
  </g>
  <rect x="40" y="248" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- 结果串 -->
  <text x="34" y="308" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">结果：</text>
  <g filter="url(#rough2)">
    <rect x="70" y="286" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="116" y="286" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="162" y="286" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="208" y="286" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="254" y="286" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="286" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="346" y="286" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="392" y="286" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="438" y="286" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#2f5226" font-weight="bold" filter="url(#rough2)">
    <text x="90" y="310">a</text><text x="136" y="310">b</text><text x="182" y="310">b</text>
    <text x="228" y="310">d</text><text x="274" y="310">c</text><text x="320" y="310">f</text>
    <text x="366" y="310">d</text><text x="412" y="310">h</text><text x="458" y="310">e</text>
  </g>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">偶数下标的字母原样保留，只有奇数下标的数字被替换成 "前一个字母 + 步数"</text>
</svg>
