<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="93"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：players = [4,7,9]，trainers = [8,2,5,8]</text>

  <!-- 演算表 -->
  <g filter="url(#rough2)">
    <rect x="60" y="52" width="440" height="252" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="120" y="80">步骤</text><text x="220" y="80">当前运动员</text><text x="320" y="80">训练师指针 j</text><text x="450" y="80">动作</text>
  </g>
  <path d="M 70 90 L 490 90" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="120" y="118">1</text><text x="220" y="118">4</text><text x="320" y="118">0 → 1</text>
    <text x="450" y="118">跳过 2，取 5 ✓</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="120" y="150">2</text><text x="220" y="150">7</text><text x="320" y="150">1 → 2</text>
    <text x="450" y="150">直接取 8 ✓</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="120" y="182">3</text><text x="220" y="182">9</text><text x="320" y="182">2 → 3</text>
    <text x="450" y="182">8 带不动，取 8 也不行 ✗</text>
  </g>
  <path d="M 70 196 L 490 196" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="120" y="224">结束</text><text x="450" y="224">ans = 2</text>
  </g>
  <text x="280" y="262" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">j 从不回退：被跳过的 2、被用掉的 5 和第一个 8 都不再考虑</text>
  <text x="280" y="288" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">每名运动员要么消耗一个「当前最便宜的可用训练师」，要么出局</text>

  <!-- 底部对照 -->
  <g filter="url(#rough2)">
    <rect x="60" y="322" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#1d3a17" text-anchor="middle">
    <text x="280" y="344">示例 2：players = [1,1,1]，trainers = [10]</text>
    <text x="280" y="366">第一个 1 取走 10，后两个 1 无训练师可用 → ans = 1</text>
  </g>
</svg>
