<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算：nums = [2,2,2,2,3]，key = 2</text>

  <!-- 表头：数组固定一行 -->
  <g filter="url(#rough2)" font-size="12" fill="#446688">
    <text x="42" y="66">下标</text>
    <text x="150" y="66">nums[i]</text>
    <text x="290" y="66">target = nums[i+1]</text>
    <text x="452" y="66">best / ans</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#999">
    <text x="46" y="84">0</text>
    <text x="46" y="132">1</text>
    <text x="46" y="180">2</text>
    <text x="46" y="228">3</text>
  </g>

  <!-- 每行：当前格子对 + 计数 -->
  <!-- i=0 -->
  <g filter="url(#rough2)">
    <rect x="80" y="112" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="130" y="112" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="280" y="112" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="424" y="112" width="104" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="102" y="132">2</text>
    <text x="152" y="132">2</text>
    <text x="340" y="132">cnt[2] = 1</text>
    <text x="476" y="132">1 / 2</text>
  </g>
  <!-- i=1 -->
  <g filter="url(#rough2)">
    <rect x="80" y="160" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="130" y="160" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="280" y="160" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="424" y="160" width="104" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="102" y="180">2</text>
    <text x="152" y="180">2</text>
    <text x="340" y="180">cnt[2] = 2</text>
    <text x="476" y="180">2 / 2</text>
  </g>
  <!-- i=2 -->
  <g filter="url(#rough2)">
    <rect x="80" y="208" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="130" y="208" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="280" y="208" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="424" y="208" width="104" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="102" y="228">2</text>
    <text x="152" y="228">2</text>
    <text x="340" y="228">cnt[2] = 3</text>
    <text x="476" y="228">3 / 2</text>
  </g>
  <!-- i=3 -->
  <g filter="url(#rough2)">
    <rect x="80" y="256" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="130" y="256" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="280" y="256" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="424" y="256" width="104" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="102" y="276">2</text>
    <text x="152" y="276">3</text>
    <text x="340" y="276">cnt[3] = 1</text>
    <text x="476" y="276">3 / 2</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)" font-size="12" fill="#666">
    <rect x="80" y="90" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="102" y="100">key 位置</text>
    <rect x="200" y="90" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="222" y="100">后继（target 入桶）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="360" y="90" width="168" height="0" fill="none"/>
  </g>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt[2]=3 &gt; cnt[3]=1，返回 ans = 2</text>
</svg>
