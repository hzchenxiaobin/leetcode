<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">解析 s = "K1:L2"：长度恒为 5，下标定死</text>
  <path d="M 150 42 Q 260 50 370 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- five char boxes -->
  <g filter="url(#sk)">
    <rect x="88" y="62" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="146" y="62" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="204" y="62" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="262" y="62" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="320" y="62" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#sk)" font-size="17" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="111" y="90">K</text>
    <text x="169" y="90">1</text>
    <text x="227" y="90">:</text>
    <text x="285" y="90">L</text>
    <text x="343" y="90">2</text>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#666" text-anchor="middle">
    <text x="111" y="126">s[0] 列 c1</text>
    <text x="169" y="126">s[1] 行 r1</text>
    <text x="227" y="126">s[2] 分隔符</text>
    <text x="285" y="126">s[3] 列 c2</text>
    <text x="343" y="126">s[4] 行 r2</text>
  </g>

  <!-- arrow down -->
  <g filter="url(#sk)">
    <path d="M 227 108 V 174" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="240" y="150" font-size="11" fill="#888" filter="url(#sk)">拆出 4 个参数</text>

  <!-- conversion box -->
  <g filter="url(#sk)">
    <rect x="110" y="178" width="300" height="58" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">换算成 0 起始下标（'A'→0，'1'→0）：</text>
  <text x="260" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">c1=10, r1=0, c2=11, r2=1</text>

  <!-- arrow down to loop box -->
  <g filter="url(#sk)">
    <path d="M 260 236 V 258" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>

  <!-- loop emphasis box -->
  <g filter="url(#sk)">
    <rect x="110" y="262" width="300" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g filter="url(#sk)" font-size="13" fill="#833" text-anchor="middle">
    <text x="260" y="284">双重循环：外层列 c ∈ [10, 11]</text>
    <text x="260" y="303">内层行 r ∈ [0, 1]</text>
    <text x="260" y="322" font-weight="bold">共 2 × 2 = 4 个格子</text>
  </g>
</svg>
