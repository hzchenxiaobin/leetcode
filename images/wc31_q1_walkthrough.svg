<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三组官方示例的演算：谁在卡上限</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">只有当 U 超过 k = n/2 时，「可吃枚数」才是真正的瓶颈</text>

  <rect x="40" y="70" width="230" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="92" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">candyType</text>
  <rect x="280" y="70" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="92" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">U</text>
  <rect x="370" y="70" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="415" y="92" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">k = n/2</text>
  <rect x="470" y="70" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="525" y="92" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">min(U,k)</text>

  <rect x="40" y="108" width="230" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,1,2,2,3,3]</text>
  <rect x="280" y="108" width="80" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="370" y="108" width="90" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="470" y="108" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="525" y="130" text-anchor="middle" font-size="12" fill="#2f5a26" font-weight="bold" filter="url(#rough2)">3（相等）</text>

  <rect x="40" y="146" width="230" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,1,2,3]</text>
  <rect x="280" y="146" width="80" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="370" y="146" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="415" y="168" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">2</text>
  <rect x="470" y="146" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="525" y="168" text-anchor="middle" font-size="12" fill="#2f5a26" font-weight="bold" filter="url(#rough2)">2（k 卡住）</text>

  <rect x="40" y="184" width="230" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[6,6,6,6]</text>
  <rect x="280" y="184" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="206" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="370" y="184" width="90" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="470" y="184" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="525" y="206" text-anchor="middle" font-size="12" fill="#2f5a26" font-weight="bold" filter="url(#rough2)">1（U 卡住）</text>

  <path d="M 310 226 L 310 250" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="256" width="510" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="310" y="276" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">示例 1 中两个上限同时取到 3，说明「取较小值」不是保守估计；</text>
  <text x="310" y="293" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">示例 2 由 k 决定，示例 3 由 U 决定，两种瓶颈都真实存在。</text>

  <rect x="55" y="316" width="510" height="60" fill="#f7f7f4" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="336" font-size="10.5" fill="#555" filter="url(#rough2)">构造答案方案：U ≤ k 时每种取一枚（U 枚），再从重复糖里取 k − U 枚；</text>
  <text x="70" y="353" font-size="10.5" fill="#555" filter="url(#rough2)">U &gt; k 时直接挑 k 个不同种类，各取一枚。</text>
  <text x="70" y="370" font-size="10.5" fill="#999" filter="url(#rough2)">两种情形都能恰好凑满 k 枚，故 min(U, k) 一定可达。</text>
</svg>
