<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">三段稳定划分：&lt; pivot ｜ = pivot ｜ &gt; pivot</text>

  <!-- input array -->
  <text x="60" y="62" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 nums（pivot = 10）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="74" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="74" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="180" y="74" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="240" y="74" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="74" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="360" y="74" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="420" y="74" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="88" y="98">9</text><text x="148" y="98">12</text><text x="208" y="98">5</text>
    <text x="268" y="98">10</text><text x="328" y="98">14</text><text x="388" y="98">3</text><text x="448" y="98">10</text>
  </g>

  <!-- three buckets -->
  <path d="M 88 116 C 70 140, 60 152, 58 170" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 268 116 C 268 140, 268 150, 268 168" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 448 116 C 466 140, 476 152, 478 170" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="176" width="160" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="212" y="176" width="130" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <rect x="354" y="176" width="160" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="120" y="198">小于 pivot</text>
    <text x="120" y="220" font-weight="bold" fill="#2d5a22">[9, 5, 3]</text>
    <text x="277" y="198">等于 pivot</text>
    <text x="277" y="220" font-weight="bold" fill="#8a6d1f">[10, 10]</text>
    <text x="434" y="198">大于 pivot</text>
    <text x="434" y="220" font-weight="bold" fill="#8c3a36">[12, 14]</text>
  </g>
  <text x="120" y="256" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">原相对顺序保持</text>
  <text x="277" y="256" font-size="12" fill="#d6a040" filter="url(#rough2)" text-anchor="middle">个数不变</text>
  <text x="434" y="256" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">原相对顺序保持</text>

  <!-- concat -->
  <path d="M 120 262 C 160 288, 220 296, 268 300" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 434 262 C 400 288, 340 296, 292 300" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="60" y="296" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">拼接输出</text>
  <g filter="url(#rough2)">
    <rect x="60" y="306" width="440" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <text x="280" y="331" font-size="15" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">[ 9, 5, 3, 10, 10, 12, 14 ]</text>
</svg>
