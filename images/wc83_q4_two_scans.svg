<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="49" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两遍扫描求出 prev 与 nxt</text>
  <path d="M 170.0 44 Q 320.0 54 470.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="320.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">s = "LEETCODE"，用 last[26] 记录最近一次出现位置</text>
  <g filter="url(#rough2)"><rect x="165" y="92" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="183.0" y="115.12" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">L</text>
  <g filter="url(#rough2)"><rect x="205" y="92" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="223.0" y="115.12" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">E</text>
  <g filter="url(#rough2)"><rect x="245" y="92" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="263.0" y="115.12" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">E</text>
  <g filter="url(#rough2)"><rect x="285" y="92" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="303.0" y="115.12" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">T</text>
  <g filter="url(#rough2)"><rect x="325" y="92" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="343.0" y="115.12" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">C</text>
  <g filter="url(#rough2)"><rect x="365" y="92" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="383.0" y="115.12" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">O</text>
  <g filter="url(#rough2)"><rect x="405" y="92" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="423.0" y="115.12" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">D</text>
  <g filter="url(#rough2)"><rect x="445" y="92" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="463.0" y="115.12" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">E</text>
  <text x="130" y="115" text-anchor="end" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">s</text>
  <text x="130" y="166" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">prev[]</text>
  <g filter="url(#rough2)"><rect x="165" y="148" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="183" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">-1</text>
  <g filter="url(#rough2)"><rect x="205" y="148" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="223" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">-1</text>
  <g filter="url(#rough2)"><rect x="245" y="148" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="263" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="285" y="148" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="303" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">-1</text>
  <g filter="url(#rough2)"><rect x="325" y="148" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="343" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">-1</text>
  <g filter="url(#rough2)"><rect x="365" y="148" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="383" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">-1</text>
  <g filter="url(#rough2)"><rect x="405" y="148" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="423" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">-1</text>
  <g filter="url(#rough2)"><rect x="445" y="148" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="463" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="210" text-anchor="end" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">nxt[]</text>
  <g filter="url(#rough2)"><rect x="165" y="192" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="183" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="205" y="192" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="223" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="245" y="192" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="263" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="285" y="192" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="303" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="325" y="192" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="343" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="365" y="192" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="383" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="405" y="192" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="423" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="445" y="192" width="36" height="26" rx="4" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.3"/></g>
  <text x="463" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <path d="M 320 126 Q 320.0 136.0 320 146" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="360" y="140" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">正向：last 初始 −1</text>
  <path d="M 320 174 Q 320.0 182.0 320 190" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="360" y="186" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">反向：last 初始 n</text>
  <g filter="url(#rough2)"><rect x="90" y="254" width="460" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320.0" y="276" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">E 出现在 1、2、7：prev = −1、1、2，nxt = 2、7、8</text>
  <text x="320.0" y="294" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">其余字符只出现一次，prev = −1、nxt = n</text>
  <text x="320" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">O(n) 预处理 + O(n) 求和，无需枚举子串</text>
  </svg>