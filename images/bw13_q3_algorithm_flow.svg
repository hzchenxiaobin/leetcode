<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：分组 → 拆句 → DFS 展开 → 排序</text>

  <rect x="90" y="54" width="380" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 并查集合并同义词，得到 根 → 有序词组 的映射</text>

  <rect x="90" y="114" width="380" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② text.split() 拆成单词序列 words</text>
  <path d="M 280 96 L 280 110" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,180 370,216 280,252 190,216" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="221" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">words[i] 在组内？</text>
  <path d="M 280 156 L 280 176" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="400" y="190" width="140" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="211" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">逐个候选词入 cur，</text>
  <text x="470" y="229" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">递归 i+1 后回溯</text>
  <path d="M 372 216 L 396 216" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="208" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 470 244 C 470 272, 372 258, 320 246" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="190" width="112" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="116" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">只有 1 个选项：</text>
  <text x="116" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">原词直接入 cur</text>
  <path d="M 188 216 L 176 216" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="208" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="140" y="280" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">③ i 走到末尾：cur 拼成句子加入结果</text>
  <path d="M 280 254 L 280 276" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="272" font-size="12" fill="#888" filter="url(#rough2)">全部单词处理完</text>

  <rect x="140" y="342" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">④ 结果数组整体 sort → 按字典序返回</text>
  <path d="M 280 322 L 280 338" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="406" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">同义词 ≤ 10 组、句子 ≤ 10 词 → 笛卡尔积规模很小，直接展开即可</text>
</svg>
