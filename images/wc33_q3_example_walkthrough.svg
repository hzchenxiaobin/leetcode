<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：-1/2 + 1/2 + 1/3 = 1/3</text>
  <text x="300" y="47" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每一行 = 一次「通分 → 约分」，累加器始终最简</text>

  <!-- 表头 -->
  <rect x="30" y="62" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="63" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="136" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">读入项</text>
  <text x="286" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">num·b + s·a·den</text>
  <text x="431" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">新 den</text>
  <text x="518" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">约分后</text>

  <!-- 第 0 行 -->
  <rect x="30" y="94" width="540" height="32" fill="#ffffff" stroke="#cfcfcf" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="63" y="115" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">初值</text>
  <text x="136" y="115" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="286" y="115" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">直接置 num = 0</text>
  <text x="431" y="115" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="518" y="115" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0/1</text>

  <!-- 第 1 行 -->
  <rect x="30" y="128" width="540" height="32" fill="#ffffff" stroke="#cfcfcf" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="63" y="149" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="136" y="149" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">−1/2</text>
  <text x="286" y="149" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0·2 + (−1)·1·1 = −1</text>
  <text x="431" y="149" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="518" y="149" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">−1/2</text>

  <!-- 第 2 行（分子变 0） -->
  <rect x="30" y="162" width="540" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="63" y="183" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="136" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">+1/2</text>
  <text x="286" y="183" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(−1)·2 + 1·1·2 = 0</text>
  <text x="431" y="183" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="518" y="183" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">0/1</text>

  <!-- 第 3 行（最终结果） -->
  <rect x="30" y="196" width="540" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="63" y="217" text-anchor="middle" font-size="10" fill="#2f5a26" filter="url(#rough2)">3</text>
  <text x="136" y="217" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">+1/3</text>
  <text x="286" y="217" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0·3 + 1·1·1 = 1</text>
  <text x="431" y="217" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="518" y="217" text-anchor="middle" font-size="11" fill="#2f5a26" font-weight="bold" filter="url(#rough2)">1/3</text>

  <text x="300" y="244" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">最后一行即答案；第 2 行说明「结果为 0」无需特判</text>

  <!-- 左下：细节 -->
  <rect x="30" y="256" width="258" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="278" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">三个细节</text>
  <text x="44" y="300" font-size="9.5" fill="#555" filter="url(#rough2)">① 分子 0：gcd(0,4)=4 ⇒ 0/1</text>
  <text x="44" y="320" font-size="9.5" fill="#555" filter="url(#rough2)">② 用「旧分母」通分，再更新分母</text>
  <text x="44" y="340" font-size="9.5" fill="#555" filter="url(#rough2)">③ 结果为正 ⇒ 不带 '+' 前缀</text>

  <!-- 右下：示例 3 -->
  <rect x="304" y="256" width="266" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="318" y="278" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">示例 3：1/3 − 1/2</text>
  <text x="318" y="300" font-size="9.5" fill="#555" filter="url(#rough2)">num = 1·2 + (−1)·1·3 = −1</text>
  <text x="318" y="320" font-size="9.5" fill="#555" filter="url(#rough2)">den = 3·2 = 6</text>
  <text x="318" y="340" font-size="9.5" fill="#555" filter="url(#rough2)">gcd(1,6)=1 ⇒ 输出 "-1/6"</text>

  <text x="300" y="394" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">通分把分母放大，约分立刻把它压回最小 —— 累加器因此永远不会膨胀</text>
</svg>
