<svg xmlns="http://www.w3.org/2000/svg" width="660" height="490" viewBox="0 0 660 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="490" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：排名按首位切成连续段</text>
  <path d="M 210 40 Q 330 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="90" y="54" width="480" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">半串多重集 {a:2, b:1}（s = "aabbaa"）→ 排列总数 3!/(2!·1!) = 3</text>

  <g filter="url(#sk)">
    <rect x="250" y="122" width="46" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="330" y="122" width="46" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="410" y="122" width="46" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g font-size="20" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="273" y="152" fill="#2b6e9e">aab</text>
    <text x="353" y="152" fill="#2b6e9e">aba</text>
    <text x="433" y="152" fill="#2e6e2e">baa</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">
    <text x="273" y="186">排名 1</text>
    <text x="353" y="186">排名 2</text>
    <text x="433" y="186">排名 3</text>
  </g>

  <g fill="none" filter="url(#sk)">
    <rect x="238" y="112" width="146" height="76" rx="10" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="6 4"/>
    <rect x="400" y="112" width="66" height="76" rx="10" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" filter="url(#sk)">
    <text x="311" y="206" fill="#7a5415">首位 a：段 [1,2]，段长 f_a = 2</text>
    <text x="433" y="206" fill="#2e6e2e">首位 b：段 [3,3]</text>
    <text x="433" y="222" fill="#2e6e2e">段长 f_b = 1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="244" width="280" height="70" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">
    <text x="180" y="270">k = 3 ＞ f_a = 2</text>
    <text x="180" y="292">→ 整段跳过 a，k ← 3 − 2 = 1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="340" y="244" width="280" height="70" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">
    <text x="480" y="270">k = 1 ≤ f_b = 1</text>
    <text x="480" y="292">→ 首位定为 b，段内继续递归</text>
  </g>
  <path d="M 322 279 L 336 279" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="336" width="580" height="76" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" fill="#7a5415" filter="url(#sk)">
    <text x="330" y="360" font-size="12.5">段长 = 放置 c 后剩余字符的多重集排列数（与后续各位怎么排无关）</text>
    <text x="330" y="388" font-size="14.5" font-weight="bold">f_c = P(rem, cnt) · cnt[c] / rem ，其中 P(rem, cnt) = rem! / ∏ cnt[j]!</text>
  </g>

  <g text-anchor="middle" filter="url(#sk)">
    <text x="330" y="444" font-size="13" font-weight="bold" fill="#2b6e9e">逐位确定：每位按 a→z 试探，f ≥ k 就落位，否则 k −= f 整段跳过</text>
    <text x="330" y="468" font-size="11.5" fill="#666">排名空间越切越小，k 始终指向「当前剩余排列中的名次」</text>
  </g>
</svg>
