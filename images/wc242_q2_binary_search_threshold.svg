<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 364"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="364" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">二分答案：T(v) 单调不增 ⇒ 可行域是右闭区间，二分找左端点 v*</text>

  <!-- staircase curve T(v) -->
  <text x="60" y="92" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">T(v)</text>
  <path d="M 55 44 H 545" stroke="#999" stroke-width="1.2" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>
  <text x="58" y="40" font-size="10.5" fill="#888" filter="url(#rough2)">T → n−1（渐近线）</text>
  <path d="M 70 100 H 140 V 86 H 230 V 72 H 330 V 56 H 430 V 49 H 540" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- hour threshold -->
  <path d="M 55 64 H 545" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <text x="58" y="60" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">hour</text>
  <path d="M 330 64 V 108" stroke="#b85450" stroke-width="1.3" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <text x="330" y="126" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">v* = 最小可行时速（答案）</text>

  <!-- feasibility zones -->
  <rect x="55" y="132" width="275" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="192" y="155" text-anchor="middle" font-size="12" fill="#7a3030" font-weight="bold" filter="url(#rough2)">太慢：T(v) &gt; hour ✗</text>
  <rect x="330" y="132" width="215" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="437" y="155" text-anchor="middle" font-size="12" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">可行：T(v) ≤ hour ✓</text>

  <!-- speed axis -->
  <path d="M 40 188 H 560" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 55 183 V 193" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 545 183 V 193" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="55" y="209" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="545" y="209" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">10⁷</text>
  <text x="300" y="209" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">时速 v →</text>

  <!-- invariant box -->
  <rect x="40" y="222" width="520" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="242" text-anchor="middle" font-size="11.5" fill="#223a55" font-weight="bold" filter="url(#rough2)">循环不变量：lo−1 及其左侧全部 ✗，hi+1 及其右侧全部 ✓</text>
  <text x="300" y="260" text-anchor="middle" font-size="10.5" fill="#33465e" filter="url(#rough2)">每次用 mid 的判定结果砍掉一半区间，⌈log₂ 10⁷⌉ = 24 次收敛</text>

  <!-- bottom boxes -->
  <rect x="40" y="282" width="252" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="300" text-anchor="middle" font-size="11" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">上界 10⁷ 的由来</text>
  <text x="166" y="317" text-anchor="middle" font-size="10" fill="#33502a" filter="url(#rough2)">hour &gt; n−1 且两位小数 ⇒ hour ≥ n−1 + 0.01</text>
  <text x="166" y="332" text-anchor="middle" font-size="10" fill="#33502a" filter="url(#rough2)">而 T(10⁷) ≤ n−1 + 10⁵/10⁷ = n−1 + 0.01</text>
  <text x="166" y="347" text-anchor="middle" font-size="10" fill="#33502a" filter="url(#rough2)">⇒ v = 10⁷ 必可行（示例 4 中恰为答案）</text>

  <rect x="312" y="282" width="248" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="300" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">无解判据（先判，再二分）</text>
  <text x="436" y="317" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">hour ≤ n−1（注意含等号）⇒ 直接返回 −1</text>
  <text x="436" y="332" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">因为 T(v) &gt; n−1 对一切 v 严格成立</text>
  <text x="436" y="347" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">预判 O(1)，省去一次注定失败的全域二分</text>
</svg>
