<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：n−1 对相邻关系拼成一条链，端点度数为 1</text>
  <path d="M 140 42 Q 320 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: adjacentPairs -->
  <text x="105" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">adjacentPairs</text>
  <g filter="url(#sk)"><rect x="55" y="84" width="100" height="32" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="105" y="105" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">[2, 1]</text>
  <g filter="url(#sk)"><rect x="55" y="124" width="100" height="32" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="105" y="145" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">[3, 4]</text>
  <g filter="url(#sk)"><rect x="55" y="164" width="100" height="32" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="105" y="185" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">[3, 2]</text>
  <text x="105" y="222" text-anchor="middle" font-size="10.5" fill="#888">顺序、方向都打乱了</text>

  <!-- arrow -->
  <path d="M 168 140 L 224 140" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="196" y="128" text-anchor="middle" font-size="10.5" fill="#888">视为无向边</text>

  <!-- chain edges -->
  <path d="M 310 148 Q 331 141 352 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 400 148 Q 421 141 442 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 490 148 Q 511 141 532 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="331" y="130" text-anchor="middle" font-size="10" fill="#888">对[2,1]</text>
  <text x="421" y="130" text-anchor="middle" font-size="10" fill="#888">对[3,2]</text>
  <text x="511" y="130" text-anchor="middle" font-size="10" fill="#888">对[3,4]</text>

  <!-- chain nodes -->
  <g filter="url(#sk)"><circle cx="286" cy="148" r="24" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="286" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06b1a">1</text>
  <g filter="url(#sk)"><circle cx="376" cy="148" r="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="376" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><circle cx="466" cy="148" r="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="466" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><circle cx="556" cy="148" r="24" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="556" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06b1a">4</text>

  <!-- degree labels -->
  <text x="286" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06b1a">度 1（端点）</text>
  <text x="376" y="200" text-anchor="middle" font-size="11" fill="#2b5d85">度 2</text>
  <text x="466" y="200" text-anchor="middle" font-size="11" fill="#2b5d85">度 2</text>
  <text x="556" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06b1a">度 1（端点）</text>

  <!-- restored array strip -->
  <text x="105" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">沿链走 ⇒</text>
  <g filter="url(#sk)"><rect x="180" y="232" width="36" height="32" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="198" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <g filter="url(#sk)"><rect x="224" y="232" width="36" height="32" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="242" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="268" y="232" width="36" height="32" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="286" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><rect x="312" y="232" width="36" height="32" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="330" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="362" y="253" font-size="15" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="380" y="252" font-size="10.5" fill="#888">另一端出发得逆序，同样合法</text>

  <!-- summary -->
  <g filter="url(#sk)"><rect x="45" y="300" width="550" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="320" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">元素互异 + 恰好 n−1 对相邻关系 ⇒ 图连通成一条链</text>
  <text x="320" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">找到度数为 1 的端点，沿链走到底即可还原数组</text>
</svg>
