<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="384" fill="#fafafa"/>
  <text x="300" y="28" font-size="15.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">核心观察：答案一定是 s 的某个后缀</text>
  <text x="300" y="50" font-size="11" fill="#777" text-anchor="middle" filter="url(#rough2)">任何子串都是某个后缀的前缀：延伸到末尾只会变大，真前缀则更小</text>
  <text x="194" y="95" font-size="13" fill="#444" text-anchor="end" font-weight="bold" filter="url(#rough2)">s =</text>
  <rect x="208" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="231.0" y="95" font-size="15" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">a</text>
  <text x="231.0" y="124" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="254" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="277.0" y="95" font-size="15" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">b</text>
  <text x="277.0" y="124" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="300" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="323.0" y="95" font-size="15" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">a</text>
  <text x="323.0" y="124" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="346" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="369.0" y="95" font-size="15" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">b</text>
  <text x="369.0" y="124" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="38" y="146" width="214" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="145" y="168" font-size="11.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">子串 s[0..2] = &quot;aba&quot;</text>
  <text x="145" y="188" font-size="10" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">长度为 3</text>
  <rect x="348" y="146" width="220" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="458" y="168" font-size="11.5" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">后缀 s[0..3] = &quot;abab&quot;</text>
  <text x="458" y="188" font-size="10" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">延长到末尾，更长 ⇒ 严格更大</text>
  <path d="M 258 173 L 340 173" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="299" y="165" font-size="9.5" fill="#666" text-anchor="middle" filter="url(#rough2)">延伸到末尾</text>
  <text x="38" y="226" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">前 3 位逐字符相同，此时「更长的那个」胜出：</text>
  <text x="38" y="244" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">所以把候选子串一路延伸到末尾，字典序只会变大 —— 最大值必然落在后缀上。</text>
  <rect x="38" y="258" width="530" height="82" fill="#f7f9fc" stroke="#9db0c8" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="280" font-size="12" fill="#2f4a6b" text-anchor="start" font-weight="bold" filter="url(#rough2)">问题归约：在 n 个后缀中挑出字典序最大者</text>
  <text x="54" y="302" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">候选规模从 O(n²) 个子串降到 O(n) 个后缀；&quot;abab&quot; 的 4 个后缀为</text>
  <text x="54" y="320" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">abab / bab / ab / b，其中最大的是 &quot;bab&quot;（下标 1 开始）。</text>
  <text x="300" y="364" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">剩下的问题：如何不逐一比较，就在 O(n) 时间内找到这个最大后缀？</text>
</svg>
