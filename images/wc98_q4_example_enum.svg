<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">示例 nums = [2,1,3]：7 个非空子序列的宽度</text>
  <text x="60" y="76" text-anchor="start" font-size="12" fill="#2c4a63" filter="url(#rough2)">子序列</text>
  <text x="300" y="76" text-anchor="start" font-size="12" fill="#8a6410" filter="url(#rough2)">最大值 − 最小值</text>
  <rect x="60" y="92" width="220" height="32" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1]</text>
  <rect x="300" y="92" width="200" height="32" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="400" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="60" y="130" width="220" height="32" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2]</text>
  <rect x="300" y="130" width="200" height="32" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="400" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="60" y="168" width="220" height="32" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3]</text>
  <rect x="300" y="168" width="200" height="32" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="400" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="60" y="206" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2,1]</text>
  <rect x="300" y="206" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="400" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="60" y="244" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2,3]</text>
  <rect x="300" y="244" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="400" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="60" y="282" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1,3]</text>
  <rect x="300" y="282" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="400" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="60" y="320" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="342" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2,1,3]</text>
  <rect x="300" y="320" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="400" y="342" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="520" y="92" width="120" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="580.0" y="115.85" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">合计</text>
  <text x="580.0" y="135.85" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">0+0+0+1+1+2+2</text>
  <text x="520" y="190" text-anchor="start" font-size="20" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 6</text>
  <text x="60" y="386" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">单个元素宽度为 0，只有长度 ≥ 2 的子序列才有贡献</text>
</svg>
