<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描的贪心交替</text>

  <rect x="40" y="56" width="150" height="36" rx="16" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="79" text-anchor="middle" font-size="13" fill="#2b3a4e" filter="url(#rough2)">初始化：ans 空，prev = −1</text>

  <path d="M 190 74 L 226 74" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,50 376,74 280,98 184,74" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="12" fill="#6b5416" filter="url(#rough2)">i &lt; n 且 g[i] ≠ prev？</text>

  <path d="M 376 74 L 410 74" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="64" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 280 98 L 280 132" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="122" font-size="11" fill="#b85450" filter="url(#rough2)">否（跳过）</text>

  <rect x="410" y="56" width="120" height="36" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="79" text-anchor="middle" font-size="12" fill="#2e4d26" filter="url(#rough2)">ans += w[i]；prev = g[i]</text>

  <path d="M 470 92 L 470 132 L 280 132" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" fill="none"/>
  <path d="M 280 132 L 280 150" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="196" y="152" width="168" height="34" rx="16" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="13" fill="#2b3a4e" filter="url(#rough2)">i++，回到判定</text>

  <path d="M 196 169 L 150 169 L 150 130 L 184 110" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>

  <rect x="180" y="216" width="200" height="34" rx="16" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="13" fill="#7a3230" filter="url(#rough2)">扫描结束：返回 ans（即全部单词）</text>
  <path d="M 280 186 L 280 216" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">关键：只需相邻 groups 不同，单词全保留 —— 每换一次组就收一个词</text>
</svg>
