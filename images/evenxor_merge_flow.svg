<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：每个节点 w 做一次「配对 + 合并」</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ LEFT: 5 steps ============ -->
  <g filter="url(#sk)">
    <rect x="24" y="56" width="246" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="147" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">① BFS 以 0 为根，求出所有 g(v)</text>
  <text x="147" y="94" text-anchor="middle" font-size="11" fill="#2b2b2b">g(v) = g(parent) ⊕ b(v)</text>
  <line x1="147" y1="108" x2="147" y2="120" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="24" y="124" width="246" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="147" y="144" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">② 按 BFS 序逆序处理 w（子树已算好）</text>
  <text x="147" y="162" text-anchor="middle" font-size="11" fill="#2b2b2b">cur = [∞, ∞]，再令 cur[g(w)] = 0</text>
  <line x1="147" y1="176" x2="147" y2="188" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="24" y="192" width="246" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="147" y="212" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">③ 逐个并入子分支 ch（边权 c）</text>
  <text x="147" y="230" text-anchor="middle" font-size="11" fill="#2b2b2b">a = [ A[ch][0]+c , A[ch][1]+c ]</text>
  <line x1="147" y1="244" x2="147" y2="256" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="24" y="260" width="246" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="147" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">④ 按 b(w) 生成候选，更新 ans</text>
  <text x="147" y="298" text-anchor="middle" font-size="11" fill="#8a6415">（同色 / 异色规则见右图）</text>
  <line x1="147" y1="312" x2="147" y2="324" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="24" y="328" width="246" height="52" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="147" y="348" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">⑤ 合并：cur[c] = min(cur[c], a[c])</text>
  <text x="147" y="366" text-anchor="middle" font-size="11" fill="#2e6e2e">全部并完 → 上传 A[w] = cur</text>

  <!-- ============ RIGHT: pairing scene ============ -->
  <text x="458" y="62" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">w 的配对现场（LCA 恰为 w）</text>

  <g filter="url(#sk)">
    <circle cx="458" cy="108" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="482" y="78" width="40" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="458" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">w</text>
  <text x="502" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415">b(w)</text>

  <path d="M 377 152 Q 400 138 436 124" stroke="#7a7a7a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 541 152 Q 518 138 480 124" stroke="#7a7a7a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="312" y="152" width="130" height="78" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="377" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">已合并部分</text>
  <text x="377" y="189" text-anchor="middle" font-size="11" fill="#2b2b2b">cur[0] / cur[1]</text>
  <text x="377" y="205" text-anchor="middle" font-size="10" fill="#555">含 w 自身：</text>
  <text x="377" y="219" text-anchor="middle" font-size="10" fill="#555">颜色 g(w)，距离 0</text>

  <g filter="url(#sk)">
    <rect x="476" y="152" width="130" height="78" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="541" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">新并入的分支</text>
  <text x="541" y="189" text-anchor="middle" font-size="11" fill="#2b2b2b">a[0] / a[1]</text>
  <text x="541" y="205" text-anchor="middle" font-size="10" fill="#555">子树内每色最近点</text>
  <text x="541" y="219" text-anchor="middle" font-size="10" fill="#555">已加上边权 c</text>

  <g filter="url(#sk)">
    <rect x="306" y="252" width="148" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="380" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">b(w) = 1</text>
  <text x="380" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">→ 异色配对</text>
  <text x="380" y="308" text-anchor="middle" font-size="11" fill="#2b2b2b">cur[0] + a[1]</text>
  <text x="380" y="324" text-anchor="middle" font-size="11" fill="#2b2b2b">cur[1] + a[0]</text>

  <g filter="url(#sk)">
    <rect x="470" y="252" width="148" height="84" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="544" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">b(w) = 0</text>
  <text x="544" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">→ 同色配对</text>
  <text x="544" y="308" text-anchor="middle" font-size="11" fill="#2b2b2b">cur[0] + a[0]</text>
  <text x="544" y="324" text-anchor="middle" font-size="11" fill="#2b2b2b">cur[1] + a[1]</text>

  <text x="458" y="356" text-anchor="middle" font-size="11" fill="#555">候选两端必属不同分支 ⇒ LCA 恰为 w</text>
  <text x="458" y="372" text-anchor="middle" font-size="11" fill="#555">⇒ 每个候选都是真实平衡路径</text>

  <g filter="url(#sk)">
    <rect x="306" y="386" width="312" height="76" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="462" y="404" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">为什么每色只记最近点就够？</text>
  <text x="462" y="421" text-anchor="middle" font-size="10" fill="#2e6e2e">· 异色：换成 (w, 与 w 异色的一端)，更近且仍合法</text>
  <text x="462" y="436" text-anchor="middle" font-size="10" fill="#2e6e2e">· 同色 = g(w)：换成 (w, 同色端)，更近</text>
  <text x="462" y="451" text-anchor="middle" font-size="10" fill="#2e6e2e">· 同色 ≠ g(w)：w 不占该色，cur 天然来自不同分支</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="24" y="478" width="592" height="36" rx="8" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.3"/>
  </g>
  <text x="320" y="500" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6a5a2a">每个子树只上传 2 个数：A[v] = [ 色0 最近距离 , 色1 最近距离 ] ⇒ 全树 O(n)</text>
</svg>
