<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 226"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="226" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">三步：计数 → 求 gcd → 判界</text>
  <rect x="40" y="74" width="160" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120.0" y="103.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">统计每种牌张数 cnt</text>
  <path d="M 200,99 L 248,99" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="248" y="74" width="170" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="333.0" y="103.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">g = gcd(g, cnt[v])</text>
  <path d="M 418,99 L 466,99" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="466" y="74" width="140" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536.0" y="103.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 g ≥ 2</text>
  <text x="320" y="170" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">g 初值取 0（gcd(0,x)=x），取 1 会让结果恒为 1</text>
  <text x="320" y="204" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">所有合法组大小 X 恰好是 g 的因子，因此只需看 g 是否 ≥ 2</text>
</svg>
