<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">记忆化递归：按节点数缓存，避免重复构造</text>
  <rect x="50" y="56" width="520" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="82.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">solve(n)：n 为偶数 ⇒ 返回空表</text>
  <rect x="50" y="112" width="520" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="138.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">n == 1 ⇒ 返回单节点树 [0]</text>
  <rect x="50" y="168" width="520" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="194.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">命中 memo[n] ⇒ 直接返回（同一批子树被复用）</text>
  <rect x="50" y="224" width="520" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="250.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">枚举 left = 1,3,5,…,n−2：right = n−1−left</text>
  <rect x="50" y="280" width="520" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="306.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">两层循环把 L × R 全部组合成新根，写入 memo[n]</text>
  <rect x="50" y="336" width="520" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="362.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">返回 memo[n]</text>
  <path d="M 310 100 L 310 112" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 156 L 310 168" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 212 L 310 224" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 268 L 310 280" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 324 L 310 336" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
