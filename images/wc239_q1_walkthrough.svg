<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：多命中取 min，「最左」不是「最近」</text>
  <text x="320" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">蓝色格子 = start 位置，绿色格子 = target 命中</text>

  <!-- 案例 A：官方示例 1 -->
  <text x="56" y="64" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#rough2)">示例 1：nums = [1,2,3,4,5]，target = 5，start = 3</text>
  <rect x="80" y="74" width="48" height="40" rx="4" fill="#fdfdfd" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="136" y="74" width="48" height="40" rx="4" fill="#fdfdfd" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="192" y="74" width="48" height="40" rx="4" fill="#fdfdfd" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="248" y="74" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="304" y="74" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="104" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="216" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="272" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="328" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">5</text>
  <text x="104" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="160" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="216" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="272" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3 = start</text>
  <text x="328" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <path d="M 272 134 Q 300 156 328 134" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="160" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">d = |4−3| = 1</text>
  <text x="56" y="188" text-anchor="start" font-size="12" fill="#2e6e2e" filter="url(#rough2)">唯一命中 i = 4，|4−3| = 1 → 答案 1 ✓</text>

  <!-- 案例 B：自拟示例 4 -->
  <text x="56" y="218" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#rough2)">示例 4（自拟）：nums = [1,2,3,1]，target = 1，start = 2</text>
  <rect x="80" y="228" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="136" y="228" width="48" height="40" rx="4" fill="#fdfdfd" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="192" y="228" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="248" y="228" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="104" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="160" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="216" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="272" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="104" y="282" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="160" y="282" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="216" y="282" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2 = start</text>
  <text x="272" y="282" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <path d="M 104 288 Q 160 320 216 288" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 220 288 Q 246 312 272 288" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="330" text-anchor="middle" font-size="11" fill="#b27a10" filter="url(#rough2)">|0−2| = 2</text>
  <text x="256" y="330" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">|3−2| = 1</text>

  <!-- 警示框 -->
  <rect x="40" y="346" width="560" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="368" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">命中 i = 0（距离 2）与 i = 3（距离 1）→ min(2, 1) = 1 ✓</text>
  <text x="320" y="388" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠ 若从左扫在首个命中 i = 0 就 return → 错答 2：「最近」≠「最左」</text>
</svg>
