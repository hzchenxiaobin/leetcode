<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例走查：s = "L1e2t1C1o1d1e1"，n = 14，解压后共 8 个字符</text>

  <!-- 表头 -->
  <rect x="24" y="60" width="570" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="67" y="81" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">调用</text>
  <text x="136" y="81" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i</text>
  <text x="193" y="81" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cur</text>
  <text x="252" y="81" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cnt</text>
  <text x="394" y="81" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">动作（调用后状态变化）</text>
  <text x="551" y="81" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回</text>

  <!-- 行 -->
  <rect x="24" y="92" width="570" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">构造</text>
  <text x="136" y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="193" y="112" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#rough2)">–</text>
  <text x="252" y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="286" y="112" font-size="9.5" fill="#555" filter="url(#rough2)">只记录 s，不解压；i=cnt=0</text>
  <text x="551" y="112" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#rough2)">—</text>

  <rect x="24" y="122" width="570" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="142" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">next</text>
  <text x="136" y="142" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="193" y="142" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#rough2)">–</text>
  <text x="252" y="142" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="286" y="142" font-size="9.5" fill="#555" filter="url(#rough2)">cur='L', i=1；读 '1' → cnt=1；再 cnt--</text>
  <text x="551" y="142" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">'L'</text>

  <rect x="24" y="152" width="570" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="172" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">next</text>
  <text x="136" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="193" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">L</text>
  <text x="252" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="286" y="172" font-size="9.5" fill="#555" filter="url(#rough2)">cur='e', i=3；读 '2' → cnt=2；cnt-- → 1</text>
  <text x="551" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">'e'</text>

  <rect x="24" y="182" width="570" height="30" fill="#fff8e1" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="202" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">next</text>
  <text x="136" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="193" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">e</text>
  <text x="252" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="286" y="202" font-size="9.5" fill="#a08030" filter="url(#rough2)">cnt=1&gt;0：不解析，只 cnt-- → 0</text>
  <text x="551" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">'e'</text>

  <rect x="24" y="212" width="570" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="232" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">next</text>
  <text x="136" y="232" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="193" y="232" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">e</text>
  <text x="252" y="232" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="286" y="232" font-size="9.5" fill="#555" filter="url(#rough2)">cur='t', i=5；读 '1' → cnt=1；cnt--</text>
  <text x="551" y="232" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">'t'</text>

  <rect x="24" y="242" width="570" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="262" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">next</text>
  <text x="136" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="193" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">t</text>
  <text x="252" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="286" y="262" font-size="9.5" fill="#555" filter="url(#rough2)">cur='C', i=7；读 '1' → cnt=1；cnt--</text>
  <text x="551" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">'C'</text>

  <rect x="24" y="272" width="570" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="292" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">next</text>
  <text x="136" y="292" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="193" y="292" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">C</text>
  <text x="252" y="292" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="286" y="292" font-size="9.5" fill="#555" filter="url(#rough2)">cur='o', i=9；读 '1' → cnt=1；cnt--</text>
  <text x="551" y="292" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">'o'</text>

  <rect x="24" y="302" width="570" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="322" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">next</text>
  <text x="136" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="193" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">o</text>
  <text x="252" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="286" y="322" font-size="9.5" fill="#555" filter="url(#rough2)">cur='d', i=11；读 '1' → cnt=1；cnt--</text>
  <text x="551" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">'d'</text>

  <rect x="24" y="332" width="570" height="30" fill="#e6f4ea" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="352" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">hasNext</text>
  <text x="136" y="352" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="193" y="352" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">d</text>
  <text x="252" y="352" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="286" y="352" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">cnt=0，但 i=12 &lt; n=14 → 还有 'e1'</text>
  <text x="551" y="352" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">true</text>

  <rect x="24" y="362" width="570" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="382" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">next</text>
  <text x="136" y="382" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="193" y="382" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">d</text>
  <text x="252" y="382" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="286" y="382" font-size="9.5" fill="#555" filter="url(#rough2)">cur='e', i=13；读 '1' → cnt=1；cnt--</text>
  <text x="551" y="382" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">'e'</text>

  <rect x="24" y="392" width="570" height="30" fill="#e6f4ea" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="412" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">hasNext</text>
  <text x="136" y="412" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">14</text>
  <text x="193" y="412" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">e</text>
  <text x="252" y="412" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="286" y="412" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">cnt=0 且 i=n=14 → 已全部输出</text>
  <text x="551" y="412" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">false</text>

  <rect x="24" y="422" width="570" height="30" fill="#fce4ec" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="442" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">next</text>
  <text x="136" y="442" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">14</text>
  <text x="193" y="442" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">e</text>
  <text x="252" y="442" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="286" y="442" font-size="9.5" fill="#b85450" filter="url(#rough2)">!hasNext：直接返回空格，状态不变</text>
  <text x="551" y="442" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">' '</text>

  <!-- 竖向分隔线 -->
  <path d="M 110 60 L 110 452" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 162 60 L 162 452" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 224 60 L 224 452" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 280 60 L 280 452" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 508 60 L 508 452" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="320" y="474" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">共 8 次 next 输出 "LeetCode"；第 9 次 next 返回空格；解析只发生 7 次（7 个块）</text>
  <text x="320" y="492" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每次 next 只做一次比较 + 一次自减，块内调用不再扫描数字</text>
</svg>
