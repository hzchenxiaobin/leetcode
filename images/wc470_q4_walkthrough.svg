<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：n = 205，答案 144</text>
  <text x="330" y="47" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">位（低位→高位）：n₀ = 5，n₁ = 0，n₂ = 2；状态记 (进位, a 阶段, b 阶段)，A = 活跃，E = 已结束</text>

  <!-- 表头 -->
  <rect x="28" y="60" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="168" y="60" width="464" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">阶段</text>
  <text x="400" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">状态 → 个数（关键转移）</text>

  <!-- 行 1：初始 -->
  <rect x="28" y="90" width="140" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="168" y="90" width="464" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="98" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">初始</text>
  <text x="182" y="114" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">(0, A, A) : 1</text>
  <text x="182" y="134" font-size="11" fill="#666" filter="url(#rough2)">进位 0，两个数都还没开始写</text>

  <!-- 行 2：第 0 位 -->
  <rect x="28" y="144" width="140" height="58" fill="#f5f5f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="168" y="144" width="464" height="58" fill="#f5f5f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="98" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">第 0 位</text>
  <text x="98" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">n₀ = 5</text>
  <text x="182" y="168" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">(0, A, A) : 4　　(1, A, A) : 4</text>
  <text x="182" y="190" font-size="11" fill="#666" filter="url(#rough2)">数字对和 ∈ {5, 15}，各 4 组 → 进位分别 0 / 1</text>

  <!-- 行 3：第 1 位 -->
  <rect x="28" y="202" width="140" height="58" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="168" y="202" width="464" height="58" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="98" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">第 1 位</text>
  <text x="98" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">n₁ = 0</text>
  <text x="182" y="226" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">(0,E,E):4　(0,E,A):4　(0,A,E):4　(1,A,A):68</text>
  <text x="182" y="248" font-size="11" fill="#666" filter="url(#rough2)">和 ≡ 0 (mod 10)：(0,0) 双双封笔；和 9 的 (0,9)/(9,0) 单边封笔，其余继续</text>

  <!-- 行 4：第 2 位 -->
  <rect x="28" y="260" width="140" height="58" fill="#f5f5f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="168" y="260" width="464" height="58" fill="#f5f5f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="98" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">第 2 位</text>
  <text x="98" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">n₂ = 2</text>
  <text x="182" y="284" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">(0, E, A) : 72　(0, A, E) : 72　(1, A, A) : 544</text>
  <text x="182" y="306" font-size="11" fill="#666" filter="url(#rough2)">和 ∈ {1, 11}：和 1 → (1,0)/(0,1) 一边封笔；和 11 → 双双写满三位</text>

  <!-- 行 5：终态 -->
  <rect x="28" y="318" width="140" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="168" y="318" width="464" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="98" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">终态</text>
  <text x="182" y="340" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">只留进位 0：72 + 72 = 144 ✓</text>
  <text x="182" y="360" font-size="11" fill="#666" filter="url(#rough2)">(1, A, A) 的 544 被丢弃——它们对应 a + b = 205 + 1000 = 1205</text>

  <!-- 底部洞察 -->
  <rect x="28" y="382" width="604" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">144 = 72 + 72，恰好左右对称</text>
  <text x="330" y="427" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">72 =「a 一/两位数 × b 三位数」（4 + 68），另一半 72 完全对称</text>
  <text x="330" y="447" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">如 (6, 199)、(88, 117) 合法；(1, 204)、(98, 107) 因含 0 出局</text>
</svg>
