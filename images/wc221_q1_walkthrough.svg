<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="330" fill="#fafafa" filter="url(#rough2)"/>
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：对撞双指针逐对扫描</text>
  <path d="M 200 38 Q 350 48 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- left panel: book true -->
  <text x="185" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">s = "book"（n = 4）</text>
  <g filter="url(#rough2)">
    <rect x="30" y="66" width="310" height="26" fill="#f0f3f7" stroke="#8a97a8" stroke-width="1"/>
    <rect x="30" y="92" width="310" height="48" fill="#ffffff" stroke="#8a97a8" stroke-width="1"/>
    <path d="M 70 66 V 140 M 126 66 V 140 M 166 66 V 140 M 222 66 V 140 M 292 66 V 140" stroke="#b8c2cf" stroke-width="1" fill="none"/>
    <path d="M 30 116 H 340" stroke="#dfe5ec" stroke-width="1" fill="none"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">
    <text x="50" y="83">i</text>
    <text x="98" y="83">s[i]</text>
    <text x="146" y="83">j</text>
    <text x="194" y="83">s[j]</text>
    <text x="257" y="83">cntA</text>
    <text x="316" y="83">cntB</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">
    <text x="50" y="108">0</text><text x="98" y="108">b</text><text x="146" y="108">3</text><text x="194" y="108">k</text><text x="257" y="108">0</text><text x="316" y="108">0</text>
    <text x="50" y="132">1</text><text x="98" y="132" fill="#d6a040" font-weight="bold">o</text><text x="146" y="132">2</text><text x="194" y="132" fill="#d6a040" font-weight="bold">o</text><text x="257" y="132" fill="#2e6e2e" font-weight="bold">1</text><text x="316" y="132" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <text x="185" y="160" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两轮扫完 → 比较计数器</text>
  <g filter="url(#rough2)">
    <rect x="77" y="172" width="216" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="185" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1 == 1 → true ✓</text>

  <!-- right panel: textbook false -->
  <text x="515" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">s = "textbook"（n = 8）</text>
  <g filter="url(#rough2)">
    <rect x="360" y="66" width="310" height="26" fill="#f0f3f7" stroke="#8a97a8" stroke-width="1"/>
    <rect x="360" y="92" width="310" height="96" fill="#ffffff" stroke="#8a97a8" stroke-width="1"/>
    <path d="M 400 66 V 188 M 456 66 V 188 M 496 66 V 188 M 552 66 V 188 M 622 66 V 188" stroke="#b8c2cf" stroke-width="1" fill="none"/>
    <path d="M 360 116 H 670 M 360 140 H 670 M 360 164 H 670" stroke="#dfe5ec" stroke-width="1" fill="none"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">
    <text x="380" y="83">i</text>
    <text x="428" y="83">s[i]</text>
    <text x="476" y="83">j</text>
    <text x="524" y="83">s[j]</text>
    <text x="587" y="83">cntA</text>
    <text x="646" y="83">cntB</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">
    <text x="380" y="108">0</text><text x="428" y="108">t</text><text x="476" y="108">7</text><text x="524" y="108">k</text><text x="587" y="108">0</text><text x="646" y="108">0</text>
    <text x="380" y="132">1</text><text x="428" y="132" fill="#d6a040" font-weight="bold">e</text><text x="476" y="132">6</text><text x="524" y="132" fill="#d6a040" font-weight="bold">o</text><text x="587" y="132">1</text><text x="646" y="132">1</text>
    <text x="380" y="156">2</text><text x="428" y="156">x</text><text x="476" y="156">5</text><text x="524" y="156" fill="#d6a040" font-weight="bold">o</text><text x="587" y="156">1</text><text x="646" y="156">2</text>
    <text x="380" y="180">3</text><text x="428" y="180">t</text><text x="476" y="180">4</text><text x="524" y="180">b</text><text x="587" y="180" fill="#b85450" font-weight="bold">1</text><text x="646" y="180" fill="#b85450" font-weight="bold">2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="407" y="204" width="216" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="515" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1 ≠ 2 → false ✗</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="70" y="264" width="560" height="48" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="350" y="282" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每轮同时处理一对 (i, j)：i 从头前进、j 从尾后退，一次循环喂两个计数器。</text>
  <text x="350" y="300" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只有元音（大小写 aeiou，共 10 个）才让计数器 +1；n/2 对扫完后比较 cntA 与 cntB。</text>
</svg>
