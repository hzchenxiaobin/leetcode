<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：root = [1,3,2,5,null,null,9,6,null,7]</text>

  <!-- 表头底色与高亮行 -->
  <rect x="80" y="66" width="600" height="42" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <rect x="80" y="252" width="600" height="48" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>

  <!-- 网格线 -->
  <path d="M80,66 L680,66" stroke="#8fa8c8" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M80,108 L680,108" stroke="#8fa8c8" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M80,156 L680,156" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M80,204 L680,204" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M80,252 L680,252" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M80,300 L680,300" stroke="#8fa8c8" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M80,66 L80,300" stroke="#8fa8c8" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M170,66 L170,300" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M390,66 L390,300" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M480,66 L480,300" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M600,66 L600,300" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M680,66 L680,300" stroke="#8fa8c8" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="125" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">层</text>
  <text x="280" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">该层原始下标</text>
  <text x="435" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">first</text>
  <text x="540" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">rel = idx − first</text>
  <text x="640" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">宽度</text>

  <!-- 第 1 行 -->
  <text x="125" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="280" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="435" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="540" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="640" y="139" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 第 2 行 -->
  <text x="125" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="280" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2, 3</text>
  <text x="435" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="540" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 1</text>
  <text x="640" y="187" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 第 3 行 -->
  <text x="125" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="280" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4, 7</text>
  <text x="435" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="540" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 3</text>
  <text x="640" y="235" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <!-- 第 4 行（答案层） -->
  <text x="125" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="280" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">8, 14</text>
  <text x="435" y="282" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">8</text>
  <text x="540" y="282" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">0, 6</text>
  <text x="640" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>

  <!-- 结论框 -->
  <rect x="80" y="322" width="600" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="345" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">宽度 = last − first + 1：第 4 层 14 − 8 + 1 = 7</text>
  <text x="380" y="366" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">中间 5 个空位在满二叉树里存在、实际为 null，照样计入长度</text>
</svg>
