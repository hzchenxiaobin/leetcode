<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">四步操作与它们的逆：正向 ⟺ 反向</text>

  <!-- 中间状态点 -->
  <g filter="url(#rough2)">
    <ellipse cx="280" cy="180" rx="46" ry="28" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="280" y="186" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">(x, y)</text>

  <!-- 正向操作（蓝色，从中心向外） -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <rect x="370" y="60" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <rect x="40" y="260" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <rect x="370" y="260" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22" text-anchor="middle">
    <text x="115" y="78">(x, y − x)</text><text x="115" y="94">y 减掉 x</text>
    <text x="445" y="78">(x − y, y)</text><text x="445" y="94">x 减掉 y</text>
    <text x="115" y="278">(2x, y)</text><text x="115" y="294">x 翻倍</text>
    <text x="445" y="278">(x, 2y)</text><text x="445" y="294">y 翻倍</text>
  </g>
  <path d="M 240 166 C 200 140, 180 120, 168 104" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <path d="M 320 166 C 360 140, 380 120, 392 104" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <path d="M 240 196 C 200 218, 180 236, 168 256" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <path d="M 320 196 C 360 218, 380 236, 392 256" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <!-- 反向操作（红色，从外向中心） -->
  <g filter="url(#rough2)">
    <rect x="210" y="380" width="140" height="0" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#b85450" text-anchor="middle">
    <text x="280" y="352">反向操作集：(x+y, y)、(x, x+y)、x 偶时 (x/2, y)、y 偶时 (x, y/2)</text>
  </g>
  <text x="280" y="128" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">正向可达 ⟺ 反向可达（每个操作的逆仍在本操作族内）</text>
  <path d="M 165 98 C 210 116, 235 140, 252 158" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrb)" filter="url(#rough2)" opacity="0.8"/>
  <path d="M 395 98 C 350 116, 325 140, 308 158" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrb)" filter="url(#rough2)" opacity="0.8"/>
  <path d="M 165 262 C 210 244, 235 220, 252 202" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrb)" filter="url(#rough2)" opacity="0.8"/>
  <path d="M 395 262 C 350 244, 325 220, 308 202" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrb)" filter="url(#rough2)" opacity="0.8"/>

  <!-- 图例 -->
  <g filter="url(#rough2)" font-size="12">
    <text x="60" y="336" fill="#2d5a22">─ 正向（从 (1,1) 出发）</text>
    <text x="300" y="336" fill="#b85450">╌ 反向（从目标往回走）</text>
  </g>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">正难则反：正向组合难以刻画，反向却能"加法收缩 + 减半下降"</text>
</svg>
