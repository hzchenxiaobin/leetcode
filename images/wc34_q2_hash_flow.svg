<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">哈希表 + 单次扫描 + 剪枝：O(m + n)</text>
  <text x="340" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">pos 记录 list1 的「字符串 → 下标」，扫描 list2 时一边算 i + j 一边维护 best 与答案集</text>

  <rect x="140" y="64" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="89" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">① 建表：遍历 list1 得 pos[name] = i（O(m)）</text>

  <path d="M 340 104 L 340 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="128" width="400" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="152" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">② 顺序扫描 list2：j = 0, 1, 2, …</text>

  <path d="M 340 166 L 340 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="340,188 470,222 340,256 210,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="227" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">j &gt; best ?</text>

  <path d="M 470 222 L 522 222" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="486" y="212" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="524" y="192" width="140" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="594" y="212" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">break 提前结束</text>
  <text x="594" y="228" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">i ≥ 0 ⇒ i + j ≥ j &gt; best</text>
  <text x="594" y="242" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">后续不可能刷新答案</text>

  <path d="M 340 256 L 340 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="272" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <polygon points="340,280 468,314 340,348 212,314" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="319" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">list2[j] ∈ pos ?</text>

  <path d="M 212 314 L 150 314" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="168" y="304" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="30" y="292" width="118" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="89" y="311" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">非公共串</text>
  <text x="89" y="326" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">continue</text>

  <path d="M 340 348 L 340 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="362" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="120" y="368" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="340" y="387" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">total = pos[list2[j]] + j</text>
  <text x="340" y="405" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">total &lt; best → best = total，ans = [name]；total == best → ans.append(name)</text>

  <rect x="120" y="426" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="447" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">③ 返回 ans：所有索引和为 best 的公共串（顺序任意）</text>
</svg>
