<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="940" height="500" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [5,4,2,3] ⟹ arr = [3,2,5,4]</text>
  <path d="M 230 42 Q 470 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <path d="M 482 64 L 482 300" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>

  <text x="268" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 按题意逐轮模拟</text>
  <text x="706" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 排序 + 相邻两两交换</text>

  <!-- ===== Left: round-by-round simulation ===== -->
  <text x="72" y="110" font-size="11" fill="#555" filter="url(#sk)">第1轮 nums：</text>
  <g filter="url(#sk)"><rect x="190" y="86" width="52" height="38" rx="4" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="216" y="110" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="248" y="86" width="52" height="38" rx="4" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="274" y="110" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="306" y="86" width="52" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="332" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="364" y="86" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="390" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <text x="268" y="142" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">Alice 先移 2，Bob 再移 3</text>

  <text x="72" y="172" font-size="11" fill="#555" filter="url(#sk)">放入 arr：</text>
  <g filter="url(#sk)"><rect x="190" y="150" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="216" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="248" y="150" width="52" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="274" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <text x="268" y="200" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">Bob 的 3 先进，Alice 的 2 后进</text>

  <text x="72" y="230" font-size="11" fill="#555" filter="url(#sk)">第2轮 nums：</text>
  <g filter="url(#sk)"><rect x="190" y="208" width="52" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="216" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="248" y="208" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="274" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <text x="268" y="262" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">Alice 先移 4，Bob 再移 5</text>

  <text x="72" y="292" font-size="11" fill="#555" filter="url(#sk)">arr 追加后：</text>
  <g filter="url(#sk)"><rect x="190" y="270" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="216" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="248" y="270" width="52" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="274" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="306" y="270" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="332" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="364" y="270" width="52" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="390" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>
  <text x="268" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">最终 arr = [3,2,5,4] ✓</text>

  <!-- ===== Right: sort + swap ===== -->
  <text x="520" y="110" font-size="11" fill="#555" filter="url(#sk)">排序 s =</text>
  <g filter="url(#sk)"><rect x="620" y="86" width="52" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="646" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="678" y="86" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="704" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="736" y="86" width="52" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="762" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="794" y="86" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="820" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <text x="706" y="142" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">第0组 (2,3)，第1组 (4,5)</text>

  <g filter="url(#sk)"><rect x="560" y="166" width="40" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="580" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="606" y="166" width="40" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="626" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <path d="M 656 181 L 678 181" stroke="#b03a3a" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="688" y="166" width="40" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="708" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="734" y="166" width="40" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="754" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <text x="800" y="186" font-size="9" fill="#888" filter="url(#sk)">(2,3)→(3,2)</text>

  <g filter="url(#sk)"><rect x="560" y="206" width="40" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="580" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="606" y="206" width="40" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="626" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <path d="M 656 221 L 678 221" stroke="#b03a3a" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="688" y="206" width="40" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="708" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="734" y="206" width="40" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="754" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>
  <text x="800" y="226" font-size="9" fill="#888" filter="url(#sk)">(4,5)→(5,4)</text>

  <text x="706" y="258" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">组内交换：小在前 → 大在前</text>

  <text x="520" y="292" font-size="11" fill="#555" filter="url(#sk)">输出 arr =</text>
  <g filter="url(#sk)"><rect x="620" y="270" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="646" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="678" y="270" width="52" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="704" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="736" y="270" width="52" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="762" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="794" y="270" width="52" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="820" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>
  <text x="706" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">最终 arr = [3,2,5,4] ✓</text>

  <g filter="url(#sk)"><ellipse cx="482" cy="244" rx="38" ry="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="482" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">一致</text>

  <!-- ===== Bottom: more cases ===== -->
  <g filter="url(#sk)"><rect x="66" y="344" width="818" height="130" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="86" y="370" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">再多验两组（覆盖边界）</text>
  <text x="86" y="398" font-size="11" fill="#444" filter="url(#sk)">nums = [2,5]（最小规模 n=2）：模拟 → Alice 移 2、Bob 移 5 → arr = [5,2]；排序后两两交换 → [5,2] ✓</text>
  <text x="86" y="424" font-size="11" fill="#444" filter="url(#sk)">nums = [1,1,2,2]（含重复值）：排序后两两交换 → [1,1,2,2]；逐轮模拟 → [1,1,2,2] ✓</text>
  <text x="86" y="452" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#sk)">结论：相等值交换前后不变；n=2 时仅一轮，输出 [max, min]。</text>
</svg>
