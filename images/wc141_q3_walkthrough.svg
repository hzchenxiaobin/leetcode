<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#2f5e22"/>
    </marker>
  </defs>

  <rect width="640" height="384" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：grid = [[0,0,0],[1,1,0],[1,1,0]]</text>
  <text x="320" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">格内的数字是 BFS 层号，也就是从 (0,0) 出发经过的格子数</text>

  <!-- 行列标号 -->
  <text x="88" y="80" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="156" y="80" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="224" y="80" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="42" y="124" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="42" y="192" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="42" y="260" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">2</text>

  <!-- (0,0) 第 1 层 -->
  <rect x="56" y="88" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="88" y="128" text-anchor="middle" font-size="20" fill="#2f5e22" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- (0,1) 第 2 层 -->
  <rect x="124" y="88" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="5" filter="url(#rough2)"/>
  <text x="156" y="128" text-anchor="middle" font-size="20" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>
  <!-- (0,2) 第 3 层 -->
  <rect x="192" y="88" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="224" y="128" text-anchor="middle" font-size="20" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- (1,0) 障碍 -->
  <rect x="56" y="156" width="64" height="64" fill="#e7e9ec" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="5 3" rx="5" filter="url(#rough2)"/>
  <text x="88" y="196" text-anchor="middle" font-size="16" fill="#9aa4b4" filter="url(#rough2)">1</text>
  <!-- (1,1) 障碍 -->
  <rect x="124" y="156" width="64" height="64" fill="#e7e9ec" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="5 3" rx="5" filter="url(#rough2)"/>
  <text x="156" y="196" text-anchor="middle" font-size="16" fill="#9aa4b4" filter="url(#rough2)">1</text>
  <!-- (1,2) 第 3 层 -->
  <rect x="192" y="156" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="224" y="196" text-anchor="middle" font-size="20" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- (2,0) 障碍 -->
  <rect x="56" y="224" width="64" height="64" fill="#e7e9ec" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="5 3" rx="5" filter="url(#rough2)"/>
  <text x="88" y="264" text-anchor="middle" font-size="16" fill="#9aa4b4" filter="url(#rough2)">1</text>
  <!-- (2,1) 障碍 -->
  <rect x="124" y="224" width="64" height="64" fill="#e7e9ec" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="5 3" rx="5" filter="url(#rough2)"/>
  <text x="156" y="264" text-anchor="middle" font-size="16" fill="#9aa4b4" filter="url(#rough2)">1</text>
  <!-- (2,2) 第 4 层 -->
  <rect x="192" y="224" width="64" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="224" y="264" text-anchor="middle" font-size="20" fill="#8a3b38" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 最短路箭头 -->
  <path d="M 104 120 L 138 120" stroke="#2f5e22" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 168 132 L 212 178" stroke="#2f5e22" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 206 L 224 240" stroke="#2f5e22" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧层表 -->
  <rect x="300" y="88" width="312" height="196" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="314" y="112" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">第 1 层：(0,0) — 起点</text>
  <text x="314" y="136" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">第 2 层：(0,1)（(1,0)、(1,1) 是 1，进不来）</text>
  <text x="314" y="160" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">第 3 层：(0,2)、(1,2)</text>
  <text x="314" y="184" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">第 4 层：(2,2) — 终点，返回 4</text>
  <text x="314" y="212" font-size="10.5" fill="#2f5e22" filter="url(#rough2)">关键一步：(0,1) 斜跨到 (1,2)，</text>
  <text x="314" y="230" font-size="10.5" fill="#2f5e22" filter="url(#rough2)">一步绕过被堵死的第 1 行</text>
  <text x="314" y="258" font-size="10" fill="#888" filter="url(#rough2)">若不允许斜走，答案会是 5，而不是 4</text>

  <!-- 图例 -->
  <rect x="56" y="298" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="74" y="308" font-size="9.5" fill="#555" filter="url(#rough2)">第 1 层</text>
  <rect x="146" y="298" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="164" y="308" font-size="9.5" fill="#555" filter="url(#rough2)">第 2 层</text>
  <rect x="236" y="298" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="254" y="308" font-size="9.5" fill="#555" filter="url(#rough2)">第 3 层</text>
  <rect x="326" y="298" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="344" y="308" font-size="9.5" fill="#555" filter="url(#rough2)">第 4 层</text>
  <rect x="416" y="298" width="12" height="12" fill="#e7e9ec" stroke="#8a94a6" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="434" y="308" font-size="9.5" fill="#555" filter="url(#rough2)">值为 1，不可走</text>

  <!-- 底部提示 -->
  <rect x="40" y="322" width="560" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="342" font-size="10" fill="#7a5c18" filter="url(#rough2)">注意 (0,2) 同样是第 3 层，但从它到终点还要 2 步；最短路末尾走的是 (1,2) → (2,2)。</text>
  <text x="54" y="360" font-size="10" fill="#7a5c18" filter="url(#rough2)">层号只说明「到该格最少几格」，是否通向终点要靠后续搜索——这正是 BFS 逐层铺开的意义。</text>
</svg>
