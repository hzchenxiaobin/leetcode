<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="330" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：arr = [0, 2, 1, 0]，两轮收缩即锁定峰顶</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">绿色格子是本轮二分读取的两个相邻元素；表格给出每轮结束后的状态</text>
  <rect x="24" y="88" width="54" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="51" y="108.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">轮次</text>
  <rect x="78" y="88" width="58" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="107" y="108.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">lo</text>
  <rect x="136" y="88" width="58" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="108.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">hi</text>
  <rect x="194" y="88" width="58" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="108.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">mid</text>
  <rect x="252" y="88" width="84" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="294" y="108.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">arr[mid]</text>
  <rect x="336" y="88" width="96" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="384" y="108.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">arr[mid+1]</text>
  <rect x="432" y="88" width="168" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="516" y="108.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">决策</text>
  <rect x="24" y="122" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="51" y="142.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">①</text>
  <rect x="78" y="122" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="107" y="142.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="136" y="122" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="142.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="194" y="122" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="142.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="252" y="122" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="294" y="142.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="336" y="122" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="384" y="142.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="432" y="122" width="168" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="516" y="142.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2 &gt; 1 → hi = mid = 1</text>
  <rect x="24" y="156" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="51" y="176.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">②</text>
  <rect x="78" y="156" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="107" y="176.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="136" y="156" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="176.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="194" y="156" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="176.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="252" y="156" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="294" y="176.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="336" y="156" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="384" y="176.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="432" y="156" width="168" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="516" y="176.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0 &lt; 2 → lo = mid + 1 = 1</text>
  <rect x="24" y="190" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="51" y="210.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">③</text>
  <rect x="78" y="190" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="107" y="210.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="136" y="190" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="210.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="194" y="190" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="210.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">—</text>
  <rect x="252" y="190" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="294" y="210.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">—</text>
  <rect x="336" y="190" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="384" y="210.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">—</text>
  <rect x="432" y="190" width="168" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="516" y="210.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">lo == hi → 返回 1</text>
  <rect x="24" y="238" width="570" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="256" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">第 ① 轮 mid = 1 处的 2 &gt; arr[2] = 1，说明已在下坡，峰顶不可能在 mid 右侧 → hi = 1；</text>
  <text x="34" y="270.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">第 ② 轮 mid = 0 处的 0 &lt; arr[1] = 2，仍在上坡 → lo = 1；此时 lo == hi，返回 1。</text>
</svg>
