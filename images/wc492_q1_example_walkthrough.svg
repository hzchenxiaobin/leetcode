<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：一趟扫描里 ans 的变化</text>

  <!-- ===== 表 A：示例 1 ===== -->
  <text x="320" y="56" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：capacity = [1,5,3,7]，itemSize = 3</text>

  <!-- 答案列底色 (i=2) -->
  <rect x="380" y="66" width="95" height="124" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- 标签列 -->
  <rect x="70" y="66" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="92" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="118" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="144" width="120" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i（下标）</text>
  <text x="130" y="109" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">capacity[i]</text>
  <text x="130" y="135" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">≥ itemSize ?</text>
  <text x="130" y="171" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans（当前最优）</text>

  <!-- 数据格 -->
  <rect x="190" y="66" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="285" y="66" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="66" width="95" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="475" y="66" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <text x="237" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="332" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="427" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="522" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <rect x="190" y="92" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="285" y="92" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="92" width="95" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="475" y="92" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <text x="237" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="332" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="427" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="522" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <rect x="190" y="118" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="285" y="118" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="118" width="95" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="475" y="118" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <text x="237" y="135" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="332" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="427" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="522" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="190" y="144" width="95" height="46" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="285" y="144" width="95" height="46" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="144" width="95" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="475" y="144" width="95" height="46" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <text x="237" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <text x="332" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="427" y="164" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="522" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="237" y="183" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">未达标</text>
  <text x="332" y="183" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">首个达标</text>
  <text x="427" y="183" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">3&lt;5，覆盖</text>
  <text x="522" y="183" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">7≮3，保持</text>

  <text x="320" y="210" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=2 时 3 &lt; 5 严格更小 → 覆盖成 ans=2；i=3 的 7 不够小 → 保持不变</text>

  <!-- ===== 表 B：示例 2 ===== -->
  <text x="320" y="246" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：capacity = [3,5,4,3]，itemSize = 2（并列取小下标）</text>

  <!-- 答案列底色 (i=0) -->
  <rect x="190" y="256" width="95" height="124" fill="#fff8e1" filter="url(#rough2)"/>

  <rect x="70" y="256" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="282" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="308" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="334" width="120" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="273" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i（下标）</text>
  <text x="130" y="299" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">capacity[i]</text>
  <text x="130" y="325" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">≥ itemSize ?</text>
  <text x="130" y="361" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans（当前最优）</text>

  <rect x="190" y="256" width="95" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="285" y="256" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="256" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="475" y="256" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <text x="237" y="273" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="332" y="273" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="427" y="273" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="522" y="273" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <rect x="190" y="282" width="95" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="285" y="282" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="282" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="475" y="282" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <text x="237" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="332" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="427" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="522" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <rect x="190" y="308" width="95" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="285" y="308" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="308" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="475" y="308" width="95" height="26" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <text x="237" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="332" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="427" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="522" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="190" y="334" width="95" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="285" y="334" width="95" height="46" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="334" width="95" height="46" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="475" y="334" width="95" height="46" fill="#fdfdfd" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <text x="237" y="354" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="332" y="354" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="427" y="354" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="522" y="354" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="237" y="373" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">首个达标</text>
  <text x="332" y="373" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5≮3</text>
  <text x="427" y="373" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4≮3</text>
  <text x="522" y="373" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3≮3（并列！）</text>

  <text x="320" y="400" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=3 时 3 ≮ 3：严格小于不成立 → 不覆盖，答案保住更小下标 0</text>

  <!-- ===== 示例 3 ===== -->
  <rect x="60" y="416" width="520" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="439" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3：capacity = [4]，itemSize = 5 → 无人达标，ans 保持 −1 直接返回</text>
</svg>
