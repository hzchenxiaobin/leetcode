<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：定长窗口「一出一进」，dup 计数器 O(1) 判重</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- window label -->
  <text x="166" y="52" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a">当前窗口（长度恒为 k=3）</text>

  <!-- array strip -->
  <g filter="url(#sk)">
    <rect x="90" y="58" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="144" y="58" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="198" y="58" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="252" y="58" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="306" y="58" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="360" y="58" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="414" y="58" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="112" y="80" fill="#333" filter="url(#sk)">1</text>
    <text x="166" y="80" fill="#333" filter="url(#sk)">5</text>
    <text x="220" y="80" fill="#333" filter="url(#sk)">4</text>
    <text x="274" y="80" fill="#8a5f14" filter="url(#sk)">2</text>
    <text x="328" y="80" fill="#888" filter="url(#sk)">9</text>
    <text x="382" y="80" fill="#888" filter="url(#sk)">9</text>
    <text x="436" y="80" fill="#888" filter="url(#sk)">9</text>
  </g>
  <text x="274" y="52" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5f14">进窗 v</text>
  <text x="112" y="104" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">出窗 u</text>

  <!-- arrows from cells to update boxes -->
  <path d="M 112 94 Q 96 124 140 146" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 274 94 Q 302 124 452 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- leave box -->
  <g filter="url(#sk)"><rect x="60" y="150" width="250" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="185" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">出窗 u = nums[i−k]</text>
  <text x="185" y="188" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">sum −= u；cnt[u] −−</text>
  <text x="185" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">计数 2→1 时 dup −−</text>

  <!-- enter box -->
  <g filter="url(#sk)"><rect x="380" y="150" width="250" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="505" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">进窗 v = nums[i]</text>
  <text x="505" y="188" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">sum += v；cnt[v] ++</text>
  <text x="505" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">计数 1→2 时 dup ++</text>

  <!-- O(1) badge -->
  <g filter="url(#sk)"><ellipse cx="345" cy="183" rx="32" ry="20" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="345" y="187" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b5a94">各 O(1)</text>

  <!-- dup definition box -->
  <g filter="url(#sk)"><rect x="60" y="238" width="560" height="64" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="76" y="258" font-size="11" font-weight="bold" fill="#8a5f14">dup = 窗口内计数 ≥ 2 的值个数</text>
  <text x="76" y="276" font-size="10" fill="#555">只在计数跨越 1↔2 界线时变化：本步 cnt[1] 由 1→0、cnt[2] 由 0→1，dup 保持 0</text>
  <text x="76" y="293" font-size="10" fill="#a5844a">（0→1、1→0、2→3、3→2 等其余翻转均不影响 dup）</text>

  <!-- criterion box -->
  <g filter="url(#sk)"><rect x="60" y="318" width="560" height="92" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="76" y="338" font-size="11" font-weight="bold" fill="#2b5a94">判据与门控</text>
  <text x="76" y="357" font-size="10.5" font-weight="bold" fill="#2e6e2e">dup == 0 ⟺ k 个元素互异 → ans = max(ans, sum) ✓</text>
  <text x="76" y="375" font-size="10.5" font-weight="bold" fill="#b85450">dup &gt; 0 → 无效窗口：sum 照常维护（左出减、右进加），但不更新 ans</text>
  <text x="76" y="393" font-size="9.5" fill="#555">值域 1 ≤ nums[i] ≤ 1e5 → cnt 可用长度 1e5+1 的数组，免去哈希常数</text>
</svg>
