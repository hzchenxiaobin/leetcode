<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="450" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：代价按「间隙」分解，方向决定单价（例：nums=[0,2,3,9]）</text>

  <!-- closest 箭头（每条代价 1） -->
  <text x="628" y="58" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">（每条 closest 箭头代价 1）</text>
  <path d="M110,120 L248,120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">closest(0)=1</text>
  <path d="M260,120 L398,120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">closest(1)=2</text>
  <path d="M410,90 L272,90" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="82" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">closest(2)=1</text>
  <path d="M560,120 L422,120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">closest(3)=2</text>

  <!-- 下标节点 -->
  <rect x="82" y="143" width="56" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="232" y="143" width="56" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="382" y="143" width="56" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="532" y="143" width="56" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <text x="260" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="410" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="560" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">9</text>
  <text x="110" y="197" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="260" y="197" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="410" y="197" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="560" y="197" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=3</text>

  <!-- 间隙（差值） -->
  <text x="185" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d0=2</text>
  <text x="335" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d1=1</text>
  <text x="485" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d2=6</text>

  <!-- 每个间隙的双向单价 -->
  <rect x="133" y="228" width="104" height="84" rx="8" fill="#f5f0e6" stroke="#b8a878" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="246" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">间隙 0</text>
  <rect x="141" y="252" width="88" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 花费 1</text>
  <rect x="141" y="280" width="88" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="296" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">← 花费 2</text>

  <rect x="283" y="228" width="104" height="84" rx="8" fill="#f5f0e6" stroke="#b8a878" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="246" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">间隙 1</text>
  <rect x="291" y="252" width="88" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 花费 1</text>
  <rect x="291" y="280" width="88" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">← 花费 1</text>

  <rect x="433" y="228" width="104" height="84" rx="8" fill="#f5f0e6" stroke="#b8a878" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="246" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">间隙 2</text>
  <rect x="441" y="252" width="88" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="268" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">→ 花费 6</text>
  <rect x="441" y="280" width="88" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">← 花费 1</text>

  <!-- 公式说明 -->
  <text x="330" y="344" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">向右单价 R[i] = 1（若 closest(i)=i+1，可从 i 贴身右跳）；否则 d[i]</text>
  <text x="330" y="366" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">向左单价 L[i] = 1（若 closest(i+1)=i，可从 i+1 贴身左跳）；否则 d[i]</text>
  <text x="330" y="388" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">d[i] ≥ 1（严格递增整数），所以「能用贴身跳」时单价恰为 1</text>
  <rect x="80" y="402" width="500" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="423" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans(l,r) = Σ R[i]（l&lt;r）或 Σ L[i]（l&gt;r）—— 两个前缀和 O(1) 回答</text>
</svg>
