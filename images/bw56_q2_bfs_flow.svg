<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">BFS 流程：入口先标记入队 → 逐层扩展 → 首触边界即返回</text>

  <!-- 左：流程 -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="165" y="83" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">dist[入口] = 0，标记已访问并入队</text>
  <path d="M 165 98 L 165 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="165,118 245,148 165,178 85,148" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="165" y="152" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">队列非空？</text>
  <text x="100" y="116" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">空 → 返回 −1</text>

  <g filter="url(#rough2)">
    <rect x="65" y="192" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="165" y="215" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">(x,y) 出队；考察四邻格</text>
  <path d="M 165 180 L 165 188" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="50" y="240" width="230" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8"/>
  </g>
  <text x="165" y="260" text-anchor="middle" font-size="11.5" fill="#a0392f" filter="url(#rough2)">越界 / 墙 '+' / 已访问 → 跳过</text>
  <text x="165" y="278" text-anchor="middle" font-size="10.5" fill="#a0392f" filter="url(#rough2)">（入口已标记，绝不会被再次触达）</text>
  <path d="M 165 228 L 165 236" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="165,296 250,326 165,356 80,326" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="165" y="323" text-anchor="middle" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">邻格在边界？</text>
  <text x="165" y="340" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">（首触即最短）</text>
  <path d="M 165 286 L 165 292" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="52" y="360" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="107" y="381" text-anchor="middle" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">返回 dist+1</text>
  <path d="M 90 354 L 100 358" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="180" y="360" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="235" y="381" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">标记并入队</text>
  <path d="M 228 354 L 238 358" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右：层扩散示意 -->
  <text x="425" y="66" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">按距离一圈圈向外扩散</text>
  <g filter="url(#rough2)">
    <ellipse cx="425" cy="200" rx="118" ry="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="7 5"/>
    <ellipse cx="425" cy="200" rx="78" ry="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5"/>
    <ellipse cx="425" cy="200" rx="40" ry="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="425" y="196" text-anchor="middle" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">入口</text>
  <text x="425" y="210" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">dist=0</text>
  <text x="425" y="152" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">dist=1</text>
  <text x="425" y="122" text-anchor="middle" font-size="10.5" fill="#8a6a1a" filter="url(#rough2)">dist=2</text>
  <text x="425" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">先出队的距离 ≤ 后出队</text>
  <text x="425" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 首次触达的出口必最近</text>

  <g filter="url(#rough2)">
    <rect x="330" y="336" width="190" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
  </g>
  <text x="425" y="356" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">每格只入队一次：O(mn)</text>
  <text x="425" y="374" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">标记必须在「入队时」而非「出队时」</text>
</svg>
