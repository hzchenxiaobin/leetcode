<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">两遍扫描：先收集出发站，再检查到达站</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">时间复杂度 O(n)，空间 O(n)，n = paths.length</text>

  <rect x="80" y="66" width="460" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="86" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 第一遍：把所有 cityAi 插入集合 D</text>
  <text x="96" y="104" font-size="10" fill="#555" filter="url(#rough2)">D 表示「至少有一条出边」的城市，O(n) 次哈希插入</text>

  <path d="M 310 112 L 310 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="140" width="460" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="160" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">② 第二遍：按输入顺序取每条边的 cityBi</text>
  <text x="96" y="178" font-size="10" fill="#555" filter="url(#rough2)">只需判断它是否在 D 中，不需要排序，也不需要重建图</text>

  <path d="M 310 186 L 310 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="216" width="260" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="310" y="247" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">cityBi 是否在 D 中？</text>

  <path d="M 180 241 L 150 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 241 L 470 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="272" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="462" y="272" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="40" y="292" width="240" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="314" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">它有出边，不是终点站</text>
  <text x="56" y="334" font-size="10" fill="#555" filter="url(#rough2)">跳过这条边，继续看下一条</text>

  <rect x="340" y="292" width="240" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="356" y="314" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">它没有任何出边</text>
  <text x="356" y="334" font-size="10" fill="#555" filter="url(#rough2)">它就是终点站，立即返回</text>

  <rect x="80" y="366" width="460" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="96" y="386" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">时间 / 空间</text>
  <text x="96" y="404" font-size="10" fill="#555" filter="url(#rough2)">两遍线性扫描 O(n)；集合最多存 n 个城市名，O(n) 空间</text>

  <text x="310" y="430" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">终点站在 E 中、不在 D 中，所以第二遍一定能命中且只命中一个</text>
</svg>
