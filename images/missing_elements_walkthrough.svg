<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [5, 1]</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="175" y="54" width="290" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="75" text-anchor="middle" font-size="13" fill="#2b4a6e">S = {1, 5}，min = 1，max = 5</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="150" y="100" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="210" y="100" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="300" y="100" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="410" y="100" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="12.5" fill="#2b4a6e" text-anchor="middle" font-weight="bold">
    <text x="180" y="119">x</text>
    <text x="255" y="119">x ∈ S ?</text>
    <text x="355" y="119">动作</text>
    <text x="495" y="119">ans 状态</text>
  </g>

  <!-- rows -->
  <g filter="url(#sk)">
    <rect x="150" y="130" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="210" y="130" width="90" height="34" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/>
    <rect x="300" y="130" width="110" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="410" y="130" width="170" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="180" y="151" fill="#333">1</text>
    <text x="255" y="151" fill="#2e5e22" font-weight="bold">✓</text>
    <text x="355" y="151" fill="#666">跳过</text>
    <text x="495" y="151" fill="#333" font-family="monospace">[]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="150" y="164" width="60" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="210" y="164" width="90" height="34" fill="#fce4ec" stroke="#bbb" stroke-width="1"/>
    <rect x="300" y="164" width="110" height="34" fill="#fce4ec" stroke="#bbb" stroke-width="1"/>
    <rect x="410" y="164" width="170" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="180" y="185" fill="#333">2</text>
    <text x="255" y="185" fill="#b85450" font-weight="bold">✗</text>
    <text x="355" y="185" fill="#b85450" font-weight="bold">收集</text>
    <text x="495" y="185" fill="#333" font-family="monospace">[2]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="150" y="198" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="210" y="198" width="90" height="34" fill="#fce4ec" stroke="#bbb" stroke-width="1"/>
    <rect x="300" y="198" width="110" height="34" fill="#fce4ec" stroke="#bbb" stroke-width="1"/>
    <rect x="410" y="198" width="170" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="180" y="219" fill="#333">3</text>
    <text x="255" y="219" fill="#b85450" font-weight="bold">✗</text>
    <text x="355" y="219" fill="#b85450" font-weight="bold">收集</text>
    <text x="495" y="219" fill="#333" font-family="monospace">[2, 3]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="150" y="232" width="60" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="210" y="232" width="90" height="34" fill="#fce4ec" stroke="#bbb" stroke-width="1"/>
    <rect x="300" y="232" width="110" height="34" fill="#fce4ec" stroke="#bbb" stroke-width="1"/>
    <rect x="410" y="232" width="170" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="180" y="253" fill="#333">4</text>
    <text x="255" y="253" fill="#b85450" font-weight="bold">✗</text>
    <text x="355" y="253" fill="#b85450" font-weight="bold">收集</text>
    <text x="495" y="253" fill="#333" font-family="monospace">[2, 3, 4]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="150" y="266" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="210" y="266" width="90" height="34" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/>
    <rect x="300" y="266" width="110" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="410" y="266" width="170" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="180" y="287" fill="#333">5</text>
    <text x="255" y="287" fill="#2e5e22" font-weight="bold">✓</text>
    <text x="355" y="287" fill="#666">跳过</text>
    <text x="495" y="287" fill="#333" font-family="monospace">[2, 3, 4]</text>
  </g>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="210" y="318" width="220" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="346" text-anchor="middle" font-size="16" fill="#7a5415" font-weight="bold">ans = [2, 3, 4] ✓</text>

  <text x="320" y="384" text-anchor="middle" font-size="11" fill="#888">升序枚举 ⇒ ans 天然有序；n = 2 时缺失数可以最多</text>
</svg>
