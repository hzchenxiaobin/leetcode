<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算：nums = [1,4,6,8,10]，n=5，总和 29</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="50" y="48" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="140" y="48" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="210" y="48" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="48" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="390" y="48" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="95" y="69">i / nums[i]</text>
    <text x="175" y="69">left</text>
    <text x="245" y="69">right</text>
    <text x="335" y="69">nums[i]·i−left</text>
    <text x="450" y="69">right−nums[i]·(4−i)</text>
  </g>

  <!-- 行 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="95" y="104">0 / 1</text><text x="175" y="104">0</text><text x="245" y="104">28</text>
    <text x="335" y="104">0</text><text x="450" y="104">24</text>
    <text x="95" y="134">1 / 4</text><text x="175" y="134">1</text><text x="245" y="134">24</text>
    <text x="335" y="134">3</text><text x="450" y="134">12</text>
    <text x="95" y="164">2 / 6</text><text x="175" y="164">5</text><text x="245" y="164">18</text>
    <text x="335" y="164">7</text><text x="450" y="164">6</text>
    <text x="95" y="194">3 / 8</text><text x="175" y="194">11</text><text x="245" y="194">10</text>
    <text x="335" y="194">13</text><text x="450" y="194">6</text>
    <text x="95" y="224">4 / 10</text><text x="175" y="224">19</text><text x="245" y="224">0</text>
    <text x="335" y="224">21</text><text x="450" y="224">0</text>
  </g>

  <!-- 行分隔 -->
  <g filter="url(#rough2)">
    <path d="M 50 112 L 510 112" stroke="#ddd" stroke-width="1" fill="none"/>
    <path d="M 50 142 L 510 142" stroke="#ddd" stroke-width="1" fill="none"/>
    <path d="M 50 172 L 510 172" stroke="#ddd" stroke-width="1" fill="none"/>
    <path d="M 50 202 L 510 202" stroke="#ddd" stroke-width="1" fill="none"/>
  </g>

  <!-- result 高亮行 -->
  <g filter="url(#rough2)">
    <rect x="50" y="240" width="460" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#2d5a22" text-anchor="middle" font-weight="bold">
    <text x="280" y="266">result = [24, 15, 13, 15, 21]（左右两列逐行相加）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="292" width="420" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="312" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">结果左右对称——|x−y| 的对称性使然</text>
</svg>
