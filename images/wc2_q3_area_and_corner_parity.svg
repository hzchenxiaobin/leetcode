<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两个判据：面积守恒 + 角点奇偶异或</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">面积负责排除「漏」，角点负责排除「重」，两条同时成立才是精确覆盖</text>

  <g filter="url(#rough2)">
    <rect x="60" y="110" width="120" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="180" y="110" width="120" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="60" y="200" width="120" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="180" y="200" width="120" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="60" y="110" width="240" height="180" fill="none" stroke="#446688" stroke-width="2.2"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="60" cy="110" r="5" fill="#b85450"/>
    <circle cx="300" cy="110" r="5" fill="#b85450"/>
    <circle cx="60" cy="290" r="5" fill="#b85450"/>
    <circle cx="300" cy="290" r="5" fill="#b85450"/>
    <circle cx="180" cy="110" r="4.5" fill="#446688"/>
    <circle cx="180" cy="290" r="4.5" fill="#446688"/>
    <circle cx="60" cy="200" r="4.5" fill="#446688"/>
    <circle cx="300" cy="200" r="4.5" fill="#446688"/>
    <circle cx="180" cy="200" r="5" fill="#d6a040"/>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#8a3a36">
    <text x="72" y="128">1</text>
    <text x="288" y="128">1</text>
    <text x="72" y="282">1</text>
    <text x="288" y="282">1</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#3a4a66">
    <text x="180" y="104">2</text>
    <text x="180" y="306">2</text>
    <text x="50" y="204" text-anchor="end">2</text>
    <text x="310" y="204" text-anchor="start">2</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#8a6a20">
    <text x="192" y="224">4</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#666">
    <text x="60" y="330">数字 = 该点作为角点出现的次数：内部点必为偶数（相互抵消），只剩外接四角</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="330" y="100" width="264" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="342" y="120" font-size="11" fill="#8a6a20" font-weight="bold">判据 1 · 面积守恒</text>
    <text x="342" y="142" font-size="10" fill="#555">Σ (aᵢ − xᵢ)(bᵢ − yᵢ) = (X − x)(Y − y)</text>
    <text x="342" y="162" font-size="10" fill="#555">所有小矩形面积之和 = 外接矩形面积</text>
    <text x="342" y="184" font-size="9.5" fill="#8a6a20">示例 1：4+1+2+1+1 = 9 = 3×3 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="330" y="208" width="264" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="342" y="228" font-size="11" fill="#3a5a30" font-weight="bold">判据 2 · 角点奇偶异或</text>
    <text x="342" y="250" font-size="10" fill="#555">每个矩形贡献 4 个角，出现偶数次即抵消</text>
    <text x="342" y="268" font-size="10" fill="#555">剩下的点必须恰为外接矩形的 4 个角</text>
    <text x="342" y="290" font-size="9.5" fill="#3a5a30">示例 1：11 个候选点 → 只剩 4 个角 ✓</text>
    <text x="342" y="308" font-size="9.5" fill="#888">（共享边、共享点都不算重叠）</text>
  </g>

  <path d="M 312 300 L 326 300" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="340" width="534" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10"/>
    <text x="74" y="360" font-size="10.5" fill="#8a3a36" font-weight="bold">缺一不可：两条判据各挡一类错误</text>
    <text x="74" y="378" font-size="9.5" fill="#8a3a36">只查面积：[[0,0,2,2],[1,0,3,1]] 重叠 1 = 空洞 1，面积 6 = 6 却并不精确；</text>
    <text x="74" y="394" font-size="9.5" fill="#8a3a36">只查角点：3 个相同矩形叠加，角点异或恰好剩 4 个角，但面积 3 ≠ 1。</text>
  </g>
</svg>
