<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    演算：三角形 → 排序 → 区间取和
  </text>

  <!-- 第一阶段：生成 -->
  <text x="120" y="70" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">① 滚动累加生成 10 个和</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="40" y="84" width="180" height="120" fill="#f7f7f7" stroke="#bbb" stroke-width="1.3" rx="8"/>
    <text x="56" y="106" fill="#446688">i=0: 1 3 6 10</text>
    <text x="56" y="126" fill="#2f5a24">i=1: 2 5 9</text>
    <text x="56" y="146" fill="#8a6a1a">i=2: 3 7</text>
    <text x="56" y="166" fill="#b85450">i=3: 4</text>
    <text x="56" y="192" fill="#666">共 10 = 4×5/2 个</text>
  </g>

  <!-- 第二阶段：排序 -->
  <text x="330" y="70" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">② 升序排序</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="240" y="84" width="180" height="120" fill="#f7f7f7" stroke="#bbb" stroke-width="1.3" rx="8"/>
    <text x="256" y="106" fill="#2f5a24">[1, 2, 3, 3, 4,</text>
    <text x="256" y="126" fill="#2f5a24"> 5, 6, 7, 9, 10]</text>
    <text x="256" y="156" fill="#666">O(N log N)</text>
    <text x="256" y="176" fill="#666">N = n(n+1)/2</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 222 144 L 236 144" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- 第三阶段：取区间 -->
  <text x="150" y="240" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">③ 下标 left..right 求和（1 起算）</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="40" y="254" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="84" y="254" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="128" y="254" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="172" y="254" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="216" y="254" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="260" y="254" width="44" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <rect x="304" y="254" width="44" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <rect x="348" y="254" width="44" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <rect x="392" y="254" width="44" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <rect x="436" y="254" width="44" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="62" y="275" text-anchor="middle" fill="#b85450">1</text>
    <text x="106" y="275" text-anchor="middle" fill="#b85450">2</text>
    <text x="150" y="275" text-anchor="middle" fill="#b85450">3</text>
    <text x="194" y="275" text-anchor="middle" fill="#b85450">3</text>
    <text x="238" y="275" text-anchor="middle" fill="#b85450">4</text>
    <text x="282" y="275" text-anchor="middle" fill="#666">5</text>
    <text x="326" y="275" text-anchor="middle" fill="#666">6</text>
    <text x="370" y="275" text-anchor="middle" fill="#666">7</text>
    <text x="414" y="275" text-anchor="middle" fill="#666">9</text>
    <text x="458" y="275" text-anchor="middle" fill="#666">10</text>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="106" y="300" text-anchor="middle" fill="#b85450">↑ left=1</text>
    <text x="238" y="300" text-anchor="middle" fill="#b85450">↑ right=5</text>
  </g>

  <!-- 结果 -->
  <rect x="130" y="312" width="260" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="15" fill="#8a6a1a" filter="url(#rough2)">1+2+3+3+4 = 13（最后才取模）</text>
</svg>
