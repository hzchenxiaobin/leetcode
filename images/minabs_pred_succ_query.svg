<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">数轴视角：与 v 最近的集合元素只能是前驱或后继</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="76" text-anchor="middle" font-size="12" fill="#555">设当前查询值 v = 6，有序集合 S = { 2, 3, 5, 8 }（已在数轴上排好）</text>

  <!-- number line -->
  <path d="M 70 200 L 570 200" stroke="#3a3a3a" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- tick marks: 2,3,5,6,8 on a scale: value v maps to x = 70 + (v-1)*80 -->
  <!-- 2 -> 150, 3 -> 230, 5 -> 390, 6 -> 470, 8 -> 550 too close to edge; use scale 70: 2->140,3->210,5->350,6->420,8->560 -->

  <!-- far elements (dim) -->
  <circle cx="140" cy="200" r="9" fill="#e6f4ea" stroke="#7aa87a" stroke-width="1.6" filter="url(#sk)"/>
  <circle cx="210" cy="200" r="9" fill="#e6f4ea" stroke="#7aa87a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="140" y="238" text-anchor="middle" font-size="13" fill="#666">2</text>
  <text x="210" y="238" text-anchor="middle" font-size="13" fill="#666">3</text>
  <text x="175" y="262" text-anchor="middle" font-size="10.5" fill="#888">离 6 更远，</text>
  <text x="175" y="277" text-anchor="middle" font-size="10.5" fill="#888">不可能更优 ✗</text>

  <!-- predecessor 5 -->
  <circle cx="350" cy="200" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="2.6" filter="url(#sk)"/>
  <text x="350" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">5</text>
  <text x="350" y="238" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">前驱 5</text>
  <text x="350" y="257" text-anchor="middle" font-size="10.5" fill="#446688">「≤ v 的最大」</text>
  <path d="M 350 186 L 350 158 L 418 158" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="350" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">候选 ①：|6 − 5| = 1</text>

  <!-- successor 8 -->
  <circle cx="540" cy="200" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#sk)"/>
  <text x="540" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">8</text>
  <text x="540" y="238" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold">后继 8</text>
  <text x="540" y="257" text-anchor="middle" font-size="10.5" fill="#b07818">「≥ v 的最小」</text>
  <path d="M 540 186 L 540 158 L 472 158" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="540" y="148" text-anchor="middle" font-size="11" fill="#b07818" font-weight="bold">候选 ②：|8 − 6| = 2</text>

  <!-- query value v = 6 -->
  <path d="M 420 170 L 420 226" stroke="#b85450" stroke-width="2.6" stroke-dasharray="6 4" filter="url(#sk)"/>
  <circle cx="420" cy="200" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="420" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">v = 6</text>
  <text x="420" y="252" text-anchor="middle" font-size="11.5" fill="#b85450">nums[j] 落在</text>
  <text x="420" y="268" text-anchor="middle" font-size="11.5" fill="#b85450">前驱与后继之间</text>

  <!-- gap annotations -->
  <path d="M 361 172 L 409 172" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#sk)" marker-start="url(#arB)" marker-end="url(#arB)"/>
  <text x="385" y="128" text-anchor="middle" font-size="10.5" fill="#446688">更小间隙</text>
  <path d="M 431 172 L 529 172" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#sk)" marker-start="url(#arO)" marker-end="url(#arO)"/>
  <text x="480" y="128" text-anchor="middle" font-size="10.5" fill="#b07818">另一侧间隙</text>

  <!-- takeaway -->
  <g filter="url(#sk)">
    <rect x="40" y="296" width="560" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="316" text-anchor="middle" font-size="11.5" fill="#7a5415">任何更远的元素 s &lt; 前驱 时 |s − v| 更大；s &gt; 后继 时同理 ——</text>
  <text x="320" y="334" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">所以每轮只需查 lower_bound 的 it 与 prev(it) 两个候选，即可覆盖 S 中全部元素</text>
</svg>
