<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：chalk = [3,4,1,2]，k = 25</text>

  <!-- 上：一轮消耗条 -->
  <text x="196" y="62" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">一轮消耗条（total = 10）</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="56" y="78" width="90" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="101" y="97">学生 0</text><text x="101" y="113">3 支</text>
    <rect x="146" y="78" width="90" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/><text x="191" y="97">学生 1</text><text x="191" y="113">4 支</text>
    <rect x="236" y="78" width="90" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="281" y="97">学生 2</text><text x="281" y="113">1 支</text>
    <rect x="326" y="78" width="90" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/><text x="371" y="97">学生 3</text><text x="371" y="113">2 支</text>
  </g>
  <text x="236" y="146" font-size="13" fill="#666" text-anchor="middle" filter="url(#rough2)">k = 25 = 2 × 10 + 5 → 取模后 k = 5</text>

  <!-- 中：余数 5 的行进 -->
  <text x="196" y="182" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">剩 5 支，从学生 0 重新走</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="56" y="198" width="90" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="101" y="217">学生 0</text><text x="101" y="233">用 3 → 剩 2</text>
    <rect x="146" y="198" width="90" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="191" y="217" fill="#8a3a36" font-weight="bold">学生 1</text><text x="191" y="233" fill="#8a3a36" font-weight="bold">2 &lt; 4 ✗</text>
    <rect x="236" y="198" width="90" height="42" fill="#fafafa" stroke="#ddd" rx="4"/><text x="281" y="217">学生 2</text><text x="281" y="233">未到达</text>
    <rect x="326" y="198" width="90" height="42" fill="#fafafa" stroke="#ddd" rx="4"/><text x="371" y="217">学生 3</text><text x="371" y="233">未到达</text>
  </g>

  <!-- 公式 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="70" y="266" width="420" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="280" y="286" text-anchor="middle">首个满足 k mod total &lt; chalk[i] 的下标 i 即答案</text>
    <text x="280" y="306" text-anchor="middle" fill="#666" font-size="12">（等价于：前缀和数组上二分首个 prefix(i+1) &gt; k mod total 的位置）</text>
  </g>
  <rect x="70" y="330" width="420" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="353" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">本例：学生 0 用后剩 2，2 &lt; 4 → 答案 1 ✓</text>
</svg>
