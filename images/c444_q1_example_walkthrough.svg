<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="440" fill="#fdfcf7"/>
  <text x="330" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：两轮合并收工 + 负数的代数和</text>
  <path d="M 150 33 Q 330 40 510 33" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 官方示例 -->
  <text x="30" y="60" font-size="13" font-weight="bold" fill="#2b2b2b">官方示例：nums = [5,2,3,1]</text>

  <!-- 轮 1 -->
  <text x="30" y="100" font-size="11" font-weight="bold" fill="#888">轮 1</text>
  <g filter="url(#sk)">
    <rect x="80" y="76" width="48" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="104" y="99" text-anchor="middle" font-size="13.5" fill="#2b2b2b">5</text>
  <g filter="url(#sk)">
    <rect x="134" y="76" width="48" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="158" y="99" text-anchor="middle" font-size="13.5" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="188" y="76" width="48" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="212" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">3</text>
  <g filter="url(#sk)">
    <rect x="242" y="76" width="48" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="266" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">1</text>

  <path d="M 104 116 Q 131 134 158 116" stroke="#999" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="131" y="150" text-anchor="middle" font-size="11" fill="#666">7</text>
  <path d="M 158 116 Q 185 134 212 116" stroke="#999" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="185" y="150" text-anchor="middle" font-size="11" fill="#666">5</text>
  <path d="M 212 116 Q 239 134 266 116" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="239" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">4</text>

  <path d="M 298 94 L 326 94" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="82" text-anchor="middle" font-size="10.5" fill="#666">合并 (3,1)</text>

  <g filter="url(#sk)">
    <rect x="332" y="76" width="48" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="356" y="99" text-anchor="middle" font-size="13.5" fill="#2b2b2b">5</text>
  <g filter="url(#sk)">
    <rect x="386" y="76" width="48" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="410" y="99" text-anchor="middle" font-size="13.5" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="440" y="76" width="48" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="464" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="332" y="150" font-size="11" font-weight="bold" fill="#b85450">5 &gt; 2 仍无序</text>

  <!-- 轮 2 -->
  <text x="30" y="194" font-size="11" font-weight="bold" fill="#888">轮 2</text>
  <g filter="url(#sk)">
    <rect x="80" y="170" width="48" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="104" y="193" text-anchor="middle" font-size="13.5" fill="#2b2b2b">5</text>
  <g filter="url(#sk)">
    <rect x="134" y="170" width="48" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="158" y="193" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">2</text>
  <g filter="url(#sk)">
    <rect x="188" y="170" width="48" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="212" y="193" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">4</text>

  <path d="M 104 210 Q 131 228 158 210" stroke="#999" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="131" y="244" text-anchor="middle" font-size="11" fill="#666">7</text>
  <path d="M 158 210 Q 185 228 212 210" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="185" y="244" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">6</text>

  <path d="M 244 188 L 272 188" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="258" y="176" text-anchor="middle" font-size="10.5" fill="#666">合并 (2,4)</text>

  <g filter="url(#sk)">
    <rect x="278" y="170" width="48" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="302" y="193" text-anchor="middle" font-size="13.5" fill="#2b2b2b">5</text>
  <g filter="url(#sk)">
    <rect x="332" y="170" width="48" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="356" y="193" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">6</text>
  <text x="278" y="244" font-size="12" font-weight="bold" fill="#2e6e2e">5 ≤ 6 非递减 ✓ 答案 2</text>

  <path d="M 30 268 L 630 268" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="5 5" fill="none" filter="url(#sk)"/>

  <!-- 负数例子 -->
  <text x="30" y="298" font-size="13" font-weight="bold" fill="#2b2b2b">负数按代数和参与比较：nums = [2,2,−1]</text>

  <g filter="url(#sk)">
    <rect x="80" y="310" width="48" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="104" y="333" text-anchor="middle" font-size="13.5" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="134" y="310" width="48" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="158" y="333" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">2</text>
  <g filter="url(#sk)">
    <rect x="188" y="310" width="48" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="212" y="333" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">−1</text>

  <path d="M 104 350 Q 131 368 158 350" stroke="#999" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="131" y="384" text-anchor="middle" font-size="11" fill="#666">4</text>
  <path d="M 158 350 Q 185 368 212 350" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="185" y="384" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">1</text>

  <path d="M 240 328 L 272 328" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="256" y="316" text-anchor="middle" font-size="10.5" fill="#666">和 1 最小</text>

  <g filter="url(#sk)">
    <rect x="278" y="310" width="48" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="302" y="333" text-anchor="middle" font-size="13.5" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="332" y="310" width="48" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="356" y="333" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6a1a">1</text>
  <text x="278" y="384" font-size="11" font-weight="bold" fill="#b85450">2 &gt; 1 仍无序</text>

  <path d="M 388 328 L 416 328" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="402" y="316" text-anchor="middle" font-size="10.5" fill="#666">再合并</text>

  <g filter="url(#sk)">
    <rect x="422" y="310" width="48" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="446" y="333" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="422" y="384" font-size="11" font-weight="bold" fill="#2e6e2e">必有序 ✓ 答案 2</text>

  <!-- 底部注记 -->
  <g filter="url(#sk)">
    <rect x="30" y="398" width="600" height="34" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="330" y="420" text-anchor="middle" font-size="12" fill="#7a5415">「和最小」比的是代数和（不是绝对值、不是最小元素）；判定非递减时 a = b 合法，只有 a &gt; b 才算逆序</text>
</svg>
