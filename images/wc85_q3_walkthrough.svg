<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">演算：n=21, k=17, maxPts=10</text>

  <g filter="url(#rough2)">
    <text x="60" y="56" font-size="11" fill="#666">i</text>
    <text x="140" y="56" font-size="11" fill="#666">窗口 W</text>
    <text x="260" y="56" font-size="11" fill="#666">dp[i] = W/10</text>
    <text x="400" y="56" font-size="11" fill="#666">说明</text>

    <rect x="50" y="64" width="440" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="60" y="82" font-size="11" fill="#2f4a66">1</text><text x="140" y="82" font-size="11" fill="#2f4a66">1.0</text>
    <text x="260" y="82" font-size="11" fill="#2f4a66">0.1</text><text x="400" y="82" font-size="11" fill="#2f4a66">i ≤ 10 窗口还没满</text>

    <rect x="50" y="94" width="440" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="60" y="112" font-size="11" fill="#2f4a66">2</text><text x="140" y="112" font-size="11" fill="#2f4a66">1.1</text>
    <text x="260" y="112" font-size="11" fill="#2f4a66">0.11</text><text x="400" y="112" font-size="11" fill="#2f4a66">dp[i] = 0.1·1.1^(i-1)</text>

    <rect x="50" y="124" width="440" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="60" y="142" font-size="11" fill="#2f4a66">3</text><text x="140" y="142" font-size="11" fill="#2f4a66">1.21</text>
    <text x="260" y="142" font-size="11" fill="#2f4a66">0.121</text><text x="400" y="142" font-size="11" fill="#2f4a66">…</text>

    <rect x="50" y="154" width="440" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="60" y="172" font-size="11" fill="#2f4a66">10</text><text x="140" y="172" font-size="11" fill="#2f4a66">2.35795</text>
    <text x="260" y="172" font-size="11" fill="#2f4a66">0.23579</text><text x="400" y="172" font-size="11" fill="#2f4a66">窗口达到 10 项</text>

    <rect x="50" y="184" width="440" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="60" y="202" font-size="11" fill="#8a3020">11</text><text x="140" y="202" font-size="11" fill="#8a3020">1.59374</text>
    <text x="260" y="202" font-size="11" fill="#8a3020">0.15937</text><text x="400" y="202" font-size="11" fill="#8a3020">移出 dp[0] = 1</text>

    <rect x="50" y="214" width="440" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="60" y="232" font-size="11" fill="#2f5527">17</text><text x="140" y="232" font-size="11" fill="#2f5527">1.85711</text>
    <text x="260" y="232" font-size="11" fill="#2f5527">0.18571</text><text x="400" y="232" font-size="11" fill="#2f5527">进入成功区，开始累加</text>

    <rect x="50" y="244" width="440" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="60" y="262" font-size="11" fill="#2f5527">18~21</text><text x="140" y="262" font-size="11" fill="#2f5527">…</text>
    <text x="260" y="262" font-size="11" fill="#2f5527">0.54731</text><text x="400" y="262" font-size="11" fill="#2f5527">四项之和</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="290" width="380" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="260" y="314" text-anchor="middle" font-size="12" fill="#7a5a10">答案 = dp[17]+dp[18]+dp[19]+dp[20]+dp[21]</text>
    <text x="260" y="336" text-anchor="middle" font-size="12" fill="#7a5a10">= 0.18571+0.16799+0.14851+0.12707+0.10349</text>
    <text x="260" y="356" text-anchor="middle" font-size="13" fill="#4a7a3a">= 0.73278 ✓ 与示例一致</text>
  </g>
</svg>
