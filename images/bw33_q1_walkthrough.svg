<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    示例演算：n = 123456789（d = 9）
  </text>

  <!-- 行 1：初始串 + 下标标尺 -->
  <rect x="40" y="66" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="88" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">初始 s</text>
  <text x="210" y="89" font-size="17" fill="#333" filter="url(#rough2)">123456789</text>
  <text x="210" y="110" font-size="10" fill="#999" filter="url(#rough2)">0 1 2 3 4 5 6 7 8   （下标）</text>

  <!-- 行 2 -->
  <rect x="40" y="140" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="162" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">i = 6 插点</text>
  <text x="210" y="163" font-size="17" fill="#333" filter="url(#rough2)">123456<tspan fill="#b85450" font-weight="bold">.</tspan>789</text>

  <!-- 行 3 -->
  <rect x="40" y="214" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="236" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">i = 3 插点</text>
  <text x="210" y="237" font-size="17" fill="#333" filter="url(#rough2)">123<tspan fill="#b85450" font-weight="bold">.</tspan>456<tspan fill="#b85450" font-weight="bold">.</tspan>789</text>

  <!-- 行 4 -->
  <rect x="40" y="288" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="310" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">i = 0 停止</text>
  <text x="210" y="311" font-size="17" fill="#333" filter="url(#rough2)">返回 <tspan fill="#b85450" font-weight="bold">"123.456.789"</tspan></text>

  <!-- 左侧串联箭头 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <path d="M 32 84 C 20 100, 20 120, 32 136"/>
    <path d="M 32 158 C 20 174, 20 194, 32 210"/>
    <path d="M 32 232 C 20 248, 20 268, 32 284"/>
  </g>

  <text x="400" y="140" font-size="12" fill="#666" filter="url(#rough2)">i = d−3, d−6, …</text>
  <text x="400" y="160" font-size="12" fill="#666" filter="url(#rough2)">循环条件 i 大于 0：</text>
  <text x="400" y="180" font-size="12" fill="#666" filter="url(#rough2)">保证最左一组不带点</text>
</svg>
