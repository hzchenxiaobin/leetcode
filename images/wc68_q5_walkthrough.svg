<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="27" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">演算：( e + 8 ) * ( e - 8 )</text>
  <text x="310" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">左到右扫描 token，括号交给递归，乘法把两个 Poly 的键两两归并</text>

  <!-- 表头 -->
  <rect x="30" y="58" width="560" height="26" fill="#e0e0e0" stroke="#888" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="50" y="76" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">步骤</text>
  <text x="112" y="76" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">读入</text>
  <text x="160" y="76" text-anchor="start" font-size="10" fill="#444" filter="url(#rough2)">动作 / 该子表达式返回的多项式（键 → 系数）</text>

  <!-- 行 -->
  <rect x="30" y="86" width="560" height="27" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="104" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="112" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(</text>
  <text x="160" y="104" text-anchor="start" font-size="10" fill="#3a4a66" filter="url(#rough2)">进入括号，递归调用 parseExpr</text>

  <rect x="30" y="113" width="560" height="27" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="131" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="112" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e</text>
  <text x="160" y="131" text-anchor="start" font-size="10" fill="#3a4a66" filter="url(#rough2)">e 未知 ⇒ {(e,): 1}</text>

  <rect x="30" y="140" width="560" height="27" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="158" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="112" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+</text>
  <text x="160" y="158" text-anchor="start" font-size="10" fill="#3a4a66" filter="url(#rough2)">记下运算符 ＋，继续 parseTerm</text>

  <rect x="30" y="167" width="560" height="27" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="185" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="112" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="160" y="185" text-anchor="start" font-size="10" fill="#3a4a66" filter="url(#rough2)">常数 ⇒ {(): 8}</text>

  <rect x="30" y="194" width="560" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="212" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="112" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">)</text>
  <text x="160" y="212" text-anchor="start" font-size="10" fill="#2f4466" filter="url(#rough2)">左因子合并：(e + 8) ⇒ {(e,):1, ():8}</text>

  <rect x="30" y="221" width="560" height="27" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="239" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <text x="112" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">*</text>
  <text x="160" y="239" text-anchor="start" font-size="10" fill="#3a4a66" filter="url(#rough2)">右因子 (e − 8) ⇒ {(e,):1, ():−8}</text>

  <rect x="30" y="248" width="560" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="266" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="112" y="266" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">乘</text>
  <text x="160" y="266" text-anchor="start" font-size="10" fill="#8a6a20" filter="url(#rough2)">2 × 2 = 4 对键两两归并，见下方展开</text>

  <rect x="30" y="275" width="560" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="293" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">8</text>
  <text x="112" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">合</text>
  <text x="160" y="293" text-anchor="start" font-size="10" fill="#2f5230" filter="url(#rough2)">−8·e 与 +8·e 抵消 ⇒ {(e,e):1, ():−64} ⇒ [&quot;1*e*e&quot;, &quot;-64&quot;]</text>

  <!-- 乘法展开 -->
  <rect x="30" y="312" width="560" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="331" text-anchor="start" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">乘法展开（左侧每一项 × 右侧每一项）</text>
  <text x="44" y="352" text-anchor="start" font-size="10" fill="#6a5420" filter="url(#rough2)">(e,) × (e,)   → +1 · (e,e)   即 1*e*e</text>
  <text x="44" y="372" text-anchor="start" font-size="10" fill="#6a5420" filter="url(#rough2)">(e,) × ( −8 ) → −8 · (e,)</text>
  <text x="320" y="352" text-anchor="start" font-size="10" fill="#6a5420" filter="url(#rough2)">8 × (e,)     → +8 · (e,)   ← 与上一行抵消</text>
  <text x="320" y="372" text-anchor="start" font-size="10" fill="#6a5420" filter="url(#rough2)">8 × ( −8 )    → −64 · ( )</text>
  <text x="320" y="392" text-anchor="start" font-size="9.5" fill="#a08040" filter="url(#rough2)">键归并后再查系数是否为 0</text>
</svg>
