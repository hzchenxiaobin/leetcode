<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 545"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="545" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">贪心构造 → 类内传播 → 一次性验证</text>

  <!-- 框 1 -->
  <rect x="170" y="48" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">i = 0 … n−1 逐位构造</text>
  <path d="M 280 84 L 280 106" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1 -->
  <polygon points="280,110 372,146 280,182 188,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="13" fill="#7a5a18" filter="url(#rough2)">word[i]</text>
  <text x="280" y="159" text-anchor="middle" font-size="13" fill="#7a5a18" filter="url(#rough2)">已确定？</text>

  <path d="M 372 146 L 426 146" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="430" y="128" width="108" height="36" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="484" y="150" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">跳过，看 i+1</text>

  <path d="M 280 182 L 280 202" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="197" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 框 2 -->
  <rect x="110" y="206" width="340" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">分配最小未用的新字母：'a', 'b', 'c', …</text>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">新类超过 26 个 → 直接返回 ""</text>
  <path d="M 280 256 L 280 276" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 框 3 -->
  <rect x="110" y="280" width="340" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">传播相等关系：j &gt; i 且 lcp[i][j] &gt; 0</text>
  <text x="280" y="320" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">且 word[j] 未定 → word[j] = word[i]</text>
  <path d="M 280 330 L 280 350" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 框 4：验证 -->
  <rect x="80" y="354" width="400" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#a07828" filter="url(#rough2)">全矩阵验证 O(n²)</text>
  <text x="280" y="393" text-anchor="middle" font-size="11.5" fill="#7a5a18" filter="url(#rough2)">① 对角线 = n−i　② lcp[i][j] = lcp[j][i]　③ ≤ min(n−i, n−j)</text>
  <text x="280" y="411" text-anchor="middle" font-size="11.5" fill="#7a5a18" filter="url(#rough2)">④ lcp&gt;0 格：字符相等，且 lcp[i+1][j+1] = lcp[i][j] − 1</text>
  <text x="280" y="429" text-anchor="middle" font-size="11.5" fill="#7a5a18" filter="url(#rough2)">⑤ lcp=0 格：两位置字符必须不同</text>
  <path d="M 280 442 L 280 460" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 2 -->
  <polygon points="280,464 356,494 280,524 204,494" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="499" text-anchor="middle" font-size="13" fill="#7a5a18" filter="url(#rough2)">全部通过？</text>

  <path d="M 356 494 L 418 494" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="486" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="422" y="474" width="112" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="478" y="498" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">输出 word</text>

  <path d="M 204 494 L 142 494" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="174" y="486" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="26" y="474" width="112" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="82" y="498" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" filter="url(#rough2)">返回 ""</text>
</svg>
