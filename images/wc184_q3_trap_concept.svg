<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 502" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="502" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">核心观察：&amp;amp; 的产物 &amp; 永不回扫</text>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#888">6 种实体都以 &amp; 开头——&amp;amp; → &amp; 会催生新的起点；链式 replace 每趟重扫产物，单趟扫描从结构上杜绝</text>

  <!-- ============ Section A: chained replace trap ============ -->
  <text x="100" y="78" font-size="12" font-weight="bold" fill="#b85450">① 链式 replace：&amp;amp; 先行 → 新生的 &amp; 被二次替换</text>

  <g>
    <rect x="100" y="88" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="136" y="88" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="172" y="88" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="208" y="88" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="244" y="88" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="280" y="88" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="316" y="88" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="352" y="88" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="388" y="88" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="424" y="88" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="118" y="109">&amp;</text>
    <text x="154" y="109">a</text>
    <text x="190" y="109">m</text>
    <text x="226" y="109">p</text>
    <text x="262" y="109">;</text>
    <text x="298" y="109">q</text>
    <text x="334" y="109">u</text>
    <text x="370" y="109">o</text>
    <text x="406" y="109">t</text>
    <text x="442" y="109">;</text>
  </g>
  <text x="472" y="109" font-size="10.5" fill="#666">输入（10 个字符）</text>

  <path d="M 118 124 L 118 142" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="137" font-size="10.5" fill="#555">第 1 趟 replace("&amp;amp;", "&amp;")：替出 1 个新 &amp;</text>

  <g>
    <rect x="100" y="148" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="136" y="148" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="172" y="148" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="208" y="148" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="244" y="148" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="280" y="148" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="118" y="169" fill="#b85450">&amp;</text>
    <text x="154" y="169" fill="#333">q</text>
    <text x="190" y="169" fill="#333">u</text>
    <text x="226" y="169" fill="#333">o</text>
    <text x="262" y="169" fill="#333">t</text>
    <text x="298" y="169" fill="#333">;</text>
  </g>
  <text x="332" y="169" font-size="10.5" font-weight="bold" fill="#b85450">新生的 &amp;，正是所有实体的起点符</text>

  <path d="M 118 184 L 118 202" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="197" font-size="10.5" fill="#555">第 2 趟把 &amp;quot; 误当实体替换为 "</text>

  <rect x="100" y="208" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="118" y="229" font-size="13" font-weight="bold" fill="#b85450" text-anchor="middle">"</text>
  <text x="148" y="229" font-size="11" font-weight="bold" fill="#b85450">✗ 正确应输出 &amp;amp;quot;（原文的 quot; 只是普通文本）</text>

  <text x="100" y="260" font-size="10.5" fill="#b85450">每趟 replace 都重扫上一趟的产物：新生的 &amp; 与后续 quot; 拼成 &amp;quot;，被下一趟误消费</text>

  <path d="M 60 272 L 580 272" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <!-- ============ Section B: single pass ============ -->
  <text x="100" y="292" font-size="12" font-weight="bold" fill="#4a7a3a">② 单趟扫描：指针只进不退，产物直写 res</text>

  <g>
    <rect x="100" y="310" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="136" y="310" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="172" y="310" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="208" y="310" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="244" y="310" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="280" y="310" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="316" y="310" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="352" y="310" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="388" y="310" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="424" y="310" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="118" y="331">&amp;</text>
    <text x="154" y="331">a</text>
    <text x="190" y="331">m</text>
    <text x="226" y="331">p</text>
    <text x="262" y="331">;</text>
    <text x="298" y="331">q</text>
    <text x="334" y="331">u</text>
    <text x="370" y="331">o</text>
    <text x="406" y="331">t</text>
    <text x="442" y="331">;</text>
  </g>
  <text x="118" y="306" font-size="9.5" font-weight="bold" fill="#b85450" text-anchor="middle">i=0</text>
  <text x="298" y="306" font-size="9.5" fill="#999" text-anchor="middle">i=5</text>
  <text x="472" y="318" font-size="10" font-weight="bold" fill="#2e6e2e">i=0 命中 &amp;amp;</text>
  <text x="472" y="334" font-size="10" font-weight="bold" fill="#2e6e2e">输出 &amp;，i 跳到 5</text>

  <path d="M 118 346 L 118 364" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="359" font-size="10.5" fill="#555">命中 &amp;amp; → 输出 &amp;（只追加进 res，不回扫描窗口）</text>

  <g>
    <rect x="100" y="368" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="136" y="368" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="172" y="368" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="208" y="368" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="244" y="368" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="280" y="368" width="36" height="32" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="118" y="389" fill="#2e6e2e">&amp;</text>
    <text x="154" y="389" fill="#333">q</text>
    <text x="190" y="389" fill="#333">u</text>
    <text x="226" y="389" fill="#333">o</text>
    <text x="262" y="389" fill="#333">t</text>
    <text x="298" y="389" fill="#333">;</text>
  </g>
  <text x="332" y="389" font-size="11" font-weight="bold" fill="#4a7a3a">✓ 输出 &amp;amp;quot;（正确）</text>

  <text x="100" y="420" font-size="10.5" fill="#4a7a3a">扫描窗口里永远只有原文；res 中即使出现 &amp;quot; 子串也只是普通文本，不会被二次处理</text>

  <!-- conclusion box -->
  <rect x="60" y="432" width="520" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">单趟扫描的正确性是结构性的：不依赖替换顺序，实体表可任意扩展</text>
  <text x="320" y="478" text-anchor="middle" font-size="10.5" fill="#555">链式 replace 则依赖「&amp;amp; 垫底」的经验顺序（推论见题解 §5），实体表一扩展即失效</text>
</svg>
