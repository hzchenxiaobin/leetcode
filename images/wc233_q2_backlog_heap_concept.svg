<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：买侧大顶堆 × 卖侧小顶堆，撮合只看对面堆顶</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">新买单只和「最低价卖单」比价 → 卖侧小顶堆；新卖单只和「最高价买单」比价 → 买侧大顶堆</text>

  <!-- Buy heap (max-heap) -->
  <text x="150" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">买堆（大顶堆）</text>
  <g filter="url(#rough2)">
    <path d="M 150 114 L 102 148" stroke="#446688" stroke-width="1.2" fill="none"/>
    <path d="M 150 114 L 198 148" stroke="#446688" stroke-width="1.2" fill="none"/>
    <rect x="118" y="80" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="150" y="102" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">10×5</text>
    <rect x="70" y="148" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="102" y="170" text-anchor="middle" font-size="12" fill="#333">8×3</text>
    <rect x="166" y="148" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="198" y="170" text-anchor="middle" font-size="12" fill="#333">5×7</text>
  </g>
  <text x="6" y="92" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">堆顶 =</text>
  <text x="6" y="106" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">最高买价</text>
  <path d="M 50 99 L 112 97" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Sell heap (min-heap) -->
  <text x="450" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">卖堆（小顶堆）</text>
  <g filter="url(#rough2)">
    <path d="M 450 114 L 402 148" stroke="#4a7a3a" stroke-width="1.2" fill="none"/>
    <path d="M 450 114 L 498 148" stroke="#4a7a3a" stroke-width="1.2" fill="none"/>
    <rect x="418" y="80" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="450" y="102" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">15×2</text>
    <rect x="370" y="148" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="402" y="170" text-anchor="middle" font-size="12" fill="#333">20×4</text>
    <rect x="466" y="148" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="498" y="170" text-anchor="middle" font-size="12" fill="#333">30×6</text>
  </g>
  <text x="594" y="92" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">堆顶 =</text>
  <text x="594" y="106" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">最低卖价</text>
  <path d="M 550 99 L 488 97" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Price gap -->
  <path d="M 248 140 L 278 140" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 352 140 L 322 140" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">max 买 10 ＜ min 卖 15</text>
  <text x="300" y="163" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">价格鸿沟：积压内部互不成交</text>

  <!-- Invariant box -->
  <rect x="70" y="200" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="218" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">不变量：任意时刻 最大买价 ＜ 最小卖价 → 积压内部买卖单永不互相撮合</text>
  <text x="300" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">因此新订单只需与「对面堆顶」比一次：堆顶不满足 ⇒ 对面全堆都不满足</text>

  <!-- Matching strip: new buy 30 x 4 -->
  <rect x="24" y="262" width="132" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="90" y="281" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">新到订单</text>
  <text x="90" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">buy 30 × 4</text>
  <path d="M 156 284 L 174 284" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="260" width="118" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="239" y="279" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">① 顶卖 15 ≤ 30</text>
  <text x="239" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">配 min(4,2)=2 笔</text>
  <path d="M 298 284 L 316 284" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="322" y="260" width="118" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="381" y="279" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">② 顶卖 25 ≤ 30</text>
  <text x="381" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">配 min(2,1)=1 笔</text>
  <path d="M 440 284 L 458 284" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="464" y="260" width="118" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="523" y="279" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">③ 卖堆已空</text>
  <text x="523" y="296" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">剩 1 笔入买堆</text>

  <text x="300" y="330" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">同一批 4 笔订单 → 只需 2 次批量撮合，而非 4 次单笔循环</text>

  <!-- Key insight box -->
  <rect x="30" y="344" width="540" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="366" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 卖侧小顶堆随时给出「最低卖价」，买侧大顶堆随时给出「最高买价」——撮合所需信息全在堆顶</text>
  <text x="300" y="386" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 同批订单同价 → 连续撮合落在同一堆顶，合并为 min(amount, 顶数量) 的批量减法</text>
</svg>
