<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">好友图上的 BFS 分层：level = 最短距离恰好为 k</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个人只在第一次到达的那一层出现，所以同一人不会重复计数</text>

  <path d="M 142 178 L 228 122" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 142 202 L 228 258" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 274 122 L 348 178" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 274 258 L 348 202" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <circle cx="120" cy="190" r="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="250" cy="110" r="23" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="250" cy="270" r="23" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="370" cy="190" r="23" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <text x="120" y="196" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="250" y="116" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="250" y="276" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="370" y="196" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>

  <text x="120" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">你 d=0</text>
  <text x="250" y="80" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">d=1</text>
  <text x="250" y="308" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">d=1</text>
  <text x="370" y="234" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">d=2</text>

  <text x="120" y="330" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">friends = [[1,2],[0,3],[0,3],[1,2]]</text>

  <rect x="396" y="70" width="206" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="410" y="92" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">level = 1 → 取 {1, 2}</text>
  <text x="410" y="112" font-size="10" fill="#555" filter="url(#rough2)">视频：C（来自 1）、B C（来自 2）</text>
  <text x="410" y="130" font-size="10" fill="#555" filter="url(#rough2)">频次：B→1，C→2</text>
  <text x="410" y="150" font-size="10.5" fill="#b85450" filter="url(#rough2)">答案 ["B","C"]</text>

  <rect x="396" y="184" width="206" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="410" y="206" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">level = 2 → 取 {3}</text>
  <text x="410" y="226" font-size="10" fill="#555" filter="url(#rough2)">注意 0 的邻居 1、2 都已访问，</text>
  <text x="410" y="242" font-size="10" fill="#555" filter="url(#rough2)">绕回 0 的路径不算第 2 层。</text>
  <text x="410" y="262" font-size="10.5" fill="#b85450" filter="url(#rough2)">答案 ["D"]</text>

  <rect x="60" y="344" width="290" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="72" y="368" font-size="10" fill="#3a5a30" filter="url(#rough2)">先标记再入队：BFS 出队顺序按 dist 非降序</text>
</svg>
