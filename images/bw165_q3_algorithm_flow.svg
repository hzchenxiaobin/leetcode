<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐块构造 + 接缝处平移起点</text>
  <rect x="28" y="66" width="504" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="91" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">若 n &lt;= 4：直接返回空数组</text>
  <path d="M 280 106 L 280 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="114" width="504" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="139" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">for d = 1 .. n-1：取块 d（n 场，全为 (u, u+d)）</text>
  <path d="M 280 154 L 280 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="162" width="504" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="187" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">选模板：最小 c 使 gcd(c,n)=1 且 c 不在 {d, n-d}（T1）</text>
  <path d="M 280 202 L 280 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="210" width="504" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="235" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">没有可用 c 且 n 为偶数：改用偶奇交替模板 T2（差集 {2,3}）</text>
  <path d="M 280 250 L 280 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="258" width="504" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">for s = 0 .. n-1：首场 {s, s+d} 与上一块末场不相交则采用</text>
  <path d="M 280 298 L 280 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="306" width="504" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="331" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">按模板输出 n 场，更新「上一块末场」，进入下一块</text>
  <rect x="28" y="360" width="504" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="385" text-anchor="middle" font-size="12.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回全部 n(n-1) 场</text>
</svg>
