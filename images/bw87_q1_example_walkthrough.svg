<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：两个官方例子</text>

  <!-- 示例 1 -->
  <text x="280" y="62" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：Alice "08-15"~"08-18"，Bob "08-16"~"08-19"</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="88">转序号：Alice = [227, 230]，Bob = [228, 231]</text>
    <text x="280" y="108">l = max(227, 228) = 228，r = min(230, 231) = 230</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="120" y="124" width="340" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="150" y="151">226</text><text x="200" y="151">227</text><text x="250" y="151">228</text>
    <text x="300" y="151">229</text><text x="350" y="151">230</text><text x="400" y="151">231</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="188" y="118" width="120" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
  </g>
  <text x="468" y="151" font-size="11.5" fill="#b85450" filter="url(#rough2)">← 公共 3 天</text>
  <text x="280" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 230 − 228 + 1 = 3</text>

  <!-- 示例 2 -->
  <text x="280" y="228" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：Alice "10-01"~"10-31"，Bob "11-01"~"12-31"</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="254">转序号：Alice = [274, 304]，Bob = [305, 365]</text>
    <text x="280" y="274">l = max(274, 305) = 305，r = min(304, 365) = 304</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="80" y="292" width="410" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="120" y="319">273</text><text x="170" y="319">274</text><text x="240" y="319">…304</text>
    <text x="310" y="319">305</text><text x="420" y="319">…365</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="155" y="286" width="110" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="290" y="332" width="150" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
  </g>
  <path d="M 265 296 L 300 296" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">l = 305 &gt; r = 304 → 无交集，答案 = 0</text>
</svg>
