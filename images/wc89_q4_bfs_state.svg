<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把字符串当状态：一次交换是一条边，答案就是最短路（BFS）</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s1 = "abc"，s2 = "bca"：第 2 层第一次出现目标串 → 相似度 = 2</text>
  <rect x="60" y="96" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="121" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">abc</text>
  <text x="108" y="86" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">第 0 层</text>
  <path d="M 158 116 L 236 116" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="196" y="104" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">换 0、1</text>
  <rect x="240" y="96" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="121" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">bac</text>
  <text x="288" y="86" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">第 1 层</text>
  <path d="M 338 116 L 414 116" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="376" y="104" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">换 1、2</text>
  <rect x="418" y="96" width="96" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="466" y="120.7" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">bca = s2</text>
  <text x="466" y="86" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">第 2 层</text>
  <text x="60" y="186" text-anchor="start" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么"换 0、1"是唯一分支：</text>
  <text x="60" y="208" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">· 第 0 位 s1[0] = a，而 s2[0] = b → 必须把某个 b 换到 0 位；</text>
  <text x="60" y="230" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">· 只有 1 号位的 b 满足 cur[j] == s2[i]，且它自己也错位（cur[1] = b ≠ s2[1] = c）；</text>
  <text x="60" y="252" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">· 其余交换（如换 0、2 → "cba"）不可能更快，只会浪费一步。</text>
  <rect x="60" y="272" width="520" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="70" y="290" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">BFS 从 s1 出发，每层把所有「修好一个失配位」的后继入队；</text>
  <text x="70" y="304.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">用哈希集合去重，保证每个字符串只展开一次；</text>
  <text x="70" y="319.8" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">n ≤ 20、字母表只有 6 个字母，不同排列的状态数远小于 20!，实际搜索很快。</text>
</svg>
