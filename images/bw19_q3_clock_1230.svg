<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="44"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">12:30 的钟面：时针走过半格，分针指向 6</text>

  <!-- 钟面 -->
  <circle cx="170" cy="205" r="104" fill="#fffdf5" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <!-- 165° 夹角扇形 -->
  <path d="M 170 205 L 196.9 104.7 A 104 104 0 0 1 170 309 Z" fill="#fce4ec" opacity="0.7" filter="url(#rough2)"/>
  <!-- 刻度 -->
  <g filter="url(#rough2)" stroke="#8a7a5c" stroke-width="2">
    <path d="M 170 101 L 170 111"/>
    <path d="M 222 114 L 218 123"/>
    <path d="M 260 154 L 251 159"/>
    <path d="M 274 205 L 264 205"/>
    <path d="M 260 256 L 251 251"/>
    <path d="M 222 296 L 218 287"/>
    <path d="M 170 309 L 170 299"/>
    <path d="M 118 296 L 122 287"/>
    <path d="M 80 256 L 89 251"/>
    <path d="M 66 205 L 76 205"/>
    <path d="M 80 154 L 89 159"/>
    <path d="M 118 114 L 122 123"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#5c4a2c" text-anchor="middle">
    <text x="170" y="92">12</text><text x="275" y="210">3</text><text x="170" y="325">6</text><text x="65" y="210">9</text>
  </g>
  <!-- 时针：15°（12 与 1 之间） -->
  <path d="M 170 205 L 185.5 145" stroke="#b85450" stroke-width="4.5" stroke-linecap="round" filter="url(#rough2)"/>
  <!-- 分针：180°（指向 6） -->
  <path d="M 170 205 L 170 290" stroke="#446688" stroke-width="3" stroke-linecap="round" filter="url(#rough2)"/>
  <circle cx="170" cy="205" r="5" fill="#333" filter="url(#rough2)"/>
  <text x="206" y="136" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">时针 15°</text>
  <text x="182" y="286" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">分针 180°</text>
  <path d="M 205 250 A 60 60 0 0 0 212 252" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="258" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">夹角 165°</text>

  <!-- 右侧推导 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="330" y="56" width="210" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="435" y="77" text-anchor="middle" fill="#446688" font-weight="bold">分针：6°/分</text>
    <text x="435" y="96" text-anchor="middle" fill="#333">30 分 × 6° = 180°</text>

    <rect x="330" y="118" width="210" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="435" y="140" text-anchor="middle" fill="#7a5c1e" font-weight="bold">时针：30°/时 + 0.5°/分</text>
    <text x="435" y="160" text-anchor="middle" fill="#333">12 点整 = 0°</text>
    <text x="435" y="176" text-anchor="middle" fill="#333">30 分 × 0.5° = 15°</text>

    <rect x="330" y="194" width="210" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="435" y="215" text-anchor="middle" fill="#2d5a22" font-weight="bold">差 θ = |15 − 180| = 165</text>
    <text x="435" y="234" text-anchor="middle" fill="#2d5a22">min(165, 360−165) = 165</text>
  </g>

  <rect x="330" y="262" width="210" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="435" y="286" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">别忘取小角！</text>
  <text x="435" y="306" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">例如 9:00 夹角 90°，不是 270°</text>
  <text x="435" y="350" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">hour = 12 要按 0 点算：12 % 12 = 0</text>
</svg>
