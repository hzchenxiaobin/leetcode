<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">打擂台算法流程：n−1 次矩阵查询定冠军</text>
  <path d="M 220 40 Q 340 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="70" y="70" width="170" height="44" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="155" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">champ = 0（0 号登擂）</text>

  <!-- loop header -->
  <g filter="url(#sk)">
    <path d="M 155 114 L 155 150" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="75" y="154" width="160" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="155" y="179" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold">j = 1 … n−1 依次挑战</text>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <path d="M 155 194 L 155 220 L 320 258 L 155 296 L -10 258 Z" transform="translate(85,20)" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="240" y="286" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">grid[champ][j] == 0 ?</text>
  <text x="240" y="304" text-anchor="middle" font-size="11" fill="#888">（0 表示 j 比 champ 强）</text>

  <!-- left branch: no, champ stays -->
  <g filter="url(#sk)">
    <path d="M 125 296 Q 60 300 52 340" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="58" y="312" font-size="12" fill="#2e6e2e" font-weight="bold">否（守擂）</text>
  <g filter="url(#sk)">
    <rect x="40" y="344" width="150" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="115" y="370" text-anchor="middle" font-size="12.5" fill="#2e6e2e">champ 不变（仍最强）</text>

  <!-- right branch: yes, champ = j -->
  <g filter="url(#sk)">
    <path d="M 355 286 Q 420 288 440 330" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="392" y="302" font-size="12" fill="#b03a3a" font-weight="bold">是（易主）</text>
  <g filter="url(#sk)">
    <rect x="365" y="334" width="150" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="440" y="360" text-anchor="middle" font-size="12.5" fill="#b03a3a">champ = j（王冠易主）</text>

  <!-- loop back -->
  <g filter="url(#sk)">
    <path d="M 440 376 Q 440 410 300 410 Q 155 410 155 200" stroke="#8a8a8a" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  </g>
  <text x="300" y="404" text-anchor="middle" font-size="11" fill="#888">下一个挑战者 j+1</text>

  <!-- return box -->
  <g filter="url(#sk)">
    <rect x="250" y="140" width="180" height="44" rx="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="340" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 champ = 冠军 ✓</text>
  <g filter="url(#sk)">
    <path d="M 235 258 Q 300 210 335 186" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="316" y="238" font-size="11" fill="#2e6e2e">j 扫完</text>

  <!-- right annotation: invariant -->
  <g filter="url(#sk)">
    <rect x="470" y="60" width="190" height="120" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="565" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">循环不变量</text>
  <text x="486" y="110" font-size="11.5" fill="#444">处理完 0..j 后：</text>
  <text x="486" y="130" font-size="11.5" fill="#444">champ 是前 j+1 队中</text>
  <text x="486" y="150" font-size="11.5" fill="#444">的最强者（归纳可证，</text>
  <text x="486" y="170" font-size="11.5" fill="#444">依赖传递性保证）</text>

  <!-- right annotation: cost -->
  <g filter="url(#sk)">
    <rect x="470" y="200" width="190" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="565" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">代价清单</text>
  <text x="486" y="250" font-size="11.5" fill="#444">每轮恰查 1 个格子</text>
  <text x="486" y="270" font-size="11.5" fill="#444">共 n−1 次矩阵查询</text>
  <text x="486" y="290" font-size="11.5" fill="#444">时间 O(n)，空间 O(1)</text>
  <text x="486" y="306" font-size="11" fill="#888">（= 找最大元的比较下界）</text>
</svg>
