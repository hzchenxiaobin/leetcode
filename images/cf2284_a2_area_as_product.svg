<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：二倍面积 ≤ 两个方向的总位移之积</text>
  <path d="M 120 44 Q 360 50 600 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：几何图形 -->
  <rect x="18" y="62" width="352" height="348" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#37516e" filter="url(#rough2)">把 n 次操作按「x 轴 / y 轴」两类分堆</text>

  <!-- 坐标轴 -->
  <path d="M 58 372 L 336 372" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 58 372 L 58 122" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 三角形 -->
  <path d="M 58 372 L 306 372 L 58 152 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 虚线段示意包围盒 -->
  <path d="M 306 372 L 306 152" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 58 152 L 306 152" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- 顶点 -->
  <circle cx="58" cy="372" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="306" cy="372" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="58" cy="152" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="40" y="396" font-size="12.5" fill="#333" filter="url(#rough2)">A (0,0)</text>
  <text x="272" y="396" font-size="12.5" fill="#333" filter="url(#rough2)">B (X,0)</text>
  <text x="66" y="140" font-size="12.5" fill="#333" filter="url(#rough2)">C (0,Y)</text>

  <!-- 尺寸标注 -->
  <text x="180" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37516e" filter="url(#rough2)">底 = X</text>
  <text x="30" y="266" font-size="12.5" font-weight="bold" fill="#37516e" transform="rotate(-90 30 266)" filter="url(#rough2)">高 = Y</text>
  <text x="196" y="250" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">二倍面积 = X · Y</text>

  <!-- 右：推导卡片 -->
  <rect x="382" y="62" width="320" height="348" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="542" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么所有操作只有两个"用处"</text>

  <rect x="396" y="100" width="292" height="92" rx="8" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="406" y="122" font-size="12" fill="#333" filter="url(#rough2)">设 x 轴组总幅度 X、y 轴组总幅度 Y，</text>
  <text x="406" y="143" font-size="12" fill="#333" filter="url(#rough2)">每个操作恰好落进其中一组，故</text>
  <text x="406" y="170" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">X + Y = T = Σ 2^(aᵢ)</text>

  <rect x="396" y="200" width="292" height="86" rx="8" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="406" y="222" font-size="12" fill="#333" filter="url(#rough2)">包围盒宽 = max x − min x ≤ X</text>
  <text x="406" y="243" font-size="12" fill="#333" filter="url(#rough2)">包围盒高 = max y − min y ≤ Y</text>
  <text x="406" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37516e" filter="url(#rough2)">三角形藏在盒子里 ⇒ 面积不会更大</text>

  <rect x="396" y="294" width="292" height="102" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="542" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33b36" filter="url(#rough2)">而且可以正好做到 X · Y</text>
  <text x="542" y="340" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">x 轴组全部给 B 的横坐标（加号）</text>
  <text x="542" y="360" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">y 轴组全部给 C 的纵坐标（加号）</text>
  <text x="542" y="382" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">A 一直待在原点，三角形就是直角三角形</text>
</svg>
