<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1 演算：words = ["pay","attention","practice","attend"]，pref = "at"（m = 2）</text>

  <!-- header -->
  <rect x="30" y="44" width="660" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#33506b" font-weight="bold" text-anchor="middle">
    <text x="50" y="66" filter="url(#rough2)">#</text>
    <text x="118" y="66" filter="url(#rough2)">word</text>
    <text x="222" y="66" filter="url(#rough2)">长度守卫 |w| ≥ m</text>
    <text x="390" y="66" filter="url(#rough2)">逐位比较</text>
    <text x="528" y="66" filter="url(#rough2)">比较次数</text>
    <text x="632" y="66" filter="url(#rough2)">判定</text>
  </g>

  <!-- row 1: pay -->
  <rect x="30" y="84" width="660" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="11" text-anchor="middle">
    <text x="50" y="109" fill="#555" filter="url(#rough2)">1</text>
    <text x="118" y="109" fill="#555" filter="url(#rough2)">pay</text>
    <text x="222" y="109" fill="#555" filter="url(#rough2)">3 ≥ 2 ✓</text>
    <text x="390" y="109" fill="#8f3a36" filter="url(#rough2)">p ≠ a（首位失配即止）</text>
    <text x="528" y="109" fill="#555" filter="url(#rough2)">1</text>
    <text x="632" y="109" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 非前缀</text>
  </g>

  <!-- row 2: attention -->
  <rect x="30" y="130" width="660" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="11" text-anchor="middle">
    <text x="50" y="155" fill="#555" filter="url(#rough2)">2</text>
    <text x="118" y="155" fill="#555" filter="url(#rough2)">attention</text>
    <text x="222" y="155" fill="#555" filter="url(#rough2)">9 ≥ 2 ✓</text>
    <text x="390" y="155" fill="#2e5b2e" filter="url(#rough2)">a = a ✓ → t = t ✓</text>
    <text x="528" y="155" fill="#555" filter="url(#rough2)">2</text>
    <text x="632" y="155" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">✓ 是前缀</text>
  </g>

  <!-- row 3: practice -->
  <rect x="30" y="176" width="660" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="11" text-anchor="middle">
    <text x="50" y="201" fill="#555" filter="url(#rough2)">3</text>
    <text x="118" y="201" fill="#555" filter="url(#rough2)">practice</text>
    <text x="222" y="201" fill="#555" filter="url(#rough2)">8 ≥ 2 ✓</text>
    <text x="390" y="201" fill="#8f3a36" filter="url(#rough2)">p ≠ a（首位失配即止）</text>
    <text x="528" y="201" fill="#555" filter="url(#rough2)">1</text>
    <text x="632" y="201" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 非前缀</text>
  </g>

  <!-- row 4: attend -->
  <rect x="30" y="222" width="660" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="11" text-anchor="middle">
    <text x="50" y="247" fill="#555" filter="url(#rough2)">4</text>
    <text x="118" y="247" fill="#555" filter="url(#rough2)">attend</text>
    <text x="222" y="247" fill="#555" filter="url(#rough2)">6 ≥ 2 ✓</text>
    <text x="390" y="247" fill="#2e5b2e" filter="url(#rough2)">a = a ✓ → t = t ✓</text>
    <text x="528" y="247" fill="#555" filter="url(#rough2)">2</text>
    <text x="632" y="247" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">✓ 是前缀</text>
  </g>

  <!-- summary box -->
  <rect x="30" y="286" width="660" height="94" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">合计：ans = 2（attention、attend）</text>
  <g font-size="10.5" fill="#555">
    <text x="50" y="332" filter="url(#rough2)">• 字符比较总数 1 + 2 + 1 + 2 = 6 次；切片法固定 4 × 2 = 8 次比较，另加 4 次长度为 2 的子串拷贝</text>
    <text x="50" y="352" filter="url(#rough2)">• pay / practice 在首位 p ≠ a 即被拒——「失配即止」让不匹配的词只花 1 次比较</text>
    <text x="50" y="372" filter="url(#rough2)">• 本例 4 词长度均 ≥ 2，长度守卫未命中；守卫的价值在「词比前缀短」的情形（见 §8 第 2 条）</text>
  </g>
</svg>
