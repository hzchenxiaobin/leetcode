<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：同一批日志，两种粒度给出不同结果</text>

  <!-- 表头 -->
  <rect x="62" y="52" width="56" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="71" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">id</text>
  <rect x="118" y="52" width="230" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="233" y="71" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">时间戳</text>
  <rect x="348" y="52" width="90" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="393" y="71" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">π₁（Year）</text>
  <rect x="438" y="52" width="140" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="508" y="71" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">π₄（Hour）</text>

  <!-- 行 1 -->
  <rect x="62" y="80" width="516" height="30" rx="3" fill="none" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="99" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="233" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2017:01:01:23:59:59</text>
  <text x="393" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2017</text>
  <text x="508" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2017:01:01:23</text>

  <!-- 行 2 -->
  <rect x="62" y="110" width="516" height="30" rx="3" fill="none" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="233" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2017:01:01:22:59:59</text>
  <text x="393" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2017</text>
  <text x="508" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2017:01:01:22</text>

  <!-- 行 3 -->
  <rect x="62" y="140" width="516" height="30" rx="3" fill="none" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="159" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="233" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2016:01:01:00:00:00</text>
  <text x="393" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2016</text>
  <rect x="440" y="143" width="136" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="508" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2016:01:01:00</text>

  <text x="320" y="186" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">两条查询共用同一区间：start = 2016:01:01:01:01:01，end = 2017:01:01:23:00:00</text>

  <!-- 卡片 L：Year -->
  <rect x="40" y="198" width="270" height="152" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">retrieve(…, Year)</text>
  <text x="175" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">lo = 2016　hi = 2017</text>
  <text x="175" y="264" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">log1 2017 ✓</text>
  <text x="175" y="284" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">log2 2017 ✓</text>
  <text x="175" y="304" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">log3 2016 ✓（= lo）</text>
  <text x="175" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ [1, 2, 3]</text>

  <!-- 卡片 R：Hour -->
  <rect x="330" y="198" width="270" height="152" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="465" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">retrieve(…, Hour)</text>
  <text x="465" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">lo = 2016:01:01:01　hi = 2017:01:01:23</text>
  <text x="465" y="264" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">log1 2017:01:01:23 ✓（= hi）</text>
  <text x="465" y="284" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">log2 2017:01:01:22 ✓</text>
  <text x="465" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">log3 2016:01:01:00 ✗（&lt; lo）</text>
  <text x="465" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">→ [1, 2]</text>

  <text x="320" y="376" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">Day 粒度：lo = 2016:01:01，hi = 2017:01:01 ⇒ 三条全中，返回 [1, 2, 3]</text>
  <text x="320" y="400" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">Second 粒度：整串比较 ⇒ log1 的 23:59:59 超出 hi，只剩 log2，返回 [2]</text>

  <text x="320" y="422" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">精度越细，区间越窄——但截断与比较的代码一行都不用改</text>
</svg>
