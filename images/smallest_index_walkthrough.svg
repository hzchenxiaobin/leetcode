<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：命中 与 全程未命中</text>
  <path d="M 160 40 Q 320 50 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Section A: nums = [4,3,2,1] -->
  <text x="90" y="72" font-size="13" font-weight="bold" fill="#2b2b2b">示例 2：nums = [4,3,2,1]</text>

  <g filter="url(#sk)">
    <rect x="90" y="82" width="52" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="152" y="82" width="52" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="214" y="82" width="52" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
    <rect x="276" y="82" width="52" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="10" fill="#889">
    <text x="116" y="96">i=0</text>
    <text x="178" y="96">i=1</text>
    <text x="240" y="96" fill="#2e6e2e" font-weight="bold">i=2</text>
    <text x="302" y="96">i=3</text>
  </g>
  <g text-anchor="middle" font-size="18" font-weight="bold">
    <text x="116" y="122" fill="#446688">4</text>
    <text x="178" y="122" fill="#446688">3</text>
    <text x="240" y="122" fill="#2e6e2e">2</text>
    <text x="302" y="122" fill="#446688">1</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#889">
    <text x="116" y="146">0≠4</text>
    <text x="178" y="146">1≠3</text>
    <text x="240" y="146" fill="#2e6e2e" font-weight="bold">2=2 ✓</text>
    <text x="302" y="146">3≠1</text>
  </g>

  <path d="M 338 106 L 368 106" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="376" y="84" width="180" height="46" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="466" y="106" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">i=2 首次命中</text>
  <text x="466" y="122" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">返回 2</text>

  <!-- Section B: nums = [1,2,3,...,0] -->
  <text x="90" y="192" font-size="13" font-weight="bold" fill="#2b2b2b">示例 3：nums = [1,2,3,4,5,6,7,8,9,0]</text>

  <g filter="url(#sk)">
    <rect x="60"  y="202" width="40" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="106" y="202" width="40" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="152" y="202" width="40" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="198" y="202" width="40" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="244" y="202" width="40" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="290" y="202" width="40" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="336" y="202" width="40" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="382" y="202" width="40" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="428" y="202" width="40" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="474" y="202" width="40" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="9" fill="#889">
    <text x="80"  y="215">i=0</text>
    <text x="126" y="215">i=1</text>
    <text x="172" y="215">i=2</text>
    <text x="218" y="215">i=3</text>
    <text x="264" y="215">i=4</text>
    <text x="310" y="215">i=5</text>
    <text x="356" y="215">i=6</text>
    <text x="402" y="215">i=7</text>
    <text x="448" y="215">i=8</text>
    <text x="494" y="215">i=9</text>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="bold" fill="#446688">
    <text x="80"  y="238">1</text>
    <text x="126" y="238">2</text>
    <text x="172" y="238">3</text>
    <text x="218" y="238">4</text>
    <text x="264" y="238">5</text>
    <text x="310" y="238">6</text>
    <text x="356" y="238">7</text>
    <text x="402" y="238">8</text>
    <text x="448" y="238">9</text>
    <text x="494" y="238">0</text>
  </g>
  <g text-anchor="middle" font-size="9.5" fill="#a04040">
    <text x="80"  y="260">0≠1</text>
    <text x="126" y="260">1≠2</text>
    <text x="172" y="260">2≠3</text>
    <text x="218" y="260">3≠4</text>
    <text x="264" y="260">4≠5</text>
    <text x="310" y="260">5≠6</text>
    <text x="356" y="260">6≠7</text>
    <text x="402" y="260">7≠8</text>
    <text x="448" y="260">8≠9</text>
    <text x="494" y="260">9≠0</text>
  </g>

  <text x="320" y="290" text-anchor="middle" font-size="11" fill="#889">i = 0..9 时 i mod 10 = i，而 nums[i] 恰好比 i 大 1（mod 10），全程未命中。</text>

  <g filter="url(#sk)">
    <rect x="236" y="304" width="168" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="325" text-anchor="middle" font-size="12.5" fill="#a04040" font-weight="bold">扫描结束仍无命中</text>
  <text x="320" y="341" text-anchor="middle" font-size="12.5" fill="#a04040" font-weight="bold">返回 −1</text>

  <text x="320" y="380" text-anchor="middle" font-size="11" fill="#888">两行对比：命中即在绿色格停止；扫完全程才返回 −1。</text>
</svg>
