  <text x="40" y="272" font-size="9.5" fill="#888" filter="url(#rough2)">格子中第 k 个数 = dp[f][k]，表示末尾恰好是连续 k 个点数 f 的方案数；rollMax 小的行格子少</text>
  <text x="40" y="290" font-size="10" fill="#4a7a3a" filter="url(#rough2)">末层求和：28 × 3 + (27 + 5) × 2 + (27 + 5 + 1) = 84 + 64 + 33 = 181</text>

  <rect x="40" y="304" width="560" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="326" font-size="9.5" fill="#8a3a38" filter="url(#rough2)">示例 1：n = 2，rollMax = [1,1,2,2,2,3]  →  36 − 2 = 34（只禁掉 11、22）</text>
  <text x="56" y="346" font-size="9.5" fill="#8a3a38" filter="url(#rough2)">示例 2：n = 2，rollMax 全为 1  →  36 − 6 = 30（11 … 66 全部非法）</text>
  <text x="56" y="366" font-size="9.5" fill="#8a3a38" filter="url(#rough2)">示例 3：n = 3，上表末行合计 = 181，与官方输出一致 ✓</text>
