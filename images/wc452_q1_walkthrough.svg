<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" viewBox="0 0 940 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="680" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：两关全过 ≠ 有解</text>
  <path d="M 290 42 Q 470 50 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: example 1 walkthrough ===== -->
  <g filter="url(#sk)"><rect x="60" y="54" width="820" height="282" rx="8" fill="#f7fbf8" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="80" y="80" font-size="13" font-weight="bold" fill="#2e6e2e">① 示例 1：nums = [3,1,6,8,4]，target = 24 → true</text>
  <text x="80" y="108" font-size="11" fill="#444">关卡一 ✓：3、1、6、8、4 都整除 24；关卡二 ✓：3·1·6·8·4 = 576 = 24²</text>

  <!-- enumeration table -->
  <g font-size="11.5">
    <g filter="url(#sk)"><rect x="90" y="124" width="150" height="28" fill="#f0eee6" stroke="#999" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="240" y="124" width="330" height="28" fill="#f0eee6" stroke="#999" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="570" y="124" width="150" height="28" fill="#f0eee6" stroke="#999" stroke-width="1"/></g>
    <text x="165" y="143" text-anchor="middle" fill="#333" font-weight="bold">子集 A</text>
    <text x="405" y="143" text-anchor="middle" fill="#333" font-weight="bold">逐元素累乘</text>
    <text x="645" y="143" text-anchor="middle" fill="#333" font-weight="bold">判定</text>

    <g filter="url(#sk)"><rect x="90" y="152" width="150" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="240" y="152" width="330" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="570" y="152" width="150" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="165" y="171" text-anchor="middle" fill="#444">{3}</text>
    <text x="405" y="171" text-anchor="middle" fill="#444">3</text>
    <text x="645" y="171" text-anchor="middle" fill="#888">3 ≠ 24 ✗</text>

    <g filter="url(#sk)"><rect x="90" y="180" width="150" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="240" y="180" width="330" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="570" y="180" width="150" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="165" y="199" text-anchor="middle" fill="#444">{3, 1}</text>
    <text x="405" y="199" text-anchor="middle" fill="#444">3 × 1 = 3</text>
    <text x="645" y="199" text-anchor="middle" fill="#888">≠ 24 ✗</text>

    <g filter="url(#sk)"><rect x="90" y="208" width="150" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="240" y="208" width="330" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="570" y="208" width="150" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="165" y="227" text-anchor="middle" fill="#444">{6, 8}</text>
    <text x="405" y="227" text-anchor="middle" fill="#7a5415">6 × 8 = 48 &gt; 24</text>
    <text x="645" y="227" text-anchor="middle" fill="#b03a3a">剪枝 ✗</text>

    <g filter="url(#sk)"><rect x="90" y="236" width="150" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <g filter="url(#sk)"><rect x="240" y="236" width="330" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <g filter="url(#sk)"><rect x="570" y="236" width="150" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="165" y="255" text-anchor="middle" fill="#2e6e2e" font-weight="bold">{3, 8}</text>
    <text x="405" y="255" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3 × 8 = 24</text>
    <text x="645" y="255" text-anchor="middle" fill="#2e6e2e" font-weight="bold">= 24 ✓ 命中</text>
  </g>
  <text x="80" y="296" font-size="11" fill="#444">命中 → A = {3, 8}，补集 B = {1, 6, 4} 的积同样是 24（由守恒保证）→ return true</text>
  <text x="80" y="320" font-size="10" fill="#888">枚举顺序按 mask = 1, 2, 3, … 递增，上表只摘录关键几步</text>

  <!-- ===== Panel 2: example 3 counterexample ===== -->
  <g filter="url(#sk)"><rect x="60" y="354" width="820" height="236" rx="8" fill="#fefaf4" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="80" y="380" font-size="13" font-weight="bold" fill="#7a5415">② 示例 3（自拟反例）：nums = [8,16,32]，target = 64 → false</text>
  <text x="80" y="408" font-size="11" fill="#444">关卡一 ✓：8|64、16|64、32|64；关卡二 ✓：8·16·32 = 4096 = 64² —— 两关全过！</text>
  <text x="80" y="436" font-size="11" fill="#444">关卡三：6 个非空真子集的积，无一命中：</text>

  <g font-size="10.5">
    <g filter="url(#sk)"><rect x="90" y="452" width="118" height="40" rx="6" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.2"/></g>
    <text x="149" y="476" text-anchor="middle" fill="#b03a3a">{8} → 8 ✗</text>
    <g filter="url(#sk)"><rect x="220" y="452" width="118" height="40" rx="6" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.2"/></g>
    <text x="279" y="476" text-anchor="middle" fill="#b03a3a">{16} → 16 ✗</text>
    <g filter="url(#sk)"><rect x="350" y="452" width="118" height="40" rx="6" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.2"/></g>
    <text x="409" y="476" text-anchor="middle" fill="#b03a3a">{32} → 32 ✗</text>
    <g filter="url(#sk)"><rect x="480" y="452" width="118" height="40" rx="6" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.2"/></g>
    <text x="539" y="476" text-anchor="middle" fill="#b03a3a">{8,16} → 128 ✗</text>
    <g filter="url(#sk)"><rect x="610" y="452" width="118" height="40" rx="6" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.2"/></g>
    <text x="669" y="476" text-anchor="middle" fill="#b03a3a">{8,32} → 256 ✗</text>
    <g filter="url(#sk)"><rect x="740" y="452" width="118" height="40" rx="6" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.2"/></g>
    <text x="799" y="476" text-anchor="middle" fill="#b03a3a">{16,32} → 512 ✗</text>
  </g>
  <text x="80" y="522" font-size="11" fill="#444">mask 耗尽 → return false</text>
  <text x="80" y="552" font-size="11" font-weight="bold" fill="#b03a3a">⚠ 教训：守恒 + 因子只是必要条件，最终裁决必须枚举</text>
  <text x="80" y="576" font-size="10" fill="#888">构造思路：取 target = 2⁶，指数组 {3,4,5} 之和 = 6 × 2 = 12，但无子集指数和恰为 6</text>

  <!-- ===== bottom note ===== -->
  <g filter="url(#sk)"><rect x="60" y="606" width="820" height="52" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="80" y="628" font-size="11" fill="#444">记忆点：mask ∈ [1, 2ⁿ − 2] —— 下界排空集（空积约定为 1，target = 1 时会误判），</text>
  <text x="80" y="648" font-size="11" fill="#444">上界排全集（补集为空，不满足两侧非空）</text>
</svg>
