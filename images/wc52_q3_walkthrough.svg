<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 3, k = 2, 起点 (0,0)</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">从最后一层往回看：两个可达格子的存活概率各取 1/8 再相加</text>

  <text x="96" y="76" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">f⁰：还没走，全 1</text>
  <g filter="url(#rough2)" stroke="#999" stroke-width="1.1">
    <rect x="48" y="84" width="32" height="32" fill="#ffffff"/>
    <rect x="80" y="84" width="32" height="32" fill="#ffffff"/>
    <rect x="112" y="84" width="32" height="32" fill="#ffffff"/>
    <rect x="48" y="116" width="32" height="32" fill="#ffffff"/>
    <rect x="80" y="116" width="32" height="32" fill="#ffffff"/>
    <rect x="112" y="116" width="32" height="32" fill="#ffffff"/>
    <rect x="48" y="148" width="32" height="32" fill="#ffffff"/>
    <rect x="80" y="148" width="32" height="32" fill="#ffffff"/>
    <rect x="112" y="148" width="32" height="32" fill="#ffffff"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#556677" text-anchor="middle">
    <text x="64" y="104">1</text><text x="96" y="104">1</text><text x="128" y="104">1</text>
    <text x="64" y="136">1</text><text x="96" y="136">1</text><text x="128" y="136">1</text>
    <text x="64" y="168">1</text><text x="96" y="168">1</text><text x="128" y="168">1</text>
  </g>

  <path d="M 152 132 L 204 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="124" text-anchor="middle" font-size="9.5" fill="#66788f" filter="url(#rough2)">走 1 步</text>

  <text x="260" y="76" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">f¹：界内方向数 ÷ 8</text>
  <g filter="url(#rough2)" stroke="#999" stroke-width="1.1">
    <rect x="212" y="84" width="32" height="32" fill="#ffffff"/>
    <rect x="244" y="84" width="32" height="32" fill="#ffffff"/>
    <rect x="276" y="84" width="32" height="32" fill="#ffffff"/>
    <rect x="212" y="116" width="32" height="32" fill="#ffffff"/>
    <rect x="244" y="116" width="32" height="32" fill="#ffffff"/>
    <rect x="276" y="116" width="32" height="32" fill="#ffffff"/>
    <rect x="212" y="148" width="32" height="32" fill="#ffffff"/>
    <rect x="244" y="148" width="32" height="32" fill="#ffffff"/>
    <rect x="276" y="148" width="32" height="32" fill="#ffffff"/>
  </g>
  <rect x="276" y="116" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="244" y="148" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="244" y="116" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#556677" text-anchor="middle">
    <text x="228" y="104">0.25</text><text x="260" y="104">0.25</text><text x="292" y="104">0.25</text>
    <text x="228" y="136">0.25</text><text x="260" y="136">0</text><text x="292" y="136">0.25</text>
    <text x="228" y="168">0.25</text><text x="260" y="168">0.25</text><text x="292" y="168">0.25</text>
  </g>
  <text x="260" y="196" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">棋盘中心 (1,1) 无马步可走 → 0</text>

  <path d="M 314 150 L 336 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="84" width="254" height="122" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="354" y="104" font-size="10.5" fill="#33445f" font-weight="bold" filter="url(#rough2)">f²(0,0) 的计算</text>
  <text x="354" y="126" font-size="10" fill="#33445f" filter="url(#rough2)">= [ f¹(1,2) + f¹(2,1) ] / 8</text>
  <text x="354" y="146" font-size="10" fill="#33445f" filter="url(#rough2)">= (0.25 + 0.25) / 8</text>
  <text x="354" y="166" font-size="10" fill="#33445f" filter="url(#rough2)">= 0.5 / 8</text>
  <text x="354" y="192" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 0.0625</text>

  <rect x="340" y="216" width="254" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="354" y="236" font-size="10" fill="#8a6a20" filter="url(#rough2)">从 (0,0) 一步只到 (1,2)、(2,1)</text>
  <text x="354" y="254" font-size="10" fill="#8a6a20" filter="url(#rough2)">其余 6 个方向立刻出界 → 贡献 0</text>
  <text x="354" y="272" font-size="10" fill="#8a6a20" filter="url(#rough2)">所以只需查 2 个邻居，而不是 8 个</text>

  <rect x="40" y="292" width="540" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="312" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">计数视角交叉验证：合法 2 步路径共 4 条，全部路径 8² = 64 条</text>
  <text x="56" y="330" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">4 / 64 = 0.0625 ✓ 与概率 DP 的结果一致</text>
</svg>
