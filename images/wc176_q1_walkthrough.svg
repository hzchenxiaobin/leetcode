<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：7 次判定得到 ans = 8</text>
  <text x="300" y="48" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">grid = [[4,3,2,−1],[3,2,1,−1],[1,1,−1,−2],[−1,−1,−2,−3]]，m = n = 4</text>

  <g filter="url(#rough2)">
    <rect x="40" y="70" width="520" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="40" y="102" width="520" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="40" y="134" width="520" height="32" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
    <rect x="40" y="166" width="520" height="32" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
    <rect x="40" y="198" width="520" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="40" y="230" width="520" height="32" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
    <rect x="40" y="262" width="520" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="40" y="294" width="520" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>

  <g filter="url(#rough2)" stroke="#99a7b8" stroke-width="0.9">
    <path d="M 86 70 L 86 326" fill="none"/>
    <path d="M 170 70 L 170 326" fill="none"/>
    <path d="M 226 70 L 226 326" fill="none"/>
    <path d="M 470 70 L 470 326" fill="none"/>
  </g>

  <g filter="url(#rough2)" font-size="11.5" fill="#2f4a6a">
    <text x="63" y="91" text-anchor="middle" font-weight="bold">步</text>
    <text x="128" y="91" text-anchor="middle" font-weight="bold">(i, j)</text>
    <text x="198" y="91" text-anchor="middle" font-weight="bold">值</text>
    <text x="348" y="91" text-anchor="middle" font-weight="bold">判定与动作</text>
    <text x="515" y="91" text-anchor="middle" font-weight="bold">ans</text>
  </g>

  <g filter="url(#rough2)" font-size="11.5" fill="#333">
    <text x="63" y="123" text-anchor="middle">1</text>
    <text x="128" y="123" text-anchor="middle">(3, 0)</text>
    <text x="198" y="123" text-anchor="middle" fill="#b85450">−1</text>
    <text x="238" y="123" font-size="10.5">负数 → ans += 4，i = 2</text>
    <text x="515" y="123" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>

    <text x="63" y="155" text-anchor="middle">2</text>
    <text x="128" y="155" text-anchor="middle">(2, 0)</text>
    <text x="198" y="155" text-anchor="middle">1</text>
    <text x="238" y="155" font-size="10.5">非负 → j = 1</text>
    <text x="515" y="155" text-anchor="middle">4</text>

    <text x="63" y="187" text-anchor="middle">3</text>
    <text x="128" y="187" text-anchor="middle">(2, 1)</text>
    <text x="198" y="187" text-anchor="middle">1</text>
    <text x="238" y="187" font-size="10.5">非负 → j = 2</text>
    <text x="515" y="187" text-anchor="middle">4</text>

    <text x="63" y="219" text-anchor="middle">4</text>
    <text x="128" y="219" text-anchor="middle">(2, 2)</text>
    <text x="198" y="219" text-anchor="middle" fill="#b85450">−1</text>
    <text x="238" y="219" font-size="10.5">负数 → ans += 2，i = 1</text>
    <text x="515" y="219" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>

    <text x="63" y="251" text-anchor="middle">5</text>
    <text x="128" y="251" text-anchor="middle">(1, 2)</text>
    <text x="198" y="251" text-anchor="middle">1</text>
    <text x="238" y="251" font-size="10.5">非负 → j = 3</text>
    <text x="515" y="251" text-anchor="middle">6</text>

    <text x="63" y="283" text-anchor="middle">6</text>
    <text x="128" y="283" text-anchor="middle">(1, 3)</text>
    <text x="198" y="283" text-anchor="middle" fill="#b85450">−1</text>
    <text x="238" y="283" font-size="10.5">负数 → ans += 1，i = 0</text>
    <text x="515" y="283" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>

    <text x="63" y="315" text-anchor="middle">7</text>
    <text x="128" y="315" text-anchor="middle">(0, 3)</text>
    <text x="198" y="315" text-anchor="middle" fill="#b85450">−1</text>
    <text x="238" y="315" font-size="10.5">负数 → ans += 1，i = −1</text>
    <text x="515" y="315" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
  </g>

  <text x="300" y="352" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">i 降到 −1 时循环结束：4 + 2 + 1 + 1 = 8，恰好是 4 次「负数」分支的累加</text>
  <text x="300" y="374" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">粉色行 = 走 i−− 分支，一次结算本行剩余整段</text>
  <text x="300" y="396" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">白色行 = 走 j++ 分支，本列上方格子被整列跳过</text>
</svg>
