<svg xmlns="http://www.w3.org/2000/svg" width="560" height="626" viewBox="0 0 560 626" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="626" fill="#fdfcf7"/>
  <text x="280" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 全程走查：Router(3)，limit = 3（add = addPacket）</text>
  <path d="M 80 38 Q 280 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 操作表 -->
  <rect x="28" y="211" width="504" height="27" fill="#fef6e6" filter="url(#sk)"/>
  <rect x="28" y="292" width="504" height="27" fill="#e8f0fa" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="26" y="48" width="508" height="271" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  </g>
  <line x1="26" y1="76" x2="534" y2="76" stroke="#8a8a8a" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="26" y1="103" x2="534" y2="103" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <line x1="26" y1="130" x2="534" y2="130" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <line x1="26" y1="157" x2="534" y2="157" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <line x1="26" y1="184" x2="534" y2="184" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <line x1="26" y1="211" x2="534" y2="211" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <line x1="26" y1="238" x2="534" y2="238" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <line x1="26" y1="265" x2="534" y2="265" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <line x1="26" y1="292" x2="534" y2="292" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <line x1="26" y1="319" x2="534" y2="319" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <line x1="236" y1="48" x2="236" y2="319" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <line x1="298" y1="48" x2="298" y2="319" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>

  <text x="38" y="67" font-size="11.5" font-weight="bold" fill="#2b2b2b">操作</text>
  <text x="267" y="67" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">返回</text>
  <text x="310" y="67" font-size="11.5" font-weight="bold" fill="#2b2b2b">说明</text>

  <text x="38" y="94" font-size="11" fill="#333">Router(3)</text>
  <text x="267" y="94" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="310" y="94" font-size="10.5" fill="#333">初始化，内存上限 3</text>

  <text x="38" y="121" font-size="11" fill="#333">add(1,4,90)</text>
  <text x="267" y="121" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true</text>
  <text x="310" y="121" font-size="10.5" fill="#333">入库</text>

  <text x="38" y="148" font-size="11" fill="#333">add(2,5,90)</text>
  <text x="267" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true</text>
  <text x="310" y="148" font-size="10.5" fill="#333">入库</text>

  <text x="38" y="175" font-size="11" fill="#333">add(1,4,90)</text>
  <text x="267" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">false</text>
  <text x="310" y="175" font-size="10.5" fill="#333">集合命中：重复，不淘汰</text>

  <text x="38" y="202" font-size="11" fill="#333">add(3,5,95)</text>
  <text x="267" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true</text>
  <text x="310" y="202" font-size="10.5" fill="#333">存满 3 个（= limit）</text>

  <text x="38" y="229" font-size="11" fill="#333">add(4,5,105)</text>
  <text x="267" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true</text>
  <text x="310" y="229" font-size="10.5" fill="#7a5415">满 → 先销 (1,4,90) 再登记</text>

  <text x="38" y="256" font-size="11" fill="#333">forward()</text>
  <text x="267" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5f9e">[2,5,90]</text>
  <text x="310" y="256" font-size="10.5" fill="#333">FIFO 弹队首，三本账同步销</text>

  <text x="38" y="283" font-size="11" fill="#333">add(5,2,110)</text>
  <text x="267" y="283" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true</text>
  <text x="310" y="283" font-size="10.5" fill="#333">入库</text>

  <text x="38" y="310" font-size="11" fill="#333">getCount(5,100,110)</text>
  <text x="267" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5f9e">1</text>
  <text x="310" y="310" font-size="10.5" fill="#2b5f9e">桶5 有效 [95,105] ∩ [100,110]</text>

  <!-- 快照卡 ① -->
  <g filter="url(#sk)">
    <rect x="26" y="344" width="158" height="196" rx="10" fill="#ffffff" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="105" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">⑤ 后：满员</text>
  <text x="40" y="390" font-size="10.5" fill="#333">queue:</text>
  <text x="48" y="408" font-size="10.5" fill="#b85450">(1,4,90) ← 最旧</text>
  <text x="48" y="426" font-size="10.5" fill="#333">(2,5,90)</text>
  <text x="48" y="444" font-size="10.5" fill="#333">(3,5,95)</text>
  <text x="40" y="468" font-size="10.5" fill="#333">桶5: [90, 95]</text>
  <text x="40" y="488" font-size="10.5" fill="#333">set: 3 项</text>
  <text x="40" y="516" font-size="10.5" font-weight="bold" fill="#7a5415">再来一个 → 淘汰最旧</text>
  <text x="40" y="532" font-size="10.5" fill="#7a5415">腾位给新包</text>

  <!-- 快照卡 ② -->
  <g filter="url(#sk)">
    <rect x="196" y="344" width="158" height="196" rx="10" fill="#ffffff" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="275" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">⑥ 后：销账+登记</text>
  <text x="210" y="390" font-size="10.5" fill="#333">queue:</text>
  <text x="218" y="408" font-size="10.5" fill="#333">(2,5,90)</text>
  <text x="218" y="426" font-size="10.5" fill="#333">(3,5,95)</text>
  <text x="218" y="444" font-size="10.5" fill="#333">(4,5,105)</text>
  <text x="210" y="468" font-size="10.5" fill="#333">桶4: 空（90 已销账）</text>
  <text x="210" y="488" font-size="10.5" fill="#333">桶5: [90, 95, 105]</text>
  <text x="210" y="516" font-size="10.5" font-weight="bold" fill="#7a5415">(1,4,90) 已让位出局</text>
  <text x="210" y="532" font-size="10.5" fill="#7a5415">set / 桶同步更新</text>

  <!-- 快照卡 ③ -->
  <g filter="url(#sk)">
    <rect x="366" y="344" width="168" height="196" rx="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="450" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5f9e">⑨ getCount(5,100,110)</text>
  <text x="380" y="390" font-size="10.5" fill="#333">桶5 有效区间:</text>
  <text x="388" y="408" font-size="10.5" fill="#333">[95, 105]</text>
  <text x="380" y="426" font-size="10.5" fill="#888">（90 已随 forward 销账）</text>
  <text x="380" y="452" font-size="10.5" fill="#333">在 [100, 110] 上二分：</text>
  <text x="388" y="474" font-size="10.5" fill="#333">95 ×      105 ✓</text>
  <text x="380" y="502" font-size="11" font-weight="bold" fill="#2b5f9e">命中 1 个 → 返回 1</text>
  <text x="380" y="524" font-size="10" fill="#4a8edb">lb(100) → 下标 1</text>
  <text x="380" y="538" font-size="10" fill="#4a8edb">ub(110) → 下标 2，2−1=1</text>

  <!-- 底注 -->
  <g filter="url(#sk)">
    <rect x="26" y="556" width="508" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="280" y="578" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04040">两处顺序陷阱：④ 重复包直接返回 false，不触发淘汰；⑥ 满员插入 = 先销最旧、再登新账</text>
  <text x="280" y="600" text-anchor="middle" font-size="11.5" fill="#a04040">⑨ 的 90 已不在存：桶只看「当前存储」，销账若不同步进桶，这里会错算成 2</text>
</svg>
