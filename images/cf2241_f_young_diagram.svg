<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">杨图模型：一格 = 一个逆序对，删子序列 = 删行 + 删列</text>
  <path d="M 78 42 Q 380 49 682 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ============== 左：必败态，2x2 拼块 ============== -->
  <text x="48" y="68" font-size="13" font-weight="bold" fill="#3f6b32" filter="url(#rough2)">① 必败态：整张图是 2×2 块的并</text>
  <text x="48" y="88" font-size="12" fill="#555" filter="url(#rough2)">s = 111100，行 = 0（每行长度 = 它前面 1 的个数）</text>

  <!-- 2 行 x 4 列，格子 32x28，原点 (52,100) -->
  <g filter="url(#rough2)">
    <rect x="52" y="100" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="84" y="100" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="116" y="100" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="148" y="100" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="52" y="128" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="84" y="128" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="116" y="128" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="148" y="128" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <!-- 两个 2x2 块 -->
  <rect x="48" y="96" width="64" height="64" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <rect x="120" y="96" width="64" height="64" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="84" y="182" text-anchor="middle" font-size="12" fill="#3f6b32" filter="url(#rough2)">2×2 块</text>
  <text x="148" y="182" text-anchor="middle" font-size="12" fill="#3f6b32" filter="url(#rough2)">2×2 块</text>

  <text x="48" y="206" font-size="12" fill="#333" filter="url(#rough2)">c = [4,4]：行长全偶、长度重复偶数次 ⇒ Bob 必胜</text>

  <!-- 行/列 轴注释 -->
  <text x="212" y="104" font-size="11.5" fill="#446688" filter="url(#rough2)">← 列 = 1</text>
  <text x="212" y="122" font-size="11.5" fill="#446688" filter="url(#rough2)">← 列 = 1</text>
  <text x="52" y="238" font-size="11.5" fill="#446688" filter="url(#rough2)">两行 = 两个 0；|D| = 8 格 = 8 个逆序对</text>

  <!-- ============== 右：一步删空 ============== -->
  <text x="420" y="68" font-size="13" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">② 非必败态：一步就能删空</text>
  <text x="420" y="88" font-size="12" fill="#555" filter="url(#rough2)">s = 11100，c = [3,3]（行长是奇数）</text>

  <g filter="url(#rough2)">
    <rect x="420" y="100" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="450" y="100" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="480" y="100" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="420" y="128" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="450" y="128" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="480" y="128" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <!-- 删除列：红色竖虚线 -->
  <path d="M 435 96 L 435 160" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 465 96 L 465 160" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 495 96 L 495 160" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="524" y="112" font-size="11.5" fill="#8a2a26" filter="url(#rough2)">删全部列 C</text>
  <text x="524" y="130" font-size="11.5" fill="#8a2a26" filter="url(#rough2)">删一行 R</text>
  <text x="524" y="148" font-size="11.5" fill="#8a2a26" filter="url(#rough2)">交格数 = 3（奇）</text>

  <path d="M 452 168 Q 452 190 452 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="414" y="204" width="76" height="42" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="452" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">∅</text>
  <text x="502" y="230" font-size="11.5" fill="#8a2a26" filter="url(#rough2)">空图 = 必败态</text>

  <!-- ============== 底部：计数恒等式 ============== -->
  <rect x="40" y="262" width="680" height="146" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="286" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么“拼块态”一定输？用一条计数恒等式</text>
  <text x="58" y="310" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">N = a + b + |D'| − |D|　（N = 删除行∩删除列 里的格子数，也就是这一步删掉的逆序对数）</text>
  <text x="58" y="332" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">D 是 2×2 块并 ⇒ 每行长偶、每列高偶 ⇒ a、b 都是偶数</text>
  <text x="58" y="354" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">若 D' 也是块并，则 |D|、|D'| 都是 4 的倍数 ⇒ N 为偶数，与“合法步要求 N 奇”矛盾</text>
  <text x="58" y="380" font-size="12.5" fill="#8a2a26" filter="url(#rough2)">反过来：非块并非空时，总能找到一组 R、C 使 N 为奇数并把图删空 ⇒ 归纳即得完整刻画</text>
</svg>
