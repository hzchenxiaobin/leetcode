<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3 走查：limit = −1，逐节点取“经过它的最大路径和”</text>
  <text x="280" y="43" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">原树 root = [1, 2, −3, −5, null, 4, null]，只有两条根-叶路径</text>

  <g font-size="11" text-anchor="middle" font-weight="bold">
    <rect filter="url(#rough2)" x="36" y="58" width="488" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text filter="url(#rough2)" x="82" y="78" fill="#3a4a66">节点</text>
    <text filter="url(#rough2)" x="240" y="78" fill="#3a4a66">经过它的根-叶路径和</text>
    <text filter="url(#rough2)" x="405" y="78" fill="#3a4a66">最大值</text>
    <text filter="url(#rough2)" x="490" y="78" fill="#3a4a66">动作</text>
  </g>

  <g font-size="11" text-anchor="middle">
    <rect filter="url(#rough2)" x="36" y="90" width="488" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text filter="url(#rough2)" x="82" y="112" fill="#333" font-weight="bold">1</text>
    <text filter="url(#rough2)" x="240" y="112" fill="#555">1+2−5 = −2 ｜ 1+(−3)+4 = 2</text>
    <text filter="url(#rough2)" x="405" y="112" fill="#3a5a30" font-weight="bold">2 ≥ −1</text>
    <text filter="url(#rough2)" x="490" y="112" fill="#3a5a30" font-weight="bold">保留</text>

    <rect filter="url(#rough2)" x="36" y="124" width="488" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text filter="url(#rough2)" x="82" y="146" fill="#333" font-weight="bold">2</text>
    <text filter="url(#rough2)" x="240" y="146" fill="#555">只有 1+2−5 = −2</text>
    <text filter="url(#rough2)" x="405" y="146" fill="#a04040" font-weight="bold">−2 &lt; −1</text>
    <text filter="url(#rough2)" x="490" y="146" fill="#a04040" font-weight="bold">删除</text>

    <rect filter="url(#rough2)" x="36" y="158" width="488" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text filter="url(#rough2)" x="82" y="180" fill="#333" font-weight="bold">−5</text>
    <text filter="url(#rough2)" x="240" y="180" fill="#555">只有 1+2−5 = −2</text>
    <text filter="url(#rough2)" x="405" y="180" fill="#a04040" font-weight="bold">−2 &lt; −1</text>
    <text filter="url(#rough2)" x="490" y="180" fill="#a04040" font-weight="bold">删除</text>

    <rect filter="url(#rough2)" x="36" y="192" width="488" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text filter="url(#rough2)" x="82" y="214" fill="#333" font-weight="bold">−3</text>
    <text filter="url(#rough2)" x="240" y="214" fill="#555">只有 1+(−3)+4 = 2</text>
    <text filter="url(#rough2)" x="405" y="214" fill="#3a5a30" font-weight="bold">2 ≥ −1</text>
    <text filter="url(#rough2)" x="490" y="214" fill="#3a5a30" font-weight="bold">保留</text>

    <rect filter="url(#rough2)" x="36" y="226" width="488" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text filter="url(#rough2)" x="82" y="248" fill="#333" font-weight="bold">4</text>
    <text filter="url(#rough2)" x="240" y="248" fill="#555">只有 1+(−3)+4 = 2</text>
    <text filter="url(#rough2)" x="405" y="248" fill="#3a5a30" font-weight="bold">2 ≥ −1</text>
    <text filter="url(#rough2)" x="490" y="248" fill="#3a5a30" font-weight="bold">保留</text>
  </g>

  <g font-size="10" fill="#666">
    <text filter="url(#rough2)" x="40" y="284">自底向上看：先删 −5，节点 2 随即失去唯一孩子；它自己的最大路径和 −2 也不足，于是同样被删。</text>
    <text filter="url(#rough2)" x="40" y="304">节点 −3、4 的路径和 2 ≥ −1，保留；根 1 还剩右侧路径，故根存活。</text>
  </g>

  <rect x="36" y="320" width="488" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">最终结果：root = [1, null, −3, 4]</text>

  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意等式边界：路径和恰好等于 limit 时节点充足，必须用 &lt; limit 判不足，不能写 ≤</text>
</svg>
