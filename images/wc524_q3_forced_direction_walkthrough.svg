<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fafafa"/>
  <text x="450" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：方向锁定 + 入度统计</text>

  <!-- 左：例 1 -->
  <text x="230" y="58" text-anchor="middle" font-size="13.5" fill="#446688" filter="url(#rough2)">例 1：唯一入度 0 → 根 = 3</text>

  <circle cx="210" cy="102" r="27" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <circle cx="210" cy="102" r="20" fill="#ffffff" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="107" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">W</text>
  <text x="168" y="107" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <circle cx="120" cy="192" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="197" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">R</text>
  <text x="86" y="197" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>

  <circle cx="300" cy="192" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="197" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">R</text>
  <text x="266" y="197" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>

  <circle cx="120" cy="278" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="283" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="86" y="283" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>

  <circle cx="300" cy="278" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="283" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="266" y="283" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <path d="M196,116 L136,174" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M224,116 L284,174" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M120,214 L120,254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M300,214 L300,254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="103" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">R=next(W)✓</text>
  <text x="322" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">R=next(W)✓</text>
  <text x="132" y="238" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">B=next(R)✓</text>
  <text x="312" y="238" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">B=next(R)✓</text>

  <!-- 入度表 -->
  <text x="230" y="318" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">入度表</text>
  <rect x="90" y="326" width="52" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="342" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">节点</text>
  <rect x="142" y="326" width="46" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="342" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <rect x="188" y="326" width="46" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="211" y="342" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="234" y="326" width="46" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="257" y="342" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="278" y="326" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="301" y="342" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="324" y="326" width="46" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="347" y="342" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>

  <rect x="90" y="350" width="52" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="366" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">入度</text>
  <rect x="142" y="350" width="46" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="366" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="188" y="350" width="46" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="211" y="366" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="234" y="350" width="46" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="257" y="366" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="278" y="350" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="301" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="324" y="350" width="46" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="347" y="366" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <text x="230" y="402" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">唯一入度 0 是 3，deg(3)=2 ≤ 2 → 返回 3</text>

  <!-- 右：例 2 -->
  <text x="670" y="58" text-anchor="middle" font-size="13.5" fill="#446688" filter="url(#rough2)">例 2：两个入度 0 → 无解</text>

  <circle cx="500" cy="112" r="27" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <circle cx="500" cy="112" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="117" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">R</text>
  <text x="466" y="117" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="500" y="76" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">入度 0</text>

  <circle cx="620" cy="172" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="620" y="177" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="586" y="177" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>

  <circle cx="740" cy="112" r="27" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <circle cx="740" cy="112" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="740" y="117" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">R</text>
  <text x="706" y="117" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="740" y="76" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">入度 0</text>

  <circle cx="860" cy="172" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="860" y="177" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="826" y="177" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>

  <path d="M513,123 L604,160" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M727,123 L636,160" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M753,123 L847,160" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="620" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">入度 2（两条父边！）</text>
  <text x="860" y="212" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">入度 1</text>

  <rect x="480" y="236" width="400" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="680" y="258" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">入度为 0 的点有两个（0 与 2），节点 1 被两条边指向</text>
  <text x="680" y="278" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">无论选谁当根，总有边指向根 → 返回 −1</text>

  <!-- 底部：自造陷阱 -->
  <rect x="60" y="388" width="780" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="405" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">自造陷阱：星形 [[0,1],[0,2],[0,3]] + "WRRR"：唯一入度 0 是中心 0，但 deg(0)=3</text>
  <text x="450" y="422" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">根的子节点数 = 度数 &gt; 2，违反二叉性 → 返回 −1</text>
</svg>
