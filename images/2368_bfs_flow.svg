<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：标记受限 → 建图 → BFS 一把梭</text>
  <path d="M 170 40 Q 340 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="270" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="175" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 标记受限（O(1) 查询）</text>
  <text x="175" y="104" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">for v in restricted: ban[v] = true</text>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="370" y="62" width="270" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="505" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">② 建邻接表（无向双向）</text>
  <text x="505" y="104" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">for (a,b) in edges: g[a]↔g[b]</text>

  <!-- arrows to step 3 -->
  <g filter="url(#sk)">
    <path d="M 175 118 Q 210 140 265 146" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 505 118 Q 470 140 415 146" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="205" y="150" width="270" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="340" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">③ 初始化</text>
  <text x="340" y="192" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">q = [0]，vis[0] = true，ans = 0</text>

  <g filter="url(#sk)">
    <path d="M 340 206 L 340 238" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- step 4: BFS main loop -->
  <g filter="url(#sk)">
    <rect x="40" y="242" width="600" height="172" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="340" y="266" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">④ BFS 主循环（队列 q 非空时重复）</text>

  <text x="60" y="296" font-size="12" fill="#444" filter="url(#sk)">u = q 出队 → ans += 1</text>
  <text x="60" y="324" font-size="12" fill="#444" filter="url(#sk)">遍历 u 的每条边 → 邻居 v</text>
  <text x="60" y="386" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">vis[v] = true，q.push(v)</text>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="470,280 556,332 470,384 384,332" fill="#fdf2f5" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="470" y="328" text-anchor="middle" font-size="11.5" fill="#a04040" filter="url(#sk)">ban[v] 或</text>
  <text x="470" y="344" text-anchor="middle" font-size="11.5" fill="#a04040" filter="url(#sk)">vis[v] ？</text>

  <!-- yes branch: skip -->
  <g filter="url(#sk)">
    <path d="M 470 278 L 470 256" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="500" y="256" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">是：跳过 v</text>

  <!-- no branch: enqueue -->
  <g filter="url(#sk)">
    <path d="M 382 332 L 330 332 Q 300 332 300 360 L 300 368" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="348" y="324" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">否</text>

  <!-- loop back arrow -->
  <g filter="url(#sk)">
    <path d="M 642 326 Q 662 326 662 292 Q 662 244 620 242" stroke="#a06a10" stroke-width="1.8" fill="none" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  </g>
  <text x="655" y="360" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#sk)">q 非空 ↺</text>

  <g filter="url(#sk)">
    <path d="M 340 414 L 340 446" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="356" y="434" font-size="11" fill="#888" filter="url(#sk)">q 空</text>

  <!-- step 5 -->
  <g filter="url(#sk)">
    <rect x="245" y="450" width="190" height="50" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="340" y="480" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">⑤ 返回 ans ✓</text>

  <text x="340" y="512" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">O(n) 时间 / O(n) 空间：每个点、每条边各处理一次</text>
</svg>
