<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：子串频次差 = 两端前缀差 D[r] − D[l]，奇偶只看端点</text>
  <path d="M 260 42 Q 470 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 面板一：前缀频次与区间分解 ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="66" width="840" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="70" y="90" font-size="13" font-weight="bold" fill="#2f4f6f">前缀计数：pre_c[i] = s[0..i−1] 中字符 c 的个数 → 子串 (l, r] 的频次 = 前缀差</text>
  <g filter="url(#sk)">
    <rect x="90" y="104" width="40" height="36" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
    <rect x="150" y="104" width="40" height="36" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
    <rect x="210" y="104" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="270" y="104" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="330" y="104" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="390" y="104" width="40" height="36" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="110" y="127" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">x</text>
  <text x="170" y="127" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">y</text>
  <text x="230" y="127" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">b</text>
  <text x="290" y="127" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">a</text>
  <text x="350" y="127" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">a</text>
  <text x="410" y="127" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">x</text>
  <path d="M 172 152 Q 230 176 288 152" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="230" y="182" text-anchor="middle" font-size="11.5" fill="#2e6e2e">子串 (l, r]：freq_c = pre_c[r] − pre_c[l]</text>
  <text x="500" y="120" font-size="12.5" fill="#444">固定字符对 (a, b) 后，目标函数完全拆开：</text>
  <text x="500" y="145" font-size="14" fill="#2f4f6f" font-weight="bold">freq_a − freq_b = D[r] − D[l]</text>
  <text x="500" y="168" font-size="12.5" fill="#444">其中 D[i] := pre_a[i] − pre_b[i] 只依赖单个端点</text>
  <text x="500" y="196" font-size="12.5" fill="#a04038" font-weight="bold">固定 r → 第一项是常数 → 只需在合法 l 中取 D[l] 最小！</text>

  <!-- ===== 面板二：D 值折线 ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="232" width="840" height="170" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="70" y="256" font-size="13" font-weight="bold" fill="#8a6515">D[i] 序列（示例 s = “1122211”, a=‘2’, b=‘1’）：要 D[r] 高、D[l] 低</text>
  <g filter="url(#sk)">
    <path d="M 110 360 L 860 360" stroke="#bbb" stroke-width="1.2"/>
    <path d="M 110 310 L 860 310" stroke="#e0d6bd" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 110 260 L 860 260" stroke="#e0d6bd" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
  <text x="95" y="365" font-size="10" fill="#999">0</text>
  <text x="95" y="315" font-size="10" fill="#999">+1</text>
  <text x="95" y="265" font-size="10" fill="#999">+2</text>
  <!-- points i=0..7: D = 0,-1,-2,-1,0,1,0,-1  -> y = 360 - D*25 -->
  <g filter="url(#sk)">
    <circle cx="150" cy="360" r="5" fill="#446688"/>
    <circle cx="250" cy="385" r="5" fill="#446688"/>
    <circle cx="350" cy="410" r="6" fill="#b85450"/>
    <circle cx="450" cy="385" r="5" fill="#446688"/>
    <circle cx="550" cy="360" r="5" fill="#446688"/>
    <circle cx="650" cy="335" r="6" fill="#b85450"/>
    <circle cx="750" cy="360" r="5" fill="#446688"/>
    <circle cx="830" cy="385" r="5" fill="#446688"/>
    <path d="M 150 360 L 250 385 L 350 410 L 450 385 L 550 360 L 650 335 L 750 360 L 830 385" stroke="#c9b98a" stroke-width="1.6" fill="none"/>
  </g>
  <text x="150" y="340" text-anchor="middle" font-size="10.5" fill="#666">i=0</text>
  <text x="250" y="404" text-anchor="middle" font-size="10.5" fill="#666">1</text>
  <text x="350" y="430" text-anchor="middle" font-size="10.5" fill="#a04038" font-weight="bold">l=2 ←最低</text>
  <text x="650" y="316" text-anchor="middle" font-size="10.5" fill="#a04038" font-weight="bold">r=5 ←最高</text>
  <path d="M 358 402 Q 500 250 642 340" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="500" y="300" text-anchor="middle" font-size="13" fill="#a04038" font-weight="bold">D[r] − D[l] = 1 − (−2) = 3？</text>
  <text x="500" y="284" text-anchor="middle" font-size="11" fill="#a04038">—— 还得先过「奇偶 + 长度 + b≠0」三关（见右图与下图）</text>

  <!-- ===== 面板三：4 个奇偶桶 ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="418" width="520" height="200" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="70" y="442" font-size="13" font-weight="bold" fill="#2e6e2e">左端点只看 4 种奇偶状态：(pre_a[l] mod 2, pre_b[l] mod 2)</text>
  <g filter="url(#sk)">
    <rect x="180" y="456" width="180" height="70" rx="6" fill="#f0f8f0" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="370" y="456" width="180" height="70" rx="6" fill="#f0f8f0" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="180" y="532" width="180" height="70" rx="6" fill="#f0f8f0" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="370" y="532" width="180" height="70" rx="6" fill="#f0f8f0" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="270" y="484" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">桶 (0,0)</text>
  <text x="270" y="508" text-anchor="middle" font-size="11" fill="#555">min D[l]</text>
  <text x="460" y="484" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">桶 (0,1)</text>
  <text x="460" y="508" text-anchor="middle" font-size="11" fill="#555">min D[l]</text>
  <text x="270" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">桶 (1,0)</text>
  <text x="270" y="584" text-anchor="middle" font-size="11" fill="#555">min D[l]</text>
  <text x="460" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">桶 (1,1)</text>
  <text x="460" y="584" text-anchor="middle" font-size="11" fill="#555">min D[l]</text>
  <text x="130" y="478" font-size="10.5" fill="#888" text-anchor="middle">pre_b 偶</text>
  <text x="130" y="554" font-size="10.5" fill="#888" text-anchor="middle">pre_b 奇</text>
  <text x="270" y="450" text-anchor="middle" font-size="10.5" fill="#888">pre_a 偶</text>
  <text x="460" y="450" text-anchor="middle" font-size="10.5" fill="#888">pre_a 奇</text>

  <!-- ===== 面板四：查询目标 ===== -->
  <g filter="url(#sk)">
    <rect x="590" y="418" width="300" height="200" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="610" y="442" font-size="13" font-weight="bold" fill="#a04038">查询目标状态由 r 反推</text>
  <text x="610" y="470" font-size="12" fill="#444">freq_a 奇 ⟺ pre_a[l] 与 pre_a[r] 奇偶不同</text>
  <text x="610" y="492" font-size="12.5" fill="#a04038" font-weight="bold">→ a 的奇偶要「翻转」⊕1</text>
  <text x="610" y="520" font-size="12" fill="#444">freq_b 偶 ⟺ pre_b[l] 与 pre_b[r] 奇偶相同</text>
  <text x="610" y="542" font-size="12.5" fill="#a04038" font-weight="bold">→ b 的奇偶要「保持」</text>
  <text x="610" y="572" font-size="11.5" fill="#444">target = ( pre_a[r]⊕1 , pre_b[r] mod 2 )</text>
  <text x="610" y="596" font-size="11.5" fill="#a04038">候选 = (pre_a[r] − pre_b[r]) − 桶[target]</text>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="628" width="840" height="26" rx="10" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.2"/>
  </g>
  <text x="470" y="646" text-anchor="middle" font-size="13" fill="#5a3a7a" font-weight="bold">字符对 (a,b) 只有 5×4 = 20 种 → 每对一趟 O(n) 扫描，桶里查最小 D[l] 即可</text>
</svg>
