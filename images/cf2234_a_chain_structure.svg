<svg xmlns="http://www.w3.org/2000/svg" width="580" height="360" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">欧几里得序列：从 a₂ 起严格递减</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">起点 x = 13, y = 8，长度 k = 6 的一条链</text>

  <text x="50" y="80" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a₁ = x</text>
  <text x="142" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a₂ = y</text>
  <text x="234" y="80" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">a₃</text>
  <text x="326" y="80" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">a₄</text>
  <text x="418" y="80" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">a₅</text>
  <text x="510" y="80" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">a₆</text>

  <rect x="20" y="86" width="60" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="50" y="114" text-anchor="middle" font-size="18" fill="#8a3a36" filter="url(#rough2)">13</text>
  <rect x="112" y="86" width="60" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="142" y="114" text-anchor="middle" font-size="18" fill="#3c6130" filter="url(#rough2)">8</text>
  <rect x="204" y="86" width="60" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="234" y="114" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">5</text>
  <rect x="296" y="86" width="60" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="326" y="114" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="388" y="86" width="60" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="418" y="114" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">2</text>
  <rect x="480" y="86" width="60" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="114" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">1</text>

  <path d="M83,108 L108,108" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M175,108 L200,108" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M267,108 L292,108" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M359,108 L384,108" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M451,108 L476,108" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="290" y="156" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">13 mod 8 = 5　　8 mod 5 = 3　　5 mod 3 = 2　　3 mod 2 = 1</text>

  <rect x="30" y="176" width="520" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="200" font-size="11.5" fill="#3c6130" filter="url(#rough2)">余数恒小于除数：a[i+2] = a[i] mod a[i+1] &lt; a[i+1]</text>
  <text x="50" y="222" font-size="11.5" fill="#3c6130" filter="url(#rough2)">于是 a₂ &gt; a₃ &gt; … &gt; a_k —— 第二项之后严格递减</text>

  <rect x="30" y="246" width="520" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="270" font-size="11.5" fill="#33506b" filter="url(#rough2)">定义只约束 a₁ ≥ a₂（x ≥ y），而 a₁ 必定是全体最大值</text>
  <text x="50" y="294" font-size="11.5" fill="#33506b" filter="url(#rough2)">n ≥ 3 时若 a₁ = a₂，则 a₃ = 0，不是正整数 ⇒ 必有 a₁ &gt; a₂</text>

  <text x="290" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 降序排列是唯一候选顺序，校验一遍即可</text>
  <text x="290" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 2 是唯一的例外：只有 a₁ ≥ a₂ 的约束，两数相等也合法</text>
</svg>
