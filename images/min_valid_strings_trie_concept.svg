<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">Trie：路径存在 ⟺ 有效前缀（无需 isEnd）</text>
  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">words = [abc, aaaaa, bcdef] 全部插入</text>

  <!-- 普通边 -->
  <path d="M316,96 Q362,118 386,136" fill="none" stroke="#888899" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M230,152 Q244,176 252,190" fill="none" stroke="#888899" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M400,154 Q418,176 428,192" fill="none" stroke="#888899" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M255,216 L255,246" fill="none" stroke="#888899" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M432,216 L432,246" fill="none" stroke="#888899" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 高亮匹配路径 root→a→ab→abc -->
  <path d="M296,99 Q252,122 224,138" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M208,154 Q180,178 160,192" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M148,210 Q130,234 124,246" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 节点 -->
  <ellipse cx="300" cy="92" rx="24" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ε</text>

  <ellipse cx="218" cy="146" rx="17" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="218" y="151" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">a</text>

  <ellipse cx="392" cy="146" rx="17" ry="14" fill="#fafafa" stroke="#888899" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>

  <ellipse cx="155" cy="202" rx="20" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="155" y="207" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">ab</text>

  <ellipse cx="255" cy="202" rx="17" ry="14" fill="#fafafa" stroke="#888899" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">aa</text>

  <ellipse cx="432" cy="202" rx="17" ry="14" fill="#fafafa" stroke="#888899" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">bc</text>

  <ellipse cx="122" cy="258" rx="23" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="122" y="263" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">abc</text>

  <ellipse cx="255" cy="258" rx="20" ry="14" fill="#fafafa" stroke="#888899" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">aaa</text>

  <ellipse cx="432" cy="258" rx="20" ry="14" fill="#fafafa" stroke="#888899" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">bcd</text>

  <text x="255" y="284" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">⋯ aaaaa（5 层）</text>
  <text x="432" y="284" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">⋯ bcdef（6 层）</text>

  <!-- 高亮节点的有效长度标注 -->
  <text x="243" y="138" font-size="10" fill="#4a7a3a" filter="url(#rough2)">长度 1</text>
  <text x="183" y="194" font-size="10" fill="#4a7a3a" filter="url(#rough2)">长度 2</text>
  <text x="151" y="250" font-size="10" fill="#4a7a3a" filter="url(#rough2)">长度 3</text>

  <!-- 失配节点 -->
  <path d="M122,272 L122,292" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="122" cy="306" rx="16" ry="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="122" y="311" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">d</text>
  <text x="148" y="311" font-size="11" fill="#b85450" filter="url(#rough2)">失配即停：abcd 不是任何前缀</text>

  <!-- 底部说明框 -->
  <rect x="28" y="320" width="464" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#6b5220" filter="url(#rough2)">从起点 i 沿 Trie 走 target[i..]：每经过一个节点，就得到一个有效长度</text>
  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#6b5220" filter="url(#rough2)">失配即停——一趟 O(mn[i]) 拿到从 i 出发的全部有效长度</text>
</svg>
