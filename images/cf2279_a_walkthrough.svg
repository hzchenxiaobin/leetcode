<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="780" height="520" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：a = [8, 3, 9, 9, 9, 8]（官方样例第 6 组）</text>
  <path d="M 120 38 Q 390 46 660 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- a 数组 -->
  <text x="186" y="71" text-anchor="end" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="200" y="44" width="54" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">8</text>
  <rect x="266" y="44" width="54" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="293" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#8f3b38" filter="url(#rough2)">3</text>
  <rect x="332" y="44" width="54" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="359" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#8f3b38" filter="url(#rough2)">9</text>
  <rect x="398" y="44" width="54" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">9</text>
  <rect x="464" y="44" width="54" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="491" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">9</text>
  <rect x="530" y="44" width="54" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="557" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">8</text>

  <!-- d 数组 -->
  <text x="260" y="92" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[1]</text>
  <text x="326" y="92" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">d[2]</text>
  <text x="392" y="92" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[3]</text>
  <text x="458" y="92" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[4]</text>
  <text x="524" y="92" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[5]</text>

  <rect x="237" y="98" width="46" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">5</text>
  <rect x="303" y="98" width="46" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="326" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3b38" filter="url(#rough2)">6</text>
  <rect x="369" y="98" width="46" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="115" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="435" y="98" width="46" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="115" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="501" y="98" width="46" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="524" y="115" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1</text>

  <text x="390" y="146" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">M = 6，p = 2（d[2] = |3 − 9| = 6 是唯一最大）；只需枚举两个家族</text>

  <!-- 家族 A 表 -->
  <rect x="44" y="158" width="692" height="146" rx="8" fill="#f4f8ff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="178" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">家族 A：l−1 = p = 2，即 l = 3；新左端 = |a[2] − 2·a[r]|，新右端 = |2·a[3] − a[r+1]|</text>
  <text x="74" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">r</text>
  <text x="150" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">保留区 max</text>
  <text x="262" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">2·段内 max</text>
  <text x="372" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">新左端</text>
  <text x="492" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">新右端</text>
  <text x="622" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">结果</text>
  <path d="M 62 207 L 718 207" stroke="#8fa8c4" stroke-width="1.1" filter="url(#rough2)"/>

  <text x="74" y="226" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="150" y="226" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="262" y="226" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="372" y="226" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="492" y="226" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="622" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">15</text>

  <text x="74" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="150" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="262" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="372" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="492" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="622" y="248" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">15</text>

  <text x="74" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="150" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="262" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="372" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="492" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="622" y="270" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">15</text>

  <text x="74" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="150" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="262" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="372" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">13</text>
  <text x="492" y="292" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="622" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">13</text>

  <!-- 家族 B 表 -->
  <rect x="44" y="314" width="692" height="102" rx="8" fill="#f2faf3" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="334" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">家族 B：r = p = 2；新左端 = |a[t] − 2·a[2]|，新右端 = |2·a[t+1] − a[3]|</text>
  <text x="74" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">t = l−1</text>
  <text x="150" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">保留区 max</text>
  <text x="262" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2·段内 max</text>
  <text x="372" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">新左端</text>
  <text x="492" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">新右端</text>
  <text x="622" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">结果</text>
  <path d="M 62 361 L 718 361" stroke="#9dbf94" stroke-width="1.1" filter="url(#rough2)"/>

  <rect x="52" y="366" width="676" height="22" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="150" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="262" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="372" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="492" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="622" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6a22" filter="url(#rough2)">3 ★</text>

  <text x="74" y="406" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="150" y="406" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="262" y="406" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="372" y="406" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="492" y="406" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="622" y="406" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">10</text>

  <!-- 结论 -->
  <rect x="20" y="428" width="740" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="452" font-size="12" fill="#8a6015" filter="url(#rough2)">家族 A 最好 13，家族 B 最好 3（t = 1，即 l = r = 2，把 a[2] = 3 翻倍成 6）</text>
  <text x="36" y="474" font-size="12" fill="#8a6015" filter="url(#rough2)">答案 = min{ 6（不操作）, 13, 3 } = 3；验证：[8,6,9,9,9,8] 的相邻差为 2, 3, 0, 0, 1，最大 3 ✓</text>
  <text x="36" y="496" font-size="11.5" fill="#a3762a" filter="url(#rough2)">注意段内 gap 会被翻倍：这就是长段在本题里通常反而更差的原因</text>
</svg>
