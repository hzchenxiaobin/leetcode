<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">统计被覆盖的建筑：同 x 连成水平线管左右，同 y 连成竖直线管上下</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左侧：示例 1 十字网格 ===== -->
  <text x="64" y="62" font-size="12" font-weight="bold" fill="#446688">示例 1（n = 3 十字）：只有 (2,2) 被覆盖</text>

  <text x="94" y="78" text-anchor="middle" font-size="10.5" fill="#888">y=1</text>
  <text x="154" y="78" text-anchor="middle" font-size="10.5" fill="#888">y=2</text>
  <text x="214" y="78" text-anchor="middle" font-size="10.5" fill="#888">y=3</text>
  <text x="56" y="118" text-anchor="end" font-size="10.5" fill="#888">x=1</text>
  <text x="56" y="178" text-anchor="end" font-size="10.5" fill="#888">x=2</text>
  <text x="56" y="238" text-anchor="end" font-size="10.5" fill="#888">x=3</text>

  <g filter="url(#sk)"><rect x="64" y="144" width="180" height="60" fill="#e6f4ea" opacity="0.65"/></g>
  <g filter="url(#sk)"><rect x="124" y="84" width="60" height="180" fill="#e8f0fe" opacity="0.6"/></g>

  <g filter="url(#sk)"><rect x="64" y="84" width="180" height="180" fill="none" stroke="#c9c9c9" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 124 84 V 264 M 184 84 V 264 M 64 144 H 244 M 64 204 H 244" stroke="#c9c9c9" stroke-width="1" fill="none"/></g>

  <g filter="url(#sk)"><rect x="134" y="99" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="154" y="118" text-anchor="middle" font-size="10" fill="#2b5b84">(1,2)</text>

  <g filter="url(#sk)"><rect x="74" y="159" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="94" y="178" text-anchor="middle" font-size="10" fill="#2b5b84">(2,1)</text>

  <g filter="url(#sk)"><rect x="134" y="159" width="40" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="154" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#b07818">(2,2)</text>

  <g filter="url(#sk)"><rect x="194" y="159" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="214" y="178" text-anchor="middle" font-size="10" fill="#2b5b84">(2,3)</text>

  <g filter="url(#sk)"><rect x="134" y="219" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="154" y="238" text-anchor="middle" font-size="10" fill="#2b5b84">(3,2)</text>

  <g filter="url(#sk)"><path d="M 154 156 L 154 133" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 154 192 L 154 215" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 131 174 L 117 174" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 175 174 L 191 174" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="163" y="149" font-size="10.5" font-weight="bold" fill="#4a7a3a">上</text>
  <text x="163" y="209" font-size="10.5" font-weight="bold" fill="#4a7a3a">下</text>
  <text x="116" y="166" font-size="10.5" font-weight="bold" fill="#4a7a3a">左</text>
  <text x="183" y="166" font-size="10.5" font-weight="bold" fill="#4a7a3a">右</text>

  <text x="64" y="286" font-size="10.5" fill="#2e6e2e">绿带：同 x = 2 连成水平线 → 管左 / 右</text>
  <text x="64" y="304" font-size="10.5" fill="#2b6e9e">蓝带：同 y = 2 连成竖直线 → 管上 / 下</text>

  <!-- ===== 右侧：两个分组桶 ===== -->
  <g filter="url(#sk)">
    <rect x="320" y="92" width="290" height="98" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="335" y="114" font-size="12.5" font-weight="bold" fill="#2e6e2e">同 x = 2 组：y ∈ {1, 2, 3}</text>
  <g filter="url(#sk)"><rect x="335" y="124" width="26" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="348" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">1</text>
  <g filter="url(#sk)"><rect x="367" y="124" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="380" y="140" text-anchor="middle" font-size="11" fill="#2b5b84">2</text>
  <g filter="url(#sk)"><rect x="399" y="124" width="26" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="412" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">3</text>
  <text x="348" y="158" text-anchor="middle" font-size="9" fill="#b07818">min</text>
  <text x="412" y="158" text-anchor="middle" font-size="9" fill="#b07818">max</text>
  <text x="335" y="164" font-size="10.5" fill="#444">rowMin[2] = 1，rowMax[2] = 3（组内 y 的极值）</text>
  <text x="335" y="182" font-size="11.5" font-weight="bold" fill="#2e6e2e">左右都有邻居 ⇔ 1 &lt; y &lt; 3（严格夹逼）</text>

  <g filter="url(#sk)">
    <rect x="320" y="202" width="290" height="98" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="335" y="224" font-size="12.5" font-weight="bold" fill="#2b5b84">同 y = 2 组：x ∈ {1, 2, 3}</text>
  <g filter="url(#sk)"><rect x="335" y="234" width="26" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="348" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">1</text>
  <g filter="url(#sk)"><rect x="367" y="234" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="380" y="250" text-anchor="middle" font-size="11" fill="#2b5b84">2</text>
  <g filter="url(#sk)"><rect x="399" y="234" width="26" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="412" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">3</text>
  <text x="348" y="268" text-anchor="middle" font-size="9" fill="#b07818">min</text>
  <text x="412" y="268" text-anchor="middle" font-size="9" fill="#b07818">max</text>
  <text x="335" y="274" font-size="10.5" fill="#444">colMin[2] = 1，colMax[2] = 3（组内 x 的极值）</text>
  <text x="335" y="292" font-size="11.5" font-weight="bold" fill="#2b5b84">上下都有邻居 ⇔ 1 &lt; x &lt; 3（严格夹逼）</text>

  <!-- ===== 底部关键结论 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="320" width="570" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="325" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">覆盖 ⇔ rowMin[x] &lt; y &lt; rowMax[x] 且 colMin[y] &lt; x &lt; colMax[y]</text>
  <text x="325" y="368" text-anchor="middle" font-size="10.5" fill="#444">不等式必须严格：端点必缺一侧；单栋成组时 min = max = 自己，天然落选（无需特判）</text>
</svg>
