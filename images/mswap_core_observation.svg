<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：坏位置两两配对，一次交换修复两个</text>
  <path d="M 110 44 Q 320 54 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部：坏位置 / 好位置示例格子 -->
  <text x="147" y="66" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">禁 1</text>
  <text x="213" y="66" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">禁 1</text>
  <text x="279" y="66" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">禁 2</text>
  <text x="345" y="66" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">禁 8</text>
  <text x="411" y="66" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">禁 9</text>

  <g filter="url(#sk)"><rect x="120" y="72" width="54" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="147" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="186" y="72" width="54" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="213" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="252" y="72" width="54" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="279" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="318" y="72" width="54" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="345" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="384" y="72" width="54" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="411" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">3</text>

  <text x="147" y="130" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">i=0</text>
  <text x="213" y="130" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">i=1</text>
  <text x="279" y="130" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">i=2</text>
  <text x="345" y="130" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">i=3</text>
  <text x="411" y="130" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">i=4</text>

  <text x="475" y="88" font-size="12" fill="#b85450" filter="url(#sk)">红 = 坏位置（值 = 禁值）</text>
  <text x="475" y="108" font-size="12" fill="#4a7a3a" filter="url(#sk)">绿 = 好位置（已经满足）</text>

  <!-- 左框：坏-坏配对 -->
  <g filter="url(#sk)"><rect x="36" y="170" width="276" height="118" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="174" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">① 值不同的坏位置：直接配对</text>
  <g filter="url(#sk)"><rect x="66" y="208" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="89" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="200" y="208" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="223" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">2</text>
  <path d="M 118 220 L 194 220" stroke="#3a3a3a" stroke-width="1.7" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <path d="M 194 236 L 118 236" stroke="#3a3a3a" stroke-width="1.7" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="174" y="264" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">1 放到禁 2 的位置，2 放到禁 1 的位置</text>
  <text x="174" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1 次交换修复 2 个 ✓</text>

  <!-- 右框：同值过剩 -->
  <g filter="url(#sk)"><rect x="328" y="170" width="276" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="466" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6d1a" filter="url(#sk)">② 同值过剩：找好位置单换</text>
  <g filter="url(#sk)"><rect x="352" y="208" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="373" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="410" y="208" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="431" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <path d="M 397 214 L 407 236" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 407 214 L 397 236" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="500" y="208" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="521" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">3</text>
  <path d="M 456 225 L 492 225" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="466" y="264" text-anchor="middle" font-size="12" fill="#9a6d1a" filter="url(#sk)">同为 1 无法互配（换完还是 1）</text>
  <text x="466" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6d1a" filter="url(#sk)">1 次交换只能修复 1 个</text>

  <!-- 下界说明条 -->
  <g filter="url(#sk)"><rect x="36" y="300" width="568" height="44" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="318" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">一次交换至多修复 2 个坏位置；且至多修复 1 个「值为 v」的坏位置</text>
  <text x="320" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">⇒ 交换次数 ≥ ⌈b/2⌉ 且 ≥ p_max（坏位置同值最大频次）</text>

  <!-- 公式框 -->
  <g filter="url(#sk)"><rect x="36" y="356" width="568" height="100" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="320" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">b = 坏位置总数 ， p_max = 坏位置中同值的最大频次</text>
  <text x="320" y="416" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">answer = max( ⌈b/2⌉ , p_max )</text>
  <text x="320" y="442" text-anchor="middle" font-size="11.5" fill="#6a8aa8" filter="url(#sk)">两个下界都能被构造达到，公式即最优解</text>
</svg>
