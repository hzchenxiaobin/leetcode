<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">第二步：从最左未覆盖点出发，贪心放在 i+1</text>
  <rect x="56" y="72" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="79.0" y="96.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="106" y="72" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129.0" y="96.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="156" y="72" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179.0" y="96.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="206" y="72" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229.0" y="96.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="256" y="72" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279.0" y="96.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="306" y="72" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="329.0" y="96.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="356" y="72" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="379.0" y="96.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="406" y="72" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="429.0" y="96.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="30" y="98" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">初始</text>
  <text x="81.0" y="58" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">最左不可见 i=0</text>
  <text x="131.0" y="132" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">在 i+1 放灯泡（覆盖 [0,2]）</text>
  <rect x="56" y="148" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="79.0" y="172.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="106" y="148" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129.0" y="172.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="156" y="148" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179.0" y="172.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="206" y="148" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229.0" y="172.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="256" y="148" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279.0" y="172.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="306" y="148" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="329.0" y="172.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="356" y="148" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="379.0" y="172.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="406" y="148" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="429.0" y="172.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="30" y="174" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">放第 1 个</text>
  <text x="381.0" y="208" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">下一个不可见 i=6 → 放在 7（覆盖 [6,7]）</text>
  <rect x="56" y="224" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="79.0" y="248.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="106" y="224" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129.0" y="248.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="156" y="224" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179.0" y="248.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="206" y="224" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229.0" y="248.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="256" y="224" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279.0" y="248.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="306" y="224" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="329.0" y="248.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="356" y="224" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="379.0" y="248.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="406" y="224" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="429.0" y="248.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="30" y="250" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">放第 2 个</text>
  <path d="M381.0,196 L406,196" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="50" y="292" width="420" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="310" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">结论</text>
  <text x="62" y="326" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">答案 = 2：位置 1 与位置 7 各放一个额外灯泡即可覆盖全程；</text>
  <text x="62" y="341" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">每个新灯泡最多向右延伸 2 格，故贪心不会更差。</text>
</svg>
