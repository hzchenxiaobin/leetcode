<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">前缀差：答案 = f(high) − f(low − 1)</text>

  <!-- 数轴 -->
  <g filter="url(#rough2)">
    <path d="M 70 120 L 570 120" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <!-- [1, low-1] 区段 -->
    <rect x="70" y="104" width="120" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="130" y="125" text-anchor="middle" font-size="12.5" fill="#446688">[1, low−1]</text>

    <!-- [low, high] 区段 -->
    <rect x="190" y="104" width="200" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="290" y="125" text-anchor="middle" font-size="12.5" fill="#4a7a3a">[low, high] ← 所求</text>

    <path d="M 390 100 L 390 140" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="470" y="125" text-anchor="middle" font-size="12" fill="#555">(high, +∞) 不关心</text>
  </g>

  <!-- 两个 f 的计算 -->
  <g filter="url(#rough2)">
    <rect x="80" y="170" width="220" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="190" y="194" text-anchor="middle" font-size="13" fill="#333">f(low − 1)</text>
    <text x="190" y="214" text-anchor="middle" font-size="12" fill="#555">[1, low−1] 中美丽整数个数</text>
    <text x="190" y="234" text-anchor="middle" font-size="11.5" fill="#888">low = 1 时 f(0) = 0</text>

    <rect x="340" y="170" width="220" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="450" y="194" text-anchor="middle" font-size="13" fill="#333">f(high)</text>
    <text x="450" y="214" text-anchor="middle" font-size="12" fill="#555">[1, high] 中美丽整数个数</text>
    <text x="450" y="234" text-anchor="middle" font-size="11.5" fill="#888">两次独立的数位 DP</text>
  </g>

  <!-- 减法 -->
  <g filter="url(#rough2)">
    <text x="320" y="278" text-anchor="middle" font-size="15" fill="#b85450">答案 = f(high) − f(low − 1)</text>
    <text x="320" y="300" text-anchor="middle" font-size="12" fill="#555">区间计数的标准套路：前缀和相减，每段都不重不漏</text>
  </g>

  <!-- 示例演算小条 -->
  <g filter="url(#rough2)">
    <rect x="80" y="314" width="480" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="320" y="338" text-anchor="middle" font-size="12.5" fill="#4a7a3a">示例 1：f(20) = 2（12、18），f(9) = 0（一位数奇偶必不平衡）→ 2 − 0 = 2 ✓</text>
  </g>
</svg>
