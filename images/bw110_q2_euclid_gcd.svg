<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">辗转相除：gcd(a, b) = gcd(b, a mod b)，b 变 0 时答案为 a</text>

  <!-- gcd(18,6) -->
  <g filter="url(#rough2)">
    <rect x="36" y="52" width="448" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="60" y="78" font-size="13" fill="#446688">gcd(18, 6)：</text>
    <text x="170" y="78" font-size="13" fill="#333">18 mod 6 = 0 → gcd(6, 0) =</text>
    <text x="352" y="80" font-size="16" fill="#1d5c1a">6</text>
    <text x="60" y="106" font-size="11.5" fill="#888">6 整除 18，一步出结果（相邻值成倍数关系时特别快）</text>
  </g>

  <!-- gcd(6,10) -->
  <g filter="url(#rough2)">
    <rect x="36" y="142" width="448" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="60" y="168" font-size="13" fill="#4a7a3a">gcd(6, 10)：</text>
    <text x="170" y="168" font-size="13" fill="#333">6 mod 10 = 6 → gcd(10, 6) → 10 mod 6 = 4 → gcd(6, 4) → 6 mod 4 = 2 → gcd(4, 2) → 4 mod 2 = 0 →</text>
    <text x="424" y="170" font-size="16" fill="#1d5c1a">2</text>
    <text x="60" y="196" font-size="11.5" fill="#888">注意第一轮会自动交换：小数 mod 大数 = 小数本身</text>
  </g>

  <!-- gcd(10,3) -->
  <g filter="url(#rough2)">
    <rect x="36" y="232" width="448" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.4"/>
    <text x="60" y="258" font-size="13" fill="#b85450">gcd(10, 3)：</text>
    <text x="170" y="258" font-size="13" fill="#333">10 mod 3 = 1 → gcd(3, 1) → 3 mod 1 = 0 → gcd(1, 0) =</text>
    <text x="424" y="260" font-size="16" fill="#b85450">1</text>
    <text x="60" y="286" font-size="11.5" fill="#888">互质的相邻值，插入的结点值就是 1</text>
  </g>

  <!-- 复杂度 -->
  <g filter="url(#rough2)">
    <rect x="36" y="322" width="448" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" fill-opacity="0.5"/>
    <text x="260" y="341" text-anchor="middle" font-size="12" fill="#8a6d1f">每两次取余，较大的数至少减半 → 单次 gcd 为 O(log V)，V ≤ 1000</text>
  </g>
</svg>
