<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：4 人圈的两种方案 + 6 人圈 5 种</text>

  <!-- 4 人：方案一 -->
  <text x="110" y="70" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4 人 · 方案 (1,2)(3,4)</text>
  <g filter="url(#rough2)">
    <ellipse cx="110" cy="150" rx="62" ry="62" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="110" cy="88"  r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="172" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="110" cy="212" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="48"  cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="110" y="93">1</text><text x="172" y="155">2</text>
    <text x="110" y="217">3</text><text x="48" y="155">4</text>
  </g>
  <path d="M 121 99 L 161 139" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 99 201 L 59 161" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 4 人：方案二 -->
  <text x="290" y="70" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4 人 · 方案 (2,3)(4,1)</text>
  <g filter="url(#rough2)">
    <ellipse cx="290" cy="150" rx="62" ry="62" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="290" cy="88"  r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="352" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="290" cy="212" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="228" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="290" y="93">1</text><text x="352" y="155">2</text>
    <text x="290" y="217">3</text><text x="228" y="155">4</text>
  </g>
  <path d="M 337 161 L 305 197" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 243 161 L 275 197" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)" transform="translate(-30 -32) rotate(45 260 180)"/>

  <!-- 6 人 5 种（小图排布） -->
  <text x="452" y="70" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">f(4人)=2 = C₂ ✓</text>

  <text x="280" y="262" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">6 人圈共 5 种 = C₃（按 1 号握 2 / 4 / 6 分三类）</text>

  <g filter="url(#rough2)">
    <rect x="52"  y="282" width="140" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <rect x="210" y="282" width="140" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <rect x="368" y="282" width="140" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="122" y="306">1 握 2：剩 3~6</text><text x="122" y="326">f(4) = 2 种</text>
    <text x="280" y="306">1 握 4：两侧各 2 人</text><text x="280" y="326">f(2)·f(2) = 1 种</text>
    <text x="438" y="306">1 握 6：剩 2~5</text><text x="438" y="326">f(4) = 2 种</text>
  </g>

  <rect x="110" y="364" width="340" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="385" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">合计 2 + 1 + 2 = 5 种，</text>
  <text x="280" y="403" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">与卡特兰数 C₃ = 5 一致 ✓</text>
</svg>
