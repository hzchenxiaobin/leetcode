<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333">演算：grid = ["..","#."]，d = 2</text>

  <text x="40" y="86" font-size="12" fill="#666">行 0</text>
  <rect x="110" y="60" width="90" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="220" y="60" width="90" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="84" text-anchor="middle" font-size="12" fill="#333">h=1, g=2</text>
  <text x="155" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a">停 or 跳到右格</text>
  <text x="265" y="84" text-anchor="middle" font-size="12" fill="#333">h=1, g=2</text>
  <text x="265" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a">停 or 跳到左格</text>

  <text x="40" y="170" font-size="12" fill="#666">行 1</text>
  <rect x="110" y="144" width="90" height="52" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="220" y="144" width="90" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="155" y="176" text-anchor="middle" font-size="12" fill="#888"># 阻塞</text>
  <text x="265" y="168" text-anchor="middle" font-size="12" fill="#333">h = 4, g = 4</text>
  <text x="265" y="186" text-anchor="middle" font-size="10" fill="#b85450">起点</text>

  <path d="M258,142 L168,116" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M272,142 L278,116" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="130" font-size="11" fill="#b85450">√2 ≤ 2，两列都能上移</text>

  <rect x="60" y="216" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="12" fill="#333">h[1][1] = g[0][1] + g[0][0] = 2 + 2 = 4，g[1][1] = 4</text>

  <rect x="60" y="270" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="12" fill="#333">答案 = 最后一行 g 之和 = 4，与示例 2 一致</text>
</svg>
