<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="450" fill="#fdfcf7"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：一遍扫描的两种结局</text>
  <path d="M 210 44 Q 360 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- panel 1: leetcode, false -->
  <g filter="url(#sk)">
    <rect x="30" y="64" width="320" height="300" rx="12" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="190" y="94" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="monospace">sentence = "leetcode"</text>

  <g filter="url(#sk)" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3">
    <circle cx="90" cy="140" r="15"/>
    <circle cx="130" cy="140" r="15"/>
    <circle cx="170" cy="140" r="15"/>
    <circle cx="210" cy="140" r="15"/>
    <circle cx="250" cy="140" r="15"/>
    <circle cx="290" cy="140" r="15"/>
  </g>
  <g filter="url(#sk)" font-size="12.5" fill="#2b6e9e" text-anchor="middle">
    <text x="90" y="145">l</text><text x="130" y="145">e</text><text x="170" y="145">t</text>
    <text x="210" y="145">c</text><text x="250" y="145">o</text><text x="290" y="145">d</text>
  </g>
  <text x="190" y="176" text-anchor="middle" font-size="10.5" fill="#888">打勾的字母（按首次出现顺序）</text>
  <text x="190" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04040">不同字母数 = 6 &lt; 26</text>
  <text x="190" y="222" text-anchor="middle" font-size="10" fill="#a04040">缺席 20 个：a b f g h i j k m n p q r s u v w x y z</text>
  <g filter="url(#sk)">
    <rect x="90" y="252" width="200" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="190" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04040">返回 false</text>
  <text x="190" y="294" text-anchor="middle" font-size="11" fill="#a04040">勾数 6 ≠ 26</text>

  <!-- panel 2: pangram, true -->
  <g filter="url(#sk)">
    <rect x="370" y="64" width="320" height="300" rx="12" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="530" y="94" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-family="monospace">sentence = "thequickbrownfoxjumpsoverthelazydog"</text>

  <!-- badges row 1: t h e q u i c k b r o w n -->
  <g filter="url(#sk)" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2">
    <circle cx="392" cy="132" r="10.5"/><circle cx="415" cy="132" r="10.5"/><circle cx="438" cy="132" r="10.5"/>
    <circle cx="461" cy="132" r="10.5"/><circle cx="484" cy="132" r="10.5"/><circle cx="507" cy="132" r="10.5"/>
    <circle cx="530" cy="132" r="10.5"/><circle cx="553" cy="132" r="10.5"/><circle cx="576" cy="132" r="10.5"/>
    <circle cx="599" cy="132" r="10.5"/><circle cx="622" cy="132" r="10.5"/><circle cx="645" cy="132" r="10.5"/>
    <circle cx="668" cy="132" r="10.5"/>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#2e6e2e" text-anchor="middle">
    <text x="392" y="136">t</text><text x="415" y="136">h</text><text x="438" y="136">e</text>
    <text x="461" y="136">q</text><text x="484" y="136">u</text><text x="507" y="136">i</text>
    <text x="530" y="136">c</text><text x="553" y="136">k</text><text x="576" y="136">b</text>
    <text x="599" y="136">r</text><text x="622" y="136">o</text><text x="645" y="136">w</text>
    <text x="668" y="136">n</text>
  </g>
  <!-- badges row 2: f x j m p s v l a z y d g -->
  <g filter="url(#sk)" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2">
    <circle cx="392" cy="164" r="10.5"/><circle cx="415" cy="164" r="10.5"/><circle cx="438" cy="164" r="10.5"/>
    <circle cx="461" cy="164" r="10.5"/><circle cx="484" cy="164" r="10.5"/><circle cx="507" cy="164" r="10.5"/>
    <circle cx="530" cy="164" r="10.5"/><circle cx="553" cy="164" r="10.5"/><circle cx="576" cy="164" r="10.5"/>
    <circle cx="599" cy="164" r="10.5"/><circle cx="622" cy="164" r="10.5"/><circle cx="645" cy="164" r="10.5"/>
    <circle cx="668" cy="164" r="10.5"/>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#2e6e2e" text-anchor="middle">
    <text x="392" y="168">f</text><text x="415" y="168">x</text><text x="438" y="168">j</text>
    <text x="461" y="168">m</text><text x="484" y="168">p</text><text x="507" y="168">s</text>
    <text x="530" y="168">v</text><text x="553" y="168">l</text><text x="576" y="168">a</text>
    <text x="599" y="168">z</text><text x="622" y="168">y</text><text x="645" y="168">d</text>
    <text x="668" y="168">g</text>
  </g>
  <text x="530" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">不同字母数 = 26</text>
  <text x="530" y="224" text-anchor="middle" font-size="10.5" fill="#888">新字母 d、g 直到串尾 "...dog" 才集齐</text>
  <g filter="url(#sk)">
    <rect x="430" y="252" width="200" height="54" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="530" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 true</text>
  <text x="530" y="294" text-anchor="middle" font-size="11" fill="#2e6e2e">勾数 26 = 26</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="110" y="384" width="500" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="360" y="411" text-anchor="middle" font-size="12" fill="#7a5415">勾数 = 不同字母数，与每个字母出现几次无关；一遍扫描即可完成全部打勾</text>
</svg>
