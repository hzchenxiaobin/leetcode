<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="348" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">先聚合「两个元素的异或」，再异或上第三个</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888">把 O(n³) 拆成 O(n²) + O(n·V)：V = 2048 是异或值域</text>

  <rect x="60" y="68" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="95" y="96" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold">6</text>
  <rect x="140" y="68" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="175" y="96" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold">7</text>
  <rect x="220" y="68" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="255" y="96" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold">8</text>
  <rect x="300" y="68" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="335" y="96" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold">9</text>
  <text x="215" y="130" text-anchor="middle" font-size="10" fill="#666">nums（i ≤ j 允许取同一个元素）</text>

  <path d="M 215 134 L 215 156" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="150" font-size="10" fill="#666">∀ i ≤ j：nums[i] ⊕ nums[j]</text>

  <rect x="60" y="162" width="310" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="215" y="184" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">对异或集合 P = {0, 1, 14, 15}</text>
  <text x="215" y="203" text-anchor="middle" font-size="10" fill="#666">44 种有下标组合，去重后只剩 4 个值</text>

  <path d="M 215 214 L 215 236" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="230" font-size="10" fill="#666">再对每个 a ∈ nums 做 a ⊕ P</text>

  <rect x="60" y="242" width="310" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="215" y="264" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">三元素集合 = {6, 7, 8, 9}</text>
  <text x="215" y="283" text-anchor="middle" font-size="10" fill="#666">答案 = 4，与示例 2 输出一致</text>

  <path d="M 370 268 L 400 268 L 400 186 L 376 186" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="412" y="230" font-size="9.5" fill="#4a7a3a">先算 pair 再回代</text>

  <rect x="60" y="306" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="327" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">下标顺序 i ≤ j ≤ k 只约束「多重集」，不约束取值的先后 ⇒ 可以自由分组</text>

  <text x="500" y="90" font-size="9.5" fill="#999">值域 &lt; 2048</text>
  <text x="500" y="106" font-size="9.5" fill="#999">→ 开布尔数组</text>
  <text x="500" y="122" font-size="9.5" fill="#999">不用哈希表</text>
</svg>
