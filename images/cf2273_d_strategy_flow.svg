<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">两轮定胜负：策略流程</text>

  <rect x="182" y="52" width="256" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">第 1 轮：输出 (1429, 7143)</text>
  <text x="310" y="88" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">读回 p，S = {A±p, B±p} ∩ [1,10⁴]</text>

  <path d="M310,96 L310,124" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: |S| = 4 -->
  <path d="M310,128 L406,166 L310,204 L214,166 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">|S| = 4 ?</text>

  <path d="M406,166 L468,166" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="468" y="128" width="136" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="536" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 2 轮 (1428, 7142)</text>
  <text x="536" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案 p±1 ⟹ |S| = 2</text>
  <text x="536" y="192" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">花费 ≤ p + 1</text>

  <path d="M310,204 L310,232" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="224" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">否</text>

  <!-- diamond 2: |S| = 3 -->
  <path d="M310,236 L406,274 L310,312 L214,274 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">|S| = 3 ?</text>

  <path d="M406,274 L468,274" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="468" y="244" width="136" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="536" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">近对中点 + 第三点</text>
  <text x="536" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">一轮内 |S| ≤ 2</text>
  <text x="536" y="310" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">花费 = 2857 − p</text>

  <path d="M310,312 L310,338" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="330" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="196" y="342" width="228" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">|S| ≤ 2：探针直接落在两个候选上</text>
  <text x="310" y="376" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">本轮花费 0</text>

  <rect x="20" y="146" width="162" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="101" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">所有分支最后都归到</text>
  <text x="101" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 3–10 轮</text>
  <text x="101" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">|S| ≤ 2，每轮 0 花费</text>
</svg>
