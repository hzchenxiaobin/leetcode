<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">填表验证：ans = N - lowbit(N+1)/2</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">T 是 N 二进制末尾连续 1 的个数；lowbit(N+1) = 2^T</text>

  <rect x="36" y="62" width="490" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="106" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">N</text>
  <text x="186" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">二进制</text>
  <text x="286" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">T</text>
  <text x="386" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">lowbit(N+1)</text>
  <text x="486" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">ans</text>

  <rect x="36" y="98" width="490" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="106" y="118" text-anchor="middle" font-size="11" fill="#8a3a36">2</text>
  <text x="186" y="118" text-anchor="middle" font-size="11" fill="#555">10₂</text>
  <text x="286" y="118" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="386" y="118" text-anchor="middle" font-size="11" fill="#555">3 → 不是 2 的幂</text>
  <text x="486" y="118" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">-1</text>

  <rect x="36" y="132" width="490" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="106" y="152" text-anchor="middle" font-size="11" fill="#3a5a30">3</text>
  <text x="186" y="152" text-anchor="middle" font-size="11" fill="#555">11₂</text>
  <text x="286" y="152" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="386" y="152" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="486" y="152" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">3-2 = 1</text>

  <rect x="36" y="166" width="490" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="106" y="186" text-anchor="middle" font-size="11" fill="#3a5a30">5</text>
  <text x="186" y="186" text-anchor="middle" font-size="11" fill="#555">101₂</text>
  <text x="286" y="186" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="386" y="186" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="486" y="186" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">5-1 = 4</text>

  <rect x="36" y="200" width="490" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="106" y="220" text-anchor="middle" font-size="11" fill="#3a5a30">7</text>
  <text x="186" y="220" text-anchor="middle" font-size="11" fill="#555">111₂</text>
  <text x="286" y="220" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="386" y="220" text-anchor="middle" font-size="11" fill="#555">8</text>
  <text x="486" y="220" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">7-4 = 3</text>

  <rect x="36" y="234" width="490" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="106" y="254" text-anchor="middle" font-size="11" fill="#8a6a20">11</text>
  <text x="186" y="254" text-anchor="middle" font-size="11" fill="#555">1011₂</text>
  <text x="286" y="254" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="386" y="254" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="486" y="254" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">11-2 = 9</text>

  <rect x="36" y="268" width="490" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="106" y="288" text-anchor="middle" font-size="11" fill="#8a6a20">13</text>
  <text x="186" y="288" text-anchor="middle" font-size="11" fill="#555">1101₂</text>
  <text x="286" y="288" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="386" y="288" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="486" y="288" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">13-1 = 12</text>

  <rect x="36" y="302" width="490" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="106" y="322" text-anchor="middle" font-size="11" fill="#8a6a20">31</text>
  <text x="186" y="322" text-anchor="middle" font-size="11" fill="#555">11111₂</text>
  <text x="286" y="322" text-anchor="middle" font-size="11" fill="#555">5</text>
  <text x="386" y="322" text-anchor="middle" font-size="11" fill="#555">32</text>
  <text x="486" y="322" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">31-16 = 15</text>

  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888">整列与示例输出一致：[-1,1,4,3] 与 [9,12,15]，单值 O(1)，整体 O(n)</text>
</svg>
