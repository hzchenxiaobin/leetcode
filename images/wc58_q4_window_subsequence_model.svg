<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：窗口必须按顺序「塞下」T</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">T 只是子序列，所以窗口两端可以贴紧；固定右端时，起点越靠右窗口越短</text>

  <g filter="url(#rough2)">
    <rect x="114" y="82" width="188" height="2" fill="#4a7a3a"/>
    <path d="M 114 90 L 114 80 L 302 80 L 302 90" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <text x="208" y="72" text-anchor="middle" font-size="11" fill="#3a5a30">候选 1：bcde（起点 1，长 4）</text>
    <path d="M 306 140 L 306 150 L 494 150 L 494 140" stroke="#d6a040" stroke-width="1.6" fill="none"/>
    <text x="400" y="166" text-anchor="middle" font-size="11" fill="#8a6a20">候选 2：bdde（起点 5，长 4）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="66" y="92" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="114" y="92" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="162" y="92" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="210" y="92" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="258" y="92" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="306" y="92" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="354" y="92" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="402" y="92" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="450" y="92" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>

  <g font-size="8" fill="#999" filter="url(#rough2)">
    <text x="70" y="104">0</text>
    <text x="118" y="104">1</text>
    <text x="166" y="104">2</text>
    <text x="214" y="104">3</text>
    <text x="262" y="104">4</text>
    <text x="310" y="104">5</text>
    <text x="358" y="104">6</text>
    <text x="406" y="104">7</text>
    <text x="454" y="104">8</text>
  </g>

  <g font-size="17" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="88" y="126">a</text>
    <text x="136" y="126">b</text>
    <text x="184" y="126">c</text>
    <text x="232" y="126">d</text>
    <text x="280" y="126">e</text>
    <text x="328" y="126">b</text>
    <text x="376" y="126">d</text>
    <text x="424" y="126">d</text>
    <text x="472" y="126">e</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="182" width="480" height="44" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4" rx="8"/>
    <text x="280" y="200" text-anchor="middle" font-size="11" fill="#555">两者等长（都是 4），题目要求取最左起点 → 答案是「bcde」</text>
    <text x="280" y="218" text-anchor="middle" font-size="11" fill="#b85450">「deb」不是答案：窗口内 T 必须按 b → d → e 的先后出现</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="240" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="280" y="258" text-anchor="middle" font-size="11" fill="#3a4a66">固定右端 i：起点 k 越大，窗口 [k, i] 越短</text>
    <text x="280" y="274" text-anchor="middle" font-size="11" fill="#3a4a66">于是每个 i 只关心一个数：能取到的最「右」起点</text>
  </g>

  <g filter="url(#rough2)">
    <text x="280" y="302" text-anchor="middle" font-size="10" fill="#777">把 O(n²) 个窗口的比较，压缩成「每个 i 的 m 个状态」</text>
    <text x="280" y="322" text-anchor="middle" font-size="10" fill="#999">n = |s1| ≤ 20000，m = |s2| ≤ 100，O(n·m) 足够</text>
  </g>
</svg>
