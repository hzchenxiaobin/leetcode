<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：删头补尾 → t 秒后 = 存活后缀 + 任意填充</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Row 1: original word ===== -->
  <text x="158" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✂ 第 1 秒删掉前 k = 3 个</text>
  <text x="314" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">存活后缀 word[3:]</text>

  <!-- removed cells (red) -->
  <rect x="80" y="72" width="52" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="132" y="72" width="52" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="184" y="72" width="52" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <!-- surviving cells (blue) -->
  <rect x="236" y="72" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="288" y="72" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="340" y="72" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="392" y="72" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="106" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3030" filter="url(#rough2)">a</text>
  <text x="158" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3030" filter="url(#rough2)">b</text>
  <text x="210" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3030" filter="url(#rough2)">a</text>
  <text x="262" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">c</text>
  <text x="314" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">a</text>
  <text x="366" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">b</text>
  <text x="418" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">a</text>

  <text x="106" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="158" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="210" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="262" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="314" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="366" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="418" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>

  <!-- arrow between rows -->
  <path d="M 140 152 L 140 190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="176" font-size="12" fill="#446688" filter="url(#rough2)">每秒：删头 k 个 + 补尾 k 个（串长恒为 n）</text>

  <!-- ===== Row 2: after 1 second ===== -->
  <rect x="80" y="196" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="132" y="196" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="184" y="196" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="236" y="196" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="288" y="196" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="340" y="196" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="392" y="196" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <text x="106" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">c</text>
  <text x="158" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">a</text>
  <text x="210" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">b</text>
  <text x="262" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">a</text>
  <text x="314" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10" filter="url(#rough2)">?</text>
  <text x="366" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10" filter="url(#rough2)">?</text>
  <text x="418" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10" filter="url(#rough2)">?</text>

  <text x="158" y="252" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">存活后缀原样顶在最前</text>
  <text x="340" y="252" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">任意字符 × k（我们说了算）</text>

  <!-- formula box -->
  <rect x="60" y="268" width="520" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="296" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">t 秒后：word_t = word[t·k:] + 任意字符 × t·k（t·k ≤ n 时）</text>

  <!-- equivalence box -->
  <rect x="60" y="330" width="520" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">能还原 ⇔ 存活后缀恰是前缀：word[t·k:] == word[: n−t·k]</text>
  <text x="320" y="376" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">（此时尾部 t·k 个任意位照抄 word 的尾部即还原）</text>
  <text x="320" y="400" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">特例：t·k ≥ n 时原字符已全部删光，整串任意重建，必然可行</text>
</svg>
