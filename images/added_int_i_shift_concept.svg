<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">统一加 x ⇒ 数轴整体平移，min 对应 min</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums1 number line -->
  <text x="46" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">nums1</text>
  <g filter="url(#sk)">
    <path d="M 70 120 L 570 120" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 570 120 L 560 114 M 570 120 L 560 126" stroke="#4a8edb" stroke-width="1.6" fill="none"/>
  </g>
  <!-- nums1 dots: values 2,4,6 at x = 90 + v*50 -->
  <g filter="url(#sk)">
    <circle cx="190" cy="120" r="10" fill="#e8f0fa" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="290" cy="120" r="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <circle cx="390" cy="120" r="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="190" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2 (min₁)</text>
  <text x="290" y="98" text-anchor="middle" font-size="12" fill="#2b6e9e">4</text>
  <text x="390" y="98" text-anchor="middle" font-size="12" fill="#2b6e9e">6 (max₁)</text>

  <!-- shift arrows: +x moves each dot the same distance -->
  <g filter="url(#sk)">
    <path d="M 196 132 Q 265 185 332 240" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" fill="none" marker-end="url(#arRed)"/>
    <path d="M 296 132 Q 365 185 432 240" stroke="#8aa8c8" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
    <path d="M 396 132 Q 465 185 532 240" stroke="#8aa8c8" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="238" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">+x</text>
  <text x="344" y="192" text-anchor="middle" font-size="12" fill="#6a8296">+x</text>
  <text x="450" y="192" text-anchor="middle" font-size="12" fill="#6a8296">+x</text>

  <!-- nums2 number line -->
  <text x="46" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">nums2</text>
  <g filter="url(#sk)">
    <path d="M 70 260 L 570 260" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 570 260 L 560 254 M 570 260 L 560 266" stroke="#4a8e4a" stroke-width="1.6" fill="none"/>
  </g>
  <!-- nums2 dots: values 5,7,9 -->
  <g filter="url(#sk)">
    <circle cx="340" cy="260" r="10" fill="#eaf6ee" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="440" cy="260" r="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <circle cx="540" cy="260" r="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="340" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">5 (min₂)</text>
  <text x="440" y="290" text-anchor="middle" font-size="12" fill="#2e6e2e">7</text>
  <text x="540" y="290" text-anchor="middle" font-size="12" fill="#2e6e2e">9 (max₂)</text>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="60" y="306" width="520" height="40" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="331" text-anchor="middle" font-size="14" fill="#7a5415">平移不改变相对次序：min₁ + x = min₂，max₁ + x = max₂</text>
</svg>
