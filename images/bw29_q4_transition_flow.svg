<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    转移：mask → mask | sub，每步一个学期
  </text>

  <!-- 外层循环 mask -->
  <rect x="60" y="62" width="150" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="90" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">按 mask 升序枚举</text>

  <!-- 计算 avail -->
  <rect x="252" y="56" width="210" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="357" y="78" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">求 avail：未修 且</text>
  <text x="357" y="98" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">(prereq[i] &amp; mask) == prereq[i]</text>

  <!-- mask 集合示意 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="70" y="150" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="110" y="150" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="150" y="150" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="90" y="175" text-anchor="middle" fill="#446688">课2</text>
    <text x="130" y="175" text-anchor="middle" fill="#446688">课3</text>
    <text x="170" y="175" text-anchor="middle" fill="#446688">?</text>
  </g>
  <text x="130" y="212" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">mask = {2, 3}</text>

  <!-- avail 集合示意 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="280" y="150" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="320" y="150" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="300" y="175" text-anchor="middle" fill="#2f5a24">课1</text>
    <text x="340" y="175" text-anchor="middle" fill="#999">课4</text>
  </g>
  <text x="330" y="212" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">avail = {1}（课 4 先修未满足）</text>

  <!-- 子集枚举技巧 -->
  <rect x="60" y="238" width="222" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="171" y="260" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">枚举 avail 的全部非空子集：</text>
  <text x="171" y="280" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">sub = (sub − 1) &amp; avail</text>

  <!-- popcount 过滤 -->
  <polygon points="388,236 452,264 388,292 324,264" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="260" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">popcount(sub)</text>
  <text x="388" y="278" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">≤ k ?</text>

  <!-- 转移式 -->
  <rect x="86" y="306" width="348" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">
    dp[mask | sub] = min(dp[mask | sub], dp[mask] + 1)
  </text>

  <!-- 连线 -->
  <g filter="url(#rough2)">
    <path d="M 210 85 L 248 85" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 357 114 C 340 130, 320 140, 300 148" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 220 200 C 250 220, 270 228, 278 236" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 282 264 L 320 264" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 388 292 C 370 300, 330 306, 300 310" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="330" y="300" font-size="11" fill="#b85450">是（可少于 k 门）</text>
  </g>
</svg>
