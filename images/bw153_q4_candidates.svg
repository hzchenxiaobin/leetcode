<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="396" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">查询语义：操作只在子串内，活跃区段数统计整串 s</text>
  <text x="290" y="47" text-anchor="middle" font-size="11" fill="#888">s = "1000100"，查询 [1,5]（答案为 6）</text>

  <path d="M 112 66 L 112 58 L 396 58 L 396 66" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="112" y="52" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold">l = 1, r = 5</text>

  <rect x="60" y="80" width="56" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="88" y="111" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold">1</text>
  <rect x="116" y="80" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="111" text-anchor="middle" font-size="15" fill="#3a4a66">0</text>
  <rect x="172" y="80" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="111" text-anchor="middle" font-size="15" fill="#3a4a66">0</text>
  <rect x="228" y="80" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="256" y="111" text-anchor="middle" font-size="15" fill="#3a4a66">0</text>
  <rect x="284" y="80" width="56" height="50" fill="#fff8e1" stroke="#b85450" stroke-width="2.6" rx="6" filter="url(#rough2)"/>
  <text x="312" y="111" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold">1</text>
  <rect x="340" y="80" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="368" y="111" text-anchor="middle" font-size="15" fill="#3a4a66">0</text>
  <rect x="396" y="80" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="424" y="111" text-anchor="middle" font-size="15" fill="#3a4a66">0</text>

  <text x="88" y="146" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="144" y="146" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="200" y="146" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="256" y="146" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="312" y="146" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="368" y="146" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="424" y="146" text-anchor="middle" font-size="10" fill="#999">6</text>

  <text x="60" y="168" font-size="10.5" fill="#446688">子串 s[1..5] = "00010"：其中只有 1 个 1</text>
  <text x="60" y="185" font-size="10.5" fill="#8a6a20">整串 s 有 2 个 1（idx 0 与 idx 4），统计对象是整串</text>

  <path d="M 144 152 L 144 214" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 368 152 L 368 214" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="144" y="230" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">左 0-段恰从 l 开始</text>
  <text x="368" y="230" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">右 0-段被 r 截断</text>

  <rect x="96" y="240" width="150" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="171" y="261" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">左侧 0 的个数</text>
  <text x="171" y="281" text-anchor="middle" font-size="11" fill="#3a4a66">idx 1..3 → 3</text>

  <rect x="262" y="240" width="150" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="337" y="261" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">右侧 0 的个数</text>
  <text x="337" y="281" text-anchor="middle" font-size="11" fill="#3a4a66">idx 5 → 1</text>

  <path d="M 171 292 L 171 308 L 258 308 L 258 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 337 292 L 337 308 L 302 308 L 302 320" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="150" y="324" width="280" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="10" filter="url(#rough2)"/>
  <text x="290" y="345" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">Δ = 3 + 1 = 4 → 答案 = 2 + 4 = 6</text>
  <text x="290" y="362" text-anchor="middle" font-size="10" fill="#666">中间那段 1 先变 0 再随合并块变回 1，净赚两侧的 0</text>

  <text x="470" y="252" font-size="10" fill="#999">候选 1-段必须</text>
  <text x="470" y="268" font-size="10" fill="#999">整体落在 [l, r] 内</text>
  <text x="470" y="284" font-size="10" fill="#999">否则会先被切成</text>
  <text x="470" y="300" font-size="10" fill="#999">「半段 1」，无法翻</text>

  <text x="290" y="390" text-anchor="middle" font-size="9.5" fill="#999">⚠️ 若按「只数子串里的 1」理解会得到 5，与期望输出 6 不符</text>
</svg>
