<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">check(T=11) 的回溯判定：降序 [8,7,4,2,1] 逐个装桶</text>
  <path d="M 130 38 Q 310 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- walkthrough table -->
  <!-- header -->
  <g filter="url(#rough2)">
    <rect x="22" y="54" width="54" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="76" y="54" width="140" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="216" y="54" width="140" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="49" y="73" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4e68" filter="url(#rough2)">工作 x</text>
  <text x="146" y="73" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4e68" filter="url(#rough2)">尝试 w₁（负载）</text>
  <text x="286" y="73" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4e68" filter="url(#rough2)">尝试 w₂（负载）</text>

  <!-- rows: y = 84 + i*44, h=40 -->
  <g filter="url(#rough2)">
    <rect x="22" y="84" width="54" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="76" y="84" width="140" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="216" y="84" width="140" height="40" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="49" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="146" y="102" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">0+8=8 ≤ 11 ✓ 放入</text>
  <text x="146" y="117" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">w₁ ← 8</text>
  <text x="286" y="102" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">负载同为 0 → ②跳过</text>
  <text x="286" y="117" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（等价状态已搜）</text>

  <g filter="url(#rough2)">
    <rect x="22" y="128" width="54" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="76" y="128" width="140" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="216" y="128" width="140" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="49" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="146" y="153" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">8+7=15 ＞ 11 ✗①拒</text>
  <text x="286" y="146" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">0+7=7 ≤ 11 ✓ 放入</text>
  <text x="286" y="161" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">w₂ ← 7</text>

  <g filter="url(#rough2)">
    <rect x="22" y="172" width="54" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="76" y="172" width="140" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="216" y="172" width="140" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="49" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="146" y="197" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">8+4=12 ＞ 11 ✗①拒</text>
  <text x="286" y="190" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">7+4=11 ≤ 11 ✓ 放入</text>
  <text x="286" y="205" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">w₂ ← 4</text>

  <g filter="url(#rough2)">
    <rect x="22" y="216" width="54" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="76" y="216" width="140" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="216" y="216" width="140" height="40" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="49" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="146" y="234" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">8+2=10 ≤ 11 ✓ 放入</text>
  <text x="146" y="249" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">w₁ ← 2</text>
  <text x="286" y="241" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（w₁ 已成功，无需再试）</text>

  <g filter="url(#rough2)">
    <rect x="22" y="260" width="54" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="76" y="260" width="140" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="216" y="260" width="140" height="40" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="49" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="146" y="278" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">10+1=11 ≤ 11 ✓ 放入</text>
  <text x="146" y="293" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">工作放完 → true!</text>
  <text x="286" y="285" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（—）</text>

  <!-- result box -->
  <g filter="url(#rough2)">
    <rect x="22" y="312" width="334" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="189" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">w₁ = 8+2+1 = 11，w₂ = 7+4 = 11</text>
  <text x="189" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">max = 11 ≤ T ⟹ check(11) = true ✓</text>

  <!-- pruning cards -->
  <g filter="url(#rough2)">
    <rect x="374" y="54" width="228" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="488" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">剪枝⓪ 预处理</text>
  <text x="488" y="96" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">jobs 降序排序：大件先放，冲突早暴露</text>
  <text x="488" y="114" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">k·T ＜ sum(jobs) 时鸽笼直接 false</text>
  <text x="488" y="130" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（总容量都装不下全部工作）</text>

  <g filter="url(#rough2)">
    <rect x="374" y="146" width="228" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="488" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">剪枝① 容量</text>
  <text x="488" y="188" text-anchor="middle" font-size="10.5" fill="#7a2828" filter="url(#rough2)">load[w] + x ＞ T → 跳过该工人</text>
  <text x="488" y="206" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（本例：15＞11、12＞11 被拒）</text>

  <g filter="url(#rough2)">
    <rect x="374" y="226" width="228" height="82" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="488" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">剪枝② 同负载跳过</text>
  <text x="488" y="268" text-anchor="middle" font-size="10.5" fill="#2f4e68" filter="url(#rough2)">load[w] == load[w−1] → 跳过 w</text>
  <text x="488" y="286" text-anchor="middle" font-size="10.5" fill="#2f4e68" filter="url(#rough2)">负载多重集相同 ⟹ 搜索结果相同</text>
  <text x="488" y="302" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（本例：开局两桶同为 0）</text>

  <g filter="url(#rough2)">
    <rect x="374" y="318" width="228" height="82" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="488" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">剪枝③ 空桶失败即止</text>
  <text x="488" y="360" text-anchor="middle" font-size="10.5" fill="#3a6234" filter="url(#rough2)">放入「空工人」仍失败 → break</text>
  <text x="488" y="378" text-anchor="middle" font-size="10.5" fill="#3a6234" filter="url(#rough2)">空桶状态支配一切非空桶分支</text>
  <text x="488" y="394" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（证明见题解 §5 引理 5）</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="22" y="412" width="580" height="46" rx="8" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3"/>
  </g>
  <text x="310" y="432" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">回溯框架：按「工作」逐个分配（不是按工人枚举子集），失败即撤销 load[w] -= x，</text>
  <text x="310" y="450" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">四大剪枝把最坏 kⁿ 的搜索树砍到毫秒级（n ≤ 12 实测 ＜ 2ms）</text>
</svg>
