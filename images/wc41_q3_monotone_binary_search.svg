<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="880" height="510" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：check(x) 单调不增 ⇒ 对「答案」二分</text>
  <path d="M 205 44 Q 440 52 675 44" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- ===== Panel A ===== -->
  <text x="70" y="76" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">① 判定函数 check(x)：x 越大越难满足，可行区间是一段前缀</text>

  <g filter="url(#rough2)">
    <rect x="110" y="150" width="221" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="331" y="150" width="439" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="220" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a2b">check(x) = true</text>
    <text x="550" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04a46">check(x) = false</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 110 200 L 770 200" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 110 194 v 12" stroke="#555" stroke-width="1.6" fill="none"/>
    <path d="M 770 194 v 12" stroke="#555" stroke-width="1.6" fill="none"/>
    <text x="110" y="222" text-anchor="middle" font-size="11" fill="#888">min = −6</text>
    <text x="770" y="222" text-anchor="middle" font-size="11" fill="#888">max = 50</text>
    <text x="792" y="204" font-size="12" fill="#666">x</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 331 148 L 331 108" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <text x="331" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">ans = 12.75（分界点）</text>
    <text x="220" y="248" text-anchor="middle" font-size="11.5" fill="#3a6e3a">存在平均值 ≥ x 的合法子数组 ✓</text>
    <text x="550" y="248" text-anchor="middle" font-size="11.5" fill="#a04a46">不存在这样的子数组 ✗</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="260" width="740" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="440" y="280" text-anchor="middle" font-size="12" fill="#8a6516">目标：在 [min, max] 上二分，收敛到「最大的可行 x」，即答案本身</text>
  </g>

  <!-- ===== Panel B ===== -->
  <text x="70" y="310" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">② 二分收缩示意（nums = [1,12,−5,−6,50,3]，k = 4）</text>

  <!-- row 1 -->
  <g filter="url(#rough2)">
    <text x="230" y="353" text-anchor="end" font-size="11.5" fill="#666">第 1 轮</text>
    <path d="M 240 348 L 700 348" stroke="#446688" stroke-width="7" fill="none" opacity="0.35"/>
    <circle cx="240" cy="348" r="5" fill="#446688"/>
    <circle cx="700" cy="348" r="5" fill="#446688"/>
    <path d="M 470 348 l -6 -9 l 12 0 z" fill="#b85450"/>
    <text x="470" y="330" text-anchor="middle" font-size="11" fill="#b85450">mid = 22</text>
    <text x="240" y="366" text-anchor="middle" font-size="10.5" fill="#888">lo = −6</text>
    <text x="700" y="366" text-anchor="middle" font-size="10.5" fill="#888">hi = 50</text>
    <text x="712" y="353" font-size="11.5" fill="#a04a46">check = false ⇒ hi = 22</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#rough2)">
    <text x="230" y="403" text-anchor="end" font-size="11.5" fill="#666">第 2 轮</text>
    <path d="M 240 398 L 470 398" stroke="#446688" stroke-width="7" fill="none" opacity="0.35"/>
    <circle cx="240" cy="398" r="5" fill="#446688"/>
    <circle cx="470" cy="398" r="5" fill="#446688"/>
    <path d="M 355 398 l -6 -9 l 12 0 z" fill="#4a7a3a"/>
    <text x="355" y="380" text-anchor="middle" font-size="11" fill="#3a6e3a">mid = 8</text>
    <text x="240" y="416" text-anchor="middle" font-size="10.5" fill="#888">lo = −6</text>
    <text x="470" y="416" text-anchor="middle" font-size="10.5" fill="#888">hi = 22</text>
    <text x="712" y="403" font-size="11.5" fill="#3a6e3a">check = true ⇒ lo = 8</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#rough2)">
    <text x="230" y="453" text-anchor="end" font-size="11.5" fill="#666">第 3 轮</text>
    <path d="M 355 448 L 470 448" stroke="#446688" stroke-width="7" fill="none" opacity="0.35"/>
    <circle cx="355" cy="448" r="5" fill="#446688"/>
    <circle cx="470" cy="448" r="5" fill="#446688"/>
    <path d="M 413 448 l -6 -9 l 12 0 z" fill="#b85450"/>
    <text x="413" y="430" text-anchor="middle" font-size="11" fill="#b85450">mid = 15</text>
    <text x="355" y="466" text-anchor="middle" font-size="10.5" fill="#888">lo = 8</text>
    <text x="470" y="466" text-anchor="middle" font-size="10.5" fill="#888">hi = 22</text>
    <text x="712" y="453" font-size="11.5" fill="#a04a46">check = false ⇒ hi = 15</text>
  </g>

  <text x="440" y="494" text-anchor="middle" font-size="11" fill="#a08a56" filter="url(#rough2)">区间不断对折，误差每轮减半 ⇒ 60 轮后远小于 1e-5（也可用 |hi − lo| &gt; 1e-6 收敛）</text>
</svg>
