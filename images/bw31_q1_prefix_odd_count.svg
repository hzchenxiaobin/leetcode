<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">f(x) = [0, x] 中奇数个数 = ⌊(x+1)/2⌋</text>

  <!-- 数轴 0..10 -->
  <line x1="50" y1="120" x2="520" y2="120" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <!-- 奇数格橙色，偶数格蓝色 -->
    <rect x="65" y="96" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="105" y="96" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="145" y="96" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="185" y="96" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="225" y="96" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="265" y="96" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="305" y="96" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="345" y="96" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="385" y="96" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="425" y="96" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="465" y="96" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="85" y="118">1</text><text x="125" y="118">2</text><text x="165" y="118">3</text>
    <text x="205" y="118">4</text><text x="245" y="118">5</text><text x="285" y="118">6</text>
    <text x="325" y="118">7</text><text x="365" y="118">8</text><text x="405" y="118">9</text>
    <text x="445" y="118">10</text><text x="485" y="118">11</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#7a7a7a" text-anchor="middle">
    <text x="65" y="146">0</text><text x="505" y="146">→</text>
  </g>

  <!-- 区间覆盖：low=3, high=7 -->
  <path d="M 145 165 L 145 138" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 325 165 L 325 138" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 150 158 L 320 158" stroke="#b85450" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="180" font-size="13" fill="#b85450" filter="url(#rough2)" text-anchor="middle">low = 3, high = 7</text>

  <!-- 容斥 -->
  <text x="280" y="222" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)" font-weight="bold">奇数从「0 开始两两成对」：1,2 | 3,4 | 5,6 | …</text>
  <g filter="url(#rough2)">
    <rect x="110" y="240" width="440" height="0" fill="none"/>
  </g>
  <text x="280" y="252" font-size="14" fill="#446688" text-anchor="middle" filter="url(#rough2)">f(7) = ⌊8/2⌋ = 4（奇数 1,3,5,7）</text>
  <text x="280" y="276" font-size="14" fill="#446688" text-anchor="middle" filter="url(#rough2)">f(2) = ⌊3/2⌋ = 1（奇数 1）</text>
  <text x="280" y="300" font-size="15" fill="#b85450" text-anchor="middle" filter="url(#rough2)" font-weight="bold">答案 = f(high) − f(low−1) = 4 − 1 = 3</text>

  <rect x="70" y="322" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="347" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)" font-weight="bold">O(1) 公式：⌊(high+1)/2⌋ − ⌊low/2⌋</text>
</svg>
