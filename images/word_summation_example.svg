<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：21 + 210 == 231 ?</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- firstWord -->
  <g filter="url(#sk)">
    <rect x="55" y="62" width="250" height="88" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="180" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">firstWord = "acb"</text>
  <g font-size="11" fill="#444" font-family="monospace">
    <text x="72" y="104">a → 0</text>
    <text x="72" y="119">c → 2</text>
    <text x="72" y="134">b → 1</text>
    <text x="72" y="146" fill="#2b6e9e" font-weight="bold">"021" → 21</text>
  </g>

  <!-- plus -->
  <text x="320" y="112" text-anchor="middle" font-size="24" fill="#3a3a3a" font-weight="bold">+</text>

  <!-- secondWord -->
  <g filter="url(#sk)">
    <rect x="335" y="62" width="250" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="460" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">secondWord = "cba"</text>
  <g font-size="11" fill="#444" font-family="monospace">
    <text x="352" y="104">c → 2</text>
    <text x="352" y="119">b → 1</text>
    <text x="352" y="134">a → 0</text>
    <text x="352" y="146" fill="#2e6e2e" font-weight="bold">"210" → 210</text>
  </g>

  <!-- sum -->
  <path d="M 320 155 Q 320 170 320 180" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="200" y="186" width="240" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="320" y="213" text-anchor="middle" font-size="17" fill="#a04038" font-family="monospace" font-weight="bold">21 + 210 = 231</text>

  <!-- targetWord -->
  <g filter="url(#sk)">
    <rect x="170" y="248" width="300" height="88" rx="10" fill="#fef6e6" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">targetWord = "cdb"</text>
  <g font-size="11" fill="#444" font-family="monospace">
    <text x="205" y="290">c → 2</text>
    <text x="205" y="305">d → 3</text>
    <text x="205" y="320">b → 1</text>
    <text x="205" y="332" fill="#7a5415" font-weight="bold">"231" → 231</text>
    <text x="330" y="305" font-size="14">两数值相等</text>
    <text x="330" y="323" font-size="14" font-weight="bold" fill="#2e6e2e">返回 true ✓</text>
  </g>

  <!-- Note -->
  <g filter="url(#sk)">
    <rect x="40" y="350" width="560" height="22" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="365" text-anchor="middle" font-size="11" fill="#888">比较 21 + 210 == 231 → true。若数值不等（如 "aab" → 1 ≠ 0 + 0）则返回 false。</text>
</svg>
