<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 704" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="704" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：10 条位置队列 + 逐字符判定</text>

  <rect x="165" y="36" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：读入 s、t</text>

  <path d="M 260 66 L 260 78" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="105" y="82" width="310" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 扫描 s，建 10 条位置队列 pos[0..9]</text>
  <text x="260" y="118" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pos[d] 按出现顺序记录 d 的所有下标（递增）</text>

  <path d="M 260 128 L 260 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="105" y="144" width="310" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="161" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② 取 t 的下一个字符 d</text>
  <text x="260" y="176" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">从左到右，i = 0, 1, 2, …</text>

  <path d="M 260 182 L 260 194" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="105" y="198" width="310" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">③ p ← pos[d] 队首</text>
  <text x="260" y="230" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">即 s 中最靠左的未使用 d 的下标</text>

  <path d="M 260 236 L 260 248" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,252 400,294 260,336 120,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">pos[d] 为空？</text>
  <text x="260" y="307" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（t 的 d 比 s 的多）</text>

  <path d="M 400 294 L 416 294" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="406" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="420" y="278" width="88" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="464" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <path d="M 260 336 L 260 350" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="348" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="105" y="354" width="310" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">④ 对每个 c = 0..d−1 检查 pos[c] 队首</text>
  <text x="260" y="390" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">队首 q 存在且 q &lt; p ⇔ 更小的数字挡在左边</text>

  <path d="M 260 400 L 260 412" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,416 400,458 260,500 120,458" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="454" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">存在挡路的 q &lt; p ？</text>
  <text x="260" y="471" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（d 永远越不过这个 c）</text>

  <path d="M 400 458 L 416 458" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="406" y="449" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="420" y="442" width="88" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="464" y="462" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <path d="M 260 500 L 260 514" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="512" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="105" y="518" width="310" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="541" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">⑤ 消耗这个 d：弹出 pos[d] 队首</text>

  <path d="M 260 554 L 260 566" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,570 340,600 260,630 180,600" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="260" y="605" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">t 处理完？</text>

  <path d="M 180 600 L 60 600 L 60 163 L 101 163" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="64" y="152" font-size="10.5" fill="#b07818" font-weight="bold" filter="url(#rough2)">否，下一字符</text>

  <path d="M 260 630 L 260 644" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="271" y="642" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="200" y="648" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="670" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 true</text>

  <text x="260" y="696" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">时间 O(10n)：每字符至多查 9 个更小数字；空间 O(n)：10 条队列共 n 个下标</text>
</svg>
