<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：nums = [−1, 1, 0] 全部 6 个窗口走查</text>

  <!-- 顶部数组 -->
  <text x="258" y="59" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">nums =</text>
  <rect x="266" y="40" width="36" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="302" y="40" width="36" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="338" y="40" width="36" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="284" y="84" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="320" y="84" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="356" y="84" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>

  <!-- 表头 -->
  <rect x="50" y="96" width="540" height="26" rx="4" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="113" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555" filter="url(#rough2)">(i, j)</text>
  <text x="195" y="113" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555" filter="url(#rough2)">子数组</text>
  <text x="295" y="113" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555" filter="url(#rough2)">sum</text>
  <text x="400" y="113" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555" filter="url(#rough2)">值集合 vals</text>
  <text x="510" y="113" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555" filter="url(#rough2)">命中？</text>

  <!-- 行 1：i=0 j=0 -->
  <rect x="50" y="126" width="540" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="145" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">(0, 0)</text>
  <text x="195" y="145" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">[−1]</text>
  <text x="295" y="145" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">−1</text>
  <text x="400" y="145" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">{−1}</text>
  <text x="510" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行 2：i=0 j=1 -->
  <rect x="50" y="158" width="540" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="177" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">(0, 1)</text>
  <text x="195" y="177" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">[−1, 1]</text>
  <text x="295" y="177" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="400" y="177" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">{−1, 1}</text>
  <text x="510" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗（0 不在）</text>

  <!-- 行 3：i=0 j=2 -->
  <rect x="50" y="190" width="540" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="209" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">(0, 2)</text>
  <text x="195" y="209" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">[−1, 1, 0]</text>
  <text x="295" y="209" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="400" y="209" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">{−1, 1, 0}</text>
  <text x="510" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓（0 在）</text>

  <!-- 行 4：i=1 j=1 -->
  <rect x="50" y="222" width="540" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="241" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">(1, 1)</text>
  <text x="195" y="241" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">[1]</text>
  <text x="295" y="241" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="400" y="241" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">{1}</text>
  <text x="510" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行 5：i=1 j=2 -->
  <rect x="50" y="254" width="540" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="273" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">(1, 2)</text>
  <text x="195" y="273" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">[1, 0]</text>
  <text x="295" y="273" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="400" y="273" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">{1, 0}</text>
  <text x="510" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓（1 在）</text>

  <!-- 行 6：i=2 j=2 -->
  <rect x="50" y="286" width="540" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="305" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">(2, 2)</text>
  <text x="195" y="305" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">[0]</text>
  <text x="295" y="305" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <text x="400" y="305" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">{0}</text>
  <text x="510" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 底部结果框 -->
  <rect x="50" y="332" width="270" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">命中 5 个 → 答案 = 5 ✓</text>
  <rect x="340" y="332" width="250" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="348" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">示例 2 [2, −3]：[2]✓ [−3]✓</text>
  <text x="465" y="364" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">[2,−3] 的 −1 ∉ {2,−3} → 答案 2</text>

  <!-- 底部关键对照 -->
  <text x="320" y="396" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">关键对照：(0,1) 与 (0,2) 的 sum 同为 0，前者窗口里没有 0 ✗、后者刚扩入 0 ✓</text>
  <text x="320" y="414" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">——命中取决于「和」与「窗口内容」的相对关系，光盯着和看不够</text>
</svg>
