<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrgray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把等式建成带权有向图：比值 = 路径乘积</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">A / B = v ⇒ 边 A→B 权 v，边 B→A 权 1/v；查询 C / D 就是 C 到 D 的路径边权之积</text>

  <rect x="58" y="92" width="446" height="146" fill="none" stroke="#446688" stroke-width="1.3"
        stroke-dasharray="6 5" rx="14" filter="url(#rough2)"/>
  <text x="74" y="114" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">同一连通块：比值可沿任意路径传递</text>

  <circle cx="130" cy="170" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="176" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">a</text>
  <circle cx="290" cy="170" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="176" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">b</text>
  <circle cx="450" cy="170" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="176" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">c</text>

  <path d="M 154 162 L 264 162" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="209" y="153" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">a/b = 2.0</text>
  <path d="M 266 180 Q 210 214 156 180" stroke="#446688" stroke-width="1.4" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="211" y="214" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">b/a = 0.5</text>

  <path d="M 314 162 L 424 162" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="369" y="153" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">b/c = 3.0</text>
  <path d="M 426 180 Q 370 214 316 180" stroke="#446688" stroke-width="1.4" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="371" y="214" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">c/b = 0.333</text>

  <rect x="60" y="258" width="270" height="112" fill="none" stroke="#999" stroke-width="1.2"
        stroke-dasharray="5 4" rx="12" filter="url(#rough2)"/>
  <circle cx="130" cy="310" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="316" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">x</text>
  <circle cx="258" cy="310" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="316" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">y</text>
  <path d="M 152 310 L 234 310" stroke="#999" stroke-width="1.3" stroke-dasharray="4 4" fill="none"
        marker-end="url(#arrgray)" filter="url(#rough2)"/>
  <text x="195" y="298" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">无等式</text>
  <text x="195" y="352" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">另一连通块 ⇒ x/y 返回 −1.0</text>

  <rect x="352" y="258" width="218" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="366" y="280" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">查询演算</text>
  <text x="366" y="302" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">a/c = 2.0 × 3.0 = 6.0</text>
  <text x="366" y="322" font-size="10" fill="#555" filter="url(#rough2)">路径 a→b→c，边权连乘</text>
  <text x="366" y="342" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">b/a = 0.5（反向边的权）</text>
  <text x="366" y="361" font-size="10" fill="#8a3a36" filter="url(#rough2)">a/e：e 从未出现 ⇒ −1.0</text>

  <text x="300" y="398" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">点的编号只在 equations 里分配；只在 queries 出现的名字保持「未定义」，答案必为 −1.0</text>
</svg>
