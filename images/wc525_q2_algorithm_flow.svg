<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：算增益 → 排序 → 取前 k 大</text>
  <path d="M 160 38 Q 320 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="170" y="54" width="300" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 遍历每个 x：取十进制数字并降序排序</text>

  <path d="M 320 102 Q 320 114 320 126" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="170" y="130" width="300" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② best(x) = 降序拼成的数</text>
  <text x="320" y="168" text-anchor="middle" font-size="11" fill="#2b6e9e">如 102 → "210"，增益 gain = best(x) − x ≥ 0</text>

  <path d="M 320 178 Q 320 190 320 202" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="170" y="206" width="300" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ 把全部增益降序排序</text>

  <path d="M 320 254 Q 320 266 320 278" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 4: decision -->
  <g filter="url(#sk)">
    <polygon points="320,282 450,314 320,346 190,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="319" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">还有名额且增益 &gt; 0 ?</text>

  <path d="M 190 314 Q 130 314 120 314" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="140" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 450 314 Q 510 314 520 314" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="495" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8761a">否</text>

  <!-- accumulate loop box -->
  <g filter="url(#sk)">
    <rect x="40" y="292" width="80" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="80" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">累加进</text>
  <text x="80" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">总和</text>
  <path d="M 80 292 Q 100 250 190 240" stroke="#4a8e4a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="96" y="252" font-size="11" fill="#2e6e2e">名额 −1，看下一个</text>

  <!-- final box -->
  <g filter="url(#sk)">
    <rect x="530" y="292" width="90" height="44" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="575" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8761a">停止累加</text>
  <text x="575" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8761a">收尾</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="170" y="366" width="300" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 Σnums + 被选中的增益之和</text>
  <text x="320" y="404" text-anchor="middle" font-size="11" fill="#b85450">总和最大 10^5 × 10^9 = 10^14，必须 long long</text>
</svg>
