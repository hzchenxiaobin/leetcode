<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">核心观察：total = 2T + x（T 被数了两次）</text>

  <text x="24" y="92" font-size="13" fill="#666" filter="url(#rough2)">nums：</text>
  <rect x="80" y="66" width="36" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="66" width="36" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="66" width="36" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="90" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">−2</text>
  <text x="138" y="90" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">−1</text>
  <text x="178" y="90" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">−3</text>
  <rect x="240" y="66" width="36" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">−6</text>
  <rect x="330" y="66" width="36" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">4</text>

  <text x="138" y="122" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">特殊数字（和为 T）</text>
  <text x="258" y="122" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">和元素 = T</text>
  <text x="348" y="122" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">异常值 = x</text>

  <text x="260" y="158" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">把整个数组加起来，T 被数了两次：</text>

  <rect x="92" y="174" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b" filter="url(#rough2)">T</text>
  <text x="170" y="198" text-anchor="middle" font-size="16" fill="#555" filter="url(#rough2)">+</text>
  <rect x="188" y="174" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="216" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">T</text>
  <text x="266" y="198" text-anchor="middle" font-size="16" fill="#555" filter="url(#rough2)">+</text>
  <rect x="284" y="174" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="312" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">x</text>
  <text x="362" y="198" text-anchor="middle" font-size="16" fill="#555" filter="url(#rough2)">=</text>
  <rect x="380" y="174" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="412" y="197" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">total</text>

  <text x="120" y="228" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">特殊数字求和</text>
  <text x="216" y="228" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">和元素的值</text>
  <text x="312" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">异常值贡献</text>
  <text x="412" y="228" text-anchor="middle" font-size="10.5" fill="#99741c" filter="url(#rough2)">数组总和</text>

  <path d="M 260 240 L 260 256" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="262" width="320" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">移项：x = total − 2T</text>
  <text x="260" y="307" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">T 必然是数组中的某个元素（和元素本身）</text>

  <rect x="28" y="352" width="142" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="99" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">① 枚举 s 当 T</text>
  <text x="99" y="395" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">s ∈ nums</text>
  <path d="M 172 380 L 194 380" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <rect x="198" y="352" width="142" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="269" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">② O(1) 反解</text>
  <text x="269" y="395" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cand = total − 2s</text>
  <path d="M 342 380 L 364 380" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <rect x="368" y="352" width="128" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="432" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">③ 查 cnt[cand]</text>
  <text x="432" y="395" text-anchor="middle" font-size="11" fill="#99741c" filter="url(#rough2)">带同值修正</text>
</svg>
