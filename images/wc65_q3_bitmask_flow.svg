<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="620" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">位掩码预处理 + 记忆化回溯</text>
  <text x="330" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">状态只含"当前行"：同一行串无论从哪条路径来，后续能否到顶完全一样</text>

  <!-- ① 预处理 -->
  <rect x="45" y="64" width="330" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="84" font-size="11" fill="#33465f" font-weight="bold" filter="url(#rough2)">① 预处理：mask[a][b] 的第 c 位置 1</text>
  <text x="60" y="101" font-size="10" fill="#555" filter="url(#rough2)">6×6 的整数表，(左底, 右底) → 候选顶块集合</text>

  <path d="M 210 110 L 210 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 判定：长度 1 -->
  <polygon points="210,128 375,158 210,188 45,158" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="162" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">len(row) == 1 ?</text>

  <path d="M 375 158 L 402 158" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="406" y="136" width="225" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="156" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">到底了 → 返回 True</text>
  <text x="420" y="172" font-size="9.5" fill="#777" filter="url(#rough2)">这就是成功出口</text>

  <path d="M 210 188 L 210 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 判定：记忆化 -->
  <polygon points="210,206 375,236 210,266 45,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="240" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">row ∈ memo ?</text>

  <path d="M 375 236 L 402 236" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="406" y="214" width="225" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="234" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">命中 → 直接返回缓存值</text>
  <text x="420" y="250" font-size="9.5" fill="#777" filter="url(#rough2)">同一行串只求解一次</text>

  <path d="M 210 266 L 210 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 求掩码 + 剪枝 -->
  <rect x="45" y="284" width="330" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="304" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">② 逐位置求 mask(row[i], row[i+1])</text>
  <text x="60" y="321" font-size="10" fill="#555" filter="url(#rough2)">任一位置为 0 → 整行无解，直接 False（剪枝）</text>

  <path d="M 210 334 L 210 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 回溯生成下一行 -->
  <rect x="45" y="352" width="330" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="372" font-size="11" fill="#33465f" font-weight="bold" filter="url(#rough2)">③ 回溯填下一行：枚举掩码中的每位</text>
  <text x="60" y="389" font-size="10" fill="#555" filter="url(#rough2)">low = m &amp; −m 取最低位，m &amp;= m−1 试下一个</text>

  <path d="M 210 402 L 210 420" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑥ 递归 -->
  <rect x="45" y="420" width="330" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="440" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">④ 填满一行 → 递归 dfs(next_row)</text>
  <text x="60" y="457" font-size="10" fill="#555" filter="url(#rough2)">任一条分支成功 → 本行 True，立即返回</text>

  <path d="M 210 470 L 210 488" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑦ 记忆化失败 -->
  <rect x="45" y="488" width="330" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="508" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">⑤ 所有候选都失败 → memo[row] = False</text>
  <text x="60" y="525" font-size="10" fill="#555" filter="url(#rough2)">回溯弹出缓冲区的最后一位，继续试兄弟</text>

  <text x="330" y="572" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">状态数上限 Σ(k=1..6) 6^k = 55986，每状态至多 6 个分支</text>
  <text x="330" y="592" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">而不加记忆化的朴素回溯约 6^15 ≈ 4.7×10^11 条路径</text>
</svg>
