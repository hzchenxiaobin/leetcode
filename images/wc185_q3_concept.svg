<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#fafafa"/>
  <text x="460" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：蛙鸣是区间，青蛙是可复用资源，答案 = 峰值并发</text>
  <path d="M 250 38 Q 460 46 670 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左：区间视角 ===== -->
  <g filter="url(#sk)">
    <rect x="26" y="58" width="540" height="330" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5,4"/>
  </g>
  <text x="296" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">「crcoakroak」的区间视角（示例 2）</text>

  <!-- 字符格 -->
  <g filter="url(#sk)">
    <rect x="44" y="94" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="93" y="94" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="142" y="94" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="191" y="94" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="240" y="94" width="46" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="289" y="94" width="46" height="32" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="338" y="94" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="387" y="94" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="436" y="94" width="46" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="485" y="94" width="46" height="32" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
  </g>
  <text x="67" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">c</text>
  <text x="116" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24">r</text>
  <text x="165" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">c</text>
  <text x="214" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">o</text>
  <text x="263" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3830">a</text>
  <text x="312" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">k</text>
  <text x="361" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24">r</text>
  <text x="410" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">o</text>
  <text x="459" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3830">a</text>
  <text x="508" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">k</text>
  <text x="67" y="141" text-anchor="middle" font-size="8.5" fill="#999">0</text>
  <text x="116" y="141" text-anchor="middle" font-size="8.5" fill="#999">1</text>
  <text x="165" y="141" text-anchor="middle" font-size="8.5" fill="#999">2</text>
  <text x="214" y="141" text-anchor="middle" font-size="8.5" fill="#999">3</text>
  <text x="263" y="141" text-anchor="middle" font-size="8.5" fill="#999">4</text>
  <text x="312" y="141" text-anchor="middle" font-size="8.5" fill="#999">5</text>
  <text x="361" y="141" text-anchor="middle" font-size="8.5" fill="#999">6</text>
  <text x="410" y="141" text-anchor="middle" font-size="8.5" fill="#999">7</text>
  <text x="459" y="141" text-anchor="middle" font-size="8.5" fill="#999">8</text>
  <text x="508" y="141" text-anchor="middle" font-size="8.5" fill="#999">9</text>

  <!-- 重叠带 -->
  <g filter="url(#sk)">
    <rect x="142" y="148" width="193" height="68" rx="4" fill="#fce4ec" fill-opacity="0.45" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3"/>
    <!-- 两声蛙鸣的区间条 -->
    <rect x="44" y="152" width="291" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="142" y="188" width="389" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="190" y="167" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5a24">青蛙 A 的一声 croak：位置 0–5</text>
  <text x="336" y="203" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e">青蛙 B 的一声 croak：位置 2–9</text>
  <text x="238" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8f3830">重叠段：两声同时在叫 → 此刻必须 2 只青蛙在场</text>

  <!-- 并发曲线 -->
  <text x="44" y="262" font-size="11" font-weight="bold" fill="#555">在飞蛙鸣数 cur = #c − #k（前缀）</text>
  <g filter="url(#sk)">
    <path d="M 52 286 L 531 286" stroke="#e8c8c4" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
    <path d="M 52 316 L 531 316" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
    <path d="M 52 346 L 531 346" stroke="#bbb" stroke-width="1.2" fill="none"/>
    <path d="M 140 286 L 531 286" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5,4" fill="none"/>
    <path d="M 49 346 L 49 316 L 147 316 L 147 286 L 294 286 L 294 316 L 490 316 L 490 346"
          stroke="#446688" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    <circle cx="49" cy="316" r="3.5" fill="#446688"/>
    <circle cx="147" cy="286" r="4" fill="#b85450"/>
    <circle cx="490" cy="346" r="3.5" fill="#4a7a3a"/>
  </g>
  <text x="40" y="290" text-anchor="middle" font-size="9" fill="#8f3830">2</text>
  <text x="40" y="320" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="40" y="350" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="147" y="276" text-anchor="middle" font-size="10" font-weight="bold" fill="#8f3830">峰值 2</text>
  <text x="531" y="280" text-anchor="end" font-size="10" font-weight="bold" fill="#8f3830">峰值 = 2 = 最少青蛙数</text>
  <text x="288" y="376" text-anchor="middle" font-size="9.5" fill="#888">cur 只在 'c' 处 +1、'k' 处 −1，其余字符不变</text>

  <!-- ===== 右：状态机 ===== -->
  <g filter="url(#sk)">
    <rect x="586" y="58" width="308" height="330" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5,4"/>
  </g>
  <text x="740" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">青蛙 = 可循环的 5 状态机</text>

  <text x="648" y="108" text-anchor="end" font-size="9.5" fill="#888">cnt[c]</text>
  <text x="648" y="160" text-anchor="end" font-size="9.5" fill="#888">cnt[r]</text>
  <text x="648" y="212" text-anchor="end" font-size="9.5" fill="#888">cnt[o]</text>
  <text x="648" y="264" text-anchor="end" font-size="9.5" fill="#888">cnt[a]</text>
  <text x="648" y="316" text-anchor="end" font-size="9.5" fill="#888">cnt[k]</text>

  <g filter="url(#sk)">
    <circle cx="688" cy="104" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="688" cy="156" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="688" cy="208" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="688" cy="260" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="688" cy="312" r="20" fill="#f0f0f0" stroke="#888" stroke-width="1.8"/>
    <path d="M 688 124 L 688 136" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 688 176 L 688 188" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 688 228 L 688 240" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 688 280 L 688 292" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 708 312 C 786 296, 786 120, 710 106" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none" marker-end="url(#arrR)"/>
  </g>
  <text x="688" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">c</text>
  <text x="688" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24">r</text>
  <text x="688" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">o</text>
  <text x="688" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3830">a</text>
  <text x="688" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">k</text>
  <text x="740" y="356" text-anchor="middle" font-size="9.5" fill="#8f3830">叫完 'k' 的青蛙立刻空闲，可从 'c' 再开一声</text>

  <!-- ===== 底部：三个要点 ===== -->
  <g filter="url(#sk)">
    <rect x="26" y="410" width="282" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="322" y="410" width="282" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="618" y="410" width="282" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="167" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">① 每声 croak = 一个区间</text>
  <text x="40" y="454" font-size="10.5" fill="#444">从它的 'c' 开始，到配对的 'k' 结束</text>
  <text x="40" y="476" font-size="10.5" fill="#444">青蛙串行发音：一声未完不能再开</text>
  <text x="463" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">② 最少青蛙 = 峰值并发</text>
  <text x="336" y="454" font-size="10.5" fill="#444">答案 = max 前缀 (#c − #k)</text>
  <text x="336" y="476" font-size="10.5" fill="#444">区间划分模型，同 253. 会议室 II</text>
  <text x="759" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5a24">③ 计数器代替个体追踪</text>
  <text x="632" y="454" font-size="10.5" fill="#444">cnt[s] = 已发 s、未发下一音的蛙数</text>
  <text x="632" y="476" font-size="10.5" fill="#444">是哪只不重要，数量才决定答案</text>
</svg>
