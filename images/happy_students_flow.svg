<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 610"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="610" fill="#fafafa"/>

  <!-- 开始 -->
  <ellipse cx="230" cy="48" rx="58" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="54" text-anchor="middle" font-size="14" fill="#b27a10" filter="url(#rough2)">开始</text>

  <path d="M 230 70 L 230 92" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序 -->
  <rect x="115" y="96" width="230" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="123" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">sort(nums) 升序</text>

  <path d="M 230 140 L 230 162" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 枚举 k -->
  <rect x="115" y="166" width="230" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="193" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">枚举 k = 0, 1, …, n</text>

  <path d="M 230 210 L 230 232" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1 -->
  <polygon points="230,236 340,282 230,328 120,282" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="276" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">k == 0 或</text>
  <text x="230" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">nums[k−1] &lt; k ?</text>

  <path d="M 340 282 L 458 282" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="274" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 230 328 L 230 356" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="348" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 菱形 2 -->
  <polygon points="230,360 340,406 230,452 120,406" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="400" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">k == n 或</text>
  <text x="230" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">nums[k] &gt; k ?</text>

  <path d="M 340 406 L 458 406" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="398" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 230 452 L 230 476" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="470" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- ans++ -->
  <rect x="130" y="480" width="200" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="506" text-anchor="middle" font-size="14" font-weight="bold" fill="#b27a10" filter="url(#rough2)">ans += 1</text>

  <!-- 回环 -->
  <path d="M 330 501 L 458 501 L 458 188 L 352 188" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="472" y="345" transform="rotate(90 472 345)" text-anchor="middle" font-size="12" fill="#b27a10" filter="url(#rough2)">下一个 k</text>

  <!-- 返回 -->
  <path d="M 230 522 L 230 546" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="230" cy="572" rx="70" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="578" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">return ans</text>
</svg>
