<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">重排不等式：cnt 与 nums 同向排序后配对</text>

  <!-- 第一行：cnt 升序 -->
  <text x="90" y="72" text-anchor="end" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt 升序</text>
  <g filter="url(#rough2)">
    <rect x="130" y="52" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="210" y="52" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="290" y="52" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="370" y="52" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="450" y="52" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="162" y="74">0</text>
    <text x="242" y="74">1</text>
    <text x="322" y="74">1</text>
    <text x="402" y="74">1</text>
    <text x="482" y="74" fill="#b8860b" font-weight="bold">2</text>
  </g>

  <!-- 第二行：nums 升序 -->
  <text x="90" y="162" text-anchor="end" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums 升序</text>
  <g filter="url(#rough2)">
    <rect x="130" y="142" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="210" y="142" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="290" y="142" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="370" y="142" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="450" y="142" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="162" y="164">1</text>
    <text x="242" y="164">2</text>
    <text x="322" y="164">3</text>
    <text x="402" y="164">4</text>
    <text x="482" y="164" fill="#b8860b" font-weight="bold">5</text>
  </g>

  <!-- 配对箭头 -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.8" fill="none">
    <path d="M 162 88 C 162 108, 162 118, 162 138" marker-end="url(#arr)"/>
    <path d="M 242 88 C 242 108, 242 118, 242 138" marker-end="url(#arr)"/>
    <path d="M 322 88 C 322 108, 322 118, 322 138" marker-end="url(#arr)"/>
    <path d="M 402 88 C 402 108, 402 118, 402 138" marker-end="url(#arr)"/>
    <path d="M 482 88 C 482 106, 482 120, 482 138" marker-end="url(#arr)" stroke-width="2.5"/>
  </g>

  <!-- 乘积标注 -->
  <g filter="url(#rough2)" font-size="12" fill="#4a7a3a" text-anchor="middle">
    <text x="162" y="205">0×1</text>
    <text x="242" y="205">1×2</text>
    <text x="322" y="205">1×3</text>
    <text x="402" y="205">1×4</text>
    <text x="482" y="205" font-weight="bold">2×5</text>
  </g>

  <!-- 交换论证示意 -->
  <g filter="url(#rough2)">
    <rect x="70" y="228" width="420" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="251">交换论证：若 a_i ≤ a_j 而 b_i &gt; b_j（逆序配对），交换 b_i、b_j</text>
    <text x="280" y="271">收益 = (a_j − a_i)(b_i − b_j) ≥ 0 ⇒ 消灭逆序不减小总和 ⇒ 同序最优</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="130" y="300" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="326" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">0+2+3+4+10 = 19 = 最大查询和</text>
</svg>
