<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：必须买两块 → 最省方案就是两个最小值</text>

  <!-- 价格数组 5 个格子 -->
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="60" y="64" width="46" height="42" rx="4" fill="#eef0f2" stroke="#999" stroke-width="1.4"/>
    <text x="83" y="90" fill="#777">4</text>
    <rect x="126" y="64" width="46" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="149" y="90" fill="#8c3a36" font-size="16">1</text>
    <rect x="192" y="64" width="46" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="215" y="90" fill="#7a5a10" font-size="16">2</text>
    <rect x="258" y="64" width="46" height="42" rx="4" fill="#eef0f2" stroke="#999" stroke-width="1.4"/>
    <text x="281" y="90" fill="#777">7</text>
    <rect x="324" y="64" width="46" height="42" rx="4" fill="#eef0f2" stroke="#999" stroke-width="1.4"/>
    <text x="347" y="90" fill="#777">2</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" fill="#8c3a36">
    <text x="149" y="124">m₁ 全局最小</text>
    <text x="215" y="124" fill="#7a5a10">m₂ 次小</text>
    <text x="83" y="124" fill="#999">其余价格都无关</text>
  </g>
  <path d="M120 138 Q 165 152 195 140" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="165" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">只需这两个数！</text>

  <!-- money 判定框 -->
  <rect x="400" y="56" width="108" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#2f4a66">
    <text x="454" y="80" text-anchor="middle">money = 3</text>
    <text x="454" y="102" text-anchor="middle">cost = m₁+m₂</text>
    <text x="454" y="120" text-anchor="middle">= 1 + 2 = 3</text>
    <text x="454" y="142" text-anchor="middle" fill="#4a7a3a">3 ≤ 3 ✓</text>
    <text x="454" y="160" text-anchor="middle" fill="#4a7a3a">剩 3 − 3 = 0</text>
  </g>

  <rect x="40" y="186" width="440" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#2f5527">
    <text x="58" y="210">买“恰好两块”且剩余非负 → 最小化花费 = 选两个最便宜的</text>
    <text x="58" y="232">两个最便宜的和 cost 一旦 &gt; money，任何别的两块更贵，更买不起</text>
    <text x="58" y="254">→ 此时一块都不用买，原封不动返回 money</text>
    <text x="58" y="270" font-size="11" fill="#5a7a4a">不需要排序：一次遍历同时维护最小值与次小值即可</text>
  </g>
</svg>
