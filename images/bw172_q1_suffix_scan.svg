<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">nums = [3,8,3,6,5,8]：从右往左找最长「互不相同」后缀</text>

  <!-- 格子 -->
  <rect x="76" y="62" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="102" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="132" y="62" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <rect x="188" y="62" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="214" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="244" y="62" width="52" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <rect x="300" y="62" width="52" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="326" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="356" y="62" width="52" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="382" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>

  <text x="102" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="158" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="214" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="270" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="326" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="382" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <!-- 扫描方向 -->
  <path d="M390,136 L200,136" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="300" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">倒序扫描，遇到 8 已出现过 → 停</text>

  <!-- p 标记 -->
  <path d="M214,44 L214,58" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="214" y="38" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p = 2</text>

  <!-- 结论 -->
  <rect x="70" y="180" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="170" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">最长合法后缀 [6,5,8]</text>
  <text x="170" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">起点 p = 2</text>

  <rect x="292" y="180" width="180" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="382" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = ⌈p / 3⌉ = 1</text>
  <text x="382" y="218" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">删除前 3 个即可</text>

  <text x="260" y="266" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">「后缀互不相同」关于起点单调 ⇒ 从右往左扫到第一个冲突即边界</text>
</svg>
