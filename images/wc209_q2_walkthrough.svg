<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arY" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#999999"/></marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：逐层哨兵扫描（一次通过 / 两种失败）</text>

  <!-- 左面板：示例 1 全过程 -->
  <g filter="url(#r)">
    <rect x="20" y="34" width="320" height="312" rx="10" fill="#f5f8fd" stroke="#b8c8e0" stroke-width="1.5"/>
  </g>
  <text x="180" y="56" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#r)">示例 1 → true</text>

  <text x="44" y="104" font-size="10" font-weight="bold" fill="#446688" filter="url(#r)">L0·偶</text>
  <text x="44" y="156" font-size="10" font-weight="bold" fill="#a67c1b" filter="url(#r)">L1·奇</text>
  <text x="44" y="208" font-size="10" font-weight="bold" fill="#446688" filter="url(#r)">L2·偶</text>
  <text x="44" y="260" font-size="10" font-weight="bold" fill="#a67c1b" filter="url(#r)">L3·奇</text>

  <!-- L0 -->
  <g filter="url(#r)">
    <rect x="100" y="88" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="112" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66" filter="url(#r)">1</text>
  <text x="100" y="128" font-size="9" fill="#555" filter="url(#r)">奇 ✓ · 单节点层，单调性平凡 ✓</text>

  <!-- L1 -->
  <g filter="url(#r)">
    <rect x="100" y="140" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="160" y="140" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="112" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#r)">10</text>
  <text x="172" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#r)">4</text>
  <line x1="126" y1="152" x2="154" y2="152" stroke="#b85450" stroke-width="1.6" marker-end="url(#arR)" filter="url(#r)"/>
  <text x="140" y="136" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#r)">10＞4</text>
  <text x="100" y="180" font-size="9" fill="#555" filter="url(#r)">偶 ✓ 偶 ✓ · prev 10^6→10→4，严格递减 ✓</text>

  <!-- L2 -->
  <g filter="url(#r)">
    <rect x="100" y="192" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="160" y="192" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="220" y="192" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="112" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66" filter="url(#r)">3</text>
  <text x="172" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66" filter="url(#r)">7</text>
  <text x="232" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66" filter="url(#r)">9</text>
  <line x1="126" y1="204" x2="154" y2="204" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arG)" filter="url(#r)"/>
  <line x1="186" y1="204" x2="214" y2="204" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arG)" filter="url(#r)"/>
  <text x="140" y="188" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#r)">3＜7</text>
  <text x="200" y="188" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#r)">7＜9</text>
  <text x="100" y="232" font-size="9" fill="#555" filter="url(#r)">奇 ✓×3 · prev 0→3→7→9，严格递增 ✓</text>

  <!-- L3 -->
  <g filter="url(#r)">
    <rect x="100" y="244" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="160" y="244" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="220" y="244" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="280" y="244" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="112" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#r)">12</text>
  <text x="172" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#r)">8</text>
  <text x="232" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#r)">6</text>
  <text x="292" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#r)">2</text>
  <line x1="126" y1="256" x2="154" y2="256" stroke="#b85450" stroke-width="1.6" marker-end="url(#arR)" filter="url(#r)"/>
  <line x1="186" y1="256" x2="214" y2="256" stroke="#b85450" stroke-width="1.6" marker-end="url(#arR)" filter="url(#r)"/>
  <line x1="246" y1="256" x2="274" y2="256" stroke="#b85450" stroke-width="1.6" marker-end="url(#arR)" filter="url(#r)"/>
  <text x="140" y="240" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#r)">12＞8</text>
  <text x="200" y="240" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#r)">8＞6</text>
  <text x="260" y="240" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#r)">6＞2</text>
  <text x="100" y="284" font-size="9" fill="#555" filter="url(#r)">偶 ✓×4 · prev 10^6→12→8→6→2，严格递减 ✓</text>

  <!-- 结果徽章 -->
  <g filter="url(#r)">
    <rect x="60" y="304" width="240" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="180" y="323" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e4d27" filter="url(#r)">四层全部通过 → 返回 true ✓</text>

  <!-- 右上卡片：示例 2 -->
  <g filter="url(#r)">
    <rect x="352" y="34" width="288" height="172" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="496" y="56" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">示例 2 → false（不严格）</text>
  <text x="372" y="72" font-size="9.5" fill="#446688" filter="url(#r)">L2·偶层（应严格递增）</text>
  <g filter="url(#r)">
    <rect x="386" y="74" width="94" height="36" rx="9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/>
  </g>
  <g filter="url(#r)">
    <rect x="392" y="80" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="452" y="80" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="512" y="80" width="24" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/>
  </g>
  <text x="404" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66" filter="url(#r)">3</text>
  <text x="464" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66" filter="url(#r)">3</text>
  <text x="524" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#777" filter="url(#r)">7</text>
  <line x1="418" y1="92" x2="448" y2="92" stroke="#b85450" stroke-width="1.6" marker-end="url(#arR)" filter="url(#r)"/>
  <line x1="478" y1="92" x2="508" y2="92" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arY)" filter="url(#r)"/>
  <text x="433" y="122" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#r)">3 ≤ 3，相等 ✗</text>
  <text x="372" y="150" font-size="10" fill="#555" filter="url(#r)">第 2 层应严格递增，相邻的 3、3 相等</text>
  <text x="372" y="168" font-size="10" fill="#b85450" filter="url(#r)">→ 触发 v ≤ prev，立即返回 false</text>
  <text x="372" y="188" font-size="9.5" fill="#888" filter="url(#r)">（后面的 7 不再检查）</text>

  <!-- 右下卡片：示例 3 -->
  <g filter="url(#r)">
    <rect x="352" y="218" width="288" height="172" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="496" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a67c1b" filter="url(#r)">示例 3 → false（奇偶不符）</text>
  <text x="372" y="256" font-size="9.5" fill="#a67c1b" filter="url(#r)">L1·奇层（要求偶数值）</text>
  <g filter="url(#r)">
    <rect x="392" y="264" width="24" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="452" y="264" width="24" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/>
  </g>
  <text x="404" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3230" filter="url(#r)">9</text>
  <text x="464" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#777" filter="url(#r)">1</text>
  <text x="420" y="266" font-size="10" font-weight="bold" fill="#b85450" filter="url(#r)">✗</text>
  <line x1="418" y1="276" x2="448" y2="276" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arY)" filter="url(#r)"/>
  <text x="372" y="314" font-size="10" fill="#555" filter="url(#r)">第 1 层要求偶数值，9 是奇数</text>
  <text x="372" y="332" font-size="10" fill="#b85450" filter="url(#r)">→ v % 2 == level % 2，立即返回 false</text>
  <text x="372" y="352" font-size="9.5" fill="#888" filter="url(#r)">（后面的 1 与单调性检查都执行不到）</text>

  <text x="330" y="414" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">检查顺序：先奇偶、后严格单调——任一失败立即返回 false，不再触碰后面的层</text>
</svg>
