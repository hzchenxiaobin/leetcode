<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="404" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">对照记忆：哪些写法能过，哪些一定挂</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">左右各五例，右边每一行都对应一条被违反的规则</text>

  <g filter="url(#rough2)">
    <rect x="26" y="62" width="272" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="162" y="81" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">✓ 合法</text>

    <rect x="322" y="62" width="272" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="458" y="81" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">✗ 非法</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="26" y="98" width="272" height="50" fill="#ffffff" stroke="#7aa86a" stroke-width="1.3" rx="8"/>
    <text x="40" y="118" font-size="10.5" fill="#333">&lt;A&gt;&lt;/A&gt;</text>
    <text x="40" y="136" font-size="9.5" fill="#4a7a3a">内容为空也合法，别要求非空</text>

    <rect x="26" y="156" width="272" height="50" fill="#ffffff" stroke="#7aa86a" stroke-width="1.3" rx="8"/>
    <text x="40" y="176" font-size="10.5" fill="#333">&lt;A&gt;&lt;B&gt;&lt;/B&gt;&lt;/A&gt;</text>
    <text x="40" y="194" font-size="9.5" fill="#4a7a3a">正常嵌套，后开先闭</text>

    <rect x="26" y="214" width="272" height="50" fill="#ffffff" stroke="#7aa86a" stroke-width="1.3" rx="8"/>
    <text x="40" y="234" font-size="10.5" fill="#333">&lt;A&gt;&lt;![CDATA[&lt;B&gt;]]&gt;&lt;/A&gt;</text>
    <text x="40" y="252" font-size="9.5" fill="#4a7a3a">cdata 内部完全不参与解析</text>

    <rect x="26" y="272" width="272" height="50" fill="#ffffff" stroke="#7aa86a" stroke-width="1.3" rx="8"/>
    <text x="40" y="292" font-size="10.5" fill="#333">&lt;A&gt;&gt;&gt; ]]&lt;/A&gt;</text>
    <text x="40" y="310" font-size="9.5" fill="#4a7a3a">文本里的 &gt;、] 都是普通字符</text>

    <rect x="26" y="330" width="272" height="46" fill="#ffffff" stroke="#7aa86a" stroke-width="1.3" rx="8"/>
    <text x="40" y="350" font-size="10.5" fill="#333">&lt;DIV&gt;hi&lt;/DIV&gt;</text>
    <text x="40" y="366" font-size="9.5" fill="#4a7a3a">名字 1..9 位全大写即可</text>

    <rect x="322" y="98" width="272" height="50" fill="#ffffff" stroke="#c07a76" stroke-width="1.3" rx="8"/>
    <text x="336" y="118" font-size="10.5" fill="#333">&lt;A&gt;&lt;/A&gt;&lt;B&gt;&lt;/B&gt;</text>
    <text x="336" y="136" font-size="9.5" fill="#8a3a36">双根：根标签之外不得有内容</text>

    <rect x="322" y="156" width="272" height="50" fill="#ffffff" stroke="#c07a76" stroke-width="1.3" rx="8"/>
    <text x="336" y="176" font-size="10.5" fill="#333">&lt;A&gt;&lt;B&gt;&lt;/A&gt;&lt;/B&gt;</text>
    <text x="336" y="194" font-size="9.5" fill="#8a3a36">交叉嵌套：栈顶是 B，却来了 A</text>

    <rect x="322" y="214" width="272" height="50" fill="#ffffff" stroke="#c07a76" stroke-width="1.3" rx="8"/>
    <text x="336" y="234" font-size="10.5" fill="#333">&lt;A &gt;&lt;/A&gt;</text>
    <text x="336" y="252" font-size="9.5" fill="#8a3a36">名字含空格 ⇒ 非法 TAG_NAME</text>

    <rect x="322" y="272" width="272" height="50" fill="#ffffff" stroke="#c07a76" stroke-width="1.3" rx="8"/>
    <text x="336" y="292" font-size="10.5" fill="#333">&lt;A&gt;&lt;![CDATA[x]]</text>
    <text x="336" y="310" font-size="9.5" fill="#8a3a36">cdata 未闭合，且根标签也没闭合</text>

    <rect x="322" y="330" width="272" height="46" fill="#ffffff" stroke="#c07a76" stroke-width="1.3" rx="8"/>
    <text x="336" y="350" font-size="10.5" fill="#333">x&lt;A&gt;&lt;/A&gt;</text>
    <text x="336" y="366" font-size="9.5" fill="#8a3a36">标签外的裸文本，栈空即报错</text>
  </g>

  <text x="310" y="394" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">一句话：栈管配对，根唯一性管两端，cdata 管「不解析」</text>
</svg>
