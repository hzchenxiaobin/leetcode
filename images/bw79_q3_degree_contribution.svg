<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：总重要性 = Σ 度数(v) × 值(v)</text>

  <!-- 中心城市 2，度数 4 -->
  <g filter="url(#rough2)">
    <circle cx="280" cy="160" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="120" cy="90" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="440" cy="90" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="120" cy="230" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="440" cy="230" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)">
    <path d="M 136 103 L 256 147" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <path d="M 424 103 L 304 147" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <path d="M 136 217 L 256 173" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <path d="M 424 217 L 304 173" stroke="#4a7a3a" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="280" y="166" fill="#b85450" font-weight="bold">城市 2</text>
    <text x="280" y="206" fill="#b85450">值 = 5</text>
    <text x="120" y="96">1</text><text x="440" y="96">3</text>
    <text x="120" y="236">0</text><text x="440" y="236">4</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#4a7a3a" text-anchor="middle">
    <text x="180" y="116">+5</text><text x="380" y="116">+5</text>
    <text x="180" y="204">+5</text><text x="380" y="204">+5</text>
  </g>
  <text x="280" y="52" font-size="13" fill="#b85450" filter="url(#rough2)" text-anchor="middle">城市 2 连了 4 条道路（度数 4）</text>
  <text x="280" y="70" font-size="13" fill="#b85450" filter="url(#rough2)" text-anchor="middle">它的值 5 会在总分里被加 4 次！</text>

  <!-- 推导框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="272" width="440" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <text x="280" y="296" text-anchor="middle">每条边 (a,b) 的重要性 = 值(a) + 值(b)，</text>
    <text x="280" y="316" text-anchor="middle">按端点拆开后：城市 v 的值恰被计入 deg(v) 次，</text>
    <text x="280" y="336" text-anchor="middle" font-weight="bold">所以总分 = Σ deg(v) × value(v)，只与度数有关！</text>
  </g>
</svg>
