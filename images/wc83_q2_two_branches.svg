<svg xmlns="http://www.w3.org/2000/svg" width="620" height="410" viewBox="0 0 620 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="25" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="410" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先判类型，再套各自的遮蔽规则</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="310.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">含 @ 就是邮箱，否则按电话号码处理</text>
  <g filter="url(#rough2)"><polygon points="310,112 400,144 310,176 220,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/></g>
  <text x="310" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">s 含 '@' ?</text>
  <text x="310" y="157" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">看是否出现 @</text>
  <path d="M 220 144 Q 189.0 171.0 170 186" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="180" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是（邮箱）</text>
  <path d="M 400 144 Q 431.0 159.0 450 186" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="452" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否（电话）</text>
  <g filter="url(#rough2)"><rect x="40" y="190" width="260" height="118" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="170" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">邮箱分支</text>
  <text x="170" y="233" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">以 '@' 切出 name 与 domain</text>
  <text x="170" y="252" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">两者整体转小写</text>
  <text x="170" y="271" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">name[0] + "*****" + name[−1]</text>
  <text x="170" y="290" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">拼接后接 '@' + domain</text>
  <g filter="url(#rough2)"><rect x="320" y="190" width="260" height="118" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="450" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">电话分支</text>
  <text x="450" y="233" text-anchor="middle" font-size="11" fill="#2e5e22" filter="url(#rough2)">抽出全部数字，得 10~13 位</text>
  <text x="450" y="252" text-anchor="middle" font-size="11" fill="#2e5e22" filter="url(#rough2)">后 10 位 = 本地号码</text>
  <text x="450" y="271" text-anchor="middle" font-size="11" fill="#2e5e22" filter="url(#rough2)">剩余 0~3 位 = 国家代码</text>
  <text x="450" y="290" text-anchor="middle" font-size="11" fill="#2e5e22" filter="url(#rough2)">本地号码只留后 4 位 XXXX</text>
  <g filter="url(#rough2)"><rect x="110" y="322" width="400" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310.0" y="344" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">分支判定只看有没有 '@'，不需要正则</text>
  <text x="310.0" y="362" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">题目保证 s 一定是合法邮箱或合法电话号码</text>
  </svg>