  <text x="360" y="186" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">t = 123456789 就是 B₁[1..10)：偏移 b=1 的必需常数 vreq[1] = (1 − 1) mod 10 = 0</text>
  <text x="360" y="208" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">s[0] = 0 → 块 a=0 的偏移 1 命中，起点 p = 1</text>
  <text x="360" y="230" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">t 又是 B₁⊕1 的前 9 位：偏移 0 的常数 1，命中 s[1] = 1 的块 → p = 10</text>
  <text x="360" y="252" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">窗口内起点只到 p = r−n+1 = 12，所以再没有别的命中</text>
  <rect x="60" y="268" width="600" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="293" text-anchor="middle" font-size="13" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">F(12) − F(0) = 2 − 0 = 2，与样例输出一致</text>
  <text x="360" y="330" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">下标 0 是延拓出来的 s₀ = 0，被 F(l−1) 这一项正好减掉</text>
