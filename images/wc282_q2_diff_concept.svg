<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：只能追加（只增不减）⇒ 每个字符的缺口都要单独补</text>

  <!-- ===== Panel A: single char c view ===== -->
  <text x="195" y="66" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">单个字符 c 的视角（例：cntS[c] = 2，cntT[c] = 5）</text>

  <!-- max dashed line -->
  <path d="M 60 140 L 345 140" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="348" y="133" text-anchor="end" font-size="10.5" font-weight="bold" fill="#a8781f" filter="url(#rough2)">max = 5</text>

  <!-- S bar: 2 units -->
  <rect x="85" y="236" width="70" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">2</text>
  <!-- T bar: 5 units -->
  <rect x="225" y="140" width="70" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">5</text>
  <text x="260" y="190" text-anchor="middle" font-size="10" fill="#2e5b2e" filter="url(#rough2)">已达标：0 步</text>

  <!-- append arrow on S bar -->
  <path d="M 120 230 L 120 148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="195" text-anchor="end" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">补 3 个 c → s</text>

  <!-- axis -->
  <path d="M 60 300 L 345 300" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">s 中的 c</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">t 中的 c</text>

  <!-- formula -->
  <text x="195" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">(5−2) + (5−5) = 3 = |2 − 5|</text>
  <text x="195" y="374" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">补 s 的步数 + 补 t 的步数 = |cntS[c] − cntT[c]|</text>

  <!-- ===== Panel B: total formula ===== -->
  <rect x="390" y="48" width="300" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">总答案：对 26 个字符求和</text>
  <text x="540" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">ans = Σ_c |cntS[c] − cntT[c]|</text>
  <g font-size="10.5" fill="#555">
    <text x="404" y="122" filter="url(#rough2)">正差（s 多）→ 向 t 追加差额</text>
    <text x="404" y="140" filter="url(#rough2)">负差（t 多）→ 向 s 追加差额</text>
    <text x="404" y="158" filter="url(#rough2)">各字符独立：补 c 不影响其他字母</text>
    <text x="404" y="180" font-size="9.5" fill="#888" filter="url(#rough2)">顺序无关 ⇒ 只看多重集合，不看排列</text>
  </g>

  <!-- ===== Panel C: compare with 1347 ===== -->
  <rect x="390" y="214" width="300" height="180" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">为什么不是 1347 的「正差和」？</text>
  <g font-size="10.5" fill="#555">
    <text x="404" y="262" filter="url(#rough2)">1347：替换一步消 1 正差 + 1 负差</text>
    <text x="404" y="280" filter="url(#rough2)">　　→ ans = Σ正差 = ½ Σ|diff|</text>
    <text x="404" y="298" filter="url(#rough2)">2186：追加一步只补 1 个缺口</text>
    <text x="404" y="316" filter="url(#rough2)">　　→ ans = Σ|diff|（本题）</text>
    <text x="404" y="342" font-weight="bold" fill="#7a5415" filter="url(#rough2)">s、t 等长时：2186 = 2 × 1347</text>
    <text x="404" y="366" font-size="9.5" fill="#888" filter="url(#rough2)">追加是单向操作，省不掉另一半差</text>
  </g>
</svg>
