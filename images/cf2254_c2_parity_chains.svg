<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">两种操作合起来 = 交换 s[i] 与 s[i+2]</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">端点不同时，中间那一位无论是 0 还是 1，都恰好是题面允许的模式</text>

  <!-- 主串 a = 0 1 0 0 1 -->
  <rect x="96" y="64" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="92" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">0</text>
  <rect x="158" y="64" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="184" y="92" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="64" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="92" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">0</text>
  <rect x="282" y="64" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="92" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">0</text>
  <rect x="344" y="64" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="92" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>

  <text x="122" y="126" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="184" y="126" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="246" y="126" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="308" y="126" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="370" y="126" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=4</text>

  <!-- 偶链 -->
  <text x="70" y="206" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">偶链</text>
  <rect x="96" y="184" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="212" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">0</text>
  <rect x="220" y="184" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="212" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">0</text>
  <rect x="344" y="184" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="212" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 154 206 L 214 206" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 278 206 L 338 206" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="180" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1 步</text>
  <text x="308" y="180" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1 步</text>

  <!-- 奇链 -->
  <text x="70" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇链</text>
  <rect x="158" y="284" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="184" y="312" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <rect x="282" y="284" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="312" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">0</text>

  <path d="M 216 306 L 276 306" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="246" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1 步</text>

  <text x="280" y="366" text-anchor="middle" font-size="13" fill="#333"
        filter="url(#rough2)">每个 1 被锁死在自己那条链里，只能在链上左右挪一格</text>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">于是两条链互不干扰，答案 = 两条链最小交换次数之和</text>
</svg>
