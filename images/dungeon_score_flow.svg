<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：前缀和 + 逐房间二分</text>

  <!-- start -->
  <rect x="205" y="38" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 260 68 L 260 82" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- P1 -->
  <rect x="130" y="84" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">计算 damage 的前缀和 S[0..n]</text>
  <path d="M 260 116 L 260 130" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- P2 loop head -->
  <rect x="130" y="132" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举房间 i = 1 … n</text>
  <path d="M 260 164 L 260 178" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- P3 -->
  <rect x="90" y="180" width="340" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">X ← S[i] + requirement[i] − hp</text>
  <text x="260" y="217" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">k ← S 中首个满足 S[k] ≥ X 的下标（二分）</text>
  <path d="M 260 226 L 260 240" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="185,278 260,244 335,278 260,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">k &lt; i ?</text>

  <!-- no branch -->
  <path d="M 335 278 L 381 278" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="271" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="383" y="262" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">贡献 0（跳过）</text>

  <!-- yes branch -->
  <path d="M 260 312 L 260 330" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="145" y="332" width="230" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans += i − k（long long）</text>

  <!-- skip box joins loop line -->
  <path d="M 435 294 L 435 392" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 260 366 L 260 392 L 500 392 L 500 148 L 394 148" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="410" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">处理完房间 i，取下一个</text>

  <!-- exit -->
  <path d="M 350 392 L 350 424" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="414" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">i &gt; n（全部处理完）</text>

  <!-- end -->
  <rect x="275" y="428" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="350" y="447" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
