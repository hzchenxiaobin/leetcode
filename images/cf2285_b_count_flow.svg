<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：先数 1，再只考察两个端点</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">翻转集合的计数只依赖 c1（1 的个数），而 c1 的可达范围是一个连续区间</text>

  <g filter="url(#rough2)">
    <rect x="30" y="64" width="340" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="200" y="83" text-anchor="middle" font-size="10.5" fill="#2c3e50">c1 = s 中 '1' 的个数，c0 = n − c1</text>
    <text x="200" y="100" text-anchor="middle" font-size="10" fill="#667">一次 O(n) 扫描，不需要真的翻转字符串</text>
  </g>

  <path d="M 200 110 L 200 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="30" y="130" width="340" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="200" y="150" text-anchor="middle" font-size="10.5" fill="#3a5a30">diversity(c) = 1 + c(c+1)/2 + (n−c)(n−c+1)/2</text>
    <text x="200" y="169" text-anchor="middle" font-size="10" fill="#667">c 是最终串里 1 的个数，c0 自动为 n−c</text>
  </g>

  <path d="M 200 182 L 200 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="30" y="202" width="340" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="200" y="222" text-anchor="middle" font-size="10.5" fill="#8a6a20">至多翻 k 个 ⇒ c1′ 取遍 [L, R]</text>
    <text x="200" y="241" text-anchor="middle" font-size="10" fill="#667">L = max(0, c1−k)，R = min(n, c1+k)</text>
  </g>

  <path d="M 200 254 L 200 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="30" y="274" width="340" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="200" y="294" text-anchor="middle" font-size="10.5" fill="#8a3a36">差分 g(c+1) − g(c) = 2c + 1 − n 单调递增</text>
    <text x="200" y="313" text-anchor="middle" font-size="10" fill="#667">故 g 是凸函数，区间最大值必落在端点</text>
  </g>

  <path d="M 390 320 L 596 320" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 320 L 390 72" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="600" y="336" text-anchor="end" font-size="10" fill="#777" filter="url(#rough2)">c</text>
  <text x="396" y="70" font-size="10" fill="#777" filter="url(#rough2)">g(c)</text>

  <path d="M 400 108 Q 493 332 586 108" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <circle cx="418" cy="146" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="567" cy="146" r="4" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 418 146 L 418 316" stroke="#b85450" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 567 146 L 567 316" stroke="#b85450" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="418" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">L</text>
  <text x="567" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">R</text>
  <text x="493" y="252" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">谷底 ≈ (n−1)/2</text>
  <text x="493" y="266" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（字符越均匀越差）</text>

  <rect x="40" y="348" width="540" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="377" text-anchor="middle" font-size="13" fill="#2f4f28" font-weight="bold" filter="url(#rough2)">答案 = max( g(L), g(R) )，只算两个候选值</text>

  <text x="310" y="416" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">直觉：同类字符越集中，可翻出的不同字符串越多 → 把 k 次翻转全用在「少的那一类」上</text>
</svg>
