<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">一次全局排序：键 = (col, row, val)</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">第一关键字解决「列的先后」，第二关键字解决「同一列从上到下」，第三关键字解决平局</text>

  <text x="24" y="72" font-size="11.5" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">遍历得到的无序结点</text>
  <rect x="24" y="82" width="230" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <text x="36" y="104" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(0, 0, 1)</text>
  <text x="36" y="122" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(−1, 1, 2)</text>
  <text x="36" y="140" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(1, 1, 3)</text>
  <text x="36" y="158" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(−2, 2, 4)</text>
  <text x="36" y="176" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(0, 2, 5)</text>
  <text x="36" y="194" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(0, 2, 6)</text>
  <text x="130" y="104" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">← 根在第一层</text>
  <text x="130" y="140" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">← 右子在下</text>
  <text x="130" y="176" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">← 5、6 同列同行</text>

  <path d="M 262 142 L 296 142" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="279" y="132" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">sort</text>

  <text x="306" y="72" font-size="11.5" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">排序后（即输出顺序）</text>
  <rect x="306" y="82" width="230" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <text x="318" y="104" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(−2, 2, 4)</text>
  <text x="318" y="122" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(−1, 1, 2)</text>
  <text x="318" y="140" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(0, 0, 1)</text>
  <text x="318" y="158" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(0, 2, 5)</text>
  <text x="318" y="176" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(0, 2, 6)</text>
  <text x="318" y="194" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(1, 1, 3)</text>
  <text x="430" y="140" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">← 行号小者在先</text>
  <text x="430" y="176" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">← 值小者在先</text>

  <rect x="24" y="220" width="512" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="240" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">按 col 分组：−2 → [4]，−1 → [2]，0 → [1,5,6]，1 → [3]，2 → [7]</text>
  <text x="36" y="260" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">排序后同一 col 的结点一定连续，一次线性扫描就能切片，不需要哈希表再按键排序。</text>

  <rect x="24" y="282" width="512" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="302" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">易错：只按 (col, val) 排会打乱同一列的上下顺序；(0,0,1) 必须排在 (0,2,5) 之前。</text>
  <text x="36" y="320" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">行号相同才轮到比较结点值，这正是题面「同行同列按值从小到大」的要求。</text>
</svg>
