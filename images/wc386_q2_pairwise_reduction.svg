<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">「区域可由多个矩形的交集构成」？归约到两两配对</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: three overlapping rectangles ===== -->
  <text x="230" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 三个矩形相交：公共交集更小</text>

  <!-- rect i -->
  <g filter="url(#sk)"><rect x="60" y="120" width="220" height="240" fill="#4a8edb" fill-opacity="0.14" stroke="#446688" stroke-width="2.2" rx="2"/></g>
  <text x="76" y="142" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">矩形 i</text>

  <!-- rect j -->
  <g filter="url(#sk)"><rect x="165" y="200" width="235" height="240" fill="#4a8e4a" fill-opacity="0.14" stroke="#4a7a3a" stroke-width="2.2" rx="2"/></g>
  <text x="392" y="222" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">矩形 j</text>

  <!-- rect k -->
  <g filter="url(#sk)"><rect x="95" y="250" width="225" height="220" fill="#d6a040" fill-opacity="0.13" stroke="#d6a040" stroke-width="2.2" rx="2"/></g>
  <text x="104" y="462" font-size="12" font-weight="bold" fill="#b07a15" filter="url(#sk)">矩形 k</text>

  <!-- triple intersection x165-280 y250-360 -->
  <g filter="url(#sk)"><rect x="165" y="250" width="115" height="110" fill="#b85450" fill-opacity="0.35" stroke="#b85450" stroke-width="2.2" rx="2"/></g>

  <text x="330" y="240" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">三重交集</text>
  <text x="330" y="256" font-size="11" fill="#b85450" filter="url(#sk)">（也是一个合法区域）</text>
  <path d="M 326 246 Q 300 252 284 262" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <text x="76" y="500" font-size="11" fill="#666" filter="url(#sk)">公共交集同时落在 i∩j、i∩k、j∩k 三个两两</text>
  <text x="76" y="518" font-size="11" fill="#666" filter="url(#sk)">交集之内——它里面的正方形每一对都「装得下」。</text>

  <!-- ===== Panel 2: reduction argument ===== -->
  <text x="685" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 双向夹逼：答案只看矩形对</text>

  <g filter="url(#sk)"><rect x="480" y="104" width="410" height="96" rx="8" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/></g>
  <text x="498" y="130" font-size="11.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 任一合法区域 = 某些矩形的公共交集</text>
  <text x="498" y="152" font-size="11.5" fill="#2b6e9e" filter="url(#sk)">　 区域内的正方形 ⊆ 其中任意一对矩形的交集</text>
  <text x="498" y="176" font-size="11.5" fill="#2b6e9e" filter="url(#sk)">　 → 区域最优不会超过任何一个两两配对</text>
  <path d="M 685 200 L 685 214" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="480" y="218" width="410" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="498" y="244" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">② 反过来：任取两个矩形 i、j，</text>
  <text x="498" y="266" font-size="11.5" fill="#7a5415" filter="url(#sk)">　 它们的交集本身就是合法区域</text>
  <path d="M 685 288 L 685 302" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="480" y="306" width="410" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="498" y="332" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">结论：答案 = 所有矩形对中 min(w, h)² 的最大值</text>
  <text x="498" y="356" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">　 n ≤ 10³ → C(n,2) ≈ 5×10⁵ 对，O(n²) 稳过</text>
  <text x="498" y="378" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">　 子集？多重交集？统统不用管</text>

  <!-- ===== insight box ===== -->
  <g filter="url(#sk)"><rect x="56" y="540" width="828" height="80" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="564" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">为什么要这样归约</text>
  <text x="76" y="586" font-size="11" fill="#444" filter="url(#sk)">· 示例 2 的 note「区域可以由多于两个矩形的交集构成」是纸老虎：多重交集里的正方形必被其中某一对「承包」</text>
  <text x="76" y="608" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">· 枚举子集 2ⁿ 直接爆炸；枚举点对 C(n,2) 恰好不多不少——这就是正解的切入角度</text>
</svg>
