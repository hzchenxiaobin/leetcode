<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两步构造：L 形中转点 M = (sr, tc)</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">示例 2：S=(4,2) → M=(4,3) → T=(1,3)，2 步</text>

  <g filter="url(#rough2)">
    <rect x="40" y="80" width="224" height="224" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  </g>

  <rect x="40" y="164" width="224" height="28" fill="#e8f0fe" opacity="0.8" filter="url(#rough2)"/>
  <rect x="96" y="80" width="28" height="224" fill="#e6f4ea" opacity="0.8" filter="url(#rough2)"/>

  <g filter="url(#rough2)" stroke="#ccc" stroke-width="1">
    <path d="M 68 80 V 304 M 96 80 V 304 M 124 80 V 304 M 152 80 V 304 M 180 80 V 304 M 208 80 V 304 M 236 80 V 304"/>
    <path d="M 40 108 H 264 M 40 136 H 264 M 40 164 H 264 M 40 192 H 264 M 40 220 H 264 M 40 248 H 264 M 40 276 H 264"/>
  </g>

  <rect x="68" y="164" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">S</text>
  <rect x="96" y="164" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">M</text>
  <rect x="96" y="80" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>

  <path d="M 94 176 L 104 176" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 110 158 L 110 118" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="44" y="156" font-size="10" fill="#446688">S(4,2)</text>
  <text x="122" y="198" font-size="10" fill="#d6a040">M(4,3)</text>
  <text x="130" y="76" font-size="10" fill="#4a7a3a">T(1,3)</text>

  <text x="66" y="192" font-size="10" fill="#b85450">① 沿第 4 行</text>
  <text x="128" y="146" font-size="10" fill="#b85450">② 沿第 3 列</text>

  <rect x="296" y="80" width="244" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="102" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">中转点 M = (sr, tc)</text>
  <text x="418" y="122" text-anchor="middle" font-size="10.5" fill="#555">第一段同第 sr 行，第二段同第 tc 列</text>

  <rect x="296" y="152" width="244" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="174" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">M 永远在棋盘内</text>
  <text x="418" y="194" text-anchor="middle" font-size="10.5" fill="#555">1 ≤ sr ≤ 8 且 1 ≤ tc ≤ 8，无需讨论</text>

  <rect x="296" y="224" width="244" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="246" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">两段移动都非零</text>
  <text x="418" y="266" text-anchor="middle" font-size="10.5" fill="#555">sc≠tc ⟹ 第①段≠0；sr≠tr ⟹ 第②段≠0</text>

  <rect x="296" y="296" width="244" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不同行且不同列 ⟹ 2 步必达</text>
  <text x="418" y="336" text-anchor="middle" font-size="10.5" fill="#555">再排除同对角线 ⟹ 恰好 2 步</text>

  <text x="152" y="352" text-anchor="middle" font-size="10" fill="#999">蓝：第 sr 行高亮　绿：第 tc 列高亮</text>
  <text x="152" y="384" text-anchor="middle" font-size="10" fill="#999">同行 / 同列时退化为 1 步；同格为 0 步</text>
</svg>
