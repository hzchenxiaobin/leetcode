<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一遍扫描流程：只看答案串末尾两个字符</text>

  <!-- 输入串 -->
  <text x="60" y="58" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">读入字符 c（以 s = "aaabaaaa" 为例）</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="68" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="94"  y="68" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="128" y="68" width="34" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="162" y="68" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="77" y="92">a</text><text x="111" y="92">a</text>
    <text x="145" y="92">a</text><text x="179" y="92">b</text>
  </g>
  <text x="128" y="124" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">第 3 个 a 被跳过</text>

  <!-- 判定菱形 -->
  <path d="M 196 86 L 260 86" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="330,54 420,86 330,118 240,86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="82" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">ans 末尾两个</text>
  <text x="330" y="98" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">都等于 c ?</text>

  <!-- 分支 -->
  <path d="M 330 118 L 330 152 L 180 152 L 180 178" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="144" font-size="11" fill="#b85450" filter="url(#rough2)">是（已有两个连续 c）</text>
  <path d="M 420 86 L 480 86 L 480 178" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="140" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="110" y="180" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="180" y="207" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">跳过（删除 c）</text>

  <rect x="410" y="180" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="480" y="207" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">ans 追加 c</text>

  <!-- 汇合 -->
  <path d="M 250 202 L 340 202 L 340 230 L 280 230" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 410 224 L 400 224 L 400 230 L 344 230" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="330" y="252" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">处理下一个字符</text>
  <path d="M 330 230 L 330 258" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="110" y="262" width="340" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">扫完 s → 返回 ans = "aabaa"</text>
  <text x="280" y="300" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">时间 O(n)：每字符一次比较、至多一次追加</text>
</svg>
