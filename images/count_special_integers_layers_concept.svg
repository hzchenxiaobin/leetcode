<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：按「位数」分层 —— 短位纯排列，同位贴上界</text>
  <path d="M 150 44 Q 340 52 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="40" y="78" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">① 位数 k &lt; L：个数与 n 无关</text>

  <g filter="url(#sk)"><rect x="40" y="90" width="270" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="175" y="107" text-anchor="middle" font-size="12" fill="#2e5c24" filter="url(#sk)">k = 1：9 个（1 ~ 9）</text>
  <g filter="url(#sk)"><rect x="40" y="122" width="270" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="175" y="139" text-anchor="middle" font-size="12" fill="#2e5c24" filter="url(#sk)">k = 2：9 × 9 = 81 个</text>
  <g filter="url(#sk)"><rect x="40" y="154" width="270" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="175" y="171" text-anchor="middle" font-size="12" fill="#2e5c24" filter="url(#sk)">k = 3：9 × 9 × 8 = 648 个</text>
  <g filter="url(#sk)"><rect x="40" y="186" width="270" height="26" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="175" y="203" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">⋯⋯</text>
  <g filter="url(#sk)"><rect x="40" y="218" width="270" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="175" y="235" text-anchor="middle" font-size="12" fill="#2e5c24" filter="url(#sk)">k = 10：9 × A(9, 9) = 3265920 个</text>

  <g filter="url(#sk)"><rect x="40" y="256" width="270" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="175" y="278" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">首位 9 选（1~9），此后每位从 0~9</text>
  <text x="175" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">去掉已用 ⟹ 9, 8, 7 … 逐位递减</text>
  <text x="175" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">恰 k 位特殊数 = 9 × A(9, k−1)</text>
  <text x="175" y="334" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">A(m, j) = m·(m−1)⋯(m−j+1)（排列数）</text>

  <text x="350" y="78" font-size="13.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">② 位数 = L：贴着 n 的各位分组</text>

  <g filter="url(#sk)"><rect x="352" y="92" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="370" y="114" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">s[0]</text>
  <g filter="url(#sk)"><rect x="396" y="92" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="414" y="114" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">s[1]</text>
  <g filter="url(#sk)"><rect x="440" y="92" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="458" y="114" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">⋯</text>
  <g filter="url(#sk)"><rect x="484" y="92" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="502" y="114" text-anchor="middle" font-size="11" fill="#2b4a68" filter="url(#sk)">s[L−1]</text>
  <text x="540" y="114" font-size="11" fill="#666" filter="url(#sk)">← n 的各位</text>
  <text x="370" y="142" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i = 0</text>
  <text x="414" y="142" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i = 1</text>
  <text x="458" y="142" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">⋯</text>
  <text x="502" y="142" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i = L−1</text>

  <g filter="url(#sk)"><rect x="350" y="156" width="305" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="502" y="176" text-anchor="middle" font-size="11.5" fill="#2b4a68" filter="url(#sk)">第 i 位填 x &lt; s[i] 且 x ∉ used（首位 x ≥ 1）</text>
  <text x="502" y="194" text-anchor="middle" font-size="11.5" fill="#2b4a68" filter="url(#sk)">⟹ 该数在第 i 位已严格小于 n</text>
  <text x="502" y="212" text-anchor="middle" font-size="11.5" fill="#2b4a68" filter="url(#sk)">后 L−i−1 位只需互异，随意填</text>

  <text x="350" y="248" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">已用集合 → 10 位掩码 used（示意：前缀含 1、3）</text>

  <g filter="url(#sk)"><rect x="350" y="256" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="362" y="272" text-anchor="middle" font-size="11" fill="#2b4a68" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="374" y="256" width="24" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="386" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03a3a" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="398" y="256" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="410" y="272" text-anchor="middle" font-size="11" fill="#2b4a68" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="422" y="256" width="24" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="434" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03a3a" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="446" y="256" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="458" y="272" text-anchor="middle" font-size="11" fill="#2b4a68" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="470" y="256" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="482" y="272" text-anchor="middle" font-size="11" fill="#2b4a68" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="494" y="256" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="506" y="272" text-anchor="middle" font-size="11" fill="#2b4a68" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="518" y="256" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="530" y="272" text-anchor="middle" font-size="11" fill="#2b4a68" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="542" y="256" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="554" y="272" text-anchor="middle" font-size="11" fill="#2b4a68" filter="url(#sk)">8</text>
  <g filter="url(#sk)"><rect x="566" y="256" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="578" y="272" text-anchor="middle" font-size="11" fill="#2b4a68" filter="url(#sk)">9</text>

  <text x="350" y="300" font-size="12" font-weight="bold" fill="#2e5c24" filter="url(#sk)">剩 10−i−1 个可用 ⟹ 每组后缀填法 = A(10−i−1, L−i−1)</text>
  <text x="350" y="318" font-size="10.5" fill="#888" filter="url(#sk)">（前缀 i+1 个数字已现身，后缀不能再用）</text>

  <g filter="url(#sk)"><rect x="40" y="372" width="600" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="340" y="398" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">ans = 短位数之和 ＋ 同位数各组排列数之和 ＋ [n 本身互异 ? 1 : 0]</text>
  <text x="340" y="424" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">三部分互斥且穷尽 [1, n] 的全部特殊数（正确性证明见正文 §5）</text>
</svg>
