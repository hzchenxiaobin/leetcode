<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "00110110"，k = 2</text>

  <!-- 字符与窗口 -->
  <g filter="url(#rough2)">
    <rect x="60"  y="44" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="110" y="44" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="160" y="44" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="210" y="44" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="260" y="44" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="310" y="44" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="360" y="44" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="410" y="44" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text y="67" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="85">0</tspan><tspan x="135">0</tspan><tspan x="185">1</tspan><tspan x="235">1</tspan><tspan x="285">0</tspan><tspan x="335">1</tspan><tspan x="385">1</tspan><tspan x="435">0</tspan></text>
  <text y="100" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)"><tspan x="85">i=0</tspan><tspan x="135">i=1</tspan><tspan x="185">i=2</tspan><tspan x="235">i=3</tspan><tspan x="285">i=4</tspan><tspan x="335">i=5</tspan><tspan x="385">i=6</tspan><tspan x="435">i=7</tspan></text>

  <!-- 窗口表格 -->
  <g filter="url(#rough2)">
    <rect x="70" y="122" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="180" y="122" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="290" y="122" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="400" y="122" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
  </g>
  <text y="142" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="125">窗口 00 → 0</tspan><tspan x="235">窗口 01 → 1</tspan><tspan x="345">窗口 11 → 3</tspan><tspan x="455">窗口 10 → 2</tspan></text>

  <path d="M 85 108 Q 85 118 100 122" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 235 108 Q 260 118 290 124" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数过程 -->
  <text x="60" y="192" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">7 个窗口依次入账：</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="202" width="55" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <rect x="119" y="202" width="55" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <rect x="178" y="202" width="55" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <rect x="237" y="202" width="55" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <rect x="296" y="202" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="355" y="202" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="414" y="202" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <text y="222" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="87">00 新</tspan><tspan x="146">01 新</tspan><tspan x="205">11 新</tspan><tspan x="264">10 新</tspan><tspan x="323">01 旧</tspan><tspan x="382">11 旧</tspan><tspan x="441">10 旧</tspan></text>
  <text x="60" y="260" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 4 个窗口后 cnt = 4 = 2^2，四个编码 00/01/10/11 全部到账 → true</text>

  <!-- 反例 -->
  <rect x="55" y="284" width="460" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="72" y="306" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">反例 s = "0110", k = 2：窗口 01 / 11 / 10，唯独没有 00 → cnt = 3 &lt; 4 → false</text>
  <text x="72" y="328" font-size="11" fill="#555" filter="url(#rough2)">注意 0110 里 1 出现了两次，但「重复」对补齐 2^k 个编码毫无帮助</text>
</svg>
