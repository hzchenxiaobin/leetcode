<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">固定目标 x = 4：窗口 [x-k, x+k] 内的元素才能被改造成 4</text>

  <!-- 数轴格子 1..6 -->
  <rect x="44" y="58" width="380" height="6" rx="3" fill="#ddd" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="42" y="82" width="46" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <rect x="108" y="82" width="46" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <rect x="174" y="82" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="240" y="82" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="306" y="82" width="46" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="372" y="82" width="46" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="65" y="108">1</text>
    <text x="131" y="108">2</text>
    <text x="197" y="108">3</text>
    <text x="263" y="108" font-weight="bold">4</text>
    <text x="329" y="108" font-weight="bold">5</text>
    <text x="395" y="108">6</text>
  </g>
  <g font-size="11" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="65" y="136">远</text>
    <text x="131" y="136">远</text>
    <text x="197" y="136">窗口内</text>
    <text x="263" y="136">就是 x</text>
    <text x="329" y="136">窗口内</text>
    <text x="395" y="136">远</text>
  </g>

  <!-- 窗口标注 -->
  <path d="M 174 76 L 352 76" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 174 76 L 174 70" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 352 76 L 352 70" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="263" y="64" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">窗口 [4-k, 4+k]，k = 1</text>

  <!-- 说明 -->
  <rect x="46" y="158" width="150" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="121" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">原本就等于 x</text>
  <text x="121" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不花操作（f 个）</text>

  <rect x="212" y="158" width="152" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="288" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">窗口内但 ≠ x</text>
  <text x="288" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">各花 1 次操作</text>

  <rect x="380" y="158" width="150" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">窗口外</text>
  <text x="455" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">永远变不成 x</text>

  <rect x="96" y="232" width="368" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">freq(x) ≤ min(c(x), f(x) + numOperations)</text>
  <text x="280" y="274" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">c：窗口内元素数　f：本来就等于 x 的元素数</text>

  <text x="280" y="312" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">示例：x = 4 时 c = 2、f = 1、m = 2 → min(2, 3) = 2</text>
</svg>
