<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="310" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算（target = 2）：逐行套两级快速幂</text>
  <path d="M 150 36 Q 320 45 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <text x="42" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">i</text>
  <text x="126" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">[a, b, c, m]</text>
  <text x="277" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">x = a^b mod 10</text>
  <text x="443" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">y = x^c mod m</text>
  <text x="570" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">好下标 ?</text>

  <!-- 行 0 -->
  <g filter="url(#sk)"><rect x="28" y="76" width="28" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="42" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="62" y="76" width="128" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="126" y="101" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">[2, 3, 3, 10]</text>
  <g filter="url(#sk)"><rect x="196" y="76" width="162" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="277" y="101" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">2³ mod 10 = 8</text>
  <g filter="url(#sk)"><rect x="362" y="76" width="162" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="443" y="101" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">8³ mod 10 = 512 mod 10 = 2</text>
  <text x="570" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>

  <!-- 行 1 -->
  <g filter="url(#sk)"><rect x="28" y="120" width="28" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="42" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="62" y="120" width="128" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="126" y="145" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#sk)">[3, 3, 3, 1]</text>
  <g filter="url(#sk)"><rect x="196" y="120" width="162" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="277" y="145" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#sk)">3³ mod 10 = 7</text>
  <g filter="url(#sk)"><rect x="362" y="120" width="162" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="443" y="145" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#sk)">7³ mod 1 = 343 mod 1 = 0</text>
  <text x="570" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>

  <!-- 行 2 -->
  <g filter="url(#sk)"><rect x="28" y="164" width="28" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="42" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="62" y="164" width="128" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="126" y="189" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">[6, 1, 1, 4]</text>
  <g filter="url(#sk)"><rect x="196" y="164" width="162" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="277" y="189" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">6¹ mod 10 = 6</text>
  <g filter="url(#sk)"><rect x="362" y="164" width="162" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="443" y="189" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">6¹ mod 4 = 6 mod 4 = 2</text>
  <text x="570" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>

  <!-- 答案 -->
  <g filter="url(#sk)"><rect x="62" y="218" width="516" height="42" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="244" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">答案：[0, 2]（好下标顺序不限，按升序收集最省事）</text>

  <text x="320" y="286" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">⚠ m = 1 时第二段恒为 0：好下标 ⟺ target = 0（本例 target = 2 ⇒ i = 1 出局）</text>
</svg>
