<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：原数与反转数一起倒入集合，集合天然去重</text>
  <path d="M 170 38 Q 340 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row 1: original numbers -->
  <text x="46" y="90" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">原数 x：</text>
  <g filter="url(#sk)"><rect x="118" y="68" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="174" y="68" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="230" y="68" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="286" y="68" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="342" y="68" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="141" y="91" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="197" y="91" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">13</text>
  <text x="253" y="91" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">10</text>
  <text x="309" y="91" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">12</text>
  <text x="365" y="91" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">31</text>

  <!-- row 2: reversed numbers -->
  <text x="28" y="150" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">反转 rev(x)：</text>
  <g filter="url(#sk)"><rect x="118" y="128" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk)"><rect x="174" y="128" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk)"><rect x="230" y="128" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="286" y="128" width="46" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="342" y="128" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" stroke-dasharray="4 3"/></g>
  <text x="141" y="151" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="197" y="151" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">31</text>
  <text x="253" y="151" text-anchor="middle" font-size="13" fill="#a06a10" font-weight="bold" filter="url(#sk)">1</text>
  <text x="309" y="151" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">21</text>
  <text x="365" y="151" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">13</text>

  <!-- leading zero callout -->
  <g filter="url(#sk)">
    <path d="M 253 166 L 253 180" stroke="#d6a040" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="253" y="197" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#sk)">10 → 01 → 1（前导零丢弃）</text>

  <!-- arrows into the set -->
  <g filter="url(#sk)">
    <path d="M 394 86 Q 416 100 430 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 394 146 Q 416 156 430 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="412" y="212" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">全部 add</text>

  <!-- hash set box -->
  <g filter="url(#sk)">
    <rect x="436" y="56" width="218" height="254" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="545" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">哈希集合 S</text>
  <text x="545" y="103" text-anchor="middle" font-size="11" fill="#666" font-family="monospace" filter="url(#sk)">add(x) · add(rev(x))</text>

  <!-- chips -->
  <g filter="url(#sk)"><rect x="452" y="114" width="54" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="516" y="114" width="54" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="580" y="114" width="54" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="452" y="152" width="54" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="516" y="152" width="54" height="28" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="580" y="152" width="54" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="479" y="133" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="543" y="133" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">10</text>
  <text x="607" y="133" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">12</text>
  <text x="479" y="171" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">13</text>
  <text x="543" y="171" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">21</text>
  <text x="607" y="171" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">31</text>

  <path d="M 456 198 Q 545 205 634 198" stroke="#8a8a8a" stroke-width="1.2" fill="none" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="545" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">|S| = 6</text>
  <text x="545" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">→ 返回 6 ✓</text>
  <text x="545" y="288" text-anchor="middle" font-size="11" fill="#777" font-family="monospace" filter="url(#sk)">{1,10,12,13,21,31}</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="318" width="600" height="70" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="58" y="340" font-size="11" fill="#444" filter="url(#sk)">橙：10 的反转是 01，前导零自动丢弃即 1；绿：21 是反转带来的唯一新元素，其余全是重复</text>
  <text x="58" y="360" font-size="11" fill="#444" filter="url(#sk)">add 天然幂等，重复元素自动合并 —— 根本无需真的拼接出 2n 个元素再统计</text>
  <text x="58" y="379" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">答案 = |{x} ∪ {rev(x)}| = len(S)</text>
</svg>
