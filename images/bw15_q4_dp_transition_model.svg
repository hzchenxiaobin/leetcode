<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">转移结构：上一行的值流向当前行，同列被禁</text>

  <!-- 上一行 -->
  <text x="70" y="70" font-size="14" fill="#666" filter="url(#rough2)">上一行 dp</text>
  <g text-anchor="middle">
    <rect x="180" y="56" width="60" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="210" y="84" font-size="15" fill="#333" filter="url(#rough2)">1</text>
    <rect x="260" y="56" width="60" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="290" y="84" font-size="15" fill="#333" filter="url(#rough2)">2</text>
    <rect x="340" y="56" width="60" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="370" y="84" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  </g>
  <text x="210" y="118" font-size="12" fill="#4a7a3a" filter="url(#rough2)">min1=1 (c1=0)</text>
  <text x="290" y="118" font-size="12" fill="#8a6a20" filter="url(#rough2)">min2=2</text>

  <!-- 当前行 -->
  <text x="70" y="220" font-size="14" fill="#666" filter="url(#rough2)">当前行 grid</text>
  <g text-anchor="middle">
    <rect x="180" y="206" width="60" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="210" y="234" font-size="15" fill="#333" filter="url(#rough2)">4</text>
    <rect x="260" y="206" width="60" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="290" y="234" font-size="15" fill="#333" filter="url(#rough2)">5</text>
    <rect x="340" y="206" width="60" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="370" y="234" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  </g>
  <text x="210" y="268" font-size="12" fill="#b85450" filter="url(#rough2)">j=0=c1：用 min2</text>

  <!-- 箭头：到 j=0 -->
  <line x1="260" y1="102" x2="228" y2="204" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="340" y1="102" x2="248" y2="204" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="210" y1="102" x2="210" y2="204" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <g stroke="#b85450" stroke-width="2">
    <line x1="196" y1="146" x2="224" y2="164" filter="url(#rough2)"/>
    <line x1="224" y1="146" x2="196" y2="164" filter="url(#rough2)"/>
  </g>
  <text x="128" y="162" font-size="12" fill="#b85450" filter="url(#rough2)">同列禁用 ✗</text>
  <text x="262" y="160" font-size="12" fill="#4a7a3a" filter="url(#rough2)">取 min1</text>

  <!-- 结果 -->
  <text x="70" y="330" font-size="14" fill="#666" filter="url(#rough2)">新 dp</text>
  <g text-anchor="middle">
    <rect x="180" y="312" width="60" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="210" y="340" font-size="14" fill="#333" filter="url(#rough2)">6</text>
    <rect x="260" y="312" width="60" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="290" y="340" font-size="14" fill="#333" filter="url(#rough2)">6</text>
    <rect x="340" y="312" width="60" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="370" y="340" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  </g>
  <text x="210" y="374" font-size="12" fill="#b85450" filter="url(#rough2)">4 + min2 = 6</text>
  <text x="290" y="374" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5 + 1 = 6</text>
  <text x="370" y="374" font-size="12" fill="#4a7a3a" filter="url(#rough2)">6 + 1 = 7</text>

  <!-- 侧注 -->
  <rect x="460" y="120" width="170" height="180" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">滚动数组纪律：</text>
  <text x="545" y="170" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">先扫出 min1 / c1 / min2</text>
  <text x="545" y="192" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">再整行一次性覆写 dp</text>
  <text x="545" y="220" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不能边读边写，</text>
  <text x="545" y="240" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否则后半行读到新值</text>
  <text x="545" y="272" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">n = 1 时循环不执行，</text>
  <text x="545" y="292" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">答案就是 min(grid[0])</text>
</svg>
