<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：先序遍历候选根，4 处一次命中</text>
  <text x="310" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">root = [3,4,5,1,2]　subRoot = [4,1,2]　答案 true</text>

  <text x="120" y="62" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">root</text>
  <path d="M 120 100 L 90 126" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 120 100 L 152 126" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 85 154 L 67 178" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 85 154 L 104 178" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <circle cx="120" cy="86" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="90" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">3</text>
  <circle cx="85" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="144" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">4</text>
  <circle cx="160" cy="140" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="160" y="144" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">5</text>
  <circle cx="62" cy="192" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="196" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>
  <circle cx="108" cy="192" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="108" y="196" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>

  <ellipse cx="85" cy="164" rx="54" ry="46" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <path d="M 142 148 C 200 132, 232 120, 262 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="202" y="112" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">结构+值全同</text>

  <text x="330" y="62" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">subRoot</text>
  <path d="M 330 124 L 301 151" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 330 124 L 359 151" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <circle cx="330" cy="110" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="114" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">4</text>
  <circle cx="298" cy="164" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="298" y="168" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">1</text>
  <circle cx="362" cy="164" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="362" y="168" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">2</text>

  <rect x="40" y="214" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="95" y="232" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">候选根</text>
  <text x="200" y="232" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">根值比较</text>
  <text x="350" y="232" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">same() 下钻过程</text>
  <text x="515" y="232" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">结论</text>

  <rect x="40" y="240" width="540" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="259" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">3（root）</text>
  <text x="200" y="259" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">3 ≠ 4</text>
  <text x="350" y="259" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">第一层即返回 false</text>
  <text x="515" y="259" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">剪枝，转左孩子</text>

  <rect x="40" y="270" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="289" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">4（3.left）</text>
  <text x="200" y="289" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">4 = 4 ✓</text>
  <text x="350" y="289" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">左 1=1 ✓，右 2=2 ✓（皆为叶子）</text>
  <text x="515" y="289" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">true，立即返回</text>

  <rect x="40" y="300" width="540" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="319" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">5（3.right）</text>
  <text x="200" y="319" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">5 ≠ 4</text>
  <text x="350" y="319" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">本该剪枝，但已提前返回</text>
  <text x="515" y="319" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">不再访问</text>

  <rect x="40" y="338" width="540" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="356" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">示例 2 的差异：节点 2 下多挂一个 0，same(4,4) 走到右孩子时比较「2 带左孩子 0」与「2 是叶子」</text>
  <text x="54" y="374" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">→ 一空一非空立刻判否，回溯到 5 仍不等，整棵树扫完返回 false</text>
</svg>
