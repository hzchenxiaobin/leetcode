<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="384" fill="#fafafa"/>
  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">双指针阶梯搜索：每轮只调用一次 f</text>
  <text x="280" y="44" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">x 从 1 往上，y 从 z 往下，二者相向而行</text>
  <rect x="160" y="56" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="77" font-size="11" fill="#3a4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">初始化  x = 1, y = z</text>
  <path d="M 280 88 L 280 96" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 98 L 386 124 L 280 150 L 174 124 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="120" font-size="10.5" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">x ≤ z 且</text>
  <text x="280" y="134" font-size="10.5" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">y ≥ 1 ？</text>
  <rect x="404" y="108" width="132" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="470" y="128" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">否：返回 ans</text>
  <path d="M 386 124 L 400 124" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 150 L 280 164" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="161" font-size="9.5" fill="#888" text-anchor="start" filter="url(#rough2)">是</text>
  <rect x="190" y="166" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="186" font-size="11" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v = f(x, y)</text>
  <text x="280" y="214" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">按 v 与 z 的大小关系分三支</text>
  <path d="M 280 196 L 155 222" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 196 L 280 222" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 196 L 465 222" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="222" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155.0" y="240" font-size="10.5" fill="#2f5a28" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v == z</text>
  <text x="155.0" y="256" font-size="9" fill="#555" text-anchor="middle" filter="url(#rough2)">记录 (x, y)</text>
  <text x="155.0" y="271" font-size="9.5" fill="#2f5a28" text-anchor="middle" font-weight="bold" filter="url(#rough2)">x++ 且 y--</text>
  <rect x="245" y="222" width="130" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310.0" y="240" font-size="10.5" fill="#3a4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v &lt; z</text>
  <text x="310.0" y="256" font-size="9" fill="#555" text-anchor="middle" filter="url(#rough2)">固定 x，整行排除</text>
  <text x="310.0" y="271" font-size="9.5" fill="#3a4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">x++</text>
  <rect x="390" y="222" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465.0" y="240" font-size="10.5" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v &gt; z</text>
  <text x="465.0" y="256" font-size="9" fill="#555" text-anchor="middle" filter="url(#rough2)">固定 y，整列排除</text>
  <text x="465.0" y="271" font-size="9.5" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">y--</text>
  <path d="M 155 278 L 180 300" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 278 L 285 300" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 465 278 L 380 300" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="302" width="280" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" font-size="10.5" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">回到循环判断（≤ 2z 轮）</text>
  <path d="M 150 318 L 40 318 L 40 124 L 168 124" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="46" y="350" font-size="9" fill="#446688" text-anchor="start" filter="url(#rough2)">循环</text>
</svg>
