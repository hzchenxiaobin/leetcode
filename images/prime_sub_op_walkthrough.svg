<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：x = v − prev − 1，p = P(x)</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="340" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">示例 1：nums = [4, 9, 6, 10] → true</text>

  <g filter="url(#sk)">
    <rect x="140" y="70" width="404" height="30" fill="#e8f0fe"/>
    <rect x="140" y="127" width="404" height="27" fill="#fff8e1"/>
    <rect x="140" y="181" width="404" height="27" fill="#fff8e1"/>
    <rect x="140" y="70" width="404" height="138" fill="none" stroke="#446688" stroke-width="1.4"/>
    <path d="M176 70 V208 M232 70 V208 M296 70 V208 M388 70 V208 M484 70 V208" stroke="#446688" stroke-width="1" fill="none"/>
    <path d="M140 100 H544 M140 127 H544 M140 154 H544 M140 181 H544" stroke="#446688" stroke-width="1" fill="none"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#2b6e9e" text-anchor="middle" filter="url(#sk)">
    <text x="158" y="89">i</text>
    <text x="204" y="89">prev</text>
    <text x="264" y="89">v</text>
    <text x="342" y="89">x = v−prev−1</text>
    <text x="436" y="89">p = P(x)</text>
    <text x="514" y="89">新值</text>
  </g>
  <g font-size="12.5" fill="#444" text-anchor="middle" filter="url(#sk)">
    <text x="158" y="118">0</text><text x="204" y="118">0</text><text x="264" y="118">4</text><text x="342" y="118">3</text><text x="436" y="118">3</text>
    <text x="158" y="145">1</text><text x="204" y="145">1</text><text x="264" y="145">9</text><text x="342" y="145">7</text><text x="436" y="145">7</text>
    <text x="158" y="172">2</text><text x="204" y="172">2</text><text x="264" y="172">6</text><text x="342" y="172">3</text><text x="436" y="172">3</text>
    <text x="158" y="199">3</text><text x="204" y="199">3</text><text x="264" y="199">10</text><text x="342" y="199">6</text><text x="436" y="199">5</text>
    <text x="514" y="118" font-weight="bold" fill="#2e6e2e">1</text>
    <text x="514" y="145" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="514" y="172" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="514" y="199" font-weight="bold" fill="#2e6e2e">5</text>
  </g>
  <g font-size="10.5" fill="#777" filter="url(#sk)">
    <text x="560" y="128">新值即下一轮 prev，</text>
    <text x="560" y="144">每步都取「&gt; prev 的</text>
    <text x="560" y="160">最小可达值」</text>
  </g>

  <text x="340" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a" filter="url(#sk)">示例 3：nums = [5, 8, 3] → false</text>

  <g filter="url(#sk)">
    <rect x="140" y="256" width="404" height="30" fill="#e8f0fe"/>
    <rect x="140" y="313" width="404" height="27" fill="#fff8e1"/>
    <rect x="140" y="340" width="404" height="27" fill="#fce4ec"/>
    <rect x="140" y="256" width="404" height="111" fill="none" stroke="#446688" stroke-width="1.4"/>
    <path d="M176 256 V367 M232 256 V367 M296 256 V367 M388 256 V367 M484 256 V367" stroke="#446688" stroke-width="1" fill="none"/>
    <path d="M140 286 H544 M140 313 H544 M140 340 H544" stroke="#446688" stroke-width="1" fill="none"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#2b6e9e" text-anchor="middle" filter="url(#sk)">
    <text x="158" y="275">i</text>
    <text x="204" y="275">prev</text>
    <text x="264" y="275">v</text>
    <text x="342" y="275">x = v−prev−1</text>
    <text x="436" y="275">p = P(x)</text>
    <text x="514" y="275">新值</text>
  </g>
  <g font-size="12.5" fill="#444" text-anchor="middle" filter="url(#sk)">
    <text x="158" y="304">0</text><text x="204" y="304">0</text><text x="264" y="304">5</text><text x="342" y="304">4</text><text x="436" y="304">3</text>
    <text x="158" y="331">1</text><text x="204" y="331">2</text><text x="264" y="331">8</text><text x="342" y="331">5</text><text x="436" y="331">5</text>
    <text x="514" y="304" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="514" y="331" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="158" y="358" fill="#b03a3a" font-weight="bold">2</text>
    <text x="204" y="358" fill="#b03a3a" font-weight="bold">3</text>
    <text x="264" y="358" fill="#b03a3a" font-weight="bold">3</text>
    <text x="342" y="358" fill="#b03a3a" font-weight="bold">−1</text>
    <text x="436" y="358" fill="#b03a3a" font-weight="bold">无</text>
    <text x="514" y="358" fill="#b03a3a" font-weight="bold">✗</text>
  </g>
  <g font-size="10.5" fill="#b03a3a" filter="url(#sk)">
    <text x="560" y="300">x = −1 &lt; 2：没有质数可减，</text>
    <text x="560" y="316">不减又 3 ≤ prev = 3，</text>
    <text x="560" y="332">→ return false</text>
  </g>

  <text x="340" y="408" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">示例 2 [6,8,11,12] 本已递增：贪心继续压小也不会破坏「新值 &gt; prev」，仍返回 true。</text>
  <text x="340" y="432" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">官解 [1,2,6,10] 与贪心 [1,2,3,5] 都是合法方案——判定只问可行性，方案不唯一。</text>
</svg>
