<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="1000" height="650" fill="#fafafa"/>
  <rect x="28" y="22" width="580" height="602" rx="10" fill="#e8f0fe" fill-opacity="0.24" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="632" y="22" width="340" height="602" rx="10" fill="#e6f4ea" fill-opacity="0.3" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="58" text-anchor="middle" font-size="25" font-weight="bold" fill="#446688" filter="url(#rough2)">allocate(size, mID)</text>
  <text x="802" y="58" text-anchor="middle" font-size="25" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">freeMemory(mID)</text>

  <rect x="205" y="78" width="226" height="45" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="318" y="107" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">run = 0，i = 0</text>
  <path d="M318 123 L318 143" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="318,145 403,190 318,235 233,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="197" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M403 190 L476 190" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="433" y="178" font-size="16" fill="#555" filter="url(#rough2)">否</text>
  <rect x="480" y="168" width="105" height="45" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="532" y="197" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">返回 -1</text>
  <path d="M318 235 L318 258" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="252" font-size="16" fill="#555" filter="url(#rough2)">是</text>
  <polygon points="318,260 430,315 318,370 206,315" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="322" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">mem[i] == 0 ?</text>
  <path d="M430 315 L477 315" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="302" font-size="16" fill="#555" filter="url(#rough2)">否</text>
  <rect x="481" y="291" width="104" height="47" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="533" y="321" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">run = 0</text>
  <path d="M318 370 L318 392" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="387" font-size="16" fill="#555" filter="url(#rough2)">是</text>
  <rect x="245" y="395" width="146" height="45" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="318" y="424" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">run += 1</text>
  <path d="M318 440 L318 457" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="318,460 421,505 318,550 215,505" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="512" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">run == size ?</text>
  <path d="M421 505 L458 505" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="434" y="491" font-size="16" fill="#555" filter="url(#rough2)">是</text>
  <rect x="462" y="457" width="130" height="98" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="527" y="483" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">start = i-size+1</text>
  <text x="527" y="509" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">写入 [start, i]</text>
  <text x="527" y="536" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">返回 start</text>
  <rect x="242" y="574" width="152" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="599" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">i += 1，继续扫描</text>
  <path d="M318 550 L318 571" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="568" font-size="16" fill="#555" filter="url(#rough2)">否</text>
  <path d="M533 338 Q533 575 397 592" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M242 593 Q80 593 80 190 Q80 150 230 170" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="700" y="82" width="204" height="45" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="802" y="111" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">count = 0，i = 0</text>
  <path d="M802 127 L802 151" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="802,154 884,197 802,240 720,197" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="802" y="204" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M802 240 L802 263" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="817" y="256" font-size="16" fill="#555" filter="url(#rough2)">是</text>
  <polygon points="802,266 908,320 802,374 696,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="802" y="314" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">mem[i]</text>
  <text x="802" y="338" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">== mID ?</text>
  <path d="M802 374 L802 399" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="817" y="392" font-size="16" fill="#555" filter="url(#rough2)">是</text>
  <rect x="704" y="402" width="196" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="802" y="430" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">mem[i] = 0</text>
  <text x="802" y="455" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">count += 1</text>
  <rect x="728" y="508" width="148" height="43" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="802" y="536" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">i += 1</text>
  <path d="M802 470 L802 505" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M908 320 Q942 320 942 529 Q942 529 879 529" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="928" y="307" font-size="16" fill="#555" filter="url(#rough2)">否</text>
  <path d="M728 529 Q661 529 661 197 Q661 175 717 184" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M884 197 L925 197 Q925 197 925 582" fill="none" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="899" y="184" font-size="16" fill="#555" filter="url(#rough2)">否</text>
  <rect x="714" y="574" width="176" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="802" y="601" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">返回 count</text>
  <path d="M925 582 L925 594 L893 594" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
