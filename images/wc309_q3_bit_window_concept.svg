<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：两两 AND = 0 ⟺ 每个比特位至多被一个元素占用</text>

  <!-- ===== ① nice window bit grid ===== -->
  <text x="40" y="50" font-size="12" fill="#446688" font-weight="bold">① 优雅窗口 [3, 8, 48]：每个比特列至多一个 1</text>

  <g filter="url(#rough2)" font-size="10" fill="#888">
    <text x="187" y="66" text-anchor="middle">bit5</text>
    <text x="221" y="66" text-anchor="middle">bit4</text>
    <text x="255" y="66" text-anchor="middle">bit3</text>
    <text x="289" y="66" text-anchor="middle">bit2</text>
    <text x="323" y="66" text-anchor="middle">bit1</text>
    <text x="357" y="66" text-anchor="middle">bit0</text>
  </g>

  <!-- row: 3 = 000011 -->
  <g filter="url(#rough2)">
    <text x="162" y="87" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="170" y="70" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="187" y="87" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="204" y="70" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="221" y="87" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="238" y="70" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="255" y="87" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="272" y="70" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="289" y="87" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="306" y="70" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/><text x="323" y="87" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="340" y="70" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/><text x="357" y="87" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- row: 8 = 001000 -->
  <g filter="url(#rough2)">
    <text x="162" y="117" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="170" y="100" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="187" y="117" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="204" y="100" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="221" y="117" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="238" y="100" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/><text x="255" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="272" y="100" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="289" y="117" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="306" y="100" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="323" y="117" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="340" y="100" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="357" y="117" text-anchor="middle" font-size="12" fill="#999">0</text>
  </g>

  <!-- row: 48 = 110000 -->
  <g filter="url(#rough2)">
    <text x="162" y="147" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">48</text>
    <rect x="170" y="130" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/><text x="187" y="147" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="204" y="130" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/><text x="221" y="147" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="238" y="130" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="255" y="147" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="272" y="130" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="289" y="147" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="306" y="130" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="323" y="147" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="340" y="130" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="357" y="147" text-anchor="middle" font-size="12" fill="#999">0</text>
  </g>

  <line x1="170" y1="160" x2="374" y2="160" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- row: OR = 111011 -->
  <g filter="url(#rough2)">
    <text x="162" y="183" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">OR</text>
    <rect x="170" y="166" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="187" y="183" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="204" y="166" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="221" y="183" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="238" y="166" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="255" y="183" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="272" y="166" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="289" y="183" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="306" y="166" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="323" y="183" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="340" y="166" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="357" y="183" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  </g>

  <!-- equivalence callout -->
  <g filter="url(#rough2)">
    <rect x="396" y="70" width="148" height="122" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="470" y="92" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">为什么等价？</text>
    <text x="470" y="112" text-anchor="middle" font-size="10.5" fill="#555">某列出现两个 1</text>
    <text x="470" y="129" text-anchor="middle" font-size="10.5" fill="#555">⟺ 那两数 AND 非零</text>
    <text x="470" y="149" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">两两 AND = 0</text>
    <text x="470" y="166" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">⟺ 每列 ≤ 1 个 1</text>
    <text x="470" y="184" text-anchor="middle" font-size="10" fill="#888">（成对条件 → 整体条件）</text>
  </g>

  <!-- ===== ② newcomer 10 ===== -->
  <text x="40" y="222" font-size="12" fill="#b85450" font-weight="bold">② 新元素 10 = 001010 申请入窗：只需与 OR 做一次 AND</text>

  <g filter="url(#rough2)">
    <text x="162" y="247" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold">10</text>
    <rect x="170" y="230" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="187" y="247" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="204" y="230" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="221" y="247" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="238" y="230" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/><text x="255" y="247" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <rect x="272" y="230" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="289" y="247" text-anchor="middle" font-size="12" fill="#999">0</text>
    <rect x="306" y="230" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/><text x="323" y="247" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <rect x="340" y="230" width="34" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="357" y="247" text-anchor="middle" font-size="12" fill="#999">0</text>
  </g>

  <!-- collision marks -->
  <g filter="url(#rough2)">
    <rect x="239" y="165" width="32" height="29" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" rx="6"/>
    <rect x="307" y="165" width="32" height="29" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" rx="6"/>
    <line x1="255" y1="230" x2="255" y2="196" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3"/>
    <line x1="323" y1="230" x2="323" y2="196" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="268" y="212" font-size="10.5" fill="#b85450" font-weight="bold">被占</text>
    <text x="336" y="212" font-size="10.5" fill="#b85450" font-weight="bold">被占</text>
  </g>

  <!-- result box -->
  <g filter="url(#rough2)">
    <rect x="96" y="270" width="448" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="320" y="292" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">10 &amp; OR = 001010 &amp; 111011 = 001010 ≠ 0（比特 3、比特 1 已被占用）</text>
    <text x="320" y="312" text-anchor="middle" font-size="11.5" fill="#666">冲突 → 先从窗口左端撤销元素腾出比特，再纳入 10</text>
  </g>

  <!-- takeaway -->
  <g filter="url(#rough2)">
    <rect x="76" y="342" width="408" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
    <text x="280" y="364" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">把窗口 OR 当作「比特占用表」</text>
    <text x="280" y="384" text-anchor="middle" font-size="11.5" fill="#555">新元素可入窗 ⟺ x &amp; OR = 0，一次位运算代替 O(L²) 成对检验</text>
  </g>
</svg>
