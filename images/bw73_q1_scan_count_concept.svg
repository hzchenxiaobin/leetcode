<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">一遍扫描：遇到 key，就给它的后继计数 +1</text>

  <!-- 数组格子 -->
  <text x="60" y="70" font-size="13" fill="#446688" filter="url(#rough2)">nums：</text>
  <g filter="url(#rough2)">
    <rect x="105" y="52" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="169" y="52" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="233" y="52" width="64" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="297" y="52" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="361" y="52" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="137" y="74">1</text>
    <text x="201" y="74">100</text>
    <text x="265" y="74">200</text>
    <text x="329" y="74">1</text>
    <text x="393" y="74">100</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#446688" text-anchor="middle">
    <text x="137" y="102">key = 1</text>
    <text x="329" y="102">key = 1</text>
  </g>
  <!-- key → 后继 的箭头 -->
  <g filter="url(#rough2)">
    <path d="M 150 112 C 165 130, 180 130, 193 92" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 342 112 C 357 130, 372 130, 385 92" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="222" y="132" font-size="12" fill="#d6a040" filter="url(#rough2)" text-anchor="middle">后继即 target</text>

  <!-- 计数桶 -->
  <text x="130" y="185" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">计数桶（值域数组）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="200" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="60" y="248" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="160" y="225">target = 100 → 计数 2 ✓</text>
    <text x="160" y="273">target = 200 → 计数 1</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 232 92 C 270 150, 300 160, 268 200" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 265 74 C 330 120, 320 170, 268 210" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  </g>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="300" y="200" width="230" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#5a4a20">
    <text x="315" y="228">i 只扫到 n−2；</text>
    <text x="315" y="250">答案 = 计数最大的 target</text>
    <text x="315" y="272">（题目保证唯一）→ 返回 100</text>
  </g>
</svg>
