<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">余数只有 0 / 1 / 2，代价至多 1</text>

  <rect x="56" y="62" width="124" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="118" y="88" text-anchor="middle" font-size="15" fill="#2f5527" filter="url(#rough2)">r = 0</text>
  <text x="118" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">已整除 → 0 次</text>

  <rect x="198" y="62" width="124" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="15" fill="#2b4a66" filter="url(#rough2)">r = 1</text>
  <text x="260" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">减 1 最省 → 1 次</text>

  <rect x="340" y="62" width="124" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="88" text-anchor="middle" font-size="15" fill="#7a5a10" filter="url(#rough2)">r = 2</text>
  <text x="402" y="108" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">加 1 最省 → 1 次</text>

  <path d="M 260 124 L 260 148" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="104" y="152" width="312" height="44" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">单个元素代价 = min(r, 3 − r) ∈ {0, 1}</text>

  <path d="M 260 198 L 260 222" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="66" y="226" width="388" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="14" fill="#8c3a36" filter="url(#rough2)">ans = 满足 nums[i] % 3 ≠ 0 的元素个数</text>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">每个这样的元素恰需 1 次，一个都不能省</text>

  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">因为元素之间互不影响：总代价 = 各元素代价之和</text>
</svg>
