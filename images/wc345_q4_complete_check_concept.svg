<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">核心观察：连通分量完全 ⟺ 内部边数取满</text>
  <text x="260" y="46" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">e = k(k−1)/2（k 为分量顶点数；无重边、无自环）</text>

  <!-- 左：完全分量 -->
  <rect x="28" y="60" width="214" height="196" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">分量 {0,1,2}：完全</text>
  <line x1="135" y1="112" x2="95" y2="200" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="135" y1="112" x2="175" y2="200" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="95" y1="200" x2="175" y2="200" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="135" cy="112" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="95" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="175" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="135" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">e = 3 = 3×2/2 ✓ 完全</text>

  <!-- 右：非完全分量 -->
  <rect x="278" y="60" width="214" height="196" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">分量 {3,4,5}：不完全</text>
  <line x1="385" y1="112" x2="345" y2="200" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="385" y1="112" x2="425" y2="200" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="345" y1="200" x2="425" y2="200" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="385" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">缺失</text>
  <circle cx="385" cy="112" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="345" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="425" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="385" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">e = 2 &lt; 3×2/2 ✗ 不完全</text>

  <!-- 底部结论 -->
  <rect x="55" y="280" width="410" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">k 个顶点的简单图至多 C(k,2) 条边（每对一条，无重边）</text>
  <text x="260" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">边数取满 ⟺ 每对顶点都有边 ⟺ 完全分量</text>
</svg>
