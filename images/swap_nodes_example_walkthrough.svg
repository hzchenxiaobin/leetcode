<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="404" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">示例演算：[1,2,3,4,5]，k = 2（n = 5）</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">f = first（蓝）　s = second（绿）</text>

  <!-- 行 1：first 先走 k-1 步 -->
  <text x="14" y="84" font-size="10" fill="#666" filter="url(#rough2)">① first 先走</text>
  <text x="14" y="99" font-size="10" fill="#666" filter="url(#rough2)">k−1 = 1 步</text>
  <text x="143" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s</text>
  <text x="201" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">f</text>
  <rect x="120" y="76" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="96" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="76" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="201" y="96" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="76" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="96" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="294" y="76" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="96" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="352" y="76" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="96" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <path d="M167,91 H175" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M225,91 H233" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M283,91 H291" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M341,91 H349" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="88" font-size="9.5" fill="#888" filter="url(#rough2)">间距 1 条边</text>
  <text x="406" y="101" font-size="9.5" fill="#888" filter="url(#rough2)">= k−1 ✓</text>

  <!-- 行 2：同速推进 ① -->
  <text x="14" y="146" font-size="10" fill="#666" filter="url(#rough2)">② 同速推进</text>
  <text x="14" y="161" font-size="10" fill="#666" filter="url(#rough2)">各前进一步</text>
  <text x="201" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s</text>
  <text x="259" y="132" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">f</text>
  <rect x="120" y="138" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="158" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="138" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="158" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="138" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="158" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="294" y="138" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="158" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="352" y="138" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="158" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <path d="M167,153 H175" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M225,153 H233" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M283,153 H291" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M341,153 H349" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="150" font-size="9.5" fill="#888" filter="url(#rough2)">间距 1 条边</text>

  <!-- 行 3：再推进一步 -->
  <text x="14" y="208" font-size="10" fill="#666" filter="url(#rough2)">③ 再推进一步</text>
  <text x="259" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s</text>
  <text x="317" y="194" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">f</text>
  <rect x="120" y="200" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="200" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="200" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="294" y="200" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="352" y="200" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <path d="M167,215 H175" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M225,215 H233" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M283,215 H291" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M341,215 H349" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="212" font-size="9.5" fill="#888" filter="url(#rough2)">间距 1 条边</text>

  <!-- 行 4：first 触尾停止 -->
  <text x="14" y="270" font-size="10" fill="#666" filter="url(#rough2)">④ first.next</text>
  <text x="14" y="285" font-size="10" fill="#666" filter="url(#rough2)">= null 停止</text>
  <text x="317" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s</text>
  <text x="375" y="256" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">f</text>
  <rect x="120" y="262" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="282" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="262" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="282" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="262" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="282" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="294" y="262" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="317" y="282" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="352" y="262" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="375" y="282" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <path d="M167,277 H175" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M225,277 H233" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M283,277 H291" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M341,277 H349" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="274" font-size="9.5" fill="#888" filter="url(#rough2)">s 身后剩 1 个节点</text>
  <text x="406" y="287" font-size="9.5" fill="#888" filter="url(#rough2)">⟹ 倒数第 2 ✓</text>

  <!-- 行 5：swap 两 val -->
  <text x="14" y="332" font-size="10" fill="#666" filter="url(#rough2)">⑤ swap 两 val</text>
  <path d="M201,326 Q259,302 317,326" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="120" y="324" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="344" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="324" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="201" y="344" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="236" y="324" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="344" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="294" y="324" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="317" y="344" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="352" y="324" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="344" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <path d="M167,339 H175" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M225,339 H233" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M283,339 H291" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M341,339 H349" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="336" font-size="9.5" fill="#888" filter="url(#rough2)">交换 2 ↔ 4</text>

  <rect x="60" y="366" width="400" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="385" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">结果：1 → 4 → 3 → 2 → 5 ✓（next 指针全程不动）</text>
</svg>
