<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 i → [Aᵢ, Bᵢ] 连边：脏点所在的 SCC 必须排成一条链</text>
  <path d="M 128 40 Q 390 47 652 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="390" y="62" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">例：A = (1,1,1,4,5,5,7,8)，B = (2,3,6,4,6,8,7,8)，脏点 = {1,2,3,5,6}</text>

  <!-- C1 -->
  <rect x="54" y="84" width="226" height="118" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="167" y="108" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">C₁ = {1, 2, 3}</text>
  <text x="167" y="129" text-anchor="middle" font-size="12" fill="#5b7a99" filter="url(#rough2)">max C₁ = 3</text>
  <text x="167" y="149" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">1: [1,2]　2: [1,3]　3: [1,6]</text>
  <text x="167" y="169" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">b 边 1→2→3 都留在 C₁ 内</text>
  <text x="167" y="189" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">只有 max 的 b₃ = 6 跑出去</text>

  <!-- C2 -->
  <rect x="322" y="84" width="196" height="118" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="420" y="108" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">C₂ = {5, 6}</text>
  <text x="420" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">max C₂ = 6</text>
  <text x="420" y="149" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">5: [5,6]　6: [5,8]</text>
  <text x="420" y="169" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">b₅ = 6 ∈ C₂</text>
  <text x="420" y="189" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">唯一出口 b₆ = 8</text>

  <!-- C3 -->
  <rect x="560" y="84" width="172" height="118" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="646" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">C₃：只剩好点</text>
  <text x="646" y="129" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">4、7、8（b 自环）</text>
  <text x="646" y="149" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">走到这里就没脏点了</text>
  <text x="646" y="169" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">最后一个 SCC 的 max</text>
  <text x="646" y="189" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">自环或落在好点区</text>

  <!-- arrows -->
  <path d="M 282 128 L 316 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="300" y="118" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">3→6</text>
  <path d="M 520 128 L 554 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="538" y="118" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">6→8</text>

  <!-- laws -->
  <rect x="50" y="216" width="690" height="98" rx="10" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="239" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">链的两条铁律（有解时必须全部成立）</text>
  <text x="66" y="262" font-size="11.5" fill="#3c4a5a" filter="url(#rough2)">① Cᵢ 的点全部小于 Cᵢ₊₁ 的点：否则 Cᵢ₊₁ 内部路径必有一跳从 ≥ max Cᵢ 落到更小处，两个 SCC 会合并。</text>
  <text x="66" y="283" font-size="11.5" fill="#3c4a5a" filter="url(#rough2)">② 每个 Cᵢ 只有一个出口，而且只能是 max Cᵢ 的 b 边：非 max 的点若 b 跑出 SCC，就再也没机会回来收尾。</text>
  <text x="66" y="303" font-size="11.5" fill="#3c4a5a" filter="url(#rough2)">③ 脏点不能分属两个「源」SCC：离开一个 SCC 后永远回不去，所以访问顺序只能是 C₁ → C₂ → … → Cₖ。</text>

  <!-- violation examples -->
  <rect x="50" y="320" width="690" height="112" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66" y="342" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">违反任一条 ⇒ 无解，输出 -1</text>
  <text x="66" y="363" font-size="11" fill="#a14340" filter="url(#rough2)">例 1（两个出口）：A = (1,1,1,1,5,5,7,8)，B = (3,3,5,5,6,7,8,8)。</text>
  <text x="66" y="381" font-size="11" fill="#a14340" filter="url(#rough2)">　　　　SCC {1,2,3,4} 里 3→5 与 4→5 都跑出去，必有一条出口用不上。</text>
  <text x="66" y="400" font-size="11" fill="#a14340" filter="url(#rough2)">例 2（两个源）：A = (1,1,1)，B = (1,2,3)。脏点 2、3 各自成 SCC 且都无入边，只能访问其中一个。</text>
  <text x="66" y="419" font-size="11" fill="#a14340" filter="url(#rough2)">例 3（出边只增）：A = (2,2)，B = (1,2)。a₁ = 2 已大于 b₁ = 1，永远拉不回来。</text>

  <text x="390" y="450" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">贪心不需要真的建图 / 求 SCC：只靠 a、b 两个数组就能走出这条链；链结构只用来证明它不漏解。</text>
</svg>
