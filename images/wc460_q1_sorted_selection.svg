<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">排序后「隔一个取一个」：中位数从倒数第二个取起</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- sorted cells: n=12, k=4, values 1..6 -->
  <!-- index 0..3 green fillers, even index>=4 orange medians, odd index>=5 blue maxes -->
  <g filter="url(#sk)">
    <rect x="62"  y="118" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="108" y="118" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="154" y="118" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="200" y="118" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="246" y="118" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="292" y="118" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="338" y="118" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="384" y="118" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="430" y="118" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="476" y="118" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="522" y="118" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="568" y="118" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="84"  y="143">1</text><text x="130" y="143">1</text>
    <text x="176" y="143">2</text><text x="222" y="143">2</text>
    <text x="268" y="143" font-weight="bold" fill="#a06a10">3</text><text x="314" y="143">3</text>
    <text x="360" y="143" font-weight="bold" fill="#a06a10">4</text><text x="406" y="143">4</text>
    <text x="452" y="143" font-weight="bold" fill="#a06a10">5</text><text x="498" y="143">5</text>
    <text x="544" y="143" font-weight="bold" fill="#a06a10">6</text><text x="590" y="143">6</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="84" y="172">0</text><text x="130" y="172">1</text><text x="176" y="172">2</text>
    <text x="222" y="172">3</text><text x="268" y="172">4</text><text x="314" y="172">5</text>
    <text x="360" y="172">6</text><text x="406" y="172">7</text><text x="452" y="172">8</text>
    <text x="498" y="172">9</text><text x="544" y="172">10</text><text x="590" y="172">11</text>
  </g>

  <!-- arrow above: from a[n-2] leftwards, taking every other -->
  <g filter="url(#sk)">
    <path d="M 544 106 Q 406 88 268 106" stroke="#b85450" stroke-width="2" stroke-dasharray="6 3" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="406" y="82" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">中位数：从 a[n-2] 往左，隔一个取一个</text>

  <!-- zone brackets -->
  <g filter="url(#sk)">
    <path d="M 64 190 Q 143 204 242 190" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <path d="M 248 190 Q 429 204 610 190" stroke="#d6a040" stroke-width="1.8" fill="none"/>
  </g>
  <text x="153" y="216" text-anchor="middle" font-size="11" fill="#2e6e2e">前 k 个 → 做每组的最小值（垫脚）</text>
  <text x="429" y="216" text-anchor="middle" font-size="11" fill="#a06a10">后 2k 个：隔一取一做中位数，旁边一个当最大值搭档</text>

  <!-- legend box -->
  <g filter="url(#sk)">
    <rect x="60" y="238" width="290" height="72" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="11.5">
    <rect x="76" y="252" width="18" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="102" y="263" fill="#444">最小值垫脚（前 k 小）</text>
    <rect x="76" y="272" width="18" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="102" y="283" fill="#444">中位数（下标 n-2, n-4, …, k）</text>
    <rect x="76" y="292" width="18" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="102" y="303" fill="#444">最大值搭档（中位数右侧邻居）</text>
  </g>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="380" y="238" width="240" height="72" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="500" y="262" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">答案 = a[n-2]+a[n-4]+…+a[n-2k]</text>
  <text x="500" y="284" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">= 6 + 5 + 4 + 3 = 18</text>
  <text x="500" y="302" text-anchor="middle" font-size="10.5" fill="#888">（图中 n=12, k=4）</text>

  <!-- key insight -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="600" height="54" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="60" y="352" font-size="12" font-weight="bold" fill="#2b2b2b">关键观察：每个中位数必须配一个组内 ≥ 它的元素「护驾」，</text>
  <text x="60" y="372" font-size="12" fill="#444">所以最大的 k 个不能全当中位数；第 j 大的中位数 ≤ 全数组第 2j 大的元素。</text>
</svg>
