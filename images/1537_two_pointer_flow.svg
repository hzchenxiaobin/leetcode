<svg xmlns="http://www.w3.org/2000/svg" width="660" height="490" viewBox="0 0 660 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="660" height="490" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：双指针归并 —— 谁小走谁，相遇结算</text>
  <path d="M 160 36 Q 330 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="54" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">s1 / s2 = 自上一公共值以来两侧的段和；公共值处结算一次，尾段在循环外结算</text>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="180" y="64" width="300" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="330" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#sk)">i = j = 0；s1 = s2 = ans = 0</text>
  <path d="M 330 94 L 330 108" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D1: 还有元素吗 -->
  <g filter="url(#sk)">
    <polygon points="330,112 452,144 330,176 208,144" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="330" y="149" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">i&lt;n 或 j&lt;m ?</text>

  <!-- 否：出口 -->
  <path d="M 452 144 L 500 144" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="476" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="504" y="124" width="152" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="580" y="144" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b26" filter="url(#sk)">ans += max(s1, s2)</text>
  <path d="M 580 156 L 580 170" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="504" y="172" width="152" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="580" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b26" filter="url(#sk)">return ans % (10⁹+7)</text>

  <!-- 是：进入比较 -->
  <path d="M 330 176 L 330 206" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="338" y="196" font-size="11" font-weight="bold" fill="#2f6b26" filter="url(#sk)">是</text>

  <!-- D2: 比较 -->
  <g filter="url(#sk)">
    <polygon points="330,210 478,262 330,314 182,262" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="330" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">nums1[i] 与 nums2[j] 谁小？</text>
  <text x="330" y="276" text-anchor="middle" font-size="10.5" fill="#667" filter="url(#sk)">（一侧耗尽 ⇒ 视另一侧更小）</text>

  <!-- 左分支 -->
  <path d="M 182 262 Q 146 296 115 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="88" y="296" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">nums1 小</text>
  <g filter="url(#sk)">
    <rect x="30" y="334" width="160" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="110" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">nums1[i] &lt; nums2[j]</text>
  <text x="110" y="376" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">s1 += nums1[i++]</text>

  <!-- 右分支 -->
  <path d="M 478 262 Q 514 296 545 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="572" y="296" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">nums2 小</text>
  <g filter="url(#sk)">
    <rect x="470" y="334" width="160" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="550" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">nums2[j] &lt; nums1[i]</text>
  <text x="550" y="376" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">s2 += nums2[j++]</text>

  <!-- 下分支：公共值 -->
  <path d="M 330 314 L 330 364" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="344" y="340" font-size="10.5" font-weight="bold" fill="#b07818" filter="url(#sk)">相等 = 公共值</text>
  <g filter="url(#sk)">
    <rect x="200" y="368" width="260" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="330" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">公共值 c：ans += max(s1,s2) + c</text>
  <text x="330" y="410" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">s1 = s2 = 0；i++、j++（c 只计一次）</text>

  <!-- 回路：三支汇入 rail，再回到 D1 -->
  <g filter="url(#sk)" stroke="#446688" stroke-width="1.5" fill="none">
    <path d="M 110 386 L 110 452"/>
    <path d="M 330 424 L 330 452"/>
    <path d="M 550 386 L 550 452"/>
    <path d="M 36 452 L 550 452"/>
    <path d="M 36 452 L 36 144 L 200 144" marker-end="url(#arb)"/>
  </g>
  <circle cx="110" cy="452" r="3" fill="#446688" filter="url(#sk)"/>
  <circle cx="330" cy="452" r="3" fill="#446688" filter="url(#sk)"/>
  <circle cx="550" cy="452" r="3" fill="#446688" filter="url(#sk)"/>
  <text x="240" y="470" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">回到「i&lt;n 或 j&lt;m ?」继续归并</text>
  <text x="648" y="478" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#sk)">⚠ s1 / s2 全程不取模 —— max 要真实大小</text>
</svg>
