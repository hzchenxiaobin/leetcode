<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：差异位置的个数只有 0 和 2 可行</text>

  <!-- 左区：s1 / s2 对齐字符图（bank vs kanb） -->
  <text x="125" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="173" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="221" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="269" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>

  <text x="92" y="98" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">s1</text>
  <rect x="104" y="72" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">b</text>
  <rect x="152" y="72" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="99" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="200" y="72" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="99" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">n</text>
  <rect x="248" y="72" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="269" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">k</text>

  <!-- 交叉弧线：s1[0]↔s2[3]（b=b），s1[3]↔s2[0]（k=k） -->
  <path d="M125,120 C 108,172 256,164 261,210" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M269,120 C 286,172 138,164 133,210" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="152" font-size="12" fill="#4a7a3a" filter="url(#rough2)">b = b ✓</text>
  <text x="292" y="152" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k = k ✓</text>
  <text x="196" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">交叉相等 ⟹ 交换 s1 的 0、3 两位</text>

  <text x="92" y="242" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">s2</text>
  <rect x="104" y="216" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="243" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">k</text>
  <rect x="152" y="216" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="243" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="200" y="216" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="243" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">n</text>
  <rect x="248" y="216" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="269" y="243" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">b</text>

  <!-- 右区：按 |D| 分类的三种判定 -->
  <rect x="340" y="56" width="190" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="77" text-anchor="middle" font-size="12.5" fill="#2d5a2d" filter="url(#rough2)">|D| = 0：本来就相等</text>
  <text x="435" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ true（不交换）</text>

  <rect x="340" y="118" width="190" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="139" text-anchor="middle" font-size="12.5" fill="#2d5a2d" filter="url(#rough2)">|D| = 2 且交叉相等</text>
  <text x="435" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ true（换 i、j 两位）</text>

  <rect x="340" y="180" width="190" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="201" text-anchor="middle" font-size="12.5" fill="#7a3530" filter="url(#rough2)">|D| = 1 或 |D| ≥ 3</text>
  <text x="435" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ false</text>

  <!-- 底部说明框 -->
  <rect x="40" y="266" width="480" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="292" font-size="12" fill="#333" filter="url(#rough2)">· 交换不改变字符多重集：|D| = 1 时两串多重集必不同，怎么换都救不回</text>
  <text x="58" y="316" font-size="12" fill="#333" filter="url(#rough2)">· 一次交换至多改变 2 个下标上的字符：|D| ≥ 3 时必剩差异</text>
  <text x="58" y="340" font-size="12" fill="#333" filter="url(#rough2)">· 所以只需一次扫描收集 D，判定 |D| ∈ {0, 2} 与交叉相等</text>
  <text x="58" y="364" font-size="12" fill="#333" filter="url(#rough2)">· “最多一次”包含 0 次：s1 = s2 时直接 true（示例 3）</text>
</svg>
