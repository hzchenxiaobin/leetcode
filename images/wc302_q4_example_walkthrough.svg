<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums = [2,3,2,4,3]，numsDivide = [9,6,9,3,15]</text>

  <!-- left panel: gcd fold -->
  <text x="140" y="54" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 折叠 gcd</text>
  <rect x="45" y="64" width="190" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="81" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">gcd(9, 6) = 3</text>
  <path d="M 140 92 L 140 100" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="45" y="102" width="190" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="119" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">gcd(3, 9) = 3</text>
  <path d="M 140 130 L 140 138" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="45" y="140" width="190" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="157" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">gcd(3, 3) = 3</text>
  <path d="M 140 168 L 140 176" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="45" y="178" width="190" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="195" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">gcd(3, 15) = 3</text>
  <path d="M 140 206 L 140 220" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="45" y="224" width="190" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="250" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g = 3</text>
  <text x="140" y="288" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">折叠 m − 1 = 4 次</text>
  <text x="140" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每次 gcd 为 O(log V)</text>

  <!-- right panel: sorted scan -->
  <text x="430" y="54" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 排序后扫描</text>

  <rect x="300" y="64" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="352" y="64" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="404" y="64" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="456" y="64" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="478" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="508" y="64" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <text x="322" y="120" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3%2=1 ✗</text>
  <text x="374" y="120" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3%2=1 ✗</text>
  <text x="426" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3%3=0 ✓</text>
  <text x="478" y="120" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="530" y="120" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <path d="M 300 132 L 300 140 L 396 140 L 396 132" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="158" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">必删 ×2</text>

  <path d="M 426 126 L 426 144" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="158" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x* = 3（首个合格）</text>

  <!-- answer badge -->
  <rect x="300" y="186" width="252" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="426" y="205" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 2</text>
  <text x="426" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= 命中下标 = 更小元素个数</text>

  <!-- example 2 contrast -->
  <rect x="300" y="244" width="340" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="470" y="266" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">对照示例 2（无解）：g = gcd(8,2,6,10) = 2</text>
  <text x="470" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">排序后 [3,4,6] 无一整除 2 ⟹ return −1</text>

  <!-- bottom verification -->
  <rect x="40" y="330" width="580" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">删除后 nums = [3, 3, 4]，最小元素为 3</text>
  <text x="330" y="380" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 | 9，3 | 6，3 | 9，3 | 3，3 | 15 全部成立 ✓ ⟹ 最少删除 2 次</text>
</svg>
