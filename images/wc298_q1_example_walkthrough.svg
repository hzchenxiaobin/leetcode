<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：示例 2 逐槽走查 + 三例结果对照</text>
  <path d="M 150 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="116" y="70" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b">示例 2：s = "arRAzFif"（小写 a,r,z,f,i ／ 大写 R,A,F）</text>

  <!-- R 列高亮（置底） -->
  <g filter="url(#sk)"><rect x="405" y="80" width="17" height="88" fill="#fce4ec" opacity="0.9"/></g>

  <!-- 表格横线 -->
  <g filter="url(#sk)"><rect x="116" y="80" width="442" height="88" fill="none" stroke="#c7d2de" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><line x1="116" y1="102" x2="558" y2="102" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><line x1="116" y1="124" x2="558" y2="124" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><line x1="116" y1="146" x2="558" y2="146" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><line x1="133" y1="80" x2="133" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="150" y1="80" x2="150" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="167" y1="80" x2="167" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="184" y1="80" x2="184" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="201" y1="80" x2="201" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="218" y1="80" x2="218" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="235" y1="80" x2="235" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="252" y1="80" x2="252" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="269" y1="80" x2="269" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="286" y1="80" x2="286" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="303" y1="80" x2="303" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="320" y1="80" x2="320" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="337" y1="80" x2="337" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="354" y1="80" x2="354" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="371" y1="80" x2="371" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="388" y1="80" x2="388" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="422" y1="80" x2="422" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="439" y1="80" x2="439" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="456" y1="80" x2="456" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="473" y1="80" x2="473" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="490" y1="80" x2="490" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="507" y1="80" x2="507" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="524" y1="80" x2="524" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><line x1="541" y1="80" x2="541" y2="168" stroke="#dfe6ee" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><rect x="405" y="80" width="17" height="88" fill="none" stroke="#b85450" stroke-width="1.8"/></g>

  <!-- 行标签 -->
  <text x="108" y="94" text-anchor="end" font-size="10.5" fill="#888">槽 i 的字母</text>
  <text x="108" y="117" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2e5e2e">小写出现</text>
  <text x="108" y="139" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b07818">大写出现</text>
  <text x="108" y="161" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b85450">双真（兼具）</text>

  <!-- 字母表头 -->
  <g filter="url(#sk)">
    <text x="124" y="95" text-anchor="middle" font-size="9" fill="#a04a48" font-weight="bold">A</text>
    <text x="141" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">B</text>
    <text x="158" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">C</text>
    <text x="175" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">D</text>
    <text x="192" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">E</text>
    <text x="209" y="95" text-anchor="middle" font-size="9" fill="#a04a48" font-weight="bold">F</text>
    <text x="226" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">G</text>
    <text x="243" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">H</text>
    <text x="260" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">I</text>
    <text x="277" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">J</text>
    <text x="294" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">K</text>
    <text x="311" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">L</text>
    <text x="328" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">M</text>
    <text x="345" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">N</text>
    <text x="362" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">O</text>
    <text x="379" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">P</text>
    <text x="396" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">Q</text>
    <text x="413" y="95" text-anchor="middle" font-size="9" fill="#a04a48" font-weight="bold">R</text>
    <text x="430" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">S</text>
    <text x="447" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">T</text>
    <text x="464" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">U</text>
    <text x="481" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">V</text>
    <text x="498" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">W</text>
    <text x="515" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">X</text>
    <text x="532" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">Y</text>
    <text x="549" y="95" text-anchor="middle" font-size="9" fill="#9aa7b4">Z</text>
  </g>

  <!-- 小写行：a(0) f(5) i(8) r(17) z(25) -->
  <g filter="url(#sk)">
    <text x="124" y="119" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
    <text x="209" y="119" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
    <text x="260" y="119" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
    <text x="413" y="119" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="549" y="119" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
  </g>
  <!-- 大写行：A(0) F(5) R(17) -->
  <g filter="url(#sk)">
    <text x="124" y="141" text-anchor="middle" font-size="10" fill="#b07818">✓</text>
    <text x="209" y="141" text-anchor="middle" font-size="10" fill="#b07818">✓</text>
    <text x="413" y="141" text-anchor="middle" font-size="10" fill="#b07818" font-weight="bold">✓</text>
  </g>
  <!-- 双真行：A(0) F(5) R(17) -->
  <g filter="url(#sk)">
    <text x="124" y="163" text-anchor="middle" font-size="9" fill="#b85450">●</text>
    <text x="209" y="163" text-anchor="middle" font-size="9" fill="#b85450">●</text>
    <text x="413" y="163" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">●</text>
  </g>

  <!-- 答案标注 -->
  <path d="M 413 172 V 184" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">倒序扫描 25→0：最先命中的双真槽 i = 17 → 返回 'A'+17 = "R"</text>

  <!-- 示例 1 / 示例 3 -->
  <g filter="url(#sk)"><rect x="64" y="216" width="280" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="204" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">示例 1：s = "lEeTcOdE"</text>
  <text x="204" y="260" text-anchor="middle" font-size="11" fill="#444">小写 {c,d,e,l,o,t}，大写 {E}</text>
  <text x="204" y="282" text-anchor="middle" font-size="11.5" fill="#444">双真槽仅 E(4) → 返回 <tspan font-weight="bold" fill="#2e5e2e">"E"</tspan></text>

  <g filter="url(#sk)"><rect x="356" y="216" width="280" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="496" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04a48">示例 3：s = "AbCdEfGhIjK"</text>
  <text x="496" y="260" text-anchor="middle" font-size="11" fill="#444">小写 {b,d,f,h,j}，大写 {A,C,E,G,I,K}</text>
  <text x="496" y="282" text-anchor="middle" font-size="11.5" fill="#444">无同一字母双形态 → 双真 ∅ → 返回 <tspan font-weight="bold" fill="#a04a48">""</tspan></text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="64" y="320" width="572" height="62" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="350" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">每字符恰置一个槽位 —— 出现性与顺序、次数无关，26 槽 × 2 形态装下全部信息</text>
  <text x="350" y="364" text-anchor="middle" font-size="11.5" fill="#555">倒序至多 26 步：首个双真槽即答案；扫完仍无双真 → 空串</text>

  <text x="320" y="412" text-anchor="middle" font-size="11" fill="#888">例 3 的教训：大小写「都有」≠ 同一字母「兼具」—— 槽位错开永不双真，判定必须对齐到同一字母</text>
</svg>
