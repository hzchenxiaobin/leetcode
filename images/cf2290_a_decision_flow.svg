<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：只做一次比较</text>
  <path d="M 232 42 Q 360 49 488 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 输入 -->
  <rect x="238" y="62" width="244" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="84" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">读入 a, b, c</text>
  <text x="360" y="101" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">题面保证 a ≤ b ≤ c</text>

  <path d="M 360 110 L 360 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="360,158 546,214 360,270 174,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">b − a == 1</text>
  <text x="360" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">且 c − b == 1 ?</text>

  <!-- 左：YES -->
  <path d="M 210 244 L 130 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">真</text>
  <rect x="42" y="304" width="176" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 YES</text>

  <!-- 右：NO -->
  <path d="M 510 244 L 590 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="572" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">假</text>
  <rect x="502" y="304" width="176" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="590" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 NO</text>

  <!-- 等价写法备注 -->
  <rect x="42" y="376" width="636" height="46" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360" y="396" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">等价写法：sum % 3 == 0 且 c − a == 2（a ≤ b ≤ c 时两式可互相推出）</text>
  <text x="360" y="414" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">也可直接枚举 3 × 2 = 6 种 (取, 放) 组合，把三堆改成相等即 YES——数据极小，两条路都对</text>
</svg>
