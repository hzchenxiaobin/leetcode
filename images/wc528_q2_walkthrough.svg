<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：按 4,5,6,7,1,2,3,0 的顺序自底向上填 dp</text>
  <text x="340" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">S = score[u] + Σ dp[c]，m = min_c dp[c]；op=0 用 S − min(0, m)，op=1 用 S − m</text>

  <g filter="url(#rough2)">
    <rect x="40" y="74" width="600" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="40" y="108" width="600" height="288" fill="#fdfdfd" stroke="#446688" stroke-width="1.5"/>

    <rect x="40" y="144" width="600" height="36" fill="#f4f8fd"/>
    <rect x="40" y="216" width="600" height="36" fill="#f4f8fd"/>
    <rect x="40" y="288" width="600" height="36" fill="#f4f8fd"/>
    <rect x="40" y="360" width="600" height="36" fill="#e6f4ea"/>

    <g stroke="#c9d4e0" stroke-width="1">
      <path d="M 40 144 L 640 144"/>
      <path d="M 40 180 L 640 180"/>
      <path d="M 40 216 L 640 216"/>
      <path d="M 40 252 L 640 252"/>
      <path d="M 40 288 L 640 288"/>
      <path d="M 40 324 L 640 324"/>
      <path d="M 40 360 L 640 360"/>
      <path d="M 40 396 L 640 396"/>
    </g>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#1c3d6e" font-weight="bold" text-anchor="middle">
    <text x="78" y="96">节点 u</text>
    <text x="150" y="96">score</text>
    <text x="220" y="96">op</text>
    <text x="330" y="96">孩子的 dp</text>
    <text x="481" y="96">决策（S 与 m）</text>
    <text x="599" y="96">dp[u]</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#444" text-anchor="middle">
    <text x="78" y="131">4</text><text x="150" y="131">3</text><text x="220" y="131">1</text>
    <text x="330" y="131">—</text><text x="481" y="131" fill="#777">叶子：不处理</text>
    <text x="599" y="131" fill="#4a7a3a" font-weight="bold">3</text>

    <text x="78" y="167">5</text><text x="150" y="167">2</text><text x="220" y="167">1</text>
    <text x="330" y="167">—</text><text x="481" y="167" fill="#777">叶子：不处理</text>
    <text x="599" y="167" fill="#4a7a3a" font-weight="bold">2</text>

    <text x="78" y="203">6</text><text x="150" y="203">3</text><text x="220" y="203">0</text>
    <text x="330" y="203">—</text><text x="481" y="203" fill="#777">叶子：不处理</text>
    <text x="599" y="203" fill="#4a7a3a" font-weight="bold">3</text>

    <text x="78" y="239">7</text><text x="150" y="239" fill="#8a3a36">−3</text><text x="220" y="239">1</text>
    <text x="330" y="239">—</text><text x="481" y="239" fill="#777">叶子：不处理</text>
    <text x="599" y="239" fill="#8a3a36" font-weight="bold">−3</text>

    <text x="78" y="275">1</text><text x="150" y="275">6</text><text x="220" y="275">1</text>
    <text x="330" y="275">{3}</text><text x="481" y="275">S=9, m=3 → 零 4</text>
    <text x="599" y="275" font-weight="bold">6</text>

    <text x="78" y="311">2</text><text x="150" y="311">1</text><text x="220" y="311">0</text>
    <text x="330" y="311">{2}</text><text x="481" y="311" fill="#4a7a3a">S=3, m=2 → 不动</text>
    <text x="599" y="311" font-weight="bold">3</text>

    <text x="78" y="347">3</text><text x="150" y="347">2</text><text x="220" y="347">0</text>
    <text x="330" y="347">{3, −3}</text><text x="481" y="347" fill="#b85450">S=2, m=−3 → 零 7</text>
    <text x="599" y="347" fill="#b85450" font-weight="bold">5</text>

    <text x="78" y="383">0</text><text x="150" y="383">5</text><text x="220" y="383">1</text>
    <text x="330" y="383">{6, 3, 5}</text><text x="481" y="383" fill="#b85450" font-weight="bold">S=19, m=3 → 零 2</text>
    <text x="599" y="383" fill="#1c3d6e" font-weight="bold">16</text>
  </g>

  <text x="200" y="434" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">最后一行是根：S=19 减去 m=3，零掉子树 {2,5}</text>

  <rect x="430" y="412" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="434" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 dp[0] = 16</text>
</svg>
