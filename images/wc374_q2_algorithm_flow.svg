<svg xmlns="http://www.w3.org/2000/svg" width="640" height="445" viewBox="0 0 640 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="445" fill="#fdfcf7"/>
  <text x="320" y="27" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：排序 + 单趟扫描（吸收 / 补币）</text>
  <path d="M 160 35 Q 320 43 480 35" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 排序 -->
  <g filter="url(#sk)"><rect x="235" y="52" width="170" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="320" y="73" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">coins 排序（升序）</text>
  <path d="M 320 84 L 320 102" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)"><rect x="215" y="106" width="210" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="320" y="127" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">x = 1,  i = 0,  ans = 0</text>
  <path d="M 320 138 L 320 160" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断1：x <= target ? -->
  <g filter="url(#sk)"><polygon points="320,163 438,196 320,229 202,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10">x ≤ target ?</text>
  <text x="320" y="209" text-anchor="middle" font-size="10" fill="#a08030">（覆盖已罩住目标则停）</text>
  <path d="M 438 196 L 500 196" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="458" y="188" font-size="12" fill="#2e6e2e" font-weight="bold">否</text>
  <path d="M 320 229 L 320 258" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="249" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- 返回 -->
  <g filter="url(#sk)"><rect x="505" y="178" width="108" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="559" y="201" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <!-- 判断2：coins[i] <= x ? -->
  <g filter="url(#sk)"><polygon points="320,261 455,300 320,339 185,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10">i &lt; n 且</text>
  <text x="320" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10">coins[i] ≤ x ?</text>

  <!-- 吸收分支 -->
  <path d="M 455 300 L 540 300 L 540 348" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="486" y="291" font-size="12" fill="#2b6e9e" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="455" y="352" width="170" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="540" y="373" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">吸收：x += coins[i]</text>
  <text x="540" y="392" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">i += 1</text>

  <!-- 补币分支 -->
  <path d="M 185 300 L 100 300 L 100 348" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="136" y="291" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="15" y="352" width="170" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="100" y="373" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">补面值 x：ans += 1</text>
  <text x="100" y="392" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace">x *= 2（i 不动）</text>

  <!-- 回环箭头 -->
  <path d="M 625 378 L 636 378 L 636 152 L 330 152" stroke="#7a7a7a" stroke-width="1.3" marker-end="url(#ar)" fill="none" stroke-dasharray="6,4" filter="url(#sk)"/>
  <path d="M 15 378 L 5 378 L 5 140 L 310 140" stroke="#7a7a7a" stroke-width="1.3" marker-end="url(#ar)" fill="none" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="470" y="144" font-size="10" fill="#888">回到「x ≤ target ?」继续</text>
</svg>
