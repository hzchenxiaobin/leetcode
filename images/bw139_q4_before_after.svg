<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">过 k 的上升路径 = 左下最长链 + k + 右上最长链</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">示例 1：k = 1，coordinates[k] = (2,2)</text>

  <rect x="90" y="180" width="132" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="222" y="120" width="198" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <path d="M 70 300 L 490 300" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 90 316 L 90 96" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="496" y="316" font-size="10" fill="#888">x</text>
  <text x="72" y="92" font-size="10" fill="#888">y</text>

  <text x="150" y="240" font-size="9.5" fill="#3a4a66">x &lt; 2 且 y &lt; 2</text>
  <text x="150" y="256" font-size="9.5" fill="#3a4a66">（k 的前驱区）</text>
  <text x="320" y="142" font-size="9.5" fill="#3a5a30">x &gt; 2 且 y &gt; 2（k 的后继区）</text>

  <ellipse cx="90" cy="300" rx="7" ry="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="322" font-size="9.5" fill="#3a4a66">(0,0)</text>

  <ellipse cx="222" cy="180" rx="9" ry="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="232" y="172" font-size="10.5" fill="#b85450" font-weight="bold">k (2,2)</text>

  <ellipse cx="288" cy="240" rx="6" ry="6" fill="#ddd" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="298" y="258" font-size="9" fill="#999">(3,1) 不在两区</text>
  <ellipse cx="354" cy="240" rx="6" ry="6" fill="#ddd" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="364" y="258" font-size="9" fill="#999">(4,1)</text>

  <ellipse cx="420" cy="120" rx="7" ry="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="114" font-size="9.5" fill="#3a5a30">(5,3)</text>

  <path d="M 100 294 L 212 188" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 234 172 L 408 128" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="380" y="176" width="160" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="196" text-anchor="middle" font-size="10" fill="#8a6a20">灰色点 (3,1)、(4,1)</text>
  <text x="460" y="212" text-anchor="middle" font-size="10" fill="#8a6a20">既不在左下也不在右上</text>
  <text x="460" y="228" text-anchor="middle" font-size="10" fill="#8a6a20">不可能与 k 同链 → 丢弃</text>
  <text x="460" y="244" text-anchor="middle" font-size="10" fill="#8a6a20">（x 或 y 有一个不严格大）</text>

  <rect x="40" y="322" width="490" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="285" y="340" text-anchor="middle" font-size="10.5" fill="#3a5a30">答案 = LIS(左下) + 1 + LIS(右上) = 1 + 1 + 1 = 3</text>
</svg>
