<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="81"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">竖线成对开关：遇到 | 翻转 inPair 状态</text>

  <!-- 字符串格子 -->
  <text x="280" y="62" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">s = "l|*e*et|c**o|*de|"</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <!-- 每个字符一格：l | * e * e t | c * * o | * d e | -->
    <rect x="100" y="74" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="118" y="96">l</text>
    <rect x="136" y="74" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="154" y="96" font-weight="bold">|</text>
    <rect x="172" y="74" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="190" y="96">*</text>
    <rect x="208" y="74" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="226" y="96">e</text>
    <rect x="244" y="74" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="262" y="96">*</text>
    <rect x="280" y="74" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="298" y="96">e</text>
    <rect x="316" y="74" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="334" y="96">t</text>
    <rect x="352" y="74" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="370" y="96" font-weight="bold">|</text>
    <rect x="388" y="74" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="406" y="96">c</text>
    <rect x="424" y="74" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="442" y="96">*</text>
    <rect x="460" y="74" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="478" y="96">*</text>
    <rect x="496" y="74" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="514" y="96">o</text>
  </g>
  <text x="80" y="96" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="end">前 7 格</text>

  <!-- 状态轨道 -->
  <text x="80" y="140" font-size="12.5" fill="#446688" filter="url(#rough2)" text-anchor="end">inPair：</text>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <text x="118" y="140" fill="#4a7a3a">关</text>
    <text x="154" y="140" fill="#d6a040" font-weight="bold">开</text>
    <text x="226" y="140" fill="#b85450">对内</text>
    <text x="334" y="140" fill="#b85450">对内</text>
    <text x="370" y="140" fill="#d6a040" font-weight="bold">关</text>
    <text x="442" y="140" fill="#4a7a3a">对外 ✓</text>
    <text x="514" y="140" fill="#4a7a3a">对外 ✓</text>
  </g>

  <!-- 开关比喻 -->
  <g filter="url(#rough2)">
    <rect x="60" y="170" width="440" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <text x="280" y="196" text-anchor="middle" font-weight="bold">把每对竖线想成一扇自动门：</text>
    <text x="280" y="218" text-anchor="middle">扫到第 1、3、5…条（奇数条）竖线 → 进入门内（inPair = true）</text>
    <text x="280" y="236" text-anchor="middle">扫到第 2、4、6…条（偶数条）竖线 → 走出门外（inPair = false）</text>
  </g>

  <!-- 统计规则 -->
  <g filter="url(#rough2)">
    <rect x="60" y="262" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <text x="280" y="283" text-anchor="middle">只有「门外」（inPair = false）时遇到的 * 才计数：</text>
    <text x="280" y="302" text-anchor="middle" font-weight="bold" fill="#4a7a3a">if (c == '*' &amp;&amp; !inPair) ++ans;</text>
  </g>

  <text x="280" y="344" font-size="12.5" fill="#888" filter="url(#rough2)" text-anchor="middle">图解：粉色 = 竖线对之内（不计）；绿色 = 对外（计入）；黄色 = 竖线（开关）</text>
  <text x="280" y="362" font-size="12.5" fill="#888" filter="url(#rough2)" text-anchor="middle">竖线总数保证为偶数，门最终一定关上，状态无需特判收尾</text>
</svg>
