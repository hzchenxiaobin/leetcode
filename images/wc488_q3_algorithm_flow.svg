<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：枚举右端点 r，双单调队列 + 左端收缩</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- annotations -->
  <rect x="40" y="52" width="186" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="72" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">队列存下标而非值</text>
  <text x="133" y="90" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">每个下标进出各一次，均摊 O(1)</text>

  <rect x="452" y="52" width="168" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="72" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">l 永不超过 r：</text>
  <text x="536" y="90" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">单元素窗口 cost = 0 ≤ k</text>

  <!-- main chain -->
  <rect x="248" y="52" width="164" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="71" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始：ans=0，l=0，队列空</text>

  <path d="M330,82 L330,92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="330,96 396,130 330,164 264,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">r &lt; n ?</text>

  <path d="M396,130 L446,130" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="123" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="450" y="112" width="104" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="502" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 ans</text>

  <path d="M330,164 L330,176" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="173" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="218" y="180" width="224" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">maxQ：队尾弹出值 ≤ nums[r] 的下标，r 入队尾</text>
  <text x="330" y="215" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（维持队头到队尾严格递减）</text>

  <path d="M330,224 L330,234" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="218" y="238" width="224" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">minQ：队尾弹出值 ≥ nums[r] 的下标，r 入队尾</text>
  <text x="330" y="273" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（维持队头到队尾严格递增）</text>

  <path d="M330,282 L330,292" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="330,296 448,338 330,380 212,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="333" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">（maxQ 首值 − minQ 首值）</text>
  <text x="330" y="350" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">× (r − l + 1) &gt; k ?</text>

  <path d="M212,338 L194,338" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="203" y="330" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="34" y="316" width="158" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="113" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">队首下标 = l 的出队</text>
  <text x="113" y="351" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">l ++（收缩左端）</text>

  <path d="M113,316 L113,282 L316,282 L327,290" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="276" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">再判一次开销</text>

  <path d="M330,380 L330,392" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="389" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="222" y="396" width="216" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="414" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">ans += r − l + 1</text>
  <text x="330" y="431" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">（以 r 结尾的合法子数组个数）</text>

  <path d="M438,418 L470,418" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="474" y="400" width="70" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="509" y="422" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">r ++</text>

  <path d="M544,418 L600,418 L600,130 L402,130" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="606" y="280" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90 606 280)" filter="url(#rough2)">处理下一个 r</text>
</svg>
