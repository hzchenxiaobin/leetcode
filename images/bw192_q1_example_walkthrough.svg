  <rect x="397.5" y="59.5" width="10" height="10" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="418" y="68" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">S = T = (1,1)</text>

  <g filter="url(#rough2)" font-size="10" fill="#555" text-anchor="middle">
    <text x="98" y="212">同对角线：|Δr| = |Δc| = 7</text>
    <text x="280" y="212">不共线：先沿行、再沿列（L 形）</text>
    <text x="462" y="212">已在目标格，无需移动</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" font-weight="bold" text-anchor="middle">
    <text x="98" y="232" fill="#4a7a3a">答案：1</text>
    <text x="280" y="232" fill="#d6a040">答案：2</text>
    <text x="462" y="232" fill="#446688">答案：0</text>
  </g>

  <text x="280" y="264" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">先判同格 → 再判共线（行 / 列 / 对角线）→ 其余两步 L 形必达</text>
</svg>
