<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 284" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="284" fill="#fafafa"/>

  <g filter="url(#rough2)" font-size="11" fill="#444" font-weight="bold" text-anchor="middle">
    <text x="98" y="44">示例 1：(8,1) → (1,8)</text>
    <text x="280" y="44">示例 2：(4,2) → (1,3)</text>
    <text x="462" y="44">示例 3：source == target</text>
  </g>

  <g filter="url(#rough2)">
