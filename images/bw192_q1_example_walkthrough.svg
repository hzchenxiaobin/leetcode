  <rect x="246" y="107" width="17" height="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="254.5" y="120" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">M</text>
