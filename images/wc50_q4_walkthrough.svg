<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="660" height="432" fill="#fafafa"/>

  <text x="330" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：cards = [4, 1, 8, 7] → (8 − 4) × (7 − 1) = 24</text>

  <!-- 左侧流程轴 -->
  <path d="M 34 92 L 34 300" stroke="#bbb" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 0 层 -->
  <text x="130" y="92" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始：4 张牌</text>
  <rect x="150" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="172" y="99" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">4</text>
  <rect x="206" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="228" y="99" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="262" y="76" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="284" y="99" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">8</text>
  <rect x="318" y="76" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="340" y="99" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">7</text>
  <text x="386" y="99" font-size="10" fill="#b85450" filter="url(#rough2)">← 选中 8 与 4（不相邻也能选）</text>

  <!-- 第 1 层 -->
  <text x="130" y="164" text-anchor="end" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 8 − 4 = 4</text>
  <text x="130" y="180" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">剩 3 张</text>
  <rect x="150" y="148" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="172" y="171" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="206" y="148" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="228" y="171" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">7</text>
  <rect x="292" y="148" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="314" y="171" text-anchor="middle" font-size="14" fill="#8a5a10" filter="url(#rough2)">4</text>
  <text x="350" y="171" font-size="10" fill="#777" filter="url(#rough2)">新牌：6 个候选 12 / −4 / 4 / 32 / 0.5 / 2</text>

  <!-- 第 2 层 -->
  <text x="130" y="230" text-anchor="end" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 7 − 1 = 6</text>
  <text x="130" y="246" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">剩 2 张</text>
  <rect x="150" y="214" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="172" y="237" text-anchor="middle" font-size="14" fill="#8a5a10" filter="url(#rough2)">4</text>
  <rect x="206" y="214" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="228" y="237" text-anchor="middle" font-size="14" fill="#8a5a10" filter="url(#rough2)">6</text>
  <text x="266" y="237" font-size="10" fill="#b85450" filter="url(#rough2)">注意是 b − a：若只算 a − b 得 −6，此处就断了</text>

  <!-- 第 3 层 -->
  <text x="130" y="298" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 4 × 6 = 24</text>
  <text x="130" y="314" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">剩 1 张</text>
  <rect x="150" y="282" width="62" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="181" y="306" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">24 ✓</text>
  <text x="228" y="306" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">|24 − 24| &lt; ε → 返回 true，整棵搜索树立刻剪掉</text>

  <!-- 底部说明 -->
  <rect x="24" y="344" width="296" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="38" y="366" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么减法/除法必须双向</text>
  <text x="38" y="386" font-size="10" fill="#555" filter="url(#rough2)">只写 a − b 会漏掉 b − a；本例第 ③ 步</text>
  <text x="38" y="403" font-size="10" fill="#555" filter="url(#rough2)">正好需要 7 − 1 = 6，反向的 1 − 7 = −6 无用</text>

  <rect x="340" y="344" width="296" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="354" y="366" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">搜索规模：每层「对数 × 运算数」</text>
  <text x="354" y="386" font-size="10" fill="#555" filter="url(#rough2)">36（4 张）→ 18（3 张）→ 6（2 张）</text>
  <text x="354" y="403" font-size="10" fill="#555" filter="url(#rough2)">共 3888 个叶子，回溯栈深度只有 3 层</text>
</svg>
