<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">三个官方示例：最近点、距离平方与判定</text>

  <!-- 例 1：相切 -->
  <g filter="url(#rough2)">
    <rect x="220" y="60" width="150" height="90" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="160" cy="105" r="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="160" cy="105" r="3.5" fill="#b85450"/>
    <circle cx="220" cy="105" r="4" fill="#d6a040"/>
    <line x1="160" y1="105" x2="220" y2="105" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <g font-size="11.5" filter="url(#rough2)">
    <text x="60" y="80" fill="#333">例1：r=1, C=(0,0)</text>
    <text x="60" y="98" fill="#333">矩形 (1,−1)~(3,1)</text>
    <text x="60" y="116" fill="#d6a040">最近点 (1,0)，d²=1 ≤ 1</text>
    <text x="60" y="134" fill="#4a7a3a">相切也算重叠 → true</text>
  </g>

  <!-- 例 2：分离 -->
  <g filter="url(#rough2)">
    <rect x="330" y="180" width="60" height="56" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="130" cy="255" r="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="130" cy="255" r="3.5" fill="#b85450"/>
    <circle cx="330" cy="230" r="3.5" fill="#d6a040"/>
    <line x1="130" y1="255" x2="330" y2="230" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <g font-size="11.5" filter="url(#rough2)">
    <text x="60" y="196" fill="#333">例2：r=1, C=(1,1)</text>
    <text x="60" y="214" fill="#333">矩形 (1,−3)~(2,−1)</text>
    <text x="60" y="232" fill="#d6a040">最近点 (1,−1)，d²=4 &gt; 1</text>
    <text x="60" y="250" fill="#b85450">够不着 → false</text>
  </g>

  <!-- 例 3：圆心在边界 -->
  <g filter="url(#rough2)">
    <rect x="330" y="246" width="0" height="0" fill="none"/>
    <rect x="240" y="238" width="120" height="60" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="240" cy="298" r="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="240" cy="298" r="3.5" fill="#b85450"/>
  </g>
  <g font-size="11.5" filter="url(#rough2)">
    <text x="410" y="266" fill="#333">例3：r=1, C=(0,0)</text>
    <text x="410" y="284" fill="#333">矩形 (−1,0)~(0,1)</text>
    <text x="410" y="302" fill="#d6a040">圆心就在矩形边上</text>
  </g>
  <text x="300" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">d²=0 ≤ 1 → true（clamp 后 dx=dy=0）</text>
</svg>
