<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="270" y="20" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">一次线性扫描：need 计数器 + 续字节校验</text>
  </g>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <ellipse cx="200" cy="38" rx="46" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="200" y="43" text-anchor="middle" font-size="11" fill="#3a5a30">开始</text>
    <path d="M 200 54 L 200 62" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- i = 0 -->
  <g filter="url(#rough2)">
    <rect x="145" y="62" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="200" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">i = 0</text>
    <path d="M 200 92 L 200 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- D1: i < n -->
  <g filter="url(#rough2)">
    <polygon points="200,106 275,132 200,158 125,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="137" text-anchor="middle" font-size="11" fill="#8a6a20">i &lt; n ?</text>
    <path d="M 200 158 L 200 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 275 132 L 392 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="296" y="124" font-size="9.5" fill="#4a7a3a">否（扫完）</text>
  </g>

  <!-- b = data[i] & 0xFF -->
  <g filter="url(#rough2)">
    <rect x="108" y="172" width="184" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="200" y="192" text-anchor="middle" font-size="11" fill="#3a4a66">b = data[i] &amp; 0xFF</text>
    <path d="M 200 202 L 200 214" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- D2: 前缀合法 -->
  <g filter="url(#rough2)">
    <polygon points="200,215 290,242 200,269 110,242" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="240" text-anchor="middle" font-size="10.5" fill="#8a6a20">前缀 ⇒ need ∈ 0..3 ?</text>
    <text x="200" y="254" text-anchor="middle" font-size="9" fill="#999">（否则非法首字节）</text>
    <path d="M 200 269 L 200 282" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 290 242 L 386 242" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="296" y="234" font-size="9.5" fill="#b85450">非法首字节</text>
  </g>

  <!-- D3: i + need < n -->
  <g filter="url(#rough2)">
    <polygon points="200,283 295,310 200,337 105,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="315" text-anchor="middle" font-size="11" fill="#8a6a20">i + need &lt; n ?</text>
    <path d="M 200 337 L 200 350" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 295 310 L 386 310" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="300" y="302" font-size="9.5" fill="#b85450">越界</text>
  </g>

  <!-- 校验续字节 -->
  <g filter="url(#rough2)">
    <rect x="75" y="350" width="250" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="200" y="368" text-anchor="middle" font-size="10.5" fill="#3a4a66">校验 need 个续字节</text>
    <text x="200" y="383" text-anchor="middle" font-size="9.5" fill="#555">每个都满足 (b &gt;&gt; 6) == 0b10</text>
    <path d="M 200 390 L 200 402" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 325 370 L 386 370" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="330" y="362" font-size="9.5" fill="#b85450">有非 10 开头</text>
  </g>

  <!-- i += need + 1 -->
  <g filter="url(#rough2)">
    <rect x="115" y="402" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="200" y="422" text-anchor="middle" font-size="11" fill="#3a4a66">i += need + 1</text>
    <path d="M 200 432 L 200 446 L 50 446 L 50 132 L 118 132" stroke="#446688" stroke-width="1.6"
          fill="none" marker-end="url(#arr)"/>
    <text x="56" y="466" font-size="9.5" fill="#446688">下一字符：回到 i &lt; n 判定</text>
  </g>

  <!-- 出口 -->
  <g filter="url(#rough2)">
    <rect x="396" y="110" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="456" y="137" text-anchor="middle" font-size="11" fill="#3a5a30">return true</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 386 242 L 386 370" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <path d="M 386 300 L 394 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="396" y="276" width="120" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="456" y="305" text-anchor="middle" font-size="11" fill="#8c3a3a">return false</text>
  </g>

  <g filter="url(#rough2)">
    <text x="270" y="490" text-anchor="middle" font-size="10" fill="#999">循环不变量：data[0..i) 已经按唯一方式划分成若干合法字符</text>
  </g>
</svg>
