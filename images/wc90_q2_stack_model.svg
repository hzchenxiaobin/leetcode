<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 408" width="620" height="408" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="408" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">栈里存「每层已累加的分数」，遇到右括号就结算一层</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">遇到 "(" 压入 0；遇到 ")" 弹出 v，把 max(2v, 1) 加回新的栈顶</text>
  <rect x="40" y="70" width="250" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="96.5" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">"("  压入 0</text>
  <rect x="40" y="124" width="250" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="150.3" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">")"  弹出 v，回加 max(2v, 1)</text>
  <text x="40" y="196" text-anchor="start" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么是 max(2v, 1)：</text>
  <text x="40" y="218" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">v &gt; 0 说明这层里还有内容，形如 (A) → 2A；</text>
  <text x="40" y="240" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">v = 0 说明是空对 "()" → 直接记 1 分。</text>
  <rect x="330" y="300" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="320.8" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">栈底：最外层累加和</text>
  <rect x="330" y="250" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="270.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">中间层：2A 已回加</text>
  <rect x="330" y="200" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="220.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">栈顶：当前层累加</text>
  <path d="M 324 300 L 324 196" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="4 3" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 476 300 L 476 196" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="4 3" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 400 196 L 400 176" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="400" y="166" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">结算后不断向上回加</text>
  <rect x="40" y="320" width="270" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="338" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">答案 = 栈底元素；</text>
  <text x="50" y="352.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">整串扫描一次，每个括号只进出栈各一次。</text>
</svg>
