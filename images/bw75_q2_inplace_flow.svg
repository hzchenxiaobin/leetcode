<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">原地归约：从左到右覆盖，为何不丢信息</text>

  <!-- 旧数组（概念图） -->
  <text x="280" y="62" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">某轮开始：len = 5</text>
  <g filter="url(#rough2)">
    <rect x="120" y="74" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="188" y="74" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="256" y="74" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="324" y="74" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="392" y="74" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="152" y="97">a₀</text><text x="220" y="97">a₁</text><text x="288" y="97">a₂</text><text x="356" y="97">a₃</text><text x="424" y="97">a₄</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="152" y="123">i=0</text><text x="220" y="123">i=1</text><text x="288" y="123">i=2</text><text x="356" y="123">i=3</text><text x="424" y="123">i=4</text>
  </g>

  <!-- 覆盖过程 -->
  <path d="M 152 114 C 150 138, 148 144, 148 152" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="280" y="160" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">依次执行 a[i] = (a[i] + a[i+1]) % 10：</text>

  <g filter="url(#rough2)">
    <rect x="120" y="176" width="64" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="188" y="176" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="256" y="176" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="324" y="176" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="392" y="176" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="152" y="199">(a₀+a₁)</text><text x="220" y="199">a₁</text><text x="288" y="199">a₂</text><text x="356" y="199">a₃</text><text x="424" y="199">a₄</text>
  </g>
  <text x="120" y="228" font-size="12" fill="#b85450" filter="url(#rough2)">写 a[0] 用掉 a[0]、a[1]，但 a[1] 还在 → 继续用 a[1] 算 a[1]</text>

  <g filter="url(#rough2)">
    <rect x="120" y="240" width="64" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="188" y="240" width="64" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="256" y="240" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="324" y="240" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="392" y="240" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="152" y="263">(a₀+a₁)</text><text x="220" y="263">(a₁+a₂)</text><text x="288" y="263">a₂</text><text x="356" y="263">a₃</text><text x="424" y="263">a₄</text>
  </g>

  <text x="280" y="300" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">写 a[i] 时 a[i+1] 尚未被覆盖（i 从小到大）→ 信息恰好不丢</text>

  <rect x="80" y="314" width="400" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="339" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">一轮后前 len−1 格即新数组，O(1) 额外空间</text>
</svg>
