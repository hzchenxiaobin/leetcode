<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心数据结构：真值哈希表 + 按菜系分组的有序容器</text>
  <path d="M 230 44 Q 450 52 670 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左列：初始化输入 -->
  <text x="142" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">初始化输入（food · cuisine · rating）</text>
  <rect x="40" y="78" width="204" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="142" y="97" text-anchor="middle" font-size="11.5" fill="#333">kimchi · korean · 9</text>
  <rect x="40" y="114" width="204" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="142" y="133" text-anchor="middle" font-size="11.5" fill="#333">miso · japanese · 12</text>
  <rect x="40" y="150" width="204" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="142" y="169" text-anchor="middle" font-size="11.5" fill="#333">sushi · japanese · 8</text>
  <rect x="40" y="186" width="204" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="142" y="205" text-anchor="middle" font-size="11.5" fill="#333">moussaka · greek · 15</text>
  <rect x="40" y="222" width="204" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="142" y="241" text-anchor="middle" font-size="11.5" fill="#333">ramen · japanese · 14</text>
  <rect x="40" y="258" width="204" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="142" y="277" text-anchor="middle" font-size="11.5" fill="#333">bulgogi · korean · 7</text>

  <!-- 中列：两张哈希表 -->
  <rect x="290" y="70" width="210" height="150" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="395" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">foodCuisine</text>
  <text x="395" y="108" text-anchor="middle" font-size="10.5" fill="#666">食物 → 菜系</text>
  <rect x="306" y="116" width="178" height="22" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1.1" filter="url(#sk)"/>
  <text x="316" y="131" font-size="11" fill="#444">kimchi → korean</text>
  <rect x="306" y="142" width="178" height="22" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1.1" filter="url(#sk)"/>
  <text x="316" y="157" font-size="11" fill="#444">sushi → japanese</text>
  <rect x="306" y="168" width="178" height="22" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1.1" filter="url(#sk)"/>
  <text x="316" y="183" font-size="11" fill="#444">ramen → japanese</text>
  <text x="395" y="212" text-anchor="middle" font-size="12" fill="#888">⋯</text>

  <rect x="290" y="250" width="210" height="160" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="395" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">foodRating</text>
  <text x="395" y="288" text-anchor="middle" font-size="10.5" fill="#a07020">食物 → 当前评分（唯一真值表）</text>
  <rect x="306" y="296" width="178" height="22" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1.1" filter="url(#sk)"/>
  <text x="316" y="311" font-size="11" fill="#444">kimchi → 9</text>
  <rect x="306" y="322" width="178" height="22" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1.1" filter="url(#sk)"/>
  <text x="316" y="337" font-size="11" fill="#444">sushi → 8</text>
  <rect x="306" y="348" width="178" height="22" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1.1" filter="url(#sk)"/>
  <text x="316" y="363" font-size="11" fill="#444">ramen → 14</text>
  <text x="395" y="394" text-anchor="middle" font-size="12" fill="#888">⋯</text>

  <!-- 右列：按菜系的有序集合 -->
  <rect x="540" y="70" width="320" height="100" rx="8" fill="#f0f6fc" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="700" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">cuisineSet["korean"]</text>
  <rect x="556" y="102" width="288" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="566" y="119" font-size="11.5" font-weight="bold" fill="#8c3a36">(−9, kimchi) ★ begin()</text>
  <rect x="556" y="134" width="288" height="26" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1.1" filter="url(#sk)"/>
  <text x="566" y="151" font-size="11.5" fill="#444">(−7, bulgogi)</text>

  <rect x="540" y="186" width="320" height="126" rx="8" fill="#f0f6fc" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="700" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">cuisineSet["japanese"]</text>
  <rect x="556" y="218" width="288" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="566" y="234" font-size="11.5" font-weight="bold" fill="#8c3a36">(−14, ramen) ★ 答案</text>
  <rect x="556" y="246" width="288" height="24" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1.1" filter="url(#sk)"/>
  <text x="566" y="262" font-size="11.5" fill="#444">(−12, miso)</text>
  <rect x="556" y="274" width="288" height="24" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1.1" filter="url(#sk)"/>
  <text x="566" y="290" font-size="11.5" fill="#444">(−8, sushi)</text>

  <rect x="540" y="328" width="320" height="82" rx="8" fill="#f0f6fc" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="700" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">cuisineSet["greek"]</text>
  <rect x="556" y="360" width="288" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="566" y="376" font-size="11.5" font-weight="bold" fill="#8c3a36">(−15, moussaka) ★</text>

  <!-- 箭头：左 → 中 -->
  <path d="M 248 183 L 282 183" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="265" y="174" text-anchor="middle" font-size="10" fill="#4a8edb">建表</text>
  <!-- 箭头：中 → 右 -->
  <path d="M 504 183 L 534 183" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="519" y="174" text-anchor="middle" font-size="10" fill="#c98a2b">分组</text>

  <!-- 底部小结 -->
  <rect x="40" y="436" width="820" height="120" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="450" y="462" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">键设计：(−rating, name)，容器内升序排列</text>
  <text x="450" y="490" text-anchor="middle" font-size="12" fill="#333">−r 更小 ⟺ 评分更大 → 排最前；平局时 −r 相等 → 比第二维名字 → 字典序小者在前</text>
  <text x="450" y="518" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a36">*begin() / 堆顶 =「评分最高 + 平局字典序最小」= highestRated 的答案，O(1) 直取</text>
  <text x="450" y="542" text-anchor="middle" font-size="10.5" fill="#888">changeRating：删旧键 (−old, f) → 插新键 (−new, f)，O(log n)</text>
</svg>
