<svg xmlns="http://www.w3.org/2000/svg" width="660" height="490" viewBox="0 0 660 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="79" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="490" fill="#fdfcf7"/>
  <text x="330" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：幸存者 = 天际线（前缀最大值），数出答案 3</text>
  <path d="M 150 33 Q 330 40 510 33" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 天际线标签 -->
  <text x="430" y="176" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a8edb">cur = 前缀最大值（天际线）</text>

  <!-- 柱状图：值即高度 -->
  <path d="M 110 296 L 550 296" stroke="#999999" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="122" y="208" width="56" height="88" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="150" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">4</text>
  <g filter="url(#sk)">
    <ellipse cx="150" cy="194" rx="10" ry="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="150" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓</text>

  <g filter="url(#sk)">
    <rect x="212" y="252" width="56" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
  <text x="240" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#777">2</text>
  <g filter="url(#sk)">
    <ellipse cx="240" cy="238" rx="10" ry="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="240" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>

  <g filter="url(#sk)">
    <rect x="302" y="186" width="56" height="110" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="330" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">5</text>
  <g filter="url(#sk)">
    <ellipse cx="330" cy="172" rx="10" ry="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="330" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓</text>

  <g filter="url(#sk)">
    <rect x="392" y="230" width="56" height="66" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
  <text x="420" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#777">3</text>
  <g filter="url(#sk)">
    <ellipse cx="420" cy="216" rx="10" ry="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="420" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>

  <g filter="url(#sk)">
    <rect x="482" y="186" width="56" height="110" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="510" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">5</text>
  <g filter="url(#sk)">
    <ellipse cx="510" cy="172" rx="10" ry="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="510" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓</text>

  <!-- 天际线（前缀最大值水位） -->
  <path d="M 122 208 L 302 208 L 302 186 L 538 186" stroke="#4a8edb" stroke-width="2.2" fill="none" filter="url(#sk)"/>

  <!-- 下标 -->
  <text x="150" y="312" text-anchor="middle" font-size="10.5" fill="#888">i = 0</text>
  <text x="240" y="312" text-anchor="middle" font-size="10.5" fill="#888">i = 1</text>
  <text x="330" y="312" text-anchor="middle" font-size="10.5" fill="#888">i = 2</text>
  <text x="420" y="312" text-anchor="middle" font-size="10.5" fill="#888">i = 3</text>
  <text x="510" y="312" text-anchor="middle" font-size="10.5" fill="#888">i = 4</text>

  <!-- 划分括号 -->
  <path d="M 122 322 L 122 330 M 122 326 L 178 326 M 178 322 L 178 330" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="150" y="346" text-anchor="middle" font-size="11" fill="#444">块1 [4] → 4</text>
  <path d="M 212 322 L 212 330 M 212 326 L 360 326 M 360 322 L 360 330" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="286" y="346" text-anchor="middle" font-size="11" fill="#444">块2 [2,5] → 5</text>
  <path d="M 392 322 L 392 330 M 392 326 L 538 326 M 538 322 L 538 330" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="465" y="346" text-anchor="middle" font-size="11" fill="#444">块3 [3,5] → 5</text>

  <!-- 逐元素判定 chips -->
  <g filter="url(#sk)">
    <rect x="19" y="362" width="118" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="78" y="381" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">4 ≥ 0 ✓</text>
  <text x="78" y="398" text-anchor="middle" font-size="9.5" fill="#555">ans = 1，单独成块</text>

  <g filter="url(#sk)">
    <rect x="145" y="362" width="118" height="42" rx="8" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4"/>
  </g>
  <text x="204" y="381" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">2 &lt; 4 ✗</text>
  <text x="204" y="398" text-anchor="middle" font-size="9.5" fill="#888">被左块吸收</text>

  <g filter="url(#sk)">
    <rect x="271" y="362" width="118" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="330" y="381" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">5 ≥ 4 ✓</text>
  <text x="330" y="398" text-anchor="middle" font-size="9.5" fill="#555">ans = 2，单独成块</text>

  <g filter="url(#sk)">
    <rect x="397" y="362" width="118" height="42" rx="8" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4"/>
  </g>
  <text x="456" y="381" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">3 &lt; 5 ✗</text>
  <text x="456" y="398" text-anchor="middle" font-size="9.5" fill="#888">被左块吸收</text>

  <g filter="url(#sk)">
    <rect x="523" y="362" width="118" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="582" y="381" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">5 ≥ 5 ✓</text>
  <text x="582" y="398" text-anchor="middle" font-size="9.5" fill="#555">ans = 3，相等也算</text>

  <!-- 底部注记 -->
  <g filter="url(#sk)">
    <rect x="40" y="418" width="580" height="64" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="330" y="438" text-anchor="middle" font-size="11.5" fill="#7a5415">cur = 左侧历史最大值（蓝线）；x ≥ cur ⇒ 幸存（✓），否则并入左块（✗）</text>
  <text x="330" y="456" text-anchor="middle" font-size="11.5" fill="#7a5415">cur 初值 0 视作 −∞（值域 ≥ 1）⇒ 首元素必幸存</text>
  <text x="330" y="474" text-anchor="middle" font-size="11.5" fill="#7a5415">末尾 5 = cur：非递减允许相等 ⇒ 用 ≥ 判定照样幸存 → [4,5,5]，答案 3</text>
</svg>
