<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="940" height="600" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">每人恰有一个 favorite：出度 = 1 → 内向基环森林</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <g filter="url(#sk)"><circle cx="700" cy="64" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="714" y="68" font-size="11" fill="#555">环上节点</text>
  <g filter="url(#sk)"><circle cx="800" cy="64" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="814" y="68" font-size="11" fill="#555">环外（挂树）节点</text>

  <!-- ===== Panel A: long cycle component ===== -->
  <text x="250" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">分量一：长环（4-环）+ 挂树（可分叉）</text>

  <!-- cycle arrows -->
  <path d="M 170 200 Q 210 168 261 152" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 300 152 Q 350 168 400 200" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 401 221 Q 340 258 308 276" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 266 279 Q 210 256 173 224" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- tree arrows -->
  <path d="M 89 145 Q 108 165 133 192" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 89 275 Q 108 255 133 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 378 81 Q 340 98 306 127" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 460 56 Q 415 55 371 65" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- cycle nodes -->
  <g font-size="13" font-weight="bold">
    <g filter="url(#sk)"><circle cx="150" cy="210" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="150" y="215" text-anchor="middle" fill="#8a6a1a">1</text>
    <g filter="url(#sk)"><circle cx="285" cy="140" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="285" y="145" text-anchor="middle" fill="#8a6a1a">3</text>
    <g filter="url(#sk)"><circle cx="420" cy="210" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="420" y="215" text-anchor="middle" fill="#8a6a1a">5</text>
    <g filter="url(#sk)"><circle cx="285" cy="290" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="285" y="295" text-anchor="middle" fill="#8a6a1a">7</text>
  </g>

  <!-- tree nodes -->
  <g font-size="12" font-weight="bold">
    <g filter="url(#sk)"><circle cx="75" cy="130" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="75" y="135" text-anchor="middle" fill="#33507a">0</text>
    <g filter="url(#sk)"><circle cx="75" cy="290" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="75" y="295" text-anchor="middle" fill="#33507a">2</text>
    <g filter="url(#sk)"><circle cx="395" cy="70" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="395" y="75" text-anchor="middle" fill="#33507a">4</text>
    <g filter="url(#sk)"><circle cx="480" cy="52" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="480" y="57" text-anchor="middle" fill="#33507a">6</text>
  </g>

  <text x="250" y="352" text-anchor="middle" font-size="11" fill="#888">分叉：0、2 都喜欢 1（同一人可被多人喜欢，挂树不一定是链）</text>
  <text x="250" y="372" text-anchor="middle" font-size="11" fill="#b85450">环序 1→3→5→7→1，挂树全部无缘餐桌（见下一张图）</text>

  <!-- ===== Panel B: 2-cycle component ===== -->
  <text x="715" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">分量二：二元环 + 两侧挂链</text>

  <!-- pair arrows -->
  <path d="M 661 162 Q 720 148 779 162" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 779 178 Q 720 192 661 178" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- chain arrows -->
  <path d="M 574 236 Q 596 214 622 188" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 514 301 Q 527 284 543 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 467 359 Q 477 330 485 295" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 866 236 Q 844 214 818 188" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 887 300 Q 880 287 878 275" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- pair nodes -->
  <g font-size="13" font-weight="bold">
    <g filter="url(#sk)"><circle cx="640" cy="170" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="640" y="175" text-anchor="middle" fill="#8a6a1a">8</text>
    <g filter="url(#sk)"><circle cx="800" cy="170" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="800" y="175" text-anchor="middle" fill="#8a6a1a">9</text>
  </g>
  <text x="720" y="216" text-anchor="middle" font-size="11" fill="#888">8 ↔ 9 互为 favorite</text>

  <!-- chain nodes -->
  <g font-size="12" font-weight="bold">
    <g filter="url(#sk)"><circle cx="560" cy="250" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="560" y="255" text-anchor="middle" fill="#33507a">10</text>
    <g filter="url(#sk)"><circle cx="500" cy="315" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="500" y="320" text-anchor="middle" fill="#33507a">11</text>
    <g filter="url(#sk)"><circle cx="455" cy="375" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="455" y="380" text-anchor="middle" fill="#33507a">12</text>
    <g filter="url(#sk)"><circle cx="880" cy="250" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="880" y="255" text-anchor="middle" fill="#33507a">13</text>
    <g filter="url(#sk)"><circle cx="890" cy="320" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="890" y="325" text-anchor="middle" fill="#33507a">14</text>
  </g>

  <text x="715" y="432" text-anchor="middle" font-size="11" fill="#888">挂链：链上每人喜欢的都是链中下一个（朝环方向），如 12→11→10→8</text>

  <!-- ===== insight box ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="460" width="840" height="112" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="486" font-size="13" font-weight="bold" fill="#2b2b2b">关键性质（ρ 形分量）</text>
  <text x="80" y="510" font-size="11.5" fill="#444">① 每人出度 = 1 → 每个连通分量恰含一个环，环上节点挂若干树（入度可多个）</text>
  <text x="80" y="534" font-size="11.5" fill="#444">② 从任意节点沿 favorite 走必入环 → 参会集合对 favorite 封闭，必须整环整环地包含</text>
  <text x="80" y="558" font-size="11.5" fill="#7a2828">→ 答案完全由「环长」与「环上挂的最长链」决定，树的其他部分无关</text>
</svg>
