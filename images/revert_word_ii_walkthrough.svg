<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：word ＝ "abcbabcd"，k ＝ 2，n ＝ 8</text>
  <path d="M 190 36 Q 330 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- z array strip -->
  <text x="40" y="73" font-size="12" fill="#555" filter="url(#rough2)">Z 数组（橙框 ＝ 被查询格点）：</text>
  <g filter="url(#rough2)">
    <rect x="250" y="54" width="44" height="22" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="294" y="54" width="44" height="22" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="338" y="54" width="44" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="382" y="54" width="44" height="22" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="426" y="54" width="44" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="470" y="54" width="44" height="22" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="514" y="54" width="44" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="558" y="54" width="44" height="22" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="250" y="76" width="44" height="24" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="294" y="76" width="44" height="24" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="338" y="76" width="44" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="382" y="76" width="44" height="24" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="426" y="76" width="44" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="470" y="76" width="44" height="24" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="514" y="76" width="44" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="558" y="76" width="44" height="24" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="272" y="69" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i</text>
  <text x="316" y="69" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="360" y="69" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="404" y="69" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="448" y="69" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="492" y="69" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="536" y="69" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="580" y="69" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="624" y="69" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="272" y="93" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">z[i]</text>
  <text x="316" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="360" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="404" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="448" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="492" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="536" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="580" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="624" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- decision table -->
  <g filter="url(#rough2)">
    <rect x="40" y="110" width="35" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="75" y="110" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="115" y="110" width="120" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="235" y="110" width="120" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="355" y="110" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="405" y="110" width="45" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="450" y="110" width="170" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="57" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">t</text>
  <text x="95" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">i＝2t</text>
  <text x="175" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">后缀 w[i:]</text>
  <text x="295" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">前缀 w[:n−i]</text>
  <text x="380" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">z[i]</text>
  <text x="427" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">n−i</text>
  <text x="535" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">判定</text>

  <!-- row 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="140" width="35" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="75" y="140" width="40" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="115" y="140" width="120" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="235" y="140" width="120" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="355" y="140" width="50" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="405" y="140" width="45" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="450" y="140" width="170" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="57" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="95" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="175" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"cbabcd"</text>
  <text x="295" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"abcbab"</text>
  <text x="380" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="427" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="535" y="163" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 首位 c ≠ a</text>

  <!-- row 2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="176" width="35" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="75" y="176" width="40" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="115" y="176" width="120" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="235" y="176" width="120" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="355" y="176" width="50" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="405" y="176" width="45" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="450" y="176" width="170" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="57" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="95" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="175" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"abcd"</text>
  <text x="295" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"abcb"</text>
  <text x="380" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="427" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="535" y="199" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 前 3 位同，第 4 位 d ≠ b</text>

  <!-- row 3 -->
  <g filter="url(#rough2)">
    <rect x="40" y="212" width="35" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="75" y="212" width="40" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="115" y="212" width="120" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="235" y="212" width="120" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="355" y="212" width="50" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="405" y="212" width="45" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="450" y="212" width="170" height="36" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="57" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="95" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="175" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"cd"</text>
  <text x="295" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"ab"</text>
  <text x="380" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="427" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="535" y="235" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ c ≠ a</text>

  <!-- row 4 (hit) -->
  <g filter="url(#rough2)">
    <rect x="40" y="248" width="35" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="75" y="248" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="115" y="248" width="120" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="235" y="248" width="120" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="355" y="248" width="50" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="405" y="248" width="45" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="450" y="248" width="170" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="57" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="95" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="175" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">（空）</text>
  <text x="295" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <text x="380" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <text x="427" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="535" y="271" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">✓ i ≥ n 删光重建 → 返回 4</text>

  <!-- lesson box -->
  <rect x="40" y="300" width="580" height="48" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a35" filter="url(#rough2)">第 2 轮 z[4] ＝ 3「只差一位」也判否——判据必须整段覆盖 z[i] ≥ n − i，部分匹配不算命中</text>
  <text x="330" y="339" text-anchor="middle" font-size="11.5" fill="#8f3a35" filter="url(#rough2)">相比 Q2 的逐字比较（每轮最坏 O(n)），这里 4 轮共 4 次 O(1) 查表</text>

  <!-- mini examples -->
  <rect x="40" y="364" width="288" height="88" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="184" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">abacaba，k ＝ 4</text>
  <text x="184" y="408" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">i ＝ 4 → z[4] ＝ 3 ＝ n − i ✓</text>
  <text x="184" y="428" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">t ＝ 1，1 秒即还原</text>

  <rect x="332" y="364" width="288" height="88" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="476" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">abacaba，k ＝ 3</text>
  <text x="476" y="408" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">i ＝ 3: z ＝ 0 ✗；i ＝ 6: z[6] ＝ 1 ✓</text>
  <text x="476" y="428" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">t ＝ 2（注意 i ＝ 4 不是格点）</text>
</svg>
