<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察一：不重叠 ⇒ 必有贯通刀线（分离引理）</text>
  <path d="M 200 44 Q 470 52 740 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 左列：引理 1（两矩形） ============ -->
  <text x="240" y="80" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b2b2b">引理 1：两个不重叠矩形，要么左右分，要么上下分</text>

  <!-- 情形 A：左右分 -->
  <text x="240" y="104" text-anchor="middle" font-size="11.5" fill="#888">① 列投影不交 → 竖刀</text>
  <g filter="url(#sk2)">
    <rect x="70" y="115" width="100" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="240" y="115" width="100" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="120" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a70">A</text>
  <text x="290" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a70">B</text>
  <path d="M 205 100 L 205 192" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="205" y="212" text-anchor="middle" font-size="11" fill="#b03a3a">一条贯通竖网格线分开 A、B</text>

  <!-- 情形 B：上下分 -->
  <text x="240" y="244" text-anchor="middle" font-size="11.5" fill="#888">② 行投影不交 → 横刀</text>
  <g filter="url(#sk2)">
    <rect x="70" y="255" width="270" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="70" y="343" width="270" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="205" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a2e">A</text>
  <text x="205" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a2e">B</text>
  <path d="M 55 326 L 355 326" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="205" y="416" text-anchor="middle" font-size="11" fill="#b03a3a">一条贯通横网格线分开 A、B</text>

  <!-- 左下注记 -->
  <g filter="url(#sk)">
    <rect x="40" y="432" width="400" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="62" y="458" font-size="13" font-weight="bold" fill="#7a5415">为什么必居其一？</text>
  <text x="62" y="481" font-size="11.5" fill="#444">列投影、行投影都相交 ⇒ 有公共列 × 公共行 = 公共格子</text>
  <text x="62" y="503" font-size="11.5" fill="#444">⇒ 两矩形重叠，与「不重叠」矛盾 —— 逆否即得引理 1 ∎</text>

  <!-- ============ 右列：引理 2（三矩形，骑跨情形） ============ -->
  <text x="705" y="80" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b2b2b">引理 2：三个不重叠矩形，总有一刀能分成 1 + 2</text>
  <g filter="url(#sk2)">
    <rect x="500" y="100" width="400" height="300" rx="6" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.5"/>
  </g>
  <!-- 三个矩形 -->
  <g filter="url(#sk2)">
    <rect x="522" y="125" width="112" height="66" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="766" y="125" width="112" height="66" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="622" y="258" width="168" height="92" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="578" y="163" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a70">A</text>
  <text x="822" y="163" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a70">B</text>
  <text x="706" y="309" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">C</text>

  <!-- ✗ 竖刀被骑跨（下半段，红） -->
  <path d="M 700 220 L 700 396" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <text x="700" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">✗</text>
  <text x="700" y="392" text-anchor="middle" font-size="10.5" fill="#b03a3a">这半段被 C 骑跨</text>

  <!-- ✓ 第一刀：横刀（绿实线） -->
  <path d="M 500 220 L 900 220" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)">
    <circle cx="560" cy="220" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="560" y="224.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a2e">①</text>
  <text x="902" y="212" text-anchor="end" font-size="11" fill="#3a5a2e">第一刀（横）：{A,B} | {C}</text>

  <!-- ✓ 第二刀：上一侧竖刀（绿虚线） -->
  <path d="M 700 100 L 700 220" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)">
    <circle cx="700" cy="160" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="700" y="164.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a2e">②</text>
  <text x="688" y="94" text-anchor="middle" font-size="10.5" fill="#3a5a2e">这半段可用</text>

  <!-- 右下结论 -->
  <g filter="url(#sk)">
    <rect x="480" y="432" width="440" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="502" y="458" font-size="13" font-weight="bold" fill="#3a5a2e">两刀 ⇒ 六种形态：先一刀分 1 + 2，再在 2 那侧补一刀</text>
  <text x="502" y="481" font-size="11.5" fill="#444">✗ 想用竖刀直接分开 A、B 会被 C 挡住；换成 ① 横刀即可</text>
  <text x="502" y="503" font-size="11.5" fill="#444">刀线不穿任何矩形内部 ⇒ 三段两两不交自动成立（分类证明见 §5）</text>
</svg>
