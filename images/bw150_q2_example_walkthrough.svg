<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：squares = [[0,0,2], [1,1,1]]，答案 7/6 ≈ 1.16667</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">总面积 4 + 1 = 5，目标 half = 2.5；在 y ∈ [1,2] 段解方程</text>

  <line x1="70" y1="290" x2="250" y2="290" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="70" y1="290" x2="70" y2="90" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9.5" fill="#999">
    <text x="80" y="306" filter="url(#rough2)">1</text>
    <text x="150" y="306" filter="url(#rough2)">2</text>
    <text x="58" y="230" filter="url(#rough2)">1</text>
    <text x="58" y="160" filter="url(#rough2)">2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="150" width="140" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
    <rect x="140" y="220" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>
  </g>
  <text x="140" y="184" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">红色：[0,0] 边长 2</text>
  <text x="175" y="260" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">蓝色：边长 1</text>
  <line x1="60" y1="220" x2="260" y2="220" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="264" y="216" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">y = 1</text>
  <line x1="60" y1="185" x2="260" y2="185" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="182" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">y* ≈ 1.1667</text>

  <line x1="330" y1="290" x2="570" y2="290" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="330" y1="290" x2="330" y2="110" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="576" y="294" font-size="9.5" fill="#999" filter="url(#rough2)">y</text>
  <text x="316" y="106" font-size="9.5" fill="#999" filter="url(#rough2)">A</text>

  <path d="M 330 290 L 400 240 L 470 170 L 540 170" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <line x1="330" y1="205" x2="570" y2="205" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="572" y="203" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">2.5</text>
  <circle cx="436" cy="205" r="4" fill="#b85450" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="9.5" fill="#555">
    <text x="336" y="308" filter="url(#rough2)">0</text>
    <text x="396" y="308" filter="url(#rough2)">1</text>
    <text x="466" y="308" filter="url(#rough2)">2</text>
    <text x="352" y="228" filter="url(#rough2)">斜率 2</text>
    <text x="420" y="186" filter="url(#rough2)">斜率 3</text>
    <text x="500" y="196" filter="url(#rough2)">平台</text>
  </g>

  <rect x="70" y="322" width="250" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="84" y="341" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">分段写出 A(y)</text>
  <text x="84" y="358" font-size="10" fill="#555" filter="url(#rough2)">y∈[0,1]：A = 2y；y∈[1,2]：A = 2y + (y−1) = 3y − 1</text>

  <rect x="336" y="322" width="250" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="350" y="341" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">解 3y − 1 = 2.5</text>
  <text x="350" y="358" font-size="10" fill="#3a5a30" filter="url(#rough2)">y = 7/6 ≈ 1.16667（与题面输出一致）</text>

  <text x="310" y="378" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">注意 y = 1 时线下面积只有 2 &lt; 2.5，所以答案必定落在 y &gt; 1 的区间</text>
</svg>
