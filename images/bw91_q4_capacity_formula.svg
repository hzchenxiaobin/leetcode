<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">一段的结构与容量公式</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每段 = 内容字符 + 结尾 "&lt;a/b&gt;"，总长恰为 limit（最后一段 ≤ limit）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="70" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="268" y="70" width="120" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <text x="160" y="98" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">内容：第 i 段正文</text>
  <text x="328" y="98" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">&lt;i/k&gt;</text>
  <path d="M 60 126 L 260 126" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 268 126 L 388 126" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="142" text-anchor="middle" font-size="10.5" fill="#446688">cap(i) 个字符</text>
  <text x="328" y="142" text-anchor="middle" font-size="10.5" fill="#d6a040">digits(i) + digits(k) + 3 个字符</text>

  <rect x="60" y="160" width="440" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">cap(i) = limit − digits(i) − digits(k) − 3</text>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#555">digits(·) 为十进制位数；3 是 "&lt;"、"/"、"&gt;" 三个固定字符</text>

  <rect x="60" y="238" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">total(k) = k·(limit − digits(k) − 3) − D(k)</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#555">D(k) = Σ digits(i)（i = 1..k）：1 位数 9 个、2 位数 90 个、…</text>

  <rect x="60" y="314" width="210" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="165" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">可行条件</text>
  <text x="165" y="356" text-anchor="middle" font-size="10.5" fill="#555">total(k) ≥ m 且 cap(k) ≥ 1</text>

  <rect x="290" y="314" width="210" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="395" y="336" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">构造方式</text>
  <text x="395" y="356" text-anchor="middle" font-size="10.5" fill="#555">贪心：每段尽量装满，最后一段装剩余</text>
</svg>
