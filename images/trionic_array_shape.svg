<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="103" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/></marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b5e8e"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三段式数组：严格增 → 严格减 → 严格增</text>
  <path d="M 200 42 Q 320 50 440 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 三个阶段底色区 -->
  <g filter="url(#sk)">
    <rect x="80" y="110" width="190" height="205" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2" rx="6"/>
    <rect x="270" y="110" width="160" height="205" fill="#fff6df" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <rect x="430" y="110" width="130" height="205" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" rx="6"/>
  </g>
  <text x="175" y="131" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">① 严格递增</text>
  <text x="350" y="131" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10">② 严格递减</text>
  <text x="495" y="131" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">③ 严格递增</text>

  <!-- 峰顶/谷底标注 -->
  <text x="270" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">p = 2（峰顶）</text>
  <path d="M 270 100 L 270 148" stroke="#b03a3a" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="430" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5e8e">q = 4（谷底）</text>
  <path d="M 430 292 L 430 268" stroke="#2b5e8e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>

  <!-- 折线与数据点 -->
  <g filter="url(#sk)">
    <polyline points="110,288 190,224 270,160 350,192 430,256 510,128" fill="none" stroke="#3a3a3a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="110" cy="288" r="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
    <circle cx="190" cy="224" r="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
    <circle cx="270" cy="160" r="7" fill="#b85450" stroke="#8a3a36" stroke-width="1.8"/>
    <circle cx="350" cy="192" r="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
    <circle cx="430" cy="256" r="7" fill="#4a8edb" stroke="#2b5e8e" stroke-width="1.8"/>
    <circle cx="510" cy="128" r="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
  </g>

  <!-- 数值标签 -->
  <g font-size="14" font-weight="bold" fill="#444">
    <text x="98" y="292" text-anchor="end">1</text>
    <text x="182" y="220" text-anchor="end">3</text>
    <text x="284" y="164" fill="#b03a3a">5</text>
    <text x="362" y="190">4</text>
    <text x="446" y="264" fill="#2b5e8e">2</text>
    <text x="524" y="132">6</text>
  </g>

  <!-- 下标 -->
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="88" y="338" text-anchor="end" fill="#999">i：</text>
    <text x="110" y="338">0</text>
    <text x="190" y="338">1</text>
    <text x="270" y="338">2</text>
    <text x="350" y="338">3</text>
    <text x="430" y="338">4</text>
    <text x="510" y="338">5</text>
  </g>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="352" width="520" height="36" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">要求 0 &lt; p &lt; q &lt; n−1：三段各含至少 2 个元素，p、q 为共享端点</text>
</svg>
