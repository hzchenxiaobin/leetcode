<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    流程：一趟扫描同时判定两个方向
  </text>

  <!-- 排序框 -->
  <rect x="140" y="62" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="89" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">
    a ← sorted(s1)，b ← sorted(s2)
  </text>

  <path d="M 260 106 L 260 130" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i 初始化 -->
  <rect x="192" y="132" width="136" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">
    i = 0，双标志 = true
  </text>

  <path d="M 260 164 L 260 188" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形比较 -->
  <polygon points="260,190 348,226 260,262 172,226" fill="#fff8e1" stroke="#d6a040"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    比较 a[i] 与 b[i]
  </text>
  <text x="260" y="240" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">三种结果</text>

  <!-- 左：a < b -->
  <path d="M 172 226 L 110 226" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="216" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">a[i] &lt; b[i]</text>
  <rect x="16" y="210" width="94" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="63" y="231" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">s1压不住→F1</text>

  <!-- 右：a > b -->
  <path d="M 348 226 L 410 226" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="216" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">a[i] &gt; b[i]</text>
  <rect x="412" y="210" width="94" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="459" y="231" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s2压不住→F2</text>

  <!-- 中下：相等 -->
  <path d="M 260 262 L 260 286" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">相等：两个方向都保住</text>

  <!-- 汇合 i++ -->
  <rect x="192" y="288" width="136" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">i++，回到比较</text>
  <path d="M 110 244 C 110 290, 160 300, 188 303" stroke="#b85450" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <path d="M 412 244 C 412 290, 360 300, 332 303" stroke="#446688" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="90" y="330" width="340" height="0" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="322" width="400" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">
    扫描完返回 F1 或 F2 仍为 true？——即 answer
  </text>
</svg>
