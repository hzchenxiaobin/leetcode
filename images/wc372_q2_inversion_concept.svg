<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：每对（在前 1, 在后 0）恰好贡献一步交换</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 面板① 逆序对弧线图 -->
  <g filter="url(#sk)"><rect x="36" y="54" width="300" height="232" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="52" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">① 逆序对：黑球在白球前面</text>

  <!-- s = 10110 格子 -->
  <g filter="url(#sk)"><rect x="56" y="92" width="36" height="36" rx="4" fill="#5a6478" stroke="#3a4256" stroke-width="1.6"/></g>
  <text x="74" y="115" text-anchor="middle" font-size="15" fill="#fdfcf7">1</text>
  <g filter="url(#sk)"><rect x="92" y="92" width="36" height="36" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="110" y="115" text-anchor="middle" font-size="15" fill="#2e6e2e">0</text>
  <g filter="url(#sk)"><rect x="128" y="92" width="36" height="36" rx="4" fill="#5a6478" stroke="#3a4256" stroke-width="1.6"/></g>
  <text x="146" y="115" text-anchor="middle" font-size="15" fill="#fdfcf7">1</text>
  <g filter="url(#sk)"><rect x="164" y="92" width="36" height="36" rx="4" fill="#5a6478" stroke="#3a4256" stroke-width="1.6"/></g>
  <text x="182" y="115" text-anchor="middle" font-size="15" fill="#fdfcf7">1</text>
  <g filter="url(#sk)"><rect x="200" y="92" width="36" height="36" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="218" y="115" text-anchor="middle" font-size="15" fill="#2e6e2e">0</text>

  <!-- 下标 -->
  <text x="74" y="148" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="110" y="148" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="146" y="148" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="182" y="148" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="218" y="148" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- 逆序对弧线：从下方绕过，(0,1) (0,4) (2,4) (3,4) -->
  <path d="M 74 154 Q 92 176 110 154" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="92" y="176" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">+1</text>
  <path d="M 74 154 Q 146 222 218 154" stroke="#7a5415" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="146" y="204" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">+1</text>
  <path d="M 146 154 Q 182 196 218 154" stroke="#4a8edb" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="182" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a8edb">+1</text>
  <path d="M 182 154 Q 200 172 218 154" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="200" y="170" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a8e4a">+1</text>

  <text x="186" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">4 对 → 至少 4 步，且恰好 4 步</text>

  <!-- 面板② 双视角计数 -->
  <g filter="url(#sk)"><rect x="356" y="54" width="248" height="232" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="372" y="78" font-size="13" font-weight="bold" fill="#7a5415">② 双视角计数（各数一遍）</text>

  <g filter="url(#sk)"><rect x="372" y="92" width="216" height="82" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="382" y="110" font-size="12" font-weight="bold" fill="#2e6e2e">白球视角（推荐实现）</text>
  <text x="382" y="128" font-size="11" fill="#444">0@1：左边 1 个 1 → +1</text>
  <text x="382" y="145" font-size="11" fill="#444">0@4：左边 3 个 1 → +3</text>
  <text x="382" y="165" font-size="11.5" font-weight="bold" fill="#2e6e2e">ans = 1 + 3 = 4</text>

  <g filter="url(#sk)"><rect x="372" y="182" width="216" height="82" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="382" y="200" font-size="12" font-weight="bold" fill="#2b6e9e">黑球视角（对称等价）</text>
  <text x="382" y="218" font-size="11" fill="#444">1@0：右边 2 个 0 → +2</text>
  <text x="382" y="235" font-size="11" fill="#444">1@2、1@3：各右边 1 个 0 → +1 +1</text>
  <text x="382" y="255" font-size="11.5" font-weight="bold" fill="#2b6e9e">ans = 2 + 1 + 1 = 4</text>

  <!-- 汇合箭头 -->
  <path d="M 210 268 Q 260 292 320 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 480 268 Q 430 292 370 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="60" y="312" width="520" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="320" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="#a03a36">最小步数 = D = Σ（每个 0 左边的 1 的个数）</text>
  <text x="320" y="358" text-anchor="middle" font-size="11.5" fill="#555">一次相邻交换恰消/生一个逆序对 ⇒ 每步 D 至多减 1，下界与构造在 D 处会合</text>

  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#888">看到「相邻交换 + 目标形态」就数逆序对——过程坍缩成一个数</text>
</svg>
