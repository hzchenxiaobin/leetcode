<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="38" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算（示例 1）</text>

  <text x="131" y="66" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">matrix</text>
  <text x="451" y="66" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">answer</text>

  <!-- 左矩阵：原矩阵 -->
  <rect x="50" y="78" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="78" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="78" width="54" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="50" y="120" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="120" width="54" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="120" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="50" y="162" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="162" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="162" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="77" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="131" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="185" y="104" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="77" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="131" y="146" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="185" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="77" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="131" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="185" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>

  <!-- 左矩阵列最大值 -->
  <rect x="50" y="214" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="104" y="214" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="158" y="214" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="77" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">max 7</text>
  <text x="131" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">max 8</text>
  <text x="185" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">max 9</text>

  <!-- 中间替换箭头 -->
  <path d="M 245 150 L 325 150" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="136" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">替换 −1</text>

  <!-- 右矩阵：结果，替换格橙色 -->
  <rect x="350" y="78" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="404" y="78" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="458" y="78" width="54" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="120" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="404" y="120" width="54" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="458" y="120" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="162" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="404" y="162" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="458" y="162" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="377" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="431" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="485" y="104" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="377" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="431" y="146" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="485" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="377" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="431" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="485" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>

  <!-- 右矩阵下方对勾说明 -->
  <text x="451" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">所有 −1 均被替换</text>

  <!-- 底部替换记录 -->
  <rect x="150" y="280" width="280" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="304" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">替换记录</text>
  <text x="290" y="328" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0][2] : −1 → 9（列 2 的最大值）</text>
  <text x="290" y="352" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1][1] : −1 → 8（列 1 的最大值）</text>
</svg>
