<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">判等三步走：计数统计 → 逐一抵消 → 全部归零</text>

  <!-- 步骤 1 -->
  <rect x="40" y="55" width="150" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="115" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 数 target</text>
  <text x="115" y="100" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cnt[x]++</text>
  <text x="115" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x ∈ target</text>
  <path d="M 190 91 L 218 91" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="220" y="55" width="150" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="295" y="80" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 数 arr</text>
  <text x="295" y="100" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cnt[x]−−</text>
  <text x="295" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">一旦 &lt; 0 → false</text>
  <path d="M 370 91 L 398 91" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="400" y="55" width="130" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="465" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 抵消完</text>
  <text x="465" y="100" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两数组等长，</text>
  <text x="465" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">归零即 true</text>

  <!-- 计数表演算 -->
  <text x="60" y="175" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：target = [1,2,3,4]，arr = [2,4,1,3]</text>

  <rect x="60" y="188" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text y="208" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="110">cnt[1]=1</tspan><tspan x="215">cnt[2]=1</tspan><tspan x="320">cnt[3]=1</tspan><tspan x="425">cnt[4]=1</tspan></text>

  <rect x="60" y="228" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text y="248" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="110">arr 抵消后</tspan><tspan x="215">cnt[1]=0</tspan><tspan x="320">cnt[2]=0</tspan><tspan x="425">cnt[3]=0, cnt[4]=0</tspan></text>

  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全程没有出现负数 → 返回 true ✓</text>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">若 arr 里有 target 没有的值（或个数超了），计数必然变负，立刻出局</text>
</svg>
