<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 404" width="820" height="404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="820" height="404" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">官方样例走查：定位 g，再比较 c_g 与 2k−1</text>
  <path d="M 186 42 Q 410 49 634 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="34" y="64" width="752" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">组</text>
  <text x="132" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n</text>
  <text x="192" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">k</text>
  <text x="336" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">c 向量（值 0 起）</text>
  <text x="500" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">g</text>
  <text x="582" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">c_g</text>
  <text x="668" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2k−1</text>
  <text x="748" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">结论</text>

  <!-- 第 1 行 -->
  <text x="70" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="132" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="192" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="336" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(2, 1, 1)</text>
  <text x="500" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="582" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="668" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="714" y="114" width="62" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="745" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33582a" filter="url(#rough2)">YES</text>
  <path d="M 40 152 L 780 152" stroke="#c9d2da" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 第 2 行 -->
  <text x="70" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="132" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="192" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="336" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(2, 2)</text>
  <text x="500" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="582" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="668" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="714" y="158" width="62" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="745" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">NO</text>
  <path d="M 40 196 L 780 196" stroke="#c9d2da" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 第 3 行 -->
  <text x="70" y="220" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="132" y="220" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="192" y="220" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="336" y="220" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(3, 2, 1)</text>
  <text x="500" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="582" y="220" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="668" y="220" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="714" y="202" width="62" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="745" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33582a" filter="url(#rough2)">YES</text>
  <path d="M 40 240 L 780 240" stroke="#c9d2da" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 第 4 行 -->
  <text x="70" y="264" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="132" y="264" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="192" y="264" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="336" y="264" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(2, 2, 2)</text>
  <text x="500" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="582" y="264" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="668" y="264" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="714" y="246" width="62" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="745" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">NO</text>
  <path d="M 40 284 L 780 284" stroke="#c9d2da" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 第 5 行 -->
  <text x="70" y="308" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="132" y="308" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="192" y="308" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="336" y="308" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(4, 3, 1)</text>
  <text x="500" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="582" y="308" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="668" y="308" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="714" y="290" width="62" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="745" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33582a" filter="url(#rough2)">YES</text>

  <!-- 底部注解 -->
  <rect x="34" y="330" width="356" height="58" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="350" font-size="11.6" fill="#8a6015" filter="url(#rough2)">第 3 组：g = 0、c_0 = 3 = 2k−1，Alice 先手直接</text>
  <text x="50" y="368" font-size="11.6" fill="#8a6015" filter="url(#rough2)">抢 3 张 0，Bob 永远只有 2 张 ⇒ mex 0 vs 1</text>

  <rect x="404" y="330" width="382" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="350" font-size="11.6" fill="#33582a" filter="url(#rough2)">第 2、4 组：c_g ≠ 2k−1（分别 0 与 2），Bob 同值配对镜像，</text>
  <text x="420" y="368" font-size="11.6" fill="#33582a" filter="url(#rough2)">双方在 0..g−1 都 ≥ k、在 g 都 &lt; k ⇒ mex 同为 g（Bob 胜）</text>
</svg>
