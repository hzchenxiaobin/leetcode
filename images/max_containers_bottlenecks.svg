<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">两条独立上界，短板即答案</text>
  <path d="M 210 38 Q 320 46 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：空间上界 -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="270" height="180" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="175" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">空间上界：格子数</text>
  <g filter="url(#sk)">
    <g stroke="#4a8edb" stroke-width="1.2" fill="#ffffff">
      <rect x="120" y="100" width="26" height="26" rx="4"/>
      <rect x="148" y="100" width="26" height="26" rx="4"/>
      <rect x="176" y="100" width="26" height="26" rx="4"/>
      <rect x="204" y="100" width="26" height="26" rx="4"/>
      <rect x="120" y="128" width="26" height="26" rx="4"/>
      <rect x="148" y="128" width="26" height="26" rx="4"/>
      <rect x="176" y="128" width="26" height="26" rx="4"/>
      <rect x="204" y="128" width="26" height="26" rx="4"/>
      <rect x="120" y="156" width="26" height="26" rx="4"/>
      <rect x="148" y="156" width="26" height="26" rx="4"/>
      <rect x="176" y="156" width="26" height="26" rx="4"/>
      <rect x="204" y="156" width="26" height="26" rx="4"/>
      <rect x="120" y="184" width="26" height="26" rx="4"/>
      <rect x="148" y="184" width="26" height="26" rx="4"/>
      <rect x="176" y="184" width="26" height="26" rx="4"/>
      <rect x="204" y="184" width="26" height="26" rx="4"/>
    </g>
  </g>
  <g font-size="11" fill="#2b6e9e" text-anchor="middle">
    <text x="133" y="117">w</text><text x="161" y="117">w</text><text x="189" y="117">w</text><text x="217" y="117">w</text>
    <text x="133" y="145">w</text><text x="161" y="145">w</text><text x="189" y="145">w</text><text x="217" y="145">w</text>
    <text x="133" y="173">w</text><text x="161" y="173">w</text><text x="189" y="173">w</text><text x="217" y="173">w</text>
    <text x="133" y="201">w</text><text x="161" y="201">w</text><text x="189" y="201">w</text><text x="217" y="201">w</text>
  </g>
  <text x="175" y="232" text-anchor="middle" font-size="11" fill="#444">n × n = n² 个单元格，每格至多一箱</text>

  <!-- 右：重量上界 -->
  <g filter="url(#sk)">
    <rect x="330" y="62" width="270" height="180" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="465" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">重量上界：预算整除</text>
  <g filter="url(#sk)">
    <g stroke="#4a8e4a" stroke-width="1.2" fill="#b7dfba">
      <rect x="345" y="102" width="38" height="26" rx="4"/>
      <rect x="383" y="102" width="38" height="26" rx="4"/>
      <rect x="421" y="102" width="38" height="26" rx="4"/>
      <rect x="459" y="102" width="38" height="26" rx="4"/>
      <rect x="497" y="102" width="38" height="26" rx="4"/>
    </g>
    <rect x="535" y="102" width="22" height="26" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4,3"/>
  </g>
  <g font-size="11" fill="#2e6e2e" text-anchor="middle">
    <text x="364" y="120">w</text><text x="402" y="120">w</text><text x="440" y="120">w</text><text x="478" y="120">w</text><text x="516" y="120">w</text>
  </g>
  <text x="465" y="150" text-anchor="middle" font-size="10.5" fill="#444">每个绿色段 = 一箱的重量 w，预算逐段切分</text>
  <text x="465" y="168" text-anchor="middle" font-size="10.5" fill="#888">灰色剩余不足一整箱，只能闲置</text>
  <text x="465" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">整箱数 = ⌊maxWeight / w⌋</text>

  <!-- 箭头汇合 -->
  <path d="M 175 248 Q 200 266 232 272" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 465 248 Q 440 266 408 272" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 公式 -->
  <g filter="url(#sk)">
    <rect x="140" y="270" width="360" height="52" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">ans = min(n², ⌊maxWeight / w⌋)</text>
  <text x="320" y="312" text-anchor="middle" font-size="11" fill="#a67c2e">谁小谁说了算（木桶效应）</text>

  <text x="320" y="348" text-anchor="middle" font-size="11" fill="#888">「每箱恰重 w」+「格子无差异」⇒ 可行性只由数量 k 决定，两条上界解耦</text>
</svg>
