<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：点对 (−3,0)–(3,0) 定位出圆心 (0,4)</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">d = 6，h = √(5² − 3²) = 4，两个候选圆心为 (0,4) 与 (0,−4)</text>

  <!-- 坐标轴 -->
  <line x1="34" y1="370" x2="468" y2="370" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="180" y1="58" x2="180" y2="424" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="455" y="390" font-size="10" fill="#999" filter="url(#rough2)">x</text>
  <text x="160" y="70" font-size="10" fill="#999" filter="url(#rough2)">y</text>

  <!-- 圆形靶 -->
  <circle cx="180" cy="242" r="160" fill="#e8f0fe" fill-opacity="0.42" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- 半径辅助线 -->
  <line x1="180" y1="242" x2="84" y2="370" stroke="#446688" stroke-width="1.1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="180" y1="242" x2="340" y2="242" stroke="#446688" stroke-width="1.1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="180" y1="242" x2="180" y2="82" stroke="#446688" stroke-width="1.1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- 圆心 -->
  <circle cx="180" cy="242" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="190" y="258" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">O(0,4)</text>

  <!-- 飞镖 -->
  <circle cx="84" cy="370" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="276" cy="370" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="244" cy="178" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="340" cy="242" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="180" cy="82" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="404" cy="114" r="5" fill="#b85450" filter="url(#rough2)"/>

  <text x="74" y="390" text-anchor="end" font-size="10" fill="#3a4a66" filter="url(#rough2)">(−3,0)</text>
  <text x="286" y="390" font-size="10" fill="#3a4a66" filter="url(#rough2)">(3,0)</text>
  <text x="254" y="174" font-size="10" fill="#3a5a30" filter="url(#rough2)">(2,6)</text>
  <text x="330" y="266" text-anchor="end" font-size="10" fill="#3a4a66" filter="url(#rough2)">(5,4)</text>
  <text x="190" y="78" font-size="10" fill="#3a4a66" filter="url(#rough2)">(0,9)</text>
  <text x="414" y="118" font-size="10" fill="#8a3a36" filter="url(#rough2)">(7,8)</text>

  <text x="120" y="300" font-size="9.5" fill="#446688" filter="url(#rough2)">r = 5</text>
  <text x="250" y="204" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">√8 ≈ 2.83</text>
  <text x="390" y="146" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">√65 ≈ 8.06</text>

  <!-- 说明框 -->
  <rect x="352" y="170" width="192" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="364" y="190" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">圆心取 (0,4)，r = 5</text>
  <text x="364" y="210" font-size="9.5" fill="#555" filter="url(#rough2)">边界 4 枚：A、B、(5,4)、(0,9)</text>
  <text x="364" y="229" font-size="9.5" fill="#555" filter="url(#rough2)">内部 1 枚：(2,6)</text>
  <text x="364" y="248" font-size="9.5" fill="#555" filter="url(#rough2)">圆外 1 枚：(7,8)</text>
  <text x="364" y="269" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">计数 = 4 + 1 = 5</text>

  <text x="280" y="442" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">另一个候选圆心 (0,−4) 只覆盖 (−3,0) 与 (3,0)，计数为 2，被淘汰</text>
  <text x="280" y="460" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 (0,4) 不是任何飞镖坐标，这正是「以飞镖为圆心」会漏解的原因</text>
</svg>
