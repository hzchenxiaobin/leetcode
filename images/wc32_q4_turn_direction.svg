<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="330" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">叉积符号决定 B 的去留：cross(O,A,B) = (A−O) × (B−O)</text>

  <rect x="20" y="48" width="200" height="200" rx="10" fill="#e8f0fe" fill-opacity="0.6"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="72" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">左转 cross &gt; 0</text>
  <text x="120" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 保留 B</text>
  <path d="M 45,160 L 195,160" stroke="#888" stroke-width="1.1" stroke-dasharray="4 3"
        fill="none" filter="url(#rough2)"/>
  <path d="M 45,160 L 120,205 L 195,160" stroke="#446688" stroke-width="2.2" fill="none"
        filter="url(#rough2)"/>
  <circle cx="45" cy="160" r="5" fill="#fff" stroke="#2f4f6f" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="120" cy="205" r="5" fill="#d6a040" stroke="#8a6520" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="195" cy="160" r="5" fill="#fff" stroke="#2f4f6f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="30" y="152" font-size="12" fill="#333" filter="url(#rough2)">A</text>
  <text x="126" y="222" font-size="12" fill="#333" filter="url(#rough2)">B</text>
  <text x="200" y="152" font-size="12" fill="#333" filter="url(#rough2)">C</text>
  <text x="120" y="238" text-anchor="middle" font-size="11" fill="#2f4f6f" filter="url(#rough2)">B 在弦 AC 下方 → 属于下凸壳</text>

  <rect x="240" y="48" width="200" height="200" rx="10" fill="#fce4ec" fill-opacity="0.7"
        stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="72" text-anchor="middle" font-size="13" fill="#8c3b39" filter="url(#rough2)">右转 cross &lt; 0</text>
  <text x="340" y="90" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">→ 弹出 B</text>
  <path d="M 265,205 L 415,205" stroke="#888" stroke-width="1.1" stroke-dasharray="4 3"
        fill="none" filter="url(#rough2)"/>
  <path d="M 265,205 L 340,160 L 415,205" stroke="#b85450" stroke-width="2.2" fill="none"
        filter="url(#rough2)"/>
  <path d="M 333,153 L 347,167 M 347,153 L 333,167" stroke="#b85450" stroke-width="2" fill="none"
        filter="url(#rough2)"/>
  <circle cx="265" cy="205" r="5" fill="#fff" stroke="#8c3b39" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="340" cy="160" r="5" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="415" cy="205" r="5" fill="#fff" stroke="#8c3b39" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="220" font-size="12" fill="#333" filter="url(#rough2)">A</text>
  <text x="352" y="154" font-size="12" fill="#333" filter="url(#rough2)">B</text>
  <text x="420" y="220" font-size="12" fill="#333" filter="url(#rough2)">C</text>
  <text x="340" y="238" text-anchor="middle" font-size="11" fill="#8c3b39" filter="url(#rough2)">B 在弦 AC 上方 → 不在下凸壳</text>

  <rect x="460" y="48" width="200" height="200" rx="10" fill="#e6f4ea" fill-opacity="0.8"
        stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="560" y="72" text-anchor="middle" font-size="13" fill="#3c6330" filter="url(#rough2)">共线 cross = 0</text>
  <text x="560" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 保留 B（在边上）</text>
  <path d="M 485,215 L 560,185 L 635,155" stroke="#4a7a3a" stroke-width="2.2" fill="none"
        filter="url(#rough2)"/>
  <circle cx="485" cy="215" r="5" fill="#fff" stroke="#3c6330" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="560" cy="185" r="5" fill="#d6a040" stroke="#8a6520" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="635" cy="155" r="5" fill="#fff" stroke="#3c6330" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="468" y="230" font-size="12" fill="#333" filter="url(#rough2)">A</text>
  <text x="566" y="178" font-size="12" fill="#333" filter="url(#rough2)">B</text>
  <text x="636" y="148" font-size="12" fill="#333" filter="url(#rough2)">C</text>
  <text x="560" y="238" text-anchor="middle" font-size="11" fill="#3c6330" filter="url(#rough2)">B 在边 AC 上 → 属于围栏</text>

  <text x="340" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">下凸壳扫描只弹「严格右转」，共线点必须留在链上</text>
  <text x="340" y="308" text-anchor="middle" font-size="12" fill="#8c3b39" filter="url(#rough2)">若把弹栈条件写成 cross ≤ 0，(3,3) 这类边上的树会被漏掉</text>
</svg>
