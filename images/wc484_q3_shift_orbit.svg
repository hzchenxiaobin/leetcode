<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="436" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：一次操作 = 整串统一 +1，可达串构成 26 格「位移轨道」</text>

  <!-- 面板 A：fusion 的位移轨道 -->
  <rect x="30" y="46" width="580" height="158" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">"fusion" 的位移轨道：+6 步到达 "layout" ⇒ 相似</text>

  <text x="92" y="80" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">起点 k=0</text>
  <text x="548" y="80" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">+6 步</text>

  <rect x="63" y="88" width="58" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="92" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">fusion</text>

  <rect x="139" y="88" width="58" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">gvtjpo</text>

  <rect x="215" y="88" width="58" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="244" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">hwukqp</text>

  <rect x="291" y="88" width="58" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ixvlrq</text>

  <rect x="367" y="88" width="58" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="396" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">jywmsr</text>

  <rect x="443" y="88" width="58" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="472" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">kzxnts</text>

  <rect x="519" y="88" width="58" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="548" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">layout</text>

  <path d="M123,100 Q131,95 137,100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M199,100 Q207,95 213,100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M275,100 Q283,95 289,100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M351,100 Q359,95 365,100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M427,100 Q435,95 441,100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M503,100 Q511,95 517,100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="320" y="130" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">每个箭头 = 一次操作：选中整串，全部字母 +1（z 绕回 a）</text>

  <path d="M548,118 C470,152 170,152 92,118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="172" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">继续 +1：再走 20 步绕回 "fusion" —— 轨道共 26 个不同串（非空串位移非零步回不到自己）</text>

  <!-- 面板 B：不同轨道不相交 -->
  <rect x="30" y="216" width="282" height="122" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="171" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">不同的轨道互不相交 ⇒ 不相似</text>

  <rect x="48" y="248" width="34" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="65" y="263" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ab</text>
  <rect x="98" y="248" width="34" height="22" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="263" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">bc</text>
  <rect x="148" y="248" width="34" height="22" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="263" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">⋯</text>
  <rect x="198" y="248" width="34" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="263" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">za</text>
  <path d="M84,259 Q91,255 96,259" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M134,259 Q141,255 146,259" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M184,259 Q191,255 196,259" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="263" font-size="9" fill="#999" filter="url(#rough2)">⋯</text>
  <text x="171" y="284" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">"ab" 与 "za" 同轨道 ⇒ 相似</text>

  <rect x="48" y="294" width="34" height="22" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="309" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">aa</text>
  <rect x="98" y="294" width="34" height="22" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="309" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">bb</text>
  <rect x="148" y="294" width="34" height="22" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="309" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">⋯</text>
  <rect x="198" y="294" width="34" height="22" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="215" y="309" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">zz</text>
  <path d="M84,305 Q91,301 96,305" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M134,305 Q141,301 146,305" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M184,305 Q191,301 196,305" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="309" font-size="9" fill="#999" filter="url(#rough2)">⋯</text>
  <text x="171" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">"aa" 的轨道与 "ab" 的无交集 ⇒ 不相似</text>

  <!-- 面板 C：逐位差判据 -->
  <rect x="328" y="216" width="282" height="122" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="469" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">判据：t[p] − s[p] (mod 26) 恒为常数？</text>
  <text x="469" y="260" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">"layout" − "fusion" = ( 6, 6, 6, 6, 6, 6 )</text>
  <text x="469" y="278" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">全 6 ⇒ 相似 ✓</text>
  <text x="469" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">"aa" − "ab" = ( 0, 25 )</text>
  <text x="469" y="318" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">0 ≠ 25 ⇒ 不相似 ✗</text>

  <!-- 底部绿色结论框 -->
  <rect x="30" y="350" width="580" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="368" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">相似 ⟺ 同一轨道 ⟺ 逐位差 (t[p]−s[p]) mod 26 恒为常数 ⟺ 规范化键相同</text>
  <text x="320" y="384" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">（由 s[p]+a ≡ t[p]+b (mod 26)：差与位置 p 无关 ⟺ 存在共同位移）</text>

  <!-- 底部橙色警示框 -->
  <rect x="30" y="400" width="580" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="418" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">⚠️ 别把每个串的 26 个位移全插进哈希表数共现——相似对共享整整 26 个键，会重复计数 26 倍</text>
</svg>
