<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arL" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：「同一小时」= 任意起点的滑动 60 分钟窗口</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 错误做法提示框 -->
  <g filter="url(#sk)"><rect x="60" y="46" width="520" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="68" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#sk)">✗ 错误做法：按钟点 HH 分桶统计 —— 05 时桶 2 次、06 时桶 1 次</text>
  <text x="320" y="90" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#sk)">两个桶都不到 3 次 → 误判 a 非高访问（被示例 1 直接证伪）</text>

  <text x="320" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">a 的三条记录：05:32 · 05:49 · 06:21（分钟值 332 · 349 · 381）</text>

  <!-- 60 分钟滑动窗口带 -->
  <g filter="url(#sk)"><rect x="202" y="140" width="288" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="346" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">任意起点 s 的 60 分钟窗口 [s, s+60)</text>

  <!-- 钟点边界（红色虚线） -->
  <g filter="url(#sk)">
    <path d="M 70 136 L 70 208" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M 340 136 L 340 208" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>

  <!-- 时间轴 -->
  <path d="M 54 196 L 612 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <path d="M 70 189 L 70 203" stroke="#b85450" stroke-width="2"/>
    <path d="M 340 189 L 340 203" stroke="#b85450" stroke-width="2"/>
    <path d="M 610 189 L 610 203" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="70" y="222" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#sk)">05:00</text>
  <text x="340" y="222" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#sk)">06:00</text>
  <text x="610" y="222" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#sk)">07:00</text>

  <!-- 三个访问点 -->
  <g filter="url(#sk)">
    <circle cx="214" cy="196" r="7" fill="#4a7a3a"/>
    <circle cx="290" cy="196" r="7" fill="#4a7a3a"/>
    <circle cx="434" cy="196" r="7" fill="#4a7a3a"/>
  </g>
  <text x="214" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">05:32</text>
  <text x="290" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">05:49</text>
  <text x="434" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">06:21</text>

  <!-- 分桶结果 -->
  <text x="205" y="246" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#sk)">05 时桶：2 次 ✗</text>
  <text x="475" y="246" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#sk)">06 时桶：1 次 ✗</text>

  <!-- 跨度双箭头 -->
  <g filter="url(#sk)">
    <path d="M 214 204 L 214 270" stroke="#999" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
    <path d="M 434 204 L 434 270" stroke="#999" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  </g>
  <path d="M 214 270 L 434 270" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-start="url(#arL)" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="324" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">最晚 − 最早 = 49 分钟 &lt; 60 → 三条同窗 ✓</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="60" y="312" width="520" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">同窗判定：三次访问同窗 ⟺ 最晚 − 最早 &lt; 60（恰好 60 不算）</text>
  <text x="320" y="358" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">窗口从任意分钟起算、可跨钟点 —— 钟点分桶是第一读题陷阱</text>
  <text x="320" y="380" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">HHMM 转分钟：t = HH × 60 + MM（「0910」−「0850」数值差 60，实际差 20）</text>
</svg>
