<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">排序 + 双指针收拢：每轮删最小与最大</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">平均值 (min+max)/2 只依赖两数之和 ⟹ 用「和」放进集合去重，避免浮点</text>

  <text x="40" y="78" font-size="12" fill="#333" font-weight="bold">排序后的数组（示例：[0, 1, 3, 4, 4, 5]）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="90" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="130" y="90" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="200" y="90" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="270" y="90" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="340" y="90" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="410" y="90" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <text x="90" y="112" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
  <text x="160" y="112" text-anchor="middle" font-size="13" fill="#555">1</text>
  <text x="230" y="112" text-anchor="middle" font-size="13" fill="#555">3</text>
  <text x="300" y="112" text-anchor="middle" font-size="13" fill="#555">4</text>
  <text x="370" y="112" text-anchor="middle" font-size="13" fill="#555">4</text>
  <text x="440" y="112" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>

  <text x="90" y="146" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i（最小）</text>
  <text x="440" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">j（最大）</text>

  <path d="M 128 148 C 200 190, 340 190, 412 148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="270" y="200" text-anchor="middle" font-size="11" fill="#b85450">配对 (nums[i], nums[j]) → 求和 → 放入集合</text>

  <path d="M 122 160 L 152 160" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 428 160 L 398 160" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="164" font-size="10" fill="#446688">i++</text>
  <text x="384" y="164" font-size="10" fill="#4a7a3a">j--</text>
  <text x="270" y="164" text-anchor="middle" font-size="10" fill="#888">下一轮继续收拢，直到 i ≥ j</text>

  <rect x="60" y="222" width="230" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="175" y="246" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">为什么用「和」去重？</text>
  <text x="175" y="268" text-anchor="middle" font-size="10.5" fill="#555">(a+b)/2 与 (c+d)/2 相等</text>
  <text x="175" y="286" text-anchor="middle" font-size="10.5" fill="#555">⟺ a+b 与 c+d 相等（除数同为 2）</text>
  <text x="175" y="304" text-anchor="middle" font-size="10.5" fill="#555">整数和 0..200，布尔数组即可</text>

  <rect x="310" y="222" width="230" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="425" y="246" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">排序为什么是对的？</text>
  <text x="425" y="268" text-anchor="middle" font-size="10.5" fill="#555">每轮删「一个最小 + 一个最大」</text>
  <text x="425" y="286" text-anchor="middle" font-size="10.5" fill="#555">⟺ 排序后第 i 小配第 i 大</text>
  <text x="425" y="304" text-anchor="middle" font-size="10.5" fill="#555">重复元素删哪个都一样（值相同）</text>

  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">答案 = 集合的大小（不同平均值的个数）</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#999">n ≤ 100，O(n log n) 排序 + O(n) 收拢，复杂度绰绰有余</text>
</svg>
