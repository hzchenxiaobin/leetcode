<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：一元一次方程 → 归约成 a·x = b</text>
  <text x="290" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两侧各自只是一条直线：左 a1·x+b1，右 a2·x+b2；移项即得 (a1−a2)·x = b2−b1</text>

  <text x="52" y="80" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">左式</text>
  <rect x="50" y="86" width="210" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="155" y="116" text-anchor="middle" font-size="13" fill="#2c3a55" filter="url(#rough2)">x + 5 − 3 + x</text>

  <text x="322" y="80" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">右式</text>
  <rect x="320" y="86" width="210" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="116" text-anchor="middle" font-size="13" fill="#2f4a28" filter="url(#rough2)">6 + x − 2</text>

  <path d="M 155 136 L 155 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 425 136 L 425 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="162" width="210" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="155" y="190" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">a1 = 2,  b1 = 2</text>

  <rect x="320" y="162" width="210" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="190" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">a2 = 1,  b2 = 4</text>

  <path d="M 155 208 L 155 220 L 240 220 L 240 236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 425 208 L 425 220 L 340 220 L 340 236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="238" width="360" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text x="290" y="260" text-anchor="middle" font-size="11.5" fill="#2c3a55" filter="url(#rough2)">x 项移到左边、常数移到右边（移项变号）</text>
  <text x="290" y="278" text-anchor="middle" font-size="12.5" fill="#2c3a55" filter="url(#rough2)">a = a1 − a2 = 1,   b = b2 − b1 = 2</text>

  <path d="M 290 288 L 290 312" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="316" width="200" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="9" filter="url(#rough2)"/>
  <text x="290" y="345" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">a·x = b  ⇒  x = 2</text>

  <text x="290" y="384" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">三分支：a=0,b=0 → Infinite solutions；a=0,b≠0 → No solution；a≠0 → x=b/a</text>
</svg>
