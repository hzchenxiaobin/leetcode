<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：降序排序 + 贪心取前缀，前缀和首次过半即停</text>
  <path d="M 120 42 Q 320 52 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 原数组 -->
  <text x="46" y="84" font-size="11" fill="#888">原数组：</text>
  <g filter="url(#sk)"><rect x="110" y="64" width="54" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="137" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="172" y="64" width="54" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="199" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="234" y="64" width="54" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="261" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">10</text>
  <g filter="url(#sk)"><rect x="296" y="64" width="54" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="323" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">9</text>
  <g filter="url(#sk)"><rect x="358" y="64" width="54" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="385" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">8</text>
  <text x="428" y="84" font-size="11" fill="#888">（子序列不要求连续）</text>

  <!-- 排序箭头 -->
  <path d="M 320 100 L 320 128" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="332" y="118" font-size="11" fill="#888">降序排序（可自由重排）</text>

  <!-- 排序后 -->
  <text x="46" y="158" font-size="11" fill="#888">排序后：</text>
  <g filter="url(#sk)"><rect x="110" y="138" width="54" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="137" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">10</text>
  <g filter="url(#sk)"><rect x="172" y="138" width="54" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="199" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">9</text>
  <g filter="url(#sk)"><rect x="234" y="138" width="54" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="261" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">8</text>
  <g filter="url(#sk)"><rect x="296" y="138" width="54" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="323" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="358" y="138" width="54" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="385" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">3</text>
  <!-- 前缀大括号 -->
  <path d="M 110 178 Q 169 190 226 178" stroke="#4a8e4a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="168" y="208" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">贪心取走的前缀（绿色）</text>

  <!-- 前缀和堆叠条 -->
  <text x="46" y="240" font-size="11" fill="#888">前缀和：</text>
  <g filter="url(#sk)"><rect x="60" y="216" width="153" height="32" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="136" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">10</text>
  <g filter="url(#sk)"><rect x="213" y="216" width="138" height="32" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="282" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">9</text>
  <g filter="url(#sk)"><rect x="351" y="216" width="122" height="32" rx="3" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.2"/></g>
  <text x="412" y="237" text-anchor="middle" font-size="12" fill="#6a7a90">8</text>
  <g filter="url(#sk)"><rect x="473" y="216" width="61" height="32" rx="3" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.2"/></g>
  <text x="504" y="237" text-anchor="middle" font-size="12" fill="#6a7a90">4</text>
  <g filter="url(#sk)"><rect x="534" y="216" width="46" height="32" rx="3" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.2"/></g>
  <text x="557" y="237" text-anchor="middle" font-size="12" fill="#6a7a90">3</text>
  <!-- 累计刻度 -->
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="210" y="210">10</text>
    <text x="348" y="210" font-weight="bold" fill="#2e6e2e">19</text>
    <text x="470" y="210">27</text>
    <text x="531" y="210">31</text>
    <text x="577" y="210">34</text>
  </g>
  <!-- 半和阈值线 -->
  <path d="M 320 202 L 320 264" stroke="#b85450" stroke-width="2" stroke-dasharray="6 3" fill="none" filter="url(#sk)"/>
  <text x="314" y="200" text-anchor="end" font-size="11" font-weight="bold" fill="#b85450">total / 2 = 17</text>
  <text x="320" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">累计 19 首次严格越过 17 ⟹ 停！答案 [10, 9]</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="50" y="292" width="540" height="122" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="318" text-anchor="middle" font-size="12.5" fill="#5a4a20">✓ 长度最小 —— 大元素性价比最高，用最少的个数越过半和</text>
  <text x="320" y="346" text-anchor="middle" font-size="12.5" fill="#5a4a20">✓ 和最大 —— 长度同为 k 时，前 k 大元素之和就是最大可能和</text>
  <text x="320" y="374" text-anchor="middle" font-size="12.5" fill="#5a4a20">✓ 非递增 —— 沿降序取出，答案天然有序，无需二次排序</text>
  <text x="320" y="402" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">判停条件：cur &gt; total − cur（严格大于，差一个等号都不行）</text>
</svg>
