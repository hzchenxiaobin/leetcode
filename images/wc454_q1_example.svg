<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：词内大写压平 与 超长截断</text>

  <text x="60" y="48" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2：caption = “can I Go There”</text>

  <rect x="60" y="60" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">can</text>
  <rect x="128" y="60" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">I</text>
  <rect x="180" y="60" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">Go</text>
  <rect x="244" y="60" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">There</text>

  <path d="M 88 94 L 88 114" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 148 94 L 148 114" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 206 94 L 206 114" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 94 L 280 114" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="118" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">can</text>
  <rect x="128" y="118" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">I</text>
  <rect x="180" y="118" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="138" text-anchor="middle" font-size="13" font-weight="bold" filter="url(#rough2)"><tspan fill="#b85450">G</tspan><tspan fill="#333">o</tspan></text>
  <rect x="244" y="118" width="72" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="13" font-weight="bold" filter="url(#rough2)"><tspan fill="#b85450">T</tspan><tspan fill="#333">here</tspan></text>

  <text x="88" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">首词 → 全小写</text>
  <text x="214" y="164" text-anchor="middle" font-size="10.5" fill="#a06a1a" font-weight="bold" filter="url(#rough2)">非首词 → 首字母大写</text>

  <rect x="60" y="178" width="290" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="205" y="198" text-anchor="middle" font-size="13" font-weight="bold" filter="url(#rough2)"><tspan fill="#b85450">#</tspan><tspan fill="#333">can</tspan><tspan fill="#b85450">I</tspan><tspan fill="#b85450">G</tspan><tspan fill="#333">o</tspan><tspan fill="#b85450">T</tspan><tspan fill="#333">here</tspan></text>

  <text x="60" y="226" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">长度 12 ≤ 100，无需截断 ✓</text>

  <text x="60" y="254" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3：caption = 101 个 “h”（首词长度 101）</text>

  <rect x="60" y="268" width="380" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" filter="url(#rough2)"><tspan fill="#b85450">#</tspan><tspan fill="#333"> h h h … h h h</tspan></text>
  <rect x="440" y="268" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="470" y="288" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">h h</text>

  <path d="M 62 310 L 436 310" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 444 310 L 496 310" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="249" y="328" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保留 100 个字符 = “#” + 99 个 “h”</text>
  <text x="470" y="328" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">截去 2 个 h</text>

  <text x="60" y="350" font-size="11.5" fill="#333" filter="url(#rough2)">拼接结果 “#” + 101 个 “h” 共 102 个字符 &gt; 100 → 从末尾截去 2 个</text>

  <rect x="60" y="360" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="12" font-weight="bold" filter="url(#rough2)"><tspan fill="#b85450">#</tspan><tspan fill="#333">hhhh…hhh（“#” + 99 个 “h”，共 100 个字符）</tspan></text>
</svg>
