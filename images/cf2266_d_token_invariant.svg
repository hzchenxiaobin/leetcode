<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="432" fill="#fafafa"/>

  <text x="380" y="31" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：c = aᵢ − i 是跟着路段走的身份证</text>
  <path d="M 120 41 Q 380 48 640 41" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="44" y="63" font-size="12" fill="#66788c" filter="url(#rough2)">样例 4：a = [9, 7, 12, 10, 12]，把第 3 段搬到第 1 位（i = 1, j = 3）</text>

  <!-- 行 A：移动前 -->
  <text x="42" y="127" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">移动前</text>

  <text x="149" y="80" text-anchor="middle" font-size="11" fill="#8894a0" filter="url(#rough2)">1</text>
  <text x="217" y="80" text-anchor="middle" font-size="11" fill="#8894a0" filter="url(#rough2)">2</text>
  <text x="285" y="80" text-anchor="middle" font-size="11" fill="#8894a0" filter="url(#rough2)">3</text>
  <text x="353" y="80" text-anchor="middle" font-size="11" fill="#8894a0" filter="url(#rough2)">4</text>
  <text x="421" y="80" text-anchor="middle" font-size="11" fill="#8894a0" filter="url(#rough2)">5</text>

  <rect x="120" y="86" width="58" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="149" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">9</text>
  <rect x="188" y="86" width="58" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="217" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">7</text>
  <rect x="256" y="86" width="58" height="44" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="285" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">12</text>
  <rect x="324" y="86" width="58" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="353" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">10</text>
  <rect x="392" y="86" width="58" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="421" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">12</text>

  <rect x="120" y="134" width="58" height="26" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="149" y="152" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">c = 8</text>
  <rect x="188" y="134" width="58" height="26" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="217" y="152" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">c = 5</text>
  <rect x="256" y="134" width="58" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c = 9</text>
  <rect x="324" y="134" width="58" height="26" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="353" y="152" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">c = 6</text>
  <rect x="392" y="134" width="58" height="26" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="421" y="152" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">c = 7</text>

  <text x="470" y="152" font-size="11" fill="#446688" filter="url(#rough2)">← 身份证 c = aᵢ − i，跟着路段走</text>

  <!-- 搬运箭头 -->
  <path d="M 285 164 C 258 190 190 190 156 204" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 149 164 C 160 186 194 196 214 204" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 217 164 C 232 186 264 196 281 204" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 B：移动后 -->
  <text x="42" y="241" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">移动后</text>

  <rect x="120" y="212" width="58" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="149" y="241" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">10</text>
  <rect x="188" y="212" width="58" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="217" y="241" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">10</text>
  <rect x="256" y="212" width="58" height="44" rx="7" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="285" y="241" text-anchor="middle" font-size="18" fill="#8a8a8a" filter="url(#rough2)">8</text>
  <rect x="324" y="212" width="58" height="44" rx="7" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="353" y="241" text-anchor="middle" font-size="18" fill="#8a8a8a" filter="url(#rough2)">10</text>
  <rect x="392" y="212" width="58" height="44" rx="7" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="421" y="241" text-anchor="middle" font-size="18" fill="#8a8a8a" filter="url(#rough2)">12</text>

  <rect x="120" y="260" width="58" height="26" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="149" y="278" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">c = 9</text>
  <rect x="188" y="260" width="58" height="26" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="217" y="278" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">c = 8</text>
  <rect x="256" y="260" width="58" height="26" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="285" y="278" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">c = 5</text>
  <rect x="324" y="260" width="58" height="26" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="353" y="278" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">c = 6</text>
  <rect x="392" y="260" width="58" height="26" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="421" y="278" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">c = 7</text>

  <text x="470" y="278" font-size="11" fill="#446688" filter="url(#rough2)">值 = c + 位置：9+1 = 8+2 = 10</text>

  <!-- 结论框 -->
  <rect x="40" y="312" width="680" height="104" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="338" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">一次搬运后，每一段仍然满足「高度 = c + 位置」</text>
  <text x="58" y="362" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">被搬走的段：新高度 a_j − (j−i) = c_j + i，而它正落在位置 i；</text>
  <text x="58" y="384" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">被越过的段：位置 +1 且高度 +1 ⇒ c + (p+1)；其余段完全不动。</text>
  <text x="58" y="406" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">⇒ 同一个 c 换个位置就换个高度，等高只能靠一串连续的 c。</text>
</svg>
