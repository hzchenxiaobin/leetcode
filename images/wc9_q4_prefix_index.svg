<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">前缀索引：把「逐字符校验」压成一次查表</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">第 k 行必须满足的前缀 = 第 k 列已确定的 k 个字符（自上而下）</text>

  <text x="44" y="74" font-size="11" fill="#3a4a66" font-weight="bold">words（等长单词表）</text>
  <text x="316" y="74" font-size="11" fill="#3a5a30" font-weight="bold">pref[前缀] → 候选单词</text>

  <g font-size="11" text-anchor="middle">
    <rect x="44" y="82" width="200" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="144" y="100" fill="#3a4a66" filter="url(#rough2)">area</text>
    <rect x="44" y="114" width="200" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="144" y="132" fill="#3a4a66" filter="url(#rough2)">lead</text>
    <rect x="44" y="146" width="200" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="144" y="164" fill="#3a4a66" filter="url(#rough2)">wall</text>
    <rect x="44" y="178" width="200" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="144" y="196" fill="#3a4a66" filter="url(#rough2)">lady</text>
    <rect x="44" y="210" width="200" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="144" y="228" fill="#3a4a66" filter="url(#rough2)">ball</text>
  </g>

  <path d="M 252 150 L 308 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">枚举全部前缀</text>

  <g font-size="11">
    <rect x="316" y="82" width="200" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="328" y="100" fill="#3a5a30" filter="url(#rough2)">""</text>
    <text x="360" y="100" fill="#555" font-size="10" filter="url(#rough2)">→ 5 个单词全部</text>
    <rect x="316" y="114" width="200" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="328" y="132" fill="#3a5a30" filter="url(#rough2)">"a"</text>
    <text x="360" y="132" fill="#555" font-size="10" filter="url(#rough2)">→ area</text>
    <rect x="316" y="146" width="200" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="328" y="164" fill="#3a5a30" filter="url(#rough2)">"le"</text>
    <text x="360" y="164" fill="#555" font-size="10" filter="url(#rough2)">→ lead</text>
    <rect x="316" y="178" width="200" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="328" y="196" fill="#3a5a30" filter="url(#rough2)">"lad"</text>
    <text x="360" y="196" fill="#555" font-size="10" filter="url(#rough2)">→ lady</text>
    <rect x="316" y="210" width="200" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="328" y="228" fill="#3a5a30" filter="url(#rough2)">"bal"</text>
    <text x="360" y="228" fill="#555" font-size="10" filter="url(#rough2)">→ ball</text>
  </g>

  <rect x="44" y="252" width="472" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="272" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">候选是怎么查出来的</text>
  <text x="60" y="292" font-size="10" fill="#555" filter="url(#rough2)">已填 wall ⇒ 第 1 列需以 "a" 开头 ⇒ 候选 = pref["a"] = [area]</text>
  <text x="60" y="310" font-size="10" fill="#555" filter="url(#rough2)">已填 wall, area ⇒ 第 2 列需以 "le" 开头 ⇒ 候选 = pref["le"] = [lead]</text>
  <text x="60" y="326" font-size="10" fill="#555" filter="url(#rough2)">再填 lead ⇒ 第 3 列需以 "lad" 开头 ⇒ 候选 = [lady]，四行填满即得方块</text>

  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">哈希查找 O(L) ⇒ 每层只枚举真正可行的单词，不再盲搜</text>
</svg>
