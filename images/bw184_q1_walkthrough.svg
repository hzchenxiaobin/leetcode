<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：数一数有几处「11」</text>
  <rect x="26" y="72" width="120" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="86.0" y="93" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">n</text>
  <rect x="156" y="72" width="88" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200.0" y="93" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">二进制</text>
  <rect x="254" y="72" width="86" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="297.0" y="93" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">t = n &amp; (n&gt;&gt;1)</text>
  <rect x="350" y="72" width="158" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="429.0" y="93" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">结论</text>
  <rect x="26" y="110" width="120" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86.0" y="137" text-anchor="middle" font-size="10.5" fill="#446688">6</text>
  <rect x="156" y="110" width="88" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="200.0" y="137" text-anchor="middle" font-size="10.5" fill="#446688">110</text>
  <rect x="254" y="110" width="86" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="297.0" y="137" text-anchor="middle" font-size="10.5" fill="#446688">010（1 个 1）</text>
  <rect x="350" y="110" width="158" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="429.0" y="137" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">true</text>
  <rect x="26" y="158" width="120" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86.0" y="185" text-anchor="middle" font-size="10.5" fill="#446688">5</text>
  <rect x="156" y="158" width="88" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="200.0" y="185" text-anchor="middle" font-size="10.5" fill="#446688">101</text>
  <rect x="254" y="158" width="86" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="297.0" y="185" text-anchor="middle" font-size="10.5" fill="#446688">000（无）</text>
  <rect x="350" y="158" width="158" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="429.0" y="185" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">false</text>
  <rect x="26" y="206" width="120" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86.0" y="233" text-anchor="middle" font-size="10.5" fill="#446688">7</text>
  <rect x="156" y="206" width="88" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="200.0" y="233" text-anchor="middle" font-size="10.5" fill="#446688">111</text>
  <rect x="254" y="206" width="86" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="297.0" y="233" text-anchor="middle" font-size="10.5" fill="#446688">011（2 个 1）</text>
  <rect x="350" y="206" width="158" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="429.0" y="233" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">false</text>
  <rect x="26" y="254" width="120" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86.0" y="281" text-anchor="middle" font-size="10.5" fill="#446688">3</text>
  <rect x="156" y="254" width="88" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="200.0" y="281" text-anchor="middle" font-size="10.5" fill="#446688">11</text>
  <rect x="254" y="254" width="86" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="297.0" y="281" text-anchor="middle" font-size="10.5" fill="#446688">01（1 个 1）</text>
  <rect x="350" y="254" width="158" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="429.0" y="281" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">true</text>
  <rect x="26" y="312" width="508" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">n = 7 是最典型的反例：两处「11」重叠在同一个 1 上，仍算两对</text>
  <text x="280.0" y="364" text-anchor="middle" font-size="10" fill="#999">「一对」指一对相邻位置 (i, i+1) 同时为 1，不是「连续 1 的个数为 2」</text>
</svg>
