<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">示例演算：nums = [7,12,9,8,9,15]，k = 4</text>
  <text x="280" y="54" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">逐位统计 cnt，与阈值 k 比较，达标即点亮 ans 的对应位</text>

  <!-- header row -->
  <rect x="12" y="66" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">位 i</text>
  <rect x="70" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="106" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="250" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="123" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="159" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="195" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="231" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="267" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">15</text>
  <rect x="286" y="66" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="85" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">cnt</text>
  <rect x="334" y="66" width="76" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="85" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">cnt ≥ 4 ？</text>
  <rect x="412" y="66" width="136" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="85" text-anchor="middle" font-size="12" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">ans（更新后）</text>

  <!-- row bit 0 -->
  <rect x="12" y="98" width="56" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="87" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="123" y="118" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="159" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="195" y="118" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="231" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="267" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="286" y="98" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="118" text-anchor="middle" font-size="12.5" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="334" y="98" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="118" text-anchor="middle" font-size="12" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">✓ 置位</text>
  <rect x="412" y="98" width="136" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="118" text-anchor="middle" font-size="12.5" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">0001₂（=1）</text>

  <!-- row bit 1 -->
  <rect x="12" y="132" width="56" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="87" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="123" y="152" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="159" y="152" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="195" y="152" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="231" y="152" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="267" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="286" y="132" width="46" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="309" y="152" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">2</text>
  <rect x="334" y="132" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 跳过</text>
  <rect x="412" y="132" width="136" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="152" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">0001₂（不变）</text>

  <!-- row bit 2 -->
  <rect x="12" y="166" width="56" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="87" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="123" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="159" y="186" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="195" y="186" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="231" y="186" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="267" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="286" y="166" width="46" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="309" y="186" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3</text>
  <rect x="334" y="166" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="186" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 跳过</text>
  <rect x="412" y="166" width="136" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="186" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">0001₂（不变）</text>

  <!-- row bit 3 -->
  <rect x="12" y="200" width="56" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="87" y="220" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="123" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="159" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="195" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="231" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="267" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="286" y="200" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="220" text-anchor="middle" font-size="12.5" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="334" y="200" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="220" text-anchor="middle" font-size="12" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">✓ 置位</text>
  <rect x="412" y="200" width="136" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="220" text-anchor="middle" font-size="12.5" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">1001₂（=9）</text>

  <!-- row bit 4~31 -->
  <rect x="12" y="234" width="56" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="254" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">4~31</text>
  <text x="177" y="254" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">全部为 0（nums[i] &lt; 2³¹，最高位是 30）</text>
  <rect x="286" y="234" width="46" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="309" y="254" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="334" y="234" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="372" y="254" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 跳过</text>
  <rect x="412" y="234" width="136" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="254" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">1001₂（不变）</text>

  <!-- final note -->
  <rect x="90" y="282" width="380" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">只有 bit 0（cnt=4）与 bit 3（cnt=5）达标</text>
  <text x="280" y="316" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">返回 1001₂ = 8 + 1 = 9，与示例一致 ✓</text>
</svg>
