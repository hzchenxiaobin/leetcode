<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="490" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">核心观察：固定右端点，起点向左延伸，子数组 AND 阶梯式下降</text>
  <text x="320" y="42" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">nums = [2, 3, 5, 7, 7, 7, 5]，考察所有以 r = 6 结尾的子数组 nums[s..6]</text>

  <!-- 数组 -->
  <rect x="90" y="58" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="58" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="58" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="258" y="58" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="314" y="58" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="58" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="426" y="58" width="56" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="118" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="174" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="286" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="342" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="398" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="454" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">5</text>
  <text x="454" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">r = 6</text>
  <text x="118" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">s=0</text>
  <text x="174" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">s=1</text>
  <text x="230" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">s=2</text>
  <text x="286" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">s=3</text>
  <text x="342" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">s=4</text>
  <text x="398" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">s=5</text>
  <text x="454" y="108" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">s=6</text>

  <!-- 坐标轴 -->
  <path d="M78,330 V128" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M78,320 H500" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="124" font-size="11" fill="#666" filter="url(#rough2)">AND(nums[s..6])</text>
  <text x="500" y="308" font-size="11" fill="#666" filter="url(#rough2)">起点 s</text>
  <path d="M78,210 H482" stroke="#ccc" stroke-width="1" stroke-dasharray="3,4" fill="none" filter="url(#rough2)"/>
  <path d="M78,290 H482" stroke="#ccc" stroke-width="1" stroke-dasharray="3,4" fill="none" filter="url(#rough2)"/>
  <text x="66" y="214" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">5</text>
  <text x="66" y="294" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="66" y="324" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">0</text>

  <!-- 阶梯：s=0→and 0，s=1→and 1，s=2..6→and 5 -->
  <path d="M90,320 H146 V290 H202 V210 H482 V320 Z" fill="#e8f0fe" opacity="0.6" filter="url(#rough2)"/>
  <path d="M90,320 H146 V290 H202 V210 H482" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="118" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <text x="174" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="342" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>

  <!-- 同值段高亮 -->
  <rect x="200" y="194" width="284" height="32" rx="6" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,5" filter="url(#rough2)"/>
  <text x="342" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">and = 5：s ∈ [2, 6] 连成一段 → 合成一组，best = min dp[j-1][s]</text>
  <text x="174" y="272" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">and = 1：一组</text>
  <text x="118" y="336" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">and = 0：一组</text>

  <!-- 向左延伸箭头 -->
  <text x="340" y="358" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">起点 s 向左移（子数组变长）⟹ AND 单调不增</text>
  <path d="M470,368 H210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="48" y="384" width="560" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="403" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">相同 AND 的起点连成一段（连续区间），合并为一组，组内只保留 min dp[j-1][s]</text>
  <text x="328" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">每降一级至少清掉一个 1 位 ⟹ 组数 ≤ ⌊log₂ 10⁵⌋ + 2 = 18</text>

  <rect x="48" y="440" width="560" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="458" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">转移：dp[j][r+1] = best（and 恰为 andValues[j-1] 的组）+ nums[r]</text>
  <text x="328" y="474" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">n 个起点候选被压缩成 ≤ 18 个组 —— O(n·m·log U) 的来源</text>
</svg>
