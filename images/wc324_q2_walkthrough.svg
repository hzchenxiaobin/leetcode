<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n = 15 → 8 → 6 → 5，停在不动点</text>
  <path d="M 210 42 Q 470 50 730 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- highlight band for final row -->
  <g filter="url(#sk)">
    <rect x="52" y="360" width="836" height="74" rx="10" fill="#eaf6ee" opacity="0.6"/>
  </g>

  <!-- row 0 : n=15 -->
  <g filter="url(#sk)">
    <circle cx="92" cy="119" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="92" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">0</text>
  <g filter="url(#sk)">
    <rect x="126" y="93" width="104" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="178" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66" filter="url(#sk)">n = 15</text>
  <g filter="url(#sk)">
    <rect x="270" y="103" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="287" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <text x="310" y="124" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">×</text>
  <g filter="url(#sk)">
    <rect x="322" y="103" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="339" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">5</text>
  <path d="M 424 119 L 478 119" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="486" y="93" width="118" height="52" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="545" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">f = 8</text>
  <text x="630" y="124" font-size="12" fill="#666" filter="url(#sk)">8 &lt; 15 → 继续替换</text>

  <path d="M 92 138 L 92 179" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>

  <!-- row 1 : n=8 -->
  <g filter="url(#sk)">
    <circle cx="92" cy="212" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="92" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">1</text>
  <g filter="url(#sk)">
    <rect x="126" y="186" width="104" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="178" y="219" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66" filter="url(#sk)">n = 8</text>
  <g filter="url(#sk)">
    <rect x="270" y="196" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="287" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">2</text>
  <text x="310" y="217" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">×</text>
  <g filter="url(#sk)">
    <rect x="322" y="196" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="339" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">2</text>
  <text x="362" y="217" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">×</text>
  <g filter="url(#sk)">
    <rect x="374" y="196" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="391" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">2</text>
  <path d="M 424 212 L 478 212" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="486" y="186" width="118" height="52" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="545" y="219" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">f = 6</text>
  <text x="630" y="217" font-size="12" fill="#666" filter="url(#sk)">6 &lt; 8 → 继续（重数 2 计 3 次）</text>

  <path d="M 92 231 L 92 272" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>

  <!-- row 2 : n=6 -->
  <g filter="url(#sk)">
    <circle cx="92" cy="305" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="92" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2</text>
  <g filter="url(#sk)">
    <rect x="126" y="279" width="104" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="178" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66" filter="url(#sk)">n = 6</text>
  <g filter="url(#sk)">
    <rect x="270" y="289" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="287" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">2</text>
  <text x="310" y="310" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">×</text>
  <g filter="url(#sk)">
    <rect x="322" y="289" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="339" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <path d="M 424 305 L 478 305" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="486" y="279" width="118" height="52" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="545" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">f = 5</text>
  <text x="630" y="310" font-size="12" fill="#666" filter="url(#sk)">5 &lt; 6 → 继续</text>

  <path d="M 92 324 L 92 365" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>

  <!-- row 3 : n=5 (final) -->
  <g filter="url(#sk)">
    <circle cx="92" cy="398" r="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="92" y="403" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)">
    <rect x="126" y="372" width="104" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="178" y="405" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">n = 5</text>
  <g filter="url(#sk)">
    <rect x="270" y="382" width="34" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="287" y="403" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">5</text>
  <text x="326" y="403" font-size="11" fill="#5a8a5a" filter="url(#sk)">（质数）</text>
  <path d="M 424 398 L 478 398" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="486" y="372" width="118" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="545" y="405" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">f = 5</text>
  <text x="630" y="403" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5 = n → 返回 5 ⭐</text>

  <!-- trap inset: n = 4 -->
  <g filter="url(#sk)">
    <rect x="52" y="452" width="836" height="88" rx="10" fill="#fdf0f0" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text x="72" y="478" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">⚠ 对照陷阱：n = 4</text>
  <text x="72" y="502" font-size="12" fill="#444" filter="url(#sk)">4 = 2 × 2，f(4) = 2 + 2 = 4 = n → 命中不动点，返回 4（合数也能停！）</text>
  <text x="72" y="524" font-size="11" fill="#b85450" filter="url(#sk)">若写 while (!isPrime(n)) n = f(n) → 4 → 4 → 4 … 死循环；判据 s == n 天然规避</text>
</svg>
