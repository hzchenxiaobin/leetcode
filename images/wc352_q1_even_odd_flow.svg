<svg xmlns="http://www.w3.org/2000/svg" width="880" height="770" viewBox="0 0 880 770" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="770" fill="#fdfcf7"/>
  <text x="440" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">一次遍历的决策流程</text>
  <path d="M 330 34 Q 440 42 550 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="54" text-anchor="middle" font-size="11" fill="#888">处理 x 之前 cnt = f(i−1)，处理之后 cnt 更新为 f(i)</text>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="310" y="66" width="180" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="400" y="90" text-anchor="middle" font-size="12" fill="#2b6e9e">开始：ans = 0，cnt = 0</text>
  <path d="M 400 104 L 400 124" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- process -->
  <g filter="url(#sk)">
    <rect x="310" y="126" width="180" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="400" y="150" text-anchor="middle" font-size="12" fill="#2b6e9e">取下一元素 x = nums[i]</text>
  <path d="M 400 164 L 400 186" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="400,188 524,238 400,288 276,238" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="400" y="243" text-anchor="middle" font-size="12" fill="#7a5415">x &gt; threshold ?</text>
  <text x="532" y="230" font-size="11" fill="#b03a3a" font-weight="bold">是</text>
  <path d="M 528 238 L 574 238" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="412" y="282" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <path d="M 400 288 L 400 310" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- action 1 -->
  <g filter="url(#sk)">
    <rect x="578" y="214" width="168" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="662" y="236" text-anchor="middle" font-size="11.5" fill="#7a2828" font-weight="bold">cnt = 0</text>
  <text x="662" y="252" text-anchor="middle" font-size="10" fill="#888">链条断裂</text>
  <path d="M 746 238 L 816 238" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="400,312 524,372 400,432 276,372" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="400" y="366" text-anchor="middle" font-size="11.5" fill="#2e6e2e">i &gt; 0 且 cnt &gt; 0</text>
  <text x="400" y="384" text-anchor="middle" font-size="11.5" fill="#2e6e2e">且 x 与前一元素奇偶不同 ?</text>
  <text x="532" y="364" font-size="11" fill="#b03a3a" font-weight="bold">是</text>
  <path d="M 528 372 L 574 372" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="412" y="426" font-size="11" fill="#7a5415" font-weight="bold">否</text>
  <path d="M 400 432 L 400 454" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- action 2 -->
  <g filter="url(#sk)">
    <rect x="578" y="348" width="168" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="662" y="370" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">cnt = cnt + 1</text>
  <text x="662" y="386" text-anchor="middle" font-size="10" fill="#888">接龙延伸</text>
  <path d="M 746 372 L 816 372" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- diamond 3 -->
  <g filter="url(#sk)">
    <polygon points="400,456 524,506 400,556 276,506" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="400" y="511" text-anchor="middle" font-size="12" fill="#7a5415">x 是偶数 ?</text>
  <path d="M 400 556 L 400 578" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="376" y="574" font-size="10.5" fill="#2e6e2e">是 → 1</text>
  <text x="424" y="574" font-size="10.5" fill="#b03a3a">否 → 0</text>

  <!-- action 3 -->
  <g filter="url(#sk)">
    <rect x="300" y="580" width="200" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="400" y="607" text-anchor="middle" font-size="11.5" fill="#7a5415">cnt = 偶数 ? 1 : 0（重开新链）</text>
  <path d="M 400 624 L 400 646" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ans update -->
  <g filter="url(#sk)">
    <rect x="300" y="648" width="200" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="400" y="673" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">ans = max(ans, cnt)</text>

  <!-- right rail back to ans box -->
  <path d="M 816 238 L 816 668 L 506 668" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- left rail back to process -->
  <path d="M 300 668 L 120 668 L 120 145 L 304 145" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text transform="rotate(-90 104 420)" x="104" y="420" text-anchor="middle" font-size="11" fill="#666">下一元素（还有则继续）</text>

  <!-- end -->
  <path d="M 400 688 L 400 706" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="415" y="702" font-size="10" fill="#888">元素取完</text>
  <g filter="url(#sk)">
    <rect x="300" y="708" width="200" height="36" rx="8" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="400" y="731" text-anchor="middle" font-size="12" fill="#555">遍历结束：返回 ans</text>
</svg>
