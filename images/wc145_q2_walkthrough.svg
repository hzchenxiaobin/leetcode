<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">后序演算：示例 1 的 [3,5,1,6,2,0,8,null,null,7,4]</text>
  <text x="330" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">h = 到子树内最深叶子的距离，a = 该子树内最深叶子的 LCA</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="24" y="58" width="612" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="70" y="75" fill="#3a4a66" font-weight="bold">节点</text>
    <text x="190" y="75" fill="#3a4a66" font-weight="bold">L = (hL, aL)</text>
    <text x="320" y="75" fill="#3a4a66" font-weight="bold">R = (hR, aR)</text>
    <text x="450" y="75" fill="#3a4a66" font-weight="bold">返回 (h, a)</text>
    <text x="568" y="75" fill="#3a4a66" font-weight="bold">判定</text>

    <rect x="24" y="86" width="612" height="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="3"/>
    <text x="70" y="102" fill="#555" font-weight="bold">6</text>
    <text x="190" y="102" fill="#777">(−1, ·)</text>
    <text x="320" y="102" fill="#777">(−1, ·)</text>
    <text x="450" y="102" fill="#3a5a30">(0, 6)</text>
    <text x="568" y="102" fill="#888">叶子</text>

    <rect x="24" y="112" width="612" height="24" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1" rx="3"/>
    <text x="70" y="128" fill="#555" font-weight="bold">7</text>
    <text x="190" y="128" fill="#777">(−1, ·)</text>
    <text x="320" y="128" fill="#777">(−1, ·)</text>
    <text x="450" y="128" fill="#3a4a66">(0, 7)</text>
    <text x="568" y="128" fill="#888">叶子</text>

    <rect x="24" y="138" width="612" height="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="3"/>
    <text x="70" y="154" fill="#555" font-weight="bold">4</text>
    <text x="190" y="154" fill="#777">(−1, ·)</text>
    <text x="320" y="154" fill="#777">(−1, ·)</text>
    <text x="450" y="154" fill="#3a4a66">(0, 4)</text>
    <text x="568" y="154" fill="#888">叶子</text>

    <rect x="24" y="164" width="612" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="70" y="180" fill="#8a3a36" font-weight="bold">2</text>
    <text x="190" y="180" fill="#8a3a36">(0, 7)</text>
    <text x="320" y="180" fill="#8a3a36">(0, 4)</text>
    <text x="450" y="180" fill="#8a3a36" font-weight="bold">(1, 2)</text>
    <text x="568" y="180" fill="#a86a66">同高 → 自己</text>

    <rect x="24" y="190" width="612" height="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="3"/>
    <text x="70" y="206" fill="#555" font-weight="bold">5</text>
    <text x="190" y="206" fill="#777">(0, 6)</text>
    <text x="320" y="206" fill="#777">(1, 2)</text>
    <text x="450" y="206" fill="#3a4a66">(2, 2)</text>
    <text x="568" y="206" fill="#888">右更深</text>

    <rect x="24" y="216" width="612" height="24" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1" rx="3"/>
    <text x="70" y="232" fill="#555" font-weight="bold">0</text>
    <text x="190" y="232" fill="#777">(−1, ·)</text>
    <text x="320" y="232" fill="#777">(−1, ·)</text>
    <text x="450" y="232" fill="#3a5a30">(0, 0)</text>
    <text x="568" y="232" fill="#888">叶子</text>

    <rect x="24" y="242" width="612" height="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="3"/>
    <text x="70" y="258" fill="#555" font-weight="bold">8</text>
    <text x="190" y="258" fill="#777">(−1, ·)</text>
    <text x="320" y="258" fill="#777">(−1, ·)</text>
    <text x="450" y="258" fill="#3a5a30">(0, 8)</text>
    <text x="568" y="258" fill="#888">叶子</text>

    <rect x="24" y="268" width="612" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="70" y="284" fill="#8a6a20" font-weight="bold">1</text>
    <text x="190" y="284" fill="#8a6a20">(0, 0)</text>
    <text x="320" y="284" fill="#8a6a20">(0, 8)</text>
    <text x="450" y="284" fill="#8a6a20" font-weight="bold">(1, 1)</text>
    <text x="568" y="284" fill="#a8894a">同高 → 自己</text>

    <rect x="24" y="294" width="612" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="70" y="310" fill="#8a3a36" font-weight="bold">3</text>
    <text x="190" y="310" fill="#8a3a36">(2, 2)</text>
    <text x="320" y="310" fill="#8a3a36">(1, 1)</text>
    <text x="450" y="310" fill="#8a3a36" font-weight="bold">(3, 2)</text>
    <text x="568" y="310" fill="#a86a66">左更深</text>
  </g>

  <text x="330" y="344" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">最终 dfs(3) = (3, 2) → 返回以 2 为根的子树，序列化为 [2,7,4]</text>
  <text x="330" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">节点 1 虽然左右同高，但它的子树高度只有 1 &lt; 左兄弟的 2，所以在 3 处被淘汰</text>
  <text x="330" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">可见「同高 → 自己」只在子树内部成立，全局最优靠逐层回传比较得出</text>
</svg>
