<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">为什么这样一定合法？</text>
  <text x="280" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">n 个槽里最频繁的值最多出现 ⌈n/2⌉ 次</text>
  <rect x="60" y="70" width="200" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="160" y="92.5" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">设众数出现 c 次</text>
  <text x="160" y="109" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">它需要 c − 1 个「隔板」</text>
  <text x="280" y="102" font-size="18" fill="#888" text-anchor="start" filter="url(#rough2)">⇒</text>
  <rect x="310" y="70" width="200" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="410" y="92.5" font-size="10.5" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">n ≥ 2c − 1</text>
  <text x="410" y="109" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">即 c ≤ ⌈n/2⌉</text>
  <text x="60" y="158" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">偶位槽共有 ⌈n/2⌉ 个：只要众数不超过 ⌈n/2⌉，就一定能整块放进偶位槽。</text>
  <rect x="60" y="180" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="202.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="120" y="180" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="202.3" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="180" y="180" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="202.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="240" y="180" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="202.3" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="300" y="180" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="202.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="360" y="180" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="390" y="202.3" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="60" y="246" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">相邻两个偶位之间必有一个奇位（不同的值），所以同值永不相邻。</text>
  <rect x="60" y="262" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="285.8" font-size="10.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">题目保证存在答案，即 c ≤ ⌈n/2⌉ 恒成立，构造不会失败</text>
</svg>
