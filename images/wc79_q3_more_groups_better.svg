<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">正数下多切一刀只会更赚</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">拆成两段的分数 &gt; 合并成一段的分数 ⇒ 最优解一定用满 k 段</text>

  <g filter="url(#rough2)" text-anchor="middle" font-weight="bold" font-size="15">
    <rect x="40" y="78" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="84" y="78" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="62" y="101" fill="#3a4a66">9</text>
    <text x="106" y="101" fill="#3a4a66">1</text>

    <rect x="200" y="78" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="222" y="101" fill="#3a5a30">2</text>

    <rect x="340" y="78" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="384" y="78" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="428" y="78" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="362" y="101" fill="#8a6a20">9</text>
    <text x="406" y="101" fill="#8a6a20">1</text>
    <text x="450" y="101" fill="#8a6a20">2</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10" fill="#8a8a8a">
    <text x="62" y="128">A</text>
    <text x="222" y="128">B</text>
    <text x="406" y="128">A ∪ B</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11" font-weight="bold">
    <text x="84" y="148" fill="#446688">avg = (9+1)/2 = 5</text>
    <text x="222" y="148" fill="#4a7a3a">avg = 2</text>
    <text x="406" y="148" fill="#8a6a20">avg = 12/3 = 4</text>
  </g>

  <path d="M 262 95 L 322 95" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="86" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">合并</text>

  <text x="280" y="176" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 + 2 = 7   &gt;   12 / 3 = 4</text>
  <text x="280" y="194" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">拆开多出 3 分：同 9+1+2 这堆数，分成 [9,1]、[2] 比分一次吃掉更划算</text>

  <rect x="40" y="208" width="480" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="230" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">一般式：设 p=|A|, q=|B|, a=avg(A), b=avg(B)，则</text>
  <text x="56" y="252" font-size="11" fill="#5a2a28" filter="url(#rough2)">avg(A) + avg(B) − avg(A∪B) = (q·a + p·b) / (p + q)</text>
  <text x="56" y="268" font-size="10" fill="#8a6a6a" filter="url(#rough2)">a &gt; 0，b &gt; 0，p ≥ 1，q ≥ 1 ⇒ 分子恒正，故差值严格大于 0</text>

  <rect x="40" y="288" width="480" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="310" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">推论（k ≤ n 时）：段数能加就加，最优解恰好用满 k 段</text>
  <text x="56" y="330" font-size="10" fill="#4a6a42" filter="url(#rough2)">于是状态可以写死成「恰好 j 段」，答案直接取 dp[n][k]，无需再扫一遍 j</text>
  <text x="56" y="346" font-size="10" fill="#8a9a88" filter="url(#rough2)">（若元素含 0 或负数，本条失效，必须改成 max over j ≤ k）</text>
</svg>
