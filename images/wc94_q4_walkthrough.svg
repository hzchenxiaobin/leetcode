<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">示例 1：arr = [1,2,3,4,5,6,7,8]，最长斐波那契子序列 [1,2,3,5,8]</text>

  <!-- 数组下方标出被选中的元素 -->
  <g>
    <rect x="40" y="56" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="70" y="82" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">1</text>
    <rect x="106" y="56" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="136" y="82" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">2</text>
    <rect x="172" y="56" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="202" y="82" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">3</text>
    <rect x="238" y="56" width="60" height="40" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="268" y="82" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">4</text>
    <rect x="304" y="56" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="334" y="82" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">5</text>
    <rect x="370" y="56" width="60" height="40" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="400" y="82" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">6</text>
    <rect x="436" y="56" width="60" height="40" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="466" y="82" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">7</text>
    <rect x="502" y="56" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="532" y="82" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">8</text>
  </g>

  <text x="70" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="136" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="202" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="268" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="334" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="400" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="466" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="532" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>

  <!-- 关键转移表 -->
  <rect x="24" y="140" width="612" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="159" font-size="11" fill="#2c4a63" filter="url(#rough2)">(j, i)</text>
  <text x="150" y="159" font-size="11" fill="#2c4a63" filter="url(#rough2)">arr[j], arr[i]</text>
  <text x="280" y="159" font-size="11" fill="#2c4a63" filter="url(#rough2)">arr[i] − arr[j]</text>
  <text x="410" y="159" font-size="11" fill="#2c4a63" filter="url(#rough2)">查到的 k</text>
  <text x="490" y="159" font-size="11" fill="#2c4a63" filter="url(#rough2)">dp[j][i]</text>
  <text x="580" y="159" font-size="11" fill="#2c4a63" filter="url(#rough2)">序列</text>

  <rect x="24" y="170" width="612" height="28" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="189" font-size="11" fill="#444" filter="url(#rough2)">(0,1)</text>
  <text x="158" y="189" font-size="11" fill="#444" filter="url(#rough2)">1, 2</text>
  <text x="298" y="189" font-size="11" fill="#444" filter="url(#rough2)">−1（不存在）</text>
  <text x="418" y="189" font-size="11" fill="#444" filter="url(#rough2)">—</text>
  <text x="498" y="189" font-size="11" fill="#444" filter="url(#rough2)">2</text>
  <text x="574" y="189" font-size="11" fill="#444" filter="url(#rough2)">[1,2]</text>

  <rect x="24" y="200" width="612" height="28" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="219" font-size="11" fill="#444" filter="url(#rough2)">(1,2)</text>
  <text x="158" y="219" font-size="11" fill="#444" filter="url(#rough2)">2, 3</text>
  <text x="298" y="219" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="418" y="219" font-size="11" fill="#444" filter="url(#rough2)">k=0</text>
  <text x="498" y="219" font-size="11" fill="#444" filter="url(#rough2)">3</text>
  <text x="574" y="219" font-size="11" fill="#444" filter="url(#rough2)">[1,2,3]</text>

  <rect x="24" y="230" width="612" height="28" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="249" font-size="11" fill="#444" filter="url(#rough2)">(2,4)</text>
  <text x="158" y="249" font-size="11" fill="#444" filter="url(#rough2)">3, 5</text>
  <text x="298" y="249" font-size="11" fill="#444" filter="url(#rough2)">2</text>
  <text x="418" y="249" font-size="11" fill="#444" filter="url(#rough2)">k=1</text>
  <text x="498" y="249" font-size="11" fill="#444" filter="url(#rough2)">4</text>
  <text x="574" y="249" font-size="11" fill="#444" filter="url(#rough2)">[1,2,3,5]</text>

  <rect x="24" y="260" width="612" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="44" y="279" font-size="11" fill="#8a6410" filter="url(#rough2)">(4,7)</text>
  <text x="158" y="279" font-size="11" fill="#8a6410" filter="url(#rough2)">5, 8</text>
  <text x="298" y="279" font-size="11" fill="#8a6410" filter="url(#rough2)">3</text>
  <text x="418" y="279" font-size="11" fill="#8a6410" filter="url(#rough2)">k=2</text>
  <text x="498" y="279" font-size="11" fill="#8a6410" filter="url(#rough2)">5（最大）</text>
  <text x="574" y="279" font-size="11" fill="#8a6410" filter="url(#rough2)">[1,2,3,5,8]</text>

  <text x="24" y="320" font-size="12" fill="#333" filter="url(#rough2)">答案 = 5；不足 3 项时（例如 arr = [1,3,7] 只能凑出长度 2）按要求返回 0</text>

  <rect x="24" y="336" width="612" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="358" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">为什么 dp 要存 (j, i) 两个下标？因为「下一项」只由最后两项决定，而 arr 严格递增</text>
  <text x="330" y="376" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">⇒ 用「末两项」当状态即可无损转移，共 O(n²) 个状态</text>
</svg>
