<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">贪心循环：优先多的，被三连拦住时换少的</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每轮至少能放一个（题目保证有解），所以循环必然正常结束</text>
  <rect x="40" y="70" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="140.0" y="94.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">while a &gt; 0 或 b &gt; 0</text>
  <rect x="40" y="132" width="200" height="44" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="140.0" y="158.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">canA / canB ?</text>
  <rect x="270" y="132" width="250" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="395.0" y="158.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">放剩余较多的那个</text>
  <rect x="270" y="196" width="250" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="395.0" y="222.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">否则放唯一允许的</text>
  <rect x="40" y="262" width="200" height="40" fill="#f3e8fd" stroke="#7a5ea8" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="140.0" y="286.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">计数减一，追加字符</text>
  <rect x="270" y="262" width="250" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="395.0" y="285.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">两者都不行 → 无解（题面排除）</text>
  <path d="M 140 110 L 140 130" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 154 L 268 154" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 140 176 L 140 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 218 L 268 218" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 140 240 L 140 260" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 176 L 268 264" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="330" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">canA = a &gt; 0 且末尾不是两个 'a'；canB 同理。</text>
  <text x="30" y="352" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">「优先放多的」保证数量差被尽快消化，不会把少的提前用完。</text>
</svg>
