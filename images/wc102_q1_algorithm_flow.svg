<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="330" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">每轮三个互斥分支</text>
  <rect x="150" y="56" width="360" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="82.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">循环条件 i &lt; j（不满足则返回 nums）</text>
  <rect x="40" y="138" width="200" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140.0" y="171.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums[i] 是偶数</text>
  <rect x="255" y="138" width="180" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="171.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums[j] 是奇数</text>
  <rect x="450" y="138" width="180" height="58" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540.0" y="171.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">以上都不是</text>
  <path d="M 140,196 L 140,238" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 345,196 L 345,238" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 540,196 L 540,238" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="40" y="240" width="200" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140.0" y="266.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++（偶区扩容）</text>
  <rect x="255" y="240" width="180" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="266.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j--（奇区扩容）</text>
  <rect x="450" y="240" width="180" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540.0" y="266.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">交换后 i++、j--</text>
  <text x="330" y="314" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">左奇右偶 ⇔ 前两条都不成立，因此三分支互斥且穷尽</text>
</svg>
