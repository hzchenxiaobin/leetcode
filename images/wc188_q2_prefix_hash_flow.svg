<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="404" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">算法流程：前缀异或 + 哈希表批量计数</text>
  <text x="260" y="54" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">cnt[x]：值 x 出现过的次数；sumIdx[x]：这些前缀下标之和</text>

  <rect x="56" y="68" width="408" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="13" fill="#2a4660" filter="url(#rough2)">① 逐个异或：px ^= arr[m − 1]，得到 P[m]（m = 1 … n）</text>

  <path d="M260,122 V140" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="142" width="408" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="173" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">② 命中：ans += cnt[px] × (m − 1) − sumIdx[px]</text>

  <path d="M260,196 V214" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="216" width="408" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="247" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">③ 登记自己：cnt[px] += 1，sumIdx[px] += m</text>

  <path d="M260,270 V288" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="290" width="408" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="13" fill="#8f3a37" filter="url(#rough2)">④ m 走完 1 … n 后返回 ans（先算贡献、后登记）</text>

  <rect x="56" y="356" width="408" height="40" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">每个历史下标 i 贡献 m − i − 1 个三元组 → 用 (次数, 下标和) 压成 O(1)</text>
</svg>
