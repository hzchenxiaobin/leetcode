<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 336" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="336" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">为什么一定在两端取：交换论证</text>
  <rect x="24" y="52" width="250" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="74" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">朝上的令牌</text>
  <text x="149" y="96" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">越便宜越好：同样 +1 分，</text>
  <text x="149" y="116" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">花得越少，后面越买得起</text>
  <rect x="300" y="52" width="256" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">朝下的令牌</text>
  <text x="428" y="96" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">越贵越好：同样 −1 分，</text>
  <text x="428" y="116" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">换回的能量越多越划算</text>
  <text x="280" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">若方案里某次朝上选的不是最便宜的，把两者互换：</text>
  <text x="280" y="190" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">分不变、能量消耗不增加 ⇒ 方案仍可行且不更差</text>
  <text x="280" y="216" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">朝下同理（把便宜的留下、贵的卖掉）</text>
  <rect x="60" y="238" width="440" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">所以存在一个最优解：朝上集合 = 前缀，朝下集合 = 后缀</text>
  <text x="280" y="282" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">双指针一次扫描即可枚举所有这样的「分割点」</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">额外注意：卖分只是为了买更多便宜的令牌，卖完必须再买回来才赚</text>
</svg>
