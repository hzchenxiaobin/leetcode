<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="95"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">值域 DP：dp[v] = 以值 v 结尾的最长非降子序列长度</text>

  <!-- 流程 -->
  <g filter="url(#rough2)">
    <rect x="60" y="58" width="180" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="150" y="78" text-anchor="middle" font-size="13" fill="#333">初始化 dp[1..3] = 0</text>
    <text x="150" y="95" text-anchor="middle" font-size="11.5" fill="#888">（尚未处理任何元素）</text>

    <path d="M 240 81 C 262 81, 270 81, 288 81" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <rect x="292" y="58" width="130" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="357" y="78" text-anchor="middle" font-size="13" fill="#333">遍历每个 x ∈ nums</text>
    <text x="357" y="95" text-anchor="middle" font-size="11.5" fill="#888">x ∈ {1,2,3}</text>

    <path d="M 422 81 C 444 81, 452 81, 470 81" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <rect x="474" y="52" width="150" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="549" y="74" text-anchor="middle" font-size="13" fill="#4a7a3a">dp[x] ←</text>
    <text x="549" y="92" text-anchor="middle" font-size="12.5" fill="#4a7a3a">max(dp[1..x]) + 1</text>
    <text x="549" y="105" text-anchor="middle" font-size="10.5" fill="#888">前驱值必须 ≤ x</text>
  </g>

  <!-- 转移示意 -->
  <g filter="url(#rough2)">
    <text x="320" y="146" text-anchor="middle" font-size="13" fill="#333">以 x = 2 结尾：前驱可以是 1 或 2，不能是 3</text>
    <ellipse cx="180" cy="182" rx="30" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="180" y="187" text-anchor="middle" font-size="14" fill="#4a7a3a">1</text>
    <ellipse cx="280" cy="182" rx="30" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="187" text-anchor="middle" font-size="14" fill="#4a7a3a">2</text>
    <ellipse cx="380" cy="182" rx="30" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="380" y="187" text-anchor="middle" font-size="14" fill="#b85450">3</text>

    <path d="M 212 182 C 230 182, 240 182, 254 182" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="233" y="172" text-anchor="middle" font-size="11.5" fill="#4a7a3a">可接</text>
    <path d="M 350 182 C 336 182, 326 182, 312 182" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" stroke-dasharray="5 4"/>
    <text x="330" y="172" text-anchor="middle" font-size="11.5" fill="#b85450">不可接</text>

    <path d="M 280 204 C 280 220, 320 220, 360 224" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="300" y="226" width="120" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="360" y="248" text-anchor="middle" font-size="13" fill="#333">dp[2] 更新</text>
  </g>

  <!-- 收尾 -->
  <g filter="url(#rough2)">
    <rect x="60" y="280" width="250" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="185" y="302" text-anchor="middle" font-size="13" fill="#333">遍历结束：keep = max(dp[1..3])</text>
    <text x="185" y="322" text-anchor="middle" font-size="13" fill="#b85450">return n − keep</text>

    <rect x="340" y="280" width="240" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="460" y="302" text-anchor="middle" font-size="13" fill="#4a7a3a">值域 C = 3 ⇒ 时间 O(n·C) = O(n)</text>
    <text x="460" y="322" text-anchor="middle" font-size="12" fill="#555">空间 O(C) = O(1)，满足进阶要求</text>
  </g>
</svg>
