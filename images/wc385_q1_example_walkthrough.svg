<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">示例演算：words = ["a","aba","ababa","aa"]</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- header row: j values -->
  <text x="96" y="88" font-size="12" fill="#555" font-weight="bold">i ↓ j →</text>
  <g filter="url(#rough2)">
    <rect x="130" y="66" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="208" y="66" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="286" y="66" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="364" y="66" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="168" y="86" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">j=1 aba</text>
  <text x="246" y="86" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">j=2 ababa</text>
  <text x="324" y="86" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">j=3 aa</text>
  <text x="402" y="86" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold"></text>

  <!-- row i=0 -->
  <g filter="url(#rough2)">
    <rect x="58" y="102" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="93" y="124" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">i=0 "a"</text>
  <g filter="url(#rough2)">
    <rect x="130" y="102" width="76" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="208" y="102" width="76" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="286" y="102" width="76" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="168" y="124" text-anchor="middle" font-size="14" fill="#2e5b22" font-weight="bold">✓</text>
  <text x="246" y="124" text-anchor="middle" font-size="14" fill="#2e5b22" font-weight="bold">✓</text>
  <text x="324" y="124" text-anchor="middle" font-size="14" fill="#2e5b22" font-weight="bold">✓</text>

  <!-- row i=1 -->
  <g filter="url(#rough2)">
    <rect x="58" y="138" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="93" y="160" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">i=1 "aba"</text>
  <g filter="url(#rough2)">
    <rect x="130" y="138" width="76" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="208" y="138" width="76" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="286" y="138" width="76" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="168" y="160" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="246" y="160" text-anchor="middle" font-size="14" fill="#2e5b22" font-weight="bold">✓</text>
  <text x="324" y="156" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">✗ 太长</text>
  <text x="324" y="168" text-anchor="middle" font-size="9.5" fill="#8a3a36">3 &gt; 2</text>

  <!-- row i=2 -->
  <g filter="url(#rough2)">
    <rect x="58" y="174" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="93" y="196" text-anchor="middle" font-size="11.5" fill="#2b4a66" font-weight="bold">i=2 "ababa"</text>
  <g filter="url(#rough2)">
    <rect x="130" y="174" width="76" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="208" y="174" width="76" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="286" y="174" width="76" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="168" y="196" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="246" y="196" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="324" y="192" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">✗ 太长</text>
  <text x="324" y="204" text-anchor="middle" font-size="9.5" fill="#8a3a36">5 &gt; 2</text>

  <!-- row i=3 -->
  <g filter="url(#rough2)">
    <rect x="58" y="210" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="93" y="232" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">i=3 "aa"</text>
  <g filter="url(#rough2)">
    <rect x="130" y="210" width="76" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="208" y="210" width="76" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="286" y="210" width="76" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="168" y="232" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="246" y="232" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="324" y="232" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- annotations -->
  <text x="330" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">← "aba" 是 "ababa" 的前后缀</text>
  <text x="330" y="266" font-size="11.5" fill="#555">绿色 ✓：words[i] 既是 words[j] 的前缀又是后缀 → 计数 +1</text>
  <text x="330" y="284" font-size="11.5" fill="#555">红色 ✗：|words[i]| &gt; |words[j]|，长度不够，直接跳过</text>
  <text x="330" y="302" font-size="11.5" fill="#555">虚线 —：i ≥ j，不在枚举范围内（含对角线 i = j）</text>

  <!-- answer box -->
  <g filter="url(#rough2)">
    <rect x="90" y="330" width="460" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">4 个有效下标对：</text>
  <text x="320" y="386" text-anchor="middle" font-size="13" fill="#555" font-family="monospace">(0,1) (0,2) (0,3) (1,2)</text>
  <text x="320" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5b22">答案 ans = 4 ✓</text>
  <text x="320" y="434" text-anchor="middle" font-size="10.5" fill="#999">n=4 时上三角共 4+3+2+1−4 = 6 对，其中 4 对通过判定</text>
</svg>
