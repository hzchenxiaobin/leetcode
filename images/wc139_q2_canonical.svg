<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="600" height="350" fill="#fafafa"/>
  <text x="300" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">按列翻转 = 给所有行异或同一个掩码 K</text>
  <text x="300" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">把每行「归一化」成首元素为 0，就能直接比较</text>
  <text x="40" y="86" font-size="11" fill="#3a4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">原矩阵</text>
  <rect x="130" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="152" y="89.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="174" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="89.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="130" y="112" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="152" y="133.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="174" y="112" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="133.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="226" y="62" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">异或首元素</text>
  <path d="M 232 85 L 300 85" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 232 129 L 300 129" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="320" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="342" y="89.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="364" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="386" y="89.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="320" y="112" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="342" y="133.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="364" y="112" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="386" y="133.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="420" y="92" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">键相同 → 可同时变成全相等</text>
  <rect x="40" y="168" width="260" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="52" y="188.6" font-size="10" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">行 X 与行 Y 能同时「行内全相等」</text>
  <text x="52" y="204.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">⟺ X = K 或 X = ~K，Y = K 或 Y = ~K</text>
  <text x="52" y="220.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">⟺ 归一化后两者键相同</text>
  <rect x="320" y="168" width="240" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="332" y="188.6" font-size="10" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">翻转哪几列？</text>
  <text x="332" y="204.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">就是键里 1 的位置：</text>
  <text x="332" y="220.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">K = 键本身即可</text>
  <text x="40" y="262" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">例：[[0,1],[1,0]] 两行的键都是 (0,1)，翻转第 0 列 → 两行都变成全相等，答案 2。</text>
  <text x="40" y="286" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">再看 [[0,1],[1,1]]：键分别是 (0,1) 与 (0,0)，没有公共键成对出现，答案 1。</text>
  <rect x="40" y="302" width="520" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="325" font-size="11" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">所以答案 = 出现次数最多的「归一化键」的频次</text>
</svg>
