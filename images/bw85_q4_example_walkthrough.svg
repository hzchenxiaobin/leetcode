<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,5,6,1] 倒流添加全过程</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">removeQueries = [0,3,2,4,1] → 倒序点亮 1, 4, 2, 3（最后一步 0 无需记录）</text>

  <!-- 五个数组行：点亮状态 -->
  <!-- 数组: idx0..4, 值 1,2,5,6,1 -->
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <!-- 步0：全空 answer[4]=0 -->
    <rect x="110" y="60" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="154" y="60" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="198" y="60" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="242" y="60" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="286" y="60" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="132" y="81" fill="#bbb">1</text><text x="176" y="81" fill="#bbb">2</text>
    <text x="220" y="81" fill="#bbb">5</text><text x="264" y="81" fill="#bbb">6</text><text x="308" y="81" fill="#bbb">1</text>
    <text x="70" y="81" font-size="12" fill="#888">步 0</text>
    <text x="360" y="81" font-size="12.5" fill="#b85450" font-weight="bold">best=0 → ans[4]=0</text>

    <!-- 步1：点亮 1（值2） -->
    <rect x="110" y="104" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="154" y="104" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="198" y="104" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="242" y="104" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="286" y="104" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="132" y="125" fill="#bbb">1</text><text x="176" y="125" fill="#1d3a17" font-weight="bold">2</text>
    <text x="220" y="125" fill="#bbb">5</text><text x="264" y="125" fill="#bbb">6</text><text x="308" y="125" fill="#bbb">1</text>
    <text x="70" y="125" font-size="12" fill="#888">步 1</text>
    <text x="360" y="125" font-size="12.5" fill="#b85450" font-weight="bold">段{1}=2, best=2 → ans[3]=2</text>

    <!-- 步2：再点亮 4（值1） -->
    <rect x="110" y="148" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="154" y="148" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="198" y="148" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="242" y="148" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="286" y="148" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="132" y="169" fill="#bbb">1</text><text x="176" y="169" fill="#1d3a17" font-weight="bold">2</text>
    <text x="220" y="169" fill="#bbb">5</text><text x="264" y="169" fill="#bbb">6</text><text x="308" y="169" fill="#7a5a10" font-weight="bold">1</text>
    <text x="70" y="169" font-size="12" fill="#888">步 2</text>
    <text x="360" y="169" font-size="12.5" fill="#b85450" font-weight="bold">段{1}=2,{4}=1, best=2 → ans[2]=2</text>

    <!-- 步3：再点亮 2（值5），与 {1} 合并 -->
    <rect x="110" y="192" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="154" y="192" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="198" y="192" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="242" y="192" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="286" y="192" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="132" y="213" fill="#bbb">1</text><text x="176" y="213" fill="#1d3a17" font-weight="bold">2</text>
    <text x="220" y="213" fill="#1d3a17" font-weight="bold">5</text><text x="264" y="213" fill="#bbb">6</text><text x="308" y="213" fill="#7a5a10" font-weight="bold">1</text>
    <text x="70" y="213" font-size="12" fill="#888">步 3</text>
    <text x="360" y="213" font-size="12.5" fill="#b85450" font-weight="bold">{1,2}=7 合并! best=7 → ans[1]=7</text>

    <!-- 步4：再点亮 3（值6），三段合一 -->
    <rect x="110" y="236" width="44" height="32" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="154" y="236" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="198" y="236" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="242" y="236" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="286" y="236" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="132" y="257" fill="#bbb">1</text><text x="176" y="257" fill="#1d3a17" font-weight="bold">2</text>
    <text x="220" y="257" fill="#1d3a17" font-weight="bold">5</text><text x="264" y="257" fill="#1d3a17" font-weight="bold">6</text><text x="308" y="257" fill="#1d3a17" font-weight="bold">1</text>
    <text x="70" y="257" font-size="12" fill="#888">步 4</text>
    <text x="360" y="257" font-size="12.5" fill="#b85450" font-weight="bold">{1..4}=14, best=14 → ans[0]=14</text>
  </g>

  <!-- 合并箭头标注：步3 的合并 -->
  <path d="M 176 180 C 176 190 198 188 204 188" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="196" y="184" font-size="11" fill="#4a7a3a" filter="url(#rough2)">相邻合并</text>

  <!-- 答案条 -->
  <text x="60" y="300" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">answer 数组（正向第 i 次删除后的最大段和）：</text>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <rect x="110" y="312" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="312" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="198" y="312" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="242" y="312" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="286" y="312" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="132" y="332">14</text>
    <text x="176" y="332">7</text>
    <text x="220" y="332">2</text>
    <text x="264" y="332">2</text>
    <text x="308" y="332">0</text>
    <text x="132" y="356" font-size="11" fill="#888">ans[0]</text>
    <text x="176" y="356" font-size="11" fill="#888">ans[1]</text>
    <text x="220" y="356" font-size="11" fill="#888">ans[2]</text>
    <text x="264" y="356" font-size="11" fill="#888">ans[3]</text>
    <text x="308" y="356" font-size="11" fill="#888">ans[4]</text>
  </g>
  <text x="380" y="332" font-size="13" fill="#b85450" filter="url(#rough2)">= [14,7,2,2,0] ✓</text>

  <!-- 关键点 -->
  <g filter="url(#rough2)">
    <rect x="60" y="378" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="398" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">对应关系：ans[i] = 倒流完成 n−1−i 步后的 best</text>
  <text x="280" y="418" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">实现口诀：循环里「先记录 ans[i]，再点亮 removeQueries[i]」</text>
</svg>
