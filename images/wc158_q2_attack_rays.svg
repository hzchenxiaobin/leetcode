  <text x="370" y="408" font-size="9" fill="#bbb" filter="url(#rough2)">x</text>
  <text x="18" y="64" font-size="9" fill="#bbb" filter="url(#rough2)">y</text>
  <path d="M 60 88 L 60 128" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 60 88 L 100 88" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
