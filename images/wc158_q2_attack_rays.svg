  <text x="60" y="133" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">Q</text>
  <rect x="87" y="75" width="26" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="93" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">Q</text>
  <rect x="167" y="195" width="26" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="213" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">Q</text>
  <rect x="207" y="75" width="26" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="93" text-anchor="middle" font-size="13" fill="#9a7420" font-weight="bold" filter="url(#rough2)">Q</text>
  <rect x="47" y="235" width="26" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="253" text-anchor="middle" font-size="13" fill="#9a7420" font-weight="bold" filter="url(#rough2)">Q</text>
  <rect x="127" y="235" width="26" height="26" rx="5" fill="#eef0f2" stroke="#a8b0ba" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="253" text-anchor="middle" font-size="13" fill="#7a8088" font-weight="bold" filter="url(#rough2)">Q</text>
  <rect x="47" y="75" width="26" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="93" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">K</text>
  <rect x="396" y="66" width="288" height="142" rx="10" fill="#fffdf8" stroke="#ccc" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="408" y="82" width="20" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="418" y="97" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">Q</text>
  <text x="438" y="97" font-size="10.5" fill="#555" filter="url(#rough2)">可攻击：射线上最近的皇后</text>
  <rect x="408" y="114" width="20" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="418" y="129" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">Q</text>
  <text x="438" y="129" font-size="10.5" fill="#555" filter="url(#rough2)">被挡：后方皇后不攻击</text>
  <rect x="408" y="146" width="20" height="20" rx="4" fill="#eef0f2" stroke="#a8b0ba" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="418" y="161" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">Q</text>
  <text x="438" y="161" font-size="10.5" fill="#555" filter="url(#rough2)">不在行列 / 对角线上</text>
  <rect x="408" y="178" width="20" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="418" y="193" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">K</text>
  <text x="438" y="193" font-size="10.5" fill="#555" filter="url(#rough2)">白国王</text>
  <rect x="396" y="220" width="288" height="108" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="408" y="240" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">8 个方向向量</text>
  <text x="408" y="260" font-size="10" fill="#44506a" filter="url(#rough2)">dx, dy ∈ {-1, 0, 1}，且 (dx, dy) ≠ (0, 0)</text>
  <text x="408" y="280" font-size="10" fill="#44506a" filter="url(#rough2)">每步 (x, y) ← (x + dx, y + dy)</text>
  <text x="408" y="300" font-size="10" fill="#44506a" filter="url(#rough2)">遇到第一枚皇后就停下，越界即换方向</text>
  <text x="408" y="320" font-size="10" fill="#44506a" filter="url(#rough2)">答案至多 8 个，任意顺序返回</text>
  <rect x="396" y="340" width="288" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="408" y="360" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">示例答案</text>
  <text x="408" y="382" font-size="11" fill="#3a5a30" filter="url(#rough2)">[[0,1], [1,0], [3,3]]</text>
  <text x="350" y="424" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">(4,0)、(0,4) 分别在 (1,0)、(0,1) 之后被遮挡；(2,4) 与国王不共线，同样不攻击</text>
</svg>
