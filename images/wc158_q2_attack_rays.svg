<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="440" fill="#fafafa"/>
  <text x="350" y="26" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">8 条射线：每条射线最多 1 个可攻击的皇后</text>
  <text x="350" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一射线上更远的皇后会被近处的皇后挡住，所以只需找每个方向的第一枚</text>
