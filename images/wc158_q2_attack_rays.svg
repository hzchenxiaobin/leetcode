  <text x="30" y="91" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="30" y="131" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="30" y="171" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
