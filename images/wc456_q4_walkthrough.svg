<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="640" fill="#fdfcf7"/>
  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：n=3, edges=[[0,1,4,0],[1,2,3,0],[0,2,1,0]], k=2</text>
  <text x="440" y="48" text-anchor="middle" font-size="11.5" fill="#777">must 边：无 → 二分区间 [1, 2·max s] = [1, 8]</text>

  <!-- left panel: check(6) -->
  <g filter="url(#sk)"><rect x="40" y="62" width="390" height="440" rx="10" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="235" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">check(6)</text>
  <text x="235" y="108" text-anchor="middle" font-size="10" fill="#888">免费边（s ≥ 6）：无；must 边：无</text>

  <g filter="url(#sk)"><path d="M247,152 L318,241" stroke="#d6a040" stroke-width="3" fill="none"/></g>
  <g filter="url(#sk)"><path d="M223,152 L152,241" stroke="#999" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/></g>
  <g filter="url(#sk)"><path d="M318,269 L162,269" stroke="#d6a040" stroke-width="3" fill="none"/></g>

  <g filter="url(#sk)"><circle cx="235" cy="137" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="235" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">0</text>
  <g filter="url(#sk)"><circle cx="330" cy="255" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="330" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">1</text>
  <g filter="url(#sk)"><circle cx="140" cy="255" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="140" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">2</text>

  <text x="302" y="188" font-size="10.5" font-weight="bold" fill="#9a6d1a">s=4</text>
  <text x="160" y="188" font-size="10.5" fill="#888">s=1</text>
  <text x="235" y="290" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a6d1a">s=3</text>

  <g filter="url(#sk)"><rect x="62" y="316" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="84" y="328" font-size="10.5" fill="#444">边 0-1：s=4，×2 → 8 ≥ 6 ⟹ 升级，up=1</text>
  <g filter="url(#sk)"><rect x="62" y="344" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="84" y="356" font-size="10.5" fill="#444">边 1-2：s=3，×2 → 6 ≥ 6 ⟹ 升级，up=2</text>
  <g filter="url(#sk)"><rect x="62" y="372" width="14" height="14" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/></g>
  <text x="84" y="384" font-size="10.5" fill="#888">边 0-2：s=1，×2 → 2 &lt; 6 ⟹ 弃用</text>

  <path d="M 70 404 Q 235 412 400 404" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="62" y="416" width="346" height="68" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="235" y="440" text-anchor="middle" font-size="11.5" fill="#333">comp：3 → 2 → 1（连通）</text>
  <text x="235" y="460" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">up = 2 ≤ k = 2 ⟹ ✓ 阈值 6 可行</text>
  <text x="235" y="477" text-anchor="middle" font-size="10" fill="#666">见证树 {0-1↑, 1-2↑}：有效强度 {8, 6}</text>

  <!-- right panel: check(7) -->
  <g filter="url(#sk)"><rect x="450" y="62" width="390" height="440" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="645" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">check(7)</text>
  <text x="645" y="108" text-anchor="middle" font-size="10" fill="#888">免费边（s ≥ 7）：无；must 边：无</text>

  <g filter="url(#sk)"><path d="M657,152 L728,241" stroke="#d6a040" stroke-width="3" fill="none"/></g>
  <g filter="url(#sk)"><path d="M633,152 L562,241" stroke="#999" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/></g>
  <g filter="url(#sk)"><path d="M728,269 L572,269" stroke="#999" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/></g>

  <g filter="url(#sk)"><circle cx="645" cy="137" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="645" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">0</text>
  <g filter="url(#sk)"><circle cx="740" cy="255" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="740" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">1</text>
  <g filter="url(#sk)"><circle cx="550" cy="255" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="550" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">2</text>

  <text x="712" y="188" font-size="10.5" font-weight="bold" fill="#9a6d1a">s=4</text>
  <text x="570" y="188" font-size="10.5" fill="#888">s=1</text>
  <text x="645" y="290" text-anchor="middle" font-size="10.5" fill="#888">s=3</text>

  <g filter="url(#sk)"><rect x="472" y="316" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="494" y="328" font-size="10.5" fill="#444">边 0-1：s=4，×2 → 8 ≥ 7 ⟹ 升级，up=1</text>
  <g filter="url(#sk)"><rect x="472" y="344" width="14" height="14" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/></g>
  <text x="494" y="356" font-size="10.5" fill="#888">边 1-2：s=3，×2 → 6 &lt; 7 ⟹ 弃用</text>
  <g filter="url(#sk)"><rect x="472" y="372" width="14" height="14" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/></g>
  <text x="494" y="384" font-size="10.5" fill="#888">边 0-2：s=1，×2 → 2 &lt; 7 ⟹ 弃用</text>

  <path d="M 480 404 Q 645 412 810 404" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="472" y="416" width="346" height="68" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/></g>
  <text x="645" y="440" text-anchor="middle" font-size="11.5" fill="#555">comp 卡在 2：节点 {2} 被孤立</text>
  <text x="645" y="460" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">⟹ ✗ 阈值 7 不可行</text>
  <text x="645" y="477" text-anchor="middle" font-size="10" fill="#888">翻倍后能过 7 的只有 s=4 这一条边</text>

  <!-- bottom conclusion -->
  <g filter="url(#sk)"><rect x="80" y="524" width="720" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="440" y="550" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">二分 [1, 8]：6 可行（左）、7 不可行（右）⟹ 最大可行阈值 x* = 6</text>
  <text x="440" y="574" text-anchor="middle" font-size="11.5" fill="#444">每轮判定 = 一趟并查集：must 边 → 免费边 → 升级边，O(E·α(n))</text>
  <text x="440" y="598" text-anchor="middle" font-size="11" fill="#666">总复杂度 O(E·log(2·max s)·α(n)) ≈ 10^5 × 18 次合并，轻松通过</text>
</svg>
