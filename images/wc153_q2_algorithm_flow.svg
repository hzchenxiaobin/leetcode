<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，六个常数步骤</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">全部计算与输入规模无关，时间 / 空间都是 O(1)</text>

  <rect x="170" y="62" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">输入 day, month, year</text>

  <path d="M 280 100 L 280 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,124 430,168 280,212 130,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">year 是闰年？</text>
  <text x="280" y="182" text-anchor="middle" font-size="9.5" fill="#a08850" filter="url(#rough2)">(y%4=0 且 y%100≠0) 或 y%400=0</text>

  <path d="M 130 168 L 130 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 168 L 430 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="236" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="261" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">2 月按 29 天（month &gt; 2 时 +1）</text>

  <rect x="330" y="236" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="261" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">2 月按 28 天（不加闰日）</text>

  <path d="M 130 278 L 130 294" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 430 278 L 430 294" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 130 294 L 430 294" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 294 L 280 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="308" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="54" y="326" font-size="10" fill="#3a4a66" filter="url(#rough2)">total = 365 × (year − 1971) + ( L(year−1) − L(1970) )</text>
  <text x="54" y="348" font-size="10" fill="#3a4a66" filter="url(#rough2)">　　　 + 1..month−1 月的月长之和 + (day − 1)</text>

  <path d="M 280 358 L 280 374" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="376" width="280" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">idx = (total + 5) mod 7</text>

  <path d="M 280 414 L 280 430" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="432" width="280" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="456" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">返回 names[idx]</text>

  <text x="280" y="490" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">无循环依赖输入：130 年、12 个月都只是常数</text>
</svg>
