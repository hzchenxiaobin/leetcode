<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：首元素就是 piece 的「身份证」</text>
  <path d="M 165 38 Q 320 46 475 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- pieces panel -->
  <rect x="18" y="54" width="262" height="158" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="149" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#sk)">pieces（粗框格 = 首元素）</text>
  <rect x="40" y="88" width="40" height="26" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="2.4" filter="url(#sk)"/>
  <text x="60" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">78</text>
  <rect x="40" y="122" width="40" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="2.4" filter="url(#sk)"/>
  <text x="60" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <rect x="86" y="122" width="40" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="106" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">64</text>
  <rect x="40" y="156" width="40" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="60" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">91</text>

  <!-- build-table arrows -->
  <text x="316" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#sk)">建表</text>
  <path d="M 284 101 L 346 101" stroke="#d6a040" stroke-width="2" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 284 135 L 346 135" stroke="#446688" stroke-width="2" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 284 169 L 346 169" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arg)" filter="url(#sk)"/>

  <!-- hash panel -->
  <rect x="352" y="54" width="270" height="158" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="487" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">哈希表：first → piece</text>
  <rect x="368" y="88" width="34" height="26" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="385" y="106" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">78</text>
  <path d="M 408 101 L 430 101" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="436" y="88" width="34" height="26" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.3" filter="url(#sk)"/>
  <text x="453" y="106" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">78</text>
  <rect x="368" y="122" width="34" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="385" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <path d="M 408 135 L 430 135" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="436" y="122" width="34" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="453" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <rect x="474" y="122" width="34" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="491" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">64</text>
  <rect x="368" y="156" width="34" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="385" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">91</text>
  <path d="M 408 169 L 430 169" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="436" y="156" width="34" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" filter="url(#sk)"/>
  <text x="453" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">91</text>

  <!-- fetch arrows: hash value cells -> arr segments -->
  <path d="M 446 188 Q 280 230 130 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 491 188 Q 360 236 222 250" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 460 188 Q 400 234 322 250" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="540" y="232" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">按 arr[i] 查表，</text>
  <text x="540" y="246" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">取回整段 piece</text>

  <!-- arr scan -->
  <text x="44" y="280" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">arr =</text>
  <text x="117" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">取 [91]</text>
  <text x="216" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">取 [4,64]</text>
  <text x="315" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#sk)">取 [78]</text>
  <rect x="90" y="256" width="54" height="34" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="117" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#sk)">91</text>
  <rect x="156" y="256" width="54" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="183" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <rect x="222" y="256" width="54" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="249" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#sk)">64</text>
  <rect x="288" y="256" width="54" height="34" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="315" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#sk)">78</text>
  <text x="117" y="304" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">i=0</text>
  <text x="183" y="304" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">i=1</text>
  <text x="249" y="304" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">2</text>
  <text x="315" y="304" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">i=3</text>

  <!-- note box -->
  <rect x="30" y="316" width="580" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="340" text-anchor="middle" font-size="11.5" fill="#2f4a28" filter="url(#sk)">pieces 扁平化互不相同 → 首元素唯一，可作哈希键；</text>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" fill="#2f4a28" filter="url(#sk)">arr 互不相同 → 每一步取哪段完全确定，无分支、无回溯</text>
  <text x="320" y="380" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#sk)">一次线性扫描定答案 —— 签到题的最短路径</text>
</svg>
