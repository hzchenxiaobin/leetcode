<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="580" height="300" fill="#fafafa"/>
  <text x="290.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">同一个 DP，规模一放大就必须换优化方式</text>
  <text x="40.0" y="100.0" text-anchor="start" font-size="11" fill="#444444" filter="url(#rough2)">Q3 三重循环 Z·O·L</text>
  <rect x="39.5" y="108.2" width="133.6" height="22.0" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="188.0" y="124.0" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">8×10^6</text>
  <text x="262.0" y="124.0" text-anchor="start" font-size="10" fill="#888888" filter="url(#rough2)">limit=200，能过</text>
  <text x="40.0" y="162.0" text-anchor="start" font-size="11" fill="#444444" filter="url(#rough2)">Q4 前缀和 Z·O</text>
  <rect x="40.2" y="170.3" width="29.0" height="22.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="83.0" y="186.0" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">1×10^6</text>
  <text x="157.0" y="186.0" text-anchor="start" font-size="10" fill="#888888" filter="url(#rough2)">limit=1000，秒过</text>
  <text x="40.0" y="224.0" text-anchor="start" font-size="11" fill="#444444" filter="url(#rough2)">Q4 若照抄三重循环</text>
  <rect x="39.5" y="231.9" width="406.9" height="22.4" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="461.0" y="248.0" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">1×10^9</text>
  <text x="535.0" y="248.0" text-anchor="start" font-size="10" fill="#888888" filter="url(#rough2)">必超时</text>
  <rect x="30.0" y="236.3" width="519.9" height="59.7" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290.0" y="261.0" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">状态数从 200×200 变成 1000×1000，枚举措辞的代价从 200 倍变成 1000 倍</text>
  <text x="290.0" y="279.0" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">把「枚举末段长度」换成「前缀和相减」，每格 O(1)，总复杂度只剩状态数</text>
</svg>
