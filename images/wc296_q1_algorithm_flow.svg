<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：原地折叠，写回 nums[i]，额外空间 O(1)</text>
  <path d="M 260 42 Q 470 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="425" cy="70" rx="48" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="425" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">开始</text>
  <path d="M 425 90 L 425 110" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- n = len -->
  <g filter="url(#sk)">
    <rect x="325" y="112" width="200" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="425" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">n ← nums.length</text>
  <path d="M 425 154 L 425 178" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="425,180 535,232 425,284 315,232" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="425" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">n == 1 ?</text>

  <!-- yes -> return -->
  <path d="M 535 232 L 632 232" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="566" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="636" y="210" width="196" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="734" y="237" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">返回 nums[0]</text>

  <!-- no -> for loop -->
  <path d="M 425 284 L 425 310" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="437" y="303" font-size="12" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="315" y="312" width="220" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="425" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">对每个 i ∈ [0, n/2) 递增</text>
  <path d="M 425 358 L 425 388" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 : i even? -->
  <g filter="url(#sk)">
    <polygon points="425,392 505,438 425,484 345,438" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="425" y="444" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">i 是偶数 ?</text>

  <!-- yes -> min -->
  <path d="M 345 438 L 292 438" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="318" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="62" y="414" width="228" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="176" y="443" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">nums[i] ← min(nums[2i], nums[2i+1])</text>

  <!-- no -> max -->
  <path d="M 505 438 L 550 438" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="528" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="554" y="414" width="248" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="678" y="443" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">nums[i] ← max(nums[2i], nums[2i+1])</text>

  <!-- join loop bottom -->
  <path d="M 176 462 L 176 502" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 678 462 L 678 502" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 176 506 L 678 506" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="425" y="524" text-anchor="middle" font-size="11" fill="#777">i ← i + 1，直到 i = n/2（本轮折叠完毕）</text>
  <path d="M 425 506 L 425 538" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- n <- n/2 -->
  <g filter="url(#sk)">
    <rect x="355" y="542" width="140" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="425" y="569" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">n ← n / 2</text>

  <!-- back edge to diamond 1 -->
  <path d="M 355 564 H 60 V 232 H 305" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="128" y="552" font-size="11" fill="#777">长度折半，进入下一轮</text>

  <!-- note box top-right -->
  <g filter="url(#sk)">
    <rect x="666" y="56" width="234" height="140" rx="10" fill="#fdf2f4" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="783" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">复杂度速览</text>
  <text x="682" y="110" font-size="12" fill="#444">轮数：log₂n ≤ 10</text>
  <text x="682" y="136" font-size="12" fill="#444">总运算：2n − 1 ≤ 2047</text>
  <text x="682" y="162" font-size="12" fill="#444">空间：O(1)（原地写回）</text>
  <text x="682" y="186" font-size="11" fill="#b85450" font-weight="bold">读 2i/2i+1 ≥ 写 i，不踩踏</text>
</svg>
