<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">恒等式：操作1的次数被操作2的次数唯一确定</text>
  <rect x="40" y="56" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="82.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">设操作2用了 K 次、操作1用了 M 次</text>
  <path d="M260,100 L260,126" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="126" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="152.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">「1」的数量守恒：ones(s2) = ones(s1) + M − 2K</text>
  <path d="M260,170 L260,196" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="196" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="222.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">总代价 = M + K = 3K + (ones(s2) − ones(s1))</text>
  <path d="M260,240 L260,266" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="266" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="292.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">所以只需最小化 K = Σ ceil(L/2)</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">每条 A 段：偶数长度 → L/2；奇数长度 → (L+1)/2（跨出去借一个邻居）</text>
</svg>
