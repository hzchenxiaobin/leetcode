<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：dp 逐行走查，最优路径 5 → 0 → 1</text>
  <path d="M 120 38 Q 320 46 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 列标签 -->
  <text x="97" y="60" text-anchor="middle" font-size="10" fill="#999">列 0</text>
  <text x="157" y="60" text-anchor="middle" font-size="10" fill="#999">列 1</text>

  <!-- 第 0 行：5, 3 -->
  <g filter="url(#sk)"><rect x="70" y="64" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="130" y="64" width="54" height="36" rx="4" fill="#f6f6f4" stroke="#b8b8b8" stroke-width="1.2"/></g>
  <text x="97" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">5</text>
  <text x="157" y="87" text-anchor="middle" font-size="14" fill="#777">3</text>
  <text x="62" y="86" text-anchor="end" font-size="10.5" fill="#888">第 0 行</text>

  <!-- 第 1 行：4, 0 -->
  <g filter="url(#sk)"><rect x="70" y="116" width="54" height="36" rx="4" fill="#f6f6f4" stroke="#b8b8b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="130" y="116" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="97" y="139" text-anchor="middle" font-size="14" fill="#777">4</text>
  <text x="157" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">0</text>
  <text x="62" y="138" text-anchor="end" font-size="10.5" fill="#888">第 1 行</text>

  <!-- 第 2 行：2, 1 -->
  <g filter="url(#sk)"><rect x="70" y="168" width="54" height="36" rx="4" fill="#f6f6f4" stroke="#b8b8b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="130" y="168" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="97" y="191" text-anchor="middle" font-size="14" fill="#777">2</text>
  <text x="157" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">1</text>
  <text x="62" y="190" text-anchor="end" font-size="10.5" fill="#888">第 2 行</text>

  <!-- 路径箭头 -->
  <path d="M 100 102 Q 118 112 151 117" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 157 152 L 157 167" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="172" y="110" font-size="10" fill="#2e5e2e">moveCost[5][1]=3</text>
  <text x="172" y="164" font-size="10" fill="#2e5e2e">moveCost[0][1]=8</text>

  <!-- 每行 dp 值 -->
  <text x="188" y="86" font-size="10.5" fill="#446688" font-family="monospace">dp=[5, 3]</text>
  <text x="188" y="138" font-size="10.5" fill="#446688" font-family="monospace">dp=[23, 8]</text>
  <text x="188" y="190" font-size="10.5" fill="#446688" font-family="monospace">dp=[19, 17]</text>

  <!-- 左侧小结 -->
  <text x="165" y="240" text-anchor="middle" font-size="11.5" fill="#333">值和 5+0+1 = 6</text>
  <text x="165" y="260" text-anchor="middle" font-size="11.5" fill="#333">移动和 3+8 = 11 → 总代价 <tspan font-weight="bold" fill="#4a7a3a">17</tspan></text>
  <text x="165" y="290" text-anchor="middle" font-size="10.5" fill="#888">首行任选出发、末行任选结束</text>

  <!-- 右侧：第 0 行 dp -->
  <g filter="url(#sk)"><rect x="300" y="64" width="310" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="455" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#33455e">第 0 行：dp = [5, 3]（= 格值，无移动）</text>

  <!-- 表 1：第 1 行 -->
  <text x="300" y="114" font-size="11.5" font-weight="bold" fill="#33455e">第 1 行：grid = [4, 0]，上一行值 grid[0] = [5, 3]</text>
  <g filter="url(#sk)"><rect x="300" y="120" width="310" height="20" fill="#eef2f8" stroke="#9fb2cc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="300" y="140" width="310" height="20" fill="#fcfcfa" stroke="#ccd6e4" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="300" y="160" width="310" height="20" fill="#fcfcfa" stroke="#ccd6e4" stroke-width="1"/></g>
  <text x="318" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">j</text>
  <text x="380" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">k=0 项</text>
  <text x="468" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">k=1 项</text>
  <text x="535" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">best</text>
  <text x="584" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">dp</text>
  <text x="318" y="154" text-anchor="middle" font-size="10.5" fill="#444">0</text>
  <text x="380" y="154" text-anchor="middle" font-size="10.5" fill="#444">5+14=19</text>
  <text x="468" y="154" text-anchor="middle" font-size="10.5" fill="#444">3+18=21</text>
  <text x="535" y="154" text-anchor="middle" font-size="10.5" fill="#444">19</text>
  <text x="584" y="154" text-anchor="middle" font-size="10.5" fill="#444">23</text>
  <text x="318" y="174" text-anchor="middle" font-size="10.5" fill="#444">1</text>
  <text x="380" y="174" text-anchor="middle" font-size="10.5" fill="#444">5+3=8</text>
  <text x="468" y="174" text-anchor="middle" font-size="10.5" fill="#444">3+6=9</text>
  <text x="535" y="174" text-anchor="middle" font-size="10.5" fill="#444">8</text>
  <text x="584" y="174" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040">8</text>

  <!-- 表 2：第 2 行 -->
  <text x="300" y="198" font-size="11.5" font-weight="bold" fill="#33455e">第 2 行：grid = [2, 1]，上一行值 grid[1] = [4, 0]</text>
  <g filter="url(#sk)"><rect x="300" y="204" width="310" height="20" fill="#eef2f8" stroke="#9fb2cc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="300" y="224" width="310" height="20" fill="#fcfcfa" stroke="#ccd6e4" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="300" y="244" width="310" height="20" fill="#fcfcfa" stroke="#ccd6e4" stroke-width="1"/></g>
  <text x="318" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">j</text>
  <text x="380" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">k=0 项</text>
  <text x="468" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">k=1 项</text>
  <text x="535" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">best</text>
  <text x="584" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">dp</text>
  <text x="318" y="238" text-anchor="middle" font-size="10.5" fill="#444">0</text>
  <text x="380" y="238" text-anchor="middle" font-size="10.5" fill="#444">23+2=25</text>
  <text x="468" y="238" text-anchor="middle" font-size="10.5" fill="#444">8+9=17</text>
  <text x="535" y="238" text-anchor="middle" font-size="10.5" fill="#444">17</text>
  <text x="584" y="238" text-anchor="middle" font-size="10.5" fill="#444">19</text>
  <text x="318" y="258" text-anchor="middle" font-size="10.5" fill="#444">1</text>
  <text x="380" y="258" text-anchor="middle" font-size="10.5" fill="#444">23+4=27</text>
  <text x="468" y="258" text-anchor="middle" font-size="10.5" fill="#444">8+8=16</text>
  <text x="535" y="258" text-anchor="middle" font-size="10.5" fill="#444">16</text>
  <text x="584" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">17</text>

  <text x="300" y="284" font-size="10" fill="#888">项 = dp[i−1][k] + moveCost[值 grid[i−1][k]][j]；如 5+14 = dp[0][0] + moveCost[5][0]</text>

  <!-- 答案框 -->
  <g filter="url(#sk)"><rect x="300" y="298" width="310" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="455" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">答案 = min(dp[2]) = min(19, 17) = 17</text>
  <text x="455" y="336" text-anchor="middle" font-size="10.5" fill="#555">对应路径 (0,0)=5 → (1,1)=0 → (2,1)=1</text>

  <text x="320" y="478" text-anchor="middle" font-size="10.5" fill="#888">观察：dp[1][1]=8（非 23）—— 最优路径在第 1 行「换列」，后续只认数值 8 续推，不问来路</text>
</svg>
