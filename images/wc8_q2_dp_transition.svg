<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">dp[j] |= dp[j − x]：容量 j 必须逆序枚举</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">一维滚动数组；逆序保证读到的 dp[j−x] 仍是「上一轮」的旧状态</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="64" y="70" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="112" y="70" width="48" height="36" fill="#f3f3f3" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="160" y="70" width="48" height="36" fill="#f3f3f3" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="208" y="70" width="48" height="36" fill="#f3f3f3" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="256" y="70" width="48" height="36" fill="#f3f3f3" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="304" y="70" width="48" height="36" fill="#f3f3f3" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="352" y="70" width="48" height="36" fill="#f3f3f3" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="400" y="70" width="48" height="36" fill="#f3f3f3" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="448" y="70" width="48" height="36" fill="#f3f3f3" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="88" y="94" fill="#3a5a30" font-weight="bold">T</text>
    <text x="136" y="94" fill="#888">F</text>
    <text x="184" y="94" fill="#888">F</text>
    <text x="232" y="94" fill="#888">F</text>
    <text x="280" y="94" fill="#888">F</text>
    <text x="328" y="94" fill="#888">F</text>
    <text x="376" y="94" fill="#888">F</text>
    <text x="424" y="94" fill="#888">F</text>
    <text x="472" y="94" fill="#888">F</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="88" y="120">0</text><text x="136" y="120">1</text><text x="184" y="120">2</text>
    <text x="232" y="120">3</text><text x="280" y="120">4</text><text x="328" y="120">5</text>
    <text x="376" y="120">6</text><text x="424" y="120">7</text><text x="472" y="120">8</text>
    <text x="280" y="138" fill="#777" font-size="10">j（容量）</text>
  </g>

  <path d="M 184 128 C 230 160, 286 160, 328 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="180" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">x = 3：从 dp[j−x] 读出旧值，写入 dp[j]</text>

  <rect x="40" y="196" width="228" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="54" y="217" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">逆序 j : target → x ✓</text>
  <text x="54" y="239" font-size="10" fill="#4a6a44" filter="url(#rough2)">dp[j−x] 尚未被 x 更新</text>
  <text x="54" y="258" font-size="10" fill="#4a6a44" filter="url(#rough2)">每个元素最多被选 1 次</text>
  <text x="54" y="279" font-size="10" fill="#7a8a70" filter="url(#rough2)">这正是 0-1 背包的写法</text>

  <rect x="292" y="196" width="228" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="306" y="217" font-size="11" fill="#a04844" font-weight="bold" filter="url(#rough2)">正序 j : x → target ✗</text>
  <text x="306" y="239" font-size="10" fill="#a05a56" filter="url(#rough2)">dp[j−x] 可能刚被 x 更新过</text>
  <text x="306" y="258" font-size="10" fill="#a05a56" filter="url(#rough2)">同一个 x 被重复选中</text>
  <text x="306" y="279" font-size="10" fill="#b08880" filter="url(#rough2)">退化成「完全背包」</text>

  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">反例 nums = [2,3,3]，target = 4：正序时 dp[4] 由 dp[2] 推出 true，正确结果是 false</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">target ≤ 10000 ⇒ char 数组仅 10 KB；用整数当 bitset 还能再快约 64 倍</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每轮结束若 dp[target] 已为真，即可提前返回 true</text>
</svg>
