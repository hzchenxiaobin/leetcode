<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 356"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="356" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">状态：长度 i、已用 j 首不同的歌</text>
  <rect x="90" y="74" width="480" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="102.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[i][j] = 前 i 个位置、恰好用了 j 首不同歌的方案数</text>
  <rect x="70" y="158" width="230" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="189.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最后一首是新歌</text>
  <rect x="360" y="158" width="230" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475.0" y="189.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最后一首是旧歌</text>
  <text x="185" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">新歌有 n−(j−1) 种选法</text>
  <text x="475" y="240" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">旧歌有 max(j−k, 0) 种（最近 k 首不能选）</text>
  <rect x="90" y="264" width="480" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="291.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[i][j] = dp[i−1][j−1]·(n−j+1) + dp[i−1][j]·max(j−k,0)</text>
  <text x="330" y="336" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">答案 dp[goal][n]：长度 goal 且 n 首歌都用上</text>
</svg>
