<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1：s = "abaacbaecebce"，p = "ba*c*ce"（A="ba", B="c", C="ce"）</text>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">答案 8：s[5..12] = "baecebce" = "ba" + "e" + "c" + "eb" + "ce"</text>

  <g filter="url(#rough2)">
    <rect x="44" y="66" width="40" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="86" y="66" width="40" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="128" y="66" width="40" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="170" y="66" width="40" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="212" y="66" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="254" y="66" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <rect x="296" y="66" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <rect x="338" y="66" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="380" y="66" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="422" y="66" width="40" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="464" y="66" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="506" y="66" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="548" y="66" width="40" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="64" y="91" fill="#666" filter="url(#rough2)">a</text>
    <text x="106" y="91" fill="#666" filter="url(#rough2)">b</text>
    <text x="148" y="91" fill="#666" filter="url(#rough2)">a</text>
    <text x="190" y="91" fill="#666" filter="url(#rough2)">a</text>
    <text x="232" y="91" fill="#3a5a30" filter="url(#rough2)">c</text>
    <text x="274" y="91" fill="#3a4a66" filter="url(#rough2)">b</text>
    <text x="316" y="91" fill="#3a4a66" filter="url(#rough2)">a</text>
    <text x="358" y="91" fill="#8a6a20" filter="url(#rough2)">e</text>
    <text x="400" y="91" fill="#3a5a30" filter="url(#rough2)">c</text>
    <text x="442" y="91" fill="#666" filter="url(#rough2)">e</text>
    <text x="484" y="91" fill="#8a3a36" filter="url(#rough2)">c</text>
    <text x="526" y="91" fill="#8a3a36" filter="url(#rough2)">e</text>
    <text x="568" y="91" fill="#666" filter="url(#rough2)">e</text>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#aaa">
    <text x="64" y="114" filter="url(#rough2)">0</text>
    <text x="106" y="114" filter="url(#rough2)">1</text>
    <text x="148" y="114" filter="url(#rough2)">2</text>
    <text x="190" y="114" filter="url(#rough2)">3</text>
    <text x="232" y="114" filter="url(#rough2)">4</text>
    <text x="274" y="114" filter="url(#rough2)">5</text>
    <text x="316" y="114" filter="url(#rough2)">6</text>
    <text x="358" y="114" filter="url(#rough2)">7</text>
    <text x="400" y="114" filter="url(#rough2)">8</text>
    <text x="442" y="114" filter="url(#rough2)">9</text>
    <text x="484" y="114" filter="url(#rough2)">10</text>
    <text x="526" y="114" filter="url(#rough2)">11</text>
    <text x="568" y="114" filter="url(#rough2)">12</text>
  </g>

  <rect x="252" y="128" width="338" height="20" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="421" y="160" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">绿色 = B("c") 的出现位置 4/8/11；红色 = C("ce") 的出现位置 8/11；蓝色 = A("ba") 的出现位置 0/5</text>

  <g filter="url(#rough2)">
    <rect x="44" y="178" width="556" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#3a4a66" font-weight="bold">
    <text x="58" y="196" filter="url(#rough2)">A 的起点 i</text>
    <text x="150" y="196" filter="url(#rough2)">h[i+2]（B…C 的最优右端）</text>
    <text x="352" y="196" filter="url(#rough2)">候选长度 = h[i+2] − i</text>
    <text x="530" y="196" filter="url(#rough2)">结论</text>
  </g>
  <g filter="url(#rough2)" font-size="10">
    <text x="58" y="226" fill="#666" filter="url(#rough2)">i = 0</text>
    <text x="150" y="226" fill="#444" filter="url(#rough2)">h[2] = 10（B 在 4，C 在 8）</text>
    <text x="352" y="226" fill="#444" filter="url(#rough2)">10 − 0 = 10</text>
    <text x="530" y="226" fill="#999" filter="url(#rough2)">—</text>
    <rect x="44" y="232" width="556" height="24" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
    <text x="58" y="249" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">i = 5</text>
    <text x="150" y="249" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">h[7] = 13（B 在 8，C 在 11）</text>
    <text x="352" y="249" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">13 − 5 = 8</text>
    <text x="530" y="249" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">最优 ✓</text>
  </g>

  <path d="M 320 262 L 320 280" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="44" y="284" width="556" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="58" y="304" font-size="10" fill="#3a5a30" filter="url(#rough2)">取 i = 5：子串 s[5..12] = "baecebce"，拆成 A="ba"(5,6) + X="e"(7) + B="c"(8) + Y="eb"(9,10) + C="ce"(11,12)，</text>
  <text x="58" y="322" font-size="10" fill="#3a5a30" filter="url(#rough2)">长度 2 + 1 + 1 + 2 + 2 = 8，正是答案。</text>

  <rect x="44" y="346" width="556" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="58" y="364" font-size="10" fill="#8a3a36" filter="url(#rough2)">示例 2：p = "cc*baa*adb" → C = "adb" 在 s = "baccbaadbc" 中根本不出现（minC 全为 ∞），</text>
  <text x="58" y="380" font-size="10" fill="#8a3a36" filter="url(#rough2)">于是 h 全为 ∞、答案 −1。这说明“无解”就等价于某个后缀模式无法按顺序出现。</text>
</svg>
