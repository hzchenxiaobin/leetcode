<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="540" height="300" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333">算法流程</text>

  <rect x="140" y="48" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="73" text-anchor="middle" font-size="12" fill="#333">一遍扫描：收集 letterPos / otherPos</text>
  <path d="M270,88 L270,112" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="112" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="137" text-anchor="middle" font-size="12" fill="#333">letterPos 首尾配对交换</text>
  <path d="M270,152 L270,176" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="176" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="201" text-anchor="middle" font-size="12" fill="#333">otherPos 首尾配对交换</text>
  <path d="M270,216 L270,240" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="240" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="265" text-anchor="middle" font-size="12" fill="#333">返回结果串，时间 O(n)</text>
</svg>
