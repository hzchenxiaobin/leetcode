<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1.5 L 7.5 4.5 L 1 7.5" fill="none" stroke="#8a7a4e" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：双 BFS 求直径 + O(1) 公式</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start box -->
  <g filter="url(#sk)">
    <rect x="170" y="54" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88" filter="url(#sk)">建邻接表 g₁（n 点）、g₂（m 点）</text>
  <path d="M 320 94 Q 320 108 190 122" fill="none" stroke="#8a7a4e" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 320 94 Q 320 108 450 122" fill="none" stroke="#8a7a4e" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- lane T1 -->
  <g filter="url(#sk)">
    <rect x="60" y="126" width="240" height="54" rx="8" fill="#f0f6fc" stroke="#446688" stroke-width="1.5"/>
    <rect x="60" y="208" width="240" height="54" rx="8" fill="#f0f6fc" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="180" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a88" filter="url(#sk)">T₁：从任意点 s 做 BFS¹</text>
  <text x="180" y="166" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">最远点 u —— 必是直径端点</text>
  <path d="M 180 180 L 180 202" fill="none" stroke="#8a7a4e" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="180" y="230" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a88" filter="url(#sk)">再从 u 做 BFS²</text>
  <text x="180" y="248" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">最大距离 = 直径 d₁</text>

  <!-- lane T2 -->
  <g filter="url(#sk)">
    <rect x="340" y="126" width="240" height="54" rx="8" fill="#f0f7ef" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="340" y="208" width="240" height="54" rx="8" fill="#f0f7ef" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="460" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">T₂：从任意点 s 做 BFS¹</text>
  <text x="460" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">最远点 u —— 必是直径端点</text>
  <path d="M 460 180 L 460 202" fill="none" stroke="#8a7a4e" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="460" y="230" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">再从 u 做 BFS²</text>
  <text x="460" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">最大距离 = 直径 d₂</text>

  <!-- converge -->
  <path d="M 180 262 Q 200 282 250 294" fill="none" stroke="#8a7a4e" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 460 262 Q 440 282 390 294" fill="none" stroke="#8a7a4e" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="110" y="298" width="420" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="320" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b06a10" filter="url(#sk)">ans = max( d₁ , d₂ , ⌈d₁/2⌉ + 1 + ⌈d₂/2⌉ )</text>
  <text x="320" y="340" text-anchor="middle" font-size="11" fill="#8a6d2e" filter="url(#sk)">交叉项 = 半径 + 新边 + 半径（r = ⌈d/2⌉）</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="60" y="366" width="520" height="58" rx="8" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="320" y="388" text-anchor="middle" font-size="11" fill="#a04038" filter="url(#sk)">为什么两次 BFS 就够：任取一点的最远点必是某条直径的端点（引理 2）</text>
  <text x="320" y="406" text-anchor="middle" font-size="11" fill="#a04038" filter="url(#sk)">所以第二次 BFS 的最大距离恰是直径；DFS 递归也行，但 10⁵ 长的链会爆栈，BFS 最稳</text>
</svg>
