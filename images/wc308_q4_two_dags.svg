<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 455" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="455" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：行、列条件是两张互相独立的 DAG，各排各的拓扑序</text>

  <!-- ===== 左：行 DAG ===== -->
  <g filter="url(#rough2)">
    <text x="145" y="52" text-anchor="middle" font-size="11.5" fill="#666">行条件 [[1,2],[3,2]] → 行 DAG（above → below）</text>
    <circle cx="85" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="85" y="125" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
    <circle cx="205" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="205" y="125" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">3</text>
    <circle cx="145" cy="208" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="145" y="213" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
    <path d="M 95 134 L 135 194" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
    <path d="M 195 134 L 155 194" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
    <text x="145" y="98" text-anchor="middle" font-size="10.5" fill="#888">上方</text>
    <text x="145" y="243" text-anchor="middle" font-size="10.5" fill="#888">下方</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="30" y="252" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="150" y="268" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">行拓扑序：1, 3, 2</text>
    <text x="150" y="284" text-anchor="middle" font-size="10.5" fill="#333">row[1]=0, row[3]=1, row[2]=2</text>
  </g>

  <!-- ===== 中缝 ===== -->
  <g filter="url(#rough2)">
    <path d="M 280 62 L 280 240" stroke="#999" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
    <text x="280" y="80" text-anchor="middle" font-size="10" fill="#999">互不影响</text>
  </g>

  <!-- ===== 右：列 DAG ===== -->
  <g filter="url(#rough2)">
    <text x="415" y="52" text-anchor="middle" font-size="11.5" fill="#666">列条件 [[2,1],[3,2]] → 列 DAG（left → right）</text>
    <circle cx="345" cy="120" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="345" y="125" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
    <circle cx="415" cy="120" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="415" y="125" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
    <circle cx="485" cy="120" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="485" y="125" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
    <path d="M 362 120 L 398 120" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>
    <path d="M 432 120 L 468 120" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>
    <text x="345" y="98" text-anchor="middle" font-size="10.5" fill="#888">左边</text>
    <text x="485" y="98" text-anchor="middle" font-size="10.5" fill="#888">右边</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="290" y="252" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="410" y="268" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">列拓扑序：3, 2, 1</text>
    <text x="410" y="284" text-anchor="middle" font-size="10.5" fill="#333">col[3]=0, col[2]=1, col[1]=2</text>
  </g>

  <!-- ===== 有环 / 无环 ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="310" width="245" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="152" y="330" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">有环 ⟹ 无解</text>
    <text x="152" y="348" text-anchor="middle" font-size="10.5" fill="#333">如 1→2→3→1 绕一圈要 row 严格</text>
    <text x="152" y="363" text-anchor="middle" font-size="10.5" fill="#333">递增，矛盾 → 返回空矩阵 []</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="285" y="310" width="245" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="407" y="330" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">无环 ⟹ 必有解</text>
    <text x="407" y="348" text-anchor="middle" font-size="10.5" fill="#333">拓扑序天然满足全部先后要求，</text>
    <text x="407" y="363" text-anchor="middle" font-size="10.5" fill="#333">出队次序 = 行 / 列下标</text>
  </g>

  <!-- ===== 落点公式 ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="388" width="500" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="280" y="409" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">落点公式：ans[row[v]][col[v]] = v —— 行答案与列答案自由拼装，拼出来都合法</text>
    <text x="280" y="428" text-anchor="middle" font-size="10.5" fill="#666">（判题为 Special Judge，任何合法矩阵都接受）</text>
  </g>
</svg>
