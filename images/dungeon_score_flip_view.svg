<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：得分条件分离变量，合法起点是一段后缀</text>

  <!-- derivation -->
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">从起点 j 走到房间 i（j ≤ i）共扣血 S[i] − S[j−1]，于是</text>
  <text x="260" y="74" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">房间 i 给分 ⟺ hp − (S[i] − S[j−1]) ≥ requirement[i]</text>
  <text x="260" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">⟺ hp + S[j−1] ≥ S[i] + requirement[i]</text>

  <!-- two-side boxes -->
  <rect x="36" y="110" width="196" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="128" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">起点侧：只随 j 变化（严格递增 ↗）</text>
  <text x="134" y="146" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">hp + S[j−1]</text>

  <text x="260" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">≥</text>

  <rect x="288" y="110" width="196" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="386" y="128" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">房间侧：只随 i 确定（与 j 无关）</text>
  <text x="386" y="146" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">T[i] = S[i] + requirement[i]</text>

  <!-- fixed room i, starts row -->
  <text x="260" y="176" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">固定房间 i（此处 i = 6）：起点越靠右，少吃的伤害越多 ⇒ 越容易达标</text>

  <rect x="91" y="192" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="214" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="149" y="192" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="214" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="207" y="192" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="214" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="265" y="192" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="214" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="323" y="192" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="347" y="214" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="381" y="192" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="214" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <path d="M 260 186 L 260 254" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="115" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="173" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="231" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="289" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="347" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="405" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="260" y="268" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">门槛 X = T[i] − hp</text>
  <text x="173" y="284" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">hp + S[j−1] &lt; T[i]，不达标</text>
  <text x="347" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">hp + S[j−1] ≥ T[i]，达标</text>

  <text x="260" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">合法起点 = 后缀 {k+1, …, i}，个数 = i − k；k 为 S 中首个 ≥ X 的下标</text>

  <!-- summary box -->
  <rect x="40" y="316" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">视角翻转：不逐起点算 score(j)，而是对每个房间 i</text>
  <text x="260" y="349" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">问「有多少起点能让你得分」——S 有序，二分即可</text>
</svg>
