<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="448" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：折半枚举（Meet in the Middle）</text>
  <path d="M 190 44 Q 380 52 570 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="380" y="62" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">对半切开</text>
  <text x="140" y="93" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">nums（n ≤ 40）</text>

  <g font-size="13">
    <g filter="url(#rough2)"><rect x="150" y="72" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="173" y="94" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">5</text>
    <g filter="url(#rough2)"><rect x="196" y="72" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="219" y="94" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">−7</text>
    <g filter="url(#rough2)"><rect x="242" y="72" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="265" y="94" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="288" y="72" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="311" y="94" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">5</text>
    <g filter="url(#rough2)"><rect x="334" y="72" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="357" y="94" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">2</text>
    <g filter="url(#rough2)"><rect x="403" y="72" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
    <text x="426" y="94" text-anchor="middle" fill="#8a6520" filter="url(#rough2)">8</text>
    <g filter="url(#rough2)"><rect x="449" y="72" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
    <text x="472" y="94" text-anchor="middle" fill="#8a6520" filter="url(#rough2)">−4</text>
    <g filter="url(#rough2)"><rect x="495" y="72" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
    <text x="518" y="94" text-anchor="middle" fill="#8a6520" filter="url(#rough2)">6</text>
    <g filter="url(#rough2)"><rect x="541" y="72" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
    <text x="564" y="94" text-anchor="middle" fill="#8a6520" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="587" y="72" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
    <text x="610" y="94" text-anchor="middle" fill="#8a6520" filter="url(#rough2)">9</text>
  </g>

  <path d="M 380 68 L 380 110" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <text x="265" y="127" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">左半 ≤ 20 个元素</text>
  <text x="495" y="127" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6520" filter="url(#rough2)">右半 ≤ 20 个元素</text>

  <path d="M 265 133 Q 240 152 214 166" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 495 133 Q 520 152 546 166" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="60" y="170" width="290" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="78" y="195" font-size="14" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">X：左半子集和</text>
  <text x="78" y="223" font-size="13" fill="#333" filter="url(#rough2)">{0, 5, −7, −2, …}</text>
  <text x="78" y="251" font-size="12" fill="#666" filter="url(#rough2)">共 2<tspan dy="-4" font-size="9.5">20</tspan><tspan dy="4"> ≈ 1.05×10</tspan><tspan dy="-4" font-size="9.5">6</tspan><tspan dy="4"> 个</tspan></text>
  <text x="78" y="275" font-size="10.5" fill="#888" filter="url(#rough2)">覆盖左半所有「选 / 不选」组合</text>

  <g filter="url(#rough2)"><rect x="410" y="170" width="290" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="428" y="195" font-size="14" font-weight="bold" fill="#8a6520" filter="url(#rough2)">Y：右半子集和（排序后）</text>
  <text x="428" y="223" font-size="13" fill="#333" filter="url(#rough2)">[0, 3, 5, 8, …]</text>
  <text x="428" y="251" font-size="12" fill="#666" filter="url(#rough2)">共 2<tspan dy="-4" font-size="9.5">20</tspan><tspan dy="4"> ≈ 1.05×10</tspan><tspan dy="-4" font-size="9.5">6</tspan><tspan dy="4"> 个</tspan></text>
  <text x="428" y="275" font-size="10.5" fill="#888" filter="url(#rough2)">有序 → 可二分查找</text>

  <path d="M 205 290 Q 235 318 298 323" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 555 290 Q 525 318 462 323" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="140" y="326" width="480" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="380" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">任意子序列的和 = x + y（x ∈ X，y ∈ Y）</text>
  <text x="380" y="374" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">目标：min |x + y − goal|</text>

  <g filter="url(#rough2)"><rect x="95" y="406" width="265" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="227" y="427" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a3a" filter="url(#rough2)">直接枚举 2<tspan dy="-4" font-size="9.5">40</tspan><tspan dy="4"> ≈ 1.1×10</tspan><tspan dy="-4" font-size="9.5">12</tspan><tspan dy="4"> ✗</tspan></text>
  <text x="380" y="427" text-anchor="middle" font-size="11" font-style="italic" fill="#999" filter="url(#rough2)">vs</text>
  <g filter="url(#rough2)"><rect x="400" y="406" width="265" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="532" y="427" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">折半 2×2<tspan dy="-4" font-size="9.5">20</tspan><tspan dy="4"> ≈ 2×10</tspan><tspan dy="-4" font-size="9.5">6</tspan><tspan dy="4"> ✓</tspan></text>
</svg>
