<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="700" height="480" fill="#fafafa"/>

  <text x="350" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">样例 4 演算：a = [18, 12, 24, 9, 6, 36]，n = 6</text>
  <text x="350" y="58" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">每个 l 找到 j*，权值是「以 l 开头且包含 j* 的子数组个数」</text>

  <!-- 表头 -->
  <rect x="26" y="96" width="648" height="46" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="124" text-anchor="middle" font-size="11.5" fill="#22335a" filter="url(#rough2)">l</text>
  <text x="130" y="124" text-anchor="middle" font-size="11.5" fill="#22335a" filter="url(#rough2)">a_l</text>
  <text x="222" y="124" text-anchor="middle" font-size="11.5" fill="#22335a" filter="url(#rough2)">j*（首个非倍数）</text>
  <text x="330" y="124" text-anchor="middle" font-size="11.5" fill="#22335a" filter="url(#rough2)">r = a_j* mod a_l</text>
  <text x="421" y="124" text-anchor="middle" font-size="11.5" fill="#22335a" filter="url(#rough2)">d</text>
  <text x="508" y="124" text-anchor="middle" font-size="11.5" fill="#22335a" filter="url(#rough2)">权重 n−j*+1</text>
  <text x="618" y="124" text-anchor="middle" font-size="11.5" fill="#22335a" filter="url(#rough2)">贡献</text>

  <!-- 行 1..6 -->
  <rect x="26" y="142" width="648" height="42" fill="#ffffff" stroke="#ccc"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">18</text>
  <text x="222" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <text x="421" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="508" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="618" y="169" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">30</text>

  <rect x="26" y="184" width="648" height="42" fill="#f5f8ff" stroke="#ccc"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="211" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="211" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <text x="222" y="211" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="330" y="211" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="421" y="211" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="508" y="211" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="618" y="211" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">9</text>

  <rect x="26" y="226" width="648" height="42" fill="#ffffff" stroke="#ccc"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="130" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">24</text>
  <text x="222" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="330" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="421" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="508" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="618" y="253" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">27</text>

  <rect x="26" y="268" width="648" height="42" fill="#f5f8ff" stroke="#ccc"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="130" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="222" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="330" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="421" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="508" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="618" y="295" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">6</text>

  <rect x="26" y="310" width="648" height="42" fill="#ffffff" stroke="#ccc"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="337" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="130" y="337" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="222" y="337" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">无</text>
  <text x="330" y="337" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">—</text>
  <text x="421" y="337" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="508" y="337" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">—</text>
  <text x="618" y="337" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>

  <rect x="26" y="352" width="648" height="42" fill="#f5f8ff" stroke="#ccc"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="379" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="130" y="379" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">36</text>
  <text x="222" y="379" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">无</text>
  <text x="330" y="379" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">—</text>
  <text x="421" y="379" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="508" y="379" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">—</text>
  <text x="618" y="379" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- 合计 -->
  <rect x="26" y="396" width="648" height="44" rx="6" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="424" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">合计 30 + 9 + 27 + 6 = 72</text>

  <text x="350" y="466" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">l=5 时 36 % 6 = 0，后缀全是 6 的倍数 ⇒ 没有降点，贡献 0</text>
</svg>
