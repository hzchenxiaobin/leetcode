<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">同色连续段计数：双方步数与策略无关</text>

  <!-- 连续段示意 1：AAABABB -->
  <text x="70" y="66" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">colors = AAABABB</text>
  <g filter="url(#rough2)">
    <rect x="70" y="76" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="100" y="76" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="130" y="76" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="76" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="190" y="76" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="76" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="250" y="76" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <text x="85" y="96">A</text><text x="115" y="96">A</text><text x="145" y="96">A</text>
    <text x="175" y="96">B</text><text x="205" y="96">A</text>
    <text x="235" y="96">B</text><text x="265" y="96">B</text>
  </g>
  <!-- 段括注 -->
  <g filter="url(#rough2)">
    <path d="M 72 116 C 90 128, 160 128, 178 116" fill="none" stroke="#446688" stroke-width="1.6"/>
    <path d="M 188 116 C 198 126, 212 126, 222 116" fill="none" stroke="#446688" stroke-width="1.6"/>
    <path d="M 222 116 C 240 128, 262 128, 278 116" fill="none" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <text x="125" y="144" fill="#33506e">AAA：L=3 → A 得 1 步</text>
    <text x="205" y="144" fill="#33506e">A：0</text>
    <text x="265" y="144" fill="#8a3a34">BB：0</text>
    <text x="175" y="144" fill="#8a3a34">B：0</text>
  </g>

  <!-- 连续段示意 2：ABBBBBBBAAA -->
  <text x="70" y="182" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">colors = ABBBBBBBAAA</text>
  <g filter="url(#rough2)">
    <rect x="70" y="192" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="96" y="192" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="122" y="192" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="148" y="192" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="174" y="192" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="200" y="192" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="226" y="192" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="252" y="192" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="278" y="192" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="304" y="192" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="330" y="192" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="83" y="212">A</text>
    <text x="109" y="212">B</text><text x="135" y="212">B</text><text x="161" y="212">B</text>
    <text x="187" y="212">B</text><text x="213" y="212">B</text><text x="239" y="212">B</text>
    <text x="265" y="212">B</text>
    <text x="291" y="212">A</text><text x="317" y="212">A</text><text x="343" y="212">A</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <text x="83" y="240" fill="#33506e">A：0</text>
    <text x="191" y="240" fill="#8a3a34">BBBBBBB：L=7 → B 得 5 步</text>
    <text x="317" y="240" fill="#33506e">AAA：L=3 → A 得 1 步</text>
  </g>

  <!-- 公式框 -->
  <rect x="60" y="262" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" font-size="13.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)" text-anchor="middle">长度 L 的同色段贡献 max(0, L − 2) 步（段内非端点）</text>

  <!-- 判定框 -->
  <rect x="60" y="318" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)" text-anchor="middle">a = Σ A段(L−2)，b = Σ B段(L−2)，Alice 胜 ⇔ a &gt; b</text>
</svg>
