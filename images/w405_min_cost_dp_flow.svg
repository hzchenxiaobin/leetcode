<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1.5 L 7.5 4.5 L 1 7.5" fill="none" stroke="#8a7a4e" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：前缀哈希 + 按长度分组 DP</text>
  <path d="M 120 40 Q 320 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="44" y="62" width="268" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="178" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b5a88">① 双哈希前缀  O(n)</text>
  <text x="60" y="110" font-size="11.5" fill="#333">pre[i] = hash(target[0:i])，幂表 pw[i] = Bⁱ</text>
  <text x="60" y="130" font-size="11.5" fill="#333">子串哈希 O(1)：</text>
  <text x="60" y="150" font-size="11.5" fill="#2b5a88">hash(target[j:i]) = pre[i] − pre[j]·pw[i−j]</text>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="328" y="62" width="268" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="462" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">② 按长度分桶  O(L)</text>
  <text x="344" y="110" font-size="11.5" fill="#333">桶键 = 长度 ℓ（ℓ &gt; n 丢弃）</text>
  <text x="344" y="130" font-size="11.5" fill="#333">桶内：哈希 → min(cost)</text>
  <text x="344" y="150" font-size="11.5" fill="#2e6e2e">重复单词自动合并为最便宜的</text>

  <path d="M 312 114 L 326 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="44" y="196" width="552" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="220" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b06a10">③ DP：位置为外层，长度为内层   O(n·K)</text>

  <text x="64" y="246" font-size="12" font-weight="bold" fill="#8a6d2e">外层 i = 1..n</text>
  <text x="64" y="268" font-size="12" fill="#8a6d2e">内层 ℓ ∈ 升序长度表（ℓ &gt; i 即 break）</text>
  <text x="64" y="290" font-size="12" fill="#8a6d2e">j = i − ℓ；c = 桶[ℓ].get(hash(target[j:i]))</text>
  <text x="64" y="312" font-size="12" fill="#8a6d2e">命中：f[i] = min(f[i], f[j] + c)</text>
  <text x="64" y="334" font-size="12" fill="#a04038">f[0] = 0，其余初始化 +∞</text>

  <!-- mini transition diagram -->
  <g filter="url(#sk)">
    <rect x="420" y="240" width="58" height="34" rx="6" fill="#eef7ef" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="514" y="240" width="58" height="34" rx="6" fill="#eef7ef" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="449" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">f[j]</text>
  <text x="543" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">f[i]</text>
  <path d="M 480 257 Q 497 247 512 253" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="496" y="243" text-anchor="middle" font-size="10.5" fill="#2e6e2e">+cost</text>
  <text x="496" y="296" text-anchor="middle" font-size="10.5" fill="#8a6d2e">子串 target[j:i] 恰为</text>
  <text x="496" y="312" text-anchor="middle" font-size="10.5" fill="#8a6d2e">某长度 ℓ 的单词</text>

  <!-- warning -->
  <g filter="url(#sk)">
    <rect x="44" y="356" width="552" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038">⚠ 顺序不可反：长度做外层时，短长度对 f[j] 的更新传不到长长度已写的 f[i]</text>
  <text x="320" y="391" text-anchor="middle" font-size="11" fill="#a04038">反例：target="abc"，words=["abc"/10, "a"/1, "bc"/1] → 正确 2，长度外层得 10</text>

  <!-- step 4 -->
  <g filter="url(#sk)">
    <rect x="180" y="416" width="280" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="320" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">④ 输出：f[n] 仍为 +∞ → 返回 −1</text>
  <text x="320" y="453" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">否则返回 f[n]（中途 +∞ 不影响）</text>
  <path d="M 178 168 L 178 192" stroke="#8a7a4e" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 462 168 L 462 192" stroke="#8a7a4e" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 598 300 Q 620 300 620 350 Q 620 410 464 428" stroke="#8a7a4e" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
</svg>
