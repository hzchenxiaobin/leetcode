<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="301" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：n = 10，七个 S(k) 多退少补</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header background -->
  <g filter="url(#sk)">
    <rect x="60" y="52" width="470" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>

  <!-- row separators -->
  <g stroke="#8a97a8" stroke-width="1.3" filter="url(#sk)">
    <path d="M 60 118 L 530 118"/>
    <path d="M 60 152 L 530 152"/>
    <path d="M 60 186 L 530 186"/>
    <path d="M 60 220 L 530 220"/>
    <path d="M 60 254 L 530 254"/>
    <path d="M 60 288 L 530 288"/>
  </g>
  <!-- column separators -->
  <g stroke="#8a97a8" stroke-width="1.3" filter="url(#sk)">
    <path d="M 115 52 L 115 322"/>
    <path d="M 170 52 L 170 322"/>
    <path d="M 300 52 L 300 322"/>
    <path d="M 440 52 L 440 322"/>
  </g>
  <!-- outer border -->
  <g filter="url(#sk)">
    <rect x="60" y="52" width="470" height="270" fill="none" stroke="#446688" stroke-width="2"/>
  </g>

  <!-- header text -->
  <text x="87" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">±</text>
  <text x="142" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">k</text>
  <text x="235" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">m=⌊10/k⌋</text>
  <text x="370" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">≤10 的 k 的倍数</text>
  <text x="485" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">S(k)</text>

  <!-- row 1 -->
  <text x="87" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">+</text>
  <text x="142" y="102" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">3</text>
  <text x="235" y="102" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">3</text>
  <text x="370" y="102" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">3, 6, 9</text>
  <text x="485" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">18</text>

  <!-- row 2 -->
  <text x="87" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">+</text>
  <text x="142" y="136" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">5</text>
  <text x="235" y="136" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="370" y="136" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">5, 10</text>
  <text x="485" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">15</text>

  <!-- row 3 -->
  <text x="87" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">+</text>
  <text x="142" y="170" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">7</text>
  <text x="235" y="170" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="370" y="170" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">7</text>
  <text x="485" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">7</text>

  <!-- row 4 -->
  <text x="87" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">−</text>
  <text x="142" y="204" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">15</text>
  <text x="235" y="204" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">0</text>
  <text x="370" y="204" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">—</text>
  <text x="485" y="204" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">0</text>

  <!-- row 5 -->
  <text x="87" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">−</text>
  <text x="142" y="238" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">21</text>
  <text x="235" y="238" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">0</text>
  <text x="370" y="238" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">—</text>
  <text x="485" y="238" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">0</text>

  <!-- row 6 -->
  <text x="87" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">−</text>
  <text x="142" y="272" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">35</text>
  <text x="235" y="272" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">0</text>
  <text x="370" y="272" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">—</text>
  <text x="485" y="272" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">0</text>

  <!-- row 7 -->
  <text x="87" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">+</text>
  <text x="142" y="306" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">105</text>
  <text x="235" y="306" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">0</text>
  <text x="370" y="306" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">—</text>
  <text x="485" y="306" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#sk)">0</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="60" y="338" width="470" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="295" y="359" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">ans = 18 + 15 + 7 − 0 − 0 − 0 + 0 = 40 ✓（示例 2）</text>
  <text x="295" y="379" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">n = 10 &lt; 15：交集项全为 0；n = 7 时 9 + 5 + 7 = 21 ✓（示例 1）</text>

  <!-- side note -->
  <g filter="url(#sk)">
    <rect x="548" y="52" width="84" height="140" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="590" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">n &lt; 15 时</text>
  <text x="590" y="94" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">四个交集项</text>
  <text x="590" y="112" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">的 m 全为 0</text>
  <text x="590" y="136" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">容斥退化为</text>
  <text x="590" y="154" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">直接相加</text>
  <text x="590" y="178" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">无重叠元素</text>
</svg>
