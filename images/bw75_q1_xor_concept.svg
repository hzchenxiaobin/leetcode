<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：异或把「不同的位」标成 1</text>

  <!-- start = 10 的二进制 -->
  <text x="120" y="72" font-size="14" fill="#446688" filter="url(#rough2)" text-anchor="end">start = 10</text>
  <g filter="url(#rough2)">
    <rect x="340" y="52" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="294" y="52" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="248" y="52" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="202" y="52" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="360" y="74">1</text><text x="314" y="74">0</text><text x="268" y="74">1</text><text x="222" y="74">0</text>
  </g>
  <text x="196" y="74" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="end">=</text>

  <!-- goal = 7 的二进制 -->
  <text x="120" y="130" font-size="14" fill="#446688" filter="url(#rough2)" text-anchor="end">goal = 7</text>
  <g filter="url(#rough2)">
    <rect x="340" y="110" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="294" y="110" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="248" y="110" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="202" y="110" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="360" y="132">0</text><text x="314" y="132">1</text><text x="268" y="132">1</text><text x="222" y="132">1</text>
  </g>

  <!-- 异或运算符 -->
  <path d="M 272 90 C 272 96, 272 100, 272 104" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="102" font-size="13" fill="#446688" filter="url(#rough2)">⊕</text>

  <!-- XOR 结果 -->
  <text x="104" y="188" font-size="14" fill="#446688" filter="url(#rough2)" text-anchor="end">start ⊕ goal</text>
  <g filter="url(#rough2)">
    <rect x="340" y="168" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="294" y="168" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="248" y="168" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="202" y="168" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="360" y="190" font-weight="bold">1</text><text x="314" y="190">0</text>
    <text x="268" y="190" font-weight="bold">1</text><text x="222" y="190">0</text>
  </g>
  <text x="400" y="190" font-size="12" fill="#888" filter="url(#rough2)">红色 = 两数不同</text>

  <!-- 弹出说明：只有 1 的位需要翻转 -->
  <path d="M 268 204 C 268 224, 268 232, 268 240" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="100" y="248" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="275" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">popcount(1101₂) = 3 → 最少翻转 3 次</text>

  <rect x="70" y="306" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="331" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">每位独立：0⊕0=0、1⊕1=0、0⊕1=1⊕0=1</text>
</svg>
