<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">算法流程：逐连通块二染色</text>
  <rect x="60" y="56" width="450" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285.0" y="82.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">建无向图：(a, b) 与 (b, a) 各一条边</text>
  <path d="M285 100 L285 128" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="130" width="450" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285.0" y="156.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">枚举未染色的 s，先染颜色 1 并入队</text>
  <path d="M285 174 L285 202" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="204" width="450" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285.0" y="231.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">BFS 扩散：邻居 v 必须染 3 - color[u]</text>
  <text x="285.0" y="251.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">v 已染色且与 u 同色 → 立刻返回 false</text>
  <path d="M285 270 L285 298" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="300" width="450" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285.0" y="326.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">所有连通块都无冲突 → 返回 true</text>
  <path d="M60 322 L26 322 L26 152 L54 152" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="32" y="244" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">继续</text>
  <text x="285" y="386" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">颜色 1 一组、颜色 2 一组，即为所求分组</text>
</svg>
