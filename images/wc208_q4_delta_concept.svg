<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：一条请求 = from 减 1、to 加 1</text>
  <path d="M 155 40 Q 320 48 485 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="170" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">① 一条请求的效果</text>
  <g filter="url(#sk)"><rect x="55" y="92" width="90" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="100" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">楼 0</text>
  <g filter="url(#sk)"><rect x="245" y="92" width="90" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="290" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">楼 1</text>
  <path d="M 148 108 L 241 108" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <text x="195" y="100" text-anchor="middle" font-size="11" fill="#b57a20" font-weight="bold" filter="url(#sk)">请求 [0,1]</text>
  <g filter="url(#sk)"><rect x="55" y="150" width="100" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="105" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">delta[0] −1</text>
  <g filter="url(#sk)"><rect x="245" y="150" width="100" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="295" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">delta[1] +1</text>
  <text x="170" y="210" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">员工从 from 出、进 to，</text>
  <text x="170" y="228" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">两栋楼人数一减一加</text>
  <text x="170" y="256" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">（自环 [x,x] 原地抵消，delta 不变）</text>

  <path d="M 316 60 L 316 310" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5 5" fill="none" filter="url(#sk)"/>

  <text x="478" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">② 闭环请求组：每栋楼一进一出</text>
  <g filter="url(#sk)"><rect x="445" y="86" width="90" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="490" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">楼 0</text>
  <g filter="url(#sk)"><rect x="385" y="196" width="90" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="430" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">楼 1</text>
  <g filter="url(#sk)"><rect x="525" y="196" width="90" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="570" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">楼 2</text>

  <path d="M 462 132 Q 415 152 412 190" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <text x="408" y="158" text-anchor="end" font-size="11" fill="#b57a20" font-weight="bold" filter="url(#sk)">0→1</text>
  <path d="M 480 216 L 518 216" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <text x="499" y="208" text-anchor="middle" font-size="11" fill="#b57a20" font-weight="bold" filter="url(#sk)">1→2</text>
  <path d="M 562 190 Q 548 152 520 122" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <text x="572" y="158" text-anchor="start" font-size="11" fill="#b57a20" font-weight="bold" filter="url(#sk)">2→0</text>

  <g filter="url(#sk)"><rect x="352" y="252" width="266" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="485" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">选 {0→1, 1→2, 2→0} 三条</text>
  <text x="485" y="287" text-anchor="middle" font-size="10.5" fill="#3a5a2a" filter="url(#sk)">楼0: −1+1 = 0 ✓   楼1: −1+1 = 0 ✓</text>
  <text x="485" y="303" text-anchor="middle" font-size="10.5" fill="#3a5a2a" filter="url(#sk)">楼2: −1+1 = 0 ✓ → 这三条全选可行</text>

  <g filter="url(#sk)"><rect x="40" y="336" width="560" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="320" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">可行 ⟺ 选出的请求让每栋楼 delta[b] = 0</text>
  <text x="320" y="378" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">只看每栋楼的进出计数，与员工如何“配对交换”无关</text>
</svg>
