<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="800" height="470" fill="#fdfcf7"/>
  <text x="400" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：时间轴上只有「到达」和「完成」两类事件</text>
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">tasks = [[1,2],[2,4],[3,2],[4,1]] → 输出 [0, 2, 3, 1]</text>

  <!-- 执行条（甘特） -->
  <g filter="url(#sk)">
    <rect x="154" y="64" width="128" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="218" y="85" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">#0（2s）</text>
  <g filter="url(#sk)">
    <rect x="282" y="64" width="128" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="346" y="85" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">#2（2s）</text>
  <g filter="url(#sk)">
    <rect x="410" y="64" width="64" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="442" y="85" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">#3（1s）</text>
  <g filter="url(#sk)">
    <rect x="474" y="64" width="256" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="602" y="85" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04038" filter="url(#sk)">#1（4s）</text>

  <!-- 到达标记 -->
  <text x="154" y="112" text-anchor="middle" font-size="9" fill="#2a4a6a" filter="url(#sk)">#0 到达</text>
  <path d="M 149,118 L 159,118 L 154,129 Z" fill="#446688" filter="url(#sk)"/>
  <text x="218" y="112" text-anchor="middle" font-size="9" fill="#a04038" filter="url(#sk)">#1 到达</text>
  <path d="M 213,118 L 223,118 L 218,129 Z" fill="#b85450" filter="url(#sk)"/>
  <text x="282" y="112" text-anchor="middle" font-size="9" fill="#2e6e2e" filter="url(#sk)">#2 到达</text>
  <path d="M 277,118 L 287,118 L 282,129 Z" fill="#4a7a3a" filter="url(#sk)"/>
  <text x="342" y="112" text-anchor="middle" font-size="9" fill="#7a5415" filter="url(#sk)">#3 到达</text>
  <path d="M 337,118 L 347,118 L 342,129 Z" fill="#d6a040" filter="url(#sk)"/>

  <!-- 时间轴 -->
  <path d="M 76,136 H 738" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.2">
    <path d="M 90,136 V 142"/><path d="M 154,136 V 142"/><path d="M 218,136 V 142"/><path d="M 282,136 V 142"/>
    <path d="M 346,136 V 142"/><path d="M 410,136 V 142"/><path d="M 474,136 V 142"/><path d="M 538,136 V 142"/>
    <path d="M 602,136 V 142"/><path d="M 666,136 V 142"/><path d="M 730,136 V 142"/>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#555" text-anchor="middle">
    <text x="90" y="156">0</text><text x="154" y="156">1</text><text x="218" y="156">2</text><text x="282" y="156">3</text>
    <text x="346" y="156">4</text><text x="410" y="156">5</text><text x="474" y="156">6</text><text x="538" y="156">7</text>
    <text x="602" y="156">8</text><text x="666" y="156">9</text><text x="730" y="156">10</text>
  </g>

  <!-- 选择点连线 -->
  <circle cx="154" cy="162" r="3" fill="#446688" filter="url(#sk)"/>
  <path d="M 154,164 L 164,242" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <circle cx="282" cy="162" r="3" fill="#4a7a3a" filter="url(#sk)"/>
  <path d="M 282,164 L 344,242" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <circle cx="410" cy="162" r="3" fill="#d6a040" filter="url(#sk)"/>
  <path d="M 410,164 L 524,242" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <circle cx="474" cy="162" r="3" fill="#b85450" filter="url(#sk)"/>
  <path d="M 474,164 L 704,242" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>

  <!-- 事件卡片 -->
  <g filter="url(#sk)">
    <rect x="84" y="246" width="160" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="164" y="268" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">t=1 → 执行 #0</text>
  <text x="164" y="288" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">堆空：time 0⇢1 快进</text>
  <text x="164" y="306" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">#0 入堆即被选中</text>
  <text x="164" y="324" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">就绪堆 {(2,#0)}</text>

  <g filter="url(#sk)">
    <rect x="264" y="246" width="160" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="344" y="268" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">t=3 → 执行 #2</text>
  <text x="344" y="288" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">#0 完成；#1(4s)、#2(2s)</text>
  <text x="344" y="306" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">已就绪，proc 短者胜</text>
  <text x="344" y="324" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">堆 {(2,#2),(4,#1)}</text>

  <g filter="url(#sk)">
    <rect x="444" y="246" width="160" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="524" y="268" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">t=5 → 执行 #3</text>
  <text x="524" y="288" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">#2 完成；#3（t=4 到达）</text>
  <text x="524" y="306" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">1s 最短，胜过 4s 的 #1</text>
  <text x="524" y="324" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">堆 {(1,#3),(4,#1)}</text>

  <g filter="url(#sk)">
    <rect x="624" y="246" width="160" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="704" y="268" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04038" filter="url(#sk)">t=6 → 执行 #1</text>
  <text x="704" y="288" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">#3 完成；仅剩 (4,#1)</text>
  <text x="704" y="306" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">无新任务（ptr = n）</text>
  <text x="704" y="324" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">执行到 t=10 后空闲</text>

  <!-- 结果条 -->
  <text x="248" y="404" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">处理顺序</text>
  <g filter="url(#sk)">
    <rect x="264" y="378" width="52" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="290" y="404" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">0</text>
  <path d="M 320,398 L 356,398" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="364" y="378" width="52" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="390" y="404" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <path d="M 420,398 L 456,398" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="464" y="378" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="490" y="404" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <path d="M 520,398 L 556,398" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="564" y="378" width="52" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="590" y="404" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04038" filter="url(#sk)">1</text>
  <text x="632" y="396" font-size="10" fill="#555" filter="url(#sk)">t=10 完成 #1，CPU 空闲</text>

  <!-- 底部提示 -->
  <text x="400" y="446" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04038" filter="url(#sk)">注意 t=3：#2 恰在 #0 完成时刻到达并同刻被选 —— enq ≤ time 的等号不可少</text>
</svg>
