<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：三数组预处理 + O(1) 应答</text>

  <!-- 步骤框 -->
  <g filter="url(#rough2)">
    <rect x="30" y="56" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="200" y="56" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="370" y="56" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="105" y="80" fill="#2d5a22" font-weight="bold">① pre 前缀和</text>
    <text x="105" y="98" fill="#2d5a22">pre[i+1] = pre[i]</text>
    <text x="105" y="112" fill="#2d5a22">+ (s[i]=='*')</text>
    <text x="275" y="80" fill="#2d5a22" font-weight="bold">② left 最近蜡烛</text>
    <text x="275" y="98" fill="#2d5a22">正向递推</text>
    <text x="275" y="112" fill="#2d5a22">s[i]=='|' ? i : 左继承</text>
    <text x="445" y="80" fill="#2d5a22" font-weight="bold">③ right 最近蜡烛</text>
    <text x="445" y="98" fill="#2d5a22">反向递推</text>
    <text x="445" y="112" fill="#2d5a22">s[i]=='|' ? i : 右继承</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 180 87 L 196 87" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
    <path d="M 350 87 L 366 87" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
  </g>

  <!-- 查询应答框 -->
  <g filter="url(#rough2)">
    <rect x="110" y="146" width="340" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5c1e" text-anchor="middle">
    <text x="280" y="170" font-weight="bold">查询 [l, r]：a = right[l]，b = left[r]</text>
    <text x="280" y="192">ans = (a &lt; b) ? pre[b] − pre[a+1] : 0</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 280 122 L 280 142" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
  </g>

  <!-- 复杂度 -->
  <g filter="url(#rough2)">
    <rect x="110" y="234" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="261" font-size="13" fill="#33506e" font-weight="bold" filter="url(#rough2)" text-anchor="middle">预处理 O(n) + 每查询 O(1)，总计 O(n + q)</text>
</svg>
