<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="330" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：target = 12，按位置从前往后逐车判定</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只有 t 严格大于 cur 才开新车队；否则说明会被前方车队挡住</text>
  <rect x="30" y="90" width="126" height="27" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="93" y="107.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">position / speed</text>
  <rect x="156" y="90" width="54" height="27" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="107.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">t</text>
  <rect x="210" y="90" width="112" height="27" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="107.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">更新后 cur</text>
  <rect x="322" y="90" width="112" height="27" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="107.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">与旧 cur 比较</text>
  <rect x="434" y="90" width="92" height="27" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="480" y="107.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">新车队？</text>
  <rect x="526" y="90" width="76" height="27" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="564" y="107.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">车队数</text>
  <rect x="30" y="117" width="126" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
