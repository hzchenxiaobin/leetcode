  <rect x="156" y="117" width="54" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="134.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="210" y="117" width="112" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="134.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cur = 1</text>
  <rect x="322" y="117" width="112" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="134.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">首车</text>
  <rect x="434" y="117" width="92" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
