  <rect x="526" y="117" width="76" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="564" y="134.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="30" y="144" width="126" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="93" y="161.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">8 / 4</text>
  <rect x="156" y="144" width="54" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="161.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="210" y="144" width="112" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="161.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cur = 1</text>
  <rect x="322" y="144" width="112" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="161.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1 &gt; 1 否</text>
  <rect x="434" y="144" width="92" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="480" y="161.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="526" y="144" width="76" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="564" y="161.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="30" y="171" width="126" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="93" y="188.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">5 / 1</text>
  <rect x="156" y="171" width="54" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="188.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="210" y="171" width="112" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="188.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cur = 7</text>
  <rect x="322" y="171" width="112" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="188.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">7 &gt; 1 是</text>
  <rect x="434" y="171" width="92" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="480" y="188.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="526" y="171" width="76" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="564" y="188.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="30" y="198" width="126" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="93" y="215.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3 / 3</text>
  <rect x="156" y="198" width="54" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="215.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="210" y="198" width="112" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="215.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cur = 7</text>
  <rect x="322" y="198" width="112" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="215.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3 &gt; 7 否</text>
  <rect x="434" y="198" width="92" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="480" y="215.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="526" y="198" width="76" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="564" y="215.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="30" y="225" width="126" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="93" y="242.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0 / 1</text>
  <rect x="156" y="225" width="54" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="242.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">12</text>
  <rect x="210" y="225" width="112" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="242.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cur = 12</text>
  <rect x="322" y="225" width="112" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="242.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">12 &gt; 7 是</text>
  <rect x="434" y="225" width="92" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="480" y="242.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="526" y="225" width="76" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="564" y="242.3" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="30" y="262" width="556" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="40" y="280" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">8 号车 t 与 10 号车相同 → 同时到达，不再单独计一个车队；</text>
  <text x="40" y="294.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">3 号车 t = 3 小于 cur = 7，说明它中途被 5 号车挡住，同样不计数。</text>
</svg>
