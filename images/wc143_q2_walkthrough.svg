<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：每轮套一次闭式，最后反转路径</text>

  <text x="40" y="60" font-size="11.5" fill="#33475f" font-weight="bold" filter="url(#rough2)">panel A：label = 26（从第 5 层出发）</text>
  <rect x="40" y="70" width="544" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="68.0" y="85" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">轮</text>
  <text x="127.0" y="85" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">当前 x</text>
  <text x="181.0" y="85" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">h</text>
  <text x="330.0" y="85" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2^(h−1) + 2^(h−2) − 1 − ⌊x/2⌋</text>
  <text x="520.0" y="85" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">新 x</text>
  <rect x="40" y="94" width="544" height="20" fill="#e8f0fe" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="68.0" y="108" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">1</text>
  <text x="127.0" y="108" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">26</text>
  <text x="181.0" y="108" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">5</text>
  <text x="330.0" y="108" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">16 + 8 − 1 − 13 = 10</text>
  <text x="520.0" y="108" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">10</text>
  <rect x="40" y="117" width="544" height="20" fill="#ffffff" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="68.0" y="131" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">2</text>
  <text x="127.0" y="131" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">10</text>
  <text x="181.0" y="131" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">4</text>
  <text x="330.0" y="131" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">8 + 4 − 1 − 5 = 6</text>
  <text x="520.0" y="131" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">6</text>
  <rect x="40" y="140" width="544" height="20" fill="#e8f0fe" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="68.0" y="154" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">3</text>
  <text x="127.0" y="154" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">6</text>
  <text x="181.0" y="154" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">3</text>
  <text x="330.0" y="154" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">4 + 2 − 1 − 3 = 2</text>
  <text x="520.0" y="154" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">2</text>
  <rect x="40" y="163" width="544" height="20" fill="#ffffff" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="68.0" y="177" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">4</text>
  <text x="127.0" y="177" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">2</text>
  <text x="181.0" y="177" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">2</text>
  <text x="330.0" y="177" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">2 + 1 − 1 − 1 = 1</text>
  <text x="520.0" y="177" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">1</text>
  <rect x="40" y="186" width="544" height="20" fill="#e8f0fe" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="68.0" y="200" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">5</text>
  <text x="127.0" y="200" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">1</text>
  <text x="181.0" y="200" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">1</text>
  <text x="330.0" y="200" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">h == 1，停止循环</text>
  <text x="520.0" y="200" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">—</text>
  <text x="60" y="219" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">收集到 26, 10, 6, 2, 1 → 反转后 path = [1, 2, 6, 10, 26]</text>

  <text x="40" y="252" font-size="11.5" fill="#33475f" font-weight="bold" filter="url(#rough2)">panel B：label = 14（从第 4 层出发）</text>
  <rect x="40" y="262" width="544" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="68.0" y="277" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">轮</text>
  <text x="127.0" y="277" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">当前 x</text>
  <text x="181.0" y="277" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">h</text>
  <text x="330.0" y="277" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2^(h−1) + 2^(h−2) − 1 − ⌊x/2⌋</text>
  <text x="520.0" y="277" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">新 x</text>
  <rect x="40" y="286" width="544" height="20" fill="#e8f0fe" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="68.0" y="300" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">1</text>
  <text x="127.0" y="300" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">14</text>
  <text x="181.0" y="300" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">4</text>
  <text x="330.0" y="300" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">8 + 4 − 1 − 7 = 4</text>
  <text x="520.0" y="300" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">4</text>
  <rect x="40" y="309" width="544" height="20" fill="#ffffff" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="68.0" y="323" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">2</text>
  <text x="127.0" y="323" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">4</text>
  <text x="181.0" y="323" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">3</text>
  <text x="330.0" y="323" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">4 + 2 − 1 − 2 = 3</text>
  <text x="520.0" y="323" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">3</text>
  <rect x="40" y="332" width="544" height="20" fill="#e8f0fe" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="68.0" y="346" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">3</text>
  <text x="127.0" y="346" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">3</text>
  <text x="181.0" y="346" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">2</text>
  <text x="330.0" y="346" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">2 + 1 − 1 − 1 = 1</text>
  <text x="520.0" y="346" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">1</text>
  <rect x="40" y="355" width="544" height="20" fill="#ffffff" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="68.0" y="369" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">4</text>
  <text x="127.0" y="369" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">1</text>
  <text x="181.0" y="369" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">1</text>
  <text x="330.0" y="369" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">h == 1，停止循环</text>
  <text x="520.0" y="369" text-anchor="middle" font-size="10" fill="#44546a" filter="url(#rough2)">—</text>
  <text x="60" y="388" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">收集到 14, 4, 3, 1 → 反转后 path = [1, 3, 4, 14]</text>

  <text x="310" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：公式里的 h 是「当前节点」所在层，每上移一层 h 减 1，与 x 的更新同轮完成</text>

</svg>
