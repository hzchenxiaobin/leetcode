<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例演算：[0,0]×[4,4] 内数出 3 艘船</text>

  <!-- 5×5 网格（坐标 0..4），格子 56px -->
  <g stroke="#bbb" stroke-width="1">
    <rect x="80" y="110" width="280" height="280" fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
    <line x1="136" y1="110" x2="136" y2="390" filter="url(#rough2)"/>
    <line x1="192" y1="110" x2="192" y2="390" filter="url(#rough2)"/>
    <line x1="248" y1="110" x2="248" y2="390" filter="url(#rough2)"/>
    <line x1="304" y1="110" x2="304" y2="390" filter="url(#rough2)"/>
    <line x1="80" y1="166" x2="360" y2="166" filter="url(#rough2)"/>
    <line x1="80" y1="222" x2="360" y2="222" filter="url(#rough2)"/>
    <line x1="80" y1="278" x2="360" y2="278" filter="url(#rough2)"/>
    <line x1="80" y1="334" x2="360" y2="334" filter="url(#rough2)"/>
  </g>

  <!-- 切分中线：介于 2 与 3 之间 -->
  <line x1="276" y1="110" x2="276" y2="390" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="8 5" filter="url(#rough2)"/>
  <line x1="80" y1="306" x2="360" y2="306" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="8 5" filter="url(#rough2)"/>
  <text x="276" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">xm = 2（中线）</text>
  <text x="70" y="306" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ym = 2</text>

  <!-- 坐标标签 -->
  <g font-size="12" fill="#666">
    <text x="108" y="406" text-anchor="middle" filter="url(#rough2)">x=0</text>
    <text x="164" y="406" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="220" y="406" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="276" y="406" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="332" y="406" text-anchor="middle" filter="url(#rough2)">4</text>
  </g>
  <g font-size="12" fill="#666">
    <text x="70" y="142" text-anchor="end" filter="url(#rough2)">y=0</text>
    <text x="70" y="198" text-anchor="end" filter="url(#rough2)">1</text>
    <text x="70" y="254" text-anchor="end" filter="url(#rough2)">2</text>
    <text x="70" y="310" text-anchor="end" filter="url(#rough2)">3</text>
    <text x="70" y="366" text-anchor="end" filter="url(#rough2)">4</text>
  </g>

  <!-- 船 -->
  <circle cx="164" cy="198" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="182" y="196" font-size="12" fill="#4a7a3a" filter="url(#rough2)">(1,1)</text>
  <circle cx="220" cy="254" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="238" y="252" font-size="12" fill="#4a7a3a" filter="url(#rough2)">(2,2)</text>
  <circle cx="276" cy="310" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="294" y="308" font-size="12" fill="#4a7a3a" filter="url(#rough2)">(3,3)</text>

  <!-- 矩形外的船 -->
  <circle cx="420" cy="330" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="436" y="334" font-size="12" fill="#b85450" filter="url(#rough2)">(5,5) 在矩形外</text>
  <text x="436" y="350" font-size="12" fill="#b85450" filter="url(#rough2)">不参与计数</text>

  <!-- 象限标注 -->
  <rect x="82" y="112" width="192" height="192" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="178" y="134" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">左下 [0,2]×[0,2]：2 艘 → 继续</text>
  <rect x="278" y="112" width="80" height="192" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="318" y="130" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">右下</text>
  <text x="318" y="146" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">问 1 次即空</text>
  <rect x="82" y="308" width="192" height="80" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="178" y="348" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">左上：问 1 次即空</text>
  <rect x="278" y="308" width="80" height="80" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="318" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">右上</text>
  <text x="318" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1 艘</text>

  <!-- 结果框 -->
  <rect x="420" y="80" width="190" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="515" y="106" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">左下 2 + 右上 1</text>
  <text x="515" y="130" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">输出 3</text>
  <text x="515" y="156" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每艘船沿一条</text>
  <text x="515" y="174" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">≈ log₂1000 ≈ 10 层的</text>
  <text x="515" y="192" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">活跃路径被定位到单格</text>
  <text x="515" y="216" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">本例实测 17 次询问</text>
</svg>
