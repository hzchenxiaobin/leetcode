<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">有效串结构唯一：插入数 = 3G − n，最小化组数即可</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: 有效串形态 ===== -->
  <text x="40" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">① 有效串 = "abc" 重复 G 次，长度恰为 3G</text>
  <g filter="url(#sk)"><rect x="60" y="96" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="78" y="119" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="100" y="96" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="118" y="119" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="140" y="96" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="158" y="119" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">c</text>
  <g filter="url(#sk)"><rect x="192" y="96" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="210" y="119" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="232" y="96" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="250" y="119" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="272" y="96" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="290" y="119" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">c</text>
  <g filter="url(#sk)"><rect x="324" y="96" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="342" y="119" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="364" y="96" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="382" y="119" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="404" y="96" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="422" y="119" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">c</text>
  <text x="452" y="120" font-size="14" fill="#888">……</text>
  <text x="118" y="152" text-anchor="middle" font-size="11" fill="#888">组 1</text>
  <text x="254" y="152" text-anchor="middle" font-size="11" fill="#888">组 2</text>
  <text x="386" y="152" text-anchor="middle" font-size="11" fill="#888">组 3</text>
  <g filter="url(#sk)"><rect x="520" y="96" width="170" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="605" y="119" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">长度 = 3G</text>
  <text x="716" y="112" font-size="10.5" fill="#888">G 组，每组恰 3 个字符</text>
  <text x="716" y="128" font-size="10.5" fill="#888">只有这一种有效形态</text>

  <!-- ===== Panel 2: word 作为子序列装入组 ===== -->
  <text x="40" y="190" font-size="13" font-weight="bold" fill="#2e6e2e">② word 必须是目标串的子序列（例：word = "abcacb"，n = 6）</text>
  <g filter="url(#sk)"><rect x="60" y="208" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="78" y="232" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="100" y="208" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="118" y="232" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="140" y="208" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="158" y="232" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">c</text>
  <g filter="url(#sk)"><rect x="200" y="208" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="218" y="232" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="240" y="208" width="36" height="38" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="258" y="232" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="280" y="208" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="298" y="232" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">c</text>
  <g filter="url(#sk)"><rect x="340" y="208" width="36" height="38" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="358" y="232" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="380" y="208" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="398" y="232" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="420" y="208" width="36" height="38" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="438" y="232" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">c</text>
  <text x="118" y="272" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">组 1 · 插 0 个</text>
  <text x="258" y="272" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">组 2 · 插 1 个</text>
  <text x="398" y="272" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">组 3 · 插 2 个</text>
  <text x="40" y="302" font-size="11" fill="#666"><tspan fill="#2b6e9e" font-weight="bold">蓝色实框</tspan> = word 原有字符　　<tspan fill="#c98a2b" font-weight="bold">橙色虚框</tspan> = 需要插入的字符</text>
  <g filter="url(#sk)"><rect x="620" y="208" width="280" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="760" y="234" text-anchor="middle" font-size="12.5" fill="#2e6e2e">插入数 = 3G − n = 9 − 6</text>
  <text x="760" y="258" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">= 3 ✓</text>

  <!-- ===== Panel 3: 三条事实 ===== -->
  <text x="40" y="346" font-size="13" font-weight="bold" fill="#7a5415">③ 三条事实，把「枚举插入」变成「只求组数」</text>
  <g filter="url(#sk)"><rect x="40" y="362" width="600" height="106" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="62" y="390" font-size="11.5" fill="#444">事实 1：有效串只有 ("abc")^G 一种形态（G 组），别无选择；</text>
  <text x="62" y="414" font-size="11.5" fill="#444">事实 2：插入只加字符、不删字符 ⇒ word 必须是 ("abc")^G 的子序列；</text>
  <text x="62" y="438" font-size="11.5" fill="#444">事实 3：插入数 = 3G − n；n 固定 ⇒ <tspan fill="#2e6e2e" font-weight="bold">最少插入 ⇔ 最小组数 G*</tspan>。</text>
  <g filter="url(#sk)"><rect x="664" y="362" width="236" height="106" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="686" y="392" font-size="12" fill="#7a5415" font-weight="bold">核心转化</text>
  <text x="686" y="418" font-size="11.5" fill="#444">别枚举插入方案，</text>
  <text x="686" y="440" font-size="11.5" fill="#444">只需求「能装下 word 的最小组数」</text>
  <text x="686" y="458" font-size="10.5" fill="#888">→ 数断点即可（见下图）</text>

  <!-- ===== 底部提示 ===== -->
  <g filter="url(#sk)"><rect x="40" y="486" width="860" height="46" rx="8" fill="#fdf2f3" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="62" y="514" font-size="11.5" fill="#444"><tspan font-weight="bold" fill="#7a2828">下一张图：</tspan>组内字符只能严格递增 ⇒ word[i] ≤ word[i−1] 处必须开新组 ⇒ G* = 1 + 断点数 D。</text>
</svg>
