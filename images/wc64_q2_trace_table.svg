<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：ip = 255.0.0.7，n = 10</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每步 s = min(lowbit(c), 2^⌊log₂m⌋)，前缀 p = 32 − log₂s</text>

  <rect x="30" y="60" width="560" height="122" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="9.5" fill="#666" font-weight="bold" text-anchor="middle">
    <text x="56" y="80">步</text>
    <text x="150" y="80">cur</text>
    <text x="243" y="80">lowbit(c)</text>
    <text x="332" y="80">2^⌊log₂m⌋</text>
    <text x="400" y="80">s</text>
    <text x="452" y="80">p</text>
    <text x="540" y="80">输出块</text>
  </g>
  <path d="M 40 88 H 580" stroke="#ccc" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <rect x="38" y="112" width="544" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10" fill="#333" text-anchor="middle">
    <text x="56" y="106">1</text>
    <text x="150" y="106">255.0.0.7</text>
    <text x="243" y="106">1</text>
    <text x="332" y="106">8</text>
    <text x="400" y="106">1</text>
    <text x="452" y="106">32</text>
    <text x="540" y="106">255.0.0.7/32</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#333" text-anchor="middle">
    <text x="56" y="132">2</text>
    <text x="150" y="132">255.0.0.8</text>
    <text x="243" y="132">8</text>
    <text x="332" y="132">8</text>
    <text x="400" y="132">8</text>
    <text x="452" y="132">29</text>
    <text x="540" y="132">255.0.0.8/29</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#333" text-anchor="middle">
    <text x="56" y="160">3</text>
    <text x="150" y="160">255.0.0.16</text>
    <text x="243" y="160">16</text>
    <text x="332" y="160">1</text>
    <text x="400" y="160">1</text>
    <text x="452" y="160">32</text>
    <text x="540" y="160">255.0.0.16/32</text>
  </g>
  <path d="M 40 172 H 580" stroke="#ccc" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="9" font-weight="bold" text-anchor="middle">
    <rect x="100" y="228" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="228" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="180" y="228" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="220" y="228" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="260" y="228" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="300" y="228" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="340" y="228" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="380" y="228" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="420" y="228" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="460" y="228" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="120" y="252" fill="#3a4a66">7</text>
    <text x="160" y="252" fill="#3a5a30">8</text>
    <text x="200" y="252" fill="#3a5a30">9</text>
    <text x="240" y="252" fill="#3a5a30">10</text>
    <text x="280" y="252" fill="#3a5a30">11</text>
    <text x="320" y="252" fill="#3a5a30">12</text>
    <text x="360" y="252" fill="#3a5a30">13</text>
    <text x="400" y="252" fill="#3a5a30">14</text>
    <text x="440" y="252" fill="#3a5a30">15</text>
    <text x="480" y="252" fill="#b85450">16</text>
  </g>

  <g filter="url(#rough2)" fill="none" stroke-width="1.4">
    <path d="M 100 288 V 278 H 140 V 288" stroke="#446688"/>
    <path d="M 140 288 V 278 H 460 V 288" stroke="#4a7a3a"/>
    <path d="M 460 288 V 278 H 500 V 288" stroke="#b85450"/>
  </g>
  <g filter="url(#rough2)" font-size="10" font-weight="bold" text-anchor="middle">
    <text x="120" y="304" fill="#446688">/32</text>
    <text x="300" y="304" fill="#4a7a3a">/29（8 个地址，整块吃掉）</text>
    <text x="480" y="304" fill="#b85450">/32</text>
  </g>
  <path d="M 96 210 H 504" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="506" y="213" font-size="9" fill="#999" filter="url(#rough2)">地址轴</text>

  <text x="36" y="336" font-size="10" fill="#555" filter="url(#rough2)">第 1 步：7 是奇数 ⇒ lowbit = 1，最多只覆盖自己一个地址，只能用 /32。</text>
  <text x="36" y="358" font-size="10" fill="#555" filter="url(#rough2)">第 2 步：8 可对齐到 8，且剩 9 个 ≥ 8 ⇒ 一次覆盖 8..15，得 /29，块最大。</text>
  <text x="36" y="380" font-size="10" fill="#555" filter="url(#rough2)">第 3 步：只剩地址 16 一个，/32 收尾，共 3 块。</text>
  <text x="36" y="402" font-size="10" fill="#b85450" filter="url(#rough2)">下界：首块必为 7/32（相邻地址不能同块），之后 9 个地址至少要 2 块 ⇒ 3 块已最优。</text>
</svg>
