<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">降序排序后「顶格」赋值，每座塔最多比前一座矮 1</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">maximumHeight = [2,3,4,3] → 排序 [4,3,3,2] → 赋值 [4,3,2,1]，总和 10</text>

  <rect x="60" y="70" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="95" y="90" text-anchor="middle" font-size="10" fill="#3a4a66">排序后</text>
  <rect x="136" y="70" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="171" y="90" text-anchor="middle" font-size="10" fill="#3a4a66">上限 b[i]</text>
  <rect x="212" y="70" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="257" y="90" text-anchor="middle" font-size="10" fill="#3a4a66">前一座 − 1</text>
  <rect x="308" y="70" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="348" y="90" text-anchor="middle" font-size="10" fill="#3a5a30">取较小者</text>
  <rect x="394" y="70" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="429" y="90" text-anchor="middle" font-size="10" fill="#8a6a20">累计和</text>

  <rect x="60" y="104" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="95" y="124" text-anchor="middle" font-size="12" fill="#666">1</text>
  <rect x="136" y="104" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="171" y="124" text-anchor="middle" font-size="12" fill="#666">4</text>
  <rect x="212" y="104" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="257" y="124" text-anchor="middle" font-size="11" fill="#999">∞（首座）</text>
  <rect x="308" y="104" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="348" y="124" text-anchor="middle" font-size="12" fill="#3a5a30">4</text>
  <rect x="394" y="104" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="429" y="124" text-anchor="middle" font-size="12" fill="#666">4</text>

  <rect x="60" y="138" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="95" y="158" text-anchor="middle" font-size="12" fill="#666">2</text>
  <rect x="136" y="138" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="171" y="158" text-anchor="middle" font-size="12" fill="#666">3</text>
  <rect x="212" y="138" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="257" y="158" text-anchor="middle" font-size="12" fill="#666">3</text>
  <rect x="308" y="138" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="348" y="158" text-anchor="middle" font-size="12" fill="#3a5a30">3</text>
  <rect x="394" y="138" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="429" y="158" text-anchor="middle" font-size="12" fill="#666">7</text>

  <rect x="60" y="172" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="95" y="192" text-anchor="middle" font-size="12" fill="#666">3</text>
  <rect x="136" y="172" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="171" y="192" text-anchor="middle" font-size="12" fill="#666">3</text>
  <rect x="212" y="172" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="257" y="192" text-anchor="middle" font-size="12" fill="#666">2</text>
  <rect x="308" y="172" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="348" y="192" text-anchor="middle" font-size="12" fill="#b85450">2</text>
  <rect x="394" y="172" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="429" y="192" text-anchor="middle" font-size="12" fill="#666">9</text>

  <rect x="60" y="206" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="95" y="226" text-anchor="middle" font-size="12" fill="#666">4</text>
  <rect x="136" y="206" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="171" y="226" text-anchor="middle" font-size="12" fill="#666">2</text>
  <rect x="212" y="206" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="257" y="226" text-anchor="middle" font-size="12" fill="#666">1</text>
  <rect x="308" y="206" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="348" y="226" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
  <rect x="394" y="206" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="429" y="226" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">10</text>

  <rect x="40" y="256" width="490" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="285" y="278" text-anchor="middle" font-size="11" fill="#8a6a20">为什么降序？大的先「顶格」占住，小的一定还有缝隙可用，绝不会反过来挤掉大的</text>

  <text x="280" y="312" text-anchor="middle" font-size="10.5" fill="#555">h[i] = min(b[i], h[i−1] − 1)；一旦 h[i] ≤ 0 就无解（高度是正整数）</text>
  <text x="280" y="332" text-anchor="middle" font-size="10.5" fill="#555">示例 3 [2,2,1]：排序 [2,2,1] → 2, 1, 0 → 返回 −1</text>
</svg>
