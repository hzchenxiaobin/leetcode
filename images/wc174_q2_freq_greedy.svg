<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：按频率降序，一次删掉最多的元素</text>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">选中一个值 = 删掉它的全部出现次数，所以「选谁」只看频率</text>

  <path d="M 88 96 L 88 300 L 492 300" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60" y="200" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">频率</text>

  <path d="M 88 110 L 492 110" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="446" y="100" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">一半 = 5</text>

  <rect x="108" y="148" width="48" height="152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="132" y="140" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">4 &lt; 5</text>
  <text x="132" y="320" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">值 3（4 次）</text>

  <rect x="198" y="186" width="48" height="114" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="222" y="178" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">4 + 3 = 7 ≥ 5</text>
  <text x="222" y="320" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">值 5（3 次）</text>

  <rect x="288" y="224" width="48" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="312" y="216" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="312" y="320" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">值 2（2 次）</text>

  <rect x="378" y="262" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="402" y="254" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="402" y="320" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">值 7（1 次）</text>

  <rect x="88" y="334" width="392" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="284" y="357" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">答案 k = 2：选 {3, 5}，删 4 + 3 = 7 ≥ 5</text>
</svg>
