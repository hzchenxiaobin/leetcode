<svg xmlns="http://www.w3.org/2000/svg" width="700" height="530" viewBox="0 0 700 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="530" fill="#fafafa"/>
  <text x="350" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：正确值 + 可达值集合 + 查表打分</text>
  <path d="M 160 38 Q 350 48 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左列：计算流水线 -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="340" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="210" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">① 解析 s</text>
  <text x="210" y="100" text-anchor="middle" font-size="10.5" fill="#446688">操作数数组 d[0..m−1]，运算符数组 e[0..m−2]</text>
  <path d="M 210 112 L 210 132" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="136" width="340" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="210" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">② 求正确答案 correct</text>
  <text x="210" y="174" text-anchor="middle" font-size="10.5" fill="#4a7a3a">按 '+' 切块 → 块内连乘 → 块间求和</text>
  <text x="210" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a">（「先乘后加」语义的直译）</text>
  <path d="M 210 198 L 210 218" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="222" width="340" height="74" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="210" y="242" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">③ 记忆化搜索 f(i, j)</text>
  <text x="210" y="260" text-anchor="middle" font-size="10.5" fill="#5c4512">枚举分割点 k ∈ [i, j)：</text>
  <text x="210" y="276" text-anchor="middle" font-size="10.5" fill="#5c4512">左集 f(i,k) ⊗ 右集 f(k+1,j)（e[k] 定 + 或 ×）</text>
  <text x="210" y="291" text-anchor="middle" font-size="10" fill="#5c4512">边界 f(i,i) = { d[i] }</text>
  <path d="M 210 296 L 210 316" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="320" width="340" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="210" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">④ 全集压成布尔表</text>
  <text x="210" y="358" text-anchor="middle" font-size="10.5" fill="#446688">present[v] = 1（v ≤ 1000 且 v ∈ f(0, m−1)）</text>
  <path d="M 210 376 L 210 396" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="400" width="340" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="210" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">⑤ 遍历 answers 打分</text>
  <text x="210" y="438" text-anchor="middle" font-size="10.5" fill="#4a7a3a">进入右侧判定链，累计 5 / 2 / 0 分</text>

  <!-- 左列 ⑤ → 右侧判定链 -->
  <path d="M 380 425 C 412 425 414 140 448 140" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 右列：打分判定链 -->
  <g filter="url(#sk)">
    <polygon points="545,100 640,140 545,180 450,140" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="545" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">a == correct ?</text>
  <path d="M 640 140 L 648 140" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="644" y="131" font-size="9" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="652" y="126" width="42" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="673" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">+5</text>

  <path d="M 545 180 L 545 218" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="553" y="202" font-size="9" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <polygon points="545,222 640,262 545,302 450,262" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="545" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">a ∈ present ?</text>
  <path d="M 640 262 L 648 262" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="644" y="253" font-size="9" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="652" y="248" width="42" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="673" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">+2</text>

  <path d="M 545 302 L 545 332" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="553" y="320" font-size="9" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="516" y="336" width="58" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="545" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">+0</text>

  <text x="545" y="392" text-anchor="middle" font-size="10.5" fill="#888">三项得分累加进总分</text>

  <!-- 底部警示 -->
  <g filter="url(#sk)">
    <rect x="40" y="466" width="620" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="350" y="486" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">⚠ 判定优先级固定：先 correct（5 分）→ 再可达集（2 分）→ 0 分</text>
  <text x="350" y="503" text-anchor="middle" font-size="10.5" fill="#b85450">错序也算出正确值的学生仍按 5 分计（见示例 3）</text>
</svg>
