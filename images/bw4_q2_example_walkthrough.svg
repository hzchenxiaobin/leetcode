<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：删元音保序重组，输出是输入的子序列</text>

  <g filter="url(#rough2)">
    <rect x="30" y="44" width="500" height="104" fill="#fff" stroke="#666" stroke-width="1.2" rx="10"/>
    <text x="46" y="66" font-size="11.5" fill="#3a4a66" font-weight="bold">示例 1：s = "leetcodeisacommunityforcoders"（29 个字符）</text>

    <g filter="url(#rough2)" font-size="12.5" font-weight="bold" text-anchor="middle">
      <text x="56"  y="94" fill="#333">l</text>
      <text x="72"  y="94" fill="#b85450">e</text>
      <text x="88"  y="94" fill="#b85450">e</text>
      <text x="104" y="94" fill="#333">t</text>
      <text x="120" y="94" fill="#333">c</text>
      <text x="136" y="94" fill="#b85450">o</text>
      <text x="152" y="94" fill="#333">d</text>
      <text x="168" y="94" fill="#b85450">e</text>
      <text x="184" y="94" fill="#b85450">i</text>
      <text x="200" y="94" fill="#333">s</text>
      <text x="216" y="94" fill="#b85450">a</text>
      <text x="232" y="94" fill="#333">c</text>
      <text x="248" y="94" fill="#b85450">o</text>
      <text x="264" y="94" fill="#333">m</text>
      <text x="280" y="94" fill="#333">m</text>
      <text x="296" y="94" fill="#b85450">u</text>
      <text x="312" y="94" fill="#333">n</text>
      <text x="328" y="94" fill="#b85450">i</text>
      <text x="344" y="94" fill="#333">t</text>
      <text x="360" y="94" fill="#333">y</text>
      <text x="376" y="94" fill="#333">f</text>
      <text x="392" y="94" fill="#b85450">o</text>
      <text x="408" y="94" fill="#333">r</text>
      <text x="424" y="94" fill="#333">c</text>
      <text x="440" y="94" fill="#b85450">o</text>
      <text x="456" y="94" fill="#333">d</text>
      <text x="472" y="94" fill="#b85450">e</text>
      <text x="488" y="94" fill="#333">r</text>
      <text x="504" y="94" fill="#333">s</text>
    </g>

    <g filter="url(#rough2)" font-size="8.5" text-anchor="middle">
      <text x="56"  y="112" fill="#4a7a3a">✓</text>
      <text x="72"  y="112" fill="#b85450">✗</text>
      <text x="88"  y="112" fill="#b85450">✗</text>
      <text x="104" y="112" fill="#4a7a3a">✓</text>
      <text x="120" y="112" fill="#4a7a3a">✓</text>
      <text x="136" y="112" fill="#b85450">✗</text>
      <text x="152" y="112" fill="#4a7a3a">✓</text>
      <text x="168" y="112" fill="#b85450">✗</text>
      <text x="184" y="112" fill="#b85450">✗</text>
      <text x="200" y="112" fill="#4a7a3a">✓</text>
      <text x="216" y="112" fill="#b85450">✗</text>
      <text x="232" y="112" fill="#4a7a3a">✓</text>
      <text x="248" y="112" fill="#b85450">✗</text>
      <text x="264" y="112" fill="#4a7a3a">✓</text>
      <text x="280" y="112" fill="#4a7a3a">✓</text>
      <text x="296" y="112" fill="#b85450">✗</text>
      <text x="312" y="112" fill="#4a7a3a">✓</text>
      <text x="328" y="112" fill="#b85450">✗</text>
      <text x="344" y="112" fill="#4a7a3a">✓</text>
      <text x="360" y="112" fill="#4a7a3a">✓</text>
      <text x="376" y="112" fill="#4a7a3a">✓</text>
      <text x="392" y="112" fill="#b85450">✗</text>
      <text x="408" y="112" fill="#4a7a3a">✓</text>
      <text x="424" y="112" fill="#4a7a3a">✓</text>
      <text x="440" y="112" fill="#b85450">✗</text>
      <text x="456" y="112" fill="#4a7a3a">✓</text>
      <text x="472" y="112" fill="#b85450">✗</text>
      <text x="488" y="112" fill="#4a7a3a">✓</text>
      <text x="504" y="112" fill="#4a7a3a">✓</text>
    </g>

    <text x="46" y="136" font-size="11" fill="#3a5a30" font-weight="bold">保序拼接 → "ltcdscmmntyfrcdrs"（17 个辅音保留，12 个元音被删）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="164" width="240" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
    <text x="46" y="188" font-size="11.5" fill="#8a3a36" font-weight="bold">示例 2：s = "aeiou"</text>
    <g filter="url(#rough2)" font-size="14" font-weight="bold">
      <text x="60" y="216" fill="#b85450">a</text>
      <text x="88" y="216" fill="#b85450">e</text>
      <text x="116" y="216" fill="#b85450">i</text>
      <text x="144" y="216" fill="#b85450">o</text>
      <text x="172" y="216" fill="#b85450">u</text>
    </g>
    <text x="46" y="244" font-size="10.5" fill="#8a3a36">全部是元音 → 输出空串 ""（0 个字符）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="290" y="164" width="240" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="306" y="188" font-size="11.5" fill="#3a5a30" font-weight="bold">边界自查：s = "xyz"</text>
    <g filter="url(#rough2)" font-size="14" font-weight="bold">
      <text x="320" y="216" fill="#3a5a30">x</text>
      <text x="348" y="216" fill="#3a5a30">y</text>
      <text x="376" y="216" fill="#3a5a30">z</text>
    </g>
    <text x="306" y="244" font-size="10.5" fill="#3a5a30">没有元音 → 原样输出 "xyz"</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="280" width="500" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="280" y="304" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">为什么"保留相对顺序"自动成立？</text>
    <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#555">从左到右扫，只在"否"分支追加字符 → t 中相邻两字符在 s 中的下标严格递增</text>
    <text x="280" y="348" text-anchor="middle" font-size="10.5" fill="#555">这正说明输出是输入的一个子序列（保留相对顺序、删除若干字符）</text>
    <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999">附：len(s) = 29，元音 12 个，len(t) = 29 − 12 = 17，恰好对上</text>
  </g>
</svg>
