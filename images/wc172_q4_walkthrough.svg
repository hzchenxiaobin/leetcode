<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 376" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="376" fill="#fafafa"/>

  <text x="310" y="27" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 5，ranges = [1, 2, 1, 0, 2, 1]</text>
  <text x="310" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">预处理得 reach = [3, 3, 5, 3, 5, 5]（tap 0 与 tap 1 同左端点 0，留更远的 3）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="62" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="60" y="90" width="500" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="60" y="120" width="500" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="60" y="150" width="500" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="60" y="180" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <line x1="130" y1="62" x2="130" y2="210" stroke="#bbb" stroke-width="1"/>
    <line x1="230" y1="62" x2="230" y2="210" stroke="#bbb" stroke-width="1"/>
    <line x1="320" y1="62" x2="320" y2="210" stroke="#bbb" stroke-width="1"/>
    <line x1="430" y1="62" x2="430" y2="210" stroke="#bbb" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#3a4a66">
    <text x="95" y="81">i</text>
    <text x="180" y="81">reach[i]</text>
    <text x="275" y="81">far</text>
    <text x="375" y="81">i == end ?</text>
    <text x="495" y="81">动作</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <text x="95" y="111">0</text>
    <text x="180" y="111">3</text>
    <text x="275" y="111">3</text>
    <text x="375" y="111">是</text>
    <text x="495" y="111">steps=1，end=3</text>

    <text x="95" y="141">1</text>
    <text x="180" y="141">3</text>
    <text x="275" y="141">3</text>
    <text x="375" y="141">否</text>
    <text x="495" y="141">继续扫描</text>

    <text x="95" y="171">2</text>
    <text x="180" y="171">5</text>
    <text x="275" y="171">5</text>
    <text x="375" y="171">否</text>
    <text x="495" y="171">far 扩到 5</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#3a5a30">
    <text x="95" y="201">3</text>
    <text x="180" y="201">3</text>
    <text x="275" y="201">5</text>
    <text x="375" y="201">是</text>
    <text x="495" y="201">steps=2，end=5</text>
  </g>

  <text x="310" y="226" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i = 4 不再被扫描：i = 3 结算后 end = 5 ≥ n，函数直接返回 2</text>

  <g filter="url(#rough2)">
    <text x="174" y="259" text-anchor="end" font-size="9.5" fill="#3a4a66">第 1 个：tap 1</text>
    <text x="174" y="287" text-anchor="end" font-size="9.5" fill="#3a5a30">第 2 个：tap 4</text>
    <rect x="180" y="248" width="204" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="316" y="276" width="204" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="390" y="259" font-size="9.5" fill="#3a4a66">盖到 3</text>
    <text x="526" y="287" font-size="9.5" fill="#3a5a30">盖到 5</text>

    <line x1="172" y1="300" x2="528" y2="300" stroke="#666" stroke-width="1.5"/>
    <line x1="180" y1="295" x2="180" y2="305" stroke="#666" stroke-width="1.1"/>
    <line x1="248" y1="295" x2="248" y2="305" stroke="#666" stroke-width="1.1"/>
    <line x1="316" y1="295" x2="316" y2="305" stroke="#666" stroke-width="1.1"/>
    <line x1="384" y1="295" x2="384" y2="305" stroke="#666" stroke-width="1.1"/>
    <line x1="452" y1="295" x2="452" y2="305" stroke="#666" stroke-width="1.1"/>
    <line x1="520" y1="295" x2="520" y2="305" stroke="#666" stroke-width="1.1"/>
    <text x="180" y="318" text-anchor="middle" font-size="9.5" fill="#666">0</text>
    <text x="248" y="318" text-anchor="middle" font-size="9.5" fill="#666">1</text>
    <text x="316" y="318" text-anchor="middle" font-size="9.5" fill="#666">2</text>
    <text x="384" y="318" text-anchor="middle" font-size="9.5" fill="#666">3</text>
    <text x="452" y="318" text-anchor="middle" font-size="9.5" fill="#666">4</text>
    <text x="520" y="318" text-anchor="middle" font-size="9.5" fill="#666">5</text>
  </g>

  <rect x="60" y="330" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="351" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">两步走完 0 → 3 → 5，答案 2；只选「最左」的 tap 0 反而要 3 步</text>
</svg>
