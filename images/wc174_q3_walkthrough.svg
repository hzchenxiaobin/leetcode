<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算：[1,2,3,4,5,6]，S = 21，答案 11 × 10 = 110</text>

  <!-- 边 -->
  <path d="M 280 82 L 190 116" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 82 L 370 116" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 190 140 L 140 174" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 190 140 L 240 174" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 370 140 L 410 174" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="263" y="58" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="280" y="75" fill="#3a4a66">1</text>
    <rect x="173" y="116" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="190" y="133" fill="#3a5a30">2</text>
    <rect x="353" y="116" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="370" y="133" fill="#3a4a66">3</text>
    <rect x="123" y="174" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="140" y="191" fill="#8a6a20">4</text>
    <rect x="223" y="174" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="240" y="191" fill="#8a6a20">5</text>
    <rect x="393" y="174" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="410" y="191" fill="#8a6a20">6</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#777">
    <text x="303" y="74">s=21</text>
    <text x="213" y="132">s=11</text>
    <text x="393" y="132">s=9</text>
    <text x="163" y="190">s=4</text>
    <text x="263" y="190">s=5</text>
    <text x="433" y="190">s=6</text>
  </g>

  <!-- 表格 -->
  <rect x="58" y="216" width="444" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#3a4a66" text-anchor="middle">
    <text x="115" y="232">被删边下方节点</text>
    <text x="235" y="232">子树和 s</text>
    <text x="340" y="232">S − s</text>
    <text x="435" y="232">乘积</text>
  </g>

  <rect x="58" y="240" width="444" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="260" width="444" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="280" width="444" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="300" width="444" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="320" width="444" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="115" y="255">4</text><text x="235" y="255">4</text><text x="340" y="255">17</text><text x="435" y="255">68</text>
    <text x="115" y="275">5</text><text x="235" y="275">5</text><text x="340" y="275">16</text><text x="435" y="275">80</text>
    <text x="115" y="295">6</text><text x="235" y="295">6</text><text x="340" y="295">15</text><text x="435" y="295">90</text>
    <text x="115" y="315" fill="#3a5a30" font-weight="bold">2</text>
    <text x="235" y="315" fill="#3a5a30" font-weight="bold">11</text>
    <text x="340" y="315" fill="#3a5a30" font-weight="bold">10</text>
    <text x="435" y="315" fill="#3a5a30" font-weight="bold">110</text>
    <text x="115" y="335">3</text><text x="235" y="335">9</text><text x="340" y="335">12</text><text x="435" y="335">108</text>
  </g>

  <text x="280" y="366" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">s = 11 最接近 S/2 = 10.5，此时乘积最大；根节点 1 没有父边，不参与枚举</text>
  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">110 mod (10^9+7) = 110</text>
  <text x="280" y="406" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">叶节点的子树和就是它自己的值，天然包含在这张表里</text>
</svg>
