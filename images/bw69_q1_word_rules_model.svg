<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">两条规范化规则：只看单词长度</text>

  <!-- 规则一：长度 1 或 2 -->
  <text x="140" y="72" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">规则一：长度 ≤ 2 → 全部小写</text>
  <g filter="url(#rough2)">
    <rect x="55" y="92" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="205" y="92" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <text x="95" y="117">"oF"</text>
    <text x="245" y="117">"of"</text>
  </g>
  <path d="M 140 112 C 165 96, 185 96, 200 108" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="90" font-size="11" fill="#446688" filter="url(#rough2)" text-anchor="middle">长度 2</text>
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="middle">
    <text x="140" y="152">"i" → "i"、"xx" → "xx"</text>
    <text x="140" y="170">首字母也必须小写！</text>
  </g>

  <!-- 规则二：长度 >= 3 -->
  <text x="415" y="72" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">规则二：长度 ≥ 3 → 首字母大写，其余小写</text>
  <g filter="url(#rough2)">
    <rect x="290" y="92" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="440" y="92" width="110" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="345" y="117">"capiTalIze"</text>
    <text x="495" y="117">"Capitalize"</text>
  </g>
  <path d="M 405 112 C 420 96, 435 96, 438 106" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="90" font-size="11" fill="#446688" filter="url(#rough2)" text-anchor="middle">长度 9</text>
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="middle">
    <text x="415" y="152">"EACH" → "Each"、"lOve" → "Love"</text>
    <text x="415" y="170">中间的大写全部压回小写</text>
  </g>

  <!-- 底部：title 的组成 -->
  <g filter="url(#rough2)">
    <rect x="60" y="205" width="440" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="232" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">title 的组成保证（题目约束）</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="256">单词与单词之间恰好一个空格</text>
    <text x="280" y="278">没有前导 / 尾随空格，每个单词非空且只含英文字母</text>
    <text x="280" y="304">⇒ 按空格切分不会产生空串，规范化后原样拼回即可</text>
  </g>
</svg>
