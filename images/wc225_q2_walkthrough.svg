<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="460" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：a = "dabadd"，b = "cda" → 答案 3</text>
  <path d="M 180 38 Q 340 48 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="60" text-anchor="middle" font-size="10.5" fill="#666">preX[c] = X 中 ≤ c 的字符个数（值域前缀和），只列 'a'..'e'</text>

  <!-- 代价表 -->
  <g filter="url(#sk)">
    <rect x="55" y="70" width="575" height="180" fill="#ffffff" stroke="#b9c4cf" stroke-width="1.5"/>
    <rect x="55" y="70" width="575" height="30" fill="#e8f0fa" stroke="#b9c4cf" stroke-width="1"/>
    <rect x="55" y="190" width="575" height="30" fill="#fff1d6" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <path d="M 55 130 L 630 130 M 55 160 L 630 160 M 55 220 L 630 220" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#sk)"/>
  <path d="M 115 70 L 115 250 M 210 70 L 210 250 M 305 70 L 305 250 M 410 70 L 410 250 M 515 70 L 515 250" stroke="#e4e4e4" stroke-width="1" fill="none" filter="url(#sk)"/>

  <text x="85" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a86">c</text>
  <text x="162" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a86">preA[c]</text>
  <text x="257" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a86">preB[c]</text>
  <text x="357" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a86">ops1（a&lt;b）</text>
  <text x="462" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a86">ops2（b&lt;a）</text>
  <text x="572" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a86">ops3（同字母）</text>

  <text x="85" y="120" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">'a'</text>
  <text x="162" y="120" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="257" y="120" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="357" y="120" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="462" y="120" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="572" y="120" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="85" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">'b'</text>
  <text x="162" y="150" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="257" y="150" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="357" y="150" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="462" y="150" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="572" y="150" text-anchor="middle" font-size="11.5" fill="#333">8</text>
  <text x="85" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">'c'</text>
  <text x="162" y="180" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="257" y="180" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="357" y="180" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="462" y="180" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="572" y="180" text-anchor="middle" font-size="11.5" fill="#333">8</text>
  <text x="85" y="210" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a20">'d'</text>
  <text x="162" y="210" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="257" y="210" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="357" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">3</text>
  <text x="462" y="210" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="572" y="210" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="85" y="240" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">'e'</text>
  <text x="162" y="240" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="257" y="240" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="357" y="240" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="462" y="240" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="572" y="240" text-anchor="middle" font-size="11.5" fill="#333">9</text>

  <ellipse cx="357" cy="205" rx="14" ry="12" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <path d="M 454 124 L 470 124" stroke="#4a8e4a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 564 214 L 580 214" stroke="#4a8e4a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="500" y="128" text-anchor="start" font-size="9.5" fill="#4a8e4a">行最小 4</text>
  <text x="588" y="218" text-anchor="start" font-size="9.5" fill="#4a8e4a">行最小 5</text>

  <text x="340" y="270" text-anchor="middle" font-size="10.5" fill="#666">c ≥ 'd' 后 ops1 稳定在 3 = lenB：a 侧已全 ≤ c，b 侧只能全改 —— 最佳边界落在 a 的最大字母 'd' 处</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="50" y="288" width="300" height="74" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="200" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">ans = min(3, 4, 5) = 3</text>
  <text x="200" y="330" text-anchor="middle" font-size="10.5" fill="#444">方案：b = "cda" → "eee"（3 次操作）</text>
  <text x="200" y="348" text-anchor="middle" font-size="10.5" fill="#444">max(a) = 'd' &lt; 'e' = min(b) ✓</text>

  <!-- 示例 1 回看 -->
  <g filter="url(#sk)">
    <rect x="370" y="288" width="260" height="74" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="500" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a86">回看示例 1：a = "aba"，b = "caa"</text>
  <text x="500" y="324" text-anchor="middle" font-size="10.5" fill="#444">条件 1（c='b'）：b 的 2 个 'a'→'c' → 2 次</text>
  <text x="500" y="340" text-anchor="middle" font-size="10.5" fill="#444">条件 3（c='a'）：a 的 'b'→'a' + b 的 'c'→'a' → 2 次</text>
  <text x="500" y="356" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b5a86">ans = 2（两条件并列）</text>

  <!-- 复盘框 -->
  <g filter="url(#sk)">
    <rect x="50" y="376" width="580" height="58" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="340" y="398" text-anchor="middle" font-size="11" fill="#444">复盘：直接想「每个字符改成什么」容易陷进逐字符贪心；</text>
  <text x="340" y="416" text-anchor="middle" font-size="11" fill="#444">换成「终态的值域布局」——枚举边界字母 + 前缀和查表，三个条件一次拿下。</text>
</svg>
