<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">可达和的集合 = 某个 gcd 的全部倍数</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">裴蜀定理：gcd(a, b) = 1 ⟺ 存在整数 x, y 使 a·x + b·y = 1</text>

  <g filter="url(#rough2)">
    <rect x="30" y="62" width="240" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="46" y="84" font-size="11.5" fill="#3a4a66" font-weight="bold">子集 {5, 7}：g = gcd(5, 7) = 1</text>
    <text x="46" y="112" font-size="14" fill="#446688">5·3 + 7·(−2) = 1</text>
    <text x="46" y="134" font-size="10" fill="#555">系数 3 与 −2 都是整数，允许取负</text>
    <text x="46" y="154" font-size="10" fill="#555">可达和 = {…, −1, 0, 1, 2, …} = 全体整数</text>
    <text x="46" y="176" font-size="10.5" fill="#2f6b4f" font-weight="bold">⇒ 能凑出 1，是「好数组」</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="290" y="62" width="240" height="128" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
    <text x="306" y="84" font-size="11.5" fill="#8a3a36" font-weight="bold">子集 {6, 10}：g = gcd(6, 10) = 2</text>
    <text x="306" y="112" font-size="13" fill="#8a3a36">6·x + 10·y = 2·(3x + 5y)</text>
    <text x="306" y="134" font-size="10" fill="#555">左边恒为偶数，任何整数系数都凑不出 1</text>
    <text x="306" y="154" font-size="10" fill="#555">可达和 = {…, −2, 0, 2, …}，不含 1</text>
    <text x="306" y="176" font-size="10.5" fill="#b85450" font-weight="bold">⇒ 不是好数组（{3, 6} 同理）</text>
  </g>

  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">把可行和画成数轴：g = 1 时整条轴都可达，g = 3 时只落下 3 的倍数</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="66" y="252" fill="#2f6b4f" font-weight="bold">g = 1</text>
    <rect x="140" y="234" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="163" y="252" fill="#3a5a30">−3</text>
    <rect x="194" y="234" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="217" y="252" fill="#3a5a30">−2</text>
    <rect x="248" y="234" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="271" y="252" fill="#3a5a30">−1</text>
    <rect x="302" y="234" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5"/>
    <text x="325" y="252" fill="#8a6a20" font-weight="bold">0</text>
    <rect x="356" y="234" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="379" y="252" fill="#3a5a30">1</text>
    <rect x="410" y="234" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="433" y="252" fill="#3a5a30">2</text>
    <rect x="464" y="234" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="487" y="252" fill="#3a5a30">3</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="66" y="304" fill="#8a6a20" font-weight="bold">g = 3</text>
    <rect x="140" y="286" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5"/>
    <text x="163" y="304" fill="#8a6a20">−3</text>
    <rect x="194" y="286" width="46" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5" stroke-dasharray="4 3"/>
    <text x="217" y="304" fill="#aaa">−2</text>
    <rect x="248" y="286" width="46" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5" stroke-dasharray="4 3"/>
    <text x="271" y="304" fill="#aaa">−1</text>
    <rect x="302" y="286" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5"/>
    <text x="325" y="304" fill="#8a6a20">0</text>
    <rect x="356" y="286" width="46" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
    <text x="379" y="304" fill="#b85450" font-weight="bold">1</text>
    <rect x="410" y="286" width="46" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5" stroke-dasharray="4 3"/>
    <text x="433" y="304" fill="#aaa">2</text>
    <rect x="464" y="286" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5"/>
    <text x="487" y="304" fill="#8a6a20">3</text>
  </g>

  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">实线块 = 可达；虚线块 = 不可达；红框的 1 永远拿不到</text>

  <g filter="url(#rough2)">
    <rect x="30" y="344" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="46" y="364" font-size="10.5" fill="#8a6a20" font-weight="bold">结论：存在子集能凑出 1 ⟺ 该子集 gcd = 1；而「存在这样的子集」⟺ 全体元素的 gcd = 1</text>
    <text x="46" y="382" font-size="10" fill="#555">于是答案退化成一次遍历：维护全局 gcd，看它是否等于 1。</text>
  </g>
</svg>
