<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" font-weight="bold"
        fill="#333" filter="url(#rough2)">示例演算：words = ["abba","baba","bbaa","cd","cd"]</text>

  <rect x="45" y="52" width="60" height="30" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="105" y="52" width="90" height="30" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="195" y="52" width="90" height="30" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="285" y="52" width="90" height="30" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="375" y="52" width="100" height="30" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="71" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#446688" filter="url(#rough2)">下标 i</text>
  <text x="150" y="71" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#446688" filter="url(#rough2)">words[i]</text>
  <text x="240" y="71" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#446688" filter="url(#rough2)">排序签名</text>
  <text x="330" y="71" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#446688" filter="url(#rough2)">与前一签名</text>
  <text x="425" y="71" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#446688" filter="url(#rough2)">决策</text>

  <rect x="45" y="82" width="60" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="105" y="82" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="195" y="82" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="285" y="82" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="375" y="82" width="100" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="150" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">abba</text>
  <text x="240" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">aabb</text>
  <text x="330" y="104" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">—（i = 0）</text>
  <text x="425" y="104" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">保留 ✓</text>

  <rect x="45" y="116" width="60" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="105" y="116" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="195" y="116" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="285" y="116" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="375" y="116" width="100" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">baba</text>
  <text x="240" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">aabb</text>
  <text x="330" y="138" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">相同</text>
  <text x="425" y="138" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">删除 ✗</text>

  <rect x="45" y="150" width="60" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="105" y="150" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="195" y="150" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="285" y="150" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="375" y="150" width="100" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="150" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">bbaa</text>
  <text x="240" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">aabb</text>
  <text x="330" y="172" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">相同</text>
  <text x="425" y="172" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">删除 ✗</text>

  <rect x="45" y="184" width="60" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="105" y="184" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="195" y="184" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="285" y="184" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="375" y="184" width="100" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75" y="206" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="150" y="206" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cd</text>
  <text x="240" y="206" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cd</text>
  <text x="330" y="206" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">不同</text>
  <text x="425" y="206" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">保留 ✓</text>

  <rect x="45" y="218" width="60" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="105" y="218" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="195" y="218" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="285" y="218" width="90" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="375" y="218" width="100" height="34" fill="#ffffff" stroke="#aaaaaa"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="150" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cd</text>
  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cd</text>
  <text x="330" y="240" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">相同</text>
  <text x="425" y="240" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">删除 ✗</text>

  <rect x="110" y="266" width="300" height="34" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="14" font-weight="bold"
        fill="#2e5e2e" filter="url(#rough2)">ans = ["abba", "cd"]</text>

  <rect x="45" y="314" width="430" height="76" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="338" text-anchor="start" font-size="12" font-weight="bold"
        fill="#7a5415" filter="url(#rough2)">⚠ 易错：不相邻的异位词不受影响</text>
  <text x="65" y="358" text-anchor="start" font-size="12"
        fill="#444" filter="url(#rough2)">["ab","cd","ab"] → 没有任何可删下标，原样返回</text>
  <text x="65" y="378" text-anchor="start" font-size="11"
        fill="#888" filter="url(#rough2)">"cd" 永远删不掉 ⇒ 两个 "ab" 永远不会变成相邻</text>
</svg>
