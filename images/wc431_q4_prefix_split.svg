<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：按右端点排序，相容区间劈成一个前缀</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">排序键 = 右端点 r 升序；处理第 i 个（排序位置）区间 a[i] = (rᵢ, lᵢ, wᵢ, 原下标 idxᵢ)</text>

  <!-- 排序后的区间方块序列 -->
  <text x="60" y="76" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">排序后（r 升序）：</text>

  <!-- 绿色相容前缀框 [0,k) -->
  <g filter="url(#rough2)"><rect x="62" y="98" width="262" height="64" rx="8" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="193" y="93" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">相容前缀 [0, k)：r &lt; lᵢ，与 a[i] 全部相容 ✓</text>

  <!-- 红色中段框 [k,i) -->
  <g filter="url(#rough2)"><rect x="332" y="98" width="112" height="64" rx="8" fill="#fce4ec" fill-opacity="0.6" stroke="#b85450" stroke-width="2"/></g>
  <text x="388" y="93" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">中段 [k, i)：全部与 a[i] 重叠 ✗</text>

  <!-- 方块 0..4 绿色 -->
  <g filter="url(#rough2)"><rect x="74" y="112" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="96" y="128" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">r=2</text>
  <text x="96" y="180" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="126" y="112" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="148" y="128" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">r=4</text>
  <text x="148" y="180" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="178" y="112" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="200" y="128" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">r=5</text>
  <text x="200" y="180" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="230" y="112" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="252" y="128" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">r=6</text>
  <text x="252" y="180" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="282" y="112" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="300" y="128" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">r=8</text>
  <text x="300" y="180" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <!-- 方块 5..6 红色（与 a[i] 重叠的中段） -->
  <g filter="url(#rough2)"><rect x="340" y="112" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="362" y="128" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">r=10</text>
  <text x="362" y="180" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="392" y="112" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="414" y="128" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">r=11</text>
  <text x="414" y="180" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">6</text>

  <!-- a[i] 本体：蓝色高亮，l_i 竖直虚线 -->
  <g filter="url(#rough2)"><rect x="448" y="104" width="52" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/></g>
  <text x="474" y="124" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">r=12</text>
  <text x="474" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">l=10</text>
  <text x="474" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">a[i]</text>

  <!-- i 之后的灰色方块 -->
  <g filter="url(#rough2)"><rect x="512" y="112" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/></g>
  <text x="534" y="128" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">r=15</text>
  <text x="534" y="180" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="564" y="112" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/></g>
  <text x="586" y="128" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">r=18</text>
  <text x="586" y="180" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">9</text>
  <text x="555" y="93" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">i 之后（暂不参与转移）</text>

  <!-- k 分界虚线 -->
  <path d="M 332 102 L 332 186" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="332" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">k：前 i 个中 r &lt; lᵢ 的个数</text>

  <!-- 中段重叠原因说明 -->
  <g filter="url(#rough2)"><rect x="55" y="216" width="555" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="70" y="236" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">中段每个区间都满足 l ≤ r ≤ rᵢ 且 r ≥ lᵢ：与 a[i] = [lᵢ, rᵢ] 共享点 max(l, lᵢ)</text>
  <text x="70" y="254" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">（闭区间，共享端点也算重叠）——包含 a[i] 的方案里，其余成员一个都不能取自中段</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)"><rect x="55" y="286" width="555" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="70" y="308" font-size="11.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">任何包含 a[i]、至多 j 个互不重叠的方案，都能写成：</text>
  <text x="70" y="328" font-size="12" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">{ a[i] } ∪ ( [0, k) 内至多 j−1 个互不重叠的区间 )</text>
  <text x="70" y="350" font-size="10.5" fill="#444" filter="url(#rough2)">子问题恰好是 f[k][j−1] 的定义 —— 排序 + 二分把“相容关系”压成了前缀结构，与加权区间调度同构</text>
  <text x="70" y="368" font-size="10.5" fill="#444" filter="url(#rough2)">k 由一次二分定位（条件严格 r &lt; lᵢ），a[i] 必是方案中排序位置最大的成员</text>
</svg>
