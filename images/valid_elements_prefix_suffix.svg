<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">有效判定：只需赢过一侧的最大值</text>
  <path d="M 180 42 Q 340 52 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: invalid element i=3 -->
  <text x="170" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">nums[3] = 2：两边都打不过 → 无效</text>

  <g filter="url(#sk)">
    <rect x="30" y="95" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="76" y="95" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="122" y="95" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="168" y="95" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <rect x="214" y="95" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="260" y="95" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)">
    <text x="53" y="117" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="99" y="117" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="145" y="117" text-anchor="middle" font-size="13" fill="#333">4</text>
    <text x="191" y="117" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">2</text>
    <text x="237" y="117" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="283" y="117" text-anchor="middle" font-size="13" fill="#333">2</text>
  </g>
  <text x="191" y="88" text-anchor="middle" font-size="10" fill="#b03a3a">i=3</text>

  <!-- comparisons for panel A -->
  <g filter="url(#sk)">
    <path d="M 186 132 Q 145 152 145 168" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arRed)"/>
    <path d="M 198 132 Q 240 152 240 168" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arRed)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="80" y="170" width="130" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="180" y="170" width="130" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="145" y="192" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">leftMax = 4</text>
  <text x="145" y="212" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">2 &gt; 4 ? ✗</text>
  <text x="245" y="192" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">rightMax = 3</text>
  <text x="245" y="212" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">2 &gt; 3 ? ✗</text>

  <!-- Panel B: valid element i=4 -->
  <text x="500" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">nums[4] = 3：赢过右侧 → 有效</text>

  <g filter="url(#sk)">
    <rect x="360" y="95" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="406" y="95" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="452" y="95" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="498" y="95" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="544" y="95" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="590" y="95" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)">
    <text x="383" y="117" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="429" y="117" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="475" y="117" text-anchor="middle" font-size="13" fill="#333">4</text>
    <text x="521" y="117" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="567" y="117" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="613" y="117" text-anchor="middle" font-size="13" fill="#333">2</text>
  </g>
  <text x="521" y="88" text-anchor="middle" font-size="10" fill="#2e6e2e">i=4</text>

  <!-- comparisons for panel B -->
  <g filter="url(#sk)">
    <path d="M 516 132 Q 475 152 475 168" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arRed)"/>
    <path d="M 528 132 Q 570 152 570 168" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arGreen)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="410" y="170" width="130" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="510" y="170" width="130" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="475" y="192" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">leftMax = 4</text>
  <text x="475" y="212" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">3 &gt; 4 ? ✗</text>
  <text x="575" y="192" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">rightMax = 2</text>
  <text x="575" y="212" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">3 &gt; 2 ? ✓</text>

  <!-- Definition box -->
  <g filter="url(#sk)">
    <rect x="60" y="250" width="560" height="66" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">判定式（两侧各压缩成一个数）</text>
  <text x="340" y="300" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">nums[i] 有效 ⟺ nums[i] &gt; leftMax[i] 或 nums[i] &gt; rightMax[i]</text>

  <!-- Insight boxes -->
  <g filter="url(#sk)">
    <rect x="60" y="332" width="272" height="68" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="196" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">观察一：∀ 比较 ⟺ 极值比较</text>
  <text x="196" y="374" text-anchor="middle" font-size="11" fill="#555">「大于左侧所有元素」</text>
  <text x="196" y="390" text-anchor="middle" font-size="11" fill="#555">⟺「大于左侧元素的最大值」</text>

  <g filter="url(#sk)">
    <rect x="348" y="332" width="272" height="68" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="484" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">观察二：空侧 = −∞</text>
  <text x="484" y="374" text-anchor="middle" font-size="11" fill="#555">i=0 左侧无人：leftMax[0] = −∞</text>
  <text x="484" y="390" text-anchor="middle" font-size="11" fill="#555">首尾「始终有效」白送，无需特判</text>
</svg>
