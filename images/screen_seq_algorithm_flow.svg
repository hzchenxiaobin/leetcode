<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：逐字符贪心 + 每键快照</text>
  <path d="M 130 34 Q 260 42 390 34" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <rect x="170" y="50" width="180" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="12" fill="#3a5f2e" filter="url(#rough2)">开始：s = ""</text>
  <path d="M 260 84 L 260 98" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 A：还有字符 -->
  <polygon points="260,102 338,132 260,162 182,132" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">还有字符 c？</text>

  <!-- A-否 → 结束 -->
  <path d="M 182 132 L 52 132 L 52 430 L 56 430" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="122" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- A-是 -->
  <path d="M 260 162 L 260 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="175" font-size="10.5" fill="#3a5f2e" filter="url(#rough2)">是</text>

  <!-- 按键 1 -->
  <rect x="145" y="180" width="230" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">按键 1：s += 'a'</text>
  <text x="260" y="220" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">快照：res ← s</text>
  <path d="M 260 232 L 260 246" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 B：末位 == c -->
  <polygon points="260,250 336,282 260,314 184,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">末位 == c ？</text>

  <!-- B-否 → 按键 2 -->
  <path d="M 260 314 L 260 328" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="326" font-size="10.5" fill="#a06a15" filter="url(#rough2)">否</text>

  <rect x="145" y="332" width="230" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a15" filter="url(#rough2)">按键 2：末位 +1</text>
  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#a06a15" filter="url(#rough2)">快照：res ← s</text>

  <!-- 按键 2 → 回到判断 B -->
  <path d="M 145 358 L 70 358 L 70 282 L 180 282" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B-是 → 回到判断 A -->
  <path d="M 336 282 L 470 282 L 470 132 L 342 132" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="273" font-size="10.5" fill="#3a5f2e" filter="url(#rough2)">是</text>
  <text x="405" y="124" text-anchor="middle" font-size="10" fill="#3a5f2e" filter="url(#rough2)">c 已到位 → 取下一字符</text>

  <!-- 结束 -->
  <rect x="60" y="408" width="150" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">返回 res</text>
  <text x="135" y="445" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（每按一次键一张快照）</text>

  <!-- 侧注 -->
  <text x="470" y="392" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">末位从 'a' 起步</text>
  <text x="470" y="406" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">永不越过 'z'</text>
</svg>
