<svg xmlns="http://www.w3.org/2000/svg" width="640" height="492" viewBox="0 0 640 492" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="492" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 走查：nums1=[2,3,4,5,9]，nums2=[8,8,4,4,4]</text>
  <path d="M 150 32 Q 320 40 490 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 面板 A -->
  <g filter="url(#sk)"><rect x="30" y="42" width="580" height="170" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.4"/></g>
  <text x="52" y="64" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#sk)">终态 A：末列不动 → a=9, b=4，末列代价 0</text>

  <g filter="url(#sk)"><rect x="60" y="76" width="96" height="104" rx="6" fill="#f7fafc" stroke="#8aa4c0" stroke-width="1.2"/></g>
  <text x="108" y="98" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">(2, 8)</text>
  <text x="108" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">换</text>
  <g filter="url(#sk)"><rect x="88" y="136" width="40" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="108" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a34" filter="url(#sk)">+1</text>
  <text x="108" y="172" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">y=8 &gt; b=4</text>

  <g filter="url(#sk)"><rect x="168" y="76" width="96" height="104" rx="6" fill="#f7fafc" stroke="#8aa4c0" stroke-width="1.2"/></g>
  <text x="216" y="98" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">(3, 8)</text>
  <text x="216" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">换</text>
  <g filter="url(#sk)"><rect x="196" y="136" width="40" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="216" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a34" filter="url(#sk)">+1</text>
  <text x="216" y="172" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">y=8 &gt; b=4</text>

  <g filter="url(#sk)"><rect x="276" y="76" width="96" height="104" rx="6" fill="#f7fafc" stroke="#8aa4c0" stroke-width="1.2"/></g>
  <text x="324" y="98" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">(4, 4)</text>
  <text x="324" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">不换</text>
  <g filter="url(#sk)"><rect x="304" y="136" width="40" height="22" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="324" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">0</text>
  <text x="324" y="172" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">x≤a, y≤b</text>

  <g filter="url(#sk)"><rect x="384" y="76" width="96" height="104" rx="6" fill="#f7fafc" stroke="#8aa4c0" stroke-width="1.2"/></g>
  <text x="432" y="98" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">(5, 4)</text>
  <text x="432" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">不换</text>
  <g filter="url(#sk)"><rect x="412" y="136" width="40" height="22" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="432" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">0</text>
  <text x="432" y="172" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">x≤a, y≤b</text>

  <g filter="url(#sk)"><rect x="508" y="76" width="72" height="104" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="544" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#sk)">合计</text>
  <text x="544" y="140" text-anchor="middle" font-size="24" font-weight="bold" fill="#7a5a10" filter="url(#sk)">2</text>
  <text x="544" y="166" text-anchor="middle" font-size="9" fill="#7a5a10" filter="url(#sk)">0+1+1+0+0</text>
  <text x="432" y="200" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">列 0、1 的 8 只能去第一行（需 ≤9），不能留在第二行（8 &gt; 4）</text>

  <!-- 面板 B -->
  <g filter="url(#sk)"><rect x="30" y="232" width="580" height="170" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="52" y="254" font-size="12.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">终态 B：末列交换 → a=4, b=9，末列代价 1</text>

  <g filter="url(#sk)"><rect x="60" y="266" width="96" height="104" rx="6" fill="#f7fafc" stroke="#8aa4c0" stroke-width="1.2"/></g>
  <text x="108" y="288" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">(2, 8)</text>
  <text x="108" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">不换</text>
  <g filter="url(#sk)"><rect x="88" y="326" width="40" height="22" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="108" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">0</text>
  <text x="108" y="362" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">x≤a, y≤b</text>

  <g filter="url(#sk)"><rect x="168" y="266" width="96" height="104" rx="6" fill="#f7fafc" stroke="#8aa4c0" stroke-width="1.2"/></g>
  <text x="216" y="288" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">(3, 8)</text>
  <text x="216" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">不换</text>
  <g filter="url(#sk)"><rect x="196" y="326" width="40" height="22" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="216" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">0</text>
  <text x="216" y="362" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">x≤a, y≤b</text>

  <g filter="url(#sk)"><rect x="276" y="266" width="96" height="104" rx="6" fill="#f7fafc" stroke="#8aa4c0" stroke-width="1.2"/></g>
  <text x="324" y="288" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">(4, 4)</text>
  <text x="324" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">不换</text>
  <g filter="url(#sk)"><rect x="304" y="326" width="40" height="22" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="324" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">0</text>
  <text x="324" y="362" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">x≤a, y≤b</text>

  <g filter="url(#sk)"><rect x="384" y="266" width="96" height="104" rx="6" fill="#f7fafc" stroke="#8aa4c0" stroke-width="1.2"/></g>
  <text x="432" y="288" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">(5, 4)</text>
  <text x="432" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">换</text>
  <g filter="url(#sk)"><rect x="412" y="326" width="40" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="432" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a34" filter="url(#sk)">+1</text>
  <text x="432" y="362" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">x=5 &gt; a=4</text>

  <g filter="url(#sk)"><rect x="508" y="266" width="72" height="104" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="544" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#sk)">合计</text>
  <text x="544" y="330" text-anchor="middle" font-size="24" font-weight="bold" fill="#7a5a10" filter="url(#sk)">2</text>
  <text x="544" y="356" text-anchor="middle" font-size="9" fill="#7a5a10" filter="url(#sk)">1+0+0+0+1</text>
  <text x="432" y="390" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">列 3 的 5 只能去第二行（需 ≤9），不能留在第一行（5 &gt; 4）</text>

  <!-- 结论 -->
  <g filter="url(#sk)"><rect x="100" y="424" width="440" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="320" y="448" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d24" filter="url(#sk)">答案 = min(2, 2) = 2</text>
  <text x="320" y="468" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#sk)">两种终态打平；示例 1 则是终态 B(1 次) &lt; 终态 A(2 次)——两种终态必须都枚举</text>
</svg>
