<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="344" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1 走查（k = 2）：三步拼出 [9,7,9,8,8]</text>

  <text x="30" y="66" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 树 1 逐点 BFS（半径 k = 2）→ count1</text>

  <rect x="30" y="78" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="51" y="96" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">i=0</text>
  <rect x="80" y="78" width="42" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="101" y="96" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#rough2)">i=1</text>
  <rect x="130" y="78" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="96" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">i=2</text>
  <rect x="180" y="78" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="96" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">i=3</text>
  <rect x="230" y="78" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="251" y="96" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">i=4</text>

  <rect x="30" y="114" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="51" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">5</text>
  <rect x="80" y="114" width="42" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="101" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">3</text>
  <rect x="130" y="114" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">5</text>
  <rect x="180" y="114" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">4</text>
  <rect x="230" y="114" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="251" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">4</text>

  <text x="151" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">i=1 到 3、4 的距离为 3 &gt; k，只圈 {1,0,2}</text>

  <text x="300" y="66" text-anchor="start" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">② 树 2 逐点 BFS（半径 k−1 = 1）</text>

  <text x="294" y="95" text-anchor="end" font-size="10" fill="#7a5a10" filter="url(#rough2)">b:</text>
  <rect x="300" y="78" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="312" y="95" text-anchor="middle" font-size="10.5" fill="#2d5a20" filter="url(#rough2)">0</text>
  <rect x="327" y="78" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="339" y="95" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="354" y="78" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="366" y="95" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">2</text>
  <rect x="381" y="78" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="393" y="95" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">3</text>
  <rect x="408" y="78" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="420" y="95" text-anchor="middle" font-size="10.5" fill="#2d5a20" filter="url(#rough2)">4</text>
  <rect x="435" y="78" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="447" y="95" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">5</text>
  <rect x="462" y="78" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="474" y="95" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">6</text>
  <rect x="489" y="78" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="501" y="95" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">7</text>

  <text x="294" y="127" text-anchor="end" font-size="10" fill="#7a5a10" filter="url(#rough2)">cnt:</text>
  <rect x="300" y="110" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="312" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">4</text>
  <rect x="327" y="110" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="339" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">3</text>
  <rect x="354" y="110" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="366" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">3</text>
  <rect x="381" y="110" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="393" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">2</text>
  <rect x="408" y="110" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="420" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">4</text>
  <rect x="435" y="110" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="447" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">2</text>
  <rect x="462" y="110" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="474" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">2</text>
  <rect x="489" y="110" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="501" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">2</text>

  <text x="406" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">best2 = 4（b = 0 或 b = 4）</text>

  <text x="260" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">③ answer[i] = count1[i] + best2 = count1[i] + 4</text>

  <rect x="96" y="216" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="234" text-anchor="middle" font-size="10" fill="#2d5a20" filter="url(#rough2)">i=0</text>
  <text x="124" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">9</text>
  <rect x="164" y="216" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="192" y="234" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">i=1</text>
  <text x="192" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">7</text>
  <rect x="232" y="216" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="10" fill="#2d5a20" filter="url(#rough2)">i=2</text>
  <text x="260" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">9</text>
  <rect x="300" y="216" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="328" y="234" text-anchor="middle" font-size="10" fill="#2d5a20" filter="url(#rough2)">i=3</text>
  <text x="328" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">8</text>
  <rect x="368" y="216" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="234" text-anchor="middle" font-size="10" fill="#2d5a20" filter="url(#rough2)">i=4</text>
  <text x="396" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">8</text>

  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#2d5a20" filter="url(#rough2)">最容易错的是 i = 1：树 1 内只圈到 3 个，3 + 4 = 7</text>
  <text x="260" y="318" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">answer = [9, 7, 9, 8, 8] ✓</text>
</svg>
