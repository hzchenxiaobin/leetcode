<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 392" width="600" height="392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="600" height="392" fill="#fafafa"/>
  <text x="300" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按位置从前往后扫描：到达时间出现「新纪录」就是新车队</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">记录当前最慢车队的到达时间 cur；t &gt; cur 才 +1，否则被前方车队挡住</text>
  <rect x="50" y="96" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="117" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">10</text>
  <rect x="124" y="96" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="117" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">2</text>
  <rect x="198" y="96" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="117" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">1</text>
  <rect x="272" y="96" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="116.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cur = 1</text>
  <rect x="426" y="96" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486" y="116.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+1 → 1</text>
  <path d="M 560 113 L 586 113" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="50" y="138" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="159" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">8</text>
  <rect x="124" y="138" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="159" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">4</text>
  <rect x="198" y="138" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="159" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">1</text>
  <rect x="272" y="138" width="150" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="158.8" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">1 ≤ 1，同队</text>
  <rect x="426" y="138" width="120" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486" y="158.8" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">不变</text>
  <rect x="50" y="180" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="201" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">5</text>
  <rect x="124" y="180" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="201" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">1</text>
  <rect x="198" y="180" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="201" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">7</text>
  <rect x="272" y="180" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="200.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cur = 7</text>
  <rect x="426" y="180" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486" y="200.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">+1 → 2</text>
  <path d="M 560 197 L 586 197" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="50" y="222" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="243" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">3</text>
  <rect x="124" y="222" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="243" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">3</text>
  <rect x="198" y="222" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="243" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">3</text>
  <rect x="272" y="222" width="150" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="242.8" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">3 ≤ 7，同队</text>
  <rect x="426" y="222" width="120" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486" y="242.8" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">不变</text>
  <rect x="50" y="264" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="285" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">0</text>
  <rect x="124" y="264" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="285" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">1</text>
  <rect x="198" y="264" width="70" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="285" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">12</text>
  <rect x="272" y="264" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="284.8" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">cur = 12</text>
  <rect x="426" y="264" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486" y="284.8" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">+1 → 3</text>
  <path d="M 560 281 L 586 281" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="85" y="88" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">position</text>
  <text x="159" y="88" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">speed</text>
  <text x="233" y="88" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="347" y="88" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">与 cur 比较</text>
  <text x="486" y="88" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">车队计数</text>
  <text x="573" y="88" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">新队</text>
  <text x="50" y="330" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">不变式：cur = 已经就位的所有车队中最慢的一个的到达时间</text>
  <text x="50" y="352" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">后车若 t ≤ cur，说明它在 cur 之前就会撞上前车，因此并入同一车队</text>
</svg>
