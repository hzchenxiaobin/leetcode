<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="540" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：排序定 m，再逐项累加</text>
  <path d="M 130 44 Q 360 50 590 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="170" y="62" width="250" height="42" rx="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="89" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 t（多测循环开始）</text>
  <path d="M 295 104 L 295 124" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="170" y="126" width="250" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="153" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n 与数组 a</text>
  <path d="M 295 168 L 295 188" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="170" y="190" width="250" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">降序排序得 b₁ ≥ b₂ ≥ … ≥ bₙ</text>
  <text x="295" y="229" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">（相等的「值」就是冻结边界）</text>
  <path d="M 295 236 L 295 256" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <polygon points="295,258 425,306 295,354 165,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="295" y="301" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">存在 bᵢ = bᵢ₊₁ ?</text>
  <text x="295" y="320" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">取最小的 i</text>

  <path d="M 425 306 L 470 306" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="447" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="472" y="282" width="86" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33b36" filter="url(#rough2)">m = i</text>
  <text x="515" y="321" text-anchor="middle" font-size="10.5" fill="#7a2f2b" filter="url(#rough2)">只前 m 个能动</text>

  <path d="M 295 354 L 295 376" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="316" y="371" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="170" y="378" width="250" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33b36" filter="url(#rough2)">m = n（全都可动）</text>
  <text x="295" y="416" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">答案退化为「全不重复」情形</text>

  <path d="M 295 424 L 295 444" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="150" y="446" width="290" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="295" y="468" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">ans = 1；对 t = 1…m 累加 (b_t − 1)^t</text>
  <text x="295" y="488" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">快速幂取模 10⁹+7</text>


  <path d="M 515 332 L 515 472 L 444 472" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 右侧推导旁注 -->
  <rect x="574" y="264" width="166" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="657" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么是 (b_t−1)^t</text>
  <text x="657" y="310" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">前 t−1 个都要 &lt; b_t</text>
  <text x="657" y="329" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">各 b_t−1 种取值</text>
  <text x="657" y="352" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">第 t 个自身要 &lt; b_t</text>
  <text x="657" y="371" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">又 b_t−1 种</text>
  <text x="657" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">→ (b_t−1)^t</text>

  <rect x="574" y="424" width="166" height="74" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="657" y="446" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">b_t = 1 时该项为 0</text>
  <text x="657" y="464" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">（再也降不下去）</text>
  <text x="657" y="485" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">故 ans ≥ 1 恒成立</text>
</svg>
