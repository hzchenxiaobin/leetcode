<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">相邻元素奇偶不同 → 每个位置的奇偶槽型被完全钉死</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">剩下的只是「奇数放几个、偶数放几个」的排列数</text>
  <text x="24" y="92" text-anchor="start" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">n = 3</text>
  <text x="90" y="92" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">奇数 2 个、偶数 1 个 → 只能是 O E O</text>
  <rect x="90" y="104" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118.0" y="126.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="160" y="104" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188.0" y="126.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="230" y="104" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258.0" y="126.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">O</text>
  <text x="330" y="126" text-anchor="start" font-size="11" fill="#8a6a20" filter="url(#rough2)">方案数 2! × 1! = 2</text>
  <text x="24" y="196" text-anchor="start" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">n = 4</text>
  <text x="90" y="196" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">奇数 2 个、偶数 2 个 → 两种槽型都合法</text>
  <rect x="90" y="208" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115.0" y="228.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="152" y="208" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177.0" y="228.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="214" y="208" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239.0" y="228.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="276" y="208" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301.0" y="228.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">E</text>
  <text x="370" y="228" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">2! × 2! = 4</text>
  <rect x="90" y="250" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115.0" y="270.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="152" y="250" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177.0" y="270.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="214" y="250" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239.0" y="270.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="276" y="250" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301.0" y="270.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">O</text>
  <text x="370" y="270" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">2! × 2! = 4</text>
  <rect x="40" y="300" width="480" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">n 为奇数 ⇒ 必须以奇数开头（奇数比偶数多一个）；n 为偶数 ⇒ 两种开头都行</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">于是「填法数」= 剩余奇数个数的阶乘 × 剩余偶数个数的阶乘</text>
</svg>
