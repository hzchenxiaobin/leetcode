<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：单词 = 首字母 + 后缀，「换头」= 后缀去对方桶里查重</text>
  <path d="M 110 36 Q 320 45 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 四个单词拆成 首字母 | 后缀 -->
  <g filter="url(#sk)"><rect x="80" y="50" width="20" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="102" y="50" width="46" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="90" y="67" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">c</text>
  <text x="125" y="67" text-anchor="middle" font-size="11.5" fill="#33455e">offee</text>

  <g filter="url(#sk)"><rect x="215" y="50" width="20" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="237" y="50" width="46" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="225" y="67" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">d</text>
  <text x="260" y="67" text-anchor="middle" font-size="11.5" fill="#33455e">onuts</text>

  <g filter="url(#sk)"><rect x="350" y="50" width="20" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="372" y="50" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="360" y="67" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">t</text>
  <text x="389" y="67" text-anchor="middle" font-size="11.5" fill="#33455e">ime</text>

  <g filter="url(#sk)"><rect x="485" y="50" width="20" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="507" y="50" width="46" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="495" y="67" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">t</text>
  <text x="530" y="67" text-anchor="middle" font-size="11.5" fill="#33455e">offee</text>

  <!-- 分桶箭头 -->
  <path d="M 124 78 Q 124 88 124 96" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 249 78 Q 282 88 316 96" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 389 78 Q 448 90 498 96" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 530 78 Q 528 88 522 96" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 三个后缀桶 -->
  <g filter="url(#sk)"><rect x="40" y="100" width="170" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="125" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33455e">S_c（首字母 c）</text>
  <g filter="url(#sk)"><rect x="75" y="134" width="100" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="125" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a0741a">offee</text>

  <g filter="url(#sk)"><rect x="235" y="100" width="170" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33455e">S_d（首字母 d）</text>
  <g filter="url(#sk)"><rect x="285" y="134" width="70" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
  <text x="320" y="150" text-anchor="middle" font-size="11.5" fill="#33455e">onuts</text>

  <g filter="url(#sk)"><rect x="430" y="100" width="170" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="515" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33455e">S_t（首字母 t）</text>
  <g filter="url(#sk)"><rect x="443" y="134" width="52" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
  <text x="469" y="150" text-anchor="middle" font-size="11.5" fill="#33455e">ime</text>
  <g filter="url(#sk)"><rect x="501" y="134" width="64" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="533" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a0741a">offee</text>

  <text x="320" y="210" text-anchor="middle" font-size="11.5" fill="#a04a48">⚠ 橙色 offee 同时住在 c、t 两桶 ⇒ (c,t) 对的 |S_c∖S_t| = 0，乘积被清零</text>

  <!-- 有效 / 无效示例 -->
  <g filter="url(#sk)"><rect x="20" y="222" width="300" height="114" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="170" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">(coffee, donuts) 交换首字母 ✓</text>
  <text x="170" y="268" text-anchor="middle" font-size="11" fill="#2e5e2e">newA = d+offee = doffee → offee ∈ S_d？否 ✓</text>
  <text x="170" y="286" text-anchor="middle" font-size="11" fill="#2e5e2e">newB = c+onuts = conuts → onuts ∈ S_c？否 ✓</text>
  <g filter="url(#sk)"><rect x="36" y="300" width="268" height="26" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="170" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">两个新词都不在 ideas →「doffee conuts」有效</text>

  <g filter="url(#sk)"><rect x="332" y="222" width="288" height="114" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="476" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04a48">(coffee, time) 交换首字母 ✗</text>
  <text x="476" y="268" text-anchor="middle" font-size="11" fill="#a04a48">newA = t+offee = toffee → offee ∈ S_t？是 ✗</text>
  <text x="476" y="286" text-anchor="middle" font-size="11" fill="#a04a48">newB = c+ime = cime → ime ∈ S_c？否 ✓</text>
  <g filter="url(#sk)"><rect x="348" y="300" width="256" height="26" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="476" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04a48">toffee 已在 ideas 中 → 无效</text>

  <!-- 乘法原理汇总 -->
  <g filter="url(#sk)"><rect x="20" y="350" width="600" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="320" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#33455e">乘法原理：两个判定彼此独立</text>
  <text x="320" y="398" text-anchor="middle" font-size="11.5" fill="#33455e">(A, B) 有效 ⟺ s ∉ S_b 且 t ∉ S_a —— 前者只看 (s, b)，后者只看 (t, a)</text>
  <text x="320" y="420" text-anchor="middle" font-size="11.5" fill="#33455e">字母对 (a, b)：有效有序对 = ( |S_a| − |S_a∩S_b| ) · ( |S_b| − |S_a∩S_b| )</text>
  <text x="320" y="442" text-anchor="middle" font-size="11.5" fill="#33455e">答案 = 对全部 a ≠ b 求和（(A,B) 与 (B,A) 产生两个不同名字）</text>
</svg>
