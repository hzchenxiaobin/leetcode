<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次计数 + 一次线性扫描</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">扫描顺序即从左到右，第一个命中的相邻对就是答案</text>

  <rect x="40" y="70" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="115" y="94" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">遍历 s 统计频次</text>
  <text x="115" y="113" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">cnt[ch-'0']++</text>

  <path d="M 190 98 L 236 98" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="240" y="70" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="315" y="94" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i 从 0 到 n-2</text>
  <text x="315" y="113" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">取 a = s[i]，b = s[i+1]</text>

  <path d="M 315 126 L 315 154" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="315,158 402,196 315,234 228,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="190" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">a ≠ b 且</text>
  <text x="315" y="207" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">cnt[a]=a, cnt[b]=b ?</text>

  <path d="M 402 196 L 452 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="188" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="456" y="170" width="86" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="499" y="192" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="499" y="210" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">s[i..i+1]</text>

  <path d="M 315 234 L 315 268" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="256" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="228" y="272" width="174" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="315" y="290" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">i 后移一位，继续扫描</text>
  <text x="315" y="306" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">（最多扫 n-1 对）</text>

  <path d="M 228 293 L 120 293 L 120 128" stroke="#666" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="284" font-size="9.5" fill="#888" filter="url(#rough2)">回边：继续下一对</text>

  <rect x="40" y="330" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="352" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">扫完都没命中 → 返回空字符串 ""</text>

  <text x="392" y="340" font-size="10" fill="#888" filter="url(#rough2)">每个相邻对只做 O(1) 判定</text>
  <text x="392" y="356" font-size="10" fill="#888" filter="url(#rough2)">总计 O(n) 时间、O(1) 空间</text>
</svg>
