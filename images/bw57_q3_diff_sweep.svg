<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">差分扫描线：+c / −c 落在端点，混色之和逐段前缀和</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="300" x2="520" y2="300" stroke="#999" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="110" y="320">1</text>
    <text x="180" y="320">4</text>
    <text x="250" y="320">6</text>
    <text x="320" y="320">7</text>
    <text x="390" y="320">8</text>
    <text x="470" y="320">10</text>
  </g>

  <!-- 三条线段（示例2 风格） -->
  <g filter="url(#rough2)">
    <rect x="110" y="60" width="210" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="250" y="96" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <rect x="390" y="132" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="215" y="78">[1,7) 颜色 9</text>
    <text x="320" y="114">[6,8) 颜色 15</text>
    <text x="430" y="150">[8,10) 颜色 7</text>
  </g>

  <!-- 差分事件 -->
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="186" fill="#4a7a3a" font-weight="bold">+9</text>
    <text x="250" y="186" fill="#4a7a3a" font-weight="bold">+15</text>
    <text x="320" y="186" fill="#b85450" font-weight="bold">−9</text>
    <text x="390" y="186" fill="#b85450" font-weight="bold">−15</text>
    <text x="390" y="168" fill="#4a7a3a" font-weight="bold">+7</text>
    <text x="470" y="186" fill="#b85450" font-weight="bold">−7</text>
  </g>
  <g stroke-dasharray="4 4" stroke="#ccc" stroke-width="1" filter="url(#rough2)">
    <line x1="110" y1="168" x2="110" y2="300"/>
    <line x1="250" y1="168" x2="250" y2="300"/>
    <line x1="320" y1="168" x2="320" y2="300"/>
    <line x1="390" y1="168" x2="390" y2="300"/>
    <line x1="470" y1="168" x2="470" y2="300"/>
  </g>

  <!-- 前缀和行（mix 曲线） -->
  <path d="M 110 282 L 250 282 L 250 262 L 320 262 L 320 282 L 390 282 L 390 272 L 470 272"
        fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <g font-size="11" text-anchor="middle" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <text x="180" y="276">mix = 9</text>
    <text x="285" y="252">24</text>
    <text x="355" y="276">15</text>
    <text x="430" y="266">7</text>
  </g>

  <!-- 断点提示 -->
  <ellipse cx="250" cy="340" rx="150" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="345" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">端点 = 惟一可能的断点；净变化 0 也要断！</text>

  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">输出段（跳过 mix = 0 的空隙）：[1,6,9] [6,7,24] [7,8,15] [8,10,7]</text>
</svg>
