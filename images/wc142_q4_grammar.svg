<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr_orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#78909c"/>
    </marker>
    <marker id="arr_purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">表达式的三层文法与两种集合运算</text>
  <text x="310.0" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">求值结果始终是一个「字符串集合」</text>

  <rect x="50" y="88" width="330" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="215.0" y="119.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">expr := term (',' term)*</text>
  <rect x="400" y="88" width="180" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490.0" y="119.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">并集 ∪</text>
  <rect x="50" y="168" width="330" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="215.0" y="199.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">term := factor+</text>
  <rect x="400" y="168" width="180" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490.0" y="199.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">笛卡尔积 ×</text>
  <rect x="50" y="248" width="330" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="215.0" y="279.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">factor := '{' expr '}' | 字母</text>
  <rect x="400" y="248" width="180" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490.0" y="278.9" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">单字母 / 分组</text>
  <path d="M 230 248 L 230 222" stroke="#78909c" stroke-width="1.4" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <path d="M 230 168 L 230 142" stroke="#78909c" stroke-width="1.4" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <text x="240" y="240" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">先算最小单位</text>
  <rect x="50" y="322" width="530" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="62" y="342" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">优先级：逗号（并集）&lt; 相邻（拼接）&lt; 括号</text>
  <text x="62" y="359" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">所以 "{a,b}c" = {ac, bc}，而不是 {a, bc}；嵌套则递归处理。</text>
  <text x="24" y="404" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">∪ 与 × 都满足结合律，所以只要按优先级递归，切分方式唯一。</text>
</svg>
