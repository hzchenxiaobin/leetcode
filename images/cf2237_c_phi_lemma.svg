<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">下界：一次操作只会让「扫描值」变大，绝不变小</text>
  <text x="290" y="44" text-anchor="middle" font-size="10.5" fill="#888">把扫描写成 f(c, v) = (v ≥ c ? v : c + v)，只需逐案比较两个位置的合并结果</text>

  <rect x="40" y="58" width="500" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="76" font-size="11" fill="#3a4a66">操作前：… , x , y , …（x &gt; y）　→　操作后：… , y , x + y , …</text>
  <text x="60" y="92" font-size="10.5" fill="#3a4a66">设进入这两位之前扫描值为 c，比较 f(f(c, x), y) 与 f(f(c, y), x + y)</text>

  <rect x="40" y="110" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150" y="130" text-anchor="middle" font-size="11" fill="#7a5c10">情形</text>
  <text x="300" y="130" text-anchor="middle" font-size="11" fill="#7a5c10">操作前结果</text>
  <text x="450" y="130" text-anchor="middle" font-size="11" fill="#7a5c10">操作后结果</text>

  <g filter="url(#rough2)">
    <rect x="40" y="144" width="500" height="32" fill="#ffffff" stroke="#c9d6e8" stroke-width="1" rx="4"/>
    <rect x="40" y="180" width="500" height="32" fill="#f7fbf7" stroke="#c9d6e8" stroke-width="1" rx="4"/>
    <rect x="40" y="216" width="500" height="32" fill="#ffffff" stroke="#c9d6e8" stroke-width="1" rx="4"/>
  </g>

  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="150" y="165" text-anchor="middle">y ≥ c</text>
    <text x="300" y="165" text-anchor="middle">x + y</text>
    <text x="450" y="165" text-anchor="middle" fill="#3a5a30">x + y（相等）</text>

    <text x="150" y="201" text-anchor="middle">y &lt; c ≤ x</text>
    <text x="300" y="201" text-anchor="middle">x + y</text>
    <text x="450" y="201" text-anchor="middle" fill="#3a5a30">x + y（相等）</text>

    <text x="150" y="237" text-anchor="middle">x &lt; c</text>
    <text x="300" y="237" text-anchor="middle">c + x + y</text>
    <text x="450" y="237" text-anchor="middle" fill="#8a3a36">c + x + 2y（更大）</text>
  </g>

  <text x="290" y="272" text-anchor="middle" font-size="10.5" fill="#555">三种情形都满足 f(f(c,x),y) ≤ f(f(c,y),x+y)；且扫描值对初始 c 单调，故整段后缀的读数不会变小</text>

  <path d="M 290 282 L 290 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="308" width="500" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="326" font-size="10.5" fill="#3a5a30">终局必然有序，此时扫描值恰为最后一位 = 全数组最大值</text>
  <text x="60" y="342" font-size="10.5" fill="#3a5a30">所以任何合法过程的最终最大值 ≥ Φ(a) ⇒ 贪心值就是下界</text>

  <rect x="40" y="360" width="500" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="381" font-size="10.5" fill="#8a3a36">上界由构造给出：按「最左逆序优先」操作，终局最大值恰为 Φ(a)，两者夹住即最优</text>
</svg>
