<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">样例 4 走查：a = [−1,−1,−1, 1, 2,2, 3,3,3, 5,5,5,5,5]</text>

  <rect x="130" y="70" width="32" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="166" y="70" width="32" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="202" y="70" width="32" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="238" y="70" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="274" y="70" width="32" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="310" y="70" width="32" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="346" y="70" width="32" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="382" y="70" width="32" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="418" y="70" width="32" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="454" y="70" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="490" y="70" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="526" y="70" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="562" y="70" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="598" y="70" width="32" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="146" y="93" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="182" y="93" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="218" y="93" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="254" y="93" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">1</text>
  <text x="290" y="93" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">2</text>
  <text x="326" y="93" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">2</text>
  <text x="362" y="93" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">3</text>
  <text x="398" y="93" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">3</text>
  <text x="434" y="93" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">3</text>
  <text x="470" y="93" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">5</text>
  <text x="506" y="93" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">5</text>
  <text x="542" y="93" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">5</text>
  <text x="578" y="93" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">5</text>
  <text x="614" y="93" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">5</text>

  <path d="M130 116 L234 116" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M238 116 L270 116" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M274 116 L342 116" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M346 116 L450 116" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M454 116 L630 116" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M130 110 L130 122 M234 110 L234 122" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M346 110 L346 122 M450 110 L450 122" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="182" y="140" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">c = 3</text>
  <text x="254" y="140" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s = 1</text>
  <text x="308" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s = 2</text>
  <text x="398" y="140" text-anchor="middle" font-size="12" fill="#b06a10" filter="url(#rough2)">s = 3</text>
  <text x="542" y="140" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s = 5</text>

  <text x="60" y="185" font-size="13" fill="#223" filter="url(#rough2)">偶数长度</text>
  <text x="170" y="185" font-size="13" fill="#223" filter="url(#rough2)">even = 2^(n − B) = 2^(14 − 5) = 512</text>
  <text x="60" y="218" font-size="13" fill="#223" filter="url(#rough2)">奇数长度</text>
  <text x="170" y="218" font-size="13" fill="#223" filter="url(#rough2)">odd = 2^(c−1+P−B') · G = 2^(3−1+11−4) · 2 = 1024</text>
  <text x="60" y="251" font-size="13" fill="#b85450" filter="url(#rough2)">合计</text>
  <text x="170" y="251" font-size="13" fill="#b85450" filter="url(#rough2)">512 + 1024 = 1536，与官方输出一致 ✓</text>

  <rect x="55" y="272" width="650" height="96" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="300" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">n = 14，c = 3（−1 的个数），P = 11（正数个数），B = 5 个块</text>
  <text x="380" y="326" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">G = 2：只看正数块的相邻值，1→2 ✓、2→3 ✓、3→5 ✗（差 2 不算）</text>
  <text x="380" y="352" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">偶数长度：每块都取偶数个；奇数长度：必须从 −1 开头再配一个差 1 的对</text>

  <text x="380" y="402" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">答案 = 512 + 1024 = 1536，与样例第 4 组输出完全吻合</text>
</svg>
