<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fdfcf7"/>
  <text x="48" y="24" font-size="16" font-weight="bold" fill="#2b2b2b">核心观察：三段计数 (l, m, r) 决定配对结构与相遇时机</text>
  <path d="M 48 32 Q 360 38 632 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="48" y="52" font-size="12.5" font-weight="bold" fill="#2b2b2b">① 折叠配对 + 三段划分（n = 11, first = 2, second = 4）</text>

  <!-- fold arcs -->
  <g fill="none" filter="url(#sk)">
    <path d="M 74 100 Q 334 34 594 100" stroke="#4a8e4a" stroke-width="2"/>
    <path d="M 126 100 Q 334 48 542 100" stroke="#b85450" stroke-width="2"/>
    <path d="M 178 100 Q 334 62 490 100" stroke="#4a8e4a" stroke-width="2"/>
    <path d="M 230 100 Q 334 76 438 100" stroke="#b85450" stroke-width="2"/>
    <path d="M 282 100 Q 334 88 386 100" stroke="#4a8edb" stroke-width="2"/>
  </g>

  <!-- row of 11 players -->
  <g filter="url(#sk)">
    <rect x="48" y="100" width="52" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="100" y="100" width="52" height="30" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <rect x="152" y="100" width="52" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="204" y="100" width="52" height="30" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <rect x="256" y="100" width="52" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="308" y="100" width="52" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5,3"/>
    <rect x="360" y="100" width="52" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="412" y="100" width="52" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="464" y="100" width="52" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="516" y="100" width="52" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="568" y="100" width="52" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="74" y="120" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="126" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" font-family="monospace">2 ★</text>
  <text x="178" y="120" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace">3</text>
  <text x="230" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" font-family="monospace">4 ★</text>
  <text x="282" y="120" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">5</text>
  <text x="334" y="120" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">6</text>
  <text x="386" y="120" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">7</text>
  <text x="438" y="120" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">8</text>
  <text x="490" y="120" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">9</text>
  <text x="542" y="120" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">10</text>
  <text x="594" y="120" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">11</text>

  <!-- segment braces -->
  <g fill="none" stroke="#666" stroke-width="1.3" filter="url(#sk)">
    <path d="M 48 136 Q 74 148 100 136"/>
    <path d="M 100 136 Q 126 148 152 136"/>
    <path d="M 152 136 Q 178 148 204 136"/>
    <path d="M 204 136 Q 230 148 256 136"/>
    <path d="M 256 136 Q 438 152 620 136"/>
  </g>
  <text x="74" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">L · l=1</text>
  <text x="126" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">F ★</text>
  <text x="178" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">M · m=1</text>
  <text x="230" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">S ★</text>
  <text x="334" y="166" text-anchor="middle" font-size="10.5" fill="#888">（6 轮空）</text>
  <text x="438" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">R · r=7</text>
  <text x="48" y="186" font-size="10.5" fill="#666">弧色：红 = 含明星（必胜）· 绿 = 跨段（可分支）· 蓝 = 同段（定）；正中第 6 位轮空晋级</text>

  <!-- ② position formulas -->
  <g filter="url(#sk)">
    <rect x="48" y="200" width="300" height="104" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="60" y="222" font-size="13" font-weight="bold" fill="#2b6e9e">② 位置只由计数决定</text>
  <text x="60" y="246" font-size="12" fill="#444" font-family="monospace">T = l + m + r + 2</text>
  <text x="196" y="246" font-size="10.5" fill="#888">（总人数）</text>
  <text x="60" y="268" font-size="12" fill="#444" font-family="monospace">f = l + 1</text>
  <text x="196" y="268" font-size="10.5" fill="#888">（firstPlayer 位置）</text>
  <text x="60" y="290" font-size="12" fill="#444" font-family="monospace">s = l + m + 2</text>
  <text x="196" y="290" font-size="10.5" fill="#888">（secondPlayer 位置）</text>

  <!-- ③ meet condition -->
  <g filter="url(#sk)">
    <rect x="364" y="200" width="308" height="104" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="376" y="222" font-size="13" font-weight="bold" fill="#7a5415">③ 相遇判定：对称即相遇</text>
  <text x="518" y="248" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b03a3a" font-family="monospace">f + s = T + 1 ⟺ l = r</text>
  <text x="518" y="270" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">(l+1) + (l+m+2) = (l+m+r+2) + 1</text>
  <text x="518" y="292" text-anchor="middle" font-size="11" fill="#444">左右两段人数相等 ⇒ 折叠正好配到一起</text>

  <!-- ④ state -->
  <g filter="url(#sk)">
    <rect x="48" y="316" width="624" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="60" y="338" font-size="13" font-weight="bold" fill="#2e6e2e">④ 状态 = (l, m, r)：具体编号是冗余信息</text>
  <text x="60" y="362" font-size="11.5" fill="#444">状态数上界 C(29,3) = 3654 —— 三维数组直接记忆化，连哈希都不需要</text>
  <text x="60" y="386" font-size="11.5" fill="#444">最早相遇：尽快把 l 与 r 削到相等 · 最晚相遇：养人拖住对称时刻</text>

  <text x="340" y="440" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">配对、相遇、胜负贡献全部由三段计数决定 ⇒ 状态压缩无损</text>
  <text x="340" y="468" text-anchor="middle" font-size="10.5" fill="#888">例：n=11, first=2, second=4 ⇒ 初始 (l,m,r) = (1,1,7)，本回合 1↔11、3↔9 为跨段对决</text>
</svg>
