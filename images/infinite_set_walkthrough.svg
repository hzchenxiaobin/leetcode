<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="540" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：8 次操作下 cur 与 S 的联动</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="640" y="58" text-anchor="end" font-size="12" fill="#555" filter="url(#sk)">初始状态：cur = 1，S = ∅</text>

  <text x="115" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">操作</text>
  <text x="255" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">cur（前 → 后）</text>
  <text x="400" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">S（前 → 后）</text>
  <text x="545" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">返回</text>
  <path d="M 40 78 Q 350 82 660 78" stroke="#999" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="40" y="304" width="620" height="44" fill="#fff8e1"/></g>

  <path d="M 40 128 Q 350 130.5 660 128" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 40 172 Q 350 174.5 660 172" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 40 216 Q 350 218.5 660 216" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 40 260 Q 350 262.5 660 260" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 40 348 Q 350 350.5 660 348" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 40 392 Q 350 394.5 660 392" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 40 436 Q 350 438.5 660 436" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#sk)"/>

  <text x="115" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">addBack(2)</text>
  <text x="255" y="112" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1 → 1</text>
  <text x="400" y="112" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#sk)">{ } → { }</text>
  <text x="545" y="112" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#sk)">null</text>
  <text x="572" y="112" text-anchor="start" font-size="11.5" fill="#888" filter="url(#sk)">2 ≥ cur，无操作</text>

  <text x="115" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">popSmallest</text>
  <text x="255" y="156" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">1 → 2</text>
  <text x="400" y="156" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">{ }</text>
  <text x="545" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">1</text>

  <text x="115" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">popSmallest</text>
  <text x="255" y="200" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">2 → 3</text>
  <text x="400" y="200" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">{ }</text>
  <text x="545" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">2</text>

  <text x="115" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">popSmallest</text>
  <text x="255" y="244" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">3 → 4</text>
  <text x="400" y="244" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">{ }</text>
  <text x="545" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">3</text>

  <text x="115" y="288" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">addBack(1)</text>
  <text x="255" y="288" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">4 → 4</text>
  <text x="400" y="288" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">{ } → {1}</text>
  <text x="545" y="288" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#sk)">null</text>
  <text x="572" y="288" text-anchor="start" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">1 &lt; cur，入堆 ✓</text>

  <text x="115" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">popSmallest</text>
  <text x="255" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">4 → 4</text>
  <text x="400" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">{1} → { }</text>
  <text x="545" y="332" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">1</text>
  <text x="572" y="332" text-anchor="start" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">堆顶 1 &lt; cur，走堆分支！</text>

  <text x="115" y="376" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">popSmallest</text>
  <text x="255" y="376" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">4 → 5</text>
  <text x="400" y="376" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">{ }</text>
  <text x="545" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">4</text>

  <text x="115" y="420" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">popSmallest</text>
  <text x="255" y="420" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">5 → 6</text>
  <text x="400" y="420" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">{ }</text>
  <text x="545" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">5</text>

  <g filter="url(#sk)"><rect x="100" y="452" width="480" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="340" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">两路交替：堆空 → 吃尾（cur += 1）；堆非空 → 弹堆顶</text>
  <text x="340" y="502" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">8 步依次输出 1, 2, 3, 1, 4, 5，与示例一致 ✓</text>
</svg>
