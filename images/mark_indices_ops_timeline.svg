<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">每秒三选一：减 1 / 标记 / 发呆</text>

  <!-- 三个操作框 -->
  <rect x="20" y="46" width="150" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="68" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">任选下标 i</text>
  <text x="95" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[i] ← nums[i]−1</text>

  <rect x="184" y="46" width="156" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="262" y="68" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">标记 changeIndices[s]</text>
  <text x="262" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">仅当其值已等于 0</text>

  <rect x="352" y="46" width="148" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="68" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">什么都不做</text>
  <text x="426" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">（发呆/跳过）</text>

  <!-- 汇聚箭头 -->
  <path d="M95,102 C120,122 180,132 220,138" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M262,102 C262,120 262,128 262,138" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M426,102 C400,122 340,132 300,138" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 时间轴：示例 2 前 6 秒 changeIndices=[1,1,1,2,1,1] -->
  <text x="260" y="160" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2 前 6 秒：changeIndices = [1,1,1,2,1,1]</text>

  <rect x="64" y="172" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="122" y="172" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="180" y="172" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="238" y="172" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="296" y="172" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="354" y="172" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="90" y="196" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="148" y="196" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="206" y="196" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="264" y="196" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="322" y="196" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="380" y="196" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <text x="90" y="226" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒1</text>
  <text x="148" y="226" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒2</text>
  <text x="206" y="226" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒3</text>
  <text x="264" y="226" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">秒4</text>
  <text x="322" y="226" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒5</text>
  <text x="380" y="226" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒6</text>

  <text x="264" y="164" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">这一秒只能标记下标 2</text>

  <!-- 硬约束框 -->
  <rect x="36" y="246" width="448" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="268" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">标记下标 i 的双重硬约束：</text>
  <text x="52" y="288" font-size="12" fill="#333" filter="url(#rough2)">必须挑一秒 s 使 changeIndices[s] = i，且那一刻 nums[i] 已被减到 0</text>

  <!-- 结论框 -->
  <rect x="36" y="308" width="448" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="333" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⇒ 每个下标都有一份「候选标记秒」清单 = changeIndices 中值等于 i 的全部位置</text>
</svg>
