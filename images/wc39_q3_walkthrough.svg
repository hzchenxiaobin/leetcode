<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 0 … 6 的错排数</text>
  <text x="310" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每行用 D(n) = (n−1)·(D(n−1) + D(n−2)) 由上两行推出</text>

  <rect x="60" y="62" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">n</text>
  <text x="240" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">D(n)</text>
  <text x="440" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">递推验算</text>

  <rect x="60" y="96" width="500" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="240" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="310" y="116" font-size="10.5" fill="#777" filter="url(#rough2)">基数：空排列算 1 种</text>

  <rect x="60" y="130" width="500" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="150" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="240" y="150" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="310" y="150" font-size="10.5" fill="#777" filter="url(#rough2)">基数：唯一元素无处可去</text>

  <rect x="60" y="164" width="500" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="240" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="310" y="184" font-size="10.5" fill="#777" filter="url(#rough2)">1 · (0 + 1) = 1，只有 [2,1]</text>

  <rect x="60" y="198" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="218" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="240" y="218" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="310" y="218" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">2 · (1 + 0) = 2　←　官方示例</text>

  <rect x="60" y="232" width="500" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="252" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="240" y="252" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">9</text>
  <text x="310" y="252" font-size="10.5" fill="#777" filter="url(#rough2)">3 · (2 + 1) = 9</text>

  <rect x="60" y="266" width="500" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="240" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">44</text>
  <text x="310" y="286" font-size="10.5" fill="#777" filter="url(#rough2)">4 · (9 + 2) = 44</text>

  <rect x="60" y="300" width="500" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="320" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="240" y="320" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">265</text>
  <text x="310" y="320" font-size="10.5" fill="#777" filter="url(#rough2)">5 · (44 + 9) = 265</text>

  <text x="310" y="356" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">交叉验证（另一条递推）：D(n) = n · D(n−1) + (−1)ⁿ 给出同样的序列</text>
  <text x="310" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">序列 1, 0, 1, 2, 9, 44, 265 … 即 OEIS A000166</text>
</svg>
