<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：记忆化 DFS（每格只算一次）</text>

  <!-- start -->
  <rect x="120" y="44" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">dfs(i, j) 进入</text>
  <path d="M 210 78 L 210 96" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: memo hit? -->
  <polygon points="210,96 300,130 210,164 120,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="134" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold" filter="url(#rough2)">memo[i][j] 已算？</text>

  <!-- yes branch -->
  <path d="M 300 130 L 356 130" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="122" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="360" y="112" width="170" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="134" text-anchor="middle" font-size="11" fill="#2a5a1a" font-weight="bold" filter="url(#rough2)">O(1) 返回 memo[i][j]</text>

  <!-- no branch -->
  <path d="M 210 164 L 210 182" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="178" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- res = 1 -->
  <rect x="120" y="184" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="206" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">res = 1（自身单格路径）</text>
  <path d="M 210 218 L 210 236" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- enumerate neighbors -->
  <rect x="105" y="238" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="260" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">枚举四方向邻居 (ni, nj)</text>
  <path d="M 210 272 L 210 290" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: valid neighbor -->
  <polygon points="210,290 320,326 210,362 100,326" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="322" text-anchor="middle" font-size="10.5" fill="#a08030" font-weight="bold" filter="url(#rough2)">界内 且</text>
  <text x="210" y="338" text-anchor="middle" font-size="10.5" fill="#a08030" font-weight="bold" filter="url(#rough2)">grid[ni][nj] &gt; grid[i][j] ？</text>

  <!-- yes: recurse -->
  <path d="M 320 326 L 376 326" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="318" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="380" y="306" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">res += dfs(ni, nj)</text>
  <text x="460" y="339" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">（严格更大才递归！）</text>
  <path d="M 460 306 Q 460 256 318 252" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="446" y="278" font-size="9.5" fill="#b85450" filter="url(#rough2)">继续枚举下一个邻居</text>

  <!-- no: skip -->
  <path d="M 210 362 L 210 380" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="376" font-size="10.5" fill="#888" filter="url(#rough2)">否（含相等：跳过）</text>

  <!-- store memo -->
  <rect x="105" y="382" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="404" text-anchor="middle" font-size="11.5" fill="#2a5a1a" font-weight="bold" filter="url(#rough2)">memo[i][j] = res，返回</text>

  <!-- bottom note -->
  <rect x="48" y="432" width="464" height="28" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="451" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">主流程：ans = Σ dfs(i, j) 对所有格子求和，再对 10⁹+7 取模</text>
</svg>
