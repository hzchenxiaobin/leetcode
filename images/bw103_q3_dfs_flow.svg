<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：扫描 + flood fill 汇总</text>

  <!-- 扫描格子 -->
  <rect x="40" y="150" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="170" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">逐格扫描</text>
  <text x="100" y="186" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">(i, j) = 0..m−1, 0..n−1</text>

  <path d="M 160 172 L 195 172" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断 -->
  <polygon points="255,128 320,172 255,216 190,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="167" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">水格 且</text>
  <text x="255" y="183" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">未访问 ?</text>

  <path d="M 320 172 L 360 172" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="162" font-size="11" fill="#2f5527" filter="url(#rough2)">是</text>

  <!-- DFS -->
  <rect x="365" y="130" width="140" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="152" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">DFS(i, j)</text>
  <text x="435" y="170" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">标记 vis；累加 grid 值</text>
  <text x="435" y="186" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">向四邻扩展：</text>
  <text x="435" y="202" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">在界内 · 水格 · 未访问</text>

  <path d="M 435 214 L 435 240" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 更新答案 -->
  <rect x="340" y="244" width="190" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="264" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">best = max(best, 块和)</text>
  <text x="435" y="280" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">全陆地下 best 保持 0</text>

  <!-- 否分支 -->
  <path d="M 255 216 L 255 266 L 90 266 L 90 194" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)" fill="none"/>
  <text x="262" y="238" font-size="11" fill="#888" filter="url(#rough2)">否 → 跳过（陆地或已访问）</text>
  <path d="M 90 266 L 90 200" stroke="#999" stroke-width="1.6" marker-end="url(#arrB)" stroke-dasharray="5 4" filter="url(#rough2)" fill="none"/>

  <text x="40" y="76" font-size="13" fill="#333" filter="url(#rough2)">每个格子至多被访问一次：</text>
  <text x="40" y="98" font-size="12" fill="#555" filter="url(#rough2)">· 进入递归即打 vis 标记，防止重复入栈</text>
  <text x="40" y="118" font-size="12" fill="#555" filter="url(#rough2)">· 压栈时打标，而不是出栈时——否则同一格会被反复压入</text>
  <text x="40" y="306" font-size="12" fill="#7a5a10" filter="url(#rough2)">10×10 网格递归深度 ≤ 100，安全；大网格换 BFS 或显式栈。</text>
</svg>
