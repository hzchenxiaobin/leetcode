<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="470" fill="#fafafa"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算：s = "ababbc"，k = 2，d = 2 时的窗口走查</text>
  <text x="350" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每行是 right 来到该下标、并且收缩到「≤ 2 种」之后的窗口状态</text>

  <!-- 表头 -->
  <rect x="20" y="60" width="660" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#8a6a20" font-weight="bold">
    <text x="49" y="83">right</text>
    <text x="114" y="83">加入</text>
    <text x="253" y="83">窗口 [left, right]</text>
    <text x="392" y="83">distinct</text>
    <text x="461" y="83">good</text>
    <text x="587" y="83">判定与动作</text>
  </g>

  <!-- 第 4 行高亮 -->
  <rect x="20" y="272" width="660" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>

  <!-- 网格线 -->
  <g filter="url(#rough2)" stroke="#aaa" stroke-width="1.2">
    <path d="M 20 96 L 680 96" fill="none"/>
    <path d="M 20 140 L 680 140" fill="none"/>
    <path d="M 20 184 L 680 184" fill="none"/>
    <path d="M 20 228 L 680 228" fill="none"/>
    <path d="M 20 272 L 680 272" fill="none"/>
    <path d="M 20 316 L 680 316" fill="none"/>
    <path d="M 20 360 L 680 360" fill="none"/>
    <path d="M 78 60 L 78 360" fill="none"/>
    <path d="M 150 60 L 150 360" fill="none"/>
    <path d="M 356 60 L 356 360" fill="none"/>
    <path d="M 428 60 L 428 360" fill="none"/>
    <path d="M 494 60 L 494 360" fill="none"/>
  </g>
  <rect x="20" y="60" width="660" height="300" fill="none" stroke="#888" stroke-width="1.6" rx="6" filter="url(#rough2)"/>

  <!-- 数据行 -->
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <text x="49" y="123">0</text><text x="114" y="123">a</text>
    <text x="253" y="123">"a" [0,0]</text><text x="392" y="123">1</text><text x="461" y="123">0</text>
    <text x="587" y="123" fill="#8a6a20">种数不足 2，跳过</text>

    <text x="49" y="167">1</text><text x="114" y="167">b</text>
    <text x="253" y="167">"ab" [0,1]</text><text x="392" y="167">2</text><text x="461" y="167">0</text>
    <text x="587" y="167" fill="#8a6a20">good = 0 &lt; 2，跳过</text>

    <text x="49" y="211">2</text><text x="114" y="211">a</text>
    <text x="253" y="211">"aba" [0,2]</text><text x="392" y="211">2</text><text x="461" y="211">1</text>
    <text x="587" y="211" fill="#8a6a20">good = 1 &lt; 2，跳过</text>

    <text x="49" y="255">3</text><text x="114" y="255">b</text>
    <text x="253" y="255">"abab" [0,3]</text><text x="392" y="255">2</text><text x="461" y="255">2</text>
    <text x="587" y="255" fill="#4a7a3a">合法，ans = 4</text>

    <text x="49" y="299">4</text><text x="114" y="299">b</text>
    <text x="253" y="299">"ababb" [0,4]</text><text x="392" y="299">2</text><text x="461" y="299">2</text>
    <text x="587" y="299" fill="#2f4a26" font-weight="bold">合法，ans = 5 ★</text>

    <text x="49" y="343">5</text><text x="114" y="343">c</text>
    <text x="253" y="343" font-size="9.5">"abbc" [2,5]（收缩 2 次）</text><text x="392" y="343">2</text><text x="461" y="343">1</text>
    <text x="587" y="343" fill="#b85450">good = 1 &lt; 2，不变</text>
  </g>

  <text x="350" y="380" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">第 5 行：加入 c 后 distinct 变 3，left 连移两次（移出 a、b）才回到 2 种，此时窗口为 "abbc"</text>

  <!-- 三个 d 的汇总 -->
  <rect x="40" y="392" width="620" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="413" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">三个 d 汇总</text>
  <text x="140" y="413" font-size="10" fill="#444" filter="url(#rough2)">d = 1 → 2（"bb"）；d = 2 → 5（"ababb"）；d = 3 → 0（"c" 只出现 1 次）。取最大，答案 5。</text>
  <text x="56" y="437" font-size="10" fill="#555" filter="url(#rough2)">可见「最优窗口的种数」不一定是 1，必须把 d 逐个枚举，才能保证不漏掉 "ababb" 这种 2 种字符的答案。</text>
</svg>
