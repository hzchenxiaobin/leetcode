<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">贪心扫描流程：一个指针走到底</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">循环只判断「还有没有下一位」，末位 0 单独处理</text>

  <g filter="url(#rough2)">
    <rect x="80" y="64" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="8"/>
    <text x="170" y="87" text-anchor="middle" font-size="11.5" fill="#3a4a66">i = 0，n = len(bits)</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 170 100 L 170 126" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <polygon points="170,130 258,172 170,214 82,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="170" y="177" text-anchor="middle" font-size="12" fill="#8a5a10">i &lt; n-1 ?</text>

    <path d="M 258 172 L 296 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="277" y="164" text-anchor="middle" font-size="11" fill="#b85450">否</text>

    <rect x="302" y="150" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="392" y="178" text-anchor="middle" font-size="12" fill="#8a3030">return i == n - 1</text>

    <path d="M 170 214 L 170 236" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="182" y="230" font-size="11" fill="#4a7a3a">是</text>

    <polygon points="170,240 265,282 170,324 75,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="170" y="287" text-anchor="middle" font-size="12" fill="#8a5a10">bits[i] == 1 ?</text>

    <path d="M 75 282 L 44 282 L 44 348" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="58" y="274" text-anchor="middle" font-size="11" fill="#b85450">否</text>

    <path d="M 265 282 L 300 282 L 300 348" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="281" y="274" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>

    <rect x="26" y="352" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="96" y="378" text-anchor="middle" font-size="13" fill="#8a3030">i += 1</text>

    <rect x="234" y="352" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="304" y="378" text-anchor="middle" font-size="13" fill="#3a5a30">i += 2</text>

    <path d="M 96 392 L 96 404 L 304 404 L 304 392" stroke="#666" stroke-width="1.8" fill="none"/>
    <path d="M 304 404 L 520 404 L 520 82 L 266 82" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="392" y="398" text-anchor="middle" font-size="10.5" fill="#888">回到循环开头</text>
  </g>

  <text x="280" y="424" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">循环不变量：每轮开始时 i 恰好指向某个字符的起始比特</text>
</svg>
